<style>

.d-tb{fill:var(--text);font-family:var(--font);font-size:14px;font-weight:600}
.d-ts{fill:var(--muted);font-family:var(--font);font-size:11.5px}
.caption{font-size:.87em;color:var(--muted);text-align:center;margin-top:-4px}

details.acc .acc-body{padding:0 16px 12px 31px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--hl);color:#fff;font-size:12.5px;font-weight:600;flex:none}
.perso-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}

.perso-h small{display:block;color:var(--muted);font-weight:400;font-size:.85em}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 14px;font-size:.95em}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--border);margin:16px 0 0}
.tab{border:1px solid transparent;border-bottom:none;background:none;padding:7px 13px;cursor:pointer;border-radius:5px 5px 0 0;font-size:.92em;margin-bottom:-1px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--text);background:var(--hl-soft)}
.tab.active{background:var(--view);border-color:var(--border);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--hl)}
.tab-panel{background:var(--view);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;padding:18px}
.quiz{background:var(--view);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin:16px 0}
.tab-panel .quiz,.tab-panel .exo{border:none;padding:0;margin:0}
.quiz-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.quiz-h .t{font-weight:600;display:flex;align-items:center;gap:8px}
.quiz-h .n{font-size:.85em;color:var(--muted)}
.bar{height:5px;background:var(--alt);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar>div{height:100%;background:var(--hl);transition:width .25s}
.q-text{font-weight:500;margin:4px 0 10px}
.q-opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 12px;margin:6px 0;border:1px solid var(--border-strong);border-radius:5px;background:var(--view);cursor:pointer;line-height:1.45}
.q-opt:hover:not(:disabled){border-color:var(--hl);background:var(--hl-soft)}
.q-opt:disabled{cursor:default}
.q-opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.q-opt.correct{border-color:var(--pos);background:var(--pos-soft)}
.q-opt.correct .k{background:var(--pos);border-color:var(--pos);color:#fff}
.q-opt.wrong{border-color:var(--neg);background:var(--neg-soft)}
.q-opt.wrong .k{background:var(--neg);border-color:var(--neg);color:#fff}
.q-opt.dim{opacity:.6}
.score{font-size:1.15em;font-weight:600}
.exo{background:var(--view);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin:16px 0}
.exo-consigne{color:var(--muted);font-size:.95em;margin:0 0 10px}
.sel-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sel-row:last-of-type{border-bottom:none}
.sel-row .p{flex:1;min-width:220px}
.sel-row .mark{width:20px;text-align:center;font-weight:700}
select{padding:4px 8px;border:1px solid var(--border-strong);border-radius:4px;background:var(--view);max-width:100%;font-size:.93em}
select.ok{border-color:var(--pos);background:var(--pos-soft)}
select.ko{border-color:var(--neg);background:var(--neg-soft)}
.mark.ok{color:var(--pos)}.mark.ko{color:var(--neg)}
.cloze{line-height:2.3}
.cloze select{margin:0 2px}
.order-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border-strong);border-radius:5px;margin:6px 0;background:var(--view)}
.order-item.ok{border-color:var(--pos);background:var(--pos-soft)}
.order-item.ko{border-color:var(--neg);background:var(--neg-soft)}
.order-item .txt{flex:1}

.seg{margin:12px 0;padding-left:12px;border-left:4px solid}
.seg-label{display:inline-block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:1px 8px;border-radius:3px;color:#fff;margin-bottom:3px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}

.settings{position:absolute;top:50px;right:10px;z-index:150;width:290px;background:var(--view);border:1px solid var(--border-strong);border-radius:6px;box-shadow:var(--shadow);padding:14px 16px}
.settings h4{margin:0 0 8px;font-size:14px}

.seg-ctl button:last-child{border-right:none}
.seg-ctl button.on{background:var(--hl);color:#fff}
.cover{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.cover-mock{width:150px;flex:none;aspect-ratio:2/3.1;background:#fff;border:1px solid #c8c8c8;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:12px 9px;font-family:Georgia,serif;color:#222;position:relative;overflow:hidden}
.cover-mock .a{font-size:9.5px;letter-spacing:.04em;text-align:center}
.cover-mock .r{font-size:6.5px;text-align:center;margin-top:3px}

.cover-mock .s{position:absolute;right:8px;bottom:30px;font-size:6.5px;width:50%;text-align:right;line-height:1.3}
.cover-mock .e{position:absolute;right:8px;bottom:9px;font-size:8px;font-weight:700}
.overlay{display:none}
@media (max-width:880px){
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;top:48px;bottom:0;left:0;z-index:120;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .overlay.on{display:block;position:fixed;inset:48px 0 0 0;background:rgba(0,0,0,.25);z-index:110}
  .content{padding:20px 16px 80px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .timeline:before{left:72px}.timeline .date{width:60px;font-size:.8em}.timeline .dot{left:67px}
  .topbar .title span{display:none}
}
@media print{.topbar,.sidebar{display:none}.main{overflow:visible}}
</style>

 // Vocabulaire de l'œuvre

];
const GLOSS = {}; GL.forEach(([id,term,cat,def,ex])=>{ GLOSS[id] = {id,term,cat,def,ex}; });

function G({t,children}){
  const g = GLOSS[t];
  const [pos,setPos] = useState(null);
  const ref = useRef(null);
  const toggle = (e)=>{
    e.stopPropagation();
    if(pos){ setPos(null); return; }
    const r = ref.current.getBoundingClientRect();
    const w = Math.min(330, window.innerWidth-24);
    const left = Math.min(Math.max(12, r.left - 10), window.innerWidth - w - 12);
    const below = window.innerHeight - r.bottom;
    setPos(below < 240 ? {left,w,bottom: window.innerHeight - r.top + 6} : {left,w,top: r.bottom + 6});
  };
  useEffect(()=>{
    if(!pos) return;
    const close = ()=>setPos(null);
    const key = (e)=>{ if(e.key==="Escape") close(); };
    const m = document.querySelector(".main");
    document.addEventListener("click", close);
    document.addEventListener("keydown", key);
    window.addEventListener("resize", close);
    if(m) m.addEventListener("scroll", close);
    return ()=>{ document.removeEventListener("click", close); document.removeEventListener("keydown", key); window.removeEventListener("resize", close); if(m) m.removeEventListener("scroll", close); };
  },[pos]);
  if(!g) return <>{children}</>;
  return <>
    <button ref={ref} type="button" className="term" onClick={toggle} aria-expanded={!!pos}>{children || g.term}</button>
    {pos && ReactDOM.createPortal(
      <div className="pop" role="dialog" aria-label={"Définition : "+g.term} style={{left:pos.left,width:pos.w,top:pos.top ?? "auto",bottom:pos.bottom ?? "auto"}} onClick={e=>e.stopPropagation()}>
        <div className="pop-head"><strong>{g.term}</strong><span style={{display:"flex",gap:6,alignItems:"center"}}><span className={"badge "+g.cat}>{CATS[g.cat]}</span><button className="pop-close" aria-label="Fermer" onClick={()=>setPos(null)}>×</button></span></div>
        <p>{g.def}</p>
        <p className="ex"><em>Exemple :</em> {g.ex}</p>
      </div>, document.body)}
  </>;
}

/* ---------- Quiz (une question à la fois, rétroaction immédiate) ---------- */
function Quiz({id,title="Vérifie ta compréhension",questions}){
  const {record,results} = useContext(Progress);
  const [i,setI] = useState(0);
  const [sel,setSel] = useState(null);
  const [score,setScore] = useState(0);
  const [done,setDone] = useState(false);
  const q = questions[i];
  const letters = "ABCDE";
  const choose = (k)=>{ if(sel!==null) return; setSel(k); if(k===q.a) setScore(s=>s+1); };
  const next = ()=>{
    if(i+1 < questions.length){ setI(i+1); setSel(null); }
    else { setDone(true); record(id, score, questions.length); }
  };
  const restart = ()=>{ setI(0); setSel(null); setScore(0); setDone(false); };
  const best = results[id];
  if(done){
    const ratio = score/questions.length;
    return <div className="quiz">
      <div className="quiz-h"><div className="t"><Icon n="check"/>{title}</div></div>
      <p className="score">Score : {score} / {questions.length}</p>
      <Msg type={ratio>=.8?"pos":ratio>=.5?"info":"warn"}>
        {ratio>=.8 ? "Très bien ! Tu maîtrises cette partie." : ratio>=.5 ? "C'est un bon début. Relis les explications des questions ratées, puis recommence." : "Relis la section (et clique sur les mots soulignés), puis recommence le quiz."}
      </Msg>
      <div className="btn-row"><button className="btn" onClick={restart}><Icon n="refresh" s={15}/> Recommencer</button></div>
    </div>;
  }
  return <div className="quiz">

      let cls = "q-opt";

/* ---------- Exercice à listes déroulantes (association, classement, procédés) ---------- */
function shuffleFixed(arr, seed){ const a = arr.slice(); let s = seed||7; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function SelectExo({id,title,consigne,items,options}){
  const {record} = useContext(Progress);
  const [ans,setAns] = useState({});
  const [checked,setChecked] = useState(false);
  const [showSol,setShowSol] = useState(false);
  const optsFor = (it)=> it.options || options;
  const score = items.filter((it,k)=>ans[k]===it.a).length;
  const check = ()=>{ setChecked(true); record(id, score, items.length); };
  const reset = ()=>{ setAns({}); setChecked(false); setShowSol(false); };
  return <div className="exo">
    {title && <h3 style={{marginTop:0}}>{title}</h3>}
    <p className="exo-consigne">{consigne}</p>
    {items.map((it,k)=>{
      const ok = ans[k]===it.a;
      return <div className="sel-row" key={k}>
        <div className="p">{it.p}</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <select aria-label={"Réponse "+(k+1)} value={showSol ? it.a : (ans[k]||"")} disabled={showSol} className={checked ? (ok||showSol?"ok":"ko") : ""} onChange={e=>{ setAns({...ans,[k]:e.target.value}); setChecked(false); }}>
            <option value="">— choisir —</option>
            {optsFor(it).map(o=><option key={o} value={o}>{o}</option>)}
          </select>
          <span className={"mark "+(checked?(ok?"ok":"ko"):"")}>{checked ? (ok?"✓":"✗") : ""}</span>
        </div>
        {checked && !ok && it.e && <div style={{flexBasis:"100%",fontSize:".9em",color:"var(--muted)"}}>{showSol ? it.e : "Indice : " + (it.h || "relis la définition dans le glossaire.")}</div>}
      </div>;
    })}
    {checked && <p className="score" style={{marginTop:12}}>Score : {score} / {items.length}</p>}
    <div className="btn-row">
      <button className="btn primary" onClick={check} disabled={Object.keys(ans).length<items.length}>Vérifier</button>
      {checked && score<items.length && <button className="btn" onClick={()=>setShowSol(true)}>Afficher la correction</button>}
      <button className="btn" onClick={reset}><Icon n="refresh" s={15}/> Recommencer</button>
    </div>
  </div>;
}

/* ---------- Texte à trous ---------- */
function Cloze({id,title,consigne,parts}){
  const {record} = useContext(Progress);
  const blanks = parts.filter(p=>typeof p!=="string");
  const [ans,setAns] = useState({});
  const [checked,setChecked] = useState(false);
  let bi = -1;
  const score = blanks.filter((b,k)=>ans[k]===b.a).length;
  return <div className="exo">
    {title && <h3 style={{marginTop:0}}>{title}</h3>}
    <p className="exo-consigne">{consigne}</p>
    <p className="cloze">{parts.map((p,k)=>{
      if(typeof p==="string") return <Fragment key={k}>{p}</Fragment>;
      bi++; const idx = bi; const ok = ans[idx]===p.a;
      return <select key={k} aria-label={"Trou "+(idx+1)} value={ans[idx]||""} className={checked?(ok?"ok":"ko"):""} onChange={e=>{setAns({...ans,[idx]:e.target.value}); setChecked(false);}}>
        <option value="">……</option>{p.o.map(o=><option key={o} value={o}>{o}</option>)}
      </select>;
    })}</p>
    {checked && <p className="score">Score : {score} / {blanks.length}</p>}
    <div className="btn-row">
      <button className="btn primary" disabled={Object.keys(ans).length<blanks.length} onClick={()=>{setChecked(true); record(id,score,blanks.length);}}>Vérifier</button>
      <button className="btn" onClick={()=>{setAns({}); setChecked(false);}}><Icon n="refresh" s={15}/> Recommencer</button>
    </div>
  </div>;
}

/* ---------- Remise en ordre ---------- */
function Order({id,title,consigne,items,seed}){
  const {record} = useContext(Progress);
  const init = ()=>{ let s = shuffleFixed(items.map((_,k)=>k), seed); return s; };
  const [ord,setOrd] = useState(init);
  const [checked,setChecked] = useState(false);
  const move = (k,d)=>{ const o = ord.slice(); const j=k+d; if(j<0||j>=o.length) return; [o[k],o[j]]=[o[j],o[k]]; setOrd(o); setChecked(false); };
  const score = ord.filter((v,k)=>v===k).length;
  return <div className="exo">
    {title && <h3 style={{marginTop:0}}>{title}</h3>}
    <p className="exo-consigne">{consigne}</p>
    {ord.map((v,k)=><div key={v} className={"order-item"+(checked?(v===k?" ok":" ko"):"")}>
      <span className="step-num">{k+1}</span><span className="txt">{items[v]}</span>
      <button className="mini" aria-label="Monter" disabled={k===0} onClick={()=>move(k,-1)}><Icon n="up" s={15}/></button>
      <button className="mini" aria-label="Descendre" disabled={k===ord.length-1} onClick={()=>move(k,1)}><Icon n="down" s={15}/></button>
    </div>)}
    {checked && <p className="score">Éléments bien placés : {score} / {items.length}</p>}
    <div className="btn-row">
      <button className="btn primary" onClick={()=>{setChecked(true); record(id,score,items.length);}}>Vérifier</button>
      {checked && score<items.length && <button className="btn" onClick={()=>{setOrd(items.map((_,k)=>k)); setChecked(true);}}>Afficher la correction</button>}
      <button className="btn" onClick={()=>{setOrd(init()); setChecked(false);}}><Icon n="refresh" s={15}/> Recommencer</button>
    </div>
  </div>;
}

/* ---------- Questions ouvertes avec réponse modèle ---------- */

      </div>
    </details>

}

    <h2>Lire la couverture : le paratexte</h2>
    <p>Avant même de lire, le <G t="paratexte">paratexte</G> crée un <G t="horizon">horizon d'attente</G>. Observe chaque élément.</p>

        <div className="a">MOHAMED EL BACHIRI</div><div className="r">Propos recueillis par David Van Reybrouck</div>
        <div className="t">Un jihad<br/>de l'amour</div><div className="ph"/>
        <div className="s">L'appel bouleversant d'un musulman à la réconciliation</div><div className="e">JC Lattès</div>
      </div>

        <ul>

  return <>
    <Head crumb="L'œuvre" title="Contexte et genèse" obj="Replacer le livre dans les événements qui l'ont fait naître."/>
    <p>Le livre naît d'un <G t="attentat">attentat</G> et d'une parole publique devenue <G t="viralite">virale</G>. Suis la chronologie.</p>

    <h2>Molenbeek, une commune sous les projecteurs</h2>
    <p>Après les attentats de Paris puis de Bruxelles, <G t="molenbeek">Molenbeek</G> est présentée dans de nombreux médias comme un foyer du <G t="djihadisme">djihadisme</G>. Les habitants, en grande majorité étrangers à toute violence, se sentent victimes d'<G t="amalgame">amalgames</G> et de <G t="stigmatisation">stigmatisation</G>.</p>
    <Msg type="warn" title="Le paradoxe de Mohamed">Il est <strong>victime</strong> de l'attentat, puisqu'il a perdu sa femme. Pourtant, il explique qu'aux yeux d'une partie du monde, s'appeler Mohamed et venir de Molenbeek fait de lui un <strong>suspect</strong>, un « terroriste potentiel ». Tout le livre répond à ce paradoxe.</Msg>

    <h2>Pourquoi écrire ?</h2>
    <p>Mohamed explique qu'écrire a été pour lui une <strong>thérapie</strong> et un exutoire. C'était aussi un moyen de faire survivre le nom et la mémoire de Loubna. Le livre réunit des textes écrits après le drame et des propos recueillis environ un an plus tard par David Van Reybrouck.</p>

    <Keep items={["Le 22 mars 2016 : 32 morts à Bruxelles, dont Loubna Lafquiri, à Maelbeek.","Le livre prolonge un appel télévisé devenu viral (décembre 2016).","Écrire = soigner sa douleur + garder vivante la mémoire de Loubna + répondre aux préjugés."]}/>

      {q:"Quel événement est à l'origine directe du livre ?",o:["Un concours littéraire","Un appel télévisé au « jihad de l'amour », devenu viral","Une commande de l'école","Le procès de 2022"],a:1,e:"Le monologue de décembre 2016 a touché des millions de personnes. Le livre a suivi en 2017."}

  </>;
}

      {q:"Quel thème est central, et relié à tous les autres ?",o:["Le métro","Le refus de la haine","Le sport","La politique communale"],a:1,e:"Le refus de la haine relie le deuil, la foi, la fraternité, l'identité et la transmission."},
      {q:"« Être à la fois belge, marocain, musulman et molenbeekois sans avoir à choisir. » Cela illustre…",o:["la stigmatisation","l'identité plurielle","la vengeance","le littéralisme"],a:1,e:"Des appartenances multiples qui se combinent : c'est l'identité plurielle."}
    ]}/>
  </>;
}

function Ecriture(){
  return <>
    <Head crumb="Analyser" title="Analyse de l'écriture" obj="Mobiliser les outils d'analyse : genre, énonciation, registres, procédés, structure."/>
    <Tabs tabs={[
      {label:"1. Genre", content:<>
        <p>Le livre est un <G t="temoignage">témoignage</G> et un <G t="autobiographie">récit autobiographique</G> : l'auteur, le narrateur et le personnage principal sont la même personne. Le nom sur la couverture et le « je » du texte établissent le <G t="pacte">pacte autobiographique</G>.</p>
        <p>C'est aussi un <G t="plaidoyer">plaidoyer</G>, puisqu'il défend une cause, et un <G t="hommage">tombeau littéraire</G> pour Loubna.</p>
        <Msg type="info" title="Particularité">Ce sont des <G t="recueillis">propos recueillis</G> : une parole d'abord orale, mise en forme par un écrivain. Le style simple et presque oral vient de là.</Msg>
      </>},
      {label:"2. Énonciation", content:<>
        <p>Analyser l'<G t="enonciation">énonciation</G>, c'est se demander qui parle, à qui, et dans quel but. Le <G t="narrateur">narrateur</G> change de <G t="destinataire">destinataire</G> selon les textes.</p>
        <DiagEnonciation/>
      </>},
      {label:"3. Registres", content:<>
        <div className="grid2">
          <div className="card"><h3><G t="lyrique">Lyrique</G> et <G t="elegiaque">élégiaque</G></h3><p>L'amour pour Loubna, la douleur de l'absence : le « je » exprime ses émotions.</p></div>
          <div className="card"><h3><G t="argumentatif">Argumentatif</G></h3><p>Il explique pourquoi refuser la haine et ce que signifie « jihad ». Il cherche à <G t="convaincre">convaincre et à persuader</G>.</p></div>
          <div className="card"><h3>Narratif</h3><p>Le matin du 22 mars, l'enfance à Molenbeek, la rencontre avec Loubna : des faits racontés.</p></div>
          <div className="card"><h3>Spirituel</h3><p>Sa réflexion sur Dieu, le Coran et les autres religions.</p></div>
        </div>
      </>},
      {label:"4. Procédés", content:<>
        <ul>
          <li><strong>Le titre</strong> : il est perçu comme un <G t="oxymore">oxymore</G> ; c'est en fait une <G t="reappropriation">réappropriation</G>. Effet : surprendre, puis faire réfléchir.</li>
          <li><strong>La phrase d'identité</strong> : « Je suis Mohamed El Bachiri, belgo-marocain, musulman et molenbeekois ». Trois <G t="apposition">appositions énumérées</G> : chacune correspond à un préjugé que le texte va défaire.</li>
          <li><strong>L'<G t="apostrophe">apostrophe</G> à Loubna</strong> : il s'adresse à elle comme si elle était là. Effet : intimité, émotion.</li>
          <li><strong>L'<G t="antithese">antithèse</G> amour / haine</strong> : elle structure tout le livre.</li>
          <li><strong>Des images</strong> (<G t="metaphore">métaphores</G>) du feu et de l'étreinte. Dans son appel télévisé, il parlait d'un jihad qui cherche l'étreinte pour éteindre les flammes de la rancœur.</li>
          <li><strong>Des répétitions</strong> (<G t="anaphore">anaphores</G>) qui donnent un rythme de discours, comme dans un appel prononcé à voix haute.</li>
        </ul>
        <Msg type="pos" title="Activité">Trouve dans le livre un exemple de chaque procédé. Pour chacun, rédige la phrase : « L'auteur utilise [procédé] dans [citation] (p. …) pour [effet]. »</Msg>
      </>},
      {label:"5. Structure", content:<>
        <p>Le livre est fait de textes courts, chacun avec son titre : c'est une <G t="fragment">écriture fragmentaire</G>.</p>
        <div className="grid2">
          <div className="card"><h3 style={{color:"var(--pos)"}}>Effets positifs</h3><ul><li>Une lecture accessible, que l'on peut picorer</li><li>Une impression de confidence</li><li>Chaque texte comme une petite pensée à méditer</li></ul></div>
          <div className="card"><h3 style={{color:"var(--neg)"}}>Limites possibles</h3><ul><li>Pas de récit continu</li><li>Des idées qui reviennent ; certains lecteurs trouvent le livre répétitif</li></ul></div>
        </div>
      </>}
    ]}/>
    <Keep items={["Genre : témoignage autobiographique + plaidoyer + hommage.","Énonciation : un « je » qui s'adresse tour à tour à Loubna, aux jeunes, à tous.","Registres dominants : lyrique/élégiaque et argumentatif.","Procédés clés : titre-provocation, appositions, apostrophe, antithèse amour/haine."]}/>
    <Quiz id="q-ecriture" questions={[
      {q:"« Je suis Mohamed El Bachiri, belgo-marocain, musulman et molenbeekois. » Quel procédé reconnais-tu ?",o:["Une métaphore","Une énumération d'appositions","Une antithèse","Une anaphore"],a:1,e:"Trois groupes de mots, séparés par des virgules, caractérisent le nom : ce sont des appositions énumérées."},
      {q:"Quand Mohamed s'adresse directement à Loubna disparue, il utilise…",o:["une apostrophe","une hyperbole","un oxymore","une périphrase"],a:0,e:"S'adresser directement à quelqu'un, présent ou absent, en le nommant : c'est une apostrophe."},
      {q:"Quels registres dominent dans le livre ?",o:["Comique et satirique","Fantastique et merveilleux","Lyrique (élégiaque) et argumentatif","Épique et tragique"],a:2,e:"Il exprime ses émotions (lyrique, élégiaque) et cherche à convaincre (argumentatif)."},
      {q:"Qu'est-ce que le pacte autobiographique ?",o:["Un contrat d'édition","L'engagement que l'auteur, le narrateur et le personnage sont la même personne, et que le récit est vrai","Une promesse faite à Loubna","Un accord entre deux auteurs"],a:1,e:"Le lecteur sait qu'il lit un récit réel, raconté par la personne qui l'a vécu."}
    ]}/>
  </>;
}

function Aujourdhui(){
  return <>
    <Head crumb="Analyser" title="L'œuvre dans le contexte contemporain" obj="Relier le livre aux grands débats d'aujourd'hui et exercer ton esprit critique."/>
    <p>Pourquoi lire ce livre aujourd'hui, en Belgique ? Voici six angles d'analyse. Chacun propose une question à débattre.</p>

    <h2>1. La parole des victimes</h2>
    <p>Après les attentats de 2015-2016, des victimes et des proches prennent la parole publiquement. En France, Antoine Leiris publie <em>Vous n'aurez pas ma haine</em> ; en Belgique, Mohamed El Bachiri publie <em>Un jihad de l'amour</em>. Ces voix proposent une autre réponse que la peur : refuser de donner aux terroristes la division qu'ils cherchent. Lors du procès de 2022-2023, la parole des victimes et de leurs proches a de nouveau eu une place centrale.</p>
    <Msg type="info" title="À débattre">Une victime a-t-elle une responsabilité particulière quand elle parle en public ?</Msg>

    <h2>2. Stéréotypes, amalgames, islamophobie</h2>
    <p>Après des attentats, les <G t="amalgame">amalgames</G> entre islam et terrorisme se multiplient et l'<G t="islamophobie">islamophobie</G> peut augmenter. Le livre montre que des musulmans sont <strong>aussi</strong> victimes du terrorisme. Il défait l'opposition simpliste entre « eux » et « nous ».</p>
    <Msg type="info" title="À débattre">Est-il juste qu'une victime doive prouver qu'elle n'est « pas un terroriste » ?</Msg>

    <h2>3. Molenbeek et l'image des quartiers</h2>
    <p>Le livre donne un visage humain à une commune souvent réduite à une étiquette médiatique. Il parle depuis Molenbeek et s'adresse aux jeunes de Molenbeek. C'est une manière de reprendre le récit de son propre quartier.</p>
    <Msg type="info" title="À débattre">Comment les médias construisent-ils la réputation d'un lieu ?</Msg>

    <h2>4. Réseaux sociaux et viralité</h2>
    <p>Le message est d'abord une vidéo devenue <G t="viralite">virale</G>, vue par des millions de personnes. Les réseaux sociaux peuvent amplifier la haine, mais aussi des messages de paix. Une question se pose cependant : l'émotion d'une vidéo suffit-elle à changer durablement les mentalités ?</p>

    <h2>5. Regards critiques sur le message</h2>
    <div className="grid2">
      <div className="card"><h3 style={{color:"var(--pos)"}}>Forces</h3><ul><li>Un message universel, accessible, porté par une expérience réelle</li><li>Une réponse non violente qui prive les terroristes de leur but : diviser</li><li>Une vision de la foi compatible avec l'<G t="humanisme">humanisme</G></li></ul></div>
      <div className="card"><h3 style={{color:"var(--neg)"}}>Questions possibles</h3><ul><li>Risque d'<G t="injonction">injonction</G> au pardon : la colère des victimes est aussi légitime</li><li>Le « bon musulman » qui rassure peut renforcer l'idée que les musulmans doivent se justifier</li><li>Un message parfois répétitif ou idéaliste, selon certains lecteurs</li></ul></div>
    </div>
    <Msg type="warn">Formuler une critique, ce n'est pas rejeter le livre. C'est montrer que tu as réfléchi. Une bonne <G t="appreciation">appréciation</G> est nuancée.</Msg>

    <h2>6. Dix ans après : la réalité derrière le message</h2>
    <p>En mars 2026, dix ans après l'attentat, Mohamed témoigne d'une détresse toujours présente. Il a élevé seul ses trois fils, aujourd'hui âgés de 19, 17 et 12 ans. Il dénonce un service d'aide qui a refusé d'accompagner ses enfants, au motif qu'ils n'étaient pas des <G t="victimeindirecte">victimes directes</G>. L'adaptation théâtrale montrait déjà l'homme blessé derrière le héros public.</p>
    <Msg type="info" title="À débattre">Ces informations rendent-elles le message du livre plus faible ou plus fort ? Comment la société doit-elle accompagner les victimes indirectes ?</Msg>

    <Keep items={["Le livre s'inscrit dans la parole des victimes après 2015-2016.","Il combat les amalgames et l'image stigmatisée de Molenbeek.","Une lecture critique peut interroger l'injonction au pardon et la place du « bon musulman ».","En 2026, la réalité du deuil et l'abandon des victimes indirectes nuancent le message, sans l'annuler."]}/>
    <Quiz id="q-aujourdhui" questions={[
      {q:"Qu'est-ce qu'un amalgame ?",o:["Un mélange de métaux","Une confusion injuste entre des personnes ou des choses différentes","Une figure de style","Une forme de prière"],a:1,e:"Confondre tous les musulmans avec les terroristes, par exemple."},
      {q:"Que dénonce Mohamed El Bachiri en 2026 ?",o:["La fermeture du métro","Le refus d'aider ses fils, jugés « victimes indirectes »","L'interdiction de son livre","La démolition de la place Loubna Lafquiri"],a:1,e:"Un service d'aide a refusé d'accompagner ses fils au motif qu'ils n'étaient pas des victimes directes."},
      {q:"Que désigne l'« injonction au pardon » ?",o:["Une décision de justice","La pression qui pousse toutes les victimes à pardonner, alors que leur colère peut être légitime","Une prière musulmane","Un article de loi belge"],a:1,e:"Admirer le choix de Mohamed ne doit pas conduire à l'imposer à toutes les victimes."}
    ]}/>
  </>;
}

    ["Vous n'aurez pas ma haine","Antoine Leiris, 2016 (récit)","Un mari qui a perdu sa femme au Bataclan, et qui refuse lui aussi la haine.","Comparer deux réponses non violentes. Différence : Mohamed doit en plus se défendre d'être suspect."],
    ["Djihad","Ismaël Saïdi, 2014 (théâtre belge)","Trois jeunes Bruxellois partent en Syrie : une comédie grinçante sur la radicalisation, beaucoup jouée devant des classes.","L'autre face du mot « jihad » : le départ et la manipulation."],
    ["Le Jeune Ahmed","Jean-Pierre et Luc Dardenne, 2019 (film belge)","Un adolescent belge se radicalise et projette de tuer son enseignante.","Comprendre la radicalisation, à laquelle Mohamed oppose l'amour."],
    ["Les Identités meurtrières","Amin Maalouf, 1998 (essai)","Réduire quelqu'un à une seule appartenance peut mener à la violence.","Le cadre théorique de l'identité plurielle."],
    ["Lettre à un otage","Antoine de Saint-Exupéry, 1943","Contient l'idée que celui qui diffère de nous, loin de nous léser, nous enrichit.","Une source humaniste du refus de la peur de l'autre."],
    ["Een jihad van liefde (théâtre)","Rataplan, Anvers, 2019","Mohamed et Loubna sur scène ; Loubna apparaît comme une présence-fantôme. L'attentat est suggéré très sobrement.","Comparer le livre et son adaptation : que montre le théâtre que le livre ne dit pas ?"]
  ];
  return <>
    <Head crumb="Analyser" title="Œuvres en écho" obj="Préparer la mise en perspective de ton récit d'expérience (critère référentiel)."/>
    <p>Une <G t="perspective">mise en perspective</G> consiste à relier l'œuvre à d'autres œuvres. Choisis-en <strong>une</strong> que tu connais ou que tu peux découvrir.</p>
    {W.map((w,k)=><div className="card" key={k}><h3 style={{marginTop:0}}><em>{w[0]}</em> <span style={{fontWeight:400,color:"var(--muted)",fontSize:".9em"}}>— {w[1]}</span></h3><p>{w[2]}</p><p style={{fontSize:".93em"}}><Icon n="link" s={14}/> <strong>Lien possible :</strong> {w[3]}</p></div>)}
    <Keep items={["Une seule comparaison bien développée vaut mieux que cinq titres cités.","Compare : le thème, la forme, l'effet produit sur toi."]}/>
    <Quiz id="q-echos" questions={[
      {q:"Quelle œuvre est la plus proche d'Un jihad de l'amour par sa situation de départ ?",o:["Le Jeune Ahmed","Vous n'aurez pas ma haine","Les Identités meurtrières","Djihad"],a:1,e:"Dans les deux cas, un mari endeuillé par un attentat refuse la haine."},
      {q:"Quelle œuvre aide à penser l'identité plurielle ?",o:["Les Identités meurtrières d'Amin Maalouf","Lettre à un otage","Djihad","Le Jeune Ahmed"],a:0,e:"Maalouf montre le danger de réduire une personne à une seule appartenance."}

function Recit(){
  const SEG = [
    ["Circonstances","var(--muted)","J'ai lu Un jihad de l'amour en octobre, pour le cours de français. Je l'ai lu en trois soirs, dans ma chambre, en relisant parfois certaines pages à voix basse."],
    ["Attentes","var(--violet)","Quand j'ai vu le titre, j'ai été mal à l'aise : pour moi, le mot « jihad » était lié aux attentats. La photo de cet homme qui regarde de côté me semblait presque méfiante. Je m'attendais à un livre dur sur le terrorisme."],
    ["Moments marquants","var(--hl-strong)","Ce qui m'a frappée d'abord, c'est un détail : Mohamed comprend que sa femme est morte parce que son téléphone ne se connecte plus depuis 9 h 10. Ce détail banal m'a serré la gorge. Plus loin, quand ses fils lui demandent si le terroriste est aussi leur frère et qu'il répond que oui, un frère en humanité, j'ai dû poser le livre."],
    ["Appréciation (éthique)","var(--pos)","Je trouve son refus de la haine admirable. Pourtant, il m'a aussi dérangée : peut-on demander à toutes les victimes de pardonner ? Je pense que la colère est légitime elle aussi."],
    ["Appréciation (esthétique)","var(--pos)","Les textes sont courts et écrits simplement, comme si Mohamed me parlait. La lecture est donc facile, mais certaines idées reviennent souvent, ce qui m'a parfois lassée."],
    ["Appréciation (cognitive)","var(--pos)","J'ai appris que « jihad » signifie d'abord « effort ». Je ne regarderai plus ce mot de la même façon."],
    ["Mise en perspective","var(--warn)","Ce livre m'a fait penser à Vous n'aurez pas ma haine d'Antoine Leiris. Les deux hommes refusent la haine, mais Mohamed doit en plus se défendre d'être suspect parce qu'il s'appelle Mohamed et vit à Molenbeek. Un article de 2026 m'a appris que, dix ans après, il se sent abandonné : cela rend son message encore plus fort, mais aussi plus fragile."],
    ["Bilan","var(--neg)","Cette lecture a changé mon regard sur un mot et sur une commune. Je la conseillerais aux élèves de mon âge, surtout à ceux qui croient connaître Molenbeek sans y être jamais allés."]
  ];
  const FIELDS = [
    ["Les circonstances","Où, quand, comment as-tu lu ? En combien de temps ?","J'ai lu ce livre…"],
    ["Tes attentes avant la lecture","Qu'imaginais-tu à partir du titre et de la couverture ? (Reprends tes notes de la fiche d'identité.)","Avant de lire, je pensais que… / Le titre m'a…"],
    ["Deux moments marquants","Quel passage ? Quelle émotion précise ? Pourquoi ?","J'ai été (bouleversé·e, surpris·e…) par le passage où… parce que…"],
    ["Ton appréciation argumentée","Utilise au moins deux critères : cognitif, éthique, esthétique.","D'un point de vue éthique, … / Le style… / J'ai appris que…"],
    ["La mise en perspective","Une autre œuvre, l'actualité, ta propre vie.","Ce livre fait écho à… car… / Contrairement à…"],
    ["Ton bilan","Qu'est-ce que cette lecture a changé chez toi ? À qui la conseillerais-tu ?","Aujourd'hui, je… / Je conseillerais ce livre à…"]
  ];
  const [plan,setPlan] = useState(()=>store.get("plan",{}));
  const [copied,setCopied] = useState("");
  const upd=(k,v)=>{ const n={...plan,[k]:v}; setPlan(n); store.set("plan",n); };
  const copy = ()=>{
    const t = FIELDS.map((f,k)=>`${k+1}. ${f[0]}\n${plan[k]||""}`).join("\n\n");
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>setCopied("Plan copié : tu peux le coller dans ton traitement de texte.")).catch(()=>setCopied("La copie a été refusée par le navigateur : sélectionne le texte à la main.")); }
    else setCopied("La copie n'est pas disponible ici : sélectionne le texte à la main.");
  };
  return <>
    <Head crumb="Produire" title="Le récit d'expérience culturelle (UAA 6)" obj="Raconter ta rencontre avec le livre et formuler une appréciation argumentée."/>
    <Msg type="info" title="De quoi s'agit-il ?">Le <G t="recitexp">récit d'expérience culturelle</G> correspond à l'<G t="uaa">UAA</G> 6, « relater des expériences culturelles ». Tu ne résumes pas le livre : tu racontes <strong>ce que toi, tu as vécu</strong> en le lisant, et tu formules une <G t="appreciation">appréciation</G> argumentée. Vérifie la consigne exacte et la grille de ton professeur : elles peuvent varier selon le réseau.</Msg>

    <h2>Étape 1 : la méthode en 6 parties</h2>
    <div className="grid2">
      {FIELDS.map((f,k)=><div className="card" key={k}><h3><span className="step-num">{k+1}</span> {f[0]}</h3><p style={{fontSize:".93em"}}>{f[1]}</p></div>)}
    </div>
    <h3>Les quatre critères d'appréciation</h3>
    <div className="grid2">
      <div className="card"><h3 style={{color:"var(--hl-strong)"}}>Cognitif</h3><p>Ce que j'ai appris ou compris.</p></div>
      <div className="card"><h3 style={{color:"var(--pos)"}}>Éthique</h3><p>Les valeurs, la morale : suis-je d'accord ?</p></div>
      <div className="card"><h3 style={{color:"var(--violet)"}}>Esthétique</h3><p>La forme, le style, la structure : est-ce beau, efficace ?</p></div>
      <div className="card"><h3 style={{color:"var(--warn)"}}>Référentiel</h3><p>Les liens avec d'autres œuvres ou avec la réalité.</p></div>
    </div>
    <h3>Des mots précis pour dire tes émotions</h3>
    <div className="chips">{["bouleversé·e","ébranlé·e","ému·e","mal à l'aise","admiratif·ve","sceptique","perplexe","révolté·e","apaisé·e","dérangé·e","touché·e","agacé·e","surpris·e","reconnaissant·e"].map(w=><span key={w} className="chip" style={{cursor:"default"}}>{w}</span>)}</div>
    <p style={{fontSize:".93em"}}>Relie tes idées avec des <G t="connecteur">connecteurs logiques</G> : car, en effet, pourtant, cependant, c'est pourquoi, contrairement à…</p>

    <h2>Étape 2 : un exemple annoté</h2>
    <p>Voici un récit d'expérience rédigé pour l'exemple, avec la fonction de chaque partie indiquée en couleur.</p>
    <div className="example-text">{SEG.map((s,k)=><div className="seg" key={k} style={{borderColor:s[1]}}><span className="seg-label" style={{background:s[1]}}>{s[0]}</span><div>{s[2]}</div></div>)}</div>
    <Msg type="pos" title="Ce qui fonctionne dans cet exemple">Le « je » est présent partout. Les émotions sont précises. L'avis est nuancé (« pourtant »). Trois critères sont utilisés, il y a un lien avec une autre œuvre et un fait d'actualité, et un bilan personnel.</Msg>

    <h2>Étape 3 : prépare ton plan</h2>
    <p>Complète chaque partie avec tes propres idées. Les amorces de phrases t'aident à démarrer.</p>
    {FIELDS.map((f,k)=><div className="exo" key={k}>
      <h3 style={{marginTop:0}}><span className="step-num">{k+1}</span> {f[0]}</h3>
      <p className="exo-consigne">{f[1]}</p>
      <textarea aria-label={f[0]} placeholder={f[2]} value={plan[k]||""} onChange={e=>upd(k,e.target.value)}/>
    </div>)}
    <div className="btn-row"><button className="btn primary" onClick={copy}><Icon n="copy" s={15}/> Copier mon plan</button></div>
    {copied && <Msg type="info">{copied}</Msg>}
    <p style={{fontSize:".88em",color:"var(--muted)"}}>Ton plan est gardé dans ce navigateur seulement. Pense à le copier.</p>

    <h2>Étape 4 : vérifie ton texte</h2>
    <Checklist id="uaa6" items={[
      "J'écris au « je » et je raconte MA lecture, pas seulement l'histoire.",
      "Je décris mes attentes avant la lecture.",
      "Je nomme au moins deux émotions précises et j'explique pourquoi.",
      "Je m'appuie sur au moins un passage précis du livre (avec la page).",
      "J'utilise au moins deux critères d'appréciation.",
      "Mon avis est nuancé (j'utilise « mais », « pourtant », « cependant »).",
      "Je fais au moins un lien avec une autre œuvre ou avec l'actualité.",
      "Je parle des personnes réelles avec respect.",
      "Je termine par un bilan personnel.",
      "J'ai relu : orthographe, accords, ponctuation, connecteurs."
    ]}/>
    <Msg type="warn" title="Pièges fréquents"><ul style={{margin:0}}><li>Résumer le livre au lieu de raconter ton expérience.</li><li>« C'est triste », « c'est bien » : sans justification, ce n'est pas une appréciation.</li><li>Faire des généralités sur une religion ou une population : reste sur le texte et sur ce que tu as vécu.</li></ul></Msg>

    <Quiz id="q-uaa6" questions={[

    ]}/>
  </>;
}

function Glossaire(){
  const [q,setQ] = useState("");
  const [cat,setCat] = useState("all");
  const norm = s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const list = GL.map(g=>GLOSS[g[0]]).filter(g=>(cat==="all"||g.cat===cat) && (!q || norm(g.term+" "+g.def).includes(norm(q)))).sort((a,b)=>norm(a.term).localeCompare(norm(b.term)));
  let last = "";
  return <>
    <Head crumb="Outils" title="Glossaire" obj="Retrouver la définition simple et un exemple pour chaque mot ou notion."/>
    <input type="search" placeholder="Rechercher un mot…" value={q} onChange={e=>setQ(e.target.value)} aria-label="Rechercher dans le glossaire"/>
    <div className="chips">
      <button className={"chip"+(cat==="all"?" on":"")} onClick={()=>setCat("all")}>Tout ({GL.length})</button>
      {Object.entries(CATS).map(([k,v])=><button key={k} className={"chip"+(cat===k?" on":"")} onClick={()=>setCat(k)}>{v} ({GL.filter(g=>g[2]===k).length})</button>)}
    </div>
    {list.length===0 && <p style={{color:"var(--muted)"}}>Aucun résultat.</p>}
    {list.map(g=>{ const L = norm(g.term)[0].toUpperCase(); const show = L!==last; last = L;
      return <Fragment key={g.id}>{show && <div className="letter">{L}</div>}
        <div className="gl-card"><h3>{g.term}<span className={"badge "+g.cat}>{CATS[g.cat]}</span></h3><p>{g.def}</p><p className="ex"><em>Exemple :</em> {g.ex}</p></div>
      </Fragment>; })}
  </>;
}

        <h4>Confort de lecture</h4>
        <div className="set-row"><label>Taille du texte</label><div className="seg-ctl">{[15,16,18,20].map(v=><button key={v} className={set.fs===v?"on":""} onClick={()=>setSet({...set,fs:v})}>{v===15?"A-":v===16?"A":v===18?"A+":"A++"}</button>)}</div></div>
        <div className="set-row"><label>Interligne</label><div className="seg-ctl">{[[1.5,"Serré"],[1.65,"Normal"],[1.9,"Aéré"]].map(([v,l])=><button key={v} className={set.lh===v?"on":""} onClick={()=>setSet({...set,lh:v})}>{l}</button>)}</div></div>
        <div className="set-row"><label>Police</label><div className="seg-ctl"><button className={set.font==="noto"?"on":""} onClick={()=>setSet({...set,font:"noto"})}>Noto Sans</button><button className={set.font==="lexend"?"on":""} onClick={()=>setSet({...set,font:"lexend"})} style={{fontFamily:"Lexend"}}>Lexend</button></div></div>
        <div className="btn-row"><button className="btn" onClick={()=>setShowSet(false)}>Fermer</button></div>
      </div>}
      <div className="body">
        <div className={"overlay"+(nav?" on":"")} onClick={()=>setNav(false)}/>
        <nav className={"sidebar"+(nav?" open":"")} aria-label="Sections">
          {SECTIONS.map(s=>{ const head = s.group!==lastGroup; lastGroup = s.group;
            return <Fragment key={s.id}>{head && <div className="nav-group">{s.group}</div>}
              <button className={"nav-item"+(cur===s.id?" active":"")} aria-current={cur===s.id?"page":undefined} onClick={()=>go(s.id)}>
                <Icon n={s.icon}/>{s.label}{s.q && results[s.q] && <span className="done" title="Quiz terminé">✓</span>}
              </button></Fragment>; })}
        </nav>
        <main className="main" ref={mainRef}>
          <div className="content">
            <S.C go={go}/>
            <div className="btn-row" style={{justifyContent:"space-between",marginTop:40,paddingTop:16,borderTop:"1px solid var(--border)"}}>
              {idx>0 ? <button className="btn" onClick={()=>go(SECTIONS[idx-1].id)}><Icon n="arrowL" s={15}/> {SECTIONS[idx-1].label}</button> : <span/>}
              {idx<SECTIONS.length-1 && <button className="btn primary" onClick={()=>go(SECTIONS[idx+1].id)}>{SECTIONS[idx+1].label} <Icon n="arrowR" s={15}/></button>}
            </div>
          </div>
        </main>
      </div>
    </div>
  </Progress.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
