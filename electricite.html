<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Électricité 3e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@400;600&display=swap">
<style>
/* Layout : fenêtre d'application KDE — barre d'outils en haut, barre latérale de navigation (façon Configuration du système), vue de contenu sur fond « view » */
:root{
  --window:#eff0f1; --view:#ffffff; --button:#fcfcfc; --alt:#f6f7f7;
  --fg:#232629; --muted:#5f666c; --border:#c3c7cb; --border-soft:#e0e3e5;
  --accent:#3daee9; --accent-ink:#1b7cb3; --accent-soft:#dcf0fb;
  --u:#2459b0; --u-soft:#e2eaf8; --u-2:#7d9fd9;
  --i:#c4303d; --i-soft:#f9e2e4;
  --r:#1b7a45; --r-soft:#dff2e6;
  --ln-a:#1b8f4d; --ln-b:#c2318a;
  --ok:#1b7a45; --ok-soft:#e3f4e9; --bad:#c4303d; --bad-soft:#fae4e6; --warn:#9a5600; --warn-soft:#fdf1e1;
  --shadow:0 1px 2px rgba(35,38,41,.07);
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,"DejaVu Sans Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --window:#2a2e32; --view:#1b1e20; --button:#31363b; --alt:#22262a;
    --fg:#fcfcfc; --muted:#a9b0b6; --border:#4b5056; --border-soft:#363b40;
    --accent:#3daee9; --accent-ink:#62c1f0; --accent-soft:#1c3747;
    --u:#86b3ff; --u-soft:#1e2c45; --u-2:#4f73b0;
    --i:#ff7f8a; --i-soft:#45232a;
    --r:#62d394; --r-soft:#1b3829;
    --ln-a:#62d394; --ln-b:#f27cc4;
    --ok:#62d394; --ok-soft:#1b3829; --bad:#ff7f8a; --bad-soft:#45232a; --warn:#f5ac57; --warn-soft:#40301b;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --window:#2a2e32; --view:#1b1e20; --button:#31363b; --alt:#22262a;
  --fg:#fcfcfc; --muted:#a9b0b6; --border:#4b5056; --border-soft:#363b40;
  --accent:#3daee9; --accent-ink:#62c1f0; --accent-soft:#1c3747;
  --u:#86b3ff; --u-soft:#1e2c45; --u-2:#4f73b0;
  --i:#ff7f8a; --i-soft:#45232a;
  --r:#62d394; --r-soft:#1b3829;
  --ln-a:#62d394; --ln-b:#f27cc4;
  --ok:#62d394; --ok-soft:#1b3829; --bad:#ff7f8a; --bad-soft:#45232a; --warn:#f5ac57; --warn-soft:#40301b;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--window);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.55rem;font-weight:600}
h2{font-size:1.18rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
sub{font-size:.72em;line-height:0}
strong{font-weight:600}
.v-u{color:var(--u);font-weight:600}
.v-i{color:var(--i);font-weight:600}
.v-r{color:var(--r);font-weight:600}

/* Barre d'outils */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--window);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.app-ico{width:26px;height:26px;flex:none}
.app-name{font-weight:600;font-size:1rem}
.app-sub{color:var(--muted);font-size:.85rem}
.tb-spacer{flex:1}
.meter{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-track{width:110px;height:6px;border-radius:3px;background:var(--border-soft);overflow:hidden}
.meter-fill{height:100%;background:var(--accent)}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 50px)}
.sidebar{border-right:1px solid var(--border);background:var(--window);padding:12px 8px 24px}
.sidebar nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:3px;padding:5px 8px;cursor:pointer;font-size:.9rem;line-height:1.3}
.nav-item:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.nav-item[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.nav-num{flex:none;width:20px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.nav-label{flex:1;min-width:0}
.nav-badge{flex:none;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-badge.done{color:var(--ok);font-weight:600}
.mobile-nav{display:none}

.main{background:var(--view);min-width:0}
.content{max-width:800px;margin:0 auto;padding-block:28px 64px;padding-inline:28px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.page-head{display:flex;flex-direction:column;gap:6px}
.lead{color:var(--muted);max-width:65ch}
section{display:flex;flex-direction:column;gap:12px}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:10px}

/* Encadré « l'essentiel » */
.essentiel{border:1px solid var(--border);border-radius:4px;background:var(--alt);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.essentiel .tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.formula{font-size:1.65rem;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.formula-sm{font-size:1.15rem;font-weight:600}
.note{font-size:.9rem;color:var(--muted)}

/* Message type KMessageWidget */
.msg{border:1px solid;border-radius:4px;padding:9px 12px;font-size:.93rem;display:flex;gap:8px;align-items:flex-start}
.msg.ok{border-color:var(--ok);background:var(--ok-soft)}
.msg.bad{border-color:var(--bad);background:var(--bad-soft)}
.msg.warn{border-color:var(--warn);background:var(--warn-soft)}
.msg.info{border-color:var(--accent);background:var(--accent-soft)}
.msg-ico{flex:none;width:18px;height:18px;margin-top:2px}

/* Boutons et champs Breeze */
.btn{background:var(--button);border:1px solid var(--border);border-radius:3px;padding:5px 12px;cursor:pointer;box-shadow:var(--shadow);line-height:1.4;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn:active{background:var(--accent-soft)}
.btn.primary{border-color:var(--accent);background:var(--accent-soft)}
.btn.sm{padding:3px 9px;font-size:.85rem}
.btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{background:var(--view);border:1px solid var(--border);border-radius:3px;padding:5px 8px;min-width:0}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input.num{width:9em;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden;background:var(--button);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:.9rem;border-right:1px solid var(--border-soft)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}

/* Zone de manipulation */
.explore{border:1px solid var(--border);border-radius:4px;background:var(--view);display:flex;flex-direction:column}
.explore-head{padding:10px 14px;border-bottom:1px solid var(--border-soft);background:var(--alt);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border-radius:4px 4px 0 0}
.explore-head h3{font-size:.95rem}
.explore-head span{font-size:.88rem;color:var(--muted)}
.fig{overflow-x:auto;padding:12px 10px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:470px;height:auto;display:block}
.fig-cap{font-size:.86rem;color:var(--muted);padding:0 14px 12px;text-align:center}
.controls{border-top:1px solid var(--border-soft);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.ctrl{display:flex;flex-direction:column;gap:4px}
.ctrl label{font-size:.9rem}
.ctrl-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.ctrl-row .ctrl{flex:1 1 200px;min-width:0}
.readouts{display:flex;flex-wrap:wrap;gap:8px}
.ro{border:1px solid var(--border-soft);border-radius:3px;padding:6px 12px;min-width:110px;background:var(--alt)}
.ro .k{font-size:.8rem;color:var(--muted)}
.ro .v{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.observe{font-size:.92rem}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-line{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;font-size:.85rem}
.bar{height:22px;border-radius:2px;background:var(--border-soft);display:flex;overflow:hidden}
.seg-u1{background:var(--u)}
.seg-u2{background:var(--u-2)}
.seg-ug{background:var(--u);opacity:.55}
.seg-i1{background:var(--i)}
.seg-i2{background:color-mix(in srgb,var(--i) 55%,var(--view))}
.seg-ig{background:var(--i);opacity:.55}
.bar span{transition:width .25s}
.eq{font-variant-numeric:tabular-nums;font-size:1rem;font-weight:500}

/* SVG */
.wire{fill:none;stroke:var(--fg);stroke-width:1.6}
.sym{fill:var(--view);stroke:var(--fg);stroke-width:1.6}
.sym-line{fill:none;stroke:var(--fg);stroke-width:1.4}
.sym-t{fill:var(--fg);font-size:13px;font-weight:600;text-anchor:middle;font-family:var(--font)}
.pole{fill:var(--fg);font-size:14px;font-weight:600;font-family:var(--font)}
.dot{fill:var(--fg)}
.lbl{font-size:12.5px;font-family:var(--font);fill:var(--fg);font-weight:600}
.lbl.u{fill:var(--u)} .lbl.i{fill:var(--i)} .lbl.r{fill:var(--r)} .lbl.m{fill:var(--muted);font-weight:500}
.arr-i{fill:var(--i)}
.faded{opacity:.3}
.flow{fill:none;stroke:var(--i);stroke-width:3;stroke-dasharray:3 13;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.g-grid{stroke:var(--border-soft);stroke-width:1}
.g-grid.major{stroke:var(--border)}
.g-axis{stroke:var(--fg);stroke-width:1.4;fill:none}
.g-txt{fill:var(--muted);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}
.g-title{fill:var(--fg);font-size:12px;font-family:var(--font);font-weight:600}
.g-line-a{stroke:var(--ln-a);stroke-width:2.4;fill:none}
.g-line-b{stroke:var(--ln-b);stroke-width:2.4;fill:none}
.g-lbl-a{fill:var(--ln-a);font-weight:700;font-size:13px;font-family:var(--font)}
.g-lbl-b{fill:var(--ln-b);font-weight:700;font-size:13px;font-family:var(--font)}
.g-guide{stroke:var(--fg);stroke-width:1;stroke-dasharray:4 3;fill:none}
.g-pt{fill:var(--fg)}
.tri-txt{font-size:26px;font-weight:700;font-family:var(--font);text-anchor:middle;cursor:pointer}
.tri-hit{fill:transparent;cursor:pointer}
.tri-hit:hover + text, .tri-hit:focus + text{text-decoration:underline}

/* Tableaux */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
th{background:var(--alt);font-weight:600;font-size:.84rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.cell-ok .field{border-color:var(--ok);background:var(--ok-soft)}
td.cell-bad .field{border-color:var(--bad);background:var(--bad-soft)}

/* Questions à choix */
.choice{display:flex;flex-direction:column;gap:10px}
.choice .q{font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.opt{text-align:left;background:var(--button);border:1px solid var(--border);border-radius:3px;padding:7px 11px;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 50%,var(--button))}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.check-box{border:1px solid var(--border);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.check-box .tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Exemple résolu */
.worked{border:1px solid var(--accent);border-radius:4px;overflow:hidden}
.worked-head{background:var(--accent-soft);padding:9px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center}
.worked-head .tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.worked-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border:1px solid var(--border-soft);border-radius:3px}
.steps li{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:12px;padding:8px 12px;border-bottom:1px solid var(--border-soft)}
.steps li:last-child{border-bottom:0}
.steps .sk{font-size:.84rem;color:var(--muted);font-weight:600;padding-top:1px}
.steps li.new{animation:appear .3s ease}
@keyframes appear{from{background:var(--accent-soft)}to{background:transparent}}
.steps .pending{color:var(--muted);font-style:italic}

/* Exercices */
.level-h{display:flex;align-items:baseline;gap:10px;padding-top:4px;border-bottom:1px solid var(--border-soft);padding-bottom:4px}
.level-h span{font-size:.86rem;color:var(--muted)}
.ex{border:1px solid var(--border);border-radius:4px;background:var(--view)}
.ex.solved{border-color:color-mix(in srgb,var(--ok) 60%,var(--border))}
.ex-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border-soft);background:var(--alt);border-radius:4px 4px 0 0}
.ex-id{font-weight:700;font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;border:1px solid var(--border);border-radius:10px;padding:1px 8px;color:var(--muted);background:var(--view)}
.chip.l1{border-color:var(--accent)}
.chip.l3{border-color:var(--warn);color:var(--warn)}
.chip.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.ex-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.guide{font-size:.9rem;border-left:0;background:var(--alt);border:1px dashed var(--border);border-radius:3px;padding:6px 10px}
.answer-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.unit{font-weight:600;min-width:1.5em}
.panel{border:1px solid var(--border-soft);border-radius:3px;padding:10px 12px;background:var(--alt);font-size:.94rem;display:flex;flex-direction:column;gap:6px}
.panel .steps{background:var(--view)}

/* Cartes mémo */
.flash{perspective:1200px;cursor:pointer;min-height:220px}
.flash-inner{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:4px;background:var(--view);padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.flash-face.back{transform:rotateY(180deg);background:var(--alt);border-color:var(--accent)}
.flash-face .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.flash-face .t{font-size:1.2rem;font-weight:500;max-width:34ch}
@media (prefers-reduced-motion: reduce){
  .flow{animation:none}
  .flash-inner{transition:none}
  .bar span{transition:none}
  .steps li.new{animation:none}
}

/* Accueil */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.path-step{border:1px solid var(--border);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--view)}
.path-step .n{font-size:.78rem;color:var(--accent-ink);font-weight:700;letter-spacing:.04em}
.path-step p{font-size:.9rem;color:var(--muted);flex:1}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.memo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.memo-card{border:1px solid var(--border);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.memo-card .when{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border-soft);padding-top:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.score{font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:6px;align-items:center;font-size:.85rem}

@media (max-width: 820px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-nav{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--window)}
  .mobile-nav select{flex:1;min-width:0}
  .content{padding-inline:16px;padding-block:20px 48px}
  .path,.memo-grid{grid-template-columns:1fr}
  .steps li{grid-template-columns:1fr;gap:2px}
  .app-sub{display:none}
  .meter-track{width:70px}
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect } = React;
const html = htm.bind(React.createElement);

/* ---------- Outils ---------- */
const STORE_KEY = 'elec3e-progression-v1';
function loadProgress(){
  try { const s = localStorage.getItem(STORE_KEY); if (s) { const p = JSON.parse(s); return { visited:p.visited||{}, solved:p.solved||{}, quizBest:p.quizBest??null }; } } catch(e){}
  return { visited:{}, solved:{}, quizBest:null };
}
function saveProgress(p){ try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch(e){} }
const nf = (n, d=3) => Number(n).toLocaleString('fr-FR', { maximumFractionDigits:d });
function parseNum(s){
  const c = String(s).trim().replace(/[a-zA-ZΩµ]+$/,'').replace(/\s/g,'').replace(',', '.');
  if (c === '' || !/^[-+]?\d*\.?\d+$/.test(c)) return NaN;
  return Number(c);
}
const close = (a,b) => Math.abs(a-b) <= Math.max(1e-9, Math.abs(b)*0.01);
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function fmt(s){
  return String(s)
    .replace(/\$([UIR])(?:_([A-Za-z0-9]+))?\$/g, (m,v,sub) => {
      const c = v==='U' ? 'v-u' : v==='I' ? 'v-i' : 'v-r';
      return `<span class="${c}">${v}${sub ? '<sub>'+sub+'</sub>' : ''}</span>`;
    })
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
const T = ({ s }) => html`<span dangerouslySetInnerHTML=${{ __html: fmt(s) }}></span>`;
const P = ({ s, className }) => html`<p className=${className} dangerouslySetInnerHTML=${{ __html: fmt(s) }}></p>`;

/* ---------- Symboles de circuit (SVG) ---------- */
function Sym({ x, y, kind, faded }){
  const cls = faded ? 'faded' : '';
  if (kind==='lamp') return html`<g className=${cls}><circle cx=${x} cy=${y} r="13" className="sym"/><path d=${`M${x-9.2} ${y-9.2}L${x+9.2} ${y+9.2}M${x+9.2} ${y-9.2}L${x-9.2} ${y+9.2}`} className="sym-line"/></g>`;
  if (kind==='res') return html`<rect x=${x-18} y=${y-7} width="36" height="14" className="sym"/>`;
  if (kind==='resV') return html`<rect x=${x-7} y=${y-18} width="14" height="36" className="sym"/>`;
  const letter = { amp:'A', volt:'V', motor:'M', gen:'G' }[kind];
  const r = kind==='gen' ? 17 : 13;
  return html`<g className=${cls}><circle cx=${x} cy=${y} r=${r} className="sym"/><text x=${x} y=${y+4.5} className="sym-t">${letter}</text></g>`;
}
function Arrow({ x, y, dir, cls='arr-i' }){
  const p = {
    right:`${x+5},${y} ${x-4},${y-5} ${x-4},${y+5}`,
    left:`${x-5},${y} ${x+4},${y-5} ${x+4},${y+5}`,
    down:`${x},${y+5} ${x-5},${y-4} ${x+5},${y-4}`,
    up:`${x},${y-5} ${x-5},${y+4} ${x+5},${y+4}`
  }[dir];
  return html`<polygon points=${p} className=${cls}/>`;
}
function Lbl({ x, y, anchor='middle', v, sub, val, cls='' }){
  const rest = val!=null ? ' = '+val : '';
  return html`<text x=${x} y=${y} textAnchor=${anchor} className=${'lbl '+cls}>${v}${sub ? html`<tspan dy="4" fontSize="9.5">${sub}</tspan><tspan dy="-4">${rest}</tspan>` : rest}</text>`;
}

/* Circuit en série : générateur en haut, deux dipôles en bas */
function SeriesCircuit({ parts=['lamp','lamp'], names=['L₁','L₂'], I=null, U=null }){
  const xa=155, xb=265;
  return html`<svg viewBox="0 0 420 210" role="img" aria-label="Schéma d’un circuit en série">
    <path d="M80 50H340V170H80Z" className="wire"/>
    <${Sym} x=${210} y=${50} kind="gen"/>
    <text x="186" y="44" textAnchor="end" className="pole">+</text>
    <text x="234" y="44" className="pole">−</text>
    <${Sym} x=${xa} y=${170} kind=${parts[0]}/>
    <${Sym} x=${xb} y=${170} kind=${parts[1]}/>
    <text x=${xa} y="200" textAnchor="middle" className="lbl m">${names[0]}</text>
    <text x=${xb} y="200" textAnchor="middle" className="lbl m">${names[1]}</text>
    ${I && I[0] && html`<g><${Arrow} x=${80} y=${110} dir="down"/><${Lbl} x=${72} y=${114} anchor="end" v="I" sub=${I[0].sub} val=${I[0].val} cls="i"/></g>`}
    ${I && I[1] && html`<g><${Arrow} x=${210} y=${170} dir="right"/><${Lbl} x=${210} y=${200} v="I" sub=${I[1].sub} val=${I[1].val} cls="i"/></g>`}
    ${I && I[2] && html`<g><${Arrow} x=${340} y=${110} dir="up"/><${Lbl} x=${348} y=${114} anchor="start" v="I" sub=${I[2].sub} val=${I[2].val} cls="i"/></g>`}
    ${U && U.g && html`<${Lbl} x=${210} y=${22} v="U" sub=${U.g.sub} val=${U.g.val} cls="u"/>`}
    ${U && U.a && html`<${Lbl} x=${xa} y=${146} v="U" sub=${U.a.sub} val=${U.a.val} cls="u"/>`}
    ${U && U.b && html`<${Lbl} x=${xb} y=${146} v="U" sub=${U.b.sub} val=${U.b.val} cls="u"/>`}
  </svg>`;
}

/* Circuit en dérivation : générateur à gauche, deux branches dérivées */
function ParallelCircuit({ I=null, open=[false,false], names=['L₁','L₂'], parts=['lamp','lamp'] }){
  const bx=[220,360];
  const branch = (x,k) => open[k]
    ? html`<g><path d=${`M${x} 40V138M${x} 158V180`} className="wire"/><path d=${`M${x} 158L${x+13} 140`} className="wire"/><circle cx=${x} cy="158" r="2.4" className="dot"/></g>`
    : html`<path d=${`M${x} 40V180`} className="wire"/>`;
  return html`<svg viewBox="0 0 460 215" role="img" aria-label="Schéma d’un circuit en dérivation">
    <path d="M70 40H360M70 180H360M70 40V180" className="wire"/>
    ${branch(bx[0],0)}${branch(bx[1],1)}
    <circle cx="220" cy="40" r="3" className="dot"/><circle cx="220" cy="180" r="3" className="dot"/>
    <${Sym} x=${70} y=${110} kind="gen"/>
    <text x="54" y="90" textAnchor="end" className="pole">+</text>
    <text x="54" y="140" textAnchor="end" className="pole">−</text>
    <${Sym} x=${bx[0]} y=${105} kind=${parts[0]} faded=${open[0]}/>
    <${Sym} x=${bx[1]} y=${105} kind=${parts[1]} faded=${open[1]}/>
    <text x=${bx[0]+20} y="110" className="lbl m">${names[0]}</text>
    <text x=${bx[1]+20} y="110" className="lbl m">${names[1]}</text>
    ${I && I[0] && html`<g><${Arrow} x=${140} y=${40} dir="right"/><${Lbl} x=${140} y=${28} v="I" sub=${I[0].sub} val=${I[0].val} cls="i"/></g>`}
    ${I && I[1] && html`<g><${Arrow} x=${bx[0]} y=${66} dir="down"/><${Lbl} x=${bx[0]+10} y=${70} anchor="start" v="I" sub=${I[1].sub} val=${I[1].val} cls="i"/></g>`}
    ${I && I[2] && html`<g><${Arrow} x=${bx[1]} y=${66} dir="down"/><${Lbl} x=${bx[1]+10} y=${70} anchor="start" v="I" sub=${I[2].sub} val=${I[2].val} cls="i"/></g>`}
  </svg>`;
}

/* Circuit de la loi d'Ohm : générateur, résistor, ampèremètre, voltmètre aux bornes du résistor */

  return html`<svg viewBox="0 0 430 215" role="img" aria-label="Schéma : résistor, ampèremètre en série, voltmètre en dérivation">

    <${Sym} x=${210} y=${80} kind="res"/>
    <${Sym} x=${210} y=${40} kind="volt"/>
    <${Sym} x=${340} y=${135} kind="amp"/>
    <${Arrow} x=${120} y=${80} dir="right"/>

}

/* Graphique caractéristique U = f(I) */
function Graph({ lines, imax, umax, istep, ustep, ilabel, ulabel, point }){
  const W=380, H=250, ml=46, mr=22, mt=18, mb=40;
  const pw=W-ml-mr, ph=H-mt-mb;
  const sx = i => ml + i/imax*pw;
  const sy = u => mt + ph - u/umax*ph;
  const grid=[];
  for (let i=0;i<=imax+1e-9;i+=istep){ const maj = Math.abs(i/ilabel - Math.round(i/ilabel))<1e-9; grid.push(html`<line key=${'gi'+i} x1=${sx(i)} x2=${sx(i)} y1=${mt} y2=${mt+ph} className=${'g-grid'+(maj?' major':'')}/>`); if(maj) grid.push(html`<text key=${'ti'+i} x=${sx(i)} y=${mt+ph+16} textAnchor="middle" className="g-txt">${nf(i)}</text>`); }
  for (let u=0;u<=umax+1e-9;u+=ustep){ const maj = Math.abs(u/ulabel - Math.round(u/ulabel))<1e-9; grid.push(html`<line key=${'gu'+u} x1=${ml} x2=${ml+pw} y1=${sy(u)} y2=${sy(u)} className=${'g-grid'+(maj?' major':'')}/>`); if(maj) grid.push(html`<text key=${'tu'+u} x=${ml-7} y=${sy(u)+4} textAnchor="end" className="g-txt">${nf(u)}</text>`); }
  return html`<svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Caractéristique tension-intensité">
    ${grid}
    <path d=${`M${ml} ${mt-6}V${mt+ph}H${ml+pw+8}`} className="g-axis"/>
    <text x=${ml+4} y=${mt-6} className="g-title">U (V)</text>
    <text x=${ml+pw} y=${mt+ph+33} textAnchor="end" className="g-title">I (mA)</text>
    ${lines.map((L,k) => {
      const iEnd = Math.min(imax, umax*1000/L.R), uEnd = L.R*iEnd/1000;
      const iL = iEnd*0.72, uL = L.R*iL/1000;
      return html`<g key=${'l'+k}><line x1=${sx(0)} y1=${sy(0)} x2=${sx(iEnd)} y2=${sy(uEnd)} className=${'g-line-'+L.c}/>
        <text x=${sx(iL)-8} y=${sy(uL)-6} textAnchor="end" className=${'g-lbl-'+L.c}>${L.name}</text></g>`;
    })}
    ${point && html`<g><path d=${`M${sx(0)} ${sy(point.u)}H${sx(point.i)}V${sy(0)}`} className="g-guide"/><circle cx=${sx(point.i)} cy=${sy(point.u)} r="4" className="g-pt"/></g>`}
  </svg>`;
}

function Figure({ f }){
  if (!f) return null;
  let el = null;
  if (f.type==='series') el = html`<${SeriesCircuit} ...${f}/>`;
  else if (f.type==='parallel') el = html`<${ParallelCircuit} ...${f}/>`;
  else if (f.type==='ohm') el = html`<${OhmCircuit} ...${f}/>`;
  else if (f.type==='graph') el = html`<${Graph} ...${f}/>`;
  return html`<div className="fig" style=${{ padding:'4px 0' }}>${el}</div>`;
}

function pageTitle(id){
  if (id==='home') return 'Accueil';
  const n = NOTIONS.find(x=>x.id===id); if (n) return n.num+'. '+n.title;
  const f = FAMILIES.find(x=>x.id===id); if (f) return f.letter+' · '+f.title;
  const m = MEMO.find(x=>x.id===id); return m ? m.title : '';
}

/* ---------- Composants génériques ---------- */
function Seg({ value, options, onChange, label }){
  return html`<div className="seg" role="group" aria-label=${label}>
    ${options.map(o => html`<button key=${o.v} aria-pressed=${value===o.v} onClick=${()=>onChange(o.v)}>${o.l}</button>`)}
  </div>`;
}
function Choice({ q, options, correct, explain, tag='Vérifie ta compréhension' }){
  const [p, setP] = useState(null);
  return html`<div className="check-box">
    <span className="tag">${tag}</span>
    <${P} className="q" s=${q}/>
    <div className="opts">
      ${options.map((o,i) => {
        let st=''; if (p!==null){ st = i===correct ? 'ok' : (i===p ? 'bad' : 'dim'); }
        return html`<button key=${i} className=${'opt '+st} disabled=${p!==null} onClick=${()=>setP(i)}><${T} s=${o}/></button>`;
      })}
    </div>
    ${p!==null && html`<${Msg} kind=${p===correct?'ok':'bad'}><strong>${p===correct?'Juste. ':'Pas tout à fait. '}</strong><${T} s=${explain}/><//>`}
    ${p!==null && p!==correct && html`<div><button className="btn sm" onClick=${()=>setP(null)}>Réessayer</button></div>`}
  </div>`;
}
function Essentiel({ children }){
  return html`<div className="essentiel"><span className="tag">L’essentiel</span>${children}</div>`;
}
function Pager({ page, go }){
  const i = ORDER.indexOf(page);
  const prev = ORDER[i-1], next = ORDER[i+1];
  return html`<div className="pager">
    ${prev ? html`<button className="btn" onClick=${()=>go(prev)}>← ${pageTitle(prev)}</button>` : html`<span></span>`}
    ${next && html`<button className="btn primary" onClick=${()=>go(next)}>${pageTitle(next)} →</button>`}
  </div>`;
}

function OhmTriangle(){
  const [hide, setHide] = useState('I');
  const res = { U:'$U$ = $R$ × $I$', I:'$I$ = $U$ ÷ $R$', R:'$R$ = $U$ ÷ $I$' }[hide];
  const L = (k, x, y, cls) => html`<g><rect x=${x-26} y=${y-26} width="52" height="40" className="tri-hit" tabIndex="0" role="button" aria-label=${'Chercher '+k}
      onClick=${()=>setHide(k)} onKeyDown=${e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setHide(k);} }}/>
    <text x=${x} y=${y} className=${'tri-txt '+cls} style=${{ opacity: hide===k ? .18 : 1 }}>${k}</text></g>`;
  return html`<div className="explore">
    <div className="explore-head"><h3>Le triangle de la loi d’Ohm</h3><span>Touche la grandeur que tu cherches : elle se cache, le reste donne le calcul.</span></div>
    <div className="ctrl-row" style=${{padding:'12px 14px', alignItems:'center'}}>
      <svg viewBox="0 0 200 160" style=${{width:'200px', maxWidth:'100%', flex:'none'}} role="img" aria-label="Triangle U, R, I">
        <path d="M100 10L190 150H10Z" fill="var(--alt)" stroke="var(--fg)" strokeWidth="1.6"/>

        ${L('U',100,78,'v-u')}${L('R',70,135,'v-r')}${L('I',130,135,'v-i')}

      <div className="ctrl" style=${{gap:'8px'}}>
        <p className="formula-sm"><${T} s=${res}/></p>
        <p className="note">Côte à côte : on multiplie. L’un au-dessus de l’autre : on divise.</p>
        <${Seg} label="Grandeur cherchée" value=${hide} onChange=${setHide} options=${[{v:'U',l:'Je cherche U'},{v:'I',l:'Je cherche I'},{v:'R',l:'Je cherche R'}]}/>

    </div>
  </div>`;
}

  'res-R': { law:'Loi d’Ohm', f:'$R$ = $U$ ÷ $I$' },
};
function LawChooser(){
  const [c, setC] = useState('serie');

  const r = CHOOSER[c+'-'+gg];
  return html`<div className="explore">

}

/* ---------- Exercice ---------- */
const LEVELS = { 1:'Guidé', 2:'Autonome', 3:'Défi' };
function Exercise({ ex, solved, onSolved }){
  const [val, setVal] = useState('');
  const [fb, setFb] = useState(null);
  const [tries, setTries] = useState(0);
  const [panel, setPanel] = useState(null);
  const [pick, setPick] = useState(null);
  const isChoice = ex.type==='choice';
  function check(){
    const x = parseNum(val);
    if (isNaN(x)) { setFb({ kind:'warn', msg:'Écris un nombre, par exemple 0,25 (la virgule est acceptée).' }); return; }
    if (close(x, ex.answer)) { setFb({ kind:'ok', msg:'Juste ! Compare ta rédaction avec la correction détaillée.' }); onSolved(ex.id); return; }
    const t = tries+1; setTries(t);
    let msg;
    if (close(x, ex.answer*1000) || close(x, ex.answer/1000)) msg = 'Presque : ta valeur semble exprimée dans une autre unité. Vérifie les conversions (× ou ÷ 1 000).';
    else if (t >= 2) msg = 'Pas encore. Ouvre l’indice, ou la correction simple pour comparer.';
    else msg = 'Pas encore. Relis les données et vérifie la loi utilisée.';
    setFb({ kind:'bad', msg });
  }
  function choose(i){
    setPick(i);
    if (i===ex.correct){ setFb({ kind:'ok', msg:'Juste !' }); onSolved(ex.id); }
    else { setTries(tries+1); setFb({ kind:'bad', msg:'Pas tout à fait. Réfléchis encore ou ouvre l’indice.' }); }
  }
  const tog = k => setPanel(panel===k ? null : k);
  const inputId = 'in-'+ex.id;
  return html`<article className=${'ex'+(solved?' solved':'')} id=${'ex-'+ex.id}>
    <div className="ex-head">
      <span className="ex-id">${ex.id}</span>
      <span className=${'chip l'+ex.level}>Niveau ${ex.level} · ${LEVELS[ex.level]}</span>
      ${solved && html`<span className="chip ok">Réussi</span>`}
    </div>
    <div className="ex-body">
      <${P} s=${ex.q}/>
      <${Figure} f=${ex.fig}/>
      ${ex.guide && html`<div className="guide">Formule utile : <${T} s=${ex.guide}/></div>`}
      ${isChoice
        ? html`<div className="opts">${ex.options.map((o,i)=>{ let st=''; if(pick!==null){ if(i===pick) st = i===ex.correct?'ok':'bad'; }
            return html`<button key=${i} className=${'opt '+st} onClick=${()=>choose(i)}><${T} s=${o}/></button>`; })}</div>`
        : html`<div className="answer-row">
            <label htmlFor=${inputId} className="note">Ta réponse</label>
            <input id=${inputId} className="field num" inputMode="decimal" autoComplete="off" value=${val}
              onChange=${e=>{ setVal(e.target.value); if (fb && fb.kind!=='ok') setFb(null); }}
              onKeyDown=${e=>{ if(e.key==='Enter') check(); }}/>
            <span className="unit">${ex.unit}</span>
            <button className="btn primary" onClick=${check}>Vérifier</button>
          </div>`}
      ${fb && html`<${Msg} kind=${fb.kind}>${fb.msg}<//>`}
      <div className="btn-row">
        <button className="btn sm" aria-expanded=${panel==='hint'} onClick=${()=>tog('hint')}>Indice</button>
        <button className="btn sm" aria-expanded=${panel==='simple'} onClick=${()=>tog('simple')}>Correction simple</button>
        <button className="btn sm" aria-expanded=${panel==='detail'} onClick=${()=>tog('detail')}>Correction détaillée</button>
      </div>
      ${panel==='hint' && html`<div className="panel"><strong>Indice</strong><${P} s=${ex.hint}/></div>`}
      ${panel==='simple' && html`<div className="panel"><strong>Correction simple</strong><${P} s=${ex.simple}/></div>`}
      ${panel==='detail' && html`<div className="panel"><strong>Correction détaillée</strong>
        <ol className="steps">${ex.detail.map((s,i)=>html`<li key=${i}><span className="sk">${s.k}</span><span><${T} s=${s.t}/></span></li>`)}</ol></div>`}
    </div>
  </article>`;
}

/* ---------- Mémoriser ---------- */
function Flashcards(){
  const [queue, setQueue] = useState(()=>shuffle(FLASH.map((_,i)=>i)));
  const [flip, setFlip] = useState(false);
  const [known, setKnown] = useState(0);
  const [again, setAgain] = useState(0);
  const cur = queue[0];
  function answer(ok){
    setFlip(false);
    if (ok){ setKnown(known+1); setQueue(queue.slice(1)); }
    else { setAgain(again+1); setQueue([...queue.slice(1), cur]); }
  }
  function reset(){ setQueue(shuffle(FLASH.map((_,i)=>i))); setKnown(0); setAgain(0); setFlip(false); }
  return html`
    <div className="page-head"><span className="eyebrow">Mémoriser</span><h1>Cartes mémo</h1>
      <p className="lead">Lis la question et réponds dans ta tête avant de retourner la carte. Les cartes « à revoir » reviennent à la fin du paquet. Refais le paquet sur plusieurs jours.</p></div>
    <div className="quiz-top"><span>${known} carte${known>1?'s':''} sue${known>1?'s':''} sur ${FLASH.length}</span><span>${queue.length} restante${queue.length>1?'s':''}</span></div>
    ${cur!==undefined ? html`
      <div className=${'flash'+(flip?' flipped':'')} onClick=${()=>setFlip(!flip)} role="button" tabIndex="0" aria-label="Retourner la carte"
        onKeyDown=${e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setFlip(!flip);} }}>
        <div className="flash-inner">
          <div className="flash-face" aria-hidden=${flip}><span className="k">Question</span><div className="t"><${T} s=${FLASH[cur][0]}/></div><span className="note">Touche la carte pour la retourner</span></div>
          <div className="flash-face back" aria-hidden=${!flip}><span className="k">Réponse</span><div className="t"><${T} s=${FLASH[cur][1]}/></div></div>
        </div>
      </div>
      <div className="btn-row">
        ${!flip ? html`<button className="btn primary" onClick=${()=>setFlip(true)}>Voir la réponse</button>`
          : html`<button className="btn primary" onClick=${()=>answer(true)}>Je savais</button><button className="btn" onClick=${()=>answer(false)}>À revoir</button>`}
      </div>`
    : html`<${Msg} kind="ok">Paquet terminé : ${FLASH.length} cartes sues, avec ${again} passage${again>1?'s':''} « à revoir ». Reviens demain pour un nouveau rappel.<//>
      <div><button className="btn primary" onClick=${reset}>Recommencer le paquet</button></div>`}
  `;
}

function Quiz({ progress, setBest, go }){
  const [order, setOrder] = useState(()=>shuffle(QUIZ.map((_,i)=>i)));
  const [k, setK] = useState(0);
  const [pick, setPick] = useState(null);
  const [score, setScore] = useState(0);
  const [missed, setMissed] = useState([]);
  const done = k >= order.length;
  const q = !done ? QUIZ[order[k]] : null;
  function choose(i){ if (pick!==null) return; setPick(i); if (i===q.c) setScore(score+1); else setMissed([...missed, order[k]]); }
  function next(){ const nk = k+1; setK(nk); setPick(null); if (nk>=order.length) setBest(score); }
  function restart(){ setOrder(shuffle(QUIZ.map((_,i)=>i))); setK(0); setPick(null); setScore(0); setMissed([]); }
  return html`
    <div className="page-head"><span className="eyebrow">Mémoriser</span><h1>Quiz final</h1>
      <p className="lead">${QUIZ.length} questions mélangées sur tout le chapitre. Chaque réponse est expliquée.</p></div>
    ${!done ? html`
      <div className="quiz-top"><span>Question ${k+1} sur ${order.length}</span><span>Score : ${score}</span></div>
      <div className="meter-track" style=${{width:'100%'}}><div className="meter-fill" style=${{width:(k/order.length*100)+'%'}}></div></div>
      <div className="check-box">
        <${P} className="q" s=${q.q}/>
        <div className="opts">${q.o.map((o,i)=>{ let st=''; if(pick!==null){ st = i===q.c ? 'ok' : (i===pick ? 'bad' : 'dim'); }
          return html`<button key=${k+'-'+i} className=${'opt '+st} disabled=${pick!==null} onClick=${()=>choose(i)}><${T} s=${o}/></button>`; })}</div>
        ${pick!==null && html`<${Msg} kind=${pick===q.c?'ok':'bad'}><strong>${pick===q.c?'Juste. ':'Pas tout à fait. '}</strong><${T} s=${q.e}/><//>`}
        ${pick!==null && html`<div><button className="btn primary" onClick=${next}>${k+1<order.length ? 'Question suivante' : 'Voir mon résultat'}</button></div>`}
      </div>`
    : html`
      <div className="check-box">
        <span className="tag">Résultat</span>
        <span className="score">${score} / ${order.length}</span>
        <p className="note">Meilleur score enregistré : ${progress.quizBest ?? score} / ${order.length}</p>
        ${missed.length ? html`<p>Questions à retravailler :</p>
          <ul className="tips">${missed.map(i=>{ const n = NOTIONS.find(x=>x.id===QUIZ[i].p); return html`<li key=${i}><${T} s=${QUIZ[i].q}/> <button className="btn sm" onClick=${()=>go(n.id)}>Notion ${n.num}</button></li>`; })}</ul>`
          : html`<${Msg} kind="ok">Sans faute. Refais le quiz dans quelques jours pour consolider.<//>`}
        <div><button className="btn primary" onClick=${restart}>Recommencer le quiz</button></div>
      </div>`}
  `;
}

function Memo({ go }){
  const LAWS = [
    { when:'Circuit en série', name:'Unicité de l’intensité', f:'$I$ = $I_1$ = $I_2$', p:'n2' },
    { when:'Circuit en série', name:'Additivité des tensions', f:'$U_G$ = $U_1$ + $U_2$', p:'n3' },
    { when:'Circuit en dérivation', name:'Additivité des intensités', f:'$I$ = $I_1$ + $I_2$', p:'n4' },
    { when:'Résistor', name:'Loi d’Ohm', f:'$U$ = $R$ × $I$', p:'n5' },
  ];
  return html`
    <div className="page-head"><span className="eyebrow">Mémoriser</span><h1>Fiche résumé</h1>
      <p className="lead">L’essentiel du chapitre sur une seule page. Cache-la et essaie de la réécrire de mémoire.</p></div>
    <section><h2>Les grandeurs</h2>
      <div className="tbl-wrap"><table>
        <thead><tr><th>Grandeur</th><th>Définition</th><th>Unité</th><th>Mesure</th></tr></thead>
        <tbody>
          <tr><td><span className="v-u">U</span> tension</td><td>différence d’état électrique entre deux points</td><td>volt (V)</td><td>voltmètre en dérivation</td></tr>
          <tr><td><span className="v-i">I</span> intensité</td><td>débit de charges électriques</td><td>ampère (A)</td><td>ampèremètre en série</td></tr>
          <tr><td><span className="v-r">R</span> résistance</td><td>coefficient de proportionnalité entre U et I</td><td>ohm (Ω)</td><td>calculée : R = U ÷ I</td></tr>
        </tbody>
      </table></div>
    </section>
    <section><h2>Les quatre lois</h2>
      <div className="memo-grid">${LAWS.map(l=>html`<div key=${l.name} className="memo-card"><span className="when">${l.when}</span><h3>${l.name}</h3><p className="formula-sm"><${T} s=${l.f}/></p><div><button className="btn sm" onClick=${()=>go(l.p)}>Revoir</button></div></div>`)}</div>
    </section>
    <section><h2>À ne pas oublier</h2>
      <ul className="tips">
        <li>1 A = 1 000 mA et 1 kΩ = 1 000 Ω.</li>
        <li>Le courant va du + vers le − à l’extérieur du générateur.</li>
        <li>Dans la loi d’Ohm : U en V, R en Ω, I en A.</li>
        <li>La caractéristique d’un résistor est une droite qui passe par l’origine.</li>
        <li>Réponse rédigée : on sait que → on utilise → calcul → conclusion avec l’unité.</li>
      </ul>
    </section>
  `;
}

/* ---------- Accueil ---------- */
function Home({ progress, go }){
  const seen = NOTIONS.filter(n=>progress.visited[n.id]).length;
  const solved = ALL_EX.filter(e=>progress.solved[e.id]).length;
  return html`
    <div className="page-head"><span className="eyebrow">Physique-chimie · 3e</span><h1>Électricité : intensité, tension et loi d’Ohm</h1>
      <p className="lead">Les lois du courant électrique, en petites étapes. Chaque notion se découvre avec un schéma à manipuler, puis s’entraîne avec un exemple résolu suivi d’exercices de plus en plus difficiles.</p></div>
    <section><h2>Ton parcours</h2>
      <div className="path">
        <div className="path-step"><span className="n">ÉTAPE 1</span><h3>Comprendre</h3><p>Six notions courtes, chacune avec un schéma interactif et une question de vérification.</p><span className="note">${seen} notion${seen>1?'s':''} ouverte${seen>1?'s':''} sur 6</span><button className="btn primary" onClick=${()=>go('n1')}>Commencer</button></div>
        <div className="path-step"><span className="n">ÉTAPE 2</span><h3>S’entraîner</h3><p>Sept familles d’exercices. Un exemple résolu, puis trois niveaux : guidé, autonome, défi.</p><span className="note">${solved} exercice${solved>1?'s':''} réussi${solved>1?'s':''} sur ${ALL_EX.length}</span><button className="btn" onClick=${()=>go('fA')}>Exercices A</button></div>
        <div className="path-step"><span className="n">ÉTAPE 3</span><h3>Mémoriser</h3><p>Cartes mémo, quiz final et fiche résumé, à reprendre sur plusieurs jours.</p><span className="note">${progress.quizBest!=null ? 'Meilleur score au quiz : '+progress.quizBest+' / '+QUIZ.length : 'Quiz pas encore fait'}</span><button className="btn" onClick=${()=>go('cards')}>Cartes mémo</button></div>
      </div>
    </section>
    <section><h2>Pour bien apprendre</h2>
      <ul className="tips">
        <li>Une notion à la fois : termine une page avant de passer à la suivante.</li>
        <li>Dans l’exemple résolu, essaie de deviner l’étape suivante avant de l’afficher.</li>
        <li>Fais au moins un essai avant d’ouvrir une correction. Se tromper fait partie de l’apprentissage.</li>
        <li>Garde les couleurs en tête : <span className="v-u">U en bleu</span>, <span className="v-i">I en rouge</span>, <span className="v-r">R en vert</span>.</li>
        <li>Reviens aux cartes mémo plusieurs jours de suite : la mémoire se consolide avec des rappels espacés.</li>
      </ul>
    </section>
  `;
}

/* ---------- Application ---------- */
function NavItem({ id, num, label, badge, done, page, go }){
  return html`<button className="nav-item" aria-current=${page===id ? 'page' : undefined} onClick=${()=>go(id)}>
    <span className="nav-num">${num}</span><span className="nav-label">${label}</span>${badge && html`<span className=${'nav-badge'+(done?' done':'')}>${badge}</span>`}
  </button>`;
}

function App(){
  const [page, setPage] = useState(()=>{ const h = (location.hash||'').slice(1); return ORDER.includes(h) ? h : 'home'; });
  const [progress, setProgress] = useState(loadProgress);
  const [confirmReset, setConfirmReset] = useState(false);
  useEffect(()=>{ saveProgress(progress); }, [progress]);
  useEffect(()=>{
    setProgress(p => p.visited[page] ? p : { ...p, visited:{ ...p.visited, [page]:true } });
    window.scrollTo(0,0);
  }, [page]);
  const go = id => setPage(id);
  const onSolved = id => setProgress(p => p.solved[id] ? p : { ...p, solved:{ ...p.solved, [id]:true } });
  const setBest = s => setProgress(p => ({ ...p, quizBest: p.quizBest==null ? s : Math.max(p.quizBest, s) }));
  const solved = ALL_EX.filter(e=>progress.solved[e.id]).length;

  let body;
  const fam = FAMILIES.find(f=>f.id===page);
  if (page==='home') body = html`<${Home} progress=${progress} go=${go}/>`;
  else if (page==='n1') body = html`<${N1} go=${go}/>`;
  else if (page==='n2') body = html`<${N2} go=${go}/>`;
  else if (page==='n3') body = html`<${N3} go=${go}/>`;
  else if (page==='n4') body = html`<${N4} go=${go}/>`;
  else if (page==='n5') body = html`<${N5} go=${go}/>`;
  else if (page==='n6') body = html`<${N6} go=${go}/>`;
  else if (fam) body = html`<${FamilyPage} key=${fam.id} fam=${fam} progress=${progress} onSolved=${onSolved} go=${go}/>`;
  else if (page==='cards') body = html`<${Flashcards}/>`;
  else if (page==='quiz') body = html`<${Quiz} progress=${progress} setBest=${setBest} go=${go}/>`;
  else if (page==='memo') body = html`<${Memo} go=${go}/>`;

  return html`
    <header className="toolbar">
      <svg className="app-ico" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="var(--accent)"/><path d="M14.5 4L7.5 14.5h5L11 22l7.5-11h-5z" fill="#fff"/></svg>
      <div><div className="app-name">Électricité 3e</div><div className="app-sub">Intensité, tension et loi d’Ohm</div></div>
      <span className="tb-spacer"></span>
      <div className="meter" title="Exercices réussis">
        <span>${solved}/${ALL_EX.length} exercices</span>
        <div className="meter-track"><div className="meter-fill" style=${{width:(solved/ALL_EX.length*100)+'%'}}></div></div>
      </div>
      ${confirmReset
        ? html`<span className="confirm">Tout effacer ?<button className="btn sm" onClick=${()=>{ setProgress({visited:{},solved:{},quizBest:null}); setConfirmReset(false); }}>Oui, effacer</button><button className="btn sm" onClick=${()=>setConfirmReset(false)}>Annuler</button></span>`
        : html`<button className="btn sm" onClick=${()=>setConfirmReset(true)}>Réinitialiser</button>`}
    </header>
    <div className="mobile-nav">
      <label htmlFor="nav-select" className="note">Aller à</label>
      <select id="nav-select" className="field" value=${page} onChange=${e=>go(e.target.value)}>
        <option value="home">Accueil</option>
        <optgroup label="Comprendre">${NOTIONS.map(n=>html`<option key=${n.id} value=${n.id}>${n.num}. ${n.title}</option>`)}</optgroup>
        <optgroup label="S’entraîner">${FAMILIES.map(f=>html`<option key=${f.id} value=${f.id}>${f.letter} · ${f.title} (${f.items.filter(e=>progress.solved[e.id]).length}/${f.items.length})</option>`)}</optgroup>
        <optgroup label="Mémoriser">${MEMO.map(m=>html`<option key=${m.id} value=${m.id}>${m.title}</option>`)}</optgroup>
      </select>
    </div>
    <div className="layout">
      <aside className="sidebar"><nav aria-label="Sommaire">
        <${NavItem} id="home" num="" label="Accueil" page=${page} go=${go}/>
        <div className="nav-h">Comprendre</div>
        ${NOTIONS.map(n=>html`<${NavItem} key=${n.id} id=${n.id} num=${n.num} label=${n.title} badge=${progress.visited[n.id] ? 'vu' : null} page=${page} go=${go}/>`)}
        <div className="nav-h">S’entraîner</div>
        ${FAMILIES.map(f=>{ const d=f.items.filter(e=>progress.solved[e.id]).length; return html`<${NavItem} key=${f.id} id=${f.id} num=${f.letter} label=${f.title} badge=${d+'/'+f.items.length} done=${d===f.items.length} page=${page} go=${go}/>`; })}
        <div className="nav-h">Mémoriser</div>
        ${MEMO.map(m=>html`<${NavItem} key=${m.id} id=${m.id} num="" label=${m.title} badge=${m.id==='quiz' && progress.quizBest!=null ? progress.quizBest+'/'+QUIZ.length : null} page=${page} go=${go}/>`)}
      </nav></aside>
      <main className="main"><div className="content">
        ${body}
        <${Pager} page=${page} go=${go}/>
      </div></main>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body></html>
