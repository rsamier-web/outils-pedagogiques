<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La science en philosophie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Breeze (KDE Plasma) : fenêtre grise, vues claires, accent bleu.
   Layout : barre d'outils en haut, panneau latéral de navigation, vue principale scrollable. */
:root{
  --window:#eff0f1; --view:#ffffff; --header:#dee0e2; --button:#fcfcfc;
  --text:#232629; --muted:#5d646b; --border:#c3c7cb; --border-soft:#dde0e3;
  --accent:#3daee9; --accent-text:#1a6ea6; --accent-soft:rgba(61,174,233,.13);
  --pos:#27ae60; --pos-text:#1d7f47; --pos-soft:rgba(39,174,96,.12);
  --neg:#da4453; --neg-text:#b52d3c; --neg-soft:rgba(218,68,83,.10);
  --neu:#f67400; --neu-text:#a84f00; --neu-soft:rgba(246,116,0,.11);
  --font-body:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-quote:"Noto Serif",Georgia,"Times New Roman",serif;
  --shadow:0 1px 2px rgba(35,38,41,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --window:#202326; --view:#16181a; --header:#2a2e32; --button:#292c30;
    --text:#f3f4f5; --muted:#a3abb3; --border:#454b51; --border-soft:#33383d;
    --accent:#3daee9; --accent-text:#73c6f2; --accent-soft:rgba(61,174,233,.17);
    --pos:#2fb36a; --pos-text:#5dd492; --pos-soft:rgba(47,179,106,.16);
    --neg:#e0525f; --neg-text:#f2808b; --neg-soft:rgba(224,82,95,.16);
    --neu:#f67400; --neu-text:#ffa252; --neu-soft:rgba(246,116,0,.16);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --window:#202326; --view:#16181a; --header:#2a2e32; --button:#292c30;
  --text:#f3f4f5; --muted:#a3abb3; --border:#454b51; --border-soft:#33383d;
  --accent:#3daee9; --accent-text:#73c6f2; --accent-soft:rgba(61,174,233,.17);
  --pos:#2fb36a; --pos-text:#5dd492; --pos-soft:rgba(47,179,106,.16);
  --neg:#e0525f; --neg-text:#f2808b; --neg-soft:rgba(224,82,95,.16);
  --neu:#f67400; --neu-text:#ffa252; --neu-soft:rgba(246,116,0,.16);
  --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--window);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Fenêtre */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.toolbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--header);border-bottom:1px solid var(--border)}
.toolbar .appname{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.toolbar .appname small{font-weight:400;color:var(--muted)}
.toolbar .spacer{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);background:var(--view);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--text);font-weight:600}
.chip.acc{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.chip.pos{border-color:var(--pos);background:var(--pos-soft);color:var(--pos-text)}
.chip.neg{border-color:var(--neg);background:var(--neg-soft);color:var(--neg-text)}
.chip.neu{border-color:var(--neu);background:var(--neu-soft);color:var(--neu-text)}

.body{display:grid;grid-template-columns:236px 1fr;min-height:0}
.sidebar{background:var(--window);border-right:1px solid var(--border);overflow-y:auto;padding:10px 8px}
.side-h{font-size:12px;font-weight:600;color:var(--muted);padding:10px 10px 4px;text-transform:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;font-size:14.5px}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.on{background:var(--accent-soft);border-color:var(--accent)}
.nav-item .ico{color:var(--muted);flex:none}
.nav-item.on .ico{color:var(--accent-text)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 18px;padding-left:8px;border-left:1px solid var(--border-soft)}
.subnav button{display:flex;gap:8px;align-items:baseline;text-align:left;padding:5px 8px;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;font-size:13.5px;line-height:1.35}
.subnav button:hover{background:var(--accent-soft)}
.subnav button.on{background:var(--accent-soft);border-color:var(--accent)}
.subnav .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.1em}
.subnav .seen{margin-left:auto;color:var(--pos-text);font-size:12px}

.main{overflow-y:auto;min-width:0}
.page{max-width:980px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent-text)}
.page-head h1{font-size:26px;font-weight:600}
.page-head h2{font-size:23px;font-weight:600}
.lead{color:var(--muted);max-width:68ch}

/* Cartes Kirigami */
.card{background:var(--view);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft)}
.card-h h3{font-size:16px;font-weight:600}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}

/* Boutons Breeze */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 13px;border:1px solid var(--border);border-radius:4px;background:var(--button);cursor:pointer;font-size:14px;line-height:1.3;min-height:32px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover:not(:disabled){border-color:var(--border);background:var(--accent-soft)}
.btn.pos{border-color:var(--pos);color:var(--pos-text);background:var(--pos-soft)}
.btn.neg{border-color:var(--neg);color:var(--neg-text);background:var(--neg-soft)}
.btn.neu{border-color:var(--neu);color:var(--neu-text);background:var(--neu-soft)}
.btn.small{min-height:28px;padding:3px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font-family:ui-monospace,"Noto Sans Mono",monospace;font-size:11.5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* Segmented control */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--button);flex-wrap:wrap}
.seg button{border:none;border-right:1px solid var(--border);background:none;padding:5px 12px;cursor:pointer;font-size:13.5px}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.seg button:hover:not(.on){background:var(--accent-soft)}

/* Accueil */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.step{display:flex;flex-direction:column;gap:8px;padding:16px;text-align:left}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent-text);font-weight:600;font-size:13px}
.step h3{font-size:16px;font-weight:600}
.step p{color:var(--muted);font-size:14px;flex:1}
.bar{height:6px;border-radius:3px;background:var(--border-soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.pos>span{background:var(--pos)}
.bar-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 24px;margin:0;padding:0;list-style:none}
.principles li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:14px}
.principles li b{display:block;font-weight:600}
.principles li span.m{color:var(--muted)}
.principles .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px;margin-left:6px}

/* Mots-clés */
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--view)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:34px;height:18px;border-radius:9px;border:1px solid var(--border);background:var(--button);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch input:checked + .track{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .track::after{left:18px;background:#fff}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.gloss-group h3{font-size:14px;font-weight:600;color:var(--muted);padding:12px 18px 6px}
.gloss{margin:0}
.gloss .it{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:4px 18px;padding:9px 18px;border-top:1px solid var(--border-soft)}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--text)}
.gloss dd.hidden{color:var(--muted)}
.reveal{border:1px dashed var(--border);background:none;border-radius:4px;padding:2px 10px;cursor:pointer;color:var(--accent-text);font-size:13.5px}

/* Modules */
.rail{display:none;gap:6px;overflow-x:auto;padding-bottom:2px}
.rail button{flex:none;border:1px solid var(--border);border-radius:4px;background:var(--button);padding:4px 10px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.rail button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.tension{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.tension .ab{padding:2px 9px;border-radius:999px;border:1px solid var(--border);background:var(--view);color:var(--text)}
.key{border:1px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.key .lab{font-size:12px;font-weight:700;color:var(--accent-text);padding-top:2px;white-space:nowrap}
.key p{font-size:16px;font-weight:500}
.mod-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.mod-text{display:flex;flex-direction:column;gap:12px}
.blk{background:var(--view);border:1px solid var(--border);border-left-width:4px;border-radius:5px;padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.blk h4{font-size:13px;font-weight:700;letter-spacing:.01em}
.blk.pb{border-left-color:var(--neu)} .blk.pb h4{color:var(--neu-text)}
.blk.ex{border-left-color:var(--muted)} .blk.ex h4{color:var(--muted)}
.blk.au{border-left-color:var(--accent)} .blk.au h4{color:var(--accent-text)}
.blk.rs{border-left-color:var(--pos)} .blk.rs h4{color:var(--pos-text)}
.blk ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.auth{display:flex;flex-direction:column;gap:2px}
.auth .who{font-weight:600}
.auth .who em{font-weight:400;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sticky{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.retenir{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:5px;background:var(--pos-soft);border:1px solid var(--pos)}
.retenir b{color:var(--pos-text);font-size:12.5px;white-space:nowrap}
.mod-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Figures */
.fig{margin:0;background:var(--view);border:1px solid var(--border);border-radius:6px;padding:12px 12px 10px;color:var(--text)}
.fig svg{display:block;width:100%;height:auto;max-width:100%}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:8px;padding:0 4px;line-height:1.45}
.bx rect{fill:var(--view);stroke:var(--border);stroke-width:1.2}
.bx.t-acc rect{fill:var(--accent-soft);stroke:var(--accent)}
.bx.t-pos rect{fill:var(--pos-soft);stroke:var(--pos)}
.bx.t-neg rect{fill:var(--neg-soft);stroke:var(--neg)}
.bt{font-size:14px;font-weight:600;fill:currentColor}
.bs{font-size:12px;fill:var(--muted)}
.arr polyline{stroke:currentColor;stroke-width:1.4;opacity:.7}
.arr polygon{fill:currentColor;opacity:.7}
.arr.t-neg polyline{stroke:var(--neg);opacity:1} .arr.t-neg polygon{fill:var(--neg);opacity:1}
.arr.t-pos polyline{stroke:var(--pos);opacity:1} .arr.t-pos polygon{fill:var(--pos);opacity:1}
.arr.t-acc polyline{stroke:var(--accent);opacity:1} .arr.t-acc polygon{fill:var(--accent);opacity:1}
.al{font-size:12px;fill:var(--muted)}
.al.neg,.arr.t-neg .al{fill:var(--neg-text)}
.al.pos,.arr.t-pos .al{fill:var(--pos-text)}
.al.acc{fill:var(--accent-text);font-weight:600;font-size:13px}
.lane{font-size:13px;font-weight:700;fill:currentColor}
.sep{stroke:var(--border);stroke-dasharray:3 4}
.brk{stroke:var(--muted);fill:none;stroke-width:1.2}
.swan{fill:var(--view);stroke:currentColor;stroke-width:1.2;opacity:.8}
.swan.black{fill:currentColor;opacity:1}

/* Quick check / QCM */
.qc{display:flex;flex-direction:column;gap:10px}
.qtext{font-weight:600}
.ctx{padding:8px 12px;border-left:3px solid var(--border);background:var(--window);border-radius:0 4px 4px 0;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:var(--button);cursor:pointer;text-align:left;font-size:14.5px}
.opt:hover{border-color:var(--accent)}
.opt input{margin:3px 0 0;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--pos);background:var(--pos-soft)}
.opt.ko{border-color:var(--neg);background:var(--neg-soft)}
.opt.dis{cursor:default}
.fb{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fb .line{display:flex;gap:8px;align-items:baseline}
.fb .mark{font-weight:700}
.fb.ok .mark{color:var(--pos-text)} .fb.ko .mark{color:var(--neg-text)}
.why{padding:9px 12px;border-radius:4px;background:var(--window);border:1px solid var(--border-soft);font-size:14px}
.why b{color:var(--accent-text)}

/* Exercices */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvl{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:5px;background:var(--view);cursor:pointer;position:relative}
.lvl:hover{border-color:var(--accent)}
.lvl.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.lvl .ln{font-size:12px;color:var(--muted);font-weight:600}
.lvl .lt{font-weight:600;font-size:14.5px}
.lvl .ls{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl .ls.done{color:var(--pos-text)}
.diff{display:flex;gap:3px;margin-top:2px}
.diff i{width:12px;height:4px;border-radius:2px;background:var(--border)}
.diff i.f{background:var(--accent)}
.exlist{display:flex;flex-direction:column;gap:16px}
.ex-intro{display:flex;flex-direction:column;gap:4px;padding:12px 18px;border-bottom:1px solid var(--border-soft)}
.ex-intro .consigne{color:var(--muted);font-size:14px}
.ex-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:16px}
.qlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:18px;counter-reset:q}
.qlist>li{display:flex;flex-direction:column;gap:8px;counter-increment:q}
.qlist>li>.qtext::before{content:counter(q) ". ";color:var(--muted)}
.checkbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid var(--border-soft)}
.checkbar .hint{font-size:13px;color:var(--muted)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.match{display:flex;flex-direction:column;gap:8px}
.match .mrow{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:10px;align-items:start}
.match .ml{font-weight:600;padding-top:6px}
select{padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--button);width:100%;max-width:100%}
select.ok{border-color:var(--pos);background:var(--pos-soft)}
select.ko{border-color:var(--neg);background:var(--neg-soft)}
.sortlist{display:flex;flex-direction:column;gap:10px}
.sortitem{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--border);border-radius:5px;background:var(--view)}
.sortitem.ok{border-color:var(--pos)} .sortitem.ko{border-color:var(--neg)}
.sortitem .st{font-size:14.5px}
.orderlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.orderlist li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:5px;background:var(--view)}
.orderlist li.ok{border-color:var(--pos);background:var(--pos-soft)} .orderlist li.ko{border-color:var(--neg);background:var(--neg-soft)}
.orderlist .pos{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.orderlist .mv{display:flex;gap:4px}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border);border-radius:4px;background:var(--button);cursor:pointer}
.iconbtn:hover:not(:disabled){border-color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.cloze p{line-height:2.1;margin-bottom:6px}
.cloze select{width:auto;display:inline-block;padding:2px 6px;margin:0 2px}
.worked{display:flex;flex-direction:column;gap:12px}
.wstep{border:1px solid var(--border);border-radius:5px;background:var(--view);overflow:hidden}
.wstep .wh{display:flex;gap:10px;align-items:center;padding:9px 14px;background:var(--window);border-bottom:1px solid var(--border-soft);font-weight:600}
.wstep .wh .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent-text);font-size:12px}
.wstep .wb{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.prompt{font-size:14px;color:var(--neu-text);display:flex;gap:6px}
.wb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.fading{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:14px}
textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--view);resize:vertical;line-height:1.5}
.model{display:flex;flex-direction:column;gap:12px;padding:12px 14px;border:1px solid var(--pos);border-radius:5px;background:var(--pos-soft)}
.model h4{font-size:14px;color:var(--pos-text)}
.model ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.checklist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14.5px}
.checklist input{margin-top:4px;accent-color:var(--pos)}

/* Flashcards */
.fc-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.filters{display:flex;flex-direction:column;gap:10px}
.filters .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .flab{font-size:13px;color:var(--muted);min-width:76px}
.pill{border:1px solid var(--border);border-radius:999px;background:var(--button);padding:3px 11px;cursor:pointer;font-size:13px}
.pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.pill:hover:not(.on){border-color:var(--accent)}
.flash{perspective:1400px;height:300px;width:100%;border:none;background:none;padding:0;cursor:pointer;display:block;text-align:left}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .45s ease;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--border);border-radius:8px;background:var(--view);padding:18px 22px;display:flex;flex-direction:column;gap:10px;overflow:auto;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);border-color:var(--accent)}
.face .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.face .front-t{font-size:22px;font-weight:600;margin:auto 0;line-height:1.35;text-wrap:balance}
.face .front-t.quote{font-family:var(--font-quote);font-style:italic;font-weight:400;font-size:21px}
.face .ask{color:var(--muted);font-size:14px}
.face .back-t{font-size:16.5px;line-height:1.55;margin:auto 0}
.face .hint{font-size:12.5px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:2px;padding:8px}
.rate .btn small{font-size:11.5px;font-weight:400;opacity:.85}
.leitner{display:flex;flex-direction:column;gap:8px}
.lbox{display:grid;grid-template-columns:62px 1fr 28px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.lbox .bar{height:8px}
.lbox .c{text-align:right;color:var(--muted)}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.done-card{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}

/* Responsive */
@media (max-width:900px){
  .mod-grid{grid-template-columns:1fr}
  .sticky{position:static}
  .fc-wrap{grid-template-columns:1fr}
  .levels{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
@media (max-width:760px){
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);padding:6px 10px;overflow-x:auto;overflow-y:hidden}
  .side-h,.subnav,.nav-item .count{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{width:auto;white-space:nowrap;padding:6px 10px;font-size:14px}
  .toolbar .stats{display:none}
  .rail{display:flex}
  .page{padding:18px 16px 56px}
  .gloss .it{grid-template-columns:1fr}
  .match .mrow{grid-template-columns:1fr}
  .key{grid-template-columns:1fr;gap:4px}
  .flash{height:340px}
}
@media (prefers-reduced-motion:reduce){
  .flash-inner,.switch .track,.switch .track::after{transition:none}
}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
"use strict";
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- Utilitaires ---------- */
const store = {
  get(k, d){ try { const v = window.localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { window.localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function usePersist(key, init){
  const [v, setV] = useState(() => store.get(key, init));
  useEffect(() => { store.set(key, v); }, [key, v]);
  return [v, setV];
}
function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function prepQ(q){
  const order = shuffle(q.options.map((_, i) => i));
  return Object.assign({}, q, { options: order.map(i => q.options[i]), answer: order.indexOf(q.answer) });
}
function prepBlank(b){
  const order = shuffle(b.opts.map((_, i) => i));
  return Object.assign({}, b, { opts: order.map(i => b.opts[i]), a: order.indexOf(b.a) });
}

/* ---------- Contenu : modules ---------- */
const MODULES = [
  { id:"science", short:"Qu'est-ce que la science ?", a:"Désir de savoir", b:"besoin d'être rassuré",
    question:"D'où vient la science et que cherche-t-elle ?",
    cle:"La science naît de l'étonnement et cherche des lois générales grâce à une méthode rigoureuse.",
    probleme:"Tout humain veut savoir : l'animal réagit par réflexe, l'humain s'étonne devant un effet dont il ignore la cause. Mais face à une question sans réponse, on est tenté de prendre la première explication venue, juste pour être rassuré.",
    exemples:["La pomme qui tombe : la science ne s'intéresse pas à cette pomme-là, mais à la loi qui fait tomber tous les corps.","Un orage éclate : on y a vu la colère des dieux ; la science y voit une décharge électrique."],
    refs:[{who:"Aristote", work:"Métaphysique", idea:"« Tous les hommes désirent naturellement savoir. » Et il n'y a de science que du général."},
          {who:"Descartes", work:"Discours de la méthode, 1637", idea:"Fonder les connaissances : ne rien tenir pour vrai sans l'avoir examiné (doute méthodique)."}],
    resolution:"Prendre le chemin long : transformer l'étonnement en question précise, puis chercher la réponse par une méthode, au lieu de se contenter d'une réponse rassurante.",
    retenir:"La science est un savoir général, organisé et méthodique, qui vise l'objectivité.",
    check:{q:"Pourquoi dit-on qu'« il n'y a de science que du général » ?", options:["Parce que la science cherche des lois valables pour tous les cas d'un même type","Parce que la science n'étudie que de grands sujets comme l'univers","Parce qu'un seul cas bien observé suffit à établir une loi"], answer:0, why:"La science ne décrit pas un cas isolé : elle cherche la loi qui explique tous les cas semblables (toutes les chutes, pas cette chute-là)."} },

  { id:"opinion", short:"Science et opinion", a:"Science", b:"opinion",
    question:"Peut-on se fier à ce que l'on voit ?",
    cle:"La science se construit contre l'opinion et contre l'expérience spontanée, qui nous trompent.",
    probleme:"Nos sens et le « bon sens » donnent l'illusion de savoir. L'opinion répond vite, rassure, et nous empêche de poser de vraies questions.",
    exemples:["Le Soleil semble « se lever » : en réalité, c'est la Terre qui tourne.","Aristote pensait que les corps lourds tombent plus vite. Galilée montre que c'est l'air qui freine la plume. En 1971, sur la Lune (sans air), un astronaute lâche un marteau et une plume : ils tombent ensemble."],
    refs:[{who:"Bachelard", work:"La Formation de l'esprit scientifique, 1938", idea:"« L'opinion pense mal ; elle ne pense pas. » Elle est un obstacle épistémologique : le scientifique doit penser contre les autres et contre lui-même."},
          {who:"Galilée", work:"XVIIe siècle", idea:"Remplace l'observation spontanée par l'expérimentation : on crée des conditions contrôlées (plan incliné, réduction des frottements)."}],
    resolution:"La science ne jette pas l'observation : elle la corrige. L'expérimentation est artificielle (provoquée), précise (mesurée) et suit un protocole reproductible.",
    retenir:"La science ne s'oppose pas à l'expérience, mais à l'expérience non critiquée.",
    check:{q:"Quelle est la différence entre expérience commune et expérimentation ?", options:["L'expérimentation est construite, mesurée et reproductible ; l'expérience commune est spontanée","L'expérimentation se fait en laboratoire, l'expérience commune dehors","Il n'y en a pas : les deux reposent sur l'observation"], answer:0, why:"Le lieu ne compte pas : ce qui compte, c'est que l'expérimentation est préparée selon un protocole que d'autres peuvent refaire."} },

  { id:"demarche", short:"La démarche scientifique", a:"Hypothèse", b:"preuve",
    question:"Comment la science teste-t-elle ses idées ?",
    cle:"La démarche hypothético-déductive : on imagine une hypothèse, on en déduit une conséquence testable, puis on la met à l'épreuve.",
    probleme:"Une cause cachée ne s'observe pas directement. Il faut la supposer, puis vérifier si ce qu'elle prédit se produit vraiment.",
    exemples:["Vienne, années 1840. Dans une maternité, un service a beaucoup plus de décès par fièvre puerpérale que l'autre. Semmelweis teste et élimine sept hypothèses : épidémie, surpopulation, étudiants, régime, clochette du prêtre, position d'accouchement…","Un collègue se coupe pendant une dissection et meurt des mêmes symptômes. Nouvelle hypothèse : les médecins transportent de la « matière cadavérique » sur leurs mains. Test : lavage au chlorure de chaux. La mortalité chute."],
    refs:[{who:"Semmelweis", work:"médecin, 1818-1865", idea:"Applique la méthode avant qu'elle soit théorisée. Ses collègues refusent pourtant ses conclusions."},
          {who:"Claude Bernard", work:"Introduction à l'étude de la médecine expérimentale, 1865", idea:"Formule la méthode expérimentale : observation, hypothèse, expérience qui juge l'hypothèse."}],
    resolution:"Une hypothèse n'est jamais crue sur parole : elle n'est retenue que si elle résiste au test. Les hypothèses éliminées font aussi avancer la connaissance.",
    retenir:"Problème → hypothèse → conséquence testable → expérience → hypothèse éliminée ou retenue.",
    check:{q:"Pourquoi Semmelweis a-t-il fait supprimer la clochette du prêtre ?", options:["Pour tester l'hypothèse d'un effet de la peur sur les patientes","Parce que le bruit dérangeait les médecins","Pour prouver que la religion causait la maladie"], answer:0, why:"Il déduit une conséquence testable : si la peur causait la fièvre, supprimer la clochette ferait baisser la mortalité. Rien ne change : l'hypothèse est éliminée."} },

  { id:"provisoire", short:"Une vérité provisoire", a:"Vérité", b:"changement",
    question:"Si la science change, peut-on encore lui faire confiance ?",
    cle:"Une théorie scientifique n'est jamais prouvée définitivement ; elle est scientifique parce qu'elle peut être réfutée.",
    probleme:"Le géocentrisme a été abandonné, Einstein a corrigé Newton. Et l'induction pose problème : avoir vu mille fois la même chose ne prouve pas que ce sera toujours vrai.",
    exemples:["La dinde de Russell est nourrie chaque matin et en conclut qu'on la nourrira toujours… jusqu'au matin de Noël.","« Tous les cygnes sont blancs » : des milliers d'observations ne le prouvent pas ; un seul cygne noir (découvert en Australie) le réfute.","On calcule encore les trajectoires des fusées avec Newton ; le GPS, lui, doit tenir compte d'Einstein. Une théorie dépassée n'est pas forcément « fausse »."],
    refs:[{who:"Hume", work:"XVIIIe siècle", idea:"Problème de l'induction : nous croyons que l'avenir ressemblera au passé par habitude, pas par preuve."},
          {who:"Popper", work:"La Logique de la découverte scientifique, 1934", idea:"Critère de réfutabilité (falsifiabilité) : une théorie est scientifique si une expérience pourrait la montrer fausse."}],
    resolution:"Le changement est la force de la science : une vérité scientifique vaut « jusqu'à preuve du contraire ». Une théorie qui a résisté aux tests est corroborée.",
    retenir:"Vérifier définitivement une loi universelle est impossible ; pour la réfuter, un seul contre-exemple suffit.",
    check:{q:"Lequel de ces énoncés est réfutable au sens de Popper ?", options:["L'eau pure bout à 100 °C au niveau de la mer","Il t'arrivera bientôt quelque chose d'important","Tout ce qui arrive avait une raison d'arriver"], answer:0, why:"On peut chauffer de l'eau et mesurer : si elle bouillait à 90 °C, l'énoncé serait réfuté. Les deux autres sont compatibles avec n'importe quel fait."} },

  { id:"objectivite", short:"Objectivité et paradigmes", a:"Objectivité", b:"subjectivité",
    question:"La science peut-elle être objective alors que les scientifiques sont humains ?",
    cle:"Les scientifiques pensent dans le cadre de leur époque (un paradigme), mais l'objectivité se construit collectivement.",
    probleme:"Un scientifique a des croyances, une carrière, des maîtres. Une idée nouvelle peut être refusée parce qu'elle dérange : poids de l'autorité, ancienneté d'une idée, coût du changement.",
    exemples:["Semmelweis est rejeté : admettre que leurs mains tuaient des patientes était insupportable pour les médecins.","Galilée est condamné en 1633 pour avoir défendu l'héliocentrisme.","Passer du géocentrisme à l'héliocentrisme, c'est changer de paradigme."],
    refs:[{who:"Kuhn", work:"La Structure des révolutions scientifiques, 1962", idea:"Science normale dans un paradigme → anomalies → crise → révolution → nouveau paradigme."},
          {who:"Bachelard", work:"La Formation de l'esprit scientifique, 1938", idea:"Le scientifique doit aller contre les idées majoritaires de son époque, et contre lui-même."}],
    resolution:"L'objectivité est un idéal collectif (intersubjectif) : protocoles, reproductibilité, évaluation par les pairs, débat contradictoire.",
    retenir:"Un scientifique seul peut se tromper ; la communauté corrige. Comme l'arbitrage vidéo : plusieurs regards réduisent l'erreur.",
    check:{q:"Qu'est-ce qu'un paradigme selon Kuhn ?", options:["Un cadre de pensée partagé par les scientifiques d'une époque","Une expérience qui prouve définitivement une théorie","Une erreur commise par un savant isolé"], answer:0, why:"Le paradigme oriente les questions qu'on pose et la manière d'y répondre, jusqu'à ce qu'une crise le fasse remplacer."} },

  { id:"relativisme", short:"Relatif ou relativiste ?", a:"Relatif", b:"relativiste",
    question:"Si la science change, est-ce que tout se vaut ?",
    cle:"Le savoir scientifique est relatif (provisoire) sans être relativiste (tout ne se vaut pas).",
    probleme:"On entend : « La science s'est déjà trompée, donc mon avis vaut le sien. » C'est confondre deux idées très différentes.",
    exemples:["« La Terre est plate » et « la Terre est ronde » ne se valent pas : l'une a résisté à des siècles de tests (tour du monde, photos satellites, ombre ronde de la Terre sur la Lune), l'autre a été réfutée.","Un avion construit selon « ma vérité à moi » ne volerait pas."],
    refs:[{who:"Relativisme faible", work:"position raisonnable", idea:"Les connaissances évoluent et dépendent de leur époque."},
          {who:"Relativisme fort", work:"position intenable", idea:"Toutes les thèses se valent. Elle se contredit : si tout se vaut, « tout se vaut » ne vaut pas plus que son contraire."}],
    resolution:"Éviter deux excès : le dogmatisme (la science serait absolue et définitive) et le relativisme fort. Entre les deux : un savoir provisoire, mais le meilleur disponible parce qu'il a été testé.",
    retenir:"Relatif n'est pas relativiste.",
    check:{q:"« Les théories évoluent, donc la science ne vaut pas plus que l'opinion. » Quelle erreur commet ce raisonnement ?", options:["Il passe du relativisme faible au relativisme fort","Il confond la science et la technique","Il n'y a aucune erreur"], answer:0, why:"Que les théories évoluent (relativisme faible) ne signifie pas que tout se vaut : une théorie testée vaut mieux qu'une opinion jamais testée."} },

  { id:"pseudo", short:"Science ou pseudo-science ?", a:"Science", b:"pseudo-science",
    question:"Comment reconnaître une fausse science ?",
    cle:"Une pseudo-science imite la science (elle explique, elle prédit) sans en respecter la méthode.",
    probleme:"L'astrologie affirme que les astres influencent notre personnalité et notre destin. Elle semble « marcher » parce que nous nous reconnaissons dans des descriptions vagues.",
    exemples:["Effet Barnum : en 1948, le psychologue Forer donne à tous ses étudiants le même « portrait personnalisé » tiré d'horoscopes. Ils le jugent très juste : plus de 4 sur 5 en moyenne.","Prophétie autoréalisatrice : l'horoscope annonce une rencontre, tu deviens plus ouvert… et tu fais une rencontre."],
    refs:[{who:"Popper", work:"Conjectures et réfutations, 1963", idea:"La réfutabilité sert de critère de démarcation : l'astrologie fait des prédictions si floues qu'aucun fait ne peut les contredire."}],
    resolution:"Quatre questions de démarcation : est-ce testable ? reproduit par d'autres ? précis ? ouvert à la critique ? L'enjeu est réel : les pseudo-sciences peuvent manipuler, entretenir la peur et l'ignorance, et miner la confiance dans la science.",
    retenir:"Ce n'est pas le sujet qui fait la science, c'est la méthode.",
    check:{q:"Pourquoi l'astrologie n'est-elle pas une science selon Popper ?", options:["Ses prédictions sont trop vagues pour pouvoir être réfutées","Elle étudie les astres, qui sont trop lointains","Elle est trop ancienne"], answer:0, why:"L'astronomie étudie aussi les astres et c'est une science : le problème n'est pas l'objet, mais l'impossibilité de tester les affirmations."} },

  { id:"humaines", short:"Les sciences humaines", a:"Expliquer", b:"comprendre",
    question:"Peut-on étudier l'être humain comme on étudie une pierre ?",
    cle:"En sciences humaines, l'objet étudié pense et réagit à ce qu'on dit de lui : il faut une méthode adaptée.",
    probleme:"Une pierre ne change pas parce qu'on l'étudie ; un humain, si. Une prédiction peut même provoquer ce qu'elle annonce (prophétie autoréalisatrice).",
    exemples:["2020 : une rumeur annonce une pénurie de papier toilette ; tout le monde en achète ; les rayons se vident. La prédiction a créé la pénurie.","Bulle spéculative : tout le monde croit qu'une action va monter, l'achète… et elle monte, jusqu'à l'effondrement.","Effet Pygmalion (Rosenthal, 1968) : les attentes des enseignants influencent les progrès des élèves. L'ampleur de l'effet est aujourd'hui discutée : la science se corrige."],
    refs:[{who:"Dilthey", work:"fin du XIXe siècle", idea:"« Nous expliquons la nature, nous comprenons la vie psychique. » Expliquer, c'est chercher les causes ; comprendre, c'est saisir le sens que les personnes donnent à leurs actions."}],
    resolution:"Les sciences humaines restent rigoureuses : statistiques, enquêtes, comparaisons, et protocoles comme le double aveugle (ni le patient ni le médecin ne savent qui reçoit le vrai traitement) pour neutraliser l'effet des croyances.",
    retenir:"Une méthode différente ne veut pas dire moins de rigueur.",
    check:{q:"À quoi sert un protocole en double aveugle ?", options:["À neutraliser l'effet des croyances du patient et du médecin","À doubler le nombre de patients testés","À cacher les résultats au public"], answer:0, why:"Si personne ne sait qui reçoit le vrai traitement, les attentes ne peuvent pas fausser le résultat : on mesure l'effet réel du traitement."} },

  { id:"morale", short:"Science et morale", a:"Savoir", b:"pouvoir",
    question:"Tout ce que la science rend possible est-il permis ?",
    cle:"La science dit ce qui est et ce qui est possible, pas ce qu'il faut faire.",
    probleme:"La physique nucléaire produit de l'électricité… et la bombe atomique. La génétique peut soigner… ou « fabriquer » des bébés sur mesure.",
    exemples:["1945 : Oppenheimer, qui a dirigé la fabrication de la bombe atomique, s'interroge ensuite sur la responsabilité des savants.","2018 : la naissance en Chine de bébés génétiquement modifiés est condamnée par la communauté scientifique."],
    refs:[{who:"Rabelais", work:"Pantagruel, 1532", idea:"« Science sans conscience n'est que ruine de l'âme. »"},
          {who:"Jonas", work:"Le Principe responsabilité, 1979", idea:"Notre pouvoir technique est devenu si grand que nous devons agir en pensant aux générations futures."}],
    resolution:"Ne pas freiner la recherche par principe, mais l'encadrer : comités d'éthique, lois de bioéthique, débat démocratique. La science éclaire les choix ; la société décide.",
    retenir:"Le possible n'est pas forcément le permis.",
    check:{q:"« Puisque la science le permet, il faut le faire. » Qu'objecterait Jonas ?", options:["Que notre pouvoir nous impose une responsabilité envers les générations futures","Que la science ne rend jamais rien de dangereux possible","Qu'il faut arrêter toute recherche scientifique"], answer:0, why:"Pour Jonas, plus notre pouvoir est grand, plus notre responsabilité l'est : il ne s'agit pas d'arrêter la science, mais de mesurer les conséquences de ce qu'elle rend possible."} }
];
MODULES.forEach(m => { m.check = prepQ(m.check); });

/* ---------- Contenu : glossaire (pré-entraînement) ---------- */
const GLOSS = [
  ["science",0,"Ensemble de connaissances organisées et cohérentes, obtenues par une méthode rigoureuse, qui vise l'objectivité et des lois générales."],
  ["opinion",1,"Croyance spontanée, non examinée, qui donne l'illusion de savoir. Elle répond vite pour rassurer."],
  ["expérience commune",1,"Observation spontanée et subjective de la vie quotidienne. Elle peut tromper (le Soleil qui « se lève »)."],
  ["expérimentation",1,"Expérience construite : artificielle (provoquée), précise (mesurée) et suivant un protocole reproductible."],
  ["obstacle épistémologique",1,"Chez Bachelard, ce qui freine la connaissance scientifique dans l'esprit même : opinion, première impression, habitudes."],
  ["rupture épistémologique",1,"Moment où la science se construit en rompant avec l'opinion ou avec une connaissance antérieure."],
  ["hypothèse",2,"Réponse provisoire à un problème, qu'il faut mettre à l'épreuve avant de l'accepter."],
  ["démarche hypothético-déductive",2,"Problème → hypothèse → déduction d'une conséquence testable → expérience → hypothèse éliminée ou retenue."],
  ["induction",3,"Raisonnement qui passe de cas particuliers observés à une loi générale."],
  ["problème de l'induction",3,"Des cas particuliers, même très nombreux, ne prouvent jamais qu'une loi générale est vraie (Hume)."],
  ["réfutabilité",3,"Chez Popper, une théorie est scientifique si l'on peut imaginer une expérience qui la montrerait fausse. Synonyme : falsifiabilité."],
  ["corroboration",3,"Une théorie qui a résisté à des tests sévères n'est pas prouvée : elle est corroborée, vraie « jusqu'à preuve du contraire »."],
  ["paradigme",4,"Chez Kuhn, cadre de pensée partagé par la communauté scientifique d'une époque (par exemple, le géocentrisme)."],

function head(x1, y1, x2, y2){
  const a = Math.atan2(y2 - y1, x2 - x1), s = 8;
  return x2 + "," + y2 + " " + (x2 - s * Math.cos(a - 0.45)) + "," + (y2 - s * Math.sin(a - 0.45)) + " " + (x2 - s * Math.cos(a + 0.45)) + "," + (y2 - s * Math.sin(a + 0.45));
}
function Arr({ pts, tone, dashed, label, lx, ly, anchor }){
  const n = pts.length, p1 = pts[n - 2], p2 = pts[n - 1];
  return html`<g className=${"arr" + (tone ? " t-" + tone : "")}>
    <polyline points=${pts.map(p => p.join(",")).join(" ")} fill="none" strokeDasharray=${dashed ? "5 4" : undefined}/>
    <polygon points=${head(p1[0], p1[1], p2[0], p2[1])}/>
    ${label ? html`<text x=${lx} y=${ly} textAnchor=${anchor || "middle"} className="al">${label}</text>` : null}
  </g>`;
}

  </g>`;
}

/* ---------- Composants communs ---------- */
function Bar({ value, total, tone }){
  const pct = total ? Math.round(100 * value / total) : 0;
  return html`<div className=${"bar" + (tone ? " " + tone : "")} role="progressbar" aria-valuenow=${value} aria-valuemin="0" aria-valuemax=${total}><span style=${{ width: pct + "%" }}></span></div>`;
}
function Why({ children }){ return html`<div className="why">${children}</div>`; }

function CheckBar({ checked, score, total, canCheck, onCheck, onReset, detail, setDetail }){
  if (!checked) return html`<div className="checkbar">
    <button className="btn primary" disabled=${!canCheck} onClick=${onCheck}>Vérifier</button>
    ${!canCheck ? html`<span className="hint">Réponds à tout pour vérifier.</span>` : null}
  </div>`;
  const tone = score === total ? "pos" : (score >= total / 2 ? "neu" : "neg");
  return html`<div className="checkbar">
    <span className=${"chip " + tone}><span className="score">${score} / ${total}</span></span>
    <button className="btn" onClick=${() => setDetail(!detail)} aria-expanded=${detail}>${detail ? "Masquer la correction détaillée" : "Voir la correction détaillée"}</button>
    <button className="btn ghost" onClick=${onReset}>Recommencer</button>
  </div>`;
}
function Feedback({ ok, answer, why, detail }){
  return html`<div className=${"fb " + (ok ? "ok" : "ko")}>
    <div className="line"><span className="mark">${ok ? "✓ Juste" : "✗ À revoir"}</span>${!ok && answer ? html`<span>Réponse attendue : <b>${answer}</b></span>` : null}</div>
    ${detail && why ? html`<${Why}><b>Pourquoi ? </b>${why}<//>` : null}
  </div>`;
}

function initialOrder(n){
  let o = shuffle([...Array(n).keys()]);
  let guard = 0;
  while (o.every((v, i) => v === i) && guard++ < 10) o = shuffle(o);
  return o;
}
function OrderEx({ ex, onResult }){
  const steps = ex.steps;
  const [order, setOrder] = useState(() => initialOrder(steps.length));
  const [checked, setChecked] = useState(false);
  const [detail, setDetail] = useState(false);
  const score = order.reduce((s, v, i) => s + (v === i ? 1 : 0), 0);
  const move = (i, d) => { const o = order.slice(); const j = i + d; if (j < 0 || j >= o.length) return; [o[i], o[j]] = [o[j], o[i]]; setOrder(o); };
  return html`<div className="ex-body">
    <ol className="orderlist">
      ${order.map((v, i) => html`<li key=${v} className=${checked ? (v === i ? "ok" : "ko") : ""}>
        <span className="pos">${i + 1}</span>
        <span>${steps[v].t}</span>
        <span className="mv">
          <button className="iconbtn" aria-label=${"Monter l'étape " + (i + 1)} disabled=${checked || i === 0} onClick=${() => move(i, -1)}><${Icon} name="up"/></button>
          <button className="iconbtn" aria-label=${"Descendre l'étape " + (i + 1)} disabled=${checked || i === order.length - 1} onClick=${() => move(i, 1)}><${Icon} name="down"/></button>
        </span>
      </li>`)}
    </ol>
    ${checked ? html`<div className=${"fb " + (score === steps.length ? "ok" : "ko")}>
      <div className="line"><span className="mark">${score === steps.length ? "✓ Ordre correct" : "✗ " + (steps.length - score) + " étape(s) mal placée(s)"}</span></div>
      ${detail ? html`<${Why}>
        <b>L'ordre de la démarche</b>
        <ol style=${{ margin:"6px 0 6px", paddingLeft:"20px" }}>${steps.map((s, i) => html`<li key=${i}><b>${s.st} : </b>${s.t}</li>`)}</ol>
        Le cœur de la démarche hypothético-déductive est l'enchaînement hypothèse → conséquence testable → expérimentation. Les hypothèses éliminées ne sont pas des échecs : elles réduisent le champ des causes possibles.
      <//>` : null}
    </div>` : null}
    <${CheckBar} checked=${checked} score=${score} total=${steps.length} canCheck=${true}
      onCheck=${() => { setChecked(true); onResult(ex.id, score, steps.length); }}
      onReset=${() => { setOrder(initialOrder(steps.length)); setChecked(false); setDetail(false); }} detail=${detail} setDetail=${setDetail}/>
  </div>`;
}

/* ---------- Flashcards ---------- */
function buildQueue(filters, boxes){
  const deck = CARDS.filter(c => (filters.cat === "all" || c.cat === filters.cat) && (filters.mod === "all" || c.m === +filters.mod) && (!filters.weak || (boxes[c.id] || 1) < 4));
  return shuffle(deck).sort((a, b) => (boxes[a.id] || 1) - (boxes[b.id] || 1)).map(c => c.id);
}
const BYID = {}; CARDS.forEach(c => { BYID[c.id] = c; });

function Flashcards({ boxes, setBoxes, initMod }){
  const [filters, setFilters] = useState({ cat:"all", mod: initMod === undefined ? "all" : String(initMod), weak:false });
  const [queue, setQueue] = useState(() => buildQueue(filters, boxes));
  const [i, setI] = useState(0);
  const [flip, setFlip] = useState(false);
  const [tally, setTally] = useState({ k:0, h:0, n:0 });
  const [confirmReset, setConfirmReset] = useState(false);
  const first = useRef(true);
  const restart = (f) => { setQueue(buildQueue(f || filters, boxes)); setI(0); setFlip(false); setTally({ k:0, h:0, n:0 }); };
  useEffect(() => { if (first.current){ first.current = false; return; } restart(filters); }, [filters.cat, filters.mod, filters.weak]);

  const card = BYID[queue[i]];
  const rate = (r) => {
    if (!card || !flip) return;
    const cur = boxes[card.id] || 1;
    const nb = r === "k" ? Math.min(5, cur + 1) : (r === "h" ? cur : 1);
    setBoxes(Object.assign({}, boxes, { [card.id]: nb }));
    setTally(Object.assign({}, tally, { [r]: tally[r] + 1 }));
    setI(i + 1); setFlip(false);
  };
  useEffect(() => {
    const onKey = (e) => {
      const tg = e.target && e.target.tagName;
      if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA" || tg === "BUTTON") return;
      if (e.key === " " || e.key === "Enter"){ if (card){ e.preventDefault(); setFlip(f => !f); } }
      else if (flip && e.key === "1") rate("n");
      else if (flip && e.key === "2") rate("h");
      else if (flip && e.key === "3") rate("k");
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const deckAll = CARDS.filter(c => (filters.cat === "all" || c.cat === filters.cat) && (filters.mod === "all" || c.m === +filters.mod));
  const perBox = [1,2,3,4,5].map(b => deckAll.filter(c => (boxes[c.id] || 1) === b).length);
  const mastered = perBox[3] + perBox[4];
  const setF = (k, v) => setFilters(Object.assign({}, filters, { [k]: v }));

  return html`<div className="page">
    <div className="page-head">
      <span className="eyebrow">Étape 3 · Mémoriser</span>
      <h1>Flashcards</h1>
      <p className="lead">Essaie de répondre de tête avant de retourner la carte : c'est l'effort de rappel qui fixe la mémoire. Les cartes que tu connais montent de boîte et reviennent moins souvent ; celles que tu rates retournent en boîte 1.</p>
    </div>
    <div className="card card-pad filters">
      <div className="frow"><span className="flab">Type</span>
        ${["all"].concat(CATS).map(c => html`<button key=${c} className=${"pill" + (filters.cat === c ? " on" : "")} aria-pressed=${filters.cat === c} onClick=${() => setF("cat", c)}>${c === "all" ? "Toutes" : c + "s"}</button>`)}
      </div>
      <div className="frow"><label className="flab" htmlFor="fc-mod">Module</label>
        <select id="fc-mod" style=${{ maxWidth:"340px" }} value=${filters.mod} onChange=${e => setF("mod", e.target.value)}>
          <option value="all">Tous les modules</option>
          ${MODULES.map((m, k) => html`<option key=${k} value=${String(k)}>${k + 1}. ${m.short}</option>`)}
        </select>
        <label className="switch" htmlFor="fc-weak"><input type="checkbox" id="fc-weak" checked=${filters.weak} onChange=${e => setF("weak", e.target.checked)}/><span className="track"></span>Seulement les cartes à retravailler</label>
      </div>
    </div>
    <div className="fc-wrap">
      <div style=${{ display:"flex", flexDirection:"column", gap:"12px" }}>
        ${card ? html`
          <div className="row" style=${{ justifyContent:"space-between" }}>
            <span className="counter">Carte ${i + 1} / ${queue.length}</span>
            <span className="counter">Boîte ${boxes[card.id] || 1} / 5</span>
          </div>
          <button className=${"flash" + (flip ? " flipped" : "")} onClick=${() => setFlip(!flip)} aria-label=${flip ? "Carte retournée : réponse affichée. Cliquer pour revoir la question." : "Cliquer pour retourner la carte"}>
            <div className="flash-inner">
              <div className="face front" aria-hidden=${flip}>
                <div className="top"><span className="chip acc">${card.cat}</span><span className="chip">${card.m + 1}. ${MODULES[card.m].short}</span></div>
                <p className=${"front-t" + (card.quote ? " quote" : "")}>${card.front}</p>
                <p className="ask">${card.ask}</p>
                <p className="hint">Clique ou appuie sur <span className="kbd">Espace</span> pour retourner.</p>
              </div>
              <div className="face back" aria-hidden=${!flip}>
                <div className="top"><span className="chip acc">${card.cat}</span><span className="chip"><b>${card.front.length > 60 ? card.front.slice(0, 57) + "…" : card.front}</b></span></div>
                <p className="back-t">${card.back}</p>
                <p className="hint">Évalue-toi honnêtement ci-dessous (<span className="kbd">1</span> <span className="kbd">2</span> <span className="kbd">3</span>).</p>
              </div>
            </div>
          </button>
          <div className="rate">
            <button className="btn neg" disabled=${!flip} onClick=${() => rate("n")}>Je ne savais pas<small>retour en boîte 1</small></button>
            <button className="btn neu" disabled=${!flip} onClick=${() => rate("h")}>J'ai hésité<small>reste dans sa boîte</small></button>
            <button className="btn pos" disabled=${!flip} onClick=${() => rate("k")}>Je savais<small>boîte suivante</small></button>
          </div>` : html`
          <div className="card card-pad done-card">
            <h3 style=${{ fontSize:"18px" }}>${queue.length ? "Session terminée" : "Aucune carte à retravailler ici"}</h3>
            ${queue.length ? html`<div className="tally">
              <span className="chip pos">Je savais : <b>${tally.k}</b></span>
              <span className="chip neu">Hésitations : <b>${tally.h}</b></span>
              <span className="chip neg">À revoir : <b>${tally.n}</b></span>
            </div>
            <p className="lead">Reviens demain : réviser un peu chaque jour est plus efficace qu'une longue séance.</p>` : html`<p className="lead">Toutes les cartes de cette sélection sont en boîte 4 ou 5. Désactive le filtre pour réviser l'ensemble.</p>`}
            <div className="row">
              <button className="btn primary" onClick=${() => { const f = Object.assign({}, filters, { weak:true }); if (filters.weak) restart(f); else setFilters(f); }}>Revoir les cartes à retravailler</button>
              <button className="btn" onClick=${() => { const f = Object.assign({}, filters, { weak:false }); if (!filters.weak) restart(f); else setFilters(f); }}>Nouvelle session complète</button>
            </div>
          </div>`}
      </div>
      <aside className="card card-pad leitner" aria-label="Boîtes de Leitner">
        <h3 style=${{ fontSize:"15px" }}>Tes boîtes</h3>
        ${perBox.map((n, b) => html`<div key=${b} className="lbox"><span>Boîte ${b + 1}</span><${Bar} value=${n} total=${deckAll.length} tone=${b >= 3 ? "pos" : ""}/><span className="c">${n}</span></div>`)}
        <div className="bar-l"><span>Maîtrisées (boîtes 4-5)</span><span><b>${mastered}</b> / ${deckAll.length}</span></div>
        <p className="hint" style=${{ fontSize:"12.5px", color:"var(--muted)" }}>Ta progression reste enregistrée dans ce navigateur.</p>
        ${confirmReset ? html`<div className="confirm"><span>Tout remettre en boîte 1 ?</span><button className="btn neg small" onClick=${() => { setBoxes({}); setConfirmReset(false); restart(filters); }}>Oui, réinitialiser</button><button className="btn small" onClick=${() => setConfirmReset(false)}>Annuler</button></div>` :
          html`<button className="btn ghost small" onClick=${() => setConfirmReset(true)}>Réinitialiser ma progression</button>`}
      </aside>
    </div>
  </div>`;
}

/* ---------- Mots-clés ---------- */
function Glossary(){
  const [q, setQ] = useState("");
  const [test, setTest] = useState(false);
  const [open, setOpen] = useState({});
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const items = GLOSS.filter(g => !q || norm(g.t + " " + g.d).includes(norm(q)));
  return html`<div className="page">
    <div className="page-head">
      <span className="eyebrow">Étape 1 · Pré-requis</span>
      <h1>Mots-clés</h1>
      <p className="lead">Lis ces ${GLOSS.length} mots avant les modules : connaître le vocabulaire d'abord libère de l'attention pour comprendre les idées ensuite. En mode test, cache les définitions et essaie de les retrouver.</p>
    </div>
    <div className="toolrow">
      <input className="search" type="search" id="gloss-q" aria-label="Rechercher un mot-clé" placeholder="Rechercher un mot ou une idée…" value=${q} onChange=${e => setQ(e.target.value)}/>
      <label className="switch" htmlFor="gloss-test"><input type="checkbox" id="gloss-test" checked=${test} onChange=${e => { setTest(e.target.checked); setOpen({}); }}/><span className="track"></span>Mode test</label>
    </div>
    <div className="card">
      ${MODULES.map((m, k) => {
        const list = items.filter(g => g.m === k);
        if (!list.length) return null;
        return html`<div key=${k} className="gloss-group">
          <h3>${k + 1}. ${m.short}</h3>
          <dl className="gloss">${list.map(g => html`<div key=${g.t} className="it">
            <dt>${g.t}</dt>
            ${test && !open[g.t] ? html`<dd><button className="reveal" onClick=${() => setOpen(Object.assign({}, open, { [g.t]: true }))}>Afficher la définition</button></dd>` : html`<dd>${g.d}</dd>`}
          </div>`)}</dl>
        </div>`;
      })}
      ${!items.length ? html`<p className="card-pad lead">Aucun mot ne correspond à « ${q} ».</p>` : null}
    </div>
  </div>`;
}

/* ---------- Modules ---------- */
function QuickCheck({ c }){
  const [sel, setSel] = useState(null);
  const done = sel !== null;
  return html`<div className="card card-pad qc">
    <span className="eyebrow">Vérifie-toi</span>
    <p className="qtext">${c.q}</p>
    <div className="opts">
      ${c.options.map((o, j) => {
        let st = "";
        if (done){ if (j === c.answer) st = " ok"; else if (j === sel) st = " ko"; }
        return html`<button key=${j} className=${"opt" + st + (done ? " dis" : "")} disabled=${done} onClick=${() => setSel(j)}><span>${o}</span></button>`;
      })}
    </div>
    ${done ? html`<div className=${"fb " + (sel === c.answer ? "ok" : "ko")}>
      <div className="line"><span className="mark">${sel === c.answer ? "✓ Juste" : "✗ Pas tout à fait"}</span></div>
      <${Why}>${c.why}<//>
      <div><button className="btn ghost small" onClick=${() => setSel(null)}>Réessayer</button></div>
    </div>` : null}
  </div>`;
}

function ModuleView({ idx, setIdx, onCards, seen }){
  const m = MODULES[idx];
  const D = DIAGRAMS[idx];
  const nCards = CARDS.filter(c => c.m === idx).length;
  return html`<div className="page">
    <div className="rail" role="tablist" aria-label="Modules">
      ${MODULES.map((mm, k) => html`<button key=${k} role="tab" aria-selected=${k === idx} className=${k === idx ? "on" : ""} onClick=${() => setIdx(k)}>${k + 1}${seen[mm.id] ? " ✓" : ""}</button>`)}
    </div>
    <div className="page-head">
      <span className="eyebrow">Étape 2 · Comprendre — module ${idx + 1} / ${MODULES.length}</span>
      <h1>${m.question}</h1>
      <span className="tension">Tension : <span className="ab">${m.a}</span>↔<span className="ab">${m.b}</span></span>
    </div>
    <div className="key"><span className="lab">IDÉE CLÉ</span><p>${m.cle}</p></div>
    <div className="mod-grid">
      <div className="mod-text">
        <div className="blk pb"><h4>Le problème</h4><p>${m.probleme}</p></div>
        <div className="blk ex"><h4>Exemples</h4><ul>${m.exemples.map((e, k) => html`<li key=${k}>${e}</li>`)}</ul></div>
        <div className="blk au"><h4>Auteurs et repères</h4>${m.refs.map((r, k) => html`<div key=${k} className="auth"><span className="who">${r.who} <em>· ${r.work}</em></span><span>${r.idea}</span></div>`)}</div>
        <div className="blk rs"><h4>Pour réduire la tension</h4><p>${m.resolution}</p></div>
      </div>
      <div className="sticky">
        <${D}/>
        <div className="retenir"><b>À RETENIR</b><span>${m.retenir}</span></div>
        <div className="legend" aria-hidden="true">
          <span><i style=${{ background:"var(--neu)" }}></i>problème</span>
          <span><i style=${{ background:"var(--accent)" }}></i>auteurs</span>
          <span><i style=${{ background:"var(--pos)" }}></i>solution</span>
        </div>
      </div>
    </div>
    <${QuickCheck} key=${m.id} c=${m.check}/>
    <div className="mod-nav">
      <button className="btn" disabled=${idx === 0} onClick=${() => setIdx(idx - 1)}>← Module précédent</button>
      <button className="btn ghost" onClick=${() => onCards(idx)}>Réviser les ${nCards} cartes de ce module</button>
      <button className="btn primary" disabled=${idx === MODULES.length - 1} onClick=${() => setIdx(idx + 1)}>Module suivant →</button>
    </div>
  </div>`;
}

/* ---------- Accueil ---------- */
function Home({ go, stats }){
  const steps = [
    { n:1, v:"mots-cles", t:"Mots-clés", d:"Le vocabulaire de base, à lire en premier (5 minutes).", val:null },
    { n:2, v:"comprendre", t:"Comprendre", d:"Neuf modules courts : une tension, un schéma, une solution.", val:[stats.seen, MODULES.length, "modules lus"] },
    { n:3, v:"flashcards", t:"Mémoriser", d:CARDS.length + " flashcards avec répétition espacée (boîtes de Leitner).", val:[stats.mastered, CARDS.length, "cartes maîtrisées"] },
    { n:4, v:"exercices", t:"S'entraîner", d:"Cinq niveaux, de la définition à la dissertation, avec corrigés.", val:[stats.exDone, EX_ALL.length, "exercices faits"] }
  ];
  const principles = [
    ["Les mots avant les idées","Le vocabulaire appris d'abord laisse de la place pour comprendre."],
    ["Une tension par module","Des blocs courts, à ton rythme, plutôt qu'un long cours d'une traite."],
    ["Texte et schéma côte à côte","Lire et voir en même temps, sans chercher l'un loin de l'autre."],
    ["Des couleurs qui ont un sens","Orange pour le problème, bleu pour les auteurs, vert pour la solution."],
    ["Se tester plutôt que relire","Chercher la réponse de tête fixe mieux que relire ses notes."],
    ["Du guidé à l'autonome","Exemple commenté, puis exercice à trous, puis rédaction seul."]
  ];
  return html`<div className="page">
    <div className="page-head">
      <span className="eyebrow">Philosophie · Terminale · Notion : la science</span>
      <h1>La science en philosophie</h1>
      <p className="lead">Comprendre les tensions liées à la science, mémoriser les auteurs et les concepts, puis les utiliser en dissertation. Suis les quatre étapes dans l'ordre la première fois.</p>
    </div>
    <div className="steps">
      ${steps.map(s => html`<div key=${s.n} className="card step">
        <span className="num">${s.n}</span>
        <h3>${s.t}</h3>
        <p>${s.d}</p>
        ${s.val ? html`<div style=${{ display:"flex", flexDirection:"column", gap:"4px" }}><${Bar} value=${s.val[0]} total=${s.val[1]} tone=${s.val[0] === s.val[1] ? "pos" : ""}/><div className="bar-l"><span>${s.val[2]}</span><span>${s.val[0]} / ${s.val[1]}</span></div></div>` : html`<div className="bar-l"><span>${GLOSS.length} mots-clés</span></div>`}
        <button className=${"btn" + (s.n === 1 && stats.seen === 0 ? " primary" : "")} onClick=${() => go(s.v)}>Ouvrir</button>
      </div>`)}
    </div>
    <section className="card">
      <div className="card-h"><h3>Comment cet outil t'aide à apprendre</h3></div>
      <ul className="principles card-pad">
        ${principles.map((p, i) => html`<li key=${i}><span className="dot"></span><span><b>${p[0]}</b><span className="m">${p[1]}</span></span></li>`)}
      </ul>
    </section>
    <section className="card card-pad" style=${{ display:"flex", flexDirection:"column", gap:"8px" }}>
      <h3 style=${{ fontSize:"16px" }}>L'idée centrale de toute la notion</h3>
      <p>La science n'est pas une collection de vérités définitives : c'est une méthode pour corriger nos erreurs. Ce qui la rend fiable, ce n'est pas d'avoir toujours raison, mais d'organiser sa propre remise en question.</p>
    </section>
  </div>`;
}

/* ---------- Application ---------- */
const VIEWS = ["accueil","mots-cles","comprendre","flashcards","exercices"];
const NAV = [
  { id:"accueil", label:"Accueil", icon:"home" },
  { id:"mots-cles", label:"Mots-clés", icon:"tag" },
  { id:"comprendre", label:"Comprendre", icon:"book" },
  { id:"flashcards", label:"Flashcards", icon:"cards" },
  { id:"exercices", label:"Exercices", icon:"check" }
];
function readHash(){ try { const h = (window.location.hash || "").slice(1); return VIEWS.indexOf(h) >= 0 ? h : "accueil"; } catch(e){ return "accueil"; } }

function App(){
  const [view, setView] = useState(readHash);
  const [boxes, setBoxes] = usePersist("sci.boxes", {});
  const [exRes, setExRes] = usePersist("sci.ex", {});
  const [seen, setSeen] = usePersist("sci.seen", {});
  const [modIdx, setModIdx] = usePersist("sci.mod", 0);
  const [fcMod, setFcMod] = useState(undefined);
  const [fcKey, setFcKey] = useState(0);
  const mainRef = useRef(null);

  useEffect(() => {
    const f = () => setView(readHash());
    window.addEventListener("hashchange", f);
    return () => window.removeEventListener("hashchange", f);
  }, []);
  useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [view, modIdx]);
  useEffect(() => { if (view === "comprendre"){ const id = MODULES[modIdx].id; if (!seen[id]) setSeen(Object.assign({}, seen, { [id]: true })); } }, [view, modIdx]);

  const go = (v) => { if (v !== "flashcards") setFcMod(undefined); setView(v); try { if (window.location.hash !== "#" + v) window.location.hash = v; } catch(e){} };
  const openModule = (k) => { setModIdx(k); go("comprendre"); };
  const onCards = (k) => { setFcMod(k); setFcKey(fcKey + 1); setView("flashcards"); try { window.location.hash = "flashcards"; } catch(e){} };
  const onResult = (id, s, t) => setExRes(prev => Object.assign({}, prev, { [id]: { s, t } }));

  const stats = {
    seen: MODULES.filter(m => seen[m.id]).length,
    mastered: CARDS.filter(c => (boxes[c.id] || 1) >= 4).length,
    exDone: EX_ALL.filter(e => exRes[e.id]).length
  };
  const idx = Math.min(Math.max(0, modIdx | 0), MODULES.length - 1);

  let content;
  if (view === "mots-cles") content = html`<${Glossary}/>`;
  else if (view === "comprendre") content = html`<${ModuleView} idx=${idx} setIdx=${setModIdx} onCards=${onCards} seen=${seen}/>`;
  else if (view === "flashcards") content = html`<${Flashcards} key=${"fc" + fcKey} boxes=${boxes} setBoxes=${setBoxes} initMod=${fcMod}/>`;
  else if (view === "exercices") content = html`<${Exercises} exRes=${exRes} onResult=${onResult}/>`;
  else content = html`<${Home} go=${go} stats=${stats}/>`;

  return html`<div className="app">
    <header className="toolbar">
      <div className="appname"><${Icon} name="logo" size=${20}/><span>La science <small>· Philosophie Terminale</small></span></div>
      <span className="spacer"></span>
      <div className="stats" aria-label="Progression">
        <span className="chip">Modules <b>${stats.seen}/${MODULES.length}</b></span>
        <span className="chip">Cartes maîtrisées <b>${stats.mastered}/${CARDS.length}</b></span>
        <span className="chip">Exercices <b>${stats.exDone}/${EX_ALL.length}</b></span>
      </div>
    </header>
    <div className="body">
      <nav className="sidebar" aria-label="Navigation">
        <div className="side-h">Parcours</div>
        <div className="nav">
          ${NAV.map(n => html`<div key=${n.id} style=${{ display:"contents" }}>
            <button className=${"nav-item" + (view === n.id ? " on" : "")} aria-current=${view === n.id ? "page" : undefined} onClick=${() => go(n.id)}>
              <${Icon} name=${n.icon}/><span>${n.label}</span>
              ${n.id === "comprendre" ? html`<span className="count">${stats.seen}/${MODULES.length}</span>` : null}
              ${n.id === "flashcards" ? html`<span className="count">${CARDS.length}</span>` : null}
              ${n.id === "exercices" ? html`<span className="count">${stats.exDone}/${EX_ALL.length}</span>` : null}
            </button>
            ${n.id === "comprendre" && view === "comprendre" ? html`<div className="subnav">
              ${MODULES.map((m, k) => html`<button key=${k} className=${k === idx ? "on" : ""} onClick=${() => openModule(k)}><span className="n">${k + 1}</span><span>${m.short}</span>${seen[m.id] ? html`<span className="seen" aria-label="lu">✓</span>` : null}</button>`)}
            </div>` : null}
          </div>`)}
        </div>
      </nav>
      <main className="main" ref=${mainRef}>${content}</main>
    </div>
  </div>`;
}

window.__SCI_APP__ = App;
const rootEl = typeof document !== "undefined" && document.getElementById("root");
if (rootEl && ReactDOM.createRoot) ReactDOM.createRoot(rootEl).render(html`<${App}/>`);
})();
</script>
</body>
</html>
