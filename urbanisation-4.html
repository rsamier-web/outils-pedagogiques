<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réviser : espaces et paysages de l’urbanisation (4e)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#edf1ee; --surface:#ffffff; --surface2:#f5f8f6; --ink:#1b2733; --muted:#5a6772; --line:#d3dcd7;
  --accent:#1e6f78; --accent-ink:#ffffff; --accentsoft:#dcecec;
  --centre:#e0553a; --proche:#f2b632; --peri:#9a7fd0; --axe:#2b2f33;
  --ok:#2f7d4f; --okbg:#e2f2e7; --ko:#b8322a; --kobg:#fae3e0;
  --sky:#dcebf3; --land:#dfe6dc; --sea:#cfe3ec; --coast:#9fb1a8;
  --fs:17px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131a1f; --surface:#1b242b; --surface2:#222d35; --ink:#e6ecef; --muted:#9fb0ba; --line:#33424c;
    --accent:#5fb7c0; --accent-ink:#0e1a1f; --accentsoft:#1e3a3f; --axe:#dfe6ea;
    --ok:#6fcf97; --okbg:#17352a; --ko:#ff8a80; --kobg:#3d1f1d;
    --sky:#24343f; --land:#3b4a44; --sea:#1b2b35; --coast:#5d6e68;
  }
}
:root[data-theme="dark"]{
  --paper:#131a1f; --surface:#1b242b; --surface2:#222d35; --ink:#e6ecef; --muted:#9fb0ba; --line:#33424c;
  --accent:#5fb7c0; --accent-ink:#0e1a1f; --accentsoft:#1e3a3f; --axe:#dfe6ea;
  --ok:#6fcf97; --okbg:#17352a; --ko:#ff8a80; --kobg:#3d1f1d;
  --sky:#24343f; --land:#3b4a44; --sea:#1b2b35; --coast:#5d6e68;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.big{--fs:20px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:var(--fs);line-height:1.55}
html.spaced body{letter-spacing:.04em;word-spacing:.14em;line-height:1.85}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.15}
h1{font-size:1.55rem;margin:0;font-weight:800}
h2{font-size:1.45rem;margin:0 0 10px;font-weight:800}
h3{font-size:1.1rem;margin:22px 0 8px}
h4{font-size:1rem;margin:0 0 6px}
p{margin:0 0 10px}

header.top{max-width:1060px;margin:0 auto;padding:18px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{width:46px;height:46px;flex:none}
.sub{color:var(--muted);font-size:.9em;margin:2px 0 0}
.tools{display:flex;gap:6px}
.tools button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85em}
.tools button[aria-pressed="true"]{border-color:var(--accent);background:var(--accentsoft)}

nav.mods{max-width:1060px;margin:0 auto;padding:8px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.mods button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9em}
nav.mods button[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tick{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;font-weight:700}

main{max-width:1060px;margin:0 auto;padding:6px 16px 60px;outline:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
@media (max-width:600px){.panel{padding:16px 14px;border-radius:12px}}
.lead{font-size:1.02em}
.muted{color:var(--muted)}
.label{font-weight:700;font-size:.88em;color:var(--muted);margin:0 0 6px}
.counter{color:var(--muted);font-size:.9em;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}

.btn{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 14px;font-size:.92em}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.btn:disabled{cursor:default}
.btn:disabled:not(.ok):not(.ko){opacity:.4}

.rappel{background:var(--accentsoft);border-radius:12px;padding:10px 16px;margin:0 0 18px}
.rappel summary{cursor:pointer;font-weight:700}
.rappel ul{margin:10px 0 4px;padding-left:1.2em}
.rappel li{margin:4px 0}

.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.steps button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.9em}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accentsoft);font-weight:700}
.steps .sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.8em;font-weight:700}
.steps .sn.d{background:var(--ok);color:#fff}
.nextrow{display:flex;justify-content:flex-end;margin-top:24px;border-top:1px solid var(--line);padding-top:16px}

/* placement */
.pl-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:780px){.pl-layout{grid-template-columns:1fr}}
.figwrap{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.figwrap svg{display:block;width:100%;height:auto}
.figwrap.wide svg{min-width:620px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;font-size:.92em;line-height:1.35}
.chip:hover{border-color:var(--accent)}
.chip.sel{border-color:var(--accent);background:var(--accentsoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.legend{display:block}
.lrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;font-size:.82em}
.sw{flex:none;display:grid;place-items:center;width:42px}
.sw svg{width:42px;height:24px;display:block}
.lname{flex:none;width:7.2em;font-weight:700;font-size:.88em}
.slot{flex:1;min-height:40px;text-align:left;border:1.5px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.92em;line-height:1.35}
.slot.filled{border-style:solid;color:var(--ink);background:var(--surface2)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ink)}
.slot.ko{border-style:solid;border-color:var(--ko);background:var(--kobg);color:var(--ink)}
.slot.shown{border-style:solid;border-color:var(--accent);background:var(--accentsoft);color:var(--ink)}
.msg{min-height:1.5em;font-weight:700;margin:12px 0 0}
.fb{margin:4px 0 10px;padding:8px 12px;border-radius:8px;font-size:.92em}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.ko{background:var(--kobg);border-left:4px solid var(--ko)}
.why{margin:2px 0 8px 34px;font-size:.88em;color:var(--muted)}
.why summary{cursor:pointer}
.why p{margin:4px 0 0}

/* svg */
svg text{font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
[data-t],[data-c]{cursor:pointer}
.z{stroke:var(--surface2);stroke-width:2}
.c-centre{fill:var(--centre)} .c-proche{fill:var(--proche)} .c-peri{fill:var(--peri)}
.road{stroke:var(--axe);stroke-width:7;stroke-linecap:round;fill:none}
.sw-road{stroke-width:5}
.hit{stroke:transparent;stroke-width:26;fill:none}
.arrow{stroke:var(--axe);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bldg{fill:#3c4f63} .win{fill:#cfe0ea}
.fence{fill:var(--surface);fill-opacity:.9;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.house{fill:var(--ink)} .treec{fill:#3f8f4f}
.shack{fill:#a07a52;stroke:#5a432c;stroke-width:.8}
.badge circle{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.badge text{font-weight:700;font-size:13px;fill:var(--ink);pointer-events:none}
.mbadge circle{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.mbadge text{font-weight:700;font-size:6px;fill:var(--ink);pointer-events:none}
.badge.filled circle,.mbadge.filled circle{fill:var(--accentsoft);stroke:var(--accent)}
.badge.ok circle,.mbadge.ok circle{fill:var(--okbg);stroke:var(--ok)}
.badge.ko circle,.mbadge.ko circle{fill:var(--kobg);stroke:var(--ko)}
.badge.shown circle,.mbadge.shown circle{fill:var(--accentsoft);stroke:var(--accent)}
.hl{filter:drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 2px var(--accent))}
.sky{fill:var(--sky)} .far{fill:#b7b2c9} .farwin{fill:#e9e6f2} .tower{fill:#5f7f99} .towin{fill:#d3e3ed}
.asphalt{fill:#3a3f44} .lane{stroke:#f4f4f4;stroke-width:1.5;stroke-dasharray:8 6} .car{fill:#e0553a} .car2{fill:#f2b632}
.lawn{fill:#9cc98f} .tree{fill:#3f8f4f} .tree2{fill:#2f7442} .trunk{fill:#6b4b2e}
.sea{fill:var(--sea)} .cont{fill:var(--land);stroke:var(--coast);stroke-width:.35;stroke-linejoin:round}
.cont.ok{stroke:var(--ok);stroke-width:1.1} .cont.ko{stroke:var(--ko);stroke-width:1.1}
.clabel{font-weight:700;font-size:6px;fill:#1b2733;paint-order:stroke;stroke:#ffffff;stroke-width:1.8px;pointer-events:none}
.grid{stroke:var(--line);stroke-width:1} .grid.strong{stroke:var(--muted);stroke-width:1}
.ax{font-size:10px;fill:var(--muted)}
.curve{fill:none;stroke:var(--accent);stroke-width:3}
.curve.dash{stroke-dasharray:6 5}
.pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.bar{fill:var(--accent)} .bname{font-size:11px;fill:var(--ink);font-weight:700} .bval{font-size:10.5px;fill:var(--ink)}
.bgrow{font-size:10.5px;font-weight:700;fill:var(--ok)}

/* palette */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.pbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.92em}
.pbtn .dot{width:22px;height:16px;border-radius:4px;border:1px solid var(--muted)}
.pbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accentsoft)}
.databox{margin:0 0 12px;font-size:.92em}
.databox summary{cursor:pointer;color:var(--accent);font-weight:700}

/* flash & match */
.flash{display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center;width:100%;max-width:560px;min-height:230px;margin:10px auto;border:2px solid var(--line);border-radius:18px;background:var(--surface2);cursor:pointer;padding:26px;text-align:center}
.flash.flipped{border-color:var(--accent);background:var(--accentsoft)}
.flash .term{font-family:'Bricolage Grotesque',sans-serif;font-size:1.7em;font-weight:800;line-height:1.1}
.flash .term.small{font-size:1.1em}
.flash .def{font-size:1.05em;max-width:34em}
.flash .ex{color:var(--muted);font-size:.9em}
.flash .tap{color:var(--muted);font-size:.85em}
.center{justify-content:center}
.terms{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.defs{display:grid;gap:8px}
.mitem{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.93em;line-height:1.4}
.mitem.t{font-weight:700}
.mitem.sel{border-color:var(--accent);background:var(--accentsoft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mitem.ok{border-color:var(--ok);background:var(--okbg);opacity:.6;cursor:default}
.mitem.bad{border-color:var(--ko);background:var(--kobg)}
.mitem.hint{border-color:var(--accent);border-style:dashed}

/* questions */
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--surface)}
.stmt{font-weight:700;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 12px;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.dim{opacity:.55}
.cq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:780px){.cq{grid-template-columns:1fr}}
.cq .q:first-child{margin-top:0}
.ta{width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--surface2);padding:8px 10px;margin:0 0 8px;resize:vertical}
.done-box{border:2px solid var(--ok);background:var(--okbg);border-radius:12px;padding:14px 16px;margin:16px 0}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 0 14px}
.progress i{display:block;height:100%;background:var(--accent)}

/* mind map */
.mindmap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.mindmap{grid-template-columns:1fr}}
.mm-center{grid-column:1/-1;justify-self:center;background:var(--ink);color:var(--paper);padding:10px 22px;border-radius:999px;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;font-size:1.1em}
.mm-branch{border:1.5px solid var(--line);border-top:6px solid var(--bc);border-radius:12px;padding:12px;background:var(--surface)}
.mm-branch .fixed{display:block;padding:7px 10px;border-radius:8px;background:var(--surface2);margin:6px 0;font-size:.92em}
.mm-branch .slot{display:block;width:100%;margin:6px 0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;margin:0 0 22px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:1.9rem}
.how{margin:0;padding-left:1.1em}
.how li{margin:6px 0}
.hero svg{width:100%;max-width:300px;justify-self:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--surface2);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mcard:hover{border-color:var(--accent)}
.mcard .mt{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.08em}
.mcard .md{color:var(--muted);font-size:.9em}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.flash{transition:background .2s,border-color .2s}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" type="button" id="home-btn" aria-label="Retour à l’accueil">
    <svg viewBox="0 0 46 46" aria-hidden="true"><ellipse cx="23" cy="23" rx="22" ry="19" fill="#9a7fd0"/><circle cx="23" cy="23" r="11" fill="#f2b632"/><circle cx="23" cy="23" r="5" fill="#e0553a"/><path d="M30 14 L42 3" stroke="#2b2f33" stroke-width="3" stroke-linecap="round"/><path d="M16 32 L6 44" stroke="#2b2f33" stroke-width="3" stroke-linecap="round"/></svg>
    <span><h1>Espaces et paysages de l’urbanisation</h1><p class="sub">Révisions de géographie, 4e, thème 1</p></span>
  </button>
  <div class="tools">
    <button type="button" id="t-big" aria-pressed="false">A+ texte plus grand</button>
    <button type="button" id="t-sp" aria-pressed="false">Espacer les lettres</button>
  </div>
</header>
<nav class="mods" id="nav" aria-label="Modules"></nav>
<main id="app" tabindex="-1"></main>

<script>
'use strict';
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);if(a)for(const k in a){const v=a[k];if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const x of c.flat(3)){if(x==null||x===false)continue;e.append(x.nodeType?x:String(x));}return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function chunk(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;}
const STORE='revision-urbanisation-4e-v1';
let S={done:{},mod:'home',step:{},big:false,spaced:false};
try{const raw=localStorage.getItem(STORE);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}
let refreshStepper=()=>{};
function markDone(k){if(!S.done[k]){S.done[k]=true;save();renderNav();refreshStepper();}}

/* ---------- contenus ---------- */
const VOCAB=[
{t:'Métropole',d:'Très grande ville qui concentre des habitants, des activités et des pouvoirs de décision.',ex:'Los Angeles, São Paulo, Tokyo'},
{t:'CBD',d:'Central Business District : le quartier des affaires, avec ses gratte-ciel, ses banques et ses sièges d’entreprises.',ex:'Downtown à Los Angeles, La Défense à Paris'},
{t:'Aire urbaine',d:'L’agglomération plus sa couronne périurbaine : toute la zone qui vit au rythme de la ville.',ex:'Aire urbaine de Los Angeles : 18,8 millions d’habitants'},
{t:'Périphérie',d:'Les espaces situés autour du centre-ville.',ex:'Les banlieues de Los Angeles, les favelas de São Paulo'},
{t:'Étalement urbain',d:'Extension de la ville sur des espaces de plus en plus vastes, souvent au détriment des terres agricoles.',ex:'Los Angeles s’étend jusqu’à 80 km vers l’est'},
{t:'Banlieue pavillonnaire',d:'Quartier de périphérie fait de maisons individuelles avec jardin.',ex:'Les banlieues de Los Angeles ou de Londres'},
{t:'Lotissement',d:'Ensemble de maisons semblables construites en même temps sur un terrain découpé en parcelles.',ex:'Les lotissements uniformes de Los Angeles'},
{t:'Edge city',d:'Centre secondaire de périphérie, avec de grands immeubles de bureaux, le long des autoroutes.',ex:'Les pôles de bureaux autour de Los Angeles'},
{t:'Mall',d:'Grand centre commercial de périphérie, où l’on va en voiture.',ex:'Les malls le long des autoroutes de Los Angeles'},
{t:'Gated community',d:'Quartier résidentiel fermé et surveillé, réservé à des habitants aisés.',ex:'Hidden Hills, à l’ouest de Los Angeles'},
{t:'Gentrification',d:'Installation de populations aisées dans un quartier populaire rénové ; les habitants les plus pauvres doivent partir.',ex:'Des quartiers du centre de São Paulo'},
{t:'Favela',d:'Nom donné au Brésil aux bidonvilles : quartiers d’habitat informel et précaire.',ex:'Paraisópolis, à São Paulo'},
{t:'Bidonville',d:'Quartier d’habitat précaire construit sans autorisation, souvent sans eau courante ni électricité.',ex:'Les favelas, le township d’Alexandra'},
{t:'Condominio fechado',d:'Au Brésil, résidence fermée et sécurisée où vivent les plus riches.',ex:'Les résidences sécurisées de São Paulo'},
{t:'Pays émergent',d:'Pays dont l’économie grandit vite, mais où les inégalités restent fortes.',ex:'Le Brésil, la Chine, l’Inde'},
{t:'Taux d’urbanisation',d:'Part de la population qui vit en ville, en pourcentage.',ex:'56 % dans le monde en 2020'},
{t:'Fragmentation urbaine',d:'Division de la ville en quartiers très différents qui se côtoient sans se mélanger.',ex:'Sandton, quartier riche, à côté du township d’Alexandra'},
{t:'Ségrégation sociale',d:'Séparation des habitants dans l’espace selon leurs revenus.',ex:'Les riches dans les quartiers fermés, les pauvres dans les bidonvilles'}

function P(cx,cy,r,deg){const a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arrowD(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),L=10;const f=n=>n.toFixed(1);return`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}M${f(x2-L*Math.cos(a-0.45))} ${f(y2-L*Math.sin(a-0.45))}L${f(x2)} ${f(y2)}L${f(x2-L*Math.cos(a+0.45))} ${f(y2-L*Math.sin(a+0.45))}`;}
function badge(id,n,x,y){return`<g class="badge" data-t="${id}" data-badge="${id}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12"/><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}" text-anchor="middle">${n}</text></g>`;}

function concentric(o){
  const cx=210,cy=160,ang=[-113,-31,115];
  let s=`<svg viewBox="0 0 420 320" role="img" aria-label="${o.aria}">`;
  s+=`<ellipse data-t="${o.ids[0]}" class="z c-peri" cx="${cx}" cy="${cy}" rx="178" ry="138"/>`;
  s+=`<circle data-t="${o.ids[1]}" class="z c-proche" cx="${cx}" cy="${cy}" r="80"/>`;
  s+=`<circle data-t="${o.ids[2]}" class="z c-centre" cx="${cx}" cy="${cy}" r="34"/>`;
  s+=o.extras||'';
  ang.forEach(d=>{const[a,b]=P(cx,cy,80,d),[x,y]=P(cx,cy,270,d);s+=`<g data-t="${o.ids[3]}"><line class="hit" x1="${a}" y1="${b}" x2="${x}" y2="${y}"/><line class="road" x1="${a}" y1="${b}" x2="${x}" y2="${y}"/></g>`;});
  ang.forEach(d=>{const pa=(d+90)*Math.PI/180,dx=18*Math.cos(pa),dy=18*Math.sin(pa);const[x1,y1]=P(cx,cy,100,d),[x2,y2]=P(cx,cy,165,d);const D=arrowD(x1+dx,y1+dy,x2+dx,y2+dy);s+=`<g data-t="${o.ids[4]}"><path class="hit" d="${D}"/><path class="arrow" d="${D}"/></g>`;});
  const[ax,ay]=P(cx,cy,215,-31);
  const pa=(-113+90)*Math.PI/180;const[mx,my]=P(cx,cy,132,-113);
  s+=badge(o.ids[2],1,cx,cy)+badge(o.ids[1],2,...P(cx,cy,57,60))+badge(o.ids[0],3,78,195)+badge(o.ids[3],4,ax,ay)+badge(o.ids[4],5,mx+38*Math.cos(pa),my+38*Math.sin(pa));
  s+=o.extraBadges||'';
  return s+'</svg>';
}

function lineChart(){

  let s='<svg viewBox="0 0 400 236" role="img" aria-label="Courbe : part de la population mondiale vivant en ville, de 1950 à 2050">';
  for(let v=0;v<=100;v+=10)s+=`<line x1="55" x2="372" y1="${Y(v)}" y2="${Y(v)}" class="grid${v===50?' strong':''}"/><text x="49" y="${Y(v)+3.5}" text-anchor="end" class="ax">${v} %</text>`;
  D.forEach(([y])=>s+=`<text x="${X(y)}" y="218" text-anchor="middle" class="ax">${y}</text>`);
  const pts=D.map(([y,v])=>X(y)+' '+Y(v));
  s+=`<path class="curve" d="M${pts.slice(0,5).join('L')}"/><path class="curve dash" d="M${pts[4]}L${pts[5]}"/>`;
  D.forEach(([y,v])=>s+=`<circle class="pt" cx="${X(y)}" cy="${Y(v)}" r="4"/>`);

  }
  function check(){checks++;let ok=0,empty=0,bad=0;const n=cfg.targets.length;
    cfg.targets.forEach(t0=>{const t=T[t0.id];if(t.locked){ok++;return;}const lid=placed[t.id];if(!lid){empty++;t.state='';t.fb='';return;}
      if(cfg.answer[t.id].includes(lid)){t.state='ok';t.locked=true;t.fb=cfg.explain[lid]||'';ok++;}
      else{bad++;t.state='ko';t.fb=(cfg.hint&&cfg.hint[t.id]?'Indice : '+cfg.hint[t.id]+' ':'')+'Touche la case pour libérer l’étiquette.';}});
    if(ok===n){msg.textContent=checks===1?'Tout est juste du premier coup !':'Tout est juste !';done();}
    else msg.textContent=ok+' sur '+n+' bien placées.'+(bad?' Corrige les cases en rouge.':'')+(empty?' Il reste '+empty+(empty>1?' cases vides.':' case vide.'):'');
    update();}
  function showAll(){const used=new Set(Object.values(T).filter(t=>t.locked).map(t=>placed[t.id]));
    cfg.targets.forEach(t0=>{const t=T[t0.id];if(t.locked)return;const lid=cfg.answer[t.id].find(x=>!used.has(x));used.add(lid);placed[t.id]=lid;t.state='shown';t.fb=cfg.explain[lid]||'';});
    sel=null;msg.textContent='Voici la correction. Lis les « Pourquoi ? », puis recommence sans aide.';update();}
  function reset(){placed={};sel=null;checks=0;Object.values(T).forEach(t=>{t.state='';t.fb='';t.locked=false;});msg.textContent='';update();}
  update();
}

function twoTier(root,items,done){

function stepMatch(root,done){
  const rounds=chunk(shuffle(VOCAB),6);let r=0;

    const items=rounds[r],defs=shuffle(items),matched=new Set(),tries={};let selT=null,badD=null;

    root.append(h('p',{class:'lead'},'Touche un mot, puis la définition qui lui correspond.'),h('p',{class:'counter'},'Série '+(r+1)+' sur '+rounds.length),terms,dl,fb);
    function upd(){terms.innerHTML='';dl.innerHTML='';
      items.forEach(v=>terms.append(h('button',{type:'button',class:'mitem t'+(matched.has(v.t)?' ok':'')+(selT===v.t?' sel':''),disabled:matched.has(v.t),onclick:()=>{selT=v.t;badD=null;fb.textContent='';upd();}},v.t)));
      defs.forEach(v=>dl.append(h('button',{type:'button',class:'mitem'+(matched.has(v.t)?' ok':'')+(badD===v.t?' bad':'')+(selT&&(tries[selT]||0)>=2&&v.t===selT?' hint':''),disabled:matched.has(v.t),onclick:()=>pick(v)},v.d)));}

      else{tries[selT]=(tries[selT]||0)+1;badD=v.t;fb.textContent=tries[selT]>=2?'Pas celle-ci. La bonne définition est encadrée en pointillés.':'Pas celle-ci. Relis le mot et cherche un indice dans la définition.';upd();}}

  MODULES.forEach((m,i)=>{const d=modDone(m);grid.append(h('button',{type:'button',class:'mcard',onclick:()=>go(m.id)},h('span',{class:'mt'},(i+1)+'. '+m.title),h('span',{class:'md'},m.desc),h('span',{class:'md'},d+' sur '+m.steps.length+(m.steps.length>1?' étapes faites':' étape faite')),h('span',{class:'mbar'},h('i',{style:'width:'+Math.round(d/m.steps.length*100)+'%'}))));});
  panel.append(grid);
  const total=MODULES.reduce((a,m)=>a+m.steps.length,0),dn=MODULES.reduce((a,m)=>a+modDone(m),0);
  if(dn>0)panel.append(h('div',{class:'row'},h('button',{type:'button',class:'btn ghost small',onclick:()=>{if(confirm('Effacer toute ta progression ?')){S.done={};S.step={};save();render();}}},'Effacer ma progression ('+dn+' sur '+total+')')));
  app.append(panel);
}
function renderModule(app,m){
  const idx=Math.min(S.step[m.id]||0,m.steps.length-1),step=m.steps[idx],mi=MODULES.indexOf(m);
  const panel=h('div',{class:'panel'});
  panel.append(h('h2',{},m.title));
  if(m.rappel)panel.append(h('details',{class:'rappel',open:modDone(m)===0},h('summary',{},'L’essentiel à relire avant de commencer'),h('ul',{},m.rappel.map(r=>h('li',{},r)))));
  const stepper=h('ol',{class:'steps','aria-label':'Étapes du module'});
  refreshStepper=()=>{stepper.innerHTML='';if(m.steps.length<2)return;m.steps.forEach((s,i)=>stepper.append(h('li',{},h('button',{type:'button','aria-current':i===idx?'step':false,onclick:()=>{S.step[m.id]=i;save();render();}},h('span',{class:'sn'+(S.done[s.k]?' d':'')},S.done[s.k]?'✓':String(i+1)),s.t))));};
  refreshStepper();
  panel.append(stepper);
  if(m.steps.length>1)panel.append(h('h3',{style:'margin-top:0'},step.t));
  const body=h('section',{});panel.append(body);
  step.f(body,()=>markDone(step.k));
  const nr=h('div',{class:'nextrow'});
  if(idx<m.steps.length-1)nr.append(h('button',{type:'button',class:'btn',onclick:()=>{S.step[m.id]=idx+1;save();render();window.scrollTo(0,0);}},'Étape suivante'));
  else if(mi<MODULES.length-1)nr.append(h('button',{type:'button',class:'btn',onclick:()=>go(MODULES[mi+1].id)},'Module suivant : '+MODULES[mi+1].title));
  else nr.append(h('button',{type:'button',class:'btn ghost',onclick:()=>go('home')},'Retour à l’accueil'));
  panel.append(nr);
  app.append(panel);
}
function render(){renderNav();const app=$('#app');app.innerHTML='';refreshStepper=()=>{};
  const m=MODULES.find(x=>x.id===S.mod);if(m)renderModule(app,m);else renderHome(app);}
function applyPrefs(){document.documentElement.classList.toggle('big',!!S.big);document.documentElement.classList.toggle('spaced',!!S.spaced);$('#t-big').setAttribute('aria-pressed',S.big?'true':'false');$('#t-sp').setAttribute('aria-pressed',S.spaced?'true':'false');}
$('#t-big').addEventListener('click',()=>{S.big=!S.big;save();applyPrefs();});
$('#t-sp').addEventListener('click',()=>{S.spaced=!S.spaced;save();applyPrefs();});
$('#home-btn').addEventListener('click',()=>go('home'));
applyPrefs();render();
</script>
