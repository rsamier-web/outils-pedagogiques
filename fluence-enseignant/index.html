:root{
  --bg:#eff0f1; --view:#fcfcfc; --alt:#f7f8f8; --text:#232629; --muted:#5d666d;
  --hl:#3daee9; --hl-dark:#1b74a8; --hl-soft:#dceefa; --focus:#1d99f3;
  --pos:#4c47a3; --pos-dark:#4c47a3; --pos-soft:#ebeaf8; --neg:#da4453; --warn-soft:#fff4e0; --warn:#f67400;
  --border:#bcc2c7; --border-soft:#dde1e4;
  --sent:#d7ecfa; --word:#fdbc4b; --word-text:#232629;
  --radius:6px; --shadow:0 1px 2px rgba(35,38,41,.07),0 2px 10px rgba(35,38,41,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#202326; --view:#292c30; --alt:#2f3337; --text:#fcfcfc; --muted:#a1a9b1;
    --hl:#3daee9; --hl-dark:#7cc7f0; --hl-soft:#1e3b4f; --focus:#3daee9;
    --pos:#6c66c9; --pos-dark:#b3aef5; --pos-soft:#2d2b4d; --warn-soft:#3d2e17;
    --border:#4d5359; --border-soft:#3a3f44; --sent:#1f4560; --word:#fdbc4b; --word-text:#232629;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans","Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--view);padding:10px 14px;border:2px solid var(--focus);border-radius:var(--radius);z-index:50}
.skip:focus{top:8px}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
main{width:100%;max-width:880px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
main:focus{outline:none}
.muted{color:var(--muted)} .small{font-size:.9rem}

/* Barre d'outils façon KDE */
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:var(--view);border-bottom:1px solid var(--border-soft)}
.toolbar h1{font-size:1.02rem;font-weight:600;margin:0 auto 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:6px;background:var(--hl);color:#fff;display:inline-grid;place-items:center;flex:none}

/* Boutons Breeze */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 14px;
  background:var(--alt);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;
  font-weight:500;line-height:1.2;text-align:left;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--hl);background:var(--hl-soft)}
.btn:active:not(:disabled){background:var(--hl-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.flat{background:transparent;border-color:transparent}
.btn.flat:hover:not(:disabled){border-color:var(--border-soft);background:var(--alt)}
.btn.icon{padding:8px}
.btn.primary{background:var(--hl);border-color:var(--hl-dark);color:#fff}
.btn.primary:hover:not(:disabled){background:#2a9fdc;border-color:var(--hl-dark)}
@media (prefers-color-scheme: dark){.btn.primary{border-color:#2a9fdc;color:#fff}}
.btn.success{background:var(--pos);border-color:#3b3790;color:#fff}
.btn.success:hover{background:#423e98}
.btn.danger{background:var(--neg);border-color:#b52d3b;color:#fff}
.btn.big{min-height:52px;padding:10px 18px;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.row.end{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 12px;border-radius:18px;border:1px solid var(--border-soft);background:var(--alt);font-size:.92rem}
.chip.run{border-color:var(--hl);background:var(--hl-soft);font-variant-numeric:tabular-nums}
.rec{width:10px;height:10px;border-radius:50%;background:var(--neg)}

/* Cartes */
.card{background:var(--view);border:1px solid var(--border-soft);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow)}
.eyebrow{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.h-small{font-size:1rem;margin:0 0 10px} .h-mid{font-size:1.25rem;margin:2px 0 8px}
h3.h-small{margin-top:16px}
.notice{padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border-soft);background:var(--alt);font-size:.95rem}
.notice.warn{background:var(--warn-soft);border-color:#f3c78a}
.notice ul{margin:6px 0;padding-left:20px}

/* Série */
.streak-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.streak-num{display:flex;flex-direction:column;align-items:center;min-width:92px}
.streak-num b{font-size:2.3rem;line-height:1;color:var(--hl-dark)}
.streak-num span{font-size:.85rem;color:var(--muted)}
.streak-week{flex:1;min-width:230px}
.week{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.dl{font-size:.78rem;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border-soft);display:grid;place-items:center;color:#fff}
.day.done .dot{background:var(--pos);border-color:var(--pos)}
.day.today .dot{border-color:var(--hl);border-width:3px}
.day.rest .dot{background:var(--alt);border-style:dashed}
.dot svg{width:16px;height:16px}
.goal{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.goal-bar{flex:1;height:8px;border-radius:4px;background:var(--border-soft);overflow:hidden}
.goal-bar i{display:block;height:100%;background:var(--pos)}
.streak-msg{margin:10px 0 0;font-weight:500}

/* Texte en cours */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--hl)}
.banner.good{border-left-color:var(--pos)}
.banner h2{margin:0 0 4px;font-size:1.08rem} .banner p{margin:0}
.cur-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.cur-head h2{margin:2px 0 0;font-size:1.5rem;font-weight:700}
.week-state{font-size:.95rem}
.pips{display:flex;align-items:center;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:6px;border:2px solid var(--border-soft);display:grid;place-items:center;color:#fff}
.pip.on{background:var(--pos);border-color:var(--pos)}
.pip svg{width:15px;height:15px}
.pips-lbl{margin-left:6px;font-size:.9rem;color:var(--muted)}
.steps{list-style:none;padding:0;margin:14px 0 6px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn.step{width:100%;height:100%;justify-content:flex-start;align-items:center;padding:12px;gap:10px}
.step .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--view);border:1px solid var(--border);color:var(--text)}
.step.primary .num{background:#fff;color:var(--hl-dark);border-color:#fff}
.st-txt{display:flex;flex-direction:column;gap:2px}
.st-txt small{font-weight:400;font-size:.82rem;opacity:.85}
.steps li:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:640px){.steps{grid-template-columns:1fr}}

/* Temps de la semaine */
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{border:1px solid var(--border-soft);border-radius:6px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;background:var(--alt)}
.dcell.today{border:2px solid var(--hl)}
.dcell.done{background:var(--pos-soft);border-color:var(--pos)}
.dname{font-size:.78rem;font-weight:600}
.ddate{font-size:.72rem;color:var(--muted)}
.dtime{font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:520px){.days-grid{grid-template-columns:repeat(4,1fr)}}

.tempo{margin-top:6px}
.tempo-bar{display:flex;gap:3px;padding-top:26px}
.tempo-bar .seg{position:relative;flex:1;height:16px;border-radius:3px}
.tempo-bar .seg:first-child{border-radius:8px 3px 3px 8px} .tempo-bar .seg:last-child{border-radius:3px 8px 8px 3px}
.tempo-bar .seg.on{height:22px;margin-top:-3px;box-shadow:0 0 0 2px var(--view),0 0 0 4px var(--text)}
.tempo-bar .seg.next{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)!important}
.tempo-bar .mark{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.74rem;font-weight:600;color:var(--text)}
.tempo-bar .seg:first-child .mark{left:0;transform:none} .tempo-bar .seg:last-child .mark{left:auto;right:0;transform:none}
.tempo-ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:4px}
.tempo-legend{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.tempo-legend li{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 2px;border-radius:6px;border:1px solid transparent;gap:2px}
.tempo-legend li.on{border-color:var(--text);background:var(--alt)}
.tempo-legend li.next{border:1px dashed var(--border)}
.tempo-legend .tn{font-size:.78rem;font-weight:600;font-style:italic}
.tempo-legend .tt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tchip{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tempo-legend .tchip{margin:0}
.tempo.small .tempo-legend{display:none}
@media (max-width:640px){.tempo-legend{grid-template-columns:repeat(3,1fr)}}
.dtempo{font-size:.72rem;font-style:italic;min-height:1.4em;text-align:center}
.dtempo .tchip{width:10px;height:10px;margin-right:3px}
/* Enseignant */
.who{font-size:.95rem;padding:0 2px}
.who-sel{min-height:40px;max-width:11rem;font-weight:600}
.input{min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--view);min-width:0}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row .input{flex:1 1 180px}
.add-row select{flex:1 1 220px}
.profiles{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.prof{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;border:1px solid var(--border-soft);border-radius:6px}
.prof.cur{border-color:var(--hl);background:var(--hl-soft)}
.prof .input{flex:1 1 140px}
.prof select{flex:1 1 200px}
.mini-check{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:.9rem;cursor:pointer}
.mini-check input{width:20px;height:20px;accent-color:var(--hl)}
.student.cur{border-color:var(--hl)}
.stu-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stu-head h3{margin:0;font-size:1.15rem;margin-right:auto}
.stu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;margin:12px 0 0}
.stu-grid div{min-width:0} .stu-grid dt{font-size:.8rem;color:var(--muted)} .stu-grid dd{margin:2px 0 0;font-weight:600}
@media (max-width:640px){.stu-grid{grid-template-columns:repeat(2,1fr)}}
.stu-detail{margin-top:12px;border-top:1px solid var(--border-soft);padding-top:8px}
.stu-detail summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:500}
.hist{margin:8px 0} .hist ul{list-style:none;margin:4px 0 0;padding:0}
.hist li{display:grid;grid-template-columns:9rem 4rem 1fr;gap:8px;padding:3px 0;border-bottom:1px solid var(--border-soft);font-size:.92rem;font-variant-numeric:tabular-nums}
@media (max-width:520px){.who-sel{max-width:9rem;margin-right:auto}.toolbar h1.with-sel{display:none}}

/* Bibliothèque */
.lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lib-item{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:6px;border:1px solid transparent}
.lib-item.cur{border-color:var(--hl);background:var(--hl-soft)}
.lib-item.locked{color:var(--muted)}
.lib-n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--alt);border:1px solid var(--border-soft);font-weight:600;font-size:.9rem}
.lib-t{flex:1;display:flex;flex-direction:column}
.lib-t small{color:var(--muted);font-size:.84rem}
.lock{display:grid;place-items:center;width:44px;height:44px;color:var(--muted)}

/* Mots à préparer */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0}
.btn.word-btn{min-height:72px;justify-content:center;font-weight:400;background:var(--view)}
.btn.word-btn.on{background:var(--word);border-color:#e0a030;color:var(--word-text)}

/* Lecteur */
.reader-main{max-width:900px}
.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px}
.tts,.chrono{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reading-card{padding:18px 22px 22px}
.text-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--border-soft);padding-bottom:8px;margin-bottom:12px}
.text-head h2{margin:0;font-size:1.2rem}
.reading{max-width:62ch;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;min-height:40vh}
.reading:focus{outline:none}
.reading.wide,.preview.wide{letter-spacing:.12em;word-spacing:.16em}
.reading .line{margin:0 0 .35em -8px;padding:0 8px;border-radius:4px}
.reading .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background-color .1s}
.reading .w:hover{text-decoration:underline;text-decoration-color:var(--hl);text-underline-offset:4px}
.reading .line.hl{background:var(--sent);box-shadow:-4px 0 0 0 var(--hl)}
.reading .hw{background:var(--word);color:var(--word-text);box-shadow:0 0 0 2px var(--word)}
.preview{margin-top:10px;padding:12px 14px;border:1px dashed var(--border);border-radius:6px;background:var(--view)}
.pager-wrap{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 80%,transparent)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.echo-prompt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px;
  background:var(--view);border:1px solid var(--hl);border-left:4px solid var(--hl);border-radius:6px;box-shadow:var(--shadow)}
.echo-prompt p{margin:0;font-size:1.05rem}
.echo-actions{display:flex;gap:8px;flex-wrap:wrap}
.page-dots{display:flex;gap:6px}
.page-dots i{width:9px;height:9px;border-radius:50%;background:var(--border)}
.page-dots i.on{background:var(--hl);transform:scale(1.25)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--view);padding:10px 16px;border-radius:6px;z-index:40;max-width:90vw;text-align:center}

/* Fenêtres */
.overlay{position:fixed;inset:0;background:rgba(35,38,41,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.side{justify-content:flex-end;padding:0}
.modal{background:var(--view);border-radius:8px;border:1px solid var(--border);width:100%;max-width:480px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal.wide{max-width:680px}
.overlay.side .modal{max-width:430px;height:100%;max-height:none;border-radius:0;border-width:0 0 0 1px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 18px;border-bottom:1px solid var(--border-soft)}
.modal-head h2{font-size:1.08rem;margin:0}
.modal-body{padding:14px 18px 20px;overflow:auto}
.set-group{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border-soft);display:flex;flex-direction:column;gap:12px}
.set-group:last-child{border-bottom:0}
.set-group h3{margin:0;font-size:.95rem;color:var(--hl-dark)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field-label{font-weight:500;display:flex;justify-content:space-between}
.field output{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:44px;accent-color:var(--hl);cursor:pointer}
select{min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--alt);max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-opt{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--alt)}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opt.on{background:var(--hl-soft);border-color:var(--hl);box-shadow:inset 0 0 0 1px var(--hl)}
.seg-opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.switch{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.switch .track{flex:none;width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .15s}
.switch .track span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--hl)}
.switch input:checked + .track span{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--focus);outline-offset:2px}
.sw-text{display:flex;flex-direction:column}
.sw-text small{color:var(--muted);font-size:.84rem}
.help-list{padding-left:20px;margin:6px 0 12px} .help-list li{margin:4px 0}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--alt);font-family:inherit;font-size:.9em}
details.adult{border:1px solid var(--border-soft);border-radius:6px;padding:8px 12px;background:var(--alt)}
details.adult summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.result{text-align:center}
.res-time{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0}
.res-time b{font-size:2.4rem;font-variant-numeric:tabular-nums}
.res-lvl{font-size:1.08rem;margin:4px 0}
.res-streak{font-weight:600;color:var(--pos-dark)}

@media (max-width:520px){
  .lbl-txt{display:none}
  main{padding:12px 10px 32px}
  .reading-card{padding:14px 14px 18px}
  .btn.big span{display:inline}
  .text-head h2{display:none}
  .text-head{justify-content:flex-end}
  .reader-bar{flex-wrap:nowrap}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .page-dots i.on{transform:none}
}
</style>

 les arbres."],["Le lendemain, je reviens au même endroit.","Je pose encore un os. Le loup revient aussi.","Cette fois, il mange l’os devant moi.","Le troisième jour, il vient tout près.","Je tends la main. Il ne mord pas.","Un collier rouge apparaît autour de son cou."],["C’est le signe : maintenant, il est mon ami.","Je l’appelle Neige.","Neige me suit partout, même dans la mine.","La nuit, il dort devant ma porte.","Je n’ai plus jamais froid quand il est là.","Un ami, ça ne se trouve pas.","Ça se gagne, un os après l’autre."]]},{id:"t3",title:"L’orage",mots:["après-midi","éclair","tonnerre","grognements","créatures","arc-en-ciel"],pages:[["Le ciel devient noir au milieu de l’après-midi.","Le vent souffle fort dans les feuilles.","Je suis loin de ma maison, sur une colline.","Les premières gouttes tombent sur mon casque.","Puis un éclair déchire le ciel.","Le tonnerre roule comme un gros tambour."],["Je dois trouver un abri, et vite.","Je creuse dans le flanc de la colline.","Trois blocs vers l’avant, deux blocs vers le haut.","Je bouche l’entrée avec de la terre.","J’allume une torche. Je suis à l’abri."],["Dehors, la pluie frappe le sol sans arrêt.","J’entends des pas lourds dans la boue.","Des grognements passent tout près du mur.","Les créatures de la nuit aiment l’orage.","Elles sortent quand le ciel est sombre.","Je ne bouge pas. Je respire doucement."],["Mon cœur cogne dans ma poitrine.","Les pas s’éloignent. Puis ils reviennent.","Puis ils s’éloignent encore.","Je compte jusqu’à cent, puis jusqu’à mille.","Enfin, le bruit de la pluie diminue."],["Un rayon de lumière passe sous la terre.","Je creuse un petit trou pour regarder.","Le ciel est lavé. Il brille comme une vitre.","Un arc-en-ciel touche la forêt.","La peur était grande, mais l’abri était solide.","Parfois, trois blocs de terre suffisent pour être sauvé."]]},{id:"t4",title:"Le portail violet",mots:["obsidienne","presque","briquet","rideau","champignons","courage"],pages:[["Dans la mine, j’ai trouvé de l’obsidienne.","C’est une pierre noire, très dure, presque violette.","Il faut beaucoup de temps pour la casser.","J’en ai ramassé quatorze blocs.","Avec eux, je construis un grand cadre.","Il est haut comme deux hommes, large comme une porte."],["J’allume le cadre avec un briquet.","Un rideau violet apparaît. Il tremble et il chante.","Mes mains tremblent aussi.","Je fais un pas. Puis un autre.","Le monde devient flou, puis tout change."],["Je suis dans un pays rouge et brûlant.","Le sol est fait de pierre rouge.","Des rivières de lave coulent tout en bas.","Il n’y a pas de ciel, seulement un plafond lointain.","L’air sent la fumée et le feu.","Des créatures flottent au loin. Elles crient."],["Je reste près du portail, sans bouger.","Je regarde ce monde étrange pendant un long moment.","Il est dangereux, mais il est beau.","Je ramasse du sable sombre et des champignons.","Puis j’entends un cri, plus proche.","Je saute dans le rideau violet."],["Me voilà de retour dans ma mine, fraîche et calme.","Je m’assois et je ris tout seul.","J’ai eu peur, c’est vrai.","Mais j’ai vu un autre monde, juste derrière une porte.","Demain, j’y retournerai avec une armure.","Le courage, c’est avoir peur et faire le premier pas."]]},{id:"t5",title:"La bibliothèque",mots:["bibliothécaire","enchantement","étagères","cannes à sucre","étranges","magique"],pages:[["Dans un village, je rencontre un vieux bibliothécaire.","Sa maison est pleine de livres, du sol au plafond.","— Que cherches-tu ? me demande-t-il.","— Je veux rendre ma pioche plus forte.","— Alors il te faut une table d’enchantement.","— Comment est-ce que je la fabrique ?"],["— Avec des diamants, de l’obsidienne et un livre.","— Et après ?","— Après, il faut des livres. Beaucoup de livres.","Je rentre chez moi et je me mets au travail.","Pour faire un livre, il faut du papier et du cuir.","Le papier vient des cannes à sucre, près de l’eau.","Le cuir vient des vaches, dans la prairie."],["Je plante des cannes. J’attends qu’elles poussent.","Je fabrique le papier, trois feuilles à la fois.","Petit à petit, ma pile de livres grandit.","Je construis des étagères autour de ma table.","Une, puis deux, puis quinze étagères."],["Le soir, la table brille d’une lumière bleue.","Des lettres étranges volent au-dessus d’elle.","Je pose ma pioche. Elle se met à briller aussi.","Elle est plus solide et plus rapide qu’avant.","Je retourne voir le vieux bibliothécaire.","— Merci, lui dis-je. Ma pioche est magique maintenant."],["— Ce n’est pas la pioche qui est magique, répond-il.","— Ah bon ? Alors qu’est-ce que c’est ?","— Ce sont les livres. Ils rendent tout plus fort.","Il me tend un livre que je ne connais pas.","Ce soir, je ne creuserai pas.","Ce soir, je vais lire."]]},{id:"t6",title:"Le temple du désert",mots:["désert","à moitié","secrète","plaque","poudre","réfléchir"],pages:[["Depuis trois jours, je marche dans le désert.","Le sable est jaune. Le soleil est blanc.","Je bois ma dernière goutte d’eau à midi.","Au loin, je vois une forme orange.","Est-ce un rêve ? Je marche plus vite.","C’est un temple, à moitié caché dans le sable."],["Il a deux tours et une grande porte.","Des dessins bleus et orange couvrent les murs.","J’entre. À l’intérieur, il fait frais.","Au centre de la salle, il y a un carré bleu.","Je creuse sous le carré, bloc après bloc.","En dessous, je découvre une salle secrète."],["Quatre coffres attendent dans les coins.","Au milieu du sol, il y a une petite plaque de pierre.","Je m’arrête. Quelque chose ne va pas.","Pourquoi une plaque, juste au milieu ?","Je creuse doucement autour d’elle.","Sous la plaque, je trouve de la poudre noire.","Beaucoup de poudre. Assez pour faire sauter le temple."],["C’est un piège ! Si j’avais marché dessus…","Je retire la poudre, bloc par bloc, sans trembler.","Ensuite seulement, j’ouvre les coffres.","Il y a de l’or, des os et deux diamants.","Il y a aussi une selle pour un cheval."],["Je ressors dans la lumière du soir.","Le désert est devenu rose et calme.","J’ai trouvé un trésor, c’est vrai.","Mais mon vrai trésor, c’est d’avoir regardé avant de marcher.","Dans la vie aussi, il y a des plaques cachées.","Il faut parfois s’arrêter et réfléchir avant d’avancer."]]},{id:"t7",title:"Les abeilles de la clairière",mots:["bouleaux","clairière","bourdonnement","écorce","marguerites","bleuets"],pages:[["Au bord de la forêt de bouleaux, il y a une clairière.","Des fleurs de toutes les couleurs y poussent.","Un matin, j’entends un bourdonnement.","Des abeilles volent de fleur en fleur.","Elles ont un corps jaune et noir, tout rond.","Je les suis jusqu’à un vieil arbre."],["Sur une branche, il y a une ruche.","Du miel doré coule sur l’écorce.","J’ai envie d’en prendre tout de suite.","Mais je me souviens du conseil d’un voyageur.","« Ne prends jamais le miel sans fumée. Sinon, les abeilles se fâchent. »","Alors je ramasse du bois et j’allume un petit feu."],["Je le pose sous la ruche, avec soin.","La fumée monte doucement entre les feuilles.","Les abeilles deviennent calmes. Elles ne m’attaquent pas.","Je remplis une bouteille de miel.","Il est épais et sucré comme le soleil."],["Pendant plusieurs semaines, je reviens à la clairière.","Je plante des fleurs autour de l’arbre.","Des tulipes, des marguerites et des bleuets.","Les abeilles ont plus de travail. Elles sont contentes.","La ruche se remplit plus vite qu’avant.","Un jour, je vois une deuxième ruche dans un autre arbre.","Puis une troisième, près de ma maison."],["Mon jardin est plein de bruit et de vie.","Les fleurs poussent partout, même sur le chemin.","Ce jour-là, je comprends quelque chose.","Je pensais que je prenais le miel des abeilles.","En fait, nous faisons un échange.","Je leur donne des fleurs. Elles me donnent du miel.","Et le monde devient un peu plus beau pour tout le monde."]]},{id:"t8",title:"L’île au bout du monde",mots:["forteresse","cristal","immense","tiède","pourtant","cultiver"],pages:[["Pendant des mois, j’ai préparé ce voyage.","J’ai une armure de diamant, un arc et cent flèches.","J’ai aussi des yeux étranges, verts comme la mer.","Quand je les lance en l’air, ils volent vers l’est.","Enfin, un œil tombe dans le sol et ne bouge plus."],["Je creuse. Sous la terre, je trouve une vieille forteresse.","Au bout de l’un d’eux, il y a une salle avec un cadre de pierre.","Je pose les yeux dans le cadre, un par un.","Le dernier s’allume. Un trou noir plein d’étoiles apparaît.","Je respire fort, et je saute."],["J’arrive sur une île sombre, au milieu du vide.","Le sol est jaune pâle. Le ciel est noir, sans lune.","De hautes tours se dressent autour de moi.","Sur chaque tour brille un cristal violet.","Soudain, une ombre immense passe au-dessus de ma tête.","C’est le dragon. Il est plus grand que ma maison.","Ses ailes font un bruit de tempête."],["Je vise les cristaux avec mon arc, un par un.","Le dragon crie à chaque cristal brisé.","Le combat dure longtemps. J’ai mal aux bras.","Enfin, le dragon monte vers le ciel et disparaît dans la lumière.","Au centre, un petit œuf noir m’attend sur un rocher."],["Je le prends dans mes mains. Il est tiède.","Un portail s’ouvre pour me ramener chez moi.","Je retrouve mon champ, ma torche, et Neige qui m’attend.","Tout est pareil, et pourtant, tout a changé.","Je repense à ma première nuit, seul dans mon trou.","Je ne savais rien. Je n’avais rien."],["Aujourd’hui, je sais construire, cultiver et me défendre.","Chaque jour, j’ai appris un petit peu.","Et tous ces petits peu ont fait un long voyage."]]}];var Ad=[{id:"c1",title:"La vague et la montagne",mots:["estampe","Hokusai","imprimer","écume","minuscule","siècles"],pages:[["Ce matin, à Tokyo, il pleut sur les toits gris.","Ma tante m’emmène dans un petit musée, au fond d’une rue calme.","Elle est photographe, et elle répète qu’il faut apprendre à regarder.","À l’entrée, on enlève ses chaussures, comme dans beaucoup de maisons japonaises.","Le parquet est frais sous mes pieds.","Dans la salle, la lumière est faible pour protéger les œuvres."],["Devant moi, il y a une image que je connais déjà.","Je l’ai vue sur des tasses, des tee-shirts et des fonds d’écran.","C’est la Grande Vague, d’un artiste appelé Hokusai.","Pourtant, en vrai, elle est bien plus petite que je l’imaginais.","Elle est à peine plus grande qu’une feuille de cahier."],["Ma tante m’explique que ce n’est pas une peinture.","C’est une estampe : une image gravée sur des plaques de bois.","On encre chaque plaque d’une couleur, puis on presse le papier dessus.","Ainsi, on peut imprimer la même image des centaines de fois.","Hokusai l’a créée vers 1830, il y a près de deux siècles."],["Je m’approche et je regarde mieux.","L’écume de la vague ressemble à des griffes prêtes à saisir les bateaux.","Dans les barques, les rameurs se penchent tous ensemble pour résister.","Et tout au fond, minuscule, il y a une montagne blanche.","C’est le mont Fuji, le plus haut sommet du Japon."],["— Tu vois ? murmure ma tante. La vague est énorme, et la montagne paraît toute petite.","— Pourtant, c’est la montagne qui restera, quand la vague sera retombée.","Je ne réponds pas. Je reste longtemps devant l’estampe.","Le soir, dans mon carnet, j’essaie de dessiner la vague.","Mon dessin n’est pas très réussi.","Mais maintenant, je sais regarder une image au lieu de seulement la voir."]]},{id:"c3",title:"Les pétales orange",mots:["Oaxaca","œillets","autel","défunts","cimetière","immatériel"],pages:[["Début novembre, à Oaxaca, dans le sud du Mexique, la ville se couvre d’orange.","Il y a des fleurs partout : sur les marchés, sur les balcons, sur les tombes.","Ce sont des œillets d’Inde, qu’on appelle ici les « fleurs des morts ».","Notre voisine, Doña Lupe, prépare un autel dans son salon.","Elle m’invite à l’aider."],["Sur une table, elle pose les photos de ses parents et de son mari.","Autour, nous plaçons des bougies, du pain sucré et des fruits.","Elle ajoute un verre d’eau, « parce que le voyage est long ».","Puis elle dispose de petites têtes de mort en sucre, décorées de couleurs vives.","Sur le front de chacune, on écrit un prénom."],["Je suis un peu mal à l’aise.","Chez moi, on ne parle pas beaucoup de la mort. On baisse la voix.","Ici, au contraire, les enfants rient et les rues sont pleines de musique.","Doña Lupe remarque mon air étonné.","— Le Jour des morts n’est pas un jour triste, m’explique-t-elle.","— Pendant ces deux nuits, nos défunts reviennent nous rendre visite."],["— Alors on leur prépare ce qu’ils aimaient : leur plat préféré, leur chanson préférée.","— Les pétales orange tracent un chemin pour qu’ils retrouvent la maison.","La nuit suivante, nous allons au cimetière.","Des familles entières sont assises près des tombes, avec des bougies et des couvertures.","Certaines ont apporté un repas. D’autres jouent de la guitare.","On raconte des histoires sur ceux qui sont partis.","On rit souvent. On pleure parfois. Et personne ne trouve ça étrange."],["En 2008, l’UNESCO a inscrit cette fête au patrimoine culturel immatériel de l’humanité.","Ce soir-là, je pense à mon grand-père, que je n’ai presque pas connu.","Je dessine son visage dans mon carnet, d’après une vieille photo.","Puis je l’entoure de pétales orange.","J’ai compris quelque chose : se souvenir, cela peut aussi être une fête."]]},{id:"c2",title:"Les étoiles de Fès",mots:["médina","zellige","céramique","émail","losange","patience"],pages:[["Dans la médina de Fès, les ruelles sont si étroites qu’aucune voiture ne peut y passer.","Des ânes chargés de caisses avancent au milieu de la foule.","On entend des marteaux, des voix, des appels.","Ça sent le cuir, la menthe et le pain chaud.","Mon cousin Yassine connaît chaque passage par cœur.","Il m’entraîne vers un atelier où il a travaillé l’été dernier."],["Dans la cour, un homme est assis par terre, entouré de petits morceaux de céramique.","Il s’appelle Si Ahmed. Il est maître zellijeur depuis quarante ans.","Avec un marteau pointu, il taille les carreaux un par un.","Chaque morceau devient une étoile, un losange ou une petite feuille.","Ses gestes sont rapides et précis. Pas un éclat ne tombe à côté."],["— Le zellige, explique-t-il, c’est de la terre cuite recouverte d’émail.","— On façonne d’abord des carreaux d’argile, on les sèche au soleil, puis on les cuit.","— Ensuite, on les émaille : vert, bleu, blanc, noir, jaune miel.","— Après une seconde cuisson, on peut enfin les tailler."],["Il me montre une grande étoile à seize branches posée sur une table.","Elle est faite de plus de cinq cents pièces.","Les morceaux sont assemblés à l’envers, face colorée contre le sol.","On ne voit donc pas le dessin pendant qu’on le construit.","Il faut l’avoir tout entier dans la tête."],["— Comment faites-vous pour ne pas vous tromper ? je demande.","Si Ahmed sourit et me tend un petit carreau blanc.","— Ce n’est pas la mémoire qui travaille. C’est la patience.","— Un motif, c’est une règle que l’on répète, encore et encore, jusqu’à ce qu’elle devienne belle."],["Le soir, sur la terrasse, je regarde les toits de la ville.","Partout, les fontaines et les murs brillent dans la lumière dorée.","Je pense à toutes les mains qui ont taillé ces milliers d’étoiles.","Dans mon carnet, je colle le petit carreau blanc.","À côté, j’écris : « La beauté se construit pièce par pièce. »"]]},{id:"c7",title:"La voix du griot",mots:["Ziguinchor","griot","calebasse","kora","Soundiata Keïta","génération"],pages:[["Dans un village près de Ziguinchor, au sud du Sénégal, la nuit tombe d’un coup.","Les enfants se rassemblent sous un grand fromager.","Les adultes apportent des bancs et des nattes.","Ce soir, un griot va jouer. Tout le monde l’attend."],["Il arrive avec un instrument que je n’ai jamais vu.","C’est une kora : une grande calebasse coupée en deux, recouverte d’une peau.","Un long manche de bois la traverse, et vingt et une cordes y sont tendues.","Le griot s’assoit, tient l’instrument debout devant lui et pince les cordes avec ses doigts.","Le son est clair et doux, comme de l’eau qui coule sur des cailloux."],["Puis il se met à chanter.","Mon ami Ousmane me traduit à voix basse.","— Il raconte l’histoire de Soundiata Keïta, le fondateur de l’empire du Mali.","— C’était un enfant qui ne pouvait pas marcher, et dont tout le monde se moquait.","— Un jour, il s’est levé en s’appuyant sur une barre de fer, et il est devenu roi."],["— Cette histoire a presque huit cents ans, ajoute Ousmane.","— Pendant des siècles, elle n’a jamais été écrite.","— Dans les familles de griots, on se la transmet de génération en génération.","— Un griot, c’est une bibliothèque vivante. Il garde la mémoire des familles et des peuples."],["Le chant dure longtemps. Personne ne s’ennuie.","Parfois, le griot s’arrête et pose une question au public.","Les gens répondent en chœur, en riant.","Un vieil homme corrige un détail, et le griot reprend, avec un sourire.","L’histoire n’est pas seulement écoutée : elle est partagée par tout le village."],["Avant de dormir, j’écris dans mon carnet tout ce dont je me souviens.","Il me manque des noms, des lieux, des batailles.","Je mesure alors à quel point la mémoire du griot est extraordinaire.","Il a appris ces milliers de vers en les écoutant et en les répétant, pendant des années.","Moi, j’ai mon carnet. Lui, il a sa voix.","Et sa voix porte l’histoire bien plus loin que l’encre."]]},{id:"c4",title:"Les points du désert",mots:["aborigène","auvent","ondulées","continent","ancêtres","Uluru"],pages:[["Au centre de l’Australie, la terre est rouge à perte de vue.","Il fait si chaud que l’air tremble au-dessus de la route.","Après des heures de trajet, nous arrivons dans un petit centre d’art.","Sous un auvent, des femmes peignent, assises sur le sol.","Les toiles sont posées à plat, directement sur la terre."],["Je m’approche sans faire de bruit.","Une artiste trempe une fine baguette dans la peinture.","Puis elle pose des points, des milliers de points, les uns à côté des autres.","Peu à peu, des cercles apparaissent, des lignes ondulées, des traces de pas.","On dirait une carte vue du ciel."],["Une jeune femme, Kirra, travaille au centre d’art. Elle traduit pour nous.","— Les peuples aborigènes vivent sur ce continent depuis plus de cinquante mille ans.","— Leur art est l’une des plus anciennes traditions vivantes du monde.","— Chaque tableau raconte une histoire du Temps du rêve.","— C’est l’époque où les ancêtres ont façonné les rivières, les collines et les animaux."],["Je montre un cercle entouré de plusieurs petits arcs.","— Le cercle, c’est un point d’eau ou un campement, répond Kirra.","— Les arcs, ce sont des personnes assises autour.","— Et ces lignes, ce sont les chemins qui relient les lieux entre eux.","— Une peinture, c’est un savoir. On ne peint que les histoires qu’on a le droit de raconter."],["Le lendemain, nous découvrons Uluru, un immense rocher qui change de couleur avec le soleil.","Pour le peuple anangu, c’est un lieu sacré.","Depuis 2019, il est interdit de l’escalader, par respect.","Nous en faisons le tour à pied, lentement, en silence.","Le long du chemin, des panneaux demandent de ne pas photographier certains endroits."],["Je range mon appareil photo.","Dans mon carnet, j’essaie de dessiner le paysage avec des points.","C’est long, très long. J’ai mal au poignet.","Mais à chaque point, je regarde un peu mieux la forme du rocher.","C’est peut-être ça, le secret : prendre le temps de connaître un lieu avant de le raconter."]]},{id:"c5",title:"Le dessin du matin",mots:["Chennai","kolam","seuil","poignée","fourmis","tremblante"],pages:[["À Chennai, dans le sud de l’Inde, le jour se lève à peine.","Je me réveille au bruit d’un balai sur le sol.","Par la fenêtre, je vois Meena, la fille de nos hôtes, devant la porte de la maison.","Elle balaie le seuil, puis elle le mouille avec un peu d’eau.","Ensuite, elle prend une poignée de poudre blanche dans un bol."],["Elle se penche et laisse filer la poudre entre ses doigts.","Une ligne apparaît, fine et régulière, comme tracée à la règle.","Puis une autre, qui tourne, revient, s’enroule autour de petits points.","En dix minutes, un grand motif couvre le sol : des boucles, des pétales, une étoile.","Je descends en courant pour le voir de plus près."],["— C’est un kolam, m’explique Meena. Ma grand-mère m’a appris quand j’avais cinq ans.","— On commence par une grille de points. Ensuite, on trace des lignes autour, sans lever la main.","— Chaque matin, on en dessine un nouveau. Toutes les maisons de la rue le font.","Je regarde le long de la rue. C’est vrai : chaque seuil a son dessin."],["— Et la poudre, c’est quoi ? je demande.","— De la farine de riz, répond-elle en riant.","— Comme ça, les fourmis et les oiseaux peuvent manger.","— Le kolam souhaite la bienvenue aux visiteurs, et il nourrit les petits animaux.","— C’est une façon de partager, dès le matin."],["Dans la journée, des centaines de pieds passent sur le dessin.","Une moto roule dessus. Un chien s’y assoit. La pluie tombe en fin d’après-midi.","Le soir, il ne reste presque rien du kolam.","Cela me rend un peu triste. Tant de travail, effacé en une journée !","Meena hausse les épaules.","— Il n’est pas perdu. Demain, j’en ferai un autre.","— Ce qui compte, ce n’est pas qu’il dure. C’est de le refaire chaque jour."],["Le lendemain matin, elle me donne un bol de farine.","Ma première ligne est tremblante, mes points sont de travers.","Mais je recommence. Et le jour suivant aussi.","Je crois que je comprends : un geste répété chaque jour finit par devenir un art."]]},{id:"c6",title:"Le géant de marbre",mots:["Florence","Michel-Ange","coupole","sculpteur","stupéfaite","proportions"],pages:[["À Florence, en Italie, on fait la queue tôt le matin devant un musée.","Nous attendons plus d’une heure sous le soleil.","Autour de nous, on entend parler espagnol, japonais, anglais, arabe.","Tout le monde est venu voir la même œuvre : le David de Michel-Ange.","Quand j’entre enfin dans la salle, je m’arrête net.","La statue est immense : plus de cinq mètres de haut."],["Elle se dresse au bout d’une longue galerie, sous une coupole de verre.","La lumière glisse sur le marbre blanc, si lisse qu’il paraît presque tiède.","Notre guide, une étudiante en histoire de l’art, nous raconte son histoire.","— Au début, ce bloc de marbre était un problème, dit-elle.","— Il était long, étroit, abîmé. D’autres sculpteurs l’avaient commencé, puis abandonné.","— Pendant des années, il est resté couché dans une cour, sous la pluie."],["— En 1501, un jeune sculpteur de vingt-six ans accepte de le reprendre : Michel-Ange.","— Il travaille presque trois ans, à l’abri des regards.","— Quand la statue est terminée, toute la ville est stupéfaite.","— On décide de la placer devant le palais du gouvernement."],["— David, c’est le jeune berger qui affronte le géant Goliath.","— Pour les Florentins, il devient un symbole.","— Celui d’une petite cité qui refuse de se laisser écraser par ses puissants voisins.","Je fais lentement le tour de la statue.","De face, David semble calme. De côté, on voit son front plissé, son regard inquiet."],["Ses mains paraissent trop grandes, sa tête aussi.","— C’est voulu, explique la guide. La statue devait être vue d’en bas, de loin.","— Michel-Ange a adapté les proportions à l’œil du spectateur.","En sortant, je m’assois sur les marches et j’ouvre mon carnet.","Je repense à ce bloc de marbre abandonné sous la pluie."],["Tout le monde pensait qu’il ne valait plus rien.","Il a suffi que quelqu’un le regarde autrement.","On raconte que Michel-Ange voyait la statue déjà cachée dans la pierre.","Son travail consistait seulement à enlever ce qui était en trop.","J’aime cette idée : il y a peut-être, en chacun de nous, quelque chose qui attend d’être révélé."]]},{id:"c8",title:"Les fils de couleur",mots:["Chinchero","tisserande","cochenille","condor","châle","transmettent"],pages:[["Dans les Andes, au Pérou, le village de Chinchero est perché à plus de trois mille cinq cents mètres.","L’air est froid et léger. Je m’essouffle au moindre escalier.","Sous un toit de tuiles, des femmes en jupes brodées filent la laine.","Leur fuseau tourne sans arrêt, même quand elles parlent."],["Une tisserande, Rosa, nous montre comment on prépare les couleurs.","Dans de grandes marmites, des plantes, des racines et des fleurs bouillent doucement.","— Avec ces feuilles, on obtient du jaune. Avec celles-ci, du vert, explique-t-elle.","Puis elle écrase un petit insecte gris dans le creux de sa main.","Aussitôt, une tache rouge vif apparaît.","— C’est la cochenille. Elle vit sur les cactus. Elle nous donne tous nos rouges et nos roses."],["Rosa s’installe devant son métier à tisser, attaché à sa taille par une ceinture.","L’autre bout est accroché à un poteau. Elle se penche en arrière pour tendre les fils.","Ses doigts comptent les fils plus vite que mes yeux ne peuvent suivre.","Lentement, des motifs apparaissent : un lac, un condor, des montagnes en zigzag."],["— Nos ancêtres incas n’écrivaient pas avec des lettres, dit Rosa. Nos tissus parlaient pour nous.","— Chaque motif a un sens. Chaque village a ses dessins.","— En regardant un châle, on sait d’où vient la personne qui le porte.","Pour un grand châle, il faut parfois plusieurs mois de travail.","Je pense au tee-shirt que je porte. Je ne sais même pas qui l’a fabriqué."],["Le lendemain, nous prenons l’avion du retour.","Dans mon sac, il y a un petit bracelet tissé par Rosa.","J’ouvre mon carnet et je le feuillette depuis la première page.","La vague de Hokusai. Les pétales orange. L’étoile de zellige.","La kora sous le fromager. Les points du désert. Le kolam du matin. Le géant de marbre."],["Je remarque que toutes ces histoires se ressemblent.","Partout, des gens prennent le temps de bien faire un geste.","Ils l’apprennent de quelqu’un, le répètent, puis le transmettent à leur tour.","Le monde est immense, et ses cultures sont très différentes.","Pourtant, partout, la beauté naît de la même chose : la patience et le partage.","Je ferme mon carnet. Il n’est pas fini. Il ne fait que commencer."]]}];var Fm=e=>/[\p{L}\d]/u.test(e),qm=e=>/^[—–«»"]+$/.test(e),Um=(e,t)=>/[.!?…]["»]?$/.test(e)&&(!t||/^[\p{Lu}—«]/u.test(t));function Ud(e,t,n){let r=[],l=[],s=[],o=e.pages.map((a,m)=>{let h=[],v=[];return{lines:a.map(S=>{let w=s.length;s.push(null),v.push(w);let _=S.split(/\s+/).filter(Boolean),p=[],d=null;return _.forEach((f,y)=>{d||(d={page:m,ids:[]},l.push(d),h.push(l.length-1));let k=r.length;r.push({t:f,word:Fm(f),s:l.length-1,l:w,page:m}),d.ids.push(k),p.push(k),Um(f,_[y+1])&&(d=null)}),s[w]={ids:p},p}),lineIdx:v,sentences:h}}),u=a=>a.map(m=>r[m].t).filter(m=>!qm(m)).join(" ");s.forEach((a,m)=>{let h=u(a.ids);a.item={text:h,s:m,toks:[],chars:h.length}}),l.forEach(a=>{let m=u(a.ids);a.item={text:m,s:-1,toks:[],chars:m.length}});let c=r.filter(a=>a.word).length;return{...e,index:t,series:n,tokens:r,sentences:l,lineItems:s,pages:o,words:c}}var Jd=e=>e.replace(/^[^\p{L}\d]+|[^\p{L}\d]+$/gu,""),Se=[{n:"Presto",c:"#4a2d85"},{n:"Vivace",c:"#4c47a3"},{n:"Allegro",c:"#4561bb"},{n:"Allegretto",c:"#3a7ccf"},{n:"Moderato",c:"#3d9ae0"},{n:"Andante",c:"#62b2e6"},{n:"Adagio",c:"#8dc8ee"},{n:"Lento",c:"#b4dbf4"},{n:"Largo",c:"#d6ecfa"}],Ae={cycle3:{id:"cycle3",label:"Cycle 3 · Aventures dans un monde de blocs",short:"Cycle 3",hint:"Récits courts inspirés de Minecraft (environ 150 à 280 mots).",wpm:[108,99,91,83,75,66,58,50,41],fast:220,preview:["Je casse du bois avec mes mains.","Je fabrique une table et une pioche."]},college:{id:"college",label:"Collège · Carnets du monde",short:"Collège",hint:"Art, voyages et cultures du monde (environ 280 à 370 mots), narrateur sans marque de genre.",wpm:[170,155,142,130,118,106,94,82,70],fast:260,preview:["Dans la médina, les ruelles sont étroites.","Ça sent le cuir, la menthe et le pain chaud."]}};Ae.cycle3.texts=Od.map((e,t)=>Ud(e,t,"cycle3"));Ae.college.texts=Ad.map((e,t)=>Ud(e,t,"college"));var bo=["cycle3","college"],Ir=e=>Ae[e&&e.series]
