<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pythagore en situation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : une fenêtre KDE Breeze — barre de titre, panneau latéral, vue principale ; un exercice à la fois */
:root{
  --window:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --alt:#f4f5f6; --btn:#f7f8f8; --field:#ffffff;
  --text:#232629; --muted:#5b646d; --border:#c2c7cb; --line:#dde0e3; --hover:rgba(61,174,233,.09);
  --accent:#3daee9; --accent-ink:#1a6c9c; --accent-soft:rgba(61,174,233,.15);
  --good:#1e8a4f; --good-soft:rgba(39,174,96,.11); --bad:#c0364a; --bad-soft:rgba(218,68,83,.09);
  --warn:#b85900; --warn-soft:rgba(246,116,0,.11);
  --star:#e6a700;
  --font:"Noto Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --window:#232629; --view:#1b1e20; --header:#2a2e32; --alt:#202326; --btn:#2c3136; --field:#141618;
  --text:#eff0f1; --muted:#a2aab2; --border:#434a51; --line:#33383d; --hover:rgba(61,174,233,.11);
  --accent:#3daee9; --accent-ink:#72c6f0; --accent-soft:rgba(61,174,233,.2);
  --good:#41c77f; --good-soft:rgba(39,174,96,.16); --bad:#f26b7d; --bad-soft:rgba(218,68,83,.16);
  --warn:#ff9d45; --warn-soft:rgba(246,116,0,.16);
  --star:#f6c443;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --window:#232629; --view:#1b1e20; --header:#2a2e32; --alt:#202326; --btn:#2c3136; --field:#141618;
  --text:#eff0f1; --muted:#a2aab2; --border:#434a51; --line:#33383d; --hover:rgba(61,174,233,.11);
  --accent:#3daee9; --accent-ink:#72c6f0; --accent-soft:rgba(61,174,233,.2);
  --good:#41c77f; --good-soft:rgba(39,174,96,.16); --bad:#f26b7d; --bad-soft:rgba(218,68,83,.16);
  --warn:#ff9d45; --warn-soft:rgba(246,116,0,.16);
  --star:#f6c443;
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:var(--font)}
.app{font-size:15px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
.app.big{font-size:18px;line-height:1.75;letter-spacing:.015em;word-spacing:.06em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
b{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
sup{font-size:.7em;line-height:0}
.rad{white-space:nowrap}
.rad-sign{padding-right:.04em}
.rad-in{border-top:1.5px solid currentColor;padding:0 .14em 0 .1em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Barre de titre */
.titlebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:.7em;padding:.4em 16px;background:var(--header);border-bottom:1px solid var(--border);min-height:46px}
.titlebar svg{flex:none}
.tb-name{font-weight:600}
.tb-sub{color:var(--muted);font-size:.87em}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:.55em;font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.switch{display:inline-flex;align-items:center;gap:.45em;font-size:.87em;cursor:pointer;background:none;border:0;padding:.3em .2em}
.switch .track{width:30px;height:16px;border-radius:8px;border:1px solid var(--border);background:var(--field);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .track{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(14px);background:var(--accent)}

/* Structure */
.layout{flex:1;display:grid;grid-template-columns:240px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side-cap{font-size:.74em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.5em .75em .35em}
.side-item{display:flex;align-items:center;gap:.65em;width:100%;padding:.45em .7em;border:1px solid transparent;border-radius:4px;background:none;text-align:left;cursor:pointer}
.side-item:hover{background:var(--hover)}
.side-item[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.side-item .ic{width:22px;height:22px;flex:none;color:var(--muted)}
.side-item[aria-current="page"] .ic{color:var(--accent-ink)}
.side-item .cnt{margin-left:auto;font-size:.8em;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:1em .5em .3em;display:grid;gap:.4em;font-size:.85em}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;text-align:left}
.main{background:var(--view);min-width:0}
.wrap{max-width:860px;width:100%;margin:0 auto;padding-inline:28px}
.head{padding-block:1.5em .4em}
.head h2{font-size:1.5em;font-weight:600}
.head p{color:var(--muted);margin-top:.25em;max-width:64ch}
.page{padding-block:1.2em 4em;display:grid;gap:1.4em}
.lead{color:var(--muted);font-size:.93em;max-width:66ch}

/* Cadres et sections */
.frame{background:var(--view);border:1px solid var(--line);border-radius:5px;padding:1em 1.1em}
.sec{display:grid;gap:.7em}
.sec h3{font-size:1.12em;font-weight:600;display:flex;gap:.55em;align-items:baseline}
.sec h3 .sn{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.sec p{max-width:66ch}
.hidden-list{margin:0;padding-left:1.2em;display:grid;gap:.25em}
details.redac{border:1px solid var(--line);border-radius:5px;background:var(--alt)}
details.redac summary{cursor:pointer;padding:.65em 1em;font-weight:600;list-style-position:inside}
details.redac[open] summary{border-bottom:1px solid var(--line)}
details.redac .body{padding:.75em 1.1em;display:grid;gap:.4em;font-variant-numeric:tabular-nums}
.parts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:4px;background:var(--view)}
.parts>div{padding:.5em .8em;min-width:0}
.parts>div+div{border-left:1px solid var(--border)}
.pt{font-size:.75em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.15em}

/* Organigramme de décision */
.flow{display:grid;gap:.55em;justify-items:center;text-align:center}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:.9em;width:100%}
.branch .branches{grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr))}
.branch{display:grid;gap:.5em;align-content:start;justify-items:center;border-top:2px solid var(--line);padding-top:.6em}
.node{border:1px solid var(--border);border-radius:5px;padding:.55em .85em;background:var(--view);max-width:30em;min-width:0}
.node.q{background:var(--alt);font-weight:600}
.node .sub{font-weight:400;font-size:.85em;color:var(--muted);margin-top:.2em}
.node.r{border-color:var(--accent);background:var(--accent-soft)}
.node.r b{display:block}
.node.end{font-size:.92em}
.edge-lab{font-size:.85em;color:var(--accent-ink);font-weight:600}
.edge-lab::before{content:"↓ ";color:var(--muted)}

/* Boutons, champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.35em .95em;border:1px solid var(--border);border-radius:3px;background:var(--btn);cursor:pointer;min-height:2.2em;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{border-color:var(--accent);background:var(--accent-soft)}
.btn.small{min-height:1.9em;padding:.2em .7em;font-size:.88em}
.btn:disabled{opacity:.55;cursor:default}
.btn.right{border-color:var(--good);background:var(--good-soft);opacity:1}
.btn.wrong{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.field{padding:.35em .6em;border:1px solid var(--border);border-radius:3px;background:var(--field);width:7.5em;min-height:2.2em;font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}

/* Messages type KMessageWidget */
.msg{display:flex;gap:.65em;align-items:flex-start;padding:.6em .85em;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px}
.msg .mi{flex:none;width:1.35em;height:1.35em;border-radius:50%;display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--view);background:var(--accent);margin-top:.12em}
.msg.good{border-color:var(--good);background:var(--good-soft)}.msg.good .mi{background:var(--good)}
.msg.bad{border-color:var(--bad);background:var(--bad-soft)}.msg.bad .mi{background:var(--bad)}
.msg.warn{border-color:var(--warn);background:var(--warn-soft)}.msg.warn .mi{background:var(--warn)}
.msg>div{min-width:0}

/* Figures */
.fig{display:block;width:100%;max-width:330px;height:auto}
svg text{font-family:var(--font)}
.tri-fill{fill:var(--alt);stroke:none}
.edge{stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.alt{stroke:var(--accent-ink);stroke-width:2;stroke-dasharray:6 4}
.ra{fill:none;stroke:var(--text);stroke-width:1.5}
.vx{fill:var(--text);font-size:15px;font-weight:700}
.sl{fill:var(--muted);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--view);stroke-width:4;stroke-linejoin:round}

/* Quiz */
.q-prompt{font-size:1.1em;font-weight:500}
.opts{display:grid;gap:.5em}
.opt{display:flex;gap:.75em;align-items:center;width:100%;text-align:left;padding:.55em .8em;border:1px solid var(--border);border-radius:4px;background:var(--btn);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .letter{flex:none;width:1.7em;height:1.7em;border-radius:3px;border:1px solid var(--border);display:grid;place-items:center;font-size:.82em;font-weight:600;background:var(--view)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* Navigation entre exercices */
.pager{display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.pg{min-width:2.3em;height:2.3em;border:1px solid var(--border);border-radius:3px;background:var(--btn);cursor:pointer;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0 .4em}
.pg[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.pg.done{border-color:var(--good);color:var(--good);font-weight:600}
.pg.done[aria-current="true"]{background:var(--good-soft)}
.pg-lv{font-size:.78em;color:var(--muted);padding:0 .3em 0 .6em}
.pg-lv:first-child{padding-left:0}

/* Exercices */
.excard{display:grid;gap:.9em}
.excard.done{border-color:var(--good)}
.ex-top{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;font-size:.88em;color:var(--muted)}
.ex-top .t{font-weight:600;color:var(--text);font-size:1.05em}
.stars{display:inline-flex;gap:1px;vertical-align:-.15em}
.stars svg{width:1em;height:1em}
.star-on{fill:var(--star)}.star-off{fill:none;stroke:var(--muted);stroke-width:1.3}
.solved{color:var(--good);font-weight:600}
.prompt{font-size:1.06em;max-width:66ch;font-variant-numeric:tabular-nums}
.part{display:grid;gap:.7em;border-top:1px solid var(--line);padding-top:.85em}
.part-q{font-weight:600;display:flex;gap:.5em}
.part-q .pl{color:var(--accent-ink)}
.stepbox{display:grid;gap:.5em;border:1px solid var(--line);border-radius:4px;padding:.65em .8em;background:var(--alt)}
.stepbox.locked{opacity:.6}
.step-t{font-size:.78em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;gap:.5em;align-items:center}
.step-t .ok{color:var(--good)}
.choices{display:flex;flex-wrap:wrap;gap:.5em}
.answer{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.answer label{font-size:.9em;color:var(--muted)}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:.7em}
.steps li{counter-increment:s;display:grid;grid-template-columns:1.9em minmax(0,1fr);gap:.55em;align-items:start}
.steps li::before{content:counter(s);width:1.75em;height:1.75em;border-radius:50%;border:1px solid var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.82em;font-weight:600;background:var(--view)}
.steps .st{font-weight:600}
.steps .sd{font-variant-numeric:tabular-nums}
.corr{display:grid;gap:.7em;border-top:1px dashed var(--border);padding-top:.75em}
.corr h4{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.worked{border-color:var(--accent);display:grid;gap:.8em}
.badge{display:inline-flex;font-size:.75em;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:.1em .5em;background:var(--accent-soft)}
.nav-row{display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap}

@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px 16px;gap:6px;background:var(--window)}
  .side-cap,.side-foot{display:none}
  .side-item{flex:none;width:auto}
  .side-item .cnt{display:none}
  .wrap{padding-inline:16px}
  .tb-sub{display:none}
  .bar{width:56px}
}
@media (max-width:480px){
  .parts{grid-template-columns:1fr}
  .parts>div+div{border-left:0;border-top:1px solid var(--border)}
  .switch .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect } = React;
const html = htm.bind(React.createElement);

/* ================= Outils ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pys_" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("pys_" + k, JSON.stringify(v)); }catch(e){} }
};
const fmt = x => { const r = Math.round(x * 10000) / 10000; const s = String(Math.abs(r)).replace(".", ","); return (r < 0 ? "−" : "") + s; };
const parseNum = s => {
  if (s == null) return NaN;
  const t = String(s).trim().replace(/\s/g, "").replace(/[−–]/g, "-").replace(",", ".");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return parseFloat(t);
};
const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-6 : tol);
const fm = h => String(h)
  .replace(/√\{([^}]*)\}/g, '<span class="rad"><span class="rad-sign">√</span><span class="rad-in">$1</span></span>')
  .replace(/\^(\d)/g, "<sup>$1</sup>");
const H = ({ h, as = "span", className }) => React.createElement(as, { className, dangerouslySetInnerHTML: { __html: fm(h) } });
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const ICON = { good: "✓", bad: "✕", warn: "!", info: "i" };
function Msg({ kind = "info", children }){
  return html`<div className=${"msg " + kind} role=${kind === "bad" || kind === "warn" ? "alert" : "status"}><span className="mi" aria-hidden="true">${ICON[kind]}</span><div>${children}</div></div>`;
}
function Stars({ n }){
  const p = "M8 1.2l2 4.3 4.7.6-3.4 3.3.8 4.7L8 11.8 3.9 14.1l.8-4.7L1.3 6.1 6 5.5z";
  return html`<span className="stars" aria-label=${"Difficulté " + n + " sur 3"}>${[1,2,3].map(i => html`<svg key=${i} viewBox="0 0 16 16" aria-hidden="true"><path d=${p} className=${i <= n ? "star-on" : "star-off"}/></svg>`)}</span>`;
}
function Sec({ n, title, children }){
  return html`<section className="sec">${title && html`<h3>${n != null && html`<span className="sn">${n}.</span>`}<span>${title}</span></h3>`}${children}</section>`;
}
function Parts({ l, r }){
  return html`<div className="parts"><div><div className="pt">D'une part</div><${H} as="div" h=${l}/></div><div><div className="pt">D'autre part</div><${H} as="div" h=${r}/></div></div>`;
}
function Steps({ list }){
  return html`<ol className="steps">${list.map(([t, d], k) => html`<li key=${k}><div><div className="st"><${H} h=${t}/></div><${H} as="div" className="sd" h=${d}/></div></li>`)}</ol>`;
}

/* ================= Figures ================= */
/* Triangle dessiné à l'échelle. v = [n0,n1,n2] ; len = [n0n1, n1n2, n2n0] ; lab = textes ; right = indice du sommet codé droit ; rot = rotation en degrés */
function TriSides({ v, len, lab = [], right = null, rot = 0 }){
  const sides = [[0, 1, len[0]], [1, 2, len[1]], [2, 0, len[2]]];
  let k = 0; sides.forEach((s, i) => { if (s[2] > sides[k][2]) k = i; });
  const [a, b, L] = sides[k]; const o = 3 - a - b;
  const dist = (i, j) => sides.find(s => (s[0] === i && s[1] === j) || (s[0] === j && s[1] === i))[2];
  const da = dist(a, o), db = dist(b, o);
  const x = (L * L + da * da - db * db) / (2 * L), y = Math.sqrt(Math.max(0, da * da - x * x));
  let P = []; P[a] = [0, 0]; P[b] = [L, 0]; P[o] = [x, -y];
  const t = rot * Math.PI / 180;
  P = P.map(([px, py]) => [px * Math.cos(t) - py * Math.sin(t), px * Math.sin(t) + py * Math.cos(t)]);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const W = Math.max(...xs) - minX, Hh = Math.max(...ys) - minY;
  const sc = Math.min(250 / W, 170 / Hh), pad = 42;
  const Q = P.map(p => [(p[0] - minX) * sc + pad, (p[1] - minY) * sc + pad]);
  const G = [(Q[0][0] + Q[1][0] + Q[2][0]) / 3, (Q[0][1] + Q[1][1] + Q[2][1]) / 3];
  const out = (p, d) => { const dx = p[0] - G[0], dy = p[1] - G[1], n = Math.hypot(dx, dy) || 1; return [p[0] + dx / n * d, p[1] + dy / n * d]; };
  const pairs = [[0, 1], [1, 2], [2, 0]];
  let ra = null;
  if (right != null){
    const r = Q[right], others = [0, 1, 2].filter(i => i !== right);
    const u = others.map(i => { const dx = Q[i][0] - r[0], dy = Q[i][1] - r[1], n = Math.hypot(dx, dy); return [dx / n * 12, dy / n * 12]; });
    ra = [[r[0] + u[0][0], r[1] + u[0][1]], [r[0] + u[0][0] + u[1][0], r[1] + u[0][1] + u[1][1]], [r[0] + u[1][0], r[1] + u[1][1]]].map(p => p.join(",")).join(" ");
  }
  return html`<svg className="fig" viewBox=${"0 0 " + (W * sc + 2 * pad) + " " + (Hh * sc + 2 * pad)} role="img" aria-label=${"Triangle " + v.join("") + (right != null ? ", angle droit codé en " + v[right] : "") + " : " + pairs.map((p, i) => v[p[0]] + v[p[1]] + " = " + (lab[i] || "?")).join(", ")}>

/* Triangle coupé par une hauteur. n = noms {A sommet, B gauche, C droite, H pied} */
function HeightFig({ n = { A: "A", B: "B", C: "C", H: "H" }, d, lab = {}, right = true }){
  const W = d.bh + d.hc, sc = Math.min(270 / W, 150 / d.ah), pad = 40;
  const y0 = pad + d.ah * sc;
  const B = [pad, y0], Hp = [pad + d.bh * sc, y0], C = [pad + W * sc, y0], A = [pad + d.bh * sc, pad];
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const mAB = mid(A, B), mAC = mid(A, C);
  return html`<svg className="fig" viewBox=${"0 0 " + (W * sc + 2 * pad) + " " + (y0 + 34)} role="img" aria-label=${"Triangle " + n.A + n.B + n.C + " et le segment [" + n.A + n.H + "]"}>
    <polygon points=${[A, B, C].map(p => p.join(",")).join(" ")} className="tri-fill"/>
    <polygon points=${[A, B, C].map(p => p.join(",")).join(" ")} className="edge"/>
    <line x1=${A[0]} y1=${A[1]} x2=${Hp[0]} y2=${Hp[1]} className="alt"/>
    ${right && html`<polyline points=${(Hp[0] + 11) + "," + y0 + " " + (Hp[0] + 11) + "," + (y0 - 11) + " " + Hp[0] + "," + (y0 - 11)} className="ra"/>`}
    <text x=${A[0]} y=${A[1] - 10} textAnchor="middle" className="vx">${n.A}</text>
    <text x=${B[0] - 8} y=${y0 + 18} textAnchor="end" className="vx">${n.B}</text>
    <text x=${C[0] + 8} y=${y0 + 18} className="vx">${n.C}</text>
    <text x=${Hp[0]} y=${y0 + 20} textAnchor="middle" className="vx">${n.H}</text>
    ${lab.AB && html`<text x=${mAB[0] - 10} y=${mAB[1] - 4} textAnchor="end" className="sl">${lab.AB}</text>`}
    ${lab.AC && html`<text x=${mAC[0] + 10} y=${mAC[1] - 4} className="sl">${lab.AC}</text>`}
    ${lab.AH && html`<text x=${A[0] + 7} y=${(A[1] + y0) / 2 + 4} className="sl">${lab.AH}</text>`}

    ${lab.HC && html`<text x=${(Hp[0] + C[0]) / 2} y=${y0 - 7} textAnchor="middle" className="sl">${lab.HC}</text>`}
  </svg>`;
}
/* Quadrilatère ABCD du défi 3 : B angle droit, AB = 15, BC = 20, CD = 7, DA = 24 */
function QuadFig(){
  const k = 11, pad = 34, P = { A: [0, 15], B: [0, 0], C: [20, 0], D: [22.464, 6.552] };
  const T = p => [p[0] * k + pad + 30, (15 - p[1]) * k + pad];
  const Q = {}; for (const n in P) Q[n] = T(P[n]);
  const poly = ["A", "B", "C", "D"].map(n => Q[n].join(",")).join(" ");
  const lbl = (t, x, y, a = "middle") => html`<text x=${x} y=${y} textAnchor=${a} className="sl">${t}</text>`;
  return html`<svg className="fig" viewBox=${"0 0 " + (22.5 * k + 2 * pad + 40) + " " + (15 * k + 2 * pad)} role="img" aria-label="Quadrilatère ABCD avec un angle droit en B, AB = 15 cm, BC = 20 cm, CD = 7 cm, DA = 24 cm">
    <polygon points=${poly} className="tri-fill"/>
    <polygon points=${poly} className="edge"/>
    <line x1=${Q.A[0]} y1=${Q.A[1]} x2=${Q.C[0]} y2=${Q.C[1]} className="alt"/>
    <polyline points=${(Q.B[0] + 12) + "," + Q.B[1] + " " + (Q.B[0] + 12) + "," + (Q.B[1] - 12) + " " + Q.B[0] + "," + (Q.B[1] - 12)} className="ra"/>
    <text x=${Q.A[0] - 8} y=${Q.A[1] - 6} textAnchor="end" className="vx">A</text>
    <text x=${Q.B[0] - 8} y=${Q.B[1] + 16} textAnchor="end" className="vx">B</text>
    <text x=${Q.C[0]} y=${Q.C[1] + 20} textAnchor="middle" className="vx">C</text>
    <text x=${Q.D[0] + 9} y=${Q.D[1] + 5} className="vx">D</text>
    ${lbl("15 cm", Q.A[0] - 8, (Q.A[1] + Q.B[1]) / 2 + 4, "end")}
    ${lbl("20 cm", (Q.B[0] + Q.C[0]) / 2, Q.B[1] + 18)}
    ${lbl("7 cm", (Q.C[0] + Q.D[0]) / 2 + 22, (Q.C[1] + Q.D[1]) / 2 + 6)}
    ${lbl("24 cm", (Q.A[0] + Q.D[0]) / 2 + 6, (Q.A[1] + Q.D[1]) / 2 - 10)}
  </svg>`;
}
function Fig({ f }){
  if (!f) return null;
  if (f.kind === "sides") return html`<${TriSides} ...${f}/>`;
  if (f.kind === "height") return html`<${HeightFig} ...${f}/>`;

  return null;
}

function Quiz({ qs, onNew }){
  const [i, setI] = useState(0);

  const [done, setDone] = useState(false);
  if (done) return html`<div className="frame" style=${{ display: "grid", gap: "1em" }}><${Msg} kind=${score >= qs.length - 1 ? "good" : "info"}>Score : ${score} sur ${qs.length}. ${score >= qs.length - 1 ? "Tu sais reconnaître les situations : passe à l'entraînement." : "Relis l'organigramme de l'aide-mémoire, puis refais une série."}<//><div className="row"><button className="btn primary" onClick=${() => { onNew(); setI(0); setPick(null); setScore(0); setDone(false); }}>Nouvelle série</button></div></div>`;
  const q = qs[i];
  const choose = k => { if (pick != null) return; setPick(k); if (k === q.a) setScore(score + 1); };
  const next = () => { if (i + 1 < qs.length){ setI(i + 1); setPick(null); } else setDone(true); };
  return html`<div className="frame" style=${{ display: "grid", gap: "1em" }}>
    <div className="row" style=${{ justifyContent: "space-between" }}><span className="muted" style=${{ fontSize: ".85em" }}>Situation ${i + 1} sur ${qs.length}</span><span className="muted num" style=${{ fontSize: ".85em" }}>Score : ${score}</span></div>
    <div className="q-prompt"><${H} h=${q.q}/></div>
    <div className="opts">${q.o.map((o, k) => html`<button key=${k} className=${"opt" + (pick != null && k === q.a ? " right" : "") + (pick === k && k !== q.a ? " wrong" : "")} onClick=${() => choose(k)} disabled=${pick != null}><span className="letter">${"ABCD"[k]}</span><${H} h=${o}/></button>`)}</div>
    ${pick != null && html`<${Msg} kind=${pick === q.a ? "good" : "bad"}><b>${pick === q.a ? "Bonne réponse. " : "Ce n'est pas ça. "}</b><${H} h=${q.e}/><//>`}
    ${pick != null && html`<div className="row"><button className="btn primary" onClick=${next}>${i + 1 < qs.length ? "Situation suivante" : "Voir mon score"}</button></div>`}
  </div>`;
}

function toolFeedback(right, pick){
  if (right === 2) return "Relis l'énoncé : sait-on vraiment que le triangle est rectangle ? Si on ne le sait pas, on ne peut pas utiliser le théorème.";
  if (pick === 2) return "L'énoncé dit (ou permet de savoir) que le triangle est rectangle, et on cherche une longueur. Cherche où est l'angle droit.";
  return "Repère l'angle droit, puis le côté qui est en face : c'est l'hypoténuse. La longueur cherchée est-elle ce côté-là ?";
}
function evaluate(p, v){
  if (p.type === "choice") return v === p.a ? { ok: true, kind: "good", msg: "C'est juste. Bravo !" } : { ok: false, kind: "bad", msg: "Pas encore. Reprends le calcul du plus grand côté, puis compare." };
  const x = parseNum(v);
  if (isNaN(x)) return { ok: false, kind: "warn", msg: "Écris un nombre, par exemple 7,5." };
  if (near(x, p.a)) return { ok: true, kind: "good", msg: "C'est juste. Bravo !" };
  if (p.alt) for (const [y, m] of p.alt) if (near(x, y, 1e-6)) return { ok: false, kind: "bad", msg: m };
  if (p.alt) for (const [y, m] of p.alt) if (Math.abs(y) > 1 && near(x, y, .051)) return { ok: false, kind: "bad", msg: m };
  if (p.round && Math.abs(x - p.a) < .1) return { ok: false, kind: "bad", msg: "Tu y es presque : vérifie l'arrondi au dixième (regarde le chiffre des centièmes)." };
  return { ok: false, kind: "bad", msg: "Pas encore. Vérifie chaque étape, ou demande un indice." };
}
function Part({ p, label, solved, onSolved }){
  const needTool = p.tool != null;
  const [tool, setTool] = useState(needTool ? null : -1);
  const [tries, setTries] = useState([]);
  const [val, setVal] = useState("");
  const [pick, setPick] = useState(null);
  const [fb, setFb] = useState(null);
  const [hint, setHint] = useState(false);
  const [corr, setCorr] = useState(false);
  const toolOk = !needTool || tool === p.tool;
  const revealTool = needTool && !toolOk && tries.length >= 2;
  const chooseTool = k => { if (toolOk) return; setTries([...tries, k]); if (k === p.tool) setTool(k); };
  const check = v => { const r = evaluate(p, v); setFb(r); if (r.ok) onSolved(p.id); };
  const id = "in-" + p.id.replace(".", "-");
  const lastWrong = needTool && !toolOk && tries.length ? tries[tries.length - 1] : null;
  return html`<div className="part">
    ${label && html`<div className="part-q"><span className="pl">${label}</span><${H} h=${p.q}/>${solved && html`<span className="solved" style=${{ fontWeight: 600 }}>✓</span>`}</div>`}
    ${needTool && html`<div className="stepbox">
      <div className="step-t">Étape 1 · Quel outil ?${toolOk && html`<span className="ok">✓</span>`}</div>
      <div className="choices">${TOOLS.map((t, k) => html`<button key=${k} className=${"btn" + (toolOk && k === p.tool ? " right" : "") + (!toolOk && tries.includes(k) ? " wrong" : "")} disabled=${toolOk || tries.includes(k)} onClick=${() => chooseTool(k)}>${t}</button>`)}</div>
      ${toolOk && html`<${Msg} kind="good"><${H} h=${p.why}/><//>`}
      ${lastWrong != null && !revealTool && html`<${Msg} kind="bad">${toolFeedback(p.tool, lastWrong)}<//>`}
      ${revealTool && html`<${Msg} kind="warn">L'outil qui convient : <b>${TOOL_SHORT[p.tool]}</b>. <${H} h=${p.why}/> <button className="linkbtn" onClick=${() => setTool(p.tool)}>Continuer</button><//>`}
    </div>`}
    <div className=${"stepbox" + (toolOk ? "" : " locked")}>
      <div className="step-t">${needTool ? "Étape 2 · Je calcule et je conclus" : "Je calcule"}</div>
      ${!toolOk ? html`<p className="muted" style=${{ fontSize: ".9em" }}>Choisis d'abord l'outil.</p>`
        : p.type === "choice"
          ? html`<div className="choices" role="group" aria-label="Ta conclusion">${p.opts.map((o, k) => html`<button key=${k} className=${"btn" + (pick === k ? (k === p.a ? " right" : " wrong") : "")} onClick=${() => { setPick(k); check(k); }}>${o}</button>`)}</div>`
          : html`<form className="answer" onSubmit=${e => { e.preventDefault(); check(val); }}><label htmlFor=${id}>Ta réponse</label><input id=${id} className="field" autoComplete="off" value=${val} onChange=${e => { setVal(e.target.value); setFb(null); }}/>${p.unit && html`<span>${p.unit}</span>`}<button className="btn primary" type="submit">Vérifier</button></form>`}
      ${fb && html`<${Msg} kind=${fb.kind}><${H} h=${fb.msg}/><//>`}
    </div>
    <div className="row">
      <button className="btn small" onClick=${() => setHint(!hint)} aria-expanded=${hint}>${hint ? "Masquer l'indice" : "Indice"}</button>
      <button className="btn small" onClick=${() => setCorr(!corr)} aria-expanded=${corr}>${corr ? "Masquer la correction" : "Voir la correction"}</button>
    </div>
    ${hint && html`<${Msg} kind="info">${toolOk ? html`<${H} h=${p.hint}/>` : "Pose-toi deux questions : sait-on que le triangle est rectangle ? Que cherche-t-on : une longueur, ou savoir s'il est rectangle ?"}<//>`}
    ${corr && html`<div className="corr"><h4>Correction détaillée</h4><${Steps} list=${[...(needTool ? [S("Je reconnais la situation", p.why + " → <b>" + TOOL_SHORT[p.tool] + "</b>.")] : []), ...p.c]}/></div>`}
  </div>`;
}
function ExItem({ e, n, solved, onSolved, kindLabel }){
  const multi = e.parts.length > 1;
  const done = e.parts.every(p => solved.has(p.id));
  return html`<article className=${"frame excard" + (done ? " done" : "")}>
    <div className="ex-top"><span className="t">${kindLabel} ${n}</span><${Stars} n=${e.lv}/>${done && html`<span className="solved">✓ réussi</span>`}</div>
    <div className="prompt"><${H} h=${e.q}/></div>
    <${Fig} f=${e.fig}/>
    ${e.parts.map((p, j) => html`<${Part} key=${p.id} p=${p} label=${multi ? "abc"[j] + ")" : null} solved=${solved.has(p.id)} onSolved=${onSolved}/>`)}
  </article>`;
}
function Series({ list, title, intro, kindLabel, solved, onSolved, store: sk }){
  const [i, setI] = useState(() => Math.min(store.get(sk, 0), list.length - 1));
  useEffect(() => store.set(sk, i), [i]);
  const go = k => { setI(k); window.scrollTo({ top: 0 }); };
  const isDone = e => e.parts.every(p => solved.has(p.id));
  return html`<div className="wrap">
    <div className="head"><h2>${title}</h2><p>${intro}</p></div>
    <div className="page">
      <nav className="pager" aria-label="Choisir l'exercice">${list.map((e, k) => html`<${React.Fragment} key=${k}>${(k === 0 || list[k - 1].lv !== e.lv) && list.some(x => x.lv !== list[0].lv) && html`<span className="pg-lv"><${Stars} n=${e.lv}/></span>`}<button className=${"pg" + (isDone(e) ? " done" : "")} aria-current=${k === i} aria-label=${kindLabel + " " + (k + 1) + (isDone(e) ? ", réussi" : "")} onClick=${() => go(k)}>${k + 1}</button><//>`)}</nav>
      <${ExItem} key=${list[i].id} e=${list[i]} n=${i + 1} solved=${solved} onSolved=${onSolved} kindLabel=${kindLabel}/>
      <div className="nav-row">
        <button className="btn" disabled=${i === 0} onClick=${() => go(i - 1)}>← Précédent</button>
        <button className="btn primary" disabled=${i === list.length - 1} onClick=${() => go(i + 1)}>Suivant →</button>
      </div>
    </div>
  </div>`;
}

/* ================= Application ================= */
const ICONS = {
  aide: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"><rect x="8" y="2.5" width="6" height="4" rx="1"/><rect x="2.5" y="15.5" width="6" height="4" rx="1"/><rect x="13.5" y="15.5" width="6" height="4" rx="1"/><path d="M11 6.5v4.5M5.5 15.5V11h11v4.5"/></svg>`,
  quiz: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><circle cx="11" cy="11" r="8.5"/><path d="M8.6 8.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><circle cx="11" cy="15.6" r=".6" fill="currentColor"/></svg>`,
  train: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"><path d="M4 18.5V3.5l14 15z"/><path d="M4 15h3.5v3.5" strokeWidth="1.1"/></svg>`,
  defi: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"><path d="M3 18.5V4l9 14.5zM12 18.5L19 7v11.5z"/></svg>`
};
function App(){
  const [view, setView] = useState(() => { const v = store.get("view", "aide"); return ["aide", "quiz", "train", "defi"].includes(v) ? v : "aide"; });
  const [solved, setSolved] = useState(() => new Set(store.get("solved", [])));
  const [big, setBig] = useState(() => store.get("big", false));
  const [confirmReset, setConfirmReset] = useState(false);
  useEffect(() => store.set("view", view), [view]);
  useEffect(() => store.set("big", big), [big]);
  useEffect(() => store.set("solved", [...solved]), [solved]);
  const onSolved = id => setSolved(s => s.has(id) ? s : new Set([...s, id]));
  const doneCount = list => list.filter(e => e.parts.every(p => solved.has(p.id))).length;
  const total = EX.length + DEFIS.length, nDone = doneCount(EX) + doneCount(DEFIS);
  const go = v => { setView(v); window.scrollTo({ top: 0 }); };
  const item = (k, label, cnt) => html`<button className="side-item" aria-current=${view === k ? "page" : undefined} onClick=${() => go(k)}>${ICONS[k]}<span>${label}</span>${cnt && html`<span className="cnt">${cnt}</span>`}</button>`;
  return html`<div className=${"app" + (big ? " big" : "")}>
    <header className="titlebar">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="4" fill="var(--accent)"/><path d="M6 18V6l12 12z" fill="none" stroke="var(--view)" strokeWidth="2" strokeLinejoin="round"/><path d="M6 14.5h3.5V18" fill="none" stroke="var(--view)" strokeWidth="1.5"/></svg>
      <span className="tb-name">Pythagore en situation</span><span className="tb-sub">Mathématiques 4e</span>
      <span className="spacer"></span>
      <button className="switch" role="switch" aria-checked=${big} aria-label="Texte agrandi" onClick=${() => setBig(!big)}><span className="track"></span><span className="lbl">Texte agrandi</span></button>
      <span className="prog" title="Exercices réussis"><span className="bar"><span style=${{ width: (nDone / total * 100) + "%" }}></span></span>${nDone}/${total}</span>
    </header>
    <div className="layout">
      <nav className="sidebar" aria-label="Sections">
        <div className="side-cap">Se préparer</div>
        ${item("aide", "Aide-mémoire")}
        ${item("quiz", "Quel outil ?")}
        <div className="side-cap" style=${{ marginTop: ".8em" }}>S'entraîner</div>
        ${item("train", "Exercices mélangés", doneCount(EX) + "/" + EX.length)}
        ${item("defi", "Défis", doneCount(DEFIS) + "/" + DEFIS.length)}
        <div className="side-foot">
          <span className="muted">Ta progression reste dans ce navigateur.</span>
          ${confirmReset
            ? html`<div className="row"><button className="btn small" onClick=${() => { setSolved(new Set()); setConfirmReset(false); }}>Oui, tout effacer</button><button className="btn small" onClick=${() => setConfirmReset(false)}>Annuler</button></div>`
            : html`<button className="linkbtn" onClick=${() => setConfirmReset(true)}>Effacer ma progression</button>`}
        </div>
      </nav>
      <main className="main">
        ${view === "aide" && html`<${Aide} go=${go}/>`}
        ${view === "quiz" && html`<${QuizPage}/>`}
        ${view === "train" && html`<${Series} list=${EX} title="Exercices mélangés" intro="Les situations sont mélangées et rien n'indique la méthode. Pour chaque exercice : choisis d'abord l'outil, puis calcule et conclus. Les exercices vont du plus simple au plus complexe." kindLabel="Exercice" solved=${solved} onSolved=${onSolved} store="iTrain"/>`}
        ${view === "defi" && html`<${Series} list=${DEFIS} title="Défis" intro="Chaque défi demande plusieurs outils, l'un après l'autre. Le résultat d'une question sert souvent à la suivante." kindLabel="Défi" solved=${solved} onSolved=${onSolved} store="iDefi"/>`}
      </main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>

</body></html>
