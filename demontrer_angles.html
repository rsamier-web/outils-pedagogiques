<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démontrer avec les angles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* Plan : application façon KDE Breeze — barre d'outils, barre latérale, vue claire ; bleu Breeze pour l'action, couleurs sémantiques réservées aux angles */
:root {
  --win: #eff0f1; --view: #fcfcfc; --alt: #f4f5f6; --text: #232629; --muted: #5d6166;
  --line: #d3d6d9; --line-strong: #aeb3b8;
  --accent: #3daee9; --accent-ink: #1b6fa0; --accent-soft: rgba(61, 174, 233, .14); --on-accent: #fff;
  --known: #2e8fd3; --known-ink: #1a6aa6; --unknown: #f67400; --unknown-ink: #b35400; --third: #9b59b6; --third-ink: #7d3c98;
  --secant: #da4453; --ok: #27ae60; --ok-ink: #1e7f47; --ok-soft: rgba(39, 174, 96, .12); --bad: #da4453; --bad-ink: #b0303e; --bad-soft: rgba(218, 68, 83, .1);
  --band: rgba(61, 174, 233, .10);
  --font: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 4px; --shadow: 0 1px 2px rgba(35, 38, 41, .07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1e2124; --alt: #25292d; --text: #eff0f1; --muted: #a3a9b0;
    --line: #3d4248; --line-strong: #586068;
    --accent: #3daee9; --accent-ink: #6cc4f0; --accent-soft: rgba(61, 174, 233, .18); --on-accent: #0f1214;
    --known: #4aa8eb; --known-ink: #7cc2f2; --unknown: #f67400; --unknown-ink: #ff9a45; --third: #b07cc6; --third-ink: #c99ad9;
    --secant: #ed5565; --ok: #2ecc71; --ok-ink: #5fd88f; --ok-soft: rgba(46, 204, 113, .13); --bad: #ed5565; --bad-ink: #ff8a95; --bad-soft: rgba(237, 85, 101, .13);
    --band: rgba(61, 174, 233, .12); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1e2124; --alt: #25292d; --text: #eff0f1; --muted: #a3a9b0;
  --line: #3d4248; --line-strong: #586068;
  --accent: #3daee9; --accent-ink: #6cc4f0; --accent-soft: rgba(61, 174, 233, .18); --on-accent: #0f1214;
  --known: #4aa8eb; --known-ink: #7cc2f2; --unknown: #f67400; --unknown-ink: #ff9a45; --third: #b07cc6; --third-ink: #c99ad9;
  --secant: #ed5565; --ok: #2ecc71; --ok-ink: #5fd88f; --ok-soft: rgba(46, 204, 113, .13); --bad: #ed5565; --bad-ink: #ff8a95; --bad-soft: rgba(237, 85, 101, .13);
  --band: rgba(61, 174, 233, .12); --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--win); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
p { margin: 0; }
b { font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Barre d'outils et structure */
.shell { min-height: 100%; display: flex; flex-direction: column; }
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; background: var(--win); border-bottom: 1px solid var(--line); }
.appico { width: 22px; height: 22px; color: var(--text); }
.apptitle { font-weight: 600; font-size: 15px; }
.appsub { color: var(--muted); font-size: 13px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; }
.main { flex: 1; display: grid; grid-template-columns: 216px minmax(0, 1fr); }
.sidebar { position: sticky; top: 46px; align-self: start; display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; height: calc(100vh - 46px); border-right: 1px solid var(--line); background: var(--win); }
.navitem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: var(--r); background: transparent; text-align: left; cursor: pointer; }
.navitem:hover { background: var(--accent-soft); }
.navitem.on { background: var(--accent); color: var(--on-accent); }
.navitem .count { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .8; }
.ico { width: 18px; height: 18px; flex: none; }
.content { min-width: 0; padding: 22px 28px 60px; background: var(--win); }
.page { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.pagehead { display: flex; flex-direction: column; gap: 4px; }
.pagehead h1 { font-size: 24px; font-weight: 600; }
.lede { color: var(--muted); max-width: 68ch; }

/* Cartes, boutons, pastilles */
.card { background: var(--view); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; min-height: 32px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); cursor: pointer; transition: border-color .12s, background .12s; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.good { border-color: var(--ok); color: var(--ok-ink); }
.btn.good:hover { background: var(--ok-soft); border-color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad-ink); }
.btn.bad:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn.wide { align-self: center; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 10px; }
.pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); }
.muted { color: var(--muted); font-size: 14px; }
.niv { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 3px; margin-right: 8px; vertical-align: middle; border: 1px solid var(--line-strong); color: var(--muted); }
.niv.n5e { border-color: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--view); padding: 5px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.seg.big button { padding: 7px 16px; font-size: 15px; }
.bar { display: inline-block; height: 6px; width: 100%; background: var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.bar.big { height: 10px; }

/* Notation des angles */
.hat { position: relative; display: inline-block; font-style: italic; padding: 0 .04em; line-height: 1; white-space: nowrap; }
.hat svg { position: absolute; left: -1px; right: -1px; top: -.42em; width: calc(100% + 2px); height: .38em; overflow: visible; }

/* Figures */
.fig { width: 100%; max-width: 380px; height: auto; display: block; touch-action: none; user-select: none; }
.fig.small { max-width: 230px; }
.fig .ln { stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; }
.fig .ln.sec { stroke: var(--secant); stroke-width: 1.8; }
.fig .ln.par { stroke: var(--accent); stroke-dasharray: 6 5; }
.fig .ln.blue { stroke: var(--known); }
.fig .ln.thin { stroke: var(--line-strong); stroke-width: 1.2; }
.fig .tri { fill: var(--alt); stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
.fig .band { fill: var(--band); }
.fig .dot { fill: var(--text); }
.fig .tick { stroke: var(--text); stroke-width: 1.4; }
.fig .rmark { stroke: var(--text); stroke-width: 1.3; }
.fig text { font-family: var(--font); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--view); stroke-width: 3.5px; stroke-linejoin: round; }
.fig .pl { font-size: 14px; font-weight: 600; fill: var(--text); }
.fig .nl { font-size: 13px; font-style: italic; fill: var(--muted); }
.fig .alab { font-size: 12.5px; font-weight: 700; }
.fig .callout { font-size: 12px; fill: var(--muted); font-style: italic; }
.fig .handle { cursor: grab; outline: none; }
.fig .handle:active { cursor: grabbing; }
.fig .hdot { fill: var(--accent); stroke: var(--view); stroke-width: 2.5; }
.fig .handle:focus-visible .hdot { stroke: var(--text); stroke-width: 2; }
.figcol { display: flex; justify-content: center; align-items: flex-start; }
.figcol.center { margin: 4px 0 10px; }

/* Leçons */
.stepper { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.stepgroup { display: flex; flex-direction: column; gap: 5px; }
.stepniv { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.steprow { display: flex; flex-wrap: wrap; gap: 4px; }
.step { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--view); border-radius: 14px; padding: 2px 4px; cursor: pointer; }
.step .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.step .stt { display: none; font-size: 13px; padding-right: 8px; }
.step.on { border-color: var(--accent); background: var(--accent-soft); }
.step.on .stt { display: inline; }
.step.on .num { background: var(--accent); color: var(--on-accent); }
.step.done .num { background: var(--ok-soft); color: var(--ok-ink); }
.step.on.done .num { background: var(--accent); color: var(--on-accent); }
.lesson { display: flex; flex-direction: column; gap: 14px; }
.lesson-h { display: flex; align-items: center; }
.lesson-h h2 { font-size: 20px; font-weight: 600; }
.lesson-body { display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
.viz { padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--alt); }
.keep { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; }
.keep-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-ink); margin-bottom: 2px; }
.check { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; align-items: flex-start; }
.check-h { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.trio figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.trio figcaption { font-size: 13.5px; text-align: center; }
.redac { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.redac li { padding-left: 2px; }
.orderpool { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.orderres { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }

/* Manipulations */
.lab { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.lab-col { display: flex; flex-direction: column; gap: 10px; }
.labfigwrap { display: flex; flex-direction: column; gap: 8px; }
.labside { display: flex; flex-direction: column; gap: 10px; }
.bigval { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bigval .tk { color: var(--known-ink); } .bigval .tu { color: var(--unknown-ink); } .bigval .tp { color: var(--third-ink); }
.eq { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.eq .k { color: var(--known-ink); } .eq .u { color: var(--unknown-ink); }
.typelist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--view); }
.typelist li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 10px; font-size: 14px; }
.typelist li + li { border-top: 1px solid var(--line); }
.typelist li span { color: var(--muted); }
.typelist li.on { background: var(--accent); color: var(--on-accent); }
.typelist li.on span { color: inherit; }
.range { display: grid; grid-template-columns: auto 1fr 3.4em; align-items: center; gap: 10px; font-size: 14px; }
.range output { font-variant-numeric: tabular-nums; text-align: right; }
.range input { width: 100%; accent-color: var(--accent); }
.hintline { font-size: 13.5px; color: var(--muted); }
.pairbar { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { border: 1px solid var(--line-strong); background: var(--view); border-radius: 14px; padding: 3px 12px; font-size: 13.5px; cursor: pointer; }
.chipbtn:hover { border-color: var(--accent); }
.chipbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.checks { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.checks li::marker { content: "✓  "; color: var(--ok-ink); font-weight: 700; }
.status { padding: 7px 10px; border-radius: var(--r); font-size: 14.5px; font-weight: 600; }
.status.ok { background: var(--ok-soft); color: var(--ok-ink); }
.status.bad { background: var(--bad-soft); color: var(--bad-ink); }
.proofnote { font-size: 14.5px; background: var(--view); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }

/* Choix et retours */
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { border: 1px solid var(--line-strong); background: var(--view); border-radius: var(--r); padding: 6px 12px; cursor: pointer; text-align: left; line-height: 1.4; }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice.good { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.choice:disabled { cursor: default; }
.orderpool .choice:disabled { opacity: .35; }
.fb { font-size: 14.5px; padding: 7px 10px; border-radius: var(--r); }
.fb.ok { background: var(--ok-soft); color: var(--ok-ink); }
.fb.bad { background: var(--bad-soft); color: var(--bad-ink); }

/* Exercices */
.famtabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.famtab { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--view); cursor: pointer; text-align: left; }
.famtab:hover { border-color: var(--accent); }
.famtab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.famnum { grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--alt); border: 1px solid var(--line); }
.famtab.on .famnum { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.famtitle { font-size: 14px; font-weight: 600; line-height: 1.3; }
.famprog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.famprog .bar { height: 4px; }
.famhead { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.famhead h2 { font-size: 20px; font-weight: 600; }
.famhead p { color: var(--muted); }
.subh { font-size: 16px; font-weight: 600; margin-top: 6px; }
.worked { border-left: 4px solid var(--accent); display: flex; flex-direction: column; gap: 10px; }
.worked-h { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.exgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.exgrid > div:first-child { display: flex; flex-direction: column; gap: 12px; }
.stmt { font-size: 15.5px; max-width: 66ch; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.steps li { display: grid; grid-template-columns: 7.6em 1fr; gap: 10px; align-items: baseline; animation: rise .25s ease-out; }
@keyframes rise { from { opacity: .3; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 6px; border-radius: 3px; text-align: center; border: 1px solid; white-space: nowrap; }
.tag.sait, .tag.obs { color: var(--known-ink); border-color: var(--known); background: color-mix(in srgb, var(--known) 10%, transparent); }
.tag.prop { color: var(--third-ink); border-color: var(--third); background: color-mix(in srgb, var(--third) 10%, transparent); }
.tag.calc, .tag.plan, .tag.rem { color: var(--muted); border-color: var(--line-strong); background: var(--alt); }
.tag.donc { color: var(--ok-ink); border-color: var(--ok); background: var(--ok-soft); }
.redac .tag { margin-right: 6px; }
.exo { display: flex; flex-direction: column; gap: 10px; }
.exo.solved { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.exo-h { display: flex; align-items: center; gap: 10px; }
.exo-num { font-weight: 600; }
.stars { letter-spacing: 1px; font-size: 14px; }
.stars i { font-style: normal; color: var(--line-strong); }
.stars i.on { color: var(--unknown); }
.answers { display: flex; flex-direction: column; gap: 10px; }
.ans { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.anslab { font-weight: 600; }
.ans.k-u .anslab { color: var(--unknown-ink); }
.ans.k-p .anslab { color: var(--third-ink); }
.numin { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); }
.numin:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.numin input { width: 4.6em; border: 0; background: transparent; padding: 5px 4px 5px 8px; font: inherit; color: inherit; font-variant-numeric: tabular-nums; outline: none; }
.numin .unit { padding-right: 8px; color: var(--muted); }
.mark { font-weight: 700; font-size: 17px; }
.mark.ok { color: var(--ok-ink); } .mark.bad { color: var(--bad-ink); }
.tools { padding-top: 2px; }
.panel { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--alt); font-size: 14.5px; }
.panel.hint { border-left: 3px solid var(--unknown); }
.panel.simple { border-left: 3px solid var(--accent); }
.panel.detail { border-left: 3px solid var(--ok); display: flex; flex-direction: column; gap: 10px; }
.figsol .fig { max-width: 300px; }

/* Mémo */
.memogrid { display: flex; flex-direction: column; gap: 18px; }
.memogroup h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.memocards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.memo { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; }
.memo h3 { font-size: 15px; font-weight: 600; color: var(--accent-ink); }
.memo p { font-size: 14.5px; }
.memofig { display: flex; justify-content: center; }
.flashwrap { display: flex; flex-direction: column; gap: 12px; max-width: 560px; width: 100%; align-self: center; }
.flashmeta, .quizmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.flash { min-height: 220px; display: flex; flex-direction: column; gap: 12px; justify-content: center; text-align: center; align-items: center; }
.flash-tag { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.flash-q { font-size: 18px; font-weight: 600; max-width: 40ch; }
.flash-a { font-size: 16px; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid var(--accent); max-width: 46ch; animation: rise .25s ease-out; }
.flashwrap > .row { justify-content: center; }
.done-card { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.missed { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 10px; }
.quizq { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.quizq .figcol { align-self: stretch; }

/* Accueil */
.route { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.stage { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.stagenum { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent-ink); }
.stagebody { display: flex; flex-direction: column; gap: 4px; }
.stagebody h2 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.stagebody p { color: var(--muted); font-size: 14.5px; max-width: 64ch; }
.stageprog { display: flex; align-items: center; gap: 10px; }
.stageprog .bar { max-width: 180px; }
.legend h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.legend ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.sw { width: 22px; height: 12px; border-radius: 2px; display: inline-block; }
.sw.k { background: var(--known); } .sw.u { background: var(--unknown); } .sw.p { background: var(--third); } .sw.s { height: 3px; background: var(--secant); }

/* Petits écrans */
@media (max-width: 820px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { position: sticky; top: 46px; z-index: 4; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 10px; }
  .navitem { flex: none; }
  .navitem .count { margin-left: 4px; }
  .content { padding: 16px 16px 48px; }
  .lab, .exgrid { grid-template-columns: 1fr; }
  .exgrid .figcol { order: -1; }
  .trio { grid-template-columns: 1fr 1fr; }
  .stage { grid-template-columns: auto 1fr; }
  .stage .btn { grid-column: 2; justify-self: start; }
}
@media (max-width: 460px) {
  .steps li { grid-template-columns: 1fr; gap: 2px; }
  .steps li .tag { justify-self: start; }
  .trio { grid-template-columns: 1fr; }
  .appsub { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.labside .btn, .labside .row { align-self: flex-start; }
@media (max-width: 820px) {
  .famtabs { display: flex; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  .famtab { flex: 0 0 190px; scroll-snap-align: start; }
}
/* Ajouts : chaînons, sélecteurs, copies d'élèves */
.tag.or { color: var(--third-ink); border-color: var(--third); background: color-mix(in srgb, var(--third) 10%, transparent); }
.tag.sait { min-width: 0; }
.steps li { grid-template-columns: 7.2em 1fr; }
.exmain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.btn.small { min-height: 26px; padding: 2px 10px; font-size: 13px; }
.mw { max-width: 68ch; }
.h2s { font-size: 17px; font-weight: 600; margin-bottom: 10px; }

.chains { display: flex; flex-direction: column; gap: 10px; }
.chain { border: 1px solid var(--line); border-radius: var(--r); background: var(--alt); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.chain + .chain { position: relative; }
.chain + .chain::before { content: "↓"; position: absolute; top: -17px; left: 22px; color: var(--muted); font-size: 14px; }
.chain-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.link { display: grid; grid-template-columns: 7.2em minmax(0, 1fr); gap: 10px; align-items: start; }
.link .tag { margin-top: 4px; }
.given { padding: 3px 0; }
.pickrow, .numrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.numrow .eqs { white-space: pre; }
.picker { position: relative; flex: 1; min-width: 0; }
.pickbtn { width: 100%; display: flex; align-items: center; gap: 8px; justify-content: space-between; text-align: left; border: 1px solid var(--line-strong); background: var(--view); border-radius: var(--r); padding: 5px 10px; min-height: 34px; cursor: pointer; line-height: 1.45; }
.pickbtn:hover { border-color: var(--accent); }
.picker.open .pickbtn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.picker.ok .pickbtn { border-color: var(--ok); background: var(--ok-soft); }
.picker.bad .pickbtn { border-color: var(--bad); background: var(--bad-soft); }
.pickval { min-width: 0; }
.ph { color: var(--muted); font-style: italic; }
.caret { color: var(--muted); font-size: 12px; flex: none; }
.picklist { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 3px); margin: 0; padding: 4px; list-style: none; background: var(--view); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 6px 18px rgba(0,0,0,.18); max-height: 320px; overflow-y: auto; }
.picklist button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 9px; border-radius: 3px; cursor: pointer; line-height: 1.45; }
.picklist button:hover, .picklist button:focus-visible { background: var(--accent-soft); }
.picklist button.sel { background: var(--accent); color: var(--on-accent); }
.picklist li + li { border-top: 1px solid var(--line); }
.numin.ok { border-color: var(--ok); background: var(--ok-soft); }
.numin.bad { border-color: var(--bad); background: var(--bad-soft); }

.ansblock { display: flex; flex-direction: column; gap: 6px; }
.anslab { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.ans { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ans .anslab { font-weight: 400; }
.choice .box { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1px solid var(--line-strong); border-radius: 3px; margin-right: 8px; font-size: 12px; vertical-align: -2px; background: var(--view); }
.choice.sel .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.roles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.roles li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--alt); }
.roleseg button { font-size: 13px; padding: 4px 9px; }
.roleseg button.on.r-sait { background: var(--known); color: #fff; }
.roleseg button.on.r-or { background: var(--third); color: #fff; }
.roleseg button.on.r-donc { background: var(--ok); color: #fff; }
.roleseg button.wrong { box-shadow: inset 0 0 0 2px var(--bad); }

.copywrap { display: flex; flex-direction: column; gap: 12px; }
.copy { display: flex; flex-direction: column; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--view); background-image: repeating-linear-gradient(transparent 0 33px, color-mix(in srgb, var(--accent) 12%, transparent) 33px 34px); }
.copyline { display: grid; grid-template-columns: 2em 1fr; gap: 6px; text-align: left; border: 0; background: transparent; padding: 7px 10px; cursor: pointer; border-left: 3px solid transparent; line-height: 1.5; }
.copyline + .copyline { border-top: 1px dashed var(--line); }
.copyline:hover { background: var(--accent-soft); }
.copyline.sel { border-left-color: var(--accent); background: var(--accent-soft); }
.copyline.good { border-left-color: var(--ok); background: var(--ok-soft); }
.copyline.wrong { border-left-color: var(--bad); background: var(--bad-soft); }
.copyline.none { color: var(--muted); font-style: italic; }
.ln-n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

.orderwrap { display: flex; flex-direction: column; gap: 10px; }
.orderpool { display: flex; flex-direction: column; gap: 6px; }
.orderpool .choice:disabled { opacity: .3; }
.orderres-h { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.orderres { margin: 0; padding: 8px 10px 8px 32px; display: flex; flex-direction: column; gap: 5px; border: 1px dashed var(--line-strong); border-radius: var(--r); min-height: 44px; }
.orderres.ok { border: 1px solid var(--ok); background: var(--ok-soft); }
.orderres.bad { border: 1px solid var(--bad); background: var(--bad-soft); }
.orderres .ph { list-style: none; margin-left: -18px; }

.trio3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.role { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; border-top-width: 3px; }
.role.r-sait { border-top-color: var(--known); } .role.r-or { border-top-color: var(--third); } .role.r-donc { border-top-color: var(--ok); }
.flow { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 12px; }
.flowbox { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: baseline; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--alt); font-size: 14.5px; }
.flowarrow { display: flex; flex-direction: column; align-items: center; color: var(--accent-ink); font-size: 12px; text-align: center; }
.flowarrow svg { width: 54px; height: 32px; }
.hl { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 3px; padding: 0 3px; }
.sitgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px; }
.sit { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 10px; background: var(--alt); }
.sitfig .fig { max-width: 130px; }
.sittext { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.sit-s { font-weight: 600; }
.traps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.proplist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.legend .tag { margin-right: 6px; }
.famhead h2 { font-size: 20px; }

@media (max-width: 820px) {
  .trio3 { grid-template-columns: 1fr; }
  .flow { grid-template-columns: 1fr; }
  .flowarrow { transform: rotate(90deg); margin: 6px 0; }
  .roles li { grid-template-columns: 1fr auto; }
  .roles li .rtext { grid-column: 1 / -1; }
  .sitgrid { grid-template-columns: 1fr; }
}
@media (max-width: 460px) {
  .link { grid-template-columns: 1fr; gap: 4px; }
  .sit { grid-template-columns: 1fr; }
  .sitfig { justify-self: center; }
}

</style>
