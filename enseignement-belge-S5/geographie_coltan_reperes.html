tinents"],numbers:A6(["ocean_pacifique","ocean_atlantique","ocean_indien","ocean_arctique","ocean_antarctique"])},corrige:["A Pacifique · B Atlantique · C Indien · D Arctique · E Antarctique (Austral)"],bareme:"0,5 point par océan."},{pts:5,q:"Nomme les lignes remarquables numérotées et donne leur latitude (ou longitude).",map:{scene:"monde_continents",only:["continents","lignes"],numbers:Ve(["equateur","tropique_cancer","tropique_capricorne","cercle_arctique","cercle_antarctique"])},corrige:["1 Équateur, 0° · 2 Tropique du Cancer, 23° N · 3 Tropique du Capricorne, 23° S · 4 Cercle polaire arctique, 66° N · 5 Cercle polaire antarctique, 66° S"],bareme:"0,5 point pour le nom + 0,5 point pour la latitude (avec N ou S)."},{pts:1.5,q:"Quel est le rôle du méridien de Greenwich ? Quelle est sa longitude ?",lignes:2,corrige:["C’est le méridien de référence (0° de longitude) : il sépare l’hémisphère Est de l’hémisphère Ouest et sert à mesurer la longitude."],bareme:"1 point pour le rôle, 0,5 point pour 0°."},{pts:3.5,q:"Classe les sept grands foyers de population du plus densément peuplé au moins densément peuplé : Indonésie – Nord-Est des États-Unis – Asie du Sud – Europe occidentale et centrale – Asie de l’Est – Afrique de l’Ouest (golfe de Guinée) – Afrique de l’Est (Grands Lacs).",lignes:3,corrige:["1 Asie de l’Est (Chine) · 2 Asie du Sud (Inde, Pakistan) · 3 Indonésie · 4 Europe occidentale et centrale · 5 Afrique de l’Est (Grands Lacs) · 6 Afrique de l’Ouest (golfe de Guinée) · 7 Nord-Est des États-Unis"],bareme:"0,5 point par rang correct."},{pts:4.5,q:"Cite trois espaces vides ou peu peuplés et, pour chacun, la contrainte principale qui l’explique.",lignes:4,corrige:["Exemples : Sahara → aridité ; Antarctique / Grand Nord → froid ; Himalaya / Andes / Rocheuses → altitude ; Amazonie / bassin du Congo / Bornéo → forêt dense ; Gobi, désert australien, péninsule arabique → aridité."],bareme:"0,5 point par espace + 1 point par contrainte correcte."}]},{id:"e2",titre:"Interrogation · L’Europe et la Belgique",type:"Connaître",duree:"35 min",total:25,consignes:"Les cartes sont numérotées. Écris les noms en toutes lettres.",questions:[{pts:4,q:"Nomme les États numérotés et indique s’ils sont membres de l’UE (M), candidats (C) ou hors UE (H).",map:{scene:"europe_ue",plain:!0,numbers:Ve(["pays_pol","pays_esp","pays_swe","pays_ukr","pays_gbr","pays_nor","pays_rou","pays_che"])},corrige:["1 Pologne (M) · 2 Espagne (M) · 3 Suède (M) · 4 Ukraine (C) · 5 Royaume-Uni (H, ancien membre) · 6 Norvège (H) · 7 Roumanie (M) · 8 Suisse (H)"],bareme:"0,25 point pour le nom + 0,25 point pour le statut."},{pts:3,q:"Nomme les six aires urbaines européennes numérotées.",map:{scene:"europe_villes",numbers:Ve(["moscou","londres","madrid","milan","athenes","kiev"])},corrige:["1 Moscou · 2 Londres · 3 Madrid · 4 Milan · 5 Athènes · 6 Kiev (Kyiv)"],bareme:"0,5 point par ville."},{pts:3.5,q:"Nomme les sept aires urbaines belges numérotées.",map:{scene:"belgique_population",numbers:Ve(["bruxelles","anvers","gand","charleroi","liege","bruges","namur"])},corrige:["1 Bruxelles · 2 Anvers · 3 Gand · 4 Charleroi · 5 Liège · 6 Bruges · 7 Namur"],bareme:"0,5 point par ville."},{pts:4,q:"Vrai ou faux ? Justifie chaque réponse. a) La Belgique compte trois Régions et trois Communautés. b) L’enseignement est une compétence des Régions. c) Bruxelles fait partie de la province du Brabant flamand. d) La Communauté germanophone se trouve dans la province de Luxembourg.",lignes:5,corrige:["a) Vrai : Régions flamande, wallonne, de Bruxelles-Capitale ; Communautés flamande, française, germanophone.","b) Faux : l’enseignement est lié aux personnes, c’est une compétence des Communautés.","c) Faux : la Région de Bruxelles-Capitale ne fait partie d’aucune province.","d) Faux : elle se trouve à l’est de la province de Liège (Eupen, Saint-Vith)."],bareme:"0,5 point pour V/F + 0,5 point pour la justification."},{pts:2.5,q:"Qu’est-ce que le sillon Sambre-et-Meuse ? Cite trois villes qui s’y trouvent.",lignes:3,corrige:["Longue vallée formée par la Sambre puis la Meuse, ancien axe industriel wallon (charbon, sidérurgie).","Villes : Charleroi, Namur, Liège."],bareme:"1 point pour la définition, 0,5 point par ville."},{pts:4,q:"Nomme les cours d’eau numérotés.",map:{scene:"belgique_relief",only:["rivieres"],numbers:Ve(["meuse","escaut","sambre","yser","lys","ourthe","semois","dyle"])},corrige:["1 Meuse · 2 Escaut · 3 Sambre · 4 Yser · 5 Lys · 6 Ourthe · 7 Semois · 8 Dyle"],bareme:"0,5 point par cours d’eau."},{pts:4,q:"Nomme les chaînes de montagnes européennes numérotées.",map:{scene:"europe_relief",numbers:Ve(["alpes","pyrenees","carpates","oural","apennins","scandinave","caucase","dinariques"])},corrige:["1 Alpes · 2 Pyrénées · 3 Carpates · 4 Oural · 5 Apennins · 6 Massif scandinave · 7 Caucase · 8 Alpes dinariques"],bareme:"0,5 point par chaîne."}]},{id:"e3",titre:"Interrogation · Climats et biomes",type:"Connaître / Appliquer",duree:"30 min",total:20,consignes:"Utilise le vocabulaire précis du cours.",questions:[{pts:4,q:"Complète le tableau : pour chaque climat, donne une caractéristique (températures, pluies) et un lieu. Climats : équatorial, tropical, océanique, continental.",lignes:5,corrige:["Équatorial : chaud et pluvieux toute l’année — bassin du Congo, Amazonie.","Tropical : chaud, une saison sèche et une saison des pluies — Katanga, Sahel, Inde.","Océanique : étés frais, hivers doux, pluies toute l’année — Belgique, Irlande.","Continental : étés chauds, hivers très froids, peu de pluies — Moscou, Varsovie."],bareme:"0,5 point par caractéristique + 0,5 point par lieu."},{pts:4,q:"Identifie le climat de chaque point numéroté.",map:{scene:"europe_climats",plain:!0,numbers:Ve(["ec_ocean_2","ec_conti_2","ec_medit_1","ec_mont_1","ec_tchaud_1","ec_froid_1","ec_conti_1","ec_medit_3"])},corrige:["1 Océanique (Bruxelles) · 2 Continental (Moscou) · 3 Méditerranéen (Athènes) · 4 Montagnard (Alpes) · 5 Tempéré chaud (Madrid) · 6 Froid (Laponie) · 7 Continental (Varsovie) · 8 Méditerranéen (Marseille)"],bareme:"0,5 point par point."},{pts:3,q:"Explique pourquoi il fait plus froid à Moscou qu’à Bruxelles en hiver, alors que les deux villes sont à des latitudes proches.",lignes:3,corrige:["Moscou est loin de l’océan : c’est l’effet de la continentalité. L’océan adoucit les hivers à Bruxelles (climat océanique), tandis qu’à l’intérieur du continent les hivers sont très froids et les étés chauds (climat continental)."],bareme:"1 point : continentalité ; 1 point : rôle de l’océan ; 1 point : vocabulaire (océanique / continental)."},{pts:4,q:"Associe chaque biome à son climat et à un lieu : taïga, toundra, savane, forêt tropicale humide.",lignes:4,corrige:["Taïga : continental froid / subarctique — Sibérie, Canada, Finlande.","Toundra : polaire — nord du Canada, de la Sibérie, Laponie.","Savane : tropical (saison sèche) — Afrique de l’Est, sud de la RDC.","Forêt tropicale humide : équatorial — Amazonie, bassin du Congo."],bareme:"0,5 point pour le climat + 0,5 point pour le lieu."},{pts:2,q:"Distingue la garrigue et le maquis.",lignes:3,corrige:["Ce sont deux formations végétales méditerranéennes. La garrigue est basse et clairsemée, sur des sols calcaires secs ; le maquis est plus dense et plus haut (petits chênes, arbousiers, arbustes épineux)."],bareme:"1 point par formation correctement décrite."},{pts:3,q:"À l’aide de la pyramide des biomes, explique ce qui change quand on passe de la forêt tropicale humide au désert, puis de la forêt tempérée à la toundra.",lignes:4,corrige:["Forêt tropicale humide → savane → désert : l’humidité diminue (gradient d’humidité), la végétation devient de plus en plus rare.","Forêt tempérée → taïga → toundra : la température diminue (gradient de température, vers les pôles ou en altitude) ; la végétation devient plus basse."],bareme:"1,5 point par gradient correctement expliqué."}]},{id:"e4",titre:"Évaluation · Le coltan en République démocratique du Congo",type:"Connaître / Appliquer",duree:"50 min",total:40,consignes:"Partie A : connaissances. Partie B : application à partir de cartes. Rédige des phrases complètes.",questions:[{part:"Partie A · Connaître",pts:3,q:"Définis le coltan et explique à quoi sert le métal qu’on en tire.",lignes:3,corrige:["Minerai noir ou brun-rouge (colombite + tantalite) dont on extrait le niobium et le tantale.","Le tantale, résistant à la corrosion, sert à fabriquer les condensateurs des téléphones et ordinateurs."],bareme:"1 point : minerai + composition ; 1 point : tantale / niobium ; 1 point : usage."},{pts:4,q:"Définis et illustre par un exemple : a) minerais de sang ; b) malédiction des ressources.",lignes:5,corrige:["a) Minerais dont le commerce finance des groupes armés. Ex. : Rubaya (Nord-Kivu), contrôlée par le M23 depuis 2024 (≈ 300 000 $ par mois).","b) Paradoxe d’un pays riche en ressources dont la population reste pauvre, à cause de la corruption et des conflits. Ex. : plus de 70 % des Congolais vivent avec moins de 2 $ par jour."],bareme:"1 point par définition + 1 point par exemple précis."},{pts:5,q:"Présente trois groupes armés actifs dans l’est de la RDC (nom, zone d’action, une caractéristique).",lignes:5,corrige:["CODECO : Ituri ; ancienne coopérative agricole (1970), défend les Lendu contre les Hema.","ADF : Beni (Nord-Kivu) et Ituri ; fondées en Ouganda, veulent un État islamique.","M23 : Nord-Kivu (Rutshuru, Goma) ; né après l’accord du 23 mars 2009, soutenu par le Rwanda selon l’ONU ; contrôle Rubaya.","FDLR : Nord-Kivu ; Hutu rwandais liés à l’ancien régime de 1994.","Maï-Maï Kata Katanga : Katanga ; indépendance du Katanga, revenus de l’or."],bareme:"Par groupe : 0,5 point pour le nom, 0,5 point pour la zone, 0,5 point pour la caractéristique (max. 5)."},{pts:3,q:"Pourquoi l’Ouganda, le Rwanda et le Burundi sont-ils mis en cause par l’ONU ?",lignes:3,corrige:["Un rapport d’experts présenté en 2015 au Conseil de sécurité les accuse de profiter de l’exploitation illégale et de la contrebande des minerais de l’est de la RDC (l’armée rwandaise aurait retiré 250 millions de dollars du trafic entre 1998 et 2000). Ces pays nient leur implication."],bareme:"1 point : contrebande / exploitation illégale ; 1 point : rapport ONU 2015 ; 1 point : exemple chiffré ou mention du démenti."},{part:"Partie B · Appliquer",pts:5,q:"Situe puis localise la ville de Goma.",map:{scene:"rdc_situation",names:["lacs"],numbers:{goma:"G"}},lignes:5,corrige:["Situation : Afrique centrale, hémisphère Sud, juste au sud de l’équateur, est de la RDC (Grands Lacs).","Localisation : chef-lieu du Nord-Kivu (1° 41′ S, 29° 13′ E), rive nord du lac Kivu, frontière du Rwanda (face à Gisenyi), pied du Nyiragongo, environ 1500 m."],bareme:"2 points pour la situation, 3 points pour la localisation (province, lac, frontière, volcan / altitude)."},{pts:6,q:"À l’aide des cartes du milieu physique, complète pour Goma : région de ressources, végétation, climat, nombre de mois de pluie, transmission du paludisme, densité.",map:{scene:"rdc_milieu"},lignes:6,corrige:["Région stannifère · végétation de montagne · climat des montagnes · environ 10 mois de pluie · transmission faible (0 à 2 mois) · densité forte (> 70 hab./km²)."],bareme:"1 point par information correcte (une fourchette raisonnable est acceptée pour la pluie)."},{pts:6,q:"Compare la carte des ressources et celle des violences en 2023. Décris puis explique la relation observée.",map:{scene:"rdc_conflits"},lignes:7,corrige:["Description : les décès liés aux violences se concentrent à l’est (Ituri, Nord-Kivu, Sud-Kivu), là où se trouvent les mines d’or, d’étain et de coltan (région stannifère).","Explication : les groupes armés se disputent ces mines qui financent leurs activités (racket, contrebande) ; l’État y est faible et les frontières (Rwanda, Ouganda, Burundi) sont proches.","Nuance : le Katanga, riche en cuivre et cobalt, est moins touché ; d’autres causes interviennent (conflits entre communautés)."],bareme:"2 points description, 3 points explication, 1 point nuance."},{pts:8,q:"Construis la légende organisée du croquis « Les minerais, sources de conflits en RDC (2023) » : indique pour chaque élément le figuré choisi (point, ligne, surface + couleur) et classe-les en trois thèmes. Rappelle les autres informations obligatoires.",lignes:9,corrige:["1. Repères : frontières de la RDC (ligne noire épaisse), équateur (ligne rouge), Kinshasa (carré rouge), Lubumbashi, Mbuji-Mayi, Kisangani, Goma (points noirs).","2. Ressources : région stannifère (surface bleu clair), ceinture cuprifère (surface verte).","3. Problèmes : zones de violences en 2023 (surface rouge ou cercles), paludisme toute l’année (hachures).","Autres informations : titre (sujet + lieu + date), orientation (N), source « Cours de géographie EBC – S5 – 2026-27 » ; pas d’échelle pour un croquis schématique."],bareme:"3 points : implantations correctes ; 2 points : organisation en thèmes ; 3 points : titre, orientation, source."}]},{id:"e5",titre:"Évaluation de transfert · D’autres ressources convoitées",type:"Transférer",duree:"50 min",total:20,consignes:"Cette évaluation porte sur des situations nouvelles : utilise les notions et la méthode du cours.",docs:[{lab:"Document 1 · Le cobalt de Kolwezi",t:"La RDC fournit environ 70 % du cobalt extrait dans le monde, surtout autour de Kolwezi, dans la ceinture cuprifère du Katanga. Le cobalt est indispensable aux batteries des smartphones et des voitures électriques. Une grande partie est raffinée en Chine.",src:"Document adapté pour l’évaluation."},{lab:"Document 2 · Creuseurs du Katanga",t:"À côté des grandes mines industrielles, des creuseurs artisanaux, dont des enfants, extraient le cobalt à la main dans des tunnels dangereux, pour quelques dollars par jour. Amnesty International a dénoncé cette situation en 2016.",src:"Document adapté pour l’évaluation."},{lab:"Document 3 · L’or de l’Ituri",t:"L’Ituri possède d’importantes mines d’or (Kilo-Moto, Mongbwalu). Les groupes armés CODECO et ADF y sont actifs. Selon les experts de l’ONU, une partie de l’or quitte la RDC en contrebande par les pays voisins.",src:"Document adapté pour l’évaluation."}],questions:[{pts:3,q:"Localise Kolwezi et l’Ituri sur la carte de la RDC (décris leur position) et nomme la zone de ressources de Kolwezi.",map:{scene:"rdc_ressources",names:["villes"]},lignes:3,corrige:["Kolwezi : sud-est de la RDC (Katanga), près de la frontière zambienne, dans la ceinture cuprifère.","Ituri : nord-est, à la frontière de l’Ouganda et du Soudan du Sud, au nord du lac Albert."],bareme:"1 point par localisation + 1 point pour « ceinture cuprifère »."},{pts:4,q:"Dessine (ou décris) la chaîne du cobalt de Kolwezi jusqu’à un consommateur européen. Quelle notion du cours ce flux illustre-t-il ?",lignes:4,corrige:["Mine (industrielle ou artisanale) à Kolwezi → transport vers les ports → raffinage en Chine → fabrication de batteries → smartphones / voitures électriques → consommateur européen.","Notion : la mondialisation (flux de matières premières et de produits)."],bareme:"3 points pour la chaîne (au moins 4 étapes ordonnées), 1 point pour la notion."},{pts:6,q:"Compare le cas du cobalt (doc. 1 et 2) et celui du coltan du Kivu : deux points communs, deux différences.",lignes:6,corrige:["Points communs : ressource stratégique concentrée en RDC ; indispensable aux technologies ; exportée dans un flux mondial ; creuseurs artisanaux, parfois des enfants ; population qui profite peu de la richesse.","Différences : le cobalt est surtout produit par de grandes mines industrielles ; le Katanga est moins touché par la guerre ; le problème principal est l’exploitation des travailleurs plus que le financement des milices."],bareme:"1,5 point par point commun ou différence correctement expliqué."},{pts:4,q:"Montre que le cas de l’or de l’Ituri (doc. 3) confirme le mécanisme « minerais → conflits » étudié au cours.",lignes:4,corrige:["Ressource convoitée (or, minerai des conflits) ; groupes armés présents (CODECO, ADF) ; contrebande vers les pays voisins qui prive l’État de revenus ; forte concentration de violences en Ituri en 2023 : même logique que le coltan au Kivu."],bareme:"1 point par élément du mécanisme (ressource, acteurs, contrebande, violences)."},{pts:3,q:"Propose deux mesures pour que ces ressources profitent davantage aux Congolais. Justifie.",lignes:3,corrige:["Exemples : traçabilité et certification des mines (les acheteurs évitent les minerais de conflit) ; renforcer le contrôle de l’État et lutter contre la corruption ; améliorer les conditions de travail et interdire le travail des enfants ; transformer une partie des minerais en RDC ; appliquer les accords de paix."],bareme:"1,5 point par mesure justifiée."}]},{id:"e6",titre:"Examen type · Décembre (chapitre 1 et repères spatiaux)",type:"Connaître / Appliquer / Transférer",duree:"100 min",total:60,consignes:"Examen d’entraînement complet. Gère ton temps : environ 25 minutes par partie.",questions:[{part:"Partie 1 · Repères spatiaux (Connaître)",pts:4,q:"Nomme les éléments numérotés sur le planisphère (continents et lignes).",map:{scene:"monde_continents",only:["oceans","continents","lignes"],numbers:{amerique:1,afrique:2,asie:3,oceanie:4,equateur:5,tropique_cancer:6,cercle_arctique:7,greenwich:8}},corrige:["1 Amérique · 2 Afrique · 3 Asie · 4 Océanie · 5 Équateur · 6 Tropique du Cancer · 7 Cercle polaire arctique · 8 Méridien de Greenwich"],bareme:"0,5 point par élément."},{pts:4,q:"Nomme les espaces numérotés et indique s’il s’agit d’un foyer de population (F) ou d’un espace peu peuplé (V).",map:{scene:"monde_population",plain:!0,numbers:Ve(["asie_est","sahara","europe_ouest","amazonie","asie_sud","himalaya","afrique_ouest","grand_nord"])},corrige:["1 Asie de l’Est (F) · 2 Sahara (V) · 3 Europe occidentale et centrale (F) · 4 Amazonie (V) · 5 Asie du Sud (F) · 6 Himalaya (V) · 7 Golfe de Guinée (F) · 8 Grand Nord (V)"],bareme:"0,25 point pour le nom + 0,25 point pour F/V."},{pts:4,q:"Nomme les Régions et les Communautés de Belgique et cite les sept aires urbaines belges.",lignes:4,corrige:["Régions : flamande, wallonne, Bruxelles-Capitale. Communautés : flamande, française, germanophone.","Aires urbaines : Bruxelles, Anvers, Gand, Charleroi, Liège, Bruges, Namur."],bareme:"1,5 point pour les Régions et Communautés ; 2,5 points pour les villes (on tolère une erreur)."},{pts:3,q:"Nomme cinq régions naturelles de Belgique, du nord au sud.",lignes:2,corrige:["Par exemple : Polders, Campine, Hesbaye, Condroz, Ardenne (ou Flandre, Région des Collines, Pays de Herve, Famenne, Lorraine belge)."],bareme:"0,5 point par région + 0,5 point pour l’ordre."},{part:"Partie 2 · Le coltan en RDC (Connaître)",pts:5,q:"Explique ce qu’est le coltan, où il se trouve et pourquoi il est stratégique.",lignes:5,corrige:["Minerai (colombite + tantalite) → niobium et tantale ; condensateurs de l’électronique.","60 à 80 % des réserves mondiales au Kivu (est de la RDC) ; autres réserves : Australie, Brésil, Canada…","Stratégique : indispensable à l’électronique et concentré dans une petite région."],bareme:"2 + 2 + 1."},{pts:6,q:"Explique pourquoi on peut parler de « minerais de sang » à propos de l’est de la RDC (acteurs, mécanismes, conséquences).",lignes:7,corrige:["Acteurs : groupes armés (M23, ADF, CODECO, FDLR), pays voisins mis en cause (Rwanda, Ouganda, Burundi), sociétés commerciales.","Mécanismes : contrôle des mines (Rubaya, M23), racket, contrebande ; rapport ONU 2015.","Conséquences : plus de 6 millions de morts, déplacés, travail des enfants, pauvreté."],bareme:"2 points par volet."},{part:"Partie 3 · Appliquer",pts:6,q:"Réalise le tableau de données de Bukavu (Sud-Kivu, au sud du lac Kivu, environ 1500 m) à partir des cartes du milieu physique : ressources, végétation, climat, paludisme, densité.",map:{scene:"rdc_milieu"},lignes:5,corrige:["Région stannifère · végétation de montagne · climat des montagnes (≈ 9 à 10 mois de pluie) · paludisme faible (altitude) · forte densité."],bareme:"1 point par information ; 1 point pour la lecture prudente des limites."},{pts:8,q:"Mets en relation les cartes du climat, de la végétation et du paludisme de la RDC. Rédige un paragraphe structuré.",map:{scene:"rdc_milieu"},lignes:8,corrige:["Centre : climat équatorial → forêt équatoriale → paludisme toute l’année (chaleur + humidité).","Sud : climat tropical (saison sèche) → savanes → paludisme saisonnier.","Est : climat des montagnes (altitude) → végétation de montagne → paludisme faible.","Conclusion : le climat, lui-même lié à la latitude et à l’altitude, explique la végétation et la santé."],bareme:"2 points par zone + 2 points pour la conclusion et les connecteurs."},{pts:6,q:"Cite les cinq informations obligatoires d’une carte et classe les éléments suivants selon leur implantation : Goma, la frontière avec le Rwanda, la ceinture cuprifère, le fleuve Congo, la zone de paludisme toute l’année, Kinshasa.",lignes:4,corrige:["Titre (sujet + lieu + date), légende, orientation, échelle (sauf croquis schématique), source.","Point : Goma, Kinshasa · Ligne : frontière avec le Rwanda, fleuve Congo · Surface : ceinture cuprifère, zone de paludisme."],bareme:"2,5 points pour les informations ; 3,5 points pour le classement (on retire 0,5 par erreur)."},{part:"Partie 4 · Transférer",pts:8,q:"Document : « Le lithium est indispensable aux batteries. Un très grand gisement a été découvert à Manono, dans la province du Tanganyika (nord de l’ancien Katanga), dans la région stannifère. » (document adapté). En utilisant les notions du cours, explique quels enjeux, quels risques et quelles opportunités ce gisement peut représenter pour la RDC.",lignes:9,corrige:["Enjeux : ressource stratégique (transition énergétique, batteries), convoitée par des États et des entreprises étrangères ; flux de la mondialisation.","Risques : malédiction des ressources (corruption, revenus qui échappent à la population), conflits pour le contrôle du gisement, contrebande, mauvaises c
