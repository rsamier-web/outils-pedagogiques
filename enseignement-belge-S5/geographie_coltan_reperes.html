 et en Chine.","Le coltan est donc un [[minerai stratégique]] : il est indispensable à l’industrie électronique et il est concentré dans une petite région du monde."],visuel:{map:"rdc_ressources",props:{only:["zones","mines","villes"]}},retenir:["Le Kivu (est de la RDC) possède 60 à 80 % des réserves mondiales de coltan.","Une ressource rare, concentrée et indispensable est un enjeu stratégique."]}],check:{q:"Pourquoi dit-on que le coltan est un minerai stratégique ?",o:["Parce qu’il est très facile à extraire.","Parce qu’il est indispensable à l’électronique et concentré dans peu de régions.","Parce qu’on le trouve dans tous les pays d’Afrique.","Parce qu’il sert à fabriquer du carburant."],a:1,e:"Le tantale du coltan est indispensable aux condensateurs, et l’essentiel des réserves se trouve au Kivu : sa possession est donc un enjeu."}},{id:"a2",titre:"Situer et localiser la RDC, le Kivu et Goma",resume:"Méthode « situer / localiser » appliquée à la RDC et à Goma.",pages:[{titre:"Situer : où par rapport aux grands repères ?",blocs:["[[Situer]] un lieu, c’est dire où il se trouve par rapport à de grands repères, à petite [[échelle]] : le continent, l’[[hémisphère]], l’[[équateur]], les océans, les pays voisins.","La RDC se situe en **Afrique centrale**. Elle est traversée par l’équateur : le nord du pays est dans l’hémisphère Nord, le sud dans l’hémisphère Sud.","C’est le deuxième plus grand pays d’Afrique. Elle a neuf voisins et un accès très étroit à l’océan Atlantique, à l’ouest."],visuel:{map:"afrique",props:{mode:"show"}},retenir:["Situer = répondre à « Où ? » avec de grands repères (petite échelle).","La RDC : Afrique centrale, traversée par l’équateur, ouverture étroite sur l’Atlantique."]},{titre:"Les voisins et les grands repères de la RDC",blocs:["Les neuf voisins de la RDC sont : le Congo (Brazzaville), la Centrafrique, le Soudan du Sud, l’Ouganda, le Rwanda, le Burundi, la Tanzanie, la Zambie et l’Angola.","La capitale, **Kinshasa**, est à l’ouest, sur le fleuve Congo, juste en face de Brazzaville. Les grandes villes secondaires sont Lubumbashi (sud-est), Mbuji-Mayi (centre-sud), Kisangani (nord-est) et Goma (est).","À l’est, une longue chaîne de lacs marque la frontière : lac Albert, lac Édouard, lac Kivu et lac Tanganyika."],visuel:{map:"rdc_situation",props:{names:["villes","lacs"]}},retenir:["Capitale : Kinshasa. Villes secondaires : Lubumbashi, Mbuji-Mayi, Kisangani, Goma.","À l’est : lacs Albert, Édouard, Kivu, Tanganyika ; voisins Ouganda, Rwanda, Burundi."]},{titre:"Localiser : la position précise de Goma",blocs:["[[Localiser]] un lieu, c’est donner sa position précise, à grande échelle : ses [[coordonnées géographiques]], sa province, les lieux tout proches.","**Goma** est le chef-lieu de la province du **Nord-Kivu**, dans l’est de la RDC. Ses coordonnées sont environ 1° 41′ de [[latitude]] Sud et 29° 13′ de [[longitude]] Est.","Goma est construite sur la rive nord du **lac Kivu**, à la frontière du **Rwanda** (en face de la ville rwandaise de Gisenyi), au pied du [[volcan]] actif **Nyiragongo**, à environ 1500 m d’[[altitude]]."],visuel:{diagram:"situer_localiser"},retenir:["Localiser = position précise (coordonnées, province, lieux proches).","Goma : Nord-Kivu, rive nord du lac Kivu, frontière rwandaise, pied du Nyiragongo, 1500 m."]}],check:{q:"Laquelle de ces phrases LOCALISE Goma (et ne se contente pas de la situer) ?",o:["Goma est en Afrique.","Goma est dans l’hémisphère Sud.","Goma est sur la rive nord du lac Kivu, à la frontière rwandaise.","Goma est sur le continent africain, près de l’équateur."],a:2,e:"Localiser, c’est donner une position précise à grande échelle (lac Kivu, frontière, coordonnées). Les autres phrases situent Goma à petite échelle."}},{id:"a3",titre:"Un pays très riche en ressources… mais pauvre",resume:"Les ressources de la RDC et le paradoxe de la « malédiction des ressources ».",pages:[{titre:"Un « scandale géologique »",blocs:["Le [[sous-sol]] de la RDC est l’un des plus riches du monde. On parle même de « [[scandale géologique]] ».","On y trouve des ressources minières (diamants, or, coltan, cuivre et [[cobalt]], étain, manganèse, plomb et zinc) et des ressources énergétiques (charbon, uranium, pétrole).","Deux grandes zones se distinguent : la **région [[stannifère]]** à l’est (étain et coltan, du Kivu au nord du Katanga) et la **ceinture [[cuprifère]]** au sud-est (cuivre et cobalt, de Kolwezi à Lubumbashi)."],visuel:{map:"rdc_ressources",props:{}},retenir:["Région stannifère (est) : étain et coltan.","Ceinture cuprifère (Katanga) : cuivre et cobalt.","Ailleurs : diamants (Kasaï), or (Ituri, Sud-Kivu), pétrole (côte)."]},{titre:"La malédiction des ressources",blocs:["Ces dernières années, de nouveaux acteurs (groupes chinois, intermédiaires émiratis…) ont investi plusieurs milliards de dollars dans les mines congolaises.","Pourtant, cette richesse ne profite pas à la population : **plus de 70 % des Congolais vivent avec moins de 2 dollars par jour**.","On parle de [[malédiction des ressources]] : un pays très riche en ressources reste pauvre et instable, car ces richesses attirent la corruption, le pillage et les conflits pour les contrôler."],visuel:{diagram:"malediction"},retenir:["Paradoxe : sous-sol très riche, population très pauvre.","Les richesses attirent convoitises, corruption et conflits : c’est la malédiction des ressources."]}],check:{q:"Qu’appelle-t-on la « malédiction des ressources » ?",o:["Le fait qu’un pays n’ait aucune ressource.","Le paradoxe d’un pays riche en ressources dont la population reste pauvre et qui connaît des conflits.","La disparition rapide des ressources renouvelables.","Une catastrophe naturelle dans une mine."],a:1,e:"Le paradoxe : abondance de richesses naturelles, mais pauvreté, corruption et conflits pour leur contrôle."}},{id:"a4",titre:"Les minerais au cœur des conflits",resume:"Comment le coltan finance la guerre à l’est de la RDC.",pages:[{titre:"Une guerre parmi les plus meurtrières",blocs:["Le coltan est au cœur de la guerre en RDC, l’un des conflits les plus meurtriers depuis la Seconde Guerre mondiale, avec **plus de 6 millions de morts**.","En 2015, un rapport d’experts présenté au [[ONU|Conseil de sécurité de l’ONU]] dénonce les grandes quantités de minerai extraites illégalement, transportées en [[contrebande]] avec l’accord de [[milices]] armées, au profit de sociétés régionales et internationales.","L’armée rwandaise aurait ainsi retiré 250 millions de dollars de ce trafic entre 1998 et 2000. L’Ouganda, le Rwanda et le Burundi ont été mis en cause par l’ONU, mais ils ont nié leur implication."],visuel:{map:"rdc_conflits",props:{only:["provinces","violences","villes"]}},retenir:["Plus de 6 millions de morts : un des conflits les plus meurtriers depuis 1945.","Extraction illégale + contrebande + milices + pays voisins + entreprises."]},{titre:"Des « minerais de sang » et un racket organisé",blocs:["On appelle « [[minerais de sang]] » les minerais dont la vente finance des groupes armés. Les [[3T|minerais des conflits]] sont l’étain, le tantale (coltan), le tungstène et l’or.","De nombreuses milices organisent un véritable [[racket]] : elles contrôlent des mines, imposent des taxes aux [[creuseurs]] et aux transporteurs, et font passer les minerais en contrebande.","Exemple : depuis avril 2024, les rebelles du **M23** contrôlent la zone minière de **Rubaya** (Nord-Kivu). Elle leur rapporterait environ 300 000 dollars par mois, ce qui finance leurs [[exactions]]."],visuel:{diagram:"racket"},retenir:["Minerais de sang : leur commerce finance la guerre.","Rubaya : mine de coltan contrôlée par le M23 depuis avril 2024 (≈ 300 000 $ par mois)."]},{titre:"Où se concentrent les violences ?",blocs:["La carte des décès liés aux violences en 2023 montre une forte concentration **à l’est du pays** : dans l’Ituri, le Nord-Kivu (autour de Beni et de Goma) et le Sud-Kivu.","Ce sont aussi les régions des mines d’or, d’étain et de coltan, à la frontière de l’Ouganda, du Rwanda et du Burundi. La présence des minerais, la faiblesse de l’État et les frontières proches favorisent les trafics.","D’autres foyers de violence existent, par exemple à l’ouest près de Kinshasa, mais ils sont moins nombreux."],visuel:{map:"rdc_conflits",props:{names:["villes"]}},retenir:["Les violences se concentrent à l’est (Ituri, Nord-Kivu, Sud-Kivu), là où se trouvent les mines et les frontières."]}],check:{q:"Quels sont les « 3T » ?",o:["Tantale, titane, tungstène","Étain (tin), tantale, tungstène","Tantale, tourmaline, thorium","Étain, titane, tantale"],a:1,e:"Les 3T = tin (étain), tantale, tungstène. Avec l’or, ce sont les minerais des conflits."}},{id:"a5",titre:"Les groupes armés de l’est de la RDC",resume:"CODECO, ADF, FDLR, M23 et Maï-Maï Kata Katanga.",pages:[{titre:"Cinq groupes armés à connaître",blocs:["**CODECO** (Coopérative pour le développement du Congo) : née en 1970 comme coopérative agricole, devenue un mouvement armé en Ituri. Elle prétend défendre les Lendu contre les Hema ; ses attaques ont fait des milliers de morts.","**ADF** (Forces démocratiques alliées) : fondées en Ouganda à la fin des années 1990, actives en RDC (Beni, Ituri). Elles veulent établir un État islamique dans la région ; elles ont tué des milliers de civils.","**FDLR** (Forces démocratiques de libération du Rwanda) : présentes depuis 2000, surtout composées de Hutu rwandais, dont d’anciens militaires du régime rwandais renversé en 1994. Elles veulent renverser le gouvernement du Rwanda.","**M23** (Mouvement du 23 mars) : fondé par d’anciens soldats de l’armée congolaise après la rupture de l’accord de paix du 23 mars 2009. Composé surtout de Tutsi, il est soutenu par le Rwanda selon les experts de l’ONU.","**Maï-Maï Kata Katanga** : groupe qui lutte pour l’indépendance du Katanga, la province la plus riche du pays ; il tire l’essentiel de ses revenus de mines d’or."],visuel:{map:"rdc_conflits",props:{names:["groupes"]}},retenir:["Ituri : CODECO, ADF · Nord-Kivu : ADF, M23, FDLR · Katanga : Maï-Maï Kata Katanga.","Tous se financent en partie grâce aux minerais (racket, contrebande)."]},{titre:"Actualité : Goma depuis 2025",blocs:["Fin janvier 2025, après une offensive éclair, l’alliance **AFC/M23**, soutenue par le Rwanda selon l’ONU et les États-Unis, a pris le contrôle de **Goma**, puis de **Bukavu** en février.","Le 27 juin 2025, la RDC et le Rwanda ont signé à Washington un accord de paix (cessez-le-feu, retrait des troupes étrangères, coopération économique), puis d’autres textes ont suivi, notamment des négociations avec le M23 à Doha.","Mais à la mi-2026, les combats continuent sur le terrain : la paix existe sur le papier, beaucoup moins dans la réalité. Les minerais restent un enjeu central de ces négociations."],visuel:{map:"rdc_conflits",props:{only:["provinces","groupes","villes"],names:["villes"]}},retenir:["Janvier 2025 : Goma prise par l’AFC/M23 ; accord de Washington le 27 juin 2025.","Mi-2026 : accords signés, mais violences persistantes."],note:"Situation vérifiée en novembre 2026 (ONU Info, RFI, La Libre, AllAfrica). Elle peut évoluer : vérifie l’actualité."}],check:{q:"Quel groupe armé contrôle la mine de coltan de Rubaya depuis 2024 ?",o:["La CODECO","Les ADF","Le M23","Les Maï-Maï Kata Katanga"],a:2,e:"Le M23 (alliance AFC/M23) contrôle Rubaya, au Nord-Kivu, depuis avril 2024."}},{id:"a6",titre:"Le milieu physique de la RDC",resume:"Relief, végétation, climat, paludisme et densités.",pages:[{titre:"Le relief : une cuvette entourée de hauteurs",blocs:["Au centre, la **[[cuvette centrale]]** : une vaste plaine basse (300 à 500 m), souvent marécageuse, traversée par le fleuve Congo et couverte de forêt dense.","Autour, des **[[plateaux]] et collines** légèrement plus hauts (500 à 1000 m), notamment au Kasaï et au Katanga.","À l’est, des **montagnes** : le [[rift|Rift Albertin]], les monts Rwenzori, les Virunga (volcans) ; au sud-est, les **hauts plateaux du Haut-Katanga** (plus de 1500 m). Deux volcans actifs menacent la population : le **Nyiragongo** et le **Nyamuragira**."],visuel:{map:"rdc_milieu",props:{theme:"relief",names:["volcans"]}},retenir:["Cuvette centrale (300-500 m) → plateaux (500-1000 m) → montagnes de l’est et hauts plateaux du Katanga.","Volcans actifs près de Goma : Nyiragongo et Nyamuragira."]},{titre:"Le climat et la végétation",blocs:["Au centre, autour de l’équateur, le [[climat équatorial]] : chaud, avec 11 à 12 mois de pluie par an. La végétation est la **[[forêt équatoriale]]**.","Vers le sud (et l’extrême nord), le [[climat tropical]] : une [[saison sèche]] apparaît (5 à 9 mois de pluie seulement). La forêt laisse la place à la **savane boisée**, puis à la **savane herbeuse** au Katanga.","À l’est, en altitude, le [[climat des montagnes]] est plus frais : on y trouve une **végétation de montagne**."],visuel:{map:"rdc_milieu",props:{theme:"climat"}},retenir:["Climat équatorial → forêt équatoriale ; climat tropical → savanes ; climat des montagnes → végétation de montagne.","Le climat explique la végétation."]},{titre:"Paludisme et densités de population",blocs:["Le [[paludisme]] est transmis par un moustique qui aime la chaleur et l’humidité. Dans la cuvette centrale, il se transmet **toute l’année** ; en altitude, à l’est, beaucoup moins (il fait plus frais).","La population n’est pas répartie de façon égale. Les **fortes densités** se trouvent autour de Kinshasa et surtout à l’**est**, dans la région des Grands Lacs.","Pourquoi l’est attire-t-il les habitants ? Des [[atouts]] : sols volcaniques fertiles, climat d’altitude plus frais et plus sain (moins de paludisme), lacs (eau, pêche, transport), minerais. Mais aussi des [[contraintes]] : volcans, relief accidenté et conflits."],visuel:{map:"rdc_milieu",props:{theme:"sante"}},retenir:["Paludisme toute l’année dans la cuvette chaude et humide ; peu en altitude.","L’est est densément peuplé (atouts : sols volcaniques, climat frais) malgré les contraintes."]}],check:{q:"Pourquoi le paludisme se transmet-il moins autour de Goma que dans la cuvette centrale ?",o:["Parce que Goma est au bord de la mer.","Parce qu’à 1500 m d’altitude il fait plus frais, ce qui gêne le moustique.","Parce qu’il n’y a pas de lac à Goma.","Parce que Goma est dans le désert."],a:1,e:"La température baisse avec l’altitude : le moustique vecteur s’y développe moins bien."}},{id:"a7",titre:"Goma : un tableau de données géographiques",resume:"Activité 3 du dossier : lire plusieurs cartes pour caractériser un lieu.",pages:[{titre:"Lire plusieurs cartes pour décrire un lieu",blocs:["Pour caractériser un lieu, on croise plusieurs [[cartes thématiques]] : ressources, relief, végétation, climat, santé, densité, température.","Méthode : 1. repère le lieu sur chaque carte ; 2. lis la légende ; 3. note l’information qui correspond à l’emplacement ; 4. reste prudent si le lieu est à la limite de deux zones (écris « environ »)."],table:{head:["Question (carte du dossier)","Réponse pour Goma"],rows:[["Région stannifère ou cuprifère ? (carte 1)","Région **stannifère** (riche en étain et en coltan)."],["Proximité avec un lac ? Lequel ? (carte 4)","Oui : sur la rive nord du **lac Kivu**."],["Altitude ?","Environ **1500 m**."],["Type de végétation ? (carte 6)","**Végétation de montagne**."],["Type de climat ? (carte 7)","**Climat des montagnes** (à la limite du climat équatorial)."],["Nombre de mois de pluie par an ? (carte 7)","Environ **10 mois** (lecture approximative)."],["Mois de transmission du paludisme ? (carte 8)","**Peu** : de 0 à environ 2 mois (l’altitude limite le moustique)."],["Densité de population ? (carte 9)","**Forte** : plus de 70 hab./km²."],["Température moyenne annuelle ? (carte 10)","Environ **20 °C** (plus frais que la cuvette, grâce à l’altitude)."]]},visuel:{map:"rdc_milieu",props:{theme:"vegetation"}},retenir:["Goma : stannifère, lac Kivu, 1500 m, végétation et climat de montagne, ≈ 10 mois de pluie, peu de paludisme, forte densité, ≈ 20 °C."],note:"Les valeurs de pluie, de paludisme et de température sont des lectures de carte : ton professeur peut accepter une fourchette."}],check:{q:"D’après le tableau, quelle caractéristique explique à la fois la température plus douce et le faible paludisme à Goma ?",o:["La proximité du Rwanda","L’altitude (environ 1500 m)","La région stannifère","Le lac Tanganyika"],a:1,e:"L’altitude fait baisser la température, ce qui gêne aussi le moustique du paludisme."}},{id:"a8",titre:"Enjeux et problématiques : la synthèse",resume:"Activité 1 : un schéma des acteurs, des causes et des conséquences.",pages:[{titre:"Le schéma des enjeux du coltan",blocs:["Une [[ressource]] devient un [[enjeu]] quand plusieurs [[acteurs]] veulent la contrôler. Autour du coltan, on trouve : l’État congolais (faible à l’est), les groupes armés, les pays voisins, les négociants et les [[multinationales]], les creuseurs et les consommateurs du monde entier.","Conséquences : violences et millions de morts, [[déplacés internes]] et réfugiés, travail des enfants dans les mines artisanales, pauvreté, contrebande et menace sur l’écosystème forestier.","Réponses : la [[traçabilité]] des minerais. Aux États-Unis, une loi de 2010 (Dodd-Frank) oblige les entreprises à vérifier l’origine du tantale, de l’étain, du tungstène et de l’or ; dans l’UE, un règlement du même type s’applique depuis 2021."],visuel:{diagram:"enjeux"},retenir:["Ressource convoitée + État faible + frontières proches = conflits.","Réponse principale : la traçabilité de la chaîne d’approvisionnement."]},{titre:"Le coltan, la mondialisation et nous",blocs:["La [[chaîne d’approvisionnement]] du coltan relie l’est de la RDC au reste du monde : mine → négociants (souvent via le Rwanda) → fonderies, surtout en Asie → fabricants de composants → marques d’électronique → consommateurs.","Les iPhone d’Apple, les Kindle d’Amazon ou les ordinateurs HP sont-ils encore fabriqués en nourrissant des conflits ? Le doute reste permis. General Electric, Microsoft, HP ou Intel ont publié l’origine de leurs minerais sensibles.","En 2024, la RDC a accusé Apple d’utiliser des « minerais de sang ». Ce [[flux]] est un bon exemple de [[mondialisation]] : un geste quotidien en Europe est lié à une mine du Kivu."],visuel:{diagram:"chaine_coltan"},retenir:["Le coltan illustre la mondialisation : flux de la mine du Kivu au consommateur européen.","Les entreprises sont poussées à prouver l’origine de leurs minerais."]}],check:{q:"Quelle est la réponse principale pour éviter d’acheter des minerais qui financent la guerre ?",o:["Interdire les téléphones portables","La traçabilité de la chaîne d’approvisionnement","Fermer toutes les mines d’Afrique","Augmenter le prix du coltan"],a:1,e:"La traçabilité permet de vérifier l’origine du minerai à chaque étape (lois Dodd-Frank aux États-Unis, règlement européen depuis 2021)."}},{id:"a9",titre:"Le croquis de synthèse",resume:"Activité 4 : réaliser un croquis schématique avec ses 5 éléments.",pages:[{titre:"Les cinq informations d’une carte",blocs:["Toute représentation cartographique contient cinq informations : le **titre**, la **légende**, l’**orientation** (rose des vents), l’**échelle** et la **source**.","Le [[titre]] contient trois informations : le **sujet**, la **date** et le **lieu**. Exemple : « Les minerais, sources de conflits en RDC en 2023 ».","Pour un [[croquis]] schématique, l’échelle n’est pas nécessaire. La source à indiquer : « Cours de géographie EBC – S5 – 2026-27 »."],visuel:{diagram:"elements_carte"},retenir:["Titre (sujet + date + lieu), légende conforme, orientation, échelle (sauf croquis schématique), source."]},{titre:"Choisir le bon figuré",blocs:["Chaque élément du croquis est représenté par un figuré dont l’[[implantation]] dépend de sa forme dans la réalité : un **point** pour un lieu (une ville), une **ligne** pour une limite ou un trajet (l’équateur, une frontière), une **surface** pour un espace (la ceinture cuprifère).","Éléments demandés : les frontières de la RDC, l’équateur, la capitale Kinshasa, quatre villes secondaires (Lubumbashi, Mbuji-Mayi, Kisangani, Goma), la région stannifère et la ceinture cuprifère, les zones de violences en 2023 et la zone où le paludisme se transmet toute l’année.","Une [[légende]] conforme reprend exactement les mêmes figurés que le croquis et les classe par thème."],visuel:{builder:"croquis"},retenir:["Point = lieu ; ligne = limite ou trajet ; surface = espace.","La légende reprend exactement les figurés du croquis."]}],check:{q:"Quel figuré utilises-tu pour la ceinture cuprifère sur ton croquis ?",o:["Un point","Une ligne","Une surface (zonal)","Une flèche"],a:2,e:"La ceinture cuprifère est un espace : on la représente par une surface colorée ou hachurée."}}]},{id:"B",titre:"Les repères spatiaux à connaître en S5",sous:"Fiches Cartes 1 à 14 · Monde, Europe, Belgique, Paris",lecons:[{id:"b1",titre:"Les grands repères du monde",resume:"Continents, océans, lignes remarquables (Carte 1).",pages:[{titre:"Les six continents",blocs:["Dans le modèle à six [[continents]], on distingue : l’**Amérique**, l’**Europe**, l’**Afrique**, l’**Asie**, l’**Océanie** et l’**Antarctique**.","L’Europe et l’Asie forment un seul bloc de terres (l’Eurasie). La limite conventionnelle passe par les monts Oural.","Astuce : mémorise-les en partant de la Belgique vers l’ouest (Amérique), le sud (Afrique), l’est (Asie), puis l’Océanie et l’Antarctique."],visuel:{map:"monde_continents",props:{names:["continents"],only:["oceans","continents"]}},retenir:["6 continents : Amérique, Europe, Afrique, Asie, Océanie, Antarctique."]},{titre:"Les océans",blocs:["La carte du dossier nomme cinq océans : l’océan **Pacifique** (le plus grand), l’océan **Atlantique**, l’océan **Indien**, l’océan **Arctique** (autour du pôle Nord) et l’océan **Antarctique** ou Austral (autour de l’Antarctique).","Le titre de la fiche annonce « 6 océans » : certains manuels coupent un océan en deux (par exemple Atlantique Nord et Atlantique Sud). Vérifie avec ton professeur la liste qu’il attend.","La Belgique borde la mer du Nord, une mer de l’océan Atlantique."],visuel:{map:"monde_continents",props:{names:["oceans"],only:["oceans","continents"]}},retenir:["Pacifique, Atlantique, Indien, Arctique, Antarctique (Austral)."]},{titre:"Les lignes remarquables",blocs:["L’**[[équateur]]** (0°) partage la Terre en **hémisphère Nord** et **hémisphère Sud**.","Les **[[tropiques]]** sont à environ 23° : le tropique du **Cancer** au nord, le tropique du **Capricorne** au sud. Les **[[cercles polaires]]** sont à environ 66° : arctique au nord, antarctique au sud. Les **pôles** sont à 90°.","Le **[[méridien de Greenwich]]** (0° de longitude) sert de référence pour mesurer la longitude, vers l’est ou vers l’ouest."],visuel:{map:"monde_continents",props:{names:["lignes","poles"]}},retenir:["Équateur 0° · Tropiques 23° N et S · Cercles polaires 66° N et S · Pôles 90° · Greenwich 0°."]}],check:{q:"À quelle latitude se trouve le tropique du Capricorne ?",o:["23° Nord","23° Sud","66° Sud","0°"],a:1,e:"Capricorne = tropique de l’hémisphère Sud, à environ 23° S (pense à « Capri-Sud »)."}},{id:"b2",titre:"La répartition de la population mondiale",resume:"7 foyers de population et 12 espaces peu peuplés (Carte 2).",pages:[{titre:"Les espaces peuplés",blocs:["La population mondiale est très inégalement répartie. Du plus densément peuplé au moins densément peuplé, les grands [[foyers de population]] sont :","1. l’Asie de l’Est (Chine) ; 2. l’Asie du Sud (Inde, Pakistan) ; 3. l’Indonésie ; 4. l’Europe occidentale et centrale ; 5. l’Afrique de l’Est (région des Grands Lacs) ; 6. l’Afrique de l’Ouest (golfe de Guinée) ; 7. le Nord-Est des États-Unis.","Ces espaces ont des [[atouts]] : plaines et deltas fertiles, climat favorable, eau abondante, peuplement ancien, villes et activités."],visuel:{map:"monde_population",props:{names:!1}},retenir:["Ordre à connaître : Asie de l’Est, Asie du Sud, Indonésie, Europe, Grands Lacs, golfe de Guinée, Nord-Est des États-Unis."]},{titre:"Les espaces vides ou peu peuplés",blocs:["Les [[espaces vides]] correspondent à de fortes [[contraintes]] naturelles : le froid, l’aridité, l’altitude ou la forêt dense.","Froid : le Grand Nord (au nord du 60e parallèle) et l’Antarctique. Aridité : le Sahara, le désert de Gobi, le désert australien, la péninsule arabique. Altitude : l’Himalaya, les Rocheuses et l’Ouest américain, les Andes et la Patagonie.","Forêt dense : l’Amazonie, la forêt équatoriale du bassin du Congo, Bornéo et les forêts d’Asie du Sud-Est."],visuel:{map:"monde_population",props:{}},retenir:["12 espaces vides : Grand Nord, Antarctique, Sahara, Amazonie, Gobi, Himalaya, désert australien, Rocheuses, bassin du Congo, Andes-Patagonie, péninsule arabique, Bornéo.","Contraintes : froid, aridité, altitude, forêt dense."]}],check:{q:"Quelle contrainte explique le faible peuplement du bassin du Congo ?",o:["Le froid","L’aridité","La forêt dense (équatoriale)","L’altitude"],a:2,e:"La forêt équatoriale dense, chaude et humide, est difficile à défricher et à habiter."}},{id:"b3",titre:"Les zones climatiques du monde",resume:"Climats froids, tempérés, chauds et montagnard (Carte 7).",pages:[{titre:"Trois grandes zones",blocs:["La température dépend d’abord de la [[latitude]] : plus on s’éloigne de l’équateur, plus il fait froid. On distingue donc des [[zones climatiques]] en bandes.","La **zone chaude** (intertropicale) entoure l’équateur, à peu près entre les tropiques. Les **zones tempérées** sont aux latitudes moyennes. Les **zones froides** sont au-delà des cercles polaires.","La température dépend aussi de l’[[altitude]] (elle baisse en montagne) et de la [[continentalité]] (loin de la mer, les hivers sont plus froids et les étés plus chauds)."],visuel:{diagram:"zonation"},retenir:["Latitude → zones chaude, tempérées, froides.","Altitude et continentalité modifient le climat."]},{titre:"Les climats et leurs caractéristiques",blocs:["**Climats chauds** : [[climat équatorial]] (chaleur et pluies toute l’année), [[climat tropical]] (une saison sèche et une saison des pluies), [[climat désertique]] (chaleur et pluies très faibles).","**Climats tempérés** : [[climat océanique]] (étés frais, hivers doux, pluies fréquentes), [[climat continental]] (étés chauds, hivers froids, pluies faibles), [[climat méditerranéen]] (étés chauds et secs, hivers doux, pluies d’automne).","**Climat froid** ([[climat polaire|polaire]]) : froid toute l’année. **[[Climat montagnard]]** : plus froid et plus humide que les plaines voisines."],visuel:{map:"monde_climats",props:{}},retenir:["Chauds : équatorial, tropical, désertique · Tempérés : océanique, continental, méditerranéen · Froid : polaire · + montagnard."]}],check:{q:"Quel climat a des étés chauds et secs et des hivers doux ?",o:["Océanique","Continental","Méditerranéen","Équatorial"],a:2,e:"C’est le climat méditerranéen : étés chauds et secs, pluies surtout en automne."}},{id:"b4",titre:"Les biomes du monde",resume:"Les paysages naturels et leur lien avec le climat (Carte 8 et pyramide).",pages:[{titre:"Le climat dessine les paysages",blocs:["Un [[biome]] est un grand ensemble naturel (végétation, animaux, sols) qui dépend surtout du climat : de la température et de l’humidité.","La pyramide des biomes résume ce lien : de bas en haut, il fait de plus en plus froid ; de gauche à droite, de plus en plus sec.","Tropical : [[forêt tropicale humide]] → [[savane]] → [[désert]]. Tempéré : [[forêt tempérée]] → prairie tempérée → désert. Subarctique : [[taïga]]. Arctique : [[toundra]]."],visuel:{diagram:"pyramide"},retenir:["Plus froid → taïga puis toundra.","Plus sec → savane / prairie puis désert."]},{titre:"Où trouve-t-on chaque biome ?",blocs:["**Forêt tropicale humide** : Amazonie, bassin du Congo, Indonésie. **Savane** : Afrique de l’Est, Sahel, centre du Brésil. **Désert** : Sahara, Arabie, Australie, Gobi.","**[[Prairie]] (grassland)** : Grandes Plaines d’Amérique du Nord, steppes d’Asie centrale, pampa argentine. **Forêt tempérée** : Europe de l’Ouest, est des États-Unis, Chine de l’Est.","**Taïga** : Sibérie, Canada, Scandinavie. **Toundra** : nord du Canada et de la Sibérie. **Glace** : Groenland et Antarctique."],visuel:{map:"monde_biomes",props:{}},retenir:["Associe chaque biome à un climat et à deux exemples de lieux."]}],check:{q:"Quel biome trouve-t-on sous un climat continental froid, en Sibérie ?",o:["La savane","La taïga","La garrigue","La forêt tropicale"],a:1,e:"La taïga : grande forêt de conifères des régions continentales froides."}},{id:"b5",titre:"L’Europe et l’Union européenne",resume:"Les États membres, les candidats et les voisins (Carte 5).",pages:[{titre:"Les 27 États membres",blocs:["L’[[Union européenne]] compte **27 États membres** : Allemagne, Autriche, Belgique, Bulgarie, Chypre, Croatie, Danemark, Espagne, Estonie, Finlande, France, Grèce, Hongrie, Irlande, Italie, Lettonie, Lituanie, Luxembourg, Malte, Pays-Bas, Pologne, Portugal, Roumanie, Slovaquie, Slovénie, Suède et Tchéquie.","Le **Royaume-Uni** est un ancien membre : il a quitté l’UE en 2020 (le [[Brexit]]). La Norvège, la Suisse et l’Islande sont des pays européens qui ne sont pas membres.","Pour mémoriser, procède par grandes régions : Europe du Nord, de l’Ouest, centrale, du Sud, puis les îles (Chypre, Malte)."],visuel:{map:"europe_ue",props:{}},retenir:["27 membres ; Royaume-Uni : ancien membre (2020) ; Norvège, Suisse, Islande : hors UE."]},{titre:"Les pays candidats",blocs:["Plusieurs pays sont officiellement candidats et ont entamé le processus de négociation (pour certains, l’ouverture des chapitres de négociation est encore en attente) : la **Turquie**, le **Monténégro**, la **Serbie**, l’**Albanie**, la **Macédoine du Nord**, l’**Ukraine**, la **Moldavie** et la **Bosnie-Herzégovine**.","La **Géorgie** est candidate reconnue, mais le processus est gelé. Le **Kosovo** a déposé sa candidature en 2022.","La carte du dossier montre la situation au 1er juillet 2025 : ces statuts peuvent évoluer."],visuel:{map:"europe_ue",props:{}},retenir:["Candidats en négociation : Turquie, Monténégro, Serbie, Albanie, Macédoine du Nord, Ukraine, Moldavie, Bosnie-Herzégovine."]}],check:{q:"Quel pays a quitté l’Union européenne en 2020 ?",o:["La Norvège","La Suisse","Le Royaume-Uni","L’Irlande"],a:2,e:"Le Royaume-Uni est sorti de l’UE le 31 janvier 2020 (Brexit)."}},{id:"b6",titre:"La population européenne et belge",resume:"Les 15 aires urbaines européennes, les 7 aires urbaines belges (Cartes 3 et 4).",pages:[{titre:"Les 15 aires urbaines européennes",blocs:["Une [[aire urbaine]] regroupe une ville, ses banlieues et les communes dont beaucoup d’habitants travaillent dans la ville.","Les 15 principales aires urbaines européennes (2017) sont : **Moscou, Londres, Paris, Madrid, Barcelone, Milan, Berlin, Saint-Pétersbourg, Rome, Naples, Athènes, Kiev, Lisbonne, Manchester et Birmingham**.","Autour de la Belgique, quatre aires urbaines périphériques comptent aussi : **Lille, Maastricht, Aix-la-Chapelle et Luxembourg**."],visuel:{map:"europe_villes",props:{names:!0}},retenir:["15 aires urbaines : retiens-les par pays (Royaume-Uni 3, Espagne 2, Italie 3, Russie 2, France, Allemagne, Grèce, Ukraine, Portugal)."]},{titre:"Les 7 aires urbaines belges et le sillon Sambre-et-Meuse",blocs:["Les 7 principales aires urbaines belges sont : **Bruxelles, Anvers, Gand, Charleroi, Liège, Bruges et Namur**.","Le nord du pays (Flandre, axe Anvers-Bruxelles) est très densément peuplé. Le sud-est (Ardenne) l’est beaucoup moins : relief plus élevé, forêts, climat plus rude.","Charleroi, Namur et Liège s’alignent le long du **[[sillon Sambre-et-Meuse]]**, une vallée qui fut le grand axe industriel wallon (charbon et sidérurgie)."],visuel:{map:"belgique_population",props:{names:!0}},retenir:["Bruxelles, Anvers, Gand, Charleroi, Liège, Bruges, Namur.","Sillon Sambre-et-Meuse : Charleroi – Namur – Liège."]}],check:{q:"Laquelle de ces villes n’est PAS une des 7 aires urbaines belges du cours ?",o:["Namur","Bruges","Mons","Gand"],a:2,e:"Les 7 : Bruxelles, Anvers, Gand, Charleroi, Liège, Bruges, Namur. Mons n’en fait pas partie."}},{id:"b7",titre:"La Belgique : un État fédéral",resume:"Régions, Communautés, frontière linguistique, provinces (Carte 6).",pages:[{titre:"Trois Régions",blocs:["La Belgique est un [[État fédéral]] : le pouvoir est partagé entre l’autorité fédérale et des entités fédérées, les Régions et les Communautés.","Les trois **[[Régions]]** s’occupent de ce qui est lié au **territoire** (économie, emploi, environnement, transports…) : la **Région flamande**, la **Région wallonne** et la **Région de Bruxelles-Capitale**.","La **[[frontière linguistique]]**, fixée en 1962-1963, sépare le nord néerlandophone du sud francophone. Bruxelles est une Région [[bilingue]], enclavée en Flandre."],visuel:{map:"belgique_regions",props:{names:["villes"]}},retenir:["3 Régions (territoire) : flamande, wallonne, Bruxelles-Capitale.","Frontière linguistique : 1962-1963."]},{titre:"Trois Communautés et dix provinces",blocs:["Les trois **[[Communautés]]** s’occupent de ce qui est lié aux **personnes** (enseignement, culture, langue) : la **Communauté flamande**, la **Communauté française** (appelée Fédération Wallonie-Bruxelles) et la **Communauté germanophone** (à l’est de la province de Liège, autour d’Eupen et de Saint-Vith).","À Bruxelles, les Communautés flamande et française sont toutes les deux compétentes.","La Belgique compte aussi **dix [[provinces]]** : cinq flamandes (Flandre-Occidentale, Flandre-Orientale, Anvers, Limbourg, Brabant flamand) et cinq wallonnes (Hainaut, Brabant wallon, Namur, Liège, Luxembourg)."],visuel:{map:"belgique_communautes",props:{}},retenir:["3 Communautés (personnes) : flamande, française, germanophone.","10 provinces : 5 flamandes + 5 wallonnes ; Bruxelles n’en fait pas partie."]}],check:{q:"Quelle entité fédérée organise ton école si tu étudies en français à Namur ?",o:["La Région wallonne","La Communauté française (Fédération Wallonie-Bruxelles)","La province de Namur","La Communauté germanophone"],a:1,e:"L’enseignement est lié aux personnes : c’est une compétence des Communautés."}},{id:"b8",titre:"Climats et biomes d’Europe",resume:"Cartes 9 et 10 : océanique, continental, méditerranéen… taïga, garrigue, maquis.",pages:[{titre:"Les climats européens",blocs:["À l’ouest, près de l’Atlantique : le [[climat océanique]] (Irlande, Royaume-Uni, France de l’Ouest, Belgique, Pays-Bas).","Vers l’est, loin de la mer : le [[climat continental]] (Pologne, Ukraine, Russie, Scandinavie intérieure). Au sud : le [[climat méditerranéen]] autour de la Méditerranée, et un climat tempéré chaud à l’intérieur (Espagne, sud-ouest de la France).","Dans les montagnes (Alpes, Pyrénées, Carpates, Balkans), le [[climat montagnard]]. Tout au nord, en Laponie, un climat froid. Au sud de la Méditerranée commence le domaine aride."],visuel:{map:"europe_climats",props:{names:!0}},retenir:["Ouest océanique, est continental, sud méditerranéen, montagnes montagnard, nord froid."]},{titre:"Les biomes européens",blocs:["La **[[forêt tempérée]]** de feuillus et de conifères couvre une grande partie de l’Europe. Les [[feuillus]] perdent leurs feuilles en hiver ; les [[conifères]] gardent leurs aiguilles.","Au nord, la **[[taïga]]** (forêt de conifères, sol acide appelé [[podzol]]) puis la **[[toundra]]** (mousses, lichens, sol gelé en permanence : le [[permafrost]]).","Autour de la Méditerranée, la forêt méditerranéenne : la **[[garrigue]]** (végétation basse sur sol calcaire sec) et le **[[maquis]]** (végétation plus dense et plus haute, arbustes épineux). À l’est, la **[[steppe]]**."],visuel:{map:"europe_biomes",props:{names:!0}},retenir:["Taïga et toundra au nord, forêt tempérée au centre, garrigue et maquis au sud, steppe au sud-est."]}],check:{q:"Quelle différence entre la garrigue et le maquis ?",o:["La garrigue est basse et clairsemée, le maquis dense et plus haut.","La garrigue pousse en Laponie.","Le maquis est une forêt de conifères.","Il n’y a aucune différence."],a:0,e:"Garrigue : végétation basse, clairsemée, sur calcaire sec. Maquis : plus fermé, plus dense et plus haut."}},{id:"b9",titre:"Les paysages naturels de Belgique",resume:"Carte 11 : des dunes à la Lorraine belge.",pages:[{titre:"Du nord au sud",blocs:["Au bord de la mer : les **[[dunes]]** puis les **[[polders]]**, terres basses gagnées sur la mer et protégées par des digues. Ensuite la **Flandre**, plaine fertile et très peuplée. Au nord-est, la **Campine**, sablonneuse, boisée et peu fertile.","Au centre : la **Région des Collines**, puis les plateaux du **Pays hennuyer et brabançon** (agriculture riche, villes industrielles comme Mons et Charleroi), **Bruxelles** dans une cuvette, la **Hesbaye** très fertile ([[limon]]) et le **Pays de Herve** ([[bocage]], herbages et vergers).","Au sud du sillon Sambre-et-Meuse : le **Condroz** (crêtes et vallées), la **Famenne** (dépression), la **Fagne** (zone humide), l’**Ardenne** (moyenne montagne boisée, peu peuplée) et la **Lorraine belge** au sud."],visuel:{map:"belgique_naturelle",props:{names:["regions"]}},retenir:["Nord : dunes, polders, Flandre, Campine · Centre : Collines, Pays hennuyer et brabançon, Hesbaye, Herve · Sud : Condroz, Famenne, Fagne, Ardenne, Lorraine belge."]}],check:{q:"Quelle région naturelle est connue pour son sol très fertile et ses grandes cultures ?",o:["La Campine","La Hesbaye","L’Ardenne","La Fagne"],a:1,e:"La Hesbaye, au sol limoneux, est l’une des régions agricoles les plus fertiles."}},{id:"b10",titre:"L’orohydrographie de l’Europe et de la Belgique",resume:"Cartes 12 et 13 : montagnes, plaines, fleuves et rivières.",pages:[{titre:"Reliefs et fleuves d’Europe",blocs:["Les grandes **chaînes de montagnes** : les Alpes, les Pyrénées, les Carpates, les Apennins, les Alpes dinariques, les Balkans, le Massif scandinave, le Caucase et l’Oural (limite entre l’Europe et l’Asie).","Les grandes **plaines** : la grande plaine d’Europe du Nord (germano-polonaise et russe) et la plaine hongroise.","Les grands **[[fleuves]]** : le Rhin, le Rhône, le Danube, la Volga (le plus long d’Europe), la Seine, la Loire, l’Elbe, l’Oder, la Vistule, le Pô, le Tage, l’Èbre, le Dniepr. Les mers : mer du Nord, Manche, mer Baltique, Méditerranée, mer Noire."],visuel:{map:"europe_relief",props:{names:["reliefs"]}},retenir:["Montagnes au sud (Alpes, Pyrénées, Carpates…), grandes plaines au nord et à l’est.","Fleuves : Rhin, Rhône, Danube, Volga…"]},{titre:"Reliefs et cours d’eau de Belgique",blocs:["Le relief belge monte du nord-ouest vers le sud-est : **Basse Belgique** (moins de 100 m), **Moyenne Belgique** (100 à 200 m), **Haute Belgique** (plus de 200 m) au sud du sillon Sambre-et-Meuse.","Le point culminant est le **Signal de Botrange** (694 m), sur le plateau des Hautes Fagnes. Autres repères : le bas-plateau de Campine, les collines de Flandre, le plateau de Herve, le plateau des Tailles et le haut-plateau d’Ardenne.","Les deux grands fleuves sont l’**Escaut** (avec la Lys, la Dendre, la Senne, la Dyle) et la **Meuse** (avec la Sambre, l’Ourthe, la Vesdre, l’Amblève, la Lesse, la Semois). L’**Yser** se jette directement dans la mer du Nord."],visuel:{map:"belgique_relief",props:{names:["rivieres"]}},retenir:["Basse, Moyenne, Haute Belgique ; Botrange 694 m.","Escaut et Meuse ; la Sambre rejoint la Meuse à Namur ; l’Yser se jette dans la mer du Nord."]}],check:{q:"Dans quelle ville la Sambre se jette-t-elle dans la Meuse ?",o:["Liège","Charleroi","Namur","Dinant"],a:2,e:"La Sambre rejoint la Meuse à Namur, au cœur du sillon Sambre-et-Meuse."}},{id:"b11",titre:"Paris : les fonctions d’une grande ville",resume:"Carte 14 : fonctions politiques, économiques, culturelles et de transport.",pages:[{titre:"Quatre grandes fonctions",blocs:["**[[Fonction urbaine|Fonctions]] politiques** : Paris est la capitale de la France. On y trouve l’Élysée (présidence), Matignon (Premier ministre), l’Assemblée nationale, le Sénat, le ministère de l’Économie (Bercy), le quartier des ministères et celui des [[ambassades]].","**Fonctions économiques** : la Bourse, l’OCDE et surtout **La Défense**, le grand [[quartier d’affaires]] à l’ouest, relié au centre par l’axe des affaires.","**Fonctions culturelles** : la Sorbonne, le Collège de France, l’UNESCO, les opéras Garnier et Bastille, et des monuments et musées de renommée internationale (Louvre, tour Eiffel, Notre-Dame, Arc de Triomphe, Sacré-Cœur, Centre Pompidou).","**Transports et communication** : Paris est très bien reliée à la France et au monde : six grandes gares, le boulevard périphérique, les autoroutes et deux aéroports internationaux (Roissy-Charles-de-Gaulle et Orly)."],visuel:{map:"paris",props:{names:!0}},retenir:["Fonctions : politique, économique, culturelle, transport. Paris est une métropole mondiale."]}],check:{q:"La Défense illustre quelle fonction de Paris ?",o:["Politique","Économique","Culturelle","Résidentielle"],a:1,e:"La Défense est le principal quartier d’affaires (sièges d’entreprises, banques) : fonction économique."}}]}],O1=Ar.flatMap(e=>e.lecons.map(l=>({...l,part:e.id})));var Ge=H(_1(),1);var N={world_base:{sphere:"M206 487l588 0 15-7 14-6 14-7 14-8 15-9 11-8 11-7 11-9 10-8 10-9 9-9 9-9 8-10 8-10 7-10 6-10 6-11 5-10 6-15 4-11 3-11 2-11 2-11 1-11 1-11 0-11-1-11-1-11-2-11-3-11-3-11-6-15-6-14-6-10-8-14-7-10-11-13-8-10-9-9-13-12-10-9-14-11-14-10-15-9-15-9-14-7-19-9-17-8-588 0-23 10-23 12-22 13-19 12-18 13-17 15-12 12-14 16-11 13-11 17-4 7-6 10-3 7-5 11-4 11-2 7-3 11-1 7-2 11-1 8-1 11 0 7 0 8 1 11 1 7 2 11 1 8 3 11 2 7 4 11 5 11 3 7 6 10 4 7 11 17 11 13 14 16 12 12 17 14 18 14 19 12 22 13 23 12z",land:"M228 481l-10-1 4 0zM284 474l-5-1 7 0zM270 473l1-1 6 1-4 0zM325 471l-9 0-4-1 11 0zM286 215l-3-3-1 0-3 3 1 2-2 2 0-3-2 1 0-2-3 0-2-1 0-2-3-4-1 2-1-1 0-3-1-1 1-1-5-6 1-1 0-1-3 1-7-3-5-6-3-2-5 2-11-6-2-3-4-1-4-6-1-2 1 0 2-3-1-5-4-8-2-2 1-3-2-2 0-3-1 0-2-4 1-7-3-2-2 5 3 12 0 9 1 0 1 3-1 2-2-4-2-3 1-4-5-4-1-2 2 0 2-3-2-4 ","Plus de 60 millions"],a:2,e:"Plus de 6 millions : un des conflits les plus meurtriers depuis 1945."},{th:"conflits",q:"En quelle année un rapport d’experts sur le trafic de coltan a-t-il été présenté au Conseil de sécurité de l’ONU ?",o:["1994","2009","2015","2023"],a:2,e:"En 2015."},{th:"conflits",q:"Quels pays voisins ont été mis en cause par l’ONU dans le trafic de coltan ?",o:["Angola, Zambie, Congo","Ouganda, Rwanda, Burundi","Tanzanie, Kenya, Soudan","Gabon, Cameroun, Tchad"],a:1,e:"L’Ouganda, le Rwanda et le Burundi, qui ont nié leur implication."},{th:"conflits",q:"Quelle mine de coltan le M23 contrôle-t-il depuis avril 2024 ?",o:["Kolwezi","Rubaya","Mbuji-Mayi","Manono"],a:1,e:"Rubaya, au Nord-Kivu ; elle lui rapporterait environ 300 000 $ par mois."},{th:"conflits",q:"Les « 3T » et l’or sont appelés…",o:["minerais nobles","minerais des conflits","terres rares","minerais énergétiques"],a:1,e:"Leur commerce peut financer des groupes armés."},{th:"conflits",q:"Quel groupe armé, actif en Ituri, est né en 1970 comme une coopérative agricole ?",o:["La CODECO","Les FDLR","Le M23","Les ADF"],a:0,e:"La Coopérative pour le développement du Congo."},{th:"conflits",q:"Quel groupe armé, fondé en Ouganda, veut établir un État islamique dans la région ?",o:["Les ADF","La CODECO","Les Maï-Maï Kata Katanga","Le M23"],a:0,e:"Les Forces démocratiques alliées (ADF)."},{th:"conflits",q:"Les FDLR sont surtout composées de…",o:["Tutsi congolais","Hutu rwandais","soldats ougandais","mineurs katangais"],a:1,e:"Les FDLR comprennent des Hutu, dont d’anciens militaires du régime rwandais renversé en 1994."},{th:"conflits",q:"D’où vient le nom du M23 ?",o:["De la date d’un accord de paix (23 mars 2009)","Du nombre de ses chefs","D’une route nationale","D’une mine"],a:0,e:"Mouvement du 23 mars, après la rupture de l’accord du 23 mars 2009."},{th:"conflits",q:"Que revendiquent les Maï-Maï Kata Katanga ?",o:["Le rattachement au Rwanda","L’indépendance du Katanga","La création d’un Éta ple, au Kivu… »)."],resolu:{consigne:"Définis l’expression « minerais de sang » et illustre-la par un exemple précis.",etapes:[{t:"1. Je trouve la classe du mot",d:"Ce sont des minerais : des roches extraites du sous-sol qui contiennent un métal."},{t:"2. Je donne le caractère essentiel",d:"Leur extraction et leur vente financent des groupes armés et des violences."},{t:"3. J’illustre avec un exemple localisé et chiffré",d:"Le coltan de Rubaya (Nord-Kivu), mine contrôlée par le M23 depuis avril 2024, qui lui rapporterait environ 300 000 $ par mois."}],reponse:"Les minerais de sang sont des minerais dont l’extraction et le commerce financent des groupes armés et des violences. Par exemple, au Nord-Kivu, le M23 contrôle depuis avril 2024 la mine de coltan de Rubaya, qui lui rapporterait environ 300 000 dollars par mois et finance ses exactions."},items:[{id:"f1a",niveau:1,type:"texte",consigne:"Définis le mot « coltan » et explique en une phrase à quoi il sert.",correction:{texte:["Le coltan est un minerai noir ou brun-rouge formé de colombite et de tantalite, dont on extrait le niobium et le tantale.","Le tantale, très résistant à la corrosion, sert à fabriquer les condensateurs des téléphones portables et des ordinateurs."],criteres:["J’ai écrit que c’est un minerai.","J’ai cité le tantale (et/ou le niobium).","J’ai donné un usage : condensateurs, électronique."]}},{id:"f1b",niveau:1,type:"texte",consigne:"Définis la « malédiction des ressources » et illustre-la par un chiffre du cours.",correction:{texte:["La malédiction des ressources est le paradoxe d’un pays très riche en ressources naturelles dont la population reste pauvre, car ces richesses attirent la corruption, le pillage et les conflits.","Exemple : la RDC a l’un des sous-sols les plus riches du monde, mais plus de 70 % des Congolais vivent avec moins de 2 dollars par jour."],criteres:["J’ai exprimé le paradoxe richesse / pauvreté.","J’ai donné au moins une cause (corruption, conflits, pillage).","J’ai cité le chiffre de 70 % et de 2 $ par jour."]}},{id:"f1c",niveau:2,type:"texte",consigne:"Explique la différence entre « situer » et « localiser » en prenant l’exemple de Bukavu.",correction:{texte:["Situer, c’est dire où se trouve un lieu par rapport à de grands repères, à petite échelle : Bukavu se situe en Afrique centrale, dans l’hémisphère Sud, à l’est de la RDC, près de la frontière du Rwanda.","Localiser, c’est donner sa position précise à grande échelle : Bukavu est le chef-lieu du Sud-Kivu, sur la rive sud du lac Kivu, face à la ville rwandaise de Cyangugu (Rusizi)."],criteres:["J’ai défini situer (petite échelle, grands repères).","J’ai défini localiser (grande échelle, position précise).","J’ai appliqué les deux à Bukavu."]}},{id:"f1d",niveau:2,type:"texte",consigne:"Définis « biome » et montre, avec deux exemples, qu’il dépend du climat.",correction:{texte:["Un biome est un grand ensemble naturel (végétation, faune, sols) qui dépend surtout du climat.","Exemples : sous le climat équatorial, chaud et humide toute l’année, pousse la forêt tropicale humide (bassin du Congo) ; sous le climat continental froid pousse la taïga, forêt de conifères (Sibérie)."],criteres:["Définition correcte.","Deux couples climat → biome justes.","Exemples localisés."]}},{id:"f1e",niveau:3,type:"texte",consigne:"Distingue « Région » et « Communauté » en Belgique. Donne un exemple de compétence pour chacune et cite les trois entités de chaque type.",correction:{texte:["Les Régions sont compétentes pour ce qui est lié au territoire (économie, emploi, environnement, aménagement du territoire, transports) : Région flamande, Région wallonne, Région de Bruxelles-Capitale.","Les Communautés sont compétentes pour ce qui est lié aux personnes (enseignement, culture, langue) : Communauté flamande, Communauté française (Fédération Wallonie-Bruxelles), Communauté germanophone."],criteres:["Régions = territoire, Communautés = personnes.","Un exemple de compétence juste pour chacune.","Les 3 + 3 entités correctement nommées."]}}]},{id:"f2",titre:"Situer et localiser un lieu",comp:"Appliquer",niveau:1,but:"Situer un lieu à petite échelle puis le localiser à grande échelle, en t’aidant de cartes.",methode:["SITUER (du plus grand au plus petit) : continent → partie du continent → hémisphère / lignes remarquables → pays → partie du pays.","LOCALISER : province ou région → coordonnées (si tu les as) → éléments proches (fleuve, lac, relief, frontière, villes voisines).","Utilise des points cardinaux et des mots de position : au nord de, sur la rive de, à la frontière de, au pied de…"],resolu:{consigne:"Activité 2 du dossier : réalise la situation et la localisation de la ville de Goma (cartes 1, 4, 5 et 6).",etapes:[{t:"1. Je situe à l’échelle du monde et de l’Afrique",d:"Goma se trouve en Afrique centrale, dans l’hémisphère Sud, tout près de l’équateur et à l’est du méridien de Greenwich."},{t:"2. Je situe à l’échelle du pays",d:"Elle est dans l’est de la République démocratique du Congo, dans la région des Grands Lacs."},{t:"3. Je localise avec la province et les coordonnées",d:"Goma est le chef-lieu de la province du Nord-Kivu, à environ 1° 41′ S et 29° 13′ E."},{t:"4. Je localise par rapport aux éléments proches",d:"Elle est construite sur la rive nord du lac Kivu, à la frontière du Rwanda (face à Gisenyi), au pied du volcan Nyiragongo, à environ 1500 m d’altitude, dans la région stannifère."}],reponse:"Situation : Goma se situe en Afrique centrale, dans l’hémisphère Sud, juste au sud de l’équateur, dans l’est de la RDC (région des Grands Lacs). Localisation : chef-lieu du Nord-Kivu (1° 41′ S – 29° 13′ E), Goma est sur la rive nord du lac Kivu, à la frontière rwandaise face à Gisenyi, au pied du volcan Nyiragongo, à environ 1500 m d’altitude.",map:{scene:"rdc_situation",props:{names:["villes","lacs"]}}},items:[{id:"f2a",niveau:1,type:"carte",consigne:"Sur la carte, désigne les villes demandées.",scene:"rdc_situation",layer:"villes",targets:["kinshasa","lubumbashi","mbujimayi","kisangani","goma","bukavu"]},{id:"f2b",niveau:1,type:"carte",consigne:"Désigne les neuf pays voisins de la RDC.",scene:"rdc_situation",layer:"voisins",targets:["n_cog","n_caf","n_ssd","n_uga","n_rwa","n_bdi","n_tza","n_zmb","n_ago"]},{id:"f2c",niveau:2,type:"texte",consigne:"Situe puis localise la ville de Lubumbashi.",doc:{map:"rdc_ressources",props:{names:["villes"]}},correction:{texte:["Situation : Lubumbashi se situe en Afrique centrale (australe), dans l’hémisphère Sud, à l’extrême sud-est de la RDC.","Localisation : elle est dans l’ancienne province du Katanga (aujourd’hui le Haut-Katanga), tout près de la frontière de la Zambie, dans la ceinture cuprifère (cuivre et cobalt), sur les hauts plateaux du Katanga (plus de 1200 m)."],criteres:["Situation : continent, hémisphère, partie du pays.","Localisation : province, frontière zambienne.","J’ai cité la ceinture cuprifère."]}},{id:"f2d",niveau:2,type:"texte",consigne:"Situe puis localise Kisangani.",doc:{map:"rdc_situation",props:{names:["villes"]}},correction:{texte:["Situation : Kisangani se situe en Afrique centrale, dans l’hémisphère Nord, juste au nord de l’équateur, dans le nord-est de la RDC.","Localisation : elle est sur le fleuve Congo (là où le Lualaba devient le Congo), au cœur de la cuvette centrale couverte de forêt équatoriale, à environ 400 m d’altitude."],criteres:["Hémisphère Nord, juste au nord de l’équateur.","Sur le fleuve Congo.","Dans la cuvette centrale / forêt équatoriale."]}},{id:"f2e",niveau:3,type:"texte",consigne:"Situe puis localise la Belgique et Namur (Carte 6 et Carte 13).",doc:{map:"belgique_relief",props:{names:["rivieres"]}},correction:{texte:["Situation : la Belgique se situe en Europe de l’Ouest, dans l’hémisphère Nord (vers 50° N), à l’est du méridien de Greenwich, au bord de la mer du Nord, entre la France, les Pays-Bas, l’Allemagne et le Luxembourg.","Localisation de Namur : capitale de la Wallonie, au centre du pays, dans le sillon Sambre-et-Meuse, au confluent de la Sambre et de la Meuse, entre Charleroi (à l’ouest) et Liège (à l’est)."],criteres:["Belgique : continent, hémisphère, mer, voisins.","Namur : sillon Sambre-et-Meuse, confluent.","Position par rapport à Charleroi et Liège."]}}]},{id:"f3",titre:"Lire des cartes et compléter un tableau de données",comp:"Appliquer",niveau:2,but:"Extraire une information précise de plusieurs cartes thématiques pour caractériser un lieu.",methode:["Repère le lieu sur chaque carte (aide-toi des villes et des lacs).","Lis le titre et la légende avant de répondre.","Recopie l’intitulé exact de la légende ; si le lieu est sur une limite, écris « environ » ou donne les deux possibilités."],resolu:{consigne:"Activité 3 : réalise un tableau de données géographiques sur Goma.",etapes:[{t:"1. Ressources (carte 1)",d:"Goma est dans la zone bleu clair : région stannifère (étain, coltan)."},{t:"2. Lac (carte 4)",d:"Goma est sur la rive nord du lac Kivu."},{t:"3. Végétation et climat (cartes 6 et 7)",d:"La bande de l’est est notée « Végétation de montagne » et « Climat des montagnes » ; la couleur indique environ 10 mois de pluie."},{t:"4. Santé, densité, température (cartes 8, 9, 10)",d:"Peu de mois de transmission du paludisme (0 à 2) ; densité forte (> 70 hab./km²) ; environ 20 °C de moyenne."}],reponse:"Stannifère · lac Kivu · 1500 m · végétation de montagne · climat des montagnes · environ 10 mois de pluie · paludisme faible (0 à 2 mois) · densité forte (> 70 hab./km²) · environ 20 °C.",map:{scene:"rdc_milieu",props:{theme:"climat"}}},items:[{id:"f3a",niveau:2,type:"tableau",consigne:"Complète le tableau de données pour Kinshasa (utilise les cartes thématiques de l’atlas, carte « Le milieu physique de la RDC »).",doc:{map:"rdc_milieu",props:{}},lignes:[["Situation par rapport à l’équateur","Au sud de l’équateur (environ 4° S)"],["Fleuve","Sur la rive gauche (sud) du fleuve Congo, face à Brazzaville"],["Relief","Plateaux et collines (bord de la cuvette), environ 300 m"],["Végétation","Savane boisée"],["Climat","Tropical (une saison sèche)"],["Paludisme","Transmission pendant la plus grande partie de l’année (lecture de la carte 8)"],["Densité","Très forte : c’est la capitale, plus grande ville du pays"]],criteres:["J’ai lu la légende de chaque carte.","J’ai utilisé les intitulés exacts.","J’ai nuancé quand le lieu est sur une limite."]},{id:"f3b",niveau:2,type:"tableau",consigne:"Complète le tableau de données pour Lubumbashi.",doc:{map:"rdc_milieu",props:{}},lignes:[["Ressources","Ceinture cuprifère (cuivre, cobalt)"],["Relief","Hauts plateaux du Katanga (plus de 1200 m)"],["Végétation","Savane herbeuse"],["Climat","Tropical avec une longue saison sèche (5 à 6 mois de pluie)"],["Paludisme","Saisonnier (pas toute l’année)"],["Densité","Forte autour de la ville (pôle minier)"]],criteres:["Ressources et relief justes.","Lien climat / végétation cohérent.","Lecture prudente du paludisme."]},{id:"f3c",niveau:3,type:"texte",consigne:"Compare Goma et Kisangani : relève trois différences et explique-les (cartes du milieu physique).",doc:{map:"rdc_milieu",props:{}},correction:{texte:["1. Altitude : Goma est à environ 1500 m, Kisangani à environ 400 m dans la cuvette centrale. Explication : Goma est dans les montagnes du Rift.","2. Climat et végétation : Goma a un climat des montagnes et une végétation de montagne ; Kisangani un climat équatorial (12 mois de pluie) et la forêt équatoriale. Explication : l’altitude rafraîchit Goma ; Kisangani est sur l’équateur, en plaine.","3. Paludisme : faible à Goma, toute l’année à Kisangani. Explication : le moustique a besoin de chaleur et d’humidité, que l’altitude réduit."],criteres:["Trois différences justes.","Chaque différence est expliquée (souvent par l’altitude).","J’ai utilisé le vocabulaire : cuvette, climat équatorial, climat des montagnes."]}}]},{id:"f4",titre:"Mettre deux cartes en relation",comp:"Appliquer",niveau:2,but:"Comparer la répartition de deux phénomènes pour trouver un lien (ressource et conflits, climat et végétation…).",methode:["Décris la répartition du phénomène 1 (où ? concentré ou dispersé ?).","Décris la répartition du phénomène 2.","Compare : les zones coïncident-elles ? Formule le lien avec un connecteur (« là où… on observe aussi… »).","Explique le lien et nuance si nécessaire."],resolu:{consigne:"Compare la carte des ressources (carte 1 / 3) et celle des violences en 2023 (carte 2). Quel lien observes-tu ?",etapes:[{t:"1. Répartition des ressources",d:"Les mines d’or, d’étain et de coltan se concentrent à l’est (Ituri, Nord-Kivu, Sud-Kivu, Maniema) ; le cuivre et le cobalt au sud-est (Katanga)."},{t:"2. Répartition des violences",d:"Les décès se concentrent nettement à l’est : Ituri, Nord-Kivu (Beni, Goma), Sud-Kivu ; il y a quelques foyers près de Kinshasa."},{t:"3. Comparaison",d:"Les zones de violence coïncident largement avec la région stannifère et les mines d’or de l’est."},{t:"4. Explication et nuance",d:"Les groupes armés se battent pour contrôler ces mines qui les financent ; la proximité des frontières facilite la contrebande. Nuance : le Katanga, très riche, connaît moins de violences ; d’autres causes jouent (conflits entre communautés, faiblesse de l’État)."}],reponse:"Là où se concentrent les mines d’or, d’étain et de coltan (est : Ituri, Kivu), on observe aussi la majorité des décès liés aux violences en 2023. Les groupes armés se disputent ces mines qui financent leurs activités, et les frontières proches facilitent la contrebande. Ce lien n’explique pas tout : le Katanga, très riche, est moins touché, et des tensions entre communautés existent aussi.",map:{scene:"rdc_conflits",props:{}}},items:[{id:"f4a",niveau:2,type:"texte",consigne:"Mets en relation la carte des climats et celle de la végétation de la RDC (cartes 6 et 7).",doc:{map:"rdc_milieu",props:{theme:"vegetation"}},correction:{texte:["Le climat équatorial (11-12 mois de pluie) du centre coïncide avec la forêt équatoriale.","Le climat tropical du sud (saison sèche) coïncide avec la savane boisée puis la savane herbeuse au Katanga, là où la saison sèche est la plus longue.","Le climat des montagnes de l’est correspond à la végétation de montagne.","Lien : la végétation dépend surtout des précipitations et de la température : moins il pleut, moins il y a d’arbres."],criteres:["Trois correspondances climat / végétation.","Un connecteur de mise en relation.","Le lien est expliqué (pluie, température)."]}},{id:"f4b",niveau:2,type:"texte",consigne:"Mets en relation la carte du paludisme (carte 8) et celle des climats et du relief. Explique pourquoi la transmission est faible à l’est.",doc:{map:"rdc_milieu",props:{theme:"sante"}},correction:{texte:["La transmission toute l’année se situe dans la cuvette centrale, basse, chaude et très humide (climat équatorial).","À l’est, dans les montagnes (Goma, Bukavu), la transmission est faible.","Explication : la température baisse avec l’altitude ; le moustique anophèle et le parasite se développent mal au frais. Ailleurs, la saison sèche réduit aussi la transmission."],criteres:["Répartition du paludisme décrite.","Comparaison avec relief / climat.","Explication par l’altitude (température)."]}},{id:"f4c",niveau:3,type:"texte",consigne:"Mets en relation la carte de la population belge (Carte 4) et celle du relief (Carte 13). Que constates-tu ?",doc:{map:"belgique_population",props:{names:!0}},correction:{texte:["Les fortes densités et la plupart des grandes aires urbaines (Anvers, Gand, Bruges, Bruxelles) se trouvent en Basse et Moyenne Belgique, au nord, sur des plaines et bas-plateaux.","Charleroi, Namur et Liège s’alignent dans le sillon Sambre-et-Meuse, une vallée (ancien bassin charbonnier).","La Haute Belgique (Ardenne, plus de 200 m) est peu peuplée.","Lien : un relief bas et plat facilite l’agriculture, l’industrie, les transports et la construction ; l’Ardenne cumule relief, forêts, sols pauvres et climat plus rude."],criteres:["Répartition de la population décrite.","Mise en relation avec le relief.","Cas du sillon Sambre-et-Meuse expliqué."]}}]},{id:"f5",titre:"Classer des atouts et des contraintes",comp:"Appliquer",niveau:2,but:"Organiser les éléments d’un territoire dans un tableau atouts / contraintes pour expliquer la répartition de la population ou d’une activité.",methode:["Un atout favorise l’installation ou l’activité ; une contrainte la gêne.","Classe chaque élément selon le point de vue demandé (pour la population ? pour l’exploitation minière ?).","Conclus : les atouts l’emportent-ils sur les contraintes ?"],resolu:{consigne:"Pourquoi la région du Kivu est-elle densément peuplée ? Classe les éléments en atouts et contraintes pour la population.",etapes:[{t:"1. Je liste les éléments du milieu",d:"Sols volcaniques, altitude, climat frais, lacs, volcans actifs, minerais, relief montagneux, conflits."},{t:"2. Je classe",d:"Atouts : sols volcaniques fertiles, climat d’altitude plus frais et plus sain (moins de paludisme), lacs (eau, pêche, transport), minerais (emplois). Contraintes : volcans actifs (Nyiragongo), relief accidenté, conflits armés, enclavement."},{t:"3. Je conclus",d:"Les atouts naturels (sols, climat) expliquent les fortes densités, malgré des contraintes importantes."}],reponse:"Atouts : sols volcaniques fertiles, climat d’altitude frais et sain, lacs, minerais. Contraintes : volcans actifs, relief accidenté, conflits armés, enclavement. Les atouts agricoles et sanitaires l’emportent : le Kivu est très peuplé malgré les risques."},items:[{id:"f5a",niveau:1,type:"tri",consigne:"Classe ces éléments en atouts ou contraintes pour le peuplement de la cuvette centrale congolaise.",cats:["Atout","Contrainte"],etiquettes:[["Fleuve Congo (transport, pêche)",0],["Forêt équatoriale très dense",1],["Paludisme toute l’année",1],["Pluies abondantes",0],["Zones marécageuses",1],["Chaleur et humidité permanentes",1],["Grande ressource en bois",0]],conclusion:"Les contraintes (forêt dense, marécages, paludisme) l’emportent : la cuvette centrale est faiblement peuplée, sauf le long du fleuve."},{id:"f5b",niveau:2,type:"tri",consigne:"Classe ces éléments en atouts ou contraintes pour le peuplement de l’Ardenne.",cats:["Atout","Contrainte"],etiquettes:[["Relief élevé (plus de 400 m)",1],["Forêts étendues (bois, tourisme)",0],["Climat plus froid et plus humide",1],["Sols pauvres",1],["Paysages pour le tourisme vert",0],["Éloignement des grandes villes",1],["Cours d’eau (Ourthe, Lesse, Semois)",0]],conclusion:"Les contraintes dominent : l’Ardenne est la région la moins peuplée de Belgique, mais ses atouts (forêt, tourisme) la font vivre."},{id:"f5c",niveau:3,type:"tri",consigne:"Pour l’exploitation du coltan au Kivu, classe ces éléments en atouts ou contraintes.",cats:["Atout","Contrainte"],etiquettes:[["60 à 80 % des réserves mondiales",0],["Forte demande de l’électronique",0],["Présence de groupes armés",1],["Routes en mauvais état, enclavement",1],["Main-d’œuvre nombreuse (creuseurs)",0],["Faiblesse de l’État",1],["Exigences de traçabilité des acheteurs",1]],conclusion:"Le Kivu possède des atouts considérables, mais l’insécurité et la faiblesse de l’État empêchent une exploitation légale qui profiterait à la population."}]},{id:"f6",titre:"Réaliser et critiquer un croquis",comp:"Appliquer",niveau:2,but:"Choisir des figurés adaptés, construire une légende conforme et vérifier les cinq informations d’une carte.",methode:["Point = lieu ; ligne = limite, trajet ; surface = espace.","Titre = sujet + lieu + date ; légende classée par thèmes ; orientation ; échelle (sauf croquis schématique) ; source.","Vérifie que chaque figuré de la carte est dans la légende, et inversement."],resolu:{consigne:"Activité 4 : choisis les figurés et le titre du croquis « minerais et conflits en RDC ».",etapes:[{t:"1. Je classe les éléments par implantation",d:"Points : Kinshasa, Lubumbashi, Mbuji-Mayi, Kisangani, Goma. Lignes : frontières, équateur. Surfaces : région stannifère, ceinture cuprifère, zones de violences, zone de paludisme."},{t:"2. Je choisis des figurés cohérents",d:"Capitale : carré rouge plus grand que les villes (points noirs). Ressources : couleurs claires (bleu, vert). Violences : rouge. Paludisme : hachures (pour pouvoir superposer)."},{t:"3. J’organise la légende par thèmes",d:"1. Repères (frontières, équateur, villes) ; 2. Ressources ; 3. Problèmes (violences, paludisme)."},{t:"4. Je rédige le titre et la source",d:"« Les minerais, sources de conflits en RDC (2023) » ; Source : « Cours de géographie EBC – S5 – 2026-27 »."}],reponse:"Utilise l’atelier ci-dessous pour construire le croquis étape par étape.",builder:!0},items:[{id:"f6a",niveau:1,type:"tri",consigne:"Associe chaque élément à son implantation.",cats:["Ponctuel (point)","Linéaire (ligne)","Zonal (surface)"],etiquettes:[["Kinshasa",0],["L’équateur",1],["La ceinture cuprifère",2],["La frontière avec le Rwanda",1],["La mine de Rubaya",0],["La zone de paludisme toute l’année",2],["Le fleuve Congo",1],["La région stannifère",2]],conclusion:"Retiens : la forme réelle de l’objet décide du figuré."},{id:"f6b",niveau:2,type:"texte",consigne:"Voici le croquis d’un élève. Titre : « La RDC ». Légende : un point noir = villes ; une surface bleue = minerais. Sur la carte, la capitale est un carré rouge, et des cercles rouges représentent les violences. Il n’y a ni nord ni source. Relève toutes les erreurs et propose une correction.",correction:{texte:["1. Titre incomplet : il manque le sujet et la date. Correction : « Les minerais, sources de conflits en RDC (2023) ».","2. Légende non conforme : le carré rouge (capitale) et les cercles rouges (violences) ne figurent pas dans la légende.","3. « Surface bleue = minerais » est trop vague : préciser « région stannifère (étain, coltan) » et ajouter la ceinture cuprifère.","4. La légende n’est pas organisée par thèmes.","5. Il manque l’orientation (N) et la source « Cours de géographie EBC – S5 – 2026-27 ». (L’échelle n’est pas obligatoire pour un croquis schématique.)"],criteres:["Titre corrigé (sujet + lieu + date).","Problème de légende non conforme relevé.","Orientation et source signalées."]}},{id:"f6c",niveau:3,type:"texte",consigne:"Propose une légende organisée en trois parties pour un croquis « La Belgique : population et territoires » (régions, frontière linguistique, 7 aires urbaines, sillon Sambre-et-Meuse, Ardenne peu peuplée).",correction:{texte:["1. Un État fédéral : trois surfaces de couleurs différentes pour les Régions flamande, wallonne et de Bruxelles-Capitale ; une ligne épaisse pour la frontière linguistique.","2. Une population concentrée : des cercles proportionnels (points) pour les 7 aires urbaines (Bruxelles, Anvers, Gand, Charleroi, Liège, Bruges, Namur) ; une bande (ligne épaisse) pour le sillon Sambre-et-Meuse.","3. Des espaces moins peuplés : des hachures (surface) pour l’Ardenne.","Titre : « La Belgique : un territoire fédéral à la population inégalement répartie (2025) »."],criteres:["Trois parties logiques.","Implantations correctes (surface, ligne, point).","Titre complet."]}}]},{id:"f7",titre:"Expliquer et argumenter",comp:"Appliquer / Transférer",niveau:3,but:"Rédiger un paragraphe argumenté (développement construit court) qui répond à une question, avec des arguments, des exemples et des liens logiques.",methode:["Introduction : reformule la question et situe le sujet (où ? quand ?).","Pour chaque argument : une idée + une explication + un exemple précis (lieu, chiffre, acteur).","Utilise des connecteurs : d’abord, de plus, en effet, car, donc, cependant, enfin.","Conclusion : réponds clairement à la question et nuance si possible."],resolu:{consigne:"En une quinzaine de lignes, explique pourquoi on peut parler de « malédiction des ressources » en RDC.",etapes:[{t:"1. Introduction",d:"La RDC, en Afrique centrale, possède un sous-sol exceptionnel (« scandale géologique »). Pourtant, sa population est parmi les plus pauvres du monde : c’est un paradoxe."},{t:"2. Argument 1 : des richesses immenses",d:"Elle détient 60 à 80 % des réserves mondiales de coltan (Kivu), une grande partie du cobalt et du cuivre (Katanga), de l’or et des diamants."},{t:"3. Argument 2 : des richesses qui ne profitent pas",d:"Plus de 70 % des Congolais vivent avec moins de 2 $ par jour, car les revenus échappent à l’État (contrebande, corruption, investisseurs étrangers)."},{t:"4. Argument 3 : des richesses qui alimentent la guerre",d:"À l’est, des milices comme le M23 (Rubaya) contrôlent des mines et financent leurs exactions ; le conflit a fait plus de 6 millions de morts."},{t:"5. Conclusion nuancée",d:"Les ressources ne sont pas une malédiction en soi : c’est la faiblesse de l’État, les convoitises des voisins et la demande mondiale qui transforment cette richesse en source de malheur. La traçabilité et la paix sont des pistes."}],reponse:"La RDC, en Afrique centrale, possède un sous-sol si riche qu’on parle de « scandale géologique ». Pourtant, on peut y parler de « malédiction des ressources ». D’abord, ses richesses sont immenses : le Kivu détient 60 à 80 % des réserves mondiales de coltan et le Katanga d’énormes gisements de cuivre et de cobalt. Cependant, cette manne ne profite pas à la population : plus de 70 % des Congolais vivent avec moins de 2 dollars par jour, car une grande partie des minerais sort en contrebande et les revenus sont détournés. De plus, ces richesses alimentent la guerre : à l’est, des milices comme le M23, qui contrôle la mine de Rubaya, financent leurs exactions grâce aux minerais ; ce conflit a fait plus de 6 millions de morts. En conclusion, ce n’est pas la ressource elle-même qui est maudite, mais la faiblesse de l’État et les convoitises qu’elle suscite ; la traçabilité et la paix pourraient changer la situation."},items:[{id:"f7a",niveau:2,type:"texte",consigne:"Explique en une dizaine de lignes pourquoi l’est de la RDC est une zone de conflits.",correction:{texte:["Plan attendu : 1. Des ressources convoitées (région stannifère : coltan, étain ; or de l’Ituri). 2. Des acteurs nombreux : groupes armés (M23, ADF, CODECO, FDLR), pays voisins mis en cause (Rwanda, Ouganda, Burundi), entreprises. 3. Des facteurs aggravants : faiblesse de l’État, frontières proches qui facilitent la contrebande, tensions entre communautés (Hema / Lendu), héritage du génocide rwandais de 1994 (FDLR). 4. Conclusion : un cercle vicieux minerais → argent → armes → violences."],criteres:["Au moins deux causes distinctes.","Exemples précis (groupe, lieu, minerai).","Connecteurs logiques et conclusion."]}},{id:"f7b",niveau:3,type:"texte",consigne:"« Mon smartphone est lié à la guerre au Kivu. » Explique cette affirmation en utilisant la notion de mondialisation.",correction:{texte:["Le smartphone contient des condensateurs au tantale, métal tiré du coltan, dont 60 à 80 % des réserves mondiales sont au Kivu.","Une chaîne d’approvisionnement mondiale relie la mine artisanale du Kivu aux négociants (souvent via le Rwanda), aux fonderies d’Asie, aux fabricants de composants et aux marques, puis aux consommateurs européens : c’est un flux de la mondialisation.","Or certaines mines sont contrôlées par des groupes armés qui en tirent de l’argent (ex. : le M23 à Rubaya). Sans traçabilité, l’achat d’un smartphone peut indirectement financer la guerre.","Nuance : des lois (Dodd-Frank aux États-Unis, règlement européen depuis 2021) obligent les entreprises à vérifier l’origine de leurs minerais ; certaines publient leur chaîne d’approvisionnement."],criteres:["Lien tantale / coltan / smartphone.","Notion de mondialisation et de flux expliquée.","Lien avec le financement des groupes armés.","Nuance (traçabilité, lois)."]}},{id:"f7c",niveau:3,type:"texte",consigne:"Faut-il arrêter d’acheter des minerais venant de l’est de la RDC ? Donne un argument pour, un argument contre, puis ton avis nuancé.",correction:{texte:["Pour : un boycott couperait une source de financement des groupes armés qui contrôlent des mines et commettent des exactions (ex. : Rubaya et le M23).","Contre : des milliers de creuseurs et leurs familles vivent de ces mines ; un boycott total les priverait de revenus et pourrait pousser le commerce encore plus vers la contrebande.","Avis nuancé possible : plutôt qu’un boycott, il faut exiger la traçabilité (mines certifiées « sans conflit »), soutenir l’État congolais dans le contrôle de ses mines et faire respecter les lois américaines et européennes."],criteres:["Un argument pour, expliqué.","Un argument contre, expliqué.","Un avis personnel argumenté et nuancé."]}},{id:"f7d",niveau:2,type:"texte",consigne:"Explique la répartition de la population mondiale à l’aide des notions d’atouts et de contraintes (au moins deux exemples de chaque).",correction:{texte:["Les hommes se concentrent là où les atouts sont nombreux : plaines et deltas fertiles avec de l’eau (Asie de l’Est et du Sud : vallées du Gange, du Yangzi), climats tempérés et peuplement ancien (Europe), régions industrielles et urbaines (Nord-Est des États-Unis).","Les espaces vides correspondent à de fortes contraintes : froid (Grand Nord, Antarctique), aridité (Sahara, Gobi, Australie), altitude (Himalaya, Andes), forêt dense (Amazonie, bassin du Congo).","Nuance : l’histoire et le développement comptent aussi ; certains milieux difficiles sont peuplés (hauts plateaux d’Afrique de l’Est)."],criteres:["Deux foyers expliqués par des atouts.","Deux espaces vides expliqués par des contraintes.","Vocabulaire précis."]}}]},{id:"f8",titre:"Transférer à une situation nouvelle",comp:"Transférer",niveau:3,but:"Réutiliser les notions et la méthode du cours (ressource, acteurs, flux, atouts / contraintes, fonctions) sur un cas que tu n’as pas étudié en classe.",methode:["Repère les notions du cours qui s’appliquent au nouveau cas.","Extrais les informations des documents (lieu, chiffres, acteurs).","Compare avec le cas du cours : points communs et différences.","Conclus en répondant à la question posée."],resolu:{consigne:"Le cobalt du Katanga : en quoi ce cas ressemble-t-il à celui du coltan du Kivu ? En quoi est-il différent ?",docs:[{lab:"Document 1 · Le cobalt congolais",t:"La RDC fournit environ 70 % du cobalt extrait dans le monde, surtout autour de Kolwezi, dans la ceinture cuprifère du Katanga. Le cobalt est indispensable aux batteries des smartphones et des voitures électriques. Une grande partie de ce cobalt est raffinée en Chine.",src:"Document adapté pour l’exercice."},{lab:"Document 2 · Des creuseurs artisanaux",t:"À côté des grandes mines industrielles, des creuseurs artisanaux, parmi lesquels des enfants, extraient le cobalt à la main, dans des tunnels dangereux. L’ONG Amnesty International a dénoncé cette situation en 2016.",src:"Document adapté pour l’exercice."}],etapes:[{t:"1. Les notions du cours qui s’appliquent",d:"Ressource stratégique, mondialisation (flux), acteurs, conditions de travail des creuseurs, traçabilité."},{t:"2. Points communs",d:"Une ressource rare, concentrée en RDC, indispensable aux technologies (batteries / condensateurs) ; un flux mondial vers l’Asie puis les consommateurs ; des creuseurs artisanaux, parfois des enfants ; une population qui profite peu de la richesse."},{t:"3. Différences",d:"Le cobalt est exploité surtout par de grandes mines industrielles au Katanga, région moins touchée par la guerre que le Kivu ; le problème principal est moins le financement de milices que les conditions de travail et le partage des revenus."},{t:"4. Conclusion",d:"Le cobalt illustre lui aussi la malédiction des ressources et la mondialisation, mais sous une autre forme : l’exploitation des travailleurs plus que la guerre."}],reponse:"Comme le coltan du Kivu, le cobalt du Katanga est une ressource stratégique concentrée en RDC (environ 70 % de la production mondiale), indispensable aux technologies (batteries) et exportée vers l’Asie dans un flux mondialisé ; des creuseurs artisanaux, parfois des enfants, l’extraient dans des conditions dangereuses. Mais contrairement au coltan, il est surtout produit par de grandes mines industrielles dans une région moins touchée par la guerre : le problème principal est l’exploitation des travailleurs et le partage des revenus, plus que le financement de groupes armés."},items:[{id:"f8a",niveau:3,type:"texte",consigne:"Bruxelles, une capitale aux multiples fonctions. En t’inspirant de la carte de Paris (Carte 14), classe les éléments suivants par fonction puis explique pourquoi Bruxelles est une métropole européenne : le Parlement fédéral, la Commission européenne, le siège de l’OTAN, le quartier d’affaires du Nord (sièges d’entreprises et de banques), la gare du Midi (TGV, Eurostar), l’aéroport de Zaventem, le musée Magritte, l’Atomium, le Palais royal, le Parlement européen.",correction:{texte:["Fonctions politiques nationales : le Parlement fédéral, le Palais royal.","Fonctions politiques internationales : la Commission européenne, le Parlement européen (quartier européen), le siège de l’OTAN.","Fonction économique : le quartier d’affaires du Nord (sièges d’entreprises et de banques).","Fonctions culturelles et touristiques : le musée Magritte, l’Atomium.","Fonction de transport : la gare du Midi (TGV, Eurostar), l’aéroport de Zaventem.","Conclusion : comme Paris, Bruxelles concentre des fonctions de commandement ; en accueillant les principales institutions de l’UE et l’OTAN, elle rayonne bien au-delà de la Belgique : c’est une métropole européenne."],criteres:["Classement correct par fonction.","Distinction national / international.","Conclusion sur le rayonnement européen."]}},{id:"f8b",niveau:3,type:"texte",consigne:"Kisangani est située à environ 0° 31′ N, à environ 400 m d’altitude, sur le fleuve Congo. Sans regarder les cartes, déduis son climat, sa végétation et le risque de paludisme. Justifie chaque déduction.",correction:{texte:["Climat : sur l’équateur et à basse altitude, il fait chaud toute l’année et il pleut presque tous les mois : climat équatorial.","Végétation : un climat chaud et humide toute l’année favorise la forêt tropicale humide (équatoriale), dense et toujours verte.","Paludisme : chaleur et humidité permanentes favorisent le moustique : transmission toute l’année.","Vérification : les cartes 6, 7 et 8 confirment ces déductions."],criteres:["Climat équatorial justifié par la latitude et l’altitude.","Forêt équatoriale justifiée par le climat.","Paludisme toute l’année justifié."]}},{id:"f8c",niveau:3,type:"texte",consigne:"L’or de l’Ituri. Document : « La province de l’Ituri, au nord-est de la RDC, possède d’importantes mines d’or (région de Kilo-Moto, Mongbwalu). Des groupes armés comme la CODECO et les ADF y sont actifs. Selon les experts de l’ONU, une partie de l’or quitte la RDC en contrebande par les pays voisins. » (document adapté pour l’exercice). Montre que ce cas confirme les mécanismes étudiés avec le coltan.",correction:{texte:["Une ressource convoitée : l’or, minerai des conflits (avec les 3T).","Des acteurs armés : CODECO et ADF, actifs dans une région où l’État est faible.","Un mécanisme de contrebande vers les pays voisins, qui prive l’État de revenus.","La carte des violences de 2023 montre une forte concentration de décès en Ituri.","Conclusion : comme pour le coltan, la richesse minérale, la faiblesse de l’État et la proximité des frontières alimentent les conflits : c’est la même logique de malédiction des ressources."],criteres:["Ressource, acteurs, contrebande identifiés.","Lien avec la carte des violences.","Comparaison explicite avec le coltan."]}}]}];var x=H(e1(),1),k6={1:["lv1","Niveau 1 · restituer"],2:["lv2","Niveau 2 · appliquer"],3:["lv3","Niveau 3 · argumenter, transférer"]};function Ws({d:e}){return e?e.map?(0,x.jsx)(k1,{id:e.map,mode:"explore",names:e.props&&e.props.names,theme:e.props&&e.props.theme,height:"50vh"}):(0,x.jsxs)("div",{className:"doc",children:[e.lab&&(0,x.jsx)("span",{className:"dlab",children:e.lab}),(0,x.jsx)(F,{children:e.t}),e.src&&(0,x.jsx)("span",{className:"src",children:
