/* Thème sobre inspiré de KDE Breeze (clair) et Breeze Dark */
:root {
  --scale: 1;
  --win: #eff0f1; --view: #fcfcfc; --alt: #f5f6f7; --btn: #fcfcfc; --btn-hover: #e3f2fb;
  --text: #232629; --muted: #5d6873; --border: #bdc3c7; --border-soft: #dcdfe2;
  --accent: #3daee9; --accent-strong: #1d6fa5; --accent-bg: #e3f2fb; --focus: #3daee9;
  --pos: #27ae60; --pos-strong: #1e7e46; --pos-bg: #e5f5ec; --neg: #da4453; --neg-strong: #b3303f; --neg-bg: #fbe9eb; --warn: #f67400; --warn-bg: #fff1e3;
  --hl-phrase: rgba(61, 174, 233, .20); --hl-mot: rgba(246, 116, 0, .38);
  --shadow: 0 1px 2px rgba(0, 0, 0, .08); --radius: 4px;
  /* cartes */
  --sea: #d4e9f5; --land: #f4f1ea; --land-line: #b9b3a6; --neigh: #e6e3dc; --river: #2f8fd0; --lake: #9ccbe8;
  --c1: #2980b9; --c2: #27ae60; --c3: #e67e22; --c4: #8e44ad; --c5: #c0392b; --c6: #16a085; --c7: #d4ac0d; --c8: #7f8c8d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b; --btn-hover: #2c4659;
    --text: #fcfcfc; --muted: #a1a9b1; --border: #4d545b; --border-soft: #3b4045;
    --accent: #3daee9; --accent-strong: #5cbcef; --accent-bg: #1f3a4d;
    --pos: #2ecc71; --pos-strong: #5ee08f; --pos-bg: #1b3326; --neg: #ed5565; --neg-strong: #f2808c; --neg-bg: #3c2226; --warn: #fdbc4b; --warn-bg: #3d3020;
    --hl-phrase: rgba(61, 174, 233, .28); --hl-mot: rgba(253, 188, 75, .45);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --sea: #1f3442; --land: #3a3f44; --land-line: #6b7178; --neigh: #2f3337; --river: #5cbcef; --lake: #2e5a75;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b; --btn-hover: #2c4659;
  --text: #fcfcfc; --muted: #a1a9b1; --border: #4d545b; --border-soft: #3b4045;
  --accent: #3daee9; --accent-strong: #5cbcef; --accent-bg: #1f3a4d;
  --pos: #2ecc71; --pos-strong: #5ee08f; --pos-bg: #1b3326; --neg: #ed5565; --neg-strong: #f2808c; --neg-bg: #3c2226; --warn: #fdbc4b; --warn-bg: #3d3020;
  --hl-phrase: rgba(61, 174, 233, .28); --hl-mot: rgba(253, 188, 75, .45);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --sea: #1f3442; --land: #3a3f44; --land-line: #6b7178; --neigh: #2f3337; --river: #5cbcef; --lake: #2e5a75;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); }
body { margin: 0; background: var(--win); color: var(--text); font: 1rem/1.6 "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-strong); }
h1, h2, h3, h4 { line-height: 1.3; margin: 0; font-weight: 600; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- coque ---------- */
.app { display: grid; grid-template-columns: 15.5rem 1fr; min-height: 100vh; }
.side { background: var(--view); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
.brand { padding: 1rem 1rem .75rem; border-bottom: 1px solid var(--border-soft); }
.brand strong { display: block; font-size: 1rem; }
.brand span { font-size: .8rem; color: var(--muted); }
.nav { list-style: none; margin: 0; padding: .4rem; display: flex; flex-direction: column; gap: 2px; }
.nav button { width: 100%; display: flex; align-items: center; gap: .6rem; padding: .5rem .65rem; border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer; text-align: left; font-size: .95rem; }
.nav button:hover { background: var(--btn-hover); }
.nav button[aria-current="page"] { background: var(--accent-bg); border-color: var(--accent); color: var(--text); font-weight: 600; }
.nav svg { width: 1.15rem; height: 1.15rem; flex: none; color: var(--accent-strong); }
.nav .count { margin-left: auto; font-size: .75rem; background: var(--accent); color: #fff; border-radius: 1rem; padding: 0 .45rem; font-weight: 600; }
.side-foot { margin-top: auto; padding: .75rem 1rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border-soft); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--win); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .5rem; padding: .45rem 1rem; flex-wrap: wrap; }
.topbar .title { font-weight: 600; margin-right: auto; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.btn.menu-btn { display: none; }
.content { padding: 1.25rem 1.25rem 4rem; max-width: 64rem; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.content.wide { max-width: 80rem; }

/* ---------- composants Breeze ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .38rem .8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); cursor: pointer; box-shadow: var(--shadow); font-size: .92rem; line-height: 1.35; min-height: 2.1rem; }
.btn:hover { border-color: var(--accent); background: var(--btn-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #2f9fd8; }
.btn.small { padding: .2rem .55rem; font-size: .85rem; min-height: 1.8rem; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn.ghost:hover { border-color: var(--border); }
.btn svg { width: 1rem; height: 1rem; }
.btn.on { background: var(--accent-bg); border-color: var(--accent); }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; }

.card { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .65rem; }
.card.flat { box-shadow: none; }
.card h2 + p, .card h3 + p { color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .87rem; }
.tag { display: inline-block; font-size: .75rem; padding: .05rem .5rem; border-radius: 1rem; border: 1px solid var(--border); color: var(--muted); background: var(--alt); white-space: nowrap; }
.tag.acc { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-bg); }
.tag.ok { border-color: var(--pos); color: var(--pos-strong); background: var(--pos-bg); }
.tag.ko { border-color: var(--neg); color: var(--neg-strong); background: var(--neg-bg); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid transparent; border-bottom: none; padding: .45rem .85rem; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; margin-bottom: -1px; font-size: .92rem; color: var(--muted); }
.tabs button:hover { color: var(--text); background: var(--btn-hover); }
.tabs button[aria-selected="true"] { background: var(--view); border-color: var(--border); color: var(--text); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }

.box { border-left: 3px solid var(--accent); background: var(--accent-bg); padding: .65rem .85rem; border-radius: 0 var(--radius) var(--radius) 0; display: flex; flex-direction: column; gap: .35rem; }
.box.retenir { border-color: var(--pos); background: var(--pos-bg); }
.box.attention { border-color: var(--warn); background: var(--warn-bg); }
.box.methode { border-color: #8e44ad; background: rgba(142, 68, 173, .09); }
.box .lab { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
ul.clean { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .25rem; }
ol.clean { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: .25rem; }

input[type="text"], input[type="search"], select, textarea { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .38rem .6rem; min-height: 2.1rem; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
textarea { width: 100%; min-height: 7rem; resize: vertical; line-height: 1.5; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
label.chk { display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; }
label.chk input { margin-top: .3rem; accent-color: var(--accent); }

table.tbl { border-collapse: collapse; width: 100%; background: var(--view); font-size: .93rem; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: .4rem .55rem; text-align: left; vertical-align: top; }
.tbl th { background: var(--alt); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }

.progress { height: .45rem; background: var(--border-soft); border-radius: 1rem; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 1rem; transition: width .3s; }

/* ---------- lecture à voix haute ---------- */
.s { border-radius: 3px; transition: background .15s; }
.s.reading { background: var(--hl-phrase); }
.w.reading { background: var(--hl-mot); border-radius: 2px; }
.clickread .w { cursor: pointer; }
.clickread .w:hover { text-decoration: underline dotted; }
.tts { display: flex; gap: .3rem; align-items: center; }
.tts .state { font-size: .8rem; color: var(--muted); }

/* terme du glossaire dans le texte */
.term { background: none; border: none; padding: 0; color: var(--accent-strong); border-bottom: 1px dashed var(--accent); cursor: help; font: inherit; }
.pop { position: fixed; z-index: 60; max-width: 22rem; background: var(--view); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0, 0, 0, .18); padding: .7rem .85rem; display: flex; flex-direction: column; gap: .4rem; font-size: .92rem; }
.pop .ex { color: var(--muted); font-style: italic; }

/* ---------- cours ---------- */
.lesson-nav { display: flex; gap: .5rem; flex-wrap: wrap; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.1rem; align-items: start; }
.lesson.textonly { grid-template-columns: 1fr; }
.lesson .text { display: flex; flex-direction: column; gap: .7rem; }
.lesson .visual { position: sticky; top: 3.6rem; display: flex; flex-direction: column; gap: .5rem; }
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--border-soft); }
.steps span.done { background: var(--accent); }
.toc { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .6rem; }
.toc button { text-align: left; background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .75rem; cursor: pointer; display: flex; flex-direction: column; gap: .15rem; }
.toc button:hover { border-color: var(--accent); background: var(--btn-hover); }
.toc button b { font-weight: 600; }
.toc button span { font-size: .82rem; color: var(--muted); }
.toc button.seen { border-left: 3px solid var(--pos); }

/* ---------- cartes ---------- */
.mapbox { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }
.mapbox svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.mapcap { font-size: .78rem; color: var(--muted); padding: .3rem .6rem; border-top: 1px solid var(--border-soft); background: var(--alt); }
.maptip { position: absolute; pointer-events: none; background: var(--view); border: 1px solid var(--border); border-radius: 3px; padding: .15rem .45rem; font-size: .82rem; box-shadow: var(--shadow); white-space: nowrap; z-index: 5; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .82rem; padding: .45rem .6rem; border-top: 1px solid var(--border-soft); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { width: .95rem; height: .75rem; border-radius: 2px; display: inline-block; border: 1px solid rgba(0, 0, 0, .25); }
.legend i.ln { height: 3px; border: none; }
.legend i.pt { width: .65rem; height: .65rem; border-radius: 50%; }
svg .sea { fill: var(--sea); }
svg .land { fill: var(--land); stroke: var(--land-line); stroke-width: .5; }
svg .neigh { fill: var(--neigh); stroke: var(--land-line); stroke-width: .6; }
svg .border { fill: none; stroke: var(--land-line); stroke-width: .45; stroke-linejoin: round; }
svg .grat { fill: none; stroke: var(--land-line); stroke-width: .3; stroke-dasharray: 2 3; opacity: .7; }
svg .river { fill: none; stroke: var(--river); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
svg .lake { fill: var(--lake); stroke: var(--river); stroke-width: .5; }
svg .land, svg .neigh, svg .border, svg .grat, svg .river, svg .lake, svg .sea { vector-effect: non-scaling-stroke; }
svg text { font-family: "Noto Sans", system-ui, sans-serif; paint-order: stroke; stroke: var(--view); stroke-width: 3px; stroke-linejoin: round; fill: var(--text); }
svg text.sea { fill: var(--accent-strong); font-style: italic; stroke: var(--sea); }
svg text.country { fill: var(--muted); letter-spacing: .08em; font-weight: 600; }
svg .it { cursor: pointer; transition: opacity .15s; }
svg .it:hover { filter: brightness(1.08); }
svg .it.dim { opacity: .28; }
svg .it.sel { stroke: var(--text) !important; stroke-width: 2.2; }
svg .it.good { stroke: var(--pos) !important; stroke-width: 3; }
svg .it.bad { stroke: var(--neg) !important; stroke-width: 3; }
svg .flash { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { opacity: .25; } }
svg .hit { stroke: transparent; fill: none; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
svg .hitpt { fill: transparent; cursor: pointer; }

.maptask { display: flex; flex-direction: column; gap: .5rem; }
.prompt { font-size: 1.05rem; font-weight: 600; padding: .55rem .75rem; background: var(--accent-bg); border: 1px solid var(--accent); border-radius: var(--radius); display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.feedback { padding: .5rem .75rem; border-radius: var(--radius); border: 1px solid; }
.feedback.ok { border-color: var(--pos); background: var(--pos-bg); }
.feedback.ko { border-color: var(--neg); background: var(--neg-bg); }
.feedback.info { border-color: var(--border); background: var(--alt); }

/* ---------- QCM ---------- */
.opts { display: flex; flex-direction: column; gap: .4rem; }
.opt { text-align: left; padding: .55rem .75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); cursor: pointer; display: flex; gap: .6rem; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--btn-hover); }
.opt .k { flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.opt.good { border-color: var(--pos); background: var(--pos-bg); }
.opt.bad { border-color: var(--neg); background: var(--neg-bg); }
.opt:disabled { cursor: default; }

/* ---------- cartes mémoire ---------- */
.flash-card { min-height: 15rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: .9rem; padding: 1.5rem; background: var(--view); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); }
.flash-card .front { font-size: 1.3rem; font-weight: 600; }
.flash-card .back { font-size: 1.02rem; border-top: 1px solid var(--border-soft); padding-top: .9rem; width: 100%; display: flex; flex-direction: column; gap: .45rem; align-items: center; }
.flash-card .back .ex { color: var(--muted); font-style: italic; font-size: .93rem; }
.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
.grade .btn { flex-direction: column; gap: 0; }
.grade .btn small { font-size: .72rem; color: var(--muted); font-weight: 400; }
.grade .again { border-color: var(--neg); } .grade .hard { border-color: var(--warn); } .grade .good { border-color: var(--pos); } .grade .easy { border-color: var(--accent); }
.stat { display: flex; flex-direction: column; align-items: center; padding: .5rem; background: var(--alt); border-radius: var(--radius); border: 1px solid var(--border-soft); }
.stat b { font-size: 1.35rem; }
.stat span { font-size: .78rem; color: var(--muted); text-align: center; }

/* ---------- glossaire ---------- */
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: .6rem; }
.gitem { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .65rem .8rem; display: flex; flex-direction: column; gap: .3rem; }
.gitem h3 { font-size: 1rem; color: var(--accent-strong); display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.gitem .ex { color: var(--muted); font-size: .9rem; }
.gitem .ex b { font-weight: 600; color: var(--text); }
.alpha { display: flex; flex-wrap: wrap; gap: 2px; }
.alpha button { min-width: 1.8rem; padding: .1rem .3rem; border: 1px solid var(--border-soft); background: var(--view); border-radius: 3px; cursor: pointer; font-size: .82rem; }
.alpha button:hover { border-color: var(--accent); }

/* ---------- exercices ---------- */
.fam { border: 1px solid var(--border); border-radius: var(--radius); background: var(--view); overflow: hidden; }
.fam > header { padding: .75rem 1rem; display: flex; gap: .75rem; align-items: center; justify-content: space-between; background: var(--alt); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.fam > header h3 { font-size: 1.02rem; }
.fam .body { padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
.level { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.lv1 { color: var(--pos-strong); } .lv2 { color: var(--accent-strong); } .lv3 { color: #b05f00; }
:root[data-theme="dark"] .lv3 { color: var(--warn); }
.ex-item { border: 1px solid var(--border-soft); border-radius: var(--radius); padding: .8rem .9rem; display: flex; flex-direction: column; gap: .6rem; }
.ex-item.solved { border-color: #8e44ad; background: rgba(142, 68, 173, .05); }
.correction { border: 1px solid var(--pos); background: var(--pos-bg); border-radius: var(--radius); padding: .7rem .85rem; display: flex; flex-direction: column; gap: .45rem; }
.correction h4 { color: var(--pos-strong); }
.critere { display: flex; flex-direction: column; gap: .3rem; }
.doc { border: 1px solid var(--border); background: var(--alt); border-radius: var(--radius); padding: .6rem .8rem; font-size: .93rem; display: flex; flex-direction: column; gap: .3rem; }
.doc .src { font-size: .78rem; color: var(--muted); }
.doc .dlab { font-weight: 700; font-size: .8rem; color: var(--accent-strong); }
.blank { display: inline-block; min-width: 5rem; border-bottom: 1px solid var(--muted); }

/* évaluations */
.eval-sheet { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
.eval-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: .6rem; }
.q { display: flex; flex-direction: column; gap: .5rem; padding-bottom: .9rem; border-bottom: 1px dashed var(--border); }
.q:last-child { border-bottom: none; }
.q .qh { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; }
.q .pts { font-weight: 600; white-space: nowrap; color: var(--muted); font-size: .9rem; }
.lines { display: flex; flex-direction: column; gap: 1.3rem; padding: .4rem 0; }
.lines span { border-bottom: 1px dotted var(--muted); height: 1px; }

/* diagrammes */
.diagram { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { stroke: none; }

/* réglages */
.dialog-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 50; display: flex; justify-content: flex-end; }
.dialog { width: min(27rem, 100%); background: var(--win); height: 100%; overflow: auto; border-left: 1px solid var(--border); padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
.field { display: flex; flex-direction: column; gap: .3rem; }
.field > span { font-size: .88rem; font-weight: 600; }
.field small { color: var(--muted); }

/* ---------- mobile ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; z-index: 40; width: 16rem; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0, 0, 0, .2); }
  .side.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .lesson { grid-template-columns: 1fr; }
  .lesson .visual { position: static; }
  .content { padding: .9rem .75rem 4rem; }
  .grade { grid-template-columns: repeat(2, 1fr); }
  .topbar .tts .label { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- impression ---------- */
@media print {
  .side, .topbar, .noprint, .btn, .tabs { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
  .content { max-width: none; padding: 0; }
  .eval-sheet { border: none; padding: 0; }
  .correction { break-inside: avoid; }
  .q { break-inside: avoid; }
}
.printlines { display: none !important; }
@media print { .printlines { display: flex !important; } textarea { display: none !important; } }

s l’action du milieu qui l’entoure (air, eau, sel…).",ex:"La rouille est une corrosion du fer ; le tantale, lui, ne rouille presque pas."},{id:"condensateur",terme:"Condensateur",theme:"coltan",def:"Petit composant électronique qui accumule de l’énergie électrique puis la restitue.",ex:"Un smartphone contient des dizaines de condensateurs au tantale."},{id:"ressource",terme:"Ressource naturelle",theme:"coltan",alias:["ressource","ressources","ressources naturelles"],def:"Élément de la nature (eau, sol, minerai, forêt, énergie…) que les sociétés humaines utilisent pour vivre et produire.",ex:"Le coltan, le cuivre, l’eau du fleuve Congo et la forêt sont des ressources de la RDC."},{id:"renouvelable",terme:"Ressource renouvelable / non renouvelable",theme:"coltan",alias:["non renouvelable","renouvelable"],def:"Une ressource renouvelable se reconstitue rapidement (soleil, vent, forêt bien gérée). Une ressource non renouvelable existe en quantité limitée et s’épuise (minerais, pétrole).",ex:"Le coltan est une ressource non renouvelable : une mine finit par s’épuiser."},{id:"matiere_premiere",terme:"Matière première",theme:"coltan",alias:["matières premières"],def:"Ressource brute, pas encore transformée, utilisée par l’industrie pour fabriquer des produits.",ex:"Le coltan est une matière première ; le condensateur est un produit fabriqué."},{id:"reserves",terme:"Réserves (minières)",theme:"coltan",alias:["réserves","réserve"],def:"Quantité d’un minerai connue dans le sous-sol et que l’on peut exploiter.",ex:"Le Kivu posséderait entre 60 et 80 % des réserves mondiales de coltan."},{id:"gisement",terme:"Gisement",theme:"coltan",alias:["gisements"],def:"Endroit du sous-sol où un minerai est concentré en grande quantité.",ex:"Rubaya, au Nord-Kivu, est un important gisement de coltan."},{id:"sous_sol",terme:"Sous-sol",theme:"coltan",def:"Partie du terrain située sous la surface, où se trouvent les roches, les minerais et les nappes d’eau.",ex:"Le sous-sol de la RDC est l’un des plus riches du monde."},{id:"strategique",terme:"Minerai stratégique (critique)",theme:"coltan",alias:["minerai stratégique","minerais stratégiques","minerai critique"],def:"Minerai indispensable à des industries importantes (électronique, énergie, défense) et dont l’approvisionnement peut être menacé.",ex:"Le coltan et le cobalt sont des minerais stratégiques pour le numérique et les batteries."},{id:"stannifere",terme:"Stannifère",theme:"coltan",alias:["région stannifère"],def:"Riche en étain. Une région stannifère contient des minerais d’étain (cassitérite) et souvent du coltan.",ex:"L’Est de la RDC (Kivu, Maniema) forme une région stannifère."},{id:"cuprifere",terme:"Cuprifère",theme:"coltan",alias:["ceinture cuprifère"],def:"Riche en cuivre. La ceinture cuprifère est une bande de gisements de cuivre et de cobalt.",ex:"La ceinture cuprifère passe par Kolwezi, Likasi et Lubumbashi, au Katanga."},{id:"cassiterite",terme:"Cassitérite",theme:"coltan",def:"Minerai dont on tire l’étain.",ex:"On exploite la cassitérite à Bisie, près de Walikale (Nord-Kivu)."},{id:"cobalt",terme:"Cobalt",theme:"coltan",def:"Métal extrait avec le cuivre au Katanga. Il est indispensable aux batteries des téléphones et des voitures électriques.",ex:"La RDC produit environ 70 % du cobalt mondial."},{id:"trois_t",terme:"3T (minerais des conflits)",theme:"coltan",alias:["3T","minerais des conflits","minerai des conflits"],def:"Les trois minerais « T » : étain (tin), tantale et tungstène. Avec l’or, on les appelle « minerais des conflits » car leur commerce peut financer des groupes armés.",ex:"Les lois européennes et américaines imposent de vérifier l’origine des 3T et de l’or."},{id:"minerais_sang",terme:"Minerais de sang",theme:"coltan",alias:["minerai de sang","minerais du sang"],def:"Expression pour désigner des minerais dont l’extraction et la vente financent des groupes armés et des violences.",ex:"Apple a été accusé en 2024 d’utiliser des « minerais de sang » venant de l’Est de la RDC."},{id:"malediction",terme:"Malédiction des ressources",theme:"coltan",alias:["malédiction"],def:"Paradoxe d’un pays très riche en ressources mais dont la population reste pauvre, souvent à cause de la corruption, du pillage et des conflits pour contrôler ces richesses.",ex:"Plus de 70 % des Congolais vivent avec moins de 2 dollars par jour, alors que leur sous-sol est l’un des plus riches du monde."},{id:"scandale_geologique",terme:"Scandale géologique",theme:"coltan",def:"Expression utilisée pour la RDC : son sous-sol contient une quantité et une variété exceptionnelles de minerais.",ex:"Cuivre, cobalt, coltan, or, diamants, étain : c’est le « scandale géologique » congolais."},{id:"contrebande",terme:"Contrebande",theme:"coltan",def:"Commerce illégal de marchandises qui passent une frontière en cachette, sans payer de taxes ni respecter la loi.",ex:"Du coltan extrait au Kivu passe en contrebande par le Rwanda."},{id:"milice",terme:"Milice",theme:"coltan",alias:["milices"],def:"Groupe armé qui n’appartient pas à l’armée officielle d’un État.",ex:"La CODECO est une milice active en Ituri."},{id:"groupe_arme",terme:"Groupe armé (rebelle)",theme:"coltan",alias:["groupe armé","groupes armés","rebelles","rebelle"],def:"Organisation qui utilise les armes pour défendre ses intérêts, contrôler un territoire ou combattre le gouvernement.",ex:"Le M23 est un groupe armé rebelle soutenu par le Rwanda selon les experts de l’ONU."},{id:"racket",terme:"Racket",theme:"coltan",def:"Argent ou biens obtenus par la menace ou la force.",ex:"Des milices imposent des « taxes » aux creuseurs et aux transporteurs de minerais."},{id:"exaction",terme:"Exaction",theme:"coltan",alias:["exactions"],def:"Acte de violence ou de pillage commis contre la population.",ex:"Les revenus des mines permettent au M23 de financer ses exactions."},{id:"onu",terme:"ONU",theme:"coltan",alias:["Conseil de sécurité"],def:"Organisation des Nations unies : organisation internationale qui regroupe presque tous les États du monde pour maintenir la paix. Son Conseil de sécurité décide des actions pour la paix.",ex:"Un rapport d’experts présenté en 2015 au Conseil de sécurité de l’ONU dénonce le trafic de coltan."},{id:"multinationale",terme:"Multinationale",theme:"coltan",alias:["multinationales","firme multinationale"],def:"Grande entreprise qui possède des filiales et des usines dans plusieurs pays.",ex:"Apple, Microsoft ou Intel sont des multinationales qui achètent des composants contenant du tantale."},{id:"chaine_appro",terme:"Chaîne d’approvisionnement",theme:"coltan",alias:["chaine d'approvisionnement"],def:"Toutes les étapes que suit une matière première, de la mine jusqu’au produit vendu au consommateur.",ex:"Mine du Kivu → négociant → fonderie en Asie → fabricant de composants → smartphone vendu en Europe."},{id:"tracabilite",terme:"Traçabilité",theme:"coltan",def:"Possibilité de suivre l’origine et le parcours d’un produit à chaque étape.",ex:"Grâce à la traçabilité, une entreprise peut prouver que son tantale ne vient pas d’une mine contrôlée par une milice."},{id:"creuseur",terme:"Creuseur (exploitation artisanale)",theme:"coltan",alias:["creuseurs","exploitation artisanale","mine artisanale"],def:"Mineur qui extrait le minerai à la main, avec des outils simples, souvent dans des conditions dangereuses.",ex:"Au Kivu, des milliers de creuseurs, parfois des enfants, extraient le coltan à la pelle."},{id:"deplaces",terme:"Déplacé interne",theme:"coltan",alias:["déplacés","déplacés internes"],def:"Personne obligée de fuir son domicile (violences, catastrophe) mais qui reste dans son propre pays.",ex:"Les combats au Nord-Kivu ont fait des centaines de milliers de déplacés autour de Goma."},{id:"refugie",terme:"Réfugié",theme:"coltan",alias:["réfugiés"],def:"Personne qui a fui son pays et a passé une frontière pour échapper à un danger.",ex:"Des Congolais se sont réfugiés en Ouganda et au Burundi."},{id:"mondialisation",terme:"Mondialisation",theme:"coltan",def:"Mise en relation de toutes les régions du monde par des échanges (marchandises, capitaux, personnes, informations).",ex:"Le coltan du Kivu se retrouve dans des téléphones vendus en Europe : c’est la mondialisation."},{id:"flux",terme:"Flux",theme:"coltan",def:"Déplacement de marchandises, de personnes, d’argent ou d’informations d’un lieu vers un autre.",ex:"Le flux de coltan part de l’Est de la RDC vers l’Asie (transformation) puis vers les consommateurs."},{id:"acteur",terme:"Acteur",theme:"coltan",alias:["acteurs"],def:"Personne, groupe, entreprise ou institution qui agit sur un territoire ou sur une ressource.",ex:"État congolais, milices, pays voisins, multinationales, creuseurs et consommateurs sont des acteurs du coltan."},{id:"enjeu",terme:"Enjeu",theme:"coltan",alias:["enjeux"],def:"Ce que l’on peut gagner ou perdre dans une situation ; ce qui est important et disputé.",ex:"Le contrôle des mines de l’Est est un enjeu économique et politique majeur."},{id:"problematique",terme:"Problématique",theme:"coltan",alias:["problématiques"],def:"Question centrale qui pose un problème à étudier, ou ensemble des problèmes liés à un sujet.",ex:"Problématique : pourquoi un pays aussi riche en minerais reste-t-il si pauvre et instable ?"},{id:"atout",terme:"Atout",theme:"coltan",alias:["atouts"],def:"Élément favorable d’un territoire pour une activité ou pour la population.",ex:"Les sols volcaniques fertiles sont un atout pour l’agriculture au Kivu."},{id:"contrainte",terme:"Contrainte",theme:"coltan",alias:["contraintes"],def:"Élément défavorable, qui gêne une activité ou l’installation de la population.",ex:"Les volcans actifs autour de Goma sont une contrainte (risque d’éruption)."},{id:"vulnerabilite",terme:"Vulnérabilité",theme:"coltan",def:"Fragilité d’une population ou d’un territoire face à un danger (aléa).",ex:"Goma est vulnérable : elle est construite au pied du Nyiragongo, un volcan actif."},{id:"potentialite",terme:"Potentialité",theme:"coltan",alias:["potentialités"],def:"Possibilité de développement qu’offre un territoire grâce à ses atouts.",ex:"Le fleuve Congo offre une grande potentialité hydroélectrique."},{id:"paludisme",terme:"Paludisme (malaria)",theme:"coltan",alias:["paludisme","malaria"],def:"Maladie grave transmise par la piqûre d’un moustique (anophèle), surtout dans les régions chaudes et humides.",ex:"Dans la cuvette centrale, le paludisme se transmet toute l’année ; en altitude, beaucoup moins."},{id:"monusco",terme:"MONUSCO (Casques bleus)",theme:"coltan",alias:["MONUSCO","casques bleus"],def:"Mission de l’ONU pour la stabilisation en RDC. Ses soldats, les Casques bleus, doivent protéger les civils.",ex:"En 2026, la MONUSCO suit le cessez-le-feu autour de Goma."},{id:"situer",terme:"Situer",theme:"methode",alias:["situation"],def:"Dire où se trouve un lieu par rapport à de grands repères, à petite échelle : continent, hémisphère, équateur, océans, pays voisins.",ex:"Goma se situe en Afrique centrale, dans l’hémisphère Sud, juste au sud de l’équateur, à l’est de la RDC."},{id:"localiser",terme:"Localiser",theme:"methode",alias:["localisation"],def:"Donner la position précise d’un lieu, à grande échelle : coordonnées géographiques, province, lieux tout proches.",ex:"Goma (1° 41′ S, 29° 13′ E) est au nord du lac Kivu, à la frontière du Rwanda, au pied du volcan Nyiragongo."},{id:"echelle",terme:"Échelle",theme:"methode",alias:["échelles","petite échelle","grande échelle"],def:"Rapport entre une distance sur la carte et la distance réelle. Petite échelle : carte d’un grand espace (monde) avec peu de détails. Grande échelle : carte d’un petit espace (ville) très détaillée.",ex:"Un planisphère est à petite échelle ; le plan de Goma est à grande échelle."},{id:"coordonnees",terme:"Coordonnées géographiques",theme:"methode",alias:["coordonnées"],def:"Latitude et longitude d’un lieu : elles permettent de le localiser précisément sur la Terre.",ex:"Bruxelles : 50° 51′ N, 4° 21′ E."},{id:"latitude",terme:"Latitude",theme:"methode",def:"Distance en degrés entre un lieu et l’équateur, vers le nord (N) ou vers le sud (S). Elle va de 0° à 90°.",ex:"Le pôle Nord est à 90° N ; Goma est à environ 1,7° S."},{id:"longitude",terme:"Longitude",theme:"methode",def:"Distance en degrés entre un lieu et le méridien de Greenwich, vers l’est (E) ou vers l’ouest (O). Elle va de 0° à 180°.",ex:"Goma est à environ 29° E ; New York à environ 74° O."},{id:"parallele",terme:"Parallèle",theme:"methode",alias:["parallèles"],def:"Cercle imaginaire parallèle à l’équateur ; tous les lieux d’un même parallèle ont la même latitude.",ex:"Le 60e parallèle Nord limite le « Grand Nord » peu peuplé."},{id:"meridien",terme:"Méridien",theme:"methode",alias:["méridiens"],def:"Demi-cercle imaginaire qui relie le pôle Nord au pôle Sud ; tous ses lieux ont la même longitude.",ex:"Le méridien de Greenwich (0°) passe près de Londres."},{id:"greenwich",terme:"Méridien de Greenwich",theme:"methode",def:"Méridien de référence (longitude 0°). Il partage la Terre en hémisphère Est et hémisphère Ouest.",ex:"Il traverse l’Angleterre, la France, l’Espagne, l’Algérie, le Mali, le Burkina Faso et le Ghana."},{id:"equateur",terme:"Équateur",theme:"methode",def:"Grand cercle imaginaire (latitude 0°) qui partage la Terre en hémisphère Nord et hémisphère Sud.",ex:"L’équateur traverse la RDC, juste au nord de Mbandaka."},{id:"tropique",terme:"Tropique",theme:"methode",alias:["tropiques","tropique du cancer","tropique du capricorne"],def:"Parallèle situé à environ 23° de latitude : tropique du Cancer au nord, tropique du Capricorne au sud. Entre les deux, le soleil peut être à la verticale.",ex:"Le tropique du Cancer traverse le Sahara ; le tropique du Capricorne traverse l’Australie."},{id:"cercle_polaire",terme:"Cercle polaire",theme:"methode",alias:["cercles polaires"],def:"Parallèle situé à environ 66° de latitude (arctique au nord, antarctique au sud). Au-delà, il y a au moins un jour par an sans nuit et un jour sans soleil.",ex:"Le cercle polaire arctique traverse le nord de la Finlande et de la Suède."},{id:"hemisphere",terme:"Hémisphère",theme:"methode",alias:["hémisphères"],def:"Moitié de la Terre. L’équateur sépare les hémisphères Nord et Sud ; le méridien de Greenwich sépare les hémisphères Est et Ouest.",ex:"La Belgique est dans l’hémisphère Nord ; Goma est dans l’hémisphère Sud, de justesse."},{id:"continent",terme:"Continent",theme:"methode",alias:["continents"],def:"Très grande étendue de terre. Le modèle à six continents compte : Amérique, Europe, Afrique, Asie, Océanie et Antarctique.",ex:"La RDC est en Afrique ; la Belgique en Europe."},{id:"carte_thematique",terme:"Carte thématique",theme:"methode",alias:["cartes thématiques"],def:"Carte qui représente un seul thème (climat, densité, ressources…) sur un fond de carte.",ex:"La carte des mois de pluie en RDC est une carte thématique."},{id:"croquis",terme:"Croquis (carte schématique)",theme:"methode",alias:["croquis schématique","carte schématique"],def:"Représentation simplifiée d’un espace qui met en évidence l’essentiel d’un sujet. On simplifie les formes et on choisit les informations.",ex:"Le croquis de synthèse sur les minerais au Congo."},{id:"legende",terme:"Légende",theme:"methode",def:"Tableau qui explique chaque symbole de la carte (couleur, trait, point). Une légende conforme utilise exactement les mêmes symboles que la carte.",ex:"Un carré violet = mine de coltan ; une surface bleu clair = région stannifère."},{id:"implantation",terme:"Implantation (ponctuelle, linéaire, zonale)",theme:"methode",alias:["ponctuel","linéaire","zonal","figuré","figurés"],def:"Forme du symbole sur une carte : un point (ponctuel) pour un lieu, un trait (linéaire) pour une ligne ou un flux, une surface (zonal) pour un espace.",ex:"Kinshasa : ponctuel ; l’équateur : linéaire ; la ceinture cuprifère : zonal."},{id:"orientation",terme:"Orientation (rose des vents)",theme:"methode",alias:["rose des vents","flèche du nord"],def:"Indication des points cardinaux, au minimum du nord, sur une carte.",ex:"Une flèche marquée « N » en haut à droite du croquis."},{id:"source",terme:"Source",theme:"methode",def:"Origine des informations d’une carte ou d’un document (auteur, organisme, date).",ex:"Source : « Cours de géographie EBC – S5 – 2026-27 »."},{id:"titre",terme:"Titre d’une carte",theme:"methode",alias:["titre"],def:"Il annonce le sujet de la carte. Un bon titre contient trois informations : le sujet, le lieu et la date.",ex:"« Les minerais, sources de conflits en RDC (2023) »."},{id:"orohydrographie",terme:"Orohydrographie",theme:"relief",def:"Description du relief (oro- : montagne) et des cours d’eau et lacs (hydro- : eau) d’une région.",ex:"La carte orohydrographique de la Belgique montre l’Ardenne, la Meuse et l’Escaut."},{id:"relief",terme:"Relief",theme:"relief",def:"Ensemble des formes du terrain : plaines, plateaux, collines, montagnes, vallées.",ex:"Le relief de la RDC : une cuvette au centre, des montagnes à l’est."},{id:"plaine",terme:"Plaine",theme:"relief",alias:["plaines"],def:"Étendue de terrain plat ou peu ondulé, généralement de basse altitude.",ex:"La grande plaine d’Europe du Nord va de la France à la Russie."},{id:"plateau",terme:"Plateau",theme:"relief",alias:["plateaux"],def:"Étendue de terrain assez plate mais située en altitude, souvent entaillée par des vallées.",ex:"Le plateau des Hautes Fagnes, en Belgique ; les plateaux du Katanga."},{id:"colline",terme:"Colline",theme:"relief",alias:["collines"],def:"Relief arrondi de faible hauteur (en général moins de 500 m).",ex:"Les collines du Condroz."},{id:"montagne",terme:"Montagne",theme:"relief",alias:["montagnes","chaîne de montagnes"],def:"Relief élevé aux pentes fortes. Plusieurs montagnes alignées forment une chaîne.",ex:"Les Alpes, les Pyrénées, l’Himalaya, les Rocheuses, les Andes."},{id:"cuvette",terme:"Cuvette",theme:"relief",alias:["cuvette centrale"],def:"Vaste dépression, plus basse que les régions qui l’entourent, comme le fond d’une bassine.",ex:"La cuvette centrale congolaise (300 à 500 m) est traversée par le fleuve Congo."},{id:"depression",terme:"Dépression",theme:"relief",def:"Zone plus basse que les terrains qui l’entourent.",ex:"La dépression Fagne-Famenne, entre le Condroz et l’Ardenne."},{id:"rift",terme:"Rift",theme:"relief",alias:["rift albertin","grand rift"],def:"Longue fracture de l’écorce terrestre, bordée de montagnes et souvent occupée par des lacs et des volcans.",ex:"Le Rift Albertin, à l’est de la RDC, contient les lacs Albert, Édouard, Kivu et Tanganyika."},{id:"volcan",terme:"Volcan",theme:"relief",alias:["volcans","volcan actif"],def:"Relief formé par la sortie de magma (lave) venue de l’intérieur de la Terre. Un volcan actif peut entrer en éruption.",ex:"Le Nyiragongo et le Nyamuragira, près de Goma, sont deux volcans actifs."},{id:"altitude",terme:"Altitude",theme:"relief",def:"Hauteur d’un lieu au-dessus du niveau de la mer, en mètres.",ex:"Goma est à environ 1500 m d’altitude ; le Signal de Botrange à 694 m."},{id:"fleuve",terme:"Fleuve",theme:"relief",alias:["fleuves"],def:"Cours d’eau qui se jette dans une mer ou un océan.",ex:"Le Congo, l’Escaut, la Meuse et le Rhin sont des fleuves."},{id:"riviere",terme:"Rivière (affluent)",theme:"relief",alias:["rivière","rivières","affluent","affluents"],def:"Cours d’eau qui se jette dans un autre cours d’eau. On l’appelle alors un affluent.",ex:"La Sambre est un affluent de la Meuse ; elles se rejoignent à Namur."},{id:"bassin_versant",terme:"Bassin hydrographique",theme:"relief",alias:["bassin versant","bassin"],def:"Territoire dont toutes les eaux s’écoulent vers un même fleuve.",ex:"Le bassin du Congo est le deuxième plus grand du monde."},{id:"delta",terme:"Delta / estuaire",theme:"relief",alias:["delta","estuaire"],def:"Embouchure d’un fleuve : un delta se divise en plusieurs bras ; un estuaire est une embouchure large où entre la marée.",ex:"L’Escaut se termine par un estuaire, aux Pays-Bas."},{id:"sillon",terme:"Sillon Sambre-et-Meuse",theme:"relief",alias:["sillon sambre-et-meuse","sillon"],def:"Longue vallée formée par la Sambre puis la Meuse, de Charleroi à Liège en passant par Namur. C’est un ancien axe industriel (charbon, sidérurgie).",ex:"Charleroi, Namur et Liège sont situées dans le sillon Sambre-et-Meuse."},{id:"climat",terme:"Climat",theme:"climat",alias:["climats"],def:"Temps qu’il fait en moyenne dans un lieu sur une longue période (au moins 30 ans) : températures et précipitations.",ex:"La Belgique a un climat océanique : hivers doux, étés frais, pluies toute l’année."},{id:"zone_climatique",terme:"Zone climatique",theme:"climat",alias:["zones climatiques"],def:"Grande bande de la Terre où les climats se ressemblent : zone chaude, zones tempérées, zones froides.",ex:"La RDC est dans la zone chaude (intertropicale)."},{id:"precipitations",terme:"Précipitations",theme:"climat",def:"Eau qui tombe du ciel : pluie, neige, grêle. On les mesure en millimètres (mm).",ex:"Au centre de la RDC, il pleut douze mois par an."},{id:"saison_seche",terme:"Saison sèche",theme:"climat",def:"Période de l’année où il pleut très peu. Elle caractérise le climat tropical.",ex:"Au Katanga, la saison sèche dure plusieurs mois."},{id:"equatorial",terme:"Climat équatorial",theme:"climat",def:"Climat chaud toute l’année avec de fortes pluies toute l’année. Il se trouve près de l’équateur.",ex:"Bassin du Congo, Amazonie, Indonésie."},{id:"tropical",terme:"Climat tropical",theme:"climat",def:"Climat chaud toute l’année, avec une saison des pluies et une saison sèche.",ex:"Le sud de la RDC (Katanga), le Sahel, l’Inde."},{id:"desertique",terme:"Climat désertique (aride)",theme:"climat",alias:["aride","climat aride","climat désertique"],def:"Climat où il pleut très peu, chaud (Sahara) ou froid l’hiver (Gobi).",ex:"Le Sahara, la péninsule arabique, le centre de l’Australie."},{id:"mediterraneen",terme:"Climat méditerranéen",theme:"climat",def:"Climat tempéré aux étés chauds et secs, aux hivers doux ; les pluies tombent surtout en automne.",ex:"Le bassin méditerranéen : Athènes, Rome, Marseille."},{id:"oceanique",terme:"Climat océanique",theme:"climat",def:"Climat tempéré influencé par l’océan : étés frais, hivers doux, pluies fréquentes toute l’année.",ex:"La Belgique, la Bretagne, l’Irlande."},{id:"continental",terme:"Climat continental",theme:"climat",def:"Climat tempéré loin de la mer : étés chauds, hivers très froids, faibles précipitations.",ex:"Moscou, Varsovie, le centre du Canada."},{id:"montagnard",terme:"Climat montagnard",theme:"climat",alias:["climat des montagnes","climat de montagne"],def:"Climat plus froid et plus humide que dans les plaines voisines, car la température baisse avec l’altitude.",ex:"Les Alpes, l’Himalaya, les montagnes de l’est de la RDC."},{id:"polaire",terme:"Climat polaire (froid)",theme:"climat",alias:["climat polaire","climat froid"],def:"Climat froid toute l’année, au-delà des cercles polaires.",ex:"Le Groenland, l’Antarctique, le nord de la Sibérie."},{id:"continentalite",terme:"Continentalité",theme:"climat",def:"Effet de l’éloignement de la mer : plus on s’éloigne de l’océan, plus les hivers sont froids, les étés chauds et les pluies faibles.",ex:"De Bruxelles à Moscou, les hivers deviennent de plus en plus froids."},{id:"biome",terme:"Biome",theme:"climat",alias:["biomes","paysage naturel","paysages naturels"],def:"Grand ensemble naturel (végétation, animaux, sols) qui dépend surtout du climat.",ex:"La forêt tropicale humide, la savane, le désert, la taïga sont des biomes."},{id:"foret_tropicale",terme:"Forêt tropicale humide (équatoriale)",theme:"climat",alias:["forêt équatoriale","forêt tropicale","forêt dense","forêt tropicale humide"],def:"Forêt dense, toujours verte, aux arbres très hauts, sous un climat chaud et humide toute l’année.",ex:"La forêt du bassin du Congo, l’Amazonie."},{id:"savane",terme:"Savane",theme:"climat",alias:["savanes","savane boisée","savane herbeuse"],def:"Paysage de hautes herbes avec des arbres dispersés, sous un climat tropical à saison sèche. Savane boisée : beaucoup d’arbres ; savane herbeuse : surtout des herbes.",ex:"Le sud de la RDC, l’Afrique de l’Est (Kenya, Tanzanie)."},{id:"desert",terme:"Désert",theme:"climat",alias:["déserts"],def:"Espace très sec où la végétation est rare ou absente.",ex:"Le Sahara, le désert de Gobi, le désert australien."},{id:"prairie",terme:"Prairie, steppe (grassland)",theme:"climat",alias:["steppe","grassland","prairie tempérée"],def:"Paysage d’herbes sans (ou presque sans) arbres, sous un climat assez sec.",ex:"Les Grandes Plaines des États-Unis, la pampa argentine, les steppes d’Ukraine."},{id:"foret_temperee",terme:"Forêt tempérée",theme:"climat",alias:["forêt tempérée"],def:"Forêt de nos régions, faite d’arbres feuillus (qui perdent leurs feuilles en hiver) et de conifères.",ex:"La forêt ardennaise."},{id:"feuillus",terme:"Feuillus (arbres décidus)",theme:"climat",alias:["feuillus","décidus","arbre décidu"],def:"Arbres à feuilles larges qui les perdent en automne (décidus).",ex:"Le chêne, le hêtre."},{id:"coniferes",terme:"Conifères (sempervirents)",theme:"climat",alias:["conifères","sempervirent","résineux"],def:"Arbres à aiguilles, qui les gardent en hiver (sempervirents) et portent des cônes.",ex:"Le sapin, l’épicéa, le pin."},{id:"taiga",terme:"Taïga",theme:"climat",def:"Grande forêt de conifères des régions au climat continental froid. Son sol est très acide (podzol).",ex:"La Sibérie, le Canada, la Finlande."},{id:"toundra",terme:"Toundra",theme:"climat",def:"Végétation basse (mousses, lichens, petits arbustes) des régions polaires, sur un sol gelé en permanence (permafrost).",ex:"Le nord du Canada, de la Sibérie et de la Laponie."},{id:"permafrost",terme:"Permafrost (pergélisol)",theme:"climat",alias:["pergélisol"],def:"Sol gelé en permanence, toute l’année.",ex:"Sous la toundra, le permafrost empêche les racines de s’enfoncer."},{id:"podzol",terme:"Podzol",theme:"climat",def:"Sol très acide et pauvre, formé par la décomposition des aiguilles de conifères.",ex:"On le trouve sous la taïga."},{id:"garrigue",terme:"Garrigue",theme:"climat",def:"Végétation basse et clairsemée (arbustes, plantes aromatiques) sur des sols calcaires secs, sous climat méditerranéen.",ex:"La garrigue de Provence (thym, romarin)."},{id:"maquis",terme:"Maquis",theme:"climat",def:"Végétation méditerranéenne dense et haute (petits chênes, arbousiers) avec un sous-bois d’arbustes épineux.",ex:"Le maquis corse."},{id:"densite",terme:"Densité de population",theme:"population",alias:["densité","densités"],def:"Nombre moyen d’habitants par kilomètre carré (hab./km²). Densité = population ÷ superficie.",ex:"La Belgique compte environ 380 hab./km² ; l’Ardenne beaucoup moins que la Flandre."},{id:"foyer",terme:"Foyer de population (de peuplement)",theme:"population",alias:["foyer de population","foyers de population","foyer de peuplement","espace peuplé"],def:"Grande région où vit une très forte concentration d’habitants.",ex:"L’Asie de l’Est, l’Asie du Sud et l’Europe sont les trois grands foyers mondiaux."},{id:"espace_vide",terme:"Espace vide (peu peuplé)",theme:"population",alias:["espace vide","espaces vides","espace peu peuplé","espaces peu peuplés"],def:"Région où vivent très peu d’habitants, souvent à cause de fortes contraintes naturelles (froid, aridité, altitude, forêt dense).",ex:"Le Sahara, l’Amazonie, l’Antarctique, le Grand Nord."},{id:"aire_urbaine",terme:"Aire urbaine",theme:"population",alias:["aires urbaines","agglomération"],def:"Ensemble formé par une ville-centre, ses banlieues et les communes voisines dont beaucoup d’habitants travaillent dans la ville.",ex:"L’aire urbaine de Bruxelles s’étend bien au-delà des 19 communes de la Région."},{id:"metropole",terme:"Métropole",theme:"population",alias:["métropoles"],def:"Grande ville qui concentre des fonctions de commandement (politiques, économiques, culturelles) et qui rayonne sur un vaste territoire.",ex:"Paris et Londres sont des métropoles mondiales."},{id:"urbanisation",terme:"Urbanisation",theme:"population",def:"Augmentation de la part de la population qui vit en ville, et extension des villes.",ex:"Kinshasa grandit très vite : c’est une forte urbanisation."},{id:"periurbanisation",terme:"Périurbanisation",theme:"population",alias:["étalement urbain"],def:"Extension de la ville vers la campagne voisine : on construit des lotissements de plus en plus loin du centre.",ex:"Autour de Bruxelles, les villages du Brabant wallon se périurbanisent."},{id:"navette",terme:"Navette (migration pendulaire)",theme:"population",alias:["navetteurs","migration pendulaire","migrations pendulaires"],def:"Trajet quotidien aller-retour entre le domicile et le lieu de travail ou d’école.",ex:"Chaque jour, des centaines de milliers de navetteurs entrent à Bruxelles."},{id:"fonction_urbaine",terme:"Fonction urbaine",theme:"population",alias:["fonctions urbaines","fonction","fonctions"],def:"Activité ou rôle d’une ville : politique, économique, culturelle, de transport, résidentielle…",ex:"L’Élysée illustre la fonction politique de Paris ; La Défense, sa fonction économique."},{id:"quartier_affaires",terme:"Quartier d’affaires",theme:"population",alias:["quartier des affaires","axe des affaires"],def:"Quartier où se concentrent les sièges d’entreprises, les banques et les bureaux.",ex:"La Défense, à l’ouest de Paris."},{id:"institution",terme:"Institution",theme:"population",alias:["institutions"],def:"Organisme officiel qui exerce un pouvoir ou un rôle public (parlement, gouvernement, tribunal, musée national…).",ex:"L’Assemblée nationale et le Sénat sont des institutions politiques françaises."},{id:"ambassade",terme:"Ambassade",theme:"population",alias:["ambassades"],def:"Représentation officielle d’un pays étranger dans une capitale.",ex:"À Paris, les ambassades se regroupent dans l’ouest de la ville (8e et 16e arrondissements)."},{id:"etat_federal",terme:"État fédéral",theme:"territoire",alias:["fédéral","fédéralisme"],def:"État dans lequel le pouvoir est partagé entre l’autorité fédérale (le pays entier) et des entités fédérées (en Belgique : Régions et Communautés).",ex:"La Belgique est un État fédéral depuis 1993."},{id:"region_be",terme:"Région (Belgique)",theme:"territoire",alias:["région","régions","Région flamande","Région wallonne","Région de Bruxelles-Capitale"],def:"Entité fédérée compétente pour ce qui est lié au territoire : économie, emploi, aménagement du territoire, environnement, transports… Il y en a trois.",ex:"Région flamande, Région wallonne, Région de Bruxelles-Capitale."},{id:"communaute",terme:"Communauté (Belgique)",theme:"territoire",alias:["communauté","communautés","Communauté française","Fédération Wallonie-Bruxelles"],def:"Entité fédérée compétente pour ce qui est lié aux personnes : enseignement, culture, langue, jeunesse… Il y en a trois.",ex:"Communauté flamande, Communauté française (Fédération Wallonie-Bruxelles), Communauté germanophone."},{id:"frontiere_ling",terme:"Frontière linguistique",theme:"territoire",alias:["frontière linguistique"],def:"Limite qui sépare, en Belgique, la région de langue néerlandaise (au nord) de la région de langue française (au sud). Elle a été fixée en 1962-1963.",ex:"Elle passe au sud de Courtrai, Bruxelles, Louvain et Hasselt."},{id:"province",terme:"Province",theme:"territoire",alias:["provinces"],def:"Subdivision administrative. La Belgique compte dix provinces (cinq flamandes, cinq wallonnes) ; Bruxelles n’en fait pas partie.",ex:"Namur, Liège, Hainaut, Luxembourg, Brabant wallon."},{id:"bilingue",terme:"Bilingue",theme:"territoire",def:"Qui utilise officiellement deux langues.",ex:"La Région de Bruxelles-Capitale est bilingue (français et néerlandais)."},{id:"ue",terme:"Union européenne (UE)",theme:"territoire",alias:["UE","union européenne"],def:"Union économique et politique de 27 États européens qui partagent des règles, un marché commun et, pour 21 d’entre eux (depuis l’entrée de la Bulgarie en 2026), une monnaie : l’euro.",ex:"La Belgique est un membre fondateur ; Bruxelles accueille ses principales institutions."},{id:"etat_membre",terme:"État membre",theme:"territoire",alias:["états membres","membre"],def:"Pays qui fait partie de l’Union européenne.",ex:"La Pologne est devenue membre en 2004."},{id:"candidat",terme:"Pays candidat",theme:"territoire",alias:["candidat","candidats","pays candidats"],def:"Pays qui a demandé à entrer dans l’UE et dont la candidature est reconnue ; il négocie pour adopter les règles européennes.",ex:"L’Ukraine, la Moldavie, la Serbie, la Turquie."},{id:"brexit",terme:"Brexit",theme:"territoire",def:"Sortie du Royaume-Uni de l’Union européenne, effective le 31 janvier 2020.",ex:"Le Royaume-Uni est un ancien membre de l’UE."},{id:"region_naturelle",terme:"Région naturelle",theme:"territoire",alias:["régions naturelles"],def:"Espace qui a une unité de paysage (relief, sol, végétation) et souvent un nom ancien.",ex:"La Campine, la Hesbaye, le Condroz, l’Ardenne."},{id:"polders",terme:"Polders",theme:"territoire",alias:["polder"],def:"Terres basses gagnées sur la mer et protégées par des digues.",ex:"Les polders de la côte belge, entre les dunes et la Flandre."},{id:"dunes",terme:"Dunes",theme:"territoire",alias:["dune"],def:"Collines de sable façonnées par le vent ; sur la côte, elles protègent l’intérieur des terres.",ex:"La bande de dunes de la côte belge."},{id:"bocage",terme:"Bocage",theme:"territoire",def:"Paysage de prés entourés de haies et d’arbres.",ex:"Le Pays de Herve : herbages et vergers."},{id:"limon",terme:"Limon (plateaux limoneux)",theme:"territoire",alias:["limoneux","plateaux limoneux"],def:"Sol fin, très fertile, déposé par le vent ; il convient aux grandes cultures.",ex:"La Hesbaye, au sol limoneux, produit betteraves et céréales."}];var q1=H(e1(),1),Sr=(0,f2.createContext)(null),B1=()=>(0,f2.useContext)(Sr),Ke=e=>String(e||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"'")
