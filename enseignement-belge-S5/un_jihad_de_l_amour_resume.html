e : « Climat, enseignement, logement, emploi : ce sont eux qui vivront le plus longtemps avec les conséquences des choix faits aujourd’hui. »",etapes:[{t:"1. Je trouve le noyau",d:"Ce sont les jeunes qui vivront le plus longtemps avec les conséquences."},{t:"2. Je généralise la liste",d:"« Climat, enseignement, logement, emploi » → « leur avenir »."},{t:"3. Je rédige court",d:"« Les choix politiques engagent l’avenir des jeunes. »"}],reponse:"Les choix politiques engagent l’avenir des jeunes."},items:[{id:"f5a",niveau:1,type:"tri",consigne:"Pour le résumé du texte sur la mode jetable : essentiel ou accessoire ?",cats:["Essentiel","Accessoire"],etiquettes:[["La mode jetable est un piège qu’il faut refuser.",0],["Inès a acheté cinq t-shirts pour le prix d’une pizza.",1],["Elle abîme la planète.",0],["Un jean peut demander plusieurs milliers de litres d’eau.",1],["Elle repose sur l’exploitation de travailleurs.",0],["Le Rana Plaza s’est effondré en 2013.",1],["L’économie promise est une illusion.",0],["Le porterai-je au moins trente fois ?",1]],conclusion:"On garde la thèse et les arguments. Les anecdotes, les chiffres et les questions au lecteur sont accessoires dans un résumé court."},{id:"f5b",niveau:2,type:"qcm",q:"Meilleure reformulation de : « Rire d’une épreuve, c’est reprendre un peu de pouvoir sur elle et se sentir moins seul. »",o:["Rire d’une épreuve, c’est reprendre un peu de pouvoir sur elle.","Le rire aide à surmonter les difficultés.","Il faut toujours rire de tout.","Les épreuves rendent seul."],a:1,e:"C’est plus court, avec d’autres mots, et le sens est respecté. La réponse A recopie ; C transforme l’idée ; D fait un contresens."},{id:"f5c",niveau:2,type:"qcm",q:"Quelle nominalisation convient pour une case de schéma : « les élèves se concentrent moins bien » ?",o:["Les élèves et la concentration","Baisse de la concentration","Concentration des élèves meilleure","Élèves moins"],a:1,e:"« Baisse de la concentration » transforme la phrase en groupe nominal, sans perdre le sens."},{id:"f5d",niveau:3,type:"qcm",q:"Généralise : « l’école catholique, les musulmans de Damas priant dans une église, Raphaël peignant Averroès ».",o:["Des lieux de prière","La fraternité possible entre croyants de religions différentes","L’histoire de la peinture","Les écoles religieuses"],a:1,e:"Ces trois exemples prouvent la même idée générale : des croyants différents peuvent se reconnaître comme frères."}]},{id:"f6",groupe:"methode",titre:"Du schéma au texte argumentatif",comp:"Schéma → texte",but:"Faire le chemin inverse : déplier un schéma en paragraphes, puis en texte complet.",methode:["Une ligne du schéma = un paragraphe.","Argument (connecteur d’énumération) → explication (en effet) → exemple (par exemple) → lien avec la thèse.","Introduction : accroche + thèse. Conclusion : thèse reformulée + ouverture."],resolu:{consigne:"Déplie cette ligne : Argument « Les zoos sensibilisent le public » → Explication « voir un animal en vrai crée une émotion » → Exemple « les ateliers pour enfants ».",etapes:[{t:"1. La phrase-argument",d:"« Deuxièmement, les zoos sensibilisent le public. »"},{t:"2. L’explication",d:"« En effet, voir un animal en vrai crée une émotion qu’aucun écran ne remplace, et cette émotion donne envie de protéger la nature. »"},{t:"3. L’exemple",d:"« Par exemple, de nombreux parcs organisent des ateliers où les enfants découvrent les menaces qui pèsent sur la forêt tropicale. »"},{t:"4. Le lien avec la thèse",d:"« Les zoos peuvent ainsi former de futurs défenseurs de la nature. »"}],reponse:"Deuxièmement, les zoos sensibilisent le public. En effet, voir un animal en vrai crée une émotion qu’aucun écran ne remplace, et cette émotion donne envie de protéger la nature. Par exemple, de nombreux parcs organisent des ateliers où les enfants découvrent les menaces qui pèsent sur la forêt tropicale. Les zoos peuvent ainsi former de futurs défenseurs de la nature."},items:[{id:"f6a",niveau:1,type:"redaction",max:80,consigne:"Déplie cette ligne de schéma en un paragraphe : Argument « Le téléphone favorise le cyberharcèlement » → Explication « on peut filmer et diffuser sans accord » → Exemple « une photo prise au vestiaire ».",trame:[["arg","Argument","De plus, "],["expl","Explication","En effet, "],["ex","Exemple","Par exemple, "],["lien","Lien avec la thèse","C’est pourquoi "]],correction:{texte:["De plus, le téléphone favorise le cyberharcèlement. En effet, il permet de filmer ou de photographier un camarade sans son accord, puis de diffuser l’image en quelques secondes. Par exemple, une photo prise en cachette au vestiaire peut circuler dans toute l’école avant la fin de la journée. C’est pourquoi l’interdire pendant les cours protège les élèves."],criteres:["Mon paragraphe commence par l’argument, introduit par un connecteur.","L’explication est introduite par « en effet » ou « car ».","L’exemple est concret et introduit par « par exemple ».","La dernière phrase relie l’argument à la thèse."]}},{id:"f6b",niveau:2,type:"redaction",max:90,consigne:"Rédige un paragraphe qui présente un contre-argument puis le réfute. Sujet : le vote à 16 ans. Contre-argument : « les jeunes manqueraient de maturité ». Réfutation : « la maturité ne dépend pas de l’âge ; l’école peut préparer au vote ».",trame:[["contre","Contre-argument","Certes, certains estiment que "],["refut","Réfutation","Pourtant, "],["ex","Exemple ou précision","Ainsi, "]],correction:{texte:["Certes, certains estiment qu’à seize ans, les jeunes manqueraient de maturité pour voter. Pourtant, la maturité politique ne dépend pas seulement de l’âge : bien des adultes votent sans s’informer, alors que de nombreux adolescents suivent l’actualité. Ainsi, un cours de citoyenneté qui compare les programmes avant les élections peut préparer les jeunes à voter de façon réfléchie."],criteres:["Le contre-argument est présenté avec un marqueur (certes, certains estiment…).","La réfutation commence par un connecteur d’opposition.","La réfutation donne une vraie raison.","Une précision ou un exemple appuie la réfutation."]}},{id:"f6c",niveau:3,type:"redaction",max:250,theme:"uniforme",consigne:"À partir du schéma de la bibliothèque (thème « L’uniforme scolaire », arguments « pour »), rédige un texte argumentatif complet de 200 à 250 mots : introduction, deux ou trois paragraphes d’arguments, un contre-argument réfuté, conclusion.",trame:[["intro","Introduction (accroche + thèse)",""],["a1","Premier argument","D’abord, "],["a2","Deuxième argument","Ensuite, "],["contre","Contre-argument et réfutation","Certes, "],["concl","Conclusion (thèse reformulée + ouverture)","En somme, "]],correction:{texte:["Pistes de correction : l’introduction amène le thème (par exemple une scène de cour de récréation) et formule clairement la thèse (« l’uniforme devrait être imposé »).","Chaque argument de la bibliothèque devient un paragraphe : effacer les différences sociales visibles, créer un sentiment d’appartenance, simplifier la vie des familles.","Le contre-argument « il empêche d’exprimer sa personnalité » peut être réfuté : on peut exprimer sa personnalité autrement (ses idées, ses activités), et l’école n’est pas un défilé de mode.","La conclusion reprend la thèse et ouvre, par exemple, sur une tenue choisie avec les élèves."],criteres:["L’introduction contient une accroche et la thèse.","Chaque argument a son paragraphe, avec explication et exemple.","Un contre-argument est présenté puis réfuté.","La conclusion reformule la thèse et ouvre le débat.","Les connecteurs sont variés et justes."]}}]},{id:"f7",groupe:"methode",titre:"Du schéma au résumé",comp:"Schéma → résumé",but:"Rédiger un résumé à partir d’un schéma, en appliquant la fiche page 86.",methode:["Introduction : source (auteur, genre, date) + thème + thèse.","Un paragraphe ou une phrase par argument, dans l’ordre du schéma, avec un connecteur.","3e personne, nom de famille de l’auteur, verbes introducteurs précis.","Pas d’exemples (sauf s’ils sont indispensables), pas d’avis, pas de copie. Compte tes mots."],resolu:{consigne:"Rédige le résumé du texte « Des zoos pour protéger » en 70 mots maximum, à partir de son schéma.",etapes:[{t:"1. L’introduction",d:"« Dans une carte blanche, le biologiste Hugo Lambert reconnaît que la captivité n’est pas la vie sauvage, mais il estime que les zoos modernes restent utiles s’ils se consacrent à la protection des animaux. » La concession est intégrée à la thèse."},{t:"2. Les arguments, dans l’ordre",d:"« En effet, ils sauvent des espèces menacées grâce à l’élevage et aux réintroductions. De plus, ils sensibilisent le public à la nature. Enfin, ils financent des projets de protection sur le terrain. »"},{t:"3. Je vérifie",d:"3e personne, nom de famille, verbes « reconnaît », « estime », aucun exemple (l’oryx a disparu), aucun avis, moins de 70 mots."}],reponse:"Dans une carte blanche, le biologiste Hugo Lambert reconnaît que la captivité n’est pas la vie sauvage, mais il estime que les zoos modernes restent utiles s’ils se consacrent à la protection des animaux. En effet, ils sauvent des espèces menacées grâce à l’élevage et aux réintroductions. De plus, ils sensibilisent le public à la nature. Enfin, ils financent des projets de protection sur le terrain."},items:[{id:"f7a",niveau:1,type:"ordre",consigne:"Remets dans l’ordre les phrases du résumé du texte « Voter à seize ans ».",items:["Dans un éditorial, Samira Haddad plaide pour que les jeunes de seize ans puissent voter à toutes les élections.","D’abord, elle souligne que les décisions politiques les concernent directement, puisqu’ils vivront longtemps avec leurs conséquences.","Ensuite, elle affirme que voter tôt crée une habitude, encouragée par l’école.","Enfin, elle réfute l’idée que les jeunes seraient trop influençables : les adultes le sont aussi."],conclusion:"L’introduction (source + thèse) vient d’abord ; les connecteurs d’abord, ensuite, enfin donnent l’ordre des arguments."},{id:"f7b",niveau:2,type:"qcm",q:"Quelle introduction convient au résumé du texte « Rire de tout, mais pas n’importe comment » ?",o:["« On peut rire de tout, mais pas avec n’importe qui », disait Desproges.","Dans un billet d’humeur, Clara Renard soutient qu’on peut rire de tout, pourvu que le rire n’écrase pas les plus faibles.","Je pense moi aussi qu’on peut rire de tout.","Clara dit que l’humour c’est bien mais pas toujours."],a:1,e:"Source (genre + nom complet), verbe précis, thèse reformulée, neutralité. A recopie l’accroche ; C donne un avis ; D utilise le prénom seul et « dit »."},{id:"f7c",niveau:2,type:"redaction",max:100,texte:"t4",schemaDonne:!0,consigne:"À partir du schéma donné, rédige le résumé du texte « La mode jetable nous coûte cher » en 100 mots maximum, pour un lecteur de ton âge qui n’a pas lu le texte.",trame:[["intro","Introduction (source + thème + thèse)","Dans sa chronique, Thomas Delvaux "],["a1","Argument 1","Premièrement, "],["a2","Argument 2","Deuxièmement, "],["a3","Argument 3","Troisièmement, "],["contre","Contre-argument et réfutation","Le journaliste admet que "]],correction:{modele:"t4",criteres:["L’introduction donne la source, le thème et la thèse.","Les trois arguments sont présents, dans l’ordre.","La concession et la réfutation sont mentionnées.","Aucun exemple (Inès, le jean, le Rana Plaza) n’est repris.","Le résumé fait 100 mots au maximum."]}},{id:"f7d",niveau:3,type:"redaction",max:120,texte:"t6",consigne:"Lis le texte « L’intelligence artificielle à l’école », fais son schéma au brouillon, puis rédige son résumé en 120 mots maximum.",trame:[["intro","Introduction","Dans un texte d’opinion, "],["a1","Argument 1",""],["a2","Argument 2",""],["a3","Argument 3",""],["refut","Réfutation du risque de tricherie",""]],correction:{modele:"t6",criteres:["Source, thème et thèse dans l’introduction.","La concession (la crainte de la tricherie) est intégrée.","Les trois arguments sont reformulés.","La réponse au risque de tricherie est mentionnée.","120 mots maximum, 3e personne, aucun avis."]}}]},{id:"f8",groupe:"methode",titre:"Évaluer et corriger des résumés",comp:"Résumé → critères",but:"Repérer les défauts d’un résumé d’élève, comme à l’activité 5 de ton cours, puis l’améliorer.",methode:["Vérifie la situation de communication : 3e personne, nom de l’auteur, destinataire.","Vérifie le contenu : thèse et tous les arguments, sans exemples inutiles.","Vérifie la forme : reformulation, connecteurs, neutralité, nombre de mots."],resolu:{consigne:"Résumé de Lucas (texte sur le téléphone, 50 mots max) : « Je pense qu’il faut interdire le téléphone. Par exemple, un élève reçoit trois messages pendant un exercice de maths. Laure dit aussi qu’on peut prendre des photos. »",etapes:[{t:"1. Énonciation",d:"« Je pense » : Lucas n’a pas changé d’énonciateur. « Laure » : prénom seul."},{t:"2. Contenu",d:"L’argument de la concentration est remplacé par son exemple ; le cyberharcèlement est à peine évoqué."},{t:"3. Forme",d:"Verbe « dit » ; pas de connecteurs logiques ; pas de source."}],reponse:"Version corrigée : « Dans sa chronique, Laure Martin soutient que le téléphone portable devrait être interdit pendant les cours. D’une part, il nuit à la concentration, car chaque notification détourne l’attention. D’autre part, son interdiction protège les élèves du cyberharcèlement. »"},items:[{id:"f8a",niveau:1,type:"defauts",consigne:"Résumé d’Amina (texte « Des zoos pour protéger », 70 mots max). Coche les défauts présents.",resume:"Hugo dit que les zoos c’est bien. Il dit que l’oryx d’Arabie a été sauvé grâce à des animaux nés en captivité. Il dit aussi que les enfants font des ateliers sur la forêt tropicale. Moi je trouve qu’il a raison car les animaux sont mignons.",options:[["Prénom seul de l’auteur",!0],["Verbe « dire » répété",!0],["Exemples gardés à la place des arguments",!0],["Avis personnel",!0],["Dépassement du nombre de mots",!1],["Thèse absente ou déformée",!0]],correction:["Amina écrit « Hugo » au lieu de « Lambert » ou « Hugo Lambert », et répète « il dit ».","Elle garde deux exemples (l’oryx, les ateliers) au lieu des arguments (sauver des espèces, sensibiliser) et oublie le troisième (financer la protection).","La thèse est réduite à « les zoos c’est bien » : elle perd la condition (être des lieux de protection) et la concession.","« Moi je trouve qu’il a raison » est un avis personnel. Le texte fait une cinquantaine de mots : la longueur n’est pas le problème."]},{id:"f8b",niveau:2,type:"defauts",consigne:"Résumé de Yanis (texte « Rire de tout, mais pas n’importe comment », 110 mots max). Coche les défauts présents.",resume:"Dans un billet d’humeur, Clara Renard affirme qu’il faut interdire toutes les blagues. Elle explique que l’humour permet de critiquer les puissants et aide à supporter le malheur. Elle ajoute qu’une plaisanterie qui vise quelqu’un pour ce qu’il est l’humilie. Elle conclut que la limite de l’humour est la cible, pas le sujet.",options:[["Contresens sur la thèse",!0],["Copie de longues phrases du texte",!1],["Avis personnel",!1],["Absence de connecteurs logiques variés",!0],["Arguments manquants",!1],["Énonciation à la 1re personne",!1]],correction:["Grave contresens : l’auteure ne veut pas interdire les blagues ; elle soutient qu’on peut rire de tout, à condition de ne pas écraser les plus faibles.","Les arguments sont présents et reformulés, mais les liens logiques manquent : « Elle explique », « Elle ajoute », « Elle conclut » ne montrent pas l’opposition (« toutefois ») entre les deux premiers arguments et la réfutation.","Correction possible de l’introduction : « Dans un billet d’humeur, Clara Renard soutient qu’on peut rire de tout, pourvu que le rire n’écrase pas les plus faibles. »"]},{id:"f8c",niveau:3,type:"defauts",consigne:"Résumé de Sarah (texte « Punir sans se venger », 120 mots max). Coche les défauts présents.",resume:"Après un crime terrible, la colère est légitime et certains réclament œil pour œil, dent pour dent. Les vendettas entre familles ont duré des décennies. Lors du procès des attentats de Bruxelles en 2022 et 2023, beaucoup de victimes ont témoigné. En Belgique, des médiations existent entre victimes et auteurs. Certains pensent que la peine de mort dissuade, mais rien ne le prouve.",options:[["Pas de source ni d’auteur",!0],["Thèse absente",!0],["Exemples à la place des arguments",!0],["Phrases recopiées du texte",!0],["Avis personnel",!1],["Résumé trop long",!1]],correction:["Sarah résume paragraphe par paragraphe en recopiant surtout l’accroche et les exemples : c’est une réduction mécanique.","Ni l’auteure (Élise Moreau) ni la thèse (la justice doit punir sans devenir vengeance) n’apparaissent.","Les arguments (la vengeance n’a pas de fin, la justice protège les victimes, la peine doit préparer l’avenir) sont remplacés par leurs exemples.","Plusieurs phrases reprennent presque mot pour mot le texte."]}]},{id:"l1",groupe:"livre",titre:"La fonction des fragments",comp:"Repérer",but:"Distinguer les fragments qui racontent, ceux qui expriment une émotion et ceux qui argumentent (étape 3 de la procédure).",methode:["Récit : des faits datés, des actions (je suis allé, elle a pris le métro).","Lyrique : des émotions, des images, une adresse à Loubna.","Argumentatif : une idée générale défendue (il faut, on ne peut pas, rien ne justifie)."],resolu:{consigne:"Quelle est la fonction du fragment « Ce jour-là » ?",etapes:[{t:"1. Que contient-il ?",d:"Des phrases très courtes au passé : il était en congé, elle a pris le métro, une amie est venue."},{t:"2. Défend-il une idée ?",d:"Non : il ne généralise rien, il n’y a ni « il faut » ni raison."},{t:"3. Conclusion",d:"C’est un récit. Il a une autre fonction : émouvoir et montrer d’où l’auteur parle."}],reponse:"« Ce jour-là » est un récit : autre fonction que l’argumentation."},items:[{id:"l1a",niveau:1,type:"tri",consigne:"Classe ces fragments selon leur fonction dominante.",cats:["Récit","Lyrique","Argumentatif"],etiquettes:[["La nuit : il descend l’escalier, sous médicaments, pour donner le biberon.",0],["Mes parents : l’immigration de son père depuis le Rif.",0],["La rencontre : Loubna entre dans le magasin de téléphones.",0],["Lettre à Loubna : « rien n’a plus de goût ».",1],["Bonté : portrait-hommage de Loubna.",1],["Beauté : le coucher de soleil reste beau.",1],["Le Coran : l’axe vertical et l’axe horizontal.",2],["La peine de mort : un crime approuvé par la société.",2],["Humanité : humain d’abord, musulman ensuite.",2],["Jihad : le sens premier du mot est l’effort sur soi.",2]],conclusion:"Récits et textes lyriques ont une autre fonction (émouvoir, rendre l’auteur crédible). Les fragments argumentatifs nourrissent le schéma."},{id:"l1b",niveau:2,type:"qcm",q:"Le fragment « À propos des attentats » ne contient qu’une phrase : le terroriste « le laisse froid ». Quelle est sa fonction ?",o:["Raconter l’attentat en détail","Refuser de donner de l’importance au terroriste, ce qui annonce le refus de la haine","Décrire Loubna","Définir le jihad"],a:1,e:"La brièveté est un choix : l’auteur refuse de consacrer des pages au terroriste. C’est une manière de ne pas lui laisser le dernier mot."}]},{id:"l2",groupe:"livre",titre:"Quel argument cet exemple illustre-t-il ?",comp:"Hiérarchiser",but:"Rattacher chaque exemple du livre à l’un des cinq arguments : c’est la clé pour généraliser dans le résumé.",methode:["Pour chaque exemple, demande-toi : « qu’est-ce que cela prouve ? ».","A1 vengeance · A2 sens du jihad · A3 foi et raison · A4 fraternité humaine · A5 diversité et éducation."],resolu:{consigne:"« Le Prophète, mystique à La Mecque, devenu chef politique à Médine. » Quel argument ?",etapes:[{t:"1. Que prouve cet exemple ?",d:"Que les textes et les règles dépendent d’un contexte historique : à Médine, le Prophète doit gouverner."},{t:"2. À quel argument cela correspond-il ?",d:"Il faut lire la religion avec la raison et replacer les règles dans leur contexte : A3."}],reponse:"A3 : une foi éclairée par la raison."},items:[{id:"l2a",niveau:2,type:"tri",consigne:"Rattache chaque exemple à son argument.",cats:["A1 Vengeance","A2 Jihad","A3 Foi et raison","A4 Fraternité","A5 Diversité"],etiquettes:[["Ses fils furieux réclament vengeance.",0],["Le conflit israélo-palestinien.",0],["Le poème des quatre colombes.",0],["La définition du dictionnaire en ouverture.",1],["« Ne te mets pas en colère » (hadith).",1],["Mère Teresa exclue du paradis ?",2],["Bagdad au Xe siècle.",2],["Les fidèles qui prient sur l’autoroute pour être vus.",2],["Raphaël peint Averroès au Vatican.",3],["Les prières venues du monde entier pour Loubna.",3],["« Sale Marocain » à six ans.",4],["Le Molenbeek des médias, présenté comme Kaboul.",4],["La belgitude.",4]],conclusion:"Dans le résumé, on remplace ces exemples par l’argument qu’ils prouvent."}]},{id:"l3",groupe:"livre",titre:"Thème et thèse du livre",comp:"Repérer",but:"Formuler précisément le thème et la thèse, sans confondre avec le récit ou l’hommage.",methode:["Le thème n’est pas « la vie de Mohamed » : c’est la question à laquelle le livre répond.","La thèse est une phrase qui prend position sur ce thème."],resolu:{consigne:"Pourquoi « l’amour de Mohamed pour Loubna » n’est-il pas le thème du livre ?",etapes:[{t:"1. Ce que le livre raconte",d:"L’histoire d’amour et le deuil occupent beaucoup de pages."},{t:"2. Ce que le livre défend",d:"Mais l’auteur dit lui-même que l’essentiel n’est pas leur histoire : c’est le message de paix."},{t:"3. Conclusion",d:"L’histoire d’amour a une autre fonction (hommage, émotion). Le thème argumentatif est la réponse à la haine."}],reponse:"Thème : la réponse à apporter à la haine et à la violence terroriste."},items:[{id:"l3a",niveau:1,type:"qcm",q:"Quelle formulation est la plus juste pour le thème ?",o:["Mohamed El Bachiri","La réponse à apporter à la haine et à la violence terroriste","Il faut aimer tout le monde","Le 22 mars 2016"],a:1,e:"C’est un sujet, sans prise de position, qui englobe tous les arguments du livre."},{id:"l3b",niveau:2,type:"qcm",q:"Quelle formulation est la plus juste pour la thèse ?",o:["L’auteur a perdu sa femme dans un attentat.","Le jihad est un mot arabe.","Face à la haine, il faut répondre par l’amour : un effort sur soi pour refuser la vengeance et reconnaître l’humanité de chacun.","Molenbeek est une commune de Bruxelles."],a:2,e:"C’est une opinion complète, qui reprend le titre (jihad de l’amour) et englobe les arguments."},{id:"l3c",niveau:3,type:"redaction",max:50,consigne:"Rédige l’introduction du résumé du livre (50 mots maximum) : source, contexte en une phrase, thème et thèse.",trame:[["intro","Introduction","Dans son essai-témoignage Un jihad de l’amour (2017), "]],correction:{texte:["Modèle : « Dans son essai-témoignage Un jihad de l’amour (2017), Mohamed El Bachiri, dont l’épouse a été tuée lors de l’attentat du métro de Bruxelles en 2016, s’interroge sur la réponse à apporter à la haine terroriste. Il soutient qu’il faut lui opposer l’amour. »"],criteres:["Titre, auteur (nom complet), date et genre.","Contexte en une seule phrase (ou proposition).","Thème et thèse reformulés.","50 mots maximum, aucun avis."]}}]},{id:"l4",groupe:"livre",titre:"Le schéma du livre à trous",comp:"Schématiser",but:"Compléter le schéma argumentatif du livre, de moins en moins guidé.",methode:["Appuie-toi sur la leçon « L’argumentation du livre ».","Écris court et avec tes mots."],resolu:{consigne:"Exemple : compléter l’explication de l’argument A2.",etapes:[{t:"1. L’argument",d:"Le jihad désigne d’abord un effort sur soi-même."},{t:"2. Ce qui le développe",d:"Le vrai jihadiste ne s’emporte pas, cherche le savoir, va vers l’autre."}],reponse:"Explication de A2 : le vrai jihadiste maîtrise sa colère et va vers l’autre."},items:[{id:"l4a",niveau:2,type:"schema-trous",texte:"livre",trous:["these","arg1","arg3","ex0","ex4"],consigne:"Complète la thèse, deux arguments et deux exemples."},{id:"l4b",niveau:3,type:"schema-trous",texte:"livre",trous:["theme","these","arg0","arg1","arg2","arg3","arg4"],consigne:"Complète le thème, la thèse et les cinq arguments."},{id:"l4c",niveau:3,type:"schema-vide",texte:"livre",consigne:"Réalise seul le schéma complet du livre, puis compare avec le corrigé."}]},{id:"l5",groupe:"livre",titre:"Évaluer des résumés du livre",comp:"Résumé → critères",but:"Repérer les erreurs typiques dans des résumés du livre.",methode:["Situation de communication, contenu, forme : passe chaque résumé au crible de la fiche p. 86."],resolu:{consigne:"« Mohamed raconte que sa femme Loubna, prof de sport, est morte dans le métro à 9 h 10. Il était en congé. Il était très triste. »",etapes:[{t:"1. Que garde ce résumé ?",d:"Uniquement le récit : il ne contient ni thème, ni thèse, ni argument."},{t:"2. Énonciation",d:"Prénom seul, verbe « raconte »."}],reponse:"Ce n’est pas un résumé de l’argumentation : c’est un résumé du récit d’ouverture."},items:[{id:"l5a",niveau:2,type:"defauts",consigne:"Résumé de Noah (200 mots max). Coche les défauts présents.",resume:"Dans Un jihad de l’amour, Mohamed explique qu’il a perdu sa femme et que c’est très triste. Il dit qu’il ne faut pas se venger. Il dit que le jihad c’est un effort. Il parle de Mère Teresa, de Luther, d’Averroès et de Damas. Je trouve que c’est un très beau livre qui m’a ému.",options:[["Prénom seul de l’auteur",!0],["Verbe « dire » répété",!0],["Liste d’exemples sans l’idée qu’ils prouvent",!0],["Avis personnel",!0],["Arguments manquants (foi et raison, diversité)",!0],["Dépassement du nombre de mots",!1]],correction:["Il faut écrire « El Bachiri » ou « Mohamed El Bachiri » et varier les verbes (affirme, rappelle, soutient).","La liste « Mère Teresa, Luther, Averroès, Damas » doit être remplacée par les idées : une foi éclairée par la raison (A3) et la fraternité entre croyants (A4).","L’argument sur la diversité et l’éducation (A5) manque.","« Je trouve que c’est un très beau livre » est un avis : interdit dans un résumé."]},{id:"l5b",niveau:3,type:"defauts",consigne:"Résumé de Lina (200 mots max). Coche les défauts présents.",resume:"Dans Un jihad de l’amour (2017), Mohamed El Bachiri, veuf d’une victime de l’attentat de Maelbeek, appelle les musulmans à mener le jihad contre les terroristes. Selon lui, la vengeance est donc nécessaire pour honorer les victimes. Il affirme ensuite que le Coran doit être appliqué à la lettre. Enfin, il estime que Molenbeek est dangereuse.",options:[["Contresens sur la thèse",!0],["Contresens sur les arguments",!0],["Source absente",!1],["Avis personnel",!1],["Énonciation à la 1re personne",!1]],correction:["Le résumé est bien présenté (source, 3e personne, verbes variés), mais il dit presque l’inverse du livre.","L’auteur appelle à un jihad de l’amour, c’est-à-dire un effort sur soi contre la haine, pas à combattre les terroristes ; il rejette la vengeance.","Il défend une lecture du Coran qui tient compte du contexte, et il défend Molenbeek contre sa caricature.","Leçon : la fidélité passe avant la belle présentation."]}]}];var Ot=F(ge(),1);var Ne={theme:"La réponse à apporter à la haine et à la violence terroriste.",these:"Face à la haine, il faut répondre par l’amour : mener un « jihad de l’amour », c’est-à-dire un effort sur soi pour refuser la vengeance et reconnaître l’humanité de chacun.",args:[{id:"A1",court:"La vengeance reproduit le mal",arg:"Répondre à la violence par la violence ne fait que reproduire le mal.",expl:["Se venger, c’est commettre la même faute que les assassins et « se mettre à leur niveau ».","On ne répare pas une injustice par une autre injustice : la colère, même légitime, ne justifie jamais une atrocité.","La haine d’un camp nourrit l’extrémisme de l’autre : rien n’est résolu et ce sont les populations qui paient."],ex:["Ses fils, furieux, réclament vengeance : il leur répond qu’ils valent mieux que cela.","Le poème « Vengeance » : un frère veut lever une armée, l’autre lâche quatre colombes vers les quatre coins du monde.","Le conflit israélo-palestinien, où chaque violence alimente la violence d’en face.","La peine de mort, qu’il décrit comme un crime commis avec l’accord de la société."],fragments:["Fraternité","Vengeance","La peine de mort","Les auteurs","Politique"]},{id:"A2",court:"Le vrai sens du mot jihad",arg:"Le mot « jihad » désigne d’abord un effort sur soi-même, et non une guerre : les terroristes l’ont détourné.",expl:["Dans son sens premier, le jihad est l’effort que chacun mène contre ses propres passions et sa colère.","Le véritable « jihadiste » ne s’emporte pas : il cherche le savoir, va vers l’autre et reconnaît son humanité.","Mener un jihad de l’amour, c’est donc résister à la haine, ce qui demande plus de courage que la violence."],ex:["La définition du dictionnaire placée en tête du livre : le « grand jihad » contre ses passions, le « petit jihad » de défense.","Les paroles du Prophète « Ne te mets pas en colère » et son conseil de s’asseoir, puis de s’allonger pour calmer sa colère.","Sa propre formule : il se dit « jihadiste de l’amour » et préférerait mourir plutôt que haïr."],fragments:["Épigraphe","Jihad","Le cœur"]},{id:"A3",court:"Une foi éclairée par la raison",arg:"Une foi lue avec la raison et replacée dans son contexte historique mène à l’amour, pas à la violence.",expl:["Le Coran a un axe vertical (le lien avec Dieu, valable pour toujours) et un axe horizontal (des règles liées au VIIe siècle).","Les passages guerriers sont des paroles historiques : ils ne peuvent jamais servir à faire du mal à quelqu’un.","La raison et l’esprit critique sont un don de Dieu ; il n’y a rien de spirituel dans un meurtre ou une guerre.","L’islam a de nombreux visages : il rejette tous les fondamentalismes, y compris une laïcité qui exclut les croyants."],ex:["Le Prophète, mystique à La Mecque, devenu chef politique malgré lui à Médine.","Sa question d’enfant : pourquoi Mère Teresa n’irait-elle pas au paradis ?","Bagdad au Xe siècle, où les savants étudiaient les pensées grecque, indienne et perse.","La polygamie et le voile : selon lui, il faut d’abord être honnête et laisser les femmes décider.","Les fidèles qui prient au bord de l’autoroute pour être vus : la religion ne doit pas être un étendard."],fragments:["Le Coran","Réflexion","L’histoire","Honnêteté","Séparation de la religion et de l’État","La prière"]},{id:"A4",court:"Tous frères en humanité",arg:"Tous les êtres humains sont frères : l’humanité commune passe avant ce qui nous sépare.",expl:["Il se définit comme un être humain d’abord, un musulman ensuite.","Être humain implique trois valeurs : le caractère sacré de toute vie, le libre arbitre et la fraternité.","En allant au bout de sa propre religion, on rencontre celle des autres ; même l’auteur d’un attentat reste un frère « qui a pris le mauvais chemin ».","On peut perdre sa culture, sa foi ou son pays, mais pas son humanité."],ex:["L’affection reçue des enseignants de son école catholique.","Le verset du Coran selon lequel Dieu a fait des peuples et des tribus « pour qu’ils se connaissent ».","Les musulmans de Damas autorisés à prier dans une église ; Raphaël peignant le philosophe musulman Averroès au Vatican.","Les prières venues du monde entier, « au nom de tous les dieux », après la mort de Loubna.","Partager un repas avec quelqu’un qui ne pense pas comme soi."],fragments:["Mon école","Compassion","Fraternité","Appartenance","Humanité","Le Maroc"]},{id:"A5",court:"La diversité et l’éducation",arg:"La diversité est une richesse : c’est l’éducation, et non le repli ou les préjugés, qui permet de vivre ensemble.",expl:["Une communauté doit être « une porte et non une forteresse » : ni assimilation totale, ni repli sur soi.","La diversité doit devenir la norme dès l’enfance ; la sagesse commence par la curiosité et la connaissance de l’histoire.","Il faut apprendre aux jeunes à exprimer leurs émotions, notamment par l’art et la poésie.","Les préjugés et les images caricaturales des médias enferment les personnes dans une étiquette."],ex:["À six ans, un voisin le traite de « sale Marocain ».","Le Molenbeek des médias, présenté comme Kaboul, face au Molenbeek solidaire qu’il connaît.","La Belgique, « pays bâtard » et carrefour, et l’humour de la « belgitude ».","Le Maroc, sa tradition de tolérance, et Loubna citée par le roi comme exemple d’intégration réussie.","Ceux qui interdisent la musique, l’art et la poésie privent les êtres humains du plus beau d’eux-mêmes."],fragments:["Confiance en soi","Curiosité","Molenbeek","Le Maroc","Deux pays","L’éducation"]}],conclusion:"Le livre se termine par un appel lyrique : l’amour est la seule réponse à la haine, et l’auteur, conducteur de métro, parle pour tous ces musulmans ordinaires qu’on n’entend jamais.",autres:["Le récit du 22 mars 2016 et du deuil (la nuit, les médicaments, les enfants) : il émeut et montre d’où l’auteur parle.","Les souvenirs d’enfance, de jeunesse et la vie avec Loubna : ils construisent la crédibilité de l’auteur (son éthos).","Les textes lyriques et les poèmes adressés à Loubna : hommage et expression de la douleur."]},Dn=[{id:1,t:"Ouverture : une définition et une lettre",d:"La définition du mot « jihad » et une lettre d’amour à Loubna posent les deux fils du livre : le sens d’un mot et le deuil."},{id:2,t:"Le choc et le deuil",d:"Le jour de l’attentat, l’écriture la nuit sur son téléphone, l’insomnie, les médicaments : un homme qui se dit « mort » mais reste là pour ses enfants."},{id:3,t:"D’où il parle : origines, foi, esprit critique",d:"Fils d’immigrés marocains, il grandit à Molenbeek, fréquente une école catholique et apprend à questionner sa religion avec la raison."},{id:4,t:"Loubna, une histoire d’amour",d:"La rencontre, la vie de couple, le mariage, les naissances, puis un portrait-hommage de Loubna."},{id:5,t:"Répondre à l’attentat : ni haine ni vengeance",d:"Ce qu’il dit à ses fils, le refus de la vengeance et de la peine de mort, sa réponse aux auteurs des attentats."},{id:6,t:"Appartenances : Molenbeek, le Maroc, la Belgique",d:"Il défend Molenbeek contre sa caricature, raconte l’enterrement au Maroc, la rencontre avec le roi, et son attachement à ses deux pays."},{id:7,t:"Le manifeste : humanité, jihad, raison",d:"Il expose ses principes : appartenance à l’humanité, éducation, sens véritable du jihad, valeurs humanistes, honnêteté, séparation de la religion et de l’État."},{id:8,t:"Clôture : l’appel",d:"Des poèmes sur l’amour et une dernière strophe : il parle au nom de tous les musulmans ordinaires qu’on n’entend jamais."}],In=[{t:"Épigraphe : définition du mot « jihad »",en:"—",nl:"—",m:1,f:"argu",a:["A2"],d:"Un article de dictionnaire distingue l’effort contre ses passions (grand jihad) et la défense de l’islam (petit jihad)."},{t:"Lettre à Loubna",en:"(sans titre)",nl:"(zonder titel)",m:1,f:"lyrique",a:[],d:"Il dit à sa femme disparue que rien n’a plus de goût et se demande quoi dire aux enfants."},{t:"Ce jour-là",en:"That day",nl:"Die dag",m:2,f:"recit",a:[],d:"Récit très bref : il est en congé, elle prend le métro, il comprend tout en voyant qu’elle n’est plus connectée après 9 h 10."},{t:"Le soir",en:"The evening",nl:"’s Avonds",m:2,f:"lyrique",a:[],d:"Il écrit des textes sur son téléphone : écrire sur l’amour le rapproche de Loubna."},{t:"La nuit",en:"The night",nl:"’s Nachts",m:2,f:"recit",a:[],d:"La nuit, sous médicaments, il descend l’escalier pour donner le biberon au plus jeune de ses trois fils."},{t:"Ma voix",en:"My voice",nl:"Mijn stem",m:2,f:"lyrique",a:[],d:"Il se dit « un mort qui donne une leçon de vie », vivant seulement pour ses enfants."},{t:"Mes parents",en:"My parents",nl:"Mijn ouders",m:3,f:"recit",a:[],d:"Né en 1980, sixième de huit enfants, il retrace l’immigration de ses parents depuis le Rif et Oujda."},{t:"La langue",en:"Language",nl:"Taal",m:3,f:"recit",a:[],d:"Le français est sa langue maternelle ; ses parents parlaient tamazight entre eux."},{t:"La foi",en:"Faith",nl:"Geloof",m:3,f:"mixte",a:["A3"],d:"Musulman par naissance puis par conviction ; il a appris le Coran par cœur sans le comprendre, mais le trouve d’une grande poésie."},{t:"Mon école",en:"My school",nl:"Mijn school",m:3,f:"recit",a:["A4"],d:"Il fréquente une école primaire catholique et se sent proche des chrétiens."},{t:"Compassion",en:"Compassion",nl:"Mededogen",m:3,f:"argu",a:["A4"],d:"Il invite les musulmans à témoigner aux autres croyants et aux athées la même bienveillance que celle qu’il a reçue."},{t:"Le Coran",en:"The Koran",nl:"De Koran",m:3,f:"argu",a:["A3"],d:"Axe vertical et axe horizontal : les passages guerriers sont historiques et ne doivent jamais servir à nuire."},{t:"Réflexion",en:"Reflection",nl:"Reflectie",m:3,f:"argu",a:["A3"],d:"Enfant, il ne comprenait pas que Mère Teresa soit exclue du paradis ; réfléchir est un don de Dieu."},{t:"Curiosité",en:"Curiosity",nl:"Nieuwsgierigheid",m:3,f:"argu",a:["A5"],d:"La sagesse commence par la curiosité ; l’avenir commence par l’histoire."},{t:"L’histoire",en:"History",nl:"Geschiedenis",m:3,f:"argu",a:["A3"],d:"L’islam a de nombreux visages ; il admire Luther, qui a osé poser des questions."},{t:"Confiance en soi",en:"Self-confidence",nl:"Zelfvertrouwen",m:3,f:"mixte",a:["A5"],d:"Traité de « sale Marocain » à six ans, il n’a pas su répondre : l’école ne lui avait pas appris que la Belgique avait fait venir les immigrés."},{t:"Voyager",en:"Travel",nl:"Reizen",m:3,f:"recit",a:[],d:"Il quitte l’école sans diplôme à dix-huit ans et trie le courrier de nuit à l’aéroport."},{t:"La rencontre",en:"Meeting",nl:"Ontmoeting",m:4,f:"recit",a:[],d:"Loubna entre dans le magasin de téléphones où il travaille."},{t:"La relation",en:"Relationship",nl:"Relatie",m:4,f:"recit",a:[],d:"Fiançailles, mariage civil en 2004, installation à Schaerbeek."},{t:"Vivre ensemble",en:"Living together",nl:"Samenwonen",m:4,f:"mixte",a:[],d:"Il apprend à vivre à deux ; l’amour, comme la foi, se travaille."},{t:"Le mariage",en:"Marriage",nl:"Huwelijk",m:4,f:"lyrique",a:[],d:"Loubna est son amie, pas son trophée : « j’aime, donc je suis »."},{t:"La naissance",en:"Birth",nl:"Geboorte",m:4,f:"lyrique",a:[],d:"Les plus beaux moments de sa vie, devenus douloureux à évoquer."},{t:"À propos des attentats",en:"About the attacks",nl:"Over de aanslagen",m:5,f:"argu",a:["A1"],d:"Une seule phrase : le terroriste « le laisse froid ». Il refuse de lui donner de l’importance."},{t:"Bonté",en:"Goodness",nl:"Goedheid",m:4,f:"lyrique",a:[],d:"Portrait-hommage de Loubna, professeure de sport engagée, généreuse et opposée à la violence."},{t:"Les enfants",en:"The children",nl:"De kinderen",m:5,f:"recit",a:[],d:"Ce qu’il a dit à ses fils : maman est au ciel."},{t:"Fraternité",en:"Brotherhood",nl:"Broederschap",m:5,f:"argu",a:["A1","A4"],d:"« Nous sommes tous frères », même celui qui a commis le pire ; se venger, c’est se mettre à son niveau."},{t:"Vengeance",en:"Vengeance",nl:"Wraak",m:5,f:"argu",a:["A1"],d:"Poème : un père capitaine et ses trois fils débattent ; l’un veut une armée, l’autre envoie quatre colombes."},{t:"La peine de mort",en:"The death penalty",nl:"De doodstraf",m:5,f:"argu",a:["A1"],d:"La peine de mort est un crime commis avec l’accord de la société."},{t:"Le cœur",en:"The heart",nl:"Het hart",m:5,f:"argu",a:["A2"],d:"Rien ne justifie la haine ; l’amour est une ressource inépuisable."},{t:"Les auteurs",en:"The wrongdoers",nl:"De daders",m:5,f:"argu",a:["A1","A3"],d:"Il s’adresse au terroriste : si tuer des innocents est pour toi une justice, nous n’avons pas la même religion."},{t:"Molenbeek",en:"Molenbeek",nl:"Molenbeek",m:6,f:"argu",a:["A5"],d:"Le Molenbeek des médias fait plus peur que le vrai ; après la mort de Loubna, il y a trouvé une grande solidarité."},{t:"Le Maroc",en:"Morocco",nl:"Marokko",m:6,f:"mixte",a:["A4","A5"],d:"Loubna est enterrée à Salé ; le roi Philippe la cite comme exemple d’intégration ; le Maroc, terre de tolérance."},{t:"Deux pays",en:"Two countries",nl:"Twee landen",m:6,f:"mixte",a:["A5"],d:"Il aime la « belgitude » et la qualité de vie marocaine."},{t:"Profondeurs",en:"Depths",nl:"Diepten",m:6,f:"lyrique",a:[],d:"Le doute, le brouillard, la nécessité de rester debout pour ses enfants."},{t:"Beauté",en:"Beauty",nl:"Schoonheid",m:6,f:"lyrique",a:[],d:"Une phrase : la vie n’a plus le même goût, mais le coucher de soleil reste beau."},{t:"L’essentiel",en:"The essence",nl:"De essentie",m:6,f:"mixte",a:[],d:"L’essentiel n’est pas leur histoire d’amour, mais le message de paix que la mort de Loubna laisse."},{t:"Appartenance",en:"Belonging",nl:"Verbondenheid",m:7,f:"argu",a:["A4"],d:"Aller au bout de sa religion, c’est y trouver celle des autres ; le cosmopolitisme ne remplace pas la culture locale."},{t:"L’éducation",en:"Education",nl:"Onderwijs",m:7,f:"argu",a:["A5"],d:"Une communauté est une porte, pas une forteresse ; l’art et la poésie apprennent aux jeunes à exprimer leurs émotions."},{t:"Jihad",en:"Jihad",nl:"Jihad",m:7,f:"argu",a:["A2"],d:"Il se proclame « jihadiste de l’amour » et explique le sens premier du mot : l’effort sur soi."},{t:"Ce livre",en:"This book",nl:"Dit boek",m:7,f:"mixte",a:[],d:"Le livre est un poème, un hommage à Loubna, une réponse à l’humanité et non à la folie."},{t:"Humanité",en:"Humanity",nl:"Menselijkheid",m:7,f:"argu",a:["A4"],d:"Humain d’abord, musulman ensuite : caractère sacré de la vie, libre arbitre, fraternité."},{t:"Politique",en:"Politics",nl:"Politiek",m:7,f:"argu",a:["A1","A4"],d:"Il se met à la place des Palestiniens et des Israéliens : chaque mort est un mort de trop."},{t:"Honnêteté",en:"Honesty",nl:"Eerlijkheid",m:7,f:"argu",a:["A3"],d:"Polygamie et voile : être honnête et respecter le choix des femmes."},{t:"Séparation de la religion et de l’État",en:"Separation of religion and state",nl:"Scheiding van kerk en staat",m:7,f:"argu",a:["A3"],d:"Il défend la séparation, mais refuse une laïcité qui exclut les croyants : c’est aussi un fondamentalisme."},{t:"La prière",en:"Prayer",nl:"Gebed",m:7,f:"argu",a:["A3"],d:"La religion ne doit pas être un étendard ; la prière reste pour lui un moment de calme."},{t:"À la nuit (poème)",en:"At night",nl:"In de nacht",m:8,f:"lyrique",a:["A4"],d:"Une voix intérieure appelle à aimer son prochain, même mauvais."},{t:"L’amour (poème)",en:"Love",nl:"Liefde",m:8,f:"lyrique",a:["A4"],d:"Une litanie : l’amour ne peut mener à la haine ; « si tu es Amour, je partage ta religion »."},{t:"Strophe finale",en:"Final strophe",nl:"Slotstrofe",m:8,f:"mixte",a:[],d:"Sans le drame, on ne l’aurait jamais entendu : il était un musulman comme tant d’autres qu’on n’entend jamais."}],ys={recit:["Récit","Raconter des faits vécus (narratif)"],lyrique:["Lyrique","Exprimer des émotions, rendre hommage (lyrique, élégiaque)"],argu:["Argumentatif","Défendre une idée, convaincre"],mixte:["Mixte","Un récit ou une émotion qui sert aussi à argumenter"]},Wm=[{t:"Un livre traduit… d’une traduction",d:"D’après la postface, le livre réunit des textes écrits par Mohamed El Bachiri après les attentats et des propos recueillis par David Van Reybrouck lors d’un long entretien, les 2 et 3 février 2017, à Anderlecht et à Molenbeek. Les textes, d’abord en français, ont été traduits en néerlandais puis retravaillés : l’édition néerlandaise (mars 2017) est la première parue. La version anglaise est traduite du néerlandais.",lecon:"Le sens global (les idées) reste stable d’une langue à l’autre ; les mots exacts, eux, changent. C’est exactement ce que fait un résumé : garder les idées, pas les mots."},{t:"« Jihad » : effort ou lutte ?",d:"En néerlandais, le mot jihad est expliqué par « inspanning », qui signifie « effort ». En anglais, il devient « struggle », qui signifie plutôt « lutte, combat ». Le dictionnaire cité en ouverture donne les deux sens : effort et lutte.",lecon:"La nuance compte : « effort sur soi » insiste sur le travail intérieur, « lutte » garde une idée de combat. Pour ton résumé, la formulation la plus fidèle à la thèse est « un effort sur soi-même contre la haine »."},{t:"Le détail de 9 h 10",d:"En néerlandais, il comprend le drame en voyant que Loubna n’a plus été connectée après 9 h 10. La phrase anglaise est ambiguë et peut faire croire à un métro de 9 h 10.",lecon:"Un détail de récit peut se brouiller d’une traduction à l’autre. Bonne nouvelle : ce genre de détail n’a de toute façon pas sa place dans un résumé argumentatif."},{t:"« Les auteurs » ou « les malfaiteurs » ?",d:"Le fragment s’intitule « De daders » en néerlandais (les auteurs des faits) et « The wrongdoers » en anglais (ceux qui font le mal). En néerlandais, il dit qu’il adresserait sa phrase « à lui », un terroriste précis ; en anglais, « à eux ».",lecon:"Le néerlandais rend l’adresse plus personnelle : il parle d’homme à homme à celui qui a tué. Cela renforce l’argument de la fraternité : même l’assassin reste quelqu’un à qui l’on parle."},{t:"Molenbeek : « pas seulement » ou « pas directement » en Syrie ?",d:"Aux jeunes qui veulent quitter Molenbeek, la version néerlandaise dit en substance : ne va pas uniquement en Syrie, va aux quatre coins du monde. La version anglaise dit plutôt : ne va pas directement en Syrie.",lecon:"Le message reste le même (voyager pour découvrir et admirer, pas pour détruire), mais la nuance diffère. Un résumé fidèle retient l’idée commune aux deux versions."},{t:"La haine « inutile » ou « impossible » ?",d:"Dans le fragment « Le cœur », la version néerlandaise affirme que rien ne justifie la haine et que rien ne mènera à la haine ; l’anglaise, que rien ne rend la haine nécessaire.",lecon:"Les deux traductions défendent la même thèse : la haine n’a aucune justification. Quand deux versions divergent, cherche ce qu’elles ont en commun : c’est le noyau de l’idée."},{t:"Une identité en trois mots",d:"La quatrième de couverture néerlandaise présente l’auteur comme « Belge marocain, musulman et Molenbeekois ». En français, on retrouve la formule « belgo-marocain, musulman et molenbeekois ».",lecon:"Ces trois appartenances correspondent chacune à un préjugé que le livre démonte : c’est le point de départ de l’argument sur la diversité (A5)."}],$m=[["Titre","Un jihad de l’amour (titre original : Een jihad van liefde ; en anglais : A Jihad for Love)"],["Auteur","Mohamed El Bachiri, né en 1980, Bruxellois d’origine marocaine, ancien conducteur de métro, père de trois garçons"],["Mise en forme","David Van Reybrouck, écrivain flamand, a recueilli ses propos et organisé les textes"],["Parution","2017 : d’abord en néerlandais (De Bezige Bij), puis en français (JC Lattès) et en anglais"],["Genre","Un essai-témoignage : des fragments courts qui mêlent récit, poésie et argumentation"],["Contexte","Le 22 mars 2016, des attentats frappent l’aéroport de Bruxelles et la station de métro Maelbeek. Loubna Lafquiri, l’épouse de l’auteur, meurt dans le métro."],["Origine du livre","Fin 2016, à la télévision flamande, Mohamed El Bachiri appelle à un « jihad de l’amour ». Sa prise de parole est massivement partagée ; le livre la prolonge."],["Destinataires","Tous les lecteurs, et en particulier les jeunes musulmans d’Europe, qu’il invite à une lecture humaniste de l’islam"]],zn=[{id:"court",titre:"Résumé modèle en 150 mots environ",paras:["Dans son essai-témoignage Un jihad de l’amour (2017), Mohamed El Bachiri, dont l’épouse a été tuée lors de l’attentat du métro de Bruxelles en 2016, s’interroge sur la réponse à apporter à la haine terroriste. Il soutient qu’il faut lui opposer l’amour.","D’abord, il affirme que la vengeance ne fait que reproduire le mal : répondre à la violence par la violence, c’est commettre la même faute que les assassins.","Ensuite, il rappelle que le jihad désigne avant tout un effort sur soi contre ses passions, et non une guerre.","Par ailleurs, il défend une foi éclairée par la raison, qui replace les textes religieux dans leur contexte et refuse tout fondamentalisme.","De plus, il souligne que tous les êtres humains sont frères, au-delà de leurs croyances.","Enfin, il estime que l’éducation et l’ouverture à la diversité, et non le repli, permettent de vivre ensemble."]},{id:"long",titre:"Résumé modèle en 250 mots environ",paras:["Dans Un jihad de l’amour (2017), essai-témoignage mis en forme par David Van Reybrouck, Mohamed El Bachiri, Bruxellois musulman dont l’épouse Loubna a été tuée lors de l’attentat du métro Maelbeek en 2016, s’interroge sur la manière de répondre à la haine terroriste. Il défend l’idée qu’il faut mener un « jihad de l’amour », c’est-à-dire un effort sur soi pour refuser la haine.","Tout d’abord, l’auteur affirme que la vengeance ne fait que prolonger le mal. Répondre à la violence par la violence reviendrait à commettre la même faute que les assassins, et la haine d’un camp nourrit toujours celle de l’autre. C’est pourquoi il rejette aussi la peine de mort.","Ensuite, il rappelle que le mot « jihad » désigne d’abord un combat intérieur contre ses passions et sa colère. Les terroristes ont détourné ce sens : le véritable courage consiste à garder son calme et à aller vers l’autre.","Par ailleurs, il plaide pour une foi éclairée par la raison. Selon lui, les règles et les passages guerriers des textes religieux doivent être replacés dans leur contexte historique et ne peuvent jamais justifier un meurtre. Il refuse tous les fondamentalismes.","De plus, il soutient que l’humanité commune passe avant les différences : chaque vie est sacrée et tous les êtres humains sont frères.","Enfin, il estime que la diversité est une richesse et que l’éducation, la curiosité et l’art, plutôt que le repli ou les préjugés, permettent de vivre ensemble."]}],Ya=["Raconter le jour de l’attentat en détail (l’heure, la couverture, l’escalier) : c’est du récit, pas un argument.","Décrire Loubna (son sourire, son métier, leur rencontre) : c’est un hommage, pas un argument.","Recopier les poèmes ou les phrases du livre : il faut reformuler.","Donner ton avis (« Je trouve que Mohamed a raison ») : un résumé est neutre.","Écrire « Mohamed dit que… » à chaque phrase : utilise son nom de famille (El Bachiri) et des verbes précis (affirme, soutient, dénonce…).","Mettre tous les exemples (Mère Teresa, Luther, Averroès, Damas…) : garde les idées ; un exemple seulement s’il est indispensable pour comprendre."];var Do={numerique:"Numérique et écrans",ecole:"École et jeunesse",vivre:"Vivre ensemble",justice:"Justice et violence",expression:"Libertés et expression",egalite:"Égalité femmes-hommes",environnement:"Environnement et consommation",culture:"Culture, art et sport",citoyennete:"Citoyenneté"},oe=(e,t,n,r,s,a,i={})=>({id:e,domaine:t,titre:n,sujets:r,pour:s,contre:a,...i}),pt=[oe("reseaux","numerique","Les réseaux sociaux et les adolescents",["Faut-il interdire les réseaux sociaux avant 15 ans ?","Les réseaux sociaux rapprochent-ils ou isolent-ils ?"],[["Ils favorisent le cyberharcèlement, qui suit l’élève jusque chez lui.","Des moqueries partagées dans un groupe de classe, le soir."],["Ils nuisent au sommeil et à la concentration.","Les notifications tard dans la nuit."],["Ils imposent des modèles irréalistes qui abîment l’estime de soi.","Les photos retouchées d’influenceurs."],["Leurs algorithmes sont conçus pour capter le plus de temps possible.","Le défilement infini des vidéos courtes."]],[["Ils permettent de garder le lien avec ses amis et sa famille éloignée.","Un appel vidéo avec un cousin à l’étranger."],["Ils donnent accès à l’information et à des communautés d’intérêt.","Un groupe d’entraide pour apprendre à dessiner."],["Ils offrent une tribune aux jeunes pour s’engager.","Les mobilisations pour le climat organisées en ligne."],["Interdire ne sert à rien : il vaut mieux éduquer à un usage responsable.","Des cours d’éducation aux médias."]]),oe("telephone","ecole","Le téléphone portable à l’école",["Faut-il interdire le téléphone portable à l’école ?"],[["Il empêche de se concentrer en classe.","Une notification pendant un exercice."],["Il facilite la triche et le cyberharcèlement.","Une photo prise en cachette au vestiaire."],["Il réduit les échanges réels à la récréation.","Des élèves côte à côte, chacun sur s ux."],["Beaucoup de jeunes ne s’intéressent pas à la politique.","L’abstention des primo-votants."]]),oe("litterature-belge","culture","La littérature belge francophone",["Y a-t-il une spécificité de la littérature belge francophone ?"],[["Elle mélange les cultures, au carrefour du monde latin et germanique.","Une langue française nourrie d’autres influences."],["Elle cultive l’humour, l’autodérision et le goût de l’étrange.","Le surréalisme belge."],["Elle s’est construite en se démarquant de Paris.","Des auteurs qui revendiquent leur belgitude."]],[["Beaucoup d’auteurs belges publient à Paris et sont lus comme français.","Des prix littéraires français remportés."],["La langue française est commune : la frontière est floue.","Des thèmes universels."],["Parler de spécificité risque d’enfermer les auteurs dans une étiquette.","Un auteur qui refuse d’être « régional »."]],{cess:"2015"})];var Wh=[["Quelle est la différence entre thème et thèse ?","Le thème est le sujet (sans avis) ; la thèse est l’opinion défendue sur ce sujet."],["Comment distinguer un argument d’un exemple ?","L’argument est général et répond à « pourquoi ? » ; l’exemple est particulier (nom, lieu, date, chiffre) et répond à « par exemple ? »."],["Quelles sont les 6 étapes de la procédure du schéma (p. 78) ?","1. Lire et comprendre. 2. Repérer thème et thèse. 3. Repérer les parties qui ont une autre fonction. 4. Repérer arguments et exemples. 5. Tracer le schéma (hiérarchiser, reformuler). 6. Rédiger le résumé."],["Quelle est la structure du schéma, de A à E ?","A. Thème · B. Thèse · C. Arguments · D. Explications (développement) · E. Exemples."],["Où place-t-on le contre-argument dans le schéma ?","Dans une case à part, sous la thèse, avec la réfutation de l’auteur."],["Trois techniques pour reformuler ?","Raccourcir, généraliser, nominaliser (sans changer le sens)."],["Comment remonter d’un exemple à l’argument ?","En se demandant : « qu’est-ce que cet exemple prouve ? », et en formulant la réponse de façon générale."],["Que contient l’introduction d’un résumé ?","La source (auteur, titre, date, genre), le thème et la thèse."],["Comment organise-t-on le développement d’un résumé ?","Dans l’ordre du schéma : un paragraphe (ou une phrase) par argument, reliés par des connecteurs logiques."],["À quelle personne rédige-t-on un résumé ?","À la 3e personne : on change d’énonciateur."],["Comment désigne-t-on l’auteur dans le résumé ?","Par son nom de famille, ou son prénom et son nom ; jamais par son prénom seul."],["Garde-t-on les exemples dans un résumé ?","En général non : on garde l’idée. Un exemple seulement s’il est indispensable pour comprendre."],["Que signifie « neutralité » dans un résumé ?","On transmet l’avis de l’auteur sans donner le sien."],["Quels sont les critères d’un bon résumé ?","Pertinence, fidélité, intelligibilité, recevabilité (consigne), correction de la langue."],["Cite trois erreurs fréquentes dans un résumé.","Recopier, garder les exemples à la place des arguments, donner son avis (aussi : dépasser le nombre de mots, résumer mécaniquement)."],["Comment déplier une ligne de schéma en paragraphe ?","Argument (connecteur d’énumération) → explication (en effet) → exemple (par exemple) → lien avec la thèse."],["Que contient la conclusion d’un texte argumentatif ?","La thèse reformulée (avec un bilan des arguments) et une ouverture."],["Qu’est-ce que la recevabilité ?","Le respect de la consigne : nombre de mots, destinataire, forme demandée."],["Qu’est-ce que l’intelligibilité ?","Un lecteur qui n’a pas lu le texte source comprend tout le résumé."],["Comment résume-t-on un livre fait de fragments ?","On lit par mouvements, on regroupe les fragments qui défendent la même idée (plusieurs fragments = un argument) et on écarte récits et textes lyriques."]],$h=[["Verbe pour montrer que l’auteur admet une part de l’avis adverse ?","Admettre, concéder, reconnaître."],["Verbe pour une critique ?","Dénoncer, critiquer, déplorer, regretter, condamner." ents, plus tu les reconnais vite dans un texte."})]})]})}var Es=F(ge(),1);var De=F(ge(),1);var Ls={amorce:{t:"Autre fonction",c:"var(--c-autre)",d:"Accroche, contexte, anecdote, citation : la phrase ne défend pas directement la thèse."},these:{t:"Thèse",c:"var(--c-these)",d:"L'opinion que l'auteur défend."},arg:{t:"Argument",c:"var(--c-arg)",d:"Une raison qui soutient la thèse."},expl:{t:"Explication",c:"var(--c-expl)",d:"Le développement de l'argument : il précise, justifie, montre comment."},ex:{t:"Exemple",c:"var(--c-ex)",d:"Un cas concret qui illustre l'argument."},contre:{t:"Contre-argument",c:"var(--c-contre)",d:"Une idée opposée, que l'auteur cite ou concède (certes…, on objecte que…)."},refut:{t:"Réfutation",c:"var(--c-refut)",d:"La réponse de l'auteur au contre-argument."},concl:{t:"Conclusion",c:"var(--c-concl)",d:"Le bilan ou l'ouverture : la thèse est souvent reformulée."}};var ft=[{id:"t1",niveau:1,domaine:"ecole",titre:"Ranger son téléphone pour mieux apprendre",auteur:"Laure Martin",source:"chronique d’une enseignante (auteur fictif), 2025",paras:[[["amorce","Dans beaucoup d’écoles, la place du téléphone portable fait débat."],["these","Selon moi, il devrait être interdit pendant les cours."]],[["arg","D’abord, le téléphone empêche les élèves de se concentrer."],["expl","Chaque notification attire l’attention, et il faut ensuite plusieurs minutes pour se remettre au travail."],["ex","Par exemple, un élève qui reçoit trois messages pendant un exercice de mathématiques perd le fil de son raisonnement à chaque fois."]],[["arg","Ensuite, l’interdiction protège les élèves du cyberharcèlement."],["expl","Sans téléphone en classe, il devient impossible de filmer un camarade à son insu ou de l’humilier sur un groupe de discussion pendant les cours."],["ex","Une photo prise en cachette au cours de sport peut ainsi circuler dans toute l’école en quelques minutes."]],[["concl","En somme, ranger son téléphone n’est pas une punition : c’est une manière de mieux apprendre et de mieux se respecter."]]],schema:{theme:"Le téléphone portable à l’école.",these:"Le téléphone portable devrait être interdit pendant les cours.",args:[{arg:"Il empêche de se concentrer.",expl:["Chaque notification détourne l’attention et il faut du temps pour se remettre au travail."],ex:["L’élève qui reçoit trois messages pendant un exercice de mathématiques."]},{arg:"L’interdiction protège du cyberharcèlement.",expl:["Sans téléphone, on ne peut ni filmer ni humilier un camarade pendant les cours."],ex:["La photo prise en cachette au cours de sport, partagée dans toute l’école."]}]},resume:{max:50,texte:["Dans sa chronique, Laure Martin soutient que le téléphone portable devrait être interdit pendant les cours. D’une part, il nuit à la concentration, car chaque notification détourne l’attention. D’autre part, son interdiction protège les élèves du cyberharcèlement."]}},{id:"t2",niveau:1,domaine:"animaux",titre:"Des zoos pour protéger",auteur:"Hugo Lambert",source:"carte blanche d’un biologiste (auteur fictif), 2024",paras:[[["amorce","Chaque année, des millions de visiteurs se pressent devant les enclos des zoos."],["contre","Certes, un animal en captivité ne vit pas comme dans la nature, et certains zoos d’autrefois offraient des conditions indignes."],["these","Pourtant, les zoos modernes restent utiles, à condition d’être d’abord des lieux de protection."]],[["arg","Premièrement, ils participent à la sauvegarde des espèces menacées."],["expl","Grâce à des programmes d’élevage coordonnés entre établissements, ils maintiennent des populations en bonne santé et peuvent parfois réintroduire des animaux dans leur milieu naturel."],["ex","C’est ainsi que l’oryx d’Arabie, presque disparu à l’état sauvage, a retrouvé le désert grâce à des animaux nés en captivité."]],[["arg","Deuxièmement, les zoos sensibilisent le public."],["expl","Voir un animal en vrai crée une émotion qu’aucun documentaire ne remplace, et cette émotion donne envie de protéger la nature."],["ex","Beaucoup de parcs proposent d’ailleurs des ateliers où les enfants découvrent les menaces qui pèsent sur la forêt tropicale."]],[["arg","Enfin, ils financent la protection sur le terrain."],["expl","Une partie du prix des billets soutient des projets dans les pays où vivent ces espèces."]],[["concl","Plutôt que de fermer les zoos, il faut donc exiger qu’ils deviennent de véritables arches de protection."]]],schema:{theme:"L’utilité des zoos.",these:"Les zoos modernes restent utiles s’ils sont d’abord des lieux de protection.",contre:"Concession : la captivité n’est pas la vie sauvage et certains zoos anciens étaient indignes.",args:[{arg:"Ils sauvent des espèces menacées.",expl:["Programmes d’élevage coordonnés, réintroductions."],ex:["L’oryx d’Arabie réintroduit dans le désert."]},{arg:"Ils sensibilisent le public.",expl:["Voir un animal en vrai crée une émotion qui donne envie de protéger la nature."],ex:["Les ateliers pour enfants sur la forêt tropicale."]},{arg:"Ils financent la protection sur le terrain.",expl:["Une partie du prix des billets soutient des projets locaux."],ex:[]}]},resume:{max:70,texte:["Dans une carte blanche, le biologiste Hugo Lambert reconnaît que la captivité n’est pas la vie sauvage, mais il estime que les zoos modernes restent utiles s’ils se consacrent à la protection des animaux. En effet, ils sauvent des espèces menacées grâce à l’élevage et aux réintroductions. De plus, ils sensibilisent le public à la nature. Enfin, ils financent des projets de protection sur le terrain."]}},{id:"t3",niveau:2,domaine:"citoyennete",titre:"Voter à seize ans",auteur:"Samira Haddad",source:"éditorial d’un magazine pour adolescents (auteur fictif), 2025",paras:[[["amorce","En Belgique, les jeunes de seize et dix-sept ans ont pu voter pour la première fois aux élections européennes de 2024."],["these","Il faudrait aller plus loin et leur accorder le droit de vote à toutes les élections."]],[["arg","La première raison est que les décisions politiques concernent directement les jeunes."],["expl","Climat, enseignement, logement, emploi : ce sont eux qui vivront le plus longtemps avec les conséquences des choix faits aujourd’hui."],["ex","Les grandes marches pour le climat ont d’ailleurs montré que de nombreux adolescents se passionnent pour ces questions."]],[["arg","La seconde raison est que voter tôt crée une habitude."],["expl","À seize ans, on vit souvent encore chez ses parents et on fréquente l’école : c’est le moment idéal pour apprendre à s’informer et à voter, avec l’aide des enseignants."],["ex","Un cours de citoyenneté peut, par exemple, comparer les programmes des partis juste avant le scrutin."]],[["contre","On objecte souvent que les jeunes seraient trop influençables."],["refut","Mais les adultes aussi subissent des influences, et personne ne songe pour autant à leur retirer le droit de vote."]],[["concl","Faire confiance aux jeunes, c’est préparer des citoyens plus engagés."]]],schema:{theme:"Le droit de vote des jeunes de seize ans.",these:"Il faut accorder le droit de vote à seize ans à toutes les élections.",contre:"Contre-argument : les jeunes seraient trop influençables. Réfutation : les adultes aussi sont influencés et gardent le droit de vote.",args:[{arg:"Les décisions politiques concernent directement les jeunes.",expl:["Ils vivront le plus longtemps avec les conséquences des choix actuels (climat, école, logement, emploi)."],ex:["Les marches des jeunes pour le climat."]},{arg:"Voter tôt crée une habitude.",expl:["À seize ans, on est encore à l’école et entouré : moment idéal pour apprendre à s’informer."],ex:["Comparer les programmes des partis au cours de citoyenneté."]}]},resume:{max:80,texte:["Dans un éditorial, Samira Haddad plaide pour que les jeunes de seize ans puissent voter à toutes les élections. D’abord, elle souligne que les décisions politiques les concernent directement, puisqu’ils vivront longtemps avec leurs conséquences. Ensuite, elle affirme que voter tôt crée une habitude, encouragée par l’école. Enfin, elle réfute l’idée que les jeunes seraient trop influençables : les adultes le sont aussi."]}},{id:"t4",niveau:2,domaine:"consommation",titre:"La mode jetable nous coûte cher",auteur:"Thomas Delvaux",source:"chronique d’un journaliste (auteur fictif), 2025",paras:[[["amorce","Samedi, Inès a acheté cinq t-shirts pour le prix d’une pizza."],["amorce","Trois semaines plus tard, deux d’entre eux sont déjà déformés et finissent au fond d’une armoire."],["amorce","Cette scène banale résume le succès de la « fast fashion », ces collections bon marché renouvelées sans cesse."],["these","Ce modèle, qui semble avantageux, est en réalité un piège qu’il faut refuser."]],[["arg","Il abîme d’abord la planète."],["expl","Produire des vêtements en masse consomme énormément d’eau, d’énergie et de produits chimiques, puis les vêtements usés s’entassent dans des décharges."],["ex","Selon plusieurs estimations, la fabrication d’un seul jean peut demander plusieurs milliers de litres d’eau."]],[["arg","Il repose ensuite sur l’exploitation de travailleurs."],["expl","Pour vendre à prix cassés, les marques font fabriquer leurs vêtements là où les salaires sont les plus bas et où la sécurité est souvent négligée."],["ex","En 2013, l’effondrement du Rana Plaza, un immeuble d’ateliers textiles au Bangladesh, a fait plus de mille morts."]],[["arg","Enfin, l’économie promise est une illusion."],["expl","Un vêtement qui se déforme après trois lavages doit être remplacé : au bout du compte, on dépense souvent davantage qu’avec une pièce solide."]],[["contre","On dira que la mode à petit prix permet aux familles modestes de s’habiller."],["refut","C’est vrai, mais la seconde main et les vêtements durables reviennent souvent moins cher à l’usage."]],[["concl","Avant d’acheter, posons-nous donc une question simple : ce vêtement, le porterai-je au moins trente fois ?"]]],schema:{theme:"La mode jetable (fast fashion).",these:"La mode jetable, qui semble avantageuse, est un piège qu’il faut refuser.",contre:"Contre-argument : elle permet aux familles modestes de s’habiller. Réfutation : la seconde main et les vêtements durables coûtent souvent moins cher à l’usage.",args:[{arg:"Elle abîme la planète.",expl:["Production massive : eau, énergie, produits chimiques, déchets."],ex:["Plusieurs milliers de litres d’eau pour un jean."]},{arg:"Elle exploite des travailleurs.",expl:["Fabrication là où les salaires sont bas et la sécurité négligée."],ex:["L’effondrement du Rana Plaza (2013)."]},{arg:"L’économie promise est une illusion.",expl:["Les vêtements fragiles doivent être remplacés : on dépense plus."],ex:[]}],autres:["L’anecdote d’Inès et de ses cinq t-shirts (accroche).","La question finale au lecteur (ouverture)."]},resume:{max:100,texte:["Dans sa chronique, Thomas Delvaux soutient que la mode jetable, apparemment avantageuse, est un piège à refuser. Premièrement, elle nuit à l’environnement, car sa production massive gaspille l’eau et l’énergie et génère des déchets. Deuxièmement, elle repose sur l’exploitation de travailleurs mal payés et mal protégés. Troisièmement, l’économie promise est illusoire, puisque des vêtements fragiles doivent vite être remplacés. Le journaliste admet que ces vêtements aident les familles modestes, mais il rappelle que la seconde main et les pièces durables reviennent moins cher à l’usage."]}},{id:"t5",niveau:3,domaine:"expression",titre:"Rire de tout, mais pas n’importe comment",auteur:"Clara Renard",source:"billet d’humeur (auteur fictif), 2024",paras:[[["amorce","« On peut rire de tout, mais pas avec n’importe qui », disait l’humoriste Pierre Desproges."],["amorce","La formule est célèbre, mais elle laisse une question ouverte : l’humour a-t-il des limites ?"],["these","Je crois qu’on peut rire de tout, à condition que le rire ne serve pas à écraser les plus faibles."]],[["arg","L’humour est d’abord une liberté précieuse, car il permet de critiquer les puissants."],["expl","En faisant rire d’un dirigeant, le caricaturiste montre ses défauts plus efficacement qu’un long discours, et le rend moins intimidant."],["ex","Ce n’est pas un hasard si, dans les dictatures, les caricaturistes sont parmi les premiers emprisonnés."]],[["arg","Le rire aide aussi à supporter le malheur."],["expl","Rire d’une épreuve, c’est reprendre un peu de pouvoir sur elle et se sentir moins seul."],["ex","Bien des malades et des soignants racontent que l’humour les a aidés à traverser les moments les plus durs."]],[["contre","Certains en concluent que tout doit être permis, au nom de la liberté."],["refut","Pourtant, une blague qui vise une personne pour ce qu’elle est (sa couleur de peau, son handicap, sa religion) ne critique aucun pouvoir : elle humilie quelqu’un qui en a déjà peu."],["ex","Dans une cour de récréation, la moquerie répétée sur l’accent d’un élève n’a rien de drôle pour lui ; c’est du harcèlement."]],[["arg","La limite n’est donc pas le sujet, mais la cible."],["expl","Rire d’une situation, d’une idée ou d’un abus de pouvoir libère ; rire pour rabaisser quelqu’un enferme."]],[["concl","Avant de lancer une blague, il suffit peut-être de se demander : de qui est-ce que je ris, et qui en souffrira ?"]]],schema:{theme:"Les limites de l’humour.",these:"On peut rire de tout, à condition que le rire ne serve pas à écraser les plus faibles.",contre:"Contre-argument : tout devrait être permis au nom de la liberté. Réfutation : la blague qui vise une personne pour ce qu’elle est humilie sans critiquer aucun pouvoir (ex. : moquerie sur l’accent = harcèlement).",args:[{arg:"L’humour permet de critiquer les puissants.",expl:["La caricature montre les défauts d’un dirigeant et le rend moins intimidant."],ex:["Les caricaturistes emprisonnés dans les dictatures."]},{arg:"Le rire aide à supporter le malheur.",expl:["Rire d’une épreuve, c’est reprendre du pouvoir sur elle."],ex:["Les malades et les soignants que l’humour aide."]},{arg:"La limite n’est pas le sujet mais la cible.",expl:["Rire d’une situation libère ; rire pour rabaisser quelqu’un enferme."],ex:[]}],autres:["La citation de Pierre Desproges (accroche).","La question finale au lecteur."]},resume:{max:110,texte:["Dans un billet d’humeur, Clara Renard se demande si l’humour a des limites. Elle soutient qu’on peut rire de tout, pourvu que le rire n’écrase pas les plus faibles. D’abord, l’humour est une liberté précieuse, car il permet de critiquer les puissants. Ensuite, il aide à supporter les épreuves. Toutefois, elle refuse l’idée que tout serait permis : une plaisanterie qui vise quelqu’un pour ce qu’il est ne critique aucun pouvoir, elle humilie. Elle conclut que la limite de l’humour ne tient pas au sujet, mais à sa cible."]}},{id:"t6",niveau:3,domaine:"numerique",titre:"L’intelligence artificielle à l’école : apprendre plutôt qu’interdire",auteur:"Nicolas Verbeke",source:"opinion d’un directeur d’école (auteur fictif), 2025",paras:[[["amorce","Depuis que les assistants d’intelligence artificielle (IA) rédigent des textes en quelques secondes, beaucoup d’enseignants s’inquiètent."],["contre","Leur crainte est compréhensible : un élève peut faire écrire son devoir par une machine sans rien apprendre."],["these","Interdire l’IA serait pourtant une erreur ; l’école doit au contraire apprendre aux élèves à s’en servir avec esprit critique."]],[["arg","D’abord, l’IA fait déjà partie du monde dans lequel les jeunes vivront et travailleront."],["expl","L’ignorer à l’école, c’est laisser chacun l’utiliser seul, sans règles et sans recul."],["ex","Les traducteurs automatiques et les correcteurs d’orthographe, longtemps vus comme des tricheries, sont aujourd’hui des outils ordinaires."]],[["arg","Ensuite, bien utilisée, l’IA peut aider à apprendre."],["expl","Elle peut réexpliquer une notion autrement, proposer des exercices supplémentaires ou commenter un brouillon, à condition que l’élève fasse lui-même le travail."],["ex","Un élève qui ne comprend pas une règle de grammaire peut lui demander trois exemples de plus, puis vérifier avec son cours."]],[["arg","Surtout, l’IA se trompe, et c’est précisément pour cela qu’il faut l’enseigner."],["expl","Elle produit des phrases très sûres d’elles, même quand elles sont fausses : seul un utilisateur formé peut repérer l’erreur."],["ex","Il lui arrive par exemple d’inventer une source ou une citation qui n’existe pas."]],[["refut","Quant au risque de tricherie, il oblige surtout à repenser les évaluations : travail en classe, brouillons à rendre, oral où l’élève explique sa démarche."]],[["concl","L’IA ne remplacera pas l’effort d’apprendre ; à l’école de faire en sorte qu’elle le soutienne au lieu de l’éviter."]]],schema:{theme:"La place de l’intelligence artificielle à l’école.",these:"Il ne faut pas interdire l’IA à l’école, mais apprendre aux élèves à l’utiliser avec esprit critique.",contre:"Contre-argument : l’IA permet de tricher sans rien apprendre. Réfutation : il faut repenser les évaluations (travail en classe, brouillons, oral).",args:[{arg:"L’IA fait déjà partie du monde des jeunes.",expl:["L’ignorer, c’est laisser chacun l’utiliser seul, sans règles."],ex:["Traducteurs et correcteurs, autrefois vus comme tricheries, devenus ordinaires."]},{arg:"Bien utilisée, elle aide à apprendre.",expl:["Réexpliquer, proposer des exercices, commenter un brouillon, si l’élève fait le travail."],ex:["Demander trois exemples de plus d’une règle de grammaire."]},{arg:"Elle se trompe, donc il faut l’enseigner.",expl:["Elle affirme des choses fausses avec assurance : il faut un utilisateur formé."],ex:["Elle peut inventer une source ou une citation."]}]},resume:{max:120,texte:["Dans un texte d’opinion, Nicolas Verbeke admet que l’intelligence artificielle facilite la tricherie, mais il estime que l’école doit enseigner son usage critique plutôt que l’interdire. Premièrement, l’IA fait déjà partie du monde des jeunes : l’ignorer reviendrait à les laisser l’utiliser sans règles. Deuxièmement, bien employée, elle peut soutenir l’apprentissage, à condition que l’élève fournisse lui-même l’effort. Troisièmement, comme elle commet des erreurs présentées avec assurance, seuls des utilisateurs formés peuvent les repérer. Selon lui, le risque de fraude impose surtout de transformer les évaluations."]}},{id:"t7",niveau:3,domaine:"justice",titre:"Punir sans se venger",auteur:"Élise Moreau",source:"tribune d’une juriste (auteur fictif), 2025",paras:[[["amorce","Après un crime terrible, la colère est légitime ; il arrive même qu’on entende réclamer « œil pour œil, dent pour dent »."],["these","Pourtant, si la justice doit sanctionner les crimes, elle ne doit jamais devenir une vengeance."]],[["arg","La vengeance, d’abord, n’a pas de fin."],["expl","Chaque représailles appelle une nouvelle représailles, si bien que la violence se transmet d’une génération à l’autre."],["ex","Les vendettas, ces guerres entre familles qui ont duré des décennies, en sont l’illustration."]],[["arg","La justice, au contraire, protège aussi les victimes."],["expl","Le procès établit publiquement la vérité, désigne les responsables et donne aux victimes une place pour être entendues."],["ex","Lors du procès des attentats de Bruxelles, en 2022 et 2023, de nombreuses victimes et proches sont venus témoigner devant la cour d’assises."]],[["arg","Enfin, une peine juste doit aussi préparer l’avenir."],["expl","Punir n’a de sens que si cela protège la société et, quand c’est possible, permet au coupable de comprendre le mal qu’il a fait."],["ex","En Belgique, des médiations permettent ainsi à des victimes qui le souhaitent de rencontrer l’auteur des faits, accompagnées par des professionnels."]],[["contre","Certains estiment qu’une peine extrême, comme la peine de mort, découragerait les criminels."],["refut","Rien ne montre pourtant que les pays qui l’appliquent connaissent moins de crimes graves ; et une erreur judiciaire y devient irréparable."]],[["concl","Refuser la vengeance n’est pas une faiblesse : c’est ce qui distingue une société de droit de la loi du plus fort."]]],schema:{theme:"La différence entre justice et vengeance.",these:"La justice doit sanctionner les crimes, mais ne doit jamais devenir une vengeance.",contre:"Contre-argument : une peine extrême (la peine de mort) dissuaderait les criminels. Réfutation : rien ne le prouve, et une erreur judiciaire devient irréparable.",args:[{arg:"La vengeance n’a pas de fin.",expl:["Chaque représailles en appelle une autre ; la violence se transmet."],ex:["Les vendettas entre familles."]},{arg:"La justice protège aussi les victimes.",expl:["Le procès établit la vérité, désigne les responsables, écoute les victimes."],ex:["Les témoignages au procès des attentats de Bruxelles (2022-2023)."]},{arg:"Une peine juste prépare l’avenir.",expl:["Protéger la société et faire comprendre au coupable le mal commis."],ex:["Les médiations entre victimes et auteurs en Belgique."]}]},resume:{max:120,texte:["Dans une tribune, la juriste Élise Moreau soutient que la justice doit punir les crimes sans jamais se transformer en vengeance. D’abord, la vengeance n’a pas de fin, car chaque représailles en provoque une autre. Ensuite, la justice protège aussi les victimes : le procès établit la vérité et leur permet d’être entendues. Enfin, une peine juste doit préparer l’avenir en protégeant la société et en amenant le coupable à prendre conscience de ses actes. L’auteure réfute enfin l’idée que la peine de mort dissuaderait les criminels, en rappelant qu’une erreur judiciaire serait alors irréparable."]}}],fn=e=>e.paras.map(t=>t.map(n=>n[1]).join(" ")).join(`
