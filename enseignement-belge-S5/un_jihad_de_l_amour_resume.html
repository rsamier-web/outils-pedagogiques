/* Thème sobre inspiré de KDE Breeze (clair) et Breeze Dark */
:root {
  --scale: 1;
  --win: #eff0f1; --view: #fcfcfc; --alt: #f5f6f7; --btn: #fcfcfc; --btn-hover: #e3f2fb;
  --text: #232629; --muted: #5d6873; --border: #bdc3c7; --border-soft: #dcdfe2;
  --accent: #3daee9; --accent-strong: #1d6fa5; --accent-bg: #e3f2fb; --focus: #3daee9;
  --pos: #27ae60; --pos-strong: #1e7e46; --pos-bg: #e5f5ec; --neg: #da4453; --neg-strong: #b3303f; --neg-bg: #fbe9eb; --warn: #f67400; --warn-bg: #fff1e3;
  --hl-phrase: rgba(61, 174, 233, .20); --hl-mot: rgba(246, 116, 0, .38);
  --shadow: 0 1px 2px rgba(0, 0, 0, .08); --radius: 4px;
  /* cartes */
  --sea: #d4e9f5; --land: #f4f1ea; --land-line: #b9b3a6; --neigh: #e6e3dc; --river: #2f8fd0; --lake: #9ccbe8;
  --c1: #2980b9; --c2: #27ae60; --c3: #e67e22; --c4: #8e44ad; --c5: #c0392b; --c6: #16a085; --c7: #d4ac0d; --c8: #7f8c8d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b; --btn-hover: #2c4659;
    --text: #fcfcfc; --muted: #a1a9b1; --border: #4d545b; --border-soft: #3b4045;
    --accent: #3daee9; --accent-strong: #5cbcef; --accent-bg: #1f3a4d;
    --pos: #2ecc71; --pos-strong: #5ee08f; --pos-bg: #1b3326; --neg: #ed5565; --neg-strong: #f2808c; --neg-bg: #3c2226; --warn: #fdbc4b; --warn-bg: #3d3020;
    --hl-phrase: rgba(61, 174, 233, .28); --hl-mot: rgba(253, 188, 75, .45);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --sea: #1f3442; --land: #3a3f44; --land-line: #6b7178; --neigh: #2f3337; --river: #5cbcef; --lake: #2e5a75;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b; --btn-hover: #2c4659;
  --text: #fcfcfc; --muted: #a1a9b1; --border: #4d545b; --border-soft: #3b4045;
  --accent: #3daee9; --accent-strong: #5cbcef; --accent-bg: #1f3a4d;
  --pos: #2ecc71; --pos-strong: #5ee08f; --pos-bg: #1b3326; --neg: #ed5565; --neg-strong: #f2808c; --neg-bg: #3c2226; --warn: #fdbc4b; --warn-bg: #3d3020;
  --hl-phrase: rgba(61, 174, 233, .28); --hl-mot: rgba(253, 188, 75, .45);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --sea: #1f3442; --land: #3a3f44; --land-line: #6b7178; --neigh: #2f3337; --river: #5cbcef; --lake: #2e5a75;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); }
body { margin: 0; background: var(--win); color: var(--text); font: 1rem/1.6 "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-strong); }
h1, h2, h3, h4 { line-height: 1.3; margin: 0; font-weight: 600; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- coque ---------- */
.app { display: grid; grid-template-columns: 15.5rem 1fr; min-height: 100vh; }
.side { background: var(--view); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
.brand { padding: 1rem 1rem .75rem; border-bottom: 1px solid var(--border-soft); }
.brand strong { display: block; font-size: 1rem; }
.brand span { font-size: .8rem; color: var(--muted); }
.nav { list-style: none; margin: 0; padding: .4rem; display: flex; flex-direction: column; gap: 2px; }
.nav button { width: 100%; display: flex; align-items: center; gap: .6rem; padding: .5rem .65rem; border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer; text-align: left; font-size: .95rem; }
.nav button:hover { background: var(--btn-hover); }
.nav button[aria-current="page"] { background: var(--accent-bg); border-color: var(--accent); color: var(--text); font-weight: 600; }
.nav svg { width: 1.15rem; height: 1.15rem; flex: none; color: var(--accent-strong); }
.nav .count { margin-left: auto; font-size: .75rem; background: var(--accent); color: #fff; border-radius: 1rem; padding: 0 .45rem; font-weight: 600; }
.side-foot { margin-top: auto; padding: .75rem 1rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border-soft); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--win); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .5rem; padding: .45rem 1rem; flex-wrap: wrap; }
.topbar .title { font-weight: 600; margin-right: auto; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.btn.menu-btn { display: none; }
.content { padding: 1.25rem 1.25rem 4rem; max-width: 64rem; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.content.wide { max-width: 80rem; }

/* ---------- composants Breeze ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .38rem .8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); cursor: pointer; box-shadow: var(--shadow); font-size: .92rem; line-height: 1.35; min-height: 2.1rem; }
.btn:hover { border-color: var(--accent); background: var(--btn-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #2f9fd8; }
.btn.small { padding: .2rem .55rem; font-size: .85rem; min-height: 1.8rem; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn.ghost:hover { border-color: var(--border); }
.btn svg { width: 1rem; height: 1rem; }
.btn.on { background: var(--accent-bg); border-color: var(--accent); }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; }

.card { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .65rem; }
.card.flat { box-shadow: none; }
.card h2 + p, .card h3 + p { color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .87rem; }
.tag { display: inline-block; font-size: .75rem; padding: .05rem .5rem; border-radius: 1rem; border: 1px solid var(--border); color: var(--muted); background: var(--alt); white-space: nowrap; }
.tag.acc { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-bg); }
.tag.ok { border-color: var(--pos); color: var(--pos-strong); background: var(--pos-bg); }
.tag.ko { border-color: var(--neg); color: var(--neg-strong); background: var(--neg-bg); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid transparent; border-bottom: none; padding: .45rem .85rem; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; margin-bottom: -1px; font-size: .92rem; color: var(--muted); }
.tabs button:hover { color: var(--text); background: var(--btn-hover); }
.tabs button[aria-selected="true"] { background: var(--view); border-color: var(--border); color: var(--text); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }

.box { border-left: 3px solid var(--accent); background: var(--accent-bg); padding: .65rem .85rem; border-radius: 0 var(--radius) var(--radius) 0; display: flex; flex-direction: column; gap: .35rem; }
.box.retenir { border-color: var(--pos); background: var(--pos-bg); }
.box.attention { border-color: var(--warn); background: var(--warn-bg); }
.box.methode { border-color: #8e44ad; background: rgba(142, 68, 173, .09); }
.box .lab { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
ul.clean { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .25rem; }
ol.clean { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: .25rem; }

input[type="text"], input[type="search"], select, textarea { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .38rem .6rem; min-height: 2.1rem; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
textarea { width: 100%; min-height: 7rem; resize: vertical; line-height: 1.5; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
label.chk { display: flex; gap: .5rem; align-items: flex-start; cursor: pointer; }
label.chk input { margin-top: .3rem; accent-color: var(--accent); }

table.tbl { border-collapse: collapse; width: 100%; background: var(--view); font-size: .93rem; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: .4rem .55rem; text-align: left; vertical-align: top; }
.tbl th { background: var(--alt); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }

.progress { height: .45rem; background: var(--border-soft); border-radius: 1rem; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 1rem; transition: width .3s; }

/* ---------- lecture à voix haute ---------- */
.s { border-radius: 3px; transition: background .15s; }
.s.reading { background: var(--hl-phrase); }
.w.reading { background: var(--hl-mot); border-radius: 2px; }
.clickread .w { cursor: pointer; }
.clickread .w:hover { text-decoration: underline dotted; }
.tts { display: flex; gap: .3rem; align-items: center; }
.tts .state { font-size: .8rem; color: var(--muted); }

/* terme du glossaire dans le texte */
.term { background: none; border: none; padding: 0; color: var(--accent-strong); border-bottom: 1px dashed var(--accent); cursor: help; font: inherit; }
.pop { position: fixed; z-index: 60; max-width: 22rem; background: var(--view); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0, 0, 0, .18); padding: .7rem .85rem; display: flex; flex-direction: column; gap: .4rem; font-size: .92rem; }
.pop .ex { color: var(--muted); font-style: italic; }

/* ---------- cours ---------- */
.lesson-nav { display: flex; gap: .5rem; flex-wrap: wrap; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.1rem; align-items: start; }
.lesson.textonly { grid-template-columns: 1fr; }
.lesson .text { display: flex; flex-direction: column; gap: .7rem; }
.lesson .visual { position: sticky; top: 3.6rem; display: flex; flex-direction: column; gap: .5rem; }
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--border-soft); }
.steps span.done { background: var(--accent); }
.toc { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .6rem; }
.toc button { text-align: left; background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .75rem; cursor: pointer; display: flex; flex-direction: column; gap: .15rem; }
.toc button:hover { border-color: var(--accent); background: var(--btn-hover); }
.toc button b { font-weight: 600; }
.toc button span { font-size: .82rem; color: var(--muted); }
.toc button.seen { border-left: 3px solid var(--pos); }

/* ---------- cartes ---------- */
.mapbox { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }
.mapbox svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.mapcap { font-size: .78rem; color: var(--muted); padding: .3rem .6rem; border-top: 1px solid var(--border-soft); background: var(--alt); }
.maptip { position: absolute; pointer-events: none; background: var(--view); border: 1px solid var(--border); border-radius: 3px; padding: .15rem .45rem; font-size: .82rem; box-shadow: var(--shadow); white-space: nowrap; z-index: 5; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .82rem; padding: .45rem .6rem; border-top: 1px solid var(--border-soft); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { width: .95rem; height: .75rem; border-radius: 2px; display: inline-block; border: 1px solid rgba(0, 0, 0, .25); }
.legend i.ln { height: 3px; border: none; }
.legend i.pt { width: .65rem; height: .65rem; border-radius: 50%; }
svg .sea { fill: var(--sea); }
svg .land { fill: var(--land); stroke: var(--land-line); stroke-width: .5; }
svg .neigh { fill: var(--neigh); stroke: var(--land-line); stroke-width: .6; }
svg .border { fill: none; stroke: var(--land-line); stroke-width: .45; stroke-linejoin: round; }
svg .grat { fill: none; stroke: var(--land-line); stroke-width: .3; stroke-dasharray: 2 3; opacity: .7; }
svg .river { fill: none; stroke: var(--river); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
svg .lake { fill: var(--lake); stroke: var(--river); stroke-width: .5; }
svg .land, svg .neigh, svg .border, svg .grat, svg .river, svg .lake, svg .sea { vector-effect: non-scaling-stroke; }
svg text { font-family: "Noto Sans", system-ui, sans-serif; paint-order: stroke; stroke: var(--view); stroke-width: 3px; stroke-linejoin: round; fill: var(--text); }
svg text.sea { fill: var(--accent-strong); font-style: italic; stroke: var(--sea); }
svg text.country { fill: var(--muted); letter-spacing: .08em; font-weight: 600; }
svg .it { cursor: pointer; transition: opacity .15s; }
svg .it:hover { filter: brightness(1.08); }
svg .it.dim { opacity: .28; }
svg .it.sel { stroke: var(--text) !important; stroke-width: 2.2; }
svg .it.good { stroke: var(--pos) !important; stroke-width: 3; }
svg .it.bad { stroke: var(--neg) !important; stroke-width: 3; }
svg .flash { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { opacity: .25; } }
svg .hit { stroke: transparent; fill: none; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
svg .hitpt { fill: transparent; cursor: pointer; }

.maptask { display: flex; flex-direction: column; gap: .5rem; }
.prompt { font-size: 1.05rem; font-weight: 600; padding: .55rem .75rem; background: var(--accent-bg); border: 1px solid var(--accent); border-radius: var(--radius); display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.feedback { padding: .5rem .75rem; border-radius: var(--radius); border: 1px solid; }
.feedback.ok { border-color: var(--pos); background: var(--pos-bg); }
.feedback.ko { border-color: var(--neg); background: var(--neg-bg); }
.feedback.info { border-color: var(--border); background: var(--alt); }

/* ---------- QCM ---------- */
.opts { display: flex; flex-direction: column; gap: .4rem; }
.opt { text-align: left; padding: .55rem .75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); cursor: pointer; display: flex; gap: .6rem; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--btn-hover); }
.opt .k { flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 600; color: var(--muted); }
.opt.good { border-color: var(--pos); background: var(--pos-bg); }
.opt.bad { border-color: var(--neg); background: var(--neg-bg); }
.opt:disabled { cursor: default; }

/* ---------- cartes mémoire ---------- */
.flash-card { min-height: 15rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: .9rem; padding: 1.5rem; background: var(--view); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); }
.flash-card .front { font-size: 1.3rem; font-weight: 600; }
.flash-card .back { font-size: 1.02rem; border-top: 1px solid var(--border-soft); padding-top: .9rem; width: 100%; display: flex; flex-direction: column; gap: .45rem; align-items: center; }
.flash-card .back .ex { color: var(--muted); font-style: italic; font-size: .93rem; }
.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
.grade .btn { flex-direction: column; gap: 0; }
.grade .btn small { font-size: .72rem; color: var(--muted); font-weight: 400; }
.grade .again { border-color: var(--neg); } .grade .hard { border-color: var(--warn); } .grade .good { border-color: var(--pos); } .grade .easy { border-color: var(--accent); }
.stat { display: flex; flex-direction: column; align-items: center; padding: .5rem; background: var(--alt); border-radius: var(--radius); border: 1px solid var(--border-soft); }
.stat b { font-size: 1.35rem; }
.stat span { font-size: .78rem; color: var(--muted); text-align: center; }

/* ---------- glossaire ---------- */
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: .6rem; }
.gitem { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .65rem .8rem; display: flex; flex-direction: column; gap: .3rem; }
.gitem h3 { font-size: 1rem; color: var(--accent-strong); display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.gitem .ex { color: var(--muted); font-size: .9rem; }
.gitem .ex b { font-weight: 600; color: var(--text); }
.alpha { display: flex; flex-wrap: wrap; gap: 2px; }
.alpha button { min-width: 1.8rem; padding: .1rem .3rem; border: 1px solid var(--border-soft); background: var(--view); border-radius: 3px; cursor: pointer; font-size: .82rem; }
.alpha button:hover { border-color: var(--accent); }

/* ---------- exercices ---------- */
.fam { border: 1px solid var(--border); border-radius: var(--radius); background: var(--view); overflow: hidden; }
.fam > header { padding: .75rem 1rem; display: flex; gap: .75rem; align-items: center; justify-content: space-between; background: var(--alt); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.fam > header h3 { font-size: 1.02rem; }
.fam .body { padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
.level { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.lv1 { color: var(--pos-strong); } .lv2 { color: var(--accent-strong); } .lv3 { color: #b05f00; }
:root[data-theme="dark"] .lv3 { color: var(--warn); }
.ex-item { border: 1px solid var(--border-soft); border-radius: var(--radius); padding: .8rem .9rem; display: flex; flex-direction: column; gap: .6rem; }
.ex-item.solved { border-color: #8e44ad; background: rgba(142, 68, 173, .05); }
.correction { border: 1px solid var(--pos); background: var(--pos-bg); border-radius: var(--radius); padding: .7rem .85rem; display: flex; flex-direction: column; gap: .45rem; }
.correction h4 { color: var(--pos-strong); }
.critere { display: flex; flex-direction: column; gap: .3rem; }
.doc { border: 1px solid var(--border); background: var(--alt); border-radius: var(--radius); padding: .6rem .8rem; font-size: .93rem; display: flex; flex-direction: column; gap: .3rem; }
.doc .src { font-size: .78rem; color: var(--muted); }
.doc .dlab { font-weight: 700; font-size: .8rem; color: var(--accent-strong); }
.blank { display: inline-block; min-width: 5rem; border-bottom: 1px solid var(--muted); }

/* évaluations */
.eval-sheet { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
.eval-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: .6rem; }
.q { display: flex; flex-direction: column; gap: .5rem; padding-bottom: .9rem; border-bottom: 1px dashed var(--border); }
.q:last-child { border-bottom: none; }
.q .qh { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; }
.q .pts { font-weight: 600; white-space: nowrap; color: var(--muted); font-size: .9rem; }
.lines { display: flex; flex-direction: column; gap: 1.3rem; padding: .4rem 0; }
.lines span { border-bottom: 1px dotted var(--muted); height: 1px; }

/* diagrammes */
.diagram { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { stroke: none; }

/* réglages */
.dialog-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 50; display: flex; justify-content: flex-end; }
.dialog { width: min(27rem, 100%); background: var(--win); height: 100%; overflow: auto; border-left: 1px solid var(--border); padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
.field { display: flex; flex-direction: column; gap: .3rem; }
.field > span { font-size: .88rem; font-weight: 600; }
.field small { color: var(--muted); }

/* ---------- mobile ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; z-index: 40; width: 16rem; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0, 0, 0, .2); }
  .side.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .lesson { grid-template-columns: 1fr; }
  .lesson .visual { position: static; }
  .content { padding: .9rem .75rem 4rem; }
  .grade { grid-template-columns: repeat(2, 1fr); }
  .topbar .tts .label { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- impression ---------- */
@media print {
  .side, .topbar, .noprint, .btn, .tabs { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
  .content { max-width: none; padding: 0; }
  .eval-sheet { border: none; padding: 0; }
  .correction { break-inside: avoid; }
  .q { break-inside: avoid; }
}
.printlines { display: none !important; }
@media print { .printlines { display: flex !important; } textarea { display: none !important; } }

/* =================== Un jihad de l'amour · schéma et résumé =================== */
:root {
  --c-theme: #7f8c8d; --c-these: #1d99f3; --c-arg: #27ae60; --c-expl: #16a085; --c-ex: #f67400; --c-contre: #da4453; --c-refut: #8e44ad; --c-autre: #a0a6ab; --c-concl: #2c3e50;
  --b-theme: rgba(127,140,141,.14); --b-these: rgba(29,153,243,.14); --b-arg: rgba(39,174,96,.15); --b-expl: rgba(22,160,133,.13); --b-ex: rgba(246,116,0,.14); --b-contre: rgba(218,68,83,.12); --b-refut: rgba(142,68,173,.13); --b-autre: rgba(160,166,171,.16); --b-concl: rgba(44,62,80,.12);
}
:root[data-theme="dark"] { --c-concl: #bdc3c7; --b-concl: rgba(189,195,199,.14); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-concl: #bdc3c7; --b-concl: rgba(189,195,199,.14); } }
.r-theme, .c-theme { --rc: var(--c-theme); --rb: var(--b-theme); }
.r-these, .c-these { --rc: var(--c-these); --rb: var(--b-these); }
.r-arg, .c-arg { --rc: var(--c-arg); --rb: var(--b-arg); }
.r-expl, .c-expl { --rc: var(--c-expl); --rb: var(--b-expl); }
.r-ex, .c-ex { --rc: var(--c-ex); --rb: var(--b-ex); }
.r-contre, .c-contre { --rc: var(--c-contre); --rb: var(--b-contre); }
.r-refut, .c-refut { --rc: var(--c-refut); --rb: var(--b-refut); }
.r-amorce, .r-autre, .c-autre { --rc: var(--c-autre); --rb: var(--b-autre); }
.r-concl, .c-concl { --rc: var(--c-concl); --rb: var(--b-concl); }

/* texte coloré */
.textroles p { margin: 0 0 .5rem; line-height: 1.75; }
.seg[class*="r-"] { background: var(--rb); border-bottom: 2px solid var(--rc); border-radius: 2px; padding: 0 .1rem; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.legend-roles { display: flex; flex-wrap: wrap; gap: .25rem .8rem; font-size: .8rem; border-top: 1px solid var(--border-soft); padding-top: .4rem; }
.legend-roles .rl { display: inline-flex; align-items: center; gap: .35rem; }
.legend-roles i, .palette i { width: .9rem; height: .7rem; border-radius: 2px; background: var(--rb); border: 2px solid var(--rc); display: inline-block; }

/* marquage */
.palette { display: flex; flex-wrap: wrap; gap: .35rem; }
.palette .rb.on { background: var(--rb); border-color: var(--rc); font-weight: 600; box-shadow: inset 0 -2px 0 var(--rc); }
.marktext p { margin: 0 0 .6rem; line-height: 1.9; }
.mk { font: inherit; text-align: left; background: transparent; border: 1px dashed var(--border); border-radius: 3px; padding: .05rem .25rem; cursor: pointer; color: inherit; display: inline; line-height: 1.9; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.mk:hover { border-color: var(--accent); }
.mk[class*="r-"] { background: var(--rb); border: 1px solid var(--rc); border-bottom-width: 2px; }
.mk.good { outline: 2px solid var(--pos); }
.mk.bad { outline: 2px solid var(--neg); }
.mk-fix { font-size: .78rem; font-weight: 700; color: var(--neg-strong); margin-left: .2rem; }

/* schéma */
.schema { display: flex; flex-direction: column; gap: .5rem; }
.sc-grid { display: grid; grid-template-columns: .8fr 1.1fr 1.1fr 1.3fr 1.2fr; gap: .4rem; align-items: stretch; }
.sc-grid > div { display: flex; }
.sc-grid > div > .sc-cell { flex: 1; }
.sc-head { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 0 .2rem; align-items: flex-end; }
.sc-cell { background: var(--rb, var(--view)); border: 1px solid var(--rc, var(--border)); border-left-width: 4px; border-radius: var(--radius); padding: .45rem .55rem; display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; min-width: 0; }
.sc-cell .sc-lab { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--rc, var(--muted)); }
.sc-cell .sc-lab small { text-transform: none; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.sc-cell ul.clean { padding-left: 1rem; gap: .2rem; }
.sc-cell textarea { min-height: 3.2rem; font-size: .9rem; background: var(--view); }
.sc-cell.hole { border-style: dashed; }
.sc-corr { font-size: .84rem; background: var(--pos-bg); border-radius: 3px; padding: .3rem .45rem; border: 1px solid var(--pos); }
.sc-grid .sc-lab { display: none; }
.sc-grid .hole .sc-lab { display: none; }
.schema > .sc-cell .sc-lab { display: block; }
.schema.edit .sc-top { display: grid; grid-template-columns: 1fr 1.6fr; gap: .5rem; }
.sc-row { display: grid; grid-template-columns: 1fr auto 1.2fr auto 1fr; gap: .35rem; align-items: stretch; }
.sc-arrow { align-self: center; font-size: .72rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 760px) {
  .sc-grid { display: flex; flex-direction: column; }
  .sc-grid .sc-head { display: none; }
  .sc-grid .sc-lab, .sc-grid .hole .sc-lab { display: block; }
  .sc-row { grid-template-columns: 1fr; }
  .sc-arrow { display: none; }
  .schema.edit .sc-top { grid-template-columns: 1fr; }
}

/* cartes d'argument du livre */
.argcard { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; display: flex; flex-direction: column; gap: .55rem; }
.ac-head { display: flex; gap: .5rem; align-items: flex-start; }
.ac-head b { flex: 1; }
.ac-col { background: var(--rb); border-left: 4px solid var(--rc); border-radius: 0 var(--radius) var(--radius) 0; padding: .45rem .6rem; display: flex; flex-direction: column; gap: .3rem; }
.ac-col .sc-lab { font-size: .7rem; font-weight: 700; text-transform: uppercase; color: var(--rc); }

/* fragments, fonctions */
.frag-m { border: 1px solid var(--border); border-radius: var(--radius); background: var(--view); padding: .5rem .7rem; display: flex; flex-direction: column; gap: .4rem; }
.frag-m > summary { cursor: pointer; }
.frag-m[open] > summary { margin-bottom: .4rem; }
.fn { font-size: .75rem; font-weight: 600; padding: .05rem .45rem; border-radius: 1rem; border: 1px solid; white-space: nowrap; }
.fn-recit, .fn-lyrique { border-color: var(--c-autre); background: var(--b-autre); }
.fn-argu { border-color: var(--c-arg); background: var(--b-arg); }
.fn-mixte { border-color: var(--c-ex); background: var(--b-ex); }
table.tbl.small { font-size: .84rem; }
.tbl select, .tbl input[type="text"] { font-size: .84rem; min-height: 1.8rem; }

/* comparaison avant / après */
.cmp { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--view); }
.cmp-a { padding: .5rem .7rem; }
.cmp-b { padding: .35rem .7rem; background: var(--alt); border-top: 1px solid var(--border-soft); color: var(--muted); }

/* diagrammes HTML */
.dg { display: flex; flex-direction: column; gap: .55rem; padding: .3rem; }
.dg-row { display: flex; gap: .45rem; align-items: stretch; flex-wrap: wrap; }
.dg-row > .dg-box { flex: 1 1 9rem; }
.dg-box { background: var(--rb, var(--alt)); border: 1px solid var(--rc, var(--border)); border-left-width: 4px; border-radius: var(--radius); padding: .5rem .6rem; display: flex; flex-direction: column; gap: .2rem; font-size: .9rem; }
.dg-box b { color: var(--text); }
.dg-box small { color: var(--muted); font-size: .78rem; }
.dg-arrow { display: flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--muted); text-align: center; min-width: 4.5rem; }
.dg-arrow span::after { content: " →"; }
.dg-arrow.down { min-width: 0; height: .9rem; }
.dg-arrow.down span::after { content: "↓"; font-size: .9rem; }
.dg-cap { font-size: .82rem; color: var(--muted); }
.dg-table { gap: .3rem; }
.dg-line { display: grid; grid-template-columns: 9.5rem 1fr; gap: .6rem; background: var(--rb); border-left: 4px solid var(--rc); border-radius: 0 var(--radius) var(--radius) 0; padding: .4rem .6rem; font-size: .88rem; }
.dg-steps { align-items: stretch; gap: 0; }
.dg-step { display: flex; gap: .55rem; align-items: center; background: var(--rb); border: 1px solid var(--rc); border-left-width: 4px; border-radius: var(--radius); padding: .45rem .6rem; font-size: .92rem; }
.dg-n { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--view); border: 1px solid var(--rc); font-weight: 700; font-size: .85rem; }
.dg-map { flex-direction: row; gap: .8rem; }
.dg-col { flex: 1; display: flex; flex-direction: column; gap: .35rem; }
.dg-coltitle { font-size: .8rem; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.dg-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .45rem; }
.dg-time { gap: .35rem; }
.dg-ev { display: grid; grid-template-columns: 6.5rem 1fr; gap: .6rem; padding: .35rem .5rem; border-left: 3px solid var(--border); font-size: .9rem; }
.dg-ev.key { border-color: var(--neg); background: var(--neg-bg); }
.dg-date { font-weight: 700; font-size: .82rem; color: var(--muted); }
.dg-star { gap: .5rem; }
.dg-center { display: flex; justify-content: center; }
.dg-center .dg-box { min-width: 12rem; text-align: center; }
.dg-around { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .4rem; }
@media (max-width: 520px) { .dg-line { grid-template-columns: 1fr; gap: .1rem; } .dg-map { flex-direction: column; } }

/* trames */
.trame { display: flex; flex-direction: column; gap: .75rem; }
.trame-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: .75rem; align-items: start; }
.trame-row:not(:has(.trame-side)) { grid-template-columns: 1fr; }
.trame-side { background: var(--alt); border: 1px solid var(--border-soft); border-left: 4px solid var(--c-arg); border-radius: var(--radius); padding: .5rem .65rem; font-size: .87rem; margin-top: 1.6rem; }
.step-n { display: inline-flex; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--accent); color: #fff; font-size: .78rem; align-items: center; justify-content: center; margin-right: .4rem; }
@media (max-width: 760px) { .trame-row { grid-template-columns: 1fr; } .trame-side { margin-top: 0; } }

.copyai { border: 1px solid var(--accent); background: var(--accent-bg); border-radius: var(--radius); padding: .65rem .8rem; display: flex; flex-direction: column; gap: .45rem; }
.prompt-view { white-space: pre-wrap; font-size: .78rem; background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem; max-height: 22rem; overflow: auto; font-family: ui-monospace, Consolas, monospace; }

/* tri */
.tri-row { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; padding: .4rem .55rem; border: 1px solid var(--border-soft); border-radius: var(--radius); }
.tri-t { flex: 1 1 14rem; }
label.chk.good-t { background: var(--pos-bg); border-radius: 3px; }
label.chk.bad-t { background: var(--neg-bg); border-radius: 3px; }

/* ordre */
ol.order { margin: 0; padding-left: 1.6rem; display: flex; flex-direction: column; gap: .35rem; }
ol.order li { border: 1px solid var(--border); border-radius: var(--radius); background: var(--view); padding: .35rem .5rem; }
ol.order li.good { border-color: var(--pos); background: var(--pos-bg); }
ol.order li.bad { border-color: var(--neg); background: var(--neg-bg); }
.ord-btns { display: flex; flex-direction: column; }
.ord-btns .btn { min-height: 1.4rem; padding: 0 .3rem; }

/* atelier */
.atelier-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
.atelier-grid:has(.atelier-side) { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.atelier-side { position: sticky; top: 3.6rem; max-height: calc(100vh - 4.5rem); overflow: auto; }
@media (max-width: 960px) { .atelier-grid:has(.atelier-side) { grid-template-columns: 1fr; } .atelier-side { position: static; max-height: none; order: -1; } }
details.doc > summary { cursor: pointer; }
details.doc[open] > summary { margin-bottom: .3rem; }

/* bibliothèque */
.themes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); gap: .7rem; align-items: start; }
.theme-card { background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem .85rem; display: flex; flex-direction: column; gap: .5rem; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.pc-col { border-radius: var(--radius); padding: .5rem .6rem; display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; }
.pc-col.pour { background: var(--pos-bg); border-left: 4px solid var(--pos); }
.pc-col.contre { background: var(--neg-bg); border-left: 4px solid var(--neg); }
@media (max-width: 520px) { .pc { grid-template-columns: 1fr; } .themes-grid { grid-template-columns: 1fr; } }

.novoice { margin: .5rem 1rem 0; }
.doc p { margin: 0 0 .4rem; }

@media (max-width: 760px) { .trame-side { order: -1; } }

</style>
</head>

:"Le thème et la thèse",blocs:["Un [[texte argumentatif]] cherche à faire partager une opinion. Pour l’analyser, on commence toujours par deux questions.","**De quoi parle le texte ?** C’est le [[thème]] : un sujet, souvent un groupe nominal. Exemple : « le téléphone portable à l’école ».","**Que pense l’auteur de ce sujet ?** C’est la [[thèse]] : une opinion, toujours une phrase complète. Exemple : « le téléphone devrait être interdit pendant les cours ».","Astuce : le thème ne prend pas parti ; la thèse, si. Deux auteurs peuvent avoir le même thème et des thèses opposées."],visuel:{diagram:"theme-these"},retenir:["Thème = de quoi parle le texte (un sujet, sans avis).","Thèse = ce que l’auteur pense de ce sujet (une opinion, une phrase)."]},{titre:"Argument, explication, exemple",blocs:["Pour défendre sa thèse, l’auteur donne des [[argument|arguments]] : des raisons. Un argument répond à la question « **pourquoi** l’auteur a-t-il raison ? ».","Chaque argument est souvent développé par une [[explication]] (ou développement) : elle précise l’argument, montre comment il fonctionne.","Puis vient parfois un [[exemple]] : un cas concret, précis, qui illustre l’argument. Il répond à la question « **par exemple ?** ».","Regarde le texte coloré à droite : chaque couleur correspond à un rôle. Lis-le une fois en suivant les couleurs."],visuel:{textroles:"t1"},retenir:["Argument = une raison (pourquoi ?).","Explication = le développement de l’argument (comment ? en quoi ?).","Exemple = un cas concret (par exemple ?)."]},{titre:"Les phrases qui ont une autre fonction",blocs:["Toutes les phrases d’un texte argumentatif ne servent pas à argumenter. Certaines ont une **autre fonction** : accrocher le lecteur (une anecdote, une citation, une question), présenter le contexte, raconter, émouvoir.","D’autres présentent l’avis adverse : c’est le [[contre-argument]] (ou la [[concession]], quand l’auteur admet qu’il a en partie raison : « certes… »). L’auteur y répond souvent par une [[réfutation]] (« pourtant… », « mais… »).","C’est l’étape 3 de ta fiche page 78 : **repérer les parties qui ont une autre fonction que la fonction argumentative**. Elles ne vont pas dans le schéma comme des arguments."],visuel:{textroles:"t4"},retenir:["Accroche, anecdote, contexte, citation = autre fonction.","Contre-argument / concession = l’avis adverse ; réfutation = la réponse de l’auteur."]}],check:{q:"« Les zoos modernes restent utiles s’ils protègent les espèces. » Cette phrase est…",o:["le thème","la thèse","un exemple","une explication"],a:1,e:"C’est une opinion sur le sujet (les zoos), formulée en phrase complète : c’est la thèse. Le thème serait « l’utilité des zoos »."}},{id:"m2",titre:"Repérer grâce aux indices",resume:"Connecteurs, marques d’opinion, place des idées, types d’arguments.",pages:[{titre:"Où se cache la thèse ?",blocs:["La thèse se trouve souvent **au début** (dans l’introduction) et elle est **reprise à la fin** (dans la conclusion). Le titre la résume parfois.","Cherche les [[modalisateur|marques d’opinion]] : « selon moi », « je pense que », « il faut », « il est essentiel de », « devrait », des adjectifs comme « injuste » ou « indispensable ».","Attention : la thèse n’est pas toujours la première phrase. Elle vient souvent **après une accroche** (une anecdote, une citation) ou **après une concession** (« Certes…, pourtant… »)."],visuel:{compare:[["Chaque année, des millions de visiteurs se pressent devant les enclos des zoos.","Accroche : ce n’est pas encore la thèse."],["Certes, un animal en captivité ne vit pas comme dans la nature…","Concession : l’avis adverse, admis en partie."],["Pourtant, les zoos modernes restent utiles, à condition d’être d’abord des lieux de protection.","La thèse arrive après « Pourtant »."]]},retenir:["La thèse est souvent au début et reprise à la fin.","Cherche les marques d’opinion et le mot qui suit une concession (pourtant, mais)."]},{titre:"Les connecteurs, des panneaux indicateurs",blocs:["Les [[connecteur logique|connecteurs logiques]] indiquent le rôle de la phrase qui suit. Ce sont tes meilleurs indices.","« D’abord, ensuite, de plus, enfin » annoncent souvent un **nouvel argument**. « En effet, car, c’est-à-dire » annoncent une **explication**. « Par exemple, ainsi, notamment » annoncent un **exemple**.","« Certes, on objecte que, certains pensent » annoncent un **contre-argument** ; « mais, pourtant, cependant » annoncent la **réfutation** ou la thèse. « En somme, donc, bref » annoncent la **conclusion**."],visuel:{diagram:"connecteurs"},retenir:["Les connecteurs annoncent le rôle de la phrase.","Mais attention : « ainsi » peut annoncer un exemple ou une conséquence ; vérifie toujours le sens."]},{titre:"Argument ou exemple ? Le test",blocs:["Les élèves confondent souvent argument et exemple. Voici un test simple.","Un **argument** est **général** : il vaut pour beaucoup de cas et répond à « pourquoi ? ». Un **exemple** est **particulier** : il parle d’une personne, d’un lieu, d’une date, d’un chiffre précis.","Essaie de mettre « Par exemple, » devant la phrase. Si cela fonctionne, c’est probablement un exemple. Essaie de mettre « parce que » devant : si cela fonctionne, c’est probablement un argument.","Pour remonter d’un exemple à l’argument, demande-toi : « **qu’est-ce que cet exemple prouve ?** ». La réponse, formulée de façon générale, est l’argument."],visuel:{diagram:"arg-ou-ex"},retenir:["Argument = général ; exemple = particulier (nom, date, lieu, chiffre).","De l’exemple à l’argument : « Qu’est-ce que cela prouve ? »"]},{titre:"Les grands types d’arguments",blocs:["Connaître les types d’arguments aide à les reconnaître plus vite.","**Logique** (cause et conséquence) : « Les notifications détournent l’attention, donc les élèves apprennent moins bien. » **De valeur** (morale, justice, liberté) : « La vengeance est injuste. »","**D’autorité** : on s’appuie sur un expert, un texte reconnu. **D’expérience** : on s’appuie sur un vécu. **Par l’analogie** : on compare deux situations.","Dans un résumé, on ne nomme pas le type d’argument, mais savoir le reconnaître aide à **reformuler l’idée** au lieu de recopier les mots."],visuel:{diagram:"types-arguments"},retenir:["Types fréquents : logique, de valeur, d’autorité, d’expérience, par analogie.","Un exemple n’est pas un argument : il l’illustre."]}],check:{q:"« En 2013, l’effondrement du Rana Plaza au Bangladesh a fait plus de mille morts. » Dans un texte contre la mode jetable, c’est…",o:["la thèse","un argument","un exemple","une conclusion"],a:2,e:"C’est un cas précis (une date, un lieu, un chiffre). Il illustre l’argument général : la mode jetable repose sur l’exploitation de travailleurs."}},{id:"m3",titre:"La méthode du schéma (fiche p. 78)",resume:"Les six étapes pour passer du texte à sa schématisation.",pages:[{titre:"Les six étapes de la procédure",blocs:["Voici la procédure de ta fiche page 78. Elle transforme un texte long en un [[schéma argumentatif]] clair.","**1.** Lire le texte et le comprendre. **2.** Repérer le thème (le sujet) et la thèse (l’idée défendue). **3.** Repérer les parties qui ont une autre fonction que la fonction argumentative.","**4.** Repérer les arguments et les exemples. **5.** Tracer le schéma du texte : **hiérarchiser** et **reformuler** les informations. **6.** Rédiger le résumé du texte.","Ne saute pas d’étape : chaque étape réduit la quantité d’informations à garder en tête. C’est ce qui rend la tâche possible."],visuel:{diagram:"procedure"},retenir:["Comprendre → thème et thèse → autres fonctions → arguments et exemples → schéma (hiérarchiser, reformuler) → résumé."]},{titre:"La structure du schéma : de A à E",blocs:["Ton schéma se lit **de gauche à droite**, comme dans ton cours : A. le thème, B. la thèse, C. les arguments, D. les explications (le développement), E. les exemples.","Chaque argument a **sa propre ligne** : on voit immédiatement combien il y en a et ce qui dépend de quoi. C’est cela, [[hiérarchiser]].","Les connecteurs peuvent figurer sur les flèches : « car » entre la thèse et un argument, « en effet » vers l’explication, « par exemple » vers l’exemple.","Le contre-argument et sa réfutation se placent dans une case à part, sous la thèse."],visuel:{schema:"t2"},retenir:["A thème → B thèse → C arguments → D explications → E exemples.","Une ligne par argument ; contre-argument dans une case à part."]},{titre:"Reformuler : écrire court et avec tes mots",blocs:["Dans le schéma, on n’écrit pas de longues phrases recopiées. On [[reformuler|reformule]] : on dit la même idée, plus court, avec d’autres mots.","Trois techniques : **raccourcir** (garder le noyau de la phrase), **généraliser** (remplacer une liste par un mot qui la résume : « climat, école, logement » → « leur avenir »), **nominaliser** (transformer un verbe en nom : « les élèves se concentrent moins » → « baisse de concentration »).","Attention : reformuler n’est pas transformer. Le sens doit rester exactement celui de l’auteur. C’est le critère de [[fidélité]]."],visuel:{compare:[["« Chaque notification attire l’attention, et il faut ensuite plusieurs minutes pour se remettre au travail. »","Copié : trop long pour un schéma."],["Les notifications détournent l’attention.","Raccourci et reformulé : le noyau de l’idée."],["Perte de concentration.","Nominalisé : idéal dans une case de schéma."]]},retenir:["Raccourcir, généraliser, nominaliser.","Reformuler sans changer le sens."]}],check:{q:"À quelle étape de la procédure repère-t-on une anecdote d’introduction ?",o:["Étape 2 : thème et thèse","Étape 3 : les parties qui ont une autre fonction","Étape 5 : tracer le schéma","Étape 6 : rédiger le résumé"],a:1,e:"Une anecdote d’accroche n’argumente pas : on la repère à l’étape 3 pour ne pas la confondre avec un argument."}},{id:"m4",titre:"Du schéma au résumé (fiche p. 86)",resume:"Changer d’énonciateur, attribuer, hiérarchiser, rester neutre, reformuler.",pages:[{titre:"Changer d’énonciateur",blocs:["Dans le texte source, l’auteur parle souvent en son nom : « je pense », « selon moi ». Dans ton résumé, **c’est toi qui écris** : tu rédiges à la **3e personne**.","« Je refuse la haine » devient « El Bachiri refuse la haine » ou « l’auteur refuse la haine ».","C’est ce qu’on appelle [[changer d’énonciateur]]. Tu transmets la pensée de l’auteur à un lecteur qui n’a pas lu le texte."],visuel:{diagram:"enonciation"},retenir:["Résumé à la 3e personne : « il », « elle », « l’auteur », « El Bachiri »."]},{titre:"Attribuer les propos et choisir le bon verbe",blocs:["Attribue les idées à l’auteur en utilisant son **nom de famille** (El Bachiri) ou son **prénom et son nom** (Mohamed El Bachiri). Jamais seulement le prénom.","Évite de répéter « il dit que ». Choisis un [[verbe introducteur]] précis, qui montre ce que fait l’auteur : il **affirme**, **soutient**, **dénonce**, **regrette**, **reconnaît**, **réfute**, **plaide pour**, **appelle à**…","Le verbe est déjà une information : « il admet que » montre une concession, « il dénonce » montre une critique."],visuel:{diagram:"verbes"},retenir:["Nom de famille, ou prénom + nom ; jamais le prénom seul.","Un verbe précis à la place de « dire »."]},{titre:"L’introduction et le développement",blocs:["**L’introduction** donne la **source** (auteur, titre, date, éventuellement le genre), le **thème** et la **thèse**. En une ou deux phrases.","**Le développement** suit l’ordre du schéma : **un paragraphe par argument** (ou un paragraphe par groupe d’arguments si la consigne est courte). Chaque paragraphe commence par l’argument et peut contenir l’explication essentielle.","Organise le tout avec des **connecteurs logiques** adéquats : d’abord, ensuite, de plus, enfin ; en effet, car ; certes… mais.","Les **exemples** ne sont généralement pas repris : on garde l’idée. On garde un exemple seulement s’il est indispensable pour comprendre l’argument."],visuel:{diagram:"schema-vers-resume"},retenir:["Intro : source + thème + thèse.","Un paragraphe par argument, dans l’ordre du schéma, avec connecteurs.","Pas d’exemples, sauf s’ils sont indispensables."]},{titre:"Neutralité et reformulation",blocs:["[[neutralité|Neutralité]] : tu transmets l’avis de l’auteur, **pas le tien**. Pas de « je trouve que », pas de « l’auteur a bien raison », pas de « malheureusement ».","**Reformulation obligatoire** : tu n’as pas le droit de recopier des phrases du texte. Mais attention, **ne transforme pas** les propos de l’auteur : pas d’ajout, pas de contresens, pas d’exagération.","Si un mot-clé est irremplaçable (par exemple « jihad de l’amour »), tu peux le citer entre guillemets, une fois, brièvement."],visuel:{compare:[["Mohamed dit qu’il ne faut pas se venger, et je trouve qu’il a tout à fait raison.","Prénom seul, verbe « dire », avis personnel : trois erreurs."],["El Bachiri estime que la vengeance ne fait que reproduire le mal.","Nom de famille, verbe précis, neutralité, reformulation."]]},retenir:["Pas d’avis personnel.","Reformuler, sans transformer le sens."]},{titre:"Intelligibilité et recevabilité",blocs:["[[intelligibilité|Intelligibilité]] : ton lecteur **n’a pas lu le texte** ; il doit tout comprendre sans lui. Évite les allusions (« comme dans l’exemple des colombes ») et explique les noms propres si nécessaire.","Veille à être **précis**, à la correction des [[anaphore|anaphores]] (« il », « celui-ci », « cette idée » doivent renvoyer clairement à quelqu’un ou à quelque chose) et à utiliser les verbes adéquats.","[[recevabilité|Recevabilité]] : respecte la consigne. Le nombre de mots maximal, le destinataire, la présentation. **Compte tes mots** et indique le total en bas de ta copie si on te le demande."],visuel:{diagram:"criteres"},retenir:["Le lecteur doit comprendre sans le texte source.","Respecter le nombre de mots et le destinataire."]}],check:{q:"Quelle phrase respecte la fiche page 86 ?",o:["Mohamed raconte que sa femme est morte et ça m’a beaucoup touché.","El Bachiri affirme que la haine ne peut être combattue que par l’amour.","Je pense qu’il faut répondre à la haine par l’amour.","Il dit des choses sur l’amour et la haine."],a:1,e:"Nom de famille, verbe précis (affirme), 3e personne, neutralité et idée claire : c’est la seule phrase conforme."}},{id:"m5",titre:"Évaluer un résumé : les critères",resume:"Pertinence, fidélité, intelligibilité, recevabilité, langue : et les erreurs fréquentes.",pages:[{titre:"Les critères d’un bon résumé",blocs:["**Pertinence** : tu as gardé les informations essentielles (thèse, arguments) et supprimé l’accessoire (exemples, anecdotes, répétitions).","**Fidélité** : tu respectes la pensée de l’auteur et l’ordre de ses idées, sans contresens et sans avis personnel.","**Intelligibilité** : un lecteur qui ne connaît pas le texte comprend tout. **Recevabilité** : tu respectes la consigne (nombre de mots, destinataire, énonciation). **Langue** : orthographe, syntaxe, ponctuation."],visuel:{diagram:"criteres"},retenir:["Pertinence, fidélité, intelligibilité, recevabilité, langue."]},{titre:"Les erreurs les plus fréquentes",blocs:["**Recopier** des morceaux de phrases du texte. **Garder les exemples** et oublier l’argument qu’ils illustrent.","**Résumer mécaniquement** paragraphe par paragraphe, en donnant autant de place à une anecdote qu’à un argument. Au contraire, la place de chaque idée dépend de son **importance**.","**Trop réduire** : un texte « télégraphique », sans connecteurs, qu’on ne comprend plus. **Dépasser** le nombre de mots.","**Oublier de changer d’énonciateur** (« je ») ou **donner son avis**."],visuel:{compare:[["Inès a acheté cinq t-shirts. Un jean demande beaucoup d’eau. Le Rana Plaza s’est effondré.","Une suite d’exemples sans arguments ni liens : non pertinent et inintelligible."],["Selon Delvaux, la mode jetable nuit à l’environnement, exploite les travailleurs et ne fait pas réellement économiser.","Les arguments, reformulés et reliés."]]},retenir:["Ni copie, ni exemples, ni avis.","Proportionner selon l’importance, pas selon la longueur des paragraphes."]}],check:{q:"Un résumé raconte en détail l’anecdote d’ouverture et oublie le troisième argument. Quel critère est surtout touché ?",o:["La langue","La pertinence","La recevabilité","Aucun"],a:1,e:"Il garde l’accessoire (l’anecdote) et perd l’essentiel (un argument) : c’est un problème de pertinence."}},{id:"m6",titre:"Résumer un livre entier",resume:"Un essai fait de fragments : regrouper par idées, pas par chapitres.",pages:[{titre:"Un livre n’est pas un texte court",blocs:["Un livre comme Un jihad de l’amour contient une cinquantaine de fragments. Impossible de faire « un paragraphe par fragment » !","La méthode change d’échelle : on lit le livre par **grands mouvements**, puis on **regroupe** les fragments qui défendent la même idée. Plusieurs fragments, parfois éloignés, servent souvent un **même argument**.","Par exemple, le refus de la vengeance apparaît dans « Fraternité », « Vengeance », « La peine de mort », « Les auteurs » et « Politique » : un seul argument, cinq fragments."],visuel:{diagram:"mouvements"},retenir:["Lire par mouvements.","Regrouper les fragments par idée : plusieurs fragments = un argument."]},{titre:"Trier les fragments par fonction",blocs:["Dans un essai-témoignage, beaucoup de pages **racontent** (le jour de l’attentat, l’enfance) ou **expriment des émotions** (les poèmes à Loubna). Elles comptent énormément dans le livre, mais elles ne sont pas des arguments.","Elles ont une autre fonction : **émouvoir** le lecteur ([[pathos]]) et rendre l’auteur **crédible** ([[éthos]]) : il parle en victime, en musulman pratiquant, en enfant de Molenbeek.","Dans le résumé, on les évoque en **une phrase** de présentation de l’auteur. Le reste du résumé est consacré à la thèse et aux arguments."],visuel:{diagram:"fonctions-livre"},retenir:["Récit et lyrisme = autre fonction (émouvoir, rendre crédible).","Une phrase pour le contexte, le reste pour les arguments."]},{titre:"Du schéma du livre au résumé",blocs:["Une fois le schéma du livre terminé, la rédaction suit la fiche page 86, comme pour un texte court.","Pour un résumé d’environ 200 mots : une **introduction** de 40 à 50 mots (auteur, titre, date, genre, contexte en une phrase, thème et thèse), puis **un court paragraphe par argument** (25 à 35 mots chacun).","Choisis un ordre logique pour les arguments, puisque le livre est fragmentaire : par exemple, du refus de la vengeance à l’éducation."],visuel:{schema:"livre"},retenir:["Intro de 40 à 50 mots, puis un paragraphe court par argument.","Un ordre logique, annoncé par des connecteurs."]}],check:{q:"Le fragment où l’auteur raconte comment il a appris la mort de sa femme sert surtout à…",o:["prouver que la vengeance est inutile","émouvoir le lecteur et montrer d’où l’auteur parle","définir le mot jihad","réfuter un contre-argument"],a:1,e:"C’est un récit : il a une autre fonction que l’argumentation (pathos et éthos). On l’évoque en une phrase dans le résumé."}},{id:"m7",titre:"Du schéma au texte argumentatif",resume:"Le chemin inverse : déplier un schéma en paragraphes rédigés.",pages:[{titre:"D’une ligne du schéma à un paragraphe",blocs:["Le schéma fonctionne dans les deux sens. Tu sais passer d’un texte à son schéma ; tu peux aussi **déplier** un schéma pour écrire un texte argumentatif.","Chaque ligne du schéma devient un **paragraphe** : 1. la phrase-argument, introduite par un connecteur d’énumération ; 2. une ou deux phrases d’explication (« En effet, … ») ; 3. un exemple (« Par exemple, … ») ; 4. éventuellement une phrase de lien avec la thèse.","Entraîne-toi avec les trames de l’atelier : les débuts de phrases sont déjà là, tu complètes."],visuel:{compare:[["Argument : Le rire aide à supporter le malheur. → Explication : reprendre du pouvoir sur l’épreuve. → Exemple : les malades et les soignants.","Une ligne de schéma."],["Ensuite, le rire aide à supporter le malheur. En effet, rire d’une épreuve, c’est reprendre un peu de pouvoir sur elle. Par exemple, bien des malades disent que l’humour les a aidés à tenir.","Le paragraphe rédigé."]]},retenir:["Argument (connecteur) → explication (en effet) → exemple (par exemple) → lien avec la thèse."]},{titre:"Introduction et conclusion",blocs:["**L’introduction** amène le thème (une accroche : un fait, une question), puis formule la thèse clairement. Elle peut annoncer les arguments.","**La conclusion** reformule la thèse en résumant les arguments, puis propose une **ouverture** (une question, un conseil, un appel).","Pour convaincre davantage, ajoute un **contre-argument** et sa **réfutation** avant la conclusion : tu montres que tu as pensé à l’avis adverse."],visuel:{diagram:"plan-texte"},retenir:["Intro : accroche + thèse (+ annonce).","Conclusion : thèse reformulée + ouverture.","Un contre-argument réfuté renforce le texte."]}],check:{q:"En dépliant un schéma, quel connecteur introduit le mieux l’explication d’un argument ?",o:["Par exemple","En effet","En conclusion","Certes"],a:1,e:"« En effet » annonce une explication (une justification) de ce qui précède."}}];var xs=[{id:"l1",titre:"Le livre et son contexte",resume:"Qui parle, quand, pourquoi, et à qui ?",pages:[{titre:"Fiche d’identité",blocs:["Un jihad de l’amour est un livre court (une centaine de pages) paru en 2017. Son auteur, Mohamed El Bachiri, est un Bruxellois de Molenbeek, fils d’immigrés marocains, ancien conducteur de métro.","Le livre réunit des textes qu’il a écrits après la mort de sa femme et des propos recueillis lors d’un long entretien par l’écrivain flamand David Van Reybrouck, qui a organisé l’ensemble.","C’est un [[essai]]-[[témoignage]] : l’auteur raconte sa vie, mais surtout il défend des idées. C’est pour cela qu’on peut en faire un schéma argumentatif et un résumé."],visuel:{fiche:!0},retenir:["Mohamed El Bachiri, avec David Van Reybrouck, 2017.","Un essai-témoignage : récit + idées défendues."]},{titre:"Le contexte : le 22 mars 2016",blocs:["Le 22 mars 2016, des [[attentat|attentats]] frappent Bruxelles : à l’aéroport de Zaventem et dans une rame de métro, à la station Maelbeek. Loubna Lafquiri, l’épouse de l’auteur et la mère de leurs trois fils, meurt dans le métro.","Plusieurs terroristes impliqués dans les attentats de Paris et de Bruxelles avaient grandi à [[Molenbeek]]. La commune est alors montrée du doigt dans le monde entier, et ses habitants subissent des [[amalgame|amalgames]].","Fin 2016, à la télévision flamande, Mohamed El Bachiri, à la fois victime et musulman de Molenbeek, appelle à un « jihad de l’amour ». Sa prise de parole est très largement partagée ; le livre la prolonge."],visuel:{diagram:"contexte"},retenir:["22 mars 2016 : attentats de Bruxelles ; Loubna meurt à Maelbeek.","L’auteur est à la fois victime et suspect aux yeux de certains : le livre répond à ce paradoxe."]},{titre:"Qui parle, et à qui ?",blocs:["Le « je » du livre est celui de Mohamed El Bachiri. Mais il ne s’adresse pas toujours à la même personne : c’est une question d’[[énonciation]].","Il parle **à Loubna** dans les textes lyriques, **à ses fils** quand il refuse la vengeance, **aux auteurs des attentats** dans le fragment « Les auteurs », **aux jeunes de Molenbeek** et aux musulmans d’Europe, et enfin **à tous les lecteurs**.","Pour ton résumé, tu remplaces tous ces « je » par la 3e personne : « El Bachiri s’adresse aux jeunes et leur demande… »."],visuel:{diagram:"destinataires"},retenir:["Un seul « je », plusieurs destinataires : Loubna, ses fils, les terroristes, les jeunes, tous les lecteurs."]}],check:{q:"Pourquoi peut-on faire le schéma argumentatif de ce livre, alors que c’est un témoignage ?",o:["Parce que c’est un roman","Parce qu’en plus de raconter, l’auteur défend une thèse avec des arguments","Parce qu’il ne contient aucun récit","Parce qu’il a été écrit par un journaliste"],a:1,e:"C’est un essai-témoignage : à côté des récits et des poèmes, l’auteur défend une thèse (répondre à la haine par l’amour) avec des arguments."}},{id:"l2",titre:"La structure du livre",resume:"Huit mouvements, une cinquantaine de fragments.",pages:[{titre:"Huit grands mouvements",blocs:["Le livre est fait de fragments courts, chacun avec un titre. Certains ne font qu’une phrase ! C’est une [[écriture fragmentaire]].","On peut les regrouper en huit mouvements, du choc de l’attentat jusqu’à l’appel final. Lis le résumé de chaque mouvement à droite.","Les titres des fragments sont ici traduits des éditions néerlandaise et anglaise : vérifie-les dans ton exemplaire français et note les pages."],visuel:{mouvements:!0},retenir:["Du deuil (début) à l’appel (fin), en passant par les origines, Loubna, le refus de la vengeance, les appartenances et le manifeste."]},{titre:"Mouvements 1 à 3 : la lettre, le deuil, les origines",blocs:["Le début du livre est surtout **narratif** et **lyrique** : la mort de Loubna, les nuits sans sommeil, l’enfance à Molenbeek.","Mais des fragments **argumentatifs** apparaissent déjà : « Le Coran », « Réflexion », « Compassion ». L’auteur y explique comment il lit sa religion.","Pour chaque fragment, demande-toi : raconte-t-il, exprime-t-il une émotion, ou défend-il une idée ?"],visuel:{fragments:[1,2,3]},retenir:["Début surtout narratif et lyrique, avec déjà des passages argumentatifs sur la foi et la raison."]},{titre:"Mouvements 4 et 5 : Loubna, et la réponse à l’attentat",blocs:["Le mouvement 4 raconte l’histoire d’amour avec Loubna et lui rend hommage : il a une fonction **lyrique**.","Le mouvement 5 est le **cœur argumentatif** du refus de la vengeance : ce que l’auteur dit à ses fils, le poème « Vengeance », la peine de mort, la phrase adressée aux terroristes."],visuel:{fragments:[4,5]},retenir:["Mouvement 5 : le refus de la vengeance, argument central (A1)."]},{titre:"Mouvements 6 à 8 : appartenances, manifeste, appel",blocs:["Le mouvement 6 défend Molenbeek et la double appartenance belge et marocaine.","Le mouvement 7 est un véritable **manifeste** : l’auteur y expose ses principes (humanité, sens du jihad, raison, séparation de la religion et de l’État).","Le mouvement 8 termine par des poèmes et un appel : l’amour comme réponse à la haine."],visuel:{fragments:[6,7,8]},retenir:["Mouvement 7 : le manifeste ; c’est là que la thèse est la plus explicite."]}],check:{q:"Dans quel mouvement l’auteur expose-t-il le plus clairement ses principes (humanité, sens du jihad, raison) ?",o:["Mouvement 2 : le choc et le deuil","Mouvement 4 : Loubna","Mouvement 7 : le manifeste","Mouvement 8 : l’appel"],a:2,e:"Les fragments « Jihad », « Humanité », « Politique », « Honnêteté », « Séparation… » forment un manifeste."}},{id:"l3",titre:"Le mot au cœur du livre : jihad",resume:"Pourquoi ce titre choque, et ce qu’il veut dire.",pages:[{titre:"Un titre qui surprend",blocs:["Pour beaucoup de lecteurs, le mot « jihad » évoque la guerre et le terrorisme. L’associer à « amour » surprend : cela ressemble à un [[oxymore]].","Mais l’auteur ne joue pas seulement avec les mots. Il **reprend** le mot à ceux qui l’ont détourné et lui rend son **sens premier** : c’est une [[réappropriation]].","Le livre s’ouvre d’ailleurs sur une définition de dictionnaire qui distingue deux sens : le « grand jihad », effort de chacun contre ses passions, et le « petit jihad », combat pour défendre l’islam."],visuel:{diagram:"jihad"},retenir:["Jihad = d’abord un effort sur soi (grand jihad).","Le titre est une réappropriation : reprendre le mot aux terroristes."]},{titre:"Être un « jihadiste de l’amour »",blocs:["Dans le fragment « Jihad », l’auteur se dit plus « jihadiste » que le plus grand guerrier, car résister à la haine demande un immense effort.","Il décrit le vrai jihadiste : quelqu’un qui ne se met pas en colère, qui cherche le savoir, qui va vers les autres même quand ils sont fermés, et qui garde le sourire.","Cet argument (A2) est essentiel : il donne son sens au titre et à la thèse. Dans ton résumé, explique-le avec des mots simples : « un effort sur soi contre la haine »."],visuel:{arg:"A2"},retenir:["« Jihad de l’amour » = un effort sur soi pour refuser la haine et aller vers l’autre."]}],check:{q:"Que fait l’auteur avec le mot « jihad » ?",o:["Il l’évite","Il lui rend son sens premier d’effort sur soi","Il l’utilise pour menacer","Il le remplace par un autre mot"],a:1,e:"Il se réapproprie le mot et lui rend son sens premier : l’effort contre ses propres passions."}},{id:"l4",titre:"Ce que révèlent les traductions",resume:"Comparer l’édition néerlandaise et l’édition anglaise.",pages:[{titre:"Un livre en plusieurs langues",blocs:["Cette application a été préparée à partir de deux éditions du livre : l’édition **néerlandaise**, parue en premier, et l’édition **anglaise**, traduite du néerlandais. Comparer les deux éclaire le sens.","Leçon principale : d’une langue à l’autre, **les mots changent, les idées restent**. C’est exactement le principe du résumé : garder les idées, pas les mots.","Ouvre chaque comparaison à droite."],visuel:{traductions:[0,1,2]},retenir:["Les mots changent d’une traduction à l’autre, les idées restent : c’est ce qu’on garde dans un résumé."]},{titre:"D’autres nuances",blocs:["Quand deux versions ne disent pas exactement la même chose, cherche ce qu’elles ont **en commun** : c’est le noyau de l’idée, celui que tu dois reformuler.","En classe et à l’examen, cite toujours l’**édition française** que tu as lue, et vérifie les pages."],visuel:{traductions:[3,4,5,6]},retenir:["Le noyau commun aux traductions = l’idée à résumer."]}],check:{q:"En néerlandais, le jihad est expliqué par « inspanning ». Que signifie ce mot ?",o:["La guerre","L’effort","La prière","La vengeance"],a:1,e:"« Inspanning » veut dire « effort ». L’anglais dit « struggle » (lutte) : la nuance est plus guerrière."}},{id:"l5",titre:"L’argumentation du livre",resume:"Thème, thèse et les cinq arguments, avec leurs développements et leurs exemples.",pages:[{titre:"Le thème et la thèse",blocs:["**Thème** : la réponse à apporter à la haine et à la violence terroriste.","**Thèse** : face à la haine, il faut répondre par l’amour, c’est-à-dire mener un « jihad de l’amour » : un effort sur soi pour refuser la vengeance et reconnaître l’humanité de chacun.","La thèse est explicite dans les fragments « Jihad », « Le cœur » et « Ce livre », et reprise dans les poèmes de la fin. L’auteur s’appuie sur **cinq arguments**, développés dans les pages suivantes."],visuel:{schema:"livre"},retenir:["Thème : répondre à la haine.","Thèse : répondre par l’amour, un effort sur soi (jihad de l’amour)."]},{titre:"Argument 1 : la vengeance reproduit le mal",blocs:["Premier argument : se venger, c’est commettre la même faute que les assassins. La haine d’un camp nourrit celle de l’autre.","Ce que l’auteur répond à ses fils en colère en est l’exemple le plus fort. Le fragment sur le conflit israélo-palestinien montre la même logique à grande échelle."],visuel:{arg:"A1"},retenir:["A1 : la vengeance reproduit le mal (ex. : ses fils, le poème « Vengeance », la peine de mort)."]},{titre:"Argument 2 : le vrai sens du jihad",blocs:["Deuxième argument : le jihad est d’abord un effort contre soi-même, pas une guerre. Les terroristes ont détourné le mot.","C’est cet argument qui donne son titre au livre."],visuel:{arg:"A2"},retenir:["A2 : jihad = effort sur soi (ex. : la définition du dictionnaire, les paroles du Prophète sur la colère)."]},{titre:"Argument 3 : une foi éclairée par la raison",blocs:["Troisième argument : lue avec la raison et replacée dans son contexte, la religion mène à l’amour.","L’auteur distingue l’axe vertical (le lien à Dieu) et l’axe horizontal (les règles d’une époque). Il refuse tous les fondamentalismes."],visuel:{arg:"A3"},retenir:["A3 : une foi raisonnée (ex. : le Prophète à La Mecque et à Médine, la question sur Mère Teresa)."]},{titre:"Argument 4 : tous frères en humanité",blocs:["Quatrième argument : notre humanité commune passe avant ce qui nous divise.","Trois valeurs la fondent : le caractère sacré de la vie, le libre arbitre et la fraternité."],visuel:{arg:"A4"},retenir:["A4 : la fraternité humaine (ex. : l’école catholique, Damas, Averroès, les prières du monde entier)."]},{titre:"Argument 5 : la diversité et l’éducation",blocs:["Cinquième argument : la diversité est une richesse, et l’éducation permet de vivre ensemble, au lieu du repli ou des préjugés.","Une communauté doit être « une porte, pas une forteresse »."],visuel:{arg:"A5"},retenir:["A5 : diversité et éducation (ex. : « sale Marocain », le Molenbeek des médias, la belgitude)."]}],check:{q:"« Les musulmans de Damas autorisés à prier dans une église » : quel argument cet exemple illustre-t-il ?",o:["A1 : la vengeance reproduit le mal","A2 : le vrai sens du jihad","A4 : tous frères en humanité","A5 : la diversité et l’éducation"],a:2,e:"L’exemple montre que des croyants différents peuvent se reconnaître comme frères : c’est l’argument de l’humanité commune (A4)."}},{id:"l6",titre:"Le résumé du livre",resume:"Ce qu’on garde, ce qu’on laisse, et deux résumés modèles.",pages:[{titre:"Ce qu’il ne faut pas mettre",blocs:["Le livre est riche en émotions et en anecdotes. C’est précisément ce qui rend son résumé difficile : on a envie de tout raconter.","Relis la liste des pièges à droite avant de rédiger."],visuel:{pieges:!0},retenir:["Pas de récit détaillé, pas de poèmes, pas d’avis, pas tous les exemples."]},{titre:"Un résumé modèle court",blocs:["Voici un résumé d’environ 150 mots. Observe : l’introduction (source, contexte en une phrase, thème, thèse), puis un connecteur et un argument par phrase.","Il ne contient aucun exemple : tout est généralisé."],visuel:{resume:"court"},retenir:["Intro + un argument par phrase, reliés par des connecteurs."]},{titre:"Un résumé modèle plus développé",blocs:["Avec 250 mots, on peut garder l’explication principale de chaque argument.","Compare-le au résumé court : qu’a-t-on ajouté ? Des explications, jamais des anecdotes."],visuel:{resume:"long"},retenir:["Plus de mots = plus d’explications, pas plus d’exemples."]}],check:{q:"Dans un résumé de 150 mots, faut-il raconter comment l’auteur a appris la mort de sa femme ?",o:["Oui, en détail, car c’est émouvant","Non : une phrase de contexte suffit, le reste est consacré aux arguments","Oui, à la place de la thèse","Seulement à la fin"],a:1,e:"Le récit a une autre fonction. On le mentionne en une phrase (« dont l’épouse a été tuée… ») pour présenter l’auteur."}}];var Qm={1:["lv1","Niveau 1 · reconnaître"],2:["lv2","Niveau 2 · appliquer avec aide"],3:["lv3","Niveau 3 · réaliser seul"]},Hm=[{id:"methode",t:"S’entraîner sur la méthode (textes courts)"},{id:"livre",t:"S’entraîner sur Un jihad de l’amour"}],pn=[{id:"f1",groupe:"methode",titre:"Reconnaître les éléments",comp:"Texte → schéma",but:"Distinguer le thème de la thèse, et l’argument de l’exemple, sur des phrases isolées.",methode:["Thème : un sujet, sans avis (souvent un groupe nominal).","Thèse : une opinion, une phrase complète.","Argument : général, il répond à « pourquoi ? ». Exemple : particulier (nom, lieu, date, chiffre)."],resolu:{consigne:"Classe ces trois phrases : « La mode jetable. » ; « Il faut refuser la mode jetable. » ; « Le Rana Plaza s’est effondré en 2013. »",etapes:[{t:"1. Je cherche s’il y a un avis",d:"« La mode jetable » ne donne aucun avis : c’est un sujet, donc le thème."},{t:"2. Je repère la phrase qui prend position",d:"« Il faut refuser… » exprime une opinion avec « il faut » : c’est la thèse."},{t:"3. Je teste « par exemple »",d:"« Par exemple, le Rana Plaza s’est effondré en 2013 » fonctionne, et la phrase contient une date et un lieu précis : c’est un exemple."}],reponse:"Thème : la mode jetable. Thèse : il faut refuser la mode jetable. Exemple : l’effondrement du Rana Plaza en 2013 (il illustre l’argument de l’exploitation des travailleurs)."},items:[{id:"f1a",niveau:1,type:"tri",consigne:"Thème ou thèse ? Classe chaque étiquette.",cats:["Thème","Thèse"],etiquettes:[["Le vote des jeunes de seize ans",0],["Les jeunes de seize ans devraient pouvoir voter",1],["L’humour et ses limites",0],["On peut rire de tout, mais pas pour humilier",1],["La place de l’IA à l’école",0],["Interdire l’IA à l’école serait une erreur",1],["La réponse à la haine terroriste",0],["Il faut répondre à la haine par l’amour",1]],conclusion:"Le thème est un sujet neutre ; la thèse prend position (devraient, il faut, serait une erreur, on peut… mais)."},{id:"f1b",niveau:1,type:"tri",consigne:"Argument, explication ou exemple ? Toutes les phrases viennent de textes différents.",cats:["Argument","Explication","Exemple"],etiquettes:[["Les zoos sensibilisent le public.",0],["Voir un animal en vrai crée une émotion qui donne envie de protéger la nature.",1],["L’oryx d’Arabie a retrouvé le désert grâce à des animaux nés en captivité.",2],["La vengeance n’a pas de fin.",0],["Chaque représailles en appelle une autre.",1],["Les vendettas entre familles ont duré des décennies.",2],["Bien utilisée, l’IA peut aider à apprendre.",0],["Elle peut réexpliquer une notion autrement, si l’élève fait lui-même le travail.",1],["Un élève peut lui demander trois exemples de plus d’une règle de grammaire.",2]],conclusion:"L’argument est la raison générale ; l’explication développe cette raison ; l’exemple est un cas particulier."},{id:"f1c",niveau:2,type:"qcm",q:"« Les grandes marches pour le climat ont montré que de nombreux adolescents se passionnent pour ces questions. » Quel argument cet exemple soutient-il ?",o:["Les jeunes sont trop influençables.","Les décisions politiques concernent directement les jeunes, qui s’y intéressent.","Voter coûte cher.","Les adultes votent mal."],a:1,e:"L’exemple montre l’intérêt des jeunes pour des décisions qui les concernent : il illustre l’argument « les décisions politiques concernent directement les jeunes »."},{id:"f1d",niveau:2,type:"qcm",q:"Laquelle de ces phrases est un argument (et non un exemple) ?",o:["En 2013, un immeuble d’ateliers s’est effondré au Bangladesh.","Inès a acheté cinq t-shirts samedi.","La mode jetable repose sur l’exploitation de travailleurs.","Un jean peut demander plusieurs milliers de litres d’eau."],a:2,e:"C’est la seule phrase générale qui répond à « pourquoi refuser la mode jetable ? ». Les autres sont des cas particuliers."}]},{id:"f2",groupe:"methode",titre:"Repérer dans un texte",comp:"Texte → schéma",but:"Marquer, directement dans le texte, le rôle de chaque phrase. Les textes sont de plus en plus longs et complexes.",methode:["Lis d’abord tout le texte une fois.","Trouve la thèse en premier (début, fin, marques d’opinion).","Cherche les connecteurs : ils annoncent souvent le rôle de la phrase.","Marque ensuite les phrases qui ont une autre fonction (accroche, anecdote, citation)."],resolu:{consigne:"Observe comment on marque le premier paragraphe du texte sur les zoos.",etapes:[{t:"1. « Chaque année, des millions de visiteurs… »",d:"Aucun avis, aucune raison : la phrase plante le décor. Autre fonction (accroche)."},{t:"2. « Certes, un animal en captivité… »",d:"« Certes » annonce une concession : l’auteur admet une part de l’avis adverse. Contre-argument."},{t:"3. « Pourtant, les zoos modernes restent utiles… »",d:"« Pourtant » renverse la concession et l’auteur donne son opinion : thèse."}],reponse:"Accroche → concession → thèse : un ordre très fréquent dans les introductions."},items:[{id:"f2a",niveau:1,type:"marquer",texte:"t1",roles:["amorce","these","arg","expl","ex","concl"],consigne:"Marque le rôle de chaque phrase du texte « Ranger son téléphone pour mieux apprendre »."},{id:"f2b",niveau:2,type:"marquer",texte:"t2",roles:["amorce","these","arg","expl","ex","contre","concl"],consigne:"Marque le rôle de chaque phrase du texte « Des zoos pour protéger ». Attention à la concession."},{id:"f2c",niveau:2,type:"marquer",texte:"t3",roles:["amorce","these","arg","expl","ex","contre","refut","concl"],consigne:"Marque le rôle de chaque phrase du texte « Voter à seize ans »."},{id:"f2d",niveau:3,type:"marquer",texte:"t4",roles:["amorce","these","arg","expl","ex","contre","refut","concl"],consigne:"Marque le rôle de chaque phrase du texte « La mode jetable nous coûte cher ». L’introduction commence par une anecdote."},{id:"f2e",niveau:3,type:"marquer",texte:"t5",roles:["amorce","these","arg","expl","ex","contre","refut","concl"],consigne:"Marque le rôle de chaque phrase du texte « Rire de tout, mais pas n’importe comment ». La thèse est nuancée."}]},{id:"f3",groupe:"methode",titre:"Compléter un schéma à trous",comp:"Texte → schéma",but:"Compléter des schémas où il manque de plus en plus de cases : l’aide diminue à chaque exercice.",methode:["Relis le texte (ouvre-le à côté du schéma).","Écris court : un groupe nominal ou une phrase simple.","Reformule avec tes mots, sans changer le sens."],resolu:{consigne:"Il manque l’exemple du premier argument dans le schéma du texte sur le téléphone.",etapes:[{t:"1. Je repère l’argument",d:"Argument 1 : le téléphone empêche de se concentrer."},{t:"2. Je cherche le cas concret qui le suit",d:"Après « Par exemple », le texte parle d’un élève qui reçoit trois messages pendant un exercice."},{t:"3. Je l’écris en bref",d:"« L’élève qui reçoit trois messages pendant un exercice de mathématiques. »"}],reponse:"Exemple de l’argument 1 : l’élève interrompu par trois messages pendant un exercice."},items:[{id:"f3a",niveau:1,type:"schema-trous",texte:"t1",trous:["ex0","ex1"],consigne:"Complète les deux exemples du schéma."},{id:"f3b",niveau:2,type:"schema-trous",texte:"t2",trous:["these","arg1","expl2","contre"],consigne:"Complète la thèse, le deuxième argument, l’explication du troisième et la concession."},{id:"f3c",niveau:2,type:"schema-trous",texte:"t3",trous:["theme","these","arg0","arg1","contre"],consigne:"Complète le thème, la thèse, les deux arguments et le contre-argument."},{id:"f3d",niveau:3,type:"schema-trous",texte:"t5",trous:["theme","these","arg0","expl0","arg1","ex1","arg2","contre"],consigne:"Il ne reste presque rien : complète le schéma du texte sur l’humour."}]},{id:"f4",groupe:"methode",titre:"Construire le schéma complet",comp:"Texte → schéma",but:"Réaliser seul le schéma d’un texte inconnu, comme à l’examen.",methode:["Suis la procédure de la page 78, étape par étape.","Une ligne par argument ; explication et exemple sur la même ligne.","Contre-argument et réfutation dans la case à part.","Compare ensuite avec le corrigé : as-tu les mêmes arguments, même formulés autrement ?"],resolu:{consigne:"Rappel de la procédure, avec le texte « Voter à seize ans ».",etapes:[{t:"Étapes 1 et 2 : comprendre, thème et thèse",d:"Thème : le vote des jeunes de seize ans. Thèse : il faut leur accorder le droit de vote à toutes les élections."},{t:"Étape 3 : autres fonctions",d:"La première phrase (le vote européen de 2024) donne le contexte."},{t:"Étape 4 : arguments et exemples",d:"Deux arguments annoncés par « la première raison » et « la seconde raison », chacun avec un exemple ; un contre-argument (« On objecte… ») et sa réfutation (« Mais… »)."},{t:"Étape 5 : je trace et je reformule",d:"Je remplis le schéma de A à E en phrases courtes, avec mes mots."}],reponse:"Le schéma complet est visible dans la leçon « La méthode du schéma »."},items:[{id:"f4a",niveau:2,type:"schema-vide",texte:"t4",consigne:"Construis le schéma complet du texte « La mode jetable nous coûte cher »."},{id:"f4b",niveau:3,type:"schema-vide",texte:"t6",consigne:"Construis le schéma complet du texte « L’intelligence artificielle à l’école »."},{id:"f4c",niveau:3,type:"schema-vide",texte:"t7",consigne:"Construis le schéma complet du texte « Punir sans se venger »."}]},{id:"f5",groupe:"methode",titre:"Hiérarchiser et reformuler",comp:"Texte → schéma",but:"Garder l’essentiel, supprimer l’accessoire, et dire la même chose en plus court avec ses mots.",methode:["Essentiel : thèse, arguments, explication principale. Accessoire : anecdotes, exemples, répétitions.","Raccourcir, généraliser, nominaliser.","Vérifier que le sens n’a pas changé."],resolu:{consigne:"Reformul
