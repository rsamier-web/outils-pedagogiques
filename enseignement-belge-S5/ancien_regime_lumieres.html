",noeuds:["Doctrine politique et \xE9conomique","S\u2019appuie sur les Lumi\xE8res","Individu libre et seul responsable de ses choix","Pas d\u2019\xC9tat central fort","R\xE9gulation par le march\xE9","Donne naissance au capitalisme","Oppos\xE9 au socialisme, au communisme, au fascisme"]},{type:"table",head:["Attribut","Exemples dans l\u2019histoire"],rows:[["Doctrine politique","Partis qui s\u2019en r\xE9clament\u202F: Mouvement R\xE9formateur (Belgique), Les R\xE9publicains (France)"],["S\u2019appuie sur les Lumi\xE8res","John Locke, Montesquieu, Benjamin Constant"],["Libert\xE9 individuelle","DDHC 1789\u202F: \xAB\xA0Les hommes naissent et demeurent libres et \xE9gaux en droits\xA0\xBB"],["Contre un \xC9tat central fort","\xC9tats-Unis\u202F; Belgique (monarchie limit\xE9e par la Constitution)"],["Lib\xE9ralisme \xE9conomique","Le march\xE9 r\xE9gule la vie \xE9conomique par la libre concurrence"]]},{type:"p",t:"Exemples concrets\u202F: **1776** Adam Smith, *Recherche sur la nature et les causes de la richesse des nations*\u202F; **1789** R\xE9volution fran\xE7aise (abolition des privil\xE8ges, DDHC)\u202F; **XIXe si\xE8cle**\u202F: industriels qui d\xE9fendent la libert\xE9 d\u2019entreprendre. Le tableau de **Delacroix**, *La Libert\xE9 guidant le peuple* (**1830**), symbolise le lib\xE9ralisme politique\u202F: il repr\xE9sente les Trois Glorieuses (juillet 1830) qui renversent Charles X."}]},{id:"c5",titre:"Concept 5 \xB7 Socialisme",blocs:[{type:"p",t:"**Origine**\u202F: du latin *socialis* (\xAB\xA0sociable, fait pour la soci\xE9t\xE9\xA0\xBB), lui-m\xEAme de *socius* (\xAB\xA0uni, associ\xE9\xA0\xBB). Le mot appara\xEEt au **XIXe si\xE8cle** (italien *socialismo* 1803, anglais *socialism* 1822)."},{type:"p",t:"**D\xE9finition**\u202F: doctrine politique et \xE9conomique n\xE9e au **XIXe si\xE8cle** dans le contexte de la **r\xE9volution industrielle**. Elle s\u2019oppose au **capitalisme** et d\xE9nonce ses cons\xE9quences sociales (mis\xE8re ouvri\xE8re, ch\xF4mage, in\xE9galit\xE9s). Elle remet en cause, \xE0 des degr\xE9s divers, la **propri\xE9t\xE9 priv\xE9e** et d\xE9fend la **justice sociale**, la **solidarit\xE9**, l\u2019**int\xE9r\xEAt g\xE9n\xE9ral**, la **r\xE9partition \xE9quitable des ressources**."},{type:"table",head:["Courant","Id\xE9e"],rows:[["Anarchisme","Abolir l\u2019\xC9tat, qui opprime les ouvriers (Proudhon)."],["Socialisme r\xE9volutionnaire / communisme","Renverser le capitalisme par la r\xE9volution\u202F; dictature du prol\xE9tariat\u202F; soci\xE9t\xE9 sans classes\u202F; propri\xE9t\xE9 collective des moyens de production\u202F; \xE9conomie centralis\xE9e."],["Socialisme r\xE9formiste / social-d\xE9mocratie","Transformer pacifiquement le capitalisme\u202F: lois sociales, intervention de l\u2019\xC9tat, propri\xE9t\xE9 priv\xE9e et publique, \xE9conomie r\xE9gul\xE9e par l\u2019\xC9tat."]]},{type:"p",t:"**Karl Marx** (1818-1883) d\xE9veloppe le **socialisme scientifique** (marxisme)\u202F: propri\xE9t\xE9 collective des moyens de production (usines, machines, terres, outils\u2026), suppression des classes sociales, r\xE9partition plus \xE9galitaire des richesses. En **1848**, Marx et **Engels** publient le **Manifeste du Parti communiste**. Avant eux, les socialistes \xAB\xA0**utopistes**\xA0\xBB (Owen, Saint-Simon) imaginent des soci\xE9t\xE9s id\xE9ales. En **1919**, **L\xE9nine** fonde la **IIIe Internationale**."},{type:"retenir",t:"Le **drapeau rouge** est le principal symbole du socialisme et du communisme. Le socialisme est **oppos\xE9 au lib\xE9ralisme \xE9conomique**."}]},{id:"c6",titre:"Concept 6 \xB7 Imp\xE9rialisme",blocs:[{type:"p",t:"**Origine**\u202F: du latin *imperium*. Le mot \xAB\xA0imp\xE9rialisme\xA0\xBB est cr\xE9\xE9 en France vers **1832** (partisans du retour de l\u2019Empire de Napol\xE9on)\u202F; l\u2019anglais *imperialism* (**1878**) d\xE9signe l\u2019expansion coloniale britannique."},{type:"p",t:"**D\xE9finition**\u202F: politique d\u2019**expansion** et de **domination** d\u2019un \xC9tat (ou groupe d\u2019\xC9tats) sur un autre \xC9tat (ou groupe d\u2019\xC9tats) pour le(s) rendre **d\xE9pendant(s)**, dans le but de former un **empire**. Elle s\u2019\xE9tablit **par la force ou par l\u2019influence** et touche diff\xE9rents domaines (culture, \xE9conomie, religion, d\xE9mographie\u2026). Pour les marxistes, c\u2019est la phase ultime du capitalisme (sens p\xE9joratif)."},{type:"schema",kind:"conceptMap",centre:"Imp\xE9rialisme",noeuds:["Politique d\u2019expansion et de domination","Acteurs\u202F: cit\xE9, \xC9tat, acteurs \xE9conomiques, religieux","Par la force ou par l\u2019influence","Domaines\u202F: culture, \xE9conomie, politique, militaire, religion","But\u202F: former un empire"]},{type:"table",head:["Forme de domination","Exemple"],rows:[["Colonisation","Congo belge, Alg\xE9rie fran\xE7aise"],["Protectorat","Protectorats fran\xE7ais sur la Tunisie, Madagascar, le Laos, le Maroc"],["Pays satellites","L\u2019URSS et les pays du pacte de Varsovie"],["N\xE9o-colonialisme","Gabon\u202F: entreprises fran\xE7aises qui exploitent le p\xE9trole"],["N\xE9o-imp\xE9rialisme","\xC9tats-Unis\u202F: domination morale, libre-\xE9change, mondialisation, domination militaire et m\xE9diatique"]]}]},{id:"c7",titre:"Concept 7 \xB7 Croissance",blocs:[{type:"p",t:"**D\xE9finition**\u202F: augmentation **durable et soutenue** de l\u2019activit\xE9 \xE9conomique, et/ou de la d\xE9mographie, et/ou du niveau de vie."},{type:"schema",kind:"conceptMap",centre:"Facteurs de croissance",noeuds:["\xC9conomique\u202F: rendements, productions et b\xE9n\xE9fices en hausse","D\xE9mographique\u202F: la population augmente","Social\u202F: le niveau de vie augmente","Culturel\u202F: des innovations voient le jour","Politique\u202F: une paix g\xE9n\xE9ralis\xE9e"]},{type:"retenir",t:"Pour l\u2019Ancien R\xE9gime\u202F: la croissance est **frein\xE9e** (agriculture peu productive, crises, transports lents, corporations). Les Lumi\xE8res (Smith) proposent la **libert\xE9 \xE9conomique** pour la favoriser."}]}]}],de=Rn.flatMap(e=>e.sections.map(t=>({...t,chapitre:e.id,chapitreTitre:e.court})));var Ke=[{id:"f1",titre:"D\xE9finir et caract\xE9riser",competence:"Restitution des savoirs",description:"Donner une d\xE9finition pr\xE9cise d\u2019un mot ou d\u2019un concept, avec ses crit\xE8res et un exemple.",methode:["Commence par la cat\xE9gorie g\xE9n\xE9rale\u202F: \xAB\xA0C\u2019est un r\xE9gime / un imp\xF4t / une doctrine / un groupe\u2026\xA0\xBB.","Ajoute ce qui le distingue (les crit\xE8res ou attributs).","Termine par un exemple pr\xE9cis tir\xE9 du cours."],resolu:{consigne:"D\xE9finis la stratification sociale et donne un exemple.",etapes:[{t:"Cat\xE9gorie g\xE9n\xE9rale",d:"La stratification sociale est un **d\xE9coupage de la soci\xE9t\xE9**."},{t:"Crit\xE8res",d:"\u2026en cat\xE9gories (strates) **distinctes** et **hi\xE9rarchis\xE9es**, \xE0 cause d\u2019**in\xE9galit\xE9s** de richesse, de pouvoir, de prestige, de culture ou de profession. Les groupes se distinguent par leur statut, leur profession, leur \xE9ducation, leurs droits et devoirs."},{t:"Exemple",d:"Ex.\u202F: la **soci\xE9t\xE9 d\u2019ordres** d\u2019Ancien R\xE9gime, divis\xE9e en clerg\xE9, noblesse et Tiers \xE9tat."}],reponse:"La stratification sociale est le d\xE9coupage de la soci\xE9t\xE9 en cat\xE9gories (strates) distinctes et hi\xE9rarchis\xE9es, \xE0 cause d\u2019in\xE9galit\xE9s de richesse, de pouvoir, de prestige, de culture ou de profession. Ex.\u202F: la soci\xE9t\xE9 d\u2019ordres de l\u2019Ancien R\xE9gime (clerg\xE9, noblesse, Tiers \xE9tat)."},exercices:[{id:"f1e1",niveau:1,consigne:"D\xE9finis\u202F: la d\xEEme, la taille, la gabelle, les banalit\xE9s.",aides:["Pour chacun\u202F: qui le per\xE7oit\u202F? sur quoi\u202F?"],correction:`**D\xEEme**\u202F: imp\xF4t pr\xE9lev\xE9 par l\u2019\xC9glise sur une partie des r\xE9coltes.
**Taille**\u202F: imp\xF4t direct royal pay\xE9 par les non-privil\xE9gi\xE9s.
**Gabelle**\u202F: imp\xF4t royal sur le sel.
**Banalit\xE9s**\u202F: obligation de payer pour utiliser le moulin, le four ou le pressoir du seigneur.`,criteres:["J\u2019ai indiqu\xE9 qui per\xE7oit chaque charge.","J\u2019ai pr\xE9cis\xE9 sur quoi elle porte."]},{id:"f1e2",niveau:1,consigne:"Explique la diff\xE9rence entre noblesse d\u2019\xE9p\xE9e et noblesse de robe.",aides:["Pense \xE0 l\u2019anciennet\xE9 et \xE0 la mani\xE8re d\u2019entrer dans la noblesse."],correction:`La **noblesse d\u2019\xE9p\xE9e** est la noblesse **ancienne**, transmise par la **naissance**, li\xE9e \xE0 la fonction **militaire**.
La **noblesse de robe** est une noblesse **r\xE9cente**\u202F: des **bourgeois anoblis** par l\u2019**achat d\u2019une charge** (office) judiciaire ou administrative, d\u2019une terre noble, ou par le **roi**.`,criteres:["J\u2019ai oppos\xE9 ancienne / r\xE9cente.","J\u2019ai expliqu\xE9 comment on entre dans la noblesse de robe."]},{id:"f1e3",niveau:1,consigne:"D\xE9finis la d\xE9mocratie et l\u2019autoritarisme en donnant l\u2019\xE9tymologie et trois crit\xE8res de chacun.",aides:["D\xE9mocratie\u202F: grec. Autoritarisme\u202F: latin."],correction:`**D\xE9mocratie** (grec d\xEAmos = peuple, kratos = pouvoir)\u202F: r\xE9gime dans lequel le pouvoir est d\xE9tenu ou contr\xF4l\xE9 par le peuple, sans distinction de naissance, de richesse ou de comp\xE9tence. Crit\xE8res\u202F: \xE9lections, droit de vote, s\xE9paration des pouvoirs (aussi\u202F: libert\xE9, \xE9galit\xE9, acc\xE8s \xE0 la connaissance des lois).
**Autoritarisme** (latin auctoritas = autorit\xE9)\u202F: caract\xE8re autoritaire, arbitraire d\u2019un r\xE9gime qui veut imposer \xE0 la soci\xE9t\xE9 la toute-puissance de l\u2019\xC9tat. Crit\xE8res\u202F: une seule personne au pouvoir, pas de s\xE9paration des pouvoirs, usage de la force et de la violence (aussi\u202F: conditionnement des esprits, r\xE9gime impos\xE9 \xE0 tous, texte fondateur qui limite les libert\xE9s).`,criteres:["\xC9tymologie correcte pour les deux.","Trois crit\xE8res corrects pour chacun."]},{id:"f1e4",niveau:2,consigne:"D\xE9finis le lib\xE9ralisme et le socialisme, puis montre en deux phrases pourquoi ils s\u2019opposent.",aides:["Compare leur position sur la propri\xE9t\xE9 priv\xE9e et le r\xF4le de l\u2019\xC9tat."],correction:`**Lib\xE9ralisme**\u202F: doctrine inspir\xE9e des Lumi\xE8res qui pr\xF4ne la libert\xE9 individuelle (politique, \xE9conomique\u2026) et s\u2019oppose \xE0 un \xC9tat central fort\u202F; le lib\xE9ralisme \xE9conomique (\xAB\xA0laisser faire, laisser passer\xA0\xBB) a donn\xE9 naissance au capitalisme.
**Socialisme**\u202F: doctrine n\xE9e au XIXe si\xE8cle (r\xE9volution industrielle) qui s\u2019oppose au capitalisme, remet en cause la propri\xE9t\xE9 priv\xE9e et d\xE9fend la justice sociale, la solidarit\xE9, la r\xE9partition \xE9quitable des ressources.
**Opposition**\u202F: le lib\xE9ralisme laisse le march\xE9 r\xE9guler l\u2019\xE9conomie et d\xE9fend la propri\xE9t\xE9 priv\xE9e, alors que le socialisme veut que l\u2019\xC9tat ou la collectivit\xE9 interviennent (lois sociales, propri\xE9t\xE9 collective) pour r\xE9duire les in\xE9galit\xE9s. Le premier privil\xE9gie la libert\xE9 individuelle, le second l\u2019\xE9galit\xE9 et la solidarit\xE9.`,criteres:["Deux d\xE9finitions compl\xE8tes.","Opposition sur la propri\xE9t\xE9 et le r\xF4le de l\u2019\xC9tat."]},{id:"f1e5",niveau:2,consigne:"D\xE9finis l\u2019imp\xE9rialisme et classe ces exemples selon la forme de domination\u202F: Congo belge, Maroc (1912-1956), pays du pacte de Varsovie, Gabon et le p\xE9trole.",aides:["Formes\u202F: colonisation, protectorat, pays satellite, n\xE9o-colonialisme."],correction:`**Imp\xE9rialisme**\u202F: politique d\u2019expansion et de domination d\u2019un \xC9tat sur un autre pour le rendre d\xE9pendant et former un empire, par la force ou par l\u2019influence.
Congo belge \u2192 **colonisation**\u202F; Maroc \u2192 **protectorat**\u202F; pays du pacte de Varsovie \u2192 **pays satellites** de l\u2019URSS\u202F; Gabon \u2192 **n\xE9o-colonialisme** (entreprises fran\xE7aises qui exploitent le p\xE9trole d\u2019une ancienne colonie).`,criteres:["D\xE9finition avec \xAB\xA0domination\xA0\xBB et \xAB\xA0empire\xA0\xBB.","Quatre classements corrects."]}]},{id:"f2",titre:"Situer dans le temps",competence:"Restitution des savoirs",description:"Placer des faits sur une ligne du temps, associer dates et \xE9v\xE9nements, calculer des dur\xE9es, rep\xE9rer si\xE8cles et p\xE9riodes.",methode:["Rep\xE8re le si\xE8cle\u202F: XVIIIe si\xE8cle = 1701-1800.","Rep\xE8re la p\xE9riode\u202F: Temps modernes (1492-1789) / \xC9poque contemporaine (depuis 1789).","Range les dates du plus ancien au plus r\xE9cent, puis v\xE9rifie les liens de cause \xE0 effet."],resolu:{consigne:"Situe la publication de \xAB\xA0De l\u2019esprit des lois\xA0\xBB\u202F: ann\xE9e, si\xE8cle, p\xE9riode, et dis ce qui se passe 41 ans plus tard.",etapes:[{t:"Ann\xE9e",d:"Montesquieu publie *De l\u2019esprit des lois* en **1748**."},{t:"Si\xE8cle et p\xE9riode",d:"1748 est au **XVIIIe si\xE8cle** (1701-1800), pendant les **Temps modernes**, sous l\u2019Ancien R\xE9gime."},{t:"Lien",d:"1748 + 41 = **1789**\u202F: la R\xE9volution fran\xE7aise met fin \xE0 l\u2019Ancien R\xE9gime\u202F; la DDHC reprend des id\xE9es des Lumi\xE8res (s\xE9paration des pouvoirs, article 16)."}],reponse:"1748, XVIIIe si\xE8cle, Temps modernes (Ancien R\xE9gime). 41 ans plus tard, en 1789, la R\xE9volution fran\xE7aise met fin \xE0 l\u2019Ancien R\xE9gime."},exercices:[{id:"f2e1",niveau:1,consigne:"Range dans l\u2019ordre chronologique\u202F: Du contrat social\u202F; Bill of Rights\u202F; Encyclop\xE9die (1er volume)\u202F; Trait\xE9 sur la tol\xE9rance\u202F; La Richesse des nations\u202F; Habeas Corpus.",aides:["Deux textes anglais sont au XVIIe si\xE8cle."],correction:"Habeas Corpus (**1679**) \u2192 Bill of Rights (**1689**) \u2192 Encyclop\xE9die (**1751**) \u2192 Du contrat social (**1762**) \u2192 Trait\xE9 sur la tol\xE9rance (**1763**) \u2192 La Richesse des nations (**1776**).",criteres:["Ordre correct.","Dates exactes."]},{id:"f2e2",niveau:1,consigne:"Donne les trois dates de l\u2019histoire de l\u2019abolition de l\u2019esclavage en France et explique ce qu\u2019elles montrent sur les limites des Lumi\xE8res.",aides:["Abolition, r\xE9tablissement, abolition d\xE9finitive."],correction:`**1794**\u202F: premi\xE8re abolition\u202F; **1802**\u202F: r\xE9tablissement par Napol\xE9on\u202F; **1848**\u202F: abolition d\xE9finitive.
Cela montre que les id\xE9aux de libert\xE9 et d\u2019\xE9galit\xE9 des Lumi\xE8res n\u2019ont pas \xE9t\xE9 appliqu\xE9s \xE0 tous imm\xE9diatement\u202F: il a fallu plus de 50 ans pour qu\u2019ils concernent aussi les esclaves.`,criteres:["Trois dates exactes.","Lien avec les limites des Lumi\xE8res."]},{id:"f2e3",niveau:2,consigne:"Sur la frise du nationalisme, combien de temps dure le nationalisme \xAB\xA0romantique\xA0\xBB\u202F? Quel \xE9v\xE9nement de 1848 en fait partie\u202F?",aides:["Il commence en 1789 et se termine en 1870."],correction:"Le nationalisme \xAB\xA0romantique\xA0\xBB va de **1789** \xE0 **1870**, soit **81 ans**. Le **Printemps des peuples** (1848), vague de r\xE9volutions lib\xE9rales et nationales en Europe, en fait partie.",criteres:["Calcul correct.","\xC9v\xE9nement identifi\xE9."]}]},{id:"f3",titre:"Analyser et critiquer un document",competence:"C2 \xB7 Critiquer",description:"Identifier le document (nature, auteur, date, destinataire, intention), en extraire les informations utiles et \xE9valuer sa fiabilit\xE9.",methode:["Identifie\u202F: nature (texte, gravure, tableau statistique\u2026), auteur, date, lieu, destinataire.","Distingue source primaire (de l\u2019\xE9poque) et source secondaire (\xE9crite apr\xE8s, par un historien).","Cherche l\u2019intention de l\u2019auteur\u202F: informer, d\xE9noncer, d\xE9fendre ses droits, convaincre\u2026","Extrais les informations qui r\xE9pondent \xE0 la question, avec des citations courtes.","\xC9value la fiabilit\xE9\u202F: l\u2019auteur \xE9tait-il t\xE9moin\u202F? A-t-il un int\xE9r\xEAt\u202F? Recoupe avec d\u2019autres documents."],resolu:{consigne:"Analyse le texte de G\xE9rard de Cambrai (1024)\u202F: identification, id\xE9e principale, intention, fiabilit\xE9.",doc:"\xAB\xA0Le genre humain est divis\xE9 en trois\u202F: les gens de pri\xE8re, les agriculteurs et les guerriers. [\u2026] Chacune de ces cat\xE9gories est r\xE9chauff\xE9e \xE0 droite et \xE0 gauche par les deux autres.\xA0\xBB (Gesta episcoporum Cameracensium, 1024)",etapes:[{t:"Identification",d:"Texte narratif, **source primaire**\u202F: r\xE9sum\xE9 d\u2019un discours de **G\xE9rard, \xE9v\xEAque de Cambrai-Arras**, r\xE9dig\xE9 en **1024** par son secr\xE9taire, un chanoine qui y a assist\xE9, dans le r\xE9cit des actions des \xE9v\xEAques de Cambrai."},{t:"Id\xE9e principale",d:"La soci\xE9t\xE9 est divis\xE9e en **trois groupes interd\xE9pendants**\u202F: ceux qui prient, ceux qui combattent, ceux qui travaillent. Chacun rend service aux deux autres."},{t:"Intention",d:"Ce type de r\xE9cit sert aux \xE9v\xEAques \xE0 **rappeler leurs grandes actions** et \xE0 **d\xE9fendre leurs droits**, notamment face au pouvoir politique. L\u2019auteur, un **homme d\u2019\xC9glise**, pr\xE9sente un ordre voulu \xAB\xA0depuis l\u2019origine\xA0\xBB, donc \xE0 ne pas contester, o\xF9 le clerg\xE9 est cit\xE9 en premier."},{t:"Fiabilit\xE9",d:"Le secr\xE9taire \xE9tait **t\xE9moin** du discours (point fort), mais il travaille pour l\u2019\xE9v\xEAque (point faible\u202F: il n\u2019est pas neutre). Le texte d\xE9crit une **vision id\xE9ale** de la soci\xE9t\xE9 par le clerg\xE9, pas forc\xE9ment la r\xE9alit\xE9\u202F: il faut le recouper (ex. miniature d\u2019Oresme, qui montre d\u2019autres groupes)."}],reponse:"Source primaire de 1024 \xE9crite par un chanoine au service de l\u2019\xE9v\xEAque G\xE9rard de Cambrai. Elle pr\xE9sente une soci\xE9t\xE9 divis\xE9e en trois groupes interd\xE9pendants (prier, combattre, travailler). L\u2019auteur, homme d\u2019\xC9glise, veut justifier cet ordre et d\xE9fendre les droits des \xE9v\xEAques\u202F: c\u2019est une vision id\xE9ale et int\xE9ress\xE9e, \xE0 recouper avec d\u2019autres sources."},exercices:[{id:"f3e1",niveau:1,consigne:"Doc. 5 (cahier de dol\xE9ances de Fleys, 13 mars 1789)\u202F: identifie le document (nature, auteurs, date, destinataire) et rel\xE8ve quatre charges qui p\xE8sent sur les habitants.",doc:"Les terres sont charg\xE9es de 5 sols par arpent de cens envers le seigneur\u202F; il est d\xFB au cur\xE9 la 21e gerbe de grains. Les habitants doivent la banalit\xE9 du moulin, du four et des pressoirs. Ils sont tr\xE8s surcharg\xE9s en taille et vingti\xE8mes, les plus grosses propri\xE9t\xE9s \xE9tant poss\xE9d\xE9es par des privil\xE9gi\xE9s exempts de taille.",aides:["Un cahier de dol\xE9ances est destin\xE9 aux \xC9tats g\xE9n\xE9raux convoqu\xE9s par le roi."],correction:`**Identification**\u202F: cahier de dol\xE9ances, **source primaire**, r\xE9dig\xE9 par les **habitants de la paroisse de Fleys** (Bourgogne) le **13 mars 1789**, destin\xE9 au **roi** et aux **\xC9tats g\xE9n\xE9raux**.
**Charges**\u202F: le **cens** (5 sols par arpent, au seigneur)\u202F; la **d\xEEme** (21e gerbe, au cur\xE9)\u202F; les **banalit\xE9s** (moulin, four, pressoirs, au seigneur)\u202F; la **taille** et les **vingti\xE8mes** (au roi).`,criteres:["Nature, auteurs, date, destinataire.","Quatre charges avec leur b\xE9n\xE9ficiaire."]},{id:"f3e2",niveau:2,consigne:"Doc. 5\u202F: quelle est l\u2019intention des habitants de Fleys\u202F? Ce document est-il fiable pour conna\xEEtre la situation des paysans\u202F? Nuance.",aides:["Les auteurs ont-ils int\xE9r\xEAt \xE0 exag\xE9rer\u202F?","Pense au recoupement avec le doc. 6."],correction:`**Intention**\u202F: **se plaindre** (dol\xE9ance = plainte) et obtenir une baisse des charges et une r\xE9partition plus juste de l\u2019imp\xF4t (les privil\xE9gi\xE9s ne paient pas la taille).
**Fiabilit\xE9**\u202F: points forts\u202F: ce sont des **t\xE9moins directs** qui d\xE9crivent leur propre situation, avec des chiffres pr\xE9cis (5 sols, 21e gerbe\u2026). Limites\u202F: ils ont **int\xE9r\xEAt \xE0 noircir** leur situation pour \xEAtre entendus\u202F; c\u2019est le point de vue d\u2019**une seule paroisse**. On peut le **recouper** avec le budget de l\u2019ouvrier d\u2019Aunis (doc. 6), qui confirme la pr\xE9carit\xE9 et le poids des imp\xF4ts.`,criteres:["Intention identifi\xE9e.","Au moins un point fort et une limite.","Recoupement propos\xE9."]},{id:"f3e3",niveau:2,consigne:"Doc. 6\u202F: compare les d\xE9penses et le salaire annuel de l\u2019ouvrier agricole d\u2019Aunis. Quelle conclusion en tires-tu\u202F?",doc:"D\xE9penses totales\u202F: environ 189 livres 13 sols (dont pain 54 l. 15 s.\u202F; imp\xF4ts 12 l.). Revenus\u202F: 245 journ\xE9es \xE0 15 sols = 183 livres 15 sols. 1 livre = 20 sols.",aides:["Calcule la diff\xE9rence en livres et sols."],correction:`D\xE9penses \u2248 **189 l. 13 s.**\u202F; revenus = **183 l. 15 s.** Diff\xE9rence\u202F: 189 l. 13 s. \u2212 183 l. 15 s. = **5 l. 18 s.** (presque 6 livres).
Les **d\xE9penses d\xE9passent les revenus**\u202F: l\u2019ouvrier vit dans la **pr\xE9carit\xE9**, il ne peut pas \xE9pargner et la moindre crise (hausse du prix du pain, maladie) le met en danger. Le **pain** (\u2248 29\xA0% des d\xE9penses) est le premier poste. Il doit en plus payer des imp\xF4ts et faire **10 jours de corv\xE9es** non pay\xE9s.`,criteres:["Calcul exact.","Conclusion\u202F: pr\xE9carit\xE9.","Mention du pain et des charges."]},{id:"f3e4",niveau:3,consigne:"Les deux caricatures de la fin du XVIIIe si\xE8cle (le paysan qui porte le clerg\xE9 et la noblesse\u202F; \xAB\xA0\xE7a n\u2019durera pas toujours\xA0\xBB)\u202F: quel est leur message\u202F? Utilise les docs 5 et 6 pour montrer qu\u2019il est fond\xE9, puis indique une limite de ce type de source.",aides:["Une caricature exag\xE8re pour d\xE9noncer.","Utilise des chiffres des documents."],correction:`**Message**\u202F: les caricatures **d\xE9noncent l\u2019injustice** de la soci\xE9t\xE9 d\u2019ordres\u202F: le **Tiers \xE9tat** (le paysan) **porte seul** le poids des **imp\xF4ts** (\xAB\xA0taille, imp\xF4ts et corv\xE9es\xA0\xBB) au profit des **privil\xE9gi\xE9s** (clerg\xE9 et noblesse), qui ne travaillent pas et ne paient pas. Le titre \xAB\xA0\xE7a n\u2019durera pas toujours\xA0\xBB annonce une **r\xE9volte**.
**Le message est fond\xE9**\u202F: \xE0 Fleys (doc. 5), les paysans paient le cens et les banalit\xE9s au seigneur, la d\xEEme au cur\xE9, la taille au roi, alors que les privil\xE9gi\xE9s sont exempts de taille. L\u2019ouvrier d\u2019Aunis (doc. 6) d\xE9pense plus qu\u2019il ne gagne et doit 10 jours de corv\xE9es.
**Limite**\u202F: une caricature est **volontairement exag\xE9r\xE9e** et **partisane** (elle veut convaincre)\u202F; elle simplifie\u202F: tous les nobles ne sont pas riches (hobereaux) et tout le Tiers \xE9tat n\u2019est pas mis\xE9rable (bourgeoisie).`,criteres:["Message expliqu\xE9 (d\xE9nonciation).","Preuves tir\xE9es des docs 5 et 6.","Limite de la source."]}]},{id:"f4",titre:"Appliquer un concept \xE0 une situation",competence:"Mobiliser un concept",description:"V\xE9rifier si une situation historique correspond \xE0 un concept, crit\xE8re par crit\xE8re, avec des preuves.",methode:["\xC9cris la d\xE9finition du concept.","Liste ses crit\xE8res (attributs).","Pour chaque crit\xE8re, cherche une preuve dans la situation (document, fait, chiffre)\u202F: oui / non / en partie.","Conclus\u202F: la situation correspond (ou partiellement) au concept, en r\xE9sumant les preuves."],resolu:{consigne:"La soci\xE9t\xE9 fran\xE7aise d\u2019Ancien R\xE9gime est-elle une soci\xE9t\xE9 stratifi\xE9e\u202F?",etapes:[{t:"D\xE9finition",d:"La stratification sociale est le d\xE9coupage de la soci\xE9t\xE9 en strates distinctes et hi\xE9rarchis\xE9es, \xE0 cause d\u2019in\xE9galit\xE9s."},{t:"Crit\xE8re 1\u202F: groupes distincts",d:"**Oui**\u202F: trois ordres \u2014 clerg\xE9, noblesse, Tiers \xE9tat \u2014 d\xE9finis par le droit."},{t:"Crit\xE8re 2\u202F: hi\xE9rarchie",d:"**Oui**\u202F: du plus \xAB\xA0digne\xA0\xBB au moins \xAB\xA0digne\xA0\xBB (Loyseau, 1610)\u202F; les privil\xE9gi\xE9s au sommet, le Tiers \xE9tat (\u2248 98\xA0%) en bas."},{t:"Crit\xE8re 3\u202F: in\xE9galit\xE9s",d:"**Oui**\u202F: de **droits et devoirs** (les privil\xE9gi\xE9s ne paient pas la taille mais per\xE7oivent d\xEEme et droits seigneuriaux)\u202F; de **richesse** (l\u2019ouvrier d\u2019Aunis d\xE9pense plus qu\u2019il ne gagne)\u202F; de **pouvoir** et de **prestige** (noblesse de cour \xE0 Versailles)."},{t:"Nuance",d:"Chaque ordre est lui-m\xEAme stratifi\xE9 (haut / bas clerg\xE9, noblesse de cour / hobereaux, bourgeoisie / manouvriers) et une **\xE9l\xE9vation** est possible (achat d\u2019offices \u2192 noblesse de robe)."},{t:"Conclusion",d:"Oui, la soci\xE9t\xE9 d\u2019Ancien R\xE9gime est **fortement stratifi\xE9e**\u202F: c\u2019est une **soci\xE9t\xE9 d\u2019ordres** in\xE9galitaire."}],reponse:"Oui. La soci\xE9t\xE9 est d\xE9coup\xE9e en trois ordres distincts (clerg\xE9, noblesse, Tiers \xE9tat), hi\xE9rarchis\xE9s, avec des in\xE9galit\xE9s de droits (privil\xE8ges fiscaux), de richesse (pr\xE9carit\xE9 de l\u2019ouvrier d\u2019Aunis), de pouvoir et de prestige. Chaque ordre est lui-m\xEAme divis\xE9. C\u2019est une soci\xE9t\xE9 d\u2019ordres fortement stratifi\xE9e."},exercices:[{id:"f4e1",niveau:2,consigne:"La monarchie absolue de Louis XIV est-elle autoritaire\u202F? V\xE9rifie au moins trois crit\xE8res de l\u2019autoritarisme.",aides:["Qui d\xE9cide\u202F? Y a-t-il s\xE9paration des pouvoirs\u202F? Comment le pouvoir s\u2019impose-t-il\u202F?"],correction:`**D\xE9finition**\u202F: l\u2019autoritarisme est le caract\xE8re autoritaire, arbitraire d\u2019un r\xE9gime qui impose \xE0 la soci\xE9t\xE9 la toute-puissance de l\u2019\xC9tat.
\u2022 **Une seule personne au pouvoir**\u202F: oui, \xAB\xA0le roi est le seul \xE0 d\xE9cider\xA0\xBB, on ne peut aller contre ses d\xE9cisions.
\u2022 **Pas de s\xE9paration des pouvoirs**\u202F: oui, le roi fait les lois, les ex\xE9cute et rend la justice.
\u2022 **R\xE9gime impos\xE9 \xE0 tous / conditionnement des esprits**\u202F: oui, culte royal, sacre, Versailles comme instrument de gouvernement\u202F; \xAB\xA0Nous sommes la t\xEAte d\u2019un corps dont nos sujets sont les membres\xA0\xBB.
\u2022 **Nuance**\u202F: le cours pr\xE9cise que ce n\u2019est **ni une tyrannie ni un r\xE9gime totalitaire**\u202F: le roi ne contr\xF4le pas toutes les activit\xE9s de la soci\xE9t\xE9.
**Conclusion**\u202F: la monarchie absolue repose sur des **fondements autoritaires et arbitraires**\u202F: elle correspond en grande partie au concept d\u2019autoritarisme.`,criteres:["D\xE9finition.","Trois crit\xE8res v\xE9rifi\xE9s avec preuves.","Nuance et conclusion."]},{id:"f4e2",niveau:2,consigne:"Les id\xE9es d\u2019Adam Smith rel\xE8vent-elles du lib\xE9ralisme \xE9conomique\u202F? Justifie avec les attributs du concept.",aides:["R\xF4le de l\u2019\xC9tat, march\xE9, libre concurrence."],correction:`**Lib\xE9ralisme \xE9conomique**\u202F: d\xE9fend la libert\xE9 d\u2019entreprendre et un march\xE9 r\xE9gul\xE9 par l\u2019offre et la demande, sans \xC9tat fort.
\u2022 **R\xE9gulation par le march\xE9**\u202F: oui, autor\xE9gulation par l\u2019offre et la demande, pas d\u2019autorit\xE9 pour fixer les prix.
\u2022 **Contre un \xC9tat fort**\u202F: oui, l\u2019\xC9tat doit se limiter \xE0 trois missions (d\xE9fense, justice, infrastructures).
\u2022 **Libre concurrence**\u202F: oui, il est contre les corporations et pour le libre-\xE9change (pas de droits de douane).
\u2022 **Individu libre et responsable**\u202F: oui, \xAB\xA0main invisible\xA0\xBB\u202F: l\u2019int\xE9r\xEAt personnel profite \xE0 tous.
**Conclusion**\u202F: Smith est un **fondateur du lib\xE9ralisme \xE9conomique**, qui donnera naissance au capitalisme.`,criteres:["D\xE9finition.","Au moins trois attributs prouv\xE9s.","Conclusion."]},{id:"f4e3",niveau:3,consigne:"Les id\xE9es de Diderot, Montesquieu et Rousseau correspondent-elles au concept de d\xE9mocratie\u202F? V\xE9rifie les crit\xE8res et nuance.",aides:["Consentement, s\xE9paration des pouvoirs, volont\xE9 g\xE9n\xE9rale\u2026","Rousseau lui-m\xEAme doute qu\u2019une d\xE9mocratie parfaite convienne aux hommes."],correction:`**D\xE9mocratie**\u202F: r\xE9gime o\xF9 le pouvoir est d\xE9tenu ou contr\xF4l\xE9 par le peuple, sans distinction de naissance, de richesse ou de comp\xE9tence.
\u2022 **Pouvoir contr\xF4l\xE9 par le peuple**\u202F: Diderot fonde l\u2019autorit\xE9 sur le **consentement** des peuples\u202F; la nation est propri\xE9taire de l\u2019autorit\xE9 publique\u202F; Rousseau d\xE9fend la **volont\xE9 g\xE9n\xE9rale** et la **souverainet\xE9 du peuple**.
\u2022 **S\xE9paration des pouvoirs**\u202F: Montesquieu (\xAB\xA0le pouvoir arr\xEAte le pouvoir\xA0\xBB, trois pouvoirs).
\u2022 **Libert\xE9 et \xE9galit\xE9**\u202F: Rousseau (\xAB\xA0l\u2019homme est n\xE9 libre\xA0\xBB)\u202F; \xE9galit\xE9 juridique contre les privil\xE8ges.
\u2022 **Nuances**\u202F: ces philosophes ne r\xE9clament pas tous le droit de vote pour tous (Montesquieu admire la monarchie anglaise\u202F; Diderot accepte un gouvernement h\xE9r\xE9ditaire)\u202F; Rousseau \xE9crit qu\u2019un gouvernement d\xE9mocratique parfait conviendrait \xE0 \xAB\xA0un peuple de Dieux\xA0\xBB. Les **femmes** et les **esclaves** sont exclus.
**Conclusion**\u202F: leurs id\xE9es posent les **bases** de la d\xE9mocratie (consentement, s\xE9paration des pouvoirs, souverainet\xE9 du peuple) sans en r\xE9clamer toujours tous les crit\xE8res.`,criteres:["D\xE9finition et crit\xE8res.","Preuves pour chaque philosophe.","Nuances (limites)."]},{id:"f4e4",niveau:3,consigne:"L\u2019\xE9conomie d\u2019Ancien R\xE9gime conna\xEEt-elle la croissance\u202F? V\xE9rifie les facteurs de croissance (\xE9conomique, d\xE9mographique, social, culturel, politique).",aides:["Croissance = augmentation durable et soutenue."],correction:`**Croissance**\u202F: augmentation durable et soutenue de l\u2019activit\xE9 \xE9conomique, de la d\xE9mographie et/ou du niveau de vie.
\u2022 **\xC9conomique**\u202F: faible \u2014 rendements agricoles tr\xE8s bas, outils en bois, industrie peu d\xE9velopp\xE9e, transports lents, corporations qui freinent l\u2019initiative. Mais au XVIIIe si\xE8cle, le commerce et les premi\xE8res usines enrichissent la bourgeoisie.
\u2022 **D\xE9mographique**\u202F: la France est tr\xE8s peupl\xE9e (22 millions vers 1700), mais la croissance est **frein\xE9e** par les crises (guerre, peste, famine).
\u2022 **Social**\u202F: le niveau de vie de la majorit\xE9 reste bas (l\u2019ouvrier d\u2019Aunis d\xE9pense plus qu\u2019il ne gagne).
\u2022 **Culturel**\u202F: innovations (m\xE9tiers \xE0 tisser m\xE9caniques, machine \xE0 vapeur) au XVIIIe si\xE8cle.
\u2022 **Politique**\u202F: nombreuses guerres sous Louis XIV, pas de paix durable.
**Conclusion**\u202F: pas de croissance **durable et soutenue**\u202F: l\u2019\xE9conomie est **fragile**\u202F; une croissance commence \xE0 la fin du XVIIIe si\xE8cle, surtout au profit de la bourgeoisie.`,criteres:["D\xE9finition.","Facteurs v\xE9rifi\xE9s avec preuves.","Conclusion nuanc\xE9e."]}]},{id:"f5",titre:"Comparer\u202F: permanences et changements",competence:"Raisonner",description:"Mettre en relation deux situations ou deux id\xE9es\u202F: points communs, diff\xE9rences, \xE9volutions.",methode:["Choisis des crit\xE8res de comparaison (groupes, r\xF4le, pouvoir, richesse, id\xE9es\u2026).","Pour chaque crit\xE8re, note ce qui reste (permanence) et ce qui change.","Conclus par une phrase qui r\xE9sume l\u2019\xE9volution."],resolu:{consigne:"Compare la soci\xE9t\xE9 du Moyen \xC2ge (1024) et celle de l\u2019Ancien R\xE9gime\u202F: permanences et changements.",etapes:[{t:"Permanences",d:"La division en **trois groupes** hi\xE9rarchis\xE9s\u202F: clerg\xE9, noblesse (guerriers), travailleurs/Tiers \xE9tat. Les **droits seigneuriaux** (cens, banalit\xE9s) existent toujours. La soci\xE9t\xE9 reste **stratifi\xE9e**."},{t:"Changements",d:"Le troisi\xE8me groupe s\u2019est **diversifi\xE9**\u202F: bourgeois, marchands, artisans, ouvriers de manufacture, professions lib\xE9rales. Une **noblesse de robe** appara\xEEt (bourgeois anoblis). Le **roi** est devenu absolu et la noblesse vit \xE0 la cour."},{t:"Conclusion",d:"La structure en **trois ordres se maintient**, mais l\u2019essor des villes et de la bourgeoisie la rend de plus en plus **contest\xE9e**."}],reponse:"Permanence\u202F: trois groupes hi\xE9rarchis\xE9s et des droits seigneuriaux. Changement\u202F: diversification du Tiers \xE9tat (bourgeoisie), noblesse de robe, monarchie absolue. Le cadre se maintient mais devient contest\xE9."},exercices:[{id:"f5e1",niveau:1,consigne:"Compare clerg\xE9 r\xE9gulier et clerg\xE9 s\xE9culier (d\xE9finition, exemples).",aides:["Regula = r\xE8gle\u202F; saeculum = le si\xE8cle, le monde."],correction:`**R\xE9gulier**\u202F: vit selon une **r\xE8gle**, \xE0 l\u2019\xE9cart du monde \u2014 moines, moniales, abb\xE9s (ordres mendiants, contemplatifs, enseignants).
**S\xE9culier**\u202F: vit **parmi les fid\xE8les** \u2014 \xE9v\xEAques (haut clerg\xE9), cur\xE9s et vicaires (bas clerg\xE9).
**Point commun**\u202F: tous font partie du premier ordre, privil\xE9gi\xE9, qui per\xE7oit la d\xEEme.`,criteres:["Deux d\xE9finitions.","Exemples corrects."]},{id:"f5e2",niveau:2,consigne:"Compare la noblesse de cour et la noblesse de province (mode de vie, richesse, relations).",aides:[],correction:`**Noblesse de cour**\u202F: faveur du roi, hautes charges (gouvernement, arm\xE9e, \xC9glise), vie **fastueuse** \xE0 Versailles ou Paris\u202F; domaines g\xE9r\xE9s par des intendants.
**Noblesse de province (hobereaux)**\u202F: souvent **pauvre et endett\xE9e**, peu instruite, vit sur ses terres\u202F; relations **tendues** avec les paysans, sur qui elle fait peser des charges.
**Conclusion**\u202F: la noblesse n\u2019est pas un groupe homog\xE8ne\u202F: elle est elle-m\xEAme **stratifi\xE9e**.`,criteres:["Trois crit\xE8res compar\xE9s.","Conclusion sur l\u2019h\xE9t\xE9rog\xE9n\xE9it\xE9."]},{id:"f5e3",niveau:3,consigne:"Compare lib\xE9ralisme et socialisme\u202F: valeurs, r\xF4le de l\u2019\xC9tat, propri\xE9t\xE9, exemples. Lequel est l\u2019h\xE9ritier direct des Lumi\xE8res\u202F?",aides:["Smith d\u2019un c\xF4t\xE9, Marx de l\u2019autre."],correction:`**Valeurs**\u202F: lib\xE9ralisme \u2192 libert\xE9 individuelle\u202F; socialisme \u2192 justice sociale, \xE9galit\xE9, solidarit\xE9.
**R\xF4le de l\u2019\xC9tat**\u202F: lib\xE9ralisme \u2192 limit\xE9 (pas d\u2019\xC9tat central fort)\u202F; socialisme \u2192 interventionnisme (r\xE9formiste) ou propri\xE9t\xE9 collective et \xE9conomie centralis\xE9e (communisme).
**Propri\xE9t\xE9**\u202F: lib\xE9ralisme \u2192 priv\xE9e\u202F; socialisme \u2192 remise en cause, voire collective.
**Exemples**\u202F: lib\xE9ralisme \u2192 Smith (1776), Constant, MR en Belgique\u202F; socialisme \u2192 Marx et Engels (1848), social-d\xE9mocratie, communisme (L\xE9nine 1919).
**H\xE9ritier des Lumi\xE8res**\u202F: le **lib\xE9ralisme** s\u2019appuie directement sur les Lumi\xE8res (Locke, Montesquieu, Smith). Le socialisme na\xEEt plus tard (XIXe si\xE8cle) en r\xE9action aux effets du capitalisme industriel, m\xEAme s\u2019il reprend l\u2019id\xE9al d\u2019\xE9galit\xE9 des Lumi\xE8res.`,criteres:["Quatre crit\xE8res compar\xE9s.","R\xE9ponse justifi\xE9e \xE0 la question finale."]}]},{id:"f6",titre:"Expliquer des causes et des cons\xE9quences",competence:"Raisonner",description:"Construire une cha\xEEne de causes et de cons\xE9quences avec des connecteurs logiques.",methode:["Identifie le fait de d\xE9part (cause) et le fait d\u2019arriv\xE9e (cons\xE9quence).","Ajoute les \xE9tapes interm\xE9diaires.","R\xE9dige avec des connecteurs\u202F: car, donc, c\u2019est pourquoi, par cons\xE9quent, ce qui entra\xEEne\u2026"],resolu:{consigne:"Explique comment une mauvaise r\xE9colte peut provoquer une crise industrielle sous l\u2019Ancien R\xE9gime.",etapes:[{t:"D\xE9part",d:"Une **mauvaise r\xE9colte** (ou une guerre qui ravage les champs)."},{t:"\xC9tapes",d:"Le bl\xE9 manque, **donc** le prix du pain augmente (\xD73 ou \xD74). **Par cons\xE9quent**, le pouvoir d\u2019achat des familles diminue\u202F: elles d\xE9pensent tout pour le pain."},{t:"Arriv\xE9e",d:"**C\u2019est pourquoi** elles ach\xE8tent moins de produits manufactur\xE9s (textile\u2026), **ce qui entra\xEEne** une chute de la production et du **ch\xF4mage**\u202F: c\u2019est une **crise industrielle**."}],reponse:"Mauvaise r\xE9colte \u2192 hausse du prix du pain \u2192 baisse du pouvoir d\u2019achat \u2192 moins d\u2019achats de produits manufactur\xE9s \u2192 baisse de production et ch\xF4mage (crise industrielle)."},exercices:[{id:"f6e1",niveau:2,consigne:"Explique comment une guerre peut provoquer une crise d\xE9mographique.",aides:["Pillages \u2192 nourriture \u2192 maladies."],correction:"Les arm\xE9es **pillent et saccagent les cultures**, **donc** la nourriture manque. **Par cons\xE9quent**, la malnutrition favorise les **maladies** et les **famines**, ce qui fait **augmenter le nombre de morts**. Les mariages et les naissances diminuent\u202F: c\u2019est une **crise d\xE9mographique**, souvent suivie d\u2019une crise \xE9conomique.",criteres:["Cha\xEEne compl\xE8te.","Connecteurs logiques."]},{id:"f6e2",niveau:3,consigne:"Explique pourquoi la bourgeoisie est frustr\xE9e \xE0 la fin du XVIIIe si\xE8cle et pourquoi elle est sensible aux id\xE9es des Lumi\xE8res.",aides:["Richesse vs privil\xE8ges\u202F; corporations\u202F; pouvoir politique."],correction:`**Causes de la frustration**\u202F: la bourgeoisie s\u2019**enrichit** (commerce, banque, premi\xE8res usines, professions lib\xE9rales) et gagne de l\u2019**influence**, **mais** elle reste dans le **Tiers \xE9tat**\u202F: elle paie des imp\xF4ts, n\u2019a pas acc\xE8s aux privil\xE8ges, est m\xE9pris\xE9e par la noblesse et ne participe pas aux affaires de l\u2019\xC9tat. Les **corporations** et les **douanes int\xE9rieures** freinent ses activit\xE9s. Depuis que la noblesse d\xE9fend ses privil\xE8ges, l\u2019anoblissement devient plus difficile.
**Cons\xE9quence**\u202F: elle est **sensible aux Lumi\xE8res** car celles-ci r\xE9clament l\u2019**\xE9galit\xE9 juridique** (fin des privil\xE8ges), la **souverainet\xE9 du peuple** et la **s\xE9paration des pouvoirs** (participation politique) et la **libert\xE9 \xE9conomique** (Smith\u202F: fin des corporations, libre-\xE9change). Les bourgeois sont d\u2019ailleurs nombreux parmi les philosophes et les lecteurs.`,criteres:["Causes \xE9conomiques et sociales.","Lien pr\xE9cis avec trois id\xE9es des Lumi\xE8res."]}]},{id:"f7",titre:"Argumenter",competence:"Argumentation",description:"R\xE9pondre \xE0 une question en d\xE9fendant une th\xE8se avec des arguments, des preuves (exemples, documents) et une nuance.",methode:["Reformule la question et annonce ta r\xE9ponse (th\xE8se).","D\xE9veloppe 2 ou 3 arguments, un par paragraphe\u202F: id\xE9e \u2192 preuve \u2192 explication (\xAB\xA0cela montre que\u2026\xA0\xBB).","Ajoute une nuance ou un contre-argument (\xAB\xA0cependant\u2026\xA0\xBB).","Conclus en r\xE9pondant clairement \xE0 la question."],resolu:{consigne:"En quoi les philosophes des Lumi\xE8res remettent-ils en cause la soci\xE9t\xE9 d\u2019Ancien R\xE9gime\u202F?",etapes:[{t:"Introduction",d:"Au XVIIIe si\xE8cle, la France est une monarchie absolue de droit divin et une soci\xE9t\xE9 d\u2019ordres in\xE9galitaire. Les philosophes des Lumi\xE8res, au nom de la **raison**, critiquent cette organisation **politique, sociale, religieuse et \xE9conomique**."},{t:"Argument 1\u202F: politique",d:"Ils contestent l\u2019**absolutisme**. **Montesquieu** (*De l\u2019esprit des lois*, 1748) veut que \xAB\xA0le pouvoir arr\xEAte le pouvoir\xA0\xBB gr\xE2ce \xE0 la **s\xE9paration des pouvoirs**\u202F; **Diderot** fonde l\u2019autorit\xE9 sur le **consentement des peuples**\u202F; **Rousseau** sur la **volont\xE9 g\xE9n\xE9rale**. Cela montre qu\u2019ils refusent un roi qui d\xE9cide seul."},{t:"Argument 2\u202F: social",d:"Ils combattent la **soci\xE9t\xE9 d\u2019ordres** et les **privil\xE8ges de naissance**\u202F: selon **Locke**, tous ont des **droits naturels** (vie, libert\xE9, s\xFBret\xE9, propri\xE9t\xE9)\u202F; la loi doit \xEAtre la m\xEAme pour tous (**\xE9galit\xE9 juridique**)."},{t:"Argument 3\u202F: religieux et \xE9conomique",d:"**Voltaire** d\xE9nonce l\u2019**intol\xE9rance** (*Trait\xE9 sur la tol\xE9rance*, 1763)\u202F; **Smith** critique les **corporations** et l\u2019intervention de l\u2019\xC9tat dans l\u2019\xE9conomie (1776)."},{t:"Nuance",d:"**Cependant**, ils ne veulent pas toujours tout supprimer mais soumettre les institutions \xE0 la raison\u202F; et leurs id\xE9es ont des **limites** (femmes, esclaves) et touchent peu le peuple."},{t:"Conclusion",d:"Les Lumi\xE8res remettent en cause **les fondements** de l\u2019Ancien R\xE9gime (absolutisme, privil\xE8ges, intol\xE9rance, contr\xF4le de l\u2019\xE9conomie)\u202F: leurs id\xE9es deviendront un **facteur de r\xE9volution** en 1789."}],reponse:"Les philosophes contestent l\u2019absolutisme (s\xE9paration des pouvoirs, consentement, volont\xE9 g\xE9n\xE9rale), la soci\xE9t\xE9 d\u2019ordres (droits naturels, \xE9galit\xE9 juridique), l\u2019intol\xE9rance religieuse (Voltaire) et le contr\xF4le de l\u2019\xE9conomie (Smith). Leurs id\xE9es ont des limites, mais elles pr\xE9parent la R\xE9volution."},exercices:[{id:"f7e1",niveau:3,consigne:"La soci\xE9t\xE9 d\u2019Ancien R\xE9gime est-elle juste\u202F? Argumente en mobilisant le concept de stratification sociale et au moins deux documents du cours.",aides:["Juste = m\xEAmes droits et devoirs pour tous\u202F?","Docs utiles\u202F: caricatures, Fleys, budget d\u2019Aunis."],correction:`**Th\xE8se**\u202F: non, la soci\xE9t\xE9 d\u2019Ancien R\xE9gime n\u2019est pas juste\u202F: c\u2019est une soci\xE9t\xE9 **fortement stratifi\xE9e** o\xF9 les droits et les devoirs d\xE9pendent de la **naissance**.
**Argument 1 \u2014 in\xE9galit\xE9 de droits**\u202F: les **privil\xE9gi\xE9s** (clerg\xE9, noblesse, \u2248 2\xA0%) ne paient pas la taille mais **per\xE7oivent** la d\xEEme et les droits seigneuriaux. \xC0 **Fleys** (1789), les paysans paient le cens, la d\xEEme (21e gerbe), les banalit\xE9s, la taille, tandis que \xAB\xA0les plus grosses propri\xE9t\xE9s\xA0\xBB appartiennent \xE0 des privil\xE9gi\xE9s \xAB\xA0exempts de taille\xA0\xBB.
**Argument 2 \u2014 in\xE9galit\xE9 de richesse**\u202F: l\u2019**ouvrier d\u2019Aunis** d\xE9pense \u2248 189 livres pour 183 livres de revenus\u202F; il vit dans la pr\xE9carit\xE9 alors que la noblesse de cour vit fastueusement \xE0 Versailles.
**Argument 3 \u2014 mobilit\xE9 limit\xE9e**\u202F: le passage d\u2019un ordre \xE0 l\u2019autre est difficile\u202F; un riche marchand ne peut pas toujours \xEAtre anobli.
**Nuance**\u202F: \xE0 l\u2019\xE9poque, beaucoup jugent cet ordre **naturel** (voulu par Dieu, \xAB\xA0r\xE9chauff\xE9\xA0\xBB par l\u2019interd\xE9pendance)\u202F; le clerg\xE9 assiste les pauvres et une **\xE9l\xE9vation** reste possible (noblesse de robe).
**Conclusion**\u202F: selon nos crit\xE8res (et ceux des Lumi\xE8res), cette soci\xE9t\xE9 est **injuste**\u202F; les caricatures (\xAB\xA0\xE7a n\u2019durera pas toujours\xA0\xBB) montrent que ce sentiment grandit \xE0 la fin du XVIIIe si\xE8cle.`,criteres:["Th\xE8se claire.","Concept de stratification mobilis\xE9.","Au moins deux documents cit\xE9s.","Nuance et conclusion."]},{id:"f7e2",niveau:3,consigne:"Les id\xE9es des Lumi\xE8res sont-elles universelles\u202F? Argumente.",aides:["Universel = pour tous les \xEAtres humains.","Pense aux femmes, aux esclaves, au peuple."],correction:`**Th\xE8se**\u202F: les Lumi\xE8res **se veulent universelles**, mais **dans les faits** elles ne s\u2019appliquent pas \xE0 tous.
**Argument 1 \u2014 une ambition universelle**\u202F: Locke parle de **droits naturels universels et inali\xE9nables**\u202F; Kant s\u2019adresse \xE0 chacun (\xAB\xA0ose savoir\xA0\xBB)\u202F; la DDHC (1789) affirme que \xAB\xA0les hommes naissent et demeurent libres et \xE9gaux en droits\xA0\xBB.
**Argument 2 \u2014 les femmes exclues**\u202F: Rousseau veut la femme **subordonn\xE9e**\u202F; la DDHC exclut de fait les femmes des droits politiques\u202F; **Olympe de Gouges** (1791) est guillotin\xE9e en 1793.
**Argument 3 \u2014 les esclaves exclus**\u202F: Voltaire a des \xE9crits racistes\u202F; une partie de la bourgeoisie profite du **commerce triangulaire**\u202F; l\u2019esclavage n\u2019est d\xE9finitivement aboli qu\u2019en **1848**.
**Argument 4 \u2014 le peuple peu touch\xE9**\u202F: les id\xE9es circulent dans les salons et chez les \xE9lites, peu chez les paysans.
**Conclusion**\u202F: les Lumi\xE8res posent des **principes universels**, mais leur application est d\u2019abord limit\xE9e \xE0 l\u2019homme blanc, bourgeois ou aristocrate, d\u2019Occident\u202F; il faudra des combats ult\xE9rieurs pour les \xE9tendre.`,criteres:["Th\xE8se nuanc\xE9e.","Exemples pr\xE9cis (dates, noms).","Conclusion."]},{id:"f7e3",niveau:3,consigne:"Les id\xE9es des Lumi\xE8res sont-elles encore pr\xE9sentes dans la Belgique d\u2019aujourd\u2019hui\u202F? Donne trois exemples argument\xE9s.",aides:["Constitution belge, s\xE9paration des pouvoirs, libert\xE9s, \xE9lections."],correction:`**Th\xE8se**\u202F: oui, de nombreux principes de la Belgique actuelle viennent des Lumi\xE8res.
**1. S\xE9paration des pouvoirs (Montesquieu)**\u202F: en Belgique, le pouvoir **l\xE9gislatif** (Parlement), le pouvoir **ex\xE9cutif** (gouvernement, le Roi) et le pouvoir **judiciaire** (cours et tribunaux) sont s\xE9par\xE9s.
**2. Constitution et monarchie limit\xE9e (Diderot, lib\xE9ralisme)**\u202F: la Constitution belge pr\xE9voit une **monarchie** dont les pouvoirs sont **limit\xE9s**\u202F; le Roi ne peut agir sans un ministre responsable.
**3. Libert\xE9s et \xE9galit\xE9 (Locke, Voltaire)**\u202F: la Constitution garantit l\u2019**\xE9galit\xE9 devant la loi**, la **libert\xE9 de culte** et d\u2019**opinion** (tol\xE9rance), et le pouvoir vient du **peuple** qui \xE9lit ses repr\xE9sentants (souverainet\xE9 du peuple, Rousseau).
**Nuance**\u202F: certaines id\xE9es ont \xE9t\xE9 \xE9largies bien apr\xE8s\u202F: le **suffrage universel** (y compris pour les femmes) n\u2019est obtenu qu\u2019au XXe si\xE8cle.
**Conclusion**\u202F: la Belgique est un **h\xE9ritage direct** des id\xE9es des Lumi\xE8res, compl\xE9t\xE9es par les combats des si\xE8cles suivants.`,criteres:["Trois exemples li\xE9s \xE0 un philosophe.","Nuance.","Conclusion."]}]},{id:"f8",titre:"R\xE9diger une synth\xE8se (C3)",competence:"C3 \xB7 Synth\xE9tiser",description:"R\xE9pondre \xE0 une question de recherche par un texte structur\xE9 \xE0 partir d\u2019un dossier de documents, comme au CESS.",methode:["Lis la question de recherche et souligne ses mots-cl\xE9s.","Pour chaque document, note les informations qui r\xE9pondent \xE0 la question (tableau).","Regroupe les informations par id\xE9es (et non document par document)\u202F: ce seront tes paragraphes.","R\xE9dige\u202F: titre (sujet, date, lieu) \u2013 introduction (contexte, question, plan) \u2013 d\xE9veloppement (paragraphes + connecteurs + preuves des documents + concepts) \u2013 conclusion (r\xE9ponse directe)."],resolu:{consigne:"\xC0 partir des documents 1 \xE0 4 (Diderot, Montesquieu, Rousseau, Voltaire), r\xE9dige une synth\xE8se\u202F: \xAB\xA0Quelles id\xE9es les philosophes des Lumi\xE8res opposent-ils \xE0 l\u2019absolutisme et \xE0 l\u2019intol\xE9rance au XVIIIe si\xE8cle\u202F?\xA0\xBB",etapes:[{t:"Titre",d:"**Les id\xE9es des philosophes des Lumi\xE8res face \xE0 l\u2019absolutisme, en France et en Europe au XVIIIe si\xE8cle** (sujet, lieu, date)."},{t:"Introduction",d:"Au XVIIIe si\xE8cle, la France est une **monarchie absolue de droit divin**\u202F: le roi d\xE9cide seul. Des philosophes, au nom de la **raison**, critiquent ce syst\xE8me. **Quelles id\xE9es opposent-ils \xE0 l\u2019absolutisme et \xE0 l\u2019intol\xE9rance\u202F?** Nous verrons d\u2019abord l\u2019origine du pouvoir, ensuite sa limitation, enfin la tol\xE9rance."},{t:"\xA71 Origine du pouvoir",d:"**D\u2019abord**, le pouvoir doit venir du **peuple**. Diderot (doc. 1, 1751) \xE9crit que la puissance l\xE9gitime \xAB\xA0vient du consentement des peuples\xA0\xBB et que la nation est propri\xE9taire de l\u2019autorit\xE9\u202F; **de m\xEAme**, Rousseau (doc. 3, 1762) affirme que seule la **volont\xE9 g\xE9n\xE9rale** peut diriger l\u2019\xC9tat vers le **bien commun**."},{t:"\xA72 Limitation du pouvoir",d:"**Ensuite**, le pouvoir doit \xEAtre **limit\xE9**. Pour Montesquieu (doc. 2, 1748), \xAB\xA0le pouvoir arr\xEAte le pouvoir\xA0\xBB\u202F: il faut **s\xE9parer** les pouvoirs l\xE9gislatif, ex\xE9cutif et judiciaire dans une **Constitution**. Diderot ajoute que le prince ne peut disposer de son pouvoir \xAB\xA0sans le consentement de la nation\xA0\xBB."},{t:"\xA73 Tol\xE9rance",d:"**Enfin**, Voltaire (doc. 4, 1763) d\xE9nonce l\u2019**intol\xE9rance religieuse** et appelle les hommes \xE0 \xAB\xA0s\u2019aider mutuellement\xA0\xBB au lieu de \xAB\xA0s\u2019\xE9gorger\xA0\xBB."},{t:"Conclusion",d:"**En conclusion**, les philosophes opposent \xE0 l\u2019absolutisme le **consentement du peuple**, la **souverainet\xE9** et la **s\xE9paration des pouvoirs**, et \xE0 l\u2019intol\xE9rance la **tol\xE9rance**. Ces id\xE9es posent les bases de la **d\xE9mocratie** et du **lib\xE9ralisme politique**."}],reponse:"Synth\xE8se en 3 paragraphes\u202F: (1) le pouvoir vient du peuple (Diderot, Rousseau)\u202F; (2) le pouvoir doit \xEAtre limit\xE9 et s\xE9par\xE9 (Montesquieu)\u202F; (3) la tol\xE9rance (Voltaire). Conclusion\u202F: bases de la d\xE9mocratie et du lib\xE9ralisme."},exercices:[{id:"f8e1",niveau:3,consigne:"Question de recherche\u202F: \xAB\xA0Comment la soci\xE9t\xE9 fran\xE7aise est-elle organis\xE9e \xE0 la fin du XVIIIe si\xE8cle et pourquoi est-elle contest\xE9e\u202F?\xA0\xBB R\xE9dige une synth\xE8se \xE0 partir de ces documents\u202F: la pyramide des ordres (doc. A), le cahier de dol\xE9ances de Fleys (doc. B), le budget de l\u2019ouvrier d\u2019Aunis (doc. C), la caricature \xAB\xA0\xE7a n\u2019durera pas toujours\xA0\xBB (doc. D), l\u2019extrait sur la bourgeoisie (doc. E).",aides:["Plan possible\u202F: I. une soci\xE9t\xE9 d\u2019ordres\u202F; II. des charges qui p\xE8sent sur le Tiers \xE9tat\u202F; III. des tensions et des frustrations.","Mobilise le concept de stratification sociale."],correction:`**Titre**\u202F: La soci\xE9t\xE9 d\u2019ordres en France \xE0 la fin du XVIIIe si\xE8cle\u202F: organisation et contestations.
**Introduction**\u202F: Sous l\u2019Ancien R\xE9gime, la France est une monarchie absolue de droit divin. \xC0 la fin du XVIIIe si\xE8cle, sa soci\xE9t\xE9 suscite de plus en plus de critiques. Comment est-elle organis\xE9e et pourquoi est-elle contest\xE9e\u202F? Nous verrons son organisation en ordres, le poids des charges sur le Tiers \xE9tat, puis les tensions qui en r\xE9sultent.
**\xA71 \u2014 Une soci\xE9t\xE9 d\u2019ordres stratifi\xE9e**\u202F: la soci\xE9t\xE9 est divis\xE9e en trois **ordres** hi\xE9rarchis\xE9s (doc. A)\u202F: le **clerg\xE9** et la **noblesse**, **privil\xE9gi\xE9s** (\u2248 2-3\xA0%), et le **Tiers \xE9tat** (\u2248 97-98\xA0%). C\u2019est une **stratification sociale** fond\xE9e sur la naissance et les droits.
**\xA72 \u2014 Un Tiers \xE9tat \xE9cras\xE9 par les charges**\u202F: les paysans de Fleys (doc. B) paient le **cens** et les **banalit\xE9s** au seigneur, la **d\xEEme** au cur\xE9, la **taille** au roi, alors que les privil\xE9gi\xE9s sont exempts de taille. **De plus**, l\u2019ouvrier d\u2019Aunis (doc. C) d\xE9pense \u2248 189 livres pour 183 livres de revenus\u202F: il vit dans la **pr\xE9carit\xE9**.
**\xA73 \u2014 Des tensions croissantes**\u202F: **c\u2019est pourquoi** les caricatures (doc. D) d\xE9noncent un Tiers \xE9tat qui porte seul le poids des privil\xE9gi\xE9s et annoncent une r\xE9volte (\xAB\xA0\xE7a n\u2019durera pas toujours\xA0\xBB). **Par ailleurs**, la **bourgeoisie** enrichie (doc. E) veut participer aux affaires de l\u2019\xC9tat et abolir les privil\xE8ges et les corporations.
**Conclusion**\u202F: la soci\xE9t\xE9 fran\xE7aise est une **soci\xE9t\xE9 d\u2019ordres** in\xE9galitaire o\xF9 le Tiers \xE9tat supporte les charges au profit des privil\xE9gi\xE9s\u202F; paysans et bourgeois la contestent, ce qui pr\xE9pare la R\xE9volution de 1789.`,criteres:["Titre avec sujet, date, lieu.","Introduction\u202F: contexte + question + plan.","Paragraphes par id\xE9es, pas par documents.","Preuves tir\xE9es des documents (citations, chiffres).","Concept mobilis\xE9.","Connecteurs logiques.","Conclusion qui r\xE9pond \xE0 la question."]}]}];var Yt=[{id:"ev1",titre:"Interrogation \xB7 La soci\xE9t\xE9 d\u2019Ancien R\xE9gime",duree:"50 min",total:30,intro:"\xC9valuation des savoirs (restitution)\u202F: vocabulaire, rep\xE8res, organisation de la soci\xE9t\xE9. C\u2019est le type d\u2019interrogation qui pr\xE9c\xE8de souvent l\u2019\xE9valuation par comp\xE9tences.",parties:[{titre:"1. Vocabulaire",points:8,competence:"Savoirs",consigne:"D\xE9finis en une phrase\u202F: a) privil\xE8ge\u202F; b) d\xEEme\u202F; c) banalit\xE9s\u202F; d) noblesse de robe\u202F; e) corporation\u202F; f) mercantilisme\u202F; g) cahier de dol\xE9ances\u202F; h) clerg\xE9 s\xE9culier.",correction:`a) **Privil\xE8ge**\u202F: avantage r\xE9serv\xE9 \xE0 un ordre (ex. ne pas payer la taille).
b) **D\xEEme**\u202F: imp\xF4t pr\xE9lev\xE9 par l\u2019\xC9glise sur une partie des r\xE9coltes.
c) **Banalit\xE9s**\u202F: obligation de payer pour utiliser le moulin, le four, le pressoir du seigneur.
d) **Noblesse de robe**\u202F: bourgeois anoblis par l\u2019achat d\u2019une charge ou par le roi.
e) **Corporation**\u202F: association de m\xE9tier qui en a le monopole (prix, salaires, r\xE8gles).
f) **Mercantilisme**\u202F: politique qui conquiert les march\xE9s ext\xE9rieurs et bloque les produits \xE9trangers pour faire entrer de l\u2019or.
g) **Cahier de dol\xE9ances**\u202F: registre des plaintes et demandes des habitants en 1789, avant les \xC9tats g\xE9n\xE9raux.
h) **Clerg\xE9 s\xE9culier**\u202F: religieux qui vivent parmi les fid\xE8les (\xE9v\xEAques, cur\xE9s).`,bareme:"1 point par d\xE9finition exacte (\xBD si incompl\xE8te)."},{titre:"2. Rep\xE8res",points:4,competence:"Savoirs",consigne:"Compl\xE8te\u202F: L\u2019Ancien R\xE9gime prend fin en \u2026\u2026 . G\xE9rard de Cambrai d\xE9crit la soci\xE9t\xE9 en trois groupes en \u2026\u2026 . Louis XIV installe sa cour \xE0 Versailles en \u2026\u2026 . Vers 1700, la France compte environ \u2026\u2026 millions d\u2019habitants.",correction:"**1789**\u202F; **1024**\u202F; **1682**\u202F; **22** millions.",bareme:"1 point par r\xE9ponse."},{titre:"3. La pyramide de la soci\xE9t\xE9",points:8,competence:"Savoirs",consigne:"Dessine ou d\xE9cris la pyramide de la soci\xE9t\xE9 d\u2019ordres\u202F: nomme les trois ordres, indique leur part approximative de la population, s\xE9pare privil\xE9gi\xE9s et non-privil\xE9gi\xE9s et donne deux subdivisions pour chaque ordre.",correction:`**Sommet**\u202F: clerg\xE9 (\u2248 1\xA0%) \u2014 haut clerg\xE9 (\xE9v\xEAques, abb\xE9s) / bas clerg\xE9 (cur\xE9s, vicaires)\u202F; ou r\xE9gulier / s\xE9culier.
**Milieu**\u202F: noblesse (\u2248 1,5-2\xA0%) \u2014 noblesse d\u2019\xE9p\xE9e / de robe\u202F; ou de cour / de province (hobereaux).
\u2192 **Privil\xE9gi\xE9s**.
**Base**\u202F: Tiers \xE9tat (\u2248 97-98\xA0%) \u2014 bourgeoisie, artisans et commer\xE7ants, ouvriers, paysans (laboureurs, m\xE9tayers, manouvriers), mendiants.
\u2192 **Non-privil\xE9gi\xE9s**.`,bareme:"3 ordres dans le bon ordre (2)\u202F; proportions (2)\u202F; privil\xE9gi\xE9s / non-privil\xE9gi\xE9s (1)\u202F; subdivisions (3)."},{titre:"4. Questions de compr\xE9hension",points:10,competence:"Savoirs et raisonnement",consigne:"a) Pourquoi l\u2019\xE9conomie d\u2019Ancien R\xE9gime est-elle fragile\u202F? (3 \xE9l\xE9ments) b) Quelles sont les trois causes des crises d\xE9mographiques\u202F? c) Pourquoi la bourgeoisie est-elle m\xE9contente\u202F? d) Comment devient-on noble\u202F?",correction:`a) Agriculture peu productive (outils en bois, jach\xE8re), industrie peu d\xE9velopp\xE9e (manufactures, corporations), transports lents et chers, syst\xE8me mon\xE9taire rudimentaire\u202F; une mauvaise r\xE9colte provoque une crise g\xE9n\xE9rale. **(3 pts)**
b) La guerre, la peste (\xE9pid\xE9mies), la famine. **(2 pts)**
c) Elle est riche et influente mais sans privil\xE8ges, paie des imp\xF4ts, est m\xE9pris\xE9e par la noblesse, exclue des affaires de l\u2019\xC9tat et frein\xE9e par les corporations et les douanes int\xE9rieures. **(3 pts)**
d) Par la naissance (p\xE8re noble), par l\u2019achat d\u2019une charge ou d\u2019une terre noble, par anoblissement royal. **(2 pts)**`,bareme:"Voir les points indiqu\xE9s dans la correction."}]},{id:"ev2",titre:"\xC9valuation \xB7 Lumi\xE8res (C2 + concept)",duree:"100 min",total:40,intro:"\xC9valuation de comp\xE9tences\u202F: critique de document (C2), mobilisation des savoirs et application d\u2019un concept. Le document est fourni\u202F; le contexte, lui, doit \xEAtre connu.",parties:[{titre:"1. Analyse critique d\u2019un document",points:14,competence:"C2 \xB7 Critiquer",doc:`\xAB\xA0Dans les d\xE9mocraties, le peuple para\xEEt faire ce qu\u2019il veut\u202F; mais la libert\xE9 politique ne consiste point \xE0 faire ce que l\u2019on veut. [\u2026] Pour qu\u2019on ne puisse abuser du pouvoir, il faut que, par la disposition des choses, le pouvoir arr\xEAte le pouvoir. [\u2026] Il y a dans chaque \xC9tat trois sortes de pouvoirs [\u2026]. Tout serait perdu si le m\xEAme homme, ou le m\xEAme corps des principaux, ou des nobles, ou du peuple, exer\xE7aient ces trois pouvoirs.\xA0\xBB
\u2014 Montesquieu, De l\u2019esprit des lois, Gen\xE8ve, 1748.`,consigne:"a) Identifie le document (nature, auteur, date, lieu de publication, type de source). b) Quel probl\xE8me l\u2019auteur d\xE9nonce-t-il\u202F? c) Quelle solution propose-t-il\u202F? Cite deux passages. d) Pourquoi l\u2019ouvrage est-il publi\xE9 \xE0 Gen\xE8ve et non \xE0 Paris\u202F? e) Ce document est-il utile pour conna\xEEtre les id\xE9es des Lumi\xE8res\u202F? Pour conna\xEEtre le fonctionnement r\xE9el de la monarchie fran\xE7aise\u202F? Justifie.",correction:`a) Extrait d\u2019un **ouvrage de philosophie politique**\u202F; **Montesquieu** (philosophe fran\xE7ais, noble de robe)\u202F; **1748**\u202F; publi\xE9 \xE0 **Gen\xE8ve**\u202F; **source primaire** pour les id\xE9es des Lumi\xE8res. **(3 pts)**
b) L\u2019**abus de pouvoir**, l\u2019**autorit\xE9 absolue**\u202F: quand une seule personne ou un seul corps d\xE9tient tous les pouvoirs, \xAB\xA0tout serait perdu\xA0\xBB. **(2 pts)**
c) La **s\xE9paration des pouvoirs** (l\xE9gislatif, ex\xE9cutif, judiciaire), garantie par une Constitution\u202F: \xAB\xA0le pouvoir arr\xEAte le pouvoir\xA0\xBB\u202F; \xAB\xA0il y a dans chaque \xC9tat trois sortes de pouvoirs\xA0\xBB. **(3 pts)**
d) \xC0 cause de la **censure**\u202F: en France, les id\xE9es qui critiquent l\u2019absolutisme sont interdites\u202F; on publie \xE0 l\u2019\xE9tranger (Gen\xE8ve, Amsterdam) pour \xE9chapper au contr\xF4le royal. **(2 pts)**
e) **Utile** pour conna\xEEtre les id\xE9es des Lumi\xE8res\u202F: c\u2019est l\u2019\u0153uvre m\xEAme d\u2019un philosophe majeur. **Moins utile** pour conna\xEEtre le fonctionnement r\xE9el de la monarchie\u202F: c\u2019est un texte th\xE9orique qui exprime un **id\xE9al** et une **critique**\u202F; il faut le recouper avec d\u2019autres sources (textes officiels, r\xE9cits de Louis XIV\u2026). **(4 pts)**`,bareme:"Voir les points indiqu\xE9s\u202F; valoriser les citations courtes et pertinentes."},{titre:"2. Mobiliser les savoirs",points:12,competence:"Savoirs",consigne:"Compl\xE8te le tableau pour Diderot, Rousseau, Voltaire et Smith\u202F: \u0153uvre et date, probl\xE8me d\xE9nonc\xE9, valeur d\xE9fendue.",correction:`**Diderot** \u2014 article \xAB\xA0Autorit\xE9 politique\xA0\xBB, Encyclop\xE9die (1751) \u2014 manque de pouvoir du peuple, abus de pouvoir \u2014 consentement de la nation.
**Rousseau** \u2014 Du contrat social (1762) \u2014 soumission de la nation, int\xE9r\xEAts priv\xE9s dans les affaires publiques \u2014 volont\xE9 g\xE9n\xE9rale, libert\xE9, d\xE9mocratie.
**Voltaire** \u2014 Trait\xE9 sur la tol\xE9rance (1763) \u2014 intol\xE9rance religieuse, violence \u2014 tol\xE9rance, paix.
**Smith** \u2014 La Richesse des nations (1776) \u2014 intervention de l\u2019\xC9tat dans l\u2019\xE9conomie, corporations \u2014 libert\xE9 \xE9conomique (libre-\xE9change, libre concurrence).`,bareme:"1 point par case juste (12 cases)."},{titre:"3. Appliquer un concept",points:14,competence:"Mobiliser un concept",consigne:"Les id\xE9es des Lumi\xE8res rel\xE8vent-elles du concept de lib\xE9ralisme\u202F? Donne la d\xE9finition, v\xE9rifie au moins quatre attributs avec des preuves pr\xE9cises, puis conclus.",correction:`**D\xE9finition**\u202F: doctrine qui, s\u2019appuyant sur les Lumi\xE8res, pr\xF4ne la libert\xE9 individuelle dans diff\xE9rents domaines et s\u2019oppose \xE0 un \xC9tat central fort\u202F; le lib\xE9ralisme \xE9conomique a donn\xE9 naissance au capitalisme. **(2 pts)**
\u2022 **Libert\xE9 individuelle / droits**\u202F: Locke (droits naturels inali\xE9nables\u202F: vie, libert\xE9, s\xFBret\xE9, propri\xE9t\xE9). **(3 pts)**
\u2022 **Limiter le pouvoir central**\u202F: Montesquieu (s\xE9paration des pouvoirs), Diderot (consentement, Constitution). **(3 pts)**
\u2022 **Libert\xE9 de conscience**\u202F: Voltaire (tol\xE9rance). **(2 pts)**
\u2022 **Lib\xE9ralisme \xE9conomique**\u202F: Smith (main invisible, autor\xE9gulation, libre-\xE9change, contre les corporations, \xC9tat limit\xE9 \xE0 trois missions). **(3 pts)**
**Conclusion**\u202F: oui, les Lumi\xE8res sont **\xE0 l\u2019origine du lib\xE9ralisme** politique et \xE9conomique. Nuance\u202F: Rousseau insiste davantage sur la volont\xE9 g\xE9n\xE9rale et le bien commun que sur l\u2019individu. **(1 pt)**`,bareme:"Voir les points indiqu\xE9s."}]},{id:"ev3",titre:"\xC9preuve type CESS \xB7 Synth\xE8se (C3)",duree:"150 min",total:50,intro:"Sur le mod\xE8le de l\u2019\xE9preuve externe\u202F: une question de recherche, un dossier de documents, aucun rappel de contexte ni de chronologie. Les savoirs du cours et les concepts sont indispensables.",parties:[{titre:"Dossier documentaire",points:0,competence:"Lecture",doc:`Doc. 1 \u2014 G\xE9rard de Cambrai (1024)\u202F: la soci\xE9t\xE9 est divis\xE9e en \xAB\xA0gens de pri\xE8re, agriculteurs et guerriers\xA0\xBB, chacun \xAB\xA0r\xE9chauff\xE9\xA0\xBB par les deux autres.
Doc. 2 \u2014 Pyramide de la soci\xE9t\xE9 fran\xE7aise au XVIIIe si\xE8cle\u202F: clerg\xE9 \u2248 1\xA0%, noblesse \u2248 2\xA0%, Tiers \xE9tat \u2248 97\xA0% (85\xA0% de ruraux)\u202F; \xAB\xA0barri\xE8re sociale difficilement franchissable\xA0\xBB\u202F; \xE9l\xE9vation possible vers la noblesse.
Doc. 3 \u2014 Cahier de dol\xE9ances de Fleys (13 mars 1789)\u202F: cens, d\xEEme (21e gerbe), banalit\xE9s\u202F; \xAB\xA0tr\xE8s surcharg\xE9s en taille et vingti\xE8mes\xA0\xBB, les privil\xE9gi\xE9s \xE9tant \xAB\xA0exempts de taille\xA0\xBB.
Doc. 4 \u2014 Diderot, \xAB\xA0Autorit\xE9 politique\xA0\xBB, Encyclop\xE9die (1751)\u202F: \xAB\xA0La puissance qui vient du consentement des peuples suppose n\xE9cessairement des conditions qui en rendent l\u2019usage l\xE9gitime\xA0\xBB\u202F; la couronne et l\u2019autorit\xE9 publique sont des biens dont la nation est propri\xE9taire.
Doc. 5 \u2014 Locke (1690)\u202F: droits naturels \xE0 la vie, \xE0 la libert\xE9, \xE0 la s\xFBret\xE9 et \xE0 la propri\xE9t\xE9, universels et inali\xE9nables\u202F; le pouvoir doit \xEAtre consenti.
Doc. 6 \u2014 Rousseau (vers 1762)\u202F: la femme doit \xEAtre \xE9duqu\xE9e pour plaire et rester dans la sph\xE8re domestique\u202F; Olympe de Gouges, D\xE9claration des droits de la femme et de la citoyenne (1791).`,consigne:"Lis tout le dossier et pr\xE9pare un tableau\u202F: une ligne par document, une colonne par \xE9l\xE9ment de r\xE9ponse.",correction:"Exemple de tableau de tri\u202F: **organisation de la soci\xE9t\xE9** (docs 1, 2, 3) \u2014 **critiques et propositions des Lumi\xE8res** (docs 4, 5) \u2014 **limites** (doc. 6).",bareme:"Pr\xE9paration non not\xE9e."},{titre:"Synth\xE8se",points:50,competence:"C3 \xB7 Synth\xE9tiser",consigne:"Question de recherche\u202F: \xAB\xA0En quoi les id\xE9es des Lumi\xE8res remettent-elles en cause la soci\xE9t\xE9 d\u2019ordres et avec quelles limites\u202F?\xA0\xBB R\xE9dige une synth\xE8se (titre, introduction, d\xE9veloppement en paragraphes, conclusion) en mobilisant les concepts de stratification sociale et de lib\xE9ralisme.",correction:`**Titre**\u202F: La soci\xE9t\xE9 d\u2019ordres face aux id\xE9es des Lumi\xE8res en France au XVIIIe si\xE8cle.
**Introduction**\u202F: Au XVIIIe si\xE8cle, la France est une monarchie absolue de droit divin dont la soci\xE9t\xE9, h\xE9rit\xE9e du Moyen \xC2ge, est divis\xE9e en ordres. Les philosophes des Lumi\xE8res la soumettent \xE0 l\u2019examen de la raison. En quoi leurs id\xE9es remettent-elles en cause la soci\xE9t\xE9 d\u2019ordres et avec quelles limites\u202F? Nous pr\xE9senterons la soci\xE9t\xE9 d\u2019ordres, puis les critiques des Lumi\xE8res, enfin leurs limites.
**\xA71 \u2014 Une soci\xE9t\xE9 stratifi\xE9e h\xE9rit\xE9e du Moyen \xC2ge**\u202F: d\xE8s 1024, G\xE9rard de Cambrai pr\xE9sente une soci\xE9t\xE9 en trois groupes interd\xE9pendants (doc. 1). Au XVIIIe si\xE8cle, cette **stratification** demeure\u202F: clerg\xE9 (\u2248 1\xA0%) et noblesse (\u2248 2\xA0%) sont **privil\xE9gi\xE9s**, le Tiers \xE9tat (\u2248 97\xA0%) ne l\u2019est pas, et la barri\xE8re entre ordres est \xAB\xA0difficilement franchissable\xA0\xBB (doc. 2). Les paysans de Fleys paient cens, d\xEEme, banalit\xE9s et taille, alors que les privil\xE9gi\xE9s en sont exempts (doc. 3).
**\xA72 \u2014 Les Lumi\xE8res contestent les fondements de cet ordre**\u202F: **d\u2019une part**, Locke affirme que tous les hommes ont des **droits naturels** universels et inali\xE9nables (doc. 5), ce qui contredit des droits fix\xE9s par la naissance\u202F; **d\u2019autre part**, Diderot fonde l\u2019autorit\xE9 sur le **consentement des peuples**\u202F: la nation, et non le roi seul, est propri\xE9taire de l\u2019autorit\xE9 (doc. 4). Ces id\xE9es rel\xE8vent du **lib\xE9ralisme**\u202F: libert\xE9 individuelle et refus d\u2019un pouvoir absolu.
**\xA73 \u2014 Des limites**\u202F: **cependant**, l\u2019\xE9galit\xE9 proclam\xE9e ne concerne pas tout le monde\u202F: Rousseau veut la femme soumise et confin\xE9e au foyer\u202F; Olympe de Gouges doit r\xE9diger en 1791 une D\xE9claration des droits de la femme (doc. 6). (Savoir du cours\u202F: l\u2019esclavage n\u2019est d\xE9finitivement aboli qu\u2019en 1848.)
**Conclusion**\u202F: les Lumi\xE8res remettent en cause la **soci\xE9t\xE9 d\u2019ordres** en opposant aux privil\xE8ges de naissance l\u2019**\xE9galit\xE9 des droits naturels** et le **consentement** du peuple, fondements du lib\xE9ralisme. Leurs id\xE9es restent pourtant limit\xE9es aux hommes libres, ce qui montre que l\u2019\xE9galit\xE9 universelle reste \xE0 conqu\xE9rir.`,bareme:"Grille inspir\xE9e des \xE9preuves externes\u202F: pertinence de la r\xE9ponse \xE0 la question (10)\u202F; mobilisation des savoirs et des concepts (12)\u202F; utilisation de tous les documents, sans les r\xE9sumer un par un (10)\u202F; structure\u202F: titre, introduction, paragraphes, conclusion (10)\u202F; coh\xE9rence\u202F: connecteurs, langue (8)."}]}],vd=["Mon titre contient le sujet, la date et le lieu.","Mon introduction contient un contexte, la question de recherche et l\u2019annonce du plan.","Chaque paragraphe r\xE9pond \xE0 une partie de la question (une id\xE9e = un paragraphe).","Je regroupe les informations par id\xE9es, pas document par document.","Je cite les documents (\xAB\xA0doc. 2\xA0\xBB) et j\u2019utilise des preuves pr\xE9cises (chiffres, citations courtes).","J\u2019ajoute des savoirs du cours qui ne sont pas dans les documents.","Je mobilise au moins un concept avec ses attributs.","J\u2019utilise des connecteurs logiques (d\u2019abord, de plus, cependant, donc\u2026).","Ma conclusion r\xE9pond directement \xE0 la question."];var Tt=[{id:"q1",titre:"Ancien R\xE9gime\u202F: contexte",cat:"ch1",questions:[{q:"L\u2019Ancien R\xE9gime correspond \xE0 la p\xE9riode\u2026",choix:["du Ve au XVe si\xE8cle","du XVIe si\xE8cle \xE0 1789","de 1789 \xE0 1815","du XIXe si\xE8cle"],ok:1,expl:"L\u2019Ancien R\xE9gime va du XVIe si\xE8cle \xE0 1789\u202F; il prend fin avec la R\xE9volution fran\xE7aise."},{q:"Le r\xE9gime politique de l\u2019Ancien R\xE9gime est\u2026",choix:["une d\xE9mocratie","une monarchie constitutionnelle","une monarchie absolue de droit divin","une r\xE9publique"],ok:2,expl:"Le roi d\xE9tient seul le pouvoir et le tient de Dieu (sacre de Reims)."},{q:"En 1024, G\xE9rard de Cambrai divise la soci\xE9t\xE9 en\u2026",choix:["nobles, bourgeois, paysans","gens de pri\xE8re, guerriers, agriculteurs","riches et pauvres","citoyens et esclaves"],ok:1,expl:"Ceux qui prient (clerg\xE9), ceux qui combattent (guerriers) et ceux qui travaillent (agriculteurs)."},{q:"\xAB\xA0Chacune de ces cat\xE9gories est r\xE9chauff\xE9e \xE0 droite et \xE0 gauche par les deux autres\xA0\xBB signifie que\u2026",choix:["les groupes se font la guerre","les groupes d\xE9pendent les uns des autres","le clerg\xE9 domine seul","les paysans sont libres"],ok:1,expl:"Chaque groupe rend un service aux deux autres\u202F: ils sont interd\xE9pendants."},{q:"Quelles sont les trois causes des crises d\xE9mographiques\u202F?",choix:["Guerre, peste, famine","Imp\xF4ts, corv\xE9es, d\xEEme","R\xE9volution, exil, censure","Froid, pluie, s\xE9cheresse uniquement"],ok:0,expl:"La guerre, la peste (et les \xE9pid\xE9mies) et la famine provoquent des pics de mortalit\xE9."},{q:"L\u2019esp\xE9rance de vie sous l\u2019Ancien R\xE9gime est d\u2019environ\u2026",choix:["20 ans","32 ans","50 ans","65 ans"],ok:1,expl:"Environ 32 ans, \xE0 cause d\u2019une tr\xE8s forte mortalit\xE9 infantile."},{q:"L\u2019homogamie, c\u2019est\u2026",choix:["se marier dans son milieu social","avoir un seul enfant","rester c\xE9libataire","se marier tr\xE8s jeune"],ok:0,expl:"Homo = m\xEAme, gamie = mariage\u202F: on se marie avec quelqu\u2019un du m\xEAme milieu."},{q:"Une mauvaise r\xE9colte entra\xEEne d\u2019abord\u2026",choix:["une baisse du prix du pain","une hausse du prix du pain","la cr\xE9ation d\u2019usines","la fin des imp\xF4ts"],ok:1,expl:"Le pain co\xFBte 3 \xE0 4 fois plus cher\u202F; le pouvoir d\u2019achat baisse puis une crise industrielle suit."},{q:"Le mercantilisme vise \xE0\u2026",choix:["faire entrer de l\u2019or et l\u2019emp\xEAcher de sortir","supprimer les fronti\xE8res","interdire le commerce ext\xE9rieur","cr\xE9er une monnaie europ\xE9enne"],ok:0,expl:"On conquiert les march\xE9s ext\xE9rieurs et on bloque les produits \xE9trangers aux fronti\xE8res."},{vf:!1,q:"Au XVIIIe si\xE8cle, la France compte d\xE9j\xE0 de nombreuses usines et de bonnes routes.",expl:"Faux\u202F: il y a surtout des manufactures et des corporations\u202F; les transports sont lents (4-5 km/h) et les chemins mal entretenus."},{vf:!0,q:"Louis XIV utilise Versailles comme un instrument de gouvernement.",expl:"Vrai\u202F: il y installe sa cour \xE0 partir de 1682 pour contr\xF4ler la noblesse et affirmer son pouvoir."},{q:"Un manouvrier (journalier) est\u2026",choix:["un paysan ais\xE9 propri\xE9taire","un salari\xE9 agricole pay\xE9 \xE0 la journ\xE9e","un noble de province","un officier du roi"],ok:1,expl:"Il travaille la terre des autres et est pay\xE9 \xE0 la journ\xE9e."}]},{id:"q2",titre:"La soci\xE9t\xE9 d\u2019ordres",cat:"ch1",questions:[{q:"Les deux ordres privil\xE9gi\xE9s sont\u2026",choix:["le clerg\xE9 et la noblesse","la noblesse et la bourgeoisie","le clerg\xE9 et le Tiers \xE9tat","la bourgeoisie et les paysans"],ok:0,expl:"Le clerg\xE9 (1er ordre) et la noblesse (2e ordre) ne paient pas d\u2019imp\xF4ts directs royaux."},{q:"Le Tiers \xE9tat repr\xE9sente environ\u2026",choix:["50\xA0% de la population","75\xA0% de la population","98\xA0% de la population","10\xA0% de la population"],ok:2,expl:"Environ 97 \xE0 98\xA0%\u202F: tous ceux qui ne sont ni clercs ni nobles."},{q:"La d\xEEme est per\xE7ue par\u2026",choix:["le roi","le seigneur","l\u2019\xC9glise","les corporations"],ok:2,expl:"La d\xEEme est un imp\xF4t pr\xE9lev\xE9 par l\u2019\xC9glise sur les r\xE9coltes."},{q:"La gabelle est un imp\xF4t sur\u2026",choix:["le sel","le pain","le vin","les portes et fen\xEAtres"],ok:0,expl:"La gabelle est l\u2019imp\xF4t royal sur le sel."},{q:"Les banalit\xE9s obligent les paysans \xE0\u2026",choix:["r\xE9parer les routes","utiliser en payant le moulin, le four, le pressoir du seigneur","donner un dixi\xE8me de la r\xE9colte \xE0 l\u2019\xC9glise","servir dans l\u2019arm\xE9e"],ok:1,expl:"Le seigneur a le monopole du moulin, du four et du pressoir\u202F; les paysans paient pour les utiliser."},{q:"Un \xE9v\xEAque appartient au\u2026",choix:["clerg\xE9 r\xE9gulier","clerg\xE9 s\xE9culier","Tiers \xE9tat","noblesse de robe"],ok:1,expl:"Il vit parmi les fid\xE8les (dans le \xAB\xA0si\xE8cle\xA0\xBB)\u202F: clerg\xE9 s\xE9culier (haut clerg\xE9)."},{q:"Un moine appartient au\u2026",choix:["clerg\xE9 r\xE9gulier","clerg\xE9 s\xE9culier","bas clerg\xE9 s\xE9culier","Tiers \xE9tat"],ok:0,expl:"Il vit selon une r\xE8gle (regula), \xE0 l\u2019\xE9cart du monde."},{q:"Un bourgeois qui ach\xE8te une charge judiciaire anoblissante entre dans\u2026",choix:["la noblesse d\u2019\xE9p\xE9e","la noblesse de robe","le clerg\xE9","la noblesse de cour"],ok:1,expl:"C\u2019est la noblesse r\xE9cente, dite de robe (les \xAB\xA0robins\xA0\xBB)."},{q:"Un hobereau est\u2026",choix:["un riche banquier","un noble de province souvent modeste","un cur\xE9 de campagne","un ouvrier de manufacture"],ok:1,expl:"Noble de province, parfois pauvre et endett\xE9, souvent en tension avec les paysans."},{q:"Dans le budget de l\u2019ouvrier d\u2019Aunis, la premi\xE8re d\xE9pense est\u2026",choix:["le loyer","les imp\xF4ts","le pain","les v\xEAtements"],ok:2,expl:"Le pain\u202F: 54 livres 15 sols, de loin la d\xE9pense la plus lourde."},{vf:!0,q:"Dans le budget de l\u2019ouvrier d\u2019Aunis, les d\xE9penses d\xE9passent les revenus.",expl:"Vrai\u202F: environ 189 livres de d\xE9penses pour 183 livres 15 sols de revenus."},{vf:!1,q:"Les corporations favorisent la libre concurrence.",expl:"Faux\u202F: elles ont le monopole du m\xE9tier, fixent prix et salaires et peuvent interdire un concurrent."},{q:"La bourgeoisie r\xE9clame surtout\u2026",choix:["le retour au Moyen \xC2ge","l\u2019abolition des privil\xE8ges et la participation aux affaires de l\u2019\xC9tat","plus de corporations","la hausse de la d\xEEme"],ok:1,expl:"Riche mais sans privil\xE8ges, elle veut l\u2019\xE9galit\xE9, le pouvoir politique et la libert\xE9 \xE9conomique."},{q:"La noblesse est dite \xAB\xA0ouverte\xA0\xBB parce que\u2026",choix:["tout le monde peut entrer \xE0 Versailles","des bourgeois peuvent devenir nobles","elle ne paie pas d\u2019imp\xF4ts","elle vote les lois"],ok:1,expl:"Par l\u2019achat d\u2019offices ou de terres nobles, ou par anoblissement royal."}]},{id:"q3",titre:"Les philosophes et leurs id\xE9es",cat:"ch2",questions:[{q:"L\u2019Encyclop\xE9die est dirig\xE9e par\u2026",choix:["Voltaire et Rousseau","Diderot et d\u2019Alembert","Montesquieu et Smith","Locke et Kant"],ok:1,expl:"Diderot et d\u2019Alembert, publication de 1751 \xE0 1772."},{q:"\xAB\xA0Pour qu\u2019on ne puisse abuser du pouvoir, il faut que le pouvoir arr\xEAte le pouvoir\xA0\xBB est de\u2026",choix:["Rousseau","Voltaire","Montesquieu","Diderot"],ok:2,expl:"Montesquieu, De l\u2019esprit des lois (1748)\u202F: s\xE9paration des pouvoirs."},{q:"\xAB\xA0L\u2019homme est n\xE9 libre, et partout il est dans les fers\xA0\xBB est de\u2026",choix:["Rousseau","Montesquieu","Smith","Locke"],ok:0,expl:"Rousseau, Du contrat social (1762)."},{q:"Le pouvoir de faire les lois s\u2019appelle\u2026",choix:["ex\xE9cutif","judiciaire","l\xE9gislatif","constituant"],ok:2,expl:"L\xE9gislatif\u202F: faire, corriger ou abroger les lois."},{q:"Le pouvoir de juger les crimes s\u2019appelle\u2026",choix:["l\xE9gislatif","judiciaire","ex\xE9cutif","royal"],ok:1,expl:"Judiciaire\u202F: \xAB\xA0la puissance de juger\xA0\xBB chez Montesquieu."},{q:"Pour Diderot, l\u2019autorit\xE9 politique l\xE9gitime vient\u2026",choix:["de Dieu seul","du consentement des peuples","de la force","de la naissance"],ok:1,expl:"\xAB\xA0La puissance qui vient du consentement des peuples\xA0\xBB\u202F: la nation est propri\xE9taire de l\u2019autorit\xE9."},{q:"Le Trait\xE9 sur la tol\xE9rance de Voltaire porte surtout sur le th\xE8me\u2026",choix:["\xE9conomique","religieux","militaire","d\xE9mographique"],ok:1,expl:"Il d\xE9nonce l\u2019intol\xE9rance religieuse (affaire Calas, protestants)."},{q:"Selon Locke, les droits naturels sont\u2026",choix:["la vie, la libert\xE9, la s\xFBret\xE9, la propri\xE9t\xE9","le vote, l\u2019imp\xF4t, la guerre","la noblesse, la d\xEEme, la taille","le travail, la religion, la famille"],ok:0,expl:"Ils sont universels, inali\xE9nables et permanents."},{q:"La \xAB\xA0main invisible\xA0\xBB de Smith d\xE9signe\u2026",choix:["la censure royale","l\u2019int\xE9r\xEAt personnel qui profite involontairement \xE0 tous","l\u2019intervention de l\u2019\xC9tat","la volont\xE9 g\xE9n\xE9rale"],ok:1,expl:"Le boulanger cherche son profit mais nourrit la population."},{q:"Selon Smith, l\u2019\xC9tat doit se limiter \xE0\u2026",choix:["fixer les prix","la d\xE9fense, la justice, les infrastructures publiques","g\xE9rer les usines","prot\xE9ger les corporations"],ok:1,expl:"Trois missions seulement\u202F; pour le reste, laisser faire le march\xE9."},{q:"Inali\xE9nable signifie\u2026",choix:["qui peut \xEAtre vendu","qui ne peut \xEAtre ni c\xE9d\xE9, ni vendu, ni enlev\xE9","r\xE9serv\xE9 aux nobles","temporaire"],ok:1,expl:"Un droit inali\xE9nable ne peut jamais \xEAtre retir\xE9."},{vf:!1,q:"Les philosophes des Lumi\xE8res sont tous fran\xE7ais.",expl:"Faux\u202F: il y a des Anglais (Locke), des \xC9cossais (Smith), des Allemands (Kant)\u2026"},{vf:!0,q:"Rousseau d\xE9fend la volont\xE9 g\xE9n\xE9rale tourn\xE9e vers le bien commun.",expl:"Vrai\u202F: la soci\xE9t\xE9 doit \xEAtre gouvern\xE9e selon l\u2019int\xE9r\xEAt commun, pas selon les int\xE9r\xEAts priv\xE9s."}]},{id:"q4",titre:"Valeurs, limites et diffusion",cat:"ch2",questions:[{q:"\xAB\xA0Ose savoir\xA0\xBB (Kant, 1784) invite \xE0\u2026",choix:["ob\xE9ir au roi","penser par soi-m\xEAme","lire la Bible","suivre les savants"],ok:1,expl:"Utiliser sa propre raison sans
