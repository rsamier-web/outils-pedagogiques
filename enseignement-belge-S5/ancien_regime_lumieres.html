<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histoire S5 · Ancien Régime et Lumières</title>
<meta name="description" content="Comprendre, mémoriser et s'entraîner : la société d'Ancien Régime, la philosophie des Lumières et les 7 concepts d'histoire en 5e secondaire (FWB). Cours, glossaire, cartes mémoire, quiz, exercices et évaluations types.">
<meta name="theme-color" content="#3daee9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap">
<style>/* Thème sobre inspiré de KDE Breeze (clair) et Breeze Dark */
:root {
  --scale: 1;
  --win: #eff0f1; --view: #fcfcfc; --alt: #f5f6f7; --btn: #fcfcfc; --btn-hover: #e3f2fb;
  --text: #232629; --muted: #5d6873; --border: #bdc3c7; --border-soft: #dcdfe2;
  --accent: #3daee9; --accent-strong: #1d6fa5; --accent-bg: #e3f2fb; --focus: #3daee9;
  --pos: #27ae60; --pos-bg: #e5f5ec; --neg: #da4453; --neg-bg: #fbe9eb; --warn: #f67400; --warn-bg: #fff1e3;
  --c-blue: #2980b9; --c-green: #16a085; --c-orange: #e67e22; --c-purple: #8e44ad; --c-red: #c0392b;
  --hl-phrase: rgba(61, 174, 233, .20); --hl-mot: rgba(246, 116, 0, .38);
  --shadow: 0 1px 2px rgba(0, 0, 0, .08); --radius: 4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b; --btn-hover: #2c4659;
    --text: #fcfcfc; --muted: #a1a9b1; --border: #4d545b; --border-soft: #3b4045;
    --accent: #3daee9; --accent-strong: #5cbcef; --accent-bg: #1f3a4d;
    --pos: #2ecc71; --pos-bg: #1b3326; --neg: #ed5565; --neg-bg: #3c2226; --warn: #fdbc4b; --warn-bg: #3d3020;
    --c-blue: #5dade2; --c-green: #48c9b0; --c-orange: #f0a35e; --c-purple: #bb8fce; --c-red: #f1948a;
    --hl-phrase: rgba(61, 174, 233, .28); --hl-mot: rgba(253, 188, 75, .45);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b; --btn-hover: #2c4659;
  --text: #fcfcfc; --muted: #a1a9b1; --border: #4d545b; --border-soft: #3b4045;
  --accent: #3daee9; --accent-strong: #5cbcef; --accent-bg: #1f3a4d;
  --pos: #2ecc71; --pos-bg: #1b3326; --neg: #ed5565; --neg-bg: #3c2226; --warn: #fdbc4b; --warn-bg: #3d3020;
  --c-blue: #5dade2; --c-green: #48c9b0; --c-orange: #f0a35e; --c-purple: #bb8fce; --c-red: #f1948a;
  --hl-phrase: rgba(61, 174, 233, .28); --hl-mot: rgba(253, 188, 75, .45);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--scale)); }
body { margin: 0; background: var(--win); color: var(--text); font: 1rem/1.6 "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
::highlight(tts-phrase) { background-color: var(--hl-phrase); }
::highlight(tts-mot) { background-color: var(--hl-mot); color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { line-height: 1.3; font-weight: 600; }
h1 { font-size: 1.55rem; margin: .2rem 0 .4rem; }
h2 { font-size: 1.2rem; margin: 1.8rem 0 .6rem; }
h3 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
h4 { font-size: .98rem; margin: 0 0 .25rem; }
p { margin: .5rem 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
kbd { font: .75rem/1 ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px; padding: 2px 5px; background: var(--alt); margin-left: .35rem; }
.ico { flex: none; vertical-align: -3px; }
.nowrap { white-space: nowrap; }

/* ——— Barre supérieure */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .5rem; height: 52px; padding: 0 .75rem; background: var(--win); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: .6rem; background: none; border: 0; cursor: pointer; padding: .25rem; min-width: 0; }
.logo { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
.brand-t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tts-bar { margin-left: auto; display: flex; align-items: center; gap: .35rem; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer; color: var(--text); }
.icon-btn:hover { background: var(--btn-hover); border-color: var(--accent); }
.menu-btn { display: none; }
.banner { background: var(--warn-bg); color: var(--text); border-bottom: 1px solid var(--warn); padding: .5rem 1rem; font-size: .9rem; }

/* ——— Boutons Breeze */
.btn { display: inline-flex; align-items: center; gap: .4rem; min-height: 34px; padding: .35rem .85rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); box-shadow: var(--shadow); cursor: pointer; text-align: left; line-height: 1.3; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--btn-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #2d9fda; color: #fff; }
.btn.on { border-color: var(--accent); background: var(--accent-bg); }
.btn.small { min-height: 30px; padding: .25rem .65rem; font-size: .9rem; }
.btn.big { min-height: 42px; padding: .5rem 1.2rem; font-weight: 600; }
.btn.danger { border-color: var(--neg); color: var(--neg); }
.btn.tool .lbl { white-space: nowrap; }

/* ——— Mise en page */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.sidebar { position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; background: var(--win); border-right: 1px solid var(--border); padding: .6rem .5rem 2rem; }
.scrim { display: none; }
main { background: var(--view); outline: none; min-width: 0; }
main:focus, main:focus-visible { outline: none; }
.page { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
.page-head { margin-bottom: 1.2rem; }
.page-head.row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.kicker { color: var(--accent-strong); font-size: .85rem; font-weight: 600; margin: 0; letter-spacing: .02em; }
.lead { color: var(--muted); font-size: 1.05rem; margin: .2rem 0 0; }
.row { display: flex; align-items: center; flex-wrap: wrap; }
.row.gap { gap: .5rem; margin: .8rem 0; }
.row.end { justify-content: flex-end; margin-top: 1rem; }
.progress { height: 4px; background: var(--border-soft); border-radius: 2px; margin-top: .7rem; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s; }

/* ——— Navigation latérale */
.sidebar-nav ul { list-style: none; margin: 0; padding: 0; }
.nav-item, .nav-ch, .nav-sec { width: 100%; display: flex; align-items: center; gap: .55rem; border: 1px solid transparent; border-radius: var(--radius); background: none; cursor: pointer; text-align: left; padding: .45rem .6rem; }
.nav-item:hover, .nav-ch:hover, .nav-sec:hover { background: var(--btn-hover); }
.nav-item.on, .nav-sec.on { background: var(--accent-bg); border-color: var(--accent); }
.nav-item .count { margin-left: auto; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 .45rem; font-size: .78rem; font-weight: 600; }
.sub { padding-left: .9rem !important; }
.nav-ch { font-weight: 600; font-size: .92rem; color: var(--muted); padding: .35rem .5rem; }
.chev { display: inline-block; transition: transform .15s; width: .8rem; }
.chev.open { transform: rotate(90deg); }
.sub2 { padding-left: .6rem !important; border-left: 1px solid var(--border-soft); margin-left: .75rem !important; }
.nav-sec { font-size: .88rem; padding: .3rem .5rem; line-height: 1.35; }
.nav-sec .ico { color: var(--pos); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border); flex: none; display: inline-block; }

/* ——— Contenus de cours */
.list { padding-left: 1.3rem; }
.list li { margin: .3rem 0; }
.bullet { padding-left: 1rem; text-indent: -1rem; }
.bullet::before { content: '• '; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .7rem; margin: 1rem 0; }
.card { background: var(--view); border: 1px solid var(--border-soft); border-top: 3px solid var(--accent); border-radius: var(--radius); padding: .75rem .9rem; }
.card p { margin: .2rem 0 0; font-size: .95rem; }
.card.blue { border-top-color: var(--c-blue); } .card.green { border-top-color: var(--c-green); } .card.orange { border-top-color: var(--c-orange); } .card.purple { border-top-color: var(--c-purple); } .card.red { border-top-color: var(--c-red); }
.retenir { border: 1px solid var(--accent); background: var(--accent-bg); border-radius: var(--radius); padding: .7rem 1rem; margin: 1.1rem 0; }
.retenir .tag, .tag { display: inline-block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-strong); }
.retenir p { margin: .2rem 0 0; }
.doc { margin: 1rem 0; border: 1px solid var(--border-soft); border-left: 4px solid var(--c-orange); border-radius: var(--radius); background: var(--alt); padding: .7rem 1rem; }
.doc figcaption { font-size: .92rem; }
.doc blockquote { margin: .3rem 0; font-family: Georgia, "Noto Serif", serif; }
.doc .src { font-size: .82rem; color: var(--muted); margin: .2rem 0 0; }
.table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--border-soft); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: .94rem; }
th, td { text-align: left; vertical-align: top; padding: .5rem .7rem; border-bottom: 1px solid var(--border-soft); }
th { background: var(--alt); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin: 1rem 0; }
.cmp { border: 1px solid var(--border-soft); border-radius: var(--radius); padding: .7rem .9rem; background: var(--view); }
.cmp.c0 { border-top: 3px solid var(--c-blue); } .cmp.c1 { border-top: 3px solid var(--c-orange); }
.cmp ul { padding-left: 1.1rem; margin: .3rem 0 0; } .cmp li { margin: .2rem 0; font-size: .95rem; }
.steps { list-style: none; padding: 0; counter-reset: st; margin: 1rem 0; }
.steps > li { position: relative; padding: .55rem .8rem .55rem 2.8rem; border: 1px solid var(--border-soft); border-radius: var(--radius); margin: .5rem 0; background: var(--view); counter-increment: st; }
.steps > li::before { content: counter(st); position: absolute; left: .7rem; top: .6rem; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--accent); color: #fff; font-size: .8rem; font-weight: 700; display: grid; place-items: center; }
.steps.compact > li p { margin: 0; }
.steps li p { margin: .15rem 0 0; }
.check { margin: 1.6rem 0 .5rem; border: 1px dashed var(--accent); border-radius: var(--radius); padding: .6rem 1rem 1rem; }
.check h3 { margin: .3rem 0; display: flex; align-items: center; gap: .4rem; color: var(--accent-strong); }
.hint { color: var(--muted); font-size: .9rem; }
.check-item { border-top: 1px solid var(--border-soft); padding-top: .5rem; margin-top: .5rem; }
.q { font-weight: 600; }
.q.big { font-size: 1.12rem; }
.reveal { margin: .3rem 0; }
.reveal-body { margin-top: .4rem; padding: .4rem .8rem; border-left: 3px solid var(--pos); background: var(--pos-bg); border-radius: 0 var(--radius) var(--radius) 0; }
.pager { display: flex; justify-content: space-between; gap: .6rem; margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }

/* ——— Schémas */
figure { margin: 1rem 0; }
figcaption { font-size: .88rem; color: var(--muted); margin-top: .4rem; }
.cmap { display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: .8rem; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--alt); }
.cmap-row { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; width: 100%; }
.cmap-node { flex: 1 1 150px; max-width: 230px; background: var(--view); border: 1px solid var(--border); border-radius: 18px; padding: .4rem .8rem; font-size: .9rem; text-align: center; position: relative; }
.cmap-centre { background: var(--accent); color: #fff; font-weight: 700; padding: .55rem 1.3rem; border-radius: 24px; text-align: center; }
.pyr-wrap { width: min(280px, 100%); display: flex; flex-direction: column; align-items: center; margin: 0 auto; }
.pyr-band { width: 100%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: .88rem; text-align: center; }
.pyr-band.b1 { height: 56px; clip-path: polygon(50% 0, 66% 100%, 34% 100%); background: var(--c-purple); align-items: end; padding-bottom: 4px; font-size: .72rem; }
.pyr-band.b2 { height: 44px; clip-path: polygon(34% 0, 66% 0, 80% 100%, 20% 100%); background: var(--c-blue); }
.pyr-band.b3 { height: 64px; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); background: var(--c-green); }
.pyr .pyr-band span { padding: 0 .3rem; }
.ordres .pyr-grid { display: grid; grid-template-columns: 260px 1fr; gap: 1rem; align-items: center; }
.ordres .pyr-band.b1 { font-size: .7rem; }
.pyr-legend { display: flex; flex-direction: column; gap: .4rem; }
.lg { border-left: 4px solid var(--border); padding: .25rem .6rem; background: var(--view); border-radius: 0 var(--radius) var(--radius) 0; }
.lg strong { display: block; font-size: .92rem; } .lg span { font-size: .86rem; color: var(--muted); }
.lg.l1 { border-color: var(--c-purple); } .lg.l2 { border-color: var(--c-blue); } .lg.l3 { border-color: var(--c-green); }
.lg.sep { border-left: 0; border-top: 2px dashed var(--neg); border-radius: 0; background: none; padding: .3rem 0 0; }
.lg.sep span { color: var(--neg); }
.trio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; position: relative; }
.trio-item { display: flex; flex-direction: column; gap: .15rem; padding: .7rem; border-radius: var(--radius); border: 1px solid var(--border-soft); background: var(--view); text-align: center; }
.trio-item.c0 { border-top: 4px solid var(--c-purple); } .trio-item.c1 { border-top: 4px solid var(--c-blue); } .trio-item.c2 { border-top: 4px solid var(--c-green); }
.trio-item span { font-size: .82rem; color: var(--muted); } .trio-item em { font-size: .9rem; }
.crises-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.cr { padding: .5rem; border-radius: var(--radius); text-align: center; font-weight: 600; color: #fff; }
.cr.c1 { background: var(--c-red); } .cr.c2 { background: var(--c-purple); } .cr.c3 { background: var(--c-orange); }
.cr.centre { grid-column: 1 / -1; background: var(--accent-bg); color: var(--text); border: 1px solid var(--accent); font-weight: 500; position: relative; }
.cr.centre::before { content: '↓  ↓  ↓'; display: block; color: var(--accent-strong); font-weight: 700; letter-spacing: .5em; }
.chaine ol { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0; }
.chaine li { display: flex; align-items: center; gap: .6rem; padding: .45rem .7rem; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--view); }
.chaine li + li { margin-top: 1.4rem; position: relative; }
.chaine li + li::before { content: '↓'; position: absolute; top: -1.35rem; left: 1.05rem; color: var(--accent-strong); font-weight: 700; }
.chaine .num { width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--c-orange); color: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; }
.pv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.pv { padding: .7rem; border-radius: var(--radius); border: 1px solid var(--border-soft); background: var(--view); display: flex; flex-direction: column; gap: .2rem; }
.pv span { font-size: .9rem; color: var(--muted); }
.pv.c0 { border-top: 4px solid var(--c-blue); } .pv.c1 { border-top: 4px solid var(--c-orange); } .pv.c2 { border-top: 4px solid var(--c-purple); }

/* ——— Accueil */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .6rem; margin: 1rem 0; }
.stat { display: flex; flex-direction: column; text-align: left; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--alt); padding: .7rem .9rem; }
button.stat { cursor: pointer; } button.stat:hover { border-color: var(--accent); background: var(--btn-hover); }
.stat strong { font-size: 1.45rem; color: var(--accent-strong); }
.stat span { font-size: .86rem; color: var(--muted); }
.parcours { list-style: none; padding: 0; }
.parcours li { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .8rem; align-items: center; padding: .7rem 0; border-bottom: 1px solid var(--border-soft); }
.parcours h3 { margin: 0; } .parcours p { margin: .1rem 0 0; color: var(--muted); font-size: .93rem; }
.pn { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent-strong); display: grid; place-items: center; font-weight: 700; }
.ch-index { margin-bottom: 1.5rem; }
.link-list { list-style: none; padding: 0; margin: .5rem 0; border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; }
.link-list li + li { border-top: 1px solid var(--border-soft); }
.link-list button { width: 100%; display: flex; align-items: center; gap: .6rem; padding: .55rem .9rem; background: var(--view); border: 0; cursor: pointer; text-align: left; }
.link-list button:hover { background: var(--btn-hover); }
.link-list .ico { color: var(--pos); }

/* ——— Tuiles, badges, puces */
.tiles { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .7rem; }
.tile { width: 100%; height: 100%; display: flex; flex-direction: column; gap: .3rem; align-items: flex-start; text-align: left; padding: .9rem; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--view); cursor: pointer; box-shadow: var(--shadow); }
.tile:hover { border-color: var(--accent); background: var(--btn-hover); }
.tile.accent { border-color: var(--accent); }
.badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: .1rem .5rem; border-radius: 10px; background: var(--alt); border: 1px solid var(--border-soft); color: var(--muted); white-space: nowrap; }
.badge.ch1 { color: var(--c-purple); border-color: var(--c-purple); } .badge.ch2 { color: var(--c-blue); border-color: var(--c-blue); } .badge.concepts { color: var(--c-green); border-color: var(--c-green); } .badge.dates { color: var(--c-orange); border-color: var(--c-orange); } .badge.personnages { color: var(--c-red); border-color: var(--c-red); }
.meter { width: 100%; height: 4px; background: var(--border-soft); border-radius: 2px; overflow: hidden; margin-top: auto; }
.meter span { display: block; height: 100%; background: var(--pos); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { border: 1px solid var(--border); background: var(--btn); border-radius: 16px; padding: .25rem .8rem; cursor: pointer; font-size: .9rem; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.field { margin: .8rem 0; }
.field-label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: .3rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: .8rem; }
.tab { border: 1px solid transparent; border-bottom: 0; background: none; padding: .45rem .9rem; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; margin-bottom: -1px; }
.tab:hover { background: var(--btn-hover); }
.tab.on { background: var(--view); border-color: var(--border); border-bottom: 1px solid var(--view); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
.switch, .sw { display: flex; align-items: center; gap: .5rem; margin: .6rem 0; cursor: pointer; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }

/* ——— Glossaire */
.toolbar-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; position: sticky; top: 52px; background: var(--view); padding: .5rem 0; z-index: 5; border-bottom: 1px solid var(--border-soft); }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: .4rem; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 .6rem; background: var(--view); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.search input { border: 0; outline: 0; background: none; padding: .45rem 0; width: 100%; font: inherit; color: var(--text); }
.gl-letter { font-size: 1rem; color: var(--accent-strong); border-bottom: 1px solid var(--border-soft); padding-bottom: .2rem; margin: 1.4rem 0 .3rem; }
.gl { margin: 0; }
.gl-item { padding: .45rem 0; border-bottom: 1px dotted var(--border-soft); }
.gl dt { font-weight: 600; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.gl dd { margin: .1rem 0 0; }
.gl .ex { color: var(--muted); font-style: italic; }

/* ——— Cartes mémoire */
.flash-card { position: relative; min-height: 240px; border: 1px solid var(--border); border-radius: 8px; background: var(--view); box-shadow: 0 2px 8px rgba(0, 0, 0, .08); padding: 2.2rem 1.5rem 1.4rem; text-align: center; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: .6rem; margin: .8rem 0 1rem; }
.flash-card .badge { position: absolute; top: .7rem; left: .8rem; }
.fc-term { font-size: 1.45rem; font-weight: 600; margin: 0; }
.fc-def { font-size: 1.08rem; margin: 0; }
.fc-back { border-top: 1px solid var(--border-soft); padding-top: .8rem; }
.fc-ex { color: var(--muted); font-style: italic; font-size: .95rem; }
.fc-hint { color: var(--muted); font-size: .9rem; margin: 0; }
.fc-actions { display: flex; justify-content: center; }
.fc-grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
.grade { display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .55rem .3rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); cursor: pointer; box-shadow: var(--shadow); }
.grade span { font-size: .8rem; color: var(--muted); }
.grade kbd { margin: .15rem 0 0; }
.grade.again { border-bottom: 3px solid var(--neg); } .grade.hard { border-bottom: 3px solid var(--warn); } .grade.good { border-bottom: 3px solid var(--pos); } .grade.easy { border-bottom: 3px solid var(--accent); }
.grade:hover { background: var(--btn-hover); }
.empty { text-align: center; padding: 2rem 1rem; border: 1px dashed var(--border); border-radius: 8px; }

/* ——— Quiz */
.quiz-q { margin-top: 1rem; }
.choices { display: grid; gap: .5rem; margin: 1rem 0; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice { display: flex; align-items: center; gap: .7rem; padding: .65rem .8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--btn); cursor: pointer; text-align: left; box-shadow: var(--shadow); }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--btn-hover); }
.choice .letter { width: 1.7rem; height: 1.7rem; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: .85rem; font-weight: 700; flex: none; }
.choice:disabled { cursor: default; }
.choice.ok { border-color: var(--pos); background: var(--pos-bg); }
.choice.ok .letter { background: var(--pos); border-color: var(--pos); color: #fff; }
.choice.ko { border-color: var(--neg); background: var(--neg-bg); }
.choice.ko .letter { background: var(--neg); border-color: var(--neg); color: #fff; }
.choice.dim { opacity: .6; }
.feedback { padding: .65rem .9rem; border-radius: var(--radius); border-left: 4px solid; }
.feedback.ok { border-color: var(--pos); background: var(--pos-bg); }
.feedback.ko { border-color: var(--neg); background: var(--neg-bg); }
.result { display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--accent); background: var(--accent-bg); border-radius: var(--radius); }
.result strong { font-size: 2rem; color: var(--accent-strong); }
.err { border: 1px solid var(--border-soft); border-radius: var(--radius); padding: .5rem .9rem; margin: .5rem 0; }
.err .bad { color: var(--neg); margin: .2rem 0; } .err .good { color: var(--pos); margin: .2rem 0; font-weight: 600; }

/* ——— Exercices */
.methode .steps { margin-top: .4rem; }
.worked { border: 1px solid var(--c-purple); border-radius: 6px; padding: .2rem 1.1rem 1rem; margin: 1.5rem 0; background: var(--alt); }
.worked h2 { display: flex; align-items: center; gap: .4rem; color: var(--c-purple); margin-top: .9rem; }
.consigne { font-weight: 600; }
.exo { border: 1px solid var(--border-soft); border-left: 4px solid var(--border); border-radius: var(--radius); padding: .8rem 1rem; margin: 1rem 0; background: var(--view); }
.exo.n1 { border-left-color: var(--c-green); } .exo.n2 { border-left-color: var(--c-blue); } .exo.n3 { border-left-color: var(--c-orange); }
.exo.done { background: var(--alt); }
.exo-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.exo-head h2 { margin: .2rem 0; font-size: 1.1rem; }
.lvl { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.lvl.n1 { color: var(--c-green); } .lvl.n2 { color: var(--c-blue); } .lvl.n3 { color: var(--c-orange); }
.done-tag { color: var(--pos); font-size: .85rem; font-weight: 600; display: inline-flex; gap: .25rem; align-items: center; }
.answer textarea { width: 100%; font: inherit; color: var(--text); background: var(--view); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .7rem; resize: vertical; line-height: 1.5; }
.answer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.hints { background: var(--warn-bg); border-left: 3px solid var(--warn); padding: .5rem .8rem .5rem 1.8rem; border-radius: 0 var(--radius) var(--radius) 0; margin: .5rem 0; }
.correction { border-left: 3px solid var(--pos); background: var(--pos-bg); padding: .5rem .9rem; border-radius: 0 var(--radius) var(--radius) 0; margin-top: .6rem; }
.correction h4 { margin-top: .4rem; }
.criteres { margin-top: .7rem; border-top: 1px solid var(--border-soft); padding-top: .5rem; }
.crit { display: flex; gap: .5rem; align-items: flex-start; margin: .3rem 0; cursor: pointer; }
.crit input { margin-top: .25rem; }
.bareme { font-size: .92rem; color: var(--muted); }

/* ——— Lignes du temps */
.tl-scroll { overflow-x: auto; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--alt); margin: .8rem 0; }
.tl { display: block; font-family: inherit; }
.tl-axis { stroke: var(--text); stroke-width: 2; }
.tl-tick { stroke: var(--text); }
.tl-year { fill: var(--muted); font-size: 12px; }
.tl-stem { stroke: var(--border); }
.tl-stem.sel { stroke: var(--accent); stroke-width: 2; }
.tl-dot { fill: var(--accent); stroke: var(--view); stroke-width: 2; }
.tl-lbl { fill: var(--text); font-size: 11.5px; }
.tl-lbl-bg { fill: var(--view); stroke: var(--border-soft); }
.tl-evt, .tl-per { cursor: pointer; outline: none; }
.tl-evt:hover .tl-lbl-bg, .tl-evt:focus .tl-lbl-bg, .tl-evt.sel .tl-lbl-bg { stroke: var(--accent); fill: var(--accent-bg); }
.tl-bar { fill: var(--c-blue); }
.tl-per.c1 .tl-bar { fill: var(--c-green); } .tl-per.c2 .tl-bar { fill: var(--c-orange); } .tl-per.c3 .tl-bar { fill: var(--c-purple); } .tl-per.c4 .tl-bar { fill: var(--c-red); }
.tl-per.sel .tl-lbl, .tl-per:focus .tl-lbl { font-weight: 700; }
.tl-detail { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: .6rem .9rem; border: 1px solid var(--accent); background: var(--accent-bg); border-radius: var(--radius); }

/* ——— Dialogue de réglages */
.dlg { border: 1px solid var(--border); border-radius: 6px; padding: 0; width: min(560px, 94vw); max-height: 88vh; background: var(--view); color: var(--text); box-shadow: 0 8px 32px rgba(0, 0, 0, .3); }
.dlg::backdrop { background: rgba(0, 0, 0, .35); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: .5rem .6rem .5rem 1rem; background: var(--win); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.dlg-head h2 { margin: 0; font-size: 1.05rem; }
.dlg-body { padding: .2rem 1.1rem 1.2rem; }
.dlg-body h3 { color: var(--accent-strong); border-bottom: 1px solid var(--border-soft); padding-bottom: .2rem; }
.fld { display: flex; flex-direction: column; gap: .3rem; margin: .8rem 0; border: 0; padding: 0; }
.fld > span, .fld legend { font-weight: 600; font-size: .92rem; padding: 0; }
.fld small { color: var(--muted); }
.fld select { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: var(--radius); padding: .4rem; }
.fld input[type="range"] { accent-color: var(--accent); width: 100%; }
.radio { display: flex; gap: .45rem; align-items: center; margin: .2rem 0; cursor: pointer; }
.warn { background: var(--warn-bg); border-left: 3px solid var(--warn); padding: .5rem .8rem; border-radius: 0 var(--radius) var(--radius) 0; }

/* ——— Mobile */
@media (max-width: 880px) {
  .menu-btn { display: grid; }
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; top: 52px; left: 0; bottom: 0; height: auto; width: min(300px, 86vw); z-index: 30; transform: translateX(-102%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0, 0, 0, .2); }
  .drawer-open .sidebar { transform: none; }
  .drawer-open .scrim { display: block; position: fixed; inset: 52px 0 0 0; background: rgba(0, 0, 0, .3); z-index: 25; }
  .page { padding: 1.1rem 1rem 3rem; }
  .brand-t { font-size: .92rem; }
}
@media (max-width: 640px) {
  .btn.tool .lbl { display: none; }
  .brand-t { display: none; }
  .compare, .trio-grid, .pv-grid { grid-template-columns: 1fr; }
  .ordres .pyr-grid { grid-template-columns: 1fr; }
  .parcours li { grid-template-columns: 2.2rem 1fr; }
  .parcours li .btn { grid-column: 2; justify-self: start; }
  .fc-grades { grid-template-columns: repeat(2, 1fr); }
  .choices.two { grid-template-columns: 1fr; }
  .crises-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print { .topbar, .sidebar, .pager, [data-notts] { display: none !important; } .layout { display: block; } }
</style>

pare ensuite avec la soci\xE9t\xE9 du Moyen \xC2ge."},{type:"check",items:[{q:"Quand l\u2019Ancien R\xE9gime prend-il fin\u202F?",r:"En 1789, avec la R\xE9volution fran\xE7aise."},{q:"Quel est le r\xE9gime politique de l\u2019Ancien R\xE9gime\u202F?",r:"La monarchie absolue de droit divin."}]}]},{id:"ch1-1",titre:"Le concept de stratification sociale",blocs:[{type:"p",t:"La **stratification sociale** est le d\xE9coupage de la soci\xE9t\xE9 en **cat\xE9gories (strates) sociales**\u202F: des groupes de personnes distincts les uns des autres et **hi\xE9rarchis\xE9s**."},{type:"schema",kind:"conceptMap",centre:"Stratification sociale",noeuds:["In\xE9galit\xE9s de richesses, revenus","In\xE9galit\xE9s de pouvoir","In\xE9galit\xE9s de prestige","In\xE9galit\xE9s de culture","In\xE9galit\xE9s de profession"]},{type:"h",t:"Les groupes se distinguent selon\u2026"},{type:"list",items:["le **statut** (libre ou non libre)\u202F;","le **type de profession**\u202F;","l\u2019**\xE9ducation**\u202F;","les **droits et les devoirs**."]},{type:"retenir",t:"Une soci\xE9t\xE9 est stratifi\xE9e quand elle est **d\xE9coup\xE9e en groupes** qui sont **hi\xE9rarchis\xE9s** (du plus puissant au moins puissant) \xE0 cause d\u2019**in\xE9galit\xE9s** de richesse, de pouvoir, de prestige, de culture ou de profession."},{type:"schema",kind:"pyramideSimple"},{type:"check",items:[{q:"Cite trois crit\xE8res qui cr\xE9ent des in\xE9galit\xE9s entre les strates.",r:"Au choix\u202F: richesses/revenus, pouvoir, prestige, culture, profession."},{q:"Que signifie \xAB\xA0hi\xE9rarchis\xE9\xA0\xBB\u202F?",r:"Les groupes sont class\xE9s du plus haut (plus puissant, plus prestigieux) au plus bas."}]}]},{id:"ch1-2",titre:"La soci\xE9t\xE9 au Moyen \xC2ge",blocs:[{type:"p",t:"En **1024**, G\xE9rard, **\xE9v\xEAque de Cambrai-Arras**, explique dans un discours que, depuis l\u2019origine, le genre humain est divis\xE9 en **trois** groupes. Son secr\xE9taire, un chanoine, le r\xE9sume dans la *Gesta episcoporum Cameracensium* (r\xE9cit des actions des \xE9v\xEAques de Cambrai)."},{type:"schema",kind:"troisOrdres"},{type:"doc",titre:"Document\u202F: Gesta episcoporum Cameracensium (1024), extrait",source:"D\u2019apr\xE8s Bethmann, Monumenta Germaniae Historica, 1846",texte:"\xAB\xA0Le genre humain est divis\xE9 en trois\u202F: les gens de pri\xE8re, les agriculteurs et les guerriers. [\u2026] Chacune de ces cat\xE9gories est r\xE9chauff\xE9e \xE0 droite et \xE0 gauche par les deux autres.\xA0\xBB"},{type:"p",t:"\xAB\xA0**R\xE9chauff\xE9e \xE0 droite et \xE0 gauche par les deux autres**\xA0\xBB signifie que les trois groupes **d\xE9pendent les uns des autres**\u202F: chacun rend un service aux deux autres."},{type:"table",head:["Groupe","R\xF4le","Ce qu\u2019il re\xE7oit des autres"],rows:[["Ceux qui prient (clerg\xE9)","Prier pour le salut de tous","La s\xE9curit\xE9 (guerriers) et la nourriture (agriculteurs)"],["Ceux qui combattent (guerriers, nobles)","Prot\xE9ger par les armes","La nourriture et les taxes (agriculteurs), les pri\xE8res qui lavent leurs fautes (clerg\xE9)"],["Ceux qui travaillent (agriculteurs)","Nourrir la soci\xE9t\xE9","La protection (guerriers) et les pri\xE8res (clerg\xE9)"]]},{type:"h",t:"Plus tard\u202F: l\u2019essor des villes (XIIIe \u2013 XIVe si\xE8cles)"},{type:"p",t:"Une **miniature** illustrant un manuscrit de **Nicole Oresme** (Paris, vers 1375) montre que de **nouvelles cat\xE9gories** apparaissent avec le d\xE9veloppement urbain\u202F: **marchands, artisans, bourgeois**, gens de loi\u2026 En observant les habits et les objets, on distingue aussi les cat\xE9gories li\xE9es \xE0 la noblesse (hommes d\u2019armes, conseillers du seigneur)."},{type:"retenir",t:"Oui, la soci\xE9t\xE9 m\xE9di\xE9vale est **stratifi\xE9e**\u202F: elle est divis\xE9e en **groupes hi\xE9rarchis\xE9s** (clerg\xE9, noblesse, travailleurs)\u202F; les **classes sup\xE9rieures** sont le **clerg\xE9** et la **noblesse**."},{type:"check",items:[{q:"Quels sont les trois groupes d\xE9crits par G\xE9rard de Cambrai en 1024\u202F?",r:"Les gens de pri\xE8re (clerg\xE9), les guerriers (noblesse) et les agriculteurs (ceux qui travaillent)."},{q:"Quelles nouvelles cat\xE9gories apparaissent avec l\u2019essor des villes\u202F?",r:"Les marchands, les artisans, les bourgeois (habitants des bourgs), les gens de loi."}]}]},{id:"ch1-3",titre:"Contexte\u202F: la d\xE9mographie",blocs:[{type:"p",t:"Aux XVIIe et XVIIIe si\xE8cles, la France est l\u2019**\xC9tat le plus peupl\xE9 d\u2019Europe** (environ **22 millions** d\u2019habitants vers 1700)."},{type:"cards",items:[{t:"Natalit\xE9 \xE9lev\xE9e",d:"\u2248 40\xA0\u2030 par an (18\xA0\u2030 au Maroc en 2021). Une femme accouche tous les 2 ans en moyenne\u202F; 4 \xE0 5 enfants par couple mari\xE9.",c:"green"},{t:"Mortalit\xE9 \xE9lev\xE9e",d:"\u2248 40\xA0\u2030 par an (6\xA0\u2030 au Maroc en 2021). La moiti\xE9 des enfants meurent avant 20 ans.",c:"red"},{t:"Esp\xE9rance de vie",d:"Environ 32 ans (forte mortalit\xE9 infantile).",c:"orange"},{t:"Mariage",d:"Premier mariage vers 26-27 ans\u202F; c\xE9libataires rares\u202F; forte homogamie (on se marie dans son milieu)\u202F; peu d\u2019enfants hors mariage.",c:"blue"}]},{type:"p",t:"La mortalit\xE9 est plus forte **en ville**\u202F: manque d\u2019hygi\xE8ne, promiscuit\xE9, alimentation carenc\xE9e ou insuffisante."},{type:"h",t:"Les crises d\xE9mographiques"},{type:"p",t:"Des **pics de mortalit\xE9** fr\xE9quents provoquent une crise d\xE9mographique\u202F: les mariages et les naissances diminuent, et une **crise \xE9conomique** suit g\xE9n\xE9ralement. Trois causes\u202F:"},{type:"schema",kind:"triangleCrises"},{type:"list",items:["**Guerres**\u202F: nombreuses \xE0 la fin du r\xE8gne de Louis XIV (guerre de Trente Ans 1618-1648, de D\xE9volution 1667-1668, de Hollande 1672-1678, de la Ligue d\u2019Augsbourg 1688-1697, de Succession d\u2019Espagne 1701-1713). Les pillages d\xE9truisent les cultures \u2192 manque de nourriture \u2192 maladies et famines.","**Famines** (ou **disettes** = manque de vivres)\u202F: une mauvaise r\xE9colte fait monter le prix du pain (\xD73 ou \xD74)\u202F; les plus pauvres mangent des aliments dangereux \u2192 hausse de la mortalit\xE9.","**Peste**\u202F: elle recule apr\xE8s 1650 mais peut tuer la moiti\xE9 de la population d\u2019une r\xE9gion\u202F; d\u2019autres \xE9pid\xE9mies (variole, dipht\xE9rie, typhus) prennent le relais."]},{type:"retenir",t:"D\xE9mographie d\u2019Ancien R\xE9gime = **natalit\xE9 forte + mortalit\xE9 forte** et des **crises** fr\xE9quentes caus\xE9es par **la guerre, la peste et la famine**."},{type:"check",items:[{q:"Quelles sont les trois causes des crises d\xE9mographiques\u202F?",r:"La guerre, la peste (et les \xE9pid\xE9mies) et la famine (disette)."},{q:"Pourquoi la mortalit\xE9 est-elle plus \xE9lev\xE9e en ville\u202F?",r:"Manque d\u2019hygi\xE8ne, promiscuit\xE9, alimentation carenc\xE9e ou insuffisante."}]}]},{id:"ch1-4",titre:"Contexte\u202F: une \xE9conomie fragile",blocs:[{type:"cards",items:[{t:"Agriculture dominante",d:"Les paysans = \xBE de la population. Aliment de base\u202F: le bl\xE9. Assolement triennal (une sole sur trois en jach\xE8re). Outils en bois, rendements tr\xE8s faibles.",c:"green"},{t:"Industrie peu d\xE9velopp\xE9e",d:"Pas encore d\u2019usines\u202F: des manufactures et des corporations. Le textile est la principale activit\xE9 artisanale depuis le XIIIe si\xE8cle.",c:"blue"},{t:"Transports m\xE9diocres",d:"Lents (4-5 km/h), \xE0 pied, \xE0 dos de mule ou de cheval\u202F; chemins mal entretenus, nombreux p\xE9ages. On utilise fleuves, rivi\xE8res et canaux.",c:"orange"},{t:"Syst\xE8me mon\xE9taire rudimentaire",d:"Pas d\u2019unit\xE9 mon\xE9taire\u202F; troc ou paiement en services\u202F; pas de banques. Crises mon\xE9taires (manque d\u2019or) \u2192 mercantilisme.",c:"purple"}]},{type:"h",t:"Une crise en cha\xEEne"},{type:"schema",kind:"chaine",etapes:["Guerre ou mauvaise r\xE9colte","Crise agricole\u202F: le prix du pain augmente","Le pouvoir d\u2019achat diminue","On ach\xE8te moins de produits manufactur\xE9s","Crise industrielle\u202F: la production chute, ch\xF4mage"]},{type:"p",t:"Le **mercantilisme** consiste \xE0 conqu\xE9rir les march\xE9s ext\xE9rieurs et \xE0 bloquer aux fronti\xE8res l\u2019entr\xE9e des produits \xE9trangers, afin de **faire entrer de l\u2019or** dans le pays et de ne pas en faire sortir."},{type:"retenir",t:"L\u2019\xE9conomie d\u2019Ancien R\xE9gime est **fragile**\u202F: elle repose sur une agriculture peu productive, et toute mauvaise r\xE9colte entra\xEEne une crise g\xE9n\xE9rale."},{type:"check",items:[{q:"Qu\u2019est-ce que l\u2019assolement triennal\u202F?",r:"La r\xE9partition des terres en trois soles, dont une est laiss\xE9e en jach\xE8re (au repos) pour les animaux."},{q:"Qu\u2019est-ce que le mercantilisme\u202F?",r:"Une politique qui conquiert les march\xE9s ext\xE9rieurs et bloque les produits \xE9trangers aux fronti\xE8res pour faire entrer de l\u2019or et \xE9viter qu\u2019il ne sorte."}]}]},{id:"ch1-5",titre:"Contexte\u202F: le monde rural et les villes",blocs:[{type:"h",t:"Le monde rural"},{type:"p",t:"La **seigneurie** est la propri\xE9t\xE9 et la zone de juridiction d\u2019un seigneur. Comme au Moyen \xC2ge, il pr\xE9l\xE8ve des droits sur les terres des paysans\u202F: **cens**, **banalit\xE9s**\u2026"},{type:"p",t:"La **paroisse** est la \xAB\xA0communaut\xE9 des \xE2mes\xA0\xBB o\xF9 exerce un cur\xE9. Il r\xE9unit les habitants dans son \xE9glise pour r\xE9gler des affaires (proc\xE8s, propri\xE9t\xE9s)\u202F; on y c\xE9l\xE8bre les nombreuses f\xEAtes religieuses."},{type:"table",head:["Type de paysan","Situation"],rows:[["Laboureurs propri\xE9taires, gros fermiers","Ils ont des terres, des outils et du b\xE9tail\u202F: les plus ais\xE9s."],["Fermiers g\xE9n\xE9raux","Ils poss\xE8dent des terres qu\u2019ils sous-louent \xE0 des m\xE9tayers."],["Paysans moyens","Au maximum une dizaine d\u2019hectares."],["Manouvriers (journaliers)","Salari\xE9s agricoles pay\xE9s \xE0 la journ\xE9e de travail."],["Errants, mendiants","Sans r\xE9sidence fixe."]]},{type:"h",t:"La bourgeoisie des villes"},{type:"p",t:"Depuis le Moyen \xC2ge, les villes ont d\u2019importants pouvoirs judiciaires, militaires et financiers, que les rois tentent de limiter. On y trouve les **corporations** (guildes de m\xE9tiers), les **officiers du roi** (administration), les avocats, notaires, m\xE9decins\u2026 Les habitants des villes sont appel\xE9s **bourgeois** (habitants du \xAB\xA0bourg\xA0\xBB, par opposition \xE0 la campagne)."},{type:"p",t:"Les bourgeois s\u2019**anoblissent** de plus en plus (**noblesse de robe**)\u202F: ils deviennent officiers du roi (imp\xF4ts, justice), banquiers du roi, grands marchands, propri\xE9taires rentiers."},{type:"check",items:[{q:"Qu\u2019est-ce qu\u2019une seigneurie\u202F?",r:"La propri\xE9t\xE9 et la zone de juridiction d\u2019un seigneur, qui y pr\xE9l\xE8ve des droits sur les paysans (cens, banalit\xE9s\u2026)."},{q:"D\u2019o\xF9 vient le mot \xAB\xA0bourgeois\xA0\xBB\u202F?",r:"Du \xAB\xA0bourg\xA0\xBB\u202F: c\u2019est l\u2019habitant de la ville, par opposition \xE0 la campagne."}]}]},{id:"ch1-6",titre:"Louis XIV et la monarchie absolue",blocs:[{type:"p",t:"Louis XIV organise sa cour \xE0 **Versailles \xE0 partir de 1682**. Versailles est un **instrument de gouvernement**\u202F: la noblesse y vit sous le regard du roi."},{type:"p",t:"Le roi est **sacr\xE9 \xE0 Reims**\u202F: il est consid\xE9r\xE9 comme le **repr\xE9sentant de Dieu sur terre** (droit divin). Il cr\xE9e une sorte de **culte royal**."},{type:"p",t:"La monarchie devient de plus en plus **absolue**\u202F: le roi est le seul \xE0 d\xE9cider et on ne peut aller contre ses d\xE9cisions. Il dit\u202F: \xAB\xA0Nous sommes la t\xEAte d\u2019un corps dont ils (nos sujets) sont les membres\xA0\xBB."},{type:"retenir",t:"Sans \xEAtre une tyrannie ni un r\xE9gime totalitaire, la monarchie absolue repose sur des **fondements autoritaires et arbitraires**\u202F: on peut la relier au concept d\u2019**autoritarisme** (Fiche concept 2)."},{type:"check",items:[{q:"Pourquoi parle-t-on de monarchie \xAB\xA0de droit divin\xA0\xBB\u202F?",r:"Parce que le roi, sacr\xE9 \xE0 Reims, est consid\xE9r\xE9 comme le repr\xE9sentant de Dieu sur terre\u202F: son pouvoir vient de Dieu."},{q:"\xC0 partir de quand Louis XIV installe-t-il sa cour \xE0 Versailles\u202F?",r:"\xC0 partir de 1682."}]}]},{id:"ch1-7",titre:"Une soci\xE9t\xE9 d\u2019ordres",blocs:[{type:"p",t:"Deux **caricatures** de la fin du XVIIIe si\xE8cle montrent un **paysan** (Tiers \xE9tat) \xE9cras\xE9 ou courb\xE9 sous le poids d\u2019un **noble** et d\u2019un **membre du clerg\xE9**. Sur la pierre est \xE9crit\u202F: \xAB\xA0**taille, imp\xF4ts et corv\xE9es**\xA0\xBB\u202F; sous l\u2019autre gravure\u202F: \xAB\xA0**\xE7a n\u2019durera pas toujours**\xA0\xBB."},{type:"p",t:"Une **caricature** exag\xE8re les traits pour **d\xE9noncer** une situation\u202F: ici, l\u2019injustice d\u2019une soci\xE9t\xE9 o\xF9 le Tiers \xE9tat porte seul le poids des imp\xF4ts, et l\u2019espoir d\u2019un changement."},{type:"schema",kind:"pyramideOrdres"},{type:"compare",a:{t:"Privil\xE9gi\xE9s",items:["Le clerg\xE9 (1er ordre)","La noblesse (2e ordre)","Ne paient pas d\u2019imp\xF4ts directs royaux\u2026 mais en per\xE7oivent (d\xEEme, droits seigneuriaux)","Environ 2 \xE0 3\xA0% de la population"]},b:{t:"Non-privil\xE9gi\xE9s",items:["Le Tiers \xE9tat (3e ordre)","Tous ceux qui ne sont ni clercs ni nobles","\xC9cras\xE9s par les taxes (taille, gabelle, d\xEEme, droits seigneuriaux, corv\xE9es)","Environ 97-98\xA0% de la population"]}},{type:"retenir",t:"La soci\xE9t\xE9 d\u2019Ancien R\xE9gime est une **soci\xE9t\xE9 d\u2019ordres**\u202F: elle est **in\xE9galitaire** et **hi\xE9rarchis\xE9e** entre **privil\xE9gi\xE9s** (clerg\xE9, noblesse) et **non-privil\xE9gi\xE9s** (Tiers \xE9tat). Le passage d\u2019un ordre \xE0 l\u2019autre est difficile\u202F: seule une \xE9l\xE9vation vers la noblesse est possible."},{type:"check",items:[{q:"Quels sont les trois ordres de la soci\xE9t\xE9 d\u2019Ancien R\xE9gime\u202F?",r:"Le clerg\xE9, la noblesse et le Tiers \xE9tat."},{q:"Que signifie le titre \xAB\xA0\xE7a n\u2019durera pas toujours\xA0\xBB\u202F?",r:"Que la situation injuste du Tiers \xE9tat ne pourra pas continuer\u202F: il annonce une r\xE9volte ou un changement."}]}]},{id:"ch1-8",titre:"Documents\u202F: le poids des charges",blocs:[{type:"doc",titre:"Doc. 5 \xB7 Cahier de dol\xE9ances de Fleys (Bourgogne), 13 mars 1789",source:"D\u2019apr\xE8s J.-L. Jadoulle, Du XIIIe si\xE8cle \xE0 1918, Namur, 2000",texte:"Environ 110 habitants. Les bois et les meilleures terres et vignes appartiennent au seigneur. Les terres sont charg\xE9es de 5 sols par arpent de cens envers le seigneur\u202F; il est d\xFB au cur\xE9 la 21e gerbe de grains. Les habitants doivent la banalit\xE9 du moulin (la 24e partie), du four (la 21e livre de pain) et du pressoir (la 20e partie du vin). Ils sont tr\xE8s surcharg\xE9s en taille et vingti\xE8mes, les plus grosses propri\xE9t\xE9s appartenant \xE0 des privil\xE9gi\xE9s exempts de taille."},{type:"p",t:"Un **cahier de dol\xE9ances** est un registre dans lequel les habitants d\u2019une paroisse notent leurs **plaintes** et leurs **demandes**, en 1789, avant la r\xE9union des \xC9tats g\xE9n\xE9raux."},{type:"doc",titre:"Doc. 6 \xB7 Budget annuel d\u2019un ouvrier agricole du pays d\u2019Aunis",source:"D\u2019apr\xE8s M. Morineau, Pour une histoire \xE9conomique vraie, Lille, 1985",texte:"D\xE9penses\u202F: pain (3 livres par jour) 54 livres 15 sols\u202F; poissons, ail, oignons, beurre 27 l. 7 s. 6 d.\u202F; boisson 27 l. 7 s. 6 d.\u202F; v\xEAtements 19 l.\u202F; loyer 15 l.\u202F; bois de chauffage 15 l.\u202F; taille, capitation, ustensile et fouage 12 l.\u202F; \u2026 Total\u202F: environ 189 livres 13 sols. Revenus\u202F: 245 journ\xE9es de travail \xE0 15 sols = 183 livres 15 sols (il faut retirer les dimanches, les f\xEAtes, 10 jours de corv\xE9es, les jours de pluie et de maladie)."},{type:"retenir",t:"Les **d\xE9penses** (\u2248 189 livres) **d\xE9passent** les **revenus** (\u2248 184 livres)\u202F: l\u2019ouvrier agricole vit dans la **pr\xE9carit\xE9**. Le **pain** est de loin la premi\xE8re d\xE9pense. Les imp\xF4ts et les corv\xE9es alourdissent encore sa situation."},{type:"table",head:["Charge","Qui la per\xE7oit\u202F?","En quoi consiste-t-elle\u202F?"],rows:[["Taille","Le roi","Imp\xF4t direct pay\xE9 par les non-privil\xE9gi\xE9s (au d\xE9part, taxe seigneuriale en \xE9change de la protection)."],["Gabelle","Le roi","Imp\xF4t sur le sel."],["D\xEEme","L\u2019\xC9glise (le clerg\xE9)","Part des r\xE9coltes (\xE0 Fleys, la 21e gerbe)."],["Cens","Le seigneur","Redevance fixe pay\xE9e pour la terre."],["Banalit\xE9s","Le seigneur","Obligation de payer pour utiliser le moulin, le four, le pressoir du seigneur."],["Corv\xE9es","Le seigneur ou le roi","Journ\xE9es de travail gratuit (ex. r\xE9parer les routes)."]]},{type:"check",items:[{q:"Compare les d\xE9penses et le salaire annuel de l\u2019ouvrier d\u2019Aunis.",r:"Les d\xE9penses (\u2248 189 livres 13 sols) d\xE9passent le salaire (183 livres 15 sols)\u202F: il lui manque environ 6 livres."},{q:"Pourquoi les habitants de Fleys se plaignent-ils de la taille\u202F?",r:"Parce que les plus grosses propri\xE9t\xE9s appartiennent aux privil\xE9gi\xE9s, qui en sont exempt\xE9s\u202F: la taille repose sur les petits propri\xE9taires."}]}]},{id:"ch1-9",titre:"Le clerg\xE9",blocs:[{type:"p",t:"Le **clerg\xE9** est le **premier ordre**. Il assure le **culte catholique**, **assiste les pauvres** et a la responsabilit\xE9 de l\u2019**enseignement** (m\xEAme si la majorit\xE9 des paysans sont illettr\xE9s). L\u2019\xC9glise **pr\xE9l\xE8ve la d\xEEme** et **ne paie pas d\u2019imp\xF4ts**."},{type:"p",t:"La **d\xEEme** est un imp\xF4t pr\xE9lev\xE9 par l\u2019\xC9glise sur les **r\xE9coltes** (une fraction de la r\xE9colte, autour d\u2019un dixi\xE8me au d\xE9part)."},{type:"compare",a:{t:"Clerg\xE9 r\xE9gulier",items:["Vit selon une r\xE8gle (regula), \xE0 l\u2019\xE9cart du monde","Moines, moniales, abb\xE9s","Ordres mendiants, contemplatifs, enseignants"]},b:{t:"Clerg\xE9 s\xE9culier",items:["Vit dans le si\xE8cle, au milieu des fid\xE8les","\xC9v\xEAques (haut clerg\xE9)","Cur\xE9s et vicaires (bas clerg\xE9)"]}},{type:"retenir",t:"Le clerg\xE9 est **divis\xE9**\u202F: le **haut clerg\xE9** (\xE9v\xEAques, abb\xE9s), souvent issu de la noblesse, est riche\u202F; le **bas clerg\xE9** (cur\xE9s, vicaires) est proche du peuple et souvent modeste."},{type:"check",items:[{q:"Quelle est la diff\xE9rence entre clerg\xE9 r\xE9gulier et clerg\xE9 s\xE9culier\u202F?",r:"Le r\xE9gulier vit selon une r\xE8gle, \xE0 l\u2019\xE9cart du monde (moines)\u202F; le s\xE9culier vit parmi les fid\xE8les (\xE9v\xEAques, cur\xE9s)."},{q:"Qu\u2019est-ce que la d\xEEme\u202F?",r:"Un imp\xF4t pr\xE9lev\xE9 par l\u2019\xC9glise sur une partie des r\xE9coltes."}]}]},{id:"ch1-10",titre:"La noblesse",blocs:[{type:"p",t:"Les nobles estiment former une \xAB\xA0race \xE0 part\xA0\xBB qui transmet sa **sup\xE9riorit\xE9 par la naissance**, par le sang. La noblesse a le **droit de porter l\u2019\xE9p\xE9e**\u202F; seul l\u2019**homme** transmet la noblesse."},{type:"compare",a:{t:"Noblesse ancienne = noblesse d\u2019\xE9p\xE9e",items:["Noblesse de naissance, tr\xE8s ancienne","Li\xE9e \xE0 la fonction militaire","Haute noblesse et noblesse de province"]},b:{t:"Noblesse r\xE9cente = noblesse de robe",items:["Bourgeois anoblis (les \xAB\xA0robins\xA0\xBB)","Par l\u2019achat d\u2019une charge (office) judiciaire ou administrative, ou d\u2019une terre noble","Ou anoblis par le roi"]}},{type:"cards",items:[{t:"Noblesse de cour",d:"B\xE9n\xE9ficie de la faveur du roi\u202F; occupe les hautes charges (maison royale, gouvernement, arm\xE9e, \xC9glise). Vit fastueusement \xE0 Versailles ou \xE0 Paris\u202F; ses domaines sont g\xE9r\xE9s par des intendants.",c:"purple"},{t:"Noblesse de province (hobereaux)",d:"Parfois assez pauvre, endett\xE9e par l\u2019entretien de ses domaines, peu instruite. Relations tendues avec les paysans, sur qui elle fait peser des charges.",c:"orange"}]},{type:"retenir",t:"La noblesse est dite \xAB\xA0**ouverte**\xA0\xBB\u202F: un bourgeois peut y entrer. Cela pousse les nobles anciens \xE0 **d\xE9fendre, voire renforcer leurs privil\xE8ges**."},{type:"h",t:"Des frustrations qui cr\xE9ent des tensions"},{type:"list",items:["Un **riche marchand** du Tiers \xE9tat qui ne peut ni acheter un office ni \xEAtre anobli reste priv\xE9 des privil\xE8ges et paie de lourdes taxes.","Un **noble de province** (noblesse d\u2019\xE9p\xE9e) endett\xE9 voit avec jalousie de jeunes **anoblis** (noblesse de robe) accaparer les fonctions aupr\xE8s du roi."]},{type:"check",items:[{q:"Comment acc\xE8de-t-on \xE0 la noblesse\u202F?",r:"Par la naissance (le p\xE8re), par l\u2019achat d\u2019une charge (office) ou d\u2019une terre noble, ou par anoblissement accord\xE9 par le roi."},{q:"Qu\u2019est-ce qu\u2019un hobereau\u202F?",r:"Un noble de province, souvent modeste et endett\xE9."}]}]},{id:"ch1-11",titre:"Le Tiers \xE9tat",blocs:[{type:"p",t:"Tout Fran\xE7ais qui n\u2019est **ni eccl\xE9siastique ni noble** fait partie du **Tiers \xE9tat**, qui regroupe environ **98\xA0% de la population** en 1789. C\u2019est un ordre **tr\xE8s vari\xE9**."},{type:"h",t:"1. Les paysans (\u2248 \xBE de la population)"},{type:"p",t:"Beaucoup sont propri\xE9taires de leur terre\u202F; d\u2019autres sont **fermiers** ou **m\xE9tayers** (ils louent une terre et paient avec une partie de la r\xE9colte). Il reste quelques **serfs**, qui ne peuvent pas quitter la terre sans l\u2019autorisation du seigneur."},{type:"list",items:["la **taille** (imp\xF4t direct royal) et la **gabelle** (imp\xF4t royal sur le sel)\u202F;","la **d\xEEme** des r\xE9coltes (pour l\u2019\xC9glise)\u202F;","les **redevances seigneuriales** et les **banalit\xE9s** (pour le seigneur)."]},{type:"p",t:"\xC0 la fin du XVIIIe si\xE8cle, les seigneurs \xE0 court d\u2019argent **r\xE9tablissent d\u2019anciens droits oubli\xE9s**\u202F: l\u2019hostilit\xE9 des paysans augmente."},{type:"h",t:"2. Les gens des villes\u202F: commer\xE7ants, artisans, ouvriers"},{type:"p",t:"Artisans et commer\xE7ants sont regroup\xE9s en **corporations**\u202F: ces associations de m\xE9tiers ont le **monopole** de la profession. Elles peuvent interdire l\u2019installation d\u2019un concurrent, fixer les prix et les salaires, et imposer des r\xE8glements de fabrication qui **freinent l\u2019initiative** et le d\xE9veloppement de l\u2019industrie et du commerce."},{type:"p",t:"Les **manufactures** cr\xE9\xE9es par **Colbert** (ministre de Louis XIV) paient de bas salaires\u202F; les femmes sont pay\xE9es au tiers du salaire masculin. Les ouvriers travaillent environ **14 heures par jour**\u202F; les r\xE9voltes sont r\xE9prim\xE9es par l\u2019arm\xE9e."},{type:"h",t:"3. La bourgeoisie"},{type:"p",t:"Le d\xE9veloppement du commerce (int\xE9rieur et ext\xE9rieur), des premi\xE8res usines, des m\xE9tiers \xE0 tisser m\xE9caniques, des machines \xE0 vapeur et des mines enrichit la **bourgeoisie**\u202F: banquiers, industriels, armateurs, n\xE9gociants, professions lib\xE9rales (avocats, m\xE9decins)."},{type:"retenir",t:"La bourgeoisie a **de plus en plus d\u2019influence** mais reste dans un \xAB\xA0\xE9tat d\u2019inf\xE9riorit\xE9\xA0\xBB. Elle veut **participer aux affaires de l\u2019\xC9tat**, **abolir les privil\xE8ges**, supprimer les **corporations** et les **douanes int\xE9rieures** qui freinent l\u2019\xE9conomie."},{type:"check",items:[{q:"Quels imp\xF4ts doivent payer les paysans\u202F?",r:"La taille et la gabelle (au roi), la d\xEEme (\xE0 l\u2019\xC9glise), les redevances seigneuriales et les banalit\xE9s (au seigneur)."},{q:"Que reproche la bourgeoisie aux corporations\u202F?",r:"Elles ont le monopole des m\xE9tiers, fixent prix et salaires et freinent l\u2019initiative, donc le d\xE9veloppement \xE9conomique."}]}]}]},{id:"ch2",titre:"Chapitre 2 \xB7 La philosophie des Lumi\xE8res",court:"Lumi\xE8res",intro:"Quelles sont les id\xE9es des philosophes des Lumi\xE8res et comment d\xE9crivent-ils la soci\xE9t\xE9 d\u2019Ancien R\xE9gime\u202F?",sections:[{id:"ch2-0",titre:"Les Lumi\xE8res et l\u2019Encyclop\xE9die",blocs:[{type:"p",t:"La **philosophie des Lumi\xE8res** est un vaste **courant intellectuel europ\xE9en du XVIIIe si\xE8cle**. Notre soci\xE9t\xE9 lui doit une grande partie de ses **principes fondamentaux** (libert\xE9s, s\xE9paration des pouvoirs, \xE9galit\xE9 devant la loi\u2026)."},{type:"p",t:"Le **frontispice** de l\u2019Encyclop\xE9die (gravure de Beno\xEEt-Louis Pr\xE9vost, 1772) repr\xE9sente l\u2019all\xE9gorie de la **Raison** arrachant son voile \xE0 la **V\xE9rit\xE9**, rayonnante de lumi\xE8re. Le **frontispice** est l\u2019illustration plac\xE9e en face de la page de titre d\u2019un livre."},{type:"cards",items:[{t:"L\u2019Encyclop\xE9die",d:"\xAB\xA0Dictionnaire raisonn\xE9 des sciences, des arts et des m\xE9tiers\xA0\xBB.",c:"blue"},{t:"Auteurs",d:"Dirig\xE9e par Denis Diderot et Jean d\u2019Alembert.",c:"green"},{t:"Dates",d:"Publi\xE9e de 1751 \xE0 1772.",c:"orange"},{t:"Objectif",d:"Recenser de fa\xE7on raisonn\xE9e les connaissances de l\u2019\xE9poque et transmettre les id\xE9es des Lumi\xE8res.",c:"purple"}]},{type:"retenir",t:"Les \xAB\xA0Lumi\xE8res\xA0\xBB\u202F: les philosophes veulent **\xE9clairer** les hommes par la **raison** et la **connaissance**, contre l\u2019ignorance, les pr\xE9jug\xE9s et l\u2019arbitraire."},{type:"check",items:[{q:"Qui dirige l\u2019Encyclop\xE9die et quand est-elle publi\xE9e\u202F?",r:"Diderot et d\u2019Alembert, de 1751 \xE0 1772."},{q:"Que repr\xE9sente le frontispice de l\u2019Encyclop\xE9die\u202F?",r:"La Raison qui arrache son voile \xE0 la V\xE9rit\xE9, rayonnante de lumi\xE8re."}]}]},{id:"ch2-1",titre:"Les id\xE9es de quatre philosophes",blocs:[{type:"p",t:"Le tableau du cours compare quatre philosophes \xE0 partir de quatre documents. Retiens pour chacun\u202F: le **probl\xE8me d\xE9nonc\xE9**, la **solution propos\xE9e**, la **valeur d\xE9fendue** et le **th\xE8me**."},{type:"table",head:["Philosophe et \u0153uvre","Probl\xE8me d\xE9nonc\xE9","Solution propos\xE9e","Valeur","Th\xE8me"],rows:[["**Diderot**, article \xAB\xA0Autorit\xE9 politique\xA0\xBB, Encyclop\xE9die (1751)","Le manque de pouvoir du peuple, l\u2019abus de pouvoir, la soumission du peuple","Le consentement du peuple pour gouverner\u202F; limiter le pouvoir royal\u202F; un contrat entre peuple et roi (= Constitution)","Le consentement de la nation (d\xE9mocratie)","Politique"],["**Montesquieu**, *De l\u2019esprit des lois* (1748)","L\u2019abus de pouvoir, l\u2019autorit\xE9 absolue du roi","Un contr\xF4le du pouvoir\u202F; une Constitution qui \xE9tablit la **s\xE9paration des pouvoirs**","D\xE9mocratie, libert\xE9","Politique"],["**Rousseau**, *Du contrat social* (1762)","Les obligations et contraintes impos\xE9es \xE0 la nation soumise\u202F; les int\xE9r\xEAts priv\xE9s dans les affaires publiques","La **volont\xE9 g\xE9n\xE9rale** du peuple tourn\xE9e vers le **bien commun**\u202F; s\xE9paration des pouvoirs","D\xE9mocratie, libert\xE9","Politique"],["**Voltaire**, *Trait\xE9 sur la tol\xE9rance* (1763)","Ob\xE9ir aveugl\xE9ment\u202F; la violence et l\u2019intol\xE9rance envers les autres religions (protestants)\u202F; richesses et in\xE9galit\xE9s","S\u2019aider mutuellement","Tol\xE9rance, paix, acceptation, \xE9galit\xE9","Religion"]]},{type:"doc",titre:"Extraits-cl\xE9s \xE0 reconna\xEEtre",source:"Documents 1 \xE0 4 du cours",texte:"Diderot\u202F: \xAB\xA0La puissance qui vient du consentement des peuples\u2026\xA0\xBB \xB7 Montesquieu\u202F: \xAB\xA0Pour qu\u2019on ne puisse abuser du pouvoir, il faut que [\u2026] le pouvoir arr\xEAte le pouvoir\xA0\xBB\u202F; \xAB\xA0Il y a dans chaque \xC9tat trois sortes de pouvoirs\u2026\xA0\xBB \xB7 Rousseau\u202F: \xAB\xA0L\u2019homme est n\xE9 libre, et partout il est dans les fers\xA0\xBB \xB7 Voltaire\u202F: \xAB\xA0Tu ne nous as point donn\xE9 un c\u0153ur pour nous ha\xEFr, et des mains pour nous \xE9gorger\xA0\xBB."},{type:"schema",kind:"pouvoirs"},{type:"check",items:[{q:"Quelle solution propose Montesquieu contre l\u2019abus de pouvoir\u202F?",r:"La s\xE9paration des pouvoirs (l\xE9gislatif, ex\xE9cutif, judiciaire), inscrite dans une Constitution\u202F: \xAB\xA0le pouvoir arr\xEAte le pouvoir\xA0\xBB."},{q:"Quelle valeur Voltaire d\xE9fend-il dans le Trait\xE9 sur la tol\xE9rance\u202F?",r:"La tol\xE9rance religieuse (et la paix, l\u2019entraide)."}]}]},{id:"ch2-2",titre:"Locke et Smith\u202F: deux inspirations",blocs:[{type:"h",t:"John Locke (mort en 1704)\u202F: les droits naturels"},{type:"p",t:"Pour **Locke**, certains droits s\u2019imposent \xE0 tout \xEAtre humain et ne peuvent \xEAtre remis en question\u202F: les **droits naturels** \u2014 droit \xE0 la **vie**, \xE0 la **libert\xE9**, \xE0 la **s\xFBret\xE9** et \xE0 la **propri\xE9t\xE9**. Ils sont **universels**, **inali\xE9nables** (ni c\xE9d\xE9s, ni vendus, ni transmis, ni enlev\xE9s) et **permanents**. Le pouvoir politique doit \xEAtre **consenti** par les individus."},{type:"h",t:"Adam Smith\u202F: la libert\xE9 \xE9conomique (1776)"},{type:"cards",items:[{t:"La main invisible",d:"La recherche de l\u2019int\xE9r\xEAt personnel contribue involontairement au bien-\xEAtre collectif. Le boulanger fait du pain pour son profit, mais il nourrit la population.",c:"blue"},{t:"L\u2019autor\xE9gulation",d:"Le march\xE9 se r\xE9gule naturellement par la loi de l\u2019offre et de la demande, sans autorit\xE9 qui fixe les prix.",c:"green"},{t:"Le libre-\xE9change",d:"Chaque pays se sp\xE9cialise dans ce qu\u2019il produit moins cher et ach\xE8te le reste \xE0 l\u2019\xE9tranger. Pas de prix fix\xE9s, ni de lourdes taxes, ni de droits de douane.",c:"orange"},{t:"La division du travail",d:"Diviser la production en t\xE2ches augmente la productivit\xE9\u202F: on produit plus, on gagne plus, la richesse se r\xE9pand.",c:"purple"}]},{type:"p",t:"Smith est **contre les corporations**\u202F: il pr\xE9f\xE8re le libre march\xE9, la libre concurrence, l\u2019innovation et la rentabilit\xE9. Pour lui, l\u2019**\xC9tat** doit se limiter \xE0 **trois missions**\u202F: la **d\xE9fense nationale**, la **justice** et les **infrastructures publiques**."},{type:"retenir",t:"Locke inspire le **lib\xE9ralisme politique** (droits naturels, consentement)\u202F; Smith fonde le **lib\xE9ralisme \xE9conomique** (\xAB\xA0laisser faire, laisser passer\xA0\xBB), qui donnera naissance au **capitalisme** (Fiche concept 4)."},{type:"check",items:[{q:"Cite les quatre droits naturels selon Locke.",r:"Le droit \xE0 la vie, \xE0 la libert\xE9, \xE0 la s\xFBret\xE9 et \xE0 la propri\xE9t\xE9."},{q:"Quelles sont les trois missions de l\u2019\xC9tat selon Smith\u202F?",r:"La d\xE9fense nationale, la justice et les infrastructures publiques."}]}]},{id:"ch2-3",titre:"Qui sont les philosophes\u202F?",blocs:[{type:"compare",a:{t:"Points communs",items:["Tous savants","Tous vivants au XVIIIe si\xE8cle (sauf Locke, mort en 1704, source majeure des Lumi\xE8res)","Milieux plut\xF4t ais\xE9s (bourgeoisie majoritaire)"]},b:{t:"Diff\xE9rences",items:["Disciplines vari\xE9es\u202F: philosophie, th\xE9ologie, \xE9conomie, litt\xE9rature\u2026","Nationalit\xE9s diverses\u202F: fran\xE7ais, allemands, \xE9cossais\u2026","Religieux ou non\u202F: religions diff\xE9rentes, voire anti-religieux"]}},{type:"h",t:"Ce qu\u2019ils critiquent dans la soci\xE9t\xE9 du XVIIIe si\xE8cle"},{type:"table",head:["Domaine","Critique"],rows:[["Politique","L\u2019absolutisme et la tyrannie."],["\xC9conomique","L\u2019intervention du pouvoir pour contr\xF4ler l\u2019\xE9conomie (Smith)."],["Social","Les in\xE9galit\xE9s dans la soci\xE9t\xE9 (soci\xE9t\xE9 d\u2019ordres, privil\xE8ges)."],["Moral","L\u2019\xE9go\xEFsme des hommes, leur paresse \xE0 r\xE9fl\xE9chir par eux-m\xEAmes."],["Religieux","L\u2019intol\xE9rance. Voltaire d\xE9fend la tol\xE9rance\u202F; d\u2019autres, comme Diderot, rejettent les monoth\xE9ismes."]]},{type:"retenir",t:"Les Lumi\xE8res ne veulent pas forc\xE9ment **supprimer** les institutions (\xC9tat, religion, ordres) mais **soumettre leur fonctionnement \xE0 l\u2019examen de la raison**."},{type:"check",items:[{q:"Les Lumi\xE8res sont-elles un mouvement uniquement fran\xE7ais\u202F? Justifie.",r:"Non\u202F: les philosophes sont fran\xE7ais, allemands, \xE9cossais\u2026 et les id\xE9es circulent dans toute l\u2019Europe."}]}]},{id:"ch2-4",titre:"Les cinq grandes valeurs des Lumi\xE8res",blocs:[{type:"steps",items:[{t:"1. La raison et l\u2019esprit critique",d:"Inspir\xE9e par les progr\xE8s scientifiques (Newton, Galil\xE9e, Descartes), la raison devient un outil pour comprendre le monde. Kant (1784)\u202F: \xAB\xA0Ose savoir\xA0\xBB\u202F: ose penser par toi-m\xEAme."},{t:"2. La libert\xE9 de conscience et la tol\xE9rance",d:"Chacun peut penser et croire (ou ne pas croire) selon sa raison, sans pers\xE9cution de l\u2019\xC9tat ou de l\u2019\xC9glise. Apr\xE8s les guerres de religion, certains pr\xF4nent le respect des diff\xE9rentes religions."},{t:"3. Les droits naturels et l\u2019\xE9galit\xE9 juridique",d:"Vie, libert\xE9, propri\xE9t\xE9, s\xFBret\xE9 (Locke). Ils combattent la soci\xE9t\xE9 d\u2019ordres et les privil\xE8ges de naissance\u202F: la loi doit \xEAtre la m\xEAme pour tous."},{t:"4. La souverainet\xE9 du peuple et la limitation du pouvoir",d:"Le contrat social (Rousseau)\u202F: le consentement de la population au pouvoir. Montesquieu\u202F: \xAB\xA0le pouvoir arr\xEAte le pouvoir\xA0\xBB."},{t:"5. La libert\xE9 \xE9conomique",d:"Smith\u202F: libre-\xE9change, prix fix\xE9s par l\u2019offre et la demande, sp\xE9cialisation, ouverture des fronti\xE8res, libre concurrence."}]},{type:"retenir",t:"Moyen mn\xE9motechnique\u202F: **R-T-E-S-L** \u2192 **R**aison, **T**ol\xE9rance, **\xC9**galit\xE9 (droits naturels), **S**ouverainet\xE9 du peuple, **L**ibert\xE9 \xE9conomique."},{type:"check",items:[{q:"Que signifie la devise de Kant \xAB\xA0Ose savoir\xA0\xBB\u202F?",r:"Ose penser par toi-m\xEAme, utilise ta raison sans te laisser guider par d\u2019autres (autorit\xE9s, pr\xE9jug\xE9s)."},{q:"Quelle valeur des Lumi\xE8res s\u2019oppose directement \xE0 la soci\xE9t\xE9 d\u2019ordres\u202F?",r:"L\u2019\xE9galit\xE9 juridique (droits naturels)\u202F: la m\xEAme loi pour tous, sans privil\xE8ges de naissance."}]}]},{id:"ch2-5",titre:"Les limites des Lumi\xE8res",blocs:[{type:"p",t:"Les philosophes d\xE9fendent des notions qui, dans leur application, se limitent souvent \xE0 une **sph\xE8re exclusive**\u202F: celle de l\u2019**homme blanc**, bourgeois ou aristocrate, d\u2019**Occident**."},{type:"compare",a:{t:"La question de l\u2019esclavage",items:["Certains critiquent l\u2019esclavage (Montesquieu, Diderot)","D\u2019autres \xE9crits sont impr\xE9gn\xE9s de pr\xE9jug\xE9s racistes (Voltaire)","Une partie de la bourgeoisie profite du commerce triangulaire et des colonies","Esclavage aboli en France en 1794, r\xE9tabli par Napol\xE9on en 1802, d\xE9finitivement aboli en 1848"]},b:{t:"La place des femmes",items:["Rousseau\u202F: la femme doit \xEAtre subordonn\xE9e \xE0 l\u2019homme, \xE9duqu\xE9e pour plaire, confin\xE9e \xE0 la sph\xE8re domestique","La D\xE9claration des droits de l\u2019homme et du citoyen (1789) exclut de fait les femmes des droits politiques et du vote","Olympe de Gouges r\xE9dige la D\xE9claration des droits de la femme et de la citoyenne (1791)","Elle est guillotin\xE9e en 1793"]}},{type:"retenir",t:"Les id\xE9aux de **libert\xE9** et d\u2019**\xE9galit\xE9** des Lumi\xE8res ne sont **pas appliqu\xE9s \xE0 tous**\u202F: esclaves et femmes en sont exclus."},{type:"check",items:[{q:"Donne les trois dates de l\u2019histoire de l\u2019abolition de l\u2019esclavage en France.",r:"1794 (abolition), 1802 (r\xE9tablissement par Napol\xE9on), 1848 (abolition d\xE9finitive)."},{q:"Qui est Olympe de Gouges\u202F?",r:"L\u2019autrice de la D\xE9claration des droits de la femme et de la citoyenne (1791), guillotin\xE9e en 1793."}]}]},{id:"ch2-6",titre:"Diffusion et r\xE9ception des id\xE9es",blocs:[{type:"h",t:"Comment les id\xE9es se r\xE9pandent-elles\u202F?"},{type:"cards",items:[{t:"L\u2019imprim\xE9",d:"Livres, pamphlets (textes courts et violents attaquant les institutions), journaux, revues, l\u2019Encyclop\xE9die.",c:"blue"},{t:"Les lieux de sociabilit\xE9",d:"Salons mondains (ex. le salon de Madame Geoffrin, 1755), soci\xE9t\xE9s savantes, th\xE9\xE2tres, caf\xE9s.",c:"green"},{t:"Une circulation europ\xE9enne",d:"Angleterre, \xC9cosse, \xC9tats allemands, Suisse, Italie\u2026 Certains souverains s\u2019entourent de philosophes (Catherine II de Russie et Diderot).",c:"orange"}]},{type:"h",t:"Ces id\xE9es sont-elles accept\xE9es\u202F?"},{type:"list",items:["Elles touchent **assez peu** la majorit\xE9 de la population (paysans, petits artisans).","Elles **ne sont pas accept\xE9es par les dirigeants** politiques et religieux\u202F: elles vont contre l\u2019ordre \xE9tabli.","Les livres sont **censur\xE9s**\u202F; des philosophes sont **emprisonn\xE9s** ou **exil\xE9s**. L\u2019Encyclop\xE9die est interdite par le pouvoir royal\u202F; Diderot se plaint d\u2019avoir subi \xAB\xA0toutes les pers\xE9cutions\xA0\xBB (lettre \xE0 Catherine II)."]},{type:"retenir",t:"Les id\xE9es des Lumi\xE8res sont un **facteur de r\xE9volution**\u202F: elles contestent l\u2019ordre \xE9tabli (absolutisme, privil\xE8ges) et pr\xE9parent 1789."},{type:"check",items:[{q:"Pourquoi l\u2019Encyclop\xE9die peut-elle menacer les autorit\xE9s\u202F?",r:"Parce qu\u2019elle diffuse des id\xE9es qui critiquent l\u2019absolutisme, l\u2019intol\xE9rance religieuse et les privil\xE8ges, et invite chacun \xE0 juger par sa raison."},{q:"Cite deux lieux de sociabilit\xE9 o\xF9 circulent les id\xE9es.",r:"Les salons, les caf\xE9s, les soci\xE9t\xE9s savantes, les th\xE9\xE2tres."}]}]},{id:"ch2-7",titre:"M\xE9thode\u202F: la synth\xE8se historique (C3)",blocs:[{type:"p",t:"\xC0 partir du tableau des philosophes, le cours demande une **synth\xE8se historique** (comp\xE9tence 3). Voici les \xE9l\xE9ments obligatoires\u202F:"},{type:"steps",items:[{t:"1. Un titre",d:"Avec 3 informations\u202F: le sujet, la date, le lieu. Ex.\u202F: \xAB\xA0Les id\xE9es des philosophes des Lumi\xE8res en Europe au XVIIIe si\xE8cle\xA0\xBB."},{t:"2. Une introduction",d:"a) Une mise en contexte. b) Une question de recherche. c) L\u2019annonce de la structure du d\xE9veloppement."},{t:"3. Un d\xE9veloppement",d:"Des paragraphes reli\xE9s par des connecteurs logiques. Chaque paragraphe = un \xE9l\xE9ment de r\xE9ponse, soutenu par des preuves tir\xE9es des documents."},{t:"4. Une conclusion",d:"Elle reprend les points essentiels en les reformulant et r\xE9pond plus directement \xE0 la question de d\xE9part."}]},{type:"retenir",t:"Une synth\xE8se n\u2019est **pas une succession de r\xE9sum\xE9s** de documents\u202F: elle **compare et confronte** les informations et les **r\xE9organise en paragraphes** qui r\xE9pondent \xE0 la question."}]},{id:"ch2-8",titre:"Le concept de lib\xE9ralisme (lien avec le chapitre)",blocs:[{type:"p",t:"Le **lib\xE9ralisme** est une doctrine qui d\xE9fend la **libert\xE9** dans trois domaines. Les Lumi\xE8res en posent les bases."},{type:"table",head:["Domaine","Comment d\xE9fendre la libert\xE9\u202F?","Philosophe li\xE9"],rows:[["Vie priv\xE9e","Libert\xE9 de conscience, de religion, d\u2019opinion\u202F; tol\xE9rance\u202F; droits naturels (vie, s\xFBret\xE9, propri\xE9t\xE9).","Voltaire, Locke"],["Vie politique","Consentement du peuple, Constitution, s\xE9paration des pouvoirs, souverainet\xE9 du peuple.","Diderot, Montesquieu, Rousseau"],["Vie \xE9conomique","Libre-\xE9change, libre concurrence, prix fix\xE9s par l\u2019offre et la demande, fin des corporations.","Smith"]]},{type:"retenir",t:"Ce tableau te permet d\u2019**appliquer le concept de lib\xE9ralisme** aux id\xE9es des Lumi\xE8res."}]}]},{id:"concepts",titre:"Les 7 fiches concept",court:"Concepts",intro:"Un concept est une id\xE9e g\xE9n\xE9rale qui permet de comprendre et de comparer des situations historiques diff\xE9rentes. Pour chacun\u202F: l\u2019\xE9tymologie, la d\xE9finition, les attributs (crit\xE8res) et des exemples.",sections:[{id:"c1",titre:"Concept 1 \xB7 Stratification sociale",blocs:[{type:"p",t:"**D\xE9finition**\u202F: d\xE9coupage de la soci\xE9t\xE9 en cat\xE9gories (strates) sociales, c\u2019est-\xE0-dire en groupes de personnes **distincts** les uns des autres et **hi\xE9rarchis\xE9s**."},{type:"schema",kind:"conceptMap",centre:"Stratification sociale",noeuds:["Groupes distincts","Hi\xE9rarchie","In\xE9galit\xE9s\u202F: richesse, pouvoir, prestige, culture, profession","Statut libre / non libre","\xC9ducation","Droits et devoirs"]},{type:"h",t:"Attributs (crit\xE8res \xE0 v\xE9rifier)"},{type:"list",items:["La soci\xE9t\xE9 est **d\xE9coup\xE9e en groupes** distincts.","Ces groupes sont **hi\xE9rarchis\xE9s**.","La hi\xE9rarchie repose sur des **in\xE9galit\xE9s** (richesses, pouvoir, prestige, culture, profession).","Les groupes se distinguent par le **statut**, la **profession**, l\u2019**\xE9ducation**, les **droits et devoirs**."]},{type:"h",t:"Exemples"},{type:"list",items:["La soci\xE9t\xE9 m\xE9di\xE9vale (ceux qui prient, combattent, travaillent).","La soci\xE9t\xE9 d\u2019ordres d\u2019Ancien R\xE9gime (clerg\xE9, noblesse, Tiers \xE9tat).","La soci\xE9t\xE9 de classes industrielle (bourgeoisie, prol\xE9tariat)."]}]},{id:"c2",titre:"Concept 2 \xB7 D\xE9mocratie et autoritarisme",blocs:[{type:"compare",a:{t:"D\xE9mocratie",items:["Du grec d\xEAmos (\xAB\xA0peuple\xA0\xBB) et kratos (\xAB\xA0pouvoir, autorit\xE9\xA0\xBB)","R\xE9gime dans lequel le pouvoir est d\xE9tenu ou contr\xF4l\xE9 par le peuple, sans distinction de naissance, de richesse ou de comp\xE9tence","\xAB\xA0Le pouvoir aux mains du peuple, pour le peuple\xA0\xBB"]},b:{t:"Autoritarisme",items:["Du latin auctoritas (\xAB\xA0autorit\xE9\xA0\xBB)","Tendance d\u2019une personne \xE0 abuser de son autorit\xE9, \xE0 l\u2019exercer avec rigueur, \xE0 l\u2019imposer","Caract\xE8re autoritaire, arbitraire d\u2019un r\xE9gime qui veut imposer \xE0 la soci\xE9t\xE9 la toute-puissance de l\u2019\xC9tat"]}},{type:"compare",a:{t:"Crit\xE8res de la d\xE9mocratie",items:["\xC9lections","Droit de vote","Libert\xE9","\xC9galit\xE9","S\xE9paration des pouvoirs","Acc\xE8s \xE0 la connaissance des lois"]},b:{t:"Crit\xE8res de l\u2019autoritarisme",items:["Une seule personne (ou un groupe) au pouvoir","Pas de s\xE9paration des pouvoirs","R\xE9gime fort, impos\xE9 \xE0 tous","Conditionnement des esprits","Utilisation de la force et de la violence","Texte fondateur qui d\xE9finit le syst\xE8me et limite les libert\xE9s"]}},{type:"retenir",t:"Pour d\xE9cider si un r\xE9gime est d\xE9mocratique ou autoritaire, **v\xE9rifie les crit\xE8res un par un** avec des preuves. La monarchie absolue de Louis XIV pr\xE9sente plusieurs crit\xE8res de l\u2019autoritarisme (un seul homme, pas de s\xE9paration des pouvoirs, r\xE9gime impos\xE9)."}]},{id:"c2b",titre:"Les syst\xE8mes politiques",blocs:[{type:"p",t:"Un **syst\xE8me politique** est un mode d\u2019organisation d\u2019un \xC9tat\u202F: il comprend le r\xE9gime politique, la structure \xE9conomique, l\u2019organisation sociale\u2026 Les principaux sont la d\xE9mocratie, l\u2019autoritarisme et le totalitarisme."},{type:"table",head:["Syst\xE8me","D\xE9finition"],rows:[["D\xE9mocratie","Le pouvoir est d\xE9tenu ou contr\xF4l\xE9 par le peuple."],["Autoritarisme","Caract\xE8re autoritaire, arbitraire d\u2019un r\xE9gime ou d\u2019un pouvoir politique."],["Totalitarisme","R\xE9gime \xE0 parti unique, sans opposition organis\xE9e, dans lequel l\u2019\xC9tat tend \xE0 confisquer la totalit\xE9 des activit\xE9s de la soci\xE9t\xE9."],["Dictature","R\xE9gime arbitraire o\xF9 tous les pouvoirs sont concentr\xE9s entre les mains d\u2019un seul homme\u202F: le dictateur."],["Oligarchie","La plupart des pouvoirs sont entre les mains d\u2019un petit nombre d\u2019individus."],["Monarchie","Le pouvoir est d\xE9tenu par un seul chef\u202F: le monarque ou souverain."],["Ploutocratie","Le pouvoir est exerc\xE9 par les plus riches."]]},{type:"p",t:"Chaque ann\xE9e, l\u2019ONG am\xE9ricaine **Freedom House** classe les \xC9tats du monde du plus d\xE9mocratique au moins d\xE9mocratique (droits politiques, libert\xE9s civiles, pluralisme, ind\xE9pendance de la justice\u2026)."}]},{id:"c3",titre:"Concept 3 \xB7 Nationalisme",blocs:[{type:"p",t:"\xAB\xA0Le patriotisme, c\u2019est l\u2019amour des siens. Le nationalisme, c\u2019est la haine des autres\xA0\xBB (Romain Gary)."},{type:"p",t:"**Origine**\u202F: absent pendant l\u2019Antiquit\xE9 et le Moyen \xC2ge, le concept appara\xEEt au **XVIIIe si\xE8cle** (*nationalist* attest\xE9 en anglais en **1715**). D\u2019abord \xAB\xA0conscience nationale\xA0\xBB, il d\xE9signe vers **1848** la volont\xE9 d\u2019**ind\xE9pendance** des peuples\u202F; apr\xE8s **1870**, il devient **conservateur** et d\xE9fensif\u202F; apr\xE8s les deux guerres mondiales, il prend un sens **p\xE9joratif**."},{type:"p",t:"**D\xE9finition**\u202F: doctrine politique qui met en avant la **volont\xE9 d\u2019appartenir \xE0 un \xAB\xA0\xC9tat-nation\xA0\xBB**, exalte l\u2019**unit\xE9** d\u2019une communaut\xE9 ayant des caract\xE9ristiques vues comme intangibles (langue, culture, histoire, religion, traditions), veut **unir** ces communaut\xE9s dans un \xC9tat commun ou **d\xE9fendre** une nation per\xE7ue comme **menac\xE9e** par des \xE9trangers."},{type:"schema",kind:"conceptMap",centre:"Nationalisme",noeuds:["Volont\xE9 d\u2019appartenance \xE0 un \xC9tat-nation","Exaltation de l\u2019unit\xE9 d\u2019une communaut\xE9","D\xE9fense d\u2019une nation vue comme menac\xE9e","Formes diverses\u202F: lib\xE9ral, conservateur, imp\xE9rialiste, raciste, x\xE9nophobe"]},{type:"table",head:["Attribut","Exemples"],rows:[["Volont\xE9 d\u2019appartenance \xE0 un \xC9tat-nation","Risorgimento italien, unification allemande"],["Union de communaut\xE9s sous un m\xEAme \xC9tat","Soul\xE8vements en Europe au XIXe s., ind\xE9pendances d\u2019Am\xE9rique du Sud"],["Exaltation de l\u2019unit\xE9","Chants patriotiques, iconographie de propagande"],["D\xE9fense d\u2019une nation vue comme menac\xE9e","Nationalisme flamand (VNV, VB), FN en France, rexisme en Wallonie, pangermanisme"],["Formes diverses","Lib\xE9ral (patriotisme), conservateur (Chine/Tibet, Russie/Tch\xE9tch\xE9nie), imp\xE9rialiste, raciste et x\xE9nophobe (nazisme)"]]},{type:"p",t:"Exemple\u202F: en **1942**, aux \xC9tats-Unis, **120 000** personnes d\u2019ascendance japonaise, en majorit\xE9 des citoyens am\xE9ricains, sont intern\xE9es dans des camps et priv\xE9es de libert\xE9 pendant la guerre."}]},{id:"c4",titre:"Concept 4 \xB7 Lib\xE9ralisme / capitalisme",blocs:[{type:"p",t:"**Origine**\u202F: du latin *liberalis* (\xAB\xA0g\xE9n\xE9reux, noble\xA0\xBB). Les premi\xE8res id\xE9es lib\xE9rales apparaissent avec l\u2019**Habeas Corpus (1679)** et le **Bill of Rights (1689)**, deux textes anglais. Le mot \xAB\xA0lib\xE9ralisme\xA0\xBB appara\xEEt en France en **1818** (Maine de Biran) et entre au dictionnaire en 1823."},{type:"p",t:"**D\xE9finition**\u202F: doctrine politique, s\u2019appuyant sur les id\xE9es des **philosophes des Lumi\xE8res**, qui pr\xF4ne la **libert\xE9 individuelle** dans diff\xE9rents domaines (\xE9conomique, social\u2026) et s\u2019oppose \xE0 l\u2019id\xE9e d\u2019un **\xC9tat central fort**. Le **lib\xE9ralisme \xE9conomique** (\xAB\xA0**Laisser faire, laisser passer**\xA0\xBB) a donn\xE9 naissance au **capitalisme**."},{type:"schema",kind:"conceptMap",centre:"Lib\xE9ralisme
