<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire encyclopédique 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette Breeze (KDE Plasma) : fenêtre, vue, en-tête, texte, accent */
  --bg:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --text:#232629; --muted:#5d6468;
  --border:#c4c9cd; --btn:#f7f8f8; --accent:#3daee9; --accent-ink:#1b7cb5; --accent-soft:rgba(61,174,233,.15);
  --pos:#27ae60; --pos-soft:rgba(39,174,96,.13); --neg:#da4453; --neg-soft:rgba(218,68,83,.11); --warn:#f67400; --warn-soft:rgba(246,116,0,.12);
  --seg-a:rgba(61,174,233,.22); --seg-b:rgba(246,116,0,.20);
  --font:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Noto Sans Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --r:4px;
  color-scheme:light;
  /* Mise en page : barre d'outils + panneau latéral + vue de contenu, comme une application KDE */
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7;
  --border:#4a5056; --btn:#31363b; --accent:#3daee9; --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2);
  --pos:#2ecc71; --pos-soft:rgba(46,204,113,.16); --neg:#ed5565; --neg-soft:rgba(237,85,101,.16); --warn:#f67400; --warn-soft:rgba(246,116,0,.18);
  --seg-a:rgba(61,174,233,.3); --seg-b:rgba(246,116,0,.28); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7;
  --border:#4a5056; --btn:#31363b; --accent:#3daee9; --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2);
  --pos:#2ecc71; --pos-soft:rgba(46,204,113,.16); --neg:#ed5565; --neg-soft:rgba(237,85,101,.16); --warn:#f67400; --warn-soft:rgba(246,116,0,.18);
  --seg-a:rgba(61,174,233,.3); --seg-b:rgba(246,116,0,.28); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.6rem;font-weight:600}
h2{font-size:1.15rem;font-weight:600;margin:1.6rem 0 .6rem}
h3{font-size:1rem;font-weight:600;margin:1rem 0 .4rem}
p{margin:.4rem 0}
.muted,.muted-t{color:var(--muted);fill:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1}
.measure{max-width:68ch}
.center{text-align:center}
.mono{font-family:var(--mono)}
kbd{font:600 .72rem var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 .3rem;margin-left:.35rem;background:var(--view);color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- coquille ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.toolbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--header);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand-bg{fill:var(--accent)} .brand-ln{stroke:#fff;stroke-width:1.6;stroke-linecap:round}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select{background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:4px 8px;min-height:32px}
select:hover{border-color:var(--accent)}
.cb{display:flex;align-items:center;gap:5px;font-size:.88rem;color:var(--muted)}
.cb input{accent-color:var(--accent)}
.body{display:grid;grid-template-columns:200px 1fr;min-height:0}
.side{background:var(--bg);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;text-align:left}
.navitem:hover{background:var(--accent-soft)}
.navitem.on{background:var(--accent-soft);border-color:var(--accent)}
.ico{flex:none}
.main{background:var(--view);overflow:auto;min-height:0}
.page{padding:22px 28px 48px;max-width:1080px}
.page.narrow{max-width:800px}
.page-head{margin-bottom:14px}
.lead{color:var(--muted);max-width:70ch;margin-top:.4rem}
.h-sub{font-size:.95rem;font-weight:600;margin:1.2rem 0 .5rem;color:var(--muted)}
.empty{padding:2rem 0;color:var(--muted)}
section{margin-bottom:6px}

/* ---------- éléments communs ---------- */
.panel{border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;background:var(--view);margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:6px 13px;min-height:34px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:rgba(61,174,233,.28)}
.btn.danger{border-color:var(--neg);background:var(--neg-soft)}
.btn.wide{width:100%;justify-content:center;padding:10px}
.btn.icon-only{padding:4px 6px;min-height:28px;vertical-align:middle}
.linkbtn{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;border:1px solid var(--border);border-radius:20px;padding:1px 9px;white-space:nowrap;background:var(--view)}
.chip.niv{font-variant-numeric:tabular-nums;color:var(--muted)}
.count-chip{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:.78rem;border-radius:3px;padding:0 6px;margin-left:6px}
.tag.ok{background:var(--pos-soft);color:var(--text)} .tag.ko{background:var(--neg-soft);color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.big{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.big .small{font-size:1rem;color:var(--muted)}
.today{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.today.panel{margin-top:4px}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 3px 3px 0}

/* mots décomposés : signalement des éléments de formation */
.segword{white-space:nowrap}
.seg{border-radius:2px;padding:0 1px}
.seg.a{background:var(--seg-a);box-shadow:inset 0 -2px 0 var(--accent)}
.seg.b{background:var(--seg-b);box-shadow:inset 0 -2px 0 var(--warn)}
.seg.hi{outline:2px solid var(--text);outline-offset:1px}
.rootchips{display:flex;flex-wrap:wrap;gap:6px}
.rootchip{font-size:.88rem;border-radius:3px;padding:2px 8px}
.rootchip.a{background:var(--seg-a)} .rootchip.b{background:var(--seg-b)}

/* fiche mot */
.detail-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.word-big{font-size:1.5rem;font-weight:600;margin:.2rem 0}
.facts{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:8px 0 0}
.facts dt{color:var(--muted);font-size:.88rem;padding-top:2px}
.facts dd{margin:0}
.ex{font-style:italic}
.lure{font-weight:600}
.detail.compact .facts{grid-template-columns:120px 1fr}

/* ---------- accueil ---------- */
.facts3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.fact{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fact b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.fact span{color:var(--muted);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--view);cursor:pointer}
.step:hover{border-color:var(--accent);background:var(--accent-soft)}
.step span{color:var(--muted);font-size:.9rem}
.adult ul{padding-left:1.2rem;margin:.3rem 0} .adult li{margin:.3rem 0;max-width:80ch}
.refs li{font-size:.88rem}

/* ---------- explorer ---------- */
.explorer{display:grid;grid-template-columns:270px 1fr;min-height:100%}
.reslist{border-right:1px solid var(--border);padding:12px 8px;background:var(--bg)}
.resgroup{margin-bottom:10px}
.search{padding:0 4px 10px}
.search input{width:100%;border:1px solid var(--border);border-radius:3px;padding:6px 9px;background:var(--view)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.resgroup-t{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:4px 8px}
.resitem{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:6px 8px 6px 24px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;font-size:.92rem}
.resitem:hover{background:var(--accent-soft)}
.resitem.on{background:var(--accent-soft);border-color:var(--accent)}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.crumbs{margin-bottom:6px}
.figure{margin:12px 0}
.figure figcaption{font-size:.85rem;margin-top:4px}
.schema{width:100%;height:auto;display:block;max-height:340px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--view);cursor:pointer}
.wcard:hover{border-color:var(--accent)}
.wcard.on{border-color:var(--accent);background:var(--accent-soft)}
.wcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard-d{color:var(--muted);font-size:.88rem}

/* SVG */
.svlbl{fill:var(--text);font-family:var(--font)}
.svlbl.muted{fill:var(--muted)}
.svlbl.strong{font-weight:600}
.svlbl.link{fill:var(--accent-ink);cursor:pointer;text-decoration:underline;text-decoration-thickness:1px}
.svlbl.link:hover{font-weight:600}
.svlbl.on{font-weight:700;fill:var(--text);text-decoration:none}
.svlbl:focus-visible{outline:none;font-weight:700}
.sv-fill{fill:var(--accent-soft)}
.sv-stroke{fill:none;stroke:var(--text);stroke-width:1.5}
.sv-stroke1{fill:none;stroke:var(--muted);stroke-width:1.2}
.sv-stroke2{fill:none;stroke:var(--text);stroke-width:1.6}
.sv-faint{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.55}
.sv-dash{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:5 4}
.sv-strong{stroke:var(--text);stroke-width:2.2}
.sv-line{stroke:var(--muted);stroke-width:.9}
.sv-dot{fill:var(--text)}
.sv-accent{fill:none;stroke:var(--accent);stroke-width:2.2}
.sv-accent2{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.sv-accent3{fill:none;stroke:var(--accent);stroke-width:2.6}
.sv-accent3.dashed{stroke-dasharray:6 4;stroke-width:2}
.sv-accentdot{fill:var(--accent)}
.sv-arrowhead{fill:var(--accent)}
.sv-cyto{fill:var(--pos-soft)}
.sv-membrane{fill:none;stroke:var(--pos);stroke-width:3}
.sv-nucleus{fill:rgba(155,89,182,.28);stroke:#8e44ad;stroke-width:1.5}
.sv-chloro{fill:rgba(39,174,96,.55);stroke:var(--pos);stroke-width:1}
.sv-box{fill:var(--view);stroke:var(--border);stroke-width:1.2}
.sv-particle{fill:var(--accent);opacity:.8}
.sv-zoombox{fill:none;stroke:var(--text);stroke-width:1;stroke-dasharray:3 3}
.band.b1{fill:rgba(218,68,83,.14)} .band.b2{fill:rgba(218,68,83,.26)} .band.b3{fill:rgba(218,68,83,.40)} .band.b4{fill:rgba(218,68,83,.56)}
.warbar{fill:var(--text);opacity:.75} .warbar.light{opacity:.4}

/* ---------- flashcards ---------- */
.seg-ctl{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.seg-ctl button{border:none;background:var(--btn);padding:7px 14px;cursor:pointer;border-right:1px solid var(--border)}
.seg-ctl button:last-child{border-right:none}
.seg-ctl button.on{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:6px 0 14px;flex-basis:100%}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.flashcard{border:1px solid var(--border);border-radius:6px;padding:28px 26px;min-height:260px;background:var(--view);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.flashcard:hover{border-color:var(--accent)}
.flashcard.flipped{cursor:default}
.fc-front{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.fc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.fc-front .fc-meta{justify-content:center}
.fc-word{font-size:2rem;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.fc-def{font-size:1.25rem;max-width:46ch}
.fc-q{color:var(--muted)}
.fc-title{font-size:1.4rem}
.fc-sep{border-top:1px dashed var(--border);margin:6px 0}
.fc-back{animation:fade .2s ease-out}
.fc-back .fc-word{justify-content:flex-start}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fc-actions .wide{grid-column:1/-1}
.rate{flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;text-align:left}
.rate span{font-size:.8rem;color:var(--muted)}
.rate.r0{border-left:4px solid var(--neg)} .rate.r1{border-left:4px solid var(--warn)} .rate.r2{border-left:4px solid var(--pos)}
.boxbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.bx{height:100%}
.bx0{background:var(--border)} .bx1{background:var(--neg)} .bx2{background:var(--warn)} .bx3{background:#fdbc4b} .bx4{background:#8fd18f} .bx5{background:var(--pos)}
.boxlegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.82rem;color:var(--muted)}
.boxlegend b{color:var(--text);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.done{border-color:var(--pos);background:var(--pos-soft)}

/* ---------- exercices ---------- */
.levels{display:flex;flex-direction:column;gap:8px}
.level{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;background:var(--view);cursor:pointer}
.level:hover{border-color:var(--accent);background:var(--accent-soft)}
.lv-n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.lv-body{display:flex;flex-direction:column;gap:3px;flex:1}
.lv-top{display:flex;gap:8px;align-items:center}
.lv-d{font-size:.9rem;color:var(--muted);max-width:75ch}
.lv-stat{font-size:.8rem}
.lv-badge{font-variant-numeric:tabular-nums;font-weight:600;border:1px solid var(--border);border-radius:3px;padding:2px 8px}
.lv-badge.ok{border-color:var(--pos);background:var(--pos-soft)}
.ex-title{margin-bottom:6px}
.ex-prog{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px}
.q-t{font-size:1.08rem;margin:.6rem 0}
.qword{font-size:1.15rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);border-radius:3px;padding:9px 12px;background:var(--btn);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.optk{flex:none;width:22px;height:22px;border-radius:3px;border:1px solid var(--border);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--view)}
.opt.good{border-color:var(--pos);background:var(--pos-soft)}
.opt.bad{border-color:var(--neg);background:var(--neg-soft)}
.opt.dim{opacity:.55}
.opt.jnsp{color:var(--muted)}
.opt.jnsp.sel{opacity:1;border-color:var(--muted)}
.corr{margin-top:14px;border:1px solid var(--border);border-left-width:4px;border-radius:3px;padding:10px 14px}
.corr.ok{border-left-color:var(--pos);background:var(--pos-soft)}
.corr.ko{border-left-color:var(--neg);background:var(--neg-soft)}
.corr.mid{border-left-color:var(--warn);background:var(--warn-soft)}
.corr-mark{font-weight:700;margin-right:6px}
.corr-detail{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);background:var(--view);margin:8px -14px -10px;padding:12px 14px;border-radius:0 0 3px 0}
.mini{border-top:1px solid var(--border);padding:6px 0}
.mini summary{cursor:pointer}
.match{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{text-align:left;border:1px solid var(--border);border-radius:3px;padding:8px 11px;background:var(--btn);cursor:pointer;min-height:44px;transition:background .15s}
.mitem.word{font-weight:600}
.mitem:hover:not(:disabled){border-color:var(--accent)}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.mitem.good{border-color:var(--pos);background:var(--pos-soft);cursor:default}
.mitem.bad{border-color:var(--neg);background:var(--neg-soft)}
.def-box{font-size:1.15rem;border:1px solid var(--border);border-radius:3px;padding:12px 14px;background:var(--bg)}
.hint{color:var(--text);background:var(--accent-soft);border-radius:3px;padding:6px 10px;font-size:.95rem}
.recall{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.recall input{flex:1;min-width:200px;border:1px solid var(--border);border-radius:3px;padding:7px 10px;background:var(--view);font-size:1.05rem}
.recall input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.worked{padding-left:1.3rem} .worked li{margin:.45rem 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--border);border-radius:3px;margin:8px 0 14px}
.chipbtn{border:1px solid var(--border);border-radius:20px;padding:4px 12px;background:var(--btn);cursor:pointer}
.chipbtn:hover:not(:disabled){border-color:var(--accent)}
.chipbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.chipbtn.used{opacity:.45}
.cloze{font-size:1.08rem;line-height:2.3;max-width:70ch}
.blank{display:inline;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:3px 3px 0 0;padding:1px 8px;cursor:pointer;min-width:90px;font-weight:600}
.blank.sel{box-shadow:0 0 0 2px var(--accent)}
.blank.good{background:var(--pos-soft);border-bottom-color:var(--pos)}
.blank.bad{background:var(--neg-soft);border-bottom-color:var(--neg)}
.fix{font-weight:400;color:var(--pos)}
.nowrap{white-space:nowrap}
.cl-item{border-top:1px solid var(--border);padding:6px 0}
.cl-item p{margin:.15rem 0}
textarea{width:100%;border:1px solid var(--border);border-radius:3px;padding:8px 10px;background:var(--view);resize:vertical;margin-bottom:8px}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.lbl{display:block;font-weight:600;margin:10px 0 4px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--accent)}

/* ---------- progression ---------- */
.prow{padding:8px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.table-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;max-width:640px}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:6px 10px;text-align:left}
.tbl th{font-weight:600;color:var(--muted);font-size:.88rem}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.warnbox{border-color:var(--neg);background:var(--neg-soft)}

/* ---------- petits écrans ---------- */
@media (max-width:900px){
  .explorer{grid-template-columns:1fr}
  .reslist{border-right:none;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .resgroup{display:flex;gap:4px;margin:0;flex:none}
  .resgroup-t{display:none}
  .resgroup-t.sr-keep{display:flex;flex:none}
  .search{padding:0;flex:none;width:170px}
  .resitem{white-space:nowrap;padding:5px 10px;border-color:var(--border);width:auto}
  .steps{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .figure{overflow-x:auto}
  .schema{min-width:560px;max-height:none}
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px}
  .navitem{flex:none;padding:6px 10px}
  .page{padding:16px 16px 40px}
  .facts3{grid-template-columns:1fr}
  .facts,.detail.compact .facts{grid-template-columns:1fr}
  .facts dt{padding-top:6px}
  .match{grid-template-columns:1fr 1.4fr;gap:8px}
  .opts.two{grid-template-columns:1fr}
  .fc-actions{grid-template-columns:1fr}
  .brand span{font-size:.95rem}
}
@media (max-width:420px){ .steps{grid-template-columns:1fr} .match{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* [mot, réseau, niveau, définition, exemple, formation "seg|seg:clé,clé" , piège, explication du piège] */
const RAW = [
["cité","h-anti","6e","Communauté de citoyens qui se gouvernent eux-mêmes, formée d'une ville et de son territoire.","Athènes et Sparte sont deux cités grecques rivales.","","Ensemble d'immeubles construits en banlieue","c'est le sens moderne de « cité » (un quartier d'habitat)."],
["citoyen","h-anti","6e","Membre d'une cité qui a le droit de participer aux décisions politiques.","À Athènes, seuls les hommes libres nés de parents athéniens sont citoyens.","","Habitant d'une grande ville","c'est un citadin : habiter en ville ne donne pas de droits politiques."],
["démocratie","h-anti","6e","Régime politique dans lequel le pouvoir appartient aux citoyens.","Au Ve siècle av. J.-C., Athènes est une démocratie.","démo|cratie:demo,cratie","Science qui étudie les populations","c'est la démographie, qui a la même racine démo- (le peuple)."],
["polythéisme","h-anti","6e","Croyance en plusieurs dieux.","Les Grecs pratiquent le polythéisme : ils honorent Athéna, Poséidon ou Héra.","poly|thé|isme:poly,theo,-","Étude des figures à plusieurs côtés","confusion avec poly- de « polygone » : ici, -thé- veut dire « dieu »."],
["monothéisme","h-anti","6e","Croyance en un dieu unique.","Le judaïsme, le christianisme et l'islam sont des monothéismes.","mono|thé|isme:mono,theo,-","Discours prononcé par une seule personne","c'est un monologue : même préfixe mono-, mais -logue veut dire « parole »."],
["oracle","h-anti","6e","Réponse d'un dieu à une question, transmise par un prêtre ou une prêtresse.","À Delphes, les Grecs viennent consulter l'oracle.","","Personne qui parle très bien en public","c'est un orateur : les deux mots se ressemblent à l'oral."],
["tyran","h-anti","6e","Dans la Grèce antique, homme qui prend seul le pouvoir, souvent par la force.","Pisistrate fut tyran d'Athènes au VIe siècle av. J.-C.","","Pièce qui sert à tirer ou à tendre quelque chose","c'est un tirant, un mot qui se prononce presque pareil."],
["république","h-anti","6e","Régime politique où le pouvoir n'est pas héréditaire et où les dirigeants sont choisis pour un temps limité.","Rome est une république de 509 à 27 av. J.-C.","","Réponse vive à une critique","c'est une réplique : le début du mot est le même."],
["sénat","h-anti","6e","À Rome, assemblée d'anciens magistrats qui dirige la politique de la République.","Le sénat romain décide de la guerre et contrôle les finances.","","Établissement où l'on soigne des malades","c'est un sanatorium : seule la sonorité est proche."],
["empire","h-anti","6e","État très vaste, formé de nombreux peuples et territoires, dirigé par un empereur.","En 27 av. J.-C., Auguste devient le premier empereur de Rome.","","Fait de devenir plus grave","c'est le verbe « empirer », qui n'a rien à voir avec l'empereur."],
["légion","h-anti","6e","Unité de l'armée romaine composée d'environ 5 000 soldats.","Les légions défendent les frontières de l'Empire romain.","","Plante cultivée pour être mangée","c'est un légume : les deux mots commencent par « lég- »."],
["archonte","h-anti","6e","Haut magistrat qui gouverne la cité d'Athènes.","À l'époque classique, les archontes d'Athènes sont tirés au sort.","","Vase grec à deux anses","piège cité par Alain Lieury : un mot rare se confond avec un objet du même thème (le vase, c'est l'amphore)."],

["seigneur","h-ma","5e","Homme qui possède une seigneurie et exerce son pouvoir sur les paysans qui y vivent.","Le seigneur rend la justice et lève des taxes sur ses terres.","","Personne âgée","le mot vient du latin senior (« plus âgé »), mais au Moyen Âge il désigne le maître d'une terre."],
["vassal","h-ma","5e","Seigneur qui a juré fidélité à un seigneur plus puissant, en échange d'une terre.","Lors de l'hommage, le vassal s'agenouille devant son suzerain.","","Ensemble des plats et des assiettes","c'est la vaisselle : seule la sonorité est proche."],
["suzerain","h-ma","5e","Seigneur qui reçoit l'hommage d'un vassal et lui confie un fief.","Le roi est le suzerain des grands seigneurs du royaume.","","Qui exerce l'autorité suprême dans un État","c'est un souverain : les deux mots se ressemblent."],
["fief","h-ma","5e","Terre confiée par un suzerain à son vassal en échange de sa fidélité.","Le chevalier reçoit un fief pour vivre et s'équiper.","","Personne en qui l'on peut avoir confiance","c'est une personne fiable ou fidèle : même début, sens différent."],
["serf","h-ma","5e","Paysan non libre, attaché à la terre de son seigneur.","Le serf ne peut pas quitter la seigneurie sans autorisation.","","Grand animal de la forêt qui porte des bois","c'est le cerf, son homophone : même prononciation, autre orthographe."],
["corvée","h-ma","5e","Travail gratuit que les paysans doivent au seigneur.","Plusieurs jours par an, les paysans font la corvée sur les terres du seigneur.","","Petit navire de guerre","c'est une corvette : les deux mots se ressemblent."],
["dîme","h-ma","5e","Impôt versé à l'Église, environ un dixième des récoltes.","Le curé prélève la dîme sur le blé des paysans.","","Jour de repos de la semaine","c'est le dimanche : même début, sans lien de sens."],
["monastère","h-ma","5e","Lieu où vivent des moines ou des moniales, à l'écart du monde, pour prier et travailler.","L'abbaye de Cluny, fondée en 910, est un grand monastère.","mona|stère:mono,-","Personne qui gouverne seule un royaume","c'est un monarque : même racine mono- (« seul »), mais pas le même sens."],
["croisade","h-ma","5e","Expédition militaire de chrétiens d'Occident pour prendre Jérusalem et les lieux saints.","La première croisade part en 1096.","","Endroit où deux routes se coupent","c'est un croisement : même radical « crois- »."],
["hégire","h-ma","5e","Départ de Mahomet de La Mecque vers Médine en 622 ; c'est le début du calendrier musulman.","L'an 1 de l'hégire correspond à l'année 622 de notre calendrier.","","Domination d'un pays sur les autres","c'est l'hégémonie : les deux mots commencent de la même façon."],
["chrétienté","h-ma","5e","Ensemble des pays et des peuples chrétiens.","Au Moyen Âge, le pape veut guider toute la chrétienté.","","Cérémonie qui fait entrer dans l'Église","c'est le baptême : même thème religieux, mot différent."],

["monarchie absolue","h-rev","4e","Régime où le roi détient tous les pouvoirs, qu'il dit tenir de Dieu.","Louis XIV incarne la monarchie absolue.","mon|archie| absolue:mono,archie,-","Régime dirigé par un petit groupe de riches","c'est l'oligarchie : -archie veut bien dire « pouvoir », mais mon- veut dire « un seul »."],
["Lumières","h-rev","4e","Mouvement d'idées du XVIIIe siècle qui défend la raison, la liberté et la tolérance.","Voltaire et Montesquieu sont des philosophes des Lumières.","","Fête religieuse où l'on allume des bougies","c'est le sens courant de « lumière » ; en histoire, le mot désigne un mouvement d'idées."],
["tiers état","h-rev","4e","Dans la France d'Ancien Régime, tous ceux qui n'appartiennent ni au clergé ni à la noblesse.","Le tiers état représente plus de 95 % de la population en 1789.","","Le tiers des habitants d'un pays","lecture mathématique de « tiers » : ici, tiers veut dire « troisième ordre »."],
["privilège","h-rev","4e","Droit particulier réservé à certains groupes, comme la noblesse et le clergé.","Les nobles ont le privilège de ne pas payer la taille.","","Ce qui passe en premier","c'est une priorité : les deux mots commencent par « pri- »."],
["cahier de doléances","h-rev","4e","Registre où les Français écrivent leurs plaintes et leurs souhaits en 1789.","Dans les cahiers de doléances, les paysans réclament la fin des droits seigneuriaux.","","Registre de messages après un décès","ce sont des condoléances : les deux mots se terminent pareil."],
["souveraineté nationale","h-rev","4e","Principe selon lequel le pouvoir appartient à la nation, c'est-à-dire à l'ensemble des citoyens.","La Déclaration des droits de l'homme et du citoyen affirme la souveraineté nationale.","","Pouvoir du roi sur la nation","c'est l'inverse : en 1789, la souveraineté passe du roi à la nation."],
["constitution","h-rev","4e","Texte qui fixe l'organisation des pouvoirs d'un État et les droits des citoyens.","En 1791, la France se dote de sa première constitution écrite.","","Résistance physique d'une personne","c'est un autre sens du mot (« avoir une solide constitution »)."],
["régicide","h-rev","4e","Meurtre d'un roi ; aussi la personne qui le commet.","L'exécution de Louis XVI en 1793 est un régicide.","régi|cide:reg,cide","Produit qui tue les insectes","piège cité par Alain Lieury : c'est un insecticide, qui a le même suffixe -cide (« qui tue »)."],
["abolition","h-rev","4e","Suppression officielle d'une loi, d'un droit ou d'une pratique.","L'abolition définitive de l'esclavage dans les colonies françaises date de 1848.","","Punition sévère d'une faute","abolir, ce n'est pas punir : c'est supprimer."],
["suffrage universel","h-rev","4e","Droit de vote accordé à tous les citoyens adultes.","Le suffrage universel masculin est établi en 1848 ; les femmes votent pour la première fois en 1945.","suffrage |uni|versel:-,uni,-","Souffrance partagée par tout le monde","seule la sonorité de « suffrage » rappelle « souffrance »."],

["industrialisation","h-xix","4e","Développement des usines et de la production en grande quantité grâce aux machines.","L'industrialisation transforme l'Europe au XIXe siècle.","","Qualité d'une personne qui travaille avec ardeur","c'est être industrieux, un adjectif ancien de la même famille."],
["machine à vapeur","h-xix","4e","Machine qui transforme l'énergie de la vapeur d'eau chauffée en mouvement.","La machine à vapeur fait fonctionner les locomotives et les usines.","","Appareil qui produit de la vapeur pour repasser le linge","c'est un objet du quotidien ; en histoire, la machine à vapeur produit du mouvement."],
["prolétaire","h-xix","4e","Ouvrier qui ne possède que sa force de travail et vit de son salaire.","Au XIXe siècle, beaucoup de prolétaires travaillent plus de 12 heures par jour.","","Personne qui parle trop longuement","c'est être prolixe : même début « pro- »."],
["syndicat","h-xix","4e","Association de travailleurs qui défend leurs intérêts.","En 1884, une loi autorise les syndicats en France.","syn|dicat:syn,-","Ensemble des signes d'une maladie","c'est un syndrome : même préfixe syn- (« ensemble »)."],
["colonie","h-xix","4e","Territoire dominé et exploité par un État étranger.","L'Algérie devient une colonie française à partir de 1830.","","Groupe d'enfants partis en vacances ensemble","c'est un autre sens courant du mot (« partir en colonie »)."],
["colonisation","h-xix","4e","Conquête et domination d'un territoire et de sa population par un État étranger.","La colonisation de l'Afrique s'accélère à la fin du XIXe siècle.","","Construction de colonnes de pierre","c'est un faux rapprochement avec « colonne »."],

["guerre totale","h-xx","3e","Guerre qui mobilise toutes les forces d'un pays : soldats, civils, économie et propagande.","La Première Guerre mondiale devient une guerre totale.","","Guerre qui touche tous les pays du monde","« totale » ne veut pas dire « mondiale » : c'est toute la société qui est mobilisée."],
["tranchée","h-xx","3e","Long fossé creusé pour protéger les soldats des tirs ennemis.","De 1915 à 1918, les soldats vivent dans les tranchées.","","Morceau coupé dans un pain","c'est une tranche : même radical, autre sens."],
["armistice","h-xx","3e","Accord qui arrête les combats entre des armées.","L'armistice du 11 novembre 1918 met fin aux combats.","","Ensemble des armes d'un pays","c'est l'armement : même début « arm- »."],
["génocide","h-xx","3e","Extermination volontaire et organisée d'un peuple ou d'un groupe humain.","Les nazis commettent le génocide des Juifs et des Tsiganes.","géno|cide:geno,cide","Science de l'hérédité","c'est la génétique, qui partage la racine gén- (« naissance, race »)."],

["propagande","h-xx","3e","Ensemble des moyens utilisés par un pouvoir pour imposer ses idées à la population.","Les affiches de propagande glorifient le chef.","","Promenade à pied","c'est une promenade : seule la sonorité est proche."],
["déportation","h-xx","3e","Transfert forcé de personnes vers des camps, loin de chez elles.","Des dizaines de milliers de Juifs et de résistants de France sont victimes de la déportation.","","Départ d'un bateau qui quitte le port","faux rapprochement avec « port »."],

["décolonisation","h-xx","3e","Processus par lequel les colonies obtiennent leur indépendance.","La décolonisation de l'Afrique a lieu surtout dans les années 1950 et 1960.","dé|colonisation:de,-","Départ en vacances des enfants d'une colonie","faux rapprochement avec la « colonie de vacances »."],

["équateur","g-rep","CM","Ligne imaginaire qui partage la Terre en deux moitiés, à égale distance des deux pôles.","Les pays situés près de l'équateur ont un climat chaud toute l'année.","équa|teur:equi,-","Pays d'Amérique du Sud","c'est l'Équateur, un pays traversé par cette ligne et nommé d'après elle."],
["hémisphère","g-rep","CM","Chacune des deux moitiés de la Terre, séparées par l'équateur.","La France est située dans l'hémisphère Nord.","hémi|sphère:hemi,sphere","Boule de verre décorative","c'est une sphère : le mot ne dit pas « moitié »."],
["pôle","g-rep","CM","Chacun des deux points extrêmes de l'axe autour duquel tourne la Terre.","Il fait très froid près des pôles.","","Pièce de bois plantée dans le sol","c'est un poteau : seule la sonorité est proche."],
["planisphère","g-rep","CM","Carte qui représente toute la surface de la Terre à plat.","Sur le planisphère, les océans occupent la plus grande place.","plani|sphère:plani,sphere","Planète entourée d'anneaux","faux rapprochement avec « planète » : plani- veut dire « plat »."],
["échelle","g-rep","CM","Rapport entre une distance mesurée sur la carte et la distance réelle.","À l'échelle 1/100 000, 1 cm sur la carte représente 1 km.","","Objet à barreaux pour monter","c'est le sens courant ; en géographie, l'échelle est un rapport de distances."],
["légende","g-rep","CM","Encadré qui explique les couleurs et les symboles d'une carte.","Lis la légende avant d'interpréter la carte.","","Récit merveilleux transmis par la tradition","c'est un autre sens du mot, en français."],
["relief","g-rep","CM","Ensemble des formes de la surface terrestre : montagnes, plaines, plateaux, vallées.","Le relief des Alpes est très élevé.","","Ce qui reste à la fin d'un repas","sens ancien (« les reliefs du repas »)."],
["latitude","g-rep","6e","Position d'un lieu au nord ou au sud de l'équateur, mesurée en degrés.","Paris est situé à environ 49° de latitude nord.","","Liberté d'agir comme on le souhaite","autre sens du mot (« avoir toute latitude »)."],

{r:"h-xx",t:"Pendant la Première Guerre mondiale, les soldats vivent dans les {tranchées#tranchée}. Les combats prennent fin avec l'{armistice} du 11 novembre 1918. Pendant la Seconde Guerre mondiale, les nazis commettent le {génocide} des Juifs et des Tsiganes, tandis qu'en France des hommes et des femmes entrent dans la {Résistance#résistance}.",x:["collaboration","armement"]},
{r:"g-rep",t:"L'{équateur} partage la Terre en deux {hémisphères#hémisphère}. Pour situer un lieu au nord ou au sud de cette ligne, on donne sa {latitude}. Pour le situer à l'est ou à l'ouest, on donne sa {longitude}.",x:["tropique","longueur"]},
{r:"g-ville",t:"Aujourd'hui, plus de la moitié de l'humanité vit en ville : c'est l'effet de l'{urbanisation}. Les villes de plus de 10 millions d'habitants sont des {mégapoles#mégapole}. Autour des villes, la {périurbanisation} transforme les campagnes en lotissements.",x:["bidonvilles","mégalopoles"]},
{r:"g-monde",t:"Les marchandises voyagent dans des {conteneurs#conteneur} sur d'immenses navires. Ces {flux} relient les grands ports d'une même {façade maritime} au reste du monde. Cette mise en relation de toutes les parties du globe s'appelle la {mondialisation}.",x:["conteurs","délocalisation"]},
{r:"s-cell",t:"Tous les êtres vivants sont formés de {cellules#cellule}. Chacune est entourée d'une {membrane} et contient un {noyau}. Dans les feuilles, la {chlorophylle} capte la lumière.",x:["chlore","fossiles"]},
{r:"s-corps",t:"Dans l'intestin grêle, les aliments transformés par la {digestion} deviennent des {nutriments#nutriment}. Ceux-ci passent dans le sang, qui part du cœur vers les organes par les {artères#artère} et revient au cœur par les {veines#veine}.",x:["alvéoles","artistes"]},
{r:"s-eco",t:"Une mare est un {écosystème}. Les algues, {producteurs primaires#producteur primaire}, fabriquent leur matière grâce à la lumière. Les larves de libellule sont {carnivores#carnivore} : elles mangent d'autres animaux. Quand les êtres vivants meurent, les {décomposeurs#décomposeur} transforment leurs restes en matière minérale.",x:["herbivores","compositeurs"]},
{r:"s-gen",t:"Le noyau de la plupart de nos cellules contient 46 {chromosomes#chromosome}, formés d'{ADN}. Un {gène} peut exister en plusieurs versions, appelées {allèles#allèle}.",x:["allées","gêne"]},
{r:"p-mat",t:"Quand on chauffe un glaçon, il fond : c'est la {fusion}. Si l'on continue à chauffer, l'eau bout et devient gazeuse : c'est la {vaporisation}. Sur une vitre froide, la vapeur d'eau redevient liquide : c'est la {condensation}.",x:["solidification","dissolution"]},
{r:"p-ener",t:"Dans un {circuit en série}, les {dipôles#dipôle} forment une seule boucle. Les fils sont en cuivre, un bon {conducteur}, entouré de plastique, un {isolant}.",x:["solvant","tension électrique"]},
{r:"m-geo",t:"Un {quadrilatère} a quatre côtés. Si ses côtés opposés sont parallèles deux à deux, c'est un {parallélogramme}. Dans un triangle rectangle, le côté opposé à l'angle droit est l'{hypoténuse}. La longueur du contour d'une figure est son {périmètre}.",x:["aire","hypothèse"]},
{r:"m-num",t:"Dans la fraction 3/8, le {numérateur} est 3 et le {dénominateur} est 8. Quand on divise 42 par 6, on obtient un {quotient} égal à 7. Le nombre 7 n'a que deux diviseurs, 1 et lui-même : c'est un {nombre premier}.",x:["quotidien","multiple"]},
{r:"f-rec",t:"Celui qui raconte l'histoire est le {narrateur}. Au milieu du récit, une tempête surprend les héros : c'est une {péripétie}. À la fin, au moment du {dénouement}, ils rentrent enfin chez eux.",x:["auteur","strophe"]},
{r:"f-lex",t:"« Débuter » et « commencer » sont des {synonymes#synonyme}. « Grand » et « petit » sont des {antonymes#antonyme}. Dans « terrestre », on reconnaît le {radical} « terr- », suivi du {suffixe} « -estre ».",x:["préfixe","homonymes"]},
{r:"f-arg",t:"L'auteur défend une {thèse} : la lecture rend libre. Il l'appuie sur plusieurs {arguments#argument}. Il fait d'abord une {concession} (« Certes, lire demande du temps… »), puis il passe à la {réfutation} de l'idée adverse.",x:["réputation","objets"]},
{r:"e-rep",t:"En France, la Constitution organise la {séparation des pouvoirs}. Le Parlement exerce le {pouvoir législatif}. Le gouvernement exerce le {pouvoir exécutif}, et les juges exercent le {pouvoir judiciaire}.",x:["laïcité","référendum"]},
{r:"t-sys",t:"Un portail automatique utilise un {capteur} de présence. Le programme suit un {algorithme} : si une voiture est détectée, le moteur, qui est l'{actionneur}, ouvre le portail. Avant la fabrication en série, on teste un {prototype}.",x:["actionnaire","rythme"]}
];
