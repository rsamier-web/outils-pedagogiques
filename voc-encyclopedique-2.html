["changement global", "g-risk", "5e", "Ensemble des transformations de la planète causées par l'homme : climat, biodiversité, sols, océans.", "La disparition des espèces fait partie du changement global.", "", "", ""],
["effet de serre", "g-risk", "6e", "Phénomène naturel par lequel certains gaz de l'atmosphère retiennent une partie de la chaleur émise par la Terre.", "Sans effet de serre, la température moyenne de la Terre serait d'environ −18 °C.", "", "Pollution qui détruit la couche d'ozone", "c'est un autre problème : le trou de la couche d'ozone."],
["risque industriel", "g-risk", "5e", "Risque d'accident grave dans une usine (explosion, incendie, fuite de produits toxiques).", "L'explosion de l'usine AZF à Toulouse, en 2001, illustre le risque industriel.", "", "", ""],
["risque sanitaire", "g-risk", "5e", "Risque qui menace la santé d'une population (épidémie, pollution).", "Une épidémie de grippe est un risque sanitaire.", "", "", ""],
["liberté", "e-dem", "6e", "Possibilité d'agir et de penser comme on le veut, dans le respect des lois et des autres.", "La liberté d'expression permet à chacun de donner son opinion.", "", "", ""],
["élection", "e-dem", "6e", "Choix, par un vote, des personnes qui exerceront une fonction.", "L'élection des délégués de classe a lieu en début d'année.", "", "Choix d'un chef par tirage au sort", "l'élection passe par un vote."],
["vote", "e-dem", "6e", "Fait d'exprimer son choix, par exemple en glissant un bulletin dans une urne.", "En France, le vote est secret.", "", "", ""],
["délégué", "e-dem", "6e", "Élève élu par sa classe pour porter sa parole auprès des adultes du collège.", "Le délégué transmet les questions de la classe au conseil de classe.", "", "", ""],
["intérêt général", "e-dem", "6e", "Ce qui est bon pour l'ensemble de la société, au-delà des intérêts de chacun.", "Construire une école sert l'intérêt général.", "", "Intérêt du groupe le plus nombreux", "l'intérêt général vise le bien de tous, pas celui d'un groupe, même majoritaire."],
["règle", "e-dem", "6e", "Ce qu'il faut faire ou ne pas faire dans un groupe pour bien vivre ensemble.", "Le règlement intérieur fixe les règles du collège.", "", "", ""],
["loi", "e-dem", "6e", "Règle votée par le Parlement, qui s'applique à tous.", "La loi interdit de discriminer une personne.", "", "", ""],
["droit", "e-dem", "6e", "Ce que la loi permet à chacun de faire ou d'obtenir.", "Tout enfant a le droit d'aller à l'école.", "", "Ce que la loi oblige chacun à faire", "c'est un devoir."],
["devoir", "e-dem", "6e", "Ce que la loi ou la morale oblige chacun à faire.", "Respecter les autres est un devoir.", "", "Travail à faire à la maison", "c'est un autre sens du mot."],
["responsabilité", "e-dem", "6e", "Obligation de répondre de ses actes et d'en assumer les conséquences.", "Chacun a une part de responsabilité dans la protection de l'environnement.", "", "", ""],
["environnement", "e-dem", "6e", "Ensemble des éléments naturels et humains qui entourent un être vivant ou une société.", "Trier ses déchets contribue à protéger l'environnement.", "", "", ""],
["égalité", "e-ega", "5e", "Principe selon lequel toutes les personnes ont les mêmes droits et sont soumises aux mêmes lois.", "L'égalité devant la loi est un principe de la République.", "", "Fait d'être tous identiques", "être égaux en droits ne veut pas dire être pareils."],
["égalité femmes-hommes", "e-ega", "5e", "Principe selon lequel les femmes et les hommes ont les mêmes droits et doivent être traités de la même manière.", "À travail égal, l'égalité femmes-hommes impose un salaire égal.", "", "", ""],
["racisme", "e-ega", "5e", "Idée fausse selon laquelle il existerait des « races » humaines supérieures à d'autres ; comportement hostile qui en découle.", "Le racisme est puni par la loi.", "", "", ""],
["antisémitisme", "e-ega", "5e", "Hostilité ou haine envers les juifs.", "L'antisémitisme a conduit au génocide des Juifs pendant la Seconde Guerre mondiale.", "anti|sémitisme:anti,-", "", ""],
["xénophobie", "e-ega", "5e", "Hostilité envers les étrangers.", "Refuser un logement à quelqu'un parce qu'il est étranger est un acte de xénophobie.", "xéno|phobie:xeno,phobe", "Goût pour les voyages à l'étranger", "-phobie veut dire « crainte, rejet »."],
["homophobie", "e-ega", "5e", "Hostilité envers les personnes homosexuelles.", "Les insultes homophobes sont punies par la loi.", "homo|phobie:homo,phobe", "", ""],
["stéréotype", "e-ega", "5e", "Idée toute faite et simplificatrice sur un groupe de personnes.", "« Les filles sont moins bonnes en maths » est un stéréotype.", "stéréo|type:stereo,typ", "", ""],
["harcèlement", "e-ega", "5e", "Violences répétées (moqueries, insultes, menaces), en face à face ou en ligne, qui font souffrir une personne.", "Le harcèlement scolaire est puni par la loi.", "", "Dispute ponctuelle entre deux élèves", "le harcèlement se caractérise par la répétition."],
["solidarité", "e-ega", "5e", "Fait de s'entraider et de se sentir responsables les uns des autres.", "La Sécurité sociale repose sur la solidarité entre les citoyens.", "", "", ""],
["engagement", "e-ega", "5e", "Fait de s'impliquer volontairement au service d'une cause ou des autres.", "Être bénévole dans une association est une forme d'engagement.", "", "", ""],
["Préhistoire", "h-prehist", "6e", "Très longue période de l'histoire humaine qui précède l'invention de l'écriture.", "Les premiers outils de pierre taillée datent de la Préhistoire.", "Pré|histoire:pre,-", "Histoire des premiers rois", "la Préhistoire s'arrête justement quand apparaît l'écriture, avant les premiers rois connus par des textes."],
["hominidé", "h-prehist", "6e", "Membre de la famille des grands singes à laquelle appartient l'espèce humaine.", "Les hominidés fossiles découverts en Afrique aident à comprendre l'origine de l'humanité.", "", "", ""],
["Homo sapiens", "h-prehist", "6e", "Espèce humaine actuelle, apparue en Afrique il y a environ 300 000 ans.", "Homo sapiens a peuplé tous les continents au fil de longues migrations.", "", "", ""],
["paléolithique", "h-prehist", "6e", "Première période de la Préhistoire, celle de la pierre taillée, où les humains vivent de chasse, de pêche et de cueillette.", "Les peintures de la grotte Chauvet datent du paléolithique.", "paléo|lith|ique:paleo,lith,-", "Période où l'on polit la pierre et où l'on cultive la terre", "c'est le néolithique : néo- veut dire « nouveau », paléo- « ancien »."],
["néolithique", "h-prehist", "6e", "Période de la Préhistoire, commencée il y a environ 12 000 ans au Proche-Orient, où les humains se mettent à cultiver la terre et à élever des animaux.", "Au néolithique, les premiers villages apparaissent près des champs.", "néo|lith|ique:neo,lith,-", "Période des premiers outils de pierre taillée", "c'est le paléolithique : paléo- veut dire « ancien »."],
["chasseur-cueilleur", "h-prehist", "6e", "Humain qui se nourrit de la chasse, de la pêche et de la cueillette de plantes sauvages, sans cultiver la terre.", "Pendant le paléolithique, tous les humains sont des chasseurs-cueilleurs.", "", "Agriculteur qui chasse pendant l'hiver", "un chasseur-cueilleur ne cultive pas : il prélève ce que la nature offre."],
["agriculture", "h-prehist", "6e", "Culture de la terre pour produire des végétaux utiles à l'homme.", "L'agriculture apparaît au néolithique au Proche-Orient.", "agri|culture:agri,-", "Fait de nourrir et d'élever des animaux", "c'est l'élevage ; l'agriculture concerne la culture des plantes."],
["élevage", "h-prehist", "6e", "Fait de nourrir des animaux et de les faire se reproduire pour en tirer des produits (viande, lait, laine).", "Au néolithique, l'élevage des moutons et des chèvres se développe.", "", "", ""],
["domestication", "h-prehist", "6e", "Transformation, sur de nombreuses générations, d'une espèce sauvage en espèce adaptée à la vie avec l'homme.", "La domestication du loup a donné le chien.", "", "Dressage d'un animal pour un spectacle", "le dressage concerne un seul animal ; la domestication transforme toute une espèce au fil des générations."],
["art pariétal", "h-prehist", "6e", "Peintures et gravures réalisées par les humains de la Préhistoire sur les parois des grottes.", "Les chevaux et les aurochs de la grotte de Lascaux sont des chefs-d'œuvre de l'art pariétal.", "", "Art des peintres de Paris", "pariétal vient du latin paries, « paroi », et n'a rien à voir avec Paris."],
["migration", "h-prehist", "6e", "Déplacement d'une population d'une région à une autre pour s'y installer.", "Les migrations d'Homo sapiens l'ont conduit d'Afrique jusqu'en Amérique.", "", "Voyage touristique de courte durée", "une migration est un déplacement pour s'installer ailleurs, pas un séjour."],
["archéologie", "h-prehist", "6e", "Science qui étudie les sociétés du passé à partir des traces matérielles qu'elles ont laissées.", "L'archéologie a permis de retrouver les restes de villages néolithiques.", "archéo|logie:archeo,logie", "Science des roches et du sous-sol", "c'est la géologie : géo- veut dire « terre »."],
["fouille", "h-prehist", "6e", "Recherche méthodique de vestiges en creusant le sol couche par couche.", "Les archéologues mènent une fouille sur le site d'un ancien village.", "", "", ""],
["État", "h-prehist", "6e", "Organisation politique qui gouverne un territoire et sa population, avec des lois, des impôts et une administration.", "Les premiers États apparaissent en Mésopotamie et en Égypte vers 3000 av. J.-C.", "", "Situation, manière d'être (« en bon état »)", "avec une majuscule, l'État est une organisation politique ; avec une minuscule, l'état est une situation."],
["pharaon", "h-prehist", "6e", "Roi de l'Égypte antique, considéré comme un dieu vivant.", "Le pharaon Khéops fit construire la plus grande pyramide de Gizeh.", "", "Grand prêtre d'un temple égyptien", "le pharaon est le roi ; il dirige aussi le culte, mais ce n'est pas un simple prêtre."],
["fonctionnaire", "h-prehist", "6e", "Personne employée par l'État pour faire fonctionner l'administration.", "En Égypte, les scribes sont des fonctionnaires du pharaon.", "", "", ""],
["scribe", "h-prehist", "6e", "Dans l'Antiquité, fonctionnaire qui sait lire, écrire et compter, chargé de tenir les registres.", "Le scribe note les récoltes et calcule les impôts.", "", "", ""],
["cunéiforme", "h-prehist", "6e", "Écriture inventée en Mésopotamie vers 3300 av. J.-C., faite de signes en forme de clous gravés dans l'argile.", "Les tablettes en écriture cunéiforme conservent des lois et des comptes.", "", "Écriture égyptienne faite de petits dessins", "ce sont les hiéroglyphes."],
["hiéroglyphe", "h-prehist", "6e", "Signe de l'écriture sacrée des anciens Égyptiens, souvent en forme de petit dessin.", "Champollion a déchiffré les hiéroglyphes en 1822.", "hiéro|glyphe:hiero,glyphe", "Signe en forme de clou gravé dans l'argile", "c'est l'écriture cunéiforme de Mésopotamie."],
["Mésopotamie", "h-prehist", "6e", "Région située entre le Tigre et l'Euphrate (l'Irak actuel), où naissent les premières villes et l'écriture.", "Les premières cités-États apparaissent en Mésopotamie.", "Méso|potamie:meso,potam", "Région du delta du Nil", "c'est l'Égypte ; Mésopotamie veut dire « entre les fleuves »."],
["Antiquité", "h-prehist", "6e", "Période de l'histoire qui va de l'invention de l'écriture (vers 3300 av. J.-C.) à la chute de l'empire romain d'Occident (476).", "Athènes et Rome sont deux grandes cités de l'Antiquité.", "", "Objet ancien qui a de la valeur", "c'est une antiquité au sens courant ; la période historique prend une majuscule."],
["millénaire", "h-prehist", "6e", "Période de mille ans.", "Le IIIe millénaire av. J.-C. voit naître les premiers États.", "", "", ""],
["siècle", "h-prehist", "CM", "Période de cent ans.", "Le Ve siècle av. J.-C. est l'âge d'or d'Athènes.", "", "", ""],
["mythe", "h-croy", "6e", "Récit fabuleux qui raconte l'origine du monde, des dieux ou des hommes, transmis de génération en génération.", "Le mythe de Prométhée raconte comment les hommes ont reçu le feu.", "", "Mensonge que l'on fait passer pour vrai", "au sens courant, « c'est un mythe » signifie « c'est faux » ; en histoire, un mythe est un récit fondateur."],
["divinité", "h-croy", "6e", "Être surnaturel, dieu ou déesse, auquel on rend un culte.", "Athéna est la divinité protectrice d'Athènes.", "", "", ""],
["sanctuaire", "h-croy", "6e", "Lieu sacré consacré à une ou plusieurs divinités.", "Le sanctuaire de Delphes accueille des pèlerins venus de toute la Grèce.", "", "Lieu où l'on soigne les malades", "c'est un hôpital ; le sanctuaire est un lieu sacré."],
["temple", "h-croy", "6e", "Bâtiment construit pour abriter la statue d'un dieu ou d'une déesse.", "Le Parthénon est le temple d'Athéna sur l'Acropole.", "", "", ""],
["Pythie", "h-croy", "6e", "Prêtresse du sanctuaire de Delphes qui transmet les réponses du dieu aux personnes venues le consulter.", "La Pythie rendait des oracles souvent difficiles à comprendre.", "", "", ""],
["panhellénique", "h-croy", "6e", "Qui concerne tous les Grecs, quelle que soit leur cité.", "Les Jeux olympiques sont des fêtes panhelléniques.", "pan|hellénique:pan,-", "Qui concerne une seule cité grecque", "pan- veut dire « tout » : l'événement réunit tous les Grecs."],
["Hébreux", "h-croy", "6e", "Peuple de l'Antiquité installé au Proche-Orient, dont la religion est à l'origine du judaïsme.", "Les Hébreux croient en un dieu unique.", "", "", ""],
["Bible", "h-croy", "6e", "Ensemble de textes sacrés des juifs (la Bible hébraïque) et des chrétiens (qui y ajoutent le Nouveau Testament).", "La Bible raconte l'histoire du peuple hébreu et de son alliance avec Dieu.", "", "", ""],
["alliance", "h-croy", "6e", "Dans la Bible, pacte entre Dieu et le peuple hébreu.", "Selon la Bible, Dieu remet les Dix Commandements à Moïse pour sceller l'alliance.", "", "Bague offerte lors d'un mariage", "c'est un autre sens du mot ; ici, l'alliance est un engagement entre Dieu et un peuple."],
["prophète", "h-croy", "6e", "Personne qui affirme parler au nom de Dieu.", "Moïse est un prophète pour les juifs, les chrétiens et les musulmans.", "", "Personne qui prédit l'avenir", "au sens religieux, le prophète transmet un message divin ; prédire l'avenir n'est pas l'essentiel."],
["judaïsme", "h-croy", "6e", "Religion monothéiste des juifs, fondée sur la Bible hébraïque.", "La synagogue est le lieu de prière du judaïsme.", "", "", ""],
["exil", "h-croy", "6e", "Obligation de vivre loin de son pays.", "Au VIe siècle av. J.-C., une partie des Hébreux est déportée à Babylone : c'est l'exil.", "", "", ""],
["diaspora", "h-croy", "6e", "Dispersion d'un peuple hors de sa terre d'origine ; ensemble des communautés ainsi dispersées.", "Après la destruction du temple de Jérusalem en 70, la diaspora juive s'étend autour de la Méditerranée.", "dia|spora:dia,-", "", ""],
["Acropole", "h-anti", "6e", "Partie haute et fortifiée d'une cité grecque, où se trouvent les principaux temples.", "Le Parthénon domine l'Acropole d'Athènes.", "Acro|pole:acro,pole", "Place publique de la cité", "c'est l'agora, située en bas de la ville."],
["agora", "h-anti", "6e", "Place publique d'une cité grecque, lieu du marché et de la vie politique.", "Les citoyens d'Athènes discutent des affaires de la cité sur l'agora.", "", "Partie haute de la cité", "c'est l'acropole."],
["métèque", "h-anti", "6e", "Étranger libre installé dans une cité grecque, qui n'a pas les droits du citoyen.", "À Athènes, les métèques paient un impôt spécial et ne votent pas.", "", "Esclave qui travaille à Athènes", "le métèque est libre ; l'esclave ne l'est pas."],
["esclave", "h-anti", "6e", "Personne qui n'est pas libre et qui appartient à un maître, comme un objet.", "À Athènes, les esclaves sont très nombreux et n'ont aucun droit.", "", "", ""],
["ostracisme", "h-anti", "6e", "À Athènes, vote des citoyens qui chasse de la cité pour dix ans un homme jugé dangereux pour la démocratie.", "Lors de l'ostracisme, les citoyens gravaient un nom sur un tesson de poterie.", "", "", ""],
["monarchie", "h-anti", "6e", "Régime politique où le pouvoir est exercé par un seul homme, le roi.", "Avant de devenir une république, Rome fut une monarchie.", "mon|archie:mono,archie", "Régime où le pouvoir appartient au peuple", "c'est la démocratie."],
["empereur", "h-rome", "6e", "Chef d'un empire, qui concentre tous les pouvoirs.", "Auguste devient le premier empereur romain en 27 av. J.-C.", "", "", ""],
["conquête", "h-rome", "6e", "Action de prendre un territoire par les armes.", "La conquête de la Gaule par Jules César s'achève en 52 av. J.-C.", "", "", ""],
["province", "h-rome", "6e", "Territoire conquis par Rome et dirigé par un gouverneur romain.", "La Gaule est divisée en plusieurs provinces romaines.", "", "Petite ville de campagne", "en France, « la province » désigne aujourd'hui tout ce qui n'est pas Paris ; dans l'empire, c'est un territoire conquis."],
["paix romaine", "h-rome", "6e", "Longue période de paix (Ier et IIe siècles) que Rome fait régner à l'intérieur de son empire.", "Grâce à la paix romaine, le commerce se développe autour de la Méditerranée.", "", "", ""],
["limes", "h-rome", "6e", "Frontière fortifiée de l'empire romain, gardée par des soldats.", "Le mur d'Hadrien, en Grande-Bretagne, fait partie du limes.", "", "Outil pour polir le bois ou le métal", "c'est une lime ; le limes (avec un s) est une frontière."],
["voie romaine", "h-rome", "6e", "Route pavée construite par les Romains pour relier les villes de l'empire.", "Les légions se déplacent rapidement grâce aux voies romaines.", "", "", ""],
["aqueduc", "h-rome", "6e", "Canal, souvent porté par des ponts, qui conduit l'eau jusqu'à une ville.", "Le pont du Gard fait partie d'un aqueduc qui alimentait Nîmes.", "aque|duc:aqua,duc", "Conduite qui évacue les eaux usées", "ce sont les égouts ; l'aqueduc apporte l'eau propre."],
["forum", "h-rome", "6e", "Grande place au centre d'une ville romaine, lieu de la vie politique, religieuse et commerciale.", "Les habitants se retrouvent sur le forum pour faire leurs achats et écouter les discours.", "", "Discussion sur Internet", "c'est un sens récent, emprunté à la place publique romaine."],
["christianisme", "h-rome", "6e", "Religion monothéiste fondée sur l'enseignement de Jésus, que ses fidèles considèrent comme le fils de Dieu.", "Le christianisme se diffuse dans l'empire romain à partir du Ier siècle.", "", "", ""],
["messie", "h-rome", "6e", "Envoyé de Dieu attendu par les juifs pour sauver leur peuple ; pour les chrétiens, Jésus est le Messie.", "Le mot « Christ » est la traduction grecque de « messie ».", "", "", ""],
["apôtre", "h-rome", "6e", "Chacun des douze disciples choisis par Jésus pour répandre son message.", "Après la mort de Jésus, les apôtres diffusent son message.", "", "", ""],
["païen", "h-rome", "6e", "Pour les chrétiens, personne qui pratique une religion polythéiste.", "Au IVe siècle, les temples païens sont peu à peu fermés.", "", "", ""],
["persécution", "h-rome", "6e", "Ensemble de mauvais traitements infligés à des personnes à cause de leurs croyances.", "Sous l'empereur Dioclétien, les chrétiens subissent une violente persécution.", "", "", ""],
["martyr", "h-rome", "6e", "Personne qui accepte de mourir plutôt que de renier sa foi.", "Les chrétiens honorent les martyrs morts pendant les persécutions.", "", "Grande souffrance physique", "c'est le martyre (avec un e) ; le martyr est la personne."],
["édit", "h-rome", "6e", "Décision officielle d'un empereur ou d'un roi, qui a force de loi.", "Par l'édit de Milan, en 313, Constantin autorise le christianisme.", "", "", ""],
["conversion", "h-rome", "6e", "Fait d'abandonner sa religion pour en adopter une autre.", "La conversion de l'empereur Constantin favorise l'essor du christianisme.", "", "Changement d'unité de mesure", "c'est le sens mathématique ; en histoire, il s'agit d'un changement de religion."],
["route de la soie", "h-rome", "6e", "Ensemble de routes commerciales qui relient la Chine à la Méditerranée.", "Des caravanes transportent la soie chinoise vers l'empire romain par la route de la soie.", "", "", ""],
["dynastie", "h-rome", "6e", "Suite de souverains d'une même famille.", "La dynastie des Han gouverne la Chine à l'époque de l'empire romain.", "", "", ""],
["Grande Muraille", "h-rome", "6e", "Immense mur de défense construit au nord de la Chine pour la protéger des invasions venues des steppes.", "Sous les Han, la Grande Muraille est prolongée vers l'ouest.", "", "", ""],
["caravane", "h-rome", "6e", "Groupe de voyageurs et de marchands qui traversent ensemble un désert ou une région difficile.", "Les caravanes de chameaux transportent la soie à travers l'Asie centrale.", "", "", ""],
["empire byzantin", "h-byz", "5e", "Empire romain d'Orient, de langue grecque et de religion chrétienne, qui dure de 395 à 1453.", "La capitale de l'empire byzantin est Constantinople.", "", "", ""],
["basileus", "h-byz", "5e", "Titre de l'empereur byzantin, chef de l'État et protecteur de l'Église.", "Le basileus Justinien fait construire Sainte-Sophie.", "", "", ""],
["Constantinople", "h-byz", "5e", "Capitale de l'empire byzantin, aujourd'hui Istanbul.", "Constantinople est prise par les Ottomans en 1453.", "", "", ""],
["Église orthodoxe", "h-byz", "5e", "Église chrétienne d'Orient, séparée de l'Église de Rome depuis 1054.", "Les fidèles de l'Église orthodoxe vénèrent les icônes.", "Église |ortho|doxe:-,ortho,-", "Église chrétienne dirigée par le pape", "l'Église orthodoxe ne reconnaît pas l'autorité du pape : c'est l'Église catholique qui la reconnaît."],
["schisme", "h-byz", "5e", "Séparation au sein d'une religion, quand une partie des fidèles rompt avec l'autre.", "Le schisme de 1054 sépare les chrétiens d'Orient et d'Occident.", "", "", ""],
["icône", "h-byz", "5e", "Image religieuse peinte sur bois, vénérée par les chrétiens orthodoxes.", "L'icône montre le Christ ou la Vierge sur un fond doré.", "", "Petit symbole sur un écran d'ordinateur", "c'est un sens récent du mot."],
["sacre", "h-byz", "5e", "Cérémonie religieuse au cours de laquelle un roi ou un empereur est béni par l'Église.", "Le sacre de Charlemagne a lieu à Rome en l'an 800.", "", "", ""],
["comte", "h-byz", "5e", "Au Moyen Âge, homme chargé par le roi de diriger une région et d'y rendre la justice.", "Charlemagne nomme des comtes dans tout son empire.", "", "Récit merveilleux", "c'est un conte ; le comte est un personnage du pouvoir."],
["renaissance carolingienne", "h-byz", "5e", "Renouveau des études, de l'écriture et des arts encouragé par Charlemagne.", "Pendant la renaissance carolingienne, les moines recopient les textes anciens.", "", "", ""],
["islam", "h-byz", "5e", "Religion monothéiste fondée au VIIe siècle par Mahomet, le prophète des musulmans.", "L'islam se répand rapidement de l'Arabie à l'Espagne.", "", "", ""],
["musulman", "h-byz", "5e", "Personne qui pratique la religion de l'islam.", "Les musulmans prient cinq fois par jour en direction de La Mecque.", "", "", ""],
["Coran", "h-byz", "5e", "Livre sacré de l'islam qui, pour les musulmans, contient la parole de Dieu révélée à Mahomet.", "Le Coran est écrit en arabe.", "", "", ""],
["mosquée", "h-byz", "5e", "Lieu de prière des musulmans.", "La grande mosquée de Cordoue est construite par les Omeyyades.", "", "", ""],
["calife", "h-byz", "5e", "Successeur de Mahomet, chef religieux et politique des musulmans.", "Le calife Haroun al-Rachid règne à Bagdad.", "", "Gouverneur d'une province", "c'est l'émir."],
["califat", "h-byz", "5e", "Territoire et pouvoir gouvernés par un calife.", "Le califat abbasside a pour capitale Bagdad.", "", "", ""],
["émir", "h-byz", "5e", "Chef militaire ou gouverneur d'une province dans le monde musulman.", "L'émir de Cordoue gouverne l'Espagne musulmane.", "", "", ""],
["sunnite", "h-byz", "5e", "Musulman qui suit la tradition (sunna) du Prophète ; c'est la branche majoritaire de l'islam.", "La majorité des musulmans du monde sont sunnites.", "", "Partisan d'Ali, gendre de Mahomet", "c'est le chiite."],
["chiite", "h-byz", "5e", "Musulman partisan d'Ali, gendre de Mahomet, et de ses descendants comme chefs de l'islam.", "Les chiites sont majoritaires en Iran.", "", "", ""],
["Omeyyades", "h-byz", "5e", "Dynastie de califes qui règne à Damas de 661 à 750, puis en Espagne.", "Sous les Omeyyades, l'empire musulman s'étend de l'Espagne à l'Indus.", "", "", ""],
["Abbassides", "h-byz", "5e", "Dynastie de califes qui règne à Bagdad à partir de 750.", "Bagdad, capitale des Abbassides, est l'une des plus grandes villes du monde.", "", "", ""],
["seigneurie", "h-ma", "5e", "Ensemble des terres d'un seigneur et des droits qu'il exerce sur les paysans qui y vivent.", "La seigneurie comprend le château, la réserve et les tenures.", "", "", ""],
["château fort", "h-ma", "5e", "Demeure fortifiée du seigneur, qui protège et domine la seigneurie.", "Le château fort est entouré de remparts et de douves.", "", "", ""],
["réserve", "h-ma", "5e", "Partie de la seigneurie que le seigneur exploite directement, grâce aux corvées des paysans.", "Les paysans travaillent gratuitement sur la réserve du seigneur.", "", "Lieu où l'on protège la nature", "c'est une réserve naturelle ; au Moyen Âge, la réserve est la terre du seigneur."],
["tenure", "h-ma", "5e", "Terre que le seigneur confie à un paysan en échange de redevances.", "Le paysan cultive sa tenure et verse une partie de la récolte au seigneur.", "", "Façon de s'habiller", "c'est une tenue."],
["banalités", "h-ma", "5e", "Taxes que les paysans paient au seigneur pour utiliser son moulin, son four ou son pressoir.", "Le paysan paie les banalités chaque fois qu'il fait cuire son pain au four du seigneur.", "", "Choses ordinaires et sans intérêt", "c'est le sens courant de « banalité » ; au Moyen Âge, ce sont des taxes."],
["défrichement", "h-ma", "5e", "Action de transformer une forêt ou une friche en terre cultivable.", "Aux XIe et XIIe siècles, les défrichements agrandissent les surfaces cultivées.", "dé|frichement:de,-", "", ""],
["jachère", "h-ma", "5e", "Terre laissée sans culture pendant un an pour qu'elle se repose.", "Dans l'assolement triennal, un champ sur trois est en jachère.", "", "", ""],
["assolement", "h-ma", "5e", "Rotation des cultures sur les champs d'une même exploitation, d'une année sur l'autre.", "L'assolement triennal alterne blé, avoine et jachère.", "", "", ""],
["paroisse", "h-ma", "5e", "Territoire dont les habitants dépendent d'une même église et d'un même curé.", "Chaque village forme une paroisse autour de son église.", "", "", ""],
["clergé", "h-ma", "5e", "Ensemble des hommes qui ont consacré leur vie à Dieu et au service de l'Église.", "Le clergé comprend les prêtres, les évêques et les moines.", "", "", ""],
["féodalité", "h-ma", "5e", "Organisation de la société fondée sur les liens personnels entre seigneurs : vassaux et suzerains.", "La féodalité se met en place en Occident vers l'an mil.", "", "", ""],
["hommage", "h-ma", "5e", "Cérémonie par laquelle un vassal jure fidélité à son suzerain.", "Lors de l'hommage, le vassal place ses mains dans celles de son seigneur.", "", "Compliment ou cadeau offert à quelqu'un", "c'est le sens courant ; au Moyen Âge, l'hommage est un serment de fidélité."],
["chevalier", "h-ma", "5e", "Guerrier noble qui combat à cheval, armé et équipé à ses frais.", "Le jeune noble devient chevalier lors de la cérémonie de l'adoubement.", "", "", ""],
["noblesse", "h-ma", "5e", "Groupe social des seigneurs et des chevaliers, qui ont des privilèges et dont le rôle est de combattre.", "Au Moyen Âge, la noblesse doit en principe protéger les paysans.", "", "", ""],
["pape", "h-ma", "5e", "Évêque de Rome et chef de l'Église catholique.", "En 1095, le pape Urbain II appelle à la croisade.", "", "", ""],
["évêque", "h-ma", "5e", "Chef religieux d'un diocèse, qui dirige les prêtres de son territoire.", "L'évêque siège dans la cathédrale de sa ville.", "", "", ""],
["moine", "h-ma", "5e", "Homme qui vit dans un monastère, à l'écart du monde, pour consacrer sa vie à la prière.", "Les moines de Cluny suivent la règle de saint Benoît.", "", "", ""],
["abbaye", "h-ma", "5e", "Monastère dirigé par un abbé ou une abbesse.", "L'abbaye de Cluny est fondée en 910.", "", "", ""],
["cathédrale", "h-ma", "5e", "Église principale d'un diocèse, où siège l'évêque.", "La cathédrale Notre-Dame de Paris est un chef-d'œuvre gothique.", "", "Toute grande église", "une cathédrale se reconnaît au siège de l'évêque, pas à sa taille."],
["art roman", "h-ma", "5e", "Style d'architecture des XIe et XIIe siècles : murs épais, voûtes en berceau, petites fenêtres.", "Les églises de l'art roman sont souvent sombres et massives.", "", "Art de la Rome antique", "« roman » désigne ici un style du Moyen Âge, pas l'art romain."],
["art gothique", "h-ma", "5e", "Style d'architecture né au XIIe siècle : voûtes sur croisée d'ogives, grands vitraux, églises très hautes et lumineuses.", "La cathédrale de Chartres est un exemple d'art gothique.", "", "Style des récits d'horreur", "c'est un sens moderne ; en architecture, le gothique est un style médiéval lumineux."],
["bourgeois", "h-ville", "5e", "Au Moyen Âge, habitant d'une ville (un bourg), souvent marchand ou artisan.", "Les bourgeois obtiennent du seigneur le droit de gérer eux-mêmes leur ville.", "", "Personne riche et conservatrice", "c'est un sens moderne ; au Moyen Âge, le bourgeois est d'abord un habitant du bourg."],
["commune", "h-ville", "5e", "Au Moyen Âge, ville dont les habitants ont obtenu le droit de se gouverner eux-mêmes.", "Au XIIe siècle, de nombreuses villes deviennent des communes.", "", "", ""],
["charte de franchise", "h-ville", "5e", "Document par lequel un seigneur accorde des libertés aux habitants d'une ville.", "La charte de franchise permet aux bourgeois d'élire leurs magistrats.", "", "", ""],
["corporation", "h-ville", "5e", "Association des artisans ou des marchands d'un même métier dans une ville.", "La corporation des boulangers fixe les règles du métier et contrôle la qualité du pain.", "", "", ""],
["foire", "h-ville", "5e", "Grand marché qui se tient à date fixe et attire des marchands venus de loin.", "Les foires de Champagne réunissent des marchands italiens et flamands.", "", "", ""],
["marchand", "h-ville", "5e", "Personne qui achète et revend des marchandises pour en tirer un profit.", "Les marchands vénitiens commercent avec tout le bassin méditerranéen.", "", "", ""],
["université", "h-ville", "5e", "Au Moyen Âge, association de maîtres et d'étudiants, protégée par le pape, où l'on enseigne les savoirs.", "L'université de Paris est fondée vers 1200.", "", "", ""],
["Capétiens", "h-ville", "5e", "Dynastie des rois de France fondée par Hugues Capet en 987.", "Les Capétiens agrandissent peu à peu le domaine royal.", "", "", ""],
["domaine royal", "h-ville", "5e", "Ensemble des terres que le roi possède et gouverne directement.", "Sous Philippe Auguste, le domaine royal s'agrandit fortement.", "", "Ensemble du royaume de France", "le royaume est bien plus vaste : il comprend aussi les terres des grands seigneurs."],
["impôt", "h-ville", "5e", "Somme d'argent que les habitants doivent verser à l'État.", "Pour payer ses armées, le roi lève de nouveaux impôts.", "", "", ""],
["administration", "h-ville", "5e", "Ensemble des services et des agents chargés d'appliquer les décisions du pouvoir.", "Les baillis et les sénéchaux forment l'administration du roi dans les provinces.", "", "", ""],
["grandes découvertes", "h-mod", "5e", "Voyages d'exploration européens des XVe et XVIe siècles qui font connaître de nouvelles terres.", "Le voyage de Christophe Colomb en 1492 ouvre l'époque des grandes découvertes.", "", "", ""],
["caravelle", "h-mod", "5e", "Navire rapide et maniable utilisé par les explorateurs portugais et espagnols.", "Christophe Colomb traverse l'Atlantique avec deux caravelles et une caraque.", "", "", ""],
["boussole", "h-mod", "5e", "Instrument dont l'aiguille aimantée indique le nord.", "La boussole permet aux marins de garder leur cap en haute mer.", "", "Instrument qui mesure la hauteur des astres", "c'est l'astrolabe."],
["astrolabe", "h-mod", "5e", "Instrument qui mesure la hauteur des astres pour calculer la latitude du navire.", "Grâce à l'astrolabe, le navigateur sait à quelle latitude il se trouve.", "astro|labe:astro,-", "Instrument dont l'aiguille indique le nord", "c'est la boussole."],
["Nouveau Monde", "h-mod", "5e", "Nom donné par les Européens au continent américain après 1492.", "Les conquistadors espagnols s'emparent d'une grande partie du Nouveau Monde.", "", "", ""],
["conquistador", "h-mod", "5e", "Conquérant espagnol de l'Amérique au XVIe siècle.", "Le conquistador Hernán Cortés renverse l'empire aztèque en 1521.", "", "", ""],
["Aztèques", "h-mod", "5e", "Peuple qui dominait un vaste empire au Mexique jusqu'à la conquête espagnole.", "La capitale des Aztèques, Tenochtitlan, était bâtie sur un lac.", "", "", ""],
["Incas", "h-mod", "5e", "Peuple qui dominait un vaste empire dans les Andes jusqu'à la conquête espagnole.", "Pizarro s'empare de l'empire des Incas en 1532.", "", "", ""],
["empire colonial", "h-mod", "5e", "Ensemble des territoires conquis et dominés par un pays loin de ses frontières.", "Au XVIe siècle, l'Espagne se constitue un immense empire colonial en Amérique.", "", "", ""],
["traite", "h-mod", "5e", "Commerce d'esclaves africains déportés vers l'Amérique.", "La traite atlantique a déporté plus de 12 millions d'Africains.", "", "Action de tirer le lait d'une vache", "c'est un autre sens du mot ; en histoire, la traite est un commerce d'êtres humains."],
["humanisme", "h-mod", "5e", "Mouvement intellectuel de la Renaissance qui place l'homme au centre de la réflexion et redécouvre les textes antiques.", "Érasme est l'une des grandes figures de l'humanisme.", "", "Fait d'aider les personnes en difficulté", "c'est l'action humanitaire."],
["humaniste", "h-mod", "5e", "Savant de la Renaissance qui étudie les textes antiques et a confiance dans les capacités de l'homme.", "L'humaniste Rabelais défend une éducation ouverte à tous les savoirs.", "", "", ""],
["Renaissance", "h-mod", "5e", "Période de renouveau des arts et des sciences en Europe, aux XVe et XVIe siècles, inspirée de l'Antiquité.", "Léonard de Vinci est un artiste de la Renaissance.", "", "Fait de revenir à la vie", "avec une majuscule, la Renaissance désigne une période historique."],
["imprimerie", "h-mod", "5e", "Technique qui permet de reproduire un texte en de nombreux exemplaires grâce à des caractères mobiles.", "Gutenberg met au point l'imprimerie vers 1450.", "", "", ""],
["mécène", "h-mod", "5e", "Personne riche ou puissante qui protège et finance des artistes ou des savants.", "Laurent de Médicis est le mécène de nombreux artistes florentins.", "", "", ""],
["perspective", "h-mod", "5e", "Technique de dessin qui donne l'illusion de la profondeur sur une surface plane.", "Les peintres de la Renaissance utilisent la perspective pour donner de la profondeur à leurs tableaux.", "", "", ""],
["Réforme", "h-mod", "5e", "Mouvement religieux du XVIe siècle qui veut réformer l'Église et aboutit à la naissance du protestantisme.", "Martin Luther lance la Réforme en 1517.", "", "", ""],
["protestant", "h-mod", "5e", "Chrétien qui suit la Réforme et ne reconnaît pas l'autorité du pape.", "Les protestants lisent la Bible traduite dans leur langue.", "", "Chrétien fidèle au pape", "c'est le catholique."],
["catholique", "h-mod", "5e", "Chrétien qui reconnaît l'autorité du pape.", "La France reste un royaume majoritairement catholique.", "", "", ""],
["Réforme catholique", "h-mod", "5e", "Mouvement de renouveau de l'Église catholique en réaction à la Réforme protestante.", "Le concile de Trente lance la Réforme catholique.", "", "", ""],
["guerres de religion", "h-mod", "5e", "Guerres civiles qui opposent catholiques et protestants en France de 1562 à 1598.", "Le massacre de la Saint-Barthélemy, en 1572, a lieu pendant les guerres de religion.", "", "", ""],
["édit de Nantes", "h-mod", "5e", "Édit signé par Henri IV en 1598 qui accorde aux protestants la liberté de culte dans certains lieux.", "L'édit de Nantes met fin aux guerres de religion.", "", "", ""],
["tolérance", "h-mod", "5e", "Fait d'accepter que d'autres aient des idées ou des croyances différentes des siennes.", "L'édit de Nantes est un premier pas vers la tolérance religieuse.", "", "", ""],
["droit divin", "h-mod", "5e", "Idée selon laquelle le roi tient son pouvoir de Dieu et n'a de comptes à rendre qu'à lui.", "Louis XIV est un roi de droit divin.", "", "", ""],
["Versailles", "h-mod", "5e", "Château construit pour Louis XIV, où il installe la cour et le gouvernement en 1682.", "À Versailles, la vie de la cour est réglée autour du roi.", "", "", ""],
["courtisan", "h-mod", "5e", "Noble qui vit à la cour du roi et cherche à obtenir ses faveurs.", "À Versailles, les courtisans assistent au lever du roi.", "", "", ""],
["chiffre", "m-num", "CM", "Signe qui sert à écrire les nombres (de 0 à 9).", "Le nombre 507 s'écrit avec trois chiffres.", "", "Quantité, valeur", "c'est un nombre ; un chiffre n'est qu'un symbole d'écriture."],
["milliard", "m-num", "6e", "Mille millions, soit 1 000 000 000.", "La population mondiale dépasse 8 milliards.", "", "", ""],
["fraction", "m-num", "6e", "Écriture a/b qui désigne le partage d'une unité en b parts égales dont on prend a parts ; c'est aussi le quotient de a par b.", "La fraction 3/4 désigne trois quarts.", "", "", ""],
["fraction décimale", "m-num", "6e", "Fraction dont le dénominateur est 10, 100, 1 000, etc.", "7/100 est une fraction décimale.", "", "", ""],
["nombre décimal", "m-num", "6e", "Nombre qui peut s'écrire avec une virgule et un nombre fini de chiffres après la virgule.", "3,25 est un nombre décimal.", "", "Nombre qui s'écrit forcément avec une virgule", "12 est aussi un nombre décimal : 12 = 12,0."],
["dixième", "m-num", "6e", "Une unité partagée en 10 parts égales ; 0,1.", "Dans 4,7, le chiffre 7 est le chiffre des dixièmes.", "", "Groupe de dix unités", "c'est une dizaine."],
["centième", "m-num", "6e", "Une unité partagée en 100 parts égales ; 0,01.", "Dans 2,35, le chiffre 5 est le chiffre des centièmes.", "", "Groupe de cent unités", "c'est une centaine."],
["millième", "m-num", "6e", "Une unité partagée en 1 000 parts égales ; 0,001.", "Le millimètre est le millième du mètre.", "", "", ""],
["demi-droite graduée", "m-num", "6e", "Demi-droite munie d'une origine et d'une unité reportée régulièrement, sur laquelle on place des nombres.", "On place 2,5 à mi-chemin entre 2 et 3 sur la demi-droite graduée.", "", "", ""],
["valeur arrondie", "m-num", "6e", "Valeur approchée la plus proche d'un nombre, à une précision donnée.", "La valeur arrondie de 3,48 à l'unité est 3.", "", "", ""],
["somme", "m-num", "CM", "Résultat d'une addition.", "La somme de 8 et 5 est 13.", "", "Résultat d'une multiplication", "c'est le produit."],
["différence", "m-num", "CM", "Résultat d'une soustraction.", "La différence entre 12 et 5 est 7.", "", "", ""],
["produit", "m-num", "CM", "Résultat d'une multiplication.", "Le produit de 6 par 7 est 42.", "", "Résultat d'une addition", "c'est la somme."],
["terme", "m-num", "6e", "Chacun des nombres que l'on additionne ou que l'on soustrait.", "Dans 8 + 5, les termes sont 8 et 5.", "", "Chacun des nombres que l'on multiplie", "c'est un facteur."],
["facteur", "m-num", "6e", "Chacun des nombres que l'on multiplie.", "Dans 6 × 7, les facteurs sont 6 et 7.", "", "", ""],
["dividende", "m-num", "6e", "Nombre que l'on divise.", "Dans 17 ÷ 5, le dividende est 17.", "", "Nombre par lequel on divise", "c'est le diviseur."],
["reste", "m-num", "6e", "Dans une division euclidienne, nombre qui reste quand on ne peut plus partager ; il est plus petit que le diviseur.", "17 = 5 × 3 + 2 : le reste est 2.", "", "", ""],
["division euclidienne", "m-num", "6e", "Division de nombres entiers qui donne un quotient entier et un reste.", "La division euclidienne de 17 par 5 donne 3, reste 2.", "", "", ""],
["critère de divisibilité", "m-num", "6e", "Règle qui permet de savoir rapidement si un nombre est divisible par un autre.", "Un nombre est divisible par 3 si la somme de ses chiffres est divisible par 3.", "", "", ""],
["nombre relatif", "m-num", "5e", "Nombre positif ou négatif, précédé d'un signe + ou −.", "−7 et +3 sont des nombres relatifs.", "", "", ""],
["nombre négatif", "m-num", "5e", "Nombre plus petit que zéro, écrit avec le signe −.", "La température de −5 °C s'écrit avec un nombre négatif.", "", "", ""],
["opposé", "m-num", "5e", "Nombre qui est à la même distance de zéro mais qui a le signe contraire.", "L'opposé de −4 est 4.", "", "Inverse d'un nombre", "l'inverse de 4 est 1/4 ; son opposé est −4."],
["nombre rationnel", "m-num", "5e", "Nombre qui peut s'écrire comme le quotient de deux nombres entiers.", "1/3 est un nombre rationnel, même s'il n'est pas décimal.", "", "", ""],
["fractions égales", "m-num", "5e", "Fractions qui désignent le même nombre.", "2/4 et 1/2 sont des fractions égales.", "", "", ""],
["simplifier une fraction", "m-num", "5e", "Écrire une fraction égale avec un numérateur et un dénominateur plus petits, en les divisant par un même nombre.", "Pour simplifier 6/8, on divise par 2 : on obtient 3/4.", "", "", ""],
["priorités opératoires", "m-num", "5e", "Règles qui fixent l'ordre des calculs : d'abord les parenthèses, puis les multiplications et divisions, enfin les additions et soustractions.", "D'après les priorités opératoires, 2 + 3 × 4 = 14.", "", "", ""],
["décomposition en facteurs premiers", "m-num", "5e", "Écriture d'un nombre entier sous la forme d'un produit de nombres premiers.", "La décomposition en facteurs premiers de 12 est 2 × 2 × 3.", "", "", ""],
["exposant", "m-num", "5e", "Dans une puissance, petit nombre écrit en haut à droite qui indique combien de fois on multiplie le nombre par lui-même.", "Dans 2³, l'exposant est 3.", "", "", ""],
["carré d'un nombre", "m-num", "5e", "Produit d'un nombre par lui-même.", "Le carré de 7 est 49.", "", "Double d'un nombre", "le double de 7 est 14 ; son carré est 7 × 7."],
["cube d'un nombre", "m-num", "5e", "Produit de trois facteurs égaux à ce nombre.", "Le cube de 2 est 2 × 2 × 2 = 8.", "", "", ""],
["racine carrée", "m-num", "5e", "Nombre positif dont le carré est égal au nombre donné.", "La racine carrée de 49 est 7.", "", "Moitié d'un nombre", "la moitié de 49 est 24,5 ; sa racine carrée est 7."],
["ratio", "m-num", "5e", "Rapport entre deux quantités, noté par exemple 2 : 3.", "Dans une classe de 10 filles et 15 garçons, le ratio filles : garçons est 2 : 3.", "", "", ""],
["coefficient de proportionnalité", "m-num", "5e", "Nombre par lequel on multiplie une grandeur pour obtenir la grandeur qui lui est proportionnelle.", "Si 1 kg de pommes coûte 3 €, le coefficient de proportionnalité est 3.", "", "", ""],
["expression littérale", "m-alg", "5e", "Expression mathématique qui contient une ou plusieurs lettres désignant des nombres.", "Le périmètre d'un carré de côté c est donné par l'expression littérale 4 × c.", "", "", ""],
["inconnue", "m-alg", "5e", "Lettre qui désigne le nombre que l'on cherche dans une équation.", "Dans l'équation x + 3 = 10, l'inconnue est x.", "", "", ""],
["distributivité", "m-alg", "5e", "Propriété qui permet de transformer un produit en somme : k × (a + b) = k × a + k × b.", "Grâce à la distributivité, 3 × (x + 2) = 3x + 6.", "", "", ""],
["développer", "m-alg", "5e", "Transformer un produit en somme.", "Développer 5(x + 1) donne 5x + 5.", "", "Transformer une somme en produit", "c'est factoriser."],
["factoriser", "m-alg", "5e", "Transformer une somme en produit.", "Factoriser 4x + 8 donne 4(x + 2).", "", "Transformer un produit en somme", "c'est développer."],
["réduire", "m-alg", "5e", "Regrouper les termes semblables d'une expression pour l'écrire plus simplement.", "Réduire 3x + 5x donne 8x.", "", "", ""],
["propriété", "m-alg", "5e", "Énoncé mathématique toujours vrai, que l'on peut utiliser pour démontrer.", "Propriété : les diagonales d'un parallélogramme se coupent en leur milieu.", "", "", ""],
["théorème", "m-alg", "5e", "Propriété importante qui a été démontrée.", "Le théorème de Pythagore concerne les triangles rectangles.", "", "Affirmation qui reste à prouver", "c'est une conjecture : un théorème est déjà démontré."],

["rayon lumineux", "p-lum", "5e", "Droite fléchée qui modélise le trajet de la lumière.", "Sur le schéma, le rayon lumineux part de la lampe et va vers l'œil.", "", "", ""],
["faisceau lumineux", "p-lum", "5e", "Ensemble de rayons lumineux issus d'une même source.", "Le faisceau lumineux d'une lampe de poche éclaire le mur.", "", "", ""],
["ombre propre", "p-lum", "6e", "Partie d'un objet qui n'est pas éclairée.", "La face de la Terre opposée au Soleil est dans l'ombre propre : il y fait nuit.", "", "Zone sombre sur l'écran, derrière l'objet", "c'est l'ombre portée."],
["ombre portée", "p-lum", "6e", "Zone sombre, derrière un objet éclairé, où la lumière n'arrive pas.", "L'ombre portée d'un arbre s'allonge le soir.", "", "Partie de l'objet qui n'est pas éclairée", "c'est l'ombre propre."],
["vitesse de la lumière", "p-lum", "5e", "Vitesse à laquelle la lumière se propage : environ 300 000 km par seconde dans le vide.", "La lumière du Soleil met environ 8 minutes pour atteindre la Terre.", "", "", ""],
["circuit électrique", "p-elec", "6e", "Boucle fermée de dipôles reliés par des fils, dans laquelle le courant peut circuler.", "Si le circuit électrique est ouvert, la lampe s'éteint.", "", "", ""],
["générateur", "p-elec", "5e", "Dipôle qui fournit l'énergie électrique au circuit.", "Une pile est un générateur.", "", "Dipôle qui reçoit l'énergie électrique", "c'est un récepteur."],
["pile", "p-elec", "6e", "Générateur qui transforme de l'énergie chimique en énergie électrique.", "Une pile plate de 4,5 V alimente la lampe du circuit.", "", "", ""],
["interrupteur", "p-elec", "6e", "Dipôle qui permet d'ouvrir ou de fermer un circuit.", "Quand on ouvre l'interrupteur, le courant ne passe plus.", "", "", ""],
["récepteur", "p-elec", "5e", "Dipôle qui reçoit de l'énergie électrique et la convertit en une autre forme d'énergie.", "Une lampe et un moteur sont des récepteurs.", "", "Dipôle qui fournit l'énergie au circuit", "c'est le générateur."],
["moteur", "p-elec", "6e", "Récepteur qui convertit l'énergie électrique en mouvement.", "Le moteur du ventilateur fait tourner les pales.", "", "", ""],
["diode électroluminescente", "p-elec", "5e", "Dipôle (DEL) qui émet de la lumière et ne laisse passer le courant que dans un sens.", "La diode électroluminescente ne s'allume que si elle est branchée dans le bon sens.", "", "", ""],
["circuit en dérivation", "p-elec", "5e", "Circuit qui comporte plusieurs boucles : les dipôles sont branchés sur des branches différentes.", "Les lampes de la maison sont montées en dérivation : si l'une grille, les autres restent allumées.", "", "Circuit à une seule boucle", "c'est un circuit en série."],
["nœud", "p-elec", "5e", "Point d'un circuit relié à au moins trois fils.", "Dans un circuit en dérivation, le courant se partage au niveau d'un nœud.", "", "", ""],
["branche", "p-elec", "5e", "Partie d'un circuit en dérivation comprise entre deux nœuds.", "Chaque lampe est placée sur sa propre branche.", "", "", ""],
["court-circuit", "p-elec", "5e", "Branchement où le courant passe par un fil au lieu de traverser un dipôle ; il peut provoquer un échauffement dangereux.", "Un fil branché aux deux extrémités de la lampe la met en court-circuit : elle s'éteint.", "", "", ""],
["schéma normalisé", "p-elec", "5e", "Dessin d'un circuit qui utilise des symboles reconnus par tous.", "Sur un schéma normalisé, une lampe est un cercle barré d'une croix.", "", "", ""],
["source d'énergie", "p-ener", "6e", "Ressource dont on peut tirer de l'énergie (vent, soleil, pétrole, eau d'un barrage…).", "Le vent est une source d'énergie renouvelable.", "", "", ""],
["énergie non renouvelable", "p-ener", "6e", "Énergie tirée d'une source dont les réserves s'épuisent, car elles se reconstituent très lentement ou pas du tout.", "Le charbon et l'uranium sont des sources d'énergie non renouvelables.", "", "", ""],
["énergie fossile", "p-ener", "6e", "Énergie tirée du charbon, du pétrole ou du gaz, formés à partir d'êtres vivants enfouis il y a des millions d'années.", "Brûler des énergies fossiles rejette du dioxyde de carbone.", "", "", ""],
["conversion d'énergie", "p-ener", "6e", "Transformation d'une forme d'énergie en une autre.", "Une éolienne réalise la conversion d'énergie cinétique (celle du vent) en énergie électrique.", "", "", ""],
["chaîne énergétique", "p-ener", "5e", "Schéma qui montre les conversions d'énergie entre un réservoir, des convertisseurs et l'énergie utile.", "La chaîne énergétique d'une lampe de poche va de la pile jusqu'à la lumière.", "", "", ""],
["énergie thermique", "p-ener", "6e", "Énergie liée à la température d'un corps ; on la perçoit comme de la chaleur.", "Le radiateur fournit de l'énergie thermique à la pièce.", "", "", ""],
["énergie électrique", "p-ener", "6e", "Énergie transportée par le courant électrique.", "Le panneau solaire produit de l'énergie électrique.", "", "", ""],
["énergie lumineuse", "p-ener", "6e", "Énergie transportée par la lumière.", "Les plantes captent l'énergie lumineuse pour réaliser la photosynthèse.", "", "", ""],
["énergie chimique", "p-ener", "6e", "Énergie stockée dans la matière (aliments, carburants, piles), libérée lors d'une transformation chimique.", "L'essence contient de l'énergie chimique.", "", "", ""],
["gaz à effet de serre", "p-ener", "6e", "Gaz de l'atmosphère (dioxyde de carbone, méthane, vapeur d'eau) qui retient une partie de la chaleur émise par la Terre.", "Les voitures à essence rejettent des gaz à effet de serre.", "", "", ""],
["tissu", "s-cell", "6e", "Ensemble de cellules semblables qui assurent une même fonction.", "Le tissu musculaire est formé de cellules qui se contractent.", "", "Étoffe utilisée pour les vêtements", "c'est le sens courant ; en biologie, un tissu est fait de cellules."],
["organe", "s-cell", "6e", "Partie du corps formée de plusieurs tissus et qui remplit une fonction précise.", "Le cœur est un organe qui fait circuler le sang.", "", "", ""],
["microscope", "s-cell", "6e", "Instrument qui grossit fortement les objets trop petits pour être vus à l'œil nu.", "On observe les cellules de l'oignon au microscope.", "micro|scope:micro,scope", "Instrument qui observe les astres lointains", "c'est le télescope."],
["classification", "s-class", "6e", "Rangement des êtres vivants en groupes selon les attributs qu'ils partagent.", "La classification range la chauve-souris avec les mammifères, pas avec les oiseaux.", "", "", ""],
["espèce", "s-class", "6e", "Ensemble d'êtres vivants qui se ressemblent et peuvent se reproduire entre eux en ayant des descendants fertiles.", "Le rouge-gorge est une espèce d'oiseau.", "", "", ""],
["attribut", "s-class", "6e", "Caractère que possède un être vivant et qui sert à le classer (par exemple : avoir des plumes).", "Avoir des poils est un attribut des mammifères.", "", "", ""],
["arbre de parenté", "s-class", "6e", "Schéma qui montre les liens de parenté entre des êtres vivants selon les attributs qu'ils partagent.", "L'arbre de parenté montre que l'humain est plus proche du chimpanzé que du chat.", "", "Arbre généalogique d'une famille", "l'arbre de parenté relie des espèces, pas des personnes d'une même famille."],
["clé de détermination", "s-class", "6e", "Suite de questions qui permet de trouver le nom d'un être vivant à partir de ses caractères.", "Grâce à la clé de détermination, on reconnaît une larve de libellule.", "", "", ""],
["vertébré", "s-class", "6e", "Animal qui possède un squelette interne avec une colonne vertébrale.", "Le poisson, la grenouille et le chat sont des vertébrés.", "", "", ""],
["mammifère", "s-class", "6e", "Vertébré qui a des poils et dont les femelles allaitent leurs petits.", "La chauve-souris est un mammifère qui vole.", "", "", ""],
["besoins alimentaires", "s-alim", "6e", "Quantités d'aliments et d'eau nécessaires au bon fonctionnement de l'organisme.", "Les besoins alimentaires d'un adolescent sont élevés, car il grandit.", "", "", ""],
["fermentation", "s-alim", "6e", "Transformation d'un aliment par des micro-organismes, en l'absence d'air.", "La fermentation du lait par des bactéries produit le yaourt.", "", "Pourrissement d'un aliment", "la fermentation est contrôlée et utile ; le pourrissement rend l'aliment immangeable."],
["levure", "s-alim", "6e", "Champignon microscopique unicellulaire qui fait lever la pâte à pain.", "La levure fait gonfler la pâte en produisant du dioxyde de carbone.", "", "", ""],
["conservation des aliments", "s-alim", "6e", "Ensemble des techniques qui empêchent les micro-organismes de se développer dans les aliments.", "Le froid, le sel et le séchage permettent la conservation des aliments.", "", "", ""],
["stérilisation", "s-alim", "6e", "Technique qui détruit tous les micro-organismes en chauffant à plus de 100 °C.", "Les conserves sont protégées par stérilisation.", "", "Conservation au réfrigérateur", "le froid ralentit les microbes sans les tuer ; la stérilisation les détruit tous."],
["pasteurisation", "s-alim", "6e", "Chauffage d'un aliment entre 70 et 85 °C environ, qui tue la plupart des microbes sans trop changer son goût.", "Le lait pasteurisé se conserve quelques jours au frais.", "", "", ""],
["microbiote", "s-alim", "5e", "Ensemble des micro-organismes qui vivent dans une partie du corps, comme l'intestin.", "Le microbiote intestinal aide à digérer certains aliments.", "micro|biote:micro,bio", "", ""],
["hygiène", "s-alim", "5e", "Ensemble des pratiques qui préservent la santé, notamment en limitant les microbes.", "Se laver les mains est une règle d'hygiène simple.", "", "", ""],
["pollinisation", "s-repro", "6e", "Transport du pollen d'une fleur jusqu'au pistil d'une fleur de la même espèce.", "Les abeilles assurent la pollinisation de nombreux arbres fruitiers.", "", "", ""],
["pollinisateur", "s-repro", "6e", "Animal (insecte, oiseau) qui transporte le pollen de fleur en fleur.", "Le bourdon est un pollinisateur.", "", "", ""],
["ovule", "s-repro", "6e", "Chez les plantes à fleurs, petite structure du pistil qui deviendra une graine après la fécondation ; chez l'animal, gamète femelle.", "Après la fécondation, l'ovule de la fleur se transforme en graine.", "", "Œuf d'oiseau", "l'ovule est minuscule : c'est une cellule ou une structure de la fleur, pas un œuf pondu."],
["graine", "s-repro", "CM", "Organe qui contient l'embryon d'une nouvelle plante et ses réserves.", "La graine de haricot germe au printemps.", "", "", ""],
["fruit", "s-repro", "6e", "Organe de la plante qui se forme à partir du pistil après la fécondation et qui contient les graines.", "Pour le botaniste, la tomate est un fruit.", "", "", ""],
["puberté", "s-repro", "6e", "Période de la vie où le corps se transforme et devient capable de se reproduire.", "À la puberté, la voix des garçons mue.", "", "", ""],
["appareil reproducteur", "s-repro", "6e", "Ensemble des organes qui permettent la reproduction.", "Les ovaires font partie de l'appareil reproducteur féminin.", "", "", ""],
["gamète", "s-repro", "5e", "Cellule reproductrice : spermatozoïde chez le mâle, ovule chez la femelle.", "La rencontre de deux gamètes forme une cellule-œuf.", "", "", ""],
["fécondation", "s-repro", "6e", "Union d'un gamète mâle et d'un gamète femelle, qui forme une cellule-œuf.", "Chez la grenouille, la fécondation se produit dans l'eau.", "", "Ponte des œufs", "la ponte est l'expulsion des œufs ; la fécondation est la rencontre des gamètes."],
["fécondation interne", "s-repro", "6e", "Fécondation qui a lieu à l'intérieur du corps de la femelle.", "Chez les mammifères et les oiseaux, la fécondation est interne.", "", "", ""],
["cellule-œuf", "s-repro", "5e", "Première cellule d'un nouvel être vivant, issue de la fécondation.", "La cellule-œuf se divise pour former un embryon.", "", "", ""],
["embryon", "s-repro", "6e", "Tout premier stade du développement d'un être vivant après la fécondation.", "L'embryon humain s'implante dans l'utérus.", "", "", ""],
["fœtus", "s-repro", "6e", "Chez l'humain, nom de l'embryon à partir du 3e mois de grossesse, quand ses organes sont formés.", "Le fœtus grandit dans l'utérus jusqu'à la naissance.", "", "", ""],
["placenta", "s-repro", "6e", "Organe qui permet les échanges entre la mère et le fœtus (nutriments, dioxygène, déchets).", "Le placenta est relié au fœtus par le cordon ombilical.", "", "", ""],
["vivipare", "s-repro", "6e", "Se dit d'un animal dont les petits se développent dans le ventre de la mère avant de naître.", "Le chat est vivipare.", "vivi|pare:vivi,-", "Animal qui pond des œufs", "c'est un animal ovipare."],
["ovipare", "s-repro", "6e", "Se dit d'un animal qui pond des œufs.", "La poule et la tortue sont ovipares.", "", "", ""],
["atmosphère", "s-eco", "6e", "Couche de gaz qui entoure la Terre.", "L'atmosphère nous protège d'une partie des rayons du Soleil.", "atmo|sphère:atmo,sphere", "", ""],
["milieu", "s-eco", "6e", "Lieu de vie d'un être vivant, avec ses conditions physiques (température, lumière, eau).", "La forêt et la mare sont deux milieux différents.", "", "", ""],
["facteur abiotique", "s-eco", "6e", "Caractéristique non vivante d'un milieu (lumière, température, humidité).", "La lumière est un facteur abiotique qui influence la répartition des plantes.", "facteur |a|bio|tique:-,a,bio,-", "Être vivant qui influence le milieu", "a- veut dire « sans » : abiotique signifie « non vivant »."],
["peuplement", "s-eco", "6e", "Ensemble des êtres vivants qui occupent un milieu.", "Le peuplement d'une mare change selon les saisons.", "", "", ""],
["réseau trophique", "s-eco", "6e", "Ensemble des chaînes alimentaires reliées entre elles dans un écosystème.", "Dans le réseau trophique de la forêt, le renard mange des lapins et des mulots.", "", "", ""],
["consommateur", "s-eco", "6e", "Être vivant qui se nourrit d'autres êtres vivants.", "Le lapin est un consommateur de plantes.", "", "", ""],
["matière organique", "s-eco", "6e", "Matière produite par les êtres vivants (feuilles, bois, cadavres, excréments).", "Les feuilles mortes sont de la matière organique.", "", "Matière qui forme les roches et les minéraux", "c'est la matière minérale."],
["matière minérale", "s-eco", "6e", "Matière non produite par les êtres vivants : eau, sels minéraux, roches, gaz.", "Les décomposeurs transforment la matière organique en matière minérale.", "", "", ""],
["sels minéraux", "s-eco", "6e", "Substances minérales dissoutes dans l'eau du sol, que les plantes absorbent par leurs racines.", "Les racines puisent l'eau et les sels minéraux du sol.", "", "", ""],
["appareil digestif", "s-corps", "5e", "Ensemble des organes qui assurent la digestion : tube digestif et glandes.", "La bouche, l'estomac et l'intestin font partie de l'appareil digestif.", "", "", ""],
["intestin grêle", "s-corps", "5e", "Partie longue et étroite du tube digestif où se termine la digestion et où les nutriments passent dans le sang.", "L'intestin grêle mesure environ 6 mètres chez l'adulte.", "", "", ""],
["circulation sanguine", "s-corps", "5e", "Déplacement continu du sang dans les vaisseaux sous l'action du cœur.", "La circulation sanguine apporte les nutriments et le dioxygène à tous les organes.", "", "", ""],
["cœur", "s-corps", "5e", "Organe musclé qui se contracte pour propulser le sang dans les vaisseaux.", "Le cœur bat environ 70 fois par minute au repos.", "", "", ""],
["poumon", "s-corps", "5e", "Organe de la respiration dans lequel l'air échange des gaz avec le sang.", "Dans les poumons, le sang se charge en dioxygène.", "", "", ""],
["respiration", "s-corps", "5e", "Fonction qui permet à un être vivant de prélever du dioxygène et de rejeter du dioxyde de carbone.", "La respiration a lieu dans toutes les cellules, jour et nuit, même chez les plantes.", "", "Seulement inspirer et expirer de l'air", "la respiration désigne aussi les échanges gazeux dans les cellules."],
["échanges gazeux", "s-corps", "5e", "Entrée de dioxygène et sortie de dioxyde de carbone entre un organisme et son milieu.", "Les échanges gazeux se font à travers la paroi très fine des alvéoles.", "", "", ""],
["organe respiratoire", "s-corps", "5e", "Organe où se font les échanges gazeux entre l'organisme et son milieu.", "Le poumon est l'organe respiratoire des mammifères.", "", "", ""],
["trachée", "s-corps", "5e", "Tube qui conduit l'air : chez l'humain, de la gorge aux bronches ; chez les insectes, réseau de tubes qui apporte l'air directement aux organes.", "Le criquet respire grâce à ses trachées.", "", "", ""],
["sève", "s-corps", "5e", "Liquide qui circule dans les vaisseaux d'une plante (sève brute : eau et sels minéraux ; sève élaborée : sucres).", "La sève élaborée transporte les sucres fabriqués par les feuilles.", "", "", ""],
["stomate", "s-corps", "5e", "Minuscule ouverture à la surface des feuilles par laquelle se font les échanges gazeux.", "Les stomates se ferment quand il fait très sec.", "", "", ""],
["roche", "s-geol", "5e", "Matériau naturel qui forme l'écorce terrestre, constitué d'un ou de plusieurs minéraux.", "Le granite et le calcaire sont des roches.", "", "", ""],
["altération", "s-geol", "5e", "Transformation d'une roche par l'eau, l'air ou les êtres vivants, qui la fragilise.", "L'altération du granite donne une arène sableuse.", "", "Déplacement des débris par l'eau ou le vent", "c'est le transport ; l'altération se fait sur place."],
["sédiment", "s-geol", "5e", "Débris de roches ou restes d'êtres vivants déposés au fond de l'eau ou sur le sol.", "Les rivières transportent des sédiments jusqu'à la mer.", "", "", ""],
["sédimentation", "s-geol", "5e", "Dépôt des sédiments en couches successives.", "La sédimentation forme des couches au fond des lacs et des mers.", "", "", ""],
["roche sédimentaire", "s-geol", "5e", "Roche formée par le dépôt, le tassement et la transformation de sédiments.", "Le calcaire est une roche sédimentaire qui contient souvent des fossiles.", "", "Roche formée par le refroidissement d'un magma", "c'est une roche magmatique, comme le granite ou le basalte."],
["fossilisation", "s-geol", "5e", "Ensemble des processus qui transforment un reste d'être vivant en fossile.", "La fossilisation se produit surtout quand un organisme est vite recouvert de sédiments.", "", "", ""],
["paysage", "s-geol", "5e", "Partie d'un territoire que l'on voit d'un point donné, façonnée par la nature et par l'homme.", "Les glaciers ont modelé les paysages des Alpes.", "", "", ""],
["météorologie", "s-geol", "5e", "Science qui étudie les phénomènes de l'atmosphère pour prévoir le temps qu'il fera.", "La météorologie annonce une tempête pour demain.", "météoro|logie:-,logie", "Science qui étudie les météorites", "la météorologie étudie le temps qu'il fait."],
["climat", "s-geol", "5e", "Ensemble des conditions de l'atmosphère (températures, précipitations) observées sur une longue durée dans une région.", "Le climat méditerranéen a des étés chauds et secs.", "", "Temps qu'il fait aujourd'hui", "c'est la météo ; le climat se calcule sur au moins 30 ans."],
["masse d'air", "s-geol", "5e", "Grand volume d'air qui a une température et une humidité à peu près identiques.", "Une masse d'air froid venue du nord fait baisser les températures.", "", "", ""],
["précipitations", "s-geol", "5e", "Eau qui tombe du ciel sous forme de pluie, de neige ou de grêle.", "Les précipitations sont abondantes sur la façade atlantique.", "", "Gestes trop rapides et désordonnés", "c'est un autre sens de « précipitation »."],
["cyclone", "s-geol", "5e", "Violente tempête tournante qui se forme au-dessus des océans chauds.", "Les Antilles sont souvent menacées par des cyclones à la fin de l'été.", "", "", ""],
["temps géologiques", "s-geol", "6e", "Très longue histoire de la Terre, qui se compte en millions d'années.", "À l'échelle des temps géologiques, l'espèce humaine est très récente.", "", "", ""],
["crise biologique", "s-geol", "6e", "Période relativement courte où un grand nombre d'espèces disparaissent.", "Lors de la crise biologique d'il y a 66 millions d'années, les grands dinosaures ont disparu.", "", "", ""]

{"r": "h-byz", "t": "À {Constantinople}, le {basileus} gouverne l'empire byzantin. En 1054, un {schisme} sépare les chrétiens d'Orient et d'Occident. Dans le monde musulman, le {calife} est le successeur du Prophète ; les fidèles prient à la {mosquée}.", "x": ["émir", "icône"]},
{"r": "h-ma", "t": "Dans la seigneurie, le seigneur exploite directement la {réserve}, tandis que chaque paysan cultive sa {tenure}. Pour moudre son grain au moulin du seigneur, il paie les {banalités}. Lors de l'{hommage}, le vassal jure fidélité à son suzerain.", "x": ["tenues", "jachère"]},
{"r": "h-ville", "t": "Au XIIe siècle, les {bourgeois} d'une ville obtiennent du seigneur une {charte de franchise} : la ville devient une {commune}. Les artisans d'un même métier s'organisent en {corporations#corporation}, et les marchands se retrouvent dans les grandes {foires#foire}.", "x": ["paroisses", "impôt"]},
{"r": "h-mod", "t": "Au XVIe siècle, les {humanistes#humaniste} redécouvrent les textes antiques. L'{imprimerie} diffuse rapidement leurs idées. En 1517, Luther lance la {Réforme} ; les {protestants#protestant} rejettent l'autorité du pape. En 1598, l'{édit de Nantes} met fin aux guerres de religion.", "x": ["mécènes", "courtisans"]},
{"r": "g-faible", "t": "Le Sahara est un {désert} : le climat y est {aride} et les pluies très rares. Cette {contrainte naturelle} explique la faible densité de population. Les habitants se regroupent dans les {oasis}, où l'eau permet de cultiver.", "x": ["parc naturel", "littoral"]},
{"r": "g-litt", "t": "En France, la {littoralisation} se poursuit : les côtes attirent habitants et activités. Au Havre, le {port} accueille d'immenses porte-conteneurs, et la {zone industrialo-portuaire} transforme le pétrole importé. Plus au sud, chaque été, les {stations balnéaires#station balnéaire} vivent du {tourisme}.", "x": ["banlieue", "oasis"]},

{"r": "p-mat", "t": "Quand on chauffe de l'eau pure, elle entre en {ébullition} à 100 °C. Pendant ce changement d'état, la température ne bouge plus : on observe un {palier de température}. Le linge qui sèche au soleil, lui, perd son eau par {évaporation}. Le sucre versé dans le thé ne fond pas : c'est une {dissolution}.", "x": ["fusion", "combustion"]},
{"r": "p-mvt", "t": "La Terre tourne sur elle-même en 24 heures : c'est sa {rotation}. Elle tourne aussi autour du Soleil en un an : c'est sa {révolution}. Le Soleil est une {étoile} ; la Terre est une {planète} du {Système solaire}.", "x": ["trajectoire", "vitesse"]},
{"r": "p-lum", "t": "Le Soleil est une {source primaire} de lumière. La Lune, elle, est un {objet diffusant} : elle renvoie la lumière qu'elle reçoit. Comme la lumière se déplace en ligne droite (c'est sa {propagation rectiligne}), un objet éclairé crée derrière lui une {ombre portée}.", "x": ["ombre propre", "faisceau lumineux"]},
{"r": "p-elec", "t": "Dans ce circuit, la pile est le {générateur} et chaque lampe est un {récepteur}. Les deux lampes sont sur deux {branches#branche} différentes, séparées par deux {nœuds#nœud} : c'est un circuit en dérivation. Quand on ouvre l'{interrupteur} placé avant les nœuds, tout s'éteint.", "x": ["moteur", "court-circuit"]},
{"r": "s-class", "t": "Pour ranger les êtres vivants, la {classification} s'appuie sur les {attributs#attribut} qu'ils partagent. La chauve-souris a des poils et allaite ses petits : c'est un {mammifère}. Comme elle a une colonne vertébrale, c'est aussi un {vertébré}.", "x": ["espèce", "clé de détermination"]},
{"r": "s-alim", "t": "Pour faire du pain, on ajoute de la {levure} à la pâte. Pour fabriquer le yaourt, des bactéries transforment le lait : c'est une {fermentation}. Pour que les conserves se gardent des années, on les chauffe à plus de 100 °C : c'est la {stérilisation}.", "x": ["pasteurisation", "hygiène"]},
{"r": "s-repro", "t": "Au printemps, les abeilles assurent la {pollinisation} des fleurs. Après la {fécondation}, l'{ovule} devient une {graine}, et le pistil se transforme en {fruit}.", "x": ["embryon", "placenta"]},
{"r": "s-geol", "t": "Les rivières arrachent des débris aux montagnes et les transportent jusqu'à la mer. Ces {sédiments#sédiment} se déposent en couches : c'est la {sédimentation}. Au fil des millions d'années, ils se tassent et forment une {roche sédimentaire}. Les coquillages piégés dans ces couches subissent une {fossilisation}.", "x": ["altération", "climat"]},

{"r": "f-conj", "t": "Dans « Elle est partie », le verbe est conjugué à un {temps composé} : il est formé de l'{auxiliaire} être et du {participe passé} « partie ». Dans « Range ta chambre ! », le verbe est à l'{impératif}.", "x": ["subjonctif", "infinitif"]},

{"r": "t-num", "t": "Ton nom, ta photo ou ton adresse sont des {données personnelles}. Les publier sans précaution peut menacer ta {vie privée}. Un mot de passe solide fait partie des règles de {cybersécurité}.", "x": ["intelligence artificielle", "programme"]}

  RES.forEach(r => { if(RESUP[r.id]) Object.assign(r, RESUP[r.id]); if(r.id==="p-ener") delete r.s; });
  RES.push(...RES_ADD);

<script>
/* ===== Application ===== */
const {useState, useEffect, useMemo, useRef, useCallback} = React;
const html = htm.bind(React.createElement);
const Frag = React.Fragment;

/* ---------- utilitaires ---------- */
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const pick = a => a[Math.floor(Math.random()*a.length)];
const DAY = 86400000;
const parseMorph = mo => { if(!mo) return null; const [s,k]=mo.split(":"); const ks=k.split(","); return s.split("|").map((t,j)=>({t, k: ks[j]==="-"?null:ks[j]})); };

const RES_BY = Object.fromEntries(RES.map(r=>[r.id,r]));
const W = RAW.map(a => { const [w,r,n,d,e,mo,l,lx]=a; return {id:slug(w), w, r, n, d, e, segs:parseMorph(mo), l, lx, m:RES_BY[r].m}; });
const WBY = Object.fromEntries(W.map(w=>[w.id,w]));
const TR = TRANSFER.map(a => ({w:a[0], segs:parseMorph(a[1]), d:a[2], lures:[[a[3],a[4]],[a[5],a[6]]]}));
const ROOT_WORDS = {};
W.forEach(w => (w.segs||[]).forEach(s => { if(s.k){ (ROOT_WORDS[s.k]=ROOT_WORDS[s.k]||[]).push(w.w); } }));
TR.forEach(w => (w.segs||[]).forEach(s => { if(s.k){ (ROOT_WORDS[s.k]=ROOT_WORDS[s.k]||[]).push(w.w); } }));
const nivIdx = n => NIVS.indexOf(n);
const inF = (w,f) => (f.m==="all"||w.m===f.m) && (f.n==="all" || (f.cum ? nivIdx(w.n)<=nivIdx(f.n) : w.n===f.n));

/* ---------- mémoire locale (Leitner) ---------- */
const KEY = "vocab-encyclo-v1";
const INTERVAL = [0,0,1,3,7,16]; // jours selon la boîte 1..5
function loadStore(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.cards) return s; }catch(e){} return {cards:{}, ex:{}}; }
function saveStore(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
function rateCard(s, id, r){
  const now = Date.now(); const c = s.cards[id] || {b:1};
  let b = c.b || 1, due;
  if(r===0){ b=1; due=now; }
  else if(r===1){ due = now + Math.max(1, INTERVAL[b])*DAY; }
  else { b = Math.min(5, b+1); due = now + INTERVAL[b]*DAY; }
  s.cards[id] = {b, due, seen:(c.seen||0)+1};
}
function markReview(s, ids){ const now=Date.now(); ids.forEach(id => { s.cards["w:"+id] = {b:1, due:now, seen:((s.cards["w:"+id]||{}).seen||0)}; }); }

/* ---------- synthèse vocale ---------- */
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="fr-FR"; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
const canSpeak = (()=>{ try{ return "speechSynthesis" in window; }catch(e){ return false; } })();

/* ---------- icônes (style Breeze, monochromes) ---------- */
const ICON = {
  accueil:"M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z",
  explorer:"M10 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM4.5 12.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM15.5 12.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM9 7.2 5.6 12.8M11 7.2l3.4 5.6M6.5 14.5h7",
  cartes:"M3.5 6.5h10v9h-10zM6.5 4.5h10v9",
  exercices:"M4 4.5h12v11H4zM7 8l1.5 1.5L12 6M7 12.5h6",
  progres:"M4 16V11M8.5 16V7M13 16V9.5M17 16V4.5M3 16.5h15",
  sound:"M4 8h3l4-3v10l-4-3H4zM13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9",
  back:"M12 5 7 10l5 5"
};
const Ico = ({n, s=18}) => html`<svg className="ico" width=${s} height=${s} viewBox="0 0 20 20" aria-hidden="true"><path d=${ICON[n]} fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>`;

/* ---------- petits composants ---------- */
const MatChip = ({m}) => html`<span className="chip"><span className="dot" style=${{background:MAT[m].c}}></span>${MAT[m].n}</span>`;
const NivChip = ({n}) => html`<span className="chip niv">${n}</span>`;
const SpeakBtn = ({t}) => canSpeak ? html`<button className="btn icon-only" title="Écouter" aria-label=${"Écouter « "+t+" »"} onClick=${e=>{e.stopPropagation(); speak(t);}}><${Ico} n="sound" s=${16}/></button>` : null;

function Seg({segs, w, hi}){
  if(!segs) return html`<span>${w}</span>`;
  let c=0;
  return html`<span className="segword">${segs.map((s,i)=> s.k
    ? html`<span key=${i} className=${"seg "+((c++)%2?"b":"a")+(hi===i?" hi":"")} title=${ROOTS[s.k][0]+" : "+ROOTS[s.k][1]}>${s.t}</span>`
    : html`<span key=${i}>${s.t}</span>`)}</span>`;
}
function RootChips({segs}){
  if(!segs) return null;
  const ks = segs.filter(s=>s.k); let c=0;
  return html`<div className="rootchips">${ks.map((s,i)=>html`<span key=${i} className=${"rootchip "+((c++)%2?"b":"a")}><b>${ROOTS[s.k][0]}</b> ${ROOTS[s.k][1]} <span className="muted">(${ROOTS[s.k][2]})</span></span>`)}</div>`;
}

function WordDetail({w, note, compact}){
  if(!w) return null;
  const r = RES_BY[w.r];
  return html`<div className=${"detail"+(compact?" compact":"")}>
    ${!compact && html`<div className="detail-head">
      <h3 className="word-big"><${Seg} segs=${w.segs} w=${w.w}/></h3><${SpeakBtn} t=${w.w}/>
      <span className="grow"></span><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/>
    </div>`}
    ${note && html`<p className="note">${note}</p>`}
    <dl className="facts">
      <dt>Définition</dt><dd>${w.d}</dd>
      <dt>En contexte</dt><dd className="ex">${w.e}</dd>
      ${w.segs && html`<${Frag}><dt>Formation</dt><dd><${RootChips} segs=${w.segs}/></dd><//>`}
      ${!compact && html`<${Frag}><dt>Réseau</dt><dd>${r.t}</dd><//>`}
    </dl>
  </div>`;
}

/* ---------- schémas (apprentissage multimédia : étiquettes posées sur l'image) ---------- */
function Lbl({x,y,id,children,anchor="start",sel,onPick,size=13,cls=""}){
  const ok = id && WBY[id];
  const act = () => ok && onPick(id);
  return html`<text x=${x} y=${y} textAnchor=${anchor} fontSize=${size}
    className=${"svlbl "+cls+(ok?" link":"")+(ok&&sel===id?" on":"")}
    tabIndex=${ok?0:undefined} role=${ok?"button":undefined}
    onClick=${ok?act:undefined} onKeyDown=${ok?(e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}}):undefined}>${children}</text>`;
}

function SchemaGlobe({sel,onPick}){
  const cx=200, cy=150, R=110, t=43.7, hw=100.9;
  return html`<svg viewBox="-20 0 580 300" className="schema" role="img" aria-label="La Terre : pôles, équateur, tropiques, hémisphères, latitude et longitude">
    <circle cx=${cx} cy=${cy} r=${R} className="sv-fill"/>
    <ellipse cx=${cx} cy=${cy} rx="55" ry=${R} className="sv-faint"/>
    <ellipse cx=${cx} cy=${cy} rx="95" ry=${R} className="sv-faint"/>
    <line x1=${cx} y1=${cy-R} x2=${cx} y2=${cy+R} className="sv-faint"/>
    <line x1=${cx-hw} y1=${cy-t} x2=${cx+hw} y2=${cy-t} className="sv-dash"/>
    <line x1=${cx-hw} y1=${cy+t} x2=${cx+hw} y2=${cy+t} className="sv-dash"/>
    <line x1=${cx-R} y1=${cy} x2=${cx+R} y2=${cy} className="sv-strong"/>
    <circle cx=${cx} cy=${cy} r=${R} className="sv-stroke"/>
    <circle cx=${cx} cy=${cy-R} r="4" className="sv-dot"/><circle cx=${cx} cy=${cy+R} r="4" className="sv-dot"/>
    <line x1=${cx} y1=${cy} x2=${cx+77.8} y2=${cy-77.8} className="sv-accent"/>
    <path d=${`M ${cx+38} ${cy} A 38 38 0 0 0 ${cx+26.9} ${cy-26.9}`} className="sv-accent"/>
    <circle cx=${cx+77.8} cy=${cy-77.8} r="4" className="sv-accentdot"/>
    <path d=${`M ${cx+4} ${cy+12} L ${cx+52} ${cy+12}`} className="sv-accent" markerEnd="url(#arr)"/>
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" className="sv-arrowhead"/></marker></defs>
    <${Lbl} x=${cx+44} y=${cy-12} id="latitude" sel=${sel} onPick=${onPick} size=${12}>latitude<//>
    <${Lbl} x=${cx+6} y=${cy+28} id="longitude" sel=${sel} onPick=${onPick} size=${12}>longitude<//>
    <line x1="80" y1="45" x2="80" y2="145" className="sv-line"/><line x1="80" y1="155" x2="80" y2="255" className="sv-line"/>
