function Home({go, pool, store}){
  const now = Date.now();
  const due = pool.filter(w => store.cards["w:"+w.id] && store.cards["w:"+w.id].due <= now).length;
  const known = pool.filter(w => (store.cards["w:"+w.id]||{}).b >= 4).length;
  const [open,setOpen] = useState(false);
  const steps = [
    ["explorer","1. Comprendre","Découvre les mots par réseaux, avec leur définition, un exemple, leur formation et un schéma quand il aide."],
    ["cartes","2. Mémoriser","Récupère chaque mot de mémoire avec les flashcards. Les cartes reviennent au bon moment (boîtes de Leitner)."],
    ["exercices","3. Manipuler","Reconnais, associe, retrouve, décompose : les exercices deviennent plus complexes d'un niveau à l'autre."],
    ["exercices","4. Utiliser","Emploie le mot dans un texte, puis dans tes propres phrases et définitions."]
  ];
  return html`<div className="page">
    <header className="page-head"><h1>Vocabulaire encyclopédique 2</h1>
      <p className="lead">Les mots des matières scolaires, du CM à la 3e, avec tous les mots des programmes de 6e et de 5e : ${W.length} mots répartis en ${RES.length} réseaux, et ${Object.keys(ROOTS).length} éléments de formation (préfixes, suffixes, racines).</p></header>

    <section className="today panel">
      <div><div className="big">${due}</div><div className="muted">cartes à revoir aujourd'hui</div></div>
      <div><div className="big">${known}<span className="small"> / ${pool.length}</span></div><div className="muted">mots bien installés (boîte 4 ou 5)</div></div>
      <div className="grow"></div>
      <button className="btn primary" onClick=${()=>go("cartes")}>Ouvrir les flashcards</button>
    </section>

    <section>
      <h2>Ce qu'on appelle vocabulaire encyclopédique</h2>
      <p className="measure">Ce sont les mots propres à chaque matière : <i>vassal</i> en histoire, <i>hypoténuse</i> en mathématiques, <i>allèle</i> en SVT. Ils s'ajoutent au vocabulaire courant et doivent être appris, car on les rencontre rarement hors de l'école. Alain Lieury a appelé « mémoire encyclopédique » le stock de ces mots et des concepts qu'ils désignent.</p>
      <div className="facts3">
        <div className="fact"><b>≈ 6 000 → 24 000</b><span>mots nouveaux dans les manuels, de la 6e à la 3e (Lieury)</span></div>
        <div className="fact"><b>11 095</b><span>entrées recensées dans les manuels du CP au CM2 (Déro et Fenouillet, 2014)</span></div>
        <div className="fact"><b>Meilleur prédicteur</b><span>de la réussite scolaire que le raisonnement ou la mémoire de travail (Lieury et coll.)</span></div>
      </div>
    </section>

    <section>
      <h2>Comment apprendre un mot</h2>
      <div className="steps">${steps.map(([r,t,d],i)=>html`<button key=${i} className="step" onClick=${()=>go(r)}><b>${t}</b><span>${d}</span></button>`)}</div>
    </section>

    <section>
      <button className="btn" aria-expanded=${open} onClick=${()=>setOpen(!open)}>${open?"Masquer":"Afficher"} les repères pour l'adulte qui accompagne</button>
      ${open && html`<div className="panel adult">
        <h3>Principes appliqués</h3>
        <ul>
          <li><b>Segmentation et pré-apprentissage</b> : un mot à la fois, des séances courtes (5 à 8 items), et la découverte des réseaux avant les exercices.</li>
          <li><b>Organisation sémantique</b> : les mots sont rangés par réseaux de notions, comme la mémoire encyclopédique s'organise (Postal et Lieury, 1998).</li>
          <li><b>Signalement</b> : préfixes, suffixes et racines sont colorés dans le mot ; le mot étudié est mis en évidence dans le schéma.</li>
          <li><b>Contiguïté spatiale et cohérence</b> : les étiquettes sont posées sur le schéma, sans légende séparée ni décoration.</li>
          <li><b>Double codage et modalité</b> : schéma explicatif quand l'image porte du sens, et lecture à voix haute du mot sur demande (synthèse vocale du navigateur).</li>
          <li><b>Exemple résolu puis estompage</b> : le niveau « Décomposer » commence par un exemple guidé ; les aides des niveaux suivants sont facultatives et coûtent des points.</li>
          <li><b>Récupération espacée</b> : les flashcards suivent cinq boîtes de Leitner (revue le jour même, puis à 1, 3, 7 et 16 jours).</li>
          <li><b>Inversion de l'effet d'expertise</b> : la correction détaillée s'ouvre seule après une erreur, et reste repliée après une bonne réponse.</li>
          <li><b>Pas de leurre pendant l'encodage</b> : les fiches et les flashcards ne montrent que la forme juste. Une erreur n'est expliquée qu'en correction, quand l'élève l'a lui-même produite.</li>
          <li><b>Pièges lexicaux</b> : comme dans le test Lexis, les QCM proposent un sens proche par le son ou la forme quand il en existe un (<i>régicide</i> / <i>insecticide</i>), sinon la définition d'autres mots du même réseau. Le barème +1 / −1 / 0 décourage les réponses au hasard.</li>
        </ul>
        <h3>À savoir</h3>
        <p className="measure">Les 56 items du QMES-E (Déro, Fenouillet et Lieury, 2019) ont été volontairement écartés du lexique, ainsi que les mots qui en sont très proches (par exemple <i>sédentaire</i>, <i>nomade</i>, <i>méridien</i>, <i>romanisation</i>, <i>branchies</i>, <i>orbite</i>, <i>fraternité</i>, <i>borne</i> d'une pile, <i>agriculture intensive</i>), pour que le questionnaire reste utilisable comme évaluation. Les mots de 6e et de 5e viennent des programmes en vigueur en 2026-2027 (et des listes de vocabulaire de cours en ligne). La progression est enregistrée dans ce navigateur uniquement.</p>
        <h3>Références</h3>
        <ul className="refs">
          <li>Lieury, A., Van Acker, P. et Durand, P. (1995). Mémoire encyclopédique et réussite en 4e et en 3e. <i>Psychologie et psychométrie</i>, 16(1) et 16(3).</li>
          <li>Lieury, A. et Lorant, S. (2013). Encyclopedic memory: long-term memory capacity for knowledge vocabulary in middle school. <i>International Journal of Educational Psychology</i>, 2(1), 56-80.</li>
          <li>Lieury, A., Lorant, S., Le Cam, M. et Rocher, T. (2013). Évaluation de la mémoire encyclopédique chez 30 000 élèves de 6e. <i>Bulletin de psychologie</i>, 66(1), 9-21.</li>
          <li>Déro, M. et Fenouillet, F. (2014). Estimation du vocabulaire encyclopédique scolaire mémorisé à l'école élémentaire. <i>Bulletin de psychologie</i>, 530, 127-141.</li>
          <li>Déro, M., Fenouillet, F. et Lieury, A. (2019). Étude préliminaire d'un test de mémoire encyclopédique chez les élèves de CM2 : le QMES-E. <i>Bulletin de psychologie</i>, 563, 347-364.</li>
          <li>Sweller, J., Ayres, P. et Kalyuga, S. (2011). <i>Cognitive Load Theory</i>. Springer.</li>
          <li>Mayer, R. E. (2021). <i>Multimedia Learning</i> (3e éd.). Cambridge University Press.</li>
        </ul>
      </div>`}

function Flashcards({pool, store, upd, f}){
  const [mode,setMode] = useState("ws");
  const rootKeys = useMemo(()=>{ const set=new Set(); (f.m==="all"&&f.n==="all"? Object.keys(ROOTS):[]).forEach(k=>set.add(k)); pool.forEach(w=>(w.segs||[]).forEach(s=>s.k&&set.add(s.k))); return [...set]; },[pool,f]);
  const deck = useMemo(()=> mode==="r" ? rootKeys.map(k=>"r:"+k) : pool.map(w=>(mode==="ws"?"w:":"s:")+w.id),[mode,pool,rootKeys]);
  const [sess,setSess] = useState(null);
  const now = Date.now();
  const due = deck.filter(id=>store.cards[id] && store.cards[id].due<=now);
  const fresh = deck.filter(id=>!store.cards[id]);
  const boxes = [0,1,2,3,4,5].map(b=>deck.filter(id=> b===0 ? !store.cards[id] : (store.cards[id]||{}).b===b).length);

  const start = () => {
    const d = [...due].sort((a,b)=>store.cards[a].due-store.cards[b].due).slice(0,20);
    const nf = Math.max(0, Math.min(8, 20-d.length));
    const q = shuffle([...d, ...shuffle(fresh).slice(0,nf)]);
    if(!q.length) return;
    setSess({q, i:0, flip:false, again:{}, res:[0,0,0]});
  };
  const flip = () => setSess(s=>s && !s.flip ? {...s, flip:true} : s);
  const rate = r => {
    if(!sess || !sess.flip) return;
    const id = sess.q[sess.i];
    upd(s=>rateCard(s,id,r));
    setSess(s=>{ const q=[...s.q]; const again={...s.again}; if(r===0 && !again[id]){ q.push(id); again[id]=1; }
      const res=[...s.res]; res[r]++; return {...s, q, again, res, i:s.i+1, flip:false}; });
  };
  useEffect(()=>{
    if(!sess || sess.i>=sess.q.length) return;
    const h = e => { if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
      if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!sess.flip) flip(); }
      else if(sess.flip && ["1","2","3"].includes(e.key)) rate(+e.key-1); };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  });

  const face = (id, back) => {
    const [p,k] = [id.slice(0,1), id.slice(2)];
    if(p==="r"){ const R=ROOTS[k];
      return back ? html`<div className="fc-back"><div className="fc-title">${R[0]} = <b>${R[1]}</b></div><p className="muted">Origine : ${R[2]}</p>
        <p>Exemples : ${(ROOT_WORDS[k]||[]).slice(0,6).join(", ")}</p></div>`
      : html`<div className="fc-front"><div className="fc-q">Que signifie cet élément ?</div><div className="fc-word mono">${R[0]}</div><p className="muted">Pense à un mot qui le contient : ${(ROOT_WORDS[k]||[])[0]||""}</p></div>`; }
    const w = WBY[k];
    if(p==="w") return back ? html`<div className="fc-back"><${WordDetail} w=${w} compact=${true}/></div>`
      : html`<div className="fc-front"><div className="fc-meta"><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/></div><div className="fc-word"><${Seg} segs=${w.segs} w=${w.w}/> <${SpeakBtn} t=${w.w}/></div><p className="muted">Dis sa définition dans ta tête ou à voix haute, puis retourne la carte.</p></div>`;
    return back ? html`<div className="fc-back"><div className="fc-word"><${Seg} segs=${w.segs} w=${w.w}/> <${SpeakBtn} t=${w.w}/></div><p className="ex">${w.e}</p><${RootChips} segs=${w.segs}/></div>`
      : html`<div className="fc-front"><div className="fc-meta"><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/></div><div className="fc-def">${w.d}</div><p className="muted">Quel est le mot ? Retrouve-le avant de retourner la carte.</p></div>`;
  };

  const MODES = [["ws","Du mot au sens"],["sw","Du sens au mot"],["r","Préfixes et racines"]];
  if(sess && sess.i < sess.q.length){
    const id = sess.q[sess.i]; const c = store.cards[id];
    return html`<div className="page narrow">
      <div className="ex-head"><button className="btn" onClick=${()=>setSess(null)}><${Ico} n="back" s=${16}/> Arrêter</button>
        <span className="grow"></span><span className="muted">Carte ${sess.i+1} / ${sess.q.length}</span>
        <span className="chip">${c? "Boîte "+c.b+" / 5" : "Nouvelle carte"}</span></div>
      <div className="progress"><div style=${{width:(sess.i/sess.q.length*100)+"%"}}></div></div>
      <div className=${"flashcard"+(sess.flip?" flipped":"")} onClick=${flip} role="button" tabIndex="0" aria-label="Carte : appuie sur Espace pour la retourner">
        ${face(id,false)}
        ${sess.flip && html`<div className="fc-sep"></div>`}
        ${sess.flip && face(id,true)}
      </div>
      ${!sess.flip ? html`<div className="fc-actions"><button className="btn primary wide" onClick=${flip}>Retourner la carte <kbd>Espace</kbd></button></div>`
       : html`<div className="fc-actions" aria-label="Évalue ta réponse">
          <button className="btn rate r0" onClick=${()=>rate(0)}><b>À revoir</b><span>je ne savais pas <kbd>1</kbd></span></button>
          <button className="btn rate r1" onClick=${()=>rate(1)}><b>Difficile</b><span>j'ai hésité <kbd>2</kbd></span></button>
          <button className="btn rate r2" onClick=${()=>rate(2)}><b>Je savais</b><span>sans hésiter <kbd>3</kbd></span></button></div>`}
    </div>`;
  }

    <header className="page-head"><h1>Flashcards</h1><p className="lead">Retrouver un mot de mémoire, plutôt que le relire, est ce qui l'installe durablement. Chaque carte passe dans une boîte plus haute quand tu la sais, et revient plus tard.</p></header>
    ${sess && html`<div className="panel done"><b>Séance terminée.</b> ${sess.res[2]} « je savais », ${sess.res[1]} « difficile », ${sess.res[0]} « à revoir ».</div>`}
    <div className="seg-ctl" role="tablist">${MODES.map(([k,t])=>html`<button key=${k} role="tab" aria-selected=${mode===k} className=${mode===k?"on":""} onClick=${()=>{setMode(k); setSess(null);}}>${t}</button>`)}</div>
    <div className="panel">
      <div className="today"><div><div className="big">${due.length}</div><div className="muted">à revoir maintenant</div></div>
        <div><div className="big">${fresh.length}</div><div className="muted">nouvelles cartes</div></div><div className="grow"></div>
        <button className="btn primary" disabled=${!due.length && !fresh.length} onClick=${start}>Commencer la séance (${Math.min(20,due.length)+Math.max(0,Math.min(8,20-Math.min(20,due.length),fresh.length))} cartes)</button></div>
      <h3 className="h-sub">Répartition dans les boîtes</h3>
      <${BoxBar} counts=${boxes}/>
      ${!due.length && !fresh.length && html`<p className="muted">Rien à revoir pour l'instant dans ce paquet. Reviens demain, ou change de filtre.</p>`}
    </div>
    <p className="muted small">Une séance compte au plus 20 cartes, dont 8 nouvelles, pour garder une charge raisonnable. Une carte « à revoir » repasse une fois en fin de séance.</p>
  </div>`;
}
function BoxBar({counts}){
  const tot = counts.reduce((a,b)=>a+b,0)||1;

  return html`<div><div className="boxbar">${counts.map((c,i)=> c? html`<div key=${i} className=${"bx bx"+i} style=${{width:(c/tot*100)+"%"}} title=${lab[i]+" : "+c}></div>`:null)}</div>
    <div className="boxlegend">${counts.map((c,i)=>html`<span key=${i}><i className=${"sw bx"+i}></i>${lab[i]} <b>${c}</b></span>`)}</div></div>`;
}

function MatchEx({pool, onDone}){

    const rich = shuffle(Object.values(byR).filter(a=>a.length>=5));
    const out = [];
    for(let b=0;b<2;b++){ if(rich[b]) out.push(sample(rich[b],5)); else { const rest=pool.filter(w=>!out.flat().includes(w)); if(rest.length>=3) out.push(sample(rest,Math.min(5,rest.length))); } }
    return out;

        <select id="f-mat" value=${f.m} onChange=${e=>setF({...f,m:e.target.value})}><option value="all">Toutes les matières</option>${Object.keys(MAT).map(m=>html`<option key=${m} value=${m}>${MAT[m].n}</option>`)}</select>
        <label htmlFor="f-niv" className="sr">Niveau</label>
        <select id="f-niv" value=${f.n} onChange=${e=>setF({...f,n:e.target.value})}><option value="all">Tous les niveaux</option>${NIVS.map(n=>html`<option key=${n} value=${n}>${f.cum?"Jusqu'au ":"Seulement "}${n}</option>`)}</select>
        <label className="cb" htmlFor="f-cum"><input type="checkbox" id="f-cum" checked=${f.cum} onChange=${e=>setF({...f,cum:e.target.checked})}/> niveaux précédents</label>
        <span className="chip count-chip">${pool.length} mots</span>
      </div>
    </header>
    <div className="body">
      <nav className="side" aria-label="Sections">${NAV.map(([k,t])=>html`<button key=${k} className=${"navitem"+(route===k?" on":"")} aria-current=${route===k?"page":undefined} onClick=${()=>go(k)}><${Ico} n=${k}/><span>${t}</span></button>`)}</nav>
      <main className="main" id="main">${page}</main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

</script>
</body>
</html>
