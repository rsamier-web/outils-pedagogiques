<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dossier Fahrenheit 451</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : fenêtre d'application KDE (barre d'outils + panneau latéral « Configuration du système » + vue de contenu).
   Codes couleur fixes : passé = violet, présent = orange (le feu), avenir = vert (la renaissance). */
:root{
  --window:#eff0f1; --view:#fcfcfc; --alt:#f4f5f6; --button:#fcfcfc;
  --text:#232629; --muted:#5f6670; --border:#c4c8cc; --border-soft:#dcdfe2;
  --accent:#3daee9; --accent-strong:#1f7fb8; --accent-tint:rgba(61,174,233,.13); --accent-line:rgba(61,174,233,.55);
  --positive:#27ae60; --positive-tint:rgba(39,174,96,.11);
  --neutral:#e06b00; --neutral-tint:rgba(246,116,0,.11);
  --negative:#da4453; --negative-tint:rgba(218,68,83,.10);
  --past:#8e5bb5; --present:#e06b00; --future:#239a55;
  --shadow:0 1px 2px rgba(35,38,41,.08),0 4px 14px rgba(35,38,41,.08);
  --f-ui:"Noto Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --f-read:"Noto Serif",Georgia,"Times New Roman",serif;
  --f-mono:"Noto Sans Mono",ui-monospace,"DejaVu Sans Mono",Menlo,monospace;
  --scale:1; --lh:1.62;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --window:#202326; --view:#141618; --alt:#1b1d20; --button:#292c30;
  --text:#fcfcfc; --muted:#a1a9b1; --border:#3d4247; --border-soft:#2c3035;
  --accent:#3daee9; --accent-strong:#5cbcf0; --accent-tint:rgba(61,174,233,.16); --accent-line:rgba(61,174,233,.6);
  --positive:#3ccf7d; --positive-tint:rgba(39,174,96,.16);
  --neutral:#ff9a3c; --neutral-tint:rgba(246,116,0,.16);
  --negative:#ef6b78; --negative-tint:rgba(218,68,83,.17);
  --past:#b58ad8; --present:#ff9a3c; --future:#3ccf7d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --window:#202326; --view:#141618; --alt:#1b1d20; --button:#292c30;
  --text:#fcfcfc; --muted:#a1a9b1; --border:#3d4247; --border-soft:#2c3035;
  --accent:#3daee9; --accent-strong:#5cbcf0; --accent-tint:rgba(61,174,233,.16); --accent-line:rgba(61,174,233,.6);
  --positive:#3ccf7d; --positive-tint:rgba(39,174,96,.16);
  --neutral:#ff9a3c; --neutral-tint:rgba(246,116,0,.16);
  --negative:#ef6b78; --negative-tint:rgba(218,68,83,.17);
  --past:#b58ad8; --present:#ff9a3c; --future:#3ccf7d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{font-size:calc(16px * var(--scale))}
body{background:var(--window);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:var(--lh);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--window)}
body.airy{--lh:1.9;letter-spacing:.012em;word-spacing:.06em}
*{box-sizing:border-box}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
p{margin:0}
a{color:var(--accent-strong)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Barre d'outils */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--window);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding-block:10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toolbar .appicon{width:30px;height:30px;flex:none}
.toolbar .ttl{display:flex;flex-direction:column;min-width:0;flex:1}
.toolbar .ttl b{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .ttl span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--button);border:1px solid var(--border);border-radius:3px;padding:5px 10px;cursor:pointer;font-size:.86rem;line-height:1.3;min-height:32px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-line)}
.btn.icon{padding:5px 8px}
.btn svg{width:16px;height:16px;flex:none}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg .btn:last-child{border-radius:0 3px 3px 0}

/* Disposition principale */
.shell{max-width:1240px;margin:18px auto 0;display:grid;grid-template-columns:262px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--view);border:1px solid var(--border);border-radius:5px;padding:8px;max-height:calc(100vh - 96px);overflow:auto}
.side .grp{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.side .grp:first-child{padding-top:4px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:7px 10px;cursor:pointer;font-size:.92rem}
.navitem:hover{background:var(--accent-tint)}
.navitem[aria-current="page"]{background:var(--accent-tint);border-color:var(--accent-line);font-weight:600}
.navitem svg{width:18px;height:18px;flex:none;color:var(--muted)}
.navitem[aria-current="page"] svg{color:var(--accent-strong)}
.navitem .lbl{flex:1;min-width:0}
.navitem .done{width:16px;height:16px;flex:none;color:var(--positive)}
.progress{margin:12px 10px 6px;font-size:.78rem;color:var(--muted)}
.bar{height:4px;background:var(--border-soft);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

.view{background:var(--view);border:1px solid var(--border);border-radius:5px;min-width:0;padding:28px clamp(16px,4vw,44px) 36px}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);font-weight:600;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .time{color:var(--muted);font-family:var(--f-mono);letter-spacing:0;text-transform:none;font-weight:400}
.view h1{font-size:clamp(1.55rem,3vw,2rem);font-weight:600;margin-bottom:10px}
.lede{font-size:1.06rem;color:var(--muted);max-width:68ch;margin-bottom:22px}
.view h2{font-size:1.28rem;font-weight:600;margin:34px 0 12px;padding-top:16px;border-top:1px solid var(--border-soft)}
.view h2:first-of-type{border-top:0;padding-top:0}
.view h3{font-size:1.06rem;font-weight:600;margin:20px 0 8px}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:12px}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.frame{border:1px solid var(--border);border-radius:5px;background:var(--view);padding:14px 16px;min-width:0}
.frame.alt{background:var(--alt)}
.frame h3{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--f-mono);font-size:.82rem}

/* Champs de type « fiche » */
.kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:6px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.86rem;padding-top:2px}
.kv dd{margin:0}

/* Messages KDE */
.msg{display:flex;gap:12px;border:1px solid var(--accent-line);background:var(--accent-tint);border-radius:4px;padding:11px 14px;max-width:72ch}
.msg svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--accent-strong)}
.msg .mt{font-weight:600;display:block;margin-bottom:2px}
.msg.pos{border-color:color-mix(in srgb,var(--positive) 55%,transparent);background:var(--positive-tint)}
.msg.pos svg{color:var(--positive)}
.msg.warn{border-color:color-mix(in srgb,var(--neutral) 55%,transparent);background:var(--neutral-tint)}
.msg.warn svg{color:var(--neutral)}
.msg.neg{border-color:color-mix(in srgb,var(--negative) 55%,transparent);background:var(--negative-tint)}
.msg.neg svg{color:var(--negative)}
.msg > div{min-width:0}

/* Citations */
blockquote{margin:0;padding:2px 0 2px 16px;border-left:3px solid var(--present);font-family:var(--f-read);font-size:1.02rem;max-width:68ch}
blockquote cite{display:block;font-family:var(--f-ui);font-style:normal;font-size:.8rem;color:var(--muted);margin-top:6px}
blockquote.calm{border-left-color:var(--border)}

/* Terme du glossaire */
.term{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px}
.term:hover{color:var(--accent-strong)}
.pop{position:fixed;z-index:60;width:min(360px,calc(100vw - 32px));background:var(--view);border:1px solid var(--border);border-radius:5px;box-shadow:var(--shadow);padding:13px 15px;font-size:.92rem;line-height:1.5}
.pop h4{font-size:1rem;margin-bottom:4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pop .cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.pop .ex{margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);font-size:.86rem}
.pop .ex b{font-weight:600}
.pop .acts{display:flex;justify-content:space-between;margin-top:10px;gap:8px}

/* Tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:5px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--border-soft)}
thead th{background:var(--alt);font-weight:600;font-size:.84rem}
tbody tr:nth-child(even) td{background:var(--alt)}
tbody tr:last-child td{border-bottom:0}
th[scope="row"]{font-weight:600;background:var(--alt)}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:16px;scrollbar-width:thin}
.tab{background:none;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;padding:8px 14px;cursor:pointer;white-space:nowrap;font-size:.9rem;color:var(--muted);margin-bottom:-1px}
.tab:hover{color:var(--text);background:var(--accent-tint)}
.tab[aria-selected="true"]{color:var(--text);background:var(--view);border-color:var(--border);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}

/* Repliable */
details.fold{border:1px solid var(--border);border-radius:5px;background:var(--view)}
details.fold > summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details.fold[open] > summary::before{transform:rotate(45deg)}
details.fold > summary .tag{margin-left:auto}
details.fold > .in{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}

.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:1px 8px;border-radius:10px;border:1px solid var(--border);color:var(--muted);background:var(--alt);white-space:nowrap}
.tag.past{color:var(--past);border-color:color-mix(in srgb,var(--past) 50%,transparent)}
.tag.present{color:var(--present);border-color:color-mix(in srgb,var(--present) 50%,transparent)}
.tag.future{color:var(--future);border-color:color-mix(in srgb,var(--future) 50%,transparent)}
.tag.acc{color:var(--accent-strong);border-color:var(--accent-line);background:var(--accent-tint)}

/* Frise */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:62px;top:6px;bottom:6px;width:2px;background:var(--border-soft)}
.timeline li{display:grid;grid-template-columns:52px 22px minmax(0,1fr);gap:0 0;padding:6px 0}
.timeline .yr{font-family:var(--f-mono);font-size:.84rem;font-weight:500;text-align:right;padding-right:6px;padding-top:1px}
.timeline .dot{width:12px;height:12px;border-radius:50%;margin:5px 0 0 5px;border:2px solid var(--view);box-shadow:0 0 0 1px var(--border);z-index:1}
.timeline .ev{min-width:0}
.timeline .ev b{font-weight:600}
.timeline li.hl .ev{background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:4px;padding:6px 10px;margin-top:-4px}

/* Étapes */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{border:1px solid var(--border);border-radius:5px;padding:10px 12px;background:var(--alt);position:relative;font-size:.9rem}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:.74rem;color:var(--accent-strong);font-weight:600;display:block;margin-bottom:2px}
.steps li b{display:block;font-weight:600;margin-bottom:2px}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .node{border:1px solid var(--border);background:var(--alt);border-radius:4px;padding:8px 11px;font-size:.88rem;flex:1 1 140px;min-width:0}
.flow .node b{display:block;font-size:.82rem;color:var(--present)}
.flow .arr{align-self:center;color:var(--muted);font-size:1.1rem}

.time3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.time3 > div{border:1px solid var(--border);border-top-width:4px;border-radius:5px;padding:12px 14px;background:var(--view)}
.time3 .p{border-top-color:var(--past)} .time3 .n{border-top-color:var(--present)} .time3 .f{border-top-color:var(--future)}
.time3 h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.time3 .p h4{color:var(--past)} .time3 .n h4{color:var(--present)} .time3 .f h4{color:var(--future)}
.time3 .big{font-weight:600;font-size:1.05rem;margin-bottom:4px}

/* Personnages */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.char h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.char .role{font-size:.82rem;color:var(--muted);font-weight:400}
.char .fw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.char .fw div{font-size:.88rem}
.char .fw b{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.char .fw .s b{color:var(--positive)} .char .fw .w b{color:var(--negative)}
.char ul{margin:4px 0 0;padding-left:1.2em;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.char .meaning{font-size:.86rem;border-top:1px solid var(--border-soft);padding-top:8px;margin-top:10px;color:var(--muted)}

/* Correspondances roman / aujourd'hui */
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.pair > div{padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pair > div:first-child{background:var(--alt);border-right:1px solid var(--border)}
.pair h4{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pair ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:7px;font-size:.94rem}
.src{font-size:.76rem;color:var(--muted)}
.src a{color:var(--muted)}

/* Quiz */
.check{border:1px solid var(--accent-line);border-radius:5px;padding:16px 18px;margin-top:30px;background:var(--accent-tint)}
.check h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}
.check h3 svg{width:18px;height:18px;color:var(--accent-strong)}
.q{margin-top:14px}
.q p.qt{font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--view);border:1px solid var(--border);border-radius:4px;padding:8px 12px;cursor:pointer;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:2px}
.opt.ok{border-color:var(--positive);background:var(--positive-tint)}
.opt.ko{border-color:var(--negative);background:var(--negative-tint)}
.opt[disabled]{cursor:default}
.why{margin-top:8px;font-size:.9rem;padding:8px 12px;border-left:3px solid var(--positive);background:var(--view)}
.why.bad{border-left-color:var(--negative)}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:16px;border-top:1px solid var(--border-soft);flex-wrap:wrap;align-items:center}
.pager .btn{min-height:38px}

/* Glossaire */
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:3px;background:var(--view);padding:0 10px;min-height:36px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint)}
.search input{border:0;background:none;outline:0;font:inherit;color:inherit;flex:1;min-width:0;padding:6px 0}
.search svg{width:16px;height:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gl{display:flex;flex-direction:column;gap:0;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.gitem{padding:13px 16px;border-bottom:1px solid var(--border-soft);display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:6px 18px}
.gitem:last-child{border-bottom:0}
.gitem:nth-child(even){background:var(--alt)}
.gitem.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}
.gitem .w{font-weight:600}
.gitem .w .tag{margin-top:4px}
.gitem .ex{font-size:.88rem;margin-top:5px;color:var(--muted)}
.gitem .ex b{color:var(--text);font-weight:600}
.reveal{background:none;border:1px dashed var(--border);border-radius:4px;padding:6px 10px;cursor:pointer;color:var(--muted);text-align:left;width:100%}
.letter{font-family:var(--f-mono);font-size:.8rem;color:var(--accent-strong);background:var(--alt);padding:4px 16px;border-bottom:1px solid var(--border-soft);font-weight:600}

/* Œuvres en écho */
.work .meta{font-size:.82rem;color:var(--muted);margin:2px 0 8px}
.work .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px}
.work .row > div{font-size:.9rem;border-top:2px solid var(--border-soft);padding-top:6px}
.work .row b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}

.worked{border:1px solid var(--border);border-radius:5px;padding:16px 18px;font-family:var(--f-read);line-height:1.75;max-width:72ch}
.worked .seg-t{font-family:var(--f-ui);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:3px;margin-right:4px;vertical-align:2px;white-space:nowrap}
.st1{background:var(--accent-tint);color:var(--accent-strong)} .st2{background:var(--neutral-tint);color:var(--neutral)} .st3{background:var(--positive-tint);color:var(--positive)} .st4{background:color-mix(in srgb,var(--past) 16%,transparent);color:var(--past)} .st5{background:var(--negative-tint);color:var(--negative)}

svg text{font-family:var(--f-ui)}
.figure{border:1px solid var(--border);border-radius:5px;padding:12px;background:var(--view);max-width:100%;overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;min-width:520px}
.figcap{font-size:.8rem;color:var(--muted);margin-top:6px}

/* Petits écrans */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:6px;scrollbar-width:thin}
  .side .grp,.side .progress{display:none}
  .navitem{width:auto;white-space:nowrap;flex:none;padding:6px 10px}
  .pair{grid-template-columns:minmax(0,1fr)}
  .pair > div:first-child{border-right:0;border-bottom:1px solid var(--border)}
  .time3{grid-template-columns:minmax(0,1fr)}
  .gitem{grid-template-columns:minmax(0,1fr)}
  .work .row{grid-template-columns:minmax(0,1fr)}
  .toolbar .ttl span{display:none}
}
@media (max-width:520px){
  .tools .hide-s{display:none}
  .char .fw{grid-template-columns:1fr}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{padding-top:6px}
}
</style>
<script>
/* ====== GLOSSAIRE ======
   m = mot, c = catégorie, d = définition simple, e = exemple dans le roman, a = exemple aujourd'hui */
const CATS = {
  roman:{l:"Mots du roman"}, lit:{l:"Littérature"}, hist:{l:"Histoire"}, pol:{l:"Politique & société"}, med:{l:"Médias & numérique"}, cog:{l:"Pensée & apprentissage"}
};
const GLOSS = {
  "mur-ecran":{m:"Murs-écrans",c:"roman",d:"Écrans géants qui couvrent les murs du salon et diffusent des émissions en continu. Mildred en possède trois et rêve d'un quatrième.",e:"« Ça ne représente que deux mille dollars », dit Mildred pour obtenir le quatrième mur.",a:"On peut penser aux écrans qui nous entourent : télévision, ordinateur, téléphone."},
  "famille":{m:"La « famille »",c:"roman",d:"Nom donné aux personnages des émissions des murs-écrans. Les spectateurs ont l'impression de faire partie de leur vie.",e:"Mildred préfère la « famille » de l'écran à son vrai mari.",a:"Voir [[parasocial]]."},
  "coquillage":{m:"Coquillages (radio-coquillages)",c:"roman",d:"Minuscules écouteurs-radio que les personnages gardent dans les oreilles jour et nuit. Il n'y a donc jamais de silence.",e:"Mildred dort avec ses coquillages : « un océan électronique de bruit, de musique et de paroles » bat sans cesse le rivage de son esprit.",a:"Les écouteurs sans fil portés toute la journée."},
  "limier":{m:"Limier mécanique",c:"roman",d:"Robot à huit pattes de la caserne. Il retrouve une personne grâce à son odeur et lui injecte un produit anesthésiant (procaïne ou morphine).",e:"Le Limier traque Montag après sa fuite ; il rappelle Cerbère, le chien gardien des Enfers.",a:"Il fait penser aux drones et à la reconnaissance automatique."},
  "pompier":{m:"Pompier",c:"roman",d:"Dans le roman, les pompiers n'éteignent plus les incendies : les maisons sont ininflammables. Ils brûlent les livres et les maisons de ceux qui en cachent.",e:"Leur règlement prétend que le premier pompier fut Benjamin Franklin, en 1790. C'est faux, mais personne ne peut plus le vérifier.",a:null},
  "dystopie":{m:"Dystopie",c:"lit",d:"Récit qui imagine une société future cauchemardesque, souvent contrôlée et privée de liberté. C'est le contraire d'une [[utopie]].",e:"La société de Montag interdit les livres et endort les gens avec des écrans.",a:"Les épisodes de *Black Mirror* sont de courtes dystopies sur nos technologies."},
  "utopie":{m:"Utopie",c:"lit",d:"Récit qui décrit une société idéale. Le mot, inventé par Thomas More (1516), signifie en grec « lieu qui n'existe nulle part ».",e:"Pour Beatty, sa société est presque une utopie : tout le monde est « heureux ».",a:"Certaines publicités décrivent un futur parfait grâce à la technologie."},
  "anticipation":{m:"Roman d'anticipation",c:"lit",d:"Récit qui imagine l'avenir en prolongeant des tendances du présent.",e:"Bradbury part de la télévision des années 1950 et imagine des murs entiers d'écrans.",a:"Des romans actuels imaginent l'avenir du climat ou de l'IA."},
  "sf":{m:"Science-fiction",c:"lit",d:"Genre qui raconte des événements imaginaires rendus possibles par la science ou la technique, souvent dans le futur.",e:"Le Limier mécanique et les maisons ininflammables sont des éléments de science-fiction.",a:"*Dune*, *Star Wars*, *Black Mirror*."},
  "avertissement":{m:"Récit d'avertissement",c:"lit",d:"Récit qui pousse un danger du présent à l'extrême pour mettre le lecteur en garde. Le but n'est pas de prédire, mais de prévenir.",e:"Bradbury a écrit son roman pour que ce monde ne devienne jamais réalité.",a:"La logique « si on continue comme ça, voilà où on va »."},
  "allegorie":{m:"Allégorie",c:"lit",d:"Histoire ou image concrète qui représente une idée abstraite.",e:"Le [[phenix]] qui renaît de ses cendres représente l'humanité qui se reconstruit.",a:"Une balance pour représenter la justice."},
  "caverne":{m:"Allégorie de la caverne",c:"lit",d:"Récit du philosophe grec Platon (*La République*, livre VII). Des prisonniers enchaînés prennent des ombres projetées sur un mur pour la réalité. L'un d'eux sort, découvre le soleil, revient… et les autres refusent de le croire.",e:"Mildred devant ses murs-écrans ressemble aux prisonniers ; Montag est celui qui sort. Le roman parle d'ailleurs de « cavernes électriques ».",a:"Croire tout ce que montre son fil d'actualité, c'est un peu regarder les ombres sur la paroi."},
  "metaphore":{m:"Métaphore",c:"lit",d:"Image qui rapproche deux réalités sans mot de comparaison (sans « comme »).",e:"Le lance-flammes est un « python géant qui crachait son venin de pétrole ».",a:"« Un océan d'informations »."},
  "symbole":{m:"Symbole",c:"lit",d:"Objet, animal, couleur ou geste qui représente une idée.",e:"La [[salamandre]] est le symbole des pompiers ; le [[phenix]], celui de la renaissance.",a:"La colombe pour la paix."},
  "protagoniste":{m:"Protagoniste / antagoniste",c:"lit",d:"Le protagoniste est le personnage principal ; l'antagoniste est celui qui s'oppose à lui.",e:"Montag est le protagoniste ; le capitaine Beatty est son antagoniste.",a:"Dans un film de super-héros, le « méchant » est l'antagoniste."},
  "apprentissage":{m:"Roman d'apprentissage",c:"lit",d:"Roman qui suit la transformation d'un personnage : il apprend, change de regard sur le monde et devient quelqu'un d'autre.",e:"Montag passe de l'homme qui brûle sans réfléchir à l'homme qui lit, doute et se souvient.",a:"La saga *Harry Potter* suit elle aussi la transformation de son héros."},
  "denouement":{m:"Dénouement",c:"lit",d:"Fin d'un récit, moment où la situation se résout.",e:"La ville est détruite par une bombe ; Montag et les hommes-livres partent la reconstruire.",a:null},
  "incipit":{m:"Incipit",c:"lit",d:"Première phrase ou premières lignes d'un roman. Il installe le ton et le monde du récit.",e:"« Le plaisir d'incendier ! » : dès la première ligne, le feu est un plaisir, pas un danger.",a:null},
  "epigraphe":{m:"Épigraphe",c:"lit",d:"Courte citation placée au début d'un livre pour en annoncer le sens.",e:"« Si l'on vous donne du papier réglé, écrivez de l'autre côté » (Juan Ramón Jiménez) : une invitation à ne pas suivre les lignes imposées.",a:null},
  "intertextualite":{m:"Intertextualité",c:"lit",d:"Présence d'autres textes dans un texte : citations, allusions, réécritures.",e:"Le roman cite la Bible, le poème *La Plage de Douvres* de Matthew Arnold, Swift, Marc Aurèle, Platon…",a:"Un rappeur qui reprend un vers de Baudelaire."},
  "ironie":{m:"Ironie",c:"lit",d:"Décalage entre ce qu'on attend et ce qui se passe réellement, ou entre ce qu'on dit et ce qu'on pense.",e:"Les pompiers allument les feux au lieu de les éteindre.",a:"De 1967 à 1979, une édition scolaire de *Fahrenheit 451*… avait été censurée par l'éditeur."},
  "hommes-livres":{m:"Hommes-livres",c:"lit",d:"Dans le roman, marginaux qui ont appris chacun un livre par cœur pour le sauver de l'oubli.",e:"Montag devient « le livre de l'Ecclésiaste ».",a:"Les archives et bibliothèques numériques jouent un rôle proche : conserver la mémoire."},
  "ecclesiaste":{m:"Ecclésiaste",c:"lit",d:"Livre de la Bible qui médite sur le temps et la fragilité des choses humaines.",e:"Montag s'en souvient à la fin : « Temps d'abattre et temps de bâtir. »",a:null},
  "phenix":{m:"Phénix",c:"lit",d:"Oiseau légendaire qui meurt dans les flammes et renaît de ses cendres. Symbole de renaissance.",e:"Il est brodé sur l'uniforme des pompiers ; Granger s'en sert pour parler de l'humanité qui se relève.",a:"On dit d'une ville reconstruite après une catastrophe qu'elle renaît « comme le phénix »."},
  "salamandre":{m:"Salamandre",c:"lit",d:"Petit amphibien réel ; dans les légendes, animal capable de vivre dans le feu sans brûler.",e:"Les pompiers portent une salamandre sur la manche ; le titre de la 1re partie est « Le foyer et la salamandre ».",a:null},
  "autodafe":{m:"Autodafé",c:"hist",d:"Destruction publique de livres par le feu. À l'origine (« acte de foi » en portugais), le mot désignait l'exécution d'hérétiques par l'Inquisition.",e:"Chaque intervention des pompiers est un autodafé.",a:"Le 10 mai 1933, les nazis brûlent des milliers de livres à Berlin."},
  "maccarthysme":{m:"Maccarthysme",c:"hist",d:"Campagne de soupçons et d'accusations contre les communistes réels ou supposés aux États-Unis (environ 1950-1954), du nom du sénateur Joseph McCarthy. On parle aussi de « chasse aux sorcières ».",e:"La délation encouragée dans le roman (Mildred dénonce son mari) rappelle ce climat.",a:"On parle encore de « chasse aux sorcières » quand on accuse sans preuves."},
  "liste-noire":{m:"Liste noire",c:"hist",d:"Liste de personnes qu'on surveille ou qu'on refuse d'employer à cause de leurs idées.",e:"Les McClellan, la famille de Clarisse, ont « un dossier » chez les pompiers.",a:"Dans les années 1950, des scénaristes d'Hollywood ne peuvent plus travailler sous leur nom."},
  "guerre-froide":{m:"Guerre froide",c:"hist",d:"Rivalité entre les États-Unis et l'URSS (1947-1991), sans guerre directe entre eux, mais avec une course aux armes nucléaires et une forte propagande.",e:"Des bombardiers passent sans cesse au-dessus de la ville ; la guerre éclate et se termine en quelques secondes.",a:null},
  "bombe":{m:"Bombe atomique / bombe H",c:"hist",d:"Armes capables de détruire une ville entière. La bombe atomique est utilisée en 1945 sur Hiroshima et Nagasaki ; la bombe H, encore plus puissante, est testée par les États-Unis (1952) puis par l'URSS (1953).",e:"À la fin, la ville de Montag est rasée en un instant.",a:null},
  "culture-masse":{m:"Culture de masse",c:"hist",d:"Produits culturels (films, émissions, magazines) fabriqués pour plaire au plus grand nombre, souvent simplifiés.",e:"Beatty explique que les livres se sont « nivelés par le bas, normalisés en une vaste soupe ».",a:"Les contenus courts qui cherchent à faire des millions de vues."},
  "condense":{m:"Condensé (digest)",c:"hist",d:"Version raccourcie d'un livre ou d'un article. Dans les années 1950, le magazine *Reader's Digest* vend des livres condensés par millions.",e:"« Condensés de condensés. Condensés de condensés de condensés. » (Beatty)",a:"Le résumé d'un roman produit en dix secondes par une [[ia-generative|IA générative]]."},
  "renaissance":{m:"Renaissance",c:"hist",d:"Période européenne (XIVe-XVIe siècle) de redécouverte des textes de l'Antiquité, marquée par l'[[humanisme]] et l'imprimerie. Les historiens rappellent qu'elle naît des crises de la fin du Moyen Âge.",e:"Les hommes-livres qui sauvent des textes rappellent les humanistes qui recopiaient des manuscrits anciens.",a:null},
  "humanisme":{m:"Humanisme",c:"hist",d:"Mouvement intellectuel de la Renaissance qui place l'être humain, son éducation et sa dignité au centre de la réflexion.",e:"Faber, ancien professeur de lettres, est une sorte d'humaniste caché.",a:null},
  "censure":{m:"Censure",c:"pol",d:"Contrôle ou interdiction d'un texte, d'une image ou d'une idée par une autorité.",e:"Tous les livres sont interdits par la loi.",a:"Retirer un livre des bibliothèques scolaires est une forme de censure."},
  "autocensure":{m:"Autocensure",c:"pol",d:"Fait de se censurer soi-même : ne pas dire ou ne pas écrire quelque chose par peur des réactions.",e:"Faber a vu le danger venir mais, dit-il, « je n'ai pas parlé ».",a:"Ne pas donner son avis en ligne par peur du harcèlement."},
  "totalitarisme":{m:"Totalitarisme",c:"pol",d:"Régime qui veut contrôler toute la vie des individus : la politique, mais aussi la pensée, les loisirs, la vie privée.",e:"Dans *1984*, le Parti surveille chaque geste grâce aux télécrans.",a:"Les régimes nazi et stalinien sont les exemples historiques classiques."},
  "propagande":{m:"Propagande",c:"pol",d:"Messages diffusés pour imposer une idée ou un pouvoir, en jouant sur les émotions plus que sur les preuves.",e:"La fausse capture de Montag, filmée en direct, rassure le public.",a:null},
  "democratie-liberale":{m:"Démocratie libérale",c:"pol",d:"Régime où l'on vote librement, et où des libertés (presse, expression, justice indépendante) protègent chacun, y compris les minorités et l'opposition.",e:"La société du roman a gardé les élections, mais plus la liberté de penser.",a:"La Belgique est une démocratie libérale : la presse peut critiquer le gouvernement."},
  "democratie-illiberale":{m:"Démocratie illibérale",c:"pol",d:"Régime où les élections continuent, mais où le pouvoir affaiblit les contre-pouvoirs : justice, médias, universités, associations. Le mot est popularisé par le journaliste Fareed Zakaria en 1997.",e:"On vote encore pour le « Président Noble »… parce qu'il est grand et beau.",a:"En 2014, le Premier ministre hongrois Viktor Orbán déclare vouloir bâtir un « État illibéral »."},
  "autocratie-electorale":{m:"Autocratie électorale",c:"pol",d:"Régime où il y a des élections, mais pas vraiment libres et équitables (médias contrôlés, opposants gênés).",e:null,a:"En 2022, le Parlement européen qualifie la Hongrie de « régime hybride d'autocratie électorale »."},
  "etat-de-droit":{m:"État de droit",c:"pol",d:"Situation où tout le monde, même le gouvernement, doit respecter la loi, sous le contrôle de juges indépendants.",e:"Les pompiers sont à la fois « censeurs, juges et bourreaux » : il n'y a plus d'État de droit.",a:null},
  "pluralisme":{m:"Pluralisme",c:"pol",d:"Existence de plusieurs opinions, partis et médias différents, qui peuvent s'exprimer librement.",e:"Beatty : « proposez-lui-en un seul. Mieux encore, ne lui en proposez aucun. »",a:"Plusieurs journaux d'opinions différentes dans un même pays."},
  "tyrannie-majorite":{m:"Tyrannie de la majorité",c:"pol",d:"Idée d'Alexis de Tocqueville (*De la démocratie en Amérique*, 1835-1840) : en démocratie, la majorité peut écraser ceux qui pensent autrement, même sans violence. Tocqueville parle aussi d'un « despotisme doux » qui rend les citoyens passifs.",e:"Ce n'est pas un dictateur, mais la pression de tous qui a fait disparaître les livres.",a:null},
  "conformisme":{m:"Conformisme",c:"pol",d:"Fait d'adopter les idées et les comportements du groupe pour ne pas se faire remarquer.",e:"Clarisse est jugée « insociable » parce qu'elle marche et pose des questions.",a:"Suivre une tendance en ligne parce que tout le monde la suit."},
  "dissident":{m:"Dissident",c:"pol",d:"Personne qui s'oppose ouvertement au pouvoir ou aux idées dominantes.",e:"Faber et les hommes-livres sont des dissidents.",a:null},
  "delation":{m:"Délation",c:"pol",d:"Fait de dénoncer quelqu'un aux autorités, souvent en secret.",e:"Mildred donne l'alarme contre son propre mari.",a:null},
  "ia-generative":{m:"IA générative",c:"med",d:"Programme d'intelligence artificielle qui produit du texte, des images ou des sons à partir d'une demande (un « prompt »). Il calcule des suites probables à partir d'immenses quantités d'exemples ; il ne « comprend » pas comme un humain.",e:"Les murs-écrans fabriquent un monde sur mesure pour chaque spectateur.",a:"ChatGPT, rendu public en novembre 2022."},
  "hallucination":{m:"Hallucination (d'une IA)",c:"med",d:"Erreur d'une IA générative qui invente une information fausse et la présente avec assurance.",e:null,a:"Une IA qui cite un livre ou un article qui n'existe pas."},
  "algorithme":{m:"Algorithme de recommandation",c:"med",d:"Programme qui choisit ce que l'on voit sur une plateforme (vidéos, publications) selon ce qui retient notre attention.",e:"Les murs-écrans décident de ce que la « famille » montre à Mildred.",a:"Le fil « Pour toi » d'une application vidéo."},
  "bulle":{m:"Bulle de filtre / chambre d'écho",c:"med",d:"Situation où l'on ne voit plus que des contenus qui confirment nos goûts et nos opinions, parce que l'algorithme et notre entourage les sélectionnent.",e:"Mildred et ses amies ne rencontrent jamais une idée qui les dérange.",a:null},
  "attention-eco":{m:"Économie de l'attention",c:"med",d:"Modèle économique où les plateformes gagnent de l'argent en captant le plus longtemps possible notre attention (pour afficher de la publicité).",e:"Le métro diffuse sans arrêt la publicité « Dentifrice Denham ».",a:"Notifications et défilement infini sont conçus pour nous retenir."},
  "defilement":{m:"Défilement infini",c:"med",d:"Fil de contenus qui ne s'arrête jamais : il n'y a pas de « fin de page » qui inviterait à s'arrêter.",e:"Les émissions des murs-écrans ne s'interrompent jamais.",a:null},
  "parasocial":{m:"Relation parasociale",c:"med",d:"Impression d'avoir un lien personnel avec quelqu'un qu'on ne connaît qu'à travers un écran.",e:"Mildred appelle « la famille » les personnages de ses murs-écrans.",a:"Avoir l'impression qu'un influenceur est un ami."},
  "infox":{m:"Infox (fake news)",c:"med",d:"Information fausse présentée comme vraie, souvent sous l'apparence d'un article ou d'une vidéo d'actualité.",e:"L'arrestation d'un faux Montag, diffusée en direct.",a:null},
  "desinformation":{m:"Désinformation / mésinformation",c:"med",d:"La **désinformation** est une fausse information diffusée **volontairement** pour tromper. La **mésinformation** est une erreur partagée **de bonne foi**.",e:"La télévision choisit un passant innocent pour « jouer » Montag : c'est de la désinformation.",a:"Partager une rumeur sans vérifier, c'est de la mésinformation."},
  "deepfake":{m:"Hypertrucage (deepfake)",c:"med",d:"Vidéo, image ou voix fabriquée par une IA pour faire croire qu'une personne a dit ou fait quelque chose.",e:null,a:"Une fausse vidéo d'un dirigeant politique annonçant sa démission."},
  "post-verite":{m:"Post-vérité",c:"med",d:"Situation où les émotions et les croyances pèsent plus que les faits dans la formation de l'opinion.",e:"Mme Bowles vote pour le candidat le plus « beau ».",a:null},
  "esprit-critique":{m:"Esprit critique",c:"cog",d:"Capacité à examiner une information avant d'y croire : qui parle ? avec quelles preuves ? dans quel but ?",e:"Montag demande à Faber : « je veux que vous m'appreniez à comprendre ce que je lis. »",a:null},
  "decharge":{m:"Décharge cognitive",c:"cog",d:"Fait de confier à un outil un travail que notre cerveau ferait sinon (se souvenir, calculer, rédiger). Utile pour libérer de l'attention ; risqué si l'on n'apprend plus à le faire soi-même.",e:"Les citoyens laissent les murs-écrans penser à leur place.",a:"Faire rédiger un raisonnement par une IA au lieu de le construire soi-même."},
  "charge":{m:"Charge cognitive",c:"cog",d:"Effort que demande une tâche à notre mémoire de travail, qui ne peut traiter que peu d'éléments à la fois. Si la charge est trop forte, on n'apprend plus (théorie de John Sweller).",e:"Montag essaie de lire la Bible dans le métro sous la publicité « Dentifrice Denham » : trop d'informations, les mots lui échappent.",a:"Lire un texte difficile pendant que les notifications sonnent."},
  "attention":{m:"Attention soutenue",c:"cog",d:"Capacité à rester concentré longtemps sur une même tâche.",e:"Clarisse observe la rosée, la lune, la pluie : elle prend le temps.",a:"Lire un roman de 200 pages demande une attention soutenue."},
  "lecture-profonde":{m:"Lecture profonde",c:"cog",d:"Lecture lente et attentive qui permet de comprendre, de faire des liens, de ressentir et de critiquer. La chercheuse Maryanne Wolf montre qu'elle s'apprend et qu'elle peut s'affaiblir si on ne la pratique plus.",e:"Faber parle des « pores » des livres : leurs détails pris sur le vif.",a:"Relire un passage, l'annoter, en discuter."},
  "litteratie":{m:"Littératie",c:"cog",d:"Capacité à comprendre, utiliser et évaluer des textes écrits pour agir dans la vie.",e:"Mildred sait faire fonctionner ses écrans, mais pas lire un poème.",a:null},
  "pisa":{m:"PISA",c:"cog",d:"Enquête internationale de l'OCDE qui évalue les élèves de 15 ans en lecture, mathématiques et sciences.",e:null,a:"PISA 2025 : moyenne OCDE en lecture de 461 points, la plus basse jamais mesurée."},
  "pirls":{m:"PIRLS",c:"cog",d:"Enquête internationale qui évalue la lecture des élèves de 4e primaire (9-10 ans), tous les cinq ans.",e:null,a:"PIRLS 2021 : 494 points en Fédération Wallonie-Bruxelles, sous la moyenne internationale (500)."},
  "loisir":{m:"Loisir (au sens de Faber)",c:"cog",d:"Pas seulement du temps libre : du temps **pour réfléchir** et assimiler ce qu'on apprend. Le mot grec *skholè* (« loisir ») a donné… « école ».",e:"« Du temps libre, oui. Mais du temps pour réfléchir ? » (Faber)",a:null},
  "historicite":{m:"Régime d'historicité",c:"cog",d:"Manière dont une société relie le passé, le présent et l'avenir (notion de l'historien François Hartog, 2003).",e:"La société de Montag a coupé ces liens : passé brûlé, avenir vide.",a:null},
  "presentisme":{m:"Présentisme",c:"cog",d:"Selon François Hartog, rapport au temps où le présent domine tout : le passé s'efface et l'avenir inquiète.",e:"Écrans, vitesse, distraction permanente : la société de Montag vit dans un présent sans fin.",a:"« Tout, tout de suite » ; l'actualité chasse l'actualité."},

const TermCtx = createContext(null);
function labelFor(id){ const g=GLOSS[id]; if(!g) return id; return /^[A-ZÉ]{2}/.test(g.m)?g.m:g.m.charAt(0).toLowerCase()+g.m.slice(1); }
function Term({id,label}){
  const ctx=useContext(TermCtx);
  if(!GLOSS[id]) return label||id;
  return html`<button type="button" className="term" aria-haspopup="dialog" onClick=${e=>{e.stopPropagation();ctx.open(id,e.currentTarget)}}>${label||labelFor(id)}</button>`;
}
function rich(s){
  if(s==null) return null;
  const out=[]; const re=/(\*\*[^*]+\*\*|\[\[[^\]]+\]\]|\*[^*\s][^*]*\*)/g; let last=0,m,k=0;
  while((m=re.exec(s))){
    if(m.index>last) out.push(s.slice(last,m.index));
    const t=m[0];
    if(t.startsWith("**")) out.push(h("strong",{key:k++},rich(t.slice(2,-2))));
    else if(t.startsWith("[[")){ const [id,lab]=t.slice(2,-2).split("|"); out.push(h(Term,{key:k++,id,label:lab})); }
    else out.push(h("em",{key:k++},t.slice(1,-1)));
    last=re.lastIndex;
  }
  if(last<s.length) out.push(s.slice(last));
  return out;
}

  const score=Object.keys(ans).filter(k=>ans[k]===qs[k].a).length;
  const done=Object.keys(ans).length===qs.length;
  return html`<section className="check" aria-label="Vérifie ta compréhension">
    <h3><${Icon} n="quiz"/>Vérifie ta compréhension</h3>
    <p className="small muted">Réponds sans regarder plus haut : se tester aide à retenir.</p>
    ${qs.map((q,i)=>html`<div className="q" key=${i}>
      <p className="qt">${i+1}. ${rich(q.q)}</p>
      <div className="opts">${q.o.map((o,j)=>{
        const chosen=ans[i]; const st=chosen==null?"":(j===q.a?"ok":(j===chosen?"ko":""));
        return html`<button type="button" key=${j} className=${"opt "+st} disabled=${chosen!=null} onClick=${()=>setAns({...ans,[i]:j})}><span className="k">${String.fromCharCode(65+j)}</span><span>${rich(o)}</span></button>`;})}</div>
      ${ans[i]!=null&&html`<div className=${"why"+(ans[i]===q.a?"":" bad")}><b>${ans[i]===q.a?"Bonne réponse. ":"Pas tout à fait. "}</b>${rich(q.w)}</div>`}
    </div>`)}
    ${done&&html`<p className="small" style=${{marginTop:"12px"}}><b>${score} / ${qs.length}</b> ${score===qs.length?"— tout est juste.":"— relis le passage concerné, puis réessaie."} <button type="button" className="btn" style=${{marginLeft:"8px"}} onClick=${()=>setAns({})}>Recommencer</button></p>`}
  </section>`;
}

    <div className="chips" style=${{marginTop:"12px"}}>${keys.map(k=>html`<span key=${k} className="tag acc" style=${{fontSize:".9rem",padding:"4px 12px"}}><${Term} id=${k} label=${GLOSS[k].m}/></span>`)}</div>

          <p>Il écrit plusieurs centaines de nouvelles et le scénario du film <em>Moby Dick</em> (John Huston, 1956). En 2012, la NASA donne son nom au site d'atterrissage du robot Curiosity sur Mars.</p>

}

/* ---------- Contexte ---------- */
function Contexte(){
  return html`<${Fragment}>
    <${Prose}>
      <p>Bradbury écrit dans l'Amérique du début des années 1950. Le pays est riche et confiant dans le progrès, mais il a peur : peur de la bombe, peur du communisme, peur de l'« ennemi intérieur ». Quatre réalités de l'époque nourrissent directement le roman.</p>
    <//>
    <div className="grid2" style=${{marginTop:"16px"}}>
      <div className="frame"><h3>1. La guerre froide et la bombe</h3><p className="small">Depuis Hiroshima (1945), on sait qu'une ville peut disparaître en un instant. En 1953, les deux superpuissances possèdent la bombe H. Dans le roman, les bombardiers survolent la ville et la guerre est « gagnée » en quelques secondes.</p></div>
      <div className="frame"><h3>2. Le maccarthysme</h3><p className="small">Le sénateur McCarthy traque les communistes réels ou supposés. Des artistes, des scénaristes, des professeurs perdent leur travail ; la délation est encouragée. Dans le roman, Mildred dénonce son mari, et Faber, professeur, a dû se taire.</p></div>
      <div className="frame"><h3>3. La télévision et la culture de masse</h3><p className="small">Moins de 10 % des foyers américains ont la télévision en 1950, environ deux sur trois en 1955. Les magazines vendent des livres « condensés » par millions. Bradbury pousse cette tendance à l'extrême : murs-écrans, condensés de condensés.</p></div>
      <div className="frame"><h3>4. La mémoire des autodafés</h3><p className="small">Bradbury a vu, enfant, les images des livres brûlés par les nazis en 1933. Il connaît aussi l'incendie de la bibliothèque d'Alexandrie, symbole de savoir perdu. Brûler des livres, c'est vouloir effacer des idées… et souvent des gens.</p></div>
    </div>
    <h2>Frise chronologique</h2>
    <div className="chips" style=${{marginBottom:"14px"}}>${Object.keys(TLLAB).map(k=>html`<span key=${k} className="tag" style=${{display:"inline-flex",alignItems:"center",gap:"6px"}}><i style=${{width:"9px",height:"9px",borderRadius:"50%",background:TLCOL[k],display:"inline-block"}}></i>${TLLAB[k]}</span>`)}</div>
    <ol className="timeline">
      ${TIMELINE.map((e,i)=>html`<li key=${i} className=${e.hl?"hl":""}><span className="yr">${e.y}</span><span className="dot" style=${{background:TLCOL[e.c]}}></span><div className="ev">${rich(e.t)}</div></li>`)}

      <${Msg} kind="warn" title="Ce que Bradbury en disait">Dans les années 2000, Bradbury expliquait que son roman parlait moins de la censure d'État que de la télévision, qui détruit l'intérêt pour la lecture. Dans sa postface de 1979, il écrit qu'« il y a plus d'une façon de brûler un livre ».<//>
    </div>
  <//>`;
}

/* ---------- Analyse ---------- */
function Analyse(){

      <${Prose}>

        <p>L'${html`<${Term} id="epigraphe"/>`} invite au contraire à la désobéissance : écrire « de l'autre côté » du papier réglé, c'est refuser les lignes imposées.</p>
        <p>L'${html`<${Term} id="incipit"/>`} surprend le lecteur : le feu y est un plaisir, presque une fête.</p>

      <${Msg} kind="pos" title="Piste d'analyse">Relève dans l'incipit les ${html`<${Term} id="metaphore" label="métaphores"/>`} : le lance-flammes est un « python géant », Montag un « chef d'orchestre » qui dirige des « symphonies en feu majeur », les livres meurent « comme autant de pigeons ». La destruction est rendue belle : c'est tout le piège de cette société.<//>

    <${Prose}><p style=${{marginTop:"12px"}}>Au moment de rejoindre les hommes-livres, Montag découvre un feu qui ne sert pas à détruire mais à se réunir. La flamme, symbole de mort au début, devient symbole de vie et de transmission, comme le ${html`<${Term} id="phenix"/>`} qui renaît de ses cendres.</p><//>

    <div className="flow" style=${{margin:"14px 0"}}>

      <div className="node"><b>2. Raccourcis</b>Les livres deviennent des condensés, puis des résumés de dix lignes.</div><span className="arr" aria-hidden="true">→</span>
      <div className="node"><b>3. Ne froisser personne</b>On retire tout ce qui pourrait gêner un groupe ou une minorité.</div><span className="arr" aria-hidden="true">→</span>
      <div className="node"><b>4. Égalité forcée</b>Le mot « intellectuel » devient une injure.</div><span className="arr" aria-hidden="true">→</span>
      <div className="node"><b>5. Pompiers</b>Ils deviennent « censeurs, juges et bourreaux officiels ».</div>
    </div>
    <div className="stack">
      <${Quote} q="Nous ne naissons pas libres et égaux, comme le proclame la Constitution, on nous rend égaux. Chaque homme doit être l'image de l'autre, comme ça tout le monde est content." w="Beatty, 1re partie"/>
      <${Quote} q="Un livre est un fusil chargé dans la maison d'à côté. Brûlons-le." w="Beatty, 1re partie"/>
    </div>
    <h3>Comparer avec 1984</h3>
    <div className="tablewrap"><table>
      <thead><tr><th></th><th><em>1984</em> (Orwell, 1949)</th><th><em>Fahrenheit 451</em> (Bradbury, 1953)</th></tr></thead>
      <tbody>
        <tr><th scope="row">Qui détruit le passé ?</th><td>Le Parti, par la contrainte</td><td>La société elle-même, par goût du confort</td></tr>
        <tr><th scope="row">Moyen principal</th><td>Peur, surveillance, mensonge</td><td>Divertissement, vitesse, distraction</td></tr>
        <tr><th scope="row">Le citoyen est…</th><td>Terrorisé</td><td>Anesthésié</td></tr>
        <tr><th scope="row">Les écrans servent à…</th><td>Surveiller (télécrans)</td><td>Distraire (murs-écrans)</td></tr>
      </tbody></table></div>

    <h2>4. Le bonheur obligatoire</h2>
    <${Prose}>
      <p>Beatty le dit : « Les gens veulent être heureux. » Tout est fait pour éviter la tristesse, le doute, le conflit. Mais le roman montre l'envers de ce bonheur : Mildred avale un flacon entier de somnifères, des adolescents se tuent en voiture, Montag avoue à Faber : « On a tout ce qu'il faut pour être heureux, mais on ne l'est pas. »</p>
      <p>La question de Clarisse, <em>« Est-ce que vous êtes heureux ? »</em>, est donc une bombe : elle oblige Montag à regarder ce qu'il ne voyait plus.</p>
    <//>

    <h2>5. Les trois choses qui manquent, selon Faber</h2>
    <${Quote} q="Un, comme j'ai dit, la qualité de l'information. Deux : le loisir de l'assimiler. Et trois : le droit d'accomplir des actions fondées sur ce que nous apprend l'interaction des deux autres éléments." w="Faber, 2e partie"/>
    <div className="grid3" style=${{marginTop:"14px"}}>
      <div className="frame"><span className="tag acc">1</span><h3>La qualité</h3><p className="small">Faber parle de « texture » : un bon livre a des « pores », des détails pris sur le vif. Il montre la vie telle qu'elle est, avec ses aspérités.</p></div>
      <div className="frame"><span className="tag acc">2</span><h3>Le loisir</h3><p className="small">Pas du temps libre, mais du temps <b>pour réfléchir</b>. On peut discuter avec un livre, le refermer ; on ne peut pas discuter avec un mur-écran qui hurle.</p></div>
      <div className="frame"><span className="tag acc">3</span><h3>Le droit d'agir</h3><p className="small">Savoir et réfléchir ne servent à rien si l'on n'a pas la liberté d'agir à partir de ce qu'on a compris.</p></div>
    </div>
    <div style=${{marginTop:"14px"}}><${Msg} title="Un outil pour aujourd'hui">Ces trois critères permettent de juger n'importe quel média : un réseau social, une IA, un journal télévisé, un roman. Tu les retrouveras dans « F451 aujourd'hui » et dans « Pistes de travail ».<//></div>
    <${Quote} calm q="Les livres n'étaient qu'un des nombreux types de réceptacles destinés à conserver ce que nous avions peur d'oublier. Ils n'ont absolument rien de magique." w="Faber, 2e partie"/>

    <h2>6. Montag, un roman d'apprentissage</h2>
    <${Prose}><p>Le parcours de Montag suit les étapes d'un ${html`<${Term} id="apprentissage" label="roman d'apprentissage"/>`} :</p><//>
    <ol className="steps" style=${{marginTop:"12px"}}>
      <li><b>Aveuglement</b>Pompier fier, sourire « farouche ».</li>
      <li><b>Doute</b>La question de Clarisse.</li>
      <li><b>Choc</b>La vieille dame qui meurt avec ses livres.</li>
      <li><b>Recherche</b>Il lit, cherche Faber.</li>
      <li><b>Rupture</b>Il brûle sa maison, tue Beatty.</li>
      <li><b>Passage</b>Il traverse le fleuve, change de vêtements.</li>
      <li><b>Mémoire</b>Il devient un homme-livre.</li>
    </ol>
    <${Prose}><p style=${{marginTop:"12px"}}>La traversée du fleuve est un moment-clé : Montag y est comme lavé de son ancienne vie. Beaucoup de lecteurs y voient une sorte de baptême, une seconde naissance.</p><//>

    <h2>7. L'allégorie de la caverne</h2>
    <${Prose}><p>Le roman réécrit l'${html`<${Term} id="caverne" label="allégorie de la caverne"/>`} de Platon. Le texte parle d'ailleurs de « cavernes électriques ».</p><//>
    <div className="tablewrap" style=${{marginTop:"12px"}}><table>
      <thead><tr><th>Chez Platon</th><th>Dans <em>Fahrenheit 451</em></th></tr></thead>
      <tbody>
        <tr><td>Les prisonniers enchaînés</td><td>Mildred et ses amies devant les murs-écrans</td></tr>
        <tr><td>Les ombres sur la paroi</td><td>Les émissions de la « famille »</td></tr>
        <tr><td>Le prisonnier qui se libère</td><td>Montag</td></tr>
        <tr><td>Le soleil, la vérité</td><td>Les livres, la nature, l'aube finale</td></tr>
        <tr><td>Les autres refusent de le croire</td><td>Mildred et ses amies rejettent Montag et le dénoncent</td></tr>
      </tbody></table></div>

    <h2>8. Un monde infernal</h2>
    <${Prose}><p>De nombreux détails évoquent les Enfers. Le feu règne partout. Le lance-flammes est un « python », la machine qui soigne Mildred ressemble à un cobra. Montag descend dans le métro, sous terre. Le ${html`<${Term} id="limier" label="Limier"/>`} rappelle Cerbère, le chien qui garde les Enfers, et le fleuve qui sauve Montag rappelle le Styx, la frontière entre le monde des morts et celui des vivants. La ville est un enfer confortable dont on ne sort qu'en traversant l'eau.</p><//>

    <h2>9. Le style de Bradbury</h2>
    <div className="grid2">
      <div className="frame"><h3>Une prose poétique</h3><p className="small">Bradbury écrit comme un poète : ${html`<${Term} id="metaphore" label="métaphores"/>`} nombreuses, comparaisons, couleurs, sensations. Clarisse a « le visage brillant comme neige dans le clair de lune ». Le traducteur Jacques Chambon relève plus de dix métaphores dès les premiers paragraphes.</p></div>
      <div className="frame"><h3>Un rythme qui imite la vitesse</h3><p className="small">Dans le discours de Beatty, les phrases raccourcissent, s'emballent, se réduisent à des onomatopées : « Hé ! Bang ! Paf ! Vlan, bing, bong, boum ! » La forme imite ce que le contenu dénonce : un monde qui va trop vite pour penser.</p></div>
    </div>

    <h2>10. Le dénouement : renaître de ses cendres</h2>
    <div className="stack">
      <${Quote} q="Nous avons conscience de l'énorme bêtise que nous venons de faire. […] À chaque génération, nous trouvons un peu plus de monde qui se souvient." w="Granger, 3e partie"/>
      <${Prose}>
        <p>Le roman ne se termine pas sur la destruction, mais sur une marche à l'aube. Granger propose de construire d'abord « une miroiterie » pour que l'humanité puisse « se regarder longuement » : avant de reconstruire, il faut se voir tel qu'on est.</p>
        <p>Montag se souvient enfin de deux textes bibliques : l'${html`<${Term} id="ecclesiaste" label="Ecclésiaste"/>`} (« Temps d'abattre et temps de bâtir ») et l'Apocalypse, avec l'arbre de vie dont « les feuilles […] sont pour guérir les nations ». La dernière phrase, « Quand nous atteindrons la ville », est tournée vers l'avenir.</p>
      <//>
      <${Quote} calm q="La différence entre l'homme qui ne fait que tondre le gazon et un vrai jardinier réside dans le toucher." w="Granger, citant son grand-père, 3e partie"/>
      <${Msg} kind="warn" title="Une fin vraiment heureuse ?">La ville et ses habitants (Mildred sans doute) sont détruits. L'espoir existe, mais il est fragile et lent : les hommes-livres savent qu'il faudra peut-être des générations. Bradbury ne promet pas un monde meilleur, il en ouvre la possibilité.<//>
    </div>
  <//>`;
}

/* ---------- Le temps brûlé (Hartog) ---------- */
function Temps(){
  return html`<${Fragment}>
    <${Prose}>
      <p>On lit souvent <em>Fahrenheit 451</em> comme un roman sur la censure. On peut aller plus loin : en brûlant ses livres, cette société détruit sa <b>mémoire</b>, et une société sans mémoire ne sait plus imaginer son <b>avenir</b>. C'est donc aussi un roman sur <b>le temps</b>.</p>
    <//>
    <h2>Deux outils d'historiens</h2>
    <div className="grid2">
      <div className="frame"><h3>Le régime d'historicité</h3><p className="small">Pour l'historien François Hartog (2003), un ${html`<${Term} id="historicite" label="régime d'historicité"/>`} est la manière dont une société relie passé, présent et avenir. Question à se poser : <em>qu'est-ce qui donne du sens à ce que je vis aujourd'hui ?</em> Ce que m'ont transmis mes ancêtres, ce que j'espère construire, ou seulement l'instant ?</p></div>
      <div className="frame"><h3>Expérience et attente</h3><p className="small">L'historien allemand Reinhart Koselleck distingue l'<b>espace d'expérience</b> (ce que le passé nous a appris) et l'<b>horizon d'attente</b> (ce que nous espérons ou craignons). Une société en bonne santé relie les deux.</p></div>
    </div>
    <div style=${{marginTop:"14px"}}><${Msg} kind="pos" title="Une image pour retenir">Un conducteur regarde à la fois dans son rétroviseur (le passé) et à travers son pare-brise (l'avenir). S'il ne regarde que l'un des deux, il a un accident.<//></div>
    <h2>Trois manières de vivre le temps</h2>
    <div className="tablewrap"><table>
      <thead><tr><th>Régime</th><th>Période (environ)</th><th>Ce qui compte le plus</th><th>Idée-clé</th></tr></thead>
      <tbody>
        <tr><th scope="row">Ancien régime</th><td>Antiquité → XVIIIe s.</td><td><span className="tag past">le passé</span></td><td>On imite les anciens ; l'histoire donne des leçons.</td></tr>
        <tr><th scope="row">Régime moderne (futuriste)</th><td>1789 → fin du XXe s.</td><td><span className="tag future">le futur</span></td><td>On croit au progrès : demain sera meilleur.</td></tr>
        <tr><th scope="row">Présentisme</th><td>Depuis 1989 environ</td><td><span className="tag present">le présent</span></td><td>On vit dans l'immédiat ; l'avenir inquiète.</td></tr>
      </tbody></table></div>
    <h2>Appliquer ces outils au roman</h2>
    <div className="time3">
      <div className="p"><h4>Le passé</h4><p className="big">Brûlé</p><p className="small">Les livres, mémoire de la société, sont détruits. L'histoire est réécrite : les pompiers croient que leur métier a été fondé en 1790 par Benjamin Franklin. Mildred ne se souvient plus de sa rencontre avec Montag.</p></div>
      <div className="n"><h4>Le présent</h4><p className="big">Saturé</p><p className="small">Murs-écrans, coquillages, vitesse : il n'y a jamais de silence. Marcher ou discuter paraît suspect. Mildred incarne ce présent sans profondeur.</p></div>
      <div className="f"><h4>L'avenir</h4><p className="big">Vide</p><p className="small">La guerre approche et personne ne s'en inquiète. Sans mémoire ni réflexion, la société ne peut plus imaginer autre chose que son confort quotidien.</p></div>
    </div>
    <div style=${{marginTop:"14px"}}><${Msg} title="Bilan">Passé brûlé, présent saturé, avenir vide : le rétroviseur et le pare-brise sont tous deux obscurcis. On peut lire le roman comme une anticipation du ${html`<${Term} id="presentisme"/>`} décrit par Hartog cinquante ans plus tard.<//></div>
    <h2>La « fin du futurisme »</h2>
    <${Prose}><p>Après Hiroshima, la science-fiction cesse de croire que le progrès rendra forcément le monde meilleur. Trois œuvres « cassent » le temps de trois façons :</p><//>
    <div className="tablewrap" style=${{marginTop:"12px"}}><table>
      <thead><tr><th></th><th><em>Dune</em> (1965)</th><th><em>1984</em> (1949)</th><th><em>Fahrenheit 451</em> (1953)</th></tr></thead>
      <tbody>
        <tr><th scope="row">Le passé</th><td>Il revient (empire, nobles, guerre sainte)</td><td>Il est falsifié</td><td>Il est brûlé</td></tr>
        <tr><th scope="row">Le présent</th><td>Féodal et religieux</td><td>Surveillé</td><td>Saturé d'écrans</td></tr>
        <tr><th scope="row">L'avenir</th><td>Une répétition du passé</td><td>Figé pour toujours</td><td>Vide, sans projet</td></tr>
        <tr><th scope="row">Lueur d'espoir</th><td>—</td><td>Très faible</td><td>Les hommes-livres</td></tr>
      </tbody></table></div>
    <${Prose}><p style=${{marginTop:"12px"}}>Chez Bradbury, le décor reste ultra-moderne, mais le progrès tourne à vide : il n'apporte ni liberté ni bonheur. Le futurisme meurt <b>de l'intérieur</b>.</p><//>
    <h2>Le dénouement, une nouvelle Renaissance ?</h2>
    <div className="grid2">
      <div className="frame"><h3>Les ressemblances</h3><ul className="small" style=${{paddingLeft:"1.2em",margin:0,display:"flex",flexDirection:"column",gap:"5px"}}>
        <li>Les hommes-livres sauvent des textes menacés, comme les humanistes qui recopiaient les manuscrits antiques.</li>
        <li>Ils fuient la ville avec leur savoir, comme les savants byzantins partis vers l'Italie avec leurs manuscrits grecs.</li>
        <li>Le renouveau naît d'une crise, comme la ${html`<${Term} id="renaissance" label="Renaissance"/>`} est née des crises de la fin du Moyen Âge.</li>
        <li>Le phénix : une « re-naissance » au sens propre, à l'aube.</li>
      </ul></div>
      <div className="frame"><h3>Un regard critique</h3><ul className="small" style=${{paddingLeft:"1.2em",margin:0,display:"flex",flexDirection:"column",gap:"5px"}}>
        <li>L'image « ténèbres puis lumière » est un récit inventé par les humanistes eux-mêmes (l'historien Guillaume Frantzwa parle d'un mythe).</li>
        <li>Renversement ironique : chez Bradbury, l'âge obscur est <b>hypermoderne</b>, produit par les écrans et la vitesse.</li>
        <li>Apprendre des textes par cœur, c'est aussi ce que faisaient les moines du Moyen Âge : il y a continuité.</li>
        <li>Montag porte la Bible, d'autres des philosophes : héritage religieux et héritage profane cohabitent.</li>
      </ul></div>
    </div>
    <h2>Précautions de méthode</h2>
    <div className="stack">
      <${Msg} kind="warn" title="Attention à l'anachronisme">Bradbury ne connaissait pas le mot « présentisme », apparu cinquante ans après son roman. On dira qu'il l'<b>anticipe</b> ou le <b>préfigure</b>.<//>
      <${Msg} kind="warn" title="Une analogie n'est pas une identité">La fin du roman <em>ressemble</em> à une Renaissance ; elle n'est pas la Renaissance historique. Montre les ressemblances <b>et</b> les différences.<//>
      <${Msg} kind="warn" title="Des historiens, pas des critiques littéraires">Hartog et Frantzwa étudient des sociétés réelles. Écris : « on peut lire le roman à la lumière de… ».<//>
    </div>
  <//>`;
}

/* ---------- Graphique PISA ---------- */
function PisaChart(){
  const X=y=>90+(y-2018)*(400/7), Y=v=>220-(v-450)*(190/45);
  const oecd=[[2018,487],[2022,476],[2025,461]], fwb=[[2018,481],[2025,466]];
  return html`<div className="figure" style=${{marginTop:"6px"}}>
    <svg viewBox="0 0 600 262" role="img" aria-label="Scores moyens en lecture PISA : OCDE 487 en 2018, 476 en 2022, 461 en 2025 ; Fédération Wallonie-Bruxelles 481 en 2018 et 466 en 2025">
      ${[450,460,470,480,490].map(v=>html`<g key=${v}><line x1="70" x2="540" y1=${Y(v)} y2=${Y(v)} stroke="var(--border-soft)"/><text x="62" y=${Y(v)+4} textAnchor="end" fontSize="11" fill="var(--muted)">${v}</text></g>`)}
      ${[2018,2022,2025].map(y=>html`<text key=${y} x=${X(y)} y="246" textAnchor="middle" fontSize="12" fill="var(--muted)">${y}</text>`)}
      <polyline points=${oecd.map(p=>X(p[0])+","+Y(p[1])).join(" ")} fill="none" stroke="var(--accent)" strokeWidth="2.5"/>
      <line x1=${X(2018)} y1=${Y(481)} x2=${X(2025)} y2=${Y(466)} stroke="var(--present)" strokeWidth="2.5" strokeDasharray="6 5"/>
      ${oecd.map(p=>html`<g key=${"o"+p[0]}><circle cx=${X(p[0])} cy=${Y(p[1])} r=${p[0]===2025?5.5:4} fill="var(--accent)" stroke="var(--view)" strokeWidth="2"/><text x=${X(p[0])} y=${p[0]===2025?Y(p[1])+21:Y(p[1])-11} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--text)">${p[1]}</text></g>`)}
      ${fwb.map(p=>html`<g key=${"f"+p[0]}><circle cx=${X(p[0])} cy=${Y(p[1])} r=${p[0]===2025?5.5:4} fill="var(--present)" stroke="var(--view)" strokeWidth="2"/><text x=${X(p[0])} y=${p[0]===2025?Y(p[1])-11:Y(p[1])+20} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--present)">${p[1]}</text></g>`)}
      <text x="548" y=${Y(461)+4} fontSize="12" fill="var(--accent-strong)" fontWeight="600">OCDE</text>
      <text x="548" y=${Y(466)+4} fontSize="12" fill="var(--present)" fontWeight="600">FWB</text>
    </svg>
    <p className="figcap">Score moyen en compréhension de l'écrit, élèves de 15 ans (PISA). Moyenne OCDE : 487 (2018), 476 (2022), 461 (2025). Fédération Wallonie-Bruxelles : 481 (2018), 466 (2025) ; le score FWB de 2022 n'est pas repris ici, d'où les pointillés.</p>
  </div>`;
}

/* ---------- F451 aujourd'hui ---------- */
function Aujourdhui(){
  const [t,setT]=useState(0); const d=TODAY[t];
  return html`<${Fragment}>
    <${Prose}><p>Pour chaque thème : à gauche, ce que montre le roman ; à droite, ce que disent les faits d'aujourd'hui. Lis toujours la <b>nuance</b> : un roman n'est pas une prophétie, et une comparaison sérieuse montre aussi les différences.</p><//>
    <div className="tabs" role="tablist" aria-label="Thèmes contemporains" style=${{marginTop:"16px"}}>
      ${TODAY.map((x,i)=>html`<button key=${x.id} role="tab" type="button" className="tab" aria-selected=${i===t} onClick=${()=>setT(i)}>${x.t.split(" :")[0]}</button>`)}
    </div>
    <div className="stack" role="tabpanel">
      <h2 style=${{marginTop:"4px",borderTop:0,paddingTop:0}}>${d.t}</h2>
      <div className="pair">
        <div><h4>Dans le roman</h4>${d.roman.map((r,i)=>html`<${Quote} key=${i} q=${r.q} w=${r.w}/>`)}<p className="small">${rich(d.romanTxt)}</p></div>
        <div><h4>Aujourd'hui</h4><ul>${d.auj.map((a,i)=>html`<li key=${i}>${rich(a)}</li>`)}</ul>
          ${d.src&&html`<p className="src">Sources : ${d.src.map((s,i)=>html`<${Fragment} key=${i}>${i>0?" · ":""}<a href=${s.u} target="_blank" rel="noopener">${s.l}</a><//>`)}</p>`}
        </div>
      </div>
      ${d.chart&&html`<${PisaChart}/>`}
      <${Msg} kind="warn" title="Nuance">${rich(d.nuance)}<//>
      <${Msg} kind="pos" title="Question pour débattre" icon="quiz">${rich(d.qd)}<//>
      <div className="pager" style=${{marginTop:"4px"}}>
        <button type="button" className="btn" disabled=${t===0} onClick=${()=>setT(t-1)}><${Icon} n="left"/>Thème précédent</button>
        <span className="small muted">${t+1} / ${TODAY.length}</span>
        <button type="button" className="btn" disabled=${t===TODAY.length-1} onClick=${()=>setT(t+1)}>Thème suivant<${Icon} n="right"/></button>
      </div>
    </div>
    <h2>Ce que Bradbury ne dit pas</h2>
    <${Prose}><p>Bradbury n'est pas contre la technique : il critique une culture qui préfère le divertissement à la pensée. Faber le dit lui-même : la télévision et la radio « pourraient transmettre la même profusion de détails et de savoir, mais ce n'est pas le cas ». La question n'est donc pas « écrans ou livres ? », mais : <b>qu'est-ce qui nous donne de la qualité, du temps pour penser et la liberté d'agir ?</b></p><//>
  <//>`;
}

/* ---------- Œuvres en écho ---------- */
function Echos(){
  return html`<${Fragment}>
    <${Prose}><p>Bradbury n'est pas seul. Avant lui, d'autres auteurs ont imaginé des sociétés qui contrôlent les esprits ; après lui, beaucoup ont répondu à son roman. Ces œuvres permettent de comparer, et de choisir une lecture complémentaire.</p><//>
    <h2>Trois cauchemars, trois méthodes</h2>
    <div className="tablewrap"><table>
      <thead><tr><th></th><th><em>Le Meilleur des mondes</em> (1932)</th><th><em>1984</em> (1949)</th><th><em>Fahrenheit 451</em> (1953)</th></tr></thead>
      <tbody>
        <tr><th scope="row">Arme du pouvoir</th><td>Le plaisir, la drogue, le conditionnement</td><td>La peur, la surveillance</td><td>La distraction, la vitesse</td></tr>
        <tr><th scope="row">Les livres</th><td>Inutiles, oubliés</td><td>Réécrits, détruits</td><td>Brûlés… après avoir été délaissés</td></tr>
        <tr><th scope="row">Le héros</th><td>Le « Sauvage », lecteur de Shakespeare</td><td>Winston, qui réécrit les archives</td><td>Montag, qui brûle les livres</td></tr>
        <tr><th scope="row">La fin</th><td>Désespérée</td><td>Le héros est brisé</td><td>Une renaissance possible</td></tr>
      </tbody></table></div>
    <div style=${{marginTop:"14px"}}><${Msg} title="La clé de Neil Postman (1985)">Orwell craignait ceux qui interdiraient les livres ; Huxley craignait qu'il n'y ait plus besoin de les interdire, parce que plus personne ne voudrait en lire. Bradbury montre les deux à la fois : d'abord le désintérêt, ensuite l'interdiction.<//></div>
    <h2>Fiches des œuvres</h2>

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function Glossaire({focus,clearFocus}){
  const [q,setQ]=useState(""); const [cat,setCat]=useState("all"); const [train,setTrain]=useState(false); const [shown,setShown]=useState({});
  const list=useMemo(()=>Object.entries(GLOSS).map(([id,g])=>({id,...g})).sort((a,b)=>norm(a.m.replace(/^La « /,"")).localeCompare(norm(b.m.replace(/^La « /,"")),"fr")),[]);
  useEffect(()=>{ if(!focus) return; setQ(""); setCat("all");
    const t=setTimeout(()=>{ const el=document.getElementById("g-"+focus); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } clearFocus(); },60);
    return ()=>clearTimeout(t); },[focus]);
  const nq=norm(q.trim());
  const items=list.filter(g=>(cat==="all"||g.c===cat)&&(!nq||norm(g.m+" "+g.d+" "+(g.e||"")+" "+(g.a||"")).includes(nq)));
  let lastL="";
  return html`<${Fragment}>
    <div className="gtools">
      <label className="search"><${Icon} n="search"/><input id="gsearch" type="search" placeholder="Chercher un mot ou une notion…" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Chercher dans le glossaire"/></label>
      <button type="button" className="btn" aria-pressed=${train} onClick=${()=>{setTrain(!train);setShown({});}}><${Icon} n="quiz"/>Mode entraînement</button>
    </div>
    <div className="chips" style=${{marginBottom:"14px"}}>
      <button type="button" className="btn" aria-pressed=${cat==="all"} onClick=${()=>setCat("all")}>Tout (${list.length})</button>
      ${Object.entries(CATS).map(([k,v])=>html`<button type="button" key=${k} className="btn" aria-pressed=${cat===k} onClick=${()=>setCat(k)}>${v.l} (${list.filter(g=>g.c===k).length})</button>`)}
    </div>
    ${train&&html`<div style=${{marginBottom:"14px"}}><${Msg} kind="pos" title="Mode entraînement">Les définitions sont cachées. Essaie de définir chaque mot à voix haute, puis vérifie.<//></div>`}
    ${items.length===0?html`<p className="muted">Aucun mot ne correspond à « ${q} ». Essaie un autre mot ou choisis « Tout ».</p>`:html`<div className="gl">
      ${items.map(g=>{ const L=norm(g.m.replace(/^La « /,"")).charAt(0).toUpperCase(); const head=L!==lastL; lastL=L;
        return html`<${Fragment} key=${g.id}>${head&&html`<div className="letter" aria-hidden="true">${L}</div>`}
        <div className="gitem" id=${"g-"+g.id}>
          <div className="w">${g.m}<br/><span className="tag">${CATS[g.c].l}</span></div>
          <div>${train&&!shown[g.id]?html`<button type="button" className="reveal" onClick=${()=>setShown({...shown,[g.id]:true})}>Afficher la définition</button>`:html`<${Fragment}>
            <p>${rich(g.d)}</p>
            ${g.e&&html`<p className="ex"><b>Dans le roman :</b> ${rich(g.e)}</p>`}
            ${g.a&&html`<p className="ex"><b>Aujourd'hui :</b> ${rich(g.a)}</p>`}<//>`}
          </div></div><//>`;})}
    </div>`}
  <//>`;
}

    <header className="toolbar">
      <svg className="appicon" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="5" fill="var(--accent-tint)" stroke="var(--accent-line)"/><path d="M9 8h9l5 5v11H9z" fill="var(--view)" stroke="var(--accent-strong)" strokeWidth="1.4" strokeLinejoin="round"/><path d="M16 26c-2.8 0-4.6-1.8-4.6-4.2 0-2.5 2.1-3.9 2.5-6.3 1.3.8 1.8 2.1 1.8 3.3.5-.8 1.2-1.8 1.3-3.2 1.7 1.3 3 3.5 3 6 0 2.6-1.9 4.4-4 4.4z" fill="var(--present)"/></svg>
      <div className="ttl"><b>Fahrenheit 451</b><span>Ray Bradbury · fiche de lecture et analyse · 5e secondaire</span></div>
      <div className="tools">
        <div className="seg hide-s" role="group" aria-label="Taille du texte">
          <button type="button" className="btn" onClick=${()=>setScale(Math.max(.9,+(scale-.05).toFixed(2)))} aria-label="Réduire le texte">A−</button>
          <button type="button" className="btn" onClick=${()=>setScale(Math.min(1.3,+(scale+.05).toFixed(2)))} aria-label="Agrandir le texte">A+</button>
        </div>
        <button type="button" className="btn hide-s" aria-pressed=${airy} onClick=${()=>setAiry(!airy)}>Interligne</button>
        <div className="seg" role="group" aria-label="Thème">
          ${[["system","auto","Thème du système"],["light","sun","Thème clair"],["dark","moon","Thème sombre"]].map(([k,ic,l])=>html`<button type="button" key=${k} className="btn icon" aria-pressed=${theme===k} aria-label=${l} title=${l} onClick=${()=>setTheme(k)}><${Icon} n=${ic}/></button>`)}
        </div>
      </div>
    </header>
    <div className="shell">
      <nav className="side" aria-label="Sommaire">
        ${SECTIONS.map(s=>{ const head=s.g!==lastG; lastG=s.g; return html`<${Fragment} key=${s.id}>${head&&html`<div className="grp">${s.g}</div>`}
          <button type="button" className="navitem" aria-current=${s.id===sec?"page":undefined} onClick=${()=>go(s.id)}><${Icon} n=${s.ic}/><span className="lbl">${s.l}</span>${read[s.id]&&html`<${Icon} n="check" className="done"/>`}</button><//>`; })}
        <div className="progress">${nRead} rubrique${nRead>1?"s":""} lue${nRead>1?"s":""} sur ${reading.length}<div className="bar"><i style=${{width:(nRead/reading.length*100)+"%"}}></i></div></div>
      </nav>
      <main className="view" id="main">
        <div className="eyebrow"><span>${S.g}</span>${S.min&&html`<span className="time">≈ ${S.min} min</span>`}</div>
        <h1>${titles[sec]}</h1>
        <p className="lede">${ledes[sec]}</p>
        ${body}
        <${Check} key=${"c-"+sec} id=${sec}/>
        <div className="pager">
          ${idx>0?html`<button type="button" className="btn" onClick=${()=>go(SECTIONS[idx-1].id)}><${Icon} n="left"/>${SECTIONS[idx-1].l}</button>`:html`<span></span>`}
          ${S.min&&html`<label className="small" style=${{display:"inline-flex",gap:"8px",alignItems:"center",cursor:"pointer"}}><input id=${"read-"+sec} type="checkbox" style=${{accentColor:"var(--accent)",width:"16px",height:"16px"}} checked=${!!read[sec]} onChange=${e=>setRead({...read,[sec]:e.target.checked})}/>Rubrique lue</label>`}
          ${idx<SECTIONS.length-1?html`<button type="button" className="btn" onClick=${()=>go(SECTIONS[idx+1].id)}>${SECTIONS[idx+1].l}<${Icon} n="right"/></button>`:html`<span></span>`}
        </div>
      </main>
    </div>
    ${g&&html`<div className="pop" ref=${popRef} role="dialog" aria-label=${g.m} style=${{left:pop.left+"px",top:pop.top!=null?pop.top+"px":"auto",bottom:pop.bottom!=null?pop.bottom+"px":"auto"}}>
      <h4><span>${g.m}</span><span className="cat">${CATS[g.c].l}</span></h4>
      <p>${rich(g.d)}</p>
      ${(g.e||g.a)&&html`<div className="ex">${g.e&&html`<p><b>Dans le roman :</b> ${rich(g.e)}</p>`}${g.a&&html`<p style=${{marginTop:g.e?"6px":0}}><b>Aujourd'hui :</b> ${rich(g.a)}</p>`}</div>`}
      <div className="acts"><button type="button" className="btn" onClick=${()=>{const id=pop.id;setPop(null);setFocus(id);setSec("glossaire");try{history.replaceState(null,"","#glossaire");}catch(e){}}}>Voir dans le glossaire</button><button type="button" className="btn icon" aria-label="Fermer" onClick=${()=>setPop(null)}><${Icon} n="close"/></button></div>
    </div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>

</body></html>
