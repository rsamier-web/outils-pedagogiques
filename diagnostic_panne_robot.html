<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostiquer et réparer une panne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plan : fenêtre d'application façon Breeze (KDE Plasma) — barre latérale de navigation à gauche, page de contenu à droite, cadres sobres, un seul accent bleu. */
:root{
  --win:#eff0f1; --view:#ffffff; --alt:#f6f7f8; --text:#232629; --muted:#5f656b;
  --line:#cdd1d5; --line-soft:#e2e5e8;
  --accent:#3daee9; --accent-ink:#126fa3; --accent-soft:rgba(61,174,233,.16); --accent-tint:#eaf6fd;
  --pos:#1f8f4e; --pos-soft:#e4f4ea; --neg:#c9303f; --neg-soft:#fbe8ea; --warn:#b85c00; --warn-soft:#fdf1e4;
  --c-event:#e0a100; --c-motor:#3daee9; --c-ctrl:#9b59b6;
  --font:"Noto Sans","Segoe UI",system-ui,sans-serif; --mono:"Noto Sans Mono","Hack",ui-monospace,monospace;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --win:#202326; --view:#141618; --alt:#1b1e21; --text:#f3f4f5; --muted:#a3abb3;
    --line:#3b4045; --line-soft:#2b2f33;
    --accent:#3daee9; --accent-ink:#62c1f2; --accent-soft:rgba(61,174,233,.22); --accent-tint:#18293a;
    --pos:#43c47f; --pos-soft:#15301f; --neg:#f0606f; --neg-soft:#3a1c21; --warn:#f2963f; --warn-soft:#3a2914;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --win:#202326; --view:#141618; --alt:#1b1e21; --text:#f3f4f5; --muted:#a3abb3;
  --line:#3b4045; --line-soft:#2b2f33;
  --accent:#3daee9; --accent-ink:#62c1f2; --accent-soft:rgba(61,174,233,.22); --accent-tint:#18293a;
  --pos:#43c47f; --pos-soft:#15301f; --neg:#f0606f; --neg-soft:#3a1c21; --warn:#f2963f; --warn-soft:#3a2914;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--win);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
strong{font-weight:600}

/* ---------- Fenêtre ---------- */
#root{height:100%}
.app{display:grid;grid-template-columns:268px 1fr;height:100%}
.side{background:var(--win);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.side-head .sub{font-size:12px;color:var(--muted);letter-spacing:.02em}
.side-head .ttl{font-weight:600;font-size:15px;margin-top:2px}
.side nav{overflow:auto;padding:8px;flex:1}
.nav-group{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:14px}
.nav-item:hover{background:var(--accent-soft)}
.nav-item[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.nav-item svg{flex:none;color:var(--muted)}
.nav-item[aria-current="page"] svg{color:var(--accent-ink)}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .badge{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .done{color:var(--pos)}
.side-foot{padding:10px 16px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-top:6px}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:3px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--view)}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--win);min-height:52px}
.toolbar h1{font-size:17px;font-weight:600}
.toolbar .crumb{font-size:13px;color:var(--muted)}
.toolbar .spacer{flex:1}
.btn.menu-btn{display:none}
.scroll{overflow:auto;flex:1}
.page{max-width:980px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:22px}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--view);border:1px solid var(--line);border-radius:5px;padding:6px 14px;cursor:pointer;min-height:34px;font-size:14px;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){background:var(--accent-soft)}
.btn.primary{border-color:var(--accent);background:var(--accent-tint)}
.btn.primary:hover:not(:disabled){background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:28px;padding:3px 10px;font-size:13px}
.btn.icon{padding:4px 8px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.frame{background:var(--view);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px}
.frame.alt{background:var(--alt)}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lead{font-size:16px;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.callout{border-left:3px solid var(--accent);background:var(--accent-tint);padding:12px 16px;border-radius:0 var(--r) var(--r) 0}
.callout .ct{font-weight:600;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.warn .ct{color:var(--warn)}
.callout.ok{border-color:var(--pos);background:var(--pos-soft)}
.callout.ok .ct{color:var(--pos)}
.callout.ko{border-color:var(--neg);background:var(--neg-soft)}
.callout.ko .ct{color:var(--neg)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--view);white-space:nowrap}
.pill.on{border-color:var(--pos);color:var(--pos);background:var(--pos-soft)}
.pill.off{border-color:var(--line);color:var(--muted)}
.pill.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-tint)}
.pill.ko{border-color:var(--neg);color:var(--neg);background:var(--neg-soft)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line-soft);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--alt);font-weight:600;font-size:13px}
.tbl td.bad{background:var(--neg-soft);color:var(--neg);font-weight:500}
.tbl td.good{background:var(--pos-soft);color:var(--pos);font-weight:500}
.tbl-wrap{overflow-x:auto}

/* Programme par blocs */
.prog{font-family:var(--mono);font-size:13.5px;display:flex;flex-direction:column;gap:4px;background:var(--alt);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px}
.blk{display:flex;align-items:center;gap:10px;background:var(--view);border:1px solid var(--line-soft);border-left:4px solid var(--c-motor);border-radius:4px;padding:5px 10px}
.blk.event{border-left-color:var(--c-event)}
.blk.ctrl{border-left-color:var(--c-ctrl)}
.blk.gap{border-style:dashed;border-left-style:solid;color:var(--muted)}
.blk.hl{outline:2px solid var(--accent);outline-offset:-1px}
.blk .n{color:var(--muted);font-size:12px;width:16px;text-align:right}
.prog-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.prog-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* ---------- Accueil ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.hero h2{font-size:26px;font-weight:600}
.obj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.obj-list li{display:flex;gap:10px;align-items:flex-start}
.obj-list li svg{flex:none;margin-top:3px;color:var(--accent-ink)}
.route{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.route-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--view);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;cursor:pointer;min-height:132px}
.route-card:hover{border-color:var(--accent)}
.route-card .step{font-size:12px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.route-card .nm{font-weight:600}
.route-card .ds{font-size:13px;color:var(--muted);flex:1}
details.note{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--alt);padding:12px 16px}
details.note summary{cursor:pointer;font-weight:600;font-size:14px}
details.note[open] summary{margin-bottom:10px}

/* ---------- Chaînes ---------- */
.chains{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.chain{display:flex;flex-direction:column;gap:6px}
.chain-label{font-size:12.5px;font-weight:600;color:var(--muted)}
.chain-row{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap}
.fn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:var(--view);border:1px solid var(--line);border-radius:5px;padding:9px 6px;cursor:pointer;font-size:13.5px}
.fn b{font-weight:600;font-size:14px}
.fn span{font-size:11.5px;color:var(--muted)}
.fn:hover{border-color:var(--accent)}
.fn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}
.arrow{flex:none;width:18px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.orders{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 0 2px 32%}
.robot-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.robot-svg{width:100%;max-width:240px;height:auto}
.rb-part{fill:var(--view);stroke:var(--line);stroke-width:1.5;transition:fill .15s,stroke .15s}
.rb-body{fill:var(--alt);stroke:var(--line);stroke-width:1.5}
.rb-wheel{fill:#3a3f44;stroke:#2a2e32}
.rb-part.hl,.rb-wheel.hl{stroke:var(--accent);stroke-width:3}
.rb-part.hl{fill:var(--accent-tint)}
.rb-text{font-family:var(--font);font-size:9.5px;fill:var(--muted);text-anchor:middle}
.rb-cable{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:3 2}
.rb-cable.hl{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:none}
.tread{animation:tread .5s linear infinite;animation-play-state:paused}
.tread.run{animation-play-state:running}
.tread.slow{animation-duration:2.6s}
.tread.slip{animation-duration:3.5s}
@keyframes tread{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.buzz{animation:buzz .09s linear infinite}
@keyframes buzz{0%{transform:translate(0,0)}50%{transform:translate(.8px,-.6px)}100%{transform:translate(0,0)}}
.snd{fill:none;stroke:var(--accent-ink);stroke-width:1.4;stroke-linecap:round}

.fn-detail h3{font-size:18px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* ---------- Démarche ---------- */
.stepper{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.step-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.step-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;font-size:14px}
.step-btn:hover{background:var(--accent-soft)}
.step-btn[aria-current="step"]{background:var(--accent-soft);border-color:var(--accent)}
.step-num{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--view)}
.step-btn[aria-current="step"] .step-num{border-color:var(--accent);color:var(--accent-ink)}
.step-btn.seen .step-num{border-color:var(--pos);color:var(--pos)}

/* ---------- Organigramme ---------- */
.flow-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.flow svg{width:100%;max-width:460px;height:auto;display:block}
.fl-node{fill:var(--view);stroke:var(--line);stroke-width:1.5}
.fl-node.on{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2.5}
.fl-txt{font-family:var(--font);font-size:12.5px;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
.fl-edge{stroke:var(--line);stroke-width:1.6;fill:none}
.fl-edge.on{stroke:var(--accent);stroke-width:2.6}
.fl-lab{font-family:var(--font);font-size:11.5px;fill:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:var(--view);border:0;padding:5px 14px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--text)}

/* ---------- Composants (familles) ---------- */
.fam-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fam{border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--view)}
.fam h4{font-size:14.5px;font-weight:600}
.fam ul{margin:0;padding-left:16px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.fam .ex{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:6px;margin-top:auto}
.fam-ico{width:40px;height:40px;color:var(--accent-ink)}

/* ---------- Exercices ---------- */
.ex-card{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--view)}
.ex-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-soft);background:var(--alt);border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
.ex-head .t{font-weight:600;font-size:14.5px;flex:1;min-width:180px}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:7px;height:12px;border-radius:2px;background:var(--line);display:block}
.lvl i.f{background:var(--accent)}
.ex-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.ex-q{font-size:15px;max-width:72ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--view);border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer;font-size:14.5px}
.opt:hover{border-color:var(--accent)}
.opt .mk{flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:50%;margin-top:2px;display:flex;align-items:center;justify-content:center}
.opt.chk .mk{border-radius:4px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-tint)}
.opt[aria-checked="true"] .mk{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .mk::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--view)}
.opt.chk[aria-checked="true"] .mk::after{width:8px;height:4px;border-radius:0;background:none;border:2px solid var(--view);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt.ok{border-color:var(--pos);background:var(--pos-soft)}
.opt.ok .mk{border-color:var(--pos);background:var(--pos)}
.opt.ko{border-color:var(--neg);background:var(--neg-soft)}
.opt.ko .mk{border-color:var(--neg);background:var(--neg)}
.match{display:flex;flex-direction:column;gap:6px}
.match-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 22px;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--line-soft);border-radius:5px}
.match-row.ok{border-color:var(--pos);background:var(--pos-soft)}
.match-row.ko{border-color:var(--neg);background:var(--neg-soft)}
select{background:var(--view);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-height:32px;width:100%;cursor:pointer}
select:hover{border-color:var(--accent)}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.order li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:5px;padding:6px 8px 6px 12px;background:var(--view)}
.order li.ok{border-color:var(--pos);background:var(--pos-soft)}
.order li.ko{border-color:var(--neg);background:var(--neg-soft)}
.order .pos{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:18px}
.order .txt{flex:1}
.order .mv{display:flex;gap:4px}
.mark-ok{color:var(--pos)}
.mark-ko{color:var(--neg)}
.feedback{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:5px;font-size:14.5px}
.feedback.ok{background:var(--pos-soft);color:var(--pos)}
.feedback.ko{background:var(--neg-soft);color:var(--neg)}
.feedback p{color:var(--text)}
.correction{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.correction h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink)}
.correction ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Exemple résolu */
.worked{border:1px solid var(--accent);border-radius:var(--r);background:var(--view);overflow:hidden}
.worked-head{background:var(--accent-tint);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--accent-soft)}
.worked-head .t{font-weight:600;flex:1}
.worked-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.w-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:ws}
.w-steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.w-steps li::before{counter-increment:ws;content:counter(ws);width:26px;height:26px;border-radius:50%;background:var(--accent-tint);border:1px solid var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.w-steps h4{font-size:14.5px;font-weight:600;margin-bottom:2px}
.w-steps li.hidden{display:none}

.fam-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fam-head .prog-txt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- Cartes mémoire ---------- */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.flashcard{width:100%;max-width:560px;min-height:230px;border:1px solid var(--line);border-radius:10px;background:var(--view);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;cursor:pointer;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.flashcard.back{border-color:var(--accent);background:var(--accent-tint)}
.flashcard .side-lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.flashcard .q{font-size:19px;font-weight:600;max-width:40ch}
.flashcard .a{font-size:16.5px;max-width:44ch}

/* ---------- Atelier ---------- */
.lab{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.stage{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--alt);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.track{width:100%;height:280px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px);background-size:100% 28px;border-radius:4px;border:1px solid var(--line-soft);background-color:var(--view)}
.mover{width:170px;transition:transform 2.4s ease-in-out}
.mover.straight{transform:translateY(-110px)}
.mover.left{transform:translate(-20px,-30px) rotate(-150deg)}
.mover.right{transform:translate(30px,-60px) rotate(80deg)}
.mover.slow{transform:translateY(-22px)}
.status-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.act-group{display:flex;flex-direction:column;gap:8px}
.act-group h4{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.act-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.act-grid .btn{justify-content:flex-start;text-align:left;font-size:13.5px}
.journal td:first-child{width:38%}
.journal tr.warn td{background:var(--warn-soft)}
.journal tr.ok td{background:var(--pos-soft)}
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check-list li{display:flex;gap:8px;align-items:flex-start}

/* ---------- Quiz ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-top .meter{flex:1;min-width:160px;margin:0}
.score{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}

.next-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:16px}

/* ---------- Réactif ---------- */
@media (max-width:980px){
  .fam-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .route{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  .btn.menu-btn{display:inline-flex}
  .hero,.chains,.stepper,.flow-wrap,.lab{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .page{padding:16px 16px 48px}
  .grid2,.grid3,.act-grid{grid-template-columns:1fr}
  .fam-cards,.route{grid-template-columns:1fr 1fr}
  .match-row{grid-template-columns:1fr 22px}
  .match-row select{grid-column:1}
  .toolbar{padding:8px 12px}
  .chain-row{flex-wrap:wrap;gap:6px}
  .chain-row .arrow{display:none}
  .fn{flex:1 1 40%}
  .orders{padding-left:0}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
  .tread,.buzz{animation:none!important}
}

function rich(s){
  if (typeof s !== "string") return s;
  return s.split("**").map((p,i)=> i%2 ? html`<strong key=${i}>${p}</strong>` : p);
}
const KEY = "techno4-diagnostic-v1";
function loadStore(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function saveStore(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} }
function permutation(n, seed){
  const a = Array.from({length:n}, (_,i)=>i);
  let s = seed * 9301 + 49297;
  for (let i=n-1;i>0;i--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if (a.every((v,i)=>v===i)) a.push(a.shift());
  return a;
}
function hashStr(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))%100000; return h+7; }

function Icon({name, size=18}){

/* ================== Robot (vue de dessus) ================== */
function Robot({hl=[], wheels={L:"stop",R:"stop"}, buzz={L:false,R:false}, labels=true}){
  const on = id => hl.includes(id) ? " hl" : "";

    const st = wheels[side];
    const cls = "tread" + (st==="run"?" run":st==="slow"?" run slow":st==="slip"?" run slip":"");
    const stripes = [];
    for (let y=-20; y<100; y+=10) stripes.push(html`<line key=${y} x1="0" y1=${y} x2="26" y2=${y} stroke="#8a9096" stroke-width="2" />`);
    return html`<g class=${cls}>${stripes}</g>`;
  };
  return html`
  <svg class="robot-svg" viewBox="0 0 240 250" role="img" aria-label="Robot vu de dessus">
    <defs>
      <clipPath id="clipL"><rect x="18" y="112" width="26" height="76" rx="6" /></clipPath>
      <clipPath id="clipR"><rect x="196" y="112" width="26" height="76" rx="6" /></clipPath>
    </defs>
    <rect class="rb-body" x="48" y="46" width="144" height="180" rx="16" />
    <g class=${"rb-sensor"}>
      <rect class=${"rb-part"+on("capteur")} x="82" y="14" width="76" height="24" rx="5" />
      <circle class=${"rb-part"+on("capteur")} cx="102" cy="26" r="8" />
      <circle class=${"rb-part"+on("capteur")} cx="138" cy="26" r="8" />
    </g>
    <rect class=${"rb-part"+on("cyberpi")} x="78" y="56" width="84" height="46" rx="6" />
    <rect class=${"rb-part"+on("ecran")} x="100" y="63" width="40" height="28" rx="3" />
    <rect class=${"rb-part"+on("carte")} x="86" y="112" width="68" height="42" rx="4" />
    <rect class=${"rb-part"+on("batterie")} x="86" y="166" width="68" height="44" rx="4" />
    <path class=${"rb-cable"+on("cableL")} d="M86 133 H72" />
    <path class=${"rb-cable"+on("cableR")} d="M154 133 H168" />
    <g class=${buzz.L?"buzz":""}><rect class=${"rb-part"+on("moteurL")} x="52" y="122" width="20" height="56" rx="3" /></g>
    <g class=${buzz.R?"buzz":""}><rect class=${"rb-part"+on("moteurR")} x="168" y="122" width="20" height="56" rx="3" /></g>
    <rect class=${"rb-wheel"+on("roue")+on("roueL")} x="18" y="112" width="26" height="76" rx="6" />
    <rect class=${"rb-wheel"+on("roue")+on("roueR")} x="196" y="112" width="26" height="76" rx="6" />
    <g clip-path="url(#clipL)"><g transform="translate(18 112)">${tread("L")}</g></g>
    <g clip-path="url(#clipR)"><g transform="translate(196 112)">${tread("R")}</g></g>
    ${buzz.L && html`<g><path class="snd" d="M6 140 q-4 10 0 20" /><path class="snd" d="M1 136 q-6 14 0 28" /></g>`}
    ${buzz.R && html`<g><path class="snd" d="M234 140 q4 10 0 20" /><path class="snd" d="M239 136 q6 14 0 28" /></g>`}
    ${labels && html`<g>
      <text class="rb-text" x="120" y="99">microcontrôleur</text>
      <text class="rb-text" x="120" y="136">carte de</text>
      <text class="rb-text" x="120" y="147">commande</text>
      <text class="rb-text" x="120" y="191">batterie</text>
      <text class="rb-text" x="31" y="204">roue G</text>
      <text class="rb-text" x="209" y="204">roue D</text>
      <text class="rb-text" x="62" y="194">mot. G</text>
      <text class="rb-text" x="178" y="194">mot. D</text>
    </g>`}
  </svg>`;
}

/* ================== Visuels réutilisables ================== */
function Program({lines, legend=true}){
  return html`<div>
    <div class="prog" role="list" aria-label="Programme">
      ${lines.map((l,i)=>html`<div role="listitem" key=${i} class=${"blk "+(l.c||"")+(l.gap?" gap":"")+(l.hl?" hl":"")}><span class="n">${i+1}</span><span>${l.t}</span></div>`)}
    </div>
    ${legend && html`<div class="prog-legend"><span style=${{"--c":"var(--c-event)"}}>Événement</span><span style=${{"--c":"var(--c-motor)"}}>Moteur (action)</span><span style=${{"--c":"var(--c-ctrl)"}}>Contrôle (attente)</span></div>`}
  </div>`;
}
function Table({head, rows, caption}){
  return html`<div class="tbl-wrap"><table class="tbl">
    ${caption && html`<caption class="small muted" style=${{textAlign:"left",paddingBottom:"6px"}}>${caption}</caption>`}
    <thead><tr>${head.map((h,i)=>html`<th key=${i} scope="col">${h}</th>`)}</tr></thead>
    <tbody>${rows.map((r,i)=>html`<tr key=${i}>${r.map((c,j)=> typeof c==="object" && c!==null && !React.isValidElement(c) ? html`<td key=${j} class=${c.cls||""}>${rich(c.t)}</td>` : html`<td key=${j}>${rich(c)}</td>`)}</tr>`)}</tbody>
  </table></div>`;
}

const FLOW_EDGES = [
  {a:"start",b:"dispo",d:"M200 47 V76"},
  {a:"dispo",b:"model",d:"M264 100 H333",lab:{x:285,y:92,t:"Non"}},
  {a:"dispo",b:"complexe",d:"M200 124 V168",lab:{x:208,y:140,t:"Oui",anchor:"start"},via:"dispoOui"},

function Flowchart({path=[]}){
  const inPath = (a,b)=> { const i = path.indexOf(a); return i>=0 && path[i+1]===b; };
  return html`<div class="flow"><svg viewBox="0 0 520 365" role="img" aria-label="Organigramme : obtenir une pièce de remplacement">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" style=${{fill:"var(--line)"}} /></marker><marker id="arrOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" style=${{fill:"var(--accent)"}} /></marker></defs>
    ${FLOW_EDGES.map((e,i)=>html`<g key=${i}>
      <path class=${"fl-edge"+(inPath(e.a,e.b)?" on":"")} d=${e.d} marker-end=${inPath(e.a,e.b)?"url(#arrOn)":"url(#arr)"} />
      ${e.lab && html`<text class="fl-lab" x=${e.lab.x} y=${e.lab.y} text-anchor=${e.lab.anchor||"middle"}>${e.lab.t}</text>`}
    </g>`)}
    ${Object.entries(FLOW_NODES).map(([id,n])=>{
      const on = path.includes(id) ? " on" : "";
      let shape;
      if (n.shape==="diamond") shape = html`<path class=${"fl-node"+on} d=${`M${n.x} ${n.y-24} L${n.x+64} ${n.y} L${n.x} ${n.y+24} L${n.x-64} ${n.y} Z`} />`;
      else shape = html`<rect class=${"fl-node"+on} x=${n.x-n.w/2} y=${n.y-n.h/2} width=${n.w} height=${n.h} rx=${n.shape==="round"?17:5} />`;
      const lines = n.t;
      return html`<g key=${id}>${shape}${lines.map((t,k)=>html`<text key=${k} class="fl-txt" x=${n.x} y=${n.y + (k-(lines.length-1)/2)*14} style=${n.shape==="diamond"?{fontSize:"11.5px"}:null}>${t}</text>`)}</g>`;
    })}
  </svg></div>`;
}
function flowPath(dispo, complexe){
  const p = ["start","dispo"];
  if (dispo===false) p.push("model");
  p.push("complexe");
  if (complexe===true) p.push("stl","print");
  if (complexe===false) p.push("dxf","usiner");
  return p;
}

function Visual({v}){
  if (!v) return null;
  if (v.kind==="program") return html`<${Program} lines=${v.lines} legend=${v.legend!==false} />`;
  if (v.kind==="table") return html`<${Table} head=${v.head} rows=${v.rows} caption=${v.caption} />`;
  if (v.kind==="flow") return html`<${Flowchart} path=${v.path} />`;
  if (v.kind==="robot") return html`<div style=${{maxWidth:"220px"}}><${Robot} hl=${v.hl||[]} /></div>`;
  if (v.kind==="text") return html`<div class="callout"><div class="ct">${v.title||"Situation"}</div><p>${rich(v.t)}</p></div>`;
  return null;
}

/* ================== Moteur d'exercices ================== */
function initValue(ex){
  if (ex.type==="qcm") return null;
  if (ex.type==="multi") return [];
  if (ex.type==="match") return {};
  if (ex.type==="order") return permutation(ex.items.length, hashStr(ex.id));
  return null;
}
function isComplete(ex,v){
  if (ex.type==="qcm") return v!==null;
  if (ex.type==="multi") return v.length>0;
  if (ex.type==="match") return ex.rows.every((_,i)=>v[i]);
  return true;
}
function evaluate(ex,v){
  if (ex.type==="qcm") return {ok: v===ex.answer};
  if (ex.type==="multi"){
    const s = new Set(v), a = new Set(ex.answers);
    let wrong = 0; ex.options.forEach((_,i)=>{ if (s.has(i)!==a.has(i)) wrong++; });
    return {ok: wrong===0, wrong};
  }
  if (ex.type==="match"){
    const marks = ex.rows.map((r,i)=> v[i]===r.a);
    return {ok: marks.every(Boolean), marks, wrong: marks.filter(m=>!m).length};
  }
  if (ex.type==="order"){
    const marks = v.map((idx,pos)=> ex.items[idx]===ex.items[pos]);
    return {ok: marks.every(Boolean), marks, wrong: marks.filter(m=>!m).length};
  }
}

function QcmBody({ex,value,onChange,result,multi}){
  const sel = i => multi ? value.includes(i) : value===i;
  const toggle = i => multi ? onChange(value.includes(i) ? value.filter(x=>x!==i) : [...value,i]) : onChange(i);
  const order = useMemo(()=> ex.keepOrder ? ex.options.map((_,i)=>i) : permutation(ex.options.length, hashStr(ex.id)), [ex.id]);
  return html`<div class="opts" role=${multi?"group":"radiogroup"}>
    ${order.map(i=>{ const o = ex.options[i];
      let cls = "opt" + (multi?" chk":"");
      if (result && sel(i) && !multi) cls += result.ok ? " ok" : " ko";
      if (result && multi && result.ok && sel(i)) cls += " ok";
      return html`<button key=${i} type="button" class=${cls} role=${multi?"checkbox":"radio"} aria-checked=${sel(i)} onClick=${()=>toggle(i)}><span class="mk"></span><span>${rich(o)}</span></button>`;
    })}
  </div>`;
}
function MatchBody({ex,value,onChange,result}){
  return html`<div class="match">
    ${ex.rows.map((r,i)=>{
      const m = result ? (result.marks[i] ? " ok" : " ko") : "";
      return html`<div key=${i} class=${"match-row"+m}>
        <label for=${ex.id+"-"+i}>${rich(r.l)}</label>
        <select id=${ex.id+"-"+i} value=${value[i]||""} onChange=${e=>onChange({...value,[i]:e.target.value})}>
          <option value="">Choisir…</option>
          ${ex.choices.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
        </select>
        <span aria-hidden="true">${result ? (result.marks[i] ? html`<span class="mark-ok"><${Icon} name="tick" /></span>` : html`<span class="mark-ko"><${Icon} name="cross" /></span>`) : ""}</span>
      </div>`;
    })}
  </div>`;
}
function OrderBody({ex,value,onChange,result}){
  const move = (pos,d)=>{ const n=[...value]; const t=pos+d; if (t<0||t>=n.length) return; [n[pos],n[t]]=[n[t],n[pos]]; onChange(n); };
  return html`<ol class="order">
    ${value.map((idx,pos)=>{
      const m = result ? (result.marks[pos] ? " ok" : " ko") : "";
      return html`<li key=${idx} class=${m.trim()}>
        <span class="pos">${pos+1}</span><span class="txt">${ex.items[idx]}</span>
        <span class="mv">
          <button type="button" class="btn sm icon" aria-label=${"Monter : "+ex.items[idx]} disabled=${pos===0} onClick=${()=>move(pos,-1)}><${Icon} name="up" size=${16} /></button>
          <button type="button" class="btn sm icon" aria-label=${"Descendre : "+ex.items[idx]} disabled=${pos===value.length-1} onClick=${()=>move(pos,1)}><${Icon} name="down" size=${16} /></button>
        </span>
      </li>`;
    })}
  </ol>`;
}

function ExerciseCard({ex, num, solved, onSolved, compact}){
  const [value,setValue] = useState(()=>initValue(ex));
  const [result,setResult] = useState(null);
  const [attempted,setAttempted] = useState(false);
  const [show,setShow] = useState(null);
  const change = v => { setValue(v); setResult(null); };
  const check = () => { const r = evaluate(ex,value); setResult(r); setAttempted(true); if (r.ok && onSolved) onSolved(ex.id); };
  const giveUp = () => { setAttempted(true); setShow("simple"); };
  const reset = () => { setValue(initValue(ex)); setResult(null); setShow(null); };
  const Body = ex.type==="match" ? MatchBody : ex.type==="order" ? OrderBody : QcmBody;
  const detail = Array.isArray(ex.detail) ? ex.detail : [ex.detail];
  return html`<article class="ex-card">
    <div class="ex-head">
      ${num && html`<span class="pill acc">${num}</span>`}
      <span class="t">${ex.titre || "Vérifie ta compréhension"}</span>
      ${ex.level && html`<${Level} n=${ex.level} />`}
      ${solved && html`<span class="pill on"><${Icon} name="tick" size=${13} /> Réussi</span>`}
    </div>
    <div class="ex-body">
      ${ex.visual && html`<${Visual} v=${ex.visual} />`}
      <p class="ex-q">${rich(ex.q)}</p>
      <${Body} ex=${ex} value=${value} onChange=${change} result=${result} multi=${ex.type==="multi"} />
      ${result && (result.ok
        ? html`<div class="feedback ok" role="status"><${Icon} name="tick" /><p><strong>Bonne réponse.</strong> ${compact ? rich(detail[0]) : "Lis la correction détaillée pour vérifier ton raisonnement."}</p></div>`
        : html`<div class="feedback ko" role="status"><${Icon} name="cross" /><p><strong>Pas encore.</strong> ${result.wrong ? (result.wrong===1 ? "Un élément est à revoir." : result.wrong+" éléments sont à revoir.") : "Relis la situation et réessaie."} Modifie ta réponse, ou consulte la correction.</p></div>`)}
      <div class="btn-row">
        <button type="button" class="btn primary" disabled=${!isComplete(ex,value)} onClick=${check}>Vérifier</button>
        ${!attempted && html`<button type="button" class="btn" onClick=${giveUp}>Je ne sais pas</button>`}
        ${attempted && html`<button type="button" class="btn" aria-pressed=${show==="simple"} onClick=${()=>setShow(show==="simple"?null:"simple")}>Correction simple</button>`}
        ${attempted && html`<button type="button" class="btn" aria-pressed=${show==="detail"} onClick=${()=>setShow(show==="detail"?null:"detail")}>Correction détaillée</button>`}
        ${attempted && html`<button type="button" class="btn sm" onClick=${reset}>Recommencer</button>`}
        ${!attempted && html`<span class="small muted">Réponds d'abord : les corrections s'affichent ensuite.</span>`}
      </div>
      ${show==="simple" && html`<div class="correction"><h4>Correction simple</h4><p>${rich(ex.simple)}</p></div>`}
      ${show==="detail" && html`<div class="correction"><h4>Correction détaillée</h4><ul>${detail.map((d,i)=>html`<li key=${i}>${rich(d)}</li>`)}</ul></div>`}
    </div>
  </article>`;
}

  const [n,setN] = useState(1);

  return html`<section class="worked" aria-label="Exemple résolu">
    <div class="worked-head"><span class="pill acc"><${Icon} name="bulb" size=${13} /> Exemple résolu</span><span class="t">${rich(w.titre)}</span></div>
    <div class="worked-body">
      ${w.visual && html`<${Visual} v=${w.visual} />`}
      <ol class="w-steps">
        ${w.steps.map((s,i)=>html`<li key=${i} class=${i<n?"":"hidden"}><span></span><div><h4>${s.h}</h4><p>${rich(s.t)}</p></div></li>`)}
      </ol>
      ${all
        ? html`<div class="callout ok"><div class="ct">Conclusion</div><p>${rich(w.conclusion)}</p><p class="small" style=${{marginTop:"6px"}}><strong>Méthode :</strong> ${w.methode}</p></div>`
        : html`<div class="btn-row"><button type="button" class="btn primary" onClick=${()=>setN(n+1)}>Étape suivante <span class="muted small">(${n}/${w.steps.length})</span></button><button type="button" class="btn" onClick=${()=>setN(w.steps.length)}>Tout afficher</button></div>`}
    </div>
  </section>`;
}

/* ---------- Cartes mémoire ---------- */
function Cartes({onKnown}){
  const [queue,setQueue] = useState(()=>CARDS.map((_,i)=>i));
  const [flip,setFlip] = useState(false);
  const [known,setKnown] = useState(0);
  const [again,setAgain] = useState(0);
  const cur = queue[0];
  const rate = ok => {
    if (ok){ setKnown(known+1); setQueue(queue.slice(1)); onKnown(known+1); }
    else { setAgain(again+1); setQueue([...queue.slice(1), cur]); }
    setFlip(false);
  };
  const restart = shuffle => { const base = CARDS.map((_,i)=>i); setQueue(shuffle ? permutation(base.length, Date.now()%9973) : base); setKnown(0); setAgain(0); setFlip(false); };
  useEffect(()=>{
    const h = e => { if (e.target.tagName==="BUTTON" || e.target.tagName==="SELECT") return; if (e.code==="Space" && cur!==undefined){ e.preventDefault(); setFlip(f=>!f); } };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  },[cur]);
  const pct = Math.round(known/CARDS.length*100);
  return html`<div class="page">
    <div class="stack">
      <p class="lead">Lis la question, <strong>réponds dans ta tête</strong>, puis retourne la carte. Sois honnête : les cartes non sues reviennent en fin de paquet.</p>
      <div class="quiz-top"><span class="small muted" style=${{fontVariantNumeric:"tabular-nums"}}>${known} / ${CARDS.length} sues</span><div class="meter"><span style=${{width:pct+"%"}}></span></div><span class="small muted">${again} à revoir</span></div>
    </div>
    ${cur!==undefined ? html`<div class="fc-wrap">
      <button type="button" class=${"flashcard"+(flip?" back":"")} onClick=${()=>setFlip(!flip)} aria-label=${flip?"Retourner vers la question":"Afficher la réponse"}>
        <span class="side-lbl">${flip?"Réponse":"Question"}</span>
        ${flip ? html`<span class="a">${CARDS[cur].a}</span>` : html`<span class="q">${CARDS[cur].q}</span>`}
        ${!flip && html`<span class="small muted">Clique ou appuie sur Espace pour retourner</span>`}
      </button>
      <div class="btn-row">
        ${flip ? html`<button type="button" class="btn" onClick=${()=>rate(false)}><${Icon} name="flip" size=${16} /> À revoir</button><button type="button" class="btn primary" onClick=${()=>rate(true)}><${Icon} name="tick" size=${16} /> Je savais</button>`
               : html`<button type="button" class="btn primary" onClick=${()=>setFlip(true)}>Voir la réponse</button>`}
      </div>
    </div>` : html`<div class="callout ok"><div class="ct">Paquet terminé</div><p>Les ${CARDS.length} cartes sont sues. ${again>0 ? "Tu as eu besoin de "+again+" passage(s) supplémentaire(s) : refais le paquet demain pour ancrer ces notions." : "Sans aucune erreur : bravo. Refais-le dans quelques jours pour vérifier que tu t'en souviens."}</p><div class="btn-row" style=${{marginTop:"10px"}}><button type="button" class="btn" onClick=${()=>restart(false)}>Recommencer</button><button type="button" class="btn primary" onClick=${()=>restart(true)}>Recommencer dans le désordre</button></div></div>`}
  </div>`;
}

   swap:"Les deux roues tournent toujours très lentement. **L'échange ne change rien** : la panne ne vient ni d'un moteur ni d'un port."}
];
const OBS_TXT = {ok:"La roue tourne 5 s puis s'arrête.", none:"La roue ne tourne pas. Aucun bruit de moteur.", slip:"On entend le moteur, mais la roue tourne à peine.", slow:"La roue tourne, mais très lentement."};
const INTERV = [
  {id:"cable", t:"Rebrancher correctement le câble du moteur gauche"},
  {id:"roue", t:"Resserrer la vis de la roue droite"},
  {id:"moteur", t:"Remplacer le moteur gauche (pièce demandée à l'enseignant)"},
  {id:"batterie", t:"Recharger la batterie"}
];
function Atelier({onRepaired}){
  const [si,setSi] = useState(()=>Math.floor(Math.random()*SCEN.length));
  const sc = SCEN[si];
  const [power,setPower] = useState(true);
  const [fixed,setFixed] = useState(false);
  const [phase,setPhase] = useState(null);
  const [journal,setJournal] = useState([]);
  const [flags,setFlags] = useState({ranBefore:false, tests:0, interventions:0, miss:false, rerun:false, final:null});
  const [mover,setMover] = useState("");
  const timers = useRef([]);
  useEffect(()=>()=>timers.current.forEach(clearTimeout),[]);
  const later = (fn,ms)=>{ timers.current.push(setTimeout(fn,ms)); };
  const log = (k,t,r)=> setJournal(j=>[...j,{k,t,r}]);
  const busy = phase!==null;
  const sideState = side => fixed ? "ok" : sc.obs[side];

  const runProgram = () => {
    if (!power){ log("warn","Lancer le programme de test","Le robot est éteint : allume-le d'abord."); return; }
    setPhase("L");
    later(()=>setPhase("R"),2600);
    later(()=>{
      setPhase(null);
      const after = flags.interventions>0;
      const l = sideState("L"), r = sideState("R");
      log(l==="ok"?"":"bad","Commander le moteur gauche"+(after?" (après intervention)":""), OBS_TXT[l]);
      log(r==="ok"?"":"bad","Commander le moteur droit"+(after?" (après intervention)":""), OBS_TXT[r]);
      setFlags(f=>({...f, ranBefore: f.ranBefore || f.interventions===0, rerun: f.rerun || (fixed && f.interventions>0)}));
    },5200);
  };
  const needOff = (label, fn) => {
    if (power){ log("warn",label,"Éteins le robot avant de manipuler les roues ou les câbles."); return; }
    fn();
  };
  const test = kind => {
    if (kind==="bat"){
      if (!power){ log("warn","Lire le niveau de batterie","L'écran est éteint : allume le robot pour lire le niveau."); return; }
      const v = fixed && sc.id==="batterie" ? 100 : sc.bat;
      log(v<20?"bad":"","Lire le niveau de batterie à l'écran","L'écran affiche "+v+" %.");
    }
    if (kind==="roues") needOff("Examiner les roues et leurs fixations", ()=>log(sc.id==="roue"&&!fixed?"bad":"","Examiner les roues et leurs fixations (robot éteint)", fixed&&sc.id==="roue" ? "Les deux roues sont bien fixées, sans jeu." : sc.roues));
    if (kind==="cables") needOff("Vérifier le branchement des câbles", ()=>log(sc.id==="cable"&&!fixed?"bad":"","Vérifier le branchement des câbles (robot éteint)", fixed&&sc.id==="cable" ? "Tous les câbles sont correctement branchés." : sc.cables));
    if (kind==="swap") needOff("Échanger les câbles des moteurs", ()=>log("","Échanger les câbles des moteurs, rallumer, relancer le même programme, puis remettre les câbles", fixed ? "Les deux roues tournent normalement sur les deux ports." : sc.swap));
    if (!(kind==="bat" && !power) && !(kind!=="bat" && power)) setFlags(f=>({...f, tests: f.interventions===0 ? f.tests+1 : f.tests}));
  };
  const intervene = id => {
    const it = INTERV.find(x=>x.id===id);
    if (power){ log("warn",it.t,"Précaution oubliée : le robot est allumé. Éteins-le et débranche la batterie avant toute intervention."); setFlags(f=>({...f,miss:true})); return; }
    const ok = id===sc.fix;
    if (ok) setFixed(true);
    setFlags(f=>({...f, interventions:f.interventions+1}));
    log("",it.t,"Intervention réalisée. Rallume le robot et relance le même programme pour vérifier.");
  };
  const finalTest = () => {
    if (!power){ log("warn","Test final","Le robot est éteint : allume-le d'abord."); return; }
    const kind = fixed ? "straight" : sc.final;
    setPhase("final"); setMover(kind);
    later(()=>{
      setPhase(null);
      const txt = {straight:"Le robot avance en ligne droite.", left:"Le robot tourne sur lui-même vers la gauche.", right:"Le robot dévie vers la droite.", slow:"Le robot avance à peine."}[kind];
      log(fixed?"ok":"bad","Test final : faire déplacer le robot", txt);
      setFlags(f=>({...f, final: fixed}));
      if (fixed) onRepaired();
    },2800);
    later(()=>setMover(""),3600);
  };
  const reset = () => {
    timers.current.forEach(clearTimeout); timers.current=[];
    let n = Math.floor(Math.random()*SCEN.length); if (n===si) n=(n+1)%SCEN.length;
    setSi(n); setPower(true); setFixed(false); setPhase(null); setJournal([]); setMover("");
    setFlags({ranBefore:false, tests:0, interventions:0, miss:false, rerun:false, final:null});
  };
  const wheelAnim = side => {
    if (phase!==side) return "stop";
    const s = sideState(side);
    return s==="ok"?"run":s==="slow"?"slow":s==="slip"?"slip":"stop";
  };
  const buzzOn = side => phase===side && ["ok","slip","slow"].includes(sideState(side));
  const done = flags.final===true;
  const crit = [
    {ok:flags.ranBefore, t:"Programme de test lancé avant toute intervention"},
    {ok:flags.tests>0, t:"Au moins un test réalisé avant d'intervenir ("+flags.tests+")"},
    {ok:!flags.miss, t:"Robot éteint pendant chaque intervention"},
    {ok:flags.interventions===1, t:"Une seule intervention, la bonne ("+flags.interventions+" au total)"},
    {ok:flags.rerun, t:"Même programme relancé après l'intervention"},
    {ok:done, t:"Test final réussi"}
  ];
  const phaseTxt = phase==="L" ? "Programme en cours : moteur gauche (5 s)" : phase==="R" ? "Programme en cours : moteur droit (5 s)" : phase==="final" ? "Test final en cours" : "En attente";
  return html`<div class="page">
    <div class="callout"><div class="ct">Mission</div><p>Un robot revient en panne. ${rich(sc.symptome)} Trouve la cause en suivant la démarche, répare-le en sécurité, puis vérifie.</p></div>
    <section class="lab">
      <div class="stage">
        <div class="track"><div class=${"mover "+mover}><${Robot} labels=${false} wheels=${{L:wheelAnim("L"),R:wheelAnim("R")}} buzz=${{L:buzzOn("L"),R:buzzOn("R")}} /></div></div>
        <div class="status-row">
          <span class=${"pill "+(power?"on":"off")}><span class="dot"></span>${power?"Robot allumé":"Robot éteint, batterie débranchée"}</span>
          <span class=${"pill "+(phase?"acc":"")} aria-live="polite">${phaseTxt}</span>
        </div>
        <button type="button" class="btn" disabled=${busy} onClick=${()=>{ setPower(!power); log("", power?"Éteindre le robot et débrancher la batterie":"Rebrancher la batterie et allumer le robot", power?"Le robot est hors tension.":"Le robot est sous tension."); }}><${Icon} name="power" size=${16} /> ${power?"Éteindre et débrancher":"Rebrancher et allumer"}</button>
      </div>
      <div class="stack">
        <div class="act-group">
          <h4>1. Observer</h4>
          <div class="btn-row"><button type="button" class="btn primary" disabled=${busy} onClick=${runProgram}><${Icon} name="play" size=${16} /> Lancer le programme de test</button><span class="small muted">Gauche 5 s, puis droit 5 s</span></div>
        </div>
        <div class="act-group">
          <h4>2. Tester une hypothèse</h4>
          <div class="act-grid">
            <button type="button" class="btn" disabled=${busy} onClick=${()=>test("bat")}>Lire le niveau de batterie</button>
            <button type="button" class="btn" disabled=${busy} onClick=${()=>test("roues")}>Examiner les roues et fixations</button>
            <button type="button" class="btn" disabled=${busy} onClick=${()=>test("cables")}>Vérifier le branchement des câbles</button>
            <button type="button" class="btn" disabled=${busy} onClick=${()=>test("swap")}>Échanger les câbles des deux moteurs</button>
          </div>
        </div>
        <div class="act-group">
          <h4>3. Intervenir</h4>
          <div class="act-grid">${INTERV.map(it=>html`<button key=${it.id} type="button" class="btn" disabled=${busy} onClick=${()=>intervene(it.id)}>${it.t}</button>`)}</div>
        </div>
        <div class="act-group">
          <h4>4. Vérifier</h4>
          <div class="btn-row"><button type="button" class="btn" disabled=${busy} onClick=${runProgram}>Relancer le même programme</button><button type="button" class="btn primary" disabled=${busy} onClick=${finalTest}>Test final : faire déplacer le robot</button></div>
        </div>
      </div>
    </section>
    <section class="stack">
      <div class="fam-head"><div class="sec-title">Cahier de diagnostic</div><span class="small muted">${journal.length} ligne(s)</span><span style=${{flex:1}}></span><button type="button" class="btn sm" onClick=${reset}>Nouvelle panne</button></div>
      ${journal.length===0 ? html`<p class="small muted">Commence par lancer le programme de test : les observations s'inscriront ici.</p>` :
        html`<div class="tbl-wrap"><table class="tbl journal"><thead><tr><th scope="col">Vérification ou action</th><th scope="col">Résultat observé</th></tr></thead>
        <tbody>${journal.map((l,i)=>html`<tr key=${i} class=${l.k==="warn"?"warn":l.k==="ok"?"ok":""}><td>${l.t}</td><td class=${l.k==="bad"?"bad":""}>${rich(l.r)}</td></tr>`)}</tbody></table></div>`}
    </section>
    ${done && html`<section class="frame stack">
      <div class="sec-title">Bilan de ta démarche</div>
      <ul class="check-list">${crit.map((c,i)=>html`<li key=${i}><span class=${c.ok?"mark-ok":"mark-ko"}><${Icon} name=${c.ok?"tick":"cross"} size=${18} /></span><span>${c.t}</span></li>`)}</ul>
      <p class="small muted">Panne de cette partie : ${{cable:"câble du moteur gauche mal branché",roue:"roue droite desserrée",moteur:"moteur gauche défectueux",batterie:"batterie déchargée"}[sc.id]}.</p>
      <div class="btn-row"><button type="button" class="btn primary" onClick=${reset}>Diagnostiquer une autre panne</button></div>
    </section>`}
  </div>`;
}

/* ---------- Famille d'exercices ---------- */
function Famille({fam, n, solved, onSolved, go}){
  const count = fam.items.filter(e=>solved.includes(e.id)).length;
  return html`<div class="page">
    <div class="stack">
      <div class="fam-head"><span class="small muted">S'entraîner · Famille ${n} sur ${EXOS.length}</span><span class="prog-txt">${count}/${fam.items.length} réussis</span></div>
      <p class="lead">${fam.objectif}</p>
      <p class="small muted">Lis d'abord l'exemple résolu, étape par étape. Les exercices suivent, du niveau 1 (guidé) au niveau 3 (autonome). <button type="button" class="btn sm" onClick=${()=>go(fam.lien)}>Revoir la notion</button></p>
    </div>
    <${Worked} key=${fam.id} w=${fam.worked} />
    ${fam.items.map((ex,i)=>html`<${ExerciseCard} key=${ex.id} ex=${ex} num=${"Exercice "+(i+1)} solved=${solved.includes(ex.id)} onSolved=${onSolved} />`)}
    <nav class="next-nav">
      ${n>1 ? html`<button type="button" class="btn" onClick=${()=>go("famille-"+(n-1))}><${Icon} name="left" size=${16} /> Famille précédente</button>` : html`<span></span>`}
      ${n<EXOS.length ? html`<button type="button" class="btn primary" onClick=${()=>go("famille-"+(n+1))}>Famille suivante : ${EXOS[n].court} <${Icon} name="right" size=${16} /></button>` : html`<button type="button" class="btn primary" onClick=${()=>go("quiz")}>Passer au quiz bilan <${Icon} name="right" size=${16} /></button>`}
    </nav>
  </div>`;
}

/* ---------- Quiz ---------- */
function Quiz({onScore, go}){
  const [i,setI] = useState(0);
  const [pick,setPick] = useState(null);
  const [answers,setAnswers] = useState([]);
  const done = i>=QUIZ.length;
  const q = QUIZ[i];
  const validate = () => setAnswers([...answers, pick]);
  const next = () => { const ni=i+1; setI(ni); setPick(null); if (ni>=QUIZ.length) onScore(answers.filter((a,k)=>a===QUIZ[k].answer).length); };
  const answered = answers.length>i;
  const score = answers.filter((a,k)=>a===QUIZ[k].answer).length;
  if (done){
    const missed = QUIZ.map((qq,k)=>({qq,k})).filter(({qq,k})=>answers[k]!==qq.answer);
    const lessons = [...new Set(missed.map(m=>m.qq.lien))];
    return html`<div class="page">
      <section class="frame stack">
        <div class="sec-title">Résultat</div>
        <div class="btn-row"><span class="score">${score}/10</span><span class="muted">${score>=8?"Les notions sont bien maîtrisées.":score>=5?"C'est en bonne voie : revois les notions indiquées.":"Reprends les notions indiquées, puis refais le quiz."}</span></div>
        ${missed.length>0 && html`<div class="stack"><p class="small"><strong>Questions à revoir :</strong></p>
          <ul class="check-list">${missed.map(({qq,k})=>html`<li key=${k}><span class="mark-ko"><${Icon} name="cross" size=${18} /></span><span><strong>${qq.q}</strong> ${qq.options[qq.answer]}. <span class="muted">${qq.exp}</span></span></li>`)}</ul>
          <div class="btn-row">${lessons.map(l=>html`<button key=${l} type="button" class="btn" onClick=${()=>go(l)}>Revoir : ${TITLES[l]}</button>`)}</div></div>`}
        <div class="btn-row"><button type="button" class="btn primary" onClick=${()=>{setI(0);setPick(null);setAnswers([]);}}>Refaire le quiz</button></div>
      </section>
    </div>`;
  }
  const ok = answered && answers[i]===q.answer;
  return html`<div class="page">
    <div class="quiz-top"><span class="small muted" style=${{fontVariantNumeric:"tabular-nums"}}>Question ${i+1} / ${QUIZ.length}</span><div class="meter"><span style=${{width:(i/QUIZ.length*100)+"%"}}></span></div><span class="small muted" style=${{fontVariantNumeric:"tabular-nums"}}>Score : ${score}</span></div>
    <article class="ex-card">
      <div class="ex-body">
        <p class="ex-q" style=${{fontSize:"17px",fontWeight:600}}>${q.q}</p>
        <div class="opts" role="radiogroup">
          ${permutation(q.options.length, i*17+3).map(k=>{ const o = q.options[k];
            let cls="opt";
            if (answered){ if (k===q.answer) cls+=" ok"; else if (k===answers[i]) cls+=" ko"; }
            return html`<button key=${k} type="button" class=${cls} role="radio" aria-checked=${answered ? k===answers[i] : pick===k} disabled=${answered} onClick=${()=>setPick(k)}><span class="mk"></span><span>${o}</span></button>`;
          })}
        </div>
        ${answered && html`<div class=${"feedback "+(ok?"ok":"ko")} role="status"><${Icon} name=${ok?"tick":"cross"} /><p><strong>${ok?"Exact.":"Non."}</strong> ${q.exp}</p></div>`}
        <div class="btn-row">
          ${!answered ? html`<button type="button" class="btn primary" disabled=${pick===null} onClick=${validate}>Valider</button>`
                      : html`<button type="button" class="btn primary" onClick=${next}>${i===QUIZ.length-1?"Voir le résultat":"Question suivante"} <${Icon} name="right" size=${16} /></button>`}
        </div>
      </div>
    </article>
  </div>`;
}

/* ================== Application ================== */
function App(){
  const initial = (()=>{ const h=(location.hash||"").slice(1); return VIEW_IDS.includes(h)?h:"accueil"; })();
  const [view,setView] = useState(initial);
  const [store,setStore] = useState(()=>({solved:[], seen:[], cards:0, quiz:null, lab:0, ...loadStore()}));
  const [drawer,setDrawer] = useState(false);
  const scrollRef = useRef(null);
  useEffect(()=>{ saveStore(store); },[store]);
  useEffect(()=>{
    const h = ()=>{ const v=(location.hash||"").slice(1); if (VIEW_IDS.includes(v)) setView(v); };
    window.addEventListener("hashchange",h); return ()=>window.removeEventListener("hashchange",h);
  },[]);
  useEffect(()=>{
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    if (LESSONS.some(l=>l.id===view) && !store.seen.includes(view)) setStore(s=>({...s, seen:[...s.seen, view]}));
  },[view]);
  const go = v => { setView(v); setDrawer(false); try { if (location.hash.slice(1)!==v) history.replaceState(null,"","#"+v); } catch(e){} };
  const onSolved = id => setStore(s=> s.solved.includes(id) ? s : {...s, solved:[...s.solved,id]});
  const allEx = EXOS.flatMap(f=>f.items.map(e=>e.id));
  const stats = {
    lessons: store.seen.length, cards: store.cards, lab: store.lab, quiz: store.quiz,
    solved: allEx.filter(id=>store.solved.includes(id)).length, total: allEx.length
  };
  const overall = Math.round(((stats.lessons/4) + (stats.cards/CARDS.length) + Math.min(stats.lab,1) + (stats.solved/stats.total) + (stats.quiz!=null ? stats.quiz/10 : 0)) / 5 * 100);
  const famIdx = view.startsWith("famille-") ? parseInt(view.split("-")[1],10) : 0;
  const lessonProps = {solved:store.solved, onSolved, go};
  let page;
  if (view==="accueil") page = html`<${Accueil} go=${go} stats=${stats} />`;
  else if (view==="chaines") page = html`<${Chaines} ...${lessonProps} />`;
  else if (view==="demarche") page = html`<${Demarche} ...${lessonProps} />`;
  else if (view==="procedure") page = html`<${Procedure} ...${lessonProps} />`;
  else if (view==="composants") page = html`<${Composants} ...${lessonProps} />`;
  else if (view==="cartes") page = html`<${Cartes} onKnown=${k=>setStore(s=>({...s, cards:Math.max(s.cards,k)}))} />`;
  else if (view==="atelier") page = html`<${Atelier} onRepaired=${()=>setStore(s=>({...s, lab:s.lab+1}))} />`;
  else if (famIdx) page = html`<${Famille} key=${view} fam=${EXOS[famIdx-1]} n=${famIdx} solved=${store.solved} onSolved=${onSolved} go=${go} />`;
  else if (view==="quiz") page = html`<${Quiz} go=${go} onScore=${sc=>setStore(s=>({...s, quiz: s.quiz==null ? sc : Math.max(s.quiz,sc)}))} />`;
  const groupOf = (()=>{ let g="Accueil"; for (const n of NAV){ if (n.group) g=n.group; if (n.id===view) return n.id==="accueil"?"":g; } return ""; })();
  const famBadge = f => { const c=f.items.filter(e=>store.solved.includes(e.id)).length; return c===f.items.length ? html`<span class="badge done"><${Icon} name="tick" size=${14} /></span>` : html`<span class="badge">${c}/${f.items.length}</span>`; };
  return html`<div class="app">
    <aside class=${"side"+(drawer?" open":"")} aria-label="Navigation">
      <div class="side-head"><div class="sub">Technologie · 4e</div><div class="ttl">Diagnostiquer et réparer</div></div>
      <nav>
        ${NAV.map((n,i)=> n.group ? html`<div key=${"g"+i} class="nav-group">${n.group}</div>` :
          html`<button key=${n.id} type="button" class="nav-item" aria-current=${view===n.id?"page":null} onClick=${()=>go(n.id)}>
            <${Icon} name=${n.icon} /><span class="lbl">${n.label}</span>
            ${n.fam ? famBadge(n.fam) : n.lesson && store.seen.includes(n.id) ? html`<span class="badge done"><${Icon} name="tick" size=${14} /></span>` : n.id==="quiz" && store.quiz!=null ? html`<span class="badge">${store.quiz}/10</span>` : null}
          </button>`)}
      </nav>
      <div class="side-foot">Progression globale : ${overall} %<div class="meter"><span style=${{width:overall+"%"}}></span></div></div>
    </aside>
    ${drawer && html`<div class="scrim" onClick=${()=>setDrawer(false)}></div>`}
    <main class="main">
      <header class="toolbar">
        <button type="button" class="btn icon menu-btn" aria-label="Ouvrir le menu" onClick=${()=>setDrawer(true)}><${Icon} name="menu" /></button>
        <div><div class="crumb">${groupOf || "Séance 3"}</div><h1>${view==="accueil" ? "Accueil" : famIdx ? EXOS[famIdx-1].titre : (TITLES[view]||"").replace(/^\d\.\s/,"")}</h1></div>
        <span class="spacer"></span>
      </header>
      <div class="scroll" ref=${scrollRef}>${page}</div>
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
