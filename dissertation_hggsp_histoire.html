  course: [
    { t: 'De quoi parle ce chapitre ?', b: `En **1814**, l’Empire de Napoléon s’effondre. Les rois vainqueurs (Royaume-Uni, Autriche, Prusse, Russie) veulent **effacer la Révolution française** et rétablir l’ordre monarchique.

Mais l’Europe de 1815 n’est plus celle de 1789. Les armées de la Révolution et de Napoléon ont diffusé deux grandes idées :`, terms: [
      ['Aspirations libérales', 'Réclamer les **droits de l’individu** (libertés) et l’**égalité** entre les citoyens.'],
      ['Aspirations nationales', 'La volonté d’un peuple, qui partage une langue, une culture ou une histoire, de **former son propre État**.']
    ], key: 'Problématique du cours : pourquoi le retour à l’ordre monarchique déclenche-t-il des révolutions en Europe et en France après 1814 ?' },

    { t: 'Le congrès de Vienne (1814-1815)', b: `De **septembre 1814 à juin 1815**, les vainqueurs de Napoléon se réunissent à **Vienne**, autour du chancelier autrichien **Metternich**.

- Ils veulent **effacer les traces de la domination française**.
- Ils **redessinent les frontières** de l’Europe et **remettent les rois sur leur trône** : c’est le principe de **légitimité dynastique**.
- Les peuples ne sont pas consultés : la Pologne est partagée, l’Italie est divisée et dominée par l’Autriche.
- Les grandes puissances inventent une **nouvelle diplomatie** : se réunir pour régler les conflits. C’est le **concert européen**.`, key: 'Le congrès de Vienne veut garantir la paix, mais il ignore les aspirations des peuples.' },

    { t: 'Deux alliances pour garder l’ordre', b: `Pour faire respecter les décisions de Vienne, les rois forment deux alliances en **1815** :`, terms: [
      ['Sainte-Alliance', 'Autriche, Prusse et Russie. Elle garantit la stabilité de l’Europe et le retour à l’ordre monarchique. Elle réprime les révolutions.'],
      ['Quadruple-Alliance', 'Les mêmes, avec le **Royaume-Uni**. Son but : empêcher la France de redevenir une menace pour l’Europe.']
    ], key: 'Ces alliances sont antirévolutionnaires : elles écrasent les révoltes libérales et nationales.' },

    { t: 'Le réveil des nations', b: `Au XIXe siècle, une **nationalité** est un peuple **sans État**, qui veut être reconnu comme une nation souveraine. Le **principe des nationalités**, c’est le **droit des peuples à disposer d’eux-mêmes**.

Dès **1820**, des **insurrections libérales et nationales** éclatent : en Espagne, au Portugal, en Italie, en Grèce. Elles sont souvent **réprimées** par les grandes puissances.`, key: 'Les idées de la Révolution française continuent à circuler, malgré la répression.' },

    { t: 'La Grèce, une nation qui gagne (1821-1830)', b: `Au début du XIXe siècle, la Grèce est une province de l’**Empire ottoman**. Influencés par les idées libérales et nationales, les Grecs se **soulèvent en 1821**.

- **1822 : le massacre de Chios.** Les troupes ottomanes massacrent la population de l’île.
- **Les artistes s’engagent** : **Delacroix** peint *Scènes des massacres de Scio* (1824) ; **Victor Hugo** écrit le poème « L’Enfant » (1829). Des **comités philhellènes** (« amis des Grecs ») soutiennent les insurgés.
- **Les États interviennent** : la France, le Royaume-Uni et la Russie envoient une flotte. Victoire décisive de **Navarin** (1827).
- Par le **traité d’Andrinople** (14 septembre 1829), le sultan Mahmoud II reconnaît la Grèce, qui devient **indépendante en 1830**.`, key: 'La Grèce et la Belgique (1830) sont les deux seules nations nouvelles de la période. Ailleurs (Pologne, Italie), c’est l’échec.' },

    { t: 'Louis XVIII et la Charte de 1814', b: `Après l’abdication de Napoléon, **Louis XVIII**, frère de Louis XVI, monte sur le trône avec le soutien des puissances victorieuses. Il veut **réconcilier** les monarchistes et les anciens révolutionnaires.

Il **octroie** (accorde) la **Charte de 1814**, une constitution : la France devient une **monarchie constitutionnelle**.`, terms: [
      ['Ce que la Charte garde de la Révolution', 'L’**égalité devant la loi** (article 1), les libertés d’expression et de la presse, le Code civil.'],
      ['Ce que la Charte rend au roi', '« La personne du roi est **inviolable et sacrée** » (article 13). Le roi propose les lois, nomme les ministres, peut gouverner par ordonnances.'],
      ['Les symboles', 'Le **drapeau blanc** remplace le drapeau tricolore ; *La Marseillaise* est interdite.'],
      ['Le vote', 'Le **suffrage censitaire** : seuls les hommes riches, qui paient beaucoup d’impôts, votent.']
    ], key: 'La Charte est un compromis : elle conserve des acquis de la Révolution, mais elle réaffirme l’autorité du roi.' },

    { t: 'Charles X, un roi tourné vers le passé (1824-1830)', b: `À la mort de Louis XVIII (1824), son frère **Charles X** devient roi. Il veut une monarchie qui **renoue avec l’Ancien Régime** et l’absolutisme.

- En **1825**, il se fait **sacrer à Reims**, comme les rois d’avant 1789. Son portrait en costume de sacre montre ce retour au passé.
- Il mène une politique **autoritaire**, favorable aux nobles et à l’Église.
- En **juillet 1830**, ses **ordonnances** suppriment la liberté de la presse et dissolvent la Chambre des députés.`, key: 'Le titre de ton cours le dit : Charles X est « un monarque autoritaire renversé ».' },

    { t: '1830 : les Trois Glorieuses', comp: true, b: `Les **27, 28 et 29 juillet 1830**, les Parisiens se soulèvent contre les ordonnances : ce sont les **Trois Glorieuses**. Charles X **abdique**.

- **Louis-Philippe** devient « **roi des Français** » : c’est la **monarchie de Juillet**.
- Le **drapeau tricolore** revient. La Charte est révisée. Plus d’hommes peuvent voter, mais le suffrage reste censitaire.
- **Delacroix** peint *La Liberté guidant le peuple* (1830).

La révolution se diffuse en Europe : la **Belgique** devient indépendante (1830-1831), mais la **Pologne** (1831) et l’**Italie** sont écrasées.`, key: 'Point de passage du programme : 1830, les Trois Glorieuses.' },

    { t: 'La monarchie de Juillet (1830-1848)', comp: true, b: `Louis-Philippe gouverne avec la **bourgeoisie**. Mais beaucoup sont déçus :

- le vote reste réservé aux plus riches (environ **240 000 électeurs** pour plus de 30 millions d’habitants) ;
- les ouvriers sont pauvres : révoltes des **canuts** (ouvriers de la soie) à **Lyon** en 1831 et 1834 ;
- les **républicains** réclament le **suffrage universel**.

En Europe, les patriotes s’organisent : l’Italien **Mazzini** fonde la **Jeune Italie** (1831), puis la **Jeune Europe** (1834).`, key: 'La monarchie de Juillet refuse d’élargir le droit de vote : cela prépare la révolution de 1848.' },

    { t: '1848 en France : la IIe République', comp: true, b: `En **février 1848** (22-24 février), Paris se soulève. Louis-Philippe abdique. La **IIe République** est proclamée. Le poète **Lamartine** est un des chefs du gouvernement provisoire.

- **Suffrage universel masculin** (mars 1848) : tous les hommes de plus de 21 ans votent.
- **Abolition de l’esclavage** dans les colonies (27 avril 1848), grâce à **Victor Schœlcher**.
- Libertés de la presse et de réunion.

Mais en **juin 1848**, une révolte ouvrière est écrasée. En **décembre**, **Louis-Napoléon Bonaparte** est élu président.`, key: '1848 réalise des idées de la Révolution française : suffrage universel masculin, abolition de l’esclavage.' },

    { t: '1848 : le Printemps des peuples', comp: true, b: `La révolution parisienne se répand dans toute l’Europe : c’est le **Printemps des peuples**.

- **13 mars 1848** : révolution à **Vienne** ; **Metternich** s’enfuit.
- Révolutions à Berlin, Milan, Venise, Budapest, Prague. Un **parlement** se réunit à **Francfort** pour unifier l’Allemagne.
- Les peuples réclament des **libertés** (constitutions) et le droit de former leur **nation** (Allemands, Italiens, Hongrois, Tchèques).

En **1849**, les rois reprennent le contrôle : presque partout, c’est l’**échec**. Mais l’ordre de Vienne est fini, et l’idée de nation va continuer à progresser.`, key: 'Le Printemps des peuples montre la force des aspirations libérales et nationales, même s’il échoue.' },

    { t: 'Ce qu’il faut retenir', b: `1. **En 1815, les rois veulent effacer la Révolution** : congrès de Vienne, légitimité dynastique, Sainte-Alliance.
2. **Mais les idées libérales et nationales résistent** : insurrections dès 1820, indépendance grecque (1830).
3. **En France, la monarchie doit composer avec l’héritage révolutionnaire** : la Charte de 1814 est un compromis ; Charles X, trop autoritaire, est renversé en 1830.
4. **Deux vagues révolutionnaires (1830 et 1848)** ébranlent l’Europe et mettent fin à l’ordre de Vienne.` }

  restit: {
    worked: { t: 'Répondre à une question de cours', task: 'Qu’est-ce que le congrès de Vienne ?', steps: [
      { t: 'Repérer le mot qui interroge', q: 'Que demande « Qu’est-ce que » ?', a: '« **Qu’est-ce que** » demande une **définition** : je dois dire ce que c’est, quand, où, qui, et dans quel but.', w: 'Une définition en histoire répond à ces petites questions : Quoi ? Quand ? Où ? Qui ? Pourquoi ?' },
      { t: 'Chercher dans le cours', q: 'Quand, où et qui ?', a: 'De **septembre 1814 à juin 1815**, à **Vienne**. Les vainqueurs de Napoléon (Royaume-Uni, Autriche, Prusse, Russie), autour de **Metternich**.', w: 'Je retrouve le bon passage du cours : I. A., « La réaction antirévolutionnaire en Europe ».' },
      { t: 'Ajouter le but et une précision', q: 'Pourquoi se réunissent-ils ? Que décident-ils ?', a: 'Pour **effacer la domination française** et rétablir l’ordre monarchique : ils redessinent les frontières et remettent les rois sur leur trône (**légitimité dynastique**).', w: 'Le but et un résultat concret montrent que j’ai compris, pas seulement appris.' },
      { t: 'Rédiger la réponse', q: 'Comment commencer ma phrase ?', a: 'Le congrès de Vienne est une grande réunion des vainqueurs de Napoléon (Royaume-Uni, Autriche, Prusse, Russie), qui a lieu à Vienne de septembre 1814 à juin 1815, autour du chancelier autrichien Metternich. Son but est d’effacer la domination française et de rétablir l’ordre monarchique. Les diplomates redessinent les frontières et remettent les rois sur leur trône, au nom de la légitimité dynastique.', w: 'Je reprends le mot de la question dans ma première phrase (« Le congrès de Vienne est… »). Je donne les faits, puis le but, puis un résultat.' }
    ] },
    items: [
      { t: 'write', kind: 'restit', p: 'Qu’est-ce que la Sainte-Alliance ?', task: 'Question de cours (définition)', keys: [['1815', ['1815']], ['Autriche, Prusse, Russie', ['autriche', 'prusse', 'russie']], ['but : défendre l’ordre monarchique / réprimer', ['monarch', 'reprim', 'stabilit', 'ordre', 'roi']]], model: 'La Sainte-Alliance est une alliance signée en 1815 entre l’Autriche, la Prusse et la Russie. Son but est de garantir la stabilité de l’Europe et de défendre l’ordre monarchique décidé au congrès de Vienne. Elle réprime les insurrections libérales et nationales, comme en Italie dans les années 1820.' },
      { t: 'write', kind: 'restit', p: 'Définis « aspirations libérales » et « aspirations nationales ». Donne un exemple pour chacune.', task: 'Question de cours (deux notions)', keys: [['libérales : droits, libertés, égalité', ['liberte', 'droits', 'egalite', 'presse', 'constitution']], ['nationales : former un État', ['etat', 'nation', 'independ']], ['un exemple', ['grece', 'pologne', 'italie', 'belgique', 'espagne', 'presse']]], model: 'Les aspirations libérales, ce sont les revendications de libertés et d’égalité entre les citoyens : par exemple, réclamer la liberté de la presse ou une constitution. Les aspirations nationales, c’est la volonté d’un peuple qui partage une culture et une histoire de former son propre État : par exemple, les Grecs qui se soulèvent contre l’Empire ottoman en 1821.' },
      { t: 'write', kind: 'restit', p: 'Pourquoi peut-on dire que la Charte de 1814 est un texte de compromis ?', task: 'Question de cours (justifier)', keys: [['acquis révolutionnaires', ['egalite', 'liberte', 'acquis', 'code civil']], ['pouvoir du roi', ['roi', 'inviolable', 'sacree', 'ordonnance']], ['un article cité', ['article']], ['compromis / réconcilier', ['compromis', 'reconcil']]], model: 'La Charte de 1814 est un compromis, car elle réconcilie deux camps. D’un côté, elle conserve des acquis révolutionnaires : l’article 1 affirme que « les Français sont égaux devant la loi », et les libertés d’expression et de la presse sont garanties. De l’autre, elle réaffirme l’autorité du roi : selon l’article 13, « la personne du roi est inviolable et sacrée », et le roi peut gouverner par ordonnances.' },
      { t: 'write', kind: 'restit', p: 'Comment les Européens soutiennent-ils l’indépendance grecque ?', task: 'Question de cours (moyens)', keys: [['soutien des artistes', ['delacroix', 'hugo', 'artiste', 'oeuvre', 'poeme', 'peinture']], ['comités philhellènes', ['philhell', 'comite']], ['intervention militaire', ['navarin', 'flotte', 'militaire', 'intervention']], ['une date', ['1822', '1824', '1827', '1829', '1830']]], model: 'Les Européens soutiennent les Grecs de deux façons. D’abord, les intellectuels et les artistes s’engagent : Delacroix peint les Scènes des massacres de Scio en 1824, Victor Hugo écrit le poème « L’Enfant », et des comités philhellènes collectent de l’argent. Ensuite, les États interviennent : la France, le Royaume-Uni et la Russie remportent la bataille de Navarin en 1827. La Grèce devient indépendante en 1830.' },
      { t: 'write', kind: 'restit', p: 'Pourquoi Charles X est-il qualifié de « monarque autoritaire » ?', task: 'Question de cours (justifier)', keys: [['renouer avec l’Ancien Régime / absolutisme', ['ancien regime', 'absolu', '1789', 'passe']], ['sacre à Reims en 1825', ['sacre', 'reims', '1825']], ['ordonnances de 1830', ['ordonnance', '1830', 'presse']]], model: 'Charles X est un monarque autoritaire, car il veut renouer avec l’Ancien Régime. En 1825, il se fait sacrer à Reims, comme les rois d’avant 1789. Il mène une politique favorable aux nobles et à l’Église. En juillet 1830, ses ordonnances suppriment la liberté de la presse : elles provoquent la révolution qui le renverse.' },
      { t: 'write', kind: 'restit', p: 'Que se passe-t-il en France en juillet 1830 ?', task: 'Question de cours (événement) · complément', comp: true, keys: [['Trois Glorieuses', ['trois glorieuses']], ['27-29 juillet', ['27', '29']], ['Charles X abdique / renversé', ['abdique', 'renvers', 'chasse']], ['Louis-Philippe', ['louis-philippe', 'louis philippe']]], model: 'Les 27, 28 et 29 juillet 1830, les Parisiens se soulèvent contre les ordonnances de Charles X : ce sont les Trois Glorieuses. Charles X abdique. Louis-Philippe devient « roi des Français » : c’est le début de la monarchie de Juillet. Le drapeau tricolore revient et la Charte est révisée.' },
      { t: 'write', kind: 'restit', p: 'Qu’appelle-t-on le « Printemps des peuples » ?', task: 'Question de cours (définition) · complément', comp: true, keys: [['1848', ['1848']], ['vague de révolutions en Europe', ['revolution', 'europe']], ['libérales et nationales', ['liber', 'nation']], ['un exemple : Vienne, Metternich, Francfort…', ['vienne', 'metternich', 'francfort', 'berlin', 'milan', 'budapest', 'prague']]], model: 'Le Printemps des peuples est la vague de révolutions libérales et nationales qui touche l’Europe en 1848, après la révolution de février à Paris. Par exemple, le 13 mars 1848, Vienne se soulève et Metternich doit s’enfuir. Les peuples réclament des constitutions et le droit de former leur nation. Mais en 1849, les révolutions sont presque toutes écrasées.' }
    ]
  },

  argu: {
    worked: { t: 'Construire un paragraphe argumenté', task: 'Montrez que l’ordre de Vienne est contesté dès les années 1820.', steps: [
      { t: 'Comprendre la consigne', q: 'Que me demande « Montrez que » ?', a: 'Je dois **prouver** une idée : l’ordre décidé à Vienne en 1815 est remis en cause. Le cadre : les années 1820.', w: 'Avec « Montrez que », je ne discute pas : je démontre avec des preuves du cours.' },
      { t: 'Écrire l’argument', role: 'arg', q: 'Quelle phrase générale répond à la consigne ?', a: 'Dès les années 1820, des peuples se soulèvent contre l’ordre monarchique imposé en 1815.', w: 'L’argument répond directement à la consigne, sans date précise.' },
      { t: 'Expliquer', role: 'expl', q: 'Pourquoi ces peuples se soulèvent-ils ?', a: 'En effet, le congrès de Vienne a rendu le pouvoir aux rois sans consulter les peuples. Or, les idées libérales et nationales de la Révolution française ont circulé dans toute l’Europe.', w: 'L’explication donne la cause : elle dit pourquoi l’argument est vrai.' },
      { t: 'Donner un exemple précis', role: 'ex', q: 'Quel fait daté prouve l’argument ?', a: 'Par exemple, en 1821, les Grecs se soulèvent contre l’Empire ottoman ; malgré le massacre de Chios en 1822, ils obtiennent leur indépendance en 1830, avec l’aide de la France, du Royaume-Uni et de la Russie (Navarin, 1827).', w: 'L’exemple est précis : des dates, des lieux, des acteurs.' },
      { t: 'Faire le lien et nuancer', role: 'lien', q: 'Comment montrer que j’ai répondu ?', a: 'Ainsi, l’ordre de Vienne est contesté très tôt, même si la plupart des insurrections, en Espagne ou en Italie, sont écrasées par les grandes puissances.', w: 'La phrase de lien reprend la consigne. La nuance montre que je connais aussi les échecs.' }
    ] },
    items: [
      { t: 'write', kind: 'argu', p: 'Montrez que le congrès de Vienne veut effacer la Révolution française.', task: 'Paragraphe argumenté', helps: ['Argument : les vainqueurs veulent rétablir l’ordre d’avant la Révolution.', 'Explication : légitimité dynastique contre souveraineté nationale.', 'Exemples : Metternich ; rois remis sur leur trône (Bourbons) ; Sainte-Alliance 1815.'], model: [['arg', 'Le congrès de Vienne cherche à effacer l’héritage de la Révolution française.'], ['expl', 'En effet, les vainqueurs de Napoléon défendent la légitimité dynastique : le pouvoir appartient aux rois par héritage, et non à la nation, comme le voulait la Révolution.'], ['ex', 'Par exemple, réunis à Vienne de 1814 à 1815 autour de Metternich, les diplomates remettent les rois sur leur trône, comme les Bourbons en France, et redessinent les frontières sans consulter les peuples. En 1815, la Sainte-Alliance s’engage à défendre cet ordre monarchique.'], ['lien', 'Ainsi, l’ordre de Vienne est un ordre antirévolutionnaire.']] },
      { t: 'write', kind: 'argu', p: 'Montrez que la Charte de 1814 conserve des acquis de la Révolution.', task: 'Paragraphe argumenté', helps: ['Argument : la monarchie restaurée n’est pas un retour à l’Ancien Régime.', 'Explication : Louis XVIII veut réconcilier les Français.', 'Exemples : article 1 (égalité devant la loi) ; libertés d’expression et de presse ; Code civil ; une Chambre élue.', 'Nuance : drapeau blanc, roi « inviolable et sacré ».'], model: [['arg', 'La Charte de 1814 ne rétablit pas l’Ancien Régime : elle conserve plusieurs acquis de la Révolution.'], ['expl', 'En effet, Louis XVIII veut réconcilier les monarchistes et les anciens révolutionnaires, pour que la monarchie soit acceptée.'], ['ex', 'Par exemple, l’article 1 affirme que « les Français sont égaux devant la loi », la liberté de la presse est garantie et le Code civil est maintenu. Une Chambre des députés est élue, même si seuls les plus riches votent.'], ['lien', 'Ainsi, la Charte garde des acquis révolutionnaires, même si elle rend beaucoup de pouvoir au roi, « inviolable et sacré ».']] },
      { t: 'write', kind: 'argu', p: 'Pourquoi l’indépendance grecque est-elle une exception entre 1815 et 1848 ?', task: 'Paragraphe argumenté (avec comparaison)', helps: ['Argument : la plupart des mouvements nationaux échouent, la Grèce réussit.', 'Explication : les grandes puissances l’aident, car elle lutte contre l’Empire ottoman.', 'Exemples : Navarin (1827), indépendance (1830) ; contre-exemples : Pologne (1831), Italie.'], model: [['arg', 'L’indépendance grecque est une exception, car la plupart des mouvements nationaux de l’époque échouent.'], ['expl', 'En effet, les grandes puissances écrasent d’habitude les révoltes. Mais la Grèce lutte contre l’Empire ottoman, un empire musulman : les rois chrétiens et l’opinion européenne, émue par le massacre de Chios, acceptent de la soutenir.'], ['ex', 'Par exemple, la France, le Royaume-Uni et la Russie détruisent la flotte ottomane à Navarin en 1827, et la Grèce devient indépendante en 1830. Au contraire, la Pologne, soulevée en 1830, est écrasée par la Russie en 1831.'], ['lien', 'Ainsi, avec la Belgique, la Grèce est la seule nation nouvelle de la période.']] },
      { t: 'write', kind: 'argu', p: 'Le Printemps des peuples (1848) est-il un échec ?', task: 'Paragraphe argumenté (avec nuance) · complément', comp: true, helps: ['Oui : en 1849, les rois reprennent le pouvoir presque partout.', 'Mais : l’ordre de Vienne est fini (fuite de Metternich), la France obtient le suffrage universel masculin et abolit l’esclavage.', 'Connecteur : « Pourtant » ou « Cependant ».'], model: [['arg', 'À court terme, le Printemps des peuples est un échec.'], ['expl', 'En effet, les rois reprennent le contrôle grâce à leurs armées, et les peuples n’obtiennent pas leur État.'], ['ex', 'Par exemple, en 1849, l’Autriche, aidée par la Russie, écrase la révolution hongroise, et le parlement de Francfort ne parvient pas à unifier l’Allemagne.'], ['arg', 'Pourtant, 1848 laisse des traces durables.'], ['ex', 'Par exemple, Metternich, symbole de l’ordre de Vienne, a dû fuir en mars 1848, et la France a adopté le suffrage universel masculin et aboli l’esclavage le 27 avril 1848.'], ['lien', 'Le Printemps des peuples est donc un échec immédiat, mais il prépare l’Europe des nations.']] }
    ]
  },

/* Classement : voix neuronales « Natural / Online » (Microsoft Edge), voix Premium puis Améliorées (Apple),
   voix Google (Chrome, Android), puis voix système standard ; le français de France avant les autres variantes. */
function voiceInfo(v) {
  const n = v.name || '';
  let score = 0, tier = 'Standard';
  if (/natural|neural|online/i.test(n)) { score = 100; tier = 'Naturelle'; }
  else if (/premium/i.test(n)) { score = 90; tier = 'Premium'; }
  else if (/enhanced|amélioré|ameliore/i.test(n)) { score = 80; tier = 'Améliorée'; }
  else if (/google/i.test(n)) { score = 70; tier = 'Google'; }
  else if (/am[ée]lie|thomas|audrey|aur[ée]lie|marie|daniel/i.test(n)) { score = 40; }
  else if (/microsoft/i.test(n)) { score = 20; }
  if (/multilingual/i.test(n)) score -= 3;
  const lang = (v.lang || '').replace('_', '-');
  if (/^fr-FR$/i.test(lang)) score += 6; else if (/^fr-(CA|BE|CH)$/i.test(lang)) score += 2;
  if (v.localService === false) score += 1;
  return { score, tier, lang };
}

}

let speakingId = null;
const setSpeaking = id => { speakingId = id; speakListeners.forEach(f => f(id)); };
function chunks(text) {
  const out = [];
  String(text).replace(/\s+/g, ' ').trim().replace(/([.!?;:…])\s+/g, '$1\u0000').split('\u0000').forEach(sen => {
    if (sen.length <= 180) { if (sen) out.push(sen); return; }
    let cur = '';
    sen.replace(/,\s+/g, ',\u0000').split('\u0000').forEach(p => { if ((cur + ' ' + p).length > 180 && cur) { out.push(cur); cur = p; } else cur = cur ? cur + ' ' + p : p; });
    if (cur) out.push(cur);
  });
  return out;
}
function stopSpeak() { speakToken++; try { window.speechSynthesis.cancel(); } catch (e) {} setSpeaking(null); }
function speak(text, id) {
  if (!CAN_SPEAK) return;
  stopSpeak();
  const tok = speakToken;
  const s = window.speechSynthesis;
  const pick = VOICES.find(x => x.v.voiceURI === TTS.voice) || VOICES[0];
  const parts = chunks(plain(text).replace(/([?!.…:])\s*\./g, '$1'));
  setSpeaking(id || 'x');
  const next = i => {
    if (tok !== speakToken) return;
    if (i >= parts.length) { setSpeaking(null); return; }
    const u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = pick ? pick.v.lang : 'fr-FR'; if (pick) u.voice = pick.v;
    u.rate = TTS.rate; u.pitch = TTS.pitch;
    u.onend = () => next(i + 1); u.onerror = () => { if (tok === speakToken) setSpeaking(null); };
    try { s.speak(u); } catch (e) { setSpeaking(null); }
  };
  next(0);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e2) { return false; }
  }
}

function Progress({ value, max }) { return html`<div className="progress" role="progressbar" aria-valuemin="0" aria-valuemax=${max} aria-valuenow=${value}><span style=${{ width: (max ? Math.round(100 * value / max) : 0) + '%' }}></span></div>`; }

/* ---------- Contexte ---------- */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);
let speakSeq = 0;
function SpeakBtn({ text, label }) {
  const { store } = useApp();
  const [myId] = useState(() => 'sp' + (++speakSeq));
  const [cur, setCur] = useState(speakingId);
  useEffect(() => { speakListeners.add(setCur); return () => { speakListeners.delete(setCur); if (speakingId === myId) stopSpeak(); }; }, []);
  if (!CAN_SPEAK || store.settings.tts === false) return null;
  const on = cur === myId;
  return html`<button className=${'btn btn-sm btn-flat' + (on ? ' on' : '')} aria-pressed=${on} onClick=${() => (on ? stopSpeak() : speak(text, myId))}><${Icon} n=${on ? 'x' : 'speaker'} s=${16} />${on ? 'Arrêter' : (label == null ? 'Écouter' : label)}</button>`;
}

/* ---------- Correction (simple + détaillée) ---------- */
function Correction({ ok, item, extra }) {
  return html`<${Msg} kind=${ok ? 'pos' : 'neg'}>
    <strong>${ok ? 'Bonne réponse.' : 'Pas tout à fait.'}</strong>
    <div><span className="eyebrow">Correction simple</span><div><${T} s=${item.s} /></div></div>
    ${extra || null}
    ${item.d ? html`<details className="more"><summary>Correction détaillée</summary><div className="inner"><${Md} s=${item.d} /></div></details>` : null}
  </${Msg}>`;
}

/* ---------- QCM ---------- */
function MCQ({ item, id, onAnswer }) {
  const { setProg } = useApp();
  const order = useMemo(() => shuffle(item.o.map((_, i) => i)), [item]);
  const [pick, setPick] = useState(null);
  const answered = pick != null;
  const choose = i => { if (answered) return; setPick(i); const ok = i === item.a; if (id) setProg(id, ok ? 'ok' : 'ko'); if (onAnswer) onAnswer(ok); };
  return html`<div className="card">
    ${item.comp ? html`<div><${Comp} /></div>` : null}
    <p className="prompt"><${T} s=${item.p} /></p>
    <div className="choices">${order.map((oi, k) => {
      let cls = 'choice';
      if (answered) cls += oi === item.a ? ' ok' : oi === pick ? ' no' : ' dim';
      return html`<button key=${oi} className=${cls} disabled=${answered} onClick=${() => choose(oi)}><span className="mark">${answered && oi === item.a ? html`<${Icon} n="check" s=${13} />` : answered && oi === pick ? html`<${Icon} n="x" s=${13} />` : String.fromCharCode(65 + k)}</span><span><${T} s=${item.o[oi]} /></span></button>`;
    })}</div>
    ${answered ? html`<${Correction} ok=${pick === item.a} item=${item} />` : null}
    ${answered && !onAnswer ? html`<div className="actions"><button className="btn btn-sm" onClick=${() => setPick(null)}><${Icon} n="reset" s=${15} />Recommencer</button></div>` : null}
  </div>`;
}

/* ---------- Association ---------- */
function Match({ item, id }) {
  const { setProg } = useApp();
  const opts = useMemo(() => shuffle(Array.from(new Set(item.pairs.map(p => p[1])))), [item]);
  const [sel, setSel] = useState({});
  const [checked, setChecked] = useState(false);
  const all = item.pairs.every((_, i) => sel[i]);
  const okAll = item.pairs.every((p, i) => sel[i] === p[1]);
  const check = () => { setChecked(true); setProg(id, okAll ? 'ok' : 'ko'); };
  return html`<div className="card">
    <p className="prompt"><${T} s=${item.p} /></p>
    <div>${item.pairs.map((p, i) => {
      const st = checked ? (sel[i] === p[1] ? 'ok' : 'no') : '';
      return html`<div key=${i} className="mrow"><span><${T} s=${p[0]} /></span>
        <select aria-label=${'Réponse ' + (i + 1)} value=${sel[i] || ''} disabled=${checked} onChange=${e => setSel({ ...sel, [i]: e.target.value })}>
          <option value="">Choisir…</option>${opts.map(o => html`<option key=${o} value=${o}>${plain(o)}</option>`)}
        </select>
        <span className=${'ic ' + st}>${checked ? html`<${Icon} n=${st === 'ok' ? 'check' : 'x'} s=${16} />` : null}</span></div>`;
    })}</div>
    ${!checked ? html`<div className="actions"><button className="btn btn-primary" disabled=${!all} onClick=${check}>Vérifier</button>${!all ? html`<span className="count">Choisis une réponse pour chaque ligne.</span>` : null}</div>` : null}
    ${checked ? html`<${Correction} ok=${okAll} item=${item} extra=${okAll ? null : html`<div><span className="eyebrow">Les bonnes associations</span><ul>${item.pairs.map((p, i) => html`<li key=${i}><${T} s=${p[0]} /> → <strong><${T} s=${p[1]} /></strong></li>`)}</ul></div>`} />
      <div className="actions"><button className="btn btn-sm" onClick=${() => { setSel({}); setChecked(false); }}><${Icon} n="reset" s=${15} />Recommencer</button></div>` : null}
  </div>`;
}

/* ---------- Remise en ordre ---------- */
function Order({ item, id }) {
  const { setProg } = useApp();
  const fresh = () => { let s = shuffle(item.items.map((_, i) => i)); if (s.length > 1 && s.every((v, i) => v === i)) s = s.reverse(); return s; };
  const [pool, setPool] = useState(fresh);
  const [ans, setAns] = useState([]);
  const [checked, setChecked] = useState(false);
  const add = i => { if (checked) return; setAns([...ans, i]); setPool(pool.filter(x => x !== i)); };
  const rem = i => { if (checked) return; setPool([...pool, i]); setAns(ans.filter(x => x !== i)); };
  const okAll = ans.length === item.items.length && ans.every((v, k) => v === k);
  const check = () => { setChecked(true); setProg(id, okAll ? 'ok' : 'ko'); };
  const reset = () => { setPool(fresh()); setAns([]); setChecked(false); };
  return html`<div className="card">
    <p className="prompt"><${T} s=${item.p} /></p>
    <div className="zone"><span className="zone-label">Ton ordre (clique pour retirer)</span>
      ${ans.length ? ans.map((i, k) => {
        const st = checked ? (i === k ? ' ok' : ' no') : '';
        const role = checked && item.roles ? item.roles[i] : null;
        return html`<button key=${i} className=${'slot' + st} disabled=${checked} onClick=${() => rem(i)}><span className="pos">${k + 1}</span><span>${role ? html`<${Chip} k=${role} /> ` : null}<${T} s=${item.items[i]} /></span></button>`;
      }) : html`<div className="empty">Clique sur les éléments ci-dessous, dans l’ordre.</div>`}
    </div>
    ${pool.length ? html`<div className="zone"><span className="zone-label">Éléments à placer</span>
      ${pool.map(i => html`<button key=${i} className="slot" onClick=${() => add(i)}><span className="pos">+</span><span><${T} s=${item.items[i]} /></span></button>`)}</div>` : null}
    ${!checked ? html`<div className="actions"><button className="btn btn-primary" disabled=${pool.length > 0} onClick=${check}>Vérifier</button>${ans.length ? html`<button className="btn btn-sm btn-flat" onClick=${reset}><${Icon} n="reset" s=${15} />Tout reprendre</button>` : null}</div>` : null}
    ${checked ? html`<${Correction} ok=${okAll} item=${item} extra=${okAll ? null : html`<div><span className="eyebrow">Le bon ordre</span><ol>${item.items.map((t, i) => html`<li key=${i}>${item.roles ? html`<${Chip} k=${item.roles[i]} /> ` : null}<${T} s=${t} /></li>`)}</ol></div>`} />
      <div className="actions"><button className="btn btn-sm" onClick=${reset}><${Icon} n="reset" s=${15} />Recommencer</button></div>` : null}
  </div>`;
}

/* ---------- Texte modèle (segments colorés) ---------- */
function ModelText({ model }) {
  if (Array.isArray(model)) return html`<div className="assembled">${model.map((s, i) => html`<div key=${i} className=${'apara seg k-' + s[0]}><${Chip} k=${s[0]} /><p className="read"><${T} s=${s[1]} /></p></div>`)}</div>`;
  return html`<div className="model"><${T} s=${model} /></div>`;
}
const modelPlain = m => Array.isArray(m) ? segsText(m) : plain(m);

/* ---------- Prompt pour une IA ---------- */
function buildPrompt({ mat, task, sujet, consigne, text, grid, full }) {
  const D = MATS[mat];
  const crit = grid.map((g, i) => (i + 1) + '. ' + g).join('\n');
  const matLong = mat === 'hggsp' ? 'Spécialité HGGSP (histoire-géographie, géopolitique et sciences politiques)' : 'Histoire (enseignement commun)';
  const lines = [
    'Tu es professeur d’histoire-géographie au lycée, en France. Tu corriges le travail d’un élève de première générale.',
    'Je suis cet élève. J’ai des difficultés à organiser mes phrases à l’écrit : explique-moi simplement, avec des phrases courtes, une idée à la fois.',
    '',
    'Matière : ' + matLong,
    'Chapitre : ' + plain(D.chap),
    'Plan de mon cours :',
    D.plan.map(p => '- ' + plain(p)).join('\n'),
    '',
    'Exercice : ' + plain(task)
  ];
  if (sujet) lines.push('Sujet : ' + plain(sujet));
  if (consigne) lines.push('Consigne : ' + plain(consigne));
  lines.push('', 'Ma production :', '"""', text.trim(), '"""', '', 'Évalue ma production avec ces critères :', crit, '', 'Règles pour ton retour :',
    '1. Commence par deux points forts précis, en citant mes propres mots.',
    '2. Donne ensuite au plus trois points à améliorer, du plus important au moins important. Pour chacun : ce qui ne va pas, pourquoi, et une piste concrète avec un exemple (une phrase modèle, ou une connaissance du cours à ajouter : date, acteur, chiffre).',
    '3. Vérifie l’exactitude de mes dates, de mes noms et de mes chiffres. Si tu n’es pas sûr d’une information, dis-le clairement au lieu d’inventer.',
    '4. Propose ensuite une version corrigée de ma production. Garde mes idées et mon plan ; améliore la langue, la structure et la précision. Mets entre crochets [ ] ce que tu as ajouté ou modifié.',
    '5. Explique en trois lignes maximum les changements les plus importants de ta version corrigée.',
    '6. Termine par un petit exercice : demande-moi de réécrire moi-même une phrase ou un passage précis de ma production.',
    '7. Écris en français, simplement, avec des phrases courtes.' + (full ? '\n8. Donne enfin une estimation de note sur 20, en précisant qu’elle est indicative.' : ''));
  return lines.join('\n');
}
function AIPanel(props) {

    <p className="count">Ton texte est placé dans une consigne prête à l’emploi, avec le sujet et le plan de ton cours. Colle-la dans l’IA de ton choix : tu recevras des points forts, des pistes avec des exemples, puis une version corrigée.</p>
    ${!show ? html`<div className="actions"><button className="btn" onClick=${() => setShow(true)}><${Icon} n="chat" s=${16} />Préparer la consigne</button></div>` : html`<${Fragment}>

      <div className="actions"><button className="btn btn-primary" onClick=${async () => setMsg((await copyText(text)) ? 'Consigne copiée. Colle-la dans ton IA.' : 'Copie impossible : sélectionne le texte et copie-le à la main.')}><${Icon} n="copy" s=${16} />Copier la consigne</button>${msg ? html`<span className="count" role="status">${msg}</span>` : null}</div>
      <${Msg} kind="info"><span>Lis d’abord les pistes, puis réécris ton texte toi-même avant de regarder la version corrigée. Les IA se trompent parfois sur les dates : vérifie dans ton cours. N’ajoute aucune information personnelle (nom, école).</span></${Msg}>
    <//>`}
  </div>`;
}

/* ---------- Production écrite (restituer, argumenter, rédiger) ---------- */
function Write({ item, id }) {
  const { store, setStore, setProg, mat } = useApp();
  const D = MATS[mat];
  const d = (store.drafts && store.drafts[id]) || {};
  const upd = patch => setStore(s => ({ ...s, drafts: { ...(s.drafts || {}), [id]: { ...((s.drafts || {})[id] || {}), ...patch } } }));
  const text = d.text || '';
  const stage = d.stage || 0;
  const grid = GRIDS[item.grid || (item.kind === 'restit' ? 'restit' : item.kind === 'diss' ? 'diss' : 'argu')];
  const checks = d.checks || {};
  const suj = item.sujet ? D.sujets.find(s => s.id === item.sujet) : null;
  const nt = norm(text);
  const keys = item.keys ? item.keys.map(k => [k[0], k[1].some(v => nt.includes(norm(v)))]) : null;
  const nKeys = keys ? keys.filter(k => k[1]).length : 0;
  return html`<div className="card">
    ${suj ? html`<div><span className="eyebrow">Sujet</span><p className="task"><${T} s=${suj.q} /></p></div>` : null}
    ${item.comp ? html`<div><${Comp} /></div>` : null}
    <${Md} s=${item.p} cls="prompt" />
    ${item.helps ? html`<details className="more"><summary>Coup de pouce</summary><div className="inner"><ul>${item.helps.map((h, i) => html`<li key=${i}><${T} s=${h} /></li>`)}</ul></div></details>` : null}
    <div className="stage" style=${{ borderTop: 'none', paddingTop: 0 }}>
      <div className="stage-h"><span className="n">1</span>J’écris</div>
      <textarea aria-label="Ma réponse" value=${text} onChange=${e => upd({ text: e.target.value })} placeholder="Écris ici. Ton texte reste enregistré dans ce navigateur."></textarea>
      ${stage < 1 ? html`<div className="actions"><button className="btn btn-primary" disabled=${text.trim().length < 20} onClick=${() => upd({ stage: 1 })}>Je vérifie<${Icon} n="right" s=${16} /></button>${text.trim().length < 20 ? html`<span className="count">Écris au moins une phrase.</span>` : null}</div>` : null}
    </div>
    ${stage >= 1 ? html`<div className="stage"><div className="stage-h"><span className="n">2</span>Je vérifie</div>
      ${keys ? html`<div className="frame"><span className="eyebrow">Les éléments attendus · ${nKeys} sur ${keys.length} repérés dans ton texte</span>
        <ul className="keylist">${keys.map((k, i) => html`<li key=${i} className=${k[1] ? 'ok' : ''}><${Icon} n=${k[1] ? 'check' : 'plus'} s=${15} /><span><${T} s=${k[0]} /></span></li>`)}</ul>
        <p className="count">Le repérage est automatique : il cherche des mots. Relis quand même toi-même.</p></div>` : null}
      <p className="count">Relis ton texte, puis coche chaque point quand il est vrai.</p>
      <div className="checks">${grid.map((g, i) => html`<label key=${i}><input type="checkbox" checked=${!!checks[i]} onChange=${e => upd({ checks: { ...checks, [i]: e.target.checked } })} /><span>${fr(g)}</span></label>`)}</div>
      ${stage < 2 ? html`<div className="actions"><button className="btn" onClick=${() => upd({ stage: 0 })}><${Icon} n="pen" s=${15} />Compléter mon texte</button><span className="spacer"></span><button className="btn btn-primary" onClick=${() => { upd({ stage: 2 }); setProg(id, 'done'); }}><${Icon} n="eye" s=${16} />Voir le corrigé modèle</button></div>` : null}
    </div>` : null}
    ${stage >= 2 ? html`<div className="stage"><div className="stage-h"><span className="n">3</span>Je compare avec le corrigé modèle</div>
      <${ModelText} model=${item.model} />
      <div className="actions"><${SpeakBtn} text=${modelPlain(item.model)} label="Écouter le corrigé" /></div>
      <p className="count">Le corrigé n’est pas la seule bonne réponse. Compare surtout : as-tu les mêmes pièces, et des exemples aussi précis ?</p>
      <div className="actions"><button className="btn btn-sm" onClick=${() => upd({ stage: 0 })}><${Icon} n="pen" s=${15} />Reprendre mon texte</button></div>
    </div>` : null}
    ${stage >= 2 ? html`<${AIPanel} mat=${mat} task=${item.task} sujet=${suj ? suj.q : ''} consigne=${plain(item.p).replace(/\n+/g, ' ')} text=${text} grid=${grid} />` : null}
  </div>`;
}

function Exercise({ item, id }) {
  if (item.t === 'mcq') return html`<${MCQ} key=${id} item=${item} id=${id} />`;
  if (item.t === 'match') return html`<${Match} key=${id} item=${item} id=${id} />`;
  if (item.t === 'order') return html`<${Order} key=${id} item=${item} id=${id} />`;
  if (item.t === 'write') return html`<${Write} key=${id} item=${item} id=${id} />`;
  return null;
}

/* ---------- Écrans de cours (pré-apprentissage, segmentation) ---------- */
function Screens({ screens, progKey, endText }) {
  const { setProg } = useApp();

  const sc = screens[i];
  useEffect(() => { if (i === screens.length - 1 && progKey) setProg(progKey, 1); }, [i]);
  const spoken = sc.t + '. ' + sc.b + (sc.terms ? ' ' + sc.terms.map(t => t[0] + ' : ' + t[1]).join('. ') : '') + (sc.key ? ' À retenir : ' + sc.key : '');
  return html`<div className="card">
    <div className="actions"><span className="count">Écran ${i + 1} sur ${screens.length}</span>${sc.comp ? html`<${Comp} />` : null}<span className="spacer"></span><${SpeakBtn} text=${spoken} /></div>
    <${Progress} value=${i + 1} max=${screens.length} />
    <h2><${T} s=${sc.t} /></h2>
    <${Md} s=${sc.b} />
    ${sc.terms ? html`<dl className="dl">${sc.terms.map((t, k) => html`<${Fragment} key=${k}><dt>${sc.roles ? html`<${Chip} k=${sc.roles[k]}>${t[0]}</${Chip}>` : html`<${T} s=${t[0]} />`}</dt><dd><${T} s=${t[1]} /></dd><//>`)}</dl>` : null}
    ${sc.key ? html`<${Msg} kind="info"><strong>À retenir</strong><span><${T} s=${sc.key} /></span></${Msg}>` : null}
    <div className="actions"><button className="btn" disabled=${i === 0} onClick=${() => setI(i - 1)}><${Icon} n="left" s=${16} />Précédent</button><span className="spacer"></span>
      ${i < screens.length - 1 ? html`<button className="btn btn-primary" onClick=${() => setI(i + 1)}>Suivant<${Icon} n="right" s=${16} /></button>` : html`<span className="count">${endText || 'Fin.'}</span>`}</div>
    <div className="dots" aria-label="Aller à un écran">${screens.map((s, k) => html`<button key=${k} className=${'dot' + (k === i ? ' cur' : k < i ? ' past' : '')} aria-label=${'Écran ' + (k + 1) + ' : ' + plain(s.t)} onClick=${() => setI(k)}>${k + 1}</button>`)}</div>
  </div>`;
}

    <div className="dots" aria-label="Étapes">${w.steps.map((s, k) => html`<button key=${k} className=${'dot' + (k === i ? ' cur' : k < i ? ' past' : '')} disabled=${k > i} aria-label=${'Étape ' + (k + 1) + ' : ' + plain(s.t)} onClick=${() => { setI(k); setShown(true); }}>${k + 1}</button>`)}</div>
    <h3>Étape ${i + 1} · <${T} s=${st.t} /></h3>
    <div className="selfq"><${Icon} n="think" /><span>Avant de dévoiler, réponds dans ta tête : <${T} s=${st.q} /></span></div>

    <//>`}
  </div>`;
}

/* ---------- Quiz ---------- */
function QuizRun({ items, onEnd, title }) {
  const [k, setK] = useState(0);
  const [score, setScore] = useState(0);
  const [answered, setAnswered] = useState(false);
  const [end, setEnd] = useState(false);
  if (end) return html`<div className="card"><span className="eyebrow">${title || 'Quiz'}</span><div className="big-score">${score} / ${items.length}</div>
    <p>${score === items.length ? 'Parfait. Tu maîtrises ces notions.' : score >= items.length * 0.7 ? 'Bien. Relis les corrections détaillées des questions manquées.' : 'Relis « L’essentiel du cours », puis entraîne-toi avec les flashcards avant de refaire le quiz.'}</p>
    <div className="actions"><button className="btn" onClick=${() => { setK(0); setScore(0); setAnswered(false); setEnd(false); }}><${Icon} n="reset" s=${16} />Refaire le quiz</button></div></div>`;
  return html`<${Fragment}>
    <div className="actions"><span className="count">Question ${k + 1} sur ${items.length}</span><span className="spacer"></span><span className="count">Score : ${score}</span></div>
    <${Progress} value=${k + (answered ? 1 : 0)} max=${items.length} />
    <${MCQ} key=${k + '-' + items[k].p} item=${items[k]} onAnswer=${ok => { setAnswered(true); if (ok) setScore(s => s + 1); }} />
    ${answered ? html`<div className="actions"><span className="spacer"></span><button className="btn btn-primary" onClick=${() => { if (k < items.length - 1) { setK(k + 1); setAnswered(false); } else { setEnd(true); if (onEnd) onEnd(score); } }}>${k < items.length - 1 ? 'Question suivante' : 'Voir mon score'}<${Icon} n="right" s=${16} /></button></div>` : null}
  <//>`;
}
function vocabQuiz(D, n) {
  const pool = shuffle(D.gloss).slice(0, n);
  return pool.map(g => {
    const others = shuffle(D.gloss.filter(x => x.w !== g.w && x.cat === g.cat)).concat(shuffle(D.gloss.filter(x => x.w !== g.w && x.cat !== g.cat)));
    const opts = shuffle([g.w].concat(others.slice(0, 3).map(x => x.w)));
    return { t: 'mcq', p: 'Quel mot correspond à cette définition ? « ' + g.def + ' »', o: opts, a: opts.indexOf(g.w), s: '**' + g.w + '** : ' + g.def, d: 'Exemple : ' + g.ex };
  });
}

/* -- Flashcards -- */
function PCards() {
  const { mat, store, setStore } = useApp(); const D = MATS[mat];
  const [deck, setDeck] = useState('gloss');
  const [dir, setDir] = useState('w');
  const [only, setOnly] = useState(false);
  const known = ((store.cards || {})[mat]) || {};
  const all = useMemo(() => deck === 'gloss' ? D.gloss.map(g => ({ k: 'g:' + g.w, front: g.w, back: g.def, ex: g.ex, comp: g.comp })) : D.frise.map(f => ({ k: 'f:' + f[0], front: f[0], back: f[1], comp: f[2] })), [deck, mat]);
  const base = only ? all.filter(c => known[c.k] !== 'ok') : all;
  const [queue, setQueue] = useState(() => shuffle(base));
  const [flip, setFlip] = useState(false);
  const [done, setDone] = useState(0);
  const restart = (b = base) => { setQueue(shuffle(b)); setFlip(false); setDone(0); };
  useEffect(() => { restart(); }, [deck, only, mat]);
  const mark = v => setStore(s => { const c = s.cards || {}; return { ...s, cards: { ...c, [mat]: { ...(c[mat] || {}), [queue[0].k]: v } } }; });
  const ok = () => { mark('ok'); setQueue(queue.slice(1)); setFlip(false); setDone(done + 1); };
  const ko = () => { mark('ko'); setQueue(queue.slice(1).concat([queue[0]])); setFlip(false); };
  const nOk = all.filter(c => known[c.k] === 'ok').length;
  const c = queue[0];
  const front = c ? (dir === 'w' ? c.front : c.back) : '';

      <label className="switch"><span>Seulement les cartes à revoir</span><input type="checkbox" checked=${only} onChange=${e => setOnly(e.target.checked)} /></label>
    </div>
    <span className="count">${nOk} carte${nOk > 1 ? 's' : ''} sue${nOk > 1 ? 's' : ''} sur ${all.length} · reste ${queue.length} dans ce paquet</span>
    <${Progress} value=${nOk} max=${all.length} />
    ${c ? html`<div className=${'flash' + (flip ? ' flipped' : '')}>
      <div className="flash-face">
        ${flip ? html`<div className="flash-q"><${T} s=${front} /></div>` : null}
        <span className="eyebrow">${flip ? 'Réponse' : 'Question'}</span>

        ${c.comp ? html`<div><${Comp} /></div>` : null}
      </div>
      <div className="actions">${!flip ? html`<button className="btn btn-primary" onClick=${() => setFlip(true)}><${Icon} n="flip" s=${16} />Retourner la carte</button><span className="spacer"></span><${SpeakBtn} text=${front} />`

    </div>` : html`<div className="card"><${Msg} kind="pos"><strong>Paquet terminé.</strong><span>${done} carte${done > 1 ? 's' : ''} sue${done > 1 ? 's' : ''} pendant cette série.</span></${Msg}><div className="actions"><button className="btn" onClick=${() => restart(all)}><${Icon} n="shuffle" s=${16} />Recommencer tout le paquet</button>${all.some(x => known[x.k] !== 'ok') ? html`<button className="btn" onClick=${() => { setOnly(true); }}>Revoir les cartes non sues</button>` : null}</div></div>`}
  </div>`;
}

/* -- Dissertations résolues (exemples résolus, avec estompage) -- */
function stepsOfWe(we) {
  const S = [{ k: 'analyse', t: 'Analyser le sujet' }, { k: 'pb', t: 'La problématique' }, { k: 'plan', t: 'Le plan' }, { k: 'intro', t: 'L’introduction' }];
  we.diss.parts.forEach((p, i) => {
    S.push({ k: 'part', p: i, t: 'Partie ' + ROMAN[i] });
    if (i < we.diss.parts.length - 1) S.push({ k: 'trans', p: i, t: 'Transition ' + ROMAN[i] + ' → ' + ROMAN[i + 1] });
  });
  S.push({ k: 'concl', t: 'La conclusion' });
  return S;
}
function ChoiceBox({ c, cid, picks, setPicks, role }) {
  const pick = picks[cid];
  const order = useMemo(() => shuffle(c.o.map((_, i) => i)), [c]);
  if (pick != null) return html`<div className=${'apara seg k-' + role}><${Chip} k=${role} /><p className="read"><${T} s=${c.o[c.a]} /></p>
    <${Msg} kind=${pick === c.a ? 'pos' : 'neg'}><strong>${pick === c.a ? 'Bon choix.' : 'Ce n’était pas le meilleur choix.'}</strong><span><${T} s=${c.why} /></span></${Msg}></div>`;
  return html`<div className="choicebox"><div className="actions"><${Chip} k=${role} /><span className="count">À toi de choisir la bonne pièce :</span></div>
    <div className="choices">${order.map((oi, k) => html`<button key=${oi} className="choice" onClick=${() => setPicks({ ...picks, [cid]: oi })}><span className="mark">${String.fromCharCode(65 + k)}</span><span><${T} s=${c.o[oi]} /></span></button>`)}</div></div>`;
}
function Piece({ role, text, cid, we, picks, setPicks }) {
  if (cid && we.choices && we.choices[cid]) return html`<${ChoiceBox} c=${we.choices[cid]} cid=${cid} picks=${picks} setPicks=${setPicks} role=${role} />`;
  return html`<div className=${'apara seg k-' + role}><${Chip} k=${role} /><p className="read"><${T} s=${text} /></p></div>`;
}
function stepPieces(we, st) {
  const d = we.diss;
  if (st.k === 'pb') return [['pb', d.intro.pb, 'pb']];
  if (st.k === 'intro') return [['acc', d.intro.acc], ['def', d.intro.def], ['pres', d.intro.pres], ['pb', d.intro.pb], ['ann', d.intro.ann]];
  if (st.k === 'part') {
    const p = d.parts[st.p]; const out = [['idee', p.idee]];
    p.paras.forEach((pa, j) => { out.push(['arg', pa.a]); out.push(['expl', pa.e]); out.push(['ex', pa.x, 'ex' + st.p + '_' + j]); });
    return out;
  }
  if (st.k === 'trans') return [['trans', d.trans[st.p], 'trans' + st.p]];
  if (st.k === 'concl') return [['bil', d.concl.bil, 'bil'], ['ouv', d.concl.ouv, 'ouv']];
  return [];
}
function dissParas(d, withLabels) {
  const P = [];
  P.push({ label: 'Introduction', role: 'pb', segs: [['acc', d.intro.acc], ['def', d.intro.def], ['pres', d.intro.pres], ['pb', d.intro.pb], ['ann', d.intro.ann]].filter(s => s[1]) });
  d.parts.forEach((p, i) => {
    p.paras.forEach((pa, j) => P.push({ label: 'Partie ' + ROMAN[i] + ' · paragraphe ' + (j + 1), role: 'arg', segs: [].concat(j === 0 && p.idee ? [['idee', p.idee]] : [], [['arg', pa.a], ['expl', pa.e], ['ex', pa.x]]).filter(s => s[1]) }));
    if (!p.paras.length && p.idee) P.push({ label: 'Partie ' + ROMAN[i], role: 'arg', segs: [['idee', p.idee]] });
    if (d.trans[i] && i < d.parts.length - 1) P.push({ label: 'Transition', role: 'trans', segs: [['trans', d.trans[i]]] });
  });
  P.push({ label: 'Conclusion', role: 'bil', segs: [['bil', d.concl.bil], ['ouv', d.concl.ouv]].filter(s => s[1]) });
  return P.filter(p => p.segs.length);
}
function DissText({ d, inlineRoles }) {

      ${pcs.length ? html`<div className="assembled">${pcs.map((p, k) => html`<${Piece} key=${k} role=${p[0]} text=${p[1]} cid=${p[2]} we=${we} picks=${picks} setPicks=${setPicks} />`)}</div>` : null}

/* -- Trame vide (atelier) -- */
const PH = { a: ['Tout d’abord, …', 'De plus, …', 'Enfin, …'], e: 'En effet, …', x: 'Par exemple, …' };
function fieldsOf(nParts, three) {
  const F = [['acc', 'intro', 'acc', 'Un fait précis, une date ou une citation liée au sujet.', ''], ['def', 'intro', 'def', 'Définis les mots-clés du sujet.', ''], ['pres', 'intro', 'pres', 'Les bornes (dates, lieux) et le contexte.', ''], ['pb', 'intro', 'pb', 'La question qui pose le débat.', 'Nous nous demanderons …'], ['ann', 'intro', 'ann', 'Les parties, dans l’ordre.', 'Nous verrons d’abord que …, puis que …, enfin que …']];
  for (let p = 0; p < nParts; p++) {
    F.push(['p' + p + 'i', 'p' + p, 'idee', 'Une phrase qui répond à la problématique.', '']);
    const n = three[p] ? 3 : 2;
    for (let s = 0; s < n; s++) {
      F.push(['p' + p + 's' + s + 'a', 'p' + p, 'arg', 'Une idée générale.', PH.a[s], s]);
      F.push(['p' + p + 's' + s + 'e', 'p' + p, 'expl', 'Pourquoi est-ce vrai ?', PH.e, s]);
      F.push(['p' + p + 's' + s + 'x', 'p' + p, 'ex', '', PH.x, s]);
    }
    if (p < nParts - 1) F.push(['t' + p, 't' + p, 'trans', 'Bilan de la partie, puis annonce de la suivante.', 'Ainsi, … Mais / Cependant, …']);
  }
  F.push(['bil', 'concl', 'bil', 'Réponds à la problématique en rappelant tes parties.', 'En conclusion, …'], ['ouv', 'concl', 'ouv', 'Une question nouvelle, liée au sujet.', '']);
  return F;
}

  const dd = ((store.diss || {})[dkey]) || {};
  const f = dd.f || {}; const checks = dd.checks || {}; const three = dd.three || {}; const nParts = dd.n || 3; const custom = dd.custom || '';
  const upd = patch => setStore(s => ({ ...s, diss: { ...(s.diss || {}), [dkey]: { ...((s.diss || {})[dkey] || {}), ...patch } } }));
  const setF = (k, v) => upd({ f: { ...f, [k]: v } });
  const choose = v => { setSid(v); setStore(s => ({ ...s, [selKey]: v })); const pl = v !== '__custom' && D.plans[v]; setAide(pl ? 1 : 3); setView('write'); };
  const FIELDS = fieldsOf(nParts, three);

  const d = {

    trans: [get('t0'), get('t1')],

  const full = dissPlain(d).trim();

      ${field(fs[0])}

    </section>`;
  };
  return html`<div className="page">

      <div className="opts">
        ${plan ? html`<div><div className="eyebrow">Niveau d’aide</div><div className="seg-ctl">${[[1, 'Plan visible'], [2, 'Problématique visible'], [3, 'Sans aide']].map(([n, l]) => html`<button key=${n} className=${'btn btn-sm' + (aide === n ? ' on' : '')} aria-pressed=${aide === n} onClick=${() => setAide(n)}>${l}</button>`)}</div></div>` : null}
        <div><div className="eyebrow">Nombre de parties</div><div className="seg-ctl">${[2, 3].map(n => html`<button key=${n} className=${'btn btn-sm' + (nParts === n ? ' on' : '')} aria-pressed=${nParts === n} onClick=${() => upd({ n })}>${n} parties</button>`)}</div></div>
      </div>
      <${Tabs} value=${view} onChange=${setView} items=${[['write', 'Préparer'], ['read', 'Ma dissertation'], ['check', 'Je vérifie'], ['model', 'Plan modèle et retour IA']]} />
      ${view === 'write' ? html`<${Fragment}>
        ${plan && aide < 3 ? html`<div className="pbox"><span className="eyebrow">Problématique proposée</span><div><${T} s=${plan.pb} /></div>${aide === 1 ? html`<p className="count"><strong>Type de plan :</strong> ${fr(plan.type)}</p>` : null}</div>` : null}

        <${Progress} value=${filled} max=${FIELDS.length} />
        <section className="group k-pb"><h3>Introduction</h3>${FIELDS.filter(x => x[1] === 'intro').map(field)}</section>
        ${Array.from({ length: nParts }, (_, p) => html`<${Fragment} key=${p}>${partBlock(p)}${p < nParts - 1 ? html`<section className="group k-trans">${FIELDS.filter(x => x[1] === 't' + p).map(field)}</section>` : null}<//>`)}
        <section className="group k-bil"><h3>Conclusion</h3>${FIELDS.filter(x => x[1] === 'concl').map(field)}</section>
        <div className="actions"><button className="btn btn-sm" onClick=${() => upd({ f: {}, checks: {} })}><${Icon} n="reset" s=${15} />Tout effacer</button><span className="spacer"></span><button className="btn btn-primary" onClick=${() => setView('read')}>Assembler ma dissertation<${Icon} n="right" s=${16} /></button></div>
        <p className="count">Ton brouillon reste enregistré dans ce navigateur, sujet par sujet.</p>
      <//>` : null}
      ${view === 'read' ? html`<${Fragment}>
        ${full ? html`<${DissText} d=${d} inlineRoles=${store.settings.colors !== false} />
          <div className="actions"><${SpeakBtn} text=${full} label="Écouter ma dissertation" /><span className="spacer"></span><button className="btn" onClick=${() => copyText(sujetText + '\n\n' + full)}><${Icon} n="copy" s=${16} />Copier le texte</button></div>`
          : html`<${Msg} kind="info">Ta dissertation est vide. Remplis quelques cases dans « Préparer ».</${Msg}>`}
        <div className="actions"><button className="btn" onClick=${() => setView('write')}><${Icon} n="left" s=${16} />Modifier</button><span className="spacer"></span><button className="btn btn-primary" onClick=${() => setView('check')}>Vérifier<${Icon} n="right" s=${16} /></button></div>
      <//>` : null}
      ${view === 'check' ? html`<${Fragment}>

        ${GRIDS.diss.every((_, i) => checks[i]) ? html`<${Msg} kind="pos">Tout est vérifié. Compare maintenant avec le plan modèle, puis demande un retour.</${Msg}>` : null}

        ${full.length > 50 ? html`<${AIPanel} mat=${mat} task="Dissertation (complète ou partielle)" sujet=${sujetText} consigne=${suj && suj.consigne ? suj.consigne : ''} text=${full} grid=${GRIDS.diss} full=${true} />` : html`<${Msg} kind="info">Rédige au moins l’introduction ou une partie pour demander un retour à une IA.</${Msg}>`}

      <${Outline} plan=${D.plans[pid]} />
    <//>` : null}
    ${tab === 'sujets' ? html`<div>${D.sujets.map(s => html`<div key=${s.id} className="cit-row"><p className="task"><${T} s=${s.q} /></p>${s.consigne ? html`<p className="count"><strong>Consigne :</strong> <${T} s=${s.consigne} /></p>` : null}<div className="cit-meta"><span className="pill">${s.src}</span>${D.plans[s.id] ? html`<span className="pill on">Plan modèle</span>` : null}${D.we.some(w => w.sujet === s.id) ? html`<span className="pill on">Dissertation résolue</span>` : null}</div></div>`)}</div>` : null}
  </div>`;
}

/* -- Accueil -- */
const GROUPS = [
  ['Comprendre et mémoriser', ['cours', 'glossaire', 'cartes', 'quiz']],
  ['Mobiliser ses connaissances', ['restit', 'argu']],
  ['La dissertation', ['methode', 'exemples', 'progression', 'atelier']]
];
function pageStatus(id, mat, prog, store) {
  const D = MATS[mat];
  if (id === 'cours') return [prog[mat + ':cours'] ? 1 : 0, 1];
  if (id === 'cartes') { const k = (store.cards || {})[mat] || {}; const all = D.gloss.length + D.frise.length; return [Object.values(k).filter(v => v === 'ok').length, all]; }
  if (id === 'quiz') return [prog[mat + ':quiz'] != null ? 1 : 0, 1];
  if (id === 'restit') return [(prog[mat + ':restit-we'] ? 1 : 0) + D.restit.items.filter((_, i) => prog[mat + ':r' + i]).length, 1 + D.restit.items.length];
  if (id === 'argu') return [(prog[mat + ':argu-we'] ? 1 : 0) + D.argu.items.filter((_, i) => prog[mat + ':a' + i]).length, 1 + D.argu.items.length];
  if (id === 'methode') return [(prog['methode'] ? 1 : 0) + (prog['methode-quiz'] != null ? 1 : 0), 2];
  if (id === 'exemples') return [D.we.filter(w => prog[mat + ':' + w.id]).length, D.we.length];
  if (id === 'progression') { let n = 0, m = 0; D.fams.forEach((f, fi) => f.items.forEach((_, i) => { m++; if (prog[mat + ':f' + fi + '-' + i]) n++; })); return [n, m]; }
  if (id === 'atelier') return [prog[mat + ':atelier'] ? 1 : 0, 1];
  return null;
}
function MatSwitch({ big }) {
  const { mat, setMat } = useApp();
  return html`<div className=${'seg-ctl matsw' + (big ? ' big' : '')} role="group" aria-label="Matière">${Object.values(MATS).map(D => html`<button key=${D.id} className=${'btn' + (big ? '' : ' btn-sm') + (mat === D.id ? ' on' : '')} aria-pressed=${mat === D.id} onClick=${() => setMat(D.id)}>${D.label}</button>`)}</div>`;
}
function PHome() {
  const { mat, store, go } = useApp(); const D = MATS[mat];
  let num = 0;
  return html`<div className="page">
    <div><span className="eyebrow">Première générale · Préparer la dissertation</span><h1>HGGSP et histoire : du cours à la dissertation</h1>
      <p className="lead">Comprendre et retenir le cours, utiliser ses connaissances pour argumenter, puis rédiger une dissertation, pas à pas.</p></div>
    <div className="frame"><span className="eyebrow">Choisis ta matière</span><${MatSwitch} big=${true} /><p className="task"><${T} s=${D.chap} /></p><p className="count">Problématique du cours : <${T} s=${D.pbCours} /></p></div>
    ${GROUPS.map(([g, ids]) => html`<section key=${g} className="homegrp"><h2>${g}</h2><ol className="path">${ids.map(id => {
      num++; const P = PAGES[id]; const st = pageStatus(id, mat, store.prog, store); const done = st && st[0] >= st[1];
      return html`<li key=${id}><button onClick=${() => go(id)}><span className=${'n' + (done ? ' done' : '')}>${done ? html`<${Icon} n="check" s=${16} />` : num}</span>
        <span><span className="t">${P.t}</span><br/><span className="d">${P.d}</span></span>
        <span className=${'status' + (done ? ' done' : st && st[0] ? ' started' : '')}>${done ? 'Terminé' : st && st[0] ? st[0] + ' / ' + st[1] : 'À faire'}</span></button></li>`;
    })}</ol></section>`)}
    <div className="tips">
      <div className="frame tip"><${Icon} n="eye" /><h3>Une chose à la fois</h3><p>Chaque écran présente une seule idée. Avance à ton rythme.</p></div>
      <div className="frame tip"><${Icon} n="think" /><h3>Réponds avant de regarder</h3><p>Dans les exemples résolus, réponds dans ta tête avant de dévoiler.</p></div>
      <div className="frame tip"><${Icon} n="chat" /><h3>Un retour après l’effort</h3><p>Quand tu as écrit et vérifié, copie la consigne prête pour l’IA de ton choix.</p></div>
    </div>
  </div>`;
}

/* -- Notes pour l’adulte -- */
function PNotes() {
  return html`<div className="page"><div className="notes">
    <div><h1>Notes pour l’adulte</h1><p className="lead">Pour l’orthophoniste, l’enseignant ou le parent qui accompagne l’élève.</p></div>
    <section><h2>Principes de conception</h2><ul>
      <li><strong>Pré-entraînement et segmentation.</strong> Le cours est découpé en écrans courts (une idée par écran), avec le vocabulaire défini avant les exercices. <span className="ref">Mayer, principes de pré-entraînement et de segmentation.</span></li>
      <li><strong>Contiguïté et cohérence.</strong> Chaque définition est à côté de son exemple ; aucune image décorative. <span className="ref">Mayer.</span></li>
      <li><strong>Récupération espacée.</strong> Flashcards avec remise en fin de paquet des cartes non sues ; quiz du cours et quiz de vocabulaire tiré au hasard. <span className="ref">Roediger et Karpicke, effet de test.</span></li>
      <li><strong>Exemples résolus, puis estompage.</strong> Chaque type d’exercice commence par un exemple résolu avec auto-explication ; la seconde dissertation résolue demande de choisir certaines pièces ; la trame vide propose trois niveaux d’aide. <span className="ref">Sweller ; Renkl et Atkinson ; Kalyuga, renversement de l’expertise.</span></li>
      <li><strong>Complexité croissante.</strong> Cinq niveaux : reconnaître, organiser, choisir, compléter, rédiger.</li>
      <li><strong>Signalisation.</strong> Une couleur et une étiquette par pièce de dissertation, identiques partout (désactivables dans « Affichage »). <span className="ref">Mayer, principe de signalisation.</span></li>
      <li><strong>Autorégulation.</strong> Après chaque production : repérage automatique des éléments attendus (questions de cours), grille d’autovérification, corrigé modèle, puis retour par une IA. <span className="ref">Inspiré du modèle SRSD, Harris et Graham.</span></li>
    </ul></section>
    <section><h2>Sur les contenus</h2><ul>
      <li><strong>HGGSP.</strong> Le contenu suit le cours de l’élève (axe 1 et axe 2 du thème « S’informer »). Les sujets viennent de la Banque nationale de sujets (liste de l’académie de Versailles) ; un sujet d’entraînement porte sur les deux jalons de l’axe 2.</li>
      <li><strong>Histoire.</strong> Le cours de l’élève s’arrête à Charles X. La révolution de 1830, la monarchie de Juillet et 1848 (Printemps des peuples) sont ajoutées d’après le programme (points de passage : 1815, Metternich et le congrès de Vienne ; 1822, le massacre de Chios ; 1830, les Trois Glorieuses). Elles portent l’étiquette « Complément ». La dissertation résolue guidée n’utilise que le cours de l’élève.</li>
      <li><strong>Précisions apportées aux notes de cours :</strong> la radio et la télévision relèvent du XXe siècle (et non du XIXe) ; c’est <em>La Libre Parole</em> de Drumont qui révèle l’arrestation de Dreyfus en 1894 ; la date de la rotative est donnée de façon large (milieu du XIXe siècle) ; le traité d’Andrinople (1829) est suivi de l’indépendance grecque proprement dite en 1830 ; les chiffres de l’opinion américaine sont arrondis (environ 6 sur 10 favorables en 1965, moins de 3 sur 10 au début des années 1970).</li>
      <li>En histoire (enseignement commun), l’exercice s’appelle souvent « réponse à une question problématisée » ; la structure travaillée ici est la même.</li>
    </ul></section>
    <section><h2>Le retour par une IA</h2><ul>
      <li>Il n’est proposé qu’après l’écriture, l’autovérification et la comparaison avec le corrigé.</li>
      <li>La consigne donne à l’IA le contexte (niveau, matière, chapitre, plan du cours, sujet, critères) et lui demande : deux points forts, trois pistes avec exemples, une vérification des faits, une version corrigée qui garde les idées de l’élève (ajouts entre crochets), puis un petit exercice de réécriture.</li>
      <li>Elle signale à l’IA les difficultés d’organisation des phrases, sans nommer de diagnostic, et ne contient aucune donnée personnelle.</li>
      <li>Les IA grand public ont des conditions d’âge (souvent 13 ans minimum, parfois 18 ans ou un accord parental). Vérifiez-les avant de proposer cet usage.</li>
    </ul></section>
    <section><h2>Conseils d’utilisation</h2><ul>
      <li>Une séance courte = une page (ou une famille d’exercices).</li>
      <li>Faire le premier exemple résolu ensemble, en pensant à voix haute.</li>
      <li>Revenir aux flashcards en début de chaque séance (5 minutes).</li>
      <li>Dans la trame vide : d’abord la problématique et les idées des parties ; deux paragraphes par partie suffisent au début.</li>
      <li>Autoriser le clavier, la dictée vocale et le bouton « Écouter ». Dans « Affichage », les voix françaises sont classées de la meilleure à la moins bonne (voix « Naturelles » de Microsoft Edge, voix Premium et Améliorées d’Apple, voix Google de Chrome, puis voix système) ; la vitesse et la hauteur se règlent aussi. Les longs textes sont lus phrase par phrase, ce qui évite les coupures.</li>
    </ul></section>
    <p className="count">Les progrès et les brouillons sont enregistrés uniquement dans le navigateur utilisé.</p>
  </div></div>`;
}

function VoiceSettings() {
  const { store, setSettings } = useApp();
  const s = store.settings;
  const voices = useVoices();
  const cur = voices.find(x => x.v.voiceURI === s.voice) || voices[0];
  const best = voices.length && voices[0].score >= 70;
  return html`<div className="voice-set">
    <label className="switch"><span>Boutons « Écouter »</span><input type="checkbox" checked=${s.tts !== false} onChange=${e => setSettings({ tts: e.target.checked })} /></label>
    ${s.tts !== false ? html`<${Fragment}>
      <div><label className="lbl" htmlFor="set-voice">Voix</label>
        ${voices.length ? html`<select id="set-voice" value=${cur ? cur.v.voiceURI : ''} onChange=${e => setSettings({ voice: e.target.value })}>
          ${voices.map((x, i) => html`<option key=${x.v.voiceURI} value=${x.v.voiceURI}>${(i === 0 ? '★ ' : '') + x.v.name.replace(/^Microsoft /, '').replace(/ - .*$/, '').replace(/ \(.*\)$/, '') + ' · ' + x.tier + ' · ' + x.lang}</option>`)}
        </select>` : html`<p className="count">Aucune voix française trouvée sur cet appareil.</p>`}</div>
      <div><label className="lbl" htmlFor="set-rate">Vitesse : ${Math.round(s.rate * 100)} %</label><input id="set-rate" type="range" min="0.6" max="1.3" step="0.05" value=${s.rate} onChange=${e => setSettings({ rate: Number(e.target.value) })} /></div>
      <div><label className="lbl" htmlFor="set-pitch">Hauteur de la voix : ${s.pitch < 0.95 ? 'plus grave' : s.pitch > 1.05 ? 'plus aiguë' : 'normale'}</label><input id="set-pitch" type="range" min="0.7" max="1.3" step="0.05" value=${s.pitch} onChange=${e => setSettings({ pitch: Number(e.target.value) })} /></div>
      <div className="actions"><${SpeakBtn} text="Bonjour ! Voici la voix choisie pour lire le cours et les exemples." label="Tester la voix" /><button className="btn btn-sm btn-flat" onClick=${() => setSettings({ voice: '', rate: 0.95, pitch: 1 })}><${Icon} n="reset" s=${15} />Par défaut</button></div>
      ${!best ? html`<p className="count">Pour une voix plus naturelle et gratuite : ouvre l’application dans Microsoft Edge (voix « Naturelles ») ou dans Chrome (« Google français »). Sur iPhone ou Mac, télécharge une voix « Améliorée » dans les réglages d’accessibilité.</p>` : null}
    <//>` : null}
  </div>`;
}

/* -- Réglages -- */
function Settings({ onClose }) {
  const { store, setSettings, setStore } = useApp();
  const [sure, setSure] = useState(false);
  const s = store.settings;
  return html`<${Fragment}>
    <div className="pop-scrim" onClick=${onClose}></div>
    <div className="pop" role="dialog" aria-label="Affichage">
      <div><div className="lbl">Taille du texte</div><div className="seg-ctl">${[['m', 'Normal'], ['l', 'Grand'], ['xl', 'Très grand']].map(([k, l]) => html`<button key=${k} className=${'btn btn-sm' + (s.size === k ? ' on' : '')} aria-pressed=${s.size === k} onClick=${() => setSettings({ size: k })}>${l}</button>`)}</div></div>
      <div><div className="lbl">Thème</div><div className="seg-ctl">${[['auto', 'Auto'], ['light', 'Clair'], ['dark', 'Sombre']].map(([k, l]) => html`<button key=${k} className=${'btn btn-sm' + (s.theme === k ? ' on' : '')} aria-pressed=${s.theme === k} onClick=${() => setSettings({ theme: k })}>${l}</button>`)}</div></div>
      <label className="switch"><span>Texte aéré</span><input type="checkbox" checked=${!!s.airy} onChange=${e => setSettings({ airy: e.target.checked })} /></label>
      <label className="switch"><span>Couleurs des pièces</span><input type="checkbox" checked=${s.colors !== false} onChange=${e => setSettings({ colors: e.target.checked })} /></label>
      ${CAN_SPEAK ? html`<${VoiceSettings} />` : null}
      ${!sure ? html`<button className="btn btn-sm" onClick=${() => setSure(true)}><${Icon} n="reset" s=${15} />Effacer ma progression</button>`
        : html`<div className="frame"><span>Effacer toute ta progression et tes brouillons ?</span><div className="actions"><button className="btn btn-sm" onClick=${() => setSure(false)}>Annuler</button><button className="btn btn-sm btn-primary" onClick=${() => { setStore({ settings: store.settings, mat: store.mat, prog: {}, drafts: {}, diss: {}, cards: {} }); setSure(false); onClose(); }}>Oui, effacer</button></div></div>`}
    </div>
  <//>`;
}

/* ---------- Application ---------- */
const PAGES = {
  home: { t: 'Accueil', icon: 'home', C: PHome },
  cours: { t: 'L’essentiel du cours', icon: 'book', C: PCours, d: 'Le cours en écrans courts, la frise et le plan.' },
  glossaire: { t: 'Glossaire', icon: 'words', C: PGloss, d: 'Les mots difficiles : définition simple et exemple.' },
  cartes: { t: 'Flashcards', icon: 'cards', C: PCards, d: 'Mémoriser le vocabulaire et les dates.' },
  quiz: { t: 'Quiz', icon: 'question', C: PQuiz, d: 'Vérifier ce que tu as compris et retenu.' },
  restit: { t: 'Restituer', icon: 'recall', C: PRestit, d: 'Répondre précisément à une question de cours.' },
  argu: { t: 'Argumenter', icon: 'para', C: PArgu, d: 'Prouver une idée : argument, explication, exemple.' },
  methode: { t: 'Les pièces de la dissertation', icon: 'frame', C: PMethode, d: 'Le nom et le rôle de chaque pièce.' },
  exemples: { t: 'Dissertations résolues', icon: 'bulb', C: PExemples, d: 'Deux dissertations, étape par étape.' },
  progression: { t: 'Progression', icon: 'steps', C: PProg, d: 'Exercices du plus simple au plus complexe.' },
  atelier: { t: 'Trame vide', icon: 'pen', C: PAtelier, d: 'Rédiger seul une dissertation complète.' },
  memo: { t: 'Mémo', icon: 'memo', C: PMemo },
  notes: { t: 'Notes pour l’adulte', icon: 'info', C: PNotes }
};

function App() {
  const [store, setStore] = useState(() => {
    const s = loadStore();
    return { ...s, settings: { size: 'm', airy: false, colors: true, tts: true, theme: 'auto', voice: '', rate: 0.95, pitch: 1, ...(s.settings || {}) }, mat: s.mat === 'hist' ? 'hist' : 'hggsp', prog: s.prog || {}, drafts: s.drafts || {}, diss: s.diss || {}, cards: s.cards || {} };
  });
  const initial = (() => { const h = (location.hash || '').slice(1); return PAGES[h] ? h : 'home'; })();
  const [page, setPage] = useState(initial);
  const [drawer, setDrawer] = useState(false);
  const [pop, setPop] = useState(false);
  useEffect(() => { saveStore(store); }, [store]);
  useEffect(() => { const h = () => { const k = (location.hash || '').slice(1); if (PAGES[k]) setPage(k); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  useEffect(() => {
    const r = document.documentElement; const s = store.settings;
    r.style.setProperty('--base', s.size === 'xl' ? '20px' : s.size === 'l' ? '18px' : '16px');
    r.style.setProperty('--lh', s.airy ? '1.85' : '1.55');
    r.style.setProperty('--ls', s.airy ? '.025em' : '0em');
    r.style.setProperty('--ws', s.airy ? '.12em' : '0em');
    const dark = s.theme === 'dark' || (s.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark ? 'dark' : 'light');
    TTS.voice = s.voice || ''; TTS.rate = Number(s.rate) || 0.95; TTS.pitch = Number(s.pitch) || 1;
  }, [store.settings]);
  const go = p => { setPage(p); setDrawer(false); try { history.replaceState(null, '', '#' + p); } catch (e) {} const c = document.querySelector('.content'); if (c) c.scrollTop = 0; };
  const setProg = (k, v) => setStore(s => ({ ...s, prog: { ...s.prog, [k]: v } }));
  const setSettings = patch => setStore(s => ({ ...s, settings: { ...s.settings, ...patch } }));
  const setMat = m => setStore(s => ({ ...s, mat: m }));
  const mat = store.mat;
  const ctx = { store, setStore, setProg, setSettings, go, mat, setMat };
  const P = PAGES[page];
  let num = 0;
  const navItem = (id, n) => {
    const p = PAGES[id]; const st = n ? pageStatus(id, mat, store.prog, store) : null;
    return html`<button key=${id} className=${'nav-item' + (page === id ? ' active' : '')} aria-current=${page === id ? 'page' : undefined} onClick=${() => go(id)}>
      ${n ? html`<span className="num">${n}</span>` : null}<${Icon} n=${p.icon} /><span className="lbl">${p.t}</span>
      ${st ? html`<span className=${'st' + (st[0] >= st[1] ? ' done' : '')}>${st[0] >= st[1] ? html`<${Icon} n="check" s=${14} />` : st[0] > 0 ? Math.round(100 * st[0] / st[1]) + ' %' : ''}</span>` : null}
    </button>`;
  };
  return html`<${Ctx.Provider} value=${ctx}>
    <div className=${'app' + (store.settings.colors === false ? ' nocolor' : '')}>
      <header className="header">
        <button className="btn btn-flat btn-icon menu-btn" aria-label="Ouvrir le menu" onClick=${() => setDrawer(true)}><${Icon} n="menu" /></button>
        <span className="app-name">Du cours à la dissertation</span><span className="sep"></span>
        <span className="page-name">${P.t}</span>
        <span className="spacer"></span>
        <${MatSwitch} />
        <button className=${'btn btn-flat' + (pop ? ' on' : '')} aria-expanded=${pop} aria-label="Affichage" onClick=${() => setPop(!pop)}><${Icon} n="sliders" /><span className="hide-sm">Affichage</span></button>
        ${pop ? html`<${Settings} onClose=${() => setPop(false)} />` : null}
      </header>
      <div className="main">
        <div className=${'scrim' + (drawer ? ' open' : '')} onClick=${() => setDrawer(false)}></div>
        <nav className=${'sidebar' + (drawer ? ' open' : '')} aria-label="Navigation">
          ${navItem('home')}
          ${GROUPS.map(([g, ids]) => html`<${Fragment} key=${g}><div className="side-label">${g}</div>${ids.map(id => navItem(id, ++num))}<//>`)}
          <div className="side-label">Aide</div>
          ${navItem('memo')}${navItem('notes')}
        </nav>
        <main className="content"><${P.C} key=${page + mat} /></main>
      </div>
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
</body>
</html>
