<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Du cours à la dissertation · HGGSP et histoire (Première)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout : fenêtre KDE Plasma (Breeze) — barre d'en-tête, barre latérale, une seule vue de contenu, une tâche à la fois.
   Couleurs : palette Breeze ; une couleur par pièce de dissertation (signalisation), identique partout. */
:root{
  --window:#eff0f1; --view:#fcfcfc; --alt:#f5f6f7; --text:#232629; --muted:#5d6873;
  --line:#d4d7da; --line-strong:#b8bbbe; --btn:#fcfcfc; --btn-hover:#ffffff;
  --accent:#3daee9; --accent-text:#1d6fa5; --accent-tint:rgba(61,174,233,.13); --accent-tint-strong:rgba(61,174,233,.26);
  --pos:#1e8049; --pos-tint:rgba(39,174,96,.12); --neg:#b8323f; --neg-tint:rgba(218,68,83,.11);
  --r-arg:#1d6fa5; --r-expl:#7a3b99; --r-ex:#a35200; --r-ana:#1e8049; --r-lien:#0d7766;
  --r-acc:#3d5266; --r-pres:#4549b0; --r-def:#7a3b99; --r-pb:#1d6fa5; --r-ann:#b0306a; --r-bil:#0d7766; --r-ouv:#a35200; --r-trans:#6b737b;
  --shadow:0 1px 2px rgba(35,38,41,.12); --scrim:rgba(35,38,41,.35);
  --f-ui:"Noto Sans","Segoe UI",Cantarell,Ubuntu,system-ui,sans-serif;
  --f-read:"Noto Serif",Georgia,"Times New Roman",serif;
  --base:16px; --lh:1.55; --ls:0em; --ws:0em;
}
:root[data-theme="dark"]{
  --window:#2a2e32; --view:#1b1e20; --alt:#232629; --text:#fcfcfc; --muted:#a3abb3;
  --line:#3a3f44; --line-strong:#50565c; --btn:#31363b; --btn-hover:#383d42;
  --accent-text:#5cc3f2; --accent-tint:rgba(61,174,233,.17); --accent-tint-strong:rgba(61,174,233,.32);
  --pos:#4ccf7e; --pos-tint:rgba(39,174,96,.2); --neg:#f06b78; --neg-tint:rgba(218,68,83,.2);
  --r-arg:#5cc3f2; --r-expl:#c792e0; --r-ex:#f8a14c; --r-ana:#4ccf7e; --r-lien:#3fd0b3;
  --r-acc:#aab9c8; --r-pres:#a3a6f7; --r-def:#c792e0; --r-pb:#5cc3f2; --r-ann:#f27aab; --r-bil:#3fd0b3; --r-ouv:#f8a14c; --r-trans:#9aa3ab;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.5); color-scheme:dark;
}
html{height:100%;box-sizing:border-box;font-size:var(--base)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--window);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.55rem;font-weight:600} h2{font-size:1.2rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.35rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-height:0}
.header{display:flex;align-items:center;gap:.5rem;padding:.35rem 1rem;background:var(--window);border-bottom:1px solid var(--line);min-height:3rem;position:relative}
.header .app-name{font-size:.82rem;color:var(--muted);white-space:nowrap}
.header .page-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.header .sep{width:1px;height:1.2rem;background:var(--line)}
.spacer{flex:1}
.header .menu-btn{display:none}
.main{display:grid;grid-template-columns:16rem minmax(0,1fr);min-height:0}
.sidebar{background:var(--window);border-right:1px solid var(--line);overflow-y:auto;padding:.6rem .5rem;display:flex;flex-direction:column;gap:2px}
.side-label{font-size:.75rem;font-weight:600;color:var(--muted);padding:.75rem .65rem .3rem;letter-spacing:.03em}
.nav-item{display:flex;align-items:center;gap:.6rem;width:100%;padding:.42rem .6rem;border-radius:4px;border:1px solid transparent;background:none;color:var(--text);font:inherit;font-size:.93rem;text-align:left;cursor:pointer;letter-spacing:0;word-spacing:0}
.nav-item:hover{background:var(--accent-tint)}
.nav-item.active{background:var(--accent-tint-strong);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .num{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;width:1rem;text-align:right}
.nav-item .st{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .st.done{color:var(--pos)}
.content{background:var(--view);overflow-y:auto;min-width:0}
.page{max-width:48rem;margin:0 auto;padding:1.5rem 1.25rem 3rem;display:flex;flex-direction:column;gap:1.2rem}
.lead{color:var(--muted);max-width:64ch}
.scrim{display:none}
@media (max-width:800px){
  .header .menu-btn{display:inline-flex}
  .header .app-name,.header .sep,.header .hide-sm{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(18rem,86vw);z-index:30;transform:translateX(-102%);transition:transform .18s ease;box-shadow:0 0 18px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:25}
  .page{padding:1.1rem 1rem 2.5rem}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font:inherit;font-size:.93rem;letter-spacing:0;word-spacing:0;color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.38rem .85rem;min-height:2.2rem;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,background .12s;text-align:center}
.btn:hover{border-color:var(--accent);background:var(--btn-hover)}
.btn:disabled{opacity:.5;cursor:default;border-color:var(--line-strong)}
.btn-primary{border-color:var(--accent);background:var(--accent-tint)}
.btn-primary:hover{background:var(--accent-tint-strong)}
.btn-flat{background:transparent;border-color:transparent;box-shadow:none}
.btn-flat:hover{background:var(--accent-tint);border-color:transparent}
.btn-sm{font-size:.84rem;padding:.18rem .55rem;min-height:1.9rem}
.btn-icon{padding:.35rem;min-width:2.2rem}
.btn.on{background:var(--accent-tint-strong);border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;font:inherit;font-size:.93rem;letter-spacing:0;word-spacing:0;padding:.55rem .95rem;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:.4rem;align-items:center}
.tab:hover{color:var(--text);background:var(--accent-tint)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .n{display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;border:1px solid currentColor;font-size:.72rem}
.tab .ok{color:var(--pos)}

.frame{border:1px solid var(--line);border-radius:5px;background:var(--alt);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.7rem}
.card{border:1px solid var(--line);border-radius:5px;background:var(--view);padding:1.1rem 1.2rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.9rem}
.eyebrow{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .25s}

.msg{display:flex;gap:.6rem;align-items:flex-start;border:1px solid;border-radius:5px;padding:.7rem .9rem}
.msg svg{flex:none;margin-top:.18rem}
.msg .body{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.msg-pos{border-color:color-mix(in srgb,var(--pos) 60%,transparent);background:var(--pos-tint)} .msg-pos>svg{color:var(--pos)}
.msg-neg{border-color:color-mix(in srgb,var(--neg) 60%,transparent);background:var(--neg-tint)} .msg-neg>svg{color:var(--neg)}
.msg-info{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-tint)} .msg-info>svg{color:var(--accent-text)}

details.more{border:1px solid var(--line);border-radius:4px;background:var(--view)}
details.more>summary{cursor:pointer;padding:.45rem .75rem;font-size:.9rem;font-weight:600;color:var(--accent-text)}
details.more>.inner{padding:0 .8rem .8rem;display:flex;flex-direction:column;gap:.5rem}

.md{display:flex;flex-direction:column;gap:.6rem}
.read{font-family:var(--f-read);font-size:1.06rem;line-height:calc(var(--lh) + .12)}
.dl{display:grid;grid-template-columns:minmax(7rem,auto) minmax(0,1fr);gap:.5rem 1rem;margin:0}
.dl dt{font-weight:600}
.dl dd{margin:0}
@media (max-width:540px){.dl{grid-template-columns:minmax(0,1fr);gap:.15rem} .dl dd{margin-bottom:.45rem}}

/* Rôles (signalisation) */
.k-arg{--c:var(--r-arg)} .k-expl{--c:var(--r-expl)} .k-ex{--c:var(--r-ex)} .k-ana{--c:var(--r-ana)} .k-lien{--c:var(--r-lien)}
.k-acc{--c:var(--r-acc)} .k-pres{--c:var(--r-pres)} .k-def{--c:var(--r-def)} .k-pb{--c:var(--r-pb)} .k-ann{--c:var(--r-ann)}
.k-bil{--c:var(--r-bil)} .k-ouv{--c:var(--r-ouv)} .k-trans{--c:var(--r-trans)}
.chip{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.06rem .45rem;border-radius:3px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap;line-height:1.5;word-spacing:0}
.seg{border-left:3px solid var(--c);padding:.1rem 0 .1rem .7rem}
.seg-inline{color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:3px;padding:.03em .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.nocolor .chip{color:var(--text);background:transparent;border-color:var(--line-strong)}
.nocolor .seg{border-left-color:var(--line-strong)}
.nocolor .seg-inline{color:inherit;background:none}
.legend{display:flex;flex-wrap:wrap;gap:.4rem}

/* Accueil */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--view);gap:0}
.path li+li{border-top:1px solid var(--line)}
.path button{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;padding:.75rem 1rem;background:none;border:none;font:inherit;color:var(--text);text-align:left;cursor:pointer;letter-spacing:0;word-spacing:0}
.path button:hover{background:var(--accent-tint)}
.path .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-weight:600;color:var(--muted)}
.path .n.done{border-color:var(--pos);color:var(--pos);background:var(--pos-tint)}
.path .t{font-weight:600}
.path .d{font-size:.86rem;color:var(--muted)}
.status{font-size:.76rem;padding:.08rem .5rem;border-radius:10px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.status.done{border-color:var(--pos);color:var(--pos)}
.status.started{border-color:var(--accent);color:var(--accent-text)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:640px){.tips{grid-template-columns:minmax(0,1fr)}}
.tip{display:flex;flex-direction:column;gap:.3rem}
.tip svg{color:var(--accent-text)}
.tip p{font-size:.9rem;color:var(--muted)}

/* Pas à pas */
.dots{display:flex;gap:.35rem;flex-wrap:wrap}
.dot{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:.78rem;font-weight:600;background:var(--view);color:var(--muted);cursor:pointer;font-family:inherit;padding:0}
.dot.cur{border-color:var(--accent);background:var(--accent);color:#fff}
.dot.past{border-color:var(--pos);color:var(--pos)}
.dot:disabled{cursor:default;opacity:.6}
.task{font-family:var(--f-read);font-size:1.12rem}
.selfq{display:flex;gap:.55rem;align-items:flex-start;color:var(--muted);font-style:italic}
.answer{display:flex;flex-direction:column;gap:.35rem;align-items:flex-start}
.why{border-top:1px dashed var(--line-strong);padding-top:.7rem;display:flex;flex-direction:column;gap:.35rem}
.why p{color:var(--muted);font-size:.95rem}
.done-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:.5rem}
.done-list li{display:flex;flex-direction:column;gap:.15rem}
.done-list .h{font-size:.8rem;font-weight:600;color:var(--muted)}

/* Familles d'exercices */
.fams{display:grid;gap:.6rem}
.fam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line);border-radius:5px;padding:.75rem .9rem;cursor:pointer;letter-spacing:0;word-spacing:0}
.fam:hover{border-color:var(--accent);background:var(--accent-tint)}
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:3.6rem;height:3.2rem;border-radius:4px;background:var(--alt);border:1px solid var(--line);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lvl b{font-size:1.15rem;color:var(--text);letter-spacing:0}
.bars{display:flex;gap:2px}
.bars i{width:6px;height:10px;border-radius:1px;background:var(--line)}
.bars i.on{background:var(--accent)}

/* Exercices */
.prompt{font-size:1.05rem;font-weight:500}
.choices{display:flex;flex-direction:column;gap:.5rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.65rem .85rem;cursor:pointer;box-shadow:var(--shadow)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice .mark{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:.1rem}
.choice.ok{border-color:var(--pos);background:var(--pos-tint)} .choice.ok .mark{border-color:var(--pos);color:var(--pos)}
.choice.no{border-color:var(--neg);background:var(--neg-tint)} .choice.no .mark{border-color:var(--neg);color:var(--neg)}
.choice.dim{opacity:.55}
.mrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 1.4rem;gap:.6rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.mrow .ic{display:grid;place-items:center}
.mrow .ic.ok{color:var(--pos)} .mrow .ic.no{color:var(--neg)}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr) 1.4rem}.mrow select{grid-column:1}}
select,textarea,input[type=text],input[type=search]{font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line-strong);border-radius:4px;padding:.45rem .6rem;width:100%;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws)}
textarea{resize:vertical;min-height:7rem}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.zone{display:flex;flex-direction:column;gap:.45rem}
.zone-label{font-size:.8rem;font-weight:600;color:var(--muted)}
.slot{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.55rem .8rem;cursor:pointer;box-shadow:var(--shadow)}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{cursor:default}
.slot .pos{flex:none;width:1.5rem;height:1.5rem;border-radius:3px;background:var(--accent-tint-strong);color:var(--accent-text);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:.1rem}
.slot.ok{border-color:var(--pos);background:var(--pos-tint)} .slot.ok .pos{background:var(--pos);color:var(--view)}
.slot.no{border-color:var(--neg);background:var(--neg-tint)} .slot.no .pos{background:var(--neg);color:var(--view)}
.empty{border:1px dashed var(--line-strong);border-radius:4px;padding:.75rem;color:var(--muted);font-size:.9rem;text-align:center}
.checks{display:flex;flex-direction:column;gap:.4rem}
.checks label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
.checks input{width:1.1rem;height:1.1rem;margin-top:.22rem;accent-color:var(--accent);flex:none}
.model{font-family:var(--f-read);font-size:1.02rem;line-height:calc(var(--lh) + .1);border-left:3px solid var(--pos);padding-left:.8rem}
.stage{display:flex;flex-direction:column;gap:.6rem;border-top:1px solid var(--line);padding-top:.9rem}
.stage-h{display:flex;gap:.5rem;align-items:center;font-weight:600}
.stage-h .n{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent-tint-strong);color:var(--accent-text);font-size:.75rem}
.prompt-box{font-family:ui-monospace,"Noto Sans Mono",monospace;font-size:.82rem;min-height:12rem;background:var(--alt)}

/* Plans */
.outline{display:flex;flex-direction:column;gap:.55rem}
.ol-part{border:1px solid var(--line);border-radius:5px;background:var(--view);overflow:hidden}
.ol-head{display:flex;gap:.6rem;align-items:center;padding:.5rem .8rem;background:var(--alt);font-weight:600}
.ol-head .rn{flex:none;width:1.7rem;height:1.7rem;border-radius:3px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:.85rem}
.ol-sub{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.4rem;padding:.45rem .8rem;border-top:1px solid var(--line);font-size:.95rem}
.ol-sub b{color:var(--muted)}
.pbox{font-family:var(--f-read);font-size:1.05rem;padding:.7rem .9rem;border:1px solid var(--accent);border-radius:4px;background:var(--accent-tint)}

/* Mémo */
.cit-row{display:flex;flex-direction:column;gap:.3rem;padding:.8rem 0;border-top:1px solid var(--line)}
.cit-row:first-child{border-top:none}
.cit-row q{font-family:var(--f-read);font-size:1.03rem;quotes:"« " " »"}
.cit-meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;font-size:.75rem;padding:.05rem .5rem;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);background:var(--alt)}
.pill.on{border-color:var(--accent);color:var(--accent-text);background:var(--accent-tint);font-weight:600}
button.pill{cursor:pointer;font-family:inherit}

/* Atelier */
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.88rem;font-weight:600;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.field .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.field textarea{min-height:4rem}
.group{display:flex;flex-direction:column;gap:.75rem;border-left:3px solid var(--c,var(--line-strong));padding-left:.9rem}
.subbox{border:1px solid var(--line);border-radius:4px;background:var(--alt);padding:.6rem .75rem;display:flex;flex-direction:column;gap:.45rem}
.assembled{display:flex;flex-direction:column;gap:.9rem}
.assembled .apara{display:flex;flex-direction:column;gap:.2rem}
.para-label{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg-ctl{display:flex;max-width:30rem}
.seg-ctl .btn{border-radius:0;flex:1;box-shadow:none}
.seg-ctl .btn:first-child{border-radius:4px 0 0 4px}
.seg-ctl .btn:last-child{border-radius:0 4px 4px 0}
.seg-ctl .btn+.btn{margin-left:-1px}

/* Réglages */

<script>
/* =====================================================================
   HGGSP — Chapitre 2 : S’informer : un regard critique sur les sources
   et modes de communication (programme : thème 4).
   Source principale : le cours de l’élève (01/10/2026). Les ajouts hors
   cours sont marqués comp: true.
   ===================================================================== */
const D_HGGSP = {
  id: 'hggsp',
  label: 'HGGSP',
  long: 'HGGSP · S’informer',
  chap: 'S’informer : un regard critique sur les sources et modes de communication',
  pbCours: 'Comment évoluent les médias à travers l’histoire et quel est leur impact géopolitique ?',
  exHint: 'Un fait précis : une date, un acteur, un média, un chiffre.',
  plan: [
    'I. Les grandes révolutions techniques de l’information',
    'A. L’information imprimée : de l’imprimerie à la presse à grand tirage',
    'B. L’information par le son et l’image : radio et télévision au XXe siècle',
    'C. L’information mondialisée et individualisée : Internet',
    'II. Liberté ou contrôle de l’information : un débat politique fondamental',
    'A. L’information dépendante de l’opinion ? L’affaire Dreyfus et la presse',
    'B. Information et propagande en temps de guerre : les médias et la guerre du Vietnam'
  ],

  /* ---------------- L’essentiel du cours (un écran = une idée) ---------------- */
  course: [
    { t: 'De quoi parle ce chapitre ?', b: `Le mot **information** vient du latin *informare* : « donner une forme, un sens ».

L’information, ce sont les **données** qui nous renseignent sur un fait ou sur une personne.

Pour circuler, l’information a besoin de **médias** : la presse, la radio, la télévision, Internet. Un média est une technique qui permet de communiquer.`, terms: [
      ['Information', 'Ce qui nous renseigne sur un fait, une personne, un événement.'],
      ['Média', 'Une technique qui transmet l’information : journal, radio, télévision, Internet.'],
      ['Médias de masse', 'Des médias qui touchent un très grand public en même temps.']
    ], key: 'Problématique du cours : comment évoluent les médias à travers l’histoire, et quel est leur impact géopolitique ?' },

    { t: 'Les premiers médias', b: `- Vers **-40 000** : dessins et symboles dans les grottes. Ce sont les premiers médias.
- Vers **-3000** : l’écriture naît dans le Croissant fertile (pictogrammes, cunéiforme, hiéroglyphes).
- Dans l’Antiquité, la **voix** reste le média principal. À Rome, les *acta diurna* affichent les nouvelles.
- Au Moyen Âge, les **moines copistes** recopient les livres à la main. Les manuscrits sont **rares et chers**.`, key: 'Avant l’imprimerie, l’information circule surtout à l’oral, et les livres sont rares.' },

    { t: 'L’imprimerie de Gutenberg (vers 1450)', b: `Vers **1450**, **Gutenberg** invente l’imprimerie à **caractères mobiles** : des petites lettres en métal que l’on assemble pour imprimer une page.

- Premier grand livre imprimé : la **Bible à 42 lignes** (B42).
- Les livres se multiplient : environ **15 à 20 millions** en 1500, environ **1 milliard** en 1800.
- De nouvelles formes apparaissent : le livre de petit format de **Manuce** (1501), la **Gazette** de **Renaudot** (1631), les livres de colportage.`, key: 'L’imprimerie a un rôle géopolitique : elle diffuse les idées pendant les guerres de religion et au siècle des Lumières. Mais au XVIIIe siècle, seulement 30 % des Français savent lire.' },

    { t: 'L’âge d’or de la presse (XIXe siècle)', b: `Au XIXe siècle, la presse devient un **média de masse**. Trois causes :

1. **L’alphabétisation** : en France, la part des personnes qui savent lire passe d’environ 30 % à 80 % entre 1800 et 1900.
2. **La liberté de la presse** : la **loi du 29 juillet 1881** supprime la censure en France.
3. **Les innovations techniques** : la rotative (milieu du XIXe siècle), la linotype (1886), le chemin de fer qui transporte les journaux.

Résultat : plus de **9 millions** d’exemplaires de journaux par jour en France au début du XXe siècle. La presse se diversifie : publicité (1836), presse sportive, presse féminine.`, key: 'Lire le journal devient un geste quotidien pour des millions de personnes.' },

    { t: 'La radio : un média de masse et de propagande', b: `- Ancêtres : le **télégraphe** (Morse, 1844) et la **TSF** de **Marconi** (1895). La TSF sert lors du naufrage du **Titanic** (1912).
- **1906** : Fessenden diffuse la première émission de radio (24 décembre).
- **1920** : émissions régulières aux États-Unis ; **1921** en France, depuis la tour Eiffel ; **1922** : création de la **BBC**.

Entre les deux guerres, les **régimes totalitaires** contrôlent la radio. En Allemagne nazie, **Goebbels**, ministre de la Propagande, contrôle tous les médias. L’Italie fasciste crée Radio Bari.

Pendant la Seconde Guerre mondiale, c’est la **guerre des ondes** : Radio Paris (collaboration) contre Radio Londres (Résistance). Le **18 juin 1940**, de Gaulle lance son appel sur la BBC.`, key: 'La radio touche des millions de personnes en même temps : c’est une arme politique.' },

    { t: 'La télévision : l’image entre dans les foyers', b: `- **1926** : l’Écossais **Baird** présente la télévision. **1931** : première démonstration en France.
- **1936** : les nazis télédiffusent les Jeux olympiques de Berlin. **1937** : la BBC filme le couronnement de George VI.
- En **1950**, il n’y a qu’environ **3 800 téléviseurs** en France. La télévision devient un média de masse dans les **années 1960** : les familles se réunissent devant le journal de 20 h.

La télévision crée une **culture de masse**. Le sociologue **McLuhan** parle de **« village global »** : le monde entier voit les mêmes images. Exemple : en **1969**, la Terre entière regarde le premier pas sur la Lune.`, key: 'Aujourd’hui, la télévision recule face aux réseaux sociaux : ses téléspectateurs sont de plus en plus âgés.' },

    { t: 'Internet : une information mondiale et individuelle', b: `- **1969** : **ARPANET**, l’ancêtre d’Internet, relie une agence militaire américaine (ARPA) et quatre universités.
- **1971** : **Tomlinson** envoie le premier courriel et utilise le **@**.
- **1989** : **Tim Berners-Lee**, un Britannique du CERN, invente le **World Wide Web**.
- Années **1990** : premier navigateur (Mosaic, 1993), Yahoo (1994), eBay (1995). En 1992, seuls 10 % des foyers français ont un ordinateur.
- Années **2000** : explosion d’Internet. Aujourd’hui, environ **5,5 milliards** de personnes utilisent Internet.`, key: 'On passe d’une transmission verticale (un média parle à tous) à une transmission horizontale : chacun produit et reçoit l’information.' },

    { t: 'Les dangers de l’information en ligne', b: `Internet pose aussi des problèmes : excès d’informations et mauvais usages.

Internet n’a pas inventé les **théories du complot**, mais il les aide à se diffuser (Terre plate, Illuminati…).`, terms: [
      ['Mésinformation', 'Une fausse information donnée **de bonne foi** : la personne croit qu’elle est vraie.'],
      ['Désinformation', 'Une fausse information donnée **exprès**, pour tromper.'],
      ['Théorie du complot', 'Une explication qui affirme, sans preuve, qu’un groupe secret organise les événements.']
    ], key: 'Mésinformation = erreur. Désinformation = mensonge volontaire.' },

    { t: 'L’affaire Dreyfus (1) : les faits', b: `L’**opinion publique**, ce sont les idées et les valeurs partagées par une société. On la mesure par des **sondages**.

Le contexte de l’affaire :
- un **antisémitisme** très fort ;
- une presse **libre depuis 1881**, avec de très gros tirages ;
- un **sentiment anti-allemand** depuis la défaite de 1871.

En **1894**, le capitaine **Alfred Dreyfus**, officier juif, est accusé d’espionnage au profit de l’Allemagne. Il est condamné, dégradé et envoyé au **bagne en Guyane** (île du Diable).`, key: 'L’affaire Dreyfus est la première grande affaire où la presse joue un rôle central.' },

    { t: 'L’affaire Dreyfus (2) : la presse et l’opinion', b: `- La presse est d’abord presque entièrement **antidreyfusarde**, comme *La Libre Parole*, journal antisémite.
- Le **colonel Picquart** découvre que Dreyfus est innocent.
- Le **13 janvier 1898**, **Émile Zola** publie **« J’accuse… ! »** dans le journal ***L’Aurore***. Il accuse des militaires d’avoir condamné un innocent.
- La France se divise entre **dreyfusards** et **antidreyfusards**.
- **1899** : second procès à Rennes, Dreyfus est à nouveau condamné, puis gracié. **1906** : il est **réhabilité**.`, key: 'La presse suit souvent l’opinion de ses lecteurs. Mais un article peut aussi faire bouger l’opinion : c’est le rôle de « J’accuse… ! ».' },

    { t: 'La guerre du Vietnam (1) : une guerre télévisée', b: `La guerre du Vietnam (1955-1975) a lieu pendant la **guerre froide**. En 1954, le pays est coupé en deux : un Nord **communiste** et un Sud **capitaliste**. Les **États-Unis** interviennent à partir de **1964** pour **endiguer** le communisme.

- C’est la **première guerre filmée tous les jours** : chaque soir, les télévisions américaines donnent le **« body count »**, le nombre d’ennemis tués. Cela donne l’illusion d’une victoire rapide.
- En 1968, plus de **600 journalistes** sont sur place, mais seulement 80 près des combats.
- L’armée américaine crée le **JUSPAO**, un service d’information qui organise la **propagande** de guerre.`, key: 'Au début, les médias américains relaient surtout la version officielle.' },

    { t: 'La guerre du Vietnam (2) : le retournement', b: `- Peu à peu, la réalité du terrain (morts, blessés) apparaît. On parle de **« credibility gap »** : un fossé entre le discours officiel et la réalité.
- **L’offensive du Têt** (janvier **1968**) est un tournant médiatique.
- L’opinion américaine change : environ 6 Américains sur 10 soutiennent la guerre en 1965, moins de 3 sur 10 au début des années 1970.
- **1969** : 500 000 manifestants pour la paix à **Washington**.
- **1972** : la photo de **Nick Ut** montre une fillette brûlée au napalm. Elle reçoit le prix **Pulitzer** en 1973.`, key: 'Longtemps, on a pensé que les médias avaient retourné l’opinion. Des historiens montrent plutôt l’inverse : c’est l’opinion qui a poussé les médias à changer de ton.' },

    { t: 'Ce qu’il faut retenir', b: `1. **Chaque révolution technique** (imprimerie, presse, radio, télévision, Internet) **élargit** l’accès à l’information et le nombre de personnes touchées.
2. **L’information est un enjeu de pouvoir** : les États la contrôlent (censure, propagande) ou la protègent (liberté de la presse).
3. **Médias et opinion publique s’influencent dans les deux sens** (affaire Dreyfus, guerre du Vietnam).
4. **Plus d’information ne veut pas dire meilleure information** : il faut un regard critique sur les sources.` }
  ],

  frise: [
    ['vers -40 000', 'Dessins dans les grottes : les premiers médias'],
    ['vers -3000', 'Naissance de l’écriture'],
    ['vers 1450', 'Gutenberg : l’imprimerie à caractères mobiles'],
    ['1631', 'La Gazette de Renaudot'],
    ['1844', 'Premier télégramme (Morse)'],
    ['29 juillet 1881', 'Loi sur la liberté de la presse'],
    ['1894-1906', 'L’affaire Dreyfus'],
    ['13 janvier 1898', '« J’accuse… ! » de Zola dans L’Aurore'],
    ['1906', 'Première émission de radio (Fessenden)'],
    ['1922', 'Création de la BBC'],
    ['1926', 'Baird présente la télévision'],
    ['18 juin 1940', 'Appel du général de Gaulle sur la BBC'],
    ['1964-1973', 'Engagement américain au Vietnam'],
    ['1968', 'Offensive du Têt : tournant médiatique'],
    ['1969', 'ARPANET ; premier pas sur la Lune en direct'],
    ['1971', 'Premier courriel (Tomlinson)'],
    ['1972', 'Photo de Nick Ut (prix Pulitzer 1973)'],
    ['1989', 'Tim Berners-Lee invente le Web'],
    ['aujourd’hui', 'Environ 5,5 milliards d’internautes']
  ],

  /* ---------------- Glossaire ---------------- */
  cats: { base: 'Notions de base', tech: 'Techniques et médias', pol: 'Pouvoir et opinion', net: 'Internet et esprit critique' },
  gloss: [
    { w: 'Information', cat: 'base', def: 'Ce qui nous renseigne sur un fait, une personne ou un événement.', ex: 'Le résultat d’une élection, annoncé à la radio, est une information.' },
    { w: 'Média', cat: 'base', def: 'Une technique qui transmet l’information à un public.', ex: 'Le journal, la radio, la télévision et Internet sont des médias.' },
    { w: 'Médias de masse', cat: 'base', def: 'Des médias qui touchent un très grand nombre de personnes en même temps.', ex: 'Dans les années 1960, la télévision devient un média de masse en France.' },
    { w: 'Géopolitique', cat: 'base', def: 'L’étude des rivalités de pouvoir entre des États ou des groupes sur des territoires.', ex: 'La guerre des ondes entre Radio Londres et Radio Paris a un enjeu géopolitique.' },
    { w: 'Source', cat: 'base', def: 'L’origine d’une information : qui la donne, où, quand.', ex: 'Avant de partager une vidéo, je vérifie sa source.', comp: true },
    { w: 'Imprimerie à caractères mobiles', cat: 'tech', def: 'Une technique d’impression avec des petites lettres en métal que l’on assemble et que l’on réutilise.', ex: 'Gutenberg la met au point vers 1450 ; il imprime la Bible à 42 lignes.' },
    { w: 'Manuscrit', cat: 'tech', def: 'Un livre écrit à la main.', ex: 'Au Moyen Âge, les moines copistes recopient des manuscrits, rares et chers.' },
    { w: 'Gazette', cat: 'tech', def: 'Un des premiers journaux, qui donne des nouvelles régulièrement.', ex: 'La Gazette de Théophraste Renaudot paraît en 1631.' },
    { w: 'Presse à grand tirage', cat: 'tech', def: 'Des journaux imprimés à des centaines de milliers ou des millions d’exemplaires.', ex: 'Au début du XXe siècle, la presse française dépasse 9 millions d’exemplaires par jour.' },
    { w: 'Alphabétisation', cat: 'tech', def: 'Le fait d’apprendre à lire et à écrire à une population.', ex: 'En France, la part des personnes qui savent lire passe d’environ 30 % à 80 % au XIXe siècle.' },
    { w: 'Rotative', cat: 'tech', def: 'Une machine qui imprime très vite, grâce à des cylindres qui tournent.', ex: 'La rotative permet d’imprimer des millions de journaux chaque jour.' },
    { w: 'TSF', cat: 'tech', def: 'La « télégraphie sans fil » : transmettre des messages par ondes radio, sans câble.', ex: 'La TSF de Marconi (1895) sert lors du naufrage du Titanic en 1912.' },
    { w: 'Culture de masse', cat: 'tech', def: 'Une culture partagée par des millions de personnes grâce aux médias.', ex: 'Le journal de 20 h réunit chaque soir des millions de familles.' },
    { w: 'Village global', cat: 'tech', def: 'Une expression de McLuhan : grâce aux médias, le monde entier voit les mêmes images, comme un seul village.', ex: 'En 1969, la Terre entière regarde le premier pas sur la Lune.' },
    { w: 'Liberté de la presse', cat: 'pol', def: 'Le droit de publier des informations et des opinions sans autorisation de l’État.', ex: 'En France, la loi du 29 juillet 1881 garantit la liberté de la presse.' },
    { w: 'Censure', cat: 'pol', def: 'Le contrôle de l’information par le pouvoir, qui interdit ou supprime ce qui le dérange.', ex: 'La loi de 1881 supprime la censure en France.' },
    { w: 'Propagande', cat: 'pol', def: 'Une information orientée, diffusée par un pouvoir pour convaincre et contrôler l’opinion.', ex: 'Goebbels, ministre de la Propagande, contrôle tous les médias de l’Allemagne nazie.' },
    { w: 'Guerre des ondes', cat: 'pol', def: 'L’affrontement de radios ennemies pendant une guerre.', ex: 'Pendant la Seconde Guerre mondiale, Radio Londres s’oppose à Radio Paris.' },
    { w: 'Opinion publique', cat: 'pol', def: 'Les idées et les valeurs partagées par une grande partie de la société.', ex: 'Pendant l’affaire Dreyfus, l’opinion publique française se divise.' },
    { w: 'Sondage', cat: 'pol', def: 'Une enquête auprès d’un échantillon de personnes pour mesurer l’opinion publique.', ex: 'Les sondages montrent que les Américains soutiennent de moins en moins la guerre du Vietnam.' },
    { w: 'Antisémitisme', cat: 'pol', def: 'La haine et le rejet des Juifs.', ex: 'Le journal La Libre Parole attaque Dreyfus parce qu’il est juif.' },

    { w: 'Intellectuel', cat: 'pol', def: 'Un écrivain, un savant ou un artiste qui s’engage publiquement dans un débat politique.', ex: 'Avec « J’accuse… ! », Zola agit en intellectuel engagé.' },

    { w: 'Credibility gap', cat: 'pol', def: 'Le « fossé de crédibilité » : l’écart entre ce que dit le gouvernement et la réalité.', ex: 'Après l’offensive du Têt (1968), les Américains ne croient plus le discours officiel.' },
    { w: 'Quatrième pouvoir', cat: 'pol', def: 'Une expression qui désigne les médias, capables de surveiller les trois pouvoirs (exécutif, législatif, judiciaire).', ex: 'Avec « J’accuse… ! », la presse joue un rôle de quatrième pouvoir.', comp: true },

  quiz: [
    { t: 'mcq', p: 'Qui invente l’imprimerie à caractères mobiles, vers 1450 ?', o: ['Renaudot', 'Gutenberg', 'Manuce', 'Marconi'], a: 1, s: 'Gutenberg, vers 1450.', d: 'Renaudot crée la Gazette (1631), Manuce le livre de petit format (1501), Marconi la TSF (1895).' },
    { t: 'mcq', p: 'Quelle loi garantit la liberté de la presse en France ?', o: ['La loi de 1789', 'La loi du 29 juillet 1881', 'La loi de 1906', 'La loi de 1945'], a: 1, s: 'La loi du 29 juillet 1881.', d: 'Elle supprime la censure. Elle est une des causes de l’âge d’or de la presse.' },
    { t: 'mcq', p: 'Laquelle n’est PAS une cause de l’âge d’or de la presse au XIXe siècle ?', o: ['L’alphabétisation', 'La liberté de la presse', 'La rotative', 'L’invention de la télévision'], a: 3, s: 'La télévision arrive au XXe siècle.', d: 'Les trois causes du cours : alphabétisation, liberté de la presse (1881), innovations techniques (rotative, linotype).' },
    { t: 'mcq', p: 'Le 18 juin 1940, de Gaulle lance son appel…', o: ['à la télévision', 'sur la BBC, à la radio', 'dans le journal L’Aurore', 'sur Radio Paris'], a: 1, s: 'Sur la BBC, à Londres.', d: 'Radio Paris est la radio de la collaboration. Radio Londres est la voix de la Résistance : c’est la guerre des ondes.' },
    { t: 'mcq', p: 'Qui contrôle tous les médias de l’Allemagne nazie ?', o: ['Goebbels', 'McLuhan', 'Picquart', 'Baird'], a: 0, s: 'Joseph Goebbels, ministre de la Propagande.', d: 'Les régimes totalitaires utilisent la radio, puis la télévision, pour la propagande.' },
    { t: 'mcq', p: 'Que veut dire « village global » (McLuhan) ?', o: ['Les villages se vident', 'Grâce aux médias, le monde entier voit les mêmes images', 'Internet relie les villages', 'Chaque pays a sa télévision'], a: 1, s: 'Le monde entier partage les mêmes images, comme un seul village.', d: 'Exemple : le premier pas sur la Lune, en 1969, vu par la Terre entière.' },
    { t: 'mcq', p: 'Qui invente le World Wide Web en 1989 ?', o: ['Tomlinson', 'Tim Berners-Lee', 'Gutenberg', 'Fessenden'], a: 1, s: 'Tim Berners-Lee, au CERN.', d: 'Tomlinson envoie le premier courriel (1971). Fessenden diffuse la première émission de radio (1906).' },
    { t: 'mcq', p: 'Je partage une fausse information en croyant qu’elle est vraie. C’est…', o: ['de la désinformation', 'de la mésinformation', 'de la propagande', 'de la censure'], a: 1, s: 'De la mésinformation : une erreur de bonne foi.', d: 'La désinformation est volontaire : on ment exprès pour tromper.' },
    { t: 'mcq', p: 'Avec Internet, la transmission de l’information devient…', o: ['verticale', 'horizontale', 'interdite', 'uniquement écrite'], a: 1, s: 'Horizontale : chacun produit et reçoit l’information.', d: 'Avant, la transmission était verticale : un média parlait à un public qui ne répondait pas.' },
    { t: 'mcq', p: 'Dans quel journal Zola publie-t-il « J’accuse… ! » en 1898 ?', o: ['Le Figaro', 'La Libre Parole', 'L’Aurore', 'La Gazette'], a: 2, s: 'Dans L’Aurore, le 13 janvier 1898.', d: 'La Libre Parole est un journal antisémite et antidreyfusard.' },
    { t: 'mcq', p: 'Au début de l’affaire Dreyfus, la presse est surtout…', o: ['dreyfusarde', 'antidreyfusarde', 'neutre', 'interdite'], a: 1, s: 'Antidreyfusarde.', d: 'Le contexte est marqué par l’antisémitisme et le sentiment anti-allemand. « J’accuse… ! » est un tournant.' },
    { t: 'mcq', p: 'Qu’est-ce que le « body count » pendant la guerre du Vietnam ?', o: ['Le nombre de soldats américains', 'Le nombre d’ennemis tués annoncé chaque soir', 'Le nombre de journalistes', 'Un sondage'], a: 1, s: 'Le nombre d’ennemis tués, annoncé chaque soir à la télévision.', d: 'Il donne l’illusion d’une victoire rapide.' },
    { t: 'mcq', p: 'Quel événement de 1968 est un tournant médiatique de la guerre du Vietnam ?', o: ['L’offensive du Têt', 'Les accords de Genève', 'Le premier pas sur la Lune', 'La photo de Nick Ut'], a: 0, s: 'L’offensive du Têt, en janvier 1968.', d: 'Elle montre que la victoire n’est pas proche : c’est le « credibility gap ».' },
    { t: 'mcq', p: 'Selon des recherches récentes, pendant la guerre du Vietnam…', o: ['les médias ont seuls retourné l’opinion', 'l’opinion a aussi poussé les médias à changer de ton', 'l’opinion n’a jamais changé', 'la télévision était interdite'], a: 1, s: 'L’opinion a aussi poussé les médias à changer.', d: 'Médias et opinion s’influencent dans les deux sens. C’est une idée utile pour une dissertation.' }

  /* ---------------- Restituer ---------------- */
  restit: {
    worked: { t: 'Répondre à une question de cours', task: 'Pourquoi la presse connaît-elle un âge d’or au XIXe siècle ?', steps: [
      { t: 'Repérer le mot qui interroge', q: 'Quel mot de la question indique ce que je dois donner ?', a: '« **Pourquoi** » : je dois donner des **causes**. Le sujet est la presse, au XIXe siècle.', w: 'Le mot interrogatif dit la forme de la réponse : « Quand » demande une date, « Qui » un acteur, « Pourquoi » des causes, « Comment » des étapes ou des moyens.' },
      { t: 'Chercher dans le cours', q: 'Combien de causes le cours donne-t-il ?', a: 'Trois causes : **l’alphabétisation**, **la liberté de la presse** (loi de 1881), **les innovations techniques** (rotative, linotype).', w: 'Je cherche le bon passage du cours : I. A., « l’âge d’or de la presse ». Le cours donne souvent des listes : je retiens le nombre d’éléments.' },
      { t: 'Ajouter une précision', q: 'Quel chiffre ou quelle date prouve chaque cause ?', a: 'Alphabétisation : de 30 % à 80 % entre 1800 et 1900. Liberté : loi du 29 juillet 1881. Technique : la linotype, 1886. Résultat : plus de 9 millions d’exemplaires par jour au début du XXe siècle.', w: 'Une réponse précise est une réponse avec des dates, des chiffres, des noms. C’est ce qui montre que je connais mon cours.' },
      { t: 'Rédiger la réponse', q: 'Comment commencer ma phrase ?', a: 'Au XIXe siècle, la presse connaît un âge d’or **pour trois raisons**. D’abord, les Français savent de plus en plus lire : de 30 % à 80 % entre 1800 et 1900. Ensuite, la loi du 29 juillet 1881 garantit la liberté de la presse. Enfin, des machines comme la rotative et la linotype (1886) impriment plus vite. Ainsi, plus de 9 millions de journaux sont vendus chaque jour au début du XXe siècle.', w: 'Je reprends les mots de la question dans ma première phrase. J’annonce le nombre de causes. J’utilise des connecteurs : d’abord, ensuite, enfin, ainsi.' }
    ] },
    items: [
      { t: 'write', kind: 'restit', p: 'Qu’est-ce qu’un média de masse ? Donne un exemple daté.', task: 'Question de cours (définition)', keys: [['définition : touche un très grand public', ['grand public', 'grand nombre', 'millions', 'très large', 'beaucoup de personnes', 'masse']], ['un média cité', ['presse', 'journal', 'radio', 'télévision', 'internet']], ['une date', ['18', '19', '20']]], model: 'Un média de masse est un média qui touche un très grand nombre de personnes en même temps. Par exemple, la télévision devient un média de masse en France dans les années 1960 : chaque soir, des millions de familles regardent le journal de 20 h.' },
      { t: 'write', kind: 'restit', p: 'Quelle invention permet au livre imprimé de se diffuser ? Qui l’invente, et quand ?', task: 'Question de cours (fait)', keys: [['l’imprimerie à caractères mobiles', ['imprimerie', 'caractères mobiles']], ['Gutenberg', ['gutenberg']], ['vers 1450', ['1450', 'xve', '15e']], ['une conséquence chiffrée', ['million', 'milliard', 'bible', 'b42']]], model: 'C’est l’imprimerie à caractères mobiles, inventée par Gutenberg vers 1450. Le premier grand livre imprimé est la Bible à 42 lignes. Grâce à l’imprimerie, on passe de 15 à 20 millions de livres en 1500 à environ 1 milliard en 1800.' },
      { t: 'write', kind: 'restit', p: 'Quelle est la différence entre mésinformation et désinformation ? Donne un exemple pour chacune.', task: 'Question de cours (distinguer deux notions)', keys: [['mésinformation = de bonne foi / par erreur', ['bonne foi', 'erreur', 'croit', 'sans le vouloir']], ['désinformation = exprès / pour tromper', ['expres', 'volontaire', 'tromper', 'deliber', 'mentir']], ['deux exemples', ['exemple', 'par exemple']]], model: 'La mésinformation est une fausse information partagée de bonne foi : la personne croit qu’elle est vraie. Par exemple, un élève partage une fausse nouvelle sans vérifier. La désinformation est une fausse information diffusée exprès, pour tromper. Par exemple, un État publie de fausses nouvelles pour influencer une élection étrangère.' },
      { t: 'write', kind: 'restit', p: 'Qu’est-ce que « J’accuse… ! » ? Précise l’auteur, la date, le journal et le contenu.', task: 'Question de cours (document clé)', keys: [['Zola', ['zola']], ['13 janvier 1898', ['1898']], ['L’Aurore', ['aurore']], ['contenu : accuse des militaires / Dreyfus innocent', ['innocent', 'accuse', 'militaire', 'etat-major', 'armee']]], model: '« J’accuse… ! » est une lettre ouverte d’Émile Zola, publiée dans le journal L’Aurore le 13 janvier 1898. Zola y défend Dreyfus et accuse des militaires d’avoir fait condamner un innocent. Ce texte est un tournant de l’affaire Dreyfus : l’opinion commence à se diviser entre dreyfusards et antidreyfusards.' },
      { t: 'write', kind: 'restit', p: 'Pourquoi dit-on que la guerre du Vietnam est la première guerre télévisée ?', task: 'Question de cours (cause)', keys: [['images chaque soir à la télévision', ['chaque soir', 'tous les jours', 'quotidien', 'journal televise', 'television']], ['body count', ['body count']], ['nombre de journalistes', ['600', 'journalistes', 'reporters']], ['une date', ['1964', '1965', '1968', '1972']]], model: 'La guerre du Vietnam est la première guerre filmée et montrée tous les jours à la télévision. Chaque soir, les journaux télévisés américains donnent le « body count », le nombre d’ennemis tués. En 1968, plus de 600 journalistes sont sur place. Les Américains voient donc la guerre chez eux, dans leur salon.' },
      { t: 'write', kind: 'restit', p: 'Quel rôle la radio joue-t-elle pendant la Seconde Guerre mondiale ?', task: 'Question de cours (rôle)', keys: [['guerre des ondes', ['guerre des ondes']], ['Radio Londres / BBC', ['londres', 'bbc']], ['Radio Paris', ['radio paris']], ['18 juin 1940', ['1940', '18 juin']]], model: 'Pendant la Seconde Guerre mondiale, la radio est une arme. C’est la guerre des ondes : Radio Paris, contrôlée par l’occupant, fait la propagande de la collaboration, tandis que Radio Londres, sur la BBC, donne la parole à la France libre. Le 18 juin 1940, le général de Gaulle y lance son appel à continuer le combat.' },
      { t: 'write', kind: 'restit', p: 'Comment Internet change-t-il la façon de produire et de recevoir l’information ?', task: 'Question de cours (transformation)', keys: [['transmission horizontale', ['horizontal']], ['chacun produit et reçoit', ['producteur', 'chacun', 'tout le monde', 'publier']], ['une date d’Internet', ['1969', '1971', '1989', '1993']], ['un risque : mésinformation, désinformation', ['mesinformation', 'desinformation', 'fausse', 'complot']]], model: 'Avec Internet, l’information n’est plus seulement verticale : elle devient horizontale. Chacun peut à la fois produire et recevoir des informations. Depuis l’invention du Web par Tim Berners-Lee en 1989, environ 5,5 milliards de personnes utilisent Internet. Mais ce changement favorise aussi la mésinformation, la désinformation et les théories du complot.' }
    ]
  },

  /* ---------------- Argumenter ---------------- */
  argu: {
    worked: { t: 'Construire un paragraphe argumenté', task: 'Montrez que la radio a été un outil de propagande au XXe siècle.', steps: [
      { t: 'Comprendre la consigne', q: 'Que me demande « Montrez que » ?', a: '« Montrez que » : je dois **prouver** une idée déjà donnée. L’idée à prouver : la radio a servi à la propagande. Le cadre : le XXe siècle.', w: 'Avec « Montrez que », je ne discute pas : je démontre. Je dois trouver des preuves dans le cours.' },
      { t: 'Écrire l’argument', role: 'arg', q: 'Quelle phrase générale répond à la consigne ?', a: 'Au XXe siècle, les régimes totalitaires et les États en guerre utilisent la radio pour contrôler les esprits.', w: 'L’argument est une idée générale, sans date. Il répond directement à la consigne.' },
      { t: 'Expliquer', role: 'expl', q: 'Pourquoi la radio est-elle si utile à la propagande ?', a: 'En effet, la radio touche des millions de personnes en même temps, chez elles, même celles qui ne lisent pas le journal. Un pouvoir qui contrôle la radio peut donc imposer un seul message à tout un peuple.', w: 'L’explication dit **pourquoi** l’argument est vrai. Elle commence souvent par « En effet » ou « car ».' },
      { t: 'Donner un exemple précis', role: 'ex', q: 'Quel fait daté du cours prouve l’argument ?', a: 'Par exemple, dans l’Allemagne nazie, Joseph Goebbels, ministre de la Propagande, contrôle toutes les radios. Pendant la Seconde Guerre mondiale, Radio Paris diffuse la propagande de la collaboration.', w: 'L’exemple est un fait précis : un nom, une date, un lieu. Sans exemple, l’argument n’est pas prouvé.' },
      { t: 'Faire le lien avec la consigne', role: 'lien', q: 'Comment montrer que j’ai répondu ?', a: 'Ainsi, la radio est bien devenue un outil de propagande, même si elle sert aussi à résister : c’est sur la BBC que de Gaulle lance son appel du 18 juin 1940.', w: 'La phrase de lien reprend les mots de la consigne. Elle peut ajouter une nuance, ce qui montre une réflexion.' }
    ] },
    items: [
      { t: 'write', kind: 'argu', p: 'Montrez que l’imprimerie a eu un rôle géopolitique.', task: 'Paragraphe argumenté', helps: ['Argument : l’imprimerie diffuse plus vite les idées religieuses et politiques.', 'Explication : un livre imprimé peut être copié en milliers d’exemplaires et circuler loin.', 'Exemples : guerres de religion ; idées des Lumières ; 1 milliard de livres en 1800.', 'Nuance : seulement 30 % des Français savent lire au XVIIIe siècle.'], model: [['arg', 'À partir de 1450, l’imprimerie change les rapports de pouvoir, car elle diffuse les idées beaucoup plus vite.'], ['expl', 'En effet, avec les caractères mobiles de Gutenberg, un texte peut être reproduit en milliers d’exemplaires et circuler dans toute l’Europe, alors que les manuscrits étaient rares et chers.'], ['ex', 'Par exemple, les textes imprimés alimentent les guerres de religion au XVIe siècle, puis diffusent les idées des Lumières au XVIIIe siècle. On passe de 15 à 20 millions de livres en 1500 à environ 1 milliard en 1800.'], ['lien', 'L’imprimerie a donc un rôle géopolitique, même s’il faut le relativiser : au XVIIIe siècle, seuls 30 % des Français savent lire.']] },
      { t: 'write', kind: 'argu', p: 'Pendant l’affaire Dreyfus, la presse a-t-elle influencé l’opinion, ou l’a-t-elle suivie ?', task: 'Paragraphe argumenté (avec nuance)', helps: ['Idée 1 : la presse suit d’abord l’opinion de ses lecteurs (antisémitisme, sentiment anti-allemand).', 'Exemple : presse massivement antidreyfusarde, La Libre Parole.', 'Idée 2 : un article peut faire bouger l’opinion.', 'Exemple : « J’accuse… ! », Zola, L’Aurore, 13 janvier 1898.'], model: [['arg', 'Pendant l’affaire Dreyfus, la presse suit d’abord l’opinion de ses lecteurs, puis elle contribue à la faire changer.'], ['expl', 'En effet, un journal vit de ses lecteurs : il a intérêt à dire ce qu’ils pensent déjà. Or, dans les années 1890, la société française est marquée par l’antisémitisme et le sentiment anti-allemand.'], ['ex', 'Par exemple, la presse est d’abord presque entièrement antidreyfusarde, comme La Libre Parole. Mais le 13 janvier 1898, Émile Zola publie « J’accuse… ! » dans L’Aurore : il accuse des militaires d’avoir condamné un innocent, et l’opinion se divise.'], ['lien', 'Ainsi, la presse suit l’opinion, mais elle peut aussi la transformer, quand des intellectuels s’engagent.']] },
      { t: 'write', kind: 'argu', p: 'Pourquoi l’opinion américaine se retourne-t-elle contre la guerre du Vietnam ?', task: 'Paragraphe argumenté (causes)', helps: ['Argument : la réalité de la guerre apparaît malgré la propagande.', 'Explication : « credibility gap », écart entre discours officiel et réalité.', 'Exemples : offensive du Têt (1968), manifestation de Washington (1969), photo de Nick Ut (1972).', 'Nuance : l’opinion pousse aussi les médias à changer.'], model: [['arg', 'L’opinion américaine se retourne contre la guerre du Vietnam parce que la réalité du conflit finit par apparaître, malgré la propagande officielle.'], ['expl', 'En effet, le gouvernement annonce une victoire proche, mais les morts et les blessés se multiplient : c’est le « credibility gap », le fossé entre le discours officiel et la réalité.'], ['ex', 'Par exemple, l’offensive du Têt, en janvier 1968, montre que l’ennemi reste puissant. En 1969, 500 000 personnes manifestent pour la paix à Washington, et la photo de Nick Ut (1972) choque le monde entier.'], ['lien', 'Ainsi, l’opinion change, et elle pousse à son tour les médias à devenir plus critiques.']] },
      { t: 'write', kind: 'argu', p: 'Internet est-il un progrès pour l’information ? Donne un argument pour et un argument contre.', task: 'Deux paragraphes argumentés (pour / contre)', helps: ['Pour : accès mondial et rapide ; chacun peut publier (transmission horizontale) ; 5,5 milliards d’internautes.', 'Contre : mésinformation, désinformation, théories du complot.', 'Connecteur pour passer de l’un à l’autre : « Cependant ».'], model: [['arg', 'D’un côté, Internet est un progrès, car il rend l’information accessible à presque tout le monde.'], ['expl', 'En effet, la transmission devient horizontale : chacun peut chercher, produire et partager des informations, partout et tout de suite.'], ['ex', 'Par exemple, depuis l’invention du Web par Tim Berners-Lee en 1989, environ 5,5 milliards de personnes utilisent Internet.'], ['arg', 'Cependant, Internet favorise aussi les fausses informations.'], ['expl', 'En effet, tout le monde peut publier sans vérification, et les fausses nouvelles circulent très vite.'], ['ex', 'Par exemple, la désinformation, la mésinformation et les théories du complot, comme la Terre plate, se diffusent sur les réseaux.'], ['lien', 'Internet est donc un progrès, à condition de garder un regard critique sur les sources.']] }
    ]
  },

  plans: {
    c: { type: 'Plan chronologique (une partie par grande révolution technique)', pb: 'En quoi chaque grande innovation technique, depuis le XIXe siècle, a-t-elle fait entrer davantage l’information dans la vie de tous les jours ?', rep: 'Chaque innovation élargit le public, accélère l’information et la rend plus quotidienne : la presse au XIXe siècle, la radio et la télévision au XXe, Internet aujourd’hui.', parts: [
      ['Au XIXe siècle, la presse à grand tirage fait de l’information un rendez-vous quotidien', ['Des innovations techniques : rotative, linotype (1886), chemin de fer', 'Un public qui sait lire (30 % → 80 %) et une presse libre (loi de 1881) : plus de 9 millions d’exemplaires par jour']],
      ['Au XXe siècle, la radio et la télévision font entrer l’information dans les foyers', ['La radio informe en direct des millions de personnes (BBC 1922, appel du 18 juin 1940)', 'La télévision crée une culture de masse et un « village global » (journal de 20 h, Lune 1969)']],
      ['Depuis la fin du XXe siècle, Internet rend l’information permanente, mondiale et individuelle', ['Une information mondiale et continue (Web 1989, 5,5 milliards d’internautes)', 'Une information horizontale, mais exposée à la désinformation']]
    ] },
    b: { type: 'Plan dialectique (oui / mais / dépassement)', pb: 'Les médias ont-ils permis à tous d’accéder librement à l’information, de la produire et de la discuter ?', rep: 'Les médias ont élargi l’accès à l’information, mais cet accès a souvent été contrôlé ; c’est la place grandissante de l’opinion et du public qui démocratise vraiment l’information, non sans risques.', parts: [
      ['Les médias élargissent l’accès à l’information', ['La presse à grand tirage touche un public alphabétisé et libre (loi de 1881)', 'La radio et la télévision deviennent des médias de masse']],
      ['Mais cette information reste souvent contrôlée par les pouvoirs', ['La propagande des régimes totalitaires (Goebbels, guerre des ondes)', 'La propagande en démocratie en temps de guerre (JUSPAO, body count)']],
      ['Le public devient acteur de l’information, avec de nouveaux risques', ['L’opinion pèse sur les médias (Dreyfus, Vietnam)', 'Internet : chacun produit l’information, mais mésinformation et désinformation progressent']]
    ] },
    op: { type: 'Plan dialectique en deux temps, puis dépassement', pb: 'Les médias sont-ils capables de transformer l’opinion publique, ou ne font-ils que refléter ce que pense leur public ?', rep: 'Les médias suivent souvent l’opinion de leur public, mais ils peuvent la faire changer dans certains moments décisifs : médias et opinion s’influencent dans les deux sens.', parts: [
      ['Les médias suivent souvent l’opinion de leur public', ['Une presse antidreyfusarde qui reflète l’antisémitisme et le sentiment anti-allemand (1894-1897)', 'Des télévisions américaines qui relaient d’abord la version officielle (body count, JUSPAO)']],
      ['Mais certains médias font basculer l’opinion', ['« J’accuse… ! » (13 janvier 1898) divise la France', 'Les images de la guerre (Têt 1968, photo de Nick Ut 1972) révèlent le « credibility gap »']],
      ['En réalité, médias et opinion s’influencent dans les deux sens', ['L’opinion pousse aussi les médias à changer (recherches sur le Vietnam)', 'Une relation qui dépend du contexte : liberté de la presse, guerre, rôle des intellectuels']]
    ] },
    g: { type: 'Plan dialectique', pb: 'Les États protègent-ils une information vraie et libre, ou cherchent-ils plutôt à la contrôler ?', rep: 'Les États peuvent garantir une information libre, mais ils sont aussi tentés de la contrôler, surtout en guerre ; la fiabilité dépend donc aussi des journalistes et des citoyens.', parts: [
      ['Les États peuvent garantir la liberté et la qualité de l’information', ['La loi du 29 juillet 1881 supprime la censure', 'Des médias publics : la BBC (1922), voix de la France libre en 1940']],
      ['Mais les États contrôlent souvent l’information', ['Les régimes totalitaires : Goebbels, Radio Bari', 'Même une démocratie fait de la propagande en guerre : JUSPAO, body count au Vietnam']],
      ['La fiabilité de l’information dépend aussi de la société', ['Journalistes et intellectuels peuvent contredire l’État (Zola, reporters au Vietnam)', 'À l’heure d’Internet, chacun doit vérifier ses sources']]
    ] },
    f: { type: 'Plan dialectique', pb: 'L’abondance d’informations, permise par les progrès techniques, rend-elle les citoyens mieux informés ?', rep: 'Être plus informé donne accès à plus de faits, mais pas forcément à des faits vrais ni compris ; être bien informé demande un regard critique.', parts: [
      ['Les progrès techniques nous informent de plus en plus', ['De la presse à grand tirage aux médias de masse (radio, télévision)', 'Internet : une information mondiale, continue, accessible à 5,5 milliards de personnes']],
      ['Mais être plus informé ne veut pas dire être mieux informé', ['Propagande et images trompeuses (body count au Vietnam)', 'Excès d’informations, mésinformation, désinformation, théories du complot']],
      ['Être bien informé suppose un regard critique', ['Croiser et vérifier les sources', 'Le rôle des journalistes, des intellectuels et de l’école']]
    ] },
    a: { type: 'Plan dialectique', pb: 'Internet et le numérique ont-ils rendu l’information plus libre, plus juste et plus fiable ?', rep: 'Le numérique rend l’information plus libre et plus accessible, mais il ne garantit pas sa fiabilité : il déplace la responsabilité vers chaque citoyen.', parts: [
      ['Le numérique rend l’information plus accessible et plus libre', ['Du réseau ARPANET (1969) au Web (1989) et à 5,5 milliards d’internautes', 'Une transmission horizontale : chacun peut publier et témoigner']],
      ['Mais il ne garantit pas une information fiable', ['Mésinformation et désinformation', 'Les théories du complot se diffusent plus vite']],
      ['Une meilleure information dépend des usages', ['Vérifier les sources, garder un esprit critique', 'Le rôle des médias traditionnels et de l’éducation aux médias']]
    ] },
    h: { type: 'Plan dialectique', pb: 'Les médias sont-ils un contre-pouvoir capable de surveiller l’État, ou dépendent-ils de l’État, de l’opinion et de l’argent ?', rep: 'Les médias peuvent jouer un rôle de contre-pouvoir quand ils sont libres, mais ils dépendent aussi de l’État, de leur public et de leurs ressources.', parts: [
      ['Des médias capables de surveiller et de contester le pouvoir', ['La presse libre depuis 1881 : « J’accuse… ! » contre l’armée', 'Les reporters au Vietnam révèlent le « credibility gap »']],
      ['Des médias souvent dépendants', ['De l’État : propagande, Goebbels, JUSPAO', 'De l’opinion et du marché : un journal doit plaire à ses lecteurs (presse antidreyfusarde)']],
      ['Un pouvoir partagé avec le public', ['L’opinion pèse sur les médias (Vietnam)', 'Internet : chacun devient producteur d’information']]
    ] }
  },

  /* ---------------- Dissertations résolues ---------------- */
  we: [
    { id: 'we-h1', sujet: 'c', mode: 'Guidé', d: 'Toutes les étapes sont montrées. Réponds dans ta tête avant de dévoiler.',
      analyse: { keys: ['progrès techniques', 'renforcé', 'la place de l’information', 'notre quotidien', 'depuis le XIXe siècle'],
        defs: [['progrès techniques', 'Les inventions qui transmettent l’information : rotative, radio, télévision, Internet.'], ['renforcé', 'Rendu plus fort, plus important.'], ['notre quotidien', 'La vie de tous les jours.']],
        bornes: 'Du XIXe siècle à aujourd’hui ; surtout en France, avec des exemples dans le monde.',
        type: 'Question « Comment… ? » : on explique les étapes d’une évolution. Le plan peut suivre l’ordre chronologique.' },
      diss: {
        intro: {
          acc: 'Aujourd’hui, un habitant de la planète passe en moyenne plus de six heures par jour devant des médias.',
          def: 'L’information désigne ce qui nous renseigne sur un fait ou sur une personne. Les progrès techniques sont les inventions qui permettent de la transmettre : la rotative, la radio, la télévision, Internet.',
          pres: 'Depuis le XIXe siècle, ces inventions se succèdent et touchent un public de plus en plus large, d’abord en Europe et aux États-Unis, puis dans le monde entier.',
          pb: 'Nous nous demanderons en quoi chaque grande innovation technique a fait entrer davantage l’information dans la vie de tous les jours.',
          ann: 'Nous verrons d’abord qu’au XIXe siècle, la presse à grand tirage fait de l’information un rendez-vous quotidien. Puis nous montrerons qu’au XXe siècle, la radio et la télévision la font entrer dans les foyers. Enfin, nous verrons qu’Internet la rend permanente, mondiale et individuelle.'
        },
        parts: [
          { idee: 'Au XIXe siècle, la presse à grand tirage fait de l’information un rendez-vous quotidien.', paras: [
            { a: 'Tout d’abord, de nouvelles machines permettent d’imprimer beaucoup plus de journaux.', e: 'En effet, imprimer vite et pour moins cher permet de vendre des journaux bon marché, que tout le monde peut acheter.', x: 'Par exemple, la rotative, au milieu du XIXe siècle, puis la linotype, en 1886, accélèrent l’impression, et le chemin de fer transporte les journaux dans tout le pays.' },
            { a: 'De plus, la presse trouve un public de plus en plus nombreux et libre de la lire.', e: 'En effet, un journal n’est utile que si les gens savent lire, et s’il peut publier sans censure.', x: 'Par exemple, en France, la part des personnes qui savent lire passe d’environ 30 % à 80 % au XIXe siècle, et la loi du 29 juillet 1881 garantit la liberté de la presse. Au début du XXe siècle, plus de 9 millions de journaux sont vendus chaque jour.' }
          ] },
          { idee: 'Au XXe siècle, la radio et la télévision font entrer l’information dans les foyers.', paras: [
            { a: 'Tout d’abord, la radio permet d’informer des millions de personnes en direct.', e: 'En effet, il n’est plus nécessaire de savoir lire ni de sortir acheter un journal : l’information arrive dans la maison, au moment même où elle se produit.', x: 'Par exemple, la BBC est créée en 1922, et le 18 juin 1940, le général de Gaulle lance son appel sur ses ondes.' },
            { a: 'De plus, la télévision crée une culture commune grâce à l’image.', e: 'En effet, voir les événements donne l’impression d’y assister, et des millions de familles regardent les mêmes images au même moment.', x: 'Par exemple, dans les années 1960, le journal de 20 h devient un rendez-vous familial ; en 1969, la Terre entière regarde le premier pas sur la Lune. McLuhan parle de « village global ».' }
          ] },
          { idee: 'Depuis la fin du XXe siècle, Internet rend l’information permanente, mondiale et individuelle.', paras: [
            { a: 'Tout d’abord, Internet donne accès à l’information partout et à tout moment.', e: 'En effet, le réseau relie des milliards d’ordinateurs et de téléphones : l’information circule sans interruption, d’un continent à l’autre.', x: 'Par exemple, après l’invention du Web par Tim Berners-Lee en 1989, Internet explose dans les années 2000 ; aujourd’hui, environ 5,5 milliards de personnes l’utilisent.' },
            { a: 'De plus, chacun devient à la fois producteur et consommateur d’information.', e: 'En effet, la transmission devient horizontale : n’importe qui peut publier un texte ou une vidéo. Mais personne ne vérifie toujours ce qui est publié.', x: 'Par exemple, les réseaux sociaux diffusent des témoignages en direct, mais aussi de la désinformation et des théories du complot, comme celle de la Terre plate.' }
          ] }
        ],
        trans: [
          'Ainsi, au XIXe siècle, la presse rend l’information quotidienne, mais seulement pour ceux qui savent lire. Au XXe siècle, de nouveaux médias vont toucher tout le monde.',
          'Ainsi, la radio et la télévision font de l’information un spectacle partagé par tous. Mais ce public reste passif : avec Internet, il va devenir acteur.'
        ],
        concl: {
          bil: 'En conclusion, chaque progrès technique a renforcé la place de l’information dans notre quotidien : la presse en fait une habitude au XIXe siècle, la radio et la télévision l’installent dans les foyers au XXe siècle, et Internet la rend permanente et personnelle.',
          ouv: 'Cette information toujours plus présente pose une nouvelle question : être de plus en plus informé, est-ce être mieux informé ?'
        }
      } },
    { id: 'we-h2', sujet: 'b', mode: 'Estompé', d: 'Certaines étapes te demandent de choisir avant de voir la réponse.',
      analyse: { keys: ['les médias', 'ont-ils favorisé', 'démocratisation', 'l’information'],
        defs: [['démocratisation', 'Rendre quelque chose accessible à tous. Ici : que tous puissent recevoir, produire et discuter l’information.'], ['favorisé', 'Aidé, rendu plus facile.'], ['les médias', 'La presse, la radio, la télévision, Internet.']],
        bornes: 'Du XIXe siècle à aujourd’hui ; exemples en France, en Europe et aux États-Unis.',

        trans0: { o: ['Ainsi, les médias élargissent l’accès à l’information. Mais cette information est-elle libre ?', 'Ensuite, la radio est inventée en 1906.', 'Pour conclure, les médias sont utiles.'], a: 0, why: 'Une transition fait le bilan de la partie qui se termine, puis annonce la suivante, souvent avec « Mais » ou « Cependant ».' },
        ouv: { o: ['Les médias ont été inventés par Gutenberg.', 'Aujourd’hui, l’éducation aux médias, à l’école, peut-elle aider chaque citoyen à s’informer de façon critique ?', 'J’aime beaucoup regarder la télévision.'], a: 1, why: 'L’ouverture élargit vers une question nouvelle, liée au sujet. Elle ne répète pas et ne donne pas d’avis personnel.' }

      diss: {
        intro: {
          acc: 'En 1936, un auteur écrit que la radio élargit « le petit agora athénien à la taille des nations ».',
          def: 'Les médias sont les techniques qui transmettent l’information à un public : presse, radio, télévision, Internet. La démocratisation de l’information désigne le fait que tous puissent y accéder, mais aussi la produire et la discuter librement.',
          pres: 'Depuis le XIXe siècle, en France, en Europe et aux États-Unis, ces médias touchent un public de plus en plus large.',
          pb: 'Les médias ont-ils permis à tous d’accéder librement à l’information, de la produire et de la discuter ?',
          ann: 'Nous verrons d’abord que les médias ont élargi l’accès à l’information. Puis nous montrerons que cette information est souvent restée contrôlée par les pouvoirs. Enfin, nous verrons que le public devient acteur de l’information, avec de nouveaux risques.'
        },
        parts: [
          { idee: 'Les médias élargissent l’accès à l’information.', paras: [
            { a: 'Tout d’abord, la presse à grand tirage touche un public de plus en plus large.', e: 'En effet, au XIXe siècle, de plus en plus de Français savent lire et peuvent acheter des journaux bon marché, qui ne sont plus censurés.', x: 'Par exemple, la loi du 29 juillet 1881 garantit la liberté de la presse, et au début du XXe siècle, plus de 9 millions de journaux sont vendus chaque jour en France.' },
            { a: 'De plus, la radio et la télévision deviennent des médias de masse.', e: 'En effet, elles touchent aussi les personnes qui lisent peu, directement chez elles.', x: 'Par exemple, dans les années 1960, la télévision devient un média de masse en France, et le journal de 20 h réunit des millions de familles.' }
          ] },
          { idee: 'Mais cette information reste souvent contrôlée par les pouvoirs.', paras: [
            { a: 'Tout d’abord, les régimes totalitaires utilisent les médias pour la propagande.', e: 'En effet, contrôler la radio, c’est imposer un seul message à tout un peuple et faire taire les opposants.', x: 'Par exemple, dans l’Allemagne nazie, Goebbels, ministre de la Propagande, contrôle tous les médias ; pendant la guerre, Radio Paris diffuse la propagande de la collaboration.' },

          { idee: 'Le public devient acteur de l’information, avec de nouveaux risques.', paras: [

            { a: 'De plus, avec Internet, chacun peut produire l’information.', e: 'En effet, la transmission devient horizontale : tout le monde peut publier, mais personne ne vérifie tout ce qui circule.', x: 'Par exemple, environ 5,5 milliards de personnes utilisent Internet aujourd’hui, mais la désinformation et les théories du complot s’y diffusent aussi.' }

        trans: [

        concl: {

  fams: [

      { t: 'mcq', p: 'Sujet : « Les médias d’information, un “quatrième pouvoir” ? » Quel type de sujet est-ce ?', o: ['Une question fermée : on discute (oui / mais)', 'Une consigne « Décrivez »', 'Une question « Quand ? »', 'Un sujet sans question'], a: 0, s: 'Une question fermée : on peut répondre oui ou non, donc on discute.', d: 'Une question fermée appelle souvent un plan dialectique : I. Oui… II. Mais… III. Dépassement.' },
