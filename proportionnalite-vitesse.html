<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proportionnalité et vitesse — 4e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:ital@1&display=swap" rel="stylesheet">
<style>:root{
  --win:#eff0f1; --view:#fcfcfc; --alt:#f4f5f6; --title:#e3e5e7; --hover:rgba(61,174,233,.08);
  --text:#232629; --muted:#626c76; --border:#cdd1d5; --border-strong:#a9aeb3;
  --btn:#fcfcfc; --btn-border:#b0b5ba;
  --accent:#3daee9; --accent-d:#2980b9; --accent-bg:rgba(61,174,233,.15);
  --pos:#27ae60; --neg:#da4453; --warn:#f67400; --purple:#8e44ad;
  --mul-t:#1d6fa5; --div-t:#7d3c98; --unk-t:#b85500; --pos-t:#1e8449; --neg-t:#b8323f;
  --mul-bg:rgba(61,174,233,.16); --div-bg:rgba(142,68,173,.13); --unk-bg:rgba(246,116,0,.15);
  --shadow:0 1px 2px rgba(35,38,41,.06);
}
[data-theme=dark]{
  --win:#2a2e32; --view:#1f2326; --alt:#262a2e; --title:#31363b; --hover:rgba(61,174,233,.12);
  --text:#eff0f1; --muted:#a3abb3; --border:#41474d; --border-strong:#5b6268;
  --btn:#31363b; --btn-border:#565c62; --accent-bg:rgba(61,174,233,.2);
  --mul-t:#7cc8ef; --div-t:#c9a0e0; --unk-t:#ffa04d; --pos-t:#5fd08e; --neg-t:#f0727e;
  --mul-bg:rgba(61,174,233,.2); --div-bg:rgba(155,89,182,.24); --unk-bg:rgba(246,116,0,.2);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55;color:var(--text);background:var(--win);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 14px;background:var(--title);border-bottom:1px solid var(--border)}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.app-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;flex-shrink:0}
.tb-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{color:var(--muted);font-size:.82em;padding:0 8px;border:1px solid var(--border);border-radius:10px;white-space:nowrap}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:230px;flex-shrink:0;background:var(--view);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-radius:4px;background:none;font-size:.95em;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-bg);border-color:var(--accent)}
.nav-item svg{color:var(--muted);flex-shrink:0}
.nav-item.active svg{color:var(--mul-t)}
.side-prog{margin-top:auto;padding:12px 6px 2px;border-top:1px solid var(--border);font-size:.84em;color:var(--muted)}
.side-prog strong{color:var(--text)}
.link-btn{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95em}
.link-btn:hover{color:var(--accent-d)}
.confirm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.content{flex:1;overflow:auto;background:var(--win)}
.page{max-width:900px;margin:0 auto;padding:28px 28px 72px;animation:fade .2s ease}
h1{font-size:1.6em;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.2em;font-weight:600;margin:0 0 10px}
h2.sec{margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2.sec small{font-weight:400;color:var(--muted);font-size:.68em}
h3{font-size:1em;font-weight:600;margin:0 0 8px}
h4{font-size:.95em;font-weight:600;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 10px}
.lead{color:var(--muted);font-size:1.03em;margin-bottom:20px}
.muted{color:var(--muted)}
.small{font-size:.87em}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px;margin-top:14px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
ul.tight,ol.tight{margin:4px 0 0;padding-left:20px}
ul.tight li,ol.tight li{margin:2px 0}
.card{background:var(--view);border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.card-h h2{margin:0}
.badge{font-size:.76em;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--accent-bg);color:var(--mul-t);border:1px solid var(--accent)}

/* Boutons et champs (Breeze) */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;min-height:34px;font-size:.93em;background:var(--btn);border:1px solid var(--btn-border);border-radius:4px;cursor:pointer;transition:border-color .12s,background .12s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent-d);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-d)}
.btn.flat{background:transparent;border-color:transparent}
.btn.flat:hover:not(:disabled){background:var(--hover);border-color:var(--border)}
.btn.flat.on{background:var(--accent-bg);border-color:var(--accent)}
.btn.sm{min-height:26px;padding:2px 10px;font-size:.88em}
.btn:disabled{opacity:.45;cursor:default}
.btn-count{font-size:.82em;opacity:.85;padding:0 6px;border-radius:8px;background:rgba(255,255,255,.22)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp{font:inherit;padding:5px 10px;min-height:34px;width:120px;border:1px solid var(--btn-border);border-radius:4px;background:var(--view);color:var(--text)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.inp:disabled{opacity:.7}
.inp.sm{width:62px;text-align:center}
.inp.xs{width:66px;text-align:center;padding:4px 6px}
.chip-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--btn-border);border-radius:16px;background:var(--btn);cursor:pointer;font-size:.9em}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn.active{background:var(--accent-bg);border-color:var(--accent);font-weight:600}
.count{font-size:.8em;font-weight:400;color:var(--muted);padding:0 6px;border-radius:8px;background:var(--alt);border:1px solid var(--border)}
.count.full{color:var(--pos-t);border-color:var(--pos)}

/* Onglets et contrôle segmenté */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 16px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.95em}
.tab:hover{color:var(--text);background:var(--hover)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--btn-border);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--btn);border:none;border-right:1px solid var(--btn-border);padding:5px 12px;cursor:pointer;font-size:.9em}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--accent);color:#fff}

/* Messages (KMessageWidget) */
.msg{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:5px;border:1px solid;margin:12px 0}
.msg-body{flex:1;min-width:0}
.msg-body p:last-child{margin-bottom:0}
.msg-title{margin-right:6px}
.msg-ic{flex-shrink:0;margin-top:2px;display:flex}
.msg-info{border-color:var(--accent);background:rgba(61,174,233,.09)} .msg-info .msg-ic{color:var(--mul-t)}
.msg-pos{border-color:var(--pos);background:rgba(39,174,96,.1)} .msg-pos .msg-ic{color:var(--pos-t)}
.msg-neg{border-color:var(--neg);background:rgba(218,68,83,.08)} .msg-neg .msg-ic{color:var(--neg-t)}
.msg-warn{border-color:var(--warn);background:rgba(246,116,0,.08)} .msg-warn .msg-ic{color:var(--unk-t)}

/* Énoncé */
.statement{padding:11px 16px;background:var(--alt);border-left:3px solid var(--accent);border-radius:0 5px 5px 0;margin:10px 0;font-size:1.03em}
.statement p:last-child{margin:0}
.q-chip{display:inline-grid;place-items:center;min-width:1.45em;height:1.45em;padding:0 .2em;border-radius:4px;background:var(--unk-bg);color:var(--unk-t);font-weight:700;border:1px solid var(--warn);line-height:1;font-size:.95em;vertical-align:baseline}
.q-chip.big{font-size:1.2em}

/* Tableau produit en croix */
.xt-wrap{margin:12px 0 4px;overflow-x:auto}
.xt{display:inline-flex;font-variant-numeric:tabular-nums}
.xt-labels{border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong);background:var(--alt)}
.xt-label{display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-strong);font-weight:600;font-size:.9em;max-width:200px;line-height:1.2}
.xt-vals{position:relative;display:grid;border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong);flex-shrink:0}
.xt-cell{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);font-size:1.08em;background:var(--view);transition:background .25s,color .25s}
.xt-cell.unk{background:var(--unk-bg);color:var(--unk-t);font-weight:700}
.xt-cell.mul{background:var(--mul-bg);color:var(--mul-t);font-weight:700}
.xt-cell.div{background:var(--div-bg);color:var(--div-t);font-weight:700}
.xt-svg{position:absolute;left:0;top:0;pointer-events:none}
.xt-line{stroke:var(--accent);stroke-width:3;stroke-linecap:round;animation:draw .4s ease}
.xt-line2{stroke:var(--purple);stroke-width:3;stroke-linecap:round;stroke-dasharray:5 4}
.formula{margin-top:10px;font-size:1.05em;font-variant-numeric:tabular-nums;line-height:2}
.fx{display:inline-block;padding:0 7px;border-radius:4px;font-weight:700;line-height:1.6}
.fx.mul{background:var(--mul-bg);color:var(--mul-t)}
.fx.div{background:var(--div-bg);color:var(--div-t)}
.fx.unk{background:var(--unk-bg);color:var(--unk-t)}
.f-res{font-size:1.1em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.84em;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px}
.lg.mul{background:var(--accent)} .lg.div{background:var(--purple)} .lg.unk{background:var(--warn)}
@keyframes draw{from{opacity:0}to{opacity:1}}

/* Tableau multi-colonnes */
.ptable-wrap{display:inline-flex;align-items:center;gap:6px;margin:10px 0;max-width:100%;overflow-x:auto}
.ptable-scroll{overflow-x:auto;margin:10px 0}
.ptable{border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{border:1px solid var(--border-strong);padding:7px 14px;text-align:center}
.ptable th{background:var(--alt);font-weight:600;font-size:.9em;text-align:left}
.ptable td{background:var(--view);min-width:58px}
.ptable.edit td{padding:4px 6px}
.ptable .qrow td{font-weight:600}
.ptable .qrow td.ok{background:rgba(39,174,96,.12);color:var(--pos-t)}
.ptable .qrow td.ko{background:rgba(218,68,83,.1);color:var(--neg-t)}
.coef{display:flex;align-items:center;gap:2px;color:var(--mul-t);font-weight:700;white-space:nowrap}

/* Triangle */
.tri{display:block;max-width:100%;height:auto}
.tri-shape{fill:var(--view);stroke:var(--text);stroke-width:2.5;stroke-linejoin:round}
.tri-bar{stroke:var(--text);stroke-width:2.5;transition:stroke .2s,stroke-width .2s}
.tri-bar.on{stroke:var(--accent);stroke-width:4}
.tri-op{font-size:30px;fill:var(--text);text-anchor:middle;transition:fill .2s,opacity .2s}
.tri-op.on{fill:var(--accent);font-weight:700}
.tri-op.dim{opacity:.2}
.tri-letter{font-family:'Noto Serif',Georgia,serif;font-style:italic;font-size:38px;fill:var(--text);text-anchor:middle}
.tri-hit{fill:transparent;transition:fill .15s}
.interactive .tri-var{cursor:pointer;outline:none}
.interactive .tri-var:hover .tri-hit,.interactive .tri-var:focus-visible .tri-hit{fill:var(--accent-bg);stroke:var(--accent)}
.tri-mask rect{fill:var(--warn)}
.tri-mask text{fill:#fff;font-size:30px;font-weight:700;text-anchor:middle}
.tri-mask{animation:pop .2s ease}
@keyframes pop{from{opacity:0}to{opacity:1}}
.tri-mini{display:flex;align-items:center;gap:14px;margin:8px 0;flex-wrap:wrap}
.math{font-family:'Noto Serif',Georgia,serif;font-size:1.25em;white-space:nowrap}
.math i,.math-i{font-family:'Noto Serif',Georgia,serif;font-style:italic}
.math-i{font-size:1.1em}
.tri-layout{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin:8px 0 16px}
.tri-result p{margin-bottom:6px}
.big-formula{font-size:1.6em;padding:10px 18px;border:2px solid var(--warn);border-radius:6px;background:var(--unk-bg);display:inline-block;margin:4px 0 10px}
.vocab{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.vocab span{padding:4px 12px;border:1px solid var(--border);border-radius:16px;background:var(--alt);font-size:.92em}
.vocab small{color:var(--muted)}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1px solid var(--border);border-radius:6px;background:var(--view);cursor:pointer}
.fcard:hover{border-color:var(--accent)}
.fcard.on{border-color:var(--warn);background:var(--unk-bg)}
.fcard small{color:var(--muted)}
.utable{border-collapse:collapse;margin:10px 0;width:100%;max-width:440px;text-align:center}
.utable th,.utable td{border:1px solid var(--border-strong);padding:7px 10px}
.utable th{background:var(--alt);font-weight:600;font-size:.92em}
.conv-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0}
.conv-field{display:inline-flex;align-items:center;gap:6px}
.conv-arrows{display:flex;flex-direction:column;font-size:.85em;color:var(--mul-t);font-weight:600;line-height:1.4}
.calc{padding:10px 14px;background:var(--alt);border-radius:5px;border:1px solid var(--border);font-variant-numeric:tabular-nums}
.calc p:last-child{margin:0}
.equiv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.eq{display:flex;gap:8px;justify-content:center;padding:8px;border:1px solid var(--border);border-radius:5px;background:var(--alt)}
.lien{display:flex;align-items:center;gap:24px;flex-wrap:wrap}

/* Étapes */
.steps{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.step{display:flex;gap:12px;animation:fade .25s ease}
.step-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:.82em;display:grid;place-items:center;margin-top:1px}
.step-body{flex:1;min-width:0}
.step-body p{margin-bottom:6px}
.step-title{font-weight:600;margin-bottom:3px}
.steps .row{margin-top:2px;padding-left:38px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Accueil */
.hero{padding:6px 0 4px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:16px}
.path-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:var(--view);cursor:pointer;text-align:left}
.path-card:hover{border-color:var(--accent);background:var(--hover)}
.path-card>svg{color:var(--muted);flex-shrink:0}
.path-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--mul-t);font-weight:700;display:grid;place-items:center}
.path-txt{flex:1;display:flex;flex-direction:column;gap:1px}
.path-txt strong{display:flex;align-items:center;gap:6px}
.path-txt small{color:var(--muted);font-size:.86em}
.path-txt em{font-style:normal;font-size:.8em;color:var(--pos-t)}
.teacher{margin-top:16px;border:1px solid var(--border);border-radius:6px;background:var(--view)}
.teacher summary{padding:10px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.teacher-body{padding:0 16px 8px;font-size:.92em}

/* Comprendre */
.dots{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:1px solid var(--btn-border);background:var(--btn);cursor:pointer;font-size:.85em}
.dot.seen{border-color:var(--accent);color:var(--mul-t)}
.dot.on{background:var(--accent);border-color:var(--accent-d);color:#fff;font-weight:600}
.lesson{min-height:300px;animation:fade .2s ease}
.mnemo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:.92em}
.mnemo span{padding:4px 12px;border-radius:16px;background:var(--alt);border:1px solid var(--border)}
.mnemo svg{color:var(--muted)}
.memo-box{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.memo-steps{margin:0;padding-left:22px;font-size:1.05em}
.memo-steps li{margin:6px 0}

/* Manipuler */
.lab-grid{display:grid;grid-template-columns:minmax(140px,220px) 120px 120px;margin:16px 0 8px;border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong);width:max-content;max-width:100%}
.lab-grid>*{border-right:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}
.lab-label.inp{border-radius:0;border:none;border-right:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);background:var(--alt);font-weight:600;width:100%;min-height:58px;font-size:.92em}
.lab-cell{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;background:var(--view);padding:6px}
.lab-cell.unk{background:var(--unk-bg)}
.lab-num.inp{width:84px;text-align:center}
.mk-unk{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:4px;border:1px solid var(--border);background:var(--alt);color:var(--unk-t);font-size:.75em;font-weight:700;cursor:pointer;padding:0;line-height:1}
.mk-unk:hover{border-color:var(--warn);background:var(--unk-bg)}
.lab-method{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}

/* Exercices */
.fam-groups{display:grid;gap:12px;margin-bottom:16px}
.fam-group h3{font-size:.85em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.worked{border-top:3px solid var(--accent)}
.ex-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ex-n{font-weight:600}
.lvl{font-size:.76em;font-weight:600;padding:2px 9px;border-radius:10px;border:1px solid}
.lvl1{color:var(--pos-t);border-color:var(--pos);background:rgba(39,174,96,.08)}
.lvl2{color:var(--mul-t);border-color:var(--accent);background:rgba(61,174,233,.08)}
.lvl3{color:var(--div-t);border-color:var(--purple);background:rgba(142,68,173,.08)}
.lvl4{color:var(--unk-t);border-color:var(--warn);background:rgba(246,116,0,.08)}
.solved-tag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--pos-t);font-size:.86em;font-weight:600}
.ex.solved{border-left:3px solid var(--pos)}
.scaffold{position:relative;margin:8px 0;padding:6px 14px 8px;border:1px dashed var(--border-strong);border-radius:6px}
.scaffold-tag{position:absolute;top:-10px;left:10px;background:var(--view);padding:0 6px;font-size:.76em;color:var(--muted);font-weight:600}
.answer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.answer-label{font-weight:600}
.answer-in{display:inline-flex;align-items:center;gap:6px}
.unit{color:var(--muted)}
.ex-tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.corr{margin-top:12px;padding:12px 16px;border-radius:6px;background:var(--alt);border:1px solid var(--border);animation:fade .2s ease}
.corr-line{font-size:1.05em;margin:0}

/* Quiz */
.qhead{display:flex;justify-content:space-between;margin-top:8px}
.qtitle{font-size:1.1em;margin:10px 0}
.opts{margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border:1px solid var(--btn-border);border-radius:5px;background:var(--view);margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--hover)}
.opt:disabled{cursor:default}
.opt .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--btn-border);flex-shrink:0;display:grid;place-items:center}
.opt.good{border-color:var(--pos);background:rgba(39,174,96,.12)}
.opt.good .radio{border-color:var(--pos);color:var(--pos-t)}
.opt.bad{border-color:var(--neg);background:rgba(218,68,83,.1)}
.opt.bad .radio{border-color:var(--neg);color:var(--neg-t)}
.opt.dim{opacity:.6}
.score{font-size:3em;font-weight:700;color:var(--mul-t);line-height:1.2;margin:8px 0}
.score span{font-size:.45em;color:var(--muted);font-weight:400}
.flash-end{padding:16px 0 4px}

/* Mémo */
.memo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:16px}
.memo-item{margin:0;display:flex;flex-direction:column}
.memo-item h3{color:var(--mul-t)}
.memo-ans{animation:fade .2s ease}
.memo-ans p:last-child{margin:0}
.memo-f{display:flex;flex-direction:column;gap:4px}
.cover{flex:1;min-height:90px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--border-strong);border-radius:5px;background:var(--alt);color:var(--muted);cursor:pointer}
.cover:hover{border-color:var(--accent);color:var(--text)}

@media (max-width:760px){
  .body{flex-direction:column}
  .sidebar{width:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px;gap:4px}
  .nav-item{flex-shrink:0;padding:6px 10px;font-size:.88em}
  .side-prog{display:none}
  .page{padding:18px 14px 56px}
  .hide-sm,.tb-sub{display:none}
  .tri-layout{grid-template-columns:1fr;justify-items:center}
  .fcards{grid-template-columns:1fr}
  .lab-grid{grid-template-columns:minmax(100px,1fr) 100px 100px}
  .lab-num.inp{width:70px}
  .steps .row{padding-left:0}
  .card{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

]},{id:"p1-2",level:2,scaffold:"hint",table:No,text:"Avec 12 \u20AC, Lina peut acheter 15 croissants. **Combien de croissants peut-elle acheter avec 20 \u20AC ?**",answer:{type:"num",value:25,unit:"croissants"},hint:"Le nombre cherch\xE9 est un nombre de croissants : place-le sous le 20 \u20AC.",simple:"[?] = 15 \xD7 20 \xF7 12 = 300 \xF7 12 = **25 croissants**",detail:[{t:ce,table:No,stage:0},{t:W,table:No},{t:"**Avec 20 \u20AC, Lina peut acheter 25 croissants.** (20 \u20AC > 12 \u20AC, donc plus de croissants \u2714)"}]},{id:"p1-3",level:3,scaffold:"none",table:So,text:"Au march\xE9, 350 g de fromage co\xFBtent 6,30 \u20AC. **Quel est le prix d\u2019un kilogramme de ce fromage ?**",answer:{type:"num",value:18,unit:"\u20AC"},hint:"Attention aux unit\xE9s : 1 kg = 1 000 g. Les deux masses doivent \xEAtre dans la m\xEAme unit\xE9.",traps:[{value:.018,tol:.001,msg:"Tu as gard\xE9 \xAB 1 \xBB kg alors que l\u2019autre masse est en grammes. Convertis d\u2019abord : 1 kg = 1 000 g."}],simple:"1 kg = 1 000 g ; [?] = 6,30 \xD7 1 000 \xF7 350 = 6 300 \xF7 350 = **18 \u20AC**",detail:[{t:"Les deux masses doivent avoir la m\xEAme unit\xE9 : 1 kg = **1 000 g**."},{t:ce,table:So,stage:0},{t:W,table:So},{t:"**Le fromage co\xFBte 18 \u20AC le kilogramme.**"}]},{id:"p1-4",level:4,scaffold:"none",table:Co,text:"Un tissu est vendu au m\xE8tre : 2,5 m co\xFBtent 18 \u20AC. Sarah ach\xE8te 4 m de ce tissu et paie avec un billet de 50 \u20AC. **Combien la vendeuse lui rend-elle ?**",answer:{type:"num",value:21.2,unit:"\u20AC"},hint:"Deux \xE9tapes : (1) le prix des 4 m avec un produit en croix ; (2) la monnaie rendue sur 50 \u20AC.",traps:[{value:28.8,msg:"Bien : 28,80 \u20AC est le prix des 4 m. Il reste une \xE9tape : calculer la monnaie rendue sur 50 \u20AC."}],simple:"Prix de 4 m : 18 \xD7 4 \xF7 2,5 = 72 \xF7 2,5 = 28,80 \u20AC ; monnaie : 50 \u2212 28,80 = **21,20 \u20AC**",detail:[{title:"\xC9tape 1 : le prix des 4 m",t:ce,table:Co,stage:0},{t:W,table:Co},{title:"\xC9tape 2 : la monnaie",t:"50 \u2212 28,80 = 21,20"},{t:"**La vendeuse rend 21,20 \u20AC \xE0 Sarah.**"}]}]},{id:"p2",group:"prop",title:"Recettes",intro:"Dans une recette, les quantit\xE9s d\u2019ingr\xE9dients sont proportionnelles au nombre de personnes (ou de parts).",example:{text:"Pour 4 personnes, une recette de cr\xEApes demande 250 g de farine. **Quelle masse de farine faut-il pour 6 personnes ?**",steps:[{title:"Je v\xE9rifie que c\u2019est proportionnel",t:"2 fois plus de personnes \u2192 2 fois plus de farine. La masse de farine est proportionnelle au nombre de personnes."},{title:"Je range les donn\xE9es dans un tableau",t:"4 personnes \u2194 250 g dans la m\xEAme colonne ; 6 personnes \u2194 [?].",table:Rd,stage:0},{title:"Je fais le produit en croix",t:"Diagonale compl\xE8te : 250 \xD7 6. Puis je divise par le nombre qui reste : 4.",table:Rd},{title:"Je v\xE9rifie et je conclus",t:["6 personnes > 4 personnes, donc plus de 250 g \u2714","**Il faut 375 g de farine pour 6 personnes.**"]}]},exercises:[{id:"p2-1",level:1,scaffold:"shown",table:Eo,text:"Une recette pour 12 cookies demande 150 g de sucre. **Quelle masse de sucre faut-il pour 20 cookies ?**",answer:{type:"num",value:250,unit:"g"},hint:"Multiplie 150 par 20, puis divise par 12.",simple:"[?] = 150 \xD7 20 \xF7 12 = 3 000 \xF7 12 = **250 g**",detail:[{t:ce,table:Eo,stage:0},{t:W,table:Eo},{t:"**Il faut 250 g de sucre pour 20 cookies.**"}]},{id:"p2-2",level:2,scaffold:"hint",table:Po,text:"Pour 6 personnes, une recette de flan demande 9 \u0153ufs. **Pour combien de personnes peut-on faire ce flan avec 15 \u0153ufs ?**",answer:{type:"num",value:10,unit:"personnes"},hint:"Cette fois, on cherche un nombre de personnes : le [?] est sur la ligne \xAB personnes \xBB.",simple:"[?] = 6 \xD7 15 \xF7 9 = 90 \xF7 9 = **10 personnes**",detail:[{t:ce,table:Po,stage:0},{t:W,table:Po},{t:"**Avec 15 \u0153ufs, on peut faire un flan pour 10 personnes.**"}]},{id:"p2-3",level:3,scaffold:"none",table:Lo,text:"Pour pr\xE9parer 75 cL de citronnade, on utilise 3 citrons. **Combien de citrons faut-il pour 2 L de citronnade ?**",answer:{type:"num",value:8,unit:"citrons"},hint:"Convertis d\u2019abord : 1 L = 100 cL.",traps:[{value:.08,tol:.001,msg:"Les volumes ne sont pas dans la m\xEAme unit\xE9 ! Convertis 2 L en cL : 2 L = 200 cL."}],simple:"2 L = 200 cL ; [?] = 3 \xD7 200 \xF7 75 = 600 \xF7 75 = **8 citrons**",detail:[{t:"M\xEAme unit\xE9 sur une ligne : 2 L = **200 cL**."},{t:ce,table:Lo,stage:0},{t:W,table:Lo},{t:"**Il faut 8 citrons.**"}]},{id:"p2-4",level:4,scaffold:"none",table:_o,text:"Un g\xE2teau pour 6 personnes demande 180 g de beurre. Le beurre est vendu en plaquettes de 250 g. **Combien de plaquettes faut-il acheter pour faire ce g\xE2teau pour 15 personnes ?**",answer:{type:"num",value:2,unit:"plaquettes"},hint:"Calcule d\u2019abord la masse de beurre pour 15 personnes, puis compte les plaquettes n\xE9cessaires.",traps:[{value:450,msg:"Bien : il faut 450 g de beurre. Combien de plaquettes de 250 g faut-il acheter pour avoir au moins 450 g ?"},{value:1.8,msg:"On ne peut pas acheter 1,8 plaquette ! Il faut arrondir au nombre entier sup\xE9rieur pour avoir assez de beurre."}],simple:"Beurre : 180 \xD7 15 \xF7 6 = 450 g ; 1 plaquette = 250 g (pas assez), 2 plaquettes = 500 g \u2192 **2 plaquettes**",detail:[{title:"\xC9tape 1 : la masse de beurre",t:ce,table:_o,stage:0},{t:W,table:_o},{title:"\xC9tape 2 : le nombre de plaquettes",t:["1 plaquette = 250 g : pas assez (250 < 450).","2 plaquettes = 500 g : assez (500 \u2265 450)."]},{t:"**Il faut acheter 2 plaquettes de beurre.**"}]}]},{id:"p3",group:"prop",title:"Pourcentages",intro:"Un pourcentage est une situation de proportionnalit\xE9 : 34 % veut dire \xAB 34 sur 100 \xBB.",example:{text:"Dans un coll\xE8ge de 650 \xE9l\xE8ves, 34 % des \xE9l\xE8ves sont demi-pensionnaires. **Combien d\u2019\xE9l\xE8ves sont demi-pensionnaires ?**",steps:[{title:"Je traduis le pourcentage",t:"34 % veut dire : sur **100** \xE9l\xE8ves, **34** sont demi-pensionnaires."},{title:"Je range les donn\xE9es dans un tableau",t:"Sur 100 \xE9l\xE8ves \u2192 34 ; sur 650 \xE9l\xE8ves \u2192 [?].",table:Od,stage:0},{title:"Je fais le produit en croix",t:"Je multiplie 34 \xD7 650, puis je divise par 100.",table:Od},{title:"Je conclus",t:["**221 \xE9l\xE8ves sont demi-pensionnaires.**","\xC0 retenir : prendre 34 % d\u2019un nombre, c\u2019est le multiplier par 34 puis diviser par 100."]}]},exercises:[{id:"p3-1",level:1,scaffold:"shown",table:Mo,text:"Un pull co\xFBte 48 \u20AC. Il b\xE9n\xE9ficie d\u2019une r\xE9duction de 25 %. **Quel est le montant de la r\xE9duction ?**",answer:{type:"num",value:12,unit:"\u20AC"},hint:"25 % : pour 100 \u20AC de prix, la r\xE9duction est de 25 \u20AC.",traps:[{value:36,msg:"36 \u20AC est le nouveau prix du pull. On demande le montant de la r\xE9duction."}],simple:"[?] = 25 \xD7 48 \xF7 100 = 1 200 \xF7 100 = **12 \u20AC**",detail:[{t:"25 % de r\xE9duction : pour un prix de 100 \u20AC, la r\xE9duction est de 25 \u20AC.",table:Mo,stage:0},{t:W,table:Mo},{t:"**La r\xE9duction est de 12 \u20AC.** (Le pull co\xFBte alors 48 \u2212 12 = 36 \u20AC.)"}]},{id:"p3-2",level:2,scaffold:"hint",table:zo,text:"Dans une classe de 25 \xE9l\xE8ves, 9 \xE9l\xE8ves font du sport en club. **Quel pourcentage de la classe cela repr\xE9sente-t-il ?**",answer:{type:"num",value:36,unit:"%"},hint:"Le pourcentage, c\u2019est le nombre d\u2019\xE9l\xE8ves en club \xAB sur 100 \xE9l\xE8ves \xBB.",simple:"[?] = 9 \xD7 100 \xF7 25 = 900 \xF7 25 = **36 %**",detail:[{t:"Je cherche combien d\u2019\xE9l\xE8ves feraient du sport en club sur 100 \xE9l\xE8ves.",table:zo,stage:0},{t:W,table:zo},{t:"**36 % des \xE9l\xE8ves font du sport en club.**"}]},{id:"p3-3",level:3,scaffold:"none",table:To,text:"Un sac est sold\xE9 : la r\xE9duction de 30 % repr\xE9sente 18 \u20AC. **Quel \xE9tait le prix initial du sac ?**",answer:{type:"num",value:60,unit:"\u20AC"},hint:"Le prix initial correspond \xE0 100 %. 30 % correspondent \xE0 18 \u20AC.",traps:[{value:5.4,msg:"Attention : 18 \u20AC n\u2019est pas le prix initial, c\u2019est la r\xE9duction (30 %). Le prix initial correspond \xE0 100 %."}],simple:"[?] = 100 \xD7 18 \xF7 30 = 1 800 \xF7 30 = **60 \u20AC**",detail:[{t:"30 % de r\xE9duction : pour 100 \u20AC de prix initial, la r\xE9duction est de 30 \u20AC. Ici la r\xE9duction vaut 18 \u20AC.",table:To,stage:0},{t:W,table:To},{t:["**Le sac co\xFBtait 60 \u20AC avant les soldes.**","V\xE9rification : 30 % de 60 \u20AC = 60 \xD7 30 \xF7 100 = 18 \u20AC \u2714"]}]},{id:"p3-4",level:4,scaffold:"none",table:Do,text:"Un jean co\xFBte 60 \u20AC. Il est sold\xE9 \xE0 \u221215 %. **Quel est son nouveau prix ?**",answer:{type:"num",value:51,unit:"\u20AC"},hint:"Calcule d\u2019abord la r\xE9duction, puis retire-la du prix.",traps:[{value:9,msg:"Bien : 9 \u20AC est le montant de la r\xE9duction. Le nouveau prix, c\u2019est 60 \u20AC moins la r\xE9duction."},{value:69,msg:"Une r\xE9duction fait baisser le prix : il faut soustraire, pas ajouter."}],simple:"R\xE9duction : 15 \xD7 60 \xF7 100 = 9 \u20AC ; nouveau prix : 60 \u2212 9 = **51 \u20AC**",detail:[{title:"\xC9tape 1 : la r\xE9duction",t:"\u221215 % : pour 100 \u20AC de prix, 15 \u20AC de r\xE9duction.",table:Do,stage:0},{t:W,table:Do},{title:"\xC9tape 2 : le nouveau prix",t:"60 \u2212 9 = 51"},{t:"**Le jean co\xFBte 51 \u20AC apr\xE8s r\xE9duction.**"}]}]},{id:"p4",group:"prop",title:"\xC9chelles",intro:"Sur un plan ou une carte, les longueurs sont proportionnelles aux longueurs r\xE9elles.",example:{text:"Sur une carte \xE0 l\u2019\xE9chelle 1/25 000, deux villages sont \xE0 6 cm l\u2019un de l\u2019autre. **Quelle est la distance r\xE9elle entre les villages, en km ?**",steps:[{title:"Je traduis l\u2019\xE9chelle",t:"1/25 000 veut dire : **1 cm** sur la carte repr\xE9sente **25 000 cm** dans la r\xE9alit\xE9 (m\xEAme unit\xE9 !)."},{title:"Je range les donn\xE9es dans un tableau",t:ce,table:Id,stage:0},{title:"Je fais le produit en croix",t:"Je multiplie 25 000 \xD7 6, puis je divise par 1.",table:Id},{title:"Je convertis et je conclus",t:["150 000 cm = 1 500 m = 1,5 km.","**Les villages sont \xE0 1,5 km l\u2019un de l\u2019autre.**"]}]},exercises:[{id:"p4-1",level:1,scaffold:"shown",table:Ro,text:"Sur un plan, 2 cm repr\xE9sentent 5 m dans la r\xE9alit\xE9. Une pi\xE8ce mesure 8 cm de long sur le plan. **Quelle est sa longueur r\xE9elle (en m) ?**",answer:{type:"num",value:20,unit:"m"},hint:"Multiplie 5 par 8, puis divise par 2.",simple:"[?] = 5 \xD7 8 \xF7 2 = 40 \xF7 2 = **20 m**",detail:[{t:ce,table:Ro,stage:0},{t:W,table:Ro},{t:"**La pi\xE8ce mesure 20 m de long.**"}]},{id:"p4-2",level:2,scaffold:"hint",table:Oo,text:"Sur une maquette, 3 cm repr\xE9sentent 12 m. Un b\xE2timent r\xE9el mesure 30 m de haut. **Quelle est sa hauteur sur la maquette (en cm) ?**",answer:{type:"num",value:7.5,unit:"cm"},hint:"On cherche une longueur sur la maquette : le [?] est sur la ligne \xAB maquette \xBB.",simple:"[?] = 3 \xD7 30 \xF7 12 = 90 \xF7 12 = **7,5 cm**",detail:[{t:ce,table:Oo,stage:0},{t:W,table:Oo},{t:"**Sur la maquette, le b\xE2timent mesure 7,5 cm.**"}]},{id:"p4-3",level:3,scaffold:"none",table:Io,text:"Sur une carte \xE0 l\u2019\xE9chelle 1/50 000, **quelle longueur (en cm) repr\xE9sente un chemin r\xE9el de 3 km ?**",answer:{type:"num",value:6,unit:"cm"},hint:"Convertis 3 km en cm : 1 km = 100 000 cm.",traps:[{value:6e-5,tol:1e-6,msg:"Convertis 3 km en cm avant de calculer : 3 km = 300 000 cm."}],simple:"3 km = 300 000 cm ; [?] = 1 \xD7 300 000 \xF7 50 000 = **6 cm**",detail:[{t:"\xC9chelle 1/50 000 : 1 cm sur la carte \u2194 50 000 cm en r\xE9alit\xE9. Je convertis : 3 km = 3 000 m = **300 000 cm**."},{t:ce,table:Io,stage:0},{t:W,table:Io},{t:"**Le chemin mesure 6 cm sur la carte.**"}]},{id:"p4-4",level:4,scaffold:"none",table:jo,text:"Sur un plan, une table de 1,2 m de long est repr\xE9sent\xE9e par un rectangle de 4 cm. **Quelle est l\u2019\xE9chelle du plan ?** (Donne le nombre n tel que l\u2019\xE9chelle soit 1/n.)",answer:{type:"num",value:30,unit:""},hint:"L\u2019\xE9chelle 1/n veut dire : 1 cm sur le plan \u2194 n cm en r\xE9alit\xE9. Mets les deux longueurs en cm.",traps:[{value:.3,msg:"Les deux longueurs doivent \xEAtre dans la m\xEAme unit\xE9 : 1,2 m = 120 cm."}],simple:"1,2 m = 120 cm ; 4 cm \u2194 120 cm, donc 1 cm \u2194 120 \xF7 4 = 30 cm \u2192 \xE9chelle **1/30**",detail:[{t:"M\xEAme unit\xE9 : 1,2 m = **120 cm**. Je cherche la longueur r\xE9elle qui correspond \xE0 **1 cm** sur le plan.",table:jo,stage:0},{t:W,table:jo},{t:"**1 cm sur le plan repr\xE9sente 30 cm : l\u2019\xE9chelle est 1/30.**"}]}]},{id:"p5",group:"prop",title:"D\xE9bits et consommations",intro:"Un d\xE9bit (litres par minute) ou une consommation (litres pour 100 km) r\xE9guliers donnent des situations de proportionnalit\xE9.",example:{text:"Une voiture consomme 6 L d\u2019essence pour 100 km. **Combien d\u2019essence consomme-t-elle pour 350 km ?**",steps:[{title:"Je v\xE9rifie que c\u2019est proportionnel",t:"La consommation est r\xE9guli\xE8re : 2 fois plus de kilom\xE8tres \u2192 2 fois plus d\u2019essence."},{title:"Je range les donn\xE9es dans un tableau",t:"100 km \u2194 6 L ; 350 km \u2194 [?].",table:jd,stage:0},{title:"Je fais le produit en croix",t:"Je multiplie 6 \xD7 350, puis je divise par 100.",table:jd},{title:"Je conclus",t:"**La voiture consomme 21 L pour 350 km.**"}]},exercises:[{id:"p5-1",level:1,scaffold:"shown",table:Fo,text:"Un robinet d\xE9bite 12 L d\u2019eau en 2 minutes. **Combien de litres coulent en 7 minutes ?**",answer:{type:"num",value:42,unit:"L"},hint:"Multiplie 12 par 7, puis divise par 2.",simple:"[?] = 12 \xD7 7 \xF7 2 = 84 \xF7 2 = **42 L**",detail:[{t:ce,table:Fo,stage:0},{t:W,table:Fo},{t:"**En 7 minutes, 42 L d\u2019eau coulent.**"}]},{id:"p5-2",level:2,scaffold:"hint",table:Uo,text:"Une imprimante imprime 45 pages en 3 minutes. **Combien de minutes lui faut-il pour imprimer 120 pages ?**",answer:{type:"num",value:8,unit:"min"},hint:"On cherche une dur\xE9e : le [?] est sur la ligne des minutes, sous 120 pages.",simple:"[?] = 3 \xD7 120 \xF7 45 = 360 \xF7 45 = **8 min**",detail:[{t:ce,table:Uo,stage:0},{t:W,table:Uo},{t:"**Il faut 8 minutes pour imprimer 120 pages.**"}]},{id:"p5-3",level:3,scaffold:"none",table:qo,text:"Un scooter consomme 2,4 L d\u2019essence pour 80 km. Son r\xE9servoir contient 6 L. **Quelle distance peut-il parcourir avec un plein ?**",answer:{type:"num",value:200,unit:"km"},hint:"Range les litres sur une ligne et les kilom\xE8tres sur l\u2019autre.",simple:"[?] = 80 \xD7 6 \xF7 2,4 = 480 \xF7 2,4 = **200 km**",detail:[{t:ce,table:qo,stage:0},{t:W,table:qo},{t:"**Avec un plein, le scooter parcourt 200 km.**"}]},{id:"p5-4",level:4,scaffold:"none",table:$o,text:"Une baignoire de 180 L se remplit avec un robinet qui d\xE9bite 15 L en 1 min 30 s. **Combien de minutes faut-il pour la remplir ?**",answer:{type:"num",value:18,unit:"min"},hint:"1 min 30 s = 1 minute et une demi-minute.",traps:[{value:15.6,msg:"1 min 30 s ne fait pas 1,3 min ! 30 s = une demi-minute, donc 1 min 30 s = 1,5 min."},{value:1080,msg:"Tu as calcul\xE9 en secondes : 1 080 s. On demande des minutes : 1 080 \xF7 60 = ?"}],simple:"1 min 30 s = 1,5 min ; [?] = 1,5 \xD7 180 \xF7 15 = 270 \xF7 15 = **18 min**",detail:[{t:"Je convertis la dur\xE9e en minutes : 30 s = une demi-minute = 0,5 min, donc 1 min 30 s = **1,5 min**."},{t:ce,table:$o,stage:0},{t:W,table:$o},{t:"**La baignoire se remplit en 18 minutes.**"}]}]},{id:"v1",group:"vit",title:"Calculer une distance",intro:"Pour calculer une distance : d = v \xD7 t. La dur\xE9e doit \xEAtre dans l\u2019unit\xE9 de la vitesse.",example:{text:"Un cycliste roule \xE0 18 km/h pendant 2 h 30 min. **Quelle distance parcourt-il ?**",steps:[{title:"Je choisis la formule",t:"Je cherche la distance : je cache **d** dans le triangle. Il reste v \xD7 t, donc **d = v \xD7 t**.",tri:"d"},{title:"Je v\xE9rifie les unit\xE9s",t:["La vitesse est en km/h : la dur\xE9e doit \xEAtre en **heures**.","30 min = une demi-heure = 0,5 h, donc 2 h 30 min = **2,5 h**. (Attention : pas 2,30 h !)"]},{title:"Je calcule",t:"d = 18 \xD7 2,5 = **45 km**"},{title:"Je v\xE9rifie avec le produit en croix",t:"18 km/h veut dire : 18 km en 1 h. C\u2019est une situation de proportionnalit\xE9.",table:z("Distance (km)",[18,null],"Dur\xE9e (h)",[1,2.5])},{title:"Je conclus",t:"**Le cycliste parcourt 45 km.**"}]},exercises:[{id:"v1-1",level:1,scaffold:"shown",tri:"d",text:"Un train roule \xE0 120 km/h pendant 3 h. **Quelle distance parcourt-il ?**",answer:{type:"num",value:360,unit:"km"},hint:"d = v \xD7 t. Ici, la dur\xE9e est d\xE9j\xE0 en heures.",traps:[{value:40,msg:"Tu as divis\xE9. Pour une distance, on multiplie : d = v \xD7 t."}],simple:"d = v \xD7 t = 120 \xD7 3 = **360 km**",detail:[{t:"Je cache d : **d = v \xD7 t**.",tri:"d"},{t:"La vitesse est en km/h et la dur\xE9e en h : les unit\xE9s vont ensemble."},{t:"d = 120 \xD7 3 = **360 km**. Le train parcourt 360 km."}]},{id:"v1-2",level:2,scaffold:"hint",tri:"d",text:"Une voiture roule \xE0 90 km/h pendant 1 h 30 min. **Quelle distance parcourt-elle ?**",answer:{type:"num",value:135,unit:"km"},hint:"1 h 30 min = 1 h + une demi-heure.",traps:[{value:117,msg:"1 h 30 min ne fait pas 1,3 h : 30 min = une demi-heure = 0,5 h. Donc 1 h 30 min = 1,5 h."},{value:8100,msg:"Tu as multipli\xE9 par des minutes (90 min). La vitesse est en km/h : la dur\xE9e doit \xEAtre en heures."}],simple:"1 h 30 min = 1,5 h ; d = 90 \xD7 1,5 = **135 km**",detail:[{t:"Je cache d : **d = v \xD7 t**.",tri:"d"},{t:"v est en km/h, donc t doit \xEAtre en heures : 1 h 30 min = **1,5 h**."},{t:"d = 90 \xD7 1,5 = **135 km**."}]},{id:"v1-3",level:3,scaffold:"none",tri:"d",text:"Une randonneuse marche \xE0 4 km/h pendant 45 min. **Quelle distance parcourt-elle ?**",answer:{type:"num",value:3,unit:"km"},hint:"Convertis d\u2019abord 45 min en heures : 45 min = 45 \xF7 60 h.",traps:[{value:180,msg:"Tu as multipli\xE9 par 45 (des minutes). Convertis 45 min en heures : 45 min = 0,75 h."},{value:1.8,msg:"45 min ne fait pas 0,45 h ! 45 min = 45 \xF7 60 h = 0,75 h."}],simple:"45 min = 0,75 h ; d = 4 \xD7 0,75 = **3 km**",detail:[{t:"Je cache d : **d = v \xD7 t**.",tri:"d"},{t:"45 min = 45 \xF7 60 h = **0,75 h** (trois quarts d\u2019heure)."},{t:"d = 4 \xD7 0,75 = **3 km**."},{t:"Autre m\xE9thode : produit en croix avec les minutes (4 km en 60 min).",table:z("Distance (km)",[4,null],"Dur\xE9e (min)",[60,45])}]},{id:"v1-4",level:4,scaffold:"none",tri:"d",text:"Un avion vole \xE0 840 km/h pendant 2 h 20 min. **Quelle distance parcourt-il ?**",answer:{type:"num",value:1960,unit:"km",tol:.5},hint:"20 min ne tombe pas juste en heures d\xE9cimales. Fais un produit en croix avec la dur\xE9e en minutes : 2 h 20 min = 140 min.",traps:[{value:1848,msg:"20 min ne fait pas 0,2 h. 20 min = 20 \xF7 60 h = un tiers d\u2019heure. Essaie le produit en croix avec les minutes : 2 h 20 min = 140 min."},{value:1957.2,tol:3,type:"warn",msg:"Presque ! En arrondissant 2 h 20 min \xE0 2,33 h, le r\xE9sultat est un peu faux. Calcule plut\xF4t avec les minutes : 2 h 20 min = 140 min."}],simple:"2 h 20 min = 140 min ; d = 840 \xD7 140 \xF7 60 = 117 600 \xF7 60 = **1 960 km**",detail:[{t:"Je cache d : **d = v \xD7 t**. Mais 20 min = 0,333\u2026 h : ce nombre ne tombe pas juste.",tri:"d"},{t:"Je passe par les minutes : 2 h 20 min = 2 \xD7 60 + 20 = **140 min**, et 840 km/h = 840 km en 60 min."},{t:W,table:z("Distance (km)",[840,null],"Dur\xE9e (min)",[60,140])},{t:"**L\u2019avion parcourt 1 960 km.**"}]}]},{id:"v2",group:"vit",title:"Calculer une dur\xE9e",intro:"Pour calculer une dur\xE9e : t = d \xF7 v. Le r\xE9sultat en heures d\xE9cimales se convertit ensuite en h et min.",example:{text:"Une voiture parcourt 210 km \xE0 la vitesse moyenne de 84 km/h. **Combien de temps dure le trajet ?**",steps:[{title:"Je choisis la formule",t:"Je cherche la dur\xE9e : je cache **t**. Il reste d sur v, donc **t = d \xF7 v**.",tri:"t"},{title:"Je v\xE9rifie les unit\xE9s",t:"d est en km et v en km/h : le r\xE9sultat sera en **heures**."},{title:"Je calcule",t:"t = 210 \xF7 84 = **2,5 h**"},{title:"Je convertis en heures et minutes",t:["2,5 h = 2 h + 0,5 h.","0,5 h = 0,5 \xD7 60 min = **30 min**."]},{title:"Je conclus",t:"**Le trajet dure 2 h 30 min.**"}]},exercises:[{id:"v2-1",level:1,scaffold:"shown",tri:"t",text:"Un bus parcourt 150 km \xE0 50 km/h. **Combien de temps dure le trajet ?**",answer:{type:"hm",h:3,m:0},hint:"t = d \xF7 v",simple:"t = d \xF7 v = 150 \xF7 50 = **3 h**",detail:[{t:"Je cache t : **t = d \xF7 v**.",tri:"t"},{t:"t = 150 \xF7 50 = **3 h**. Le trajet dure 3 heures."}]},{id:"v2-2",level:2,scaffold:"hint",tri:"t",text:"Un cycliste parcourt 33 km \xE0 22 km/h. **Combien de temps roule-t-il ?** (en heures et minutes)",answer:{type:"hm",h:1,m:30},hint:"Calcule t = d \xF7 v, puis convertis la partie d\xE9cimale en minutes (\xD7 60).",traps:[{h:1,m:50,msg:"1,5 h ne fait pas 1 h 50 min ! 0,5 h = 0,5 \xD7 60 = 30 min."},{h:1,m:5,msg:"0,5 h = 0,5 \xD7 60 min = 30 min, pas 5 min."}],simple:"t = 33 \xF7 22 = 1,5 h = **1 h 30 min**",detail:[{t:"Je cache t : **t = d \xF7 v**.",tri:"t"},{t:"t = 33 \xF7 22 = 1,5 h."},{t:"1,5 h = 1 h + 0,5 h ; 0,5 \xD7 60 = 30 min. **Il roule 1 h 30 min.**"}]},{id:"v2-3",level:3,scaffold:"none",tri:"t",text:"Un TGV parcourt 780 km \xE0 la vitesse moyenne de 300 km/h. **Combien de temps dure le trajet ?** (en heures et minutes)",answer:{type:"hm",h:2,m:36},hint:"Calcule t = d \xF7 v, puis convertis la partie d\xE9cimale en minutes (\xD7 60).",traps:[{h:2,m:60,msg:"0,6 h ne fait pas 60 min (sinon ce serait 3 h !). 0,6 h = 0,6 \xD7 60 = 36 min."},{h:2,m:6,msg:"0,6 h = 0,6 \xD7 60 min = 36 min, pas 6 min."}],simple:"t = 780 \xF7 300 = 2,6 h ; 0,6 \xD7 60 = 36 min \u2192 **2 h 36 min**",detail:[{t:"Je cache t : **t = d \xF7 v**.",tri:"t"},{t:"t = 780 \xF7 300 = 2,6 h."},{t:"2,6 h = 2 h + 0,6 h et 0,6 \xD7 60 = 36 min. **Le trajet dure 2 h 36 min.**"},{t:"\u26A0 Pi\xE8ge fr\xE9quent : 2,6 h n\u2019est pas 2 h 60 min ! Une heure a 60 minutes, pas 100."}]},{id:"v2-4",level:4,scaffold:"none",tri:"t",text:"Un coureur parcourt 10 km \xE0 la vitesse de 12 km/h. **Combien de minutes court-il ?**",answer:{type:"num",value:50,unit:"min"},hint:"12 km/h = 12 km en 60 min. Fais un produit en croix avec les minutes.",traps:[{value:.83,tol:.01,msg:"10 \xF7 12 \u2248 0,83 h : c\u2019est la dur\xE9e en heures. On demande des minutes : multiplie par 60."},{value:83,tol:.6,msg:"0,83 h ne fait pas 83 min ! Il faut multiplier par 60 : 0,833\u2026 \xD7 60 = ?"},{value:1.2,msg:"Tu as calcul\xE9 v \xF7 d. Pour une dur\xE9e : t = d \xF7 v."}],simple:"12 km en 60 min ; [?] = 60 \xD7 10 \xF7 12 = 600 \xF7 12 = **50 min**",detail:[{t:"t = d \xF7 v = 10 \xF7 12 \u2248 0,833 h : le r\xE9sultat ne tombe pas juste.",tri:"t"},{t:"Je passe par les minutes : 12 km/h = 12 km en 60 min.",table:z("Distance (km)",[12,10],"Dur\xE9e (min)",[60,null])},{t:"**Il court pendant 50 minutes.**"}]}]},{id:"v3",group:"vit",title:"Calculer une vitesse",intro:"Pour calculer une vitesse moyenne : v = d \xF7 t. Pour des km/h, la dur\xE9e doit \xEAtre en heures.",example:{text:"Un scooter parcourt 36 km en 45 min. **Quelle est sa vitesse moyenne en km/h ?**",steps:[{title:"Je choisis la formule",t:"Je cherche la vitesse : je cache **v**. Il reste d sur t, donc **v = d \xF7 t**.",tri:"v"},{title:"Je v\xE9rifie les unit\xE9s",t:"On veut des km/h : la dur\xE9e doit \xEAtre en heures. 45 min = 45 \xF7 60 h = **0,75 h**."},{title:"Je calcule",t:"v = 36 \xF7 0,75 = **48 km/h**"},{title:"Autre m\xE9thode : le produit en croix",t:"Une vitesse en km/h, c\u2019est la distance parcourue en 60 min. Je cherche la distance pour 60 min :",table:z("Distance (km)",[36,null],"Dur\xE9e (min)",[45,60])},{title:"Je conclus",t:"**La vitesse moyenne du scooter est 48 km/h.**"}]},exercises:[{id:"v3-1",level:1,scaffold:"shown",tri:"v",text:"Une voiture parcourt 240 km en 3 h. **Quelle est sa vitesse moyenne ?**",answer:{type:"num",value:80,unit:"km/h"},hint:"v = d \xF7 t",traps:[{value:720,msg:"Tu as multipli\xE9 d \xD7 t. Pour une vitesse : v = d \xF7 t."},{value:.0125,tol:.001,msg:"Tu as calcul\xE9 t \xF7 d. La formule est v = d \xF7 t."}],simple:"v = d \xF7 t = 240 \xF7 3 = **80 km/h**",detail:[{t:"Je cache v : **v = d \xF7 t**.",tri:"v"},{t:"v = 240 \xF7 3 = **80 km/h**."}]},{id:"v3-2",level:2,scaffold:"hint",tri:"v",text:"Un cycliste parcourt 45 km en 2 h 30 min. **Quelle est sa vitesse moyenne ?**",answer:{type:"num",value:18,unit:"km/h"},hint:"2 h 30 min = 2 h + une demi-heure.",traps:[{value:19.57,tol:.02,msg:"2 h 30 min ne fait pas 2,3 h : 30 min = 0,5 h, donc 2 h 30 min = 2,5 h."},{value:.3,tol:.001,msg:"Tu as divis\xE9 par 150 minutes : tu obtiens des km par minute. Pour des km/h, la dur\xE9e doit \xEAtre en heures (2,5 h)."}],simple:"2 h 30 min = 2,5 h ; v = 45 \xF7 2,5 = **18 km/h**",detail:[{t:"Je cache v : **v = d \xF7 t**.",tri:"v"},{t:"2 h 30 min = **2,5 h**."},{t:"v = 45 \xF7 2,5 = **18 km/h**."}]},{id:"v3-3",level:3,scaffold:"none",tri:"v",text:"Un nageur parcourt 1,2 km en 20 min. **Quelle est sa vitesse moyenne en km/h ?**",answer:{type:"num",value:3.6,unit:"km/h"},hint:"20 min, c\u2019est un tiers d\u2019heure : en 60 min, il nage 3 fois plus loin. Tu peux faire un produit en croix avec 60 min.",traps:[{value:.06,tol:.001,msg:"1,2 \xF7 20 donne des km par minute. Pour des km/h : utilise le produit en croix avec 60 min."},{value:6,msg:"20 min ne fait pas 0,2 h ! 20 min = un tiers d\u2019heure. Utilise le produit en croix avec 60 min."}],simple:"En 60 min : [?] = 1,2 \xD7 60 \xF7 20 = 72 \xF7 20 = **3,6 km/h**",detail:[{t:"v = d \xF7 t, mais 20 min = 0,333\u2026 h : ce n\u2019est pas pratique.",tri:"v"},{t:"Une vitesse en km/h = la distance parcourue en 60 min.",table:z("Distance (km)",[1.2,null],"Dur\xE9e (min)",[20,60])},{t:"**Le nageur nage \xE0 3,6 km/h.** V\xE9rification : 20 min \xD7 3 = 60 min et 1,2 \xD7 3 = 3,6 \u2714"}]},{id:"v3-4",level:4,scaffold:"none",tri:"v",text:"Un sprinteur parcourt 100 m en 10 s. **Quelle est sa vitesse en km/h ?**",answer:{type:"num",value:36,unit:"km/h"},hint:"Calcule d\u2019abord la vitesse en m/s, puis convertis : 1 m/s = 3,6 km/h.",traps:[{value:10,msg:"10 m/s est juste\u2026 en m\xE8tres par seconde ! On demande des km/h : multiplie par 3,6."},{value:2.78,tol:.01,msg:"Tu as divis\xE9 par 3,6. Pour passer des m/s aux km/h, on multiplie par 3,6."}],simple:"v = 100 \xF7 10 = 10 m/s ; 10 \xD7 3,6 = **36 km/h**",detail:[{t:"v = d \xF7 t = 100 \xF7 10 = **10 m/s**.",tri:"v"},{t:"1 m/s = 3 600 m en 1 h = 3,6 km/h. Donc 10 m/s = 10 \xD7 3,6 = **36 km/h**."}]}]},{id:"v4",group:"vit",title:"Convertir dur\xE9es et vitesses",intro:"Une heure compte 60 minutes, pas 100 : les heures d\xE9cimales se convertissent en multipliant par 60.",example:{text:"Convertis **3,4 h** en heures et minutes, puis **1 h 12 min** en heures d\xE9cimales.",steps:[{title:"Je s\xE9pare la partie enti\xE8re",t:"3,4 h = 3 h + 0,4 h."},{title:"Je convertis la partie d\xE9cimale en minutes",t:["1 h = 60 min, donc 0,4 h = 0,4 \xD7 60 min = 24 min.","**3,4 h = 3 h 24 min**"]},{title:"Dans l\u2019autre sens : minutes \u2192 heures",t:"12 min = 12 \xF7 60 h. Avec un produit en croix :",table:z("Dur\xE9e (min)",[60,12],"Dur\xE9e (h)",[1,null])},{title:"Je conclus",t:"12 min = 0,2 h, donc **1 h 12 min = 1,2 h**."},{title:"Et pour les vitesses ?",t:["1 m/s = 3 600 m en 1 h = 3,6 km/h.","m/s \u2192 km/h : **\xD7 3,6**    \xB7    km/h \u2192 m/s : **\xF7 3,6**"]}]},exercises:[{id:"v4-1",level:1,scaffold:"shown",table:z("Dur\xE9e (min)",[60,45],"Dur\xE9e (h)",[1,null]),text:"**Convertis 1 h 45 min en heures** (nombre d\xE9cimal).",answer:{type:"num",value:1.75,unit:"h"},hint:"45 min = 45 \xF7 60 h. N\u2019oublie pas d\u2019ajouter l\u2019heure enti\xE8re.",traps:[{value:1.45,msg:"45 min ne fait pas 0,45 h ! 45 min = 45 \xF7 60 h = 0,75 h."},{value:.75,msg:"0,75 h correspond aux 45 min. Ajoute l\u2019heure enti\xE8re : 1 h + 0,75 h."}],simple:"45 min = 45 \xF7 60 = 0,75 h \u2192 1 h 45 min = **1,75 h**",detail:[{t:"Je convertis seulement les minutes : 45 min = ? h.",table:z("Dur\xE9e (min)",[60,45],"Dur\xE9e (h)",[1,null])},{t:"1 h 45 min = 1 h + 0,75 h = **1,75 h**."}]},{id:"v4-2",level:2,scaffold:"hint",text:"**Convertis 2,3 h** en heures et minutes.",answer:{type:"hm",h:2,m:18},hint:"Multiplie la partie d\xE9cimale (0,3) par 60.",traps:[{h:2,m:30,msg:"0,3 h ne fait pas 30 min ! 0,3 h = 0,3 \xD7 60 min = 18 min."},{h:2,m:3,msg:"0,3 h = 0,3 \xD7 60 = 18 min."}],simple:"0,3 \xD7 60 = 18 min \u2192 2,3 h = **2 h 18 min**",detail:[{t:"2,3 h = 2 h + 0,3 h."},{t:"0,3 h = 0,3 \xD7 60 min = 18 min."},{t:"**2,3 h = 2 h 18 min.**"}]},{id:"v4-3",level:3,scaffold:"none",text:"**Convertis 15 m/s en km/h.**",answer:{type:"num",value:54,unit:"km/h"},hint:"1 m/s = 3,6 km/h.",traps:[{value:4.17,tol:.01,msg:"Tu as divis\xE9 par 3,6. Pour passer des m/s aux km/h, on multiplie par 3,6."}],simple:"15 \xD7 3,6 = **54 km/h**",detail:[{t:"1 m/s = 3 600 m par heure = 3,6 km/h."},{t:"15 m/s = 15 \xD7 3,6 = **54 km/h**."},{t:"V\xE9rification : la m\xEAme vitesse s\u2019\xE9crit avec un nombre plus grand en km/h qu\u2019en m/s \u2714"}]},{id:"v4-4",level:4,scaffold:"none",text:"**Convertis 90 km/h en m/s.**",answer:{type:"num",value:25,unit:"m/s"},hint:"Le nombre en m/s est plus petit que le nombre en km/h.",traps:[{value:324,msg:"Pour passer des km/h aux m/s, on divise par 3,6 (le nombre doit devenir plus petit)."},{value:1.5,msg:"Tu as divis\xE9 par 60. Mais 1 h = 3 600 s et 1 km = 1 000 m : on divise par 3,6."}],simple:"90 \xF7 3,6 = **25 m/s**",detail:[{t:"90 km/h = 90 000 m en 3 600 s."},{t:"En 1 s : 90 000 \xF7 3 600 = **25 m/s**."},{t:"Raccourci : km/h \xF7 3,6 = m/s, et 90 \xF7 3,6 = 25 \u2714"}]}]},{id:"v5",group:"vit",title:"Probl\xE8mes \xE0 \xE9tapes",intro:"Plusieurs \xE9tapes : rep\xE8re ce qu\u2019il faut calculer d\u2019abord, puis encha\xEEne.",example:{text:"Nadia part de chez elle \xE0 8 h 50. Elle roule \xE0 v\xE9lo \xE0 16 km/h. Le coll\xE8ge est \xE0 4 km. **\xC0 quelle heure arrive-t-elle ?**",steps:[{title:"Je rep\xE8re les \xE9tapes",t:"(1) Calculer la dur\xE9e du trajet. (2) L\u2019ajouter \xE0 l\u2019heure de d\xE9part."},{title:"\xC9tape 1 : la dur\xE9e",t:"Je cache t : **t = d \xF7 v** = 4 \xF7 16 = 0,25 h.",tri:"t"},{title:"Je convertis",t:"0,25 h = 0,25 \xD7 60 min = **15 min** (un quart d\u2019heure)."},{title:"\xC9tape 2 : l\u2019heure d\u2019arriv\xE9e",t:"8 h 50 + 15 min = 8 h 65 min = **9 h 05** (car 65 min = 1 h 05 min)."},{title:"Je conclus",t:"**Nadia arrive au coll\xE8ge \xE0 9 h 05.**"}]},exercises:[{id:"v5-1",level:1,scaffold:"shown",tri:"t",text:"Un car part \xE0 13 h 15. Il roule \xE0 80 km/h sur un trajet de 200 km. **\xC0 quelle heure arrive-t-il ?**",answer:{type:"hm",h:15,m:45},hint:"Dur\xE9e : t = d \xF7 v. Puis ajoute cette dur\xE9e \xE0 13 h 15.",traps:[{h:2,m:30,msg:"Bien : 2 h 30 min est la dur\xE9e du trajet. Ajoute-la maintenant \xE0 l\u2019heure de d\xE9part (13 h 15)."},{h:15,m:20,msg:"2,5 h ne fait pas 2 h 05 min ! 2,5 h = 2 h 30 min."}],simple:"t = 200 \xF7 80 = 2,5 h = 2 h 30 min ; 13 h 15 + 2 h 30 = **15 h 45**",detail:[{t:"\xC9tape 1 : je cache t : **t = d \xF7 v** = 200 \xF7 80 = 2,5 h = 2 h 30 min.",tri:"t"},{t:"\xC9tape 2 : 13 h 15 + 2 h = 15 h 15, puis + 30 min = **15 h 45**."},{t:"**Le car arrive \xE0 15 h 45.**"}]},{id:"v5-2",level:2,scaffold:"hint",text:"L\xE9o fait 12 km \xE0 v\xE9lo en 40 min, puis 3 km \xE0 pied en 50 min. **Quelle est sa vitesse moyenne sur tout le trajet ?** (en km/h)",answer:{type:"num",value:10,unit:"km/h"},hint:"Vitesse moyenne = distance totale \xF7 dur\xE9e totale.",traps:[{value:10.8,msg:"On ne fait pas la moyenne des deux vitesses ! Vitesse moyenne = distance totale \xF7 dur\xE9e totale."},{value:.17,tol:.01,msg:"15 \xF7 90 donne des km par minute. Convertis 90 min en heures : 1,5 h."}],simple:"d = 12 + 3 = 15 km ; t = 40 + 50 = 90 min = 1,5 h ; v = 15 \xF7 1,5 = **10 km/h**",detail:[{t:"Distance totale : 12 + 3 = **15 km**."},{t:"Dur\xE9e totale : 40 + 50 = 90 min = 1 h 30 min = **1,5 h**."},{t:"v = d \xF7 t = 15 \xF7 1,5 = **10 km/h**.",tri:"v"},{t:"\u26A0 Pi\xE8ge : la moyenne des deux vitesses (18 km/h et 3,6 km/h) donne 10,8 km/h, ce qui est faux : L\xE9o passe plus de temps \xE0 pied qu\u2019\xE0 v\xE9lo."}]},{id:"v5-3",level:3,scaffold:"none",tri:"v",text:"Un train part \xE0 7 h 42 et arrive \xE0 9 h 54. Il a parcouru 462 km. **Quelle est sa vitesse moyenne ?**",answer:{type:"num",value:210,unit:"km/h"},hint:"Calcule d\u2019abord la dur\xE9e du trajet (de 7 h 42 \xE0 9 h 54), puis convertis-la en heures.",traps:[{value:217.92,tol:.05,msg:"2 h 12 min ne fait pas 2,12 h ! 12 min = 12 \xF7 60 h = 0,2 h, donc 2 h 12 min = 2,2 h."},{value:3.5,msg:"462 \xF7 132 donne des km par minute. Pour des km/h, convertis la dur\xE9e en heures : 2,2 h."}],simple:"Dur\xE9e : 2 h 12 min = 2,2 h ; v = 462 \xF7 2,2 = **210 km/h**",detail:[{t:"Dur\xE9e : de 7 h 42 \xE0 9 h 42 \u2192 2 h ; de 9 h 42 \xE0 9 h 54 \u2192 12 min. Total : **2 h 12 min**."},{t:"12 min = 12 \xF7 60 h = 0,2 h, donc 2 h 12 min = **2,2 h**."},{t:"v = d \xF7 t = 462 \xF7 2,2 = **210 km/h**.",tri:"v"}]},{id:"v5-4",level:4,scaffold:"none",tri:"t",text:"Deux amis habitent \xE0 27 km l\u2019un de l\u2019autre. Ils partent en m\xEAme temps, \xE0 v\xE9lo, l\u2019un vers l\u2019autre : l\u2019un roule \xE0 15 km/h, l\u2019autre \xE0 12 km/h. **Au bout de combien de minutes se rencontrent-ils ?**",answer:{type:"num",value:60,unit:"min"},hint:"Chaque heure, la distance entre eux diminue de 15 + 12 km.",traps:[{value:1,msg:"1 h, c\u2019est juste ! Mais on demande la r\xE9ponse en minutes."},{value:108,tol:.5,msg:"Les deux amis avancent en m\xEAme temps : chaque heure, ils se rapprochent de 15 + 12 = 27 km."},{value:135,tol:.5,msg:"Les deux amis avancent en m\xEAme temps : chaque heure, ils se rapprochent de 15 + 12 = 27 km."}],simple:"Ils se rapprochent de 15 + 12 = 27 km par heure ; t = 27 \xF7 27 = 1 h = **60 min
