<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Hugo à Breton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* Plan : l'environnement visuel de KDE Plasma (thème Breeze). Fenêtre gris clair, vues blanches,
   bleu Breeze pour la sélection et le focus, Noto Sans partout, Noto Serif pour les vers.
   Une seule touche de couleur par mouvement, issue de la palette d'icônes Breeze (signalement). */
:root {
  --window: #EFF0F1;
  --view: #FCFCFC;
  --ink: #232627;
  --muted: #6A737D;
  --rule: #C9CDD1;
  --accent: #3DAEE9;
  --link: #2980B9;
  --good: #27AE60;
  --bad: #DA4453;
  --paper: var(--window);
  --surface: var(--view);
  --display: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --verse: "Noto Serif", Georgia, "Times New Roman", serif;
  --c-romantisme: #DA4453;
  --c-baudelaire: #8E44AD;
  --c-parnasse: #16A085;
  --c-symbolisme: #2980B9;
  --c-mallarme: #5D6D7E;
  --c-cros: #B9770E;
  --c-dada: #D35400;
  --c-surrealisme: #C2185B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --window: #202326; --view: #141618; --ink: #FCFCFC; --muted: #A1A9B1; --rule: #3B4045;
    --accent: #3DAEE9; --link: #1D99F3; --good: #3EC07A; --bad: #ED5A6A;
    --c-romantisme: #F0707D; --c-baudelaire: #B27BD0; --c-parnasse: #3CC5A6; --c-symbolisme: #5DB4F0;
    --c-mallarme: #9AA8B6; --c-cros: #E5B04F; --c-dada: #F68B3C; --c-surrealisme: #F06292;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --window: #202326; --view: #141618; --ink: #FCFCFC; --muted: #A1A9B1; --rule: #3B4045;
  --accent: #3DAEE9; --link: #1D99F3; --good: #3EC07A; --bad: #ED5A6A;
  --c-romantisme: #F0707D; --c-baudelaire: #B27BD0; --c-parnasse: #3CC5A6; --c-symbolisme: #5DB4F0;
  --c-mallarme: #9AA8B6; --c-cros: #E5B04F; --c-dada: #F68B3C; --c-surrealisme: #F06292;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--window); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

/* barre d'outils, comme l'en-tête d'une application KDE */
.top { position: sticky; top: 0; z-index: 20; background: var(--window); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 600; font-size: 16px; white-space: nowrap; padding: 10px 6px; background: none; border: 0; cursor: pointer; border-radius: 4px; }
.brand i { font-style: normal; font-weight: 400; color: var(--muted); }
.brand:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; font-size: 14.5px; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tab .step { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 6px; }

main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 56px; display: grid; gap: 24px; }
.lead { color: var(--muted); max-width: 70ch; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; }
.panel { background: var(--view); border: 1px solid var(--rule); border-radius: 6px; padding: 18px; }
.btn { border: 1px solid var(--rule); background: var(--view); border-radius: 4px; padding: 7px 14px; cursor: pointer; font-size: 14.5px; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.btn:hover { border-color: var(--accent); }
.btn:active { background: color-mix(in srgb, var(--accent) 22%, var(--view)); }
.btn.primary { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--view)); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 24%, var(--view)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* accueil */
.hero { display: grid; gap: 14px; padding: 4px 0; }
.hero h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 300; }
.hero h1 em { font-style: normal; color: var(--muted); }
.hero .dates { font-size: 16px; color: var(--muted); }
.ribbon { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.ribbon button { min-width: 0; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; padding: 10px 10px 9px; background: var(--view); text-align: left; display: grid; gap: 2px; position: relative; overflow: hidden; }
.ribbon button::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--mc); }
.ribbon button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--view)); }
.ribbon .n { font-weight: 600; font-size: 14px; line-height: 1.25; padding-left: 4px; }
.ribbon .d { font-size: 12px; color: var(--muted); padding-left: 4px; }
@media (max-width: 900px) { .ribbon { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 480px) { .ribbon { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.path { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.path button { text-align: left; border: 1px solid var(--rule); background: var(--view); border-radius: 6px; padding: 16px; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.path button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--view)); }
.path .k { font-size: 13px; font-weight: 600; color: var(--muted); }
.path h3 { font-size: 16px; }
.path p { color: var(--muted); font-size: 14.5px; }
details.design { background: var(--view); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 16px; }
details.design summary { cursor: pointer; font-weight: 600; font-size: 15px; }
details.design ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }

/* notions */
.notion-groups { display: grid; gap: 24px; }
.ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
.ncard { background: var(--view); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.ncard h3 { font-size: 15.5px; }
.ncard .def { font-size: 15px; }
.ncard .ex { font-size: 14px; color: var(--muted); border-left: 2px solid var(--rule); padding-left: 10px; }
.ncard.hidden .def, .ncard.hidden .ex { filter: blur(6px); user-select: none; }
.ncard .reveal { justify-self: start; font-size: 13px; padding: 3px 10px; }

/* frise */
.frise-wrap { background: var(--view); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.frise-scroll { overflow-x: auto; position: relative; }
.frise { position: relative; }
.axis-t { position: absolute; font-size: 12px; color: var(--muted); transform: translateX(-50%); }
.gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule); opacity: .55; }
.war { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 8%, transparent) 0 3px, transparent 3px 8px); }
.focusband { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--mc) 8%, transparent); border-left: 1px dashed var(--mc); border-right: 1px dashed var(--mc); }
.ev { position: absolute; font-size: 12px; white-space: nowrap; padding-left: 6px; border-left: 2px solid var(--muted); line-height: 16px; }
.ev b { font-weight: 600; font-variant-numeric: tabular-nums; }
.band { position: absolute; height: 20px; border-radius: 3px; background: var(--mc); border: 0; cursor: pointer; padding: 0; }
.band-l { position: absolute; font-weight: 600; font-size: 13.5px; white-space: nowrap; border: 0; background: none; cursor: pointer; padding: 0 4px; line-height: 20px; color: var(--mc); border-radius: 3px; }
.band-l small { color: var(--muted); font-weight: 400; }
.life { position: absolute; height: 18px; border-radius: 3px; border: 1px solid var(--mc); background: color-mix(in srgb, var(--mc) 12%, var(--view)); cursor: pointer; padding: 0 6px; font-size: 12px; line-height: 16px; text-align: left; white-space: nowrap; overflow: visible; }
.life:hover { background: color-mix(in srgb, var(--mc) 24%, var(--view)); }
.life.sel { background: var(--mc); color: #FFFFFF; }
.frise-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--rule); align-items: center; background: var(--window); }
.chip { border: 1px solid var(--rule); background: var(--view); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--mc, var(--muted)); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--view)); }
.detail { padding: 12px 16px; border-top: 1px solid var(--rule); min-height: 60px; display: grid; gap: 4px; }
.detail .who { font-size: 18px; font-weight: 600; }

/* parcours : panneau latéral comme dans Dolphin */
.parcours { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { position: sticky; top: 64px; display: grid; gap: 2px; background: var(--view); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; }
.rail button { text-align: left; border: 1px solid transparent; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 14.5px; }
.rail button::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--mc); flex: none; }
.rail button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rail button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); }
.rail .nn { display: none; }
@media (max-width: 860px) {
  .parcours { grid-template-columns: 1fr; }
  .rail { position: static; display: flex; overflow-x: auto; }
  .rail button { white-space: nowrap; }
}
.sec-head { display: grid; gap: 4px; }
.sec-head h2 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 300; }
.sec-head .per { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.sec-head .per::before { content: ""; width: 24px; height: 4px; border-radius: 2px; background: var(--mc); }
.retenir { background: var(--view); border: 1px solid var(--rule); border-left: 4px solid var(--mc); border-radius: 6px; padding: 12px 16px; }
.retenir h3 { font-size: 14px; color: var(--ink); }
.retenir ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 4px; }
.steps { display: flex; gap: 0; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.stepbtn { border: 0; background: none; padding: 8px 14px 7px; cursor: pointer; font-size: 14.5px; color: var(--muted); border-bottom: 3px solid transparent; }
.stepbtn:hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.stepbtn[aria-current="step"] { color: var(--ink); border-bottom-color: var(--accent); }
.textsel { display: flex; gap: 6px; flex-wrap: wrap; }
.textsel .stepbtn { border: 1px solid var(--rule); border-radius: 4px; background: var(--view); padding: 5px 12px; }
.textsel .stepbtn[aria-current="step"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--view)); }
.prose { display: grid; gap: 12px; max-width: 72ch; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14.5px; background: var(--view); }
.tscroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t tbody tr:nth-child(even) { background: color-mix(in srgb, var(--window) 55%, var(--view)); }
table.t th { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--window); }
table.t td.d { white-space: nowrap; font-variant-numeric: tabular-nums; }
.bio { display: grid; gap: 8px; max-width: 72ch; }
.bio h3 { font-size: 20px; font-weight: 400; }

.reading { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .reading { grid-template-columns: 1fr; } }
.poem { background: var(--view); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 16px; position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow-y: auto; }
@media (max-width: 900px) { .poem { position: static; max-height: none; } }
.poem h3 { font-size: 20px; font-weight: 400; }
.poem .ref { color: var(--muted); font-size: 13.5px; margin: 2px 0 4px; }
.poem .src { font-size: 12.5px; color: var(--muted); }
.stanza { margin-top: 12px; }
.vl { display: grid; grid-template-columns: 30px 1fr; font-family: var(--verse); font-size: 16.5px; line-height: 1.6; border-radius: 3px; transition: background-color .15s; }
.vl .vn { font-family: var(--body); font-size: 11px; color: var(--muted); text-align: right; padding-right: 10px; padding-top: 4px; font-variant-numeric: tabular-nums; }
.vl.hi { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
.vl.prose-p { font-size: 16px; margin-top: 10px; }
.dedic { font-family: var(--verse); font-style: italic; margin-top: 8px; padding-left: 30px; }
.points { display: grid; gap: 8px; }
.point { text-align: left; border: 1px solid var(--rule); background: var(--view); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; font-size: 15px; }
.point:hover { border-color: var(--accent); }
.point[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--view)); }
.point h4 { margin: 0; font-size: 15px; font-weight: 600; }
.point .vrefs { font-size: 12.5px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.point blockquote { margin: 4px 0 0; padding-left: 10px; border-left: 2px solid var(--accent); font-family: var(--verse); font-size: 14.5px; }
.hint { font-size: 13.5px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 14px; }

/* liens */
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain span.m { border-radius: 4px; padding: 3px 9px; font-size: 13.5px; background: var(--view); border: 1px solid var(--rule); display: inline-flex; gap: 6px; align-items: center; }
.chain span.m::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--mc); }
.chain span.arr { color: var(--muted); }

/* quiz */
.quiz { max-width: 760px; display: grid; gap: 16px; }
.qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13.5px; }
.bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qtext { font-size: 19px; font-weight: 600; line-height: 1.4; }
.qquote { font-family: var(--verse); font-size: 18px; border-left: 3px solid var(--accent); padding-left: 12px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--rule); background: var(--view); border-radius: 4px; padding: 10px 14px; cursor: pointer; font-size: 15.5px; display: flex; gap: 12px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--view)); }
.opt .l { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--view)); }
.opt.ko { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--view)); }
.opt:disabled { cursor: default; }
.fb { border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; border: 1px solid var(--rule); background: var(--view); }
.fb.ok { border-left: 4px solid var(--good); }
.fb.ko { border-left: 4px solid var(--bad); }
.fb strong.v { font-size: 16px; }
.setup { display: grid; gap: 14px; }
.choice { display: flex; flex-wrap: wrap; gap: 6px; }
.choice .chip::before { display: none; }
.score { font-size: 48px; font-weight: 300; line-height: 1; }
.errlist { display: grid; gap: 8px; }
.errlist .e { border: 1px solid var(--rule); border-left: 4px solid var(--bad); padding: 8px 12px; background: var(--view); border-radius: 4px; display: grid; gap: 4px; }
footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 0 16px 28px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ====================== DONNÉES ====================== */
const SECTIONS = [
{
  id: "romantisme", name: "Le romantisme", short: "Romantisme", period: "1820 – 1850", span: [1820, 1850],
  retenir: [
    "Le **« moi » lyrique** au centre : le poète dit ses joies, ses amours et ses deuils.",
    "La **nature** sert de miroir à l'âme ; le poète se veut aussi guide du peuple.",
    "Hugo, chef de file. *Les Contemplations* (1856), publiées en exil, pleurent sa fille Léopoldine."
  ],
  intro: [
    "Le romantisme domine la poésie française de 1820 à 1850 environ. Il commence avec les *Méditations poétiques* de Lamartine (1820). Hugo en devient le chef de file avec la préface de *Cromwell* (1827), puis la « bataille d'*Hernani* » (1830), quand jeunes romantiques et classiques s'affrontent au théâtre.",
    "C'est une **réaction contre le classicisme** et ses règles."
  ],
  principes: [
    ["Le lyrisme", "le poète exprime son « moi », ses joies, ses deuils, ses amours."],
    ["La nature comme miroir de l'âme", "paysages, saisons et lumières reflètent les sentiments."],
    ["Le mal du siècle", "mélancolie, solitude, sentiment d'être né trop tard."],
    ["La liberté dans l'art", "mélange des genres, assouplissement de l'alexandrin."],
    ["L'engagement", "le poète se veut guide du peuple, « écho sonore » de son temps."]
  ],
  outro: "C'est contre ce lyrisme que réagira le Parnasse, avec l'impersonnalité et l'art pour l'art.",
  auteursTitre: "Les auteurs emblématiques",
  auteurs: [
    ["Germaine de Staël", 1766, 1817, "Précurseur : *De l'Allemagne* (1810)"],
    ["François-René de Chateaubriand", 1768, 1848, "Précurseur : *René* (1802), *Mémoires d'outre-tombe*"],
    ["Marceline Desbordes-Valmore", 1786, 1859, "Poésie élégiaque, admirée par Verlaine"],
    ["Alphonse de Lamartine", 1790, 1869, "*Méditations poétiques* (1820), « Le Lac »"],
    ["Alfred de Vigny", 1797, 1863, "*Les Destinées*, poésie philosophique"],
    ["Victor Hugo", 1802, 1885, "Chef de file : *Les Contemplations* (1856), *Les Misérables* (1862)"],
    ["Alexandre Dumas", 1802, 1870, "Drame romantique, romans historiques"],
    ["George Sand", 1804, 1876, "Romancière, *Indiana* (1832)"],
    ["Gérard de Nerval", 1808, 1855, "*Les Chimères* (1854), « El Desdichado »"],
    ["Alfred de Musset", 1810, 1857, "*Les Nuits*, *Lorenzaccio* (1834)"]
  ],
  bio: { nom: "Victor Hugo (1802-1885)", texte: [
    "Hugo traverse tout le siècle : poète, dramaturge, romancier et homme politique. Il s'oppose au coup d'État de Louis-Napoléon Bonaparte (1851) et vit presque vingt ans en exil, à Jersey puis à Guernesey.",

/* ====================== APPLICATION ====================== */
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);
const SEC = Object.fromEntries(SECTIONS.map((s, i) => [s.id, { ...s, n: i + 1 }]));
const mc = id => ({ "--mc": `var(--c-${id})` });

function rich(str) {
  if (!str) return null;
  return str.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g).map((p, i) => {
    if (p.length > 4 && p.startsWith("**") && p.endsWith("**")) return html`<strong key=${i}>${p.slice(2, -2)}</strong>`;
    if (p.length > 2 && p.startsWith("*") && p.endsWith("*")) return html`<em key=${i}>${p.slice(1, -1)}</em>`;
    return p;
  });
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

const VIEWS = [["accueil", "Accueil", ""], ["notions", "Notions clés", "1"], ["frise", "Frise", "2"], ["parcours", "Parcours des textes", "3"], ["liens", "Liens", "4"], ["quiz", "Quiz", "5"]];

function parseHash() {
  const h = (location.hash || "").replace("#", "");
  if (h.startsWith("parcours-") && SEC[h.slice(9)]) return { view: "parcours", sec: h.slice(9) };
  if (VIEWS.some(v => v[0] === h)) return { view: h, sec: null };
  return { view: "accueil", sec: null };
}

function App() {
  const init = parseHash();
  const [view, setView] = useState(init.view);
  const [sec, setSec] = useState(init.sec || "romantisme");
  useEffect(() => {
    const on = () => { const p = parseHash(); setView(p.view); if (p.sec) setSec(p.sec); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  const go = (v, s) => {
    const target = v === "parcours" ? `parcours-${s || sec}` : v;
    if (s) setSec(s);
    setView(v);
    try { if (location.hash.slice(1) !== target) location.hash = target; } catch (e) {}
    window.scrollTo(0, 0);
  };
  return html`
    <header className="top"><div className="top-in">
      <button className="brand" onClick=${() => go("accueil")}>De Hugo <i>à</i> Breton</button>
      <nav className="tabs" aria-label="Sections">
        ${VIEWS.slice(1).map(([id, label, n]) => html`<button key=${id} className="tab" aria-current=${view === id ? "page" : undefined} onClick=${() => go(id)}><span className="step">${n}</span>${label}</button>`)}
      </nav>
    </div></header>
    <main>
      ${view === "accueil" && html`<${Accueil} go=${go} />`}
      ${view === "notions" && html`<${Notions} go=${go} />`}
      ${view === "frise" && html`<${Frise} go=${go} />`}
      ${view === "parcours" && html`<${Parcours} sec=${sec} go=${go} />`}
      ${view === "liens" && html`<${Liens} go=${go} />`}
      ${view === "quiz" && html`<${Quiz} go=${go} />`}
    </main>
    <footer>Corpus pour l'oral du bac de français · textes vérifiés le 7 novembre 2026 · les dates des auteurs sont données à titre de repère.</footer>`;
}

function Ribbon({ go }) {
  return html`<div className="ribbon" role="list">
    ${SECTIONS.map(s => html`<button key=${s.id} role="listitem" style=${mc(s.id)} onClick=${() => go("parcours", s.id)}>
      <span className="n">${s.short}</span><span className="d num">${s.period}</span></button>`)}
  </div>`;
}

function Accueil({ go }) {
  const steps = [
    ["notions", "1", "Les notions clés", "Les mots du métier (sonnet, allégorie, synesthésie…) avant de lire les textes. 10 minutes."],
    ["frise", "2", "La frise", "Situer les mouvements et les auteurs dans le temps, un mouvement à la fois."],
    ["parcours", "3", "Le parcours des textes", "Huit étapes. Pour chacune : le mouvement, les auteurs, puis le texte avec son analyse vers par vers."],
    ["quiz", "5", "Le quiz", "S'entraîner à retrouver les notions de mémoire. Les erreurs reviennent jusqu'à être sues."]
  ];
  return html`
    <section className="hero">
      <p className="eyebrow">Oral du bac de français · la poésie du XIXᵉ au XXᵉ siècle</p>
      <h1>De Hugo <em>à</em> Breton</h1>
      <p className="dates num">1820 — 1924 · onze textes, huit étapes</p>
      <p className="lead">Chaque mouvement se construit contre le précédent. Le romantisme dit le « moi », le Parnasse le refuse, le symbolisme préfère la musique à la description, Dada fait table rase et le surréalisme libère l'inconscient. Clique sur une étape pour l'ouvrir.</p>
      <${Ribbon} go=${go} />
    </section>
    <section style=${{ display: "grid", gap: "14px" }}>
      <h2 style=${{ fontSize: "28px" }}>Comment travailler</h2>
      <div className="path">
        ${steps.map(([v, k, t, d]) => html`<button key=${v} onClick=${() => go(v, v === "parcours" ? "romantisme" : null)}>
          <span className="k">Étape ${k}</span><h3>${t}</h3><p>${d}</p></button>`)}
      </div>
    </section>
    <details className="design">
      <summary>Comment cette application est conçue (théorie de la charge cognitive et apprentissage multimédia)</summary>
      <ul>
        <li><strong>Pré-entraînement</strong> : les notions clés sont apprises avant les textes, pour que la lecture des analyses ne sature pas la mémoire de travail.</li>
        <li><strong>Segmentation</strong> : une étape, puis une sous-étape à la fois (mouvement, auteurs, texte), au rythme de l'élève.</li>
        <li><strong>Signalement</strong> : un code couleur par mouvement, identique dans la frise, le parcours et le quiz ; trois points « À retenir » par étape.</li>
        <li><strong>Contiguïté spatiale</strong> : l'analyse est placée à côté du poème, et les vers concernés s'éclairent quand on choisit une remarque.</li>
        <li><strong>Cohérence</strong> : pas d'images décoratives ni de son, seulement ce qui sert à comprendre.</li>
        <li><strong>Charge extrinsèque réduite</strong> : la frise n'affiche les auteurs que du mouvement choisi.</li>
        <li><strong>Personnalisation</strong> : un ton direct, au tutoiement, proche de l'oral.</li>
        <li><strong>Effet de test</strong> : le quiz fait retrouver les notions de mémoire, mélange les mouvements (entrelacement), explique chaque réponse et fait revenir les erreurs.</li>
      </ul>
    </details>`;
}

const Y0 = 1760, Y1 = 1995, K = 5.4, PAD = 30;
const X = y => PAD + (y - Y0) * K;
const FW = X(Y1) + PAD;

function Frise({ go }) {
  const [focus, setFocus] = useState(null);
  const [all, setAll] = useState(false);
  const [pick, setPick] = useState(null);
  const scroller = useRef(null);
  useEffect(() => { if (scroller.current) scroller.current.scrollLeft = X(1795); }, []);

  const evRows = useMemo(() => {
    const ends = []; return EVENTS.map(([y, l]) => {
      const x = X(y), w = (String(y).length + l.length + 1) * 6.6 + 14;
      let r = ends.findIndex(e => e < x); if (r < 0) { r = ends.length; ends.push(0); }
      ends[r] = x + w; return { y, l, x, r };
    });
  }, []);
  const nEvRows = Math.max(...evRows.map(e => e.r)) + 1;
  const axisH = 26, evTop = axisH + 8, lanesTop = evTop + nEvRows * 20 + 14;

  let yy = lanesTop;
  const lanes = SECTIONS.map(s => {
    const open = all || focus === s.id;
    const authors = [...s.auteurs].sort((a, b) => a[1] - b[1]);
    const top = yy; yy += 32 + (open ? authors.length * 24 + 8 : 0);
    return { s, open, authors, top };
  });
  const H = yy + 10;
  const ticks = []; for (let y = 1760; y <= 1980; y += 20) ticks.push(y);
  const toggle = id => { setFocus(focus === id ? null : id); setPick(null); };
  const fs = focus && SEC[focus];

  return html`
    <section style=${{ display: "grid", gap: "10px" }}>
      <p className="eyebrow">Étape 2 · Se repérer</p>
      <h2 style=${{ fontSize: "clamp(30px,4.5vw,46px)" }}>La frise chronologique</h2>
      <p className="lead">Chaque bande colorée montre la période active d'un mouvement. Choisis un mouvement pour afficher la vie de ses auteurs ; clique sur un auteur pour voir ses repères. La zone hachurée est la Première Guerre mondiale.</p>
    </section>
    <div className="frise-wrap">
      <div className="frise-tools">
        ${SECTIONS.map(s => html`<button key=${s.id} className="chip" style=${mc(s.id)} aria-pressed=${focus === s.id} onClick=${() => toggle(s.id)}>${s.short}</button>`)}
        <button className="chip" aria-pressed=${all} onClick=${() => { setAll(!all); setPick(null); }}>${all ? "Masquer les auteurs" : "Tous les auteurs"}</button>
      </div>
      <div className="frise-scroll" ref=${scroller}>
        <div className="frise" style=${{ width: FW + "px", height: H + "px" }}>
          ${ticks.map(y => html`<div key=${"g" + y} className="gridline" style=${{ left: X(y) + "px" }}></div>`)}
          <div className="war" style=${{ left: X(1914) + "px", width: (X(1918) - X(1914)) + "px" }} title="Première Guerre mondiale, 1914-1918"></div>
          ${fs && html`<div className="focusband" style=${{ ...mc(fs.id), left: X(fs.span[0]) + "px", width: (X(fs.span[1]) - X(fs.span[0])) + "px" }}></div>`}
          ${ticks.map(y => html`<span key=${"t" + y} className="axis-t num" style=${{ left: X(y) + "px", top: "6px" }}>${y}</span>`)}
          ${evRows.map(e => html`<span key=${"e" + e.y} className="ev" style=${{ left: e.x + "px", top: (evTop + e.r * 20) + "px" }}><b>${e.y}</b> ${e.l}</span>`)}
          ${lanes.map(({ s, open, authors, top }) => html`<div key=${s.id} style=${mc(s.id)}>
            <button className="band" style=${{ left: X(s.span[0]) + "px", width: Math.max(8, X(s.span[1]) - X(s.span[0])) + "px", top: (top + 4) + "px" }} aria-label=${`${s.short}, ${s.period}`} onClick=${() => toggle(s.id)}></button>
            <button className="band-l" style=${{ left: (X(s.span[1]) + 4) + "px", top: (top + 4) + "px" }} aria-expanded=${open} onClick=${() => toggle(s.id)}>${s.short} <small className="num">${s.period} · ${authors.length} auteurs</small></button>
            ${open && authors.map(([n, b, d, r], i) => html`<button key=${n} className="life num ${pick && pick.n === n && pick.s === s.id ? "sel" : ""}"
                style=${{ left: X(b) + "px", width: (X(d) - X(b)) + "px", top: (top + 34 + i * 24) + "px" }}
                onClick=${() => setPick({ n, b, d, r, s: s.id })}>${n} ${b}–${d}</button>`)}
          </div>`)}
        </div>
      </div>
      <div className="detail" aria-live="polite">
        ${pick ? html`<div style=${mc(pick.s)}>
            <p className="eyebrow" style=${{ color: "var(--mc)" }}>${SEC[pick.s].short}</p>
            <p className="who">${pick.n} <span className="num" style=${{ fontFamily: "var(--body)", fontSize: "16px", color: "var(--muted)" }}>${pick.b} – ${pick.d} · mort à ${pick.d - pick.b} ans</span></p>
            <p>${rich(pick.r)}</p>
          </div>`
          : fs ? html`<p><strong>${fs.short}</strong> <span className="num">(${fs.period})</span> : ${rich(fs.retenir[0])} <button className="btn" style=${{ marginLeft: "8px", padding: "4px 10px", fontSize: "14px" }} onClick=${() => go("parcours", fs.id)}>Ouvrir l'étape →</button></p>`
          : html`<p className="hint">Choisis un mouvement ci-dessus ou sur la frise pour afficher ses auteurs.</p>`}
      </div>
    </div>`;
}

function Parcours({ sec, go }) {

  const [ti, setTi] = useState(0);
  const [pt, setPt] = useState(null);

      ${step === 2 && html`<div style=${{ display: "grid", gap: "16px" }}>
        ${s.textes.length > 1 && html`<div className="textsel">${s.textes.map((t, i) => html`<button key=${i} className="stepbtn" aria-current=${ti === i ? "step" : undefined} onClick=${() => setTi(i)}>${t.titre}</button>`)}</div>`}
        <${Reading} t=${s.textes[ti] || s.textes[0]} pt=${pt} setPt=${setPt} />
      </div>`}
      <div className="pager">
        ${step > 0 ? html`<button className="btn" onClick=${() => setStep(step - 1)}>← ${stepNames[step - 1]}</button>`
          : prev ? html`<button className="btn" onClick=${() => go("parcours", prev.id)}>← ${prev.short}</button>` : html`<span></span>`}
        ${step < 2 ? html`<button className="btn primary" onClick=${() => setStep(step + 1)}>${stepNames[step + 1]} →</button>`
          : next ? html`<button className="btn primary" onClick=${() => go("parcours", next.id)}>Étape suivante : ${next.short} →</button>`
          : html`<button className="btn primary" onClick=${() => go("liens")}>Faire les liens →</button>`}
      </div>
    </article>
  </div>`;
}

function Reading({ t, pt, setPt }) {
  const lines = []; t.strophes.forEach((st, si) => st.forEach(l => lines.push({ l, si })));
  const active = pt !== null && t.analyse[pt] ? new Set(t.analyse[pt].v) : new Set();
  const unit = t.prose ? "§" : "v.";
  let k = 0;
  return html`<div className="reading">
    <section className="poem" aria-label="Texte">
      <h3>${t.titre}</h3>
      <p className="ref">${rich(t.ref)}</p>
      ${t.source && html`<p className="src">Texte vérifié sur <a href=${t.source[1]} target="_blank" rel="noopener">${t.source[0]}</a></p>`}
      ${t.dedicace && html`<p className="dedic">${t.dedicace}</p>`}
      ${t.strophes.map((st, si) => html`<div key=${si} className="stanza">
        ${st.map((l) => { k++; const n = k; return html`<div key=${n} className="vl ${t.prose ? "prose-p" : ""} ${active.has(n) ? "hi" : ""}"><span className="vn">${t.prose ? "§" + n : (n % 5 === 0 || n === 1 ? n : "")}</span><span>${l}</span></div>`; })}
      </div>`)}
    </section>
    <section className="points" aria-label="Analyse">
      <p className="hint">Choisis une remarque : les ${t.prose ? "passages" : "vers"} concernés s'éclairent dans le texte.</p>
      ${t.analyse.map((a, i) => {
        const on = pt === i;
        return html`<button key=${i} className="point" aria-pressed=${on} onClick=${() => setPt(on ? null : i)}>
          <h4>${a.t}</h4>
          ${a.v.length > 0 && html`<span className="vrefs num">${unit} ${a.v.join(", ")}</span>`}
          <span>${rich(a.d)}</span>
          ${on && a.v.length > 0 && !t.prose && html`<blockquote>${a.v.map(n => html`<div key=${n}>${lines[n - 1] ? lines[n - 1].l : ""}</div>`)}</blockquote>`}
        </button>`;
      })}
    </section>
  </div>`;
}

function Liens({ go }) {
  return html`
    <section style=${{ display: "grid", gap: "10px" }}>
      <p className="eyebrow">Étape 4 · Relier</p>
      <h2 style=${{ fontSize: "clamp(30px,4.5vw,46px)" }}>Faire les liens</h2>
      <p className="lead">À l'entretien, on attend des rapprochements. Voici les plus utiles, d'abord avec le <em>Cahier de Douai</em> de Rimbaud, puis entre les textes du corpus.</p>
    </section>
    <section className="panel" style=${{ display: "grid", gap: "12px" }}>
      <h3 style=${{ fontSize: "24px" }}>Avec Rimbaud et le <em>Cahier de Douai</em></h3>
      <p className="lead">En septembre-octobre 1870, Rimbaud, 16 ans, recopie 22 poèmes chez le poète Paul Demeny, à Douai. En 1871, dans la « lettre du Voyant », il écrit : « Baudelaire est le premier voyant, roi des poètes, un vrai Dieu. »</p>
      <div className="tscroll"><table className="t">
        <thead><tr><th>Texte du corpus</th><th>Poème du <em>Cahier de Douai</em></th><th>Le lien à faire</th></tr></thead>
        <tbody>${LIENS_DOUAI.map(([a, b, c], i) => html`<tr key=${i}><td><strong>${a}</strong></td><td>${b}</td><td>${rich(c)}</td></tr>`)}</tbody>
      </table></div>
    </section>
    <section style=${{ display: "grid", gap: "12px" }}>
      <h3 style=${{ fontSize: "24px" }}>Six rapprochements entre les textes</h3>
      <div className="ngrid">${RAPPROCHEMENTS.map(([t, d]) => html`<article key=${t} className="ncard"><h3>${t}</h3><p className="def">${rich(d)}</p></article>`)}</div>
    </section>
    <section className="panel" style=${{ display: "grid", gap: "12px" }}>
      <h3 style=${{ fontSize: "24px" }}>Le fil conducteur en une minute</h3>
      <div className="chain">${SECTIONS.map((s, i) => html`<${React.Fragment} key=${s.id}>${i > 0 && html`<span className="arr">→</span>`}<span className="m" style=${mc(s.id)}>${s.short}</span><//>`)}</div>
      <ul style=${{ margin: 0, paddingLeft: "20px", display: "grid", gap: "6px" }}>
        ${FIL.map(([id, t]) => html`<li key=${id}><strong style=${{ color: `var(--c-${id})` }}>${SEC[id].short}</strong> ${rich(t)}</li>`)}
      </ul>
      <div className="row"><button className="btn primary" onClick=${() => go("quiz")}>Me tester avec le quiz →</button></div>
    </section>`;
}

const CATS = ["Tout", "Mouvements", "Auteurs et œuvres", "Qui a écrit ?", "Notions", "Liens"];
function Quiz({ go }) {
  const [phase, setPhase] = useState("setup");
  const [cat, setCat] = useState("Tout");
  const [len, setLen] = useState(10);
  const [items, setItems] = useState([]);
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [res, setRes] = useState([]);
  const [errs, setErrs] = useState(() => store.get("hugo-breton-erreurs", []));

  const start = (mode) => {
    let pool = QUIZ.map((q, id) => ({ ...q, id }));
    if (mode === "errs") pool = pool.filter(q => errs.includes(q.id));
    else if (cat !== "Tout") pool = pool.filter(q => q.c === cat);
    pool = shuffle(pool).slice(0, mode === "errs" ? pool.length : (len === 0 ? pool.length : len));
    setItems(pool.map(q => ({ ...q, opts: shuffle(q.a.map((t, k) => ({ t, ok: k === 0 }))) })));
    setI(0); setPicked(null); setRes([]); setPhase("play");
  };
  const answer = (k) => {
    if (picked !== null) return;
    const q = items[i], ok = q.opts[k].ok;
    setPicked(k); setRes([...res, { q, ok, k }]);
    const ne = ok ? errs.filter(e => e !== q.id) : (errs.includes(q.id) ? errs : [...errs, q.id]);
    setErrs(ne); store.set("hugo-breton-erreurs", ne);
  };
  const nextQ = () => { if (i + 1 >= items.length) setPhase("end"); else { setI(i + 1); setPicked(null); } };

  if (phase === "setup") {
    const n = cat === "Tout" ? QUIZ.length : QUIZ.filter(q => q.c === cat).length;
    return html`<section className="quiz">
      <p className="eyebrow">Étape 5 · S'entraîner</p>
      <h2 style=${{ fontSize: "clamp(30px,4.5vw,46px)" }}>Le quiz</h2>
      <p className="lead">${QUIZ.length} questions sur les mouvements, les auteurs, les vers à reconnaître, les notions et les liens. Les questions sont mélangées : c'est plus difficile, mais on retient mieux. Chaque réponse est expliquée.</p>
      <div className="setup panel">
        <div style=${{ display: "grid", gap: "8px" }}><strong>Thème</strong>
          <div className="choice">${CATS.map(c => html`<button key=${c} className="chip" aria-pressed=${cat === c} onClick=${() => setCat(c)}>${c}</button>`)}</div></div>
        <div style=${{ display: "grid", gap: "8px" }}><strong>Nombre de questions</strong>
          <div className="choice">${[[10, "10"], [20, "20"], [0, `Toutes (${n})`]].map(([v, l]) => html`<button key=${v} className="chip" aria-pressed=${len === v} onClick=${() => setLen(v)}>${l}</button>`)}</div></div>
        <div className="row">
          <button className="btn primary" onClick=${() => start("all")}>Commencer</button>
          ${errs.length > 0 && html`<button className="btn" onClick=${() => start("errs")}>Revoir mes erreurs (${errs.length})</button>`}
        </div>
      </div>
    </section>`;
  }
  if (phase === "end") {
    const score = res.filter(r => r.ok).length, wrong = res.filter(r => !r.ok);
    const msg = score === res.length ? "Parfait. Tu peux passer au thème suivant." : score / res.length >= .7 ? "Bien. Revois les erreurs ci-dessous, elles reviendront dans « Revoir mes erreurs »." : "Reprends le parcours des étapes concernées, puis refais le quiz.";
    return html`<section className="quiz">
      <p className="eyebrow">Résultat</p>
      <p className="score num">${score} / ${res.length}</p>
      <p className="lead">${msg}</p>
      ${wrong.length > 0 && html`<div className="errlist">${wrong.map(({ q }, j) => html`<div key=${j} className="e">
        <p><strong>${rich(q.q)}</strong>${q.quote ? html` <em>« ${q.quote} »</em>` : ""}</p>
        <p>Bonne réponse : ${rich(q.a[0])}</p>
        <p className="hint">${rich(q.e)} <button className="btn" style=${{ padding: "2px 10px", fontSize: "13px" }} onClick=${() => go("parcours", q.s)}>Revoir : ${SEC[q.s].short}</button></p>
      </div>`)}</div>`}
      <div className="row">
        <button className="btn primary" onClick=${() => start("all")}>Nouvelle série</button>
        ${errs.length > 0 && html`<button className="btn" onClick=${() => start("errs")}>Revoir mes erreurs (${errs.length})</button>`}
        <button className="btn" onClick=${() => setPhase("setup")}>Changer de thème</button>
      </div>
    </section>`;
  }
  const q = items[i];
  const ok = picked !== null && q.opts[picked].ok;
  return html`<section className="quiz" style=${mc(q.s)}>
    <div className="qmeta"><span>${q.c} · <span style=${{ color: "var(--mc)", fontWeight: 700 }}>${SEC[q.s].short}</span></span><span className="num">Question ${i + 1} / ${items.length}</span></div>
    <div className="bar"><i style=${{ width: `${(i / items.length) * 100}%` }}></i></div>
    ${q.quote && html`<p className="qquote">« ${q.quote} »</p>`}
    <p className="qtext">${rich(q.q)}</p>
    <div className="opts">${q.opts.map((o, k) => {
      const cls = picked === null ? "" : o.ok ? "ok" : (k === picked ? "ko" : "");
      return html`<button key=${k} className="opt ${cls}" disabled=${picked !== null} onClick=${() => answer(k)}><span className="l">${"ABCD"[k]}</span><span>${rich(o.t)}</span></button>`;
    })}</div>
    ${picked !== null && html`<div className="fb ${ok ? "ok" : "ko"}" aria-live="polite">
      <strong className="v">${ok ? "Bonne réponse." : "Pas tout à fait."}</strong>
      ${!ok && html`<p>La bonne réponse : ${rich(q.a[0])}</p>`}
      <p>${rich(q.e)}</p>
      <div className="row"><button className="btn primary" onClick=${nextQ}>${i + 1 >= items.length ? "Voir mon résultat" : "Question suivante →"}</button></div>
    </div>`}
  </section>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
