<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conjugaison : comprendre, mémoriser, utiliser</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --window: #eff0f1;
  --view: #fcfcfc;
  --card: #ffffff;
  --text: #232629;
  --muted: #5b646d;
  --border: #d1d5d9;
  --border-strong: #bdc3c7;
  --blue: #3daee9;
  --blue-dark: #1a72a8;
  --blue-soft: #e3f2fb;
  --blue-sel: #cfe8f7;
  --green: #27ae60;
  --green-dark: #1e7d46;
  --red: #da4453;
  --red-dark: #b0303e;
  --orange: #f67400;
  --orange-dark: #a34d00;
  --orange-soft: #fdf0e3;
  --radius: 5px;
  --shadow: 0 1px 2px rgba(35, 38, 41, 0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Noto Sans', 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background: var(--window);
  line-height: 1.5;
  font-size: 1rem;
}
button, input, select { font: inherit; color: inherit; }
.app.airy { letter-spacing: 0.04em; word-spacing: 0.12em; line-height: 1.8; }
.app.airy p, .app.airy li { line-height: 1.8; }

/* Barre de titre */
.titlebar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  height: 46px; padding: 0 14px;
  background: var(--window); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.title-tools { display: flex; gap: 4px; }
.tool {
  border: 1px solid transparent; background: transparent; border-radius: 4px;
  padding: 3px 9px; cursor: pointer; font-size: 0.875rem;
}
.tool:hover { background: var(--blue-soft); border-color: var(--blue); }
.tool.on { background: var(--blue-sel); border-color: var(--blue); }

.body { display: flex; min-height: calc(100vh - 46px); }
.sidebar {
  width: 220px; flex: none; padding: 10px 8px;
  background: var(--window); border-right: 1px solid var(--border);
  position: sticky; top: 46px; align-self: flex-start; height: calc(100vh - 46px); overflow-y: auto;
}
.nav-group { margin-bottom: 10px; }
.nav-head { font-size: 0.78rem; color: var(--muted); padding: 6px 10px 3px; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border: 1px solid transparent; border-radius: 4px;
  background: transparent; cursor: pointer; text-align: left;
}
.nav-item:hover { background: var(--blue-soft); }
.nav-item.on { background: var(--blue-sel); border-color: var(--blue); }
.ico { flex: none; }

.view { flex: 1; background: var(--view); min-width: 0; }
.content { max-width: 1060px; margin: 0 auto; padding: 22px 28px 60px; }

.page-title { font-size: 1.5rem; font-weight: 600; margin: 10px 0 6px; }
.lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.section-title { font-size: 1.1rem; margin: 26px 0 10px; }
h3 { font-size: 1.05rem; margin: 0 0 10px; font-weight: 600; }
h4 { font-size: 0.98rem; margin: 16px 0 8px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.row { display: flex; align-items: center; }
.row.right { justify-content: flex-end; margin-top: 10px; }
.row.center { justify-content: center; }
.gap { gap: 8px; }
.wrap { flex-wrap: wrap; }
.end-row { margin-top: 20px; }
.small-gap { margin: 10px 0 14px; }
.scroll-x { overflow-x: auto; }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
}

/* Boutons Breeze */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px; min-height: 34px;
  background: linear-gradient(#fcfcfc, #f4f5f6); border: 1px solid var(--border-strong);
  border-radius: 4px; cursor: pointer;
}
.btn:hover { border-color: var(--blue); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--blue-soft); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-sel); }
.btn.flat { background: transparent; border-color: transparent; }
.btn.flat:hover { background: var(--blue-soft); border-color: var(--blue); }
.btn.again:hover { border-color: var(--orange); background: var(--orange-soft); }
.btn.big { padding: 9px 20px; font-size: 1.05rem; }
.link { background: none; border: none; color: var(--blue-dark); cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

/* Segmented / chips */
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button { border: none; border-right: 1px solid var(--border); background: transparent; padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.seg button:last-child { border-right: none; }
.seg button:hover { background: var(--blue-soft); }
.seg button.on { background: var(--blue-sel); box-shadow: inset 0 -2px 0 var(--blue); }
.seg.small button { padding: 3px 12px; }
.seg button.ok { background: #dff3e7; box-shadow: inset 0 -2px 0 var(--green); }
.seg button.ko { background: #fbe3e5; box-shadow: inset 0 -2px 0 var(--red); }
.count { font-size: 0.75rem; background: var(--window); border-radius: 8px; padding: 0 7px; color: var(--muted); }
.count.full { background: #dff3e7; color: var(--green-dark); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.chip { border: 1px solid var(--border-strong); background: #fff; border-radius: 14px; padding: 3px 12px; cursor: pointer; font-size: 0.9rem; }
.chip:hover { border-color: var(--blue); }
.chip.on { background: var(--blue-sel); border-color: var(--blue); }
.tag { display: inline-block; font-size: 0.78rem; border: 1px solid var(--border); background: var(--window); border-radius: 3px; padding: 0 7px; margin-left: 8px; color: var(--muted); vertical-align: middle; }
.tag.hint { background: var(--orange-soft); border-color: #f3c99d; color: var(--orange-dark); }
.badge { background: var(--blue-dark); color: #fff; font-size: 0.78rem; padding: 2px 9px; border-radius: 3px; font-weight: 600; }

/* Code couleur */
.rad { color: var(--text); }
.end { color: var(--blue-dark); background: var(--blue-soft); border-radius: 2px; padding: 0 1px; font-weight: 600; }
.aux { color: var(--orange-dark); background: var(--orange-soft); border-radius: 3px; padding: 0 2px; font-weight: 600; }
.pp { font-weight: 500; }
.legend { display: flex; gap: 28px; flex-wrap: wrap; font-size: 1.05rem; }
.legend > span { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.legend > span > span { font-size: 1.15rem; }

/* Messages (KMessageWidget) */
.msg { display: flex; gap: 10px; align-items: flex-start; border: 1px solid; border-radius: var(--radius); padding: 9px 12px; margin: 10px 0; }
.msg .ico { margin-top: 2px; }
.msg-title { font-weight: 600; }
.msg-info { background: #e8f5fc; border-color: var(--blue); }
.msg-info .ico { color: var(--blue-dark); }
.msg-tip { background: #e8f5fc; border-color: var(--blue); }
.msg-tip .ico { color: var(--blue-dark); }
.msg-positive { background: #e6f5ec; border-color: var(--green); }
.msg-positive .ico { color: var(--green-dark); }
.msg-negative { background: #fbe9eb; border-color: var(--red); }
.msg-negative .ico { color: var(--red-dark); }
.msg-warning { background: #fff3e6; border-color: var(--orange); }
.msg-warning .ico { color: var(--orange-dark); }
.msg ul { margin: 4px 0 0; padding-left: 18px; }
.msg li { margin: 3px 0; }

/* Tableaux */
table { border-collapse: collapse; }
.conj { width: 100%; }
.conj td { padding: 7px 10px; border-bottom: 1px solid #eceef0; font-size: 1.12rem; }
.conj tr:last-child td { border-bottom: none; }
.conj .pron { color: var(--muted); width: 1%; white-space: nowrap; text-align: right; font-size: 1rem; }
.conj.compact td { padding: 3px 8px; font-size: 1rem; }
.conj.compact .pron { font-size: 0.9rem; }
.conj.practice .row-ok td { background: #eef8f2; }
.conj.practice .row-ko td { background: #fdf0f1; }
.slot { border: none; border-bottom: 2px solid var(--blue); background: var(--blue-soft); padding: 1px 4px; color: var(--blue-dark); font-weight: 600; border-radius: 3px 3px 0 0; }
.slot:focus { outline: none; background: var(--blue-sel); }
.fix { margin-left: 12px; font-size: 0.95rem; color: var(--muted); }
.score { color: var(--muted); }
.score.good { color: var(--green-dark); font-weight: 600; }
.ends { border: 1px solid var(--border); min-width: 100%; }
.ends th, .ends td { border: 1px solid var(--border); padding: 5px 12px; text-align: center; }
.ends th { background: var(--window); font-weight: 600; font-size: 0.9rem; }
.ends th small { display: block; font-weight: 400; color: var(--muted); }
.ends .pron { text-align: right; color: var(--muted); background: #fafbfb; white-space: nowrap; }
.ends.map td { text-align: left; }
.ends .arrow { color: var(--muted); text-align: center; }
.formula { background: var(--window); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0 4px 4px 0; font-weight: 500; }

/* Leçons */
.lesson-grid > .col { min-width: 0; }
.lesson-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: start; }
.examples { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-style: italic; }
.models { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.model { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.model-head { background: var(--window); padding: 3px 10px; font-weight: 600; border-bottom: 1px solid var(--border); }
.traps { padding-left: 18px; }

/* Repères */
.stepper { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.stepper-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); background: #fff; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.stepper-item:hover { border-color: var(--blue); }
.stepper-item.on { background: var(--blue-sel); border-color: var(--blue); }
.stepper-num { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--window); border: 1px solid var(--border-strong); font-size: 0.8rem; }
.stepper-item.on .stepper-num { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }
.stepper-item.done .stepper-num { background: #dff3e7; border-color: var(--green); color: var(--green-dark); }
.big-split { display: flex; gap: 4px; justify-content: center; margin: 14px 0 18px; font-size: 2.3rem; }
.big-split > div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.big-split small { font-size: 0.8rem; color: var(--muted); max-width: 16ch; text-align: center; }
.groups, .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
.group-card, .mode-card { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; background: #fafbfb; }
.group-card small, .mode-card em { color: var(--muted); }
.mode-card strong { color: var(--blue-dark); }
.sorter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 5px 0; border-bottom: 1px solid #eceef0; }
.sorter-verb { width: 80px; }
.txt-ok { color: var(--green-dark); }
.txt-ko { color: var(--red-dark); }
.timeline { width: 100%; min-width: 620px; height: auto; }
.tl-axis { font-size: 13px; fill: var(--muted); font-style: italic; }
.tl-now { font-size: 12px; fill: #fff; font-weight: 600; }
.tl-label { font-size: 13px; fill: var(--text); }
.tl-label.strong { font-weight: 700; }
.tl-small { font-size: 11.5px; fill: var(--muted); }

/* Accueil */
.path { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
.path-step { text-align: left; border: 1px solid var(--border); background: #fff; border-radius: var(--radius); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); }
.path-step:hover { border-color: var(--blue); }
.path-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-dark); color: #fff; font-weight: 600; font-size: 0.85rem; }
.path-title { font-weight: 600; font-size: 1.05rem; }
.path-text { color: var(--muted); font-size: 0.92rem; }

/* Tableaux page */
.toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.field { display: flex; gap: 8px; align-items: center; }
.select { padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; min-height: 34px; }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch-track { width: 36px; height: 20px; border-radius: 10px; background: #c8ccd0; position: relative; transition: background 0.15s; }
.switch-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left 0.15s; }
.switch input:checked + .switch-track { background: var(--blue); }
.switch input:checked + .switch-track::after { left: 18px; }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--blue); outline-offset: 2px; }
.table-card { max-width: 560px; }
.table-head { display: flex; align-items: center; justify-content: space-between; }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card.mini { padding: 10px 12px; margin: 0; }
.card.mini h4 { margin: 0 0 6px; }

/* Exercices */
.fam-list { display: flex; flex-direction: column; gap: 8px; }
.fam { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--border); background: #fff; border-radius: var(--radius); padding: 12px 16px; cursor: pointer; box-shadow: var(--shadow); }
.fam:hover { border-color: var(--blue); }
.fam-num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue-dark); font-weight: 700; border: 1px solid var(--blue); }
.fam-body { flex: 1; display: flex; flex-direction: column; }
.fam-title { font-weight: 600; }
.fam-goal { color: var(--muted); font-size: 0.9rem; }
.fam-meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.worked { border-left: 3px solid var(--blue-dark); }
.worked-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.statement { font-size: 1.08rem; }
.steps { margin: 8px 0; padding-left: 22px; }
.steps li { margin: 6px 0; }
.worked-steps li { padding: 4px 0; }
.step-label { display: block; font-weight: 600; font-size: 0.92rem; color: var(--blue-dark); }
.fade-in { animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
.level-name { margin: 8px 0 10px; }
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.item-ok { border-left: 3px solid var(--green); }
.item-ko { border-left: 3px solid var(--orange); }
.item-q { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 1.08rem; }
.num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--window); border: 1px solid var(--border-strong); font-size: 0.8rem; color: var(--muted); }
.options { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.options.col2 { display: grid; grid-template-columns: 1fr 1fr; }
.opt { border: 1px solid var(--border-strong); background: linear-gradient(#fcfcfc, #f4f5f6); border-radius: 4px; padding: 6px 14px; cursor: pointer; min-height: 36px; }
.opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
.opt:disabled { cursor: default; color: var(--muted); }
.opt.opt-ok { background: #dff3e7; border-color: var(--green); color: var(--text); font-weight: 600; }
.opt.opt-ko { background: #fbe3e5; border-color: var(--red); color: var(--text); text-decoration: line-through; }
.mono { font-variant-numeric: tabular-nums; }
.blank { display: inline-block; min-width: 3ch; border-bottom: 2px solid var(--blue); background: var(--blue-soft); color: var(--blue-dark); font-weight: 600; padding: 0 3px; }
.blank.ok { border-color: var(--green); background: #dff3e7; color: var(--green-dark); }
.blank.ko { border-color: var(--red); background: #fbe3e5; color: var(--red-dark); }
.transform { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.transform .src { font-style: italic; }
.transform .tag { margin-left: 0; }
.sentence { line-height: 2.1; }
.prefix { color: var(--muted); margin-right: 6px; }
.inline-input { border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 8px; background: #fff; max-width: 100%; }
.inline-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(61,174,233,.25); }
.inline-input.st-ok { border-color: var(--green); background: #eef8f2; }
.inline-input.st-ko { border-color: var(--red); background: #fdf0f1; }
.inline-input.st-accent { border-color: var(--orange); background: #fff7ee; }
.inline-input:disabled { color: var(--text); }
.accents { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.key { min-width: 32px; height: 30px; border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; cursor: pointer; }
.key:hover { border-color: var(--blue); background: var(--blue-soft); }
.correction { border-top: 1px dashed var(--border-strong); margin-top: 10px; padding-top: 8px; }
.corr-simple { margin-bottom: 3px; }

/* Cartes */
.deck-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.deck { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 1px solid var(--border); background: #fff; border-radius: var(--radius); padding: 14px; cursor: pointer; box-shadow: var(--shadow); }
.deck:hover { border-color: var(--blue); }
.deck .ico { color: var(--blue-dark); }
.progress { height: 6px; background: #e3e5e7; border-radius: 3px; overflow: hidden; margin: 10px 0 16px; }
.progress > div { height: 100%; background: var(--blue); transition: width 0.2s; }
.flashcard { width: 100%; max-width: 480px; min-height: 220px; margin: 0 auto 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(35,38,41,.08); padding: 20px; }
.flashcard:hover { border-color: var(--blue); }
.flashcard.flipped { background: #f7fbfe; border-color: var(--blue); }
.fc-front { font-size: 1.15rem; font-weight: 600; }
.fc-sub { color: var(--muted); font-size: 1.05rem; }
.fc-back { font-size: 1.6rem; color: var(--blue-dark); font-weight: 600; text-align: center; }
.fc-hint { color: var(--muted); font-size: 0.85rem; margin-top: 16px; }

/* Quiz */
.quiz-head { display: flex; align-items: baseline; justify-content: space-between; }
.quiz-prompt { font-size: 1.15rem; margin: 0 0 6px; }
.result { text-align: center; }
.score-big { font-size: 3rem; font-weight: 700; color: var(--blue-dark); }
.score-big small { font-size: 1.3rem; color: var(--muted); }
.review li { margin: 6px 0; }

/* Mobile */
@media (max-width: 820px) {
  .body { flex-direction: column; }
  .sidebar { position: sticky; top: 46px; z-index: 4; width: 100%; height: auto; display: flex; overflow-x: auto; padding: 6px; border-right: none; border-bottom: 1px solid var(--border); gap: 2px; }
  .nav-group { display: flex; margin: 0; }
  .nav-head { display: none; }
  .nav-item { white-space: nowrap; width: auto; padding: 6px 10px; }
  .content { padding: 14px 14px 50px; }
  .lesson-grid { grid-template-columns: minmax(0,1fr); }
  .options.col2 { grid-template-columns: 1fr; }
  .big-split { font-size: 1.8rem; }
}
