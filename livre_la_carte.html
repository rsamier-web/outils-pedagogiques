<style>
/* Mise en page : une colonne de lecture (téléphone) ; illustration à gauche et texte à droite au-delà de 980px ; commandes de lecture ancrées en bas. */
:root {
  --bg: #edf0ea;          /* pierre claire teintée de vert */
  --surface: #fbfcf8;
  --fg: #1d2420;
  --muted: #58635c;
  --line: #cdd4c9;
  --grass: #3f7d22;       /* herbe : accent */
  --grass-fg: #ffffff;
  --earth: #7a5636;       /* terre */
  --read: #ffe08a;        /* mot lu */
  --read-fg: #1d2420;
  --sent: #e3eed5;        /* phrase lue */
  --flash: #c4e6a9;       /* mot cliqué */
  --adj: #2e7d32; --opp: #b4532a; --hero: #2b6cb0;
  --scrim: rgba(16, 22, 18, .45);
  --f-pixel: "Pixelify Sans", "Atkinson Hyperlegible", ui-monospace, monospace;
  --f-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a17; --surface: #1f2420; --fg: #e7ece4; --muted: #a2ada4; --line: #354037;
    --grass: #7cbd4b; --grass-fg: #122008; --earth: #c9a072;
    --read: #e2b93b; --read-fg: #161a17; --sent: #28331f; --flash: #3f6b26;
    --adj: #86cf89; --opp: #ec9467; --hero: #7fb6ec; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a17; --surface: #1f2420; --fg: #e7ece4; --muted: #a2ada4; --line: #354037;
  --grass: #7cbd4b; --grass-fg: #122008; --earth: #c9a072;
  --read: #e2b93b; --read-fg: #161a17; --sent: #28331f; --flash: #3f6b26;
  --adj: #86cf89; --opp: #ec9467; --hero: #7fb6ec; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 16px; }
.loading { padding: 32px 16px; color: var(--muted); }

.app { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 104px; }

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.block { flex: none; width: 22px; height: 22px; background: linear-gradient(var(--grass) 0 32%, var(--earth) 32% 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.top h1 { font: 700 1.35rem/1.1 var(--f-pixel); margin: 0; letter-spacing: .01em; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }

/* Barre de progression en blocs */
.track { display: grid; grid-template-columns: repeat(19, minmax(0, 1fr)); gap: 3px; margin-block: 14px 16px; }
.cell { height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer; position: relative; }
.cell::before { content: ""; position: absolute; inset: 6px 0; background: var(--surface); border: 1px solid var(--line); }
.cell.done::before { background: var(--earth); border-color: var(--earth); opacity: .55; }
.cell.now::before { background: var(--grass); border-color: var(--grass); inset: 3px 0; }
.cell:hover::before { border-color: var(--grass); }
.cell:focus-visible { outline: 2px solid var(--grass); outline-offset: 1px; }

/* Scène */
.stage { display: grid; gap: 18px; }
.pic { margin: 0; }
.scene { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 128 / 56; image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid var(--line); border-radius: 2px; background: #000; }
@media (min-width: 980px) {
  .stage { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; gap: 28px; }
  .pic { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
}

/* Texte */
.reader { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px clamp(16px, 4vw, 36px) 26px; }
.kicker { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.pg { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.reader h2 { font: 700 calc(var(--reader-size, 20px) * 1.3)/1.2 var(--f-pixel); margin: 0 0 .7em; text-wrap: balance; outline: none; }
.reader p { font-family: var(--reader-font, var(--f-ui)); font-size: var(--reader-size, 20px); line-height: var(--reader-line, 1.7); max-width: 62ch; margin: 0 0 .85em; }
.reader p.dlg { padding-left: .2em; }
[data-spacing="wide"] .reader p { letter-spacing: .06em; word-spacing: .2em; }
.reader p.fin { font: 700 1rem var(--f-pixel); color: var(--muted); letter-spacing: .2em; text-transform: uppercase; margin-top: 1.4em; }

.s { border-radius: 2px; transition: background-color .15s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s.on { background: var(--sent); }
.w { cursor: pointer; border-radius: 2px; transition: background-color .12s; }
.w:hover { text-decoration: underline dotted var(--grass); text-decoration-thickness: 2px; text-underline-offset: .2em; }
.w.cur { background: var(--read); color: var(--read-fg); }
.w.flash { background: var(--flash); }
.w.r-adj { box-shadow: inset 0 -3px var(--adj); font-weight: 700; }
.w.r-opp { box-shadow: inset 0 -3px var(--opp); font-weight: 700; }
.w.r-hero { box-shadow: inset 0 -3px var(--hero); font-weight: 700; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; display: inline-block; }
.sw.adj { background: var(--adj); } .sw.opp { background: var(--opp); } .sw.hero { background: var(--hero); }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--radius); font: 700 .95rem var(--f-ui); cursor: pointer; transition: border-color .12s, background-color .12s; }
.btn:hover:not(:disabled) { border-color: var(--grass); }
.btn:focus-visible { outline: 2px solid var(--grass); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { padding: 0; width: 44px; }
.btn.primary { background: var(--grass); border-color: var(--grass); color: var(--grass-fg); min-width: 140px; }
.btn.primary:hover { filter: brightness(1.06); }

/* Commandes de lecture */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.play { display: flex; gap: 6px; }
@media (max-width: 560px) {
  .lbl { display: none; }
  .dock-in > .btn { width: 48px; padding: 0; }
  .btn.primary { min-width: 0; }
  .hint { display: none; }
}

/* Réglages */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; justify-content: flex-end; }
.sheet { width: min(420px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; outline: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 20px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font: 700 1.15rem var(--f-pixel); margin: 0; }
.sheet-body { overflow-y: auto; padding: 4px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
fieldset { border: 0; border-bottom: 1px solid var(--line); margin: 0; padding: 16px 0 14px; display: grid; gap: 12px; }
fieldset:last-child { border-bottom: 0; }
legend { float: left; width: 100%; padding: 0 0 2px; font: 700 .75rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field-top { display: flex; justify-content: space-between; gap: 8px; }
.field label, .field-label { font-weight: 700; font-size: .92rem; }
output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
input[type="range"] { width: 100%; accent-color: var(--grass); }
select { width: 100%; min-height: 42px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--fg); font: .92rem var(--f-ui); }
select:focus-visible, input:focus-visible { outline: 2px solid var(--grass); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--grass); flex: none; }
.seg { display: grid; gap: 6px; }
.seg.two { grid-template-columns: 1fr 1fr; }
.seg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg-opt { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; padding: 6px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; font-size: .95rem; text-align: center; }
.seg-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg-opt.on { border-color: var(--grass); background: var(--sent); box-shadow: inset 0 0 0 1px var(--grass); }
.seg-opt:focus-within { outline: 2px solid var(--grass); outline-offset: 2px; }
.seg-opt b { font-size: 1.25rem; line-height: 1.1; }
.seg-opt small { font-size: .78rem; color: var(--muted); }
.note { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.45; }
.note.warn { color: var(--opp); font-weight: 700; }
fieldset > .btn { justify-self: start; }

@media (max-width: 600px) {
  .scrim { align-items: flex-end; }
  .sheet { height: 88%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 8px 8px 0 0; }
  .sheet-head { padding-top: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

  title: "Le réveil",
  scene: "reveil",
  alt: "Montagnes enneigées, sapins, l'entrée d'une grotte et trois loups sur un rocher. Ilan est debout dans la neige.",
  paras: ["Je ne sais pas comment je suis arrivé ici. Un matin, j'ai ouvert les yeux dans la neige. Autour de moi, il y avait des montagnes blanches, des sapins et l'entrée de nombreuses grottes. Je ne me souvenais de rien. Pas même de mon nom.", "Dans ma poche, j'ai trouvé une moitié de carte, déchirée en zigzag. Au dos, une main avait écrit, d'une écriture penchée : « Retrouve le Cartographe. Il sait d'où tu viens. »", "Sur un rocher, trois loups m'observaient sans bouger. J'ai pensé qu'ils seraient mes premiers voisins."]
}, {
  title: "La mine de lave",
  scene: "mine",
  alt: "Une mine sombre avec des minerais et une cascade de lave orange. Ilan tient une pioche.",
  paras: ["Avec une pioche en bois, j'ai creusé le flanc de la montagne pour y installer ma maison. J'ai fabriqué un établi, un four et un lit.", "Ensuite, j'ai creusé une mine. J'y ai trouvé du charbon, du cuivre et du fer. Sur le versant est de la montagne, une cascade de lave coulait dans la roche. Sa lumière orange dansait sur les murs. C'était à la fois effrayant et magnifique.", "Une nuit, la neige est tombée à gros flocons. Je suis resté longtemps dehors à la regarder. J'étais ému, sans savoir pourquoi."]
}, {
  title: "Le phare",
  scene: "phare",
  alt: "La nuit, une tour de pierre avec un feu au sommet, près d'une maison creusée dans la montagne. La neige tombe.",
  paras: ["Pour ne jamais perdre ma maison, j'ai construit une haute tour de pierre. À son sommet, j'ai allumé un feu sur un bloc rouge qui brûle sans jamais s'éteindre. Ma tour était devenue un phare : de très loin, on voyait sa flamme dans la nuit.", "Mais la phrase de la carte tournait dans ma tête. Qui était ce Cartographe ? Que savait-il de moi ?", "Un matin, j'ai fabriqué un bateau. J'ai salué les loups et je suis parti."]
}, {
  title: "Tobi le pêcheur",
  scene: "tobi",
  alt: "Une côte herbeuse et un ponton. Tobi, en ciré jaune, pêche à côté d'Ilan. Un bateau flotte sur la mer.",
  paras: ["Après deux jours en mer, j'ai accosté sur une côte couverte d'herbe. Au bout d'un ponton, un homme pêchait. Il s'appelait Tobi.", "— Tu as l'air affamé, voyageur ! a-t-il dit en riant.", "Il m'a donné trois poissons cuits et m'a appris à fabriquer une canne à pêche. Quand je lui ai montré ma demi-carte, il a froncé les sourcils.", "— Le Cartographe ? On dit qu'il vit très loin, au-delà des montagnes aux cerisiers. Fais attention aux gens que tu rencontreras. Tout le monde ne cherche pas la même chose que toi."]
}, {
  title: "L'épave",
  scene: "epave",
  alt: "Un navire abandonné, à moitié enfoui dans le sable, avec un mât cassé. Un coffre ouvert est posé sur la plage.",
  paras: ["Un peu plus loin sur la plage, j'ai découvert un navire abandonné, à moitié enfoui dans le sable. Je suis descendu dans la cale. Il y avait un coffre. Mon cœur battait fort. Un trésor ?", "Non. Seulement des papiers mouillés : le journal du capitaine. Une phrase était encore lisible :", "« Avons déposé le cartographe sur la côte. Il ne parlait que d'un phare dans la neige. »", "J'ai relu la phrase dix fois. Un phare dans la neige, comme le mien ? J'ai rangé la page dans mon sac."]
}, {
  title: "Varek le marchand",
  scene: "varek",
  alt: "Dans une prairie, Ilan près d'un feu de camp. Varek, en manteau bleu, est accompagné de deux lamas.",
  paras: ["Le lendemain, j'ai croisé un marchand ambulant avec deux lamas chargés de coffres. Il portait un manteau bleu et un sourire un peu trop large.", "— Je m'appelle Varek. Moi aussi, je cherche le Cartographe ! Voyageons ensemble, ce sera plus facile.", "Je me sentais si seul que j'ai accepté. Pendant trois jours, nous avons marché côte à côte. Varek me posait beaucoup de questions sur ma carte.", "La troisième nuit, je me suis réveillé près du feu éteint. Varek et ses lamas avaient disparu. Ma demi-carte aussi."]

  title: "Les galeries abandonnées",
  scene: "galeries",
  alt: "Une ancienne galerie de mine avec des poutres en bois, des rails, un chariot vide et des toiles grises.",
  paras: ["Furieux, j'ai suivi les traces des lamas jusqu'à un canyon de terre rouge et orange. Elles s'arrêtaient devant l'entrée d'une ancienne mine.", "J'y suis entré avec une torche. De vieilles poutres en bois soutenaient les galeries. Il y avait des rails rouillés, des chariots vides et des toiles partout, comme des rideaux gris.", "Je n'ai trouvé ni Varek ni ma carte. Seulement le silence et l'écho de mes pas. Ce jour-là, je me suis senti plus seul qu'au premier matin."]

  title: "Le lac aux cerisiers",
  scene: "cerisiers",
  alt: "Au coucher du soleil, un lac entouré de montagnes et de cerisiers roses. Une porte est creusée dans la falaise.",
  paras: ["Je ne me souviens plus comment j'ai quitté le canyon. Je me souviens seulement de la couleur rose. J'étais arrivé dans une vallée avec un lac, des montagnes abruptes et de magnifiques cerisiers.", "Au bord de l'eau, j'ai creusé une maison troglodyte de deux pièces dans le flanc de la montagne. Je ne savais plus où aller, alors j'ai décidé de rester un peu.", "Le soir, je regardais le soleil se coucher. Les pétales roses tombaient doucement sur le lac. Pour la première fois depuis longtemps, je respirais calmement."]

  scene: "ama",
  alt: "Un village avec des tapis de couleur suspendus à une corde. Ama, en violet, parle avec Ilan.",
  paras: ["Dans un village près du lac vivait une jeune tisserande, Ama. Elle fabriquait des tapis de toutes les couleurs.", "— Ta maison est bien triste, m'a-t-elle dit. Prends ces tapis !", "J'en ai posé sur le sol et accroché sur les murs. Ma maison est devenue chaleureuse.", "Un soir, je lui ai parlé du Cartographe. Ama a réfléchi.", "— Il y a longtemps, un voyageur m'a acheté des tapis comme ceux-là. Il dessinait des cartes et parlait d'un phare. Il est parti vers l'ouest, dans la savane, là où vit le vieil Oskar. Oskar échange des boussoles contre des émeraudes."]
}, {
  title: "Comme Ulysse",
  scene: "ulysse",
  alt: "Un voilier sur la mer. À gauche, la côte avec une plage, des bouleaux et une petite maison.",
  paras: ["De l'autre côté de la montagne, je suis descendu jusqu'à la côte. Plusieurs fois, j'ai navigué le long du littoral en le gardant toujours sur ma gauche. Ainsi, je ne pouvais pas me perdre.", "J'ai découvert des déserts, des marais, des forêts de bouleaux et quelques villages. Chaque fois, je revenais à ma maison aux cerisiers. Mais je ne trouvais ni la savane, ni le chemin de ma première maison dans la neige.", "Je pensais à Ulysse et aux marins de la Grèce antique, qui exploraient la Méditerranée sans savoir quand ils rentreraient chez eux."]

  scene: "perdu",
  alt: "Des collines sèches sous un ciel orange. Au loin, la silhouette d'une tour de guet en bois.",
  paras: ["Un jour, j'ai décidé de changer de direction. J'ai quitté la côte et je suis parti vers l'ouest, à l'intérieur des terres.", "Très vite, je me suis perdu. Toutes les collines se ressemblaient. Le soleil descendait et je ne savais plus d'où je venais.", "J'ai eu peur. Je me suis assis dans l'herbe sèche et j'ai pensé : « Je ne retrouverai jamais personne. Ni le Cartographe, ni ma maison, ni moi-même. »", "C'est alors que je l'ai vue : une haute tour de guet en bois, toute noire sur le ciel orange."]
}, {
  title: "Oskar",
  scene: "oskar",
  alt: "Une savane avec des acacias et des chevaux. En haut d'une tour de guet en bois, un vieil homme vêtu de blanc.",
  paras: ["Autour de la tour, des chevaux couraient dans la savane. En haut de l'échelle, un vieil homme était assis devant une table couverte de cartes. Ses yeux étaient blancs comme du lait : il était aveugle.", "— Approche, voyageur. Je m'appelle Oskar.", "— Vous êtes le Cartographe ?", "— Je dessine les cartes que les voyageurs me racontent. Mais ta voix… je crois que je l'ai déjà entendue, il y a très longtemps.", "Je ne comprenais pas. Je n'étais jamais venu ici. Du moins, c'est ce que je croyais."]
}, {

  scene: "emeraudes",
  alt: "Une grotte profonde éclairée par des torches, avec des minerais d'or et d'émeraude. Ilan tient une pioche.",
  paras: ["J'ai construit une petite maison de pierre et de bois près de la tour. Puis j'ai exploré des grottes profondes à la lumière des torches. J'ai trouvé du fer, de l'or et enfin trois émeraudes vertes et brillantes.", "Quand je suis revenu à la tour, quelqu'un était déjà là. Un manteau bleu, deux lamas : Varek !", "— Vieil homme, je t'offre dix émeraudes pour ta dernière boussole, disait-il.", "Oskar a tourné la tête vers moi.", "— Je reconnais les menteurs à leur voix, Varek. Cette boussole est pour lui.", "Varek est reparti sans un mot."]

  title: "La boussole",
  scene: "boussole",
  alt: "Sur une table en bois, une boussole à l'aiguille rouge, trois émeraudes et un morceau de carte.",
  paras: ["Oskar a pris mes trois émeraudes et m'a donné la boussole. Son aiguille rouge tremblait.", "— Écoute bien, a-t-il dit. Cette boussole n'indique pas le nord. Elle indique l'endroit où tu t'es réveillé pour la première fois dans ce monde.", "J'ai ressenti une immense joie. Enfin, une direction !", "— Et le Cartographe ? Celui qui sait d'où je viens ?", "Oskar a souri.", "— Suis l'aiguille. Tu le trouveras au bout du chemin."]
}, {
  title: "Le grand voyage",
  scene: "voyage",
  alt: "Un bateau glisse sur une mer gelée, devant des montagnes enneigées et des sapins.",
  paras: ["Pendant des jours, j'ai suivi l'aiguille rouge. J'ai navigué à travers l'océan, marché sur de vastes plaines, traversé des rivières, des forêts sombres et une mer gelée.", "Peu à peu, l'air est devenu plus froid. Les sapins sont revenus, la neige aussi. Je sentais que mon foyer était proche.", "Je suis arrivé dans un village enneigé. Les habitants m'ont offert un lit et une soupe chaude. Ensemble, nous avons dessiné une carte de la région, et j'ai écrit le nom de chaque lieu. Pour les remercier, j'ai travaillé quelques jours dans leurs champs."]
}, {

      w: false

      start: m.index,
      end: m.index + m[0].length,
