<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicraft – lexique et phrases complexes dans Mineclonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette Breeze (KDE Plasma) */
  --bg:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --text:#232629; --muted:#5d6468;
  --border:#c4c9cd; --btn:#f7f8f8; --accent:#3daee9; --accent-ink:#1b7cb5; --accent-soft:rgba(61,174,233,.15);
  --pos:#27ae60; --pos-soft:rgba(39,174,96,.12); --neg:#da4453; --neg-soft:rgba(218,68,83,.10); --warn:#f67400; --warn-soft:rgba(246,116,0,.12);
  /* codage des fonctions (toujours les mêmes couleurs) */
  --rS:#1d99f3; --rV:#da4453; --rC:#27ae60; --rCC:#8e44ad; --rP:#c27a00; --rK:#f67400; --rN:#7f8c8d;
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"Noto Sans Mono",ui-monospace,monospace;
  --r:4px; color-scheme:light; font-size:16px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7; --border:#4a5056; --btn:#31363b;
  --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2); --pos:#2ecc71; --pos-soft:rgba(46,204,113,.15); --neg:#ed5565; --neg-soft:rgba(237,85,101,.15);
  --rS:#3daee9; --rV:#ed5565; --rC:#2ecc71; --rCC:#b07fd0; --rP:#f0b34a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7; --border:#4a5056; --btn:#31363b;
  --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2); --pos:#2ecc71; --pos-soft:rgba(46,204,113,.15); --neg:#ed5565; --neg-soft:rgba(237,85,101,.15);
  --rS:#3daee9; --rV:#ed5565; --rC:#2ecc71; --rCC:#b07fd0; --rP:#f0b34a; color-scheme:dark; }
:root.bigtext{font-size:19px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:1rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.55rem;font-weight:600} h2{font-size:1.2rem;font-weight:600;margin-bottom:.6rem} h3{font-size:1.02rem;font-weight:600;margin:0 0 .5rem} h4{font-size:.95rem;font-weight:600;margin:.2rem 0 .4rem;display:flex;gap:6px;align-items:center}
p{margin:.45rem 0}
.muted{color:var(--muted)} .small{font-size:.86rem} .grow{flex:1}
kbd{font:600 .7rem var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 .3rem;margin-left:.3rem;background:var(--view);color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ico{flex:none}

/* coquille d'application KDE */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.toolbar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--header);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.02rem}
.brand-bg{fill:var(--accent)} .brand-ln{stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.cb{display:flex;align-items:center;gap:5px;font-size:.88rem;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:3px}
.cb:hover{background:var(--accent-soft)} .cb input{accent-color:var(--accent);margin:0}
.body{display:grid;grid-template-columns:250px 1fr;min-height:0}
.side{background:var(--bg);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:14px 10px 4px}
.navitem{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;text-align:left;font-size:.92rem}
.navitem:hover{background:var(--accent-soft)}
.navitem.on{background:var(--accent-soft);border-color:var(--accent)}
.count{background:var(--accent);color:#fff;border-radius:9px;font-size:.72rem;padding:0 7px;font-weight:600}
.warn-dot{background:var(--warn);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.7rem;display:grid;place-items:center;font-weight:700}
.main{background:var(--view);overflow:auto;min-height:0}
.page{padding:22px 28px 60px;max-width:900px}
.page.narrow{max-width:820px}
.page-head{margin-bottom:14px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:600;margin-bottom:2px}
.lead{color:var(--muted);max-width:70ch;margin-top:.4rem}

/* éléments communs */
.card{border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;background:var(--view);margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:6px 13px;min-height:36px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:rgba(61,174,233,.28)}
.btn.big{padding:9px 18px;font-weight:600}
.btn.danger{border-color:var(--neg);background:var(--neg-soft)}
.btn.icon-only{padding:4px 8px;min-height:32px}
.linkbtn{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:5px;text-align:left}
.linkbtn:hover{text-decoration:underline}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* onglets */
.tabs{display:flex;border-bottom:1px solid var(--border);margin:6px 0 4px;gap:2px;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-bottom:none;padding:7px 16px;cursor:pointer;border-radius:3px 3px 0 0;display:flex;align-items:center;gap:7px;position:relative;top:1px;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--view);border-color:var(--border);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.dot{width:8px;height:8px;border-radius:50%}
.dot.hi,.pill.hi,.meter .hi{background:var(--pos)} .dot.mid,.pill.mid,.meter .mid{background:var(--warn)} .dot.lo,.pill.lo,.meter .lo{background:var(--neg)}

/* visuels */
.visuals{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:2px 0 10px}
.visuals.small-v{margin:0 0 6px}
.mc{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mc-frame{display:grid;place-items:end center;background:#e3e6e9;border:1px solid var(--border);border-radius:var(--r);padding:6px}
.mc img{image-rendering:pixelated;image-rendering:crisp-edges}
.badge{font-size:.78rem;font-weight:600;padding:0 8px;border-radius:9px;border:1px solid}
.b-m{color:var(--rS);border-color:var(--rS)} .b-f{color:var(--rK);border-color:var(--rK)} .b-p{color:var(--rC);border-color:var(--rC)}
.picto{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:4px}

/* texte enrichi */
.role{font-weight:600;border-bottom:3px solid;padding:0 1px}
.r-S{color:var(--rS);border-color:var(--rS)} .r-V{color:var(--rV);border-color:var(--rV)} .r-C{color:var(--rC);border-color:var(--rC)}
.r-CC{color:var(--rCC);border-color:var(--rCC)} .r-P{color:var(--rP);border-color:var(--rP)} .r-K{color:var(--rK);border-color:var(--rK)} .r-N{color:var(--rN);border-color:var(--rN)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--text);margin:0 3px}
.filled{font-weight:700;color:var(--pos);border-bottom:2px solid var(--pos);padding:0 3px}

/* exemple résolu */
.worked{border-left:4px solid var(--accent)}
.tag{display:inline-block;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 8px;border-radius:3px;margin-bottom:10px}
.prompt-row{display:flex;gap:10px;align-items:flex-start}
.prompt{font-size:1.18rem;font-weight:600;margin:.2rem 0 .6rem;flex:1}
.ctx{font-size:1.08rem;margin:.1rem 0 .2rem;padding:6px 12px;background:var(--bg);border-radius:var(--r);border-left:3px solid var(--border)}
.steps{margin:.4rem 0 0;padding-left:1.5rem}
.steps li{margin:.45rem 0;padding:2px 4px;animation:fade .35s ease}
.steps li.cur{background:var(--accent-soft);border-radius:3px}
.say-inline{margin-left:6px;vertical-align:middle;color:var(--muted)}
.answer{margin-top:12px;padding:10px 14px;border:1px solid var(--pos);background:var(--pos-soft);border-radius:var(--r);font-size:1.1rem;font-weight:600}
.answer .muted{font-weight:400;display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* rappel */
.rappel{background:var(--bg)}
.rtable{border-collapse:collapse;width:100%;margin:6px 0 4px;font-size:.95rem}
.rtable td{border-bottom:1px solid var(--border);padding:6px 8px;vertical-align:top}
.rtable .rhead{font-weight:700;white-space:nowrap}
.famcard{display:flex;gap:14px;align-items:center;margin-top:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--view);font-size:.95rem;font-weight:400}
.famcard table{border-collapse:collapse} .famcard th{text-align:left;font-weight:600;color:var(--muted);padding:2px 12px 2px 0;font-size:.85rem;white-space:nowrap} .famcard td{padding:2px 0}

/* exercice */
.run-head{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.progress{flex:1;height:6px;background:var(--header);border-radius:3px;overflow:hidden}
.progress div{height:100%;background:var(--accent);transition:width .3s}
.item{animation:fade .25s ease}
.retry{font-size:.86rem;color:var(--warn);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.aide{font-size:.92rem;color:var(--muted);margin:0 0 10px}
.aide span{display:inline-flex;gap:6px;align-items:flex-start}
.options{display:flex;flex-direction:column;gap:7px;max-width:560px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:9px 12px;cursor:pointer;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--pos);background:var(--pos-soft)}
.opt.ko{border-color:var(--neg);background:var(--neg-soft)}
.opt:disabled{cursor:default}
.opt .key{font:600 .75rem var(--mono);border:1px solid var(--border);border-radius:3px;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt span:nth-child(2){flex:1}
.opt .say{color:var(--muted);display:inline-flex;padding:2px}
.inp-row{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1;min-width:200px;max-width:380px;border:1px solid var(--border);border-radius:3px;padding:8px 10px;background:var(--view);font-size:1.1rem}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.hints{margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hint{padding:4px 10px;background:var(--warn-soft);border-radius:3px}
.line{min-height:52px;border:1px dashed var(--border);border-radius:var(--r);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.line .pre,.line .end{font-size:1.08rem;font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:40px}
.chip{background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:1.05rem}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.role-bg{border-width:1px 1px 4px}
.chip.role-bg.r-S{border-color:var(--rS)} .chip.role-bg.r-V{border-color:var(--rV)} .chip.role-bg.r-C{border-color:var(--rC)} .chip.role-bg.r-CC{border-color:var(--rCC)} .chip.role-bg.r-P{border-color:var(--rP)} .chip.role-bg.r-N{border-color:var(--rN)} .chip.role-bg.r-K{border-color:var(--rK)}
.chip.role-bg{color:var(--text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.82rem}
.feedback{margin-top:14px;border-radius:var(--r);padding:12px 16px;border:1px solid}
.feedback.good{border-color:var(--pos);background:var(--pos-soft)}
.feedback.bad{border-color:var(--neg);background:var(--neg-soft)}
.fb-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.good .fb-head{color:var(--pos)} .bad .fb-head{color:var(--neg)}
.fb-head span{color:var(--text)}
.fb-answer{font-size:1.06rem;font-weight:600}
.detail{border-top:1px solid var(--border);margin-top:8px;padding-top:6px}

/* résultats et suivi */
.results .score .big{font-size:2.2rem;font-weight:700}
.meter{height:8px;background:var(--header);border-radius:4px;overflow:hidden;max-width:420px;margin:6px 0}
.meter div{height:100%}
.wrong{margin:.2rem 0;padding-left:1.2rem}
.prog{border-collapse:collapse;width:100%;margin-top:8px}
.prog th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding:6px 8px}
.prog td{border-bottom:1px solid var(--border);padding:6px 8px}
.pill{color:#fff;border-radius:9px;padding:1px 8px;font-size:.8rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 ol{margin:.2rem 0;padding-left:1.3rem}
.principles li{margin:.35rem 0}
.credits p{margin:.3rem 0}

@media (max-width:760px){
  .body{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px}
  .side-h{display:none}
  .navitem{white-space:nowrap}
  .page{padding:16px 14px 48px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

    'Le verbe : il **est** → ils **sont**.',
    'L’adjectif : rapide → **rapides** (on ne l’entend pas, on l’écrit).',

      {t:'qcm', img:['golem'], ctx:'« Le golem a de la force. »', p:'Au pluriel :', o:['Les golems ont de la force.','Les golems a de la force.','Les golems avont de la force.'], e:'il **a** → ils **ont**.'},

    ]},
    {items:[
      {t:'qcm', img:['pioche'], ctx:'Le mineur prend sa pioche.', p:'Les mineurs ___ leur pioche.', o:['prennent','prendent','prend','prenent'], e:'il **prend** → ils **prennent** (deux **n**).'},

{

    'L’ordre : **le / la / les** avant **lui / leur** → {P:la} {P:lui}.',

{

{
  id:'subjonctif', dom:'morpho', titre:'Le subjonctif',
  objectif:'Employer la forme du subjonctif après « il faut que », « c’est bien que », « pour que », « bien que »…',
  rappel:{titre:'Quand le verbe change de forme', lignes:[
    'Après **il faut que**, **c’est bien que**, **pour que**, **afin que**, **bien que**, **avant que**, **jusqu’à ce que**, **à moins que**, le verbe se met au **subjonctif**.',
    'Formes à connaître : être → qu’il **soit** · avoir → qu’il **ait** · faire → qu’il **fasse** · aller → qu’il **aille** · venir → qu’il **vienne**.',
    'Mais après **parce que**, **après que**, **pendant que**, le verbe reste à l’**indicatif**.',
  ]},
  exemple:{p:'« Il est prudent. » → « C’est bien qu’il… »', steps:[
    'Je repère le déclencheur : **c’est bien que** → subjonctif.',
    'Le verbe est **être** : il **est**.',
    'Au subjonctif, être devient : qu’il **soit**.',
    'C’est bien qu’il **soit** prudent.',
  ], r:'C’est bien qu’il soit prudent.'},
  strategie:'Repère le mot avant le verbe : « que » après « il faut », « c’est bien », « pour », « bien »… → subjonctif.',
  niveaux:[
    {items:[
      {t:'qcm', img:['epee'], ctx:'Il a une épée.', p:'C’est bien qu’il ___ une épée.', o:['ait','a','aura'], e:'avoir → qu’il **ait**.'},
      {t:'qcm', img:['feu_camp'], ctx:'Il fait du feu.', p:'C’est bien qu’il ___ du feu.', o:['fasse','fait','fera'], e:'faire → qu’il **fasse**.'},
      {t:'qcm', img:['vache'], ctx:'Il va à la ferme.', p:'C’est bien qu’il ___ à la ferme.', o:['aille','va','allait'], e:'aller → qu’il **aille**.'},
      {t:'qcm', img:['villageois'], ctx:'Il vient avec nous.', p:'C’est bien qu’il ___ avec nous.', o:['vienne','vient','viendra'], e:'venir → qu’il **vienne**.'},
    ]},
    {items:[
      {t:'qcm', img:['bouclier'], ctx:'Il prend son bouclier.', p:'Il faut qu’il ___ son bouclier.', o:['prenne','prend','prendre','prendra'], e:'prendre → qu’il **prenne**.'},
      {t:'qcm', img:['creeper'], ctx:'Il voit le danger.', p:'C’est bien qu’il ___ le danger.', o:['voie','voit','verra','voyait'], e:'voir → qu’il **voie** (à l’oral, comme « voit », mais ça s’écrit avec **-e**).'},
      {t:'qcm', img:['potion'], ctx:'Il boit la potion.', p:'Il faut qu’il ___ la potion.', o:['boive','boit','buve','boira'], e:'boire → qu’il **boive**.'},
      {t:'qcm', img:['planches'], ctx:'Il construit un abri.', p:'Il faut qu’il ___ un abri.', o:['construise','construit','construira','construisait'], e:'construire → qu’il **construise** (comme nous **construis**ons).'},
      {t:'qcm', img:['emeraude'], ctx:'Il obtient des émeraudes.', p:'C’est bien qu’il ___ des émeraudes.', o:['obtienne','obtient','obtiendra','obtenne'], e:'obtenir → qu’il **obtienne** (comme venir → qu’il vienne).'},
      {t:'qcm', img:['briques'], ctx:'Il finit la tour.', p:'Il faut qu’il ___ la tour.', o:['finisse','finit','finira','finiera'], e:'finir → qu’il **finisse** (comme nous **finiss**ons).'},
    ]},
    {items:[
      {t:'qcm', p:'Je construis un mur afin que le village ___ protégé.', o:['soit','est','sera','était'], e:'**afin que** (le but) → subjonctif : que le village **soit** protégé.'},

      {t:'qcm', img:['horloge'], p:'Je reste ici jusqu’à ce que le soleil ___.', o:['revienne','revient','reviendra','revenait'], e:'**jusqu’à ce que** → subjonctif : que le soleil **revienne**.'},
      {t:'qcm', img:['torche'], p:'Alex allume une torche parce qu’il ___ nuit.', o:['fait','fasse','ferait','faisse'], e:'Piège : **parce que** donne une cause réelle → **indicatif** : parce qu’il **fait** nuit.'},
      {t:'qcm', img:['dragon'], p:'Après que le dragon ___ vaincu, les joueurs sont rentrés.', o:['a été','ait été','soit','sera'], e:'Piège : **après que** → **indicatif** (l’action a vraiment eu lieu) : après que le dragon **a été** vaincu.'},
      {t:'qcm', img:['carte'], p:'Avant que tu ___ trop loin, prends une carte.', o:['ailles','vas','iras','allais'], e:'**avant que** → subjonctif : avant que tu **ailles**.'},

/* ---------------- utilitaires ---------------- */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ let x=seed||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%100000)/100000; }; }
function shuffle(arr, seed){ const r=seeded(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s){ return s.toLowerCase().replace(/[’`]/g,"'").replace(/[.,;:!?«»"]/g,' ').replace(/\s+/g,' ').trim(); }
function stripDet(s){ return s.replace(/^(le|la|les|l'|un|une|des|du|de l'|de la|d')\s*/,'').trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function plain(s){ return (s||'').replace(/\{[A-Z]+:([^}]*)\}/g,'$1').replace(/\*\*/g,'').replace(/___/g,' … '); }
function typo(s){ return s.replace(/ ([?!:;»])/g,' $1').replace(/« /g,'« '); }

/* texte enrichi : {R:texte}, **gras**, ___ */
function Rich({t, fill}){
  if(t==null) return null;
  const parts=[]; const re=/(\{([A-Z]+):([^}]*)\})|(\*\*([^*]+)\*\*)|(___)/g; let last=0,m,k=0;
  const s=typo(t);
  while((m=re.exec(s))){ if(m.index>last) parts.push(s.slice(last,m.index));
    if(m[1]) parts.push(html`<span key=${k++} class=${'role r-'+m[2]} title=${ROLE_NAMES[m[2]]||''}>${m[3]}</span>`);
    else if(m[4]) parts.push(html`<strong key=${k++}>${m[5]}</strong>`);
    else parts.push(fill!=null ? html`<span key=${k++} class="filled">${fill}</span>` : html`<span key=${k++} class="blank" aria-label="blanc">   </span>`);
    last=re.lastIndex; if(m[6] && fill!=null && /’$/.test(fill) && s[last]===' ') last++; }
  if(last<s.length) parts.push(s.slice(last));
  return html`<${React.Fragment}>${parts}<//>`;
}

/* ---------------- correction ---------------- */
function answerText(it){ const s=answerRaw(it).replace(/’ /g,'’'); return /[.!?»]$/.test(s) ? s : s+'.'; }
function answerRaw(it){
  if(it.t==='qcm'){ const a=it.o[0]; if(it.p.includes('___')) return it.p.replace('___', a); if(/\?\s*$/.test(it.p)) return a.charAt(0).toUpperCase()+a.slice(1)+'.'; return (it.p.replace(/…$/,'').trim()+' '+a).replace(/’ /g,'’'); }
  if(it.t==='inp'){ return it.p.replace('___', it.a[0]); }
  if(it.t==='ord'){ return sentenceOf(it.k.map(x=>x[0]), it); }
}
function sentenceOf(words, it){
  const comma = w => { const t=it.k.find(x=>x[0]===w); return t && t[2]; };
  let s=''; words.forEach((w,i)=>{ s += (i===0 || /['’]$/.test(words[i-1]) ? '' : ' ') + w + (i===0 && words.length>1 && comma(w) ? ',' : ''); });
  if(it.pre){ s = it.pre+' '+s; } else { s = s.charAt(0).toUpperCase()+s.slice(1); }
  s = s.replace(/,$/,'');
  return s + (it.q ? ' ?' : '.');
}

function QcmItem({it, onDone, disabled, audio}){
  const opts = useMemo(()=>shuffle(it.o, hash(it.id)), [it.id]);
  const [sel,setSel]=useState(null);
  useEffect(()=>setSel(null),[it.id]);
  useEffect(()=>{ const h=e=>{ if(disabled) return; const n=parseInt(e.key,10); if(n>=1&&n<=opts.length) setSel(n-1); if(e.key==='Enter'&&sel!=null){ e.preventDefault(); onDone(opts[sel]===it.o[0], opts[sel]); } }; window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); },[sel,disabled,opts]);
  return html`<div>
    <div class="options" role="radiogroup">
      ${opts.map((o,i)=>{ let cls='opt'; if(disabled){ if(o===it.o[0]) cls+=' ok'; else if(i===sel) cls+=' ko'; } else if(i===sel) cls+=' on';
        return html`<button key=${o} role="radio" aria-checked=${i===sel} class=${cls} disabled=${disabled} onClick=${()=>setSel(i)}><span class="key">${i+1}</span><span>${typo(o)}</span>${audio&&html`<span class="say" onClick=${e=>{e.stopPropagation(); speak(o);}} title="Écouter">${ICONS.speaker}</span>`}</button>`; })}
    </div>
    ${!disabled && html`<div class="actions"><button class="btn primary" disabled=${sel==null} onClick=${()=>onDone(opts[sel]===it.o[0], opts[sel])}>${ICONS.check} Valider <kbd>Entrée</kbd></button></div>`}
  </div>`;
}

function InputItem({it, onDone, disabled, onHint}){
  const [v,setV]=useState(''); const [h,setH]=useState(0); const ref=useRef();
  useEffect(()=>{ setV(''); setH(0); setTimeout(()=>ref.current&&ref.current.focus(),30); },[it.id]);
  const hints=(it.h||[]).filter(Boolean);
  function check(){
    const val=stripDet(norm(v)); if(!val) return;
    const acc=it.a.map(a=>stripDet(norm(a)));
    if(acc.includes(val)) return onDone(true, v, null);
    if(acc.map(stripAcc).includes(stripAcc(val))) return onDone(true, v, 'accents');
    if(acc.some(a=>a.length>=5 && lev(stripAcc(a),stripAcc(val))<=1)) return onDone(true, v, 'ortho');
    onDone(false, v, null);
  }
  return html`<div>
    <div class="inp-row">
      <input ref=${ref} class="field" value=${v} disabled=${disabled} placeholder="Écris le mot…" autocomplete="off" autocapitalize="off" spellcheck="false"
        onInput=${e=>setV(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter'&&!disabled){ e.preventDefault(); e.stopPropagation(); check(); } }}/>
      ${!disabled && html`<button class="btn primary" disabled=${!v.trim()} onClick=${check}>${ICONS.check} Valider</button>`}
    </div>
    ${!disabled && hints.length>0 && html`<div class="hints">
      ${hints.slice(0,h).map((x,i)=>html`<div key=${i} class="hint"><span class="muted small">${['Sens','Début du mot','Syllabes'][i]} :</span> ${x}</div>`)}
      ${h<hints.length && html`<button class="btn" onClick=${()=>{ setH(h+1); onHint&&onHint(); }}>${ICONS.bulb} Indice ${h+1}/${hints.length}</button>`}
    </div>`}
  </div>`;
}

function OrderItem({it, onDone, disabled, colored}){
  const bank0 = useMemo(()=>{ let s=hash(it.id), b; do{ b=shuffle(it.k.map((x,i)=>i), s++); } while(b.every((x,i)=>x===i) && it.k.length>1); return b; },[it.id]);
  const [line,setLine]=useState([]);
  useEffect(()=>setLine([]),[it.id]);
  const bank = bank0.filter(i=>!line.includes(i));
  const words = line.map(i=>it.k[i][0]);
  function check(){ const seq=line.map(i=>it.k[i][0]).join('|'); const okSeqs=[it.k.map(x=>x[0]).join('|'), ...(it.alt||[]).map(a=>a.map(i=>it.k[i][0]).join('|'))]; onDone(okSeqs.includes(seq), sentenceOf(words,it)); }
  const chip=(i,where)=>{ const [t,r]=it.k[i]; const col = colored || disabled;
    return html`<button key=${i} class=${'chip'+(col?' role-bg r-'+r:'')} disabled=${disabled} title=${col?ROLE_NAMES[r]:''}
      onClick=${()=> where==='bank' ? setLine([...line,i]) : setLine(line.filter(x=>x!==i))}>${t}</button>`; };
  const roles=[...new Set(it.k.map(x=>x[1]))];
  return html`<div>
    <div class="line" aria-label="Ta phrase">
      ${it.pre && html`<span class="pre">${it.pre}</span>`}
      ${line.length? line.map(i=>chip(i,'line')) : html`<span class="muted small">Clique sur les étiquettes dans l’ordre.</span>`}
      ${line.length===it.k.length && html`<span class="end">${it.q?'?':'.'}</span>`}
    </div>
    <div class="bank">${bank.map(i=>chip(i,'bank'))}</div>
    ${(colored||disabled) && html`<div class="legend">${roles.map(r=>html`<span key=${r} class=${'role r-'+r}>${ROLE_NAMES[r]}</span>`)}</div>`}
    ${!disabled && html`<div class="actions">
      <button class="btn" disabled=${!line.length} onClick=${()=>setLine(line.slice(0,-1))}>${ICONS.undo} Retirer</button>
      <button class="btn primary" disabled=${line.length!==it.k.length} onClick=${check}>${ICONS.check} Valider</button></div>`}
  </div>`;
}

/* ---------------- déroulé d'une série ---------------- */
function Runner({items, title, settings, onFinish, onAnswer, level, onExit, strategie}){
  const [queue,setQueue]=useState(()=>items.map(it=>({it, retry:false})));
  const [pos,setPos]=useState(0);
  const [res,setRes]=useState(null);
  const [showDet,setShowDet]=useState(false);
  const [showAide,setShowAide]=useState(level===1);
  const [first,setFirst]=useState({});
  const cur=queue[pos];
  useEffect(()=>{ setRes(null); setShowDet(false); setShowAide(level===1); },[pos]);
  useEffect(()=>{ if(settings.audio && cur) speak((cur.it.ctx?cur.it.ctx+' ':'')+(cur.it.p||'Remets les groupes dans l’ordre.')); },[pos]);
  useEffect(()=>{ const h=e=>{ if(e.key==='Enter' && res){ e.preventDefault(); next(); } }; window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); });
  if(!cur) return null;
  const it=cur.it;
  function done(ok, given, note){
    setRes({ok, given, note}); setShowDet(!ok);
    if(!cur.retry){ setFirst(f=>({...f,[it.id]:ok})); onAnswer && onAnswer(it, ok); }
    if(!ok && !cur.retry){ const q=queue.slice(); q.splice(Math.min(pos+4,q.length),0,{it,retry:true}); setQueue(q); }
  }
  function next(){ if(pos+1<queue.length) setPos(pos+1); else onFinish(first); }
  const nFirst = items.length, nDone=Object.keys(first).length;
  const prompt = it.p || 'Remets les groupes dans l’ordre.';
  return html`<div class="runner">
    <div class="run-head">
      <div class="progress" aria-label=${`Question ${Math.min(nDone+ (res?0:1),nFirst)} sur ${nFirst}`}><div style=${{width:(100*nDone/nFirst)+'%'}}></div></div>
      <span class="muted small">${Math.min(nDone+(res?0:1),nFirst)} / ${nFirst}</span>
    </div>
    <div class="card item" key=${pos} data-id=${it.id}>
      ${cur.retry && html`<div class="retry">${ICONS.review} Deuxième essai : cette question revient pour mieux la retenir.</div>`}
      <${Visuals} img=${it.img} pic=${it.pic} badge=${it.badge}/>
      ${it.ctx && html`<p class="ctx"><${Rich} t=${it.ctx}/></p>`}
      <div class="prompt-row"><p class="prompt"><${Rich} t=${prompt} fill=${res&&it.t!=='ord'?(it.t==='qcm'?it.o[0]:it.a[0]):null}/></p><${SpeakBtn} on=${settings.audio} text=${(it.ctx?it.ctx+' ':'')+prompt}/></div>
      ${strategie && level<3 && html`<div class="aide">${showAide ? html`<span>${ICONS.bulb} <${Rich} t=${strategie}/></span>` : html`<button class="linkbtn" onClick=${()=>setShowAide(true)}>${ICONS.bulb} Afficher l’aide</button>`}</div>`}
      ${it.t==='qcm' && html`<${QcmItem} it=${it} onDone=${done} disabled=${!!res} audio=${settings.audio}/>`}
      ${it.t==='inp' && html`<${InputItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${it.t==='ord' && html`<${OrderItem} it=${it} onDone=${done} disabled=${!!res} colored=${level<3}/>`}
      ${res && html`<div class=${'feedback '+(res.ok?'good':'bad')} role="status" aria-live="polite">
        <div class="fb-head">${res.ok?ICONS.check:ICONS.cross}<strong>${res.ok?'Juste !':'Pas encore.'}</strong>
          ${res.note==='accents' && html`<span class="small"> Attention aux accents : on écrit « ${it.a[0]} ».</span>`}
          ${res.note==='ortho' && html`<span class="small"> C’est le bon mot ; on l’écrit « ${it.a[0]} ».</span>`}
        </div>
        <p class="fb-answer"><span class="muted small">Correction :</span> ${typo(answerText(it))}</p>
        ${!res.ok && it.t!=='ord' && res.given && html`<p class="small muted">Ta réponse : ${res.given}</p>`}
        ${showDet ? html`<div class="detail"><p><${Rich} t=${it.e}/></p>${it.fam && html`<${FamilyCard} fid=${it.fam} tlocc=${settings.tlocc}/>`}</div>`
                  : html`<button class="linkbtn" onClick=${()=>setShowDet(true)}>${ICONS.steps} Voir la correction détaillée</button>`}
        <div class="actions"><button class="btn primary" onClick=${next}>${pos+1<queue.length?'Suivant':'Terminer'} ${ICONS.next}<kbd>Entrée</kbd></button></div>
      </div>`}
    </div>
  </div>`;
}

function Results({first, items, onRetry, onNext, onBack, nextLabel}){
  const ok=items.filter(it=>first[it.id]).length;
  const wrong=items.filter(it=>first[it.id]===false);
  const pct=Math.round(100*ok/items.length);
  return html`<div class="card results">
    <h2>Série terminée</h2>
    <div class="score"><span class="big">${ok}</span><span class="muted"> / ${items.length} justes du premier coup</span></div>
    <div class="meter"><div style=${{width:pct+'%'}} class=${pct>=80?'hi':pct>=50?'mid':'lo'}></div></div>
    <p class="muted">${pct>=80?'Très bien ! Tu peux passer au niveau suivant.':pct>=50?'C’est en bonne voie. Refais les erreurs, puis passe à la suite.':'Reprends l’exemple résolu, puis refais la série.'}</p>
    ${wrong.length>0 && html`<div><h3>À revoir</h3><ul class="wrong">${wrong.map(it=>html`<li key=${it.id}>${typo(answerText(it))}</li>`)}</ul>
      <p class="small muted">Ces questions sont ajoutées à la révision espacée.</p></div>`}
    <div class="actions">
      <button class="btn" onClick=${onBack}>Retour à la leçon</button>
      ${wrong.length>0 && html`<button class="btn" onClick=${()=>onRetry(wrong)}>${ICONS.review} Refaire les erreurs</button>`}
      ${onNext && html`<button class="btn primary" onClick=${onNext}>${nextLabel} ${ICONS.next}</button>`}
    </div>
  </div>`;
}

/* ---------------- exemple résolu ---------------- */

function Rappel({r}){

/* ---------------- page d'une famille ---------------- */
function FamilyPage({f, settings, store, setStore}){
  const [tab,setTab]=useState(0); const [run,setRun]=useState(null); const [done,setDone]=useState(null);
  useEffect(()=>{ setTab(0); setRun(null); setDone(null); },[f.id]);
  const best = (store.best||{})[f.id]||{};
  function answer(it, ok){ setStore(s=>{ const L={...(s.leitner||{})}; if(!ok) L[it.id]={box:1,due:today()}; return {...s, leitner:L}; }); }
  function start(lvl, items){ setTab(lvl); setDone(null); setRun({lvl, items: items||f.niveaux[lvl-1].items, key:Date.now()}); }
  function finish(first){ const items=run.items; const ok=items.filter(it=>first[it.id]).length;
    if(items===f.niveaux[run.lvl-1].items) setStore(s=>{ const b={...(s.best||{})}; const fb={...(b[f.id]||{})}; fb[run.lvl]=Math.max(fb[run.lvl]||0, ok/items.length); b[f.id]=fb; return {...s,best:b}; });
    setDone({first, items, lvl:run.lvl}); setRun(null); }
  const tabs=['Découvrir','Niveau 1','Niveau 2','Niveau 3'];
  return html`<div class="page">
    <div class="page-head"><div class="eyebrow">${f.dom==='lex'?'Lexique':'Morphosyntaxe'}</div><h1>${f.titre}</h1><p class="lead">${f.objectif}</p></div>
    <div class="tabs" role="tablist">${tabs.map((t,i)=>html`<button key=${i} role="tab" aria-selected=${tab===i} class=${'tab'+(tab===i?' on':'')} onClick=${()=>{ if(i===0){ setTab(0); setRun(null); setDone(null);} else start(i); }}>
      ${t}${i>0 && best[i]!=null && html`<span class=${'dot '+(best[i]>=.8?'hi':best[i]>=.5?'mid':'lo')} title=${'Meilleur score : '+Math.round(best[i]*100)+' %'}></span>`}</button>`)}</div>
    ${tab===0 && html`<div class="discover">
      <${Worked} ex=${f.exemple} settings=${settings}/>
      <${Rappel} r=${f.rappel}/>
      <div class="actions"><button class="btn primary big" onClick=${()=>start(1)}>À toi : niveau 1 ${ICONS.next}</button></div>
    </div>`}
    ${run && html`<${Runner} key=${run.key} items=${run.items} level=${run.lvl} settings=${settings} onAnswer=${answer} onFinish=${finish} strategie=${f.strategie}/>`}
    ${done && html`<${Results} first=${done.first} items=${done.items} onBack=${()=>{setDone(null);setTab(0);}}
       onRetry=${w=>start(done.lvl, w)} onNext=${done.lvl<3?()=>start(done.lvl+1):null} nextLabel=${'Niveau '+(done.lvl+1)}/>`}
  </div>`;
}

/* ---------------- révision espacée ---------------- */
const GAPS=[1,3,7,14];
function Revision({settings, store, setStore, visible}){
  const [run,setRun]=useState(null); const [done,setDone]=useState(null);
  const L=store.leitner||{};
  const due=Object.entries(L).filter(([id,v])=>v.due<=today() && ALL_ITEMS[id] && visible.has(ALL_ITEMS[id].fid)).map(([id])=>ALL_ITEMS[id]);
  const waiting=Object.keys(L).length-due.length;
  function answer(it, ok){ setStore(s=>{ const L2={...(s.leitner||{})}; const cur=L2[it.id]||{box:1};
    if(ok){ if(cur.box>=GAPS.length) delete L2[it.id]; else L2[it.id]={box:cur.box+1, due:today()+GAPS[cur.box-1]}; }
    else L2[it.id]={box:1, due:today()+1};
    return {...s, leitner:L2}; }); }
  return html`<div class="page narrow">
    <div class="page-head"><div class="eyebrow">Mémoriser</div><h1>Révision espacée</h1>
      <p class="lead">Les questions ratées reviennent ici après 1, 3, 7 puis 14 jours. Chercher la réponse en mémoire, à intervalles espacés, aide à retenir durablement les mots et les structures.</p></div>
    ${!run && !done && html`<div class="card">
      ${due.length ? html`<p><strong>${due.length}</strong> question${due.length>1?'s':''} à revoir aujourd’hui.</p>
        <div class="actions"><button class="btn primary big" onClick=${()=>setRun({items:shuffle(due, Date.now()).slice(0,12), key:Date.now()})}>Commencer la révision ${ICONS.next}</button></div>`
      : html`<p>Rien à revoir aujourd’hui.</p>`}
      ${waiting>0 && html`<p class="muted small">${waiting} question${waiting>1?'s':''} programmée${waiting>1?'s':''} pour les prochains jours.</p>`}
    </div>`}
    ${run && html`<${Runner} key=${run.key} items=${run.items} level=${2} settings=${settings} onAnswer=${answer} onFinish=${first=>{setDone({first,items:run.items}); setRun(null);}}/>`}
    ${done && html`<${Results} first=${done.first} items=${done.items} onBack=${()=>setDone(null)} onRetry=${w=>{setDone(null); setRun({items:w,key:Date.now()});}}/>`}
  </div>`;
}

/* ---------------- guide ---------------- */
function Guide({go, fams}){
  return html`<div class="page narrow">
    <div class="page-head"><div class="eyebrow">Mode d’emploi</div><h1>Lexicraft</h1>
      <p class="lead">Des exercices de lexique et de construction de phrases dans l’univers de Mineclonia, pour des adolescents de 11 à 15 ans avec un trouble développemental du langage (TDL).</p></div>
    <div class="card">
      <h3>Comment c’est organisé</h3>
      <p>Chaque famille d’exercices commence par un <strong>exemple résolu</strong>, déroulé étape par étape, puis propose <strong>trois niveaux</strong> de difficulté croissante. Chaque réponse donne une correction simple, puis une correction détaillée.</p>
      <div class="grid2">
        <div><h4>${ICONS.word} Lexique</h4><ol>${fams.filter(f=>f.dom==='lex').map(f=>html`<li key=${f.id}><button class="linkbtn" onClick=${()=>go(f.id)}>${f.titre}</button></li>`)}</ol></div>
        <div><h4>${ICONS.sentence} Morphosyntaxe</h4><ol>${fams.filter(f=>f.dom==='morpho').map(f=>html`<li key=${f.id}><button class="linkbtn" onClick=${()=>go(f.id)}>${f.titre}</button></li>`)}</ol></div>
      </div>
    </div>
    <div class="card">
      <h3>Les principes utilisés</h3>
      <ul class="principles">
        <li><strong>Exemple résolu avant d’agir</strong> : l’élève voit la démarche complète avant de s’exercer (effet de l’exemple résolu, théorie de la charge cognitive).</li>
        <li><strong>Une étape, puis une question à la fois</strong> : l’exemple se dévoile pas à pas et chaque écran ne pose qu’une question (segmentation).</li>
        <li><strong>Aide qui s’estompe</strong> : l’aide est affichée au niveau 1, disponible sur demande au niveau 2, absente au niveau 3 ; les étiquettes de phrase perdent leurs couleurs au niveau 3.</li>
        <li><strong>Image et mot ensemble</strong> : l’image est placée juste au-dessus de la question, sans décoration superflue (contiguïté, cohérence).</li>
        <li><strong>Codage couleur stable</strong> : <span class="role r-S">sujet</span> <span class="role r-V">verbe</span> <span class="role r-C">complément</span> <span class="role r-CC">circonstanciel</span> <span class="role r-P">pronom</span>, toujours les mêmes couleurs (signalisation).</li>
        <li><strong>Écouter plutôt que lire</strong> : la lecture audio (bouton haut-parleur) présente les consignes à l’oral, ce qui allège la lecture (principe de modalité).</li>
        <li><strong>Forme et sens du mot</strong> : les indices de saisie donnent le sens, puis le début du mot, puis les syllabes (approche phonologique et sémantique).</li>
        <li><strong>Récupération espacée</strong> : une question ratée revient quelques questions plus tard, puis dans la révision après 1, 3, 7 et 14 jours.</li>
      </ul>
    </div>
    <div class="card">
      <h3>À propos du TLOCC</h3>
      <p>Les structures de phrases suivent la progression du <em>Test de Langage Oral Complexe pour Collégiens</em> (pronoms compléments, subjonctif, relatives, relations logiques, hypothèse, comparaison), avec des <strong>phrases différentes</strong> de celles du test. Les mots du test ne sont pas utilisés dans les exercices courants : les entraîner fausserait un futur passage du test. Une série à part, « Mots du TLOCC », s’affiche si on coche l’option dans la barre d’outils.</p>
    </div>
    <div class="card small muted credits">

    </div>
  </div>`;
}

/* ---------------- application ---------------- */
function App(){
  const [store,setStoreRaw]=useState(loadStore);
  const setStore = useCallback(fn=>setStoreRaw(s=>{ const n=typeof fn==='function'?fn(s):fn; saveStore(n); return n; }),[]);
  const settings = {audio:false, tlocc:false, theme:'auto', big:false, ...(store.settings||{})};
  const setSet=(k,v)=>setStore(s=>({...s, settings:{...settings, [k]:v}}));
  const [page,setPage]=useState('guide');
  const fams = DATA.filter(f=>!f.tlocc || settings.tlocc);
  const visible = new Set(fams.map(f=>f.id));
  useEffect(()=>{ const r=document.documentElement; if(settings.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',settings.theme); r.classList.toggle('bigtext', !!settings.big); },[settings.theme, settings.big]);
  useEffect(()=>{ if(!visible.has(page) && !['guide','revision','progres'].includes(page)) setPage('guide'); },[settings.tlocc]);
  const mainRef=useRef();
  const go=p=>{ setPage(p); if(mainRef.current) mainRef.current.scrollTop=0; try{ speechSynthesis.cancel(); }catch(e){} };
  const L=store.leitner||{}; const dueN=Object.entries(L).filter(([id,v])=>v.due<=today()&&ALL_ITEMS[id]&&visible.has(ALL_ITEMS[id].fid)).length;
  const fam = DATA.find(f=>f.id===page);
  const isDark = settings.theme==='dark' || (settings.theme==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const nav=(id,label,icon,extra)=>html`<button key=${id} class=${'navitem'+(page===id?' on':'')} onClick=${()=>go(id)}>${icon}<span class="grow">${label}</span>${extra}</button>`;
  return html`<div class="app">
    <header class="toolbar">
      <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="3" class="brand-bg"/><path d="M7 8h10M7 12h6M7 16h8" class="brand-ln"/></svg>Lexicraft</div>
      <div class="grow"></div>
      <label class="cb" title="Lire les consignes à voix haute"><input type="checkbox" checked=${settings.audio} onChange=${e=>setSet('audio',e.target.checked)}/>${ICONS.speaker} Audio</label>
      <label class="cb" title="Afficher la série de mots du TLOCC"><input type="checkbox" checked=${settings.tlocc} onChange=${e=>setSet('tlocc',e.target.checked)}/> Mots du TLOCC</label>
      <button class="btn icon-only" title="Agrandir le texte" aria-pressed=${!!settings.big} onClick=${()=>setSet('big',!settings.big)}><span style=${{fontWeight:600}}>A+</span></button>
      <button class="btn icon-only" title="Thème clair / sombre" onClick=${()=>setSet('theme', isDark?'light':'dark')}>${ICONS.moon}</button>
    </header>
    <div class="body">
      <nav class="side" aria-label="Familles d’exercices">
        ${nav('guide','Mode d’emploi',ICONS.guide)}
        <div class="side-h">Lexique</div>
        ${fams.filter(f=>f.dom==='lex').map(f=>nav(f.id,f.titre,ICONS.word, f.tlocc?html`<span class="warn-dot" title="Mots du test">!</span>`:null))}
        <div class="side-h">Morphosyntaxe</div>
        ${fams.filter(f=>f.dom==='morpho').map(f=>nav(f.id,f.titre,ICONS.sentence))}
        <div class="side-h">Suivi</div>
        ${nav('revision','Révision espacée',ICONS.review, dueN?html`<span class="count">${dueN}</span>`:null)}
        ${nav('progres','Progression',ICONS.chart)}
      </nav>
      <main class="main" ref=${mainRef}>
        ${page==='guide' && html`<${Guide} go=${go} fams=${fams}/>`}
        ${page==='revision' && html`<${Revision} settings=${settings} store=${store} setStore=${setStore} visible=${visible}/>`}
        ${page==='progres' && html`<${Progress} store=${store} setStore=${setStore} fams=${fams} go=${go}/>`}
        ${fam && html`<${FamilyPage} key=${fam.id} f=${fam} settings=${settings} store=${store} setStore=${setStore}/>`}
      </main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

</script>
</body>
</html>
