function SceneItem({it, onDone, disabled}){
  const opts = useMemo(()=>shuffle([{ag:it.ag, pa:it.pa, ok:true},{ag:it.pa, pa:it.ag, ok:false}], hash(it.id)),[it.id]);
  const [sel,setSel]=useState(null);
  useEffect(()=>setSel(null),[it.id]);
  const validate=()=>{ if(sel!=null) onDone(opts[sel].ok, null); };
  useKeys(e=>{ if(disabled) return; if(e.key==='1'||e.key==='a') setSel(0); if(e.key==='2'||e.key==='b') setSel(1); if(e.key==='Enter'&&sel!=null){ e.preventDefault(); validate(); } },[sel,disabled]);
  return html`<div>
    <div class="scenes" role="radiogroup">${opts.map((o,i)=>{ let cls='scene-opt'; if(disabled){ if(o.ok) cls+=' ok'; else if(i===sel) cls+=' ko'; } else if(i===sel) cls+=' on';
      return html`<button key=${i} role="radio" aria-checked=${i===sel} class=${cls} disabled=${disabled} onClick=${()=>setSel(i)}><span class="key">${i===0?'A':'B'}</span><${Scene} ag=${o.ag} pa=${o.pa} v=${it.v} compact=${true}/></button>`; })}</div>
    ${!disabled && html`<div class="actions"><button class="btn primary" disabled=${sel==null} onClick=${validate}>${I.check} Valider <kbd>Entrée</kbd></button></div>`}
  </div>`;
}

/* ================= correction simple ================= */
function fillSlots(p, f){ return p.replace(/\{\{(\d)\}\}/g,(_,i)=>f(+i)||'…'); }
function sentenceOf(words, it){
  const comma = w => { const t=it.k.find(x=>x[0]===w); return t && t[2]; };
  let s=''; words.forEach((w,i)=>{ s += (i===0 || /['’]$/.test(words[i-1]) ? '' : ' ') + w + (i===0 && words.length>1 && comma(w) ? ',' : ''); });
  if(it.pre) s = it.pre+' '+s; else s = cap(s);
  return s + (it.q ? ' ?' : '.');
}
const NAMES = {cheval:'le cheval',ane:'l’âne',mule:'la mule',vache:'la vache',mouton:'le mouton',cochon:'le cochon',poule:'la poule',lapin:'le lapin',loup:'le loup',chien:'le chien',chat:'le chat',ours:'l’ours',villageois:'le villageois',golem:'le golem',zombie:'le zombie',squelette:'le squelette',araignee:'l’araignée'};
function answerText(it){
  let s;
  if(it.s) return it.s;
  if(it.t==='qcm'){ const a=it.o[0]; if(it.p.includes('___')) s=it.p.replace('___', a); else if(/\?\s*$/.test(it.p)) s=cap(a); else s=(it.p.replace(/…$/,'').trim()+' '+a); }
  else if(it.t==='inp') s=it.p.replace('___', it.a[0]);
  else if(it.t==='ord') s=sentenceOf(it.k.map(x=>x[0]), it);
  else if(it.t==='multi') s='Les mots-clés : '+it.a.join(', ');
  else if(it.t==='tri') s=it.cats.map((c,ci)=>c+' : '+it.it.filter(r=>r[1]===ci).map(r=>plain(r[0])).join(', ')).join(' — ');
  else if(it.t==='slots') s=fillSlots(it.p, i=>it.sl[i][0]);
  else if(it.t==='scene') s=cap(`${NAMES[it.ag]||it.ag} ${it.v} ${NAMES[it.pa]||it.pa}`);
  s=(s||'').replace(/’ /g,'’');
  return /[.!?»]$/.test(s) ? s : s+'.';
}

/* ================= série d'exercices ================= */
function Runner({fam, items, settings, onFinish, onAnswer, isReview}){
  const [queue,setQueue]=useState(()=>items.map(it=>({it, retry:false})));
  const [pos,setPos]=useState(0);
  const [res,setRes]=useState(null);
  const [showDet,setShowDet]=useState(false);
  const [showAide,setShowAide]=useState(true);
  const [first,setFirst]=useState({});
  const cur=queue[pos]; const it=cur&&cur.it;
  const ff = it ? MODULES.find(m=>m.id===it.mid).familles.find(f=>f.id===it.fid) : fam;
  const nFirst = items.length, nDone=Object.keys(first).length;
  useEffect(()=>{ setRes(null); setShowDet(false); setShowAide(!isReview && pos<Math.ceil(items.length/3)); },[pos]);
  useEffect(()=>{ if(settings.audio && it) speak((it.ctx?it.ctx+' ':'')+(it.p||'')); },[pos]);
  useKeys(e=>{ if(e.key==='Enter' && res && e.target.tagName!=='SELECT'){ e.preventDefault(); next(); } },[res,pos,queue]);
  if(!cur) return null;
  function done(ok, given, note){
    setRes({ok, given, note}); setShowDet(!ok);
    if(!cur.retry){ setFirst(f=>({...f,[it.id]:ok})); onAnswer && onAnswer(it, ok); }
    if(!ok && !cur.retry){ const q=queue.slice(); q.splice(Math.min(pos+4,q.length),0,{it,retry:true}); setQueue(q); }
  }
  function next(){ if(pos+1<queue.length) setPos(pos+1); else onFinish(first); }
  const prompt = it.p || (it.t==='scene' ? 'Quelle image correspond à la phrase ?' : it.t==='ord' ? 'Remets les étiquettes dans l’ordre.' : '');
  const fillVal = res && (it.t==='qcm' ? it.o[0] : it.t==='inp' ? it.a[0] : null);
  const qnum = Math.min(nDone+(res?0:1), nFirst);
  return html`<div class="runner">
    <div class="run-head">
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax=${nFirst} aria-valuenow=${nDone}><div style=${{width:(100*nDone/nFirst)+'%'}}></div></div>
      <span class="muted small">${qnum} / ${nFirst}</span>
    </div>
    <div class="card item" key=${pos} data-id=${it.id}>
      ${cur.retry && html`<div class="retry">${I.review} Cette question revient : essaie encore, pour mieux la retenir.</div>`}
      ${isReview && ff && html`<div class="eyebrow">${ff.titre}</div>`}
      ${it.carte && html`<${Carte} id=${it.carte} mode="mot"/>`}
      ${it.devinette && html`<${Carte} id=${it.devinette} mode="devinette"/>`}
      <${Visuals} img=${it.img} pic=${it.pic} badge=${it.badge}/>
      ${it.ctx && html`<p class="ctx"><${Rich} t=${it.ctx} nolabel=${true}/></p>`}
      <div class="prompt-row"><p class="prompt"><${Rich} t=${prompt} fill=${fillVal} nolabel=${true}/></p><${SpeakBtn} on=${settings.audio} text=${(it.ctx?it.ctx+' ':'')+prompt}/></div>
      ${ff && ff.aide && !res && html`<div class="aide">${showAide ? html`<span>${I.bulb} <${Rich} t=${ff.aide}/></span>` : html`<button class="linkbtn" onClick=${()=>setShowAide(true)}>${I.bulb} Afficher l’aide</button>`}</div>`}
      ${it.t==='qcm' && html`<${QcmItem} it=${it} onDone=${done} disabled=${!!res} audio=${settings.audio}/>`}
      ${it.t==='multi' && html`<${MultiItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${it.t==='inp' && html`<${InputItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${it.t==='ord' && html`<${OrderItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${it.t==='tri' && html`<${TriItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${it.t==='slots' && html`<${SlotsItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${it.t==='scene' && html`<${SceneItem} it=${it} onDone=${done} disabled=${!!res}/>`}
      ${res && html`<div class=${'feedback '+(res.ok?'good':'bad')} role="status" aria-live="polite">
        <div class="fb-head">${res.ok?I.check:I.cross}<strong>${res.ok?'Juste !':'Pas encore.'}</strong>
          ${res.note==='accents' && html`<span class="small"> Attention aux accents : on écrit « ${it.a[0]} ».</span>`}
          ${res.note==='ortho' && html`<span class="small"> C’est le bon mot ; on l’écrit « ${it.a[0]} ».</span>`}
        </div>
        <p class="fb-answer"><span class="muted small">Correction :</span> ${typo(answerText(it))}</p>
        ${!res.ok && res.given && html`<p class="small muted">Ta réponse : ${res.given}</p>`}
        ${showDet ? html`<div class="detail">
            ${it.t==='scene' && html`<${Scene} ag=${it.ag} pa=${it.pa} v=${it.v} compact=${true}/>`}
            ${it.e && html`<p><${Rich} t=${it.e}/></p>`}
            ${(it.carte||it.devinette) && html`<${Carte} id=${it.carte||it.devinette} mode="full"/>`}
            ${it.fam && html`<${FamilyCard} fid=${it.fam} tlocc=${settings.tlocc}/>`}
          </div>`
          : html`<button class="linkbtn" onClick=${()=>setShowDet(true)}>${I.steps} Voir la correction détaillée</button>`}
        <div class="actions"><button class="btn primary" onClick=${next}>${pos+1<queue.length?'Suivant':'Terminer'} ${I.next}<kbd>Entrée</kbd></button></div>
      </div>`}
    </div>
  </div>`;
}

function Results({first, items, onRetry, onNext, onBack, nextLabel, backLabel}){
  const ok=items.filter(it=>first[it.id]).length;
  const wrong=items.filter(it=>first[it.id]===false);
  const pct=Math.round(100*ok/items.length);
  return html`<div class="card results">
    <h2>Série terminée</h2>
    <div class="score"><span class="big">${ok}</span><span class="muted"> / ${items.length} réussis du premier coup</span></div>
    <div class="meter"><div style=${{width:pct+'%'}} class=${pct>=80?'hi':pct>=50?'mid':'lo'}></div></div>
    <p class="muted">${pct>=80?'Très bien ! Tu peux passer à la suite.':pct>=50?'C’est en bonne voie. Refais les erreurs, puis passe à la suite.':'Relis l’exemple résolu et la leçon, puis refais la série.'}</p>
    ${wrong.length>0 && html`<div><h3>À revoir</h3><ul class="wrong">${wrong.map(it=>html`<li key=${it.id}>${typo(answerText(it))}</li>`)}</ul>
      <p class="small muted">Ces questions reviendront dans la révision espacée.</p></div>`}
    <div class="actions">
      <button class="btn" onClick=${onBack}>${I.back} ${backLabel||'Retour'}</button>
      ${wrong.length>0 && onRetry && html`<button class="btn" onClick=${()=>onRetry(wrong)}>${I.review} Refaire les erreurs</button>`}
      ${onNext && html`<button class="btn primary" onClick=${onNext}>${nextLabel} ${I.next}</button>`}
    </div>
  </div>`;
}

function FamilyPage({m, f, settings, store, setStore, openFam, back}){
  const [phase,setPhase]=useState('ex'); const [run,setRun]=useState(null); const [done,setDone]=useState(null);
  useEffect(()=>{ setPhase('ex'); setRun(null); setDone(null); },[f.id]);
  const idx=m.familles.indexOf(f); const nextF=m.familles[idx+1];
  function answer(it, ok){ setStore(s=>{ const L={...(s.leitner||{})}; if(!ok) L[it.id]={box:1,due:today()}; return {...s, leitner:L}; }); }
  function start(items){ setDone(null); setRun({items: items||f.items, key:Date.now()}); setPhase('run'); }
  function finish(first){ const items=run.items; const ok=items.filter(it=>first[it.id]).length;
    if(items===f.items) setStore(s=>{ const b={...(s.best||{})}; const mb={...(b[m.id]||{})}; mb[f.id]=Math.max(mb[f.id]||0, ok/items.length); b[m.id]=mb; return {...s,best:b}; });
    setDone({first, items}); setRun(null); setPhase('res'); }
  return html`<div class="page">
    <nav class="crumbs"><button class="linkbtn" onClick=${back}>${I.back} ${m.titre}</button></nav>
    <div class="page-head"><div class="eyebrow">Famille ${idx+1} sur ${m.familles.length}</div><h1>${f.titre}</h1></div>
    ${phase==='ex' && html`<${Worked} ex=${f.exemple} settings=${settings} onStart=${()=>start()}/>`}
    ${phase==='run' && run && html`<${Runner} key=${run.key} fam=${f} items=${run.items} settings=${settings} onAnswer=${answer} onFinish=${finish}/>`}
    ${phase==='res' && done && html`<${Results} first=${done.first} items=${done.items} onBack=${back} backLabel="Retour au module"
        onRetry=${w=>start(w)} onNext=${nextF?()=>openFam(nextF.id):null} nextLabel=${nextF?'Famille suivante : '+nextF.titre:''}/>`}
  </div>`;
}

const GAPS=[1,3,7,14];
function Revision({settings, store, setStore, visible}){
  const [run,setRun]=useState(null); const [done,setDone]=useState(null);
  const L=store.leitner||{};
  const due=Object.entries(L).filter(([id,v])=>v.due<=today() && ALL_ITEMS[id] && visible.has(ALL_ITEMS[id].mid)).map(([id])=>ALL_ITEMS[id]);
  const waiting=Object.keys(L).length-due.length;
  function answer(it, ok){ setStore(s=>{ const L2={...(s.leitner||{})}; const cur=L2[it.id]||{box:1};
    if(ok){ if(cur.box>=GAPS.length) delete L2[it.id]; else L2[it.id]={box:cur.box+1, due:today()+GAPS[cur.box-1]}; }
    else L2[it.id]={box:1, due:today()+1};
    return {...s, leitner:L2}; }); }
  return html`<div class="page narrow">
    <div class="page-head"><div class="eyebrow">Mémoriser</div><h1>Révision espacée</h1>
      <p class="lead">Les questions ratées reviennent ici après 1, 3, 7 puis 14 jours. Chercher la réponse dans sa mémoire, à intervalles espacés, aide à retenir durablement les mots et les structures.</p></div>
    ${!run && !done && html`<div class="card">
      ${due.length ? html`<p><strong>${due.length}</strong> question${due.length>1?'s':''} à revoir aujourd’hui.</p>
        <div class="actions"><button class="btn primary big" onClick=${()=>setRun({items:shuffle(due, Date.now()).slice(0,12), key:Date.now()})}>${I.play} Commencer la révision</button></div>`
      : html`<p>Rien à revoir aujourd’hui.</p>`}
      ${waiting>0 && html`<p class="muted small">${waiting} question${waiting>1?'s':''} programmée${waiting>1?'s':''} pour les prochains jours.</p>`}
    </div>`}
    ${run && html`<${Runner} key=${run.key} items=${run.items} settings=${settings} onAnswer=${answer} isReview=${true} onFinish=${first=>{setDone({first,items:run.items}); setRun(null);}}/>`}
    ${done && html`<${Results} first=${done.first} items=${done.items} onBack=${()=>setDone(null)} onRetry=${w=>{setDone(null); setRun({items:w,key:Date.now()});}}/>`}
  </div>`;
}

function Progress({store, setStore, mods, go}){
  const [conf,setConf]=useState(false);
  return html`<div class="page narrow">
    <div class="page-head"><div class="eyebrow">Suivi</div><h1>Progression</h1><p class="lead">Meilleur score obtenu du premier coup pour chaque famille d’exercices (enregistré sur cet appareil).</p></div>
    ${mods.map(m=>html`<div key=${m.id} class="card prog-card"><h3><button class="linkbtn" onClick=${()=>go(m.id)}>${m.titre}</button></h3>
      <table class="prog"><tbody>${m.familles.map((f,i)=>{ const v=scoreOf(store,m.id,f.id); return html`<tr key=${f.id}><td>${i+1}. ${f.titre}</td><td class="r">${v==null?html`<span class="muted">—</span>`:html`<span class=${'pill '+(v>=.8?'hi':v>=.5?'mid':'lo')}>${Math.round(v*100)} %</span>`}</td></tr>`; })}</tbody></table></div>`)}
    <div class="actions">${conf ? html`<span class="small">Effacer tous les scores et la révision ?</span><button class="btn danger" onClick=${()=>{ setStore(s=>({...s,best:{},leitner:{}})); setConf(false); }}>Oui, effacer</button><button class="btn" onClick=${()=>setConf(false)}>Annuler</button>`
      : html`<button class="btn" onClick=${()=>setConf(true)}>Effacer la progression…</button>`}</div>
  </div>`;
}

function Guide({go, mods}){
  return html`<div class="page narrow">
    <div class="page-head"><div class="eyebrow">Mode d’emploi</div><h1>Lexicraft</h1>
      <p class="lead">Des exercices de lexique et de construction de phrases dans l’univers de Mineclonia, pour des adolescents de 11 à 15 ans avec un trouble développemental du langage (TDL).</p></div>
    <div class="card">
      <h3>Le parcours</h3>
      <p>Chaque <strong>module</strong> commence par une <strong>leçon</strong>. Il propose ensuite plusieurs <strong>familles d’exercices</strong>, rangées du plus simple au plus complexe. Chaque famille commence par un <strong>exemple résolu</strong>, déroulé étape par étape. Chaque réponse donne une <strong>correction simple</strong>, puis une <strong>correction détaillée</strong>.</p>
      <div class="grid2">
        <div><h4>${I.word} Lexique</h4><ol>${mods.filter(m=>m.dom==='lex').map(m=>html`<li key=${m.id}><button class="linkbtn" onClick=${()=>go(m.id)}>${m.titre}</button></li>`)}</ol></div>
        <div><h4>${I.sentence} Morphosyntaxe</h4><ol>${mods.filter(m=>m.dom==='morpho').map(m=>html`<li key=${m.id}><button class="linkbtn" onClick=${()=>go(m.id)}>${m.titre}</button></li>`)}</ol></div>
      </div>
    </div>
    <div class="card">
      <h3>Les principes utilisés</h3>
      <ul class="principles">
        <li><strong>Exemple résolu avant d’agir</strong> : l’élève voit toute la démarche avant de s’exercer (théorie de la charge cognitive).</li>
        <li><strong>Une étape, puis une question à la fois</strong> : l’exemple se dévoile pas à pas et chaque écran ne pose qu’une question (segmentation).</li>
        <li><strong>De la compréhension à la production</strong> : dans chaque module, on reconnaît d’abord, puis on comprend, puis on transforme et on produit.</li>
        <li><strong>Aide qui s’efface</strong> : le rappel de méthode est affiché pour les premières questions, puis disponible sur demande.</li>
        <li><strong>Image et mot ensemble</strong> : l’image est placée juste au-dessus de la question, sans décor inutile (contiguïté, cohérence).</li>
        <li><strong>Un code couleur stable</strong> : <${Rich} t="{S:sujet} {V:verbe} {COD:COD} {COI:COI} {CC:CC} {AG:compl. d’agent} {P:pronom}" nolabel=${true}/>, avec l’étiquette écrite sous chaque groupe, comme dans l’application de grammaire.</li>
        <li><strong>Écouter plutôt que lire</strong> : la lecture audio présente les consignes à l’oral (principe de modalité).</li>
        <li><strong>Catégorie + mots-clés + forme</strong> : pour retenir un mot, on mémorise son mot générique, ses traits sémantiques et sa forme sonore (approche sémantique et phonologique, comme dans « Devinette concept »).</li>
        <li><strong>Récupération espacée</strong> : une question ratée revient trois questions plus tard, puis dans la révision après 1, 3, 7 et 14 jours.</li>
      </ul>
    </div>
    <div class="card">
      <h3>À propos du TLOCC</h3>
      <p>Les structures de phrases suivent la progression du <em>Test de Langage Oral Complexe pour Collégiens</em> (pronoms compléments, subjonctif, relatives, relations logiques, hypothèse, comparaison), avec des <strong>phrases différentes</strong> de celles du test. Les mots du test ne sont pas utilisés dans les exercices courants : les entraîner fausserait un futur passage du test. Un module à part, « Mots du TLOCC », s’affiche si on coche l’option dans la barre d’outils.</p>
    </div>
    <div class="card small muted credits">
      <p>Images du jeu : rendus réalisés à partir des modèles et textures de VoxeLibre (MineClone 2), dont Mineclonia est issu, d’après « Pixel Perfection » de XSSheep, licence CC BY-SA 4.0. Mineclonia et Minecraft sont des marques de leurs projets respectifs ; cet outil est indépendant.</p>
      <p>Pictogrammes : Sergio Palao. Origine : ARASAAC (https://arasaac.org). Licence : CC BY-NC-SA. Propriété : Gouvernement d’Aragon (Espagne).</p>
    </div>
  </div>`;
}

/* ================= application ================= */
function App(){
  const [store,setStoreRaw]=useState(loadStore);
  const setStore = useCallback(fn=>setStoreRaw(s=>{ const n=typeof fn==='function'?fn(s):fn; saveStore(n); return n; }),[]);
  const settings = {audio:false, tlocc:false, theme:'auto', big:false, ...(store.settings||{})};
  const setSet=(k,v)=>setStore(s=>({...s, settings:{...settings, [k]:v}}));
  const [route,setRoute]=useState({page:'guide'});
  const mods = MODULES.filter(m=>!m.tlocc || settings.tlocc);
  const visible = new Set(mods.map(m=>m.id));
  useEffect(()=>{ const r=document.documentElement; if(settings.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',settings.theme); r.classList.toggle('bigtext', !!settings.big); },[settings.theme, settings.big]);
  useEffect(()=>{ if(route.mod && !visible.has(route.mod)) setRoute({page:'guide'}); },[settings.tlocc]);
  const mainRef=useRef();
  const nav = r => { setRoute(r); if(mainRef.current) mainRef.current.scrollTop=0; try{ speechSynthesis.cancel(); }catch(e){} };
  const go = id => nav({page:'mod', mod:id});
  const L=store.leitner||{}; const dueN=Object.entries(L).filter(([id,v])=>v.due<=today()&&ALL_ITEMS[id]&&visible.has(ALL_ITEMS[id].mid)).length;
  const m = route.mod && MODULES.find(x=>x.id===route.mod);
  const f = m && route.fam && m.familles.find(x=>x.id===route.fam);
  const isDark = settings.theme==='dark' || (settings.theme==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const navItem=(key,label,icon,onClick,on,extra)=>html`<button key=${key} class=${'navitem'+(on?' on':'')} onClick=${onClick}>${icon}<span class="grow">${label}</span>${extra}</button>`;
  const modDone = mm => mm.familles.filter(ff=>scoreOf(store,mm.id,ff.id)!=null).length;
  return html`<div class="app">
    <header class="toolbar">
      <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="3" class="brand-bg"/><path d="M7 8h10M7 12h6M7 16h8" class="brand-ln"/></svg>Lexicraft</div>
      <div class="grow"></div>
      <label class="cb" title="Lire les consignes à voix haute"><input type="checkbox" checked=${settings.audio} onChange=${e=>setSet('audio',e.target.checked)}/>${I.speaker} Audio</label>
      <label class="cb" title="Afficher le module des mots du TLOCC"><input type="checkbox" checked=${settings.tlocc} onChange=${e=>setSet('tlocc',e.target.checked)}/> Mots du TLOCC</label>
      <button class="btn icon-only" title="Agrandir le texte" aria-pressed=${!!settings.big} onClick=${()=>setSet('big',!settings.big)}><span style=${{fontWeight:600}}>A+</span></button>
      <button class="btn icon-only" title="Thème clair / sombre" onClick=${()=>setSet('theme', isDark?'light':'dark')}>${I.moon}</button>
    </header>
    <div class="body">
      <nav class="side" aria-label="Modules">
        ${navItem('guide','Mode d’emploi',I.guide,()=>nav({page:'guide'}),route.page==='guide')}
        <div class="side-h">Lexique</div>
        ${mods.filter(x=>x.dom==='lex').map(x=>navItem(x.id,x.titre,I.word,()=>go(x.id),route.mod===x.id, x.tlocc?html`<span class="warn-dot" title="Mots du test">!</span>`:html`<span class="mini">${modDone(x)}/${x.familles.length}</span>`))}
        <div class="side-h">Morphosyntaxe</div>
        ${mods.filter(x=>x.dom==='morpho').map(x=>navItem(x.id,x.titre,I.sentence,()=>go(x.id),route.mod===x.id, html`<span class="mini">${modDone(x)}/${x.familles.length}</span>`))}
        <div class="side-h">Suivi</div>
        ${navItem('revision','Révision espacée',I.review,()=>nav({page:'revision'}),route.page==='revision', dueN?html`<span class="count">${dueN}</span>`:null)}
        ${navItem('progres','Progression',I.chart,()=>nav({page:'progres'}),route.page==='progres')}
      </nav>
      <main class="main" ref=${mainRef}>
        ${route.page==='guide' && html`<${Guide} go=${go} mods=${mods}/>`}
        ${route.page==='revision' && html`<${Revision} settings=${settings} store=${store} setStore=${setStore} visible=${visible}/>`}
        ${route.page==='progres' && html`<${Progress} store=${store} setStore=${setStore} mods=${mods} go=${go}/>`}
        ${route.page==='mod' && m && !f && html`<${ModulePage} key=${m.id} m=${m} settings=${settings} store=${store} setStore=${setStore} openFam=${fid=>nav({page:'mod',mod:m.id,fam:fid})}/>`}
        ${route.page==='mod' && f && html`<${FamilyPage} key=${m.id+f.id} m=${m} f=${f} settings=${settings} store=${store} setStore=${setStore} openFam=${fid=>nav({page:'mod',mod:m.id,fam:fid})} back=${()=>go(m.id)}/>`}
      </main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

</script>
</body>
</html>
