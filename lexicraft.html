<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicraft – lexique et phrases complexes dans Mineclonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette Breeze (KDE Plasma) */
  --bg:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --text:#232629; --muted:#5d6468;
  --border:#c4c9cd; --btn:#f7f8f8; --accent:#3daee9; --accent-ink:#1b7cb5; --accent-soft:rgba(61,174,233,.15);
  --pos:#27ae60; --pos-soft:rgba(39,174,96,.12); --neg:#da4453; --neg-soft:rgba(218,68,83,.10); --warn:#f67400; --warn-soft:rgba(246,116,0,.12);
  --tile:#e6e9ec;
  /* code couleur des fonctions (toujours le même) */
  --rS:#1d78c1; --rV:#c0392b; --rCOD:#1e8449; --rCOI:#0f8a8a; --rCC:#8e44ad; --rAG:#b35c00; --rP:#a6750a; --rPR:#a6750a; --rR:#4d5d6e;
  --rK:#d35400; --rN:#7f8c8d; --rMOT:#1d78c1; --rCAT:#8e44ad; --rCLE:#1e8449; --rATT:#4d5d6e;
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"Noto Sans Mono",ui-monospace,monospace;
  --r:4px; color-scheme:light; font-size:16px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7; --border:#4a5056; --btn:#31363b; --tile:#3a4046;
  --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2); --pos:#2ecc71; --pos-soft:rgba(46,204,113,.15); --neg:#ed5565; --neg-soft:rgba(237,85,101,.15);
  --rS:#5aaef0; --rV:#ef6b5b; --rCOD:#3fcf7f; --rCOI:#3cc8c8; --rCC:#c08ae0; --rAG:#f0a050; --rP:#f0c050; --rPR:#f0c050; --rR:#a8b8c8; --rMOT:#5aaef0; --rCAT:#c08ae0; --rCLE:#3fcf7f; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7; --border:#4a5056; --btn:#31363b; --tile:#3a4046;
  --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2); --pos:#2ecc71; --pos-soft:rgba(46,204,113,.15); --neg:#ed5565; --neg-soft:rgba(237,85,101,.15);
  --rS:#5aaef0; --rV:#ef6b5b; --rCOD:#3fcf7f; --rCOI:#3cc8c8; --rCC:#c08ae0; --rAG:#f0a050; --rP:#f0c050; --rPR:#f0c050; --rR:#a8b8c8; --rMOT:#5aaef0; --rCAT:#c08ae0; --rCLE:#3fcf7f; color-scheme:dark; }
:root.bigtext{font-size:19px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:1rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.55rem;font-weight:600} h2{font-size:1.15rem;font-weight:600;margin-bottom:.6rem;display:flex;gap:8px;align-items:center} h3{font-size:1.02rem;font-weight:600;margin:0 0 .5rem} h4{font-size:.95rem;font-weight:600;margin:.2rem 0 .4rem;display:flex;gap:6px;align-items:center}
p{margin:.45rem 0}
.muted{color:var(--muted)} .small{font-size:.86rem} .grow{flex:1}
kbd{font:600 .7rem var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 .3rem;margin-left:.3rem;background:var(--view);color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ico{flex:none}

/* coquille d'application KDE */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.toolbar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--header);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1.02rem}
.brand-bg{fill:var(--accent)} .brand-ln{stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.cb{display:flex;align-items:center;gap:5px;font-size:.88rem;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:3px}
.cb:hover{background:var(--accent-soft)} .cb input{accent-color:var(--accent);margin:0}
.body{display:grid;grid-template-columns:270px 1fr;min-height:0}
.side{background:var(--bg);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:14px 10px 4px}
.navitem{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;text-align:left;font-size:.92rem}
.navitem:hover{background:var(--accent-soft)}
.navitem.on{background:var(--accent-soft);border-color:var(--accent)}
.mini{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.count{background:var(--accent);color:#fff;border-radius:9px;font-size:.72rem;padding:0 7px;font-weight:600}
.warn-dot{background:var(--warn);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.7rem;display:grid;place-items:center;font-weight:700}
.main{background:var(--view);overflow:auto;min-height:0}
.page{padding:22px 28px 60px;max-width:940px}
.page.narrow{max-width:840px}
.page-head{margin-bottom:14px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:600;margin-bottom:2px}
.lead{color:var(--muted);max-width:72ch;margin-top:.4rem}
.crumbs{margin-bottom:6px}

/* éléments communs */
.card{border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;background:var(--view);margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:6px 13px;min-height:36px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:rgba(61,174,233,.28)}
.btn.big{padding:9px 18px;font-weight:600}
.btn.danger{border-color:var(--neg);background:var(--neg-soft)}
.btn.icon-only{padding:4px 8px;min-height:32px}
.btn.ghost{background:none;border-color:transparent} .btn.ghost:hover{border-color:var(--border)}
.linkbtn{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:5px;text-align:left}
.linkbtn:hover{text-decoration:underline}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* groupes colorés avec étiquette (comme l'application de grammaire) */
.grp{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;margin:0 1px;line-height:1.2}
.grp .gt{border-bottom:3px solid currentColor;padding:0 2px;font-weight:600}
.grp .gl{font-size:.66rem;font-weight:600;letter-spacing:.02em;margin-top:2px;opacity:.95;white-space:nowrap}
.grp.nl{display:inline}
.g-S{color:var(--rS)} .g-V{color:var(--rV)} .g-COD{color:var(--rCOD)} .g-COI{color:var(--rCOI)} .g-CC,.g-CCL,.g-CCT{color:var(--rCC)} .g-AG{color:var(--rAG)}
.g-P,.g-PR{color:var(--rP)} .g-R{color:var(--rR)} .g-K{color:var(--rK)} .g-N{color:var(--rN)} .g-MOT{color:var(--rMOT)} .g-CAT{color:var(--rCAT)} .g-CLE{color:var(--rCLE)} .g-ATT{color:var(--rATT)}
.blank{display:inline-block;width:4.5em;border-bottom:2px solid var(--text);margin:0 3px;height:1em;vertical-align:-.15em}
.filled{font-weight:700;color:var(--pos);border-bottom:2px solid var(--pos);padding:0 3px}

/* leçon */
.lecon h2{color:var(--text)}
.lecon p{max-width:75ch}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);margin:10px 0}
.note.astuce{background:var(--accent-soft);border-left:3px solid var(--accent)}
.note.avert{background:var(--warn-soft);border-left:3px solid var(--warn)}
.note.avert strong{color:var(--warn);font-size:1.1rem;line-height:1.3}
.etapes{margin:.4rem 0;padding-left:1.4rem} .etapes li{margin:.35rem 0}
.phrase-demo{font-size:1.25rem;padding:12px 16px;background:var(--bg);border-radius:var(--r);line-height:1.9}
.tablewrap{overflow-x:auto}
.ltable{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
.ltable th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding:6px 8px;background:var(--bg)}
.ltable td{border-bottom:1px solid var(--border);padding:7px 8px;vertical-align:top;line-height:1.7}
.ordre{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.ochip{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:2px 10px;font-weight:600;color:var(--rP)}
.sep{color:var(--muted)}
.passif{background:var(--bg);border-radius:var(--r);padding:12px 16px;margin:10px 0;max-width:620px}
.pv-lab{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.pv-row{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;font-size:1.15rem;padding:4px 0}
.pv-arrows{width:100%;height:56px;display:block;color:var(--muted)}
.pv-legend{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:3px}
.pv-legend li{display:flex;gap:8px;align-items:center}
.sw{display:inline-block;width:22px;height:3px} .sw.dashed{height:0;border-top:3px dashed}
.arbre{background:var(--bg);border-radius:var(--r);padding:12px;margin:10px 0;text-align:center}
.a-top{display:inline-block;font-weight:700;border:2px solid var(--rCAT);color:var(--rCAT);border-radius:3px;padding:2px 14px;margin-bottom:10px}
.a-mids{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.a-col{display:flex;flex-direction:column;align-items:center;gap:6px;border-top:2px solid var(--border);padding-top:8px}
.a-mid{font-weight:600;color:var(--rCAT)} .a-leaves{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:220px}
.a-leaves span{background:var(--view);border:1px solid var(--border);border-radius:3px;padding:0 8px;font-size:.9rem}
.famschema{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border-radius:var(--r);padding:12px;margin:10px 0}
.f-rad{font:700 1.3rem var(--mono);color:var(--rS);border:2px solid var(--rS);border-radius:3px;padding:4px 12px}
.f-mots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;flex:1}
.f-mot{display:flex;flex-direction:column;background:var(--view);border:1px solid var(--border);border-radius:3px;padding:6px 10px}

/* liste des familles */
.h-fam{margin-top:22px}
.famlist{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.famitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--view);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;cursor:pointer}
.famitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.fnum{font-weight:700;color:var(--accent-ink);width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;font-size:.85rem;flex:none}
.ftitle{display:block;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.none{border:1.5px solid var(--border)}
.dot.hi,.pill.hi,.meter .hi{background:var(--pos)} .dot.mid,.pill.mid,.meter .mid{background:var(--warn)} .dot.lo,.pill.lo,.meter .lo{background:var(--neg)}

/* visuels */
.visuals{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:2px 0 10px}
.mc{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mc-frame{display:grid;place-items:center;background:var(--tile);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.mc.item img{image-rendering:pixelated;image-rendering:crisp-edges}
.mc figcaption{font-size:.86rem;font-weight:600;color:var(--fg);text-align:center;line-height:1.2}
.badge{font-size:.78rem;font-weight:600;padding:0 8px;border-radius:9px;border:1px solid}
.b-m{color:var(--rS);border-color:var(--rS)} .b-f{color:var(--rK);border-color:var(--rK)} .b-p{color:var(--rCOD);border-color:var(--rCOD)}
.picto{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:4px}
.famcard{display:flex;gap:14px;align-items:center;margin-top:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--view);font-size:.95rem;font-weight:400}
.famcard table{border-collapse:collapse} .famcard th{text-align:left;font-weight:600;color:var(--muted);padding:2px 12px 2px 0;font-size:.85rem;white-space:nowrap} .famcard td{padding:2px 0}
.carte{border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:10px 14px;margin:4px 0 10px;font-weight:400}
.carte.mot{display:inline-flex;align-items:center;gap:14px}
.carte.full{display:flex;gap:14px;align-items:flex-start;background:var(--view)}
.carte.devinette{display:inline-flex;flex-direction:column;gap:6px;border-left:3px solid var(--rCAT)}
.c-mot{font-weight:700;font-size:1.15rem}
.c-row{display:flex;gap:10px;align-items:baseline;margin:3px 0}
.c-row>:last-child{flex:1 1 auto;min-width:0}
.c-lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;min-width:78px}
.c-cat{font-weight:700;color:var(--rCAT)}
.c-cles{display:flex;gap:6px;flex-wrap:wrap}
.cle{border:1px solid var(--rCLE);color:var(--rCLE);border-radius:10px;padding:0 9px;font-weight:600;font-size:.92rem}
.c-def{margin:.4rem 0 0;max-width:60ch}
.schema-carte{max-width:520px}
.scene{display:flex;align-items:center;gap:6px;justify-content:center}
.scene .arrow{display:flex;flex-direction:column;align-items:center;color:var(--rV);min-width:84px}
.scene .verb{font-weight:700;font-size:.92rem;white-space:nowrap}

/* exemple résolu */
.worked{border-left:4px solid var(--accent)}
.tag{display:inline-block;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 8px;border-radius:3px;margin-bottom:10px}
.prompt-row{display:flex;gap:10px;align-items:flex-start}
.prompt{font-size:1.18rem;font-weight:600;margin:.2rem 0 .6rem;flex:1}
.ctx{font-size:1.12rem;margin:.1rem 0 .3rem;padding:8px 12px;background:var(--bg);border-radius:var(--r);border-left:3px solid var(--border)}
.steps{margin:.4rem 0 0;padding-left:1.5rem}
.steps li{margin:.5rem 0;padding:3px 6px;animation:fade .35s ease;line-height:1.8}
.steps li.cur{background:var(--accent-soft);border-radius:3px}
.say-inline{margin-left:6px;vertical-align:middle;color:var(--muted)}
.answer{margin-top:12px;padding:10px 14px;border:1px solid var(--pos);background:var(--pos-soft);border-radius:var(--r);font-size:1.1rem;font-weight:600}
.answer .muted{font-weight:400;display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* exercice */
.run-head{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.progress{flex:1;height:6px;background:var(--header);border-radius:3px;overflow:hidden}
.progress div{height:100%;background:var(--accent);transition:width .3s}
.item{animation:fade .25s ease}
.retry{font-size:.86rem;color:var(--warn);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.aide{font-size:.92rem;color:var(--muted);margin:0 0 10px}
.aide span{display:inline-flex;gap:6px;align-items:flex-start}
.options{display:flex;flex-direction:column;gap:7px;max-width:640px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:9px 12px;cursor:pointer;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--pos);background:var(--pos-soft)}
.opt.ko{border-color:var(--neg);background:var(--neg-soft)}
.opt:disabled{cursor:default}
.key{font:600 .75rem var(--mono);border:1px solid var(--border);border-radius:3px;width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:none;background:var(--view)}
.otext{flex:1}
.opt .say{color:var(--muted);display:inline-flex;padding:2px}
.multi{display:flex;flex-wrap:wrap;gap:8px}
.mchip{background:var(--btn);border:1px solid var(--border);border-radius:16px;padding:6px 14px;cursor:pointer;font-size:1.02rem}
.mchip.on{border-color:var(--accent);background:var(--accent-soft)}
.mchip.ok{border-color:var(--pos);background:var(--pos-soft)} .mchip.ko{border-color:var(--neg);background:var(--neg-soft)} .mchip.miss{border-color:var(--pos);border-style:dashed}
.inp-row{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1;min-width:200px;max-width:380px;border:1px solid var(--border);border-radius:3px;padding:8px 10px;background:var(--view);font-size:1.1rem}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.hints{margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hint{padding:4px 10px;background:var(--warn-soft);border-radius:3px}
.line{min-height:62px;border:1px dashed var(--border);border-radius:var(--r);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.line .pre,.line .end{font-size:1.08rem;font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:52px}
.chip{display:inline-flex;flex-direction:column;align-items:center;background:var(--btn);border:1px solid var(--border);border-bottom:4px solid currentColor;border-radius:3px;padding:5px 12px 3px;cursor:pointer;font-size:1.05rem;line-height:1.2}
.chip .ct{color:var(--text)} .chip .cl{font-size:.66rem;font-weight:600;margin-top:2px}
.chip:hover:not(:disabled){background:var(--accent-soft)}
.chip.r-S{color:var(--rS)} .chip.r-V{color:var(--rV)} .chip.r-COD{color:var(--rCOD)} .chip.r-COI{color:var(--rCOI)} .chip.r-CC,.chip.r-CCL,.chip.r-CCT{color:var(--rCC)} .chip.r-AG{color:var(--rAG)}
.chip.r-P,.chip.r-PR{color:var(--rP)} .chip.r-R{color:var(--rR)} .chip.r-K{color:var(--rK)} .chip.r-N{color:var(--rN)} .chip.r-MOT{color:var(--rMOT)} .chip.r-CAT{color:var(--rCAT)} .chip.r-CLE{color:var(--rCLE)}
.tri{display:flex;flex-direction:column;gap:6px}
.tri-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;background:var(--view)}
.tri-row.ok{border-color:var(--pos);background:var(--pos-soft)} .tri-row.ko{border-color:var(--neg);background:var(--neg-soft)}
.tri-it{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;font-size:1.05rem}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.segbtn{background:var(--btn);border:none;border-right:1px solid var(--border);padding:6px 12px;cursor:pointer;font-size:.95rem}
.segbtn:last-child{border-right:none}
.segbtn.on{background:var(--accent);color:#fff}
.segbtn.right{box-shadow:inset 0 -3px 0 var(--pos)}
.slots-line{font-size:1.15rem;line-height:2.4}
.slot{border:1px solid var(--accent);border-radius:3px;background:var(--view);padding:3px 6px;margin:0 3px;font-size:1.05rem;font-weight:600}
.slot.ok{border-color:var(--pos);background:var(--pos-soft)} .slot.ko{border-color:var(--neg);background:var(--neg-soft)}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px}
.scene-opt{position:relative;background:var(--btn);border:1px solid var(--border);border-radius:var(--r);padding:12px 6px 8px;cursor:pointer}
.scene-opt .key{position:absolute;top:6px;left:6px}
.scene-opt:hover:not(:disabled){border-color:var(--accent)}
.scene-opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.scene-opt.ok{border-color:var(--pos);background:var(--pos-soft)} .scene-opt.ko{border-color:var(--neg);background:var(--neg-soft)}
.scene.compact .mc-frame{border:none;background:transparent}
.feedback{margin-top:14px;border-radius:var(--r);padding:12px 16px;border:1px solid}
.feedback.good{border-color:var(--pos);background:var(--pos-soft)}
.feedback.bad{border-color:var(--neg);background:var(--neg-soft)}
.fb-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.good .fb-head{color:var(--pos)} .bad .fb-head{color:var(--neg)}
.fb-head span{color:var(--text)}
.fb-answer{font-size:1.06rem;font-weight:600}
.detail{border-top:1px solid var(--border);margin-top:8px;padding-top:6px;line-height:1.9}
.detail .scene{justify-content:flex-start}

/* résultats et suivi */
.results .score .big{font-size:2.2rem;font-weight:700}
.meter{height:8px;background:var(--header);border-radius:4px;overflow:hidden;max-width:420px;margin:6px 0}
.meter div{height:100%}
.wrong{margin:.2rem 0;padding-left:1.2rem}
.prog{border-collapse:collapse;width:100%}
.prog td{border-bottom:1px solid var(--border);padding:5px 8px}
.prog td.r{text-align:right;width:80px}
.pill{color:#fff;border-radius:9px;padding:1px 8px;font-size:.8rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 ol{margin:.2rem 0;padding-left:1.3rem}
.principles li{margin:.4rem 0;line-height:1.9}
.credits p{margin:.3rem 0}

@media (max-width:820px){
  .body{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px}
  .side-h{display:none}
  .navitem{white-space:nowrap}
  .page{padding:16px 14px 48px}
  .grid2{grid-template-columns:1fr}
  .scenes{grid-template-columns:1fr}
}
</style>

  objectif:'Remplacer un complément par le bon pronom (le, la, les, lui, leur, y, en), le placer au bon endroit et combiner deux pronoms.',
  lecon:[
    {t:'p', x:'Pour ne pas répéter un nom, on le remplace par un **pronom**. Il se place **devant le verbe**.'},
    {t:'table', head:['Pronom','Il remplace…','Exemple'], rows:[
      ['le · la · l’ · les','un {COD:COD} (chose ou personne, sans « à »)','Je vois {COD:le zombie}. → Je {P:le} vois.'],
      ['lui · leur','un {COI:COI} de **personne** avec « à »','Je parle {COI:au villageois}. → Je {P:lui} parle.'],
      ['y','« à + chose » ou un **lieu**','Je vais {CCL:à la mine}. → J’{P:y} vais.'],
      ['en','« de + chose », ou une **quantité**','J’ai {COD:des émeraudes}. → J’{P:en} ai.'],
    ]},
    {t:'etapes', x:[
      'Je cherche le complément à remplacer et je regarde s’il y a **à** ou **de** devant.',
      'Je choisis le pronom dans le tableau.',
      'Je le place **devant le verbe conjugué** (ou devant l’infinitif : « je vais **le** voir »).',
    ]},
    {t:'ordre', x:['me · te · nous · vous','le · la · les','lui · leur','y','en']},
    {t:'avert', x:'Au passé composé avec avoir, le participe s’accorde avec le pronom COD placé avant : « Les pommes ? Je **les** ai pri**ses**. »'},
  ],
  familles:[
    { id:'f-cod', titre:'le, la, l’, les', aide:'Pas de « à » ni de « de » devant le complément → le, la, l’, les.',
      exemple:{p:'« Alex prend la pioche. » Remplace « la pioche » par un pronom.', steps:[
        'Alex prend quoi ? → {COD:la pioche} : pas de « à » → COD.',
        'Féminin singulier → **la**.',
        'Je le place devant le verbe : Alex {P:la} prend.'], r:'Alex la prend.'},
      items:[
        {t:'qcm', ctx:'« Vois-tu le zombie ? »', p:'Oui, …', o:['je le vois.','je lui vois.','j’en vois.'], e:'Voir **quelqu’un** (pas de « à ») → {P:le}.'},
        {t:'qcm', ctx:'« Steve range ses lingots. »', p:'Steve…', o:['les range.','leur range.','en range.'], e:'Il range quoi ? → ses lingots : COD pluriel → {P:les}.'},
        {t:'qcm', ctx:'« Allumes-tu la torche ? »', p:'Oui, …', o:['je l’allume.','je la allume.','je lui allume.'], e:'Devant une voyelle, **la** devient **l’** : je {P:l’}allume.'},
        {t:'qcm', ctx:'« Aides-tu les villageois ? »', p:'Oui, …', o:['je les aide.','je leur aide.','j’y aide.'], e:'Piège : on aide **quelqu’un** (sans « à ») → {P:les}.'},
        {t:'qcm', ctx:'« Vois-tu la louve ? »', p:'Non, …', o:['je ne la vois pas.','je la ne vois pas.','je ne vois pas la.'], e:'Avec la négation : **ne** + pronom + verbe + **pas** → je {N:ne} {P:la} vois {N:pas}.'},
        {t:'ord', ctx:'« Le berger appelle ses moutons. »', p:'Remplace « ses moutons » par un pronom.', k:[['le berger','S'],['les','P'],['appelle','V']], x:[['leur','P']], e:'Appeler **quelqu’un** → {P:les}, devant le verbe.'},
      ]},
    { id:'f-coi', titre:'lui, leur', aide:'« à + une personne » → lui (une) ou leur (plusieurs). Mais aider, appeler, écouter… n’ont pas de « à ».',
      exemple:{p:'« Steve parle au villageois. » Remplace « au villageois ».', steps:[
        'Steve parle **à qui** ? → {COI:au villageois} : il y a **à** + une personne.',
        'Une seule personne → **lui**.',
        'Steve {P:lui} parle.'], r:'Steve lui parle.'},
      items:[
        {t:'qcm', ctx:'« Réponds-tu aux villageois ? »', p:'Oui, …', o:['je leur réponds.','je les réponds.','je leurs réponds.'], e:'Répondre **à** des personnes → {P:leur} (jamais de **s** à ce pronom).'},
        {t:'qcm', ctx:'« Le golem obéit-il au villageois ? »', p:'Oui, …', o:['il lui obéit.','il l’obéit.','il y obéit.'], e:'Obéir **à** quelqu’un → {P:lui}.'},
        {t:'qcm', ctx:'« Écoutes-tu le marchand ? »', p:'Oui, …', o:['je l’écoute.','je lui écoute.','j’en écoute.'], e:'Piège : on écoute **quelqu’un** (sans « à ») → {P:l’}.'},
        {t:'qcm', ctx:'« Souris-tu à ta sœur ? »', p:'Oui, …', o:['je lui souris.','je la souris.','j’y souris.'], e:'Sourire **à** quelqu’un → {P:lui} (pour un homme comme pour une femme).'},
        {t:'qcm', ctx:'« Remercies-tu les forgerons ? »', p:'Oui, …', o:['je les remercie.','je leur remercie.','j’en remercie.'], e:'Piège : on remercie **quelqu’un** (sans « à ») → {P:les}.'},
        {t:'qcm', ctx:'« Offres-tu un cadeau à tes amis ? »', p:'Oui, …', o:['je leur offre un cadeau.','je les offre un cadeau.','je lui offre un cadeau.'], e:'Offrir **à** des personnes → {P:leur}.'},
      ]},
    { id:'f-yen', titre:'y et en', aide:'« à + chose / lieu » → y. « de + chose » ou une quantité (des, du, un peu, trois…) → en.',
      exemple:{p:'« As-tu du fer ? » Réponds avec un pronom.', steps:[
        '« du fer » : **du** = de + le → une quantité.',
        'Une quantité ou « de + chose » → **en**.',
        'Oui, j’{P:en} ai.'], r:'Oui, j’en ai.'},
      items:[
        {t:'qcm', ctx:'« Vas-tu au village ? »', p:'Oui, …', o:['j’y vais.','j’en vais.','je le vais.'], e:'Un lieu → {P:y}.'},
        {t:'qcm', ctx:'« Combien de diamants as-tu ? »', p:'…', o:['J’en ai trois.','J’y ai trois.','Je les ai trois.'], e:'Une quantité → {P:en} : j’**en** ai trois.'},
        {t:'qcm', ctx:'« Penses-tu à ta quête ? »', p:'Oui, …', o:['j’y pense.','je lui pense.','j’en pense.'], e:'Penser **à une chose** → {P:y}.'},
        {t:'qcm', ctx:'« Penses-tu à ta sœur ? »', p:'Oui, …', o:['je pense à elle.','je lui pense.','j’y pense.'], e:'Piège : avec **penser à + une personne**, on garde « **à elle** » / « **à lui** ».'},
        {t:'qcm', ctx:'« Reviens-tu de la mine ? »', p:'Oui, …', o:['j’en reviens.','j’y reviens.','je la reviens.'], e:'Revenir **de** un lieu → {P:en}.'},
        {t:'qcm', ctx:'« As-tu besoin de ton épée ? »', p:'Oui, …', o:['j’en ai besoin.','j’y ai besoin.','je l’ai besoin.'], e:'Avoir besoin **de** quelque chose → {P:en}.'},
        {t:'qcm', ctx:'« Te méfies-tu des araignées ? »', p:'Oui, …', o:['je m’en méfie.','je me les méfie.','je m’y méfie.'], e:'Se méfier **de** → {P:en} : je {P:m’}{P:en} méfie.'},
      ]},
    { id:'f-place', titre:'La place du pronom et l’accord', aide:'Avec deux verbes (je vais voir, je veux prendre), le pronom se met devant l’infinitif. Au passé composé, il se met devant « avoir ».',
      exemple:{p:'« As-tu pris les pommes ? » Réponds avec un pronom.', steps:[
        '« les pommes » est COD → **les**.',
        'Au passé composé, le pronom se met devant **avoir** : je **les** ai pris…',
        'Le COD est placé **avant** avoir → le participe s’accorde : les pommes (féminin pluriel) → pri**ses**.'], r:'Oui, je les ai prises.'},
      items:[
        {t:'qcm', ctx:'« Veux-tu ouvrir le coffre ? »', p:'Oui, …', o:['je veux l’ouvrir.','je le veux ouvrir.','je veux ouvrir le.'], e:'Le pronom se place devant le verbe dont il est complément : **ouvrir** → je veux {P:l’}ouvrir.'},
        {t:'qcm', ctx:'« Vas-tu nourrir les poules ? »', p:'Oui, …', o:['je vais les nourrir.','je les vais nourrir.','je vais leur nourrir.'], e:'Devant l’infinitif : je vais {P:les} nourrir.'},
        {t:'qcm', ctx:'« Peux-tu aller à la mine ? »', p:'Oui, …', o:['je peux y aller.','j’y peux aller.','je peux aller y.'], e:'Devant l’infinitif : je peux {P:y} aller.'},
        {t:'qcm', ctx:'« As-tu vu la louve ? »', p:'Oui, …', o:['je l’ai vue.','je l’ai vu.','je la ai vue.'], e:'**l’** (la louve) est placé avant avoir → vu**e**.'},
        {t:'qcm', ctx:'« As-tu mis les bottes ? »', p:'Oui, …', o:['je les ai mises.','je les ai mis.','je leur ai mises.'], e:'**les** (les bottes, féminin pluriel) avant avoir → mi**ses** (on entend le **z**).'},
        {t:'qcm', ctx:'« As-tu donné des pommes au cheval ? »', p:'Oui, …', o:['je lui en ai donné.','je lui en ai données.','je en lui ai donné.'], e:'Avec **en**, le participe ne s’accorde pas : je {P:lui} {P:en} ai donné.'},
      ]},
    { id:'f-deux', titre:'Deux pronoms ensemble', aide:'Ordre : me/te/nous/vous → le/la/les → lui/leur → y → en.',
      exemple:{p:'« Donnes-tu le blé aux vaches ? » Réponds avec deux pronoms.', steps:[
        '« le blé » → {P:le}. « aux vaches » → à + plusieurs → {P:leur}.',
        'Ordre : **le / la / les** avant **lui / leur**.',
        'Oui, je {P:le} {P:leur} donne.'], r:'Oui, je le leur donne.'},
      items:[
        {t:'ord', ctx:'« Prêtes-tu ta pioche à Steve ? »', p:'Réponds avec deux pronoms.', pre:'Oui,', k:[['je','S'],['la','P'],['lui','P'],['prête','V']], x:[['le','P']], e:'« ta pioche » → **la** ; « à Steve » → **lui**. Ordre : la + lui.'},
        {t:'ord', ctx:'« Mets-tu les lingots dans le coffre ? »', p:'Réponds avec deux pronoms.', pre:'Oui,', k:[['je','S'],['les','P'],['y','P'],['mets','V']], x:[['en','P']], e:'« les lingots » → **les** ; « dans le coffre » (un lieu) → **y**. Ordre : les + y.'},
        {t:'ord', ctx:'« Donnes-tu des pommes au cheval ? »', p:'Réponds avec deux pronoms.', pre:'Oui,', k:[['je','S'],['lui','P'],['en','P'],['donne','V']], x:[['les','P']], e:'« des pommes » → **en** ; « au cheval » → **lui**. Ordre : lui + en.'},
        {t:'ord', ctx:'« Le forgeron te vend-il l’épée ? »', p:'Réponds avec deux pronoms.', pre:'Oui,', k:[['il','S'],['me','P'],['la','P'],['vend','V']], x:[['te','P']], e:'« te » devient **me** (c’est moi qui réponds) ; « l’épée » → **la**. Ordre : me + la.'},
        {t:'ord', ctx:'« Vas-tu montrer la carte à tes amis ? »', p:'Réponds avec deux pronoms.', pre:'Oui,', k:[['je','S'],['vais','V'],['la','P'],['leur','P'],['montrer','V']], x:[['les','P']], e:'Devant l’infinitif : je vais {P:la} {P:leur} montrer.'},
        {t:'qcm', ctx:'« Tes amis t’ont-ils montré la base ? »', p:'Oui, …', o:['ils me l’ont montrée.','ils me l’ont montré.','ils l’ont me montrée.'], e:'« t’ » → **me** ; « la base » → **l’**, placé avant avoir → montr**ée**.'},
      ]},
  ]},

{ id:'paroles', dom:'morpho', titre:'Rapporter les paroles',
  objectif:'Changer les personnes, les temps et les repères quand on rapporte ce que quelqu’un a dit ou demandé.',
  lecon:[
    {t:'p', x:'Au **discours direct**, on cite les paroles entre guillemets. Au **discours indirect**, on les rapporte avec **que**, **si**, **où**, **ce que**… sans guillemets.'},
    {t:'table', head:['Ce qui change','Discours direct','Discours indirect'], rows:[
      ['les personnes','Alex dit : « **Je** pars. »','Alex dit qu’**elle** part.'],
      ['les temps (si le verbe qui introduit est au passé)','Il a dit : « Je **pars** / J’**ai trouvé** / Je **partirai**. »','Il a dit qu’il **partait** / qu’il **avait trouvé** / qu’il **partirait**.'],
      ['les repères','demain · hier · ici · aujourd’hui','**le lendemain** · **la veille** · **là** · **ce jour-là**'],
      ['les questions','« Veux-tu… ? » · « Où vas-tu ? » · « Que veux-tu ? »','**si** tu veux… · **où** tu vas · **ce que** tu veux'],
    ]},
  ],
  familles:[
    { id:'f-pers', titre:'Qui parle ? Les personnes', aide:'Demande-toi qui est « je » et qui est « tu » dans les paroles.',
      exemple:{p:'Ton ami te dit : « Tu triches ! » Tu n’es pas d’accord. Tu réponds : « Ne dis pas que… »', steps:[
        'Ton ami dit « **tu** » en parlant de **toi**.',
        'Toi, quand tu parles de toi, tu dis « **je** ».',
        '« Ne dis pas que **je** triche ! »'], r:'Ne dis pas que je triche !'},
      items:[
        {t:'qcm', ctx:'Alex dit : « Je suis fatiguée. »', p:'Alex dit…', o:['qu’elle est fatiguée.','que je suis fatiguée.','qu’il est fatigué.'], e:'« Je » = Alex, une fille → **elle**.'},
        {t:'qcm', ctx:'Les villageois disent : « Nous avons faim. »', p:'Les villageois disent…', o:['qu’ils ont faim.','que nous avons faim.','qu’il a faim.'], e:'« Nous » = les villageois → **ils**.'},
        {t:'qcm', ctx:'Ton ami te dit : « Je te vois. » Tu ne le crois pas.', p:'Tu réponds : « Ne dis pas que ___ ! »', o:['tu me vois','je te vois','il me voit'], e:'Son « je » = **lui** → tu ; son « te » = **toi** → me : « Ne dis pas que **tu me** vois ! »'},
        {t:'qcm', ctx:'Ton ami te dit, à toi et à ton frère : « Je vous attends. »', p:'Tu réponds : « Ne dis pas que ___ ! »', o:['tu nous attends','je vous attends','tu vous attends'], e:'Son « je » → **tu** ; son « vous » (ton frère et toi) → **nous**.'},
        {t:'qcm', ctx:'Le golem dit aux villageois : « Je vous protégerai. »', p:'Le golem dit aux villageois…', o:['qu’il les protégera.','qu’il vous protégera.','que je vous protégerai.'], e:'« Je » → **il** ; « vous » = les villageois → **les**. Le verbe introducteur est au présent : le futur reste.'},
      ]},
    { id:'f-temps2', titre:'Le verbe qui introduit est au passé', aide:'Si « a dit », « disait », « pensait »… : présent → imparfait ; passé composé → plus-que-parfait ; futur → conditionnel.',
      exemple:{p:'Steve a dit : « Je pars à la mine. »', steps:[
        'On enlève les guillemets et on ajoute **que** ; « je » = Steve → **il**.',
        'Le verbe qui introduit (**a dit**) est au **passé**.',
        'Le présent **pars** devient l’imparfait **partait** : Steve a dit qu’il partait à la mine.'], r:'Steve a dit qu’il partait à la mine.'},
      items:[
        {t:'qcm', ctx:'Alex a dit : « J’ai trouvé un diamant. »', p:'Alex a dit…', o:['qu’elle avait trouvé un diamant.','qu’elle a trouvé un diamant.','que j’avais trouvé un diamant.'], e:'Passé composé (**ai trouvé**) → plus-que-parfait (**avait trouvé**).'},
        {t:'qcm', ctx:'Le villageois a dit : « Je vendrai mon blé. »', p:'Le villageois a dit…', o:['qu’il vendrait son blé.','qu’il vendra son blé.','qu’il vendrait mon blé.'], e:'Futur (**vendrai**) → conditionnel (**vendrait**) ; « mon » → **son**.'},
        {t:'qcm', ctx:'Steve pensait : « Je suis perdu. »', p:'Steve pensait…', o:['qu’il était perdu.','qu’il est perdu.','qu’il serait perdu.'], e:'Présent (**suis**) → imparfait (**était**).'},
        {t:'qcm', ctx:'Les mineurs ont annoncé : « Nous avons creusé un tunnel. »', p:'Les mineurs ont annoncé…', o:['qu’ils avaient creusé un tunnel.','qu’ils ont creusé un tunnel.','que nous avions creusé un tunnel.'], e:'**avons creusé** → **avaient creusé** ; « nous » → **ils**.'},
        {t:'qcm', ctx:'La forgeronne a promis : « Je finirai ton épée. »', p:'La forgeronne a promis…', o:['qu’elle finirait mon épée.','qu’elle finira ton épée.','qu’elle finirait ton épée.'], e:'Futur → conditionnel (**finirait**) ; « ton épée » (la mienne, à moi qui rapporte) → **mon** épée.'},
      ]},
    { id:'f-reperes', titre:'Les repères de temps et de lieu', aide:'demain → le lendemain ; hier → la veille ; ici → là ; aujourd’hui → ce jour-là.',
      exemple:{p:'Steve a affirmé : « Demain, je combattrai le dragon. »', steps:[
        '« demain » (le jour d’après celui où il parle) → **le lendemain**.',
        'Futur (**combattrai**) → conditionnel (**combattrait**).',
        'Steve a affirmé que **le lendemain**, il **combattrait** le dragon.'], r:'Steve a affirmé que le lendemain, il combattrait le dragon.'},
      items:[
        {t:'qcm', ctx:'Alex a raconté : « Hier, j’ai dormi ici. »', p:'Alex a raconté que…', o:['la veille, elle avait dormi là.','hier, elle a dormi ici.','la veille, elle a dormi ici.'], e:'**hier** → **la veille** ; **ici** → **là** ; passé composé → plus-que-parfait.'},
        {t:'qcm', ctx:'Le marchand a dit : « Aujourd’hui, je ne vends rien. »', p:'Le marchand a dit que…', o:['ce jour-là, il ne vendait rien.','aujourd’hui, il ne vend rien.','ce jour-là, je ne vendais rien.'], e:'**aujourd’hui** → **ce jour-là** ; présent → imparfait.'},
        {t:'qcm', ctx:'Le capitaine a annoncé : « Nous partirons demain. »', p:'Le capitaine a annoncé…', o:['qu’ils partiraient le lendemain.','qu’ils partiront demain.','qu’ils partaient hier.'], e:'Futur → conditionnel ; **demain** → **le lendemain**.'},
        {t:'qcm', ctx:'Steve a écrit : « Je suis arrivé ici hier soir. »', p:'Steve a écrit…', o:['qu’il était arrivé là la veille au soir.','qu’il est arrivé ici hier soir.','qu’il arrivera là le lendemain.'], e:'**suis arrivé** → **était arrivé** ; **ici** → **là** ; **hier soir** → **la veille au soir**.'},
      ]},
    { id:'f-questions', titre:'Les questions rapportées', aide:'Question oui/non → si. Question avec où, quand, qui… → on garde le mot. « Que…? » → ce que.',
      exemple:{p:'Le marchand demande : « Veux-tu des émeraudes ? »', steps:[
        'C’est une question à laquelle on répond par **oui ou non**.',
        'Au discours indirect, on l’introduit par **si**, sans point d’interrogation, sans inversion.',
        'Le marchand demande **si tu veux** des émeraudes.'], r:'Le marchand demande si tu veux des émeraudes.'},
      items:[
        {t:'qcm', ctx:'Le joueur demande : « Où est le village ? »', p:'Le joueur demande…', o:['où est le village.','si où est le village.','où est-ce le village ?'], e:'On garde **où**, sans point d’interrogation.'},
        {t:'qcm', ctx:'Alex demande : « Que cherches-tu ? »', p:'Alex demande…', o:['ce que tu cherches.','que cherches-tu.','qu’est-ce que tu cherches ?'], e:'« Que… ? » devient **ce que**, sans inversion du sujet.'},
        {t:'qcm', ctx:'Le berger demande : « As-tu vu mes moutons ? »', p:'Le berger demande…', o:['si tu as vu ses moutons.','si tu as vu mes moutons.','as-tu vu ses moutons.'], e:'Question oui/non → **si** ; « mes moutons » (ceux du berger) → **ses** moutons.'},
        {t:'qcm', ctx:'La forgeronne a demandé : « Quand reviendras-tu ? »', p:'La forgeronne a demandé…', o:['quand tu reviendrais.','quand reviendras-tu.','si tu reviendras.'], e:'On garde **quand** ; verbe introducteur au passé → futur devient conditionnel : **reviendrais**.'},
        {t:'qcm', ctx:'Steve demande : « Qui a ouvert le coffre ? »', p:'Steve demande…', o:['qui a ouvert le coffre.','si qui a ouvert le coffre.','ce que a ouvert le coffre.'], e:'On garde **qui**, sans point d’interrogation.'},
      ]},
  ]},

{ id:'relatives', dom:'morpho', titre:'Les propositions relatives',
  objectif:'Relier deux phrases avec qui, que, où, dont, lequel…, et comprendre qui fait l’action dans une phrase avec une relative.',
  lecon:[
    {t:'p', x:'Une **proposition relative** donne une information sur un nom. Elle commence par un **pronom relatif** qui remplace ce nom.'},
    {t:'phrase', x:'J’ai vu {S:un loup} {R:qui dormait}.'},
    {t:'table', head:['Pronom relatif','Quand ?','Exemple'], rows:[
      ['{PR:qui}','le nom est **sujet** du verbe de la relative','un loup {PR:qui} dort (le loup dort)'],
      ['{PR:que}','le nom est **COD** du verbe de la relative','le diamant {PR:qu’}Alex a trouvé (Alex a trouvé le diamant)'],
      ['{PR:où}','un **lieu** ou un **moment**','le village {PR:où} nous habitons'],
      ['{PR:dont}','le complément est introduit par **de**','l’épée {PR:dont} j’ai besoin (avoir besoin **de**)'],
      ['{PR:lequel, laquelle…}','après une préposition (avec, par, sans, pour…)','la pioche {PR:avec laquelle} je mine'],
    ]},
    {t:'avert', x:'Dans « le loup **que** suit le chien », c’est **le chien** qui suit : après **que**, le sujet peut être placé après le verbe.'},
  ],
  familles:[
    { id:'f-quique', titre:'Relier avec qui ou que', aide:'Dans la 2e phrase, le nom répété est-il sujet (→ qui) ou COD (→ que) ?',
      exemple:{p:'Relie : « Le diamant brille. Alex a trouvé le diamant. »', steps:[
        'Le nom répété est **le diamant**.',
        'Dans la 2e phrase, « Alex a trouvé **le diamant** » : il est **COD** → **que** (qu’ devant une voyelle).',
        'Je place la relative juste après le nom : Le diamant {R:qu’Alex a trouvé} brille.'], r:'Le diamant qu’Alex a trouvé brille.'},
      items:[
        {t:'ord', ctx:'« J’ai vu un loup. Le loup dormait. »', p:'Relie les deux phrases.', k:[['j’ai vu','V'],['un loup','COD'],['qui dormait','R']], x:[['que dormait','R']], e:'« Le loup dormait » : le loup est **sujet** → {PR:qui}.'},
        {t:'ord', ctx:'« La pioche est cassée. Steve utilisait la pioche. »', p:'Relie les deux phrases.', k:[['la pioche','S'],['que Steve utilisait','R'],['est cassée','V']], x:[['qui Steve utilisait','R']], e:'« Steve utilisait la pioche » : la pioche est **COD** → {PR:que}.'},
        {t:'ord', ctx:'« Le villageois vend du pain. Le villageois habite près du puits. »', p:'Relie les deux phrases.', k:[['le villageois','S'],['qui habite près du puits','R'],['vend du pain','V']], x:[['que habite près du puits','R']], e:'Le villageois habite… : il est **sujet** → {PR:qui}.'},
        {t:'ord', ctx:'« Les émeraudes sont précieuses. Le marchand vend les émeraudes. »', p:'Relie les deux phrases.', k:[['les émeraudes','S'],['que le marchand vend','R'],['sont précieuses','V']], x:[['qui le marchand vend','R']], e:'Le marchand vend les émeraudes : COD → {PR:que}.'},
        {t:'ord', ctx:'« J’ai un chien. Ce chien garde la maison. »', p:'Relie les deux phrases.', k:[['j’ai','V'],['un chien','COD'],['qui garde la maison','R']], x:[['que garde la maison','R']], e:'Le chien garde la maison : sujet → {PR:qui}.'},

    { id:'f-comprendre', titre:'Comprendre les relatives', aide:'Trouve le verbe de la relative, puis demande : « Qui est-ce qui + verbe ? »',

        'Qui est-ce qui poursuit ? → **le chien**.',

      items:[
        {t:'scene', ctx:'« Le chien qui poursuit le chat aboie. »', ag:'chien', pa:'chat', v:'poursuit', e:'« **qui** poursuit le chat » : **qui** = le chien, sujet de « poursuit ».'},
        {t:'scene', ctx:'« Le chien que poursuit le chat aboie. »', ag:'chat', pa:'chien', v:'poursuit', e:'« que poursuit **le chat** » : le sujet est après le verbe. C’est le chat qui poursuit le chien.'},
        {t:'scene', ctx:'« Le zombie que le golem frappe recule. »', ag:'golem', pa:'zombie', v:'frappe', e:'« que **le golem** frappe » : c’est le golem qui frappe le zombie.'},
        {t:'scene', ctx:'« Le golem qui frappe le zombie est très fort. »', ag:'golem', pa:'zombie', v:'frappe', e:'« **qui** frappe le zombie » : **qui** = le golem.'},
        {t:'scene', ctx:'« Le mouton que suit le cochon est blanc. »', ag:'cochon', pa:'mouton', v:'suit', e:'« que suit **le cochon** » : c’est le cochon qui suit le mouton.'},
        {t:'scene', ctx:'« Le lapin que regarde le chat ne bouge pas. »', ag:'chat', pa:'lapin', v:'regarde', e:'« que regarde **le chat** » : c’est le chat qui regarde le lapin.'},
        {t:'scene', ctx:'« La poule qui suit le villageois picore. »', ag:'poule', pa:'villageois', v:'suit', e:'« **qui** suit le villageois » : **qui** = la poule.'},
      ]},
    { id:'f-oudont', titre:'où et dont', aide:'Un lieu ou un moment → où. Un complément avec « de » (parler de, avoir besoin de, la couleur de…) → dont.',
      exemple:{p:'Relie : « Voici l’épée. Alex a besoin de cette épée. »', steps:[
        'Le nom répété est **l’épée**.',
        'On dit : avoir besoin **de** l’épée → complément avec **de**.',

      items:[

        {t:'qcm', ctx:'C’est le forgeron. Je t’ai parlé de ce forgeron.', p:'C’est le forgeron ___ je t’ai parlé.', o:['dont','que','où'], e:'Parler **de** quelqu’un → {PR:dont}.'},
        {t:'qcm', ctx:'J’ai un cheval. La crinière de ce cheval est noire.', p:'J’ai un cheval ___ la crinière est noire.', o:['dont','que','où'], e:'La crinière **du** cheval (de + le cheval) → {PR:dont}.'},
        {t:'qcm', ctx:'Je me souviens du jour. Ce jour-là, nous avons trouvé la forteresse.', p:'Je me souviens du jour ___ nous avons trouvé la forteresse.', o:['où','dont','que'], e:'Un **moment** → {PR:où} aussi : le jour **où**…'},
        {t:'qcm', ctx:'C’est l’enclume. Le forgeron se sert de l’enclume.', p:'C’est l’enclume ___ le forgeron se sert.', o:['dont','que','où'], e:'Se servir **de** → {PR:dont}.'},
        {t:'qcm', ctx:'Voici la grotte. Le monstre est sorti de cette grotte.', p:'Voici la grotte ___ le monstre est sorti.', o:['d’où','dont','que'], e:'Sortir **d’un lieu** → {PR:d’où}.'},
      ]},
    { id:'f-lequel', titre:'Préposition + lequel', aide:'Après avec, par, sans, pour, sur… → lequel (masculin), laquelle (féminin), lesquels, lesquelles. À + lequel = auquel ; de + lequel = duquel.',
      exemple:{p:'Relie : « Voici la pioche. Je mine avec cette pioche. »', steps:[
        'Le nom répété est **la pioche**, précédé de la préposition **avec**.',

        'Voici la pioche {R:avec laquelle je mine}.'], r:'Voici la pioche avec laquelle je mine.'},

        {t:'qcm', ctx:'C’est le portail. Je suis passé par ce portail.', p:'C’est le portail ___ je suis passé.', o:['par lequel','par laquelle','dont'], e:'**par** + masculin singulier → **par lequel**.'},
        {t:'qcm', ctx:'Ce sont les torches. Je ne peux pas descendre sans ces torches.', p:'Ce sont les torches ___ je ne peux pas descendre.', o:['sans lesquelles','sans lesquels','sans laquelle'], e:'**sans** + féminin pluriel → **sans lesquelles**.'},
        {t:'qcm', ctx:'C’est un problème. Je n’avais pas pensé à ce problème.', p:'C’est un problème ___ je n’avais pas pensé.', o:['auquel','à laquelle','dont'], e:'**à** + lequel = **auquel**.'},
        {t:'qcm', ctx:'Il a une carte. Il retrouve son chemin grâce à cette carte.', p:'Il a une carte grâce ___ il retrouve son chemin.', o:['à laquelle','auquel','dont'], e:'**grâce à** + féminin → grâce **à laquelle**.'},
        {t:'qcm', ctx:'Voici le village. J’ai construit ma maison près de ce village.', p:'Voici le village près ___ j’ai construit ma maison.', o:['duquel','de laquelle','dont'], e:'**près de** + masculin → près **de + lequel** = **duquel**.'},
        {t:'qcm', ctx:'Ce sont mes amis. Je pars à l’aventure avec ces amis.', p:'Ce sont mes amis ___ je pars à l’aventure.', o:['avec qui','avec lesquelles','dont'], e:'Pour des **personnes**, on peut dire **avec qui** (ou avec lesquels).'},
      ]},

{ id:'logique', dom:'morpho', titre:'Cause, conséquence, but, opposition, temps',
  objectif:'Comprendre et utiliser les mots qui relient les idées, et choisir une suite qui a du sens après un connecteur.',
  lecon:[
    {t:'table', head:['Relation','Question','Connecteurs'], rows:[
      ['**cause**','Pourquoi ?','parce que · comme · puisque · car · à cause de · grâce à'],
      ['**conséquence**','Et alors ?','donc · c’est pourquoi · si bien que · tellement… que · si… que'],
      ['**but**','Pour quoi faire ?','pour · afin de (+ infinitif) · pour que · afin que (+ subjonctif)'],
      ['**opposition / concession**','Et pourtant ?','mais · pourtant · alors que · malgré · bien que · même si'],
      ['**temps**','Quand ?','quand · dès que · pendant que · avant que · après que · tant que'],
    ]},
    {t:'etapes', x:[
      'Je lis le connecteur et je trouve la **relation** qu’il exprime.',
      'Je cherche une suite qui respecte cette relation.',
      'Je relis toute la phrase pour vérifier qu’elle a du **sens**.',
    ]},
  ],
  familles:[
    { id:'f-cause', titre:'Cause et conséquence', aide:'La cause répond à « pourquoi ? ». La conséquence répond à « et alors ? ».',
      exemple:{img:['torche'], p:'« Steve n’a plus de torches, c’est pourquoi… »', steps:[
        '**c’est pourquoi** annonce une **conséquence** : ce qui arrive à cause de la première idée.',
        'Sans torches, il fait noir dans la grotte.',
        '… **il ne peut pas explorer la grotte.**'], r:'… il ne peut pas explorer la grotte.'},
      items:[
        {t:'qcm', img:['torche'], p:'Alex allume une torche ___ il fait noir.', o:['parce qu’','donc','mais'], e:'« il fait noir » répond à **pourquoi ?** → cause → **parce qu’**.'},
        {t:'qcm', img:['zombie'], p:'Le zombie s’approche, ___ Steve s’enfuit.', o:['donc','parce que','pourtant'], e:'Steve s’enfuit **à cause** du zombie : c’est une **conséquence** → **donc**.'},
        {t:'qcm', p:'___ il pleuvait, les villageois sont restés chez eux.', o:['Comme','Pourtant','Donc'], e:'**Comme**, en début de phrase, introduit une **cause**.'},
        {t:'qcm', img:['boussole'], p:'___ sa boussole, Alex a retrouvé son chemin.', o:['Grâce à','À cause de','Malgré'], e:'Une cause **positive** → **grâce à**. (**À cause de** : pour une cause négative.)'},
        {t:'qcm', img:['lave'], p:'La lave est tellement chaude que…', o:['tout ce qui tombe dedans brûle.','elle est rouge.','on peut nager dedans.'], e:'**tellement… que** : la suite donne la **conséquence** de cette chaleur.'},
        {t:'tri', p:'Ce qui suit le connecteur en gras est-il une cause ou une conséquence ?', cats:['cause','conséquence'], it:[['Il est rentré **parce qu’**il était blessé.',0],['Il était blessé, **donc** il est rentré.',1],['**Comme** la nuit tombait, il a allumé un feu.',0],['La nuit tombait, **si bien qu’**il a allumé un feu.',1]], e:'Après **parce que** et **comme** → la **cause**. Après **donc** et **si bien que** → la **conséquence**.'},
      ]},
    { id:'f-but', titre:'Le but', aide:'Le but répond à « pour quoi faire ? ». Même sujet → pour / afin de + infinitif. Sujet différent → pour que / afin que + subjonctif.',
      exemple:{p:'« Je construis un mur ___ le village soit protégé. »', steps:[
        'Le mur sert **à** protéger le village : c’est un **but**.',
        'Le sujet change (je construis / le village soit protégé) → **pour que** ou **afin que** + subjonctif.',
        'Je construis un mur **afin que** le village **soit** protégé.'], r:'afin que'},
      items:[
        {t:'qcm', img:['graines','ble'], p:'Le fermier plante des graines ___ récolter du blé.', o:['pour','parce que','donc'], e:'But, même sujet (le fermier plante / le fermier récolte) → **pour** + infinitif.'},
        {t:'qcm', img:['lit'], p:'Steve a construit un abri ___ passer la nuit en sécurité.', o:['afin de','à cause de','malgré'], e:'But + infinitif → **afin de**.'},
        {t:'qcm', p:'Je laisse la porte ouverte ___ le chat sorte.', o:['pour que','pour','parce que'], e:'Le sujet change (je / le chat) → **pour que** + subjonctif (**sorte**).'},
        {t:'qcm', p:'La forgeronne aiguise l’épée ___ elle coupe mieux.', o:['afin qu’','afin de','donc'], e:'Le sujet change (la forgeronne / l’épée) → **afin qu’** + subjonctif.'},
        {t:'qcm', p:'Alex parle doucement ___ ne pas réveiller le loup.', o:['pour','pour que','parce qu’'], e:'Même sujet (Alex) → **pour** + infinitif.'},
      ]},
    { id:'f-opposition', titre:'Opposition et concession', aide:'La 2e idée est inattendue après la 1re : on attendait le contraire.',
      exemple:{p:'« Malgré sa peur, … »', steps:[
        '**malgré** + nom : même avec sa peur, on fait **quand même** l’action.',
        'La suite doit montrer qu’elle n’a pas renoncé.',
        'Malgré sa peur, **Alex entre dans la grotte**.'], r:'… Alex entre dans la grotte.'},
      items:[
        {t:'qcm', img:['loup','os'], p:'Le loup est sauvage, ___ on peut l’apprivoiser avec des os.', o:['mais','donc','parce que'], e:'Deux idées qui s’opposent → **mais**.'},
        {t:'qcm', img:['golem','dragon'], p:'Le golem est très fort ; pourtant…', o:['il perd contre le dragon.','il gagne facilement.','il est très grand.'], e:'**pourtant** annonce quelque chose d’**inattendu** : on s’attendait à ce qu’il gagne.'},
        {t:'qcm', img:['pioche'], p:'Alex creuse tout droit vers le bas, ___ c’est dangereux.', o:['alors que','parce que','pour que'], e:'Elle le fait **même si** c’est dangereux → **alors que** (opposition).'},
        {t:'qcm', p:'___ il ait peur, Steve descend dans la grotte.', o:['Bien qu’','Parce qu’','Pour qu’'], e:'**Bien que** + subjonctif (**ait**) : même s’il a peur, il descend.'},
        {t:'qcm', p:'Même s’il pleut, …', o:['nous irons à la mine.','nous serons mouillés car il pleut.','il pleut.'], e:'**même si** : la pluie ne change rien, on y va **quand même**.'},
        {t:'qcm', img:['dragon'], p:'Tout courageux qu’il est, …', o:['Steve n’ose pas affronter le dragon.','Steve affronte le dragon.','Steve est courageux.'], e:'**tout… que** = **même s’il** est courageux. On attend qu’il affronte le dragon, mais il **n’ose pas**.'},
      ]},
    { id:'f-temps3', titre:'Le temps', aide:'avant que → l’action n’est pas encore arrivée (+ subjonctif). après que → elle a eu lieu (+ indicatif). tant que = aussi longtemps que.',
      exemple:{p:'« Tant que le soleil brille, … »', steps:[
        '**tant que** = **aussi longtemps que**.',
        'Pendant tout le temps où le soleil brille, quelque chose dure.',
        'Tant que le soleil brille, **les zombies brûlent**.'], r:'… les zombies brûlent.'},
      items:[
        {t:'qcm', img:['zombie'], p:'Tant qu’il fait nuit, …', o:['il ne faut pas sortir du village.','il faisait jour.','le soleil s’est levé.'], e:'**tant que** = pendant tout le temps où il fait nuit.'},
        {t:'qcm', p:'Rentre ___ la nuit tombe !', o:['avant que','après que','pendant que'], e:'La nuit n’est pas encore tombée → **avant que** (+ subjonctif : tombe).'},
        {t:'qcm', p:'___ le dragon a été vaincu, les joueurs sont rentrés.', o:['Après que','Avant que','Pendant que'], e:'Le dragon est **déjà** vaincu → **après que** + indicatif (**a été**).'},
        {t:'qcm', p:'Le loup s’est approché ___ le berger dormait.', o:['pendant que','avant que','tant que'], e:'Les deux actions se passent **en même temps** → **pendant que**.'},
        {t:'qcm', p:'___ il aperçoit un creeper, Steve recule.', o:['Dès qu’','Avant qu’','Bien qu’'], e:'**dès que** = tout de suite après : il recule au moment même où il l’aperçoit.'},
      ]},
    { id:'f-suite', titre:'Choisir une suite logique', aide:'Trouve la relation exprimée par le connecteur, puis vérifie le sens de toute la phrase.',
      exemple:{p:'« Il faut vite rentrer, sinon… »', steps:[
        '**sinon** = si on ne le fait pas.',
        'Si on ne rentre pas vite, il va arriver quelque chose de mauvais.',
        'Il faut vite rentrer, sinon **les monstres vont nous attaquer**.'], r:'… les monstres vont nous attaquer.'},
      items:[
        {t:'qcm', img:['dragon'], p:'Le dragon poussa un rugissement tel que…', o:['tous les joueurs tremblèrent.','il était noir.','les joueurs dormirent tranquillement.'], e:'**tel que** = si fort que → la suite donne la **conséquence**.'},
        {t:'qcm', img:['epee'], p:'Il mérite d’autant plus sa victoire qu’…', o:['il n’avait qu’une épée en bois.','il avait une armure en diamant.','il aime gagner.'], e:'**d’autant plus que** renforce la cause : avec une épée en bois, sa victoire est **encore plus** méritée.'},
        {t:'qcm', img:['pioche','lit'], p:'Il est trop fatigué pour…', o:['continuer à miner.','aller se coucher.','être fatigué.'], e:'**trop… pour** : la fatigue l’**empêche** de faire quelque chose.'},
        {t:'qcm', p:'Steve n’a ni pioche…', o:['ni épée.','et une épée.','mais une épée.'], e:'**ni… ni…** : pas de pioche et pas d’épée.'},
        {t:'qcm', p:'Soit tu m’aides à construire le mur, …', o:['soit tu gardes l’entrée.','donc tu m’aides.','parce que le mur est haut.'], e:'**soit… soit…** propose **deux possibilités** : l’une ou l’autre.'},
        {t:'qcm', p:'Plutôt que de fuir, …', o:['Alex décide de se battre.','Alex s’enfuit.','Alex a peur de fuir.'], e:'**plutôt que** : on choisit une action **à la place** d’une autre.'},
      ]},
  ]},

{ id:'subjonctif', dom:'morpho', titre:'Le subjonctif',
  objectif:'Reconnaître les mots qui demandent le subjonctif et employer les formes fréquentes.',
  lecon:[
    {t:'p', x:'Le **subjonctif** s’emploie pour une action **souhaitée**, **nécessaire** ou **pas encore réalisée**. Il vient souvent après **que**.'},
    {t:'table', head:['Subjonctif après…','Indicatif après…'], rows:[
      ['il faut que · je veux que · c’est bien que','je sais que · je pense que · il dit que'],
      ['pour que · afin que · avant que · jusqu’à ce que','parce que · après que · pendant que · puisque'],
      ['bien que · à moins que · sans que','alors que · même si'],
    ]},
    {t:'table', head:['Verbe','Présent','Subjonctif'], rows:[
      ['être','il **est**','qu’il **soit**'],['avoir','il **a**','qu’il **ait**'],['faire','il **fait**','qu’il **fasse**'],
      ['aller','il **va**','qu’il **aille**'],['venir','il **vient**','qu’il **vienne**'],['prendre','il **prend**','qu’il **prenne**'],
    ]},
    {t:'astuce', x:'Pour trouver la forme, pars de « **ils** » au présent : ils **prenn**ent → qu’il **prenn**e ; ils **finiss**ent → qu’il **finiss**e.'},
  ],
  familles:[
    { id:'f-formes', titre:'Les formes du subjonctif', aide:'Pars de « ils » au présent, ou apprends les formes irrégulières (soit, ait, fasse, aille).',
      exemple:{p:'« Il est prudent. » → « C’est bien qu’il ___ prudent. »', steps:[
        '**c’est bien que** → subjonctif.',
        'Le verbe est **être**, une forme irrégulière à retenir.',
        'C’est bien qu’il **soit** prudent.'], r:'soit'},
      items:[
        {t:'qcm', ctx:'Il a une épée.', p:'C’est bien qu’il ___ une épée.', o:['ait','a','aura'], e:'avoir → qu’il **ait**.'},
        {t:'qcm', ctx:'Il fait du feu.', p:'Il faut qu’il ___ du feu.', o:['fasse','fait','fera'], e:'faire → qu’il **fasse**.'},
        {t:'qcm', ctx:'Il va à la ferme.', p:'Je veux qu’il ___ à la ferme.', o:['aille','va','ira'], e:'aller → qu’il **aille**.'},
        {t:'qcm', ctx:'Il prend son bouclier.', p:'Il faut qu’il ___ son bouclier.', o:['prenne','prend','prendre'], e:'ils **prenn**ent → qu’il **prenne**.'},
        {t:'qcm', ctx:'Il boit la potion.', p:'Il faut qu’il ___ la potion.', o:['boive','boit','buve'], e:'ils **boiv**ent → qu’il **boive**.'},
        {t:'qcm', ctx:'Il construit un abri.', p:'C’est bien qu’il ___ un abri.', o:['construise','construit','construira'], e:'ils **construis**ent → qu’il **construise**.'},
        {t:'qcm', ctx:'Il obtient des émeraudes.', p:'Je veux qu’il ___ des émeraudes.', o:['obtienne','obtient','obtenne'], e:'Comme venir → qu’il vienne : obtenir → qu’il **obtienne**.'},
        {t:'qcm', ctx:'Il voit le danger.', p:'Il faut qu’il ___ le danger.', o:['voie','voit','verra'], e:'voir → qu’il **voie** (à l’oral comme « voit », mais avec **-e**).'},
      ]},
    { id:'f-declencheur', titre:'Subjonctif ou indicatif ?', aide:'Souhait, nécessité, but, action pas encore faite → subjonctif. Fait réel, sûr → indicatif.',
      exemple:{p:'« Alex allume une torche parce qu’il ___ nuit. » (fait / fasse)', steps:[
        '**parce que** donne une **cause réelle** : il fait vraiment nuit.',
        'Un fait réel → **indicatif**.',
        'Alex allume une torche parce qu’il **fait** nuit.'], r:'fait'},
      items:[
        {t:'tri', p:'Ces mots demandent-ils le subjonctif ou l’indicatif ?', cats:['subjonctif','indicatif'], it:[['il faut que',0],['je sais que',1],['pour que',0],['parce que',1],['bien que',0],['après que',1]], e:'**Subjonctif** : il faut que, pour que, bien que. **Indicatif** : je sais que, parce que, après que.'},
        {t:'qcm', p:'Je reste ici jusqu’à ce que le soleil ___.', o:['revienne','revient','reviendra'], e:'**jusqu’à ce que** → subjonctif : **revienne**.'},
        {t:'qcm', p:'Je sais que le village ___ en danger.', o:['est','soit','sois'], e:'**je sais que** → un fait sûr → indicatif : **est**.'},
        {t:'qcm', p:'Après que le dragon ___ vaincu, les joueurs sont rentrés.', o:['a été','ait été','soit'], e:'Piège : **après que** → l’action a vraiment eu lieu → **indicatif** : **a été**.'},
        {t:'qcm', p:'Avant que tu ___ trop loin, prends une carte.', o:['ailles','vas','iras'], e:'**avant que** → l’action n’a pas encore eu lieu → subjonctif : **ailles**.'},
        {t:'qcm', p:'Il construira une tour, à moins qu’il n’___ plus de pierre.', o:['ait','a','aura'], e:'**à moins que** (= sauf si) → subjonctif : **ait** (« n’ait plus » = n’ait plus du tout de pierre).'},
      ]},
  ]},

{ id:'hypothese', dom:'morpho', titre:'Hypothèse et comparaison',
  objectif:'Accorder les temps après « si », comprendre les hypothèses (réelle, possible, trop tard) et les comparaisons.',
  lecon:[
    {t:'table', head:['Après si…','…l’autre verbe est au','Sens','Exemple'], rows:[
      ['présent','futur (ou impératif)','c’est **possible et probable**','Si tu dors, la nuit **passera** vite.'],
      ['imparfait','conditionnel présent','c’est **imaginé**','Si j’**avais** des émeraudes, j’**achèterais** l’armure.'],
      ['plus-que-parfait','conditionnel passé','c’est **trop tard**, ça ne s’est pas passé','Si nous **avions eu** une carte, nous **aurions trouvé** le village.'],
    ]},
    {t:'avert', x:'Jamais de conditionnel juste après **si** : on ne dit pas « si j’aurais ».'},
    {t:'table', head:['Comparaison','Exemple'], rows:[
      ['plus… que · moins… que · aussi… que','Le diamant est **plus** dur **que** le fer.'],
      ['plus… plus · moins… moins','**Plus** on descend, **plus** il fait chaud.'],
      ['autant… autant','**Autant** le jour est calme, **autant** la nuit est dangereuse.'],
      ['tel que · comme si','Le château était **tel qu’**il l’avait imaginé. Il me regarde **comme s’**il me connaissait.'],
    ]},
  ],
  familles:[
    { id:'f-si1', titre:'Si + présent, si + imparfait', aide:'Si + présent → futur. Si + imparfait → conditionnel (-rais, -rait).',
      exemple:{p:'« Si j’avais une pioche en diamant, je ___ l’obsidienne. » (miner)', steps:[

/* ================= utilitaires ================= */
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ let x=seed||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%100000)/100000; }; }
function shuffle(arr, seed){ const r=seeded(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleNot(arr, seed){ if(arr.length<2) return arr.slice(); let s=seed, a; let n=0; do{ a=shuffle(arr, s++); n++; } while(a.every((x,i)=>x===arr[i]) && n<20); return a; }
const stripAcc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s){ return s.toLowerCase().replace(/[’`]/g,"'").replace(/-/g,' ').replace(/[.,;:!?«»"]/g,' ').replace(/\s+/g,' ').trim(); }
function stripDet(s){ return s.replace(/^(le |la |les |l'|un |une |des |du |de l'|de la |d')/,'').trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function plain(s){ return (s||'').replace(/\{[A-Z]+:([^}]*)\}/g,'$1').replace(/\*\*/g,'').replace(/___|\{\{\d\}\}/g,' … '); }
function typo(s){ return (s||'').replace(/ ([?!:;»])/g,' $1').replace(/« /g,'« '); }
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

/* texte enrichi : {R:groupe}, **gras**, ___ */
function Rich({t, fill, nolabel}){
  if(t==null) return null;
  const parts=[]; const re=/(\{([A-Z]+):([^}]*)\})|(\*\*([^*]+)\*\*)|(___)/g; let last=0,m,k=0; const s=typo(t);
  while((m=re.exec(s))){
    if(m.index>last) parts.push(s.slice(last,m.index));
    if(m[1]) parts.push(html`<span key=${k++} class=${'grp g-'+m[2]+(nolabel?' nl':'')}><span class="gt">${m[3]}</span>${!nolabel && html`<span class="gl">${ROLES[m[2]]||''}</span>`}</span>`);
    else if(m[4]) parts.push(html`<strong key=${k++}>${m[5]}</strong>`);
    else parts.push(fill!=null ? html`<span key=${k++} class="filled">${fill}</span>` : html`<span key=${k++} class="blank" aria-label="blanc"></span>`);
    last=re.lastIndex;
    if(m[6] && fill!=null && /’$/.test(fill) && s[last]===' ') last++;
  }
  if(last<s.length) parts.push(s.slice(last));
  return html`<${React.Fragment}>${parts}<//>`;
}

function Img({k, badge, size, flip, cap}){
  const src=IMG[k]; if(!src) return null;
  const mob=MOBS.has(k), pix=PIXEL.has(k);
  const s=size||(mob?128:88);
  /* objets en pixel-art (16 px ×6) : affichage à un multiple entier (×2, ×3, ×4, ×6) pour des pixels nets */
  let d;
  if(pix){ d = s>=104?96 : s>=68?64 : s>=52?48 : 32; if(badge==='p') d = d>=64?48:32; }
  else { d = Math.round(s*(mob?1:.86)); if(badge==='p') d=Math.round(s*.62); }
  return html`<figure class=${'mc'+(mob?' mob':pix?' item':' bloc')}>
    <div class="mc-frame" style=${{width:s,height:s}}>
      <img src=${src} alt=${cap||''} draggable="false" style=${{width:d,height:d,transform:flip?'scaleX(-1)':null}}/>
    </div>
    ${cap && html`<figcaption>${cap}</figcaption>`}
    ${badge && html`<span class=${'badge b-'+badge}>${badge==='m'?'♂ mâle':badge==='f'?'♀ femelle':'le petit'}</span>`}
  </figure>`;
}
function Pic({k, size=96}){ const src=PIC[k]; if(!src) return null; return html`<img class="picto" src=${src} alt="" draggable="false" style=${{width:size,height:size}}/>`; }

function QcmItem({it, onDone, disabled, audio}){
  const opts = useMemo(()=>shuffle(it.o, hash(it.id)), [it.id]);
  const [sel,setSel]=useState(null);
  useEffect(()=>setSel(null),[it.id]);
  const validate=()=>{ if(sel!=null) onDone(opts[sel]===it.o[0], opts[sel]); };
  useKeys(e=>{ if(disabled) return; if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return; const n=parseInt(e.key,10); if(n>=1&&n<=opts.length) setSel(n-1); if(e.key==='Enter'&&sel!=null){ e.preventDefault(); validate(); } },[sel,disabled,opts]);
  return html`<div>
    <div class="options" role="radiogroup">
      ${opts.map((o,i)=>{ let cls='opt'; if(disabled){ if(o===it.o[0]) cls+=' ok'; else if(i===sel) cls+=' ko'; } else if(i===sel) cls+=' on';
        return html`<button key=${o} role="radio" aria-checked=${i===sel} class=${cls} disabled=${disabled} onClick=${()=>setSel(i)}><span class="key">${i+1}</span><span class="otext">${typo(o)}</span>${audio&&canSpeak&&html`<span class="say" onClick=${e=>{e.stopPropagation(); speak(o);}} title="Écouter">${I.speaker}</span>`}</button>`; })}
    </div>
    ${!disabled && html`<div class="actions"><button class="btn primary" disabled=${sel==null} onClick=${validate}>${I.check} Valider <kbd>Entrée</kbd></button></div>`}
  </div>`;
}

function MultiItem({it, onDone, disabled}){
  const opts = useMemo(()=>shuffle(it.o, hash(it.id)), [it.id]);
  const [sel,setSel]=useState([]);
  useEffect(()=>setSel([]),[it.id]);
  const toggle=o=>setSel(s=>s.includes(o)?s.filter(x=>x!==o):[...s,o]);
  const n=it.a.length;
  const validate=()=>{ const ok = sel.length===n && sel.every(x=>it.a.includes(x)); onDone(ok, sel.join(', ')); };
  return html`<div>
    <p class="muted small">Choisis ${n} mots.</p>
    <div class="multi">${opts.map(o=>{ const on=sel.includes(o); let cls='mchip'+(on?' on':''); if(disabled){ if(it.a.includes(o)) cls+=on?' ok':' miss'; else if(on) cls+=' ko'; }
      return html`<button key=${o} class=${cls} disabled=${disabled} aria-pressed=${on} onClick=${()=>toggle(o)}>${on?'☑':'☐'} ${o}</button>`; })}</div>
    ${!disabled && html`<div class="actions"><button class="btn primary" disabled=${sel.length!==n} onClick=${validate}>${I.check} Valider</button><span class="muted small">${sel.length} / ${n}</span></div>`}
  </div>`;
}

function InputItem({it, onDone, disabled}){
  const [v,setV]=useState(''); const [h,setH]=useState(0); const ref=useRef();
  useEffect(()=>{ setV(''); setH(0); setTimeout(()=>ref.current&&ref.current.focus(),40); },[it.id]);
  const hints=(it.h||[]).filter(Boolean); const hl=['Le sens','Le début du mot','Les syllabes'];
  function check(){
    const val=stripDet(norm(v)); if(!val) return;
    const acc=it.a.map(a=>stripDet(norm(a)));
    if(acc.includes(val)) return onDone(true, v, null);
    if(acc.map(stripAcc).includes(stripAcc(val))) return onDone(true, v, 'accents');
    if(acc.some(a=>a.length>=5 && lev(stripAcc(a),stripAcc(val))<=1)) return onDone(true, v, 'ortho');
    onDone(false, v, null);
  }
  return html`<div>
    <div class="inp-row">
      <input ref=${ref} class="field" value=${v} disabled=${disabled} placeholder="Écris le mot…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ta réponse"
        onInput=${e=>setV(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter'&&!disabled){ e.preventDefault(); check(); } }}/>
      ${!disabled && html`<button class="btn primary" disabled=${!v.trim()} onClick=${check}>${I.check} Valider</button>`}
    </div>
    ${!disabled && hints.length>0 && html`<div class="hints">
      ${hints.slice(0,h).map((x,i)=>html`<div key=${i} class="hint"><span class="muted small">${hl[i]} :</span> ${x}</div>`)}
      ${h<hints.length && html`<button class="btn" onClick=${()=>setH(h+1)}>${I.bulb} Indice ${h+1} sur ${hints.length} : ${hl[h].toLowerCase()}</button>`}
    </div>`}
  </div>`;
}

function OrderItem({it, onDone, disabled}){
  const chips = useMemo(()=>[...it.k.map((x,i)=>({t:x[0], r:x[1], c:x[2], id:'k'+i})), ...(it.x||[]).map((x,i)=>({t:x[0], r:x[1], id:'x'+i}))],[it.id]);
  const bank0 = useMemo(()=>shuffleNot(chips.map(c=>c.id), hash(it.id)),[it.id]);
  const [line,setLine]=useState([]);
  useEffect(()=>setLine([]),[it.id]);
  const get=id=>chips.find(c=>c.id===id);
  const bank = bank0.filter(id=>!line.includes(id));
  const need = it.k.length;
  function check(){
    const seq=line.map(id=>get(id).t).join('|');
    const okSeqs=[it.k.map(x=>x[0]).join('|'), ...(it.alt||[]).map(a=>a.map(i=>it.k[i][0]).join('|'))];
    onDone(okSeqs.includes(seq), sentenceOf(line.map(id=>get(id).t), it));
  }
  const chip=(id,where)=>{ const c=get(id);
    return html`<button key=${id} class=${'chip r-'+c.r} disabled=${disabled} title=${ROLES[c.r]||''}
      onClick=${()=> where==='bank' ? (line.length<need && setLine([...line,id])) : setLine(line.filter(x=>x!==id))}><span class="ct">${c.t}</span><span class="cl">${ROLES[c.r]||''}</span></button>`; };
  return html`<div>
    <div class="line" aria-label="Ta phrase">
      ${it.pre && html`<span class="pre">${it.pre}</span>`}
      ${line.length? line.map(id=>chip(id,'line')) : html`<span class="muted small">Clique sur les étiquettes dans l’ordre${it.x?' (attention : certaines étiquettes sont en trop)':''}.</span>`}
      ${line.length===need && html`<span class="end">${it.q?'?':'.'}</span>`}
    </div>
    <div class="bank">${bank.map(id=>chip(id,'bank'))}</div>
    ${!disabled && html`<div class="actions">
      <button class="btn" disabled=${!line.length} onClick=${()=>setLine(line.slice(0,-1))}>${I.undo} Retirer</button>
      <button class="btn primary" disabled=${line.length!==need} onClick=${check}>${I.check} Valider</button></div>`}
  </div>`;
}

function TriItem({it, onDone, disabled}){

        <div class="seg" role="radiogroup">${it.cats.map((c,ci)=>html`<button key=${ci} role="radio" aria-checked=${a===ci} class=${'segbtn'+(a===ci?' on':'')+(disabled&&ci===r.c?' right':'')} disabled=${disabled} onClick=${()=>setAns({...ans,[r.i]:ci})}>${c}</button>`)}</div>
      </div>`; })}</div>

}

function SlotsItem({it, onDone, disabled}){
  const sl = useMemo(()=>it.sl.map((o,i)=>shuffle(o, hash(it.id+i))),[it.id]);
  const [v,setV]=useState({});

      return html`<select key=${j} class=${'slot'+(disabled?(val===right?' ok':' ko'):'')} disabled=${disabled} value=${val||''} onChange=${e=>setV({...v,[i]:e.target.value})} aria-label=${'Choix '+(i+1)}>
        <option value="" disabled>choisir…</option>${sl[i].map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`; })}</p>
