<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractions et puissances de 10 — 4e</title>
<meta name="description" content="Comprendre, manipuler, mémoriser et utiliser les fractions et les puissances de 10 (4e) : leçons courtes, exemples résolus, exercices à trois niveaux, quiz et cartes mémo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan : application façon KDE Breeze — barre d'outils, barre latérale de navigation (comme Configuration du système),
   vue claire centrale. Bleu Breeze pour l'action ; orange réservé aux pièges et au 2e objet comparé ; vert/rouge pour la validation. */
:root {
  --win: #eff0f1; --view: #fcfcfc; --alt: #f4f5f6; --text: #232629; --muted: #5d6166;
  --line: #d3d6d9; --line-strong: #aeb3b8;
  --accent: #3daee9; --accent-ink: #1b6fa0; --accent-soft: rgba(61, 174, 233, .14); --accent-soft2: rgba(61, 174, 233, .32); --accent-strong: #2a8ccf;
  --warn: #f67400; --warn-ink: #b35400; --warn-soft: rgba(246, 116, 0, .22);
  --ok: #27ae60; --ok-ink: #1e7f47; --ok-soft: rgba(39, 174, 96, .12);
  --bad: #da4453; --bad-ink: #b0303e; --bad-soft: rgba(218, 68, 83, .1);
  --font: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 4px; --shadow: 0 1px 2px rgba(35, 38, 41, .07);
  --cw: 40px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1e2124; --alt: #25292d; --text: #eff0f1; --muted: #a3a9b0;
    --line: #3b4045; --line-strong: #5a6066;
    --accent-ink: #6cc4f2; --accent-soft: rgba(61, 174, 233, .18); --accent-soft2: rgba(61, 174, 233, .35); --accent-strong: #3daee9;
    --warn-ink: #ffa552; --ok-ink: #4fd18a; --bad-ink: #f0707c; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1e2124; --alt: #25292d; --text: #eff0f1; --muted: #a3a9b0;
  --line: #3b4045; --line-strong: #5a6066;
  --accent-ink: #6cc4f2; --accent-soft: rgba(61, 174, 233, .18); --accent-soft2: rgba(61, 174, 233, .35); --accent-strong: #3daee9;
  --warn-ink: #ffa552; --ok-ink: #4fd18a; --bad-ink: #f0707c; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 16px; }
html.comfort { font-size: 19px; }
html.comfort body { letter-spacing: .035em; word-spacing: .12em; line-height: 1.75; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--win); line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; font-weight: 600; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; } h4 { font-size: 1rem; }
p { margin: .4em 0 .7em; }
b { font-weight: 700; }
button { font: inherit; color: inherit; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; justify-content: center; }
.nw { white-space: nowrap; }
.lead { font-size: 1.05rem; color: var(--muted); max-width: 60ch; }
.accent-t { color: var(--accent-ink); }
.good-t { color: var(--ok-ink); font-weight: 700; }
.ca { color: var(--accent-ink); font-weight: 700; }
.cb { color: var(--warn-ink); font-weight: 700; }

/* ---------- Barre d'outils ---------- */
.toolbar { position: sticky; top: 0; z-index: 30; height: 50px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
  background: var(--win); border-bottom: 1px solid var(--line); }
.tb-title { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.tb-sub { font-weight: 400; color: var(--muted); }
.app-ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: #fff; font-size: .62rem; line-height: 1; }
.app-ic .fr-n { border-color: #fff; }
.btn.tb { border-color: transparent; background: transparent; }
.btn.tb:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn.tb.sel { background: var(--accent-soft); border-color: var(--accent); }
.menu-b { display: none; font-size: 1.15rem; }
.aa { font-family: Georgia, serif; font-size: 1.05rem; }

/* ---------- Corps ---------- */
.body { display: flex; align-items: flex-start; }
.side { position: sticky; top: 50px; width: 272px; flex: none; height: calc(100vh - 50px); overflow-y: auto; padding: 10px 8px 24px;
  background: var(--win); border-right: 1px solid var(--line); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side-g { margin-top: 12px; }
.side-h { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 10px; }
.nav-i { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: .95rem; margin: 1px 0; border-radius: var(--r); color: var(--text); text-decoration: none;
  border: 1px solid transparent; }
.nav-i:hover { background: var(--accent-soft); }
.nav-i.on { background: var(--accent-soft); border-color: var(--accent); }
.nav-t { flex: 1; display: flex; align-items: center; gap: 8px; }
.nav-n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: var(--view); border: 1px solid var(--line-strong); font-size: .78rem; font-weight: 600; color: var(--muted); }
.nav-n.ic { font-size: .8rem; }
.nav-i.on .nav-n { background: var(--accent); border-color: var(--accent); color: #fff; }
.sdots { display: inline-flex; gap: 3px; }
.sd { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.sd.on { background: var(--ok); }
.main { flex: 1; min-width: 0; padding: 22px 28px 60px; }
.page { max-width: 920px; margin: 0 auto; }
.page-h { margin-bottom: 14px; }
.crumb { font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 4px; }
.scrim { display: none; }

/* ---------- Boutons, champs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 5px 14px; border-radius: 3px;
  background: var(--view); border: 1px solid var(--line-strong); color: var(--text); cursor: pointer; line-height: 1.2; box-shadow: var(--shadow);
  transition: background .12s, border-color .12s; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent-strong); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.flat { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent-ink); }
.btn.flat:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
.btn.small { min-height: 28px; padding: 2px 9px; font-size: .9rem; }
.btn.sel { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.btn.good { border-color: var(--ok); color: var(--ok-ink); font-weight: 600; }
.btn.good:hover { background: var(--ok-soft) !important; border-color: var(--ok) !important; }
.btn.bad { border-color: var(--bad); color: var(--bad-ink); font-weight: 600; }
.btn.bad:hover { background: var(--bad-soft) !important; border-color: var(--bad) !important; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.inp { font: inherit; color: var(--text); background: var(--view); border: 1px solid var(--line-strong); border-radius: 3px; padding: 5px 8px; min-height: 34px; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft2); }
.inp:disabled { background: var(--alt); }
.w3 { width: 3.6em; } .w5 { width: 5em; } .w6 { width: 6.5em; } .w8 { width: 8.5em; } .w9 { width: 9.5em; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }

/* ---------- Écriture mathématique ---------- */
.m { font-variant-numeric: tabular-nums; }
.big { font-size: 1.18em; }
.huge { font-size: 1.5em; font-weight: 600; }
.fr { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; text-align: center; margin: 0 .12em; line-height: 1.15; }
.fr-n { border-bottom: 1.5px solid currentColor; padding: 0 .22em .06em; }
.fr-d { padding: .06em .22em 0; }
.pw sup, sup { font-size: .68em; line-height: 0; vertical-align: .62em; }
.pw-in sup { vertical-align: .9em; }
.pw-in sup .inp { font-size: .95rem; min-height: 28px; padding: 2px 5px; }
.lines { display: inline-flex; flex-direction: column; gap: 6px; }
.preview { margin-left: 4px; color: var(--muted); }
.unit { font-weight: 600; }
.hl { text-decoration: none; background: var(--accent-soft); border-bottom: 2px solid var(--accent); padding: 2px 3px; border-radius: 2px; }

/* ---------- Onglets de fiche ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: transparent; border: none; border-bottom: 3px solid transparent;
  cursor: pointer; white-space: nowrap; color: var(--muted); margin-bottom: -1px; }
.tab:hover { color: var(--text); background: var(--accent-soft); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab-n { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%; font-size: .78rem;
  border: 1px solid var(--line-strong); }
.tab.on .tab-n { background: var(--accent); border-color: var(--accent); color: #fff; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* ---------- Cartes / blocs ---------- */
.card { background: var(--view); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-h h3 { margin: 0; }
.tag { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 3px;
  background: var(--accent-soft); color: var(--accent-ink); }
.tag.alt { background: var(--ok-soft); color: var(--ok-ink); }
.intro { color: var(--muted); margin-top: 0; }
.lesson .block { background: var(--view); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.block.has-vis { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: center; }
.block-vis { background: var(--alt); border-radius: 6px; padding: 14px; border: 1px solid var(--line); }
.block h3 { display: flex; align-items: center; gap: 10px; }
.bn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 4px; background: var(--accent); color: #fff; font-size: .82rem; }
.cap { font-size: .86rem; color: var(--muted); margin-top: 6px; text-align: center; }
.callout { border-left: 4px solid; border-radius: 0 4px 4px 0; padding: 9px 13px; margin: 10px 0; }
.callout > b { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.callout.key { border-color: var(--accent); background: var(--accent-soft); }
.callout.key > b { color: var(--accent-ink); }
.callout.trap { border-color: var(--warn); background: var(--warn-soft); }
.callout.trap > b { color: var(--warn-ink); }
.method { padding-left: 1.3em; margin: .4em 0; }
.method li { margin: 3px 0; }
.tbl { border-collapse: collapse; width: 100%; font-size: .95rem; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.tbl th { background: var(--alt); white-space: nowrap; }
.tbl.prefixes td, .tbl.prefixes th { padding: 4px 10px; }
.tbl .hl-row td { background: var(--accent-soft); }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.name { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--alt); }
.name .pw { font-weight: 700; min-width: 3em; }
.mini-pt { text-align: center; font-size: 1.15em; line-height: 1.8; }
.vis-col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.bar { display: block; margin: 0 auto; }
.nline { display: block; max-width: 560px; margin: 0 auto; }

/* ---------- Exemple résolu ---------- */
.enonce { font-size: 1.05rem; margin: 6px 0 12px; }
.steps { list-style: none; padding: 0; margin: 0; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line);
  animation: appear .3s ease; }
.step.last { grid-template-columns: 30px 1fr; border-top: 1px solid var(--line); }
.step-n { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--alt);
  border: 1px solid var(--line-strong); font-size: .82rem; font-weight: 700; }
.step-do { font-size: 1.05rem; }
.step-why { color: var(--muted); font-size: .92rem; border-left: 2px solid var(--line); padding-left: 10px; }
.concl { margin-top: 12px; padding: 10px 14px; border-radius: 4px; background: var(--ok-soft); border: 1px solid var(--ok); font-size: 1.05rem; }
@keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Exercices ---------- */
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.level { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 4px;
  background: var(--view); cursor: pointer; text-align: left; }
.level:hover { border-color: var(--accent); }
.level.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.lv-stars { color: var(--warn); letter-spacing: -1px; min-width: 2.4em; }
.lv-t { display: flex; flex-direction: column; font-weight: 600; line-height: 1.2; }
.lv-t small { font-weight: 400; color: var(--muted); }
.lv-ok { position: absolute; top: 4px; right: 8px; color: var(--ok-ink); font-weight: 700; }
.series { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.dot.on { background: var(--ok); border-color: var(--ok); }
.exo { border-top: 1px solid var(--line); padding-top: 12px; }
.exo-kind { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-ink); }
.answer { margin: 8px 0; }
.answer-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 1.08rem; }
.cmp-row { display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 1.15rem; }
.cmp-btns { display: inline-flex; gap: 4px; }
.btn.sym { min-width: 44px; font-size: 1.2rem; font-weight: 700; }
.choices { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.btn.choice { min-width: 70px; }
.order { width: 100%; }
.order-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.btn.chip { padding: 6px 14px; font-size: 1.05rem; }
.order-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 52px; padding: 6px 10px; border: 1px dashed var(--line-strong); border-radius: 4px; }
.chip.on { display: inline-flex; padding: 4px 10px; border-radius: 3px; background: var(--accent-soft); border: 1px solid var(--accent); }
.lt { font-weight: 700; color: var(--muted); }
.fb { margin-top: 8px; padding: 8px 12px; border-radius: 4px; border: 1px solid; font-size: .96rem; }
.fb.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); }
.fb.ko { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-ink); }
.fb.partial { border-color: var(--warn); background: var(--warn-soft); color: var(--warn-ink); }
.fb.invalid, .fb.info { border-color: var(--line-strong); background: var(--alt); color: var(--text); }
.tools { border-top: 1px dashed var(--line); padding-top: 10px; }
.hint { margin-top: 10px; padding: 9px 13px; border-radius: 4px; background: var(--accent-soft); border-left: 4px solid var(--accent); }
.sol { margin-top: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--alt); }
.sol-short { font-size: 1.05rem; margin-bottom: 4px; }
.sol .steps { margin-top: 6px; }
.levelup { margin-top: 10px; padding: 9px 13px; border-radius: 4px; background: var(--ok-soft); border: 1px solid var(--ok); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* ---------- Manipulations ---------- */
.manip { display: flex; flex-direction: column; gap: 12px; }
.manip > .btn { align-self: flex-start; }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.grp { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--alt); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.st-l { font-size: .9rem; color: var(--muted); margin-right: 2px; }
.st-v { min-width: 2.2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.slider { display: inline-flex; align-items: center; gap: 10px; }
.slider input { width: 220px; accent-color: var(--accent); }
.readout { padding: 12px 14px; border-radius: 4px; background: var(--alt); border: 1px solid var(--line); }
.readout p { margin: .3em 0; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.arrow { display: inline-block; margin: 0 6px; padding: 1px 6px; font-size: .78rem; color: var(--accent-ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
.lab2 { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.lab2 > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.lab2 .readout { flex: 1; min-width: 240px; }
.expr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px; background: var(--alt); border-radius: 4px; border: 1px solid var(--line); }
.btn.opbtn { min-width: 40px; font-size: 1.15rem; font-weight: 700; border-style: dashed; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.match .col { display: flex; flex-direction: column; gap: 6px; }
.btn.mcard { justify-content: flex-start; min-height: 40px; }
.btn.mcard.sel { background: var(--accent-soft); border-color: var(--accent); }
.btn.mcard.done { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-ink); opacity: 1; }
.shake { animation: shake .35s; border-color: var(--bad) !important; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.ptable { overflow-x: auto; padding-bottom: 4px; }
.prow { position: relative; height: 40px; width: calc(13 * var(--cw)); margin: 0 auto; }
.prow.head { height: 30px; }
.pcell { position: absolute; top: 0; width: var(--cw); height: 100%; border: 1px solid var(--line); background: var(--view); }
.pcell.h { display: flex; align-items: center; justify-content: center; background: var(--alt); font-size: .72rem; color: var(--muted); }
.pcell.unit { border-right: 3px solid var(--text); background: var(--accent-soft); }
.pcell.h.unit { font-weight: 700; color: var(--text); }
.pdig { position: absolute; top: 0; width: var(--cw); height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; }
.pdig.lead { color: var(--accent-ink); }
.pdig.ghost { color: var(--muted); opacity: .6; font-weight: 400; }
.prow.anim .pdig:not(.ghost) { transition: left .6s cubic-bezier(.4, .1, .2, 1); }
.ladder-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ladder { display: flex; flex-direction: column; gap: 3px; }
.rung { display: grid; grid-template-columns: 4em 1fr auto auto; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--view); }
.rung.from { border-color: var(--accent); background: var(--accent-soft); }
.rung.to { border-color: var(--warn); background: var(--warn-soft); }
.rung.from.to { background: var(--alt); }
.r-e { font-weight: 700; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; }
.chipb { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 4px; font-size: .9rem; font-weight: 700; border: 1px solid; }

.chipb.x { text-decoration: line-through; opacity: .45; }
.sci-box { padding: 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--alt); }
.sci-box.good { border-color: var(--ok); background: var(--ok-soft); }

/* ---------- Quiz & cartes ---------- */
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 6px 0 14px; }
.meter span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.quiz-q { font-size: 1.15rem; }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.btn.opt { min-height: 52px; font-size: 1.08rem; }
.btn.opt.good { background: var(--ok-soft); border-color: var(--ok); opacity: 1; }
.btn.opt.bad { background: var(--bad-soft); border-color: var(--bad); opacity: 1; }
.missed ul { padding-left: 1.2em; }
.missed li { margin: 6px 0; }
.flash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 190px; padding: 20px;
  border: 1px solid var(--line-strong); border-radius: 8px; background: var(--alt); cursor: pointer; text-align: center; transition: background .2s; }
.flash:hover { border-color: var(--accent); }
.flash.flipped { background: var(--accent-soft); border-color: var(--accent); animation: flipin .3s; }
@keyframes flipin { from { transform: rotateX(70deg); } to { transform: none; } }
.flash-side { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.flash-body { font-size: 1.3rem; }
.flash-tip { font-size: .82rem; color: var(--muted); }

/* ---------- Accueil ---------- */
.howto { counter-reset: h; list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.howto li { counter-increment: h; padding: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--alt); display: flex; flex-direction: column; gap: 4px; }
.howto li::before { content: counter(h); display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: #fff; font-weight: 700; font-size: .85rem; }
.howto span { color: var(--muted); font-size: .92rem; }
.dom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.dom h2 { display: flex; align-items: center; gap: 10px; }
.fam-list { list-style: none; margin: 0; padding: 0; }
.fam-b { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; text-align: left; }
.fam-b:hover { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- Petits écrans ---------- */
@media (max-width: 860px) {
  .menu-b { display: inline-flex; }
  .tb-lab, .tb-sub { display: none; }
  .tab { padding: 8px 10px; }
  .tb-title { font-size: .95rem; }
  .side { position: fixed; top: 50px; left: 0; z-index: 25; transform: translateX(-105%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0, 0, 0, .15); }
  .side.open { transform: none; }
  .scrim { display: block; position: fixed; inset: 50px 0 0 0; background: rgba(0, 0, 0, .25); z-index: 20; }
  .main { padding: 16px 14px 50px; }
  .block.has-vis { grid-template-columns: 1fr; }
  .step { grid-template-columns: 30px 1fr; }
  .step-why { grid-column: 2; }
  .ladder-wrap { grid-template-columns: 1fr; }
  .levels { grid-template-columns: 1fr; }
  :root { --cw: 30px; }
}
@media (max-width: 520px) {
  .btn.tb:not(.menu-b) { padding: 5px 8px; font-size: .85rem; }
  .match { grid-template-columns: 1fr 1fr; gap: 8px; }
  h1 { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
