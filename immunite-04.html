<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réponse immunitaire adaptative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Style KDE Breeze — barre d'outils, barre latérale, vue centrale encadrée.
   Codes couleur constants (signalisation, théorie de l'apprentissage multimédia) :
   vert = lymphocytes B / anticorps · violet = LT4 auxiliaires · rouge = LT8 cytotoxiques
   orange = antigène / microbe · sarcelle = cellules de l'immunité innée (CPA, macrophage)
   bleu = cellule du soi · contour pointillé = cellule mémoire · jaune = interleukine */
:root{
  --win:#eff0f1; --view:#fcfcfc; --alt:#f4f5f6; --fg:#232629; --fg2:#5f6a74; --line:#d5d9dc; --line2:#b8bfc5;
  --accent:#3daee9; --accent-strong:#1d87bf; --accent-bg:#e2f2fb;
  --pos:#27ae60; --pos-fg:#1c7d45; --pos-bg:#e3f4ea;
  --neg:#da4453; --neg-fg:#b22a39; --neg-bg:#fae5e7;
  --neu:#f67400; --neu-fg:#a94f00; --neu-bg:#fdeedd;
  --lb:#27ae60; --lb-bg:#dcf1e4;
  --lt4:#8e44ad; --lt4-bg:#efe3f5;
  --lt8:#da4453; --lt8-bg:#fae3e5;
  --ag:#f67400; --ag-bg:#fdecd9;
  --cpa:#16a085; --cpa-bg:#d9f1ec;
  --soi:#2980b9; --soi-bg:#e0edf8;
  --il:#d4a000;
  --gang:#f3f6f8; --tissu:#f7f1ea;
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:4px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --win:#202326; --view:#141618; --alt:#1b1d20; --fg:#fcfcfc; --fg2:#a7b0b8; --line:#363b41; --line2:#4c535a;
    --accent:#3daee9; --accent-strong:#6cc4f0; --accent-bg:#163647;
    --pos:#27ae60; --pos-fg:#62d394; --pos-bg:#14301e;
    --neg:#da4453; --neg-fg:#f2808c; --neg-bg:#3a1a1f;
    --neu:#f67400; --neu-fg:#ffa451; --neu-bg:#382410;
    --lb:#3cc174; --lb-bg:#15301f; --lt4:#bb8fd6; --lt4-bg:#2c1d36; --lt8:#ee6a77; --lt8-bg:#3a1a1f;
    --ag:#ff9a40; --ag-bg:#3a2612; --cpa:#48c9b0; --cpa-bg:#123029; --soi:#5dade2; --soi-bg:#15293a;
    --il:#ffd04d; --gang:#1a1e22; --tissu:#231f1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --win:#202326; --view:#141618; --alt:#1b1d20; --fg:#fcfcfc; --fg2:#a7b0b8; --line:#363b41; --line2:#4c535a;
  --accent:#3daee9; --accent-strong:#6cc4f0; --accent-bg:#163647;
  --pos:#27ae60; --pos-fg:#62d394; --pos-bg:#14301e;
  --neg:#da4453; --neg-fg:#f2808c; --neg-bg:#3a1a1f;
  --neu:#f67400; --neu-fg:#ffa451; --neu-bg:#382410;
  --lb:#3cc174; --lb-bg:#15301f; --lt4:#bb8fd6; --lt4-bg:#2c1d36; --lt8:#ee6a77; --lt8-bg:#3a1a1f;
  --ag:#ff9a40; --ag-bg:#3a2612; --cpa:#48c9b0; --cpa-bg:#123029; --soi:#5dade2; --soi-bg:#15293a;
  --il:#ffd04d; --gang:#1a1e22; --tissu:#231f1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--win);color:var(--fg);font-family:var(--font);font-size:15.5px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.big{font-size:18px}
button,select,textarea,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:1.35rem;font-weight:600}
h2{font-size:1.12rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--view);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:54px}
.top .ttl{display:flex;flex-direction:column;min-width:0;flex:1}
.top .ttl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:.8rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--fg2)}
.meter .bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media(max-width:620px){.meter .bar{width:46px}.top .ttl span{display:none}}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1260px;margin:0 auto}
.side{position:sticky;top:54px;align-self:start;max-height:calc(100vh - 54px);overflow:auto;padding:12px 10px 30px;border-right:1px solid var(--line)}
.side .grp{font-size:.75rem;color:var(--fg2);padding:12px 10px 4px;letter-spacing:.03em;text-transform:uppercase}
.navi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:3px;padding:6px 10px;cursor:pointer;font-size:.93rem;line-height:1.35}
.navi:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.navi[aria-current="page"]{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
.navi .n{width:20px;height:20px;flex:none;border-radius:50%;border:1px solid var(--line2);font-size:.7rem;display:grid;place-items:center;color:var(--fg2)}
.navi .n.done{background:var(--pos);border-color:var(--pos);color:#fff}
.navi .lab{flex:1;min-width:0}
.navi .cnt{font-size:.74rem;color:var(--fg2)}
main{min-width:0;padding:24px 28px 80px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:54px;z-index:9;max-height:none;border-right:0;border-bottom:1px solid var(--line);background:var(--win);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
  .side .grp{display:none}
  .navi{width:auto;white-space:nowrap;flex:none}
  .navi .cnt{display:none}
  main{padding:16px 12px 64px}
}

.frame{background:var(--view);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;display:flex;flex-direction:column;gap:14px}
@media(max-width:620px){.frame{padding:16px 14px}}
.eyebrow{font-size:.8rem;color:var(--fg2)}
.goal{color:var(--fg2)}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--fg2)}
.small{font-size:.86rem}
.sep{height:1px;background:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--view);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.alt{background:var(--alt)}
.card h3{display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:2px solid currentColor}

.msg{border:1px solid var(--accent);background:var(--accent-bg);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.msg b.h{font-weight:600}
.msg.pos{border-color:var(--pos);background:var(--pos-bg)}
.msg.neg{border-color:var(--neg);background:var(--neg-bg)}
.msg.neu{border-color:var(--neu);background:var(--neu-bg)}
.msg ul,.msg ol{margin:0;padding-left:1.2em}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-size:.92rem;min-height:34px;padding:4px 14px;border:1px solid var(--line2);border-radius:3px;background:var(--view);cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{border-color:var(--accent);background:var(--accent-bg)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 30%,var(--view))}
.btn.flat{border-color:transparent;background:transparent}
.btn.flat:hover:not(:disabled){background:var(--alt);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.btn.sm{min-height:28px;padding:2px 10px;font-size:.85rem}

.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;gap:2px}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--fg2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.pill{display:inline-block;font-size:.76rem;line-height:1.55;padding:0 8px;border-radius:10px;border:1px solid var(--line2);color:var(--fg2);white-space:nowrap}
.pill.ok{border-color:var(--pos);color:var(--pos-fg);background:var(--pos-bg)}
.pill.acc{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-bg)}
.k{font-weight:600}
.c-lb{color:var(--lb)}.c-lt4{color:var(--lt4)}.c-lt8{color:var(--lt8)}.c-ag{color:var(--ag)}.c-cpa{color:var(--cpa)}.c-soi{color:var(--soi)}.c-il{color:var(--il)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--alt)}
tr:last-child td{border-bottom:0}

.fig{border:1px solid var(--line);border-radius:var(--r);background:var(--view);overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
.fig.scroll svg{min-width:660px}
svg text{font-family:var(--font);fill:var(--fg)}
.cap{font-size:.84rem;color:var(--fg2)}
.g-step{transition:opacity .35s}
.g-off{opacity:.1}
.hot{cursor:pointer}
.hot:hover .hl{stroke:var(--accent)}

.stepper{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--view);cursor:pointer;font-size:.82rem}
.dot[aria-current="step"]{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.dot.seen{border-color:var(--accent)}
.steptext{min-height:5.6em;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 14px;background:var(--alt)}
.steptext b.h{display:block;margin-bottom:2px}

.ex{border:1px solid var(--line);border-radius:var(--r);background:var(--view);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex.solved{border-left:3px solid var(--accent)}
.ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--fg2)}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:9px;height:9px;border-radius:50%;border:1px solid var(--accent)}
.lvl i.on{background:var(--accent)}
.ex-head .st{margin-left:auto}
.prompt{max-width:72ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--view);cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mk{width:16px;height:16px;flex:none;border:1px solid var(--line2);border-radius:50%;margin-top:3px;background:var(--view)}
.opt.multi .mk{border-radius:3px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.opt[aria-pressed="true"] .mk{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--view)}
.opt.good{border-color:var(--pos);background:var(--pos-bg)}
.opt.bad{border-color:var(--neg);background:var(--neg-bg)}
.opt:disabled{cursor:default}
.opt .why{display:block;font-size:.85rem;color:var(--fg2);margin-top:2px}

.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,1fr) 22px;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:3px}
.mrow.good{border-color:var(--pos);background:var(--pos-bg)}
.mrow.bad{border-color:var(--neg);background:var(--neg-bg)}
@media(max-width:560px){.mrow{grid-template-columns:1fr 22px}.mrow select{grid-column:1}}
select{min-height:34px;border:1px solid var(--line2);border-radius:3px;background:var(--view);padding:2px 8px;max-width:100%}
select:hover{border-color:var(--accent)}
.mark{font-weight:700;text-align:center}
.mark.good{color:var(--pos-fg)}.mark.bad{color:var(--neg-fg)}

.ord{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--view)}
.orow .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--alt);border:1px solid var(--line2);display:grid;place-items:center;font-size:.8rem}
.orow .t{flex:1;min-width:0}
.orow.good{border-color:var(--pos);background:var(--pos-bg)}
.orow.bad{border-color:var(--neg);background:var(--neg-bg)}
.orow.out{opacity:.55;border-style:dashed}
.orow.out .t{text-decoration:line-through}
.ibtn{width:30px;height:30px;border:1px solid var(--line2);border-radius:3px;background:var(--view);cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn:hover:not(:disabled){border-color:var(--accent)}
.ibtn:disabled{opacity:.35;cursor:default}

.cloze{line-height:2.3;max-width:72ch}
.cloze select{margin:0 3px;min-height:30px}
.cloze select.good{border-color:var(--pos);background:var(--pos-bg)}
.cloze select.bad{border-color:var(--neg);background:var(--neg-bg)}

textarea{width:100%;min-height:120px;border:1px solid var(--line2);border-radius:3px;background:var(--view);padding:8px 10px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--accent)}

.corr{border:1px solid var(--line);border-radius:var(--r);background:var(--alt);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.corr ol,.corr ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.wsteps{display:flex;flex-direction:column;gap:8px}
.wstep{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--alt)}
.wstep .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:600}
.wstep b.h{display:block}

.flash{min-height:210px;border:1px solid var(--line2);border-radius:6px;background:var(--view);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;cursor:pointer;width:100%}
.flash:hover{border-color:var(--accent)}
.flash .face{font-size:.78rem;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.flash .term{font-size:1.35rem;font-weight:600}
.flash .def{max-width:56ch;font-size:1.02rem}

.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.gl{border:1px solid var(--line);border-radius:3px;padding:8px 12px;background:var(--view);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.gl:hover{border-color:var(--accent)}
.gl .d{font-size:.88rem;color:var(--fg2)}
input[type=range]{width:100%;accent-color:var(--accent)}
.kbd{font-size:.8rem;border:1px solid var(--line2);border-radius:3px;padding:0 5px;background:var(--alt)}
</style>
</head>
<body>
<div id="root"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="aFg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--fg2)"/></marker>
    <marker id="aLb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--lb)"/></marker>
    <marker id="aLt4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--lt4)"/></marker>
    <marker id="aLt8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--lt8)"/></marker>
    <marker id="aCpa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--cpa)"/></marker>
    <marker id="aIl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--il)"/></marker>
  </defs>
</svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
"use strict";
/* ================= CONTENU ================= */

const GLOSS = [
  {t:"Antigène", d:"Molécule reconnue comme étrangère (non-soi) qui déclenche une réponse adaptative : toxine, molécule à la surface d'un microbe, fragment viral…", c:"ag"},
  {t:"Anticorps (immunoglobuline)", d:"Protéine en forme de Y, produite par la lignée des LB, qui se lie spécifiquement à un seul type d'antigène.", c:"lb"},
  {t:"Spécificité", d:"Un anticorps ou un récepteur T ne reconnaît qu'un seul type d'antigène, grâce à une forme complémentaire.", c:"lb"},
  {t:"Lymphocyte B (LB)", d:"Lymphocyte porteur d'anticorps membranaires ; acteur principal de la réponse humorale.", c:"lb"},
  {t:"Plasmocyte", d:"LB différencié qui sécrète des milliers d'anticorps solubles par seconde.", c:"lb"},
  {t:"LB mémoire", d:"LB à longue durée de vie qui permet une réponse rapide et intense lors d'un 2e contact avec le même antigène.", c:"lb"},
  {t:"Amplification clonale", d:"Multiplication par mitoses successives d'un lymphocyte activé : on obtient un clone de cellules identiques, qui reconnaissent toutes le même antigène.", c:"lb"},
  {t:"Complexe immun", d:"Ensemble formé par des anticorps fixés sur des antigènes. Les antigènes sont neutralisés, puis le complexe est phagocyté par les macrophages.", c:"lb"},
  {t:"LT4 auxiliaire", d:"Lymphocyte T qui sécrète l'interleukine ; « chef d'orchestre » qui stimule les LB et les LT8.", c:"lt4"},
  {t:"Interleukine (cytokine)", d:"Messager chimique sécrété par les LT4 auxiliaires ; stimule la multiplication et la différenciation des LB et des LT8.", c:"il"},
  {t:"LT8 cytotoxique", d:"Lymphocyte T à courte durée de vie qui tue les cellules du soi infectées par un virus ou cancéreuses.", c:"lt8"},
  {t:"CMH", d:"Molécules de la membrane de nos cellules (marqueurs du soi) ; elles présentent des fragments d'antigène aux LT.", c:"soi"},
  {t:"CPA", d:"Cellule présentatrice de l'antigène : cellule (ex. dendritique) qui expose des fragments d'antigène associés au CMH.", c:"cpa"},
  {t:"Récepteur T", d:"Récepteur membranaire d'un LT. Chaque LT n'en possède qu'un seul type, capable de reconnaître un seul antigène présenté par le CMH.", c:"lt4"},
  {t:"Baiser de la mort", d:"Contact entre un LT8 cytotoxique et une cellule infectée, qui entraîne la mort de cette cellule en quelques heures.", c:"lt8"},
  {t:"Cytolyse", d:"Mort de la cellule cible : sa membrane est perforée par des perforines libérées par le LT8 cytotoxique.", c:"lt8"},
  {t:"Apoptose", d:"Autodestruction de la cellule cible, déclenchée par des signaux libérés par le LT8 cytotoxique.", c:"lt8"},
  {t:"Ganglion lymphatique", d:"Organe lymphatique où les CPA rencontrent les lymphocytes et où ceux-ci se multiplient.", c:"cpa"},

/* Texte multi-ligne */
function T({x,y,t,a="middle",s=12,w,c,it}){

/* Flèche : c = Fg | Lb | Lt4 | Lt8 | Cpa | Il */
const ARC={Fg:"fg2",Lb:"lb",Lt4:"lt4",Lt8:"lt8",Cpa:"cpa",Il:"il"};
function Ar({d,c="Fg",w=1.7,dash}){

function Ab({x,y,s=1,rot=0,c="lb"}){

const pol=(x,y,r,a)=>{const t=a*Math.PI/180;return [x+r*Math.cos(t),y+r*Math.sin(t)]};
function SurfAb({x,y,r,angles,c="lb"}){

}
function Rt({x,y,rot=0,c,s=1}){
  return html`<g transform=${`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${s})`}><path d="M0 7V1M-3.5 -4V1H3.5V-4" fill="none" stroke=${V(c)} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></g>`;

function SurfRt({x,y,r,angles,c}){

/* Molécule du CMH (bleu = soi) tenant un fragment d'antigène (orange) */
function Cmh({x,y,rot=0,s=1}){
  return html`<g transform=${`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${s})`}>

function SurfCmh({x,y,r,angles,s=1}){

function lblPos(x,y,r,pos){
  if(pos==="t") return {x,y:y-r-9,a:"middle"};
  if(pos==="r") return {x:x+r+9,y:y+4,a:"start"};
  if(pos==="l") return {x:x-r-9,y:y+4,a:"end"};

}
function Cell({x,y,r=20,c="lb",mem,hl,label,lp="b",ab,rt,sub,bare}){
  const P=lblPos(x,y,r,lp);
  return html`<g>
    ${ab&&html`<${SurfAb} x=${x} y=${y} r=${r} angles=${ab} c=${c}/>`}

function blobPath(x,y,r,f,n=72){
  let d="";for(let i=0;i<=n;i++){const t=i/n*2*Math.PI;const rr=r*f(t);d+=(i?"L":"M")+(x+rr*Math.cos(t)).toFixed(1)+" "+(y+rr*Math.sin(t)).toFixed(1)}
  return d+"Z";

function Complex({x,y,n=3,g=24,mini}){
  const els=[];const x0=x-(n-1)*g/2,y0=y-(n-1)*g/2;

/* Texte enrichi : **gras**, *italique* */
function R({t}){
  if(t==null) return null;
  const parts=String(t).split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
  return parts.map((p,i)=>p.startsWith("**")?html`<b key=${i}>${p.slice(2,-2)}</b>`:p.startsWith("*")&&p.length>2?html`<i key=${i}>${p.slice(1,-1)}</i>`:p);
}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(arr,seed){
  const a=arr.slice();let s=seed||1;
  const rnd=()=>{s=Math.imul(s^(s>>>15),2246822507);s=Math.imul(s^(s>>>13),3266489909);s^=s>>>16;return (s>>>0)/4294967296};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function Stepper({steps,Fig,label}){
  const [s,setS]=useState(1);
  const [seen,setSeen]=useState(()=>new Set([1]));
  const go=n=>{const v=Math.max(1,Math.min(steps.length,n));setS(v);setSeen(p=>new Set(p).add(v))};
  const st=steps[s-1];
  return html`<div className="stepper">
    <div className="fig scroll"><${Fig} step=${s}/></div>
    <div className="steptext" aria-live="polite"><b className="h">Étape ${s} / ${steps.length} — ${st.h}</b><span><${R} t=${st.t}/></span></div>
    <div className="row">
      <button className="btn" onClick=${()=>go(s-1)} disabled=${s===1}>← Précédent</button>
      <div className="dots" role="group" aria-label=${label}>
        ${steps.map((x,i)=>html`<button key=${i} className=${"dot"+(seen.has(i+1)?" seen":"")} aria-current=${s===i+1?"step":null} title=${x.h} onClick=${()=>go(i+1)}>${i+1}</button>`)}
      </div>
      <button className="btn primary" onClick=${()=>go(s+1)} disabled=${s===steps.length}>Suivant →</button>
    </div>
  </div>`;
}

/* ---------- Moteur d'exercices ---------- */
function initState(ex,seed){
  if(ex.type==="qcm") return {sel:[]};
  if(ex.type==="match"||ex.type==="cloze") return {v:(ex.items||ex.blanks).map(()=>"")};
  if(ex.type==="order"){
    const idx=ex.items.map((_,i)=>i);let o=shuffle(idx,seed);
    if(o.every((v,i)=>v===i)) o=o.slice().reverse();
    return {o,out:[]};
  }
  if(ex.type==="open") return {text:"",revealed:false,crit:[]};
}
function evaluate(ex,st){
  if(ex.type==="qcm"){
    const good=ex.opts.map((o,i)=>!!o.ok);
    const marks=ex.opts.map((o,i)=>st.sel.includes(i)?(o.ok?"good":"bad"):(o.ok&&ex.multi?"miss":null));
    const ok=good.every((g,i)=>g===st.sel.includes(i));
    const nOk=good.filter((g,i)=>g===st.sel.includes(i)).length;
    return {ok,marks,score:nOk,total:ex.opts.length};
  }
  if(ex.type==="match"||ex.type==="cloze"){
    const L=ex.items||ex.blanks;
    const marks=L.map((it,i)=>st.v[i]===it.a?"good":"bad");
    const score=marks.filter(m=>m==="good").length;
    return {ok:score===L.length,marks,score,total:L.length};
  }
  if(ex.type==="order"){
    const inc=st.o.filter(i=>!st.out.includes(i));
    const correct=ex.items.map((it,i)=>i).filter(i=>!ex.items[i].intrus);
    const marks={};
    let pos=0;
    st.o.forEach(i=>{
      if(st.out.includes(i)) marks[i]=ex.items[i].intrus?"good":"bad";
      else {marks[i]=(!ex.items[i].intrus&&correct[pos]===i)?"good":"bad";pos++;}
    });
    const score=Object.values(marks).filter(m=>m==="good").length;
    return {ok:score===ex.items.length&&inc.length===correct.length,marks,score,total:ex.items.length};
  }
}
function Corrections({ex,open,setOpen}){
  return html`<div className="corr-wrap" style=${{display:"flex",flexDirection:"column",gap:"8px"}}>
    <div className="row">
      <button className="btn sm" aria-pressed=${open==="simple"} onClick=${()=>setOpen(open==="simple"?null:"simple")}>Correction simple</button>
      <button className="btn sm" aria-pressed=${open==="detail"} onClick=${()=>setOpen(open==="detail"?null:"detail")}>Correction détaillée</button>
    </div>
    ${open==="simple"&&html`<div className="corr"><b>Réponse attendue</b><span><${R} t=${ex.simple}/></span></div>`}
    ${open==="detail"&&html`<div className="corr"><b>Correction détaillée</b><ol>${ex.detail.map((d,i)=>html`<li key=${i}><${R} t=${d}/></li>`)}</ol></div>`}
  </div>`;
}
function Exercise({ex,n,done,onDone}){
  const [tries,setTries]=useState(0);
  const seed=hashStr(ex.id)+tries*0;
  const [st,setSt]=useState(()=>initState(ex,seed));
  const [res,setRes]=useState(null);
  const [corr,setCorr]=useState(null);
  const F=ex.fig&&FIGS[ex.fig];
  const locked=!!res;
  const choices=useMemo(()=>{
    if(ex.type!=="match") return null;
    const base=ex.choices||ex.items.map(i=>i.a);
    return shuffle(base,hashStr(ex.id+"c"));
  },[ex]);
  const check=()=>{const r=evaluate(ex,st);setRes(r);setTries(t=>t+1);if(r.ok)onDone(ex.id)};
  const retry=()=>setRes(null);
  const reset=()=>{setSt(initState(ex,seed));setRes(null);setCorr(null)};
  const filled=(()=>{
    if(ex.type==="qcm") return st.sel.length>0;
    if(ex.type==="match"||ex.type==="cloze") return st.v.every(v=>v);
    return true;
  })();

  let body=null;
  if(ex.type==="qcm"){
    body=html`<div className="opts" role="group">
      ${ex.opts.map((o,i)=>{
        const on=st.sel.includes(i); const m=res&&res.marks[i];
        const cls="opt"+(ex.multi?" multi":"")+(m==="good"?" good":m==="bad"?" bad":m==="miss"?" bad":"");
        return html`<button key=${i} className=${cls} aria-pressed=${on} disabled=${locked}
          onClick=${()=>setSt(s=>({sel:ex.multi?(on?s.sel.filter(x=>x!==i):[...s.sel,i]):[i]}))}>
          <span className="mk"></span><span><${R} t=${o.t}/>
          ${res&&(on||m==="miss")&&o.why&&html`<span className="why">${m==="miss"?"Oubliée — ":""}<${R} t=${o.why}/></span>`}</span></button>`})}
    </div>`;
  } else if(ex.type==="match"){
    body=html`<div className="opts">
      ${ex.items.map((it,i)=>{const m=res&&res.marks[i];return html`<label key=${i} className=${"mrow"+(m?" "+m:"")}>
        <span><${R} t=${it.t}/></span>
        <select value=${st.v[i]} disabled=${locked} onChange=${e=>{const v=e.target.value;setSt(s=>{const a=s.v.slice();a[i]=v;return {v:a}})}}>
          <option value="">— choisir —</option>
          ${choices.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
        </select>
        <span className=${"mark "+(m||"")} aria-hidden="true">${m==="good"?"✓":m==="bad"?"✗":""}</span></label>`})}
    </div>`;
  } else if(ex.type==="cloze"){
    const parts=ex.text.split(/\{(\d+)\}/g);
    body=html`<p className="cloze">${parts.map((p,k)=>{
      if(k%2===0) return html`<${Fragment} key=${k}>${p}<//>`;
      const i=+p;const b=ex.blanks[i];const m=res&&res.marks[i];
      return html`<select key=${k} aria-label=${"Trou "+(i+1)} className=${m||""} value=${st.v[i]} disabled=${locked}
        onChange=${e=>{const v=e.target.value;setSt(s=>{const a=s.v.slice();a[i]=v;return {v:a}})}}>
        <option value="">……</option>${b.o.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
    })}</p>`;
  } else if(ex.type==="order"){
    const move=(k,d)=>setSt(s=>{const o=s.o.slice();const j=k+d;if(j<0||j>=o.length)return s;[o[k],o[j]]=[o[j],o[k]];return {...s,o}});
    const hasIntrus=ex.items.some(i=>i.intrus);
    let num=0;
    body=html`<div className="ord">
      ${st.o.map((i,k)=>{const out=st.out.includes(i);const m=res&&res.marks[i];if(!out)num++;
        return html`<div key=${i} className=${"orow"+(out?" out":"")+(m?" "+m:"")}>
          <span className="num">${out?"✕":num}</span><span className="t">${ex.items[i].t}</span>
          <button className="ibtn" aria-label="Monter" disabled=${locked||k===0} onClick=${()=>move(k,-1)}>↑</button>
          <button className="ibtn" aria-label="Descendre" disabled=${locked||k===st.o.length-1} onClick=${()=>move(k,1)}>↓</button>
          ${hasIntrus&&html`<button className="ibtn" aria-pressed=${out} title=${out?"Réintégrer":"Écarter (intrus)"} aria-label=${out?"Réintégrer":"Écarter comme intrus"} disabled=${locked}
            onClick=${()=>setSt(s=>({...s,out:out?s.out.filter(x=>x!==i):[...s.out,i]}))}>${out?"↺":"✕"}</button>`}
        </div>`})}
    </div>`;
  } else if(ex.type==="open"){
    body=html`<div style=${{display:"flex",flexDirection:"column",gap:"10px"}}>
      <textarea aria-label="Ta réponse" placeholder="Rédige ta réponse ici (quelques phrases)…" value=${st.text} onInput=${e=>{const v=e.target.value;setSt(s=>({...s,text:v}))}}></textarea>
      ${!st.revealed&&html`<div className="row"><button className="btn primary" disabled=${st.text.trim().length<20} onClick=${()=>setSt(s=>({...s,revealed:true}))}>Comparer avec la correction</button>
        <span className="small muted">${st.text.trim().length<20?"Écris d'abord ta réponse.":""}</span></div>`}
      ${st.revealed&&html`<div className="corr"><b>Auto-évaluation : coche ce qui est présent dans ta réponse</b>
        ${ex.crit.map((c,i)=>html`<label key=${i} className="check"><input type="checkbox" checked=${st.crit.includes(i)} onChange=${()=>setSt(s=>({...s,crit:s.crit.includes(i)?s.crit.filter(x=>x!==i):[...s.crit,i]}))}/><span><${R} t=${c}/></span></label>`)}
        <div className="row"><span className="pill">${st.crit.length} / ${ex.crit.length} critères</span>
          <button className="btn sm primary" onClick=${()=>onDone(ex.id)}>${done?"Terminé ✓":"J'ai terminé l'auto-évaluation"}</button></div></div>
        <div className="row">
          <button className="btn sm" aria-pressed=${corr==="simple"} onClick=${()=>setCorr(corr==="simple"?null:"simple")}>Correction simple</button>
          <button className="btn sm" aria-pressed=${corr==="detail"} onClick=${()=>setCorr(corr==="detail"?null:"detail")}>Correction détaillée</button></div>
        ${corr==="simple"&&html`<div className="corr"><b>Les idées indispensables</b><ul>${ex.crit.map((c,i)=>html`<li key=${i}><${R} t=${c}/></li>`)}</ul></div>`}
        ${corr==="detail"&&html`<div className="corr"><b>Exemple de réponse rédigée</b>${ex.model.map((p,i)=>html`<p key=${i}><${R} t=${p}/></p>`)}</div>`}`}
    </div>`;
  }

  return html`<article className="ex" aria-label=${"Exercice "+n}>
    <div className="ex-head"><b style=${{color:"var(--fg)"}}>Exercice ${n}</b><${Lvl} n=${ex.lvl}/><span>${LVL_TXT[ex.lvl]}</span>
      <span className="st">${done?html`<span className="pill ok">réussi ✓</span>`:tries?html`<span className="pill">${tries} essai${tries>1?"s":""}</span>`:null}</span></div>
    <div className="prompt"><${R} t=${ex.prompt}/></div>
    ${F&&html`<${F}/>`}
    ${body}
    ${ex.type!=="open"&&html`<${Fragment}>
      ${res&&html`<div className=${"msg "+(res.ok?"pos":"neg")} role="status">
        <b className="h">${res.ok?"Bravo, c'est juste !":`${res.score} / ${res.total} élément${res.total>1?"s":""} correct${res.score>1?"s":""}`}</b>
        <span>${res.ok?"Lis la correction détaillée pour vérifier ton raisonnement.":"Les éléments en rouge sont à revoir. Corrige-les, ou consulte la correction."}</span></div>`}
      <div className="row">
        ${!res&&html`<button className="btn primary" disabled=${!filled} onClick=${check}>Vérifier</button>`}
        ${res&&!res.ok&&html`<button className="btn primary" onClick=${retry}>Corriger mes réponses</button>`}
        ${(res||tries>0)&&html`<button className="btn flat" onClick=${reset}>Recommencer</button>`}
        ${!res&&!filled&&html`<span className="small muted">${ex.type==="qcm"?(ex.multi?"Plusieurs réponses possibles.":"Une seule réponse."):"Complète tout avant de vérifier."}</span>`}
      </div>
      ${tries>0&&html`<${Corrections} ex=${ex} open=${corr} setOpen=${setCorr}/>`}
    <//>`}
  </article>`;
}

    <div className="row"><button className="btn" onClick=${()=>go("humorale")}>← Réponse humorale</button><button className="btn primary" onClick=${()=>go("synthese")}>Synthèse →</button></div>
  <//>`;
}
function phaseText(d){
  if(d<5) return ["Temps de latence","Les rares LB spécifiques sont sélectionnés, se multiplient et se différencient. Pas encore d'anticorps."];
  if(d<14) return ["1re réponse : montée","Les plasmocytes sécrètent des anticorps : la concentration augmente lentement."];
  if(d<30) return ["1re réponse : déclin","L'antigène est éliminé ; les anticorps diminuent. Des LB mémoire persistent."];
  if(d<31.5) return ["2e contact avec le même antigène","Les LB mémoire, nombreux et déjà spécifiques, réagissent presque sans latence."];
  if(d<38) return ["2e réponse : montée rapide","Réponse plus rapide et plus intense (≈ 10 fois plus d'anticorps), déclenchée même par une faible dose d'antigène."];
  return ["2e réponse : maintien","La concentration reste élevée longtemps : la protection est durable."];
}
function PageSynthese({go}){
  const [tab,setTab]=useState("memoire");
  const [day,setDay]=useState(8);
  const [vih,setVih]=useState(false);
  const ph=phaseText(day);
  const tabs=[["origine","Origine des lymphocytes"],["memoire","Mémoire immunitaire"],["bilan","Avantages / inconvénients"],["vih","Coopération et VIH"]];
  return html`<${Fragment}>
    <${Frame} eyebrow="Comprendre · 5" title="Synthèse de l'immunité adaptative">
      <div className="tabs" role="tablist">${tabs.map(([k,t])=>html`<button key=${k} role="tab" className="tab" aria-selected=${tab===k} onClick=${()=>setTab(k)}>${t}</button>`)}</div>
      ${tab==="origine"&&html`<div style=${{display:"flex",flexDirection:"column",gap:"10px"}}>
        <div className="grid2">
          <div className="card"><h3>1. Moelle osseuse</h3><p>Tous les lymphocytes y naissent. Les <b>LB</b> y acquièrent leurs anticorps membranaires.</p></div>
          <div className="card"><h3>2. Thymus</h3><p>Les futurs <b>LT</b> y migrent et y deviennent des lymphocytes T matures (LT4, LT8).</p></div>
          <div className="card"><h3>3. Organes lymphatiques secondaires</h3><p>Dans les <b>ganglions lymphatiques</b>, les lymphocytes rencontrent l'antigène : <b>multiplication clonale</b>, puis différenciation.</p></div>
        </div>
        <p className="small muted">Ensuite : plasmocytes sécrétant des anticorps, LB mémoire, LT8 cytotoxiques (« baiser de la mort »), et macrophages qui éliminent les complexes immuns.</p></div>`}
      ${tab==="memoire"&&html`<div style=${{display:"flex",flexDirection:"column",gap:"10px"}}>
        <p>On injecte un antigène A au jour 0, puis à nouveau au jour 30. Déplace le curseur pour suivre la concentration d'anticorps anti-A.</p>
        <div className="fig"><${MemGraph} day=${day}/></div>
        <label className="small" htmlFor="jour">Jour <b>${Math.round(day)}</b> — environ <b>${Math.round(respA(day))}</b> u.a. d'anticorps</label>
        <input id="jour" type="range" min="0" max="60" step="0.5" value=${day} onInput=${e=>setDay(+e.target.value)}/>
        <div className="steptext" aria-live="polite"><b className="h">${ph[0]}</b><span>${ph[1]}</span></div></div>`}
      ${tab==="bilan"&&html`<div className="grid2">
        <div className="card"><h3 style=${{color:"var(--neg-fg)"}}>Inconvénient</h3><p>Le <b>temps de latence</b> : il faut environ <b>cinq jours</b>, lors d'une première infection, pour la multiplication clonale des LB ou des LT, leur différenciation et leur attaque spécifique.</p></div>
        <div className="card"><h3 style=${{color:"var(--pos-fg)"}}>Avantage 1 : l'adaptation</h3><p>La <b>grande diversité</b> des LB et des LT permet de reconnaître pratiquement n'importe quel antigène circulant et de détruire les microbes envahisseurs.</p></div>
        <div className="card"><h3 style=${{color:"var(--pos-fg)"}}>Avantage 2 : la mémoire</h3><p>La <b>mémoire immunitaire</b> permet une réponse <b>rapide</b> lors d'une seconde agression par le même microbe, toujours de manière <b>spécifique</b>.</p></div>
      </div>`}
      ${tab==="vih"&&html`<div style=${{display:"flex",flexDirection:"column",gap:"10px"}}>
        <p>Les LT4 auxiliaires stimulent les deux réponses. Que se passe-t-il si on les supprime ?</p>
        <div className="row"><button className="btn" aria-pressed=${!vih} onClick=${()=>setVih(false)}>Organisme sain</button><button className="btn" aria-pressed=${vih} onClick=${()=>setVih(true)}>Infection par le VIH (stade SIDA)</button></div>
        <div className="fig"><${CoopFig} vih=${vih}/></div>
        <div className=${"msg "+(vih?"neg":"pos")}><span>${vih?"Le VIH attaque et détruit préférentiellement les LT4. Sans interleukine, la réponse adaptative n'est plus efficace : des maladies opportunistes apparaissent, qui peuvent entraîner la mort alors que d'ordinaire le système immunitaire s'en défend.":"L'interleukine des LT4 auxiliaires stimule la multiplication et la différenciation des LB et des LT8 : les deux réponses sont efficaces."}</span></div></div>`}
    <//>
    <div className="row"><button className="btn" onClick=${()=>go("cellulaire")}>← Réponse cellulaire</button><button className="btn primary" onClick=${()=>go("cartes")}>Mémoriser →</button></div>
  <//>`;
}

/* ---------- Cartes mémoire ---------- */
function PageCartes({go}){
  const [rev,setRev]=useState(false);
  const [queue,setQueue]=useState(()=>shuffle(GLOSS.map((_,i)=>i),Date.now()%100000+1));
  const [flip,setFlip]=useState(false);
  const [known,setKnown]=useState(0);
  const cur=queue[0];
  const next=ok=>{setFlip(false);setQueue(q=>ok?q.slice(1):[...q.slice(1),q[0]]);if(ok)setKnown(k=>k+1)};
  const restart=()=>{setQueue(shuffle(GLOSS.map((_,i)=>i),Date.now()%100000+1));setKnown(0);setFlip(false)};
  const g=cur!=null?GLOSS[cur]:null;
  return html`<${Fragment}>
    <${Frame} eyebrow="Mémoriser" title="Cartes mémoire" goal="Se tester est la meilleure façon de mémoriser (effet test). **Réponds dans ta tête avant de retourner la carte.** Les cartes « à revoir » reviennent en fin de paquet.">
      <div className="row"><button className="btn sm" aria-pressed=${!rev} onClick=${()=>{setRev(false);setFlip(false)}}>Mot → définition</button>
        <button className="btn sm" aria-pressed=${rev} onClick=${()=>{setRev(true);setFlip(false)}}>Définition → mot</button>
        <span className="pill ok">${known} / ${GLOSS.length} sues</span><span className="pill">${queue.length} restante${queue.length>1?"s":""}</span></div>
      ${g?html`<${Fragment}>
        <button className="flash" onClick=${()=>setFlip(!flip)} aria-label="Retourner la carte">
          <span className="face">${flip?"verso":"recto"} · clique pour retourner</span>
          ${(!flip&&!rev)||(flip&&rev)?html`<span className="term"><span className=${"sw c-"+g.c} style=${{marginRight:"8px"}}></span>${g.t}</span>`:html`<span className="def">${g.d}</span>`}
        </button>
        <div className="row" style=${{justifyContent:"center"}}>
          <button className="btn" disabled=${!flip} onClick=${()=>next(false)}>À revoir</button>
          <button className="btn primary" disabled=${!flip} onClick=${()=>next(true)}>Je savais ✓</button></div>`
      :html`<div className="msg pos"><b className="h">Paquet terminé !</b><span>Tu as revu les ${GLOSS.length} notions. Refais le paquet demain : espacer les révisions renforce la mémoire.</span></div>
        <div className="row"><button className="btn" onClick=${restart}>Recommencer</button><button className="btn primary" onClick=${()=>go("f-acteurs")}>Passer aux exercices →</button></div>`}
    <//>
  <//>`;
}

/* ---------- Famille d'exercices ---------- */
function PageFamille({fam,prog,markDone,go}){
  const i=FAMILIES.indexOf(fam);
  const nDone=fam.exs.filter(e=>prog.done[e.id]).length;
  return html`<${Fragment}>
    <${Frame} eyebrow=${`S'entraîner · Famille ${fam.letter}`} title=${fam.title} goal=${fam.goal}>
      <div className="msg"><b className="h">Méthode</b>${fam.method.map((m,k)=>html`<span key=${k}><${R} t=${m}/></span>`)}</div>
    <//>
    <${Worked} w=${fam.worked} key=${fam.id+"w"}/>
    <div className="row" style=${{justifyContent:"space-between"}}><h2>À toi de jouer</h2><span className=${"pill"+(nDone===fam.exs.length?" ok":"")}>${nDone} / ${fam.exs.length} réussis</span></div>
    ${fam.exs.map((e,k)=>html`<${Exercise} key=${e.id} ex=${e} n=${k+1} done=${!!prog.done[e.id]} onDone=${markDone}/>`)}
    <div className="row">
      ${i>0?html`<button className="btn" onClick=${()=>go(FAMILIES[i-1].id)}>← Famille ${FAMILIES[i-1].letter}</button>`:html`<button className="btn" onClick=${()=>go("cartes")}>← Cartes mémoire</button>`}
      ${i<FAMILIES.length-1?html`<button className="btn primary" onClick=${()=>go(FAMILIES[i+1].id)}>Famille ${FAMILIES[i+1].letter} : ${FAMILIES[i+1].title} →</button>`:html`<button className="btn primary" onClick=${()=>go("quiz")}>Quiz final →</button>`}
    </div>
  <//>`;
}

/* ---------- Quiz final ---------- */
const PAGE_NAMES={accueil:"Vue d'ensemble",anticorps:"Les anticorps",humorale:"Réponse humorale",cellulaire:"Réponse cellulaire",synthese:"Synthèse et mémoire"};
function PageQuiz({prog,setBest,go}){
  const mk=()=>shuffle(QUIZ.map((_,i)=>i),(Date.now()%99991)+7).slice(0,10).map(i=>({i,ord:shuffle(QUIZ[i].o.map((_,k)=>k),(Date.now()%7919)+i*31)}));
  const [qs,setQs]=useState(mk);
  const [k,setK]=useState(0);
  const [ans,setAns]=useState([]);
  const cur=qs[k];
  const finished=k>=qs.length;
  const score=ans.filter(a=>a===0).length;
  useEffect(()=>{if(finished) setBest(score)},[finished]);
  const restart=()=>{setQs(mk());setK(0);setAns([])};
  if(finished){
    const missed=qs.filter((q,j)=>ans[j]!==0);
    const secs=[...new Set(missed.map(q=>QUIZ[q.i].sec))];
    return html`<${Frame} eyebrow="Évaluer" title="Résultat du quiz">
      <div className=${"msg "+(score>=8?"pos":score>=5?"neu":"neg")}><b className="h">${score} / ${qs.length}</b>
        <span>${score>=8?"Très bien : les notions sont solides.":score>=5?"C'est en bonne voie. Revois les points ci-dessous.":"Reprends les schémas pas à pas, puis réessaie."}</span></div>
      ${missed.length>0&&html`<div className="corr"><b>Questions manquées</b><ul>${missed.map(q=>html`<li key=${q.i}>${QUIZ[q.i].q} → <b>${QUIZ[q.i].o[0]}</b></li>`)}</ul></div>`}
      ${secs.length>0&&html`<div className="row"><span className="small muted">À revoir :</span>${secs.map(s=>html`<button key=${s} className="btn sm" onClick=${()=>go(s)}>${PAGE_NAMES[s]}</button>`)}</div>`}
      <div className="row"><button className="btn primary" onClick=${restart}>Nouveau quiz</button>${prog.quiz!=null&&html`<span className="pill">meilleur score : ${prog.quiz} / 10</span>`}</div>
    <//>`;
  }
  const Q=QUIZ[cur.i]; const a=ans[k];
  return html`<${Frame} eyebrow="Évaluer" title="Quiz final" goal="10 questions tirées au hasard, avec correction immédiate.">
    <div className="row"><span className="pill acc">Question ${k+1} / ${qs.length}</span><span className="pill">${score} bonne${score>1?"s":""} réponse${score>1?"s":""}</span></div>
    <p className="prompt"><b>${Q.q}</b></p>
    <div className="opts">${cur.ord.map(o=>{const cls="opt"+(a!=null?(o===0?" good":o===a?" bad":""):"");
      return html`<button key=${o} className=${cls} disabled=${a!=null} onClick=${()=>setAns(p=>{const n=p.slice();n[k]=o;return n})}><span className="mk"></span><span>${Q.o[o]}</span></button>`})}</div>
    ${a!=null&&html`<div className=${"msg "+(a===0?"pos":"neg")}><b className="h">${a===0?"Juste !":"Pas tout à fait."}</b><span>${Q.why}</span></div>
      <div className="row"><button className="btn primary" onClick=${()=>setK(k+1)}>${k===qs.length-1?"Voir le résultat":"Question suivante →"}</button></div>`}
  <//>`;
}

/* ---------- Application ---------- */
const NAV=[
  {grp:"Comprendre",items:[["accueil","1","Vue d'ensemble"],["anticorps","2","Les anticorps"],["humorale","3","Réponse humorale"],["cellulaire","4","Réponse cellulaire"],["synthese","5","Synthèse et mémoire"]]},
  {grp:"Mémoriser",items:[["cartes","★","Cartes mémoire"]]},
  {grp:"S'entraîner",items:FAMILIES.map(f=>[f.id,f.letter,f.title])},
  {grp:"Évaluer",items:[["quiz","?","Quiz final"]]},
];
const ALL_IDS=NAV.flatMap(g=>g.items.map(i=>i[0]));
const TOTAL_EX=FAMILIES.reduce((s,f)=>s+f.exs.length,0);
function readHash(){const h=(location.hash||"").slice(1);return ALL_IDS.includes(h)?h:"accueil"}

function App(){
  const [page,setPage]=useState(readHash);
  const [prog,setProg]=useState(()=>{const p=loadP();return {done:p.done||{},seen:p.seen||{},quiz:p.quiz??null}});
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem(KEY+"-theme")||""}catch(e){return ""}});
  const [big,setBig]=useState(()=>{try{return localStorage.getItem(KEY+"-big")==="1"}catch(e){return false}});
  useEffect(()=>{const f=()=>setPage(readHash());window.addEventListener("hashchange",f);return ()=>window.removeEventListener("hashchange",f)},[]);
  useEffect(()=>{saveP(prog)},[prog]);
  useEffect(()=>{setProg(p=>p.seen[page]?p:{...p,seen:{...p.seen,[page]:true}});window.scrollTo(0,0)},[page]);
  useEffect(()=>{if(theme)document.documentElement.setAttribute("data-theme",theme);else document.documentElement.removeAttribute("data-theme");try{localStorage.setItem(KEY+"-theme",theme)}catch(e){}},[theme]);
  useEffect(()=>{document.body.classList.toggle("big",big);try{localStorage.setItem(KEY+"-big",big?"1":"0")}catch(e){}},[big]);
  const go=id=>{if(location.hash.slice(1)!==id){try{location.hash=id}catch(e){}}setPage(id)};
  const markDone=id=>setProg(p=>p.done[id]?p:{...p,done:{...p.done,[id]:true}});
  const setBest=s=>setProg(p=>({...p,quiz:Math.max(p.quiz??0,s)}));
  const nDone=Object.keys(prog.done).filter(k=>FAMILIES.some(f=>f.exs.some(e=>e.id===k))).length;
  const isDark=theme==="dark"||(!theme&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  const fam=FAMILIES.find(f=>f.id===page);
  const navState=id=>{
    const f=FAMILIES.find(x=>x.id===id);
    if(f){const d=f.exs.filter(e=>prog.done[e.id]).length;return {done:d===f.exs.length,cnt:`${d}/${f.exs.length}`}}
    if(id==="quiz") return {done:prog.quiz!=null&&prog.quiz>=8,cnt:prog.quiz!=null?`${prog.quiz}/10`:""};
    return {done:!!prog.seen[id],cnt:""};
  };
  return html`<${Fragment}>
    <header className="top">
      <div className="ttl"><b>Réponse immunitaire adaptative</b><span>UAA5 · L'organisme humain se protège · 5e année sciences générales</span></div>
      <div className="meter" title="Exercices réussis"><span>${nDone}/${TOTAL_EX}</span><span className="bar"><i style=${{width:(100*nDone/TOTAL_EX)+"%"}}></i></span></div>
      <button className="btn sm flat" aria-pressed=${big} onClick=${()=>setBig(!big)} title="Agrandir le texte">A+</button>
      <button className="btn sm flat" onClick=${()=>setTheme(isDark?"light":"dark")} title="Changer de thème">${isDark?"☀":"☾"}</button>
    </header>
    <div className="shell">
      <nav className="side" aria-label="Sommaire">
        ${NAV.map(g=>html`<${Fragment} key=${g.grp}><div className="grp">${g.grp}</div>
          ${g.items.map(([id,n,lab])=>{const s=navState(id);return html`<button key=${id} className="navi" aria-current=${page===id?"page":null} onClick=${()=>go(id)}>
            <span className=${"n"+(s.done?" done":"")}>${s.done?"✓":n}</span><span className="lab">${lab}</span>${s.cnt&&html`<span className="cnt">${s.cnt}</span>`}</button>`})}<//>`)}
      </nav>
      <main><div className="wrap">
        ${page==="accueil"&&html`<${PageAccueil} go=${go}/>`}
        ${page==="anticorps"&&html`<${PageAnticorps} go=${go}/>`}
        ${page==="humorale"&&html`<${PageHumorale} go=${go}/>`}
        ${page==="cellulaire"&&html`<${PageCellulaire} go=${go}/>`}
        ${page==="synthese"&&html`<${PageSynthese} go=${go}/>`}
        ${page==="cartes"&&html`<${PageCartes} go=${go}/>`}
        ${fam&&html`<${PageFamille} key=${fam.id} fam=${fam} prog=${prog} markDone=${markDone} go=${go}/>`}
        ${page==="quiz"&&html`<${PageQuiz} prog=${prog} setBest=${setBest} go=${go}/>`}
        <p className="cap" style=${{textAlign:"center",marginTop:"12px"}}>D'après le cours de M. Haye (UAA5, chapitre 5) · Outil pédagogique de Rémi Samier</p>
      </div></main>
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

</script>
</body>
</html>
