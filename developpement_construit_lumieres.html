<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Lumières — Développement construit (Histoire 4e)</title>
<meta name="description" content="Comprendre, mémoriser et utiliser le cours « L'Europe des Lumières (1715-1789) » pour rédiger un développement construit — 4e.">
<style>:root {
  --win: #eff0f1; --view: #ffffff; --alt: #f7f8f8; --btn: #fcfcfc;
  --text: #232629; --muted: #5f6368; --border: #c5c8cb; --border-soft: #e0e2e4;
  --accent: #3daee9; --accent-strong: #1d6fa3; --accent-bg: #e3f2fb;
  --pos: #1e8449; --pos-bg: #e6f4ea; --neg: #c0392b; --neg-bg: #fbeaea; --warn: #b35a00;
  --r-ctx: #2980b9; --r-def: #16a085; --r-prob: #8e44ad; --r-aff: #d35400; --r-exp: #b7950b; --r-ill: #27ae60; --r-res: #c0392b;
  --c1: #16a085; --c2: #8e44ad; --c3: #d35400;
  --shadow: 0 1px 2px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b;
    --text: #fcfcfc; --muted: #a8afb6; --border: #4a5056; --border-soft: #383d42;
    --accent: #3daee9; --accent-strong: #3daee9; --accent-bg: #1d3445;
    --pos: #4cd07d; --pos-bg: #1d3326; --neg: #f0707a; --neg-bg: #3a2224; --warn: #f2a65a;
    --r-ctx: #5dade2; --r-def: #48c9b0; --r-prob: #bb8fce; --r-aff: #f0954a; --r-exp: #f4d03f; --r-ill: #58d68d; --r-res: #f1948a;
    --c1: #48c9b0; --c2: #bb8fce; --c3: #f0954a;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1b1e20; --alt: #232629; --btn: #31363b;
  --text: #fcfcfc; --muted: #a8afb6; --border: #4a5056; --border-soft: #383d42;
  --accent: #3daee9; --accent-strong: #3daee9; --accent-bg: #1d3445;
  --pos: #4cd07d; --pos-bg: #1d3326; --neg: #f0707a; --neg-bg: #3a2224; --warn: #f2a65a;
  --r-ctx: #5dade2; --r-def: #48c9b0; --r-prob: #bb8fce; --r-aff: #f0954a; --r-exp: #f4d03f; --r-ill: #58d68d; --r-res: #f1948a;
  --c1: #48c9b0; --c2: #bb8fce; --c3: #f0954a;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font: 15px/1.55 "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, Ubuntu, sans-serif; color: var(--text); background: var(--win); }
button, input, select, textarea { font: inherit; color: inherit; }
h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 .4rem; }
h1.inline { margin: 0; }
h2 { font-size: 1.15rem; font-weight: 600; margin: 1.4rem 0 .6rem; }
h3 { font-size: 1.02rem; font-weight: 600; margin: 1.3rem 0 .5rem; }
p { margin: .5rem 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.lead { color: var(--muted); margin-bottom: 1rem; max-width: 70ch; }
i { font-style: italic; }

/* Fenêtre */
.win { display: flex; flex-direction: column; height: 100%; }
.titlebar .btn { white-space: nowrap; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .45rem .9rem; background: var(--win); border-bottom: 1px solid var(--border); }
.tb-title { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { flex: 1; display: flex; min-height: 0; }
.side { width: 232px; flex-shrink: 0; padding: .5rem; overflow-y: auto; background: var(--win); border-right: 1px solid var(--border); }
.side-i { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; padding: .5rem .6rem; margin-bottom: 2px; border: 1px solid transparent; border-radius: 3px; background: none; cursor: pointer; }
.side-i:hover { background: var(--accent-bg); }
.side-i.on { background: var(--accent-bg); border-color: var(--accent); }
.ico { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.side-mob { display: none; }
.main { flex: 1; overflow-y: auto; background: var(--view); }
.page { max-width: 880px; margin: 0 auto; padding: 1.4rem 1.6rem 4rem; }

/* Boutons et contrôles */
.btn { display: inline-flex; align-items: center; gap: .35rem; padding: .38rem .8rem; background: var(--btn); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; line-height: 1.3; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible, .opt:focus-visible, .side-i:focus-visible, .tab:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .gl-link:focus-visible, .pc:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: #10171c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #10171c; } }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-sm { padding: .2rem .55rem; font-size: .85rem; }
.btn-icon { padding: .15rem .45rem; font-size: .75rem; }
.btn-ghost { background: none; border-color: transparent; color: var(--muted); }
select, input[type="text"], input[type="search"] { padding: .36rem .5rem; border: 1px solid var(--border); border-radius: 3px; background: var(--btn); max-width: 100%; }
input.full { width: 100%; margin: .5rem 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: .7rem 0; }
.toolbar input[type="search"] { flex: 1; min-width: 180px; }
.switch { display: inline-flex; align-items: center; gap: .35rem; font-size: .9rem; cursor: pointer; }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: .05rem .45rem; border-radius: 3px; background: var(--accent-bg); color: var(--accent-strong); }

/* Onglets */
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--border); margin: .8rem 0 1rem; }
.tab { padding: .45rem .8rem; background: none; border: 1px solid transparent; border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px; }
.tab:hover { background: var(--alt); }
.tab.on { border-bottom-color: var(--accent); font-weight: 600; }

/* Accueil */
.parcours { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .7rem; margin: 1rem 0; }
.pc { display: flex; gap: .7rem; text-align: left; padding: .8rem; background: var(--btn); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; box-shadow: var(--shadow); }
.pc:hover { border-color: var(--accent); }
.pc-n { flex-shrink: 0; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent-strong); font-weight: 700; }
.pc-b { display: flex; flex-direction: column; gap: .2rem; }
.pc-b span { color: var(--muted); font-size: .9rem; }
.pc-b .pc-p { color: var(--pos); font-size: .82rem; font-weight: 600; }
ul.tight { margin: .3rem 0; padding-left: 1.2rem; }
ul.tight li { margin: .25rem 0; }

/* Boîtes */
.box { border: 1px solid var(--border); border-radius: 4px; margin: 1rem 0; background: var(--view); }
.box-head { display: flex; justify-content: space-between; align-items: center; padding: .5rem .8rem; background: var(--alt); border-bottom: 1px solid var(--border-soft); }
.box-head h3 { margin: 0; font-size: .98rem; }
.box-body { padding: .6rem .9rem; }
.methode { border-left: 3px solid var(--accent); background: var(--accent-bg); padding: .5rem .9rem; border-radius: 0 4px 4px 0; margin: .8rem 0; }
.methode-t { font-weight: 600; font-size: .9rem; color: var(--accent-strong); }
.methode ol { margin: .3rem 0; padding-left: 1.3rem; }
.consigne { background: var(--alt); border: 1px solid var(--border-soft); border-radius: 4px; padding: .55rem .8rem; font-weight: 600; margin: .7rem 0; }

/* Cours */
.ch-q { margin: .2rem 0 .6rem; }
.ch-qq { font-weight: 600; font-size: 1.02rem; }
.dots { display: flex; gap: .4rem; margin: .6rem 0; flex-wrap: wrap; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--border); cursor: pointer; }
.dot.past { background: var(--accent); opacity: .5; }
.dot.on { background: var(--accent); }
.seg { border: 1px solid var(--border); border-radius: 4px; padding: 1rem 1.2rem; min-height: 230px; background: var(--view); box-shadow: var(--shadow); }
.seg-h { display: flex; justify-content: space-between; align-items: center; gap: .8rem; }
.seg-h h2 { margin: 0; }
.seg-t { font-size: 1.05rem; line-height: 1.7; max-width: 68ch; }
.cle { margin-top: .9rem; padding: .5rem .7rem; background: var(--alt); border-radius: 4px; font-weight: 600; }
.retenir li { margin: .4rem 0; }
.nav-seg { justify-content: space-between; border-top: 1px solid var(--border-soft); padding-top: .8rem; margin-top: 1.2rem; }

/* Glossaire en ligne */
.gl-wrap { position: relative; display: inline; }
.gl-link { background: none; border: none; padding: 0; color: var(--accent-strong); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; font: inherit; }
.gl-pop { position: absolute; z-index: 30; left: 0; top: 1.6em; width: min(320px, 85vw); display: flex; flex-direction: column; gap: .3rem; padding: .6rem .75rem; background: var(--view); border: 1px solid var(--accent); border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.18); font-size: .9rem; line-height: 1.45; font-weight: normal; text-align: left; }
.gl-ex { color: var(--text); }

/* Schémas */
.schema { margin: 1rem 0 .4rem; }
.s-vs { display: flex; align-items: stretch; gap: .6rem; flex-wrap: wrap; }
.sv { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: .15rem; padding: .6rem .8rem; border-radius: 4px; border: 1px solid var(--border); }
.sv.bad { background: var(--neg-bg); }
.sv.good { background: var(--pos-bg); }
.sv-arrow { align-self: center; font-size: 1.4rem; color: var(--muted); }
.s-flow { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; }
.sf { padding: .35rem .65rem; border: 1px solid var(--border); border-radius: 4px; background: var(--alt); }
.sf.strong { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
.sf-a { color: var(--muted); }
.s-cibles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .6rem; }
.sc { display: flex; flex-direction: column; gap: .15rem; padding: .6rem .8rem; border: 1px solid var(--border); border-top: 3px solid var(--c2); border-radius: 4px; }
.s-time { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .5rem; }
.st { display: flex; flex-direction: column; padding: .5rem .7rem; border-left: 3px solid var(--c2); background: var(--alt); }
.s-bars { display: flex; flex-direction: column; gap: .45rem; }
.bar-row { display: grid; grid-template-columns: 130px 1fr auto; align-items: center; gap: .6rem; }
.bar { height: 18px; background: var(--c3); opacity: .55; border-radius: 2px; }
.bar.strong { opacity: 1; }
.bar-v { font-weight: 600; font-size: .9rem; }

/* Frise et personnages */
.frise { list-style: none; padding: 0; margin: .5rem 0; border-left: 2px solid var(--border); }
.frise li { display: flex; gap: .9rem; align-items: baseline; padding: .4rem 0 .4rem .9rem; position: relative; }
.frise li::before { content: ""; position: absolute; left: -7px; top: .85rem; width: 12px; height: 12px; border-radius: 50%; background: var(--view); border: 3px solid var(--border); }
.frise li.fr-c1::before { border-color: var(--c1); } .frise li.fr-c2::before { border-color: var(--c2); } .frise li.fr-c3::before { border-color: var(--c3); }
.fr-an { font-weight: 700; min-width: 3rem; }
.lg { padding: 0 .4rem; border-left: 3px solid; margin-right: .5rem; }
.lg.fr-c1 { border-color: var(--c1); } .lg.fr-c2 { border-color: var(--c2); } .lg.fr-c3 { border-color: var(--c3); }
.persos, .glos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .6rem; }
.perso, .gcard { border: 1px solid var(--border); border-left-width: 4px; border-radius: 4px; padding: .6rem .75rem; display: flex; flex-direction: column; gap: .25rem; }
.perso.fr-c1, .gcard.fr-c1 { border-left-color: var(--c1); } .perso.fr-c2, .gcard.fr-c2 { border-left-color: var(--c2); } .perso.fr-c3, .gcard.fr-c3 { border-left-color: var(--c3); }
.pe-type { color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-size: .75rem; }
.pe-f { font-size: .92rem; }
.gc-m { font-weight: 700; }
.gc-e { font-size: .9rem; }
.gcard .btn, .perso .btn { align-self: flex-start; }

/* Étiquettes de rôle */
.tag { display: inline-block; font-size: .76rem; font-weight: 600; padding: .05rem .45rem; border-radius: 3px; border: 1px solid; white-space: nowrap; }
.tag.r-ctx { color: var(--r-ctx); border-color: var(--r-ctx); } .tag.r-def { color: var(--r-def); border-color: var(--r-def); } .tag.r-prob { color: var(--r-prob); border-color: var(--r-prob); }
.tag.r-aff { color: var(--r-aff); border-color: var(--r-aff); } .tag.r-exp { color: var(--r-exp); border-color: var(--r-exp); } .tag.r-ill { color: var(--r-ill); border-color: var(--r-ill); } .tag.r-res { color: var(--r-res); border-color: var(--r-res); }
.rb-ctx { --rc: var(--r-ctx); } .rb-def { --rc: var(--r-def); } .rb-prob { --rc: var(--r-prob); } .rb-aff { --rc: var(--r-aff); } .rb-exp { --rc: var(--r-exp); } .rb-ill { --rc: var(--r-ill); } .rb-res { --rc: var(--r-res); }
.dc-line, .field, .gr-r, .aei-c { border-left: 4px solid var(--rc, var(--border)); background: color-mix(in srgb, var(--rc, transparent) 7%, var(--view)); }

/* Exercices */
.exo { border: 1px solid var(--border); border-radius: 4px; padding: .8rem .9rem; margin: .8rem 0; background: var(--view); }
.exo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; margin-bottom: .4rem; }
.done-mark { color: var(--pos); font-weight: 600; font-size: .85rem; white-space: nowrap; }
.mcq { margin: .6rem 0; }
.mcq.compact { margin: .3rem 0 .8rem; }
.mcq-q { font-weight: 600; margin-bottom: .4rem; }
.mcq-o { display: flex; flex-direction: column; gap: .35rem; }
.opt { display: flex; gap: .6rem; align-items: flex-start; text-align: left; padding: .45rem .65rem; border: 1px solid var(--border); border-radius: 4px; background: var(--btn); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--pos); background: var(--pos-bg); }
.opt.bad { border-color: var(--neg); background: var(--neg-bg); }
.opt-l { font-weight: 700; color: var(--muted); min-width: 1rem; }
.fb { margin-top: .45rem; padding: .45rem .7rem; border-radius: 4px; font-size: .93rem; }
.fb-good { background: var(--pos-bg); border-left: 3px solid var(--pos); }
.fb-bad { background: var(--neg-bg); border-left: 3px solid var(--neg); }
.ok-line { color: var(--pos); font-weight: 600; }
.warn-line { color: var(--warn); font-weight: 600; }
.corr { color: var(--pos); }
.progress { height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; margin: .8rem 0 .3rem; }
.progress span { display: block; height: 100%; background: var(--accent); }

.match-row { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: .3rem .6rem; align-items: center; padding: .35rem .4rem; border-radius: 4px; }
.match-row .corr { grid-column: 2; }
.match-row.good { background: var(--pos-bg); } .match-row.bad { background: var(--neg-bg); }
.match-l { font-weight: 600; }
.match select { width: 100%; }

.order { list-style: none; padding: 0; margin: .4rem 0; display: flex; flex-direction: column; gap: .35rem; }
.order li { display: flex; align-items: center; gap: .6rem; padding: .45rem .55rem; border: 1px solid var(--border); border-radius: 4px; background: var(--btn); }
.order li.good { border-color: var(--pos); background: var(--pos-bg); } .order li.bad { border-color: var(--neg); background: var(--neg-bg); }
.ord-n { font-weight: 700; color: var(--muted); min-width: 1.4rem; }
.ord-t { flex: 1; }
.ord-b { display: flex; flex-direction: column; gap: 2px; }
.date-rev { margin-left: .5rem; font-weight: 700; color: var(--pos); }

.classify { display: flex; flex-direction: column; gap: .4rem; }
.cl-row { display: grid; grid-template-columns: 1fr 220px; gap: .3rem .6rem; align-items: center; padding: .4rem; border: 1px solid var(--border-soft); border-radius: 4px; }
.cl-row .corr { grid-column: 1 / -1; }
.cl-row.good { border-color: var(--pos); background: var(--pos-bg); } .cl-row.bad { border-color: var(--neg); background: var(--neg-bg); }
.cl-t { padding-left: .5rem; border-left: 4px solid var(--rc, transparent); }
.cl-row select { width: 100%; }

.cloze { line-height: 2.3; }
.cz { margin: 0 .2rem; padding: .1rem .3rem; }
.cz.good { border-color: var(--pos); background: var(--pos-bg); } .cz.bad { border-color: var(--neg); background: var(--neg-bg); }

.area { width: 100%; padding: .5rem .6rem; border: 1px solid var(--border); border-radius: 3px; background: var(--view); line-height: 1.5; resize: vertical; min-height: 3.2rem; }
.keys { margin-top: .5rem; padding: .5rem .7rem; background: var(--alt); border-radius: 4px; }
.keys ul, .checklist { list-style: none; padding: 0; margin: .3rem 0; }
.keys li, .checklist li { margin: .15rem 0; }
.k-ok { color: var(--pos); } .k-no { color: var(--muted); }
.model { margin-top: .5rem; padding: .5rem .7rem; border: 1px dashed var(--pos); border-radius: 4px; background: var(--pos-bg); }
.field { padding: .5rem .6rem; margin: .45rem 0; border-radius: 0 4px 4px 0; }
.field .tag { margin-bottom: .3rem; }
.field-h { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .3rem; }
.given { margin: .3rem 0 0; }
.idea-bank { margin: .4rem 0 .6rem; display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
.idea-bank.big { display: block; padding: .6rem .7rem; background: var(--alt); border-radius: 4px; border: 1px solid var(--border-soft); }
@media (min-height: 860px) and (min-width: 761px) { .idea-bank.big { position: sticky; top: 0; z-index: 5; } }
.idea-bank.big > div:last-child { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.chip { display: inline-block; padding: .15rem .55rem; border: 1px solid var(--border); border-radius: 12px; background: var(--btn); font-size: .88rem; }
.chip-btn { cursor: pointer; text-align: left; }
.chip-btn.gone { opacity: .75; text-decoration: line-through; }
.chip-btn.gone.ok { border-color: var(--pos); text-decoration: line-through; }
.chip-btn.gone.no { border-color: var(--neg); text-decoration: none; opacity: 1; }
.chip-btn.gone span { text-decoration: none; display: inline; }

/* Exemples résolus */
.worked { border: 1px solid var(--accent); border-radius: 4px; padding: .8rem .9rem; margin: .8rem 0; background: color-mix(in srgb, var(--accent) 4%, var(--view)); }
.worked-head { margin-bottom: .5rem; }
.worked-steps { padding-left: 1.3rem; margin: .4rem 0 .7rem; }
.worked-steps li { margin: .35rem 0; }
.ws-t { font-weight: 600; margin-right: .4rem; }
.ws-t::after { content: " :"; }
.worked-rep { padding: .5rem .7rem; background: var(--pos-bg); border-radius: 4px; }
.aei { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .5rem; margin: .8rem 0; }
.aei-c { padding: .55rem .7rem; border-radius: 0 4px 4px 0; display: flex; flex-direction: column; gap: .25rem; }
.aei-c .tag { align-self: flex-start; }

/* Développement construit */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; margin: 1rem 0; }
.step { display: flex; align-items: center; gap: .4rem; padding: .4rem .5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--btn); cursor: pointer; text-align: left; font-size: .85rem; }
.step:hover { border-color: var(--accent); }
.step.on { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
.st-n { flex-shrink: 0; width: 1.45rem; height: 1.45rem; border-radius: 50%; display: grid; place-items: center; background: var(--alt); border: 1px solid var(--border); font-size: .78rem; font-weight: 700; }
.step.ok .st-n { background: var(--pos-bg); border-color: var(--pos); color: var(--pos); }
.et-title { border-bottom: 1px solid var(--border-soft); padding-bottom: .3rem; }
.grille { display: flex; flex-direction: column; gap: .6rem; margin: .8rem 0; }
.gr-b { display: grid; grid-template-columns: 120px 1fr; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.gr-bt { display: grid; place-items: center; text-align: center; font-weight: 700; background: var(--alt); border-right: 1px solid var(--border); padding: .5rem; }
.gr-rows { display: flex; flex-direction: column; }
.gr-r { display: grid; grid-template-columns: 130px 1fr; gap: .6rem; padding: .5rem .6rem; border-bottom: 1px solid var(--border-soft); }
.gr-r:last-child { border-bottom: none; }
.gr-r .tag { align-self: start; justify-self: start; }
.conn { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .4rem .9rem; }
.conn div { display: flex; flex-direction: column; }
.conn span { color: var(--muted); font-size: .9rem; }
.an-t { border-collapse: collapse; width: 100%; margin: .4rem 0; font-size: .93rem; }
.an-t th, .an-t td { border: 1px solid var(--border-soft); padding: .35rem .55rem; text-align: left; vertical-align: top; }
.an-t th { width: 150px; background: var(--alt); font-weight: 600; }
.dc-view { display: flex; flex-direction: column; gap: .7rem; margin: .7rem 0; }
.dc-block { border: 1px solid var(--border-soft); border-radius: 4px; padding: .4rem .5rem; }
.dc-bt { font-weight: 700; font-size: .85rem; color: var(--muted); margin: .1rem 0 .3rem .2rem; text-transform: uppercase; letter-spacing: .03em; }
.dc-line { display: flex; gap: .6rem; align-items: baseline; padding: .4rem .6rem; margin: .25rem 0; border-radius: 0 4px 4px 0; }
.dc-line .tag { flex-shrink: 0; min-width: 7.2rem; text-align: center; }
.dc-flow, .apercu, .given-dc { border: 1px solid var(--border); border-radius: 4px; padding: .7rem 1rem; background: var(--view); line-height: 1.7; font-family: Georgia, "Noto Serif", serif; font-size: 1rem; }
.dc-flow p, .apercu p, .given-dc p { text-indent: 1.5em; margin: 0 0 1em; }
.given-dc { background: var(--alt); margin-bottom: .6rem; }
.given-dc .small { font-family: "Noto Sans", system-ui, sans-serif; margin-bottom: .4rem; }
.grid-ed { margin: .6rem 0; }
.grid-block { border: 1px solid var(--border); border-radius: 4px; padding: .3rem .7rem .6rem; margin: .7rem 0; position: relative; }
.grid-block legend { font-weight: 700; padding: 0 .4rem; }
.grid-block .rm { position: absolute; right: .6rem; top: -.2rem; }
.plan-l { margin: .1rem 0 .4rem; padding-left: 1.2rem; font-size: .9rem; color: var(--muted); }
.add-arg { width: 100%; justify-content: center; border-style: dashed; }
.ed-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; padding: .6rem .7rem; margin-top: .7rem; background: var(--alt); border: 1px solid var(--border-soft); border-radius: 4px; position: sticky; bottom: 0; z-index: 4; }
.checklist { padding: .5rem .8rem; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--alt); }

/* Fenêtre modale */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; z-index: 100; padding: 1rem; }
.modal { width: min(720px, 100%); max-height: 90vh; display: flex; flex-direction: column; background: var(--view); border: 1px solid var(--border); border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: .6rem .9rem; background: var(--win); border-bottom: 1px solid var(--border); border-radius: 5px 5px 0 0; }
.modal-body { padding: .8rem .9rem; overflow-y: auto; }
.prompt-box { width: 100%; height: 300px; font-family: "Noto Sans Mono", ui-monospace, monospace; font-size: .8rem; padding: .5rem; border: 1px solid var(--border); border-radius: 3px; background: var(--alt); resize: vertical; }

/* Mobile */
@media (max-width: 760px) {
  .body { flex-direction: column; }
  .side { display: none; }
  .side-mob { display: block; margin: .5rem .7rem; padding: .5rem; }
  .page { padding: 1rem .9rem 4rem; }
  .steps { grid-template-columns: repeat(2, 1fr); }
  .gr-b { grid-template-columns: 1fr; }
  .gr-bt { border-right: none; border-bottom: 1px solid var(--border); }
  .gr-r { grid-template-columns: 1fr; }
  .cl-row { grid-template-columns: 1fr; }
  .match-row { grid-template-columns: 1fr; }
  .match-row .corr { grid-column: 1; }
  .dc-line { flex-direction: column; gap: .25rem; }
  .bar-row { grid-template-columns: 90px 1fr auto; }
  .an-t th { width: 105px; }
  .tb-title .muted { display: none; }
  .ed-bar { position: static; }
  .idea-bank.big { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
@media print { .side, .titlebar, .ed-bar, .side-mob { display: none !important; } .main { overflow: visible; } }

.confirm { display: inline-flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
</style>

rototype.hasOwnProperty,Lm=Sm.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,bm={key:!0,ref:!0,__self:!0,__source:!0};function _d(e,t,n){var r,s={},i=null,l=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(l=t.ref);for(r in t)wm.call(t,r)&&!bm.hasOwnProperty(r)&&(s[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)s[r]===void 0&&(s[r]=t[r]);return{$$typeof:Em,type:e,key:i,ref:l,props:s,_owner:Lm.current}}oi.Fragment=Nm;oi.jsx=_d;oi.jsxs=_d});var tn=it((Ev,Td)=>{"use strict";Td.exports=Pd()});var _=Ke(sn()),Gd=Ke(qd());var br=[{id:"c1",num:1,titre:"Une pensée scientifique renouvelée",question:"Comment les savants des Lumières renouvellent-ils la pensée scientifique ?",source:"Leçon 1 et activité 1",segments:[{titre:"Le Siècle des Lumières (1715-1789)",texte:"Au XVIIIe siècle, la pensée scientifique se renouvelle profondément en Europe. On appelle cette période le [Siècle des Lumières|lumieres] (1715-1789). Les « lumières », ce sont celles de la [raison|raison] : elles doivent chasser l'obscurité de l'ignorance et des [préjugés|prejuge].",cle:"Siècle des Lumières = 1715-1789 = renouveau de la pensée en Europe."},{titre:"La raison avant tout",texte:"Pour les [savants|savant] des Lumières, tous les hommes sont doués de [raison|raison] : chacun est capable de comprendre le monde avec sa propre intelligence et sa propre expérience, et non avec ses [préjugés|prejuge] ou ses croyances. La raison doit guider toute réflexion.",cle:"La raison passe avant les préjugés et les croyances.",schema:"raison"},{titre:"Une connaissance scientifique",texte:"Les savants cherchent une connaissance exacte (juste), universelle (valable partout et pour tous) et vérifiable (que chacun peut contrôler). C'est une [connaissance scientifique|scientifique]. Seul l'usage de la raison permet de l'atteindre : il faut observer, mesurer, expérimenter et classer.",cle:"Scientifique = exacte + universelle + vérifiable.",schema:"demarche"},{titre:"Explorer : James Cook et la Terra australis",texte:"Depuis l'Antiquité, les cartes montrent au sud de la planète un immense continent que personne n'a jamais vu : la [Terra australis incognita|terra]. La [Royal Society|societe], société savante britannique, organise l'[expédition scientifique|expedition] du navigateur James Cook dans le Pacifique. Il débarque à Tahiti en 1769, à bord de l'Endeavour, cartographie l'archipel avec précision, et son expédition démontre que ce continent n'existe pas.",cle:"Un savant des Lumières vérifie au lieu de croire."},{titre:"Ne conclure que sur ce que l'on a vu",texte:"Dans son journal de bord (1769), Cook prévient que beaucoup de ses remarques sur la société tahitienne ne sont que des [conjectures|conjecture], car il n'est resté que trois mois sur l'île. Il explique qu'il ne peut tirer de conclusions que de ce qu'il a vu lui-même.",cle:"Observation personnelle et prudence = esprit scientifique."},{titre:"Observer et classer le vivant",texte:"Les [naturalistes|naturaliste] Buffon et Carl von Linné commencent la [classification|classification] de tous les êtres vivants. Pendant le voyage de Cook, les naturalistes Daniel Solander et Joseph Banks répertorient de nouvelles espèces, comme l'arbre à pain et la perruche de Tahiti. L'illustrateur Sydney Parkinson les dessine avec précision.",cle:"Observer, décrire, dessiner, classer."},{titre:"Mesurer le ciel",texte:"Pendant l'expédition, l'[astronome|astronome] Charles Green observe le [transit de Vénus|transit] (le passage de Vénus devant le Soleil) avec un télescope grégorien. Ses observations permettent de mesurer avec exactitude la distance qui sépare la Terre et Vénus du Soleil.",cle:"Des instruments précis pour des mesures exactes."}],retenir:["Le Siècle des Lumières (1715-1789) est marqué par un renouveau de la pensée scientifique en Europe.","Les savants donnent la priorité à la raison sur les préjugés et les croyances.","Ils cherchent une connaissance exacte, universelle et vérifiable : scientifique.","Exemple clé : l'expédition de James Cook (Royal Society, Tahiti, 1769) prouve que la Terra australis incognita n'existe pas ; Banks et Solander classent de nouvelles espèces ; Charles Green observe le transit de Vénus."]},{id:"c2",num:2,titre:"Des institutions dénoncées par les philosophes",question:"Comment les philosophes des Lumières critiquent-ils l'ordre politique, religieux et social ?",source:"Leçon 2 et activité 2",segments:[{titre:"Qui sont les philosophes des Lumières ?",texte:"Les [philosophes des Lumières|philosophe] sont des penseurs européens du XVIIIe siècle attachés à la liberté et à l'égalité, et sensibles aux droits de chaque individu. Ils utilisent la raison pour critiquer les [institutions|institution] de leur temps et combattre l'ignorance, l'intolérance et l'[arbitraire|arbitraire].",cle:"Liberté + égalité + raison = armes des philosophes.",schema:"cibles"},{titre:"Contre l'absolutisme : Montesquieu",texte:"Dans _De l'esprit des lois_ (1748), Montesquieu (1689-1755) condamne le [despotisme|despotisme]. Il distingue trois pouvoirs : faire les lois (législatif), les faire exécuter (exécutif) et juger. « Tout serait perdu » si un seul homme les exerçait tous. Il défend donc la [séparation des pouvoirs|separation], contre l'[absolutisme|absolutisme].",cle:"Montesquieu : séparer les trois pouvoirs pour éviter le despotisme."},{titre:"Contre le droit divin : Diderot",texte:"Denis Diderot (1713-1784) veut rendre le savoir accessible à tous. Dans l'article « Autorité politique » de l'[Encyclopédie|encyclopedie] (1751-1772), il écrit : « Aucun homme n'a reçu de la nature le droit de commander aux autres. » Il rejette ainsi la [monarchie de droit divin|droitdivin].",cle:"Diderot : le pouvoir d'un roi ne vient pas de Dieu ni de la nature."},{titre:"Contre le fanatisme : Voltaire et l'affaire Calas",texte:"En 1761, à Toulouse, le négociant [protestant|protestant] Jean Calas est accusé, sans preuve, d'avoir tué son fils. En 1762, il est condamné et exécuté. Voltaire (1694-1778) mène l'enquête et publie le _Traité sur la tolérance_ (1763) pour dénoncer ce [fanatisme religieux|fanatisme]. En 1765, Calas est reconnu innocent.",cle:"Voltaire : défendre la tolérance contre le fanatisme.",schema:"calas"},{titre:"Une Église critiquée",texte:"Les philosophes critiquent l'Église et la religion, sans forcément nier l'existence de Dieu. Diderot et d'Alembert, auteurs de l'Encyclopédie, relativisent les miracles attribués à Jésus-Christ. En 1759, le pape Clément XIII [met l'ouvrage à l'index|index].",cle:"La religion n'échappe pas à l'examen de la raison."},{titre:"Contre la société d'ordres : Rousseau",texte:"La [société d'ordres|ordres] divise les hommes en trois catégories inégales : la noblesse, le clergé et le [tiers état|tiers]. Dans _Émile ou de l'éducation_ (1762), Jean-Jacques Rousseau (1712-1778) écrit : « La nature n'a fait ni princes, ni riches, ni grands seigneurs » et « tout citoyen oisif est un fripon ». Il vise ainsi les nobles et le clergé, qui vivent dans l'[oisiveté|oisivete], et défend l'égalité de tous devant la loi.",cle:"Rousseau : les hommes naissent égaux, chacun doit travailler."},{titre:"Des soutiens puissants",texte:"Les philosophes veulent faire connaître leurs idées et influencer le monde. Certains souverains, appelés [despotes éclairés|despote], les soutiennent : Voltaire séjourne à la cour de Frédéric II de Prusse. En France, Diderot est protégé par Mme de Pompadour, proche du roi Louis XV.",cle:"Des souverains et des proches du roi soutiennent les philosophes."}],retenir:["Les philosophes des Lumières, attachés à la liberté et à l'égalité, utilisent la raison pour critiquer les institutions.","Politique : Montesquieu (_De l'esprit des lois_, 1748) défend la séparation des pouvoirs ; Diderot rejette la monarchie de droit divin.","Religion : Voltaire dénonce le fanatisme dans le _Traité sur la tolérance_ (1763) après l'affaire Calas ; l'Encyclopédie est mise à l'index (1759).","Société : Rousseau (_Émile_, 1762) critique la société d'ordres inégalitaire.","Des despotes éclairés comme Frédéric II de Prusse soutiennent les philosophes."]},{id:"c3",num:3,titre:"La diffusion des idées des Lumières",question:"Comment et jusqu'où les idées des Lumières se diffusent-elles ?",source:"Synthèse rédigée à partir de l'activité 3",segments:[{titre:"Le siècle du livre",texte:"Le XVIIIe siècle est le siècle du livre. Grâce à l'essor des [imprimeries|imprimerie], la France passe d'environ 1 000 livres publiés par an au début du siècle à plus de 4 000 en 1789 : quatre fois plus !",cle:"Plus de livres = plus de lecteurs pour les idées nouvelles.",schema:"livres"},{titre:"Les cabinets de lecture",texte:"Les livres coûtent cher. Dans les [cabinets de lecture|cabinet], on peut lire des livres et des journaux en payant simplement un abonnement. Ces lieux se multiplient au XVIIIe siècle : ils permettent à davantage de personnes de lire les œuvres des philosophes.",cle:"Lire sans acheter : les idées touchent plus de monde."},{titre:"Les salons",texte:"Un [salon|salon] est une réunion régulière, chez un particulier, de personnes cultivées qui lisent, présentent et discutent les idées nouvelles. Il est souvent tenu par une femme, la salonnière. Le salon de Mme Geoffrin (1699-1777) est le plus réputé de France : on y lit par exemple les œuvres de Voltaire.",cle:"Les salons : lire ensemble et débattre."},{titre:"Jusqu'où ? Toute la société cultivée",texte:"Les idées des Lumières séduisent des personnes très différentes. Dans le salon de Mme Geoffrin, on trouve des philosophes (Diderot, d'Alembert, Rousseau, Montesquieu), un savant (Buffon), une comédienne (Mme Clairon), un ministre de Louis XV (le duc de Choiseul) et même le prince de Conti, cousin du roi.",cle:"Les Lumières touchent jusqu'à l'entourage du roi.",schema:"public"},{titre:"Même le responsable de la censure !",texte:"Malesherbes (1721-1794) dirige la librairie royale : il est chargé de la [censure|censure]. Pourtant, il protège l'Encyclopédie et défend la [liberté de la presse|presse]. En 1788, il écrit que la liberté de la discussion est le moyen sûr de faire connaître la vérité à une nation.",cle:"Les idées des Lumières convainquent même ceux qui doivent les contrôler."},{titre:"Jusqu'aux souverains d'Europe",texte:"Les idées des Lumières dépassent les frontières de la France. Des [despotes éclairés|despote] s'y intéressent et accueillent les philosophes : Voltaire siège à la cour de Frédéric II de Prusse. Les idées circulent ainsi dans toute l'Europe cultivée.",cle:"Les Lumières : un mouvement européen."},{titre:"Des limites à la diffusion",texte:"La diffusion a des limites. La censure royale peut interdire un ouvrage et l'Église condamne certains livres : l'Encyclopédie est mise à l'index par le pape en 1759. Les philosophes ont donc besoin de protecteurs puissants pour publier et se faire entendre.",cle:"Une diffusion large, mais surveillée."}],retenir:["Les idées des Lumières se diffusent grâce au livre (plus de 4 000 livres publiés en France en 1789), aux cabinets de lecture et aux salons comme celui de Mme Geoffrin.","Elles séduisent toute la société cultivée : philosophes, savants, artistes, nobles, ministres, jusqu'au cousin du roi et même Malesherbes, chargé de la censure.","Elles atteignent des souverains européens comme Frédéric II de Prusse.","Mais la censure et les condamnations de l'Église limitent cette diffusion."]}],Sd=[{nom:"James Cook",dates:"1728-1779",type:"Savant",ch:"c1",role:"Navigateur anglais envoyé par la Royal Society dans le Pacifique.",fait:"À Tahiti en 1769 ; son expédition prouve que la Terra australis incognita n'existe pas."},{nom:"Joseph Banks et Daniel Solander",dates:"",type:"Savants",ch:"c1",role:"Naturalistes de l'expédition de Cook.",fait:"Classent de nouvelles espèces : l'arbre à pain, la perruche de Tahiti."},{nom:"Sydney Parkinson",dates:"",type:"Illustrateur",ch:"c1",role:"Illustrateur de l'expédition de Cook.",fait:"Dessine avec précision les plantes et les animaux observés."},{nom:"Charles Green",dates:"",type:"Savant",ch:"c1",role:"Astronome de l'expédition de Cook.",fait:"Observe le transit de Vénus avec un télescope grégorien et mesure la distance Terre/Vénus-Soleil."},{nom:"Buffon et Carl von Linné",dates:"",type:"Savants",ch:"c1",role:"Naturalistes.",fait:"Commencent la classification de tous les êtres vivants."},{nom:"Montesquieu",dates:"1689-1755",type:"Philosophe",ch:"c2",role:"Combat l'absolutisme et le despotisme.",fait:"_De l'esprit des lois_ (1748) : séparation des pouvoirs."},{nom:"Denis Diderot",dates:"1713-1784",type:"Philosophe",ch:"c2",role:"Dirige l'Encyclopédie avec d'Alembert (1751-1772).",fait:"Article « Autorité politique » : rejette la monarchie de droit divin."},{nom:"Voltaire",dates:"1694-1778",type:"Philosophe",ch:"c2",role:"Combat le fanatisme religieux, défend la tolérance.",fait:"_Traité sur la tolérance_ (1763) : défend Jean Calas. Séjourne chez Frédéric II."},{nom:"Jean-Jacques Rousseau",dates:"1712-1778",type:"Philosophe",ch:"c2",role:"Critique la société d'ordres inégalitaire.",fait:"_Émile ou de l'éducation_ (1762) : « tout citoyen oisif est un fripon »."},{nom:"Jean Calas",dates:"",type:"Victime",ch:"c2",role:"Négociant protestant de Toulouse.",fait:"Condamné sans preuve et exécuté en 1762, reconnu innocent en 1765."},{nom:"Clément XIII",dates:"",type:"Pape",ch:"c2",role:"Chef de l'Église catholique.",fait:"Met l'Encyclopédie à l'index en 1759."},{nom:"Frédéric II de Prusse",dates:"",type:"Souverain",ch:"c2",role:"Despote éclairé.",fait:"Accueille Voltaire à sa cour."},{nom:"Mme de Pompadour",dates:"",type:"Protectrice",ch:"c2",role:"Proche du roi Louis XV.",fait:"Protège Diderot."},{nom:"Mme Geoffrin",dates:"1699-1777",type:"Salonnière",ch:"c3",role:"Tient le salon le plus réputé de France.",fait:"On y lit les œuvres de Voltaire devant philosophes, savants et nobles."},{nom:"Malesherbes",dates:"1721-1794",type:"Haut fonctionnaire",ch:"c3",role:"Directeur de la librairie royale, chargé de la censure.",fait:"Protège l'Encyclopédie ; défend la liberté de la presse (1788)."},{nom:"Le prince de Conti",dates:"",type:"Noble",ch:"c3",role:"Cousin du roi.",fait:"Fréquente le salon de Mme Geoffrin."}],Ed=[{an:"1715",txt:"Début du Siècle des Lumières",ch:"c1"},{an:"1748",txt:"Montesquieu, _De l'esprit des lois_",ch:"c2"},{an:"1751",txt:"Premier volume de l'Encyclopédie (jusqu'en 1772)",ch:"c2"},{an:"1759",txt:"L'Encyclopédie mise à l'index par le pape",ch:"c2"},{an:"1762",txt:"Exécution de Jean Calas ; Rousseau, _Émile_",ch:"c2"},{an:"1763",txt:"Voltaire, _Traité sur la tolérance_",ch:"c2"},{an:"1765",txt:"Jean Calas reconnu innocent",ch:"c2"},{an:"1769",txt:"Cook à Tahiti ; Green observe le transit de Vénus",ch:"c1"},{an:"1772",txt:"Dernier volume de l'Encyclopédie",ch:"c3"},{an:"1788",txt:"Malesherbes défend la liberté de la presse",ch:"c3"},{an:"1789",txt:"Fin du Siècle des Lumières (plus de 4 000 livres publiés)",ch:"c3"}],Ir=[{id:"lumieres",mot:"Siècle des Lumières",ch:"c1",def:"Période (1715-1789) pendant laquelle, en Europe, savants et philosophes veulent éclairer les hommes grâce à la raison.",ex:"Voltaire, Montesquieu et James Cook vivent au Siècle des Lumières."},{id:"raison",mot:"Raison",ch:"c1",def:"Capacité à comprendre le monde avec sa propre intelligence et sa propre expérience, sans préjugés ni croyances.",ex:"Cook part vérifier par lui-même si le continent austral existe : il utilise sa raison."},{id:"prejuge",mot:"Préjugé",ch:"c1",def:"Idée toute faite que l'on croit vraie sans l'avoir vérifiée.",ex:"Croire à un immense continent au sud sans l'avoir jamais vu."},{id:"scientifique",mot:"Connaissance scientifique",ch:"c1",def:"Connaissance exacte (juste), universelle (valable pour tous) et vérifiable (que chacun peut contrôler).",ex:"La distance entre la Terre et le Soleil calculée grâce au transit de Vénus."},{id:"savant",mot:"Savant",ch:"c1",def:"Personne qui étudie les sciences et cherche des connaissances exactes.",ex:"L'astronome Charles Green est un savant des Lumières."},{id:"societe",mot:"Société savante",ch:"c1",def:"Association qui regroupe des savants pour partager et financer des recherches.",ex:"La Royal Society, en Grande-Bretagne, organise l'expédition de Cook."},{id:"expedition",mot:"Expédition scientifique",ch:"c1",def:"Voyage organisé pour observer, mesurer et découvrir.",ex:"Le voyage de James Cook jusqu'à Tahiti en 1769."},{id:"terra",mot:"Terra australis incognita",ch:"c1",def:"« Terre australe inconnue » : continent imaginaire que les cartes plaçaient au sud de la planète depuis l'Antiquité.",ex:"L'expédition de Cook démontre qu'elle n'existe pas."},{id:"conjecture",mot:"Conjecture",ch:"c1",def:"Supposition, idée qui n'est pas encore vérifiée.",ex:"Cook prévient que certaines de ses remarques sur Tahiti ne sont que des conjectures."},{id:"naturaliste",mot:"Naturaliste",ch:"c1",def:"Savant qui étudie les plantes, les animaux et les minéraux.",ex:"Joseph Banks et Daniel Solander."},{id:"classification",mot:"Classification",ch:"c1",def:"Rangement des êtres vivants en groupes, selon ce qu'ils ont en commun.",ex:"Buffon et Linné commencent la classification des êtres vivants."},{id:"astronome",mot:"Astronome",ch:"c1",def:"Savant qui étudie les astres : planètes, étoiles, Soleil.",ex:"Charles Green."},{id:"transit",mot:"Transit de Vénus",ch:"c1",def:"Passage de Vénus entre la Terre et le Soleil : on voit un petit disque noir traverser le Soleil.",ex:"Observé par Charles Green pendant l'expédition de Cook."},{id:"philosophe",mot:"Philosophe des Lumières",ch:"c2",def:"Penseur du XVIIIe siècle, attaché à la liberté et à l'égalité, qui utilise la raison pour critiquer les institutions et combattre l'ignorance, l'intolérance et l'arbitraire.",ex:"Voltaire, Montesquieu, Diderot, Rousseau."},{id:"institution",mot:"Institution",ch:"c2",def:"Organisation qui encadre la vie d'une société : le pouvoir du roi, l'Église, la justice, la société d'ordres.",ex:"Les philosophes dénoncent les institutions du XVIIIe siècle."},{id:"arbitraire",mot:"Arbitraire",ch:"c2",def:"Décision prise selon le bon vouloir d'une personne, sans règle juste.",ex:"Jean Calas est condamné sans aucune preuve."},{id:"absolutisme",mot:"Absolutisme (monarchie absolue)",ch:"c2",def:"Régime politique dans lequel le roi exerce tous les pouvoirs.",ex:"En France, Louis XV est un roi absolu."},{id:"droitdivin",mot:"Monarchie de droit divin",ch:"c2",def:"Monarchie dans laquelle le roi tient ses pouvoirs de Dieu.",ex:"Diderot la rejette : « aucun homme n'a reçu de la nature le droit de commander aux autres »."},{id:"despotisme",mot:"Despotisme",ch:"c2",def:"Pouvoir d'un seul homme, sans limite ni contrôle, souvent injuste.",ex:"Montesquieu prend l'exemple du sultan turc, qui réunit les trois pouvoirs."},{id:"separation",mot:"Séparation des pouvoirs",ch:"c2",def:"Principe selon lequel les trois pouvoirs (faire la loi, la faire exécuter, juger) sont confiés à des personnes différentes.",ex:"Montesquieu la défend dans _De l'esprit des lois_ (1748)."},{id:"ordres",mot:"Société d'ordres",ch:"c2",def:"Société divisée en trois groupes inégaux : le clergé, la noblesse et le tiers état.",ex:"Rousseau critique cette société inégalitaire."},{id:"tiers",mot:"Tiers état",ch:"c2",def:"Troisième ordre : tous ceux qui ne sont ni nobles ni membres du clergé (paysans, artisans, marchands, bourgeois). C'est le plus nombreux.",ex:"Le négociant Jean Calas appartient au tiers état."},{id:"oisivete",mot:"Oisiveté",ch:"c2",def:"Fait de vivre sans travailler.",ex:"Pour Rousseau, « tout citoyen oisif est un fripon »."},{id:"fripon",mot:"Fripon",ch:"c2",def:"Voleur qui agit par ruse.",ex:"Rousseau traite implicitement les nobles et les ecclésiastiques de fripons."},{id:"fanatisme",mot:"Fanatisme religieux",ch:"c2",def:"Attachement excessif et irrationnel à une religion, qui pousse à l'intolérance et à la violence contre ceux qui ne partagent pas la même croyance.",ex:"La rumeur et la condamnation du protestant Jean Calas."},{id:"tolerance",mot:"Tolérance",ch:"c2",def:"Respect des croyances et des opinions des autres, même quand on ne les partage pas.",ex:"Voltaire publie le _Traité sur la tolérance_ en 1763."},{id:"protestant",mot:"Protestant",ch:"c2",def:"Chrétien qui ne reconnaît pas l'autorité du pape (différent du catholique).",ex:"Jean Calas est protestant."},{id:"index",mot:"Mise à l'index",ch:"c2",def:"Interdiction faite par le pape aux catholiques de lire un livre.",ex:"L'Encyclopédie est mise à l'index par Clément XIII en 1759."},{id:"encyclopedie",mot:"Encyclopédie",ch:"c2",def:"Ouvrage qui rassemble les connaissances de son époque. Celle de Diderot et d'Alembert paraît de 1751 à 1772.",ex:"Diderot y écrit l'article « Autorité politique »."},{id:"despote",mot:"Despote éclairé",ch:"c2",def:"Souverain qui garde un pouvoir absolu mais s'intéresse aux idées des Lumières et protège les philosophes.",ex:"Frédéric II de Prusse accueille Voltaire à sa cour."},{id:"imprimerie",mot:"Imprimerie",ch:"c3",def:"Technique (et atelier) qui permet de fabriquer des livres en grand nombre.",ex:"En 1789, plus de 4 000 livres sortent des imprimeries françaises."},{id:"censure",mot:"Censure",ch:"c3",def:"Interdiction totale ou partielle d'un livre, d'un journal ou d'une œuvre par un pouvoir.",ex:"Malesherbes, directeur de la librairie royale, est chargé de la censure."},{id:"presse",mot:"Liberté de la presse",ch:"c3",def:"Droit de publier librement ses idées dans des livres et des journaux.",ex:"Malesherbes la défend en 1788."},{id:"cabinet",mot:"Cabinet de lecture",ch:"c3",def:"Lieu où l'on peut lire des livres et des journaux en payant un abonnement.",ex:"Les cabinets de lecture se multiplient au XVIIIe siècle."},{id:"salon",mot:"Salon",ch:"c3",def:"Réunion régulière, chez un particulier (souvent une femme, la salonnière), de personnes cultivées qui lisent et discutent les idées nouvelles.",ex:"Le salon de Mme Geoffrin, le plus réputé de France."},{id:"diffusion",mot:"Diffusion",ch:"c3",def:"Fait de répandre des idées auprès d'un grand nombre de personnes.",ex:"Livres, cabinets de lecture et salons assurent la diffusion des Lumières."}],si=[{id:"qv",titre:"Vocabulaire",desc:"Les mots complexes du glossaire",questions:[{q:"La raison, c'est…",o:["croire ce que disent les Anciens","comprendre le monde avec sa propre intelligence et son expérience","obéir au roi sans discuter","suivre les traditions religieuses"],r:1,x:"La raison permet de comprendre le monde par soi-même, sans préjugés ni croyances."},{q:"Une connaissance « vérifiable » est une connaissance…",o:["que chacun peut contrôler","écrite dans un livre ancien","vraie seulement en Europe","imposée par le roi"],r:0,x:"Vérifiable = on peut refaire l'observation ou la mesure et obtenir le même résultat."},{q:"Un naturaliste étudie…",o:["les astres","les lois et les gouvernements","les plantes, les animaux et les minéraux","les langues anciennes"],r:2,x:"Banks et Solander, naturalistes, classent des plantes et des oiseaux."},{q:"Dans une monarchie de droit divin, le roi tient son pouvoir…",o:["du peuple","des philosophes","du Parlement","de Dieu"],r:3,x:"« Divin » vient du latin divinus : qui vient de Dieu."},{q:"L'absolutisme désigne un régime où…",o:["le roi partage le pouvoir avec le peuple","le roi exerce tous les pouvoirs","il n'y a pas de roi","le pape gouverne la France"],r:1,x:"Le roi absolu fait les lois, les fait exécuter et rend la justice."},{q:"La société d'ordres est composée…",o:["du clergé, de la noblesse et du tiers état","des riches et des pauvres","des savants, des philosophes et des rois","des catholiques et des protestants"],r:0,x:"Trois ordres inégaux : clergé, noblesse, tiers état."},{q:"Le fanatisme religieux conduit à…",o:["la tolérance","la séparation des pouvoirs","l'intolérance et à la violence","la liberté de la presse"],r:2,x:"Exemple : la condamnation sans preuve du protestant Jean Calas."},{q:"La censure, c'est…",o:["un lieu de lecture","l'interdiction d'une œuvre par un pouvoir","une réunion de savants","une classification des livres"],r:1,x:"Censurer = interdire tout ou partie d'un livre, d'un journal…"},{q:"Un cabinet de lecture est…",o:["le bureau du roi","une imprimerie","un lieu où l'on lit en payant un abonnement","une salle de classe"],r:2,x:"On lit sans acheter le livre : cela permet à plus de gens de lire."},{q:"Un despote éclairé est…",o:["un philosophe qui critique le roi","un souverain absolu qui s'intéresse aux Lumières","un roi qui abandonne son pouvoir","un savant qui étudie la lumière"],r:1,x:"Il garde tous les pouvoirs mais protège les philosophes, comme Frédéric II de Prusse."},{q:"L'oisiveté, c'est…",o:["le fait de vivre sans travailler","le fait d'être tolérant","le fait de voyager","le fait de lire beaucoup"],r:0,x:"Rousseau : « tout citoyen oisif est un fripon »."}]},{id:"q1",titre:"Chapitre 1",desc:"Une pensée scientifique renouvelée",questions:[{q:"Quelles sont les dates du Siècle des Lumières dans ton cours ?",o:["1492-1515","1610-1715","1715-1789","1789-1815"],r:2,x:"Le cours de M. Deglas retient 1715-1789."},{q:"Qui organise l'expédition de James Cook ?",o:["La Royal Society","Le roi de France","Le pape","Les auteurs de l'Encyclopédie"],r:0,x:"La Royal Society est la grande société savante britannique."},{q:"En 1769, Cook débarque…",o:["à Madagascar","à Tahiti","en Islande","à Terre-Neuve"],r:1,x:"Il arrive à Tahiti à bord de l'Endeavour."},{q:"Qu'a démontré l'expédition de Cook ?",o:["Que la Terre est ronde","Que Tahiti est un continent","Que la Terra australis incognita n'existe pas","Que Vénus est habitée"],r:2,x:"Le continent austral imaginaire n'existait pas."},{q:"Pourquoi Cook écrit-il que certaines remarques ne sont que des « conjectures » ?",o:["Parce qu'il ne veut conclure que sur ce qu'il a vu lui-même","Parce qu'il n'aime pas Tahiti","Parce que le roi le lui interdit","Parce qu'il a perdu son journal"],r:0,x:"C'est l'attitude d'un savant : il distingue ce qui est observé et ce qui est supposé."},{q:"Qu'ont fait Banks et Solander ?",o:["Ils ont observé le transit de Vénus","Ils ont classé l'arbre à pain et la perruche de Tahiti","Ils ont écrit l'Encyclopédie","Ils ont découvert Tahiti en 1767"],r:1,x:"Ce sont des naturalistes : ils observent et classent le vivant."},{q:"Le transit de Vénus a permis à Charles Green de…",o:["dessiner des oiseaux","cartographier Tahiti","mesurer la distance qui sépare la Terre et Vénus du Soleil","prouver que Vénus tourne autour de la Terre"],r:2,x:"Avec son télescope grégorien, il fait des mesures précises."},{q:"Qui commence la classification de tous les êtres vivants ?",o:["Voltaire et Rousseau","Cook et Green","Diderot et d'Alembert","Buffon et Linné"],r:3,x:"Ce sont deux grands naturalistes du XVIIIe siècle."}]},{id:"q2",titre:"Chapitre 2",desc:"Des institutions dénoncées",questions:[{q:"Qui a écrit _De l'esprit des lois_ (1748) ?",o:["Voltaire","Montesquieu","Rousseau","Diderot"],r:1,x:"Montesquieu y défend la séparation des pouvoirs."},{q:"Que défend Montesquieu ?",o:["La séparation des pouvoirs","La monarchie de droit divin","Le pouvoir du sultan","La censure"],r:0,x:"Pour lui, « tout serait perdu » si un seul homme avait les trois pouvoirs."},{q:"« Aucun homme n'a reçu de la nature le droit de commander aux autres. » Que rejette Diderot ?",o:["La science","La tolérance","La monarchie de droit divin","L'Encyclopédie"],r:2,x:"Si personne n'a reçu ce droit, le roi ne le tient ni de la nature ni de Dieu."},{q:"Dans quel ouvrage Voltaire défend-il Jean Calas ?",o:["_Émile_","_Traité sur la tolérance_","_De l'esprit des lois_","L'Encyclopédie"],r:1,x:"Le _Traité sur la tolérance_ paraît en 1763."},{q:"Qui était Jean Calas ?",o:["Un prêtre catholique de Paris","Un philosophe des Lumières","Un négociant protestant de Toulouse","Un ministre de Louis XV"],r:2,x:"Il est condamné sans preuve en 1762 et reconnu innocent en 1765."},{q:"En 1759, le pape Clément XIII…",o:["félicite Voltaire","met l'Encyclopédie à l'index","organise une expédition","libère Jean Calas"],r:1,x:"L'Encyclopédie relativise les miracles attribués à Jésus-Christ."},{q:"Dans _Émile_ (1762), Rousseau critique surtout…",o:["la société d'ordres inégalitaire","les savants","les imprimeries","le climat de Tahiti"],r:0,x:"« Tout citoyen oisif est un fripon » vise les privilégiés."},{q:"À la cour de quel souverain Voltaire séjourne-t-il ?",o:["Louis XV","Frédéric II de Prusse","Le sultan turc","Le pape Clément XIII"],r:1,x:"Frédéric II est un despote éclairé."}]},{id:"q3",titre:"Chapitre 3",desc:"La diffusion des idées",questions:[{q:"Combien de livres sortent des imprimeries françaises en 1789 ?",o:["Environ 400","Environ 1 000","Plus de 4 000","Plus de 40 000"],r:2,x:"On passe d'environ 1 000 par an au début du siècle à plus de 4 000."},{q:"Pourquoi les cabinets de lecture favorisent-ils la diffusion des idées ?",o:["On y lit sans acheter les livres, grâce à un abonnement","Le roi y lit les livres à voix haute","Les livres y sont imprimés","La censure y est interdite"],r:0,x:"Lire coûte moins cher : plus de personnes accèdent aux idées."},{q:"Quel est le salon le plus réputé de France ?",o:["Celui de Mme de Pompadour","Celui de Mme Clairon","Celui de Mme Geoffrin","Celui de Voltaire"],r:2,x:"Le salon de Mme Geoffrin réunit philosophes, savants, artistes et nobles."},{q:"Que fait-on dans un salon ?",o:["On vote les lois","On lit et on discute les idées nouvelles","On imprime des livres","On juge les crimes"],r:1,x:"C'est un lieu de lecture et de débat."},{q:"Pourquoi l'attitude de Malesherbes est-elle surprenante ?",o:["Il est philosophe mais déteste les livres","Il est chargé de la censure mais défend la liberté de la presse","Il est roi mais refuse de gouverner","Il est savant mais refuse d'observer"],r:1,x:"Même le responsable de la censure est séduit par les idées des Lumières."},{q:"La présence du prince de Conti, cousin du roi, dans un salon montre que…",o:["les Lumières n'intéressent que le peuple","les idées des Lumières touchent l'entourage du roi","le roi organise les salons","les nobles sont interdits de salon"],r:1,x:"Les Lumières séduisent jusqu'aux proches du pouvoir."},{q:"Qu'est-ce qui limite la diffusion des idées des Lumières ?",o:["Les cabinets de lecture","Les salons","La censure et les condamnations de l'Église","Les imprimeries"],r:2,x:"Exemple : l'Encyclopédie mise à l'index en 1759."},{q:"Qui protège Diderot en France, selon ton cours ?",o:["Mme de Pompadour","Frédéric II","Le pape","James Cook"],r:0,x:"Mme de Pompadour est une proche du roi Louis XV."}]}];var _r=[{id:"r1",titre:"Qui a fait quoi ?",type:"associer",methode:["Je lis l'œuvre ou l'action et je repère un indice : un titre, une date, un lieu, un mot du cours.","Je relie l'indice au chapitre : sciences (chapitre 1), critique des institutions (chapitre 2) ou diffusion (chapitre 3).","Je choisis le personnage et je vérifie avec la date : est-elle compatible avec sa vie ?"],exemple:{enonce:"À qui associer « _Traité sur la tolérance_ (1763) » ?",etapes:[["Je repère l'indice","Le mot « tolérance » et la date 1763."],["Je relie au chapitre","La tolérance s'oppose au fanatisme religieux : c'est le chapitre 2, la critique de la religion."],["Je choisis et je vérifie","C'est Voltaire, qui défend Jean Calas. Il vit de 1694 à 1778 : 1763 est compatible."]],reponse:"_Traité sur la tolérance_ (1763) → Voltaire."},exercices:[{id:"r1a",titre:"Des auteurs et leurs œuvres",paires:[["Montesquieu","_De l'esprit des lois_ (1748)"],["Voltaire","_Traité sur la tolérance_ (1763)"],["Rousseau","_Émile ou de l'éducation_ (1762)"],["Diderot et d'Alembert","L'Encyclopédie (1751-1772)"],["Malesherbes","_Mémoires sur la liberté de la presse_ (1788)"],["James Cook","Journal de bord, Tahiti (1769)"]]},{id:"r1b",titre:"Des personnages et leurs actions",paires:[["Charles Green","observe le transit de Vénus"],["Banks et Solander","classent l'arbre à pain et la perruche de Tahiti"],["Mme Geoffrin","tient le salon le plus réputé de France"],["Frédéric II de Prusse","accueille Voltaire à sa cour"],["Clément XIII","met l'Encyclopédie à l'index"],["Jean Calas","est condamné sans preuve à Toulouse"]]}]},{id:"r2",titre:"Dater et ordonner",type:"ordonner",methode:["Je place d'abord les repères que je connais par cœur : 1715 (début), 1748 (Montesquieu), 1751 (Encyclopédie), 1789 (fin).","Je cherche les liens de cause à conséquence : une condamnation vient avant la réhabilitation, un procès avant le livre qui le dénonce.","Je range le reste entre ces repères, puis je relis la suite comme une histoire : est-elle logique ?"],exemple:{enonce:"Range : « Bougainville arrive à Tahiti » – « Cook débarque à Tahiti » – « Wallis “découvre” Tahiti ».",etapes:[["Je cherche les repères","Cook débarque à Tahiti en 1769 (repère du cours)."],["Je lis les indices","Le document dit que Bougainville arrive « un an » après Wallis, et que l'île avait été « découverte » avant Cook."],["Je range et je relis","Wallis (1767) → Bougainville (1768) → Cook (1769). L'histoire est logique."]],reponse:"1767 Wallis → 1768 Bougainville → 1769 Cook."},exercices:[{id:"r2a",titre:"L'affaire Calas",items:[["1761","Marc-Antoine Calas est retrouvé mort à Toulouse"],["1762","Jean Calas est condamné sans preuve et exécuté"],["1763","Voltaire publie le _Traité sur la tolérance_"],["1765","Jean Calas est reconnu innocent"]]},{id:"r2b",titre:"Le Siècle des Lumières",items:[["1715","Début du Siècle des Lumières"],["1748","Montesquieu publie _De l'esprit des lois_"],["1751","Parution du premier volume de l'Encyclopédie"],["1759","L'Encyclopédie est mise à l'index"],["1769","Cook débarque à Tahiti"],["1788","Malesherbes défend la liberté de la presse"],["1789","Plus de 4 000 livres publiés en France"]]}]},{id:"r3",titre:"Définir une notion",type:"ecrire",methode:["Je commence par « C'est… » suivi de la catégorie : une période, un régime, un lieu, une personne, une idée…","J'ajoute ce qui la caractérise : ce qu'elle a de particulier.","Je termine par un exemple précis du cours (personnage, œuvre, date)."],exemple:{enonce:"Définis : l'absolutisme.",etapes:[["Catégorie","C'est un régime politique…"],["Caractéristique","…dans lequel le roi exerce tous les pouvoirs : il fait les lois, les fait exécuter et rend la justice."],["Exemple","Par exemple, en France, Louis XV est un roi absolu ; Montesquieu critique ce type de pouvoir."]],reponse:"L'absolutisme, c'est un régime politique dans lequel le roi exerce tous les pouvoirs : il fait les lois, les fait exécuter et rend la justice. Par exemple, en France, Louis XV est un roi absolu ; Montesquieu critique ce type de pouvoir."},exercices:[{id:"r3a",q:"Définis : la raison.",modele:"La raison, c'est la capacité d'un individu à comprendre le monde grâce à sa propre intelligence et à sa propre expérience, sans se laisser guider par ses préjugés ou ses croyances. Par exemple, James Cook utilise sa raison quand il vérifie par lui-même que la Terra australis incognita n'existe pas.",k:[{l:"capacité / comprendre",m:["capacite","comprendre"]},{l:"intelligence ou expérience",m:["intelligence","experience"]},{l:"sans préjugés ni croyances",m:["prejuge","croyance"]},{l:"un exemple (Cook, savant…)",m:["cook","green","banks","solander","par exemple"]}]},{id:"r3b",q:"Définis : la société d'ordres.",modele:"La société d'ordres, c'est une société divisée en trois groupes inégaux : le clergé, la noblesse et le tiers état. Par exemple, au XVIIIe siècle, Rousseau critique cette société inégalitaire dans _Émile_ (1762).",k:[{l:"trois groupes / ordres",m:["trois","3 "]},{l:"clergé",m:["clerge"]},{l:"noblesse",m:["noblesse","noble"]},{l:"tiers état",m:["tiers"]},{l:"inégalité",m:["inegal"]}]},{id:"r3c",q:"Définis : un despote éclairé.",modele:"Un despote éclairé, c'est un souverain qui garde un pouvoir absolu mais qui s'intéresse aux idées des Lumières et protège les philosophes. Par exemple, Frédéric II de Prusse accueille Voltaire à sa cour.",k:[{l:"souverain / roi",m:["souverain","roi","monarque"]},{l:"pouvoir absolu",m:["absolu","tous les pouvoirs"]},{l:"intérêt pour les Lumières",m:["lumieres","philosoph"]},{l:"exemple : Frédéric II",m:["frederic"]}]},{id:"r3d",q:"Définis : la censure.",modele:"La censure, c'est l'interdiction totale ou partielle d'une œuvre (livre, journal…) par un pouvoir. Par exemple, au XVIIIe siècle, Malesherbes, directeur de la librairie royale, est chargé de la censure.",k:[{l:"interdiction",m:["interdi"]},{l:"un livre / une œuvre",m:["livre","oeuvre","ouvrage","journal","production"]},{l:"par un pouvoir",m:["pouvoir","roi","autorite","eglise"]},{l:"exemple (Malesherbes, Encyclopédie…)",m:["malesherbes","encyclopedie","index"]}]},{id:"r3e",q:"Définis : un salon.",modele:"Un salon, c'est une réunion régulière, chez un particulier, de personnes cultivées qui lisent et discutent les idées nouvelles ; il est souvent tenu par une femme, la salonnière. Par exemple, le salon de Mme Geoffrin est le plus réputé de France au XVIIIe siècle.",k:[{l:"réunion",m:["reunion","rencontre","se reunissent"]},{l:"chez un particulier / salonnière",m:["particulier","salonniere","chez"]},{l:"lire / discuter",m:["lire","lisent","discut","debat","echang"]},{l:"exemple : Mme Geoffrin",m:["geoffrin"]}]},{id:"r3f",q:"Définis : un philosophe des Lumières.",modele:"Un philosophe des Lumières, c'est un penseur européen du XVIIIe siècle, attaché à la liberté et à l'égalité, qui utilise la raison pour critiquer les institutions de son temps et combattre l'ignorance, l'intolérance et l'arbitraire. Par exemple, Voltaire défend la tolérance dans son _Traité sur la tolérance_ (1763).",k:[{l:"penseur du XVIIIe siècle",m:["xviii","18","penseur"]},{l:"liberté / égalité",m:["liberte","egalite"]},{l:"raison",m:["raison"]},{l:"critique des institutions",m:["critiqu","denonc","institution","combat"]},{l:"exemple de philosophe",m:["voltaire","montesquieu","rousseau","diderot"]}]}]},{id:"r4",titre:"Répondre à une question de cours",type:"ecrire",methode:["Je repère le mot interrogatif : qui ? quand ? que ? pourquoi ? comment ?","Je reprends les mots de la question pour commencer ma réponse (jamais « parce que » ou « oui » tout seul).","J'ajoute l'information précise du cours : nom, date, œuvre, chiffre."],exemple:{enonce:"Qu'a démontré l'expédition de James Cook ?",etapes:[["Mot interrogatif","« Qu'a démontré » : je dois dire ce qui a été prouvé."],["Je reprends la question","« L'expédition de James Cook a démontré que… »"],["J'ajoute la précision","…la Terra australis incognita, ce continent imaginaire placé au sud de la planète, n'existe pas (1769)."]],reponse:"L'expédition de James Cook a démontré que la Terra australis incognita, ce continent imaginaire que les cartes plaçaient au sud de la planète, n'existe pas."},exercices:[{id:"r4a",q:"Qui organise l'expédition de James Cook et dans quel but ?",modele:"C'est la Royal Society, la société savante britannique, qui organise l'expédition de James Cook dans le Pacifique, afin de découvrir la Terra australis incognita et de faire des observations scientifiques.",k:[{l:"Royal Society",m:["royal society"]},{l:"société savante",m:["savant"]},{l:"chercher la Terra australis",m:["terra","australis","continent"]},{l:"observations scientifiques",m:["observ","scientifi","decouv"]}]},{id:"r4b",q:"Que défend Montesquieu dans _De l'esprit des lois_ ?",modele:"Dans _De l'esprit des lois_ (1748), Montesquieu défend la séparation des pouvoirs : le pouvoir de faire les lois, celui de les exécuter et celui de juger doivent être confiés à des personnes différentes pour éviter le despotisme.",k:[{l:"séparation des pouvoirs",m:["separ"]},{l:"les trois pouvoirs",m:["trois","legislati","executi","juger"]},{l:"éviter le despotisme",m:["despot","absolu"]},{l:"date 1748",m:["1748"]}]},{id:"r4c",q:"Pourquoi l'Encyclopédie est-elle mise à l'index en 1759 ?",modele:"L'Encyclopédie est mise à l'index en 1759 par le pape Clément XIII parce que ses auteurs, Diderot et d'Alembert, critiquent la religion et relativisent les miracles attribués à Jésus-Christ.",k:[{l:"le pape (Clément XIII)",m:["pape","clement"]},{l:"critique de la religion",m:["religion","eglise","evangile"]},{l:"les miracles",m:["miracle"]},{l:"Diderot / d'Alembert",m:["diderot","alembert"]}]},{id:"r4d",q:"Que reproche Rousseau aux nobles et au clergé ?",modele:"Rousseau reproche aux nobles et au clergé de vivre dans l'oisiveté, c'est-à-dire sans travailler, grâce au travail des autres. Dans _Émile_ (1762), il écrit que « tout citoyen oisif est un fripon » et que la nature a fait les hommes égaux.",k:[{l:"oisiveté / ne pas travailler",m:["oisi","travaill"]},{l:"fripon / voleur",m:["fripon","vol"]},{l:"égalité / inégalité",m:["egal"]},{l:"_Émile_ (1762)",m:["emile","1762"]}]},{id:"r4e",q:"Comment évolue le nombre de livres publiés en France au XVIIIe siècle ?",modele:"Le nombre de livres publiés en France augmente fortement au XVIIIe siècle : on passe d'environ 1 000 livres par an au début du siècle à plus de 4 000 en 1789, soit quatre fois plus.",k:[{l:"augmente",m:["augment","hausse","plus en plus","multipli"]},{l:"1 000 au début",m:["1000","1 000","mille"]},{l:"plus de 4 000 en 1789",m:["4000","4 000","quatre mille"]}]},{id:"r4f",q:"Qui est Malesherbes et pourquoi son attitude est-elle étonnante ?",modele:"Malesherbes est le directeur de la librairie royale, chargé de la censure. Son attitude est étonnante car il protège pourtant l'Encyclopédie et défend la liberté de la presse dans ses _Mémoires_ (1788).",k:[{l:"chargé de la censure",m:["censure"]},{l:"librairie royale",m:["librairie"]},{l:"défend la liberté de la presse",m:["liberte de la presse","presse"]},{l:"protège l'Encyclopédie",m:["encyclopedie"]}]}]}],jo={methode:[["aff","J'affirme","Je réponds à la question en une phrase qui reprend ses mots.","« X est un savant / philosophe des Lumières car… »"],["exp","J'explique","Je justifie avec une notion du cours (raison, tolérance, égalité…).","« En effet, … » ; « car… » ; « c'est-à-dire… »"],["ill","J'illustre","Je donne un exemple précis : personnage + œuvre ou fait + date.","« Par exemple, en 1763, … »"]],exemple:{q:"En quoi James Cook est-il un savant des Lumières ?",aff:"James Cook est un savant des Lumières car il utilise sa raison pour découvrir le monde.",exp:"En effet, au lieu de croire les préjugés des anciens cartographes, il part vérifier par lui-même si la Terra australis incognita existe, et il ne tire de conclusions que de ce qu'il a observé.",ill:"Par exemple, en 1769, son expédition organisée par la Royal Society atteint Tahiti, cartographie précisément l'archipel et démontre que ce continent imaginaire n'existe pas.",pensee:[["Je lis la question","« En quoi… » = je dois montrer les raisons qui font de Cook un savant des Lumières."],["Je cherche la notion","Savant des Lumières = utilise la raison, veut une connaissance vérifiable (chapitre 1)."],["Je cherche l'exemple","Tahiti, 1769, Royal Society, Terra australis incognita (activité 1, doc. 1)."]]},familles:[{id:"a1",titre:"Compléter un raisonnement",type:"choisir",consigne:"La phrase « J'affirme » est donnée. Choisis la meilleure explication puis le meilleur exemple.",exercices:[{id:"a1a",q:"En quoi Voltaire est-il un philosophe des Lumières ?",aff:"Voltaire est un philosophe des Lumières car il combat l'intolérance religieuse.",exp:[["En effet, il utilise la raison pour dénoncer le fanatisme religieux et défendre la tolérance.",!0,"Oui : la notion (fanatisme / tolérance) justifie l'affirmation."],["En effet, il observe les astres avec un télescope.",!1,"Non : c'est le travail d'un astronome, comme Charles Green."],["En effet, il est très connu en Europe.",!1,"Être célèbre ne prouve pas qu'on est un philosophe des Lumières : il manque une notion du cours."]],ill:[["Par exemple, il aime beaucoup écrire des livres.",!1,"Trop vague : pas de titre, pas de date, pas de fait précis."],["Par exemple, en 1763, dans le _Traité sur la tolérance_, il démontre l'innocence du protestant Jean Calas, condamné sans preuve à Toulouse.",!0,"Oui : œuvre + date + fait précis, en lien avec la tolérance."],["Par exemple, il écrit _De l'esprit des lois_ en 1748.",!1,"Erreur : _De l'esprit des lois_ est de Montesquieu."]]},{id:"a1b",q:"En quoi Montesquieu est-il un philosophe des Lumières ?",aff:"Montesquieu est un philosophe des Lumières car il critique l'absolutisme.",exp:[["En effet, il pense qu'un seul homme ne doit pas détenir tous les pouvoirs, sinon le pouvoir devient un despotisme.",!0,"Oui : tu expliques pourquoi il critique l'absolutisme."],["En effet, il fréquente les salons.",!1,"Cela concerne la diffusion des idées, pas la critique de l'absolutisme."],["En effet, il est contre le roi parce qu'il est méchant.",!1,"Jugement personnel, sans notion du cours."]],ill:[["Par exemple, dans _De l'esprit des lois_ (1748), il distingue le pouvoir de faire les lois, celui de les exécuter et celui de juger, et propose de les séparer.",!0,"Oui : œuvre + date + idée précise."],["Par exemple, il prend l'exemple de Tahiti.",!1,"Hors sujet : Tahiti renvoie à l'expédition de Cook."],["Par exemple, il défend Jean Calas.",!1,"Erreur : c'est Voltaire qui défend Calas."]]},{id:"a1c",q:"En quoi les salons favorisent-ils la diffusion des idées des Lumières ?",aff:"Les salons favorisent la diffusion des idées des Lumières car ce sont des lieux de lecture et de débat.",exp:[["En effet, des personnes cultivées venues de milieux différents s'y réunissent pour lire et discuter les œuvres des philosophes.",!0,"Oui : tu expliques le rôle du salon."],["En effet, on y imprime des livres.",!1,"Non : on imprime les livres dans les imprimeries."],["En effet, on y paie un abonnement pour lire.",!1,"Confusion : c'est le principe du cabinet de lecture."]],ill:[["Par exemple, dans le salon de Mme Geoffrin, on lit les œuvres de Voltaire devant des philosophes, un savant comme Buffon et même le prince de Conti, cousin du roi.",!0,"Oui : lieu précis + personnes précises."],["Par exemple, Voltaire va en Prusse.",!1,"Cet exemple concerne les despotes éclairés, pas les salons."],["Par exemple, il y a beaucoup de monde.",!1,"Trop vague."]]}]},{id:"a2",titre:"Trier les phrases",type:"trier",consigne:"Attribue chaque phrase à sa case : J'affirme, J'explique ou J'illustre.",exercices:[{id:"a2a",q:"En quoi Rousseau est-il un philosophe des Lumières ?",phrases:[["En effet, il pense que la nature a fait les hommes égaux et que chacun doit travailler pour vivre.","exp"],["Par exemple, dans _Émile ou de l'éducation_ (1762), il écrit que « tout citoyen oisif est un fripon », visant implicitement les nobles et le clergé.","ill"],["Rousseau est un philosophe des Lumières car il dénonce l'inégalité de la société d'ordres.","aff"]]},{id:"a2b",q:"En quoi Banks et Solander sont-ils des savants des Lumières ?",phrases:[["Par exemple, pendant le voyage de Cook, ils classent l'arbre à pain et la perruche de Tahiti, que l'illustrateur Sydney Parkinson dessine avec précision.","ill"],["Banks et Solander sont des savants des Lumières car ils étudient la nature par l'observation.","aff"],["En effet, ces naturalistes décrivent et classent les êtres vivants qu'ils voient eux-mêmes, pour produire une connaissance exacte et vérifiable.","exp"]]},{id:"a2c",q:"Montrez que les idées des Lumières séduisent jusqu'aux souverains.",phrases:[["En effet, certains monarques, appelés despotes éclairés, gardent un pouvoir absolu mais s'intéressent aux idées nouvelles et protègent les philosophes.","exp"],["Les idées des Lumières séduisent jusqu'aux souverains européens.","aff"],["Par exemple, Voltaire séjourne à la cour de Frédéric II de Prusse.","ill"]]}]},{id:"a3",titre:"Rédiger avec des aides",type:"ecrire",consigne:"Rédige les trois phrases. Utilise les débuts de phrases et la banque d'idées si tu en as besoin.",exercices:[{id:"a3a",q:"En quoi Charles Green est-il un savant des Lumières ?",aides:{aff:"Charles Green est un savant des Lumières car…",exp:"En effet, …",ill:"Par exemple, pendant l'expédition de Cook, …"},idees:["astronome","transit de Vénus","télescope grégorien","mesure exacte","distance Terre/Vénus-Soleil","connaissance vérifiable"],modele:{aff:"Charles Green est un savant des Lumières car il cherche une connaissance exacte grâce à l'observation et à la mesure.",exp:"En effet, cet astronome utilise des instruments précis pour obtenir des résultats vérifiables, au lieu de se fier aux croyances.",ill:"Par exemple, pendant l'expédition de Cook, il observe le transit de Vénus avec un télescope grégorien, ce qui permet de mesurer avec exactitude la distance qui sépare la Terre et Vénus du Soleil."},k:[{l:"astronome",m:["astronom"]},{l:"observation / mesure",m:["observ","mesur"]},{l:"transit de Vénus",m:["transit","venus"]},{l:"télescope",m:["telescope"]},{l:"distance au Soleil",m:["distance","soleil"]}]},{id:"a3b",q:"En quoi Diderot est-il un philosophe des Lumières ?",aides:{aff:"Diderot est un philosophe des Lumières car…",exp:"En effet, …",ill:"Par exemple, dans l'article « Autorité politique » de l'Encyclopédie, …"},idees:["Encyclopédie (1751-1772)","démocratiser le savoir","rejette la monarchie de droit divin","« Aucun homme n'a reçu de la nature le droit de commander aux autres »","mise à l'index (1759)"],modele:{aff:"Diderot est un philosophe des Lumières car il critique la monarchie de droit divin et veut diffuser le savoir.",exp:"En effet, il pense que le pouvoir d'un roi ne lui vient ni de Dieu ni de la nature, et que les connaissances doivent être accessibles à tous.",ill:"Par exemple, dans l'article « Autorité politique » de l'Encyclopédie (1751-1772), qu'il dirige avec d'Alembert, il écrit qu'« aucun homme n'a reçu de la nature le droit de commander aux autres »."},k:[{l:"Encyclopédie",m:["encyclopedie"]},{l:"droit divin / pouvoir du roi",m:["droit divin","divin","commander","roi"]},{l:"diffuser le savoir",m:["savoir","connaissance"]},{l:"citation ou date",m:["aucun homme","1751","1772"]}]}]},{id:"a4",titre:"Rédiger seul",type:"ecrire",consigne:"Rédige une réponse argumentée complète (affirmer, expliquer, illustrer) sans aide. Compare ensuite avec le modèle.",exercices:[{id:"a4a",q:"Montrez que Rousseau critique la société d'ordres.",modele:{aff:"Rousseau critique la société d'ordres parce qu'il la juge injuste et inégalitaire.",exp:"En effet, cette société divise les hommes en trois ordres inégaux (clergé, noblesse et tiers état), alors que pour lui tous les hommes naissent égaux et doivent travailler pour vivre.",ill:"Par exemple, dans _Émile ou de l'éducation_ (1762), il écrit que « la nature n'a fait ni princes, ni riches, ni grands seigneurs » et que « tout citoyen oisif est un fripon »."},k:[{l:"société d'ordres / trois ordres",m:["ordre"]},{l:"inégalité / égalité",m:["egal"]},{l:"oisiveté / travail",m:["oisi","travail"]},{l:"_Émile_ (1762)",m:["emile","1762"]}]},{id:"a4b",q:"Expliquez pourquoi les idées des Lumières inquiètent les autorités.",modele:{aff:"Les idées des Lumières inquiètent les autorités car elles remettent en cause le pouvoir du roi et celui de l'Église.",exp:"En effet, les philosophes critiquent l'absolutisme, la monarchie de droit divin et le fanatisme religieux : les autorités cherchent donc à contrôler ou à interdire leurs ouvrages par la censure.",ill:"Par exemple, en 1759, le pape Clément XIII met l'Encyclopédie à l'index parce qu'elle relativise les miracles attribués à Jésus-Christ."},k:[{l:"roi / absolutisme",m:["roi","absolu","monarch"]},{l:"Église / religion",m:["eglise","religi","pape"]},{l:"censure / interdiction",m:["censur","interdi","index"]},{l:"exemple précis (Encyclopédie, 1759…)",m:["encyclopedie","1759","calas"]}]},{id:"a4c",q:"En quoi les imprimeries et les cabinets de lecture favorisent-ils la diffusion des Lumières ?",modele:{aff:"Les imprimeries et les cabinets de lecture favorisent la diffusion des Lumières car ils permettent à un plus grand nombre de personnes de lire les œuvres des philosophes.",exp:"En effet, les imprimeries fabriquent de plus en plus de livres, et les cabinets de lecture permettent de les lire sans les acheter, grâce à un abonnement.",ill:"Par exemple, on passe d'environ 1 000 livres publiés par an en France au début du XVIIIe siècle à plus de 4 000 en 1789."},k:[{l:"plus de livres",m:["livre"]},{l:"abonnement / sans acheter",m:["abonnement","achet"]},{l:"plus de lecteurs",m:["lecteur","lire","nombre"]},{l:"chiffres (1 000 → 4 000)",m:["4000","4 000","1000","1 000"]}]},{id:"a4d",q:"Montrez que les idées des Lumières séduisent des personnes très différentes dans la société française.",modele:{aff:"Les idées des Lumières séduisent des personnes très différentes, de toute la société cultivée.",exp:"En effet, des philosophes, des savants, des artistes, des nobles et même des proches du roi lisent et discutent ces idées, en particulier dans les salons.",ill:"Par exemple, dans le salon de Mme Geoffrin, on trouve le savant Buffon, la comédienne Mme Clairon, le duc de Choiseul, ministre de Louis XV, et le prince de Conti, cousin du roi ; même Malesherbes, chargé de la censure, défend la liberté de la presse."},k:[{l:"milieux variés",m:["noble","artiste","savant","comedien","ministre"]},{l:"salon",m:["salon"]},{l:"Mme Geoffrin",m:["geoffrin"]},{l:"proche du roi (Conti, Choiseul)",m:["conti","choiseul","cousin"]},{l:"Malesherbes",m:["malesherbes"]}]}]}]};var Ne={ctx:{lab:"Je contextualise",grp:"J'introduis",court:"Contexte"},def:{lab:"Je définis",grp:"J'introduis",court:"Définition"},prob:{lab:"Je problématise",grp:"J'introduis",court:"Problématique"},aff:{lab:"J'affirme",grp:"J'argumente",court:"Affirmation"},exp:{lab:"J'explique",grp:"J'argumente",court:"Explication"},ill:{lab:"J'illustre",grp:"J'argumente",court:"Illustration"},res:{lab:"Je résume",grp:"Je conclus",court:"Résumé"}},Pr=[{r:"ctx",quoi:"Je situe le sujet dans le temps et dans l'espace.",q:"Quand ? Où ? Dans quelle situation ?",amorce:"Au XVIIIe siècle, en Europe, …"},{r:"def",quoi:"J'explique le sens des
