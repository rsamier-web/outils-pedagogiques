érifiable.",schema:"demarche"},{titre:"Explorer : James Cook et la Terra australis",texte:"Depuis l'Antiquité, les cartes montrent au sud de la planète un immense continent que personne n'a jamais vu : la [Terra australis incognita|terra]. La [Royal Society|societe], société savante britannique, organise l'[expédition scientifique|expedition] du navigateur James Cook dans le Pacifique. Il débarque à Tahiti en 1769, à bord de l'Endeavour, cartographie l'archipel avec précision, et son expédition démontre que ce continent n'existe pas.",cle:"Un savant des Lumières vérifie au lieu de croire."},{titre:"Ne conclure que sur ce que l'on a vu",texte:"Dans son journal de bord (1769), Cook prévient que beaucoup de ses remarques sur la société tahitienne ne sont que des [conjectures|conjecture], car il n'est resté que trois mois sur l'île. Il explique qu'il ne peut tirer de conclusions que de ce qu'il a vu lui-même.",cle:"Observation personnelle et prudence = esprit scientifique."},{titre:"Observer et classer le vivant",texte:"Les [naturalistes|naturaliste] Buffon et Carl von Linné commencent la [classification|classification] de tous les êtres vivants. Pendant le voyage de Cook, les naturalistes Daniel Solander et Joseph Banks répertorient de nouvelles espèces, comme l'arbre à pain et la perruche de Tahiti. L'illustrateur Sydney Parkinson les dessine avec précision.",cle:"Observer, décrire, dessiner, classer."},{titre:"Mesurer le ciel",texte:"Pendant l'expédition, l'[astronome|astronome] Charles Green observe le [transit de Vénus|transit] (le passage de Vénus devant le Soleil) avec un télescope grégorien. Ses observations permettent de mesurer avec exactitude la distance qui sépare la Terre et Vénus du Soleil.",cle:"Des instruments précis pour des mesures exactes."}],retenir:["Le Siècle des Lumières (1715-1789) est marqué par un renouveau de la pensée scientifique en Europe.","Les savants donnent la priorité à la raison sur les préjugés et les croyances.","Ils cherchent une connaissance exacte, universelle et vérifiable : scientifique.","Exemple clé : l'expédition de James Cook (Royal Society, Tahiti, 1769) prouve que la Terra australis incognita n'existe pas ; Banks et Solander classent de nouvelles espèces ; Charles Green observe le transit de Vénus."]},{id:"c2",num:2,titre:"Des institutions dénoncées par les philosophes",question:"Comment les philosophes des Lumières critiquent-ils l'ordre politique, religieux et social ?",source:"Leçon 2 et activité 2",segments:[{titre:"Qui sont les philosophes des Lumières ?",texte:"Les [philosophes des Lumières|philosophe] sont des penseurs européens du XVIIIe siècle attachés à la liberté et à l'égalité, et sensibles aux droits de chaque individu. Ils utilisent la raison pour critiquer les [institutions|institution] de leur temps et combattre l'ignorance, l'intolérance et l'[arbitraire|arbitraire].",cle:"Liberté + égalité + raison = armes des philosophes.",schema:"cibles"},{titre:"Contre l'absolutisme : Montesquieu",texte:"Dans _De l'esprit des lois_ (1748), Montesquieu (1689-1755) condamne le [despotisme|despotisme]. Il distingue trois pouvoirs : faire les lois (législatif), les faire exécuter (exécutif) et juger. « Tout serait perdu » si un seul homme les exerçait tous. Il défend donc la [séparation des pouvoirs|separation], contre l'[absolutisme|absolutisme].",cle:"Montesquieu : séparer les trois pouvoirs pour éviter le despotisme."},{titre:"Contre le droit divin : Diderot",texte:"Denis Diderot (1713-1784) veut rendre le savoir accessible à tous. Dans l'article « Autorité politique » de l'[Encyclopédie|encyclopedie] (1751-1772), il écrit : « Aucun homme n'a reçu de la nature le droit de commander aux autres. » Il rejette ainsi la [monarchie de droit divin|droitdivin].",cle:"Diderot : le pouvoir d'un roi ne vient pas de Dieu ni de la nature."},{titre:"Contre le fanatisme : Voltaire et l'affaire Calas",texte:"En 1761, à Toulouse, le négociant [protestant|protestant] Jean Calas est accusé, sans preuve, d'avoir tué son fils. En 1762, il est condamné et exécuté. Voltaire (1694-1778) mène l'enquête et publie le _Traité sur la tolérance_ (1763) pour dénoncer ce [fanatisme religieux|fanatisme]. En 1765, Calas est reconnu innocent.",cle:"Voltaire : défendre la tolérance contre le fanatisme.",schema:"calas"},{titre:"Une Église critiquée",texte:"Les philosophes critiquent l'Église et la religion, sans forcément nier l'existence de Dieu. Diderot et d'Alembert, auteurs de l'Encyclopédie, relativisent les miracles attribués à Jésus-Christ. En 1759, le pape Clément XIII [met l'ouvrage à l'index|index].",cle:"La religion n'échappe pas à l'examen de la raison."},{titre:"Contre la société d'ordres : Rousseau",texte:"La [société d'ordres|ordres] divise les hommes en trois catégories inégales : la noblesse, le clergé et le [tiers état|tiers]. Dans _Émile ou de l'éducation_ (1762), Jean-Jacques Rousseau (1712-1778) écrit : « La nature n'a fait ni princes, ni riches, ni grands seigneurs » et « tout citoyen oisif est un fripon ». Il vise ainsi les nobles et le clergé, qui vivent dans l'[oisiveté|oisivete], et défend l'égalité de tous devant la loi.",cle:"Rousseau : les hommes naissent égaux, chacun doit travailler."},{titre:"Des soutiens puissants",texte:"Les philosophes veulent faire connaître leurs idées et influencer le monde. Certains souverains, appelés [despotes éclairés|despote], les soutiennent : Voltaire séjourne à la cour de Frédéric II de Prusse. En France, Diderot est protégé par Mme de Pompadour, proche du roi Louis XV.",cle:"Des souverains et des proches du roi soutiennent les philosophes."}],retenir:["Les philosophes des Lumières, attachés à la liberté et à l'égalité, utilisent la raison pour critiquer les institutions.","Politique : Montesquieu (_De l'esprit des lois_, 1748) défend la séparation des pouvoirs ; Diderot rejette la monarchie de droit divin.","Religion : Voltaire dénonce le fanatisme dans le _Traité sur la tolérance_ (1763) après l'affaire Calas ; l'Encyclopédie est mise à l'index (1759).","Société : Rousseau (_Émile_, 1762) critique la société d'ordres inégalitaire.","Des despotes éclairés comme Frédéric II de Prusse soutiennent les philosophes."]},{id:"c3",num:3,titre:"La diffusion des idées des Lumières",question:"Comment et jusqu'où les idées des Lumières se diffusent-elles ?",source:"Synthèse rédigée à partir de l'activité 3",segments:[{titre:"Le siècle du livre",texte:"Le XVIIIe siècle est le siècle du livre. Grâce à l'essor des [imprimeries|imprimerie], la France passe d'environ 1 000 livres publiés par an au début du siècle à plus de 4 000 en 1789 : quatre fois plus !",cle:"Plus de livres = plus de lecteurs pour les idées nouvelles.",schema:"livres"},{titre:"Les cabinets de lecture",texte:"Les livres coûtent cher. Dans les [cabinets de lecture|cabinet], on peut lire des livres et des journaux en payant simplement un abonnement. Ces lieux se multiplient au XVIIIe siècle : ils permettent à davantage de personnes de lire les œuvres des philosophes.",cle:"Lire sans acheter : les idées touchent plus de monde."},{titre:"Les salons",texte:"Un [salon|salon] est une réunion régulière, chez un particulier, de personnes cultivées qui lisent, présentent et discutent les idées nouvelles. Il est souvent tenu par une femme, la salonnière. Le salon de Mme Geoffrin (1699-1777) est le plus réputé de France : on y lit par exemple les œuvres de Voltaire.",cle:"Les salons : lire ensemble et débattre."},{titre:"Jusqu'où ? Toute la société cultivée",texte:"Les idées des Lumières séduisent des personnes très différentes. Dans le salon de Mme Geoffrin, on trouve des philosophes (Diderot, d'Alembert, Rousseau, Montesquieu), un savant (Buffon), une comédienne (Mme Clairon), un ministre de Louis XV (le duc de Choiseul) et même le prince de Conti, cousin du roi.",cle:"Les Lumières touchent jusqu'à l'entourage du roi.",schema:"public"},{titre:"Même le responsable de la censure !",texte:"Malesherbes (1721-1794) dirige la librairie royale : il est chargé de la [censure|censure]. Pourtant, il protège l'Encyclopédie et défend la [liberté de la presse|presse]. En 1788, il écrit que la liberté de la discussion est le moyen sûr de faire connaître la vérité à une nation.",cle:"Les idées des Lumières convainquent même ceux qui doivent les contrôler."},{titre:"Jusqu'aux souverains d'Europe",texte:"Les idées des Lumières dépassent les frontières de la France. Des [despotes éclairés|despote] s'y intéressent et accueillent les philosophes : Voltaire siège à la cour de Frédéric II de Prusse. Les idées circulent ainsi dans toute l'Europe cultivée.",cle:"Les Lumières : un mouvement européen."},{titre:"Des limites à la diffusion",texte:"La diffusion a des limites. La censure royale peut interdire un ouvrage et l'Église condamne certains livres : l'Encyclopédie est mise à l'index par le pape en 1759. Les philosophes ont donc besoin de protecteurs puissants pour publier et se faire entendre.",cle:"Une diffusion large, mais surveillée."}],retenir:["Les idées des Lumières se diffusent grâce au livre (plus de 4 000 livres publiés en France en 1789), aux cabinets de lecture et aux salons comme celui de Mme Geoffrin.","Elles séduisent toute la société cultivée : philosophes, savants, artistes, nobles, ministres, jusqu'au cousin du roi et même Malesherbes, chargé de la censure.","Elles atteignent des souverains européens comme Frédéric II de Prusse.","Mais la censure et les condamnations de l'Église limitent cette diffusion."]}],mi=[{nom:"James Cook",dates:"1728-1779",type:"Savant",ch:"c1",role:"Navigateur anglais envoyé par la Royal Society dans le Pacifique.",fait:"À Tahiti en 1769 ; son expédition prouve que la Terra australis incognita n'existe pas."},{nom:"Joseph Banks et Daniel Solander",dates:"",type:"Savants",ch:"c1",role:"Naturalistes de l'expédition de Cook.",fait:"Classent de nouvelles espèces : l'arbre à pain, la perruche de Tahiti."},{nom:"Sydney Parkinson",dates:"",type:"Illustrateur",ch:"c1",role:"Illustrateur de l'expédition de Cook.",fait:"Dessine avec précision les plantes et les animaux observés."},{nom:"Charles Green",dates:"",type:"Savant",ch:"c1",role:"Astronome de l'expédition de Cook.",fait:"Observe le transit de Vénus avec un télescope grégorien et mesure la distance Terre/Vénus-Soleil."},{nom:"Buffon et Carl von Linné",dates:"",type:"Savants",ch:"c1",role:"Naturalistes.",fait:"Commencent la classification de tous les êtres vivants."},{nom:"Montesquieu",dates:"1689-1755",type:"Philosophe",ch:"c2",role:"Combat l'absolutisme et le despotisme.",fait:"_De l'esprit des lois_ (1748) : séparation des pouvoirs."},{nom:"Denis Diderot",dates:"1713-1784",type:"Philosophe",ch:"c2",role:"Dirige l'Encyclopédie avec d'Alembert (1751-1772).",fait:"Article « Autorité politique » : rejette la monarchie de droit divin."},{nom:"Voltaire",dates:"1694-1778",type:"Philosophe",ch:"c2",role:"Combat le fanatisme religieux, défend la tolérance.",fait:"_Traité sur la tolérance_ (1763) : défend Jean Calas. Séjourne chez Frédéric II."},{nom:"Jean-Jacques Rousseau",dates:"1712-1778",type:"Philosophe",ch:"c2",role:"Critique la société d'ordres inégalitaire.",fait:"_Émile ou de l'éducation_ (1762) : « tout citoyen oisif est un fripon »."},{nom:"Jean Calas",dates:"",type:"Victime",ch:"c2",role:"Négociant protestant de Toulouse.",fait:"Condamné sans preuve et exécuté en 1762, reconnu innocent en 1765."},{nom:"Clément XIII",dates:"",type:"Pape",ch:"c2",role:"Chef de l'Église catholique.",fait:"Met l'Encyclopédie à l'index en 1759."},{nom:"Frédéric II de Prusse",dates:"",type:"Souverain",ch:"c2",role:"Despote éclairé.",fait:"Accueille Voltaire à sa cour."},{nom:"Mme de Pompadour",dates:"",type:"Protectrice",ch:"c2",role:"Proche du roi Louis XV.",fait:"Protège Diderot."},{nom:"Mme Geoffrin",dates:"1699-1777",type:"Salonnière",ch:"c3",role:"Tient le salon le plus réputé de France.",fait:"On y lit les œuvres de Voltaire devant philosophes, savants et nobles."},{nom:"Malesherbes",dates:"1721-1794",type:"Haut fonctionnaire",ch:"c3",role:"Directeur de la librairie royale, chargé de la censure.",fait:"Protège l'Encyclopédie ; défend la liberté de la presse (1788)."},{nom:"Le prince de Conti",dates:"",type:"Noble",ch:"c3",role:"Cousin du roi.",fait:"Fréquente le salon de Mme Geoffrin."}],Vr=[{an:"1715",txt:"Début du Siècle des Lumières",ch:"c1"},{an:"1748",txt:"Montesquieu, _De l'esprit des lois_",ch:"c2"},{an:"1751",txt:"Premier volume de l'Encyclopédie (jusqu'en 1772)",ch:"c2"},{an:"1759",txt:"L'Encyclopédie mise à l'index par le pape",ch:"c2"},{an:"1762",txt:"Exécution de Jean Calas ; Rousseau, _Émile_",ch:"c2"},{an:"1763",txt:"Voltaire, _Traité sur la tolérance_",ch:"c2"},{an:"1765",txt:"Jean Calas reconnu innocent",ch:"c2"},{an:"1769",txt:"Cook à Tahiti ; Green observe le transit de Vénus",ch:"c1"},{an:"1772",txt:"Dernier volume de l'Encyclopédie",ch:"c3"},{an:"1788",txt:"Malesherbes défend la liberté de la presse",ch:"c3"},{an:"1789",txt:"Fin du Siècle des Lumières (plus de 4 000 livres publiés)",ch:"c3"}],dn=[{id:"lumieres",mot:"Siècle des Lumières",ch:"c1",def:"Période (1715-1789) pendant laquelle, en Europe, savants et philosophes veulent éclairer les hommes grâce à la raison.",ex:"Voltaire, Montesquieu et James Cook vivent au Siècle des Lumières."},{id:"raison",mot:"Raison",ch:"c1",def:"Capacité à comprendre le monde avec sa propre intelligence et sa propre expérience, sans préjugés ni croyances.",ex:"Cook part vérifier par lui-même si le continent austral existe : il utilise sa raison."},{id:"prejuge",mot:"Préjugé",ch:"c1",def:"Idée toute faite que l'on croit vraie sans l'avoir vérifiée.",ex:"Croire à un immense continent au sud sans l'avoir jamais vu."},{id:"scientifique",mot:"Connaissance scientifique",ch:"c1",def:"Connaissance exacte (juste), universelle (valable pour tous) et vérifiable (que chacun peut contrôler).",ex:"La distance entre la Terre et le Soleil calculée grâce au transit de Vénus."},{id:"savant",mot:"Savant",ch:"c1",def:"Personne qui étudie les sciences et cherche des connaissances exactes.",ex:"L'astronome Charles Green est un savant des Lumières."},{id:"societe",mot:"Société savante",ch:"c1",def:"Association qui regroupe des savants pour partager et financer des recherches.",ex:"La Royal Society, en Grande-Bretagne, organise l'expédition de Cook."},{id:"expedition",mot:"Expédition scientifique",ch:"c1",def:"Voyage organisé pour observer, mesurer et découvrir.",ex:"Le voyage de James Cook jusqu'à Tahiti en 1769."},{id:"terra",mot:"Terra australis incognita",ch:"c1",def:"« Terre australe inconnue » : continent imaginaire que les cartes plaçaient au sud de la planète depuis l'Antiquité.",ex:"L'expédition de Cook démontre qu'elle n'existe pas."},{id:"conjecture",mot:"Conjecture",ch:"c1",def:"Supposition, idée qui n'est pas encore vérifiée.",ex:"Cook prévient que certaines de ses remarques sur Tahiti ne sont que des conjectures."},{id:"naturaliste",mot:"Naturaliste",ch:"c1",def:"Savant qui étudie les plantes, les animaux et les minéraux.",ex:"Joseph Banks et Daniel Solander."},{id:"classification",mot:"Classification",ch:"c1",def:"Rangement des êtres vivants en groupes, selon ce qu'ils ont en commun.",ex:"Buffon et Linné commencent la classification des êtres vivants."},{id:"astronome",mot:"Astronome",ch:"c1",def:"Savant qui étudie les astres : planètes, étoiles, Soleil.",ex:"Charles Green."},{id:"transit",mot:"Transit de Vénus",ch:"c1",def:"Passage de Vénus entre la Terre et le Soleil : on voit un petit disque noir traverser le Soleil.",ex:"Observé par Charles Green pendant l'expédition de Cook."},{id:"philosophe",mot:"Philosophe des Lumières",ch:"c2",def:"Penseur du XVIIIe siècle, attaché à la liberté et à l'égalité, qui utilise la raison pour critiquer les institutions et combattre l'ignorance, l'intolérance et l'arbitraire.",ex:"Voltaire, Montesquieu, Diderot, Rousseau."},{id:"institution",mot:"Institution",ch:"c2",def:"Organisation qui encadre la vie d'une société : le pouvoir du roi, l'Église, la justice, la société d'ordres.",ex:"Les philosophes dénoncent les institutions du XVIIIe siècle."},{id:"arbitraire",mot:"Arbitraire",ch:"c2",def:"Décision prise selon le bon vouloir d'une personne, sans règle juste.",ex:"Jean Calas est condamné sans aucune preuve."},{id:"absolutisme",mot:"Absolutisme (monarchie absolue)",ch:"c2",def:"Régime politique dans lequel le roi exerce tous les pouvoirs.",ex:"En France, Louis XV est un roi absolu."},{id:"droitdivin",mot:"Monarchie de droit divin",ch:"c2",def:"Monarchie dans laquelle le roi tient ses pouvoirs de Dieu.",ex:"Diderot la rejette : « aucun homme n'a reçu de la nature le droit de commander aux autres »."},{id:"despotisme",mot:"Despotisme",ch:"c2",def:"Pouvoir d'un seul homme, sans limite ni contrôle, souvent injuste.",ex:"Montesquieu prend l'exemple du sultan turc, qui réunit les trois pouvoirs."},{id:"separation",mot:"Séparation des pouvoirs",ch:"c2",def:"Principe selon lequel les trois pouvoirs (faire la loi, la faire exécuter, juger) sont confiés à des personnes différentes.",ex:"Montesquieu la défend dans _De l'esprit des lois_ (1748)."},{id:"ordres",mot:"Société d'ordres",ch:"c2",def:"Société divisée en trois groupes inégaux : le clergé, la noblesse et le tiers état.",ex:"Rousseau critique cette société inégalitaire."},{id:"tiers",mot:"Tiers état",ch:"c2",def:"Troisième ordre : tous ceux qui ne sont ni nobles ni membres du clergé (paysans, artisans, marchands, bourgeois). C'est le plus nombreux.",ex:"Le négociant Jean Calas appartient au tiers état."},{id:"oisivete",mot:"Oisiveté",ch:"c2",def:"Fait de vivre sans travailler.",ex:"Pour Rousseau, « tout citoyen oisif est un fripon »."},{id:"fripon",mot:"Fripon",ch:"c2",def:"Voleur qui agit par ruse.",ex:"Rousseau traite implicitement les nobles et les ecclésiastiques de fripons."},{id:"fanatisme",mot:"Fanatisme religieux",ch:"c2",def:"Attachement excessif et irrationnel à une religion, qui pousse à l'intolérance et à la violence contre ceux qui ne partagent pas la même croyance.",ex:"La rumeur et la condamnation du protestant Jean Calas."},{id:"tolerance",mot:"Tolérance",ch:"c2",def:"Respect des croyances et des opinions des autres, même quand on ne les partage pas.",ex:"Voltaire publie le _Traité sur la tolérance_ en 1763."},{id:"protestant",mot:"Protestant",ch:"c2",def:"Chrétien qui ne reconnaît pas l'autorité du pape (différent du catholique).",ex:"Jean Calas est protestant."},{id:"index",mot:"Mise à l'index",ch:"c2",def:"Interdiction faite par le pape aux catholiques de lire un livre.",ex:"L'Encyclopédie est mise à l'index par Clément XIII en 1759."},{id:"encyclopedie",mot:"Encyclopédie",ch:"c2",def:"Ouvrage qui rassemble les connaissances de son époque. Celle de Diderot et d'Alembert paraît de 1751 à 1772.",ex:"Diderot y écrit l'article « Autorité politique »."},{id:"despote",mot:"Despote éclairé",ch:"c2",def:"Souverain qui garde un pouvoir absolu mais s'intéresse aux idées des Lumières et protège les philosophes.",ex:"Frédéric II de Prusse accueille Voltaire à sa cour."},{id:"imprimerie",mot:"Imprimerie",ch:"c3",def:"Technique (et atelier) qui permet de fabriquer des livres en grand nombre.",ex:"En 1789, plus de 4 000 livres sortent des imprimeries françaises."},{id:"censure",mot:"Censure",ch:"c3",def:"Interdiction totale ou partielle d'un livre, d'un journal ou d'une œuvre par un pouvoir.",ex:"Malesherbes, directeur de la librairie royale, est chargé de la censure."},{id:"presse",mot:"Liberté de la presse",ch:"c3",def:"Droit de publier librement ses idées dans des livres et des journaux.",ex:"Malesherbes la défend en 1788."},{id:"cabinet",mot:"Cabinet de lecture",ch:"c3",def:"Lieu où l'on peut lire des livres et des journaux en payant un abonnement.",ex:"Les cabinets de lecture se multiplient au XVIIIe siècle."},{id:"salon",mot:"Salon",ch:"c3",def:"Réunion régulière, chez un particulier (souvent une femme, la salonnière), de personnes cultivées qui lisent et discutent les idées nouvelles.",ex:"Le salon de Mme Geoffrin, le plus réputé de France."},{id:"diffusion",mot:"Diffusion",ch:"c3",def:"Fait de répandre des idées auprès d'un grand nombre de personnes.",ex:"Livres, cabinets de lecture et salons assurent la diffusion des Lumières."}],fi=[{id:"qv",titre:"Vocabulaire",desc:"Les mots complexes du glossaire",questions:[{q:"La raison, c'est…",o:["croire ce que disent les Anciens","comprendre le monde avec sa propre intelligence et son expérience","obéir au roi sans discuter","suivre les traditions religieuses"],r:1,x:"La raison permet de comprendre le monde par soi-même, sans préjugés ni croyances."},{q:"Une connaissance « vérifiable » est une connaissance…",o:["que chacun peut contrôler","écrite dans un livre ancien","vraie seulement en Europe","imposée par le roi"],r:0,x:"Vérifiable = on peut refaire l'observation ou la mesure et obtenir le même résultat."},{q:"Un naturaliste étudie…",o:["les astres","les lois et les gouvernements","les plantes, les animaux et les minéraux","les langues anciennes"],r:2,x:"Banks et Solander, naturalistes, classent des plantes et des oiseaux."},{q:"Dans une monarchie de droit divin, le roi tient son pouvoir…",o:["du peuple","des philosophes","du Parlement","de Dieu"],r:3,x:"« Divin » vient du latin divinus : qui vient de Dieu."},{q:"L'absolutisme désigne un régime où…",o:["le roi partage le pouvoir avec le peuple","le roi exerce tous les pouvoirs","il n'y a pas de roi","le pape gouverne la France"],r:1,x:"Le roi absolu fait les lois, les fait exécuter et rend la justice."},{q:"La société d'ordres est composée…",o:["du clergé, de la noblesse et du tiers état","des riches et des pauvres","des savants, des philosophes et des rois","des catholiques et des protestants"],r:0,x:"Trois ordres inégaux : clergé, noblesse, tiers état."},{q:"Le fanatisme religieux conduit à…",o:["la tolérance","la séparation des pouvoirs","l'intolérance et à la violence","la liberté de la presse"],r:2,x:"Exemple : la condamnation sans preuve du protestant Jean Calas."},{q:"La censure, c'est…",o:["un lieu de lecture","l'interdiction d'une œuvre par un pouvoir","une réunion de savants","une classification des livres"],r:1,x:"Censurer = interdire tout ou partie d'un livre, d'un journal…"},{q:"Un cabinet de lecture est…",o:["le bureau du roi","une imprimerie","un lieu où l'on lit en payant un abonnement","une salle de classe"],r:2,x:"On lit sans acheter le livre : cela permet à plus de gens de lire."},{q:"Un despote éclairé est…",o:["un philosophe qui critique le roi","un souverain absolu qui s'intéresse aux Lumières","un roi qui abandonne son pouvoir","un savant qui étudie la lumière"],r:1,x:"Il garde tous les pouvoirs mais protège les philosophes, comme Frédéric II de Prusse."},{q:"L'oisiveté, c'est…",o:["le fait de vivre sans travailler","le fait d'être tolérant","le fait de voyager","le fait de lire beaucoup"],r:0,x:"Rousseau : « tout citoyen oisif est un fripon »."}]},{id:"q1",titre:"Chapitre 1",desc:"Une pensée scientifique renouvelée",questions:[{q:"Quelles sont les dates du Siècle des Lumières dans ton cours ?",o:["1492-1515","1610-1715","1715-1789","1789-1815"],r:2,x:"Le cours de M. Deglas retient 1715-1789."},{q:"Qui organise l'expédition de James Cook ?",o:["La Royal Society","Le roi de France","Le pape","Les auteurs de l'Encyclopédie"],r:0,x:"La Royal Society est la grande société savante britannique."},{q:"En 1769, Cook débarque…",o:["à Madagascar","à Tahiti","en Islande","à Terre-Neuve"],r:1,x:"Il arrive à Tahiti à bord de l'Endeavour."},{q:"Qu'a démontré l'expédition de Cook ?",o:["Que la Terre est ronde","Que Tahiti est un continent","Que la Terra australis incognita n'existe pas","Que Vénus est habitée"],r:2,x:"Le continent austral imaginaire n'existait pas."},{q:"Pourquoi Cook écrit-il que certaines remarques ne sont que des « conjectures » ?",o:["Parce qu'il ne veut conclure que sur ce qu'il a vu lui-même","Parce qu'il n'aime pas Tahiti","Parce que le roi le lui interdit","Parce qu'il a perdu son journal"],r:0,x:"C'est l'attitude d'un savant : il distingue ce qui est observé et ce qui est supposé."},{q:"Qu'ont fait Banks et Solander ?",o:["Ils ont observé le transit de Vénus","Ils ont classé l'arbre à pain et la perruche de Tahiti","Ils ont écrit l'Encyclopédie","Ils ont découvert Tahiti en 1767"],r:1,x:"Ce sont des naturalistes : ils observent et classent le vivant."},{q:"Le transit de Vénus a permis à Charles Green de…",o:["dessiner des oiseaux","cartographier Tahiti","mesurer la distance qui sépare la Terre et Vénus du Soleil","prouver que Vénus tourne autour de la Terre"],r:2,x:"Avec son télescope grégorien, il fait des mesures précises."},{q:"Qui commence la classification de tous les êtres vivants ?",o:["Voltaire et Rousseau","Cook et Green","Diderot et d'Alembert","Buffon et Linné"],r:3,x:"Ce sont deux grands naturalistes du XVIIIe siècle."}]},{id:"q2",titre:"Chapitre 2",desc:"Des institutions dénoncées",questions:[{q:"Qui a écrit _De l'esprit des lois_ (1748) ?",o:["Voltaire","Montesquieu","Rousseau","Diderot"],r:1,x:"Montesquieu y défend la séparation des pouvoirs."},{q:"Que défend Montesquieu ?",o:["La séparation des pouvoirs","La monarchie de droit divin","Le pouvoir du sultan","La censure"],r:0,x:"Pour lui, « tout serait perdu » si un seul homme avait les trois pouvoirs."},{q:"« Aucun homme n'a reçu de la nature le droit de commander aux autres. » Que rejette Diderot ?",o:["La science","La tolérance","La monarchie de droit divin","L'Encyclopédie"],r:2,x:"Si personne n'a reçu ce droit, le roi ne le tient ni de la nature ni de Dieu."},{q:"Dans quel ouvrage Voltaire défend-il Jean Calas ?",o:["_Émile_","_Traité sur la tolérance_","_De l'esprit des lois_","L'Encyclopédie"],r:1,x:"Le _Traité sur la tolérance_ paraît en 1763."},{q:"Qui était Jean Calas ?",o:["Un prêtre catholique de Paris","Un philosophe des Lumières","Un négociant protestant de Toulouse","Un ministre de Louis XV"],r:2,x:"Il est condamné sans preuve en 1762 et reconnu innocent en 1765."},{q:"En 1759, le pape Clément XIII…",o:["félicite Voltaire","met l'Encyclopédie à l'index","organise une expédition","libère Jean Calas"],r:1,x:"L'Encyclopédie relativise les miracles attribués à Jésus-Christ."},{q:"Dans _Émile_ (1762), Rousseau critique surtout…",o:["la société d'ordres inégalitaire","les savants","les imprimeries","le climat de Tahiti"],r:0,x:"« Tout citoyen oisif est un fripon » vise les privilégiés."},{q:"À la cour de quel souverain Voltaire séjourne-t-il ?",o:["Louis XV","Frédéric II de Prusse","Le sultan turc","Le pape Clément XIII"],r:1,x:"Frédéric II est un despote éclairé."}]},{id:"q3",titre:"Chapitre 3",desc:"La diffusion des idées",questions:[{q:"Combien de livres sortent des imprimeries françaises en 1789 ?",o:["Environ 400","Environ 1 000","Plus de 4 000","Plus de 40 000"],r:2,x:"On passe d'environ 1 000 par an au début du siècle à plus de 4 000."},{q:"Pourquoi les cabinets de lecture favorisent-ils la diffusion des idées ?",o:["On y lit sans acheter les livres, grâce à un abonnement","Le roi y lit les livres à voix haute","Les livres y sont imprimés","La censure y est interdite"],r:0,x:"Lire coûte moins cher : plus de personnes accèdent aux idées."},{q:"Quel est le salon le plus réputé de France ?",o:["Celui de Mme de Pompadour","Celui de Mme Clairon","Celui de Mme Geoffrin","Celui de Voltaire"],r:2,x:"Le salon de Mme Geoffrin réunit philosophes, savants, artistes et nobles."},{q:"Que fait-on dans un salon ?",o:["On vote les lois","On lit et on discute les idées nouvelles","On imprime des livres","On juge les crimes"],r:1,x:"C'est un lieu de lecture et de débat."},{q:"Pourquoi l'attitude de Malesherbes est-elle surprenante ?",o:["Il est philosophe mais déteste les livres","Il est chargé de la censure mais défend la liberté de la presse","Il est roi mais refuse de gouverner","Il est savant mais refuse d'observer"],r:1,x:"Même le responsable de la censure est séduit par les idées des Lumières."},{q:"La présence du prince de Conti, cousin du roi, dans un salon montre que…",o:["les Lumières n'intéressent que le peuple","les idées des Lumières touchent l'entourage du roi","le roi organise les salons","les nobles sont interdits de salon"],r:1,x:"Les Lumières séduisent jusqu'aux proches du pouvoir."},{q:"Qu'est-ce qui limite la diffusion des idées des Lumières ?",o:["Les cabinets de lecture","Les salons","La censure et les condamnations de l'Église","Les imprimeries"],r:2,x:"Exemple : l'Encyclopédie mise à l'index en 1759."},{q:"Qui protège Diderot en France, selon ton cours ?",o:["Mme de Pompadour","Frédéric II","Le pape","James Cook"],r:0,x:"Mme de Pompadour est une proche du roi Louis XV."}]}];var Or=[{id:"r1",titre:"Qui a fait quoi ?",type:"associer",methode:["Je lis l'œuvre ou l'action et je repère un indice : un titre, une date, un lieu, un mot du cours.","Je relie l'indice au chapitre : sciences (chapitre 1), critique des institutions (chapitre 2) ou diffusion (chapitre 3).","Je choisis le personnage et je vérifie avec la date : est-elle compatible avec sa vie ?"],exemple:{enonce:"À qui associer « _Traité sur la tolérance_ (1763) » ?",etapes:[["Je repère l'indice","Le mot « tolérance » et la date 1763."],["Je relie au chapitre","La tolérance s'oppose au fanatisme religieux : c'est le chapitre 2, la critique de la religion."],["Je choisis et je vérifie","C'est Voltaire, qui défend Jean Calas. Il vit de 1694 à 1778 : 1763 est compatible."]],reponse:"_Traité sur la tolérance_ (1763) → Voltaire."},exercices:[{id:"r1a",titre:"Des auteurs et leurs œuvres",paires:[["Montesquieu","_De l'esprit des lois_ (1748)"],["Voltaire","_Traité sur la tolérance_ (1763)"],["Rousseau","_Émile ou de l'éducation_ (1762)"],["Diderot et d'Alembert","L'Encyclopédie (1751-1772)"],["Malesherbes","_Mémoires sur la liberté de la presse_ (1788)"],["James Cook","Journal de bord, Tahiti (1769)"]]},{id:"r1b",titre:"Des personnages et leurs actions",paires:[["Charles Green","observe le transit de Vénus"],["Banks et Solander","classent l'arbre à pain et la perruche de Tahiti"],["Mme Geoffrin","tient le salon le plus réputé de France"],["Frédéric II de Prusse","accueille Voltaire à sa cour"],["Clément XIII","met l'Encyclopédie à l'index"],["Jean Calas","est condamné sans preuve à Toulouse"]]}]},{id:"r2",titre:"Dater et ordonner",type:"ordonner",methode:["Je place d'abord les repères que je connais par cœur : 1715 (début), 1748 (Montesquieu), 1751 (Encyclopédie), 1789 (fin).","Je cherche les liens de cause à conséquence : une condamnation vient avant la réhabilitation, un procès avant le livre qui le dénonce.","Je range le reste entre ces repères, puis je relis la suite comme une histoire : est-elle logique ?"],exemple:{enonce:"Range : « Bougainville arrive à Tahiti » – « Cook débarque à Tahiti » – « Wallis “découvre” Tahiti ».",etapes:[["Je cherche les repères","Cook débarque à Tahiti en 1769 (repère du cours)."],["Je lis les indices","Le document dit que Bougainville arrive « un an » après Wallis, et que l'île avait été « découverte » avant Cook."],["Je range et je relis","Wallis (1767) → Bougainville (1768) → Cook (1769). L'histoire est logique."]],reponse:"1767 Wallis → 1768 Bougainville → 1769 Cook."},exercices:[{id:"r2a",titre:"L'affaire Calas",items:[["1761","Marc-Antoine Calas est retrouvé mort à Toulouse"],["1762","Jean Calas est condamné sans preuve et exécuté"],["1763","Voltaire publie le _Traité sur la tolérance_"],["1765","Jean Calas est reconnu innocent"]]},{id:"r2b",titre:"Le Siècle des Lumières",items:[["1715","Début du Siècle des Lumières"],["1748","Montesquieu publie _De l'esprit des lois_"],["1751","Parution du premier volume de l'Encyclopédie"],["1759","L'Encyclopédie est mise à l'index"],["1769","Cook débarque à Tahiti"],["1788","Malesherbes défend la liberté de la presse"],["1789","Plus de 4 000 livres publiés en France"]]}]},{id:"r3",titre:"Définir une notion",type:"ecrire",methode:["Je commence par « C'est… » suivi de la catégorie : une période, un régime, un lieu, une personne, une idée…","J'ajoute ce qui la caractérise : ce qu'elle a de particulier.","Je termine par un exemple précis du cours (personnage, œuvre, date)."],exemple:{enonce:"Définis : l'absolutisme.",etapes:[["Catégorie","C'est un régime politique…"],["Caractéristique","…dans lequel le roi exerce tous les pouvoirs : il fait les lois, les fait exécuter et rend la justice."],["Exemple","Par exemple, en France, Louis XV est un roi absolu ; Montesquieu critique ce type de pouvoir."]],reponse:"L'absolutisme, c'est un régime politique dans lequel le roi exerce tous les pouvoirs : il fait les lois, les fait exécuter et rend la justice. Par exemple, en France, Louis XV est un roi absolu ; Montesquieu critique ce type de pouvoir."},exercices:[{id:"r3a",q:"Définis : la raison.",modele:"La raison, c'est la capacité d'un individu à comprendre le monde grâce à sa propre intelligence et à sa propre expérience, sans se laisser guider par ses préjugés ou ses croyances. Par exemple, James Cook utilise sa raison quand il vérifie par lui-même que la Terra australis incognita n'existe pas.",k:[{l:"capacité / comprendre",m:["capacite","comprendre"]},{l:"intelligence ou expérience",m:["intelligence","experience"]},{l:"sans préjugés ni croyances",m:["prejuge","croyance"]},{l:"un exemple (Cook, savant…)",m:["cook","green","banks","solander","par exemple"]}]},{id:"r3b",q:"Définis : la société d'ordres.",modele:"La société d'ordres, c'est une société divisée en trois groupes inégaux : le clergé, la noblesse et le tiers état. Par exemple, au XVIIIe siècle, Rousseau critique cette société inégalitaire dans _Émile_ (1762).",k:[{l:"trois groupes / ordres",m:["trois","3 "]},{l:"clergé",m:["clerge"]},{l:"noblesse",m:["noblesse","noble"]},{l:"tiers état",m:["tiers"]},{l:"inégalité",m:["inegal"]}]},{id:"r3c",q:"Définis : un despote éclairé.",modele:"Un despote éclairé, c'est un souverain qui garde un pouvoir absolu mais qui s'intéresse aux idées des Lumières et protège les philosophes. Par exemple, Frédéric II de Prusse accueille Voltaire à sa cour.",k:[{l:"souverain / roi",m:["souverain","roi","monarque"]},{l:"pouvoir absolu",m:["absolu","tous les pouvoirs"]},{l:"intérêt pour les Lumières",m:["lumieres","philosoph"]},{l:"exemple : Frédéric II",m:["frederic"]}]},{id:"r3d",q:"Définis : la censure.",modele:"La censure, c'est l'interdiction totale ou partielle d'une œuvre (livre, journal…) par un pouvoir. Par exemple, au XVIIIe siècle, Malesherbes, directeur de la librairie royale, est chargé de la censure.",k:[{l:"interdiction",m:["interdi"]},{l:"un livre / une œuvre",m:["livre","oeuvre","ouvrage","journal","production"]},{l:"par un pouvoir",m:["pouvoir","roi","autorite","eglise"]},{l:"exemple (Malesherbes, Encyclopédie…)",m:["malesherbes","encyclopedie","index"]}]},{id:"r3e",q:"Définis : un salon.",modele:"Un salon, c'est une réunion régulière, chez un particulier, de personnes cultivées qui lisent et discutent les idées nouvelles ; il est souvent tenu par une femme, la salonnière. Par exemple, le salon de Mme Geoffrin est le plus réputé de France au XVIIIe siècle.",k:[{l:"réunion",m:["reunion","rencontre","se reunissent"]},{l:"chez un particulier / salonnière",m:["particulier","salonniere","chez"]},{l:"lire / discuter",m:["lire","lisent","discut","debat","echang"]},{l:"exemple : Mme Geoffrin",m:["geoffrin"]}]},{id:"r3f",q:"Définis : un philosophe des Lumières.",modele:"Un philosophe des Lumières, c'est un penseur européen du XVIIIe siècle, attaché à la liberté et à l'égalité, qui utilise la raison pour critiquer les institutions de son temps et combattre l'ignorance, l'intolérance et l'arbitraire. Par exemple, Voltaire défend la tolérance dans son _Traité sur la tolérance_ (1763).",k:[{l:"penseur du XVIIIe siècle",m:["xviii","18","penseur"]},{l:"liberté / égalité",m:["liberte","egalite"]},{l:"raison",m:["raison"]},{l:"critique des institutions",m:["critiqu","denonc","institution","combat"]},{l:"exemple de philosophe",m:["voltaire","montesquieu","rousseau","diderot"]}]}]},{id:"r4",titre:"Répondre à une question de cours",type:"ecrire",methode:["Je repère le mot interrogatif : qui ? quand ? que ? pourquoi ? comment ?","Je reprends les mots de la question pour commencer ma réponse (jamais « parce que » ou « oui » tout seul).","J'ajoute l'information précise du cours : nom, date, œuvre, chiffre."],exemple:{enonce:"Qu'a démontré l'expédition de James Cook ?",etapes:[["Mot interrogatif","« Qu'a démontré » : je dois dire ce qui a été prouvé."],["Je reprends la question","« L'expédition de James Cook a démontré que… »"],["J'ajoute la précision","…la Terra australis incognita, ce continent imaginaire placé au sud de la planète, n'existe pas (1769)."]],reponse:"L'expédition de James Cook a démontré que la Terra australis incognita, ce continent imaginaire que les cartes plaçaient au sud de la planète, n'existe pas."},exercices:[{id:"r4a",q:"Qui organise l'expédition de James Cook et dans quel but ?",modele:"C'est la Royal Society, la société savante britannique, qui organise l'expédition de James Cook dans le Pacifique, afin de découvrir la Terra australis incognita et de faire des observations scientifiques.",k:[{l:"Royal Society",m:["royal society"]},{l:"société savante",m:["savant"]},{l:"chercher la Terra australis",m:["terra","australis","continent"]},{l:"observations scientifiques",m:["observ","scientifi","decouv"]}]},{id:"r4b",q:"Que défend Montesquieu dans _De l'esprit des lois_ ?",modele:"Dans _De l'esprit des lois_ (1748), Montesquieu défend la séparation des pouvoirs : le pouvoir de faire les lois, celui de les exécuter et celui de juger doivent être confiés à des personnes différentes pour éviter le despotisme.",k:[{l:"séparation des pouvoirs",m:["separ"]},{l:"les trois pouvoirs",m:["trois","legislati","executi","juger"]},{l:"éviter le despotisme",m:["despot","absolu"]},{l:"date 1748",m:["1748"]}]},{id:"r4c",q:"Pourquoi l'Encyclopédie est-elle mise à l'index en 1759 ?",modele:"L'Encyclopédie est mise à l'index en 1759 par le pape Clément XIII parce que ses auteurs, Diderot et d'Alembert, critiquent la religion et relativisent les miracles attribués à Jésus-Christ.",k:[{l:"le pape (Clément XIII)",m:["pape","clement"]},{l:"critique de la religion",m:["religion","eglise","evangile"]},{l:"les miracles",m:["miracle"]},{l:"Diderot / d'Alembert",m:["diderot","alembert"]}]},{id:"r4d",q:"Que reproche Rousseau aux nobles et au clergé ?",modele:"Rousseau reproche aux nobles et au clergé de vivre dans l'oisiveté, c'est-à-dire sans travailler, grâce au travail des autres. Dans _Émile_ (1762), il écrit que « tout citoyen oisif est un fripon » et que la nature a fait les hommes égaux.",k:[{l:"oisiveté / ne pas travailler",m:["oisi","travaill"]},{l:"fripon / voleur",m:["fripon","vol"]},{l:"égalité / inégalité",m:["egal"]},{l:"_Émile_ (1762)",m:["emile","1762"]}]},{id:"r4e",q:"Comment évolue le nombre de livres publiés en France au XVIIIe siècle ?",modele:"Le nombre de livres publiés en France augmente fortement au XVIIIe siècle : on passe d'environ 1 000 livres par an au début du siècle à plus de 4 000 en 1789, soit quatre fois plus.",k:[{l:"augmente",m:["augment","hausse","plus en plus","multipli"]},{l:"1 000 au début",m:["1000","1 000","mille"]},{l:"plus de 4 000 en 1789",m:["4000","4 000","quatre mille"]}]},{id:"r4f",q:"Qui est Malesherbes et pourquoi son attitude est-elle étonnante ?",modele:"Malesherbes est le directeur de la librairie royale, chargé de la censure. Son attitude est étonnante car il protège pourtant l'Encyclopédie et défend la liberté de la presse dans ses _Mémoires_ (1788).",k:[{l:"chargé de la censure",m:["censure"]},{l:"librairie royale",m:["librairie"]},{l:"défend la liberté de la presse",m:["liberte de la presse","presse"]},{l:"protège l'Encyclopédie",m:["encyclopedie"]}]}]}],$o={methode:[["aff","J'affirme","Je réponds à la question en une phrase qui reprend ses mots.","« X est un savant / philosophe des Lumières car… »"],["exp","J'explique","Je justifie avec une notion du cours (raison, tolérance, égalité…).","« En effet, … » ; « car… » ; « c'est-à-dire… »"],["ill","J'illustre","Je donne un exemple précis : personnage + œuvre ou fait + date.","« Par exemple, en 1763, … »"]],exemple:{q:"En quoi James Cook est-il un savant des Lumières ?",aff:"James Cook est un savant des Lumières car il utilise sa raison pour découvrir le monde.",exp:"En effet, au lieu de croire les préjugés des anciens cartographes, il part vérifier par lui-même si la Terra australis incognita existe, et il ne tire de conclusions que de ce qu'il a observé.",ill:"Par exemple, en 1769, son expédition organisée par la Royal Society atteint Tahiti, cartographie précisément l'archipel et démontre que ce continent imaginaire n'existe pas.",pensee:[["Je lis la question","« En quoi… » = je dois montrer les raisons qui font de Cook un savant des Lumières."],["Je cherche la notion","Savant des Lumières = utilise la raison, veut une connaissance vérifiable (chapitre 1)."],["Je cherche l'exemple","Tahiti, 1769, Royal Society, Terra australis incognita (activité 1, doc. 1)."]]},familles:[{id:"a1",titre:"Compléter un raisonnement",type:"choisir",consigne:"La phrase « J'affirme » est donnée. Choisis la meilleure explication puis le meilleur exemple.",exercices:[{id:"a1a",q:"En quoi Voltaire est-il un philosophe des Lumières ?",aff:"Voltaire est un philosophe des Lumières car il combat l'intolérance religieuse.",exp:[["En effet, il utilise la raison pour dénoncer le fanatisme religieux et défendre la tolérance.",!0,"Oui : la notion (fanatisme / tolérance) justifie l'affirmation."],["En effet, il observe les astres avec un télescope.",!1,"Non : c'est le travail d'un astronome, comme Charles Green."],["En effet, il est très connu en Europe.",!1,"Être célèbre ne prouve pas qu'on est un philosophe des Lumières : il manque une notion du cours."]],ill:[["Par exemple, il aime beaucoup écrire des livres.",!1,"Trop vague : pas de titre, pas de date, pas de fait précis."],["Par exemple, en 1763, dans le _Traité sur la tolérance_, il démontre l'innocence du protestant Jean Calas, condamné sans preuve à Toulouse.",!0,"Oui : œuvre + date + fait précis, en lien avec la tolérance."],["Par exemple, il écrit _De l'esprit des lois_ en 1748.",!1,"Erreur : _De l'esprit des lois_ est de Montesquieu."]]},{id:"a1b",q:"En quoi Montesquieu est-il un philosophe des Lumières ?",aff:"Montesquieu est un philosophe des Lumières car il critique l'absolutisme.",exp:[["En effet, il pense qu'un seul homme ne doit pas détenir tous les pouvoirs, sinon le pouvoir devient un despotisme.",!0,"Oui : tu expliques pourquoi il critique l'absolutisme."],["En effet, il fréquente les salons.",!1,"Cela concerne la diffusion des idées, pas la critique de l'absolutisme."],["En effet, il est contre le roi parce qu'il est méchant.",!1,"Jugement personnel, sans notion du cours."]],ill:[["Par exemple, dans _De l'esprit des lois_ (1748), il distingue le pouvoir de faire les lois, celui de les exécuter et celui de juger, et propose de les séparer.",!0,"Oui : œuvre + date + idée précise."],["Par exemple, il prend l'exemple de Tahiti.",!1,"Hors sujet : Tahiti renvoie à l'expédition de Cook."],["Par exemple, il défend Jean Calas.",!1,"Erreur : c'est Voltaire qui défend Calas."]]},{id:"a1c",q:"En quoi les salons favorisent-ils la diffusion des idées des Lumières ?",aff:"Les salons favorisent la diffusion des idées des Lumières car ce sont des lieux de lecture et de débat.",exp:[["En effet, des personnes cultivées venues de milieux différents s'y réunissent pour lire et discuter les œuvres des philosophes.",!0,"Oui : tu expliques le rôle du salon."],["En effet, on y imprime des livres.",!1,"Non : on imprime les livres dans les imprimeries."],["En effet, on y paie un abonnement pour lire.",!1,"Confusion : c'est le principe du cabinet de lecture."]],ill:[["Par exemple, dans le salon de Mme Geoffrin, on lit les œuvres de Voltaire devant des philosophes, un savant comme Buffon et même le prince de Conti, cousin du roi.",!0,"Oui : lieu précis + personnes précises."],["Par exemple, Voltaire va en Prusse.",!1,"Cet exemple concerne les despotes éclairés, pas les salons."],["Par exemple, il y a beaucoup de monde.",!1,"Trop vague."]]}]},{id:"a2",titre:"Trier les phrases",type:"trier",consigne:"Attribue chaque phrase à sa case : J'affirme, J'explique ou J'illustre.",exercices:[{id:"a2a",q:"En quoi Rousseau est-il un philosophe des Lumières ?",phrases:[["En effet, il pense que la nature a fait les hommes égaux et que chacun doit travailler pour vivre.","exp"],["Par exemple, dans _Émile ou de l'éducation_ (1762), il écrit que « tout citoyen oisif est un fripon », visant implicitement les nobles et le clergé.","ill"],["Rousseau est un philosophe des Lumières car il dénonce l'inégalité de la société d'ordres.","aff"]]},{id:"a2b",q:"En quoi Banks et Solander sont-ils des savants des Lumières ?",phrases:[["Par exemple, pendant le voyage de Cook, ils classent l'arbre à pain et la perruche de Tahiti, que l'illustrateur Sydney Parkinson dessine avec précision.","ill"],["Banks et Solander sont des savants des Lumières car ils étudient la nature par l'observation.","aff"],["En effet, ces naturalistes décrivent et classent les êtres vivants qu'ils voient eux-mêmes, pour produire une connaissance exacte et vérifiable.","exp"]]},{id:"a2c",q:"Montrez que les idées des Lumières séduisent jusqu'aux souverains.",phrases:[["En effet, certains monarques, appelés despotes éclairés, gardent un pouvoir absolu mais s'intéressent aux idées nouvelles et protègent les philosophes.","exp"],["Les idées des Lumières séduisent jusqu'aux souverains européens.","aff"],["Par exemple, Voltaire séjourne à la cour de Frédéric II de Prusse.","ill"]]}]},{id:"a3",titre:"Rédiger avec des aides",type:"ecrire",consigne:"Rédige les trois phrases. Utilise les débuts de phrases et la banque d'idées si tu en as besoin.",exercices:[{id:"a3a",q:"En quoi Charles Green est-il un savant des Lumières ?",aides:{aff:"Charles Green est un savant des Lumières car…",exp:"En effet, …",ill:"Par exemple, pendant l'expédition de Cook, …"},idees:["astronome","transit de Vénus","télescope grégorien","mesure exacte","distance Terre/Vénus-Soleil","connaissance vérifiable"],modele:{aff:"Charles Green est un savant des Lumières car il cherche une connaissance exacte grâce à l'observation et à la mesure.",exp:"En effet, cet astronome utilise des instruments précis pour obtenir des résultats vérifiables, au lieu de se fier aux croyances.",ill:"Par exemple, pendant l'expédition de Cook, il observe le transit de Vénus avec un télescope grégorien, ce qui permet de mesurer avec exactitude la distance qui sépare la Terre et Vénus du Soleil."},k:[{l:"astronome",m:["astronom"]},{l:"observation / mesure",m:["observ","mesur"]},{l:"transit de Vénus",m:["transit","venus"]},{l:"télescope",m:["telescope"]},{l:"distance au Soleil",m:["distance","soleil"]}]},{id:"a3b",q:"En quoi Diderot est-il un philosophe des Lumières ?",aides:{aff:"Diderot est un philosophe des Lumières car…",exp:"En effet, …",ill:"Par exemple, dans l'article « Autorité politique » de l'Encyclopédie, …"},idees:["Encyclopédie (1751-1772)","démocratiser le savoir","rejette la monarchie de droit divin","« Aucun homme n'a reçu de la nature le droit de commander aux autres »","mise à l'index (1759)"],modele:{aff:"Diderot est un philosophe des Lumières car il critique la monarchie de droit divin et veut diffuser le savoir.",exp:"En effet, il pense que le pouvoir d'un roi ne lui vient ni de Dieu ni de la nature, et que les connaissances doivent être accessibles à tous.",ill:"Par exemple, dans l'article « Autorité politique » de l'Encyclopédie (1751-1772), qu'il dirige avec d'Alembert, il écrit qu'« aucun homme n'a reçu de la nature le droit de commander aux autres »."},k:[{l:"Encyclopédie",m:["encyclopedie"]},{l:"droit divin / pouvoir du roi",m:["droit divin","divin","commander","roi"]},{l:"diffuser le savoir",m:["savoir","connaissance"]},{l:"citation ou date",m:["aucun homme","1751","1772"]}]}]},{id:"a4",titre:"Rédiger seul",type:"ecrire",consigne:"Rédige une réponse argumentée complète (affirmer, expliquer, illustrer) sans aide. Compare ensuite avec le modèle.",exercices:[{id:"a4a",q:"Montrez que Rousseau critique la société d'ordres.",modele:{aff:"Rousseau critique la société d'ordres parce qu'il la juge injuste et inégalitaire.",exp:"En effet, cette société divise les hommes en trois ordres inégaux (clergé, noblesse et tiers état), alors que pour lui tous les hommes naissent égaux et doivent travailler pour vivre.",ill:"Par exemple, dans _Émile ou de l'éducation_ (1762), il écrit que « la nature n'a fait ni princes, ni riches, ni grands seigneurs » et que « tout citoyen oisif est un fripon »."},k:[{l:"société d'ordres / trois ordres",m:["ordre"]},{l:"inégalité / égalité",m:["egal"]},{l:"oisiveté / travail",m:["oisi","travail"]},{l:"_Émile_ (1762)",m:["emile","1762"]}]},{id:"a4b",q:"Expliquez pourquoi les idées des Lumières inquiètent les autorités.",modele:{aff:"Les idées des Lumières inquiètent les autorités car elles remettent en cause le pouvoir du roi et celui de l'Église.",exp:"En effet, les philosophes critiquent l'absolutisme, la monarchie de droit divin et le fanatisme religieux : les autorités cherchent donc à contrôler ou à interdire leurs ouvrages par la censure.",ill:"Par exemple, en 1759, le pape Clément XIII met l'Encyclopédie à l'index parce qu'elle relativise les miracles attribués à Jésus-Christ."},k:[{l:"roi / absolutisme",m:["roi","absolu","monarch"]},{l:"Église / religion",m:["eglise","religi","pape"]},{l:"censure / interdiction",m:["censur","interdi","index"]},{l:"exemple précis (Encyclopédie, 1759…)",m:["encyclopedie","1759","calas"]}]},{id:"a4c",q:"En quoi les imprimeries et les cabinets de lecture favorisent-ils la diffusion des Lumières ?",modele:{aff:"Les imprimeries et les cabinets de lecture favorisent la diffusion des Lumières car ils permettent à un plus grand nombre de personnes de lire les œuvres des philosophes.",exp:"En effet, les imprimeries fabriquent de plus en plus de livres, et les cabinets de lecture permettent de les lire sans les acheter, grâce à un abonnement.",ill:"Par exemple, on passe d'environ 1 000 livres publiés par an en France au début du XVIIIe siècle à plus de 4 000 en 1789."},k:[{l:"plus de livres",m:["livre"]},{l:"abonnement / sans acheter",m:["abonnement","achet"]},{l:"plus de lecteurs",m:["lecteur","lire","nombre"]},{l:"chiffres (1 000 → 4 000)",m:["4000","4 000","1000","1 000"]}]},{id:"a4d",q:"Montrez que les idées des Lumières séduisent des personnes très différentes dans la société française.",modele:{aff:"Les idées des Lumières séduisent des personnes très différentes, de toute la société cultivée.",exp:"En effet, des philosophes, des savants, des artistes, des nobles et même des proches du roi lisent et discutent ces idées, en particulier dans les salons.",ill:"Par exemple, dans le salon de Mme Geoffrin, on trouve le savant Buffon, la comédienne Mme Clairon, le duc de Choiseul, ministre de Louis XV, et le prince de Conti, cousin du roi ; même Malesherbes, chargé de la censure, défend la liberté de la presse."},k:[{l:"milieux variés",m:["noble","artiste","savant","comedien","ministre"]},{l:"salon",m:["salon"]},{l:"Mme Geoffrin",m:["geoffrin"]},{l:"proche du roi (Conti, Choiseul)",m:["conti","choiseul","cousin"]},{l:"Malesherbes",m:["malesherbes"]}]}]}]};var Ee={ctx:{lab:"Je contextualise",grp:"J'introduis",court:"Contexte"},def:{lab:"Je définis",grp:"J'introduis",court:"Définition"},prob:{lab:"Je problématise",grp:"J'introduis",court:"Problématique"},aff:{lab:"J'affirme",grp:"J'argumente",court:"Affirmation"},exp:{lab:"J'explique",grp:"J'argumente",court:"Explication"},ill:{lab:"J'illustre",grp:"J'argumente",court:"Illustration"},res:{lab:"Je résume",grp:"Je conclus",court:"Résumé"}},Fr=[{r:"ctx",quoi:"Je situe le sujet dans le temps et dans l'espace.",q:"Quand ? Où ? Dans quelle situation ?",amorce:"Au XVIIIe siècle, en Europe, …"},{r:"def",quoi:"J'explique le sens des mots importants du sujet.",q:"Quels mots du sujet un lecteur pourrait-il ne pas comprendre ?",amorce:"Les philosophes des Lumières sont… / On appelle … "},{r:"prob",quoi:"Je pose la question à laquelle tout mon texte va répondre.",q:"Quelle est la vraie question cachée dans la consigne ?",amorce:"On peut donc se demander comment… / En quoi… ?"},{r:"aff",quoi:"J'annonce l'idée principale du paragraphe en une phrase.",q:"Quelle est mon idée ?",amorce:"Tout d'abord, … / Ensuite, … / Enfin, …"},{r:"exp",quoi:"Je justifie mon idée avec les notions du cours.",q:"Pourquoi est-ce vrai ?",amorce:"En effet, … / car… / c'est-à-dire…"},{r:"ill",quoi:"Je prouve avec un exemple précis : personnage, œuvre ou fait, date.",q:"Qui ? Quoi ? Quand ?",amorce:"Par exemple, en 1763, … / C'est le cas de…"},{r:"res",quoi:"Je rappelle mes idées principales pour répondre à la problématique.",q:"Qu'ai-je démontré ?",amorce:"Ainsi, … / En conclusion, …"}],Qo=["Ne pas faire de tirets ni de liste : on rédige des phrases complètes.","Ne pas commencer un paragraphe par une question.","Sauter une ligne entre l'introduction, chaque argument et la conclusion ; faire un alinéa au début de chaque paragraphe.","Ne pas donner son avis personnel (« je trouve que… ») : on démontre avec le cours.","Toujours un exemple précis : un nom, une œuvre ou un fait, une date.","Viser une vingtaine de lignes environ, puis relire l'orthographe."],vi=[{fn:"Commencer / ajouter",mots:["Tout d'abord","D'abord","Ensuite","De plus","Enfin"]},{fn:"Expliquer",mots:["En effet","car","parce que","c'est-à-dire","c'est pourquoi"]},{fn:"Illustrer",mots:["Par exemple","Ainsi","C'est le cas de","comme le montre"]},{fn:"Opposer",mots:["Mais","Cependant","Pourtant","D'une part… d'autre part"]},{fn:"Conclure",mots:["Ainsi","Donc","En conclusion","Finalement"]}],Bo=[{id:"s1",sujet:"Montrez comment les philosophes des Lumières contestent l'ordre établi et comment leurs idées se diffusent au XVIIIe siècle.",origine:"Sujet classique (manuel Hatier 4e, 2022 ; devoir corrigé du collège Sainte-Geneviève, La Réunion)",analyse:[["Consigne","« Montrez comment » : expliquer en prouvant avec des exemples."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France et Europe."],["Combien d'idées ?","Deux : ils contestent l'ordre établi + leurs idées se diffusent."],["Mots à définir","Philosophes des Lumières ; ordre établi."],["Plan","Argument 1 : la contestation. Argument 2 : la diffusion."]],modele:{ctx:"Au XVIIIe siècle, pendant le Siècle des Lumières (1715-1789), la France est une monarchie absolue dans laquelle l'Église catholique est très puissante et la société est inégalitaire.",def:"Les philosophes des Lumières sont des penseurs attachés à la liberté et à l'égalité, qui utilisent la raison pour critiquer les institutions de leur temps. L'ordre établi désigne l'organisation politique, religieuse et sociale de l'époque.",prob:"On peut donc se demander comment les philosophes des Lumières remettent en cause cet ordre et comment leurs idées se répandent.",args:[{aff:"Tout d'abord, les philosophes des Lumières critiquent le pouvoir absolu du roi, l'intolérance religieuse et l'inégalité de la société d'ordres.",exp:"En effet, au nom de la raison, ils refusent qu'un seul homme possède tous les pouvoirs, ils combattent le fanatisme et ils réclament l'égalité de tous devant la loi.",ill:"Par exemple, Montesquieu défend la séparation des pouvoirs dans _De l'esprit des lois_ (1748), Voltaire prouve l'innocence du protestant Jean Calas dans son _Traité sur la tolérance_ (1763) et Rousseau dénonce l'oisiveté des privilégiés dans _Émile_ (1762)."},{aff:"Ensuite, les idées des Lumières se diffusent largement en France et en Europe.",exp:"En effet, le livre se développe, de nouveaux lieux de lecture et de discussion apparaissent, et des personnes puissantes soutiennent les philosophes.",ill:"Par exemple, plus de 4 000 livres sortent des imprimeries françaises en 1789, les œuvres de Voltaire sont lues dans le salon de Mme Geoffrin, et Voltaire est accueilli à la cour de Frédéric II de Prusse, un despote éclairé."}],res:"Ainsi, les philosophes des Lumières contestent l'absolutisme, le fanatisme religieux et la société d'ordres, et leurs idées, portées par les livres, les salons et des souverains, se répandent dans toute l'Europe cultivée."},reperes:["Montesquieu, De l'esprit des lois (1748) : séparation des pouvoirs","Diderot, Encyclopédie (1751-1772), article « Autorité politique » : rejet du droit divin","Voltaire, Traité sur la tolérance (1763), affaire Calas","Rousseau, Émile (1762) : critique de la société d'ordres","Imprimeries : 1 000 livres/an au début du siècle, plus de 4 000 en 1789 ; cabinets de lecture ; salon de Mme Geoffrin","Despotes éclairés : Voltaire chez Frédéric II de Prusse ; Malesherbes défend la liberté de la presse (1788)"]},{id:"s2",sujet:"Montrez que les savants des Lumières renouvellent la pensée scientifique au XVIIIe siècle.",origine:"Construit à partir de la leçon 1 et de l'activité 1",analyse:[["Consigne","« Montrez que » : prouver l'affirmation avec des arguments et des exemples."],["Qui ?","Les savants des Lumières."],["Quand ? Où ?","XVIIIe siècle, Europe (et le Pacifique pour les expéditions)."],["Combien d'idées ?","Une affirmation à prouver : je choisis deux arguments (la raison ; l'observation et la mesure)."],["Mots à définir","Savants des Lumières (raison)."],["Plan","Argument 1 : la raison contre les préjugés. Argument 2 : observer, mesurer, classer."]],modele:{ctx:"Au XVIIIe siècle, en Europe, la manière d'étudier le monde change profondément : c'est le Siècle des Lumières (1715-1789).",def:"Les savants des Lumières sont des hommes de science qui pensent que tous les hommes sont doués de raison, c'est-à-dire capables de comprendre le monde avec leur intelligence et leur expérience, et non avec leurs préjugés.",prob:"Comment ces savants transforment-ils la façon de produire des connaissances ?",args:[{aff:"Tout d'abord, les savants des Lumières placent la raison au-dessus des préjugés et des croyances.",exp:"En effet, ils refusent de croire une idée sans l'avoir vérifiée : ils veulent une connaissance exacte, universelle et vérifiable, c'est-à-dire scientifique.",ill:"Par exemple, la Royal Society envoie James Cook dans le Pacifique pour vérifier l'existence de la Terra australis incognita ; en 1769, son expédition démontre que ce continent imaginaire n'existe pas."},{aff:"De plus, les savants des Lumières s'appuient sur l'observation, la mesure et la classification.",exp:"En effet, ils étudient directement la nature et le ciel, avec des instruments précis, pour obtenir des résultats que chacun peut contrôler.",ill:"Par exemple, à Tahiti, les naturalistes Banks et Solander classent l'arbre à pain et la perruche de Tahiti, tandis que l'astronome Charles Green observe le transit de Vénus avec un télescope grégorien pour mesurer la distance qui sépare la Terre et Vénus du Soleil."}],res:"Ainsi, en faisant de la raison, de l'observation et de la mesure les bases de leurs recherches, les savants des Lumières renouvellent la pensée scientifique au XVIIIe siècle."},reperes:["Siècle des Lumières 1715-1789 ; primauté de la raison","Connaissance exacte, universelle et vérifiable = scientifique","Royal Society, James Cook, Tahiti 1769, Terra australis incognita n'existe pas","Journal de Cook : ne conclure que sur ce qu'on a vu","Buffon et Linné : classification ; Banks et Solander : arbre à pain, perruche de Tahiti ; Sydney Parkinson","Charles Green : transit de Vénus, télescope grégorien"]},{id:"s3",sujet:"Expliquez en quoi les philosophes des Lumières critiquent l'ordre politique, religieux et social du XVIIIe siècle.",origine:"Construit à partir de la leçon 2 et de l'activité 2 (exemple à trois arguments)",analyse:[["Consigne","« Expliquez en quoi » : donner les raisons et les preuves."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France."],["Combien d'idées ?","Trois : politique, religieux, social → trois arguments."],["Mots à définir","Philosophes des Lumières (l'ordre est détaillé dans le contexte)."],["Plan","Argument 1 : politique. Argument 2 : religion. Argument 3 : société."]],modele:{ctx:"Au XVIIIe siècle, la France de Louis XV est une monarchie absolue de droit divin, dominée par l'Église catholique et organisée en société d'ordres.",def:"Les philosophes des Lumières sont des penseurs qui utilisent la raison pour critiquer les institutions de leur temps et combattre l'ignorance, l'intolérance et l'arbitraire.",prob:"En quoi les philosophes des Lumières remettent-ils en cause le pouvoir, la religion et la société de leur temps ?",args:[{aff:"Tout d'abord, les philosophes des Lumières combattent l'absolutisme.",exp:"En effet, ils estiment qu'un pouvoir sans limite conduit au despotisme et que personne ne tient de Dieu ou de la nature le droit de commander aux autres.",ill:"Par exemple, dans _De l'esprit des lois_ (1748), Montesquieu propose de séparer le pouvoir de faire les lois, celui de les exécuter et celui de juger, tandis que Diderot écrit dans l'Encyclopédie qu'« aucun homme n'a reçu de la nature le droit de commander aux autres »."},{aff:"Ensuite, ils dénoncent le fanatisme religieux et l'intolérance.",exp:"En effet, sans forcément rejeter Dieu, ils critiquent l'Église lorsqu'elle s'oppose à la raison ou provoque des violences contre ceux qui ont une autre croyance.",ill:"Par exemple, en 1763, Voltaire publie le _Traité sur la tolérance_ pour défendre le protestant Jean Calas, condamné et exécuté sans preuve à Toulouse en 1762."},{aff:"Enfin, ils critiquent l'inégalité de la société d'ordres.",exp:"En effet, ils jugent injuste que la société divise les hommes en trois ordres inégaux alors que les hommes naissent égaux ; ils veulent l'égalité de tous devant la loi.",ill:"Par exemple, dans _Émile ou de l'éducation_ (1762), Rousseau écrit que « la nature n'a fait ni princes, ni riches, ni grands seigneurs » et que « tout citoyen oisif est un fripon »."}],res:"Ainsi, les philosophes des Lumières s'en prennent aux trois piliers de l'ordre établi : le pouvoir absolu du roi, l'intolérance religieuse et l'inégalité entre les ordres."},reperes:["Montesquieu, De l'esprit des lois (1748) : séparation des pouvoirs, contre le despotisme","Diderot, article « Autorité politique » : rejet de la monarchie de droit divin","Voltaire, Traité sur la tolérance (1763) ; affaire Calas (1761-1765)","Encyclopédie mise à l'index par Clément XIII (1759)","Rousseau, Émile (1762) : société d'ordres, oisiveté, « fripon »"]},{id:"s4",sujet:"Comment et jusqu'où les idées des Lumières se diffusent-elles au XVIIIe siècle ?",origine:"Problématique de l'activité 3",analyse:[["Consigne","Question directe : « comment » (les moyens) et « jusqu'où » (les milieux touchés)."],["Qui ?","Les idées des Lumières et leurs lecteurs."],["Quand ? Où ?","XVIIIe siècle, France et Europe."],["Combien d'idées ?","Deux : les moyens de diffusion + les milieux touchés."],["Mots à définir","Diffusion."],["Plan","Argument 1 : les moyens. Argument 2 : jusqu'où."]],modele:{ctx:"Au XVIIIe siècle, les philosophes des Lumières veulent faire connaître leurs idées au plus grand nombre et influencer le monde.",def:"La diffusion désigne le fait de répandre des idées auprès de nombreuses personnes.",prob:"On peut se demander par quels moyens les idées des Lumières circulent et jusqu'à quels milieux elles parviennent.",args:[{aff:"Tout d'abord, les idées des Lumières circulent grâce au livre et à de nouveaux lieux de lecture et de discussion.",exp:"En effet, les imprimeries produisent de plus en plus d'ouvrages, et des lieux comme les cabinets de lecture et les salons permettent de lire et de débattre.",ill:"Par exemple, on passe d'environ 1 000 livres publiés par an au début du siècle à plus de 4 000 en 1789, et les œuvres de Voltaire sont lues dans le salon de Mme Geoffrin."},{aff:"Ensuite, ces idées séduisent toute la société cultivée, jusqu'aux sommets du pouvoir.",exp:"En effet, des nobles, des ministres, des artistes, des savants et même des souverains s'intéressent aux Lumières, malgré la censure.",ill:"Par exemple, le prince de Conti, cousin du roi, fréquente le salon de Mme Geoffrin, Malesherbes, pourtant chargé de la censure, défend la liberté de la presse, et Frédéric II de Prusse accueille Voltaire à sa cour."}],res:"Ainsi, grâce aux livres, aux cabinets de lecture et aux salons, les idées des Lumières se diffusent largement et touchent jusqu'à l'entourage du roi et les souverains européens."},reperes:["Imprimeries : environ 1 000 livres/an au début du siècle, plus de 4 000 en 1789","Cabinets de lecture (abonnement)","Salon de Mme Geoffrin : Buffon, Mme Clairon, duc de Choiseul, prince de Conti, Diderot, d'Alembert, Rousseau, Montesquieu ; lecture de Voltaire","Malesherbes, chargé de la censure, défend la liberté de la presse (1788)","Frédéric II de Prusse accueille Voltaire ; Mme de Pompadour protège Diderot","Limites : censure, Encyclopédie mise à l'index (1759)"]},{id:"s5",sujet:"Montrez que le XVIIIe siècle mérite son nom de « Siècle des Lumières ».",origine:"Sujet de synthèse sur toute la séquence",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","Savants et philosophes."],["Quand ? Où ?","1715-1789, Europe."],["Combien d'idées ?","Une affirmation : je prouve que la raison éclaire la science ET la pensée politique."],["Mots à définir","Les « Lumières »."],["Plan","Argument 1 : la raison renouvelle la science. Argument 2 : la raison critique les institutions."]],modele:{ctx:"En Europe, la période qui va de 1715 à 1789 est appelée le « Siècle des Lumières ».",def:"Les « Lumières » désignent la raison, que savants et philosophes veulent utiliser pour éclairer les hommes et chasser l'ignorance et les préjugés.",prob:"Pourquoi peut-on dire que la raison éclaire la pensée européenne au XVIIIe siècle ?",args:[{aff:"Tout d'abord, la raison renouvelle la science.",exp:"En effet, les savants veulent une connaissance exacte, universelle et vérifiable, fondée sur l'observation et non sur les croyances.",ill:"Par exemple, en 1769, l'expédition de James Cook prouve que la Terra australis incognita n'existe pas, et Charles Green observe le transit de Vénus à Tahiti."},{aff:"Ensuite, la raison sert à critiquer les institutions.",exp:"En effet, les philosophes s'appuient sur elle pour combattre l'absolutisme, le fanatisme religieux et les inégalités.",ill:"Par exemple, Montesquieu défend la séparation des pouvoirs en 1748 et Voltaire réclame la tolérance en 1763 après l'affaire Calas."}],res:"Ainsi, parce que la raison guide à la fois les savants et les philosophes, le XVIIIe siècle mérite bien son nom de Siècle des Lumières."},idees:[["La raison doit chasser l'ignorance et les préjugés","ok"],["Connaissance exacte, universelle et vérifiable","ok"],["Cook, Tahiti 1769 : la Terra australis n'existe pas","ok"],["Charles Green et le transit de Vénus","ok"],["Montesquieu, séparation des pouvoirs (1748)","ok"],["Voltaire, _Traité sur la tolérance_ (1763)","ok"],["Christophe Colomb atteint l'Amérique en 1492","intrus"],["Les philosophes critiquent absolutisme, fanatisme, inégalités","ok"]],reperes:["Siècle des Lumières 1715-1789 ; la raison contre les préjugés","Savants : Cook (1769), Green (transit de Vénus), Banks et Solander, Buffon et Linné","Philosophes : Montesquieu (1748), Diderot (Encyclopédie), Voltaire (1763), Rousseau (1762)"]},{id:"s7",sujet:"Montrez que l'expédition de James Cook est une expédition scientifique des Lumières.",origine:"Construit à partir de l'activité 1",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","James Cook et ses compagnons."],["Quand ? Où ?","1769, Tahiti, océan Pacifique."],["Combien d'idées ?","Une affirmation : je choisis deux arguments (vérifier une hypothèse ; observer et mesurer)."],["Mots à définir","Expédition scientifique."],["Plan","Argument 1 : vérifier au lieu de croire. Argument 2 : observer, mesurer, classer."]],modele:{ctx:"Au XVIIIe siècle, les savants européens organisent de grandes expéditions maritimes pour découvrir des terres lointaines.",def:"Une expédition scientifique est un voyage organisé pour observer, mesurer et découvrir, afin de produire des connaissances vérifiables.",prob:"En quoi le voyage de James Cook dans le Pacifique illustre-t-il l'esprit scientifique des Lumières ?",args:[{aff:"Tout d'abord, l'expédition de Cook cherche à vérifier une hypothèse plutôt qu'à croire un préjugé.",exp:"En effet, depuis l'Antiquité, les cartes montrent un continent austral que personne n'a jamais vu, et les savants veulent savoir s'il existe réellement.",ill:"Par exemple, envoyé par la Royal Society, Cook débarque à Tahiti en 1769, cartographie précisément l'archipel, et son expédition démontre que la Terra australis incognita n'existe pas."},{aff:"De plus, les membres de l'expédition observent, mesurent et classent avec rigueur.",exp:"En effet, ils ne tirent de conclusions que de ce qu'ils voient eux-mêmes et utilisent des instruments et des dessins précis.",ill:"Par exemple, Banks et Solander classent l'arbre à pain, Sydney Parkinson dessine les espèces avec précision et Charles Green observe le transit de Vénus avec un télescope grégorien."}],res:"Ainsi, par sa volonté de vérifier, d'observer et de mesurer, l'expédition de James Cook est un modèle d'expédition scientifique des Lumières."},reperes:["Royal Society ; James Cook ; HMS Endeavour ; Tahiti 1769","Terra australis incognita : hypothèse ancienne, démontrée inexistante","Journal de bord : « conjectures », ne conclure que sur ce qu'on a vu (séjour de trois mois)","Banks et Solander (arbre à pain, perruche de Tahiti), Sydney Parkinson (dessins)","Charles Green : transit de Vénus, télescope grégorien"]},{id:"s8",sujet:"Montrez que les philosophes des Lumières combattent l'absolutisme et l'intolérance religieuse.",origine:"Construit à partir de la leçon 2",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France."],["Combien d'idées ?","Deux : l'absolutisme + l'intolérance religieuse."],["Mots à définir","Absolutisme ; intolérance religieuse."],["Plan","Argument 1 : contre l'absolutisme. Argument 2 : contre l'intolérance."]],modele:{ctx:"Au XVIIIe siècle, en France, le roi Louis XV gouverne seul et l'Église catholique joue un rôle très important.",def:"L'absolutisme est un régime où le roi exerce tous les pouvoirs ; l'intolérance religieuse est le refus d'accepter les personnes qui ont une autre croyance.",prob:"Comment les philosophes des Lumières s'opposent-ils au pouvoir absolu du roi et à l'intolérance religieuse ?",args:[{aff:"Tout d'abord, les philosophes des Lumières s'opposent à l'absolutisme.",exp:"En effet, ils pensent que le pouvoir ne vient pas de Dieu et qu'il doit être limité pour éviter le despotisme.",ill:"Par exemple, Montesquieu propose la séparation des pouvoirs dans _De l'esprit des lois_ (1748) et Diderot rejette la monarchie de droit divin dans l'article « Autorité politique » de l'Encyclopédie."},{aff:"Ensuite, les philosophes des Lumières combattent l'intolérance religieuse.",exp:"En effet, ils défendent la tolérance et dénoncent le fanatisme, qui conduit à condamner des innocents.",ill:"Par exemple, après l'exécution du protestant Jean Calas en 1762, Voltaire publie le _Traité sur la tolérance_ (1763), et Calas est reconnu innocent en 1765."}],res:"Ainsi, au nom de la raison et de la liberté, les philosophes des Lumières dénoncent à la fois le pouvoir absolu du roi et le fanatisme religieux."},idees:[["Montesquieu, _De l'esprit des lois_ (1748) : séparer les trois pouvoirs","ok"],["Diderot : « Aucun homme n'a reçu de la nature le droit de commander aux autres »","ok"],["Le pouvoir ne vient pas de Dieu ; il doit être limité","ok"],["Affaire Calas (1761-1765)","ok"],["Voltaire, _Traité sur la tolérance_ (1763)","ok"],["Banks et Solander classent l'arbre à pain","intrus"],["Le fanatisme conduit à condamner des innocents","ok"],["Plus de 4 000 livres publiés en 1789","intrus"]],reperes:["Absolutisme, monarchie de droit divin, despotisme","Montesquieu, De l'esprit des lois (1748) ; Diderot, article « Autorité politique »","Affaire Calas : 1761 mort du fils, 1762 condamnation et exécution, 1763 Traité sur la tolérance, 1765 réhabilitation","Encyclopédie mise à l'index (1759)"]},{id:"s9",sujet:"Montrez que les philosophes des Lumières défendent la liberté et l'égalité.",origine:"Construit à partir des leçons 2 et 3",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France et Europe."],["Combien d'idées ?","Deux : la liberté + l'égalité."],["Mots à définir","Liberté ; égalité."],["Plan","Argument 1 : la liberté. Argument 2 : l'égalité."]],plan:{ctx:["XVIIIe siècle, France","roi avec tous les pouvoirs","société en trois ordres inégaux"],def:["liberté = agir et penser sans être soumis à la volonté d'un autre","égalité = mêmes droits face à la loi"],prob:["« En quoi… se battent-ils pour… ? »"],args:[{aff:["Tout d'abord : défendre la liberté"],exp:["refus du despotisme","liberté de penser, de croire, de s'exprimer"],ill:["Diderot : la liberté, « un présent du ciel » (Encyclopédie)","Voltaire : tolérance (1763)","Malesherbes : liberté de la presse (1788)"]},{aff:["Ensuite : réclamer l'égalité"],exp:["dénoncent la société d'ordres","noblesse, clergé, tiers état : inégaux"],ill:["Rousseau, _Émile_ (1762)","« la nature n'a fait ni princes, ni riches, ni grands seigneurs »"]}],res:["Ainsi : une société plus libre et plus égale","égalité de tous face à la loi"]},modele:{ctx:"Au XVIIIe siècle, en France, le roi possède tous les pouvoirs et la société est divisée en trois ordres inégaux.",def:"La liberté est le droit d'agir et de penser sans être soumis à la volonté d'un autre ; l'égalité signifie que tous les hommes ont les mêmes droits face à la loi.",prob:"En quoi les philosophes des Lumières se battent-ils pour la liberté et l'égalité ?",args:[{aff:"Tout d'abord, les philosophes des Lumières défendent la liberté.",exp:"En effet, ils refusent le despotisme et veulent que chacun puisse penser, croire et s'exprimer librement.",ill:"Par exemple, Diderot affirme dans l'Encyclopédie que la liberté est « un présent du ciel », Voltaire défend la tolérance religieuse dans son _Traité_ de 1763, et Malesherbes défend la liberté de la presse en 1788."},{aff:"Ensuite, ils réclament l'égalité entre les hommes.",exp:"En effet, ils dénoncent la société d'ordres, qui divise les hommes libres en trois catégories inégales : la noblesse, le clergé et le tiers état.",ill:"Par exemple, dans _Émile_ (1762), Rousseau affirme que « la nature n'a fait ni princes, ni riches, ni grands seigneurs » et que chacun doit travailler."}],res:"Ainsi, les philosophes des Lumières veulent une société plus libre et plus égale, où tous les hommes seraient égaux face à la loi."},reperes:["Diderot, Encyclopédie : « La liberté est un présent du ciel » ; rejet du droit de commander","Voltaire, Traité sur la tolérance (1763)","Malesherbes, liberté de la presse (1788)","Société d'ordres : noblesse, clergé, tiers état","Rousseau, Émile (1762)"]},{id:"s10",sujet:"Expliquez pourquoi les idées des Lumières inquiètent les autorités mais séduisent une partie de la société.",origine:"Construit à partir des leçons 2 et 3",analyse:[["Consigne","« Expliquez pourquoi » : donner les causes."],["Qui ?","Les autorités (roi, Église) et la société cultivée."],["Quand ? Où ?","XVIIIe siècle, France."],["Combien d'idées ?","Deux, opposées par « mais » : inquiéter + séduire."],["Mots à définir","Autorités ; censure."],["Plan","Argument 1 : d'une part, elles inquiètent. Argument 2 : d'autre part, elles séduisent."]],plan:{ctx:["XVIIIe siècle","nombreux ouvrages des philosophes","critiques du roi, de l'Église, de la société d'ordres"],def:[
