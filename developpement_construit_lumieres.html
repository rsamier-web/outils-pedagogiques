 mots importants du sujet.",q:"Quels mots du sujet un lecteur pourrait-il ne pas comprendre ?",amorce:"Les philosophes des Lumières sont… / On appelle … "},{r:"prob",quoi:"Je pose la question à laquelle tout mon texte va répondre.",q:"Quelle est la vraie question cachée dans la consigne ?",amorce:"On peut donc se demander comment… / En quoi… ?"},{r:"aff",quoi:"J'annonce l'idée principale du paragraphe en une phrase.",q:"Quelle est mon idée ?",amorce:"Tout d'abord, … / Ensuite, … / Enfin, …"},{r:"exp",quoi:"Je justifie mon idée avec les notions du cours.",q:"Pourquoi est-ce vrai ?",amorce:"En effet, … / car… / c'est-à-dire…"},{r:"ill",quoi:"Je prouve avec un exemple précis : personnage, œuvre ou fait, date.",q:"Qui ? Quoi ? Quand ?",amorce:"Par exemple, en 1763, … / C'est le cas de…"},{r:"res",quoi:"Je rappelle mes idées principales pour répondre à la problématique.",q:"Qu'ai-je démontré ?",amorce:"Ainsi, … / En conclusion, …"}],Nd=["Ne pas faire de tirets ni de liste : on rédige des phrases complètes.","Ne pas commencer un paragraphe par une question.","Sauter une ligne entre l'introduction, chaque argument et la conclusion ; faire un alinéa au début de chaque paragraphe.","Ne pas donner son avis personnel (« je trouve que… ») : on démontre avec le cours.","Toujours un exemple précis : un nom, une œuvre ou un fait, une date.","Viser une vingtaine de lignes environ, puis relire l'orthographe."],ii=[{fn:"Commencer / ajouter",mots:["Tout d'abord","D'abord","Ensuite","De plus","Enfin"]},{fn:"Expliquer",mots:["En effet","car","parce que","c'est-à-dire","c'est pourquoi"]},{fn:"Illustrer",mots:["Par exemple","Ainsi","C'est le cas de","comme le montre"]},{fn:"Opposer",mots:["Mais","Cependant","Pourtant","D'une part… d'autre part"]},{fn:"Conclure",mots:["Ainsi","Donc","En conclusion","Finalement"]}],Mo=[{id:"s1",sujet:"Montrez comment les philosophes des Lumières contestent l'ordre établi et comment leurs idées se diffusent au XVIIIe siècle.",origine:"Sujet classique (manuel Hatier 4e, 2022 ; devoir corrigé du collège Sainte-Geneviève, La Réunion)",analyse:[["Consigne","« Montrez comment » : expliquer en prouvant avec des exemples."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France et Europe."],["Combien d'idées ?","Deux : ils contestent l'ordre établi + leurs idées se diffusent."],["Mots à définir","Philosophes des Lumières ; ordre établi."],["Plan","Argument 1 : la contestation. Argument 2 : la diffusion."]],modele:{ctx:"Au XVIIIe siècle, pendant le Siècle des Lumières (1715-1789), la France est une monarchie absolue dans laquelle l'Église catholique est très puissante et la société est inégalitaire.",def:"Les philosophes des Lumières sont des penseurs attachés à la liberté et à l'égalité, qui utilisent la raison pour critiquer les institutions de leur temps. L'ordre établi désigne l'organisation politique, religieuse et sociale de l'époque.",prob:"On peut donc se demander comment les philosophes des Lumières remettent en cause cet ordre et comment leurs idées se répandent.",args:[{aff:"Tout d'abord, les philosophes des Lumières critiquent le pouvoir absolu du roi, l'intolérance religieuse et l'inégalité de la société d'ordres.",exp:"En effet, au nom de la raison, ils refusent qu'un seul homme possède tous les pouvoirs, ils combattent le fanatisme et ils réclament l'égalité de tous devant la loi.",ill:"Par exemple, Montesquieu défend la séparation des pouvoirs dans _De l'esprit des lois_ (1748), Voltaire prouve l'innocence du protestant Jean Calas dans son _Traité sur la tolérance_ (1763) et Rousseau dénonce l'oisiveté des privilégiés dans _Émile_ (1762)."},{aff:"Ensuite, les idées des Lumières se diffusent largement en France et en Europe.",exp:"En effet, le livre se développe, de nouveaux lieux de lecture et de discussion apparaissent, et des personnes puissantes soutiennent les philosophes.",ill:"Par exemple, plus de 4 000 livres sortent des imprimeries françaises en 1789, les œuvres de Voltaire sont lues dans le salon de Mme Geoffrin, et Voltaire est accueilli à la cour de Frédéric II de Prusse, un despote éclairé."}],res:"Ainsi, les philosophes des Lumières contestent l'absolutisme, le fanatisme religieux et la société d'ordres, et leurs idées, portées par les livres, les salons et des souverains, se répandent dans toute l'Europe cultivée."},reperes:["Montesquieu, De l'esprit des lois (1748) : séparation des pouvoirs","Diderot, Encyclopédie (1751-1772), article « Autorité politique » : rejet du droit divin","Voltaire, Traité sur la tolérance (1763), affaire Calas","Rousseau, Émile (1762) : critique de la société d'ordres","Imprimeries : 1 000 livres/an au début du siècle, plus de 4 000 en 1789 ; cabinets de lecture ; salon de Mme Geoffrin","Despotes éclairés : Voltaire chez Frédéric II de Prusse ; Malesherbes défend la liberté de la presse (1788)"]},{id:"s2",sujet:"Montrez que les savants des Lumières renouvellent la pensée scientifique au XVIIIe siècle.",origine:"Construit à partir de la leçon 1 et de l'activité 1",analyse:[["Consigne","« Montrez que » : prouver l'affirmation avec des arguments et des exemples."],["Qui ?","Les savants des Lumières."],["Quand ? Où ?","XVIIIe siècle, Europe (et le Pacifique pour les expéditions)."],["Combien d'idées ?","Une affirmation à prouver : je choisis deux arguments (la raison ; l'observation et la mesure)."],["Mots à définir","Savants des Lumières (raison)."],["Plan","Argument 1 : la raison contre les préjugés. Argument 2 : observer, mesurer, classer."]],modele:{ctx:"Au XVIIIe siècle, en Europe, la manière d'étudier le monde change profondément : c'est le Siècle des Lumières (1715-1789).",def:"Les savants des Lumières sont des hommes de science qui pensent que tous les hommes sont doués de raison, c'est-à-dire capables de comprendre le monde avec leur intelligence et leur expérience, et non avec leurs préjugés.",prob:"Comment ces savants transforment-ils la façon de produire des connaissances ?",args:[{aff:"Tout d'abord, les savants des Lumières placent la raison au-dessus des préjugés et des croyances.",exp:"En effet, ils refusent de croire une idée sans l'avoir vérifiée : ils veulent une connaissance exacte, universelle et vérifiable, c'est-à-dire scientifique.",ill:"Par exemple, la Royal Society envoie James Cook dans le Pacifique pour vérifier l'existence de la Terra australis incognita ; en 1769, son expédition démontre que ce continent imaginaire n'existe pas."},{aff:"De plus, les savants des Lumières s'appuient sur l'observation, la mesure et la classification.",exp:"En effet, ils étudient directement la nature et le ciel, avec des instruments précis, pour obtenir des résultats que chacun peut contrôler.",ill:"Par exemple, à Tahiti, les naturalistes Banks et Solander classent l'arbre à pain et la perruche de Tahiti, tandis que l'astronome Charles Green observe le transit de Vénus avec un télescope grégorien pour mesurer la distance qui sépare la Terre et Vénus du Soleil."}],res:"Ainsi, en faisant de la raison, de l'observation et de la mesure les bases de leurs recherches, les savants des Lumières renouvellent la pensée scientifique au XVIIIe siècle."},reperes:["Siècle des Lumières 1715-1789 ; primauté de la raison","Connaissance exacte, universelle et vérifiable = scientifique","Royal Society, James Cook, Tahiti 1769, Terra australis incognita n'existe pas","Journal de Cook : ne conclure que sur ce qu'on a vu","Buffon et Linné : classification ; Banks et Solander : arbre à pain, perruche de Tahiti ; Sydney Parkinson","Charles Green : transit de Vénus, télescope grégorien"]},{id:"s3",sujet:"Expliquez en quoi les philosophes des Lumières critiquent l'ordre politique, religieux et social du XVIIIe siècle.",origine:"Construit à partir de la leçon 2 et de l'activité 2 (exemple à trois arguments)",analyse:[["Consigne","« Expliquez en quoi » : donner les raisons et les preuves."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France."],["Combien d'idées ?","Trois : politique, religieux, social → trois arguments."],["Mots à définir","Philosophes des Lumières (l'ordre est détaillé dans le contexte)."],["Plan","Argument 1 : politique. Argument 2 : religion. Argument 3 : société."]],modele:{ctx:"Au XVIIIe siècle, la France de Louis XV est une monarchie absolue de droit divin, dominée par l'Église catholique et organisée en société d'ordres.",def:"Les philosophes des Lumières sont des penseurs qui utilisent la raison pour critiquer les institutions de leur temps et combattre l'ignorance, l'intolérance et l'arbitraire.",prob:"En quoi les philosophes des Lumières remettent-ils en cause le pouvoir, la religion et la société de leur temps ?",args:[{aff:"Tout d'abord, les philosophes des Lumières combattent l'absolutisme.",exp:"En effet, ils estiment qu'un pouvoir sans limite conduit au despotisme et que personne ne tient de Dieu ou de la nature le droit de commander aux autres.",ill:"Par exemple, dans _De l'esprit des lois_ (1748), Montesquieu propose de séparer le pouvoir de faire les lois, celui de les exécuter et celui de juger, tandis que Diderot écrit dans l'Encyclopédie qu'« aucun homme n'a reçu de la nature le droit de commander aux autres »."},{aff:"Ensuite, ils dénoncent le fanatisme religieux et l'intolérance.",exp:"En effet, sans forcément rejeter Dieu, ils critiquent l'Église lorsqu'elle s'oppose à la raison ou provoque des violences contre ceux qui ont une autre croyance.",ill:"Par exemple, en 1763, Voltaire publie le _Traité sur la tolérance_ pour défendre le protestant Jean Calas, condamné et exécuté sans preuve à Toulouse en 1762."},{aff:"Enfin, ils critiquent l'inégalité de la société d'ordres.",exp:"En effet, ils jugent injuste que la société divise les hommes en trois ordres inégaux alors que les hommes naissent égaux ; ils veulent l'égalité de tous devant la loi.",ill:"Par exemple, dans _Émile ou de l'éducation_ (1762), Rousseau écrit que « la nature n'a fait ni princes, ni riches, ni grands seigneurs » et que « tout citoyen oisif est un fripon »."}],res:"Ainsi, les philosophes des Lumières s'en prennent aux trois piliers de l'ordre établi : le pouvoir absolu du roi, l'intolérance religieuse et l'inégalité entre les ordres."},reperes:["Montesquieu, De l'esprit des lois (1748) : séparation des pouvoirs, contre le despotisme","Diderot, article « Autorité politique » : rejet de la monarchie de droit divin","Voltaire, Traité sur la tolérance (1763) ; affaire Calas (1761-1765)","Encyclopédie mise à l'index par Clément XIII (1759)","Rousseau, Émile (1762) : société d'ordres, oisiveté, « fripon »"]},{id:"s4",sujet:"Comment et jusqu'où les idées des Lumières se diffusent-elles au XVIIIe siècle ?",origine:"Problématique de l'activité 3",analyse:[["Consigne","Question directe : « comment » (les moyens) et « jusqu'où » (les milieux touchés)."],["Qui ?","Les idées des Lumières et leurs lecteurs."],["Quand ? Où ?","XVIIIe siècle, France et Europe."],["Combien d'idées ?","Deux : les moyens de diffusion + les milieux touchés."],["Mots à définir","Diffusion."],["Plan","Argument 1 : les moyens. Argument 2 : jusqu'où."]],modele:{ctx:"Au XVIIIe siècle, les philosophes des Lumières veulent faire connaître leurs idées au plus grand nombre et influencer le monde.",def:"La diffusion désigne le fait de répandre des idées auprès de nombreuses personnes.",prob:"On peut se demander par quels moyens les idées des Lumières circulent et jusqu'à quels milieux elles parviennent.",args:[{aff:"Tout d'abord, les idées des Lumières circulent grâce au livre et à de nouveaux lieux de lecture et de discussion.",exp:"En effet, les imprimeries produisent de plus en plus d'ouvrages, et des lieux comme les cabinets de lecture et les salons permettent de lire et de débattre.",ill:"Par exemple, on passe d'environ 1 000 livres publiés par an au début du siècle à plus de 4 000 en 1789, et les œuvres de Voltaire sont lues dans le salon de Mme Geoffrin."},{aff:"Ensuite, ces idées séduisent toute la société cultivée, jusqu'aux sommets du pouvoir.",exp:"En effet, des nobles, des ministres, des artistes, des savants et même des souverains s'intéressent aux Lumières, malgré la censure.",ill:"Par exemple, le prince de Conti, cousin du roi, fréquente le salon de Mme Geoffrin, Malesherbes, pourtant chargé de la censure, défend la liberté de la presse, et Frédéric II de Prusse accueille Voltaire à sa cour."}],res:"Ainsi, grâce aux livres, aux cabinets de lecture et aux salons, les idées des Lumières se diffusent largement et touchent jusqu'à l'entourage du roi et les souverains européens."},reperes:["Imprimeries : environ 1 000 livres/an au début du siècle, plus de 4 000 en 1789","Cabinets de lecture (abonnement)","Salon de Mme Geoffrin : Buffon, Mme Clairon, duc de Choiseul, prince de Conti, Diderot, d'Alembert, Rousseau, Montesquieu ; lecture de Voltaire","Malesherbes, chargé de la censure, défend la liberté de la presse (1788)","Frédéric II de Prusse accueille Voltaire ; Mme de Pompadour protège Diderot","Limites : censure, Encyclopédie mise à l'index (1759)"]},{id:"s5",sujet:"Montrez que le XVIIIe siècle mérite son nom de « Siècle des Lumières ».",origine:"Sujet de synthèse sur toute la séquence",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","Savants et philosophes."],["Quand ? Où ?","1715-1789, Europe."],["Combien d'idées ?","Une affirmation : je prouve que la raison éclaire la science ET la pensée politique."],["Mots à définir","Les « Lumières »."],["Plan","Argument 1 : la raison renouvelle la science. Argument 2 : la raison critique les institutions."]],modele:{ctx:"En Europe, la période qui va de 1715 à 1789 est appelée le « Siècle des Lumières ».",def:"Les « Lumières » désignent la raison, que savants et philosophes veulent utiliser pour éclairer les hommes et chasser l'ignorance et les préjugés.",prob:"Pourquoi peut-on dire que la raison éclaire la pensée européenne au XVIIIe siècle ?",args:[{aff:"Tout d'abord, la raison renouvelle la science.",exp:"En effet, les savants veulent une connaissance exacte, universelle et vérifiable, fondée sur l'observation et non sur les croyances.",ill:"Par exemple, en 1769, l'expédition de James Cook prouve que la Terra australis incognita n'existe pas, et Charles Green observe le transit de Vénus à Tahiti."},{aff:"Ensuite, la raison sert à critiquer les institutions.",exp:"En effet, les philosophes s'appuient sur elle pour combattre l'absolutisme, le fanatisme religieux et les inégalités.",ill:"Par exemple, Montesquieu défend la séparation des pouvoirs en 1748 et Voltaire réclame la tolérance en 1763 après l'affaire Calas."}],res:"Ainsi, parce que la raison guide à la fois les savants et les philosophes, le XVIIIe siècle mérite bien son nom de Siècle des Lumières."},idees:[["La raison doit chasser l'ignorance et les préjugés","ok"],["Connaissance exacte, universelle et vérifiable","ok"],["Cook, Tahiti 1769 : la Terra australis n'existe pas","ok"],["Charles Green et le transit de Vénus","ok"],["Montesquieu, séparation des pouvoirs (1748)","ok"],["Voltaire, _Traité sur la tolérance_ (1763)","ok"],["Christophe Colomb atteint l'Amérique en 1492","intrus"],["Les philosophes critiquent absolutisme, fanatisme, inégalités","ok"]],reperes:["Siècle des Lumières 1715-1789 ; la raison contre les préjugés","Savants : Cook (1769), Green (transit de Vénus), Banks et Solander, Buffon et Linné","Philosophes : Montesquieu (1748), Diderot (Encyclopédie), Voltaire (1763), Rousseau (1762)"]},{id:"s7",sujet:"Montrez que l'expédition de James Cook est une expédition scientifique des Lumières.",origine:"Construit à partir de l'activité 1",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","James Cook et ses compagnons."],["Quand ? Où ?","1769, Tahiti, océan Pacifique."],["Combien d'idées ?","Une affirmation : je choisis deux arguments (vérifier une hypothèse ; observer et mesurer)."],["Mots à définir","Expédition scientifique."],["Plan","Argument 1 : vérifier au lieu de croire. Argument 2 : observer, mesurer, classer."]],modele:{ctx:"Au XVIIIe siècle, les savants européens organisent de grandes expéditions maritimes pour découvrir des terres lointaines.",def:"Une expédition scientifique est un voyage organisé pour observer, mesurer et découvrir, afin de produire des connaissances vérifiables.",prob:"En quoi le voyage de James Cook dans le Pacifique illustre-t-il l'esprit scientifique des Lumières ?",args:[{aff:"Tout d'abord, l'expédition de Cook cherche à vérifier une hypothèse plutôt qu'à croire un préjugé.",exp:"En effet, depuis l'Antiquité, les cartes montrent un continent austral que personne n'a jamais vu, et les savants veulent savoir s'il existe réellement.",ill:"Par exemple, envoyé par la Royal Society, Cook débarque à Tahiti en 1769, cartographie précisément l'archipel, et son expédition démontre que la Terra australis incognita n'existe pas."},{aff:"De plus, les membres de l'expédition observent, mesurent et classent avec rigueur.",exp:"En effet, ils ne tirent de conclusions que de ce qu'ils voient eux-mêmes et utilisent des instruments et des dessins précis.",ill:"Par exemple, Banks et Solander classent l'arbre à pain, Sydney Parkinson dessine les espèces avec précision et Charles Green observe le transit de Vénus avec un télescope grégorien."}],res:"Ainsi, par sa volonté de vérifier, d'observer et de mesurer, l'expédition de James Cook est un modèle d'expédition scientifique des Lumières."},reperes:["Royal Society ; James Cook ; HMS Endeavour ; Tahiti 1769","Terra australis incognita : hypothèse ancienne, démontrée inexistante","Journal de bord : « conjectures », ne conclure que sur ce qu'on a vu (séjour de trois mois)","Banks et Solander (arbre à pain, perruche de Tahiti), Sydney Parkinson (dessins)","Charles Green : transit de Vénus, télescope grégorien"]},{id:"s8",sujet:"Montrez que les philosophes des Lumières combattent l'absolutisme et l'intolérance religieuse.",origine:"Construit à partir de la leçon 2",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France."],["Combien d'idées ?","Deux : l'absolutisme + l'intolérance religieuse."],["Mots à définir","Absolutisme ; intolérance religieuse."],["Plan","Argument 1 : contre l'absolutisme. Argument 2 : contre l'intolérance."]],modele:{ctx:"Au XVIIIe siècle, en France, le roi Louis XV gouverne seul et l'Église catholique joue un rôle très important.",def:"L'absolutisme est un régime où le roi exerce tous les pouvoirs ; l'intolérance religieuse est le refus d'accepter les personnes qui ont une autre croyance.",prob:"Comment les philosophes des Lumières s'opposent-ils au pouvoir absolu du roi et à l'intolérance religieuse ?",args:[{aff:"Tout d'abord, les philosophes des Lumières s'opposent à l'absolutisme.",exp:"En effet, ils pensent que le pouvoir ne vient pas de Dieu et qu'il doit être limité pour éviter le despotisme.",ill:"Par exemple, Montesquieu propose la séparation des pouvoirs dans _De l'esprit des lois_ (1748) et Diderot rejette la monarchie de droit divin dans l'article « Autorité politique » de l'Encyclopédie."},{aff:"Ensuite, les philosophes des Lumières combattent l'intolérance religieuse.",exp:"En effet, ils défendent la tolérance et dénoncent le fanatisme, qui conduit à condamner des innocents.",ill:"Par exemple, après l'exécution du protestant Jean Calas en 1762, Voltaire publie le _Traité sur la tolérance_ (1763), et Calas est reconnu innocent en 1765."}],res:"Ainsi, au nom de la raison et de la liberté, les philosophes des Lumières dénoncent à la fois le pouvoir absolu du roi et le fanatisme religieux."},idees:[["Montesquieu, _De l'esprit des lois_ (1748) : séparer les trois pouvoirs","ok"],["Diderot : « Aucun homme n'a reçu de la nature le droit de commander aux autres »","ok"],["Le pouvoir ne vient pas de Dieu ; il doit être limité","ok"],["Affaire Calas (1761-1765)","ok"],["Voltaire, _Traité sur la tolérance_ (1763)","ok"],["Banks et Solander classent l'arbre à pain","intrus"],["Le fanatisme conduit à condamner des innocents","ok"],["Plus de 4 000 livres publiés en 1789","intrus"]],reperes:["Absolutisme, monarchie de droit divin, despotisme","Montesquieu, De l'esprit des lois (1748) ; Diderot, article « Autorité politique »","Affaire Calas : 1761 mort du fils, 1762 condamnation et exécution, 1763 Traité sur la tolérance, 1765 réhabilitation","Encyclopédie mise à l'index (1759)"]},{id:"s9",sujet:"Montrez que les philosophes des Lumières défendent la liberté et l'égalité.",origine:"Construit à partir des leçons 2 et 3",analyse:[["Consigne","« Montrez que » : prouver."],["Qui ?","Les philosophes des Lumières."],["Quand ? Où ?","XVIIIe siècle, France et Europe."],["Combien d'idées ?","Deux : la liberté + l'égalité."],["Mots à définir","Liberté ; égalité."],["Plan","Argument 1 : la liberté. Argument 2 : l'égalité."]],plan:{ctx:["XVIIIe siècle, France","roi avec tous les pouvoirs","société en trois ordres inégaux"],def:["liberté = agir et penser sans être soumis à la volonté d'un autre","égalité = mêmes droits face à la loi"],prob:["« En quoi… se battent-ils pour… ? »"],args:[{aff:["Tout d'abord : défendre la liberté"],exp:["refus du despotisme","liberté de penser, de croire, de s'exprimer"],ill:["Diderot : la liberté, « un présent du ciel » (Encyclopédie)","Voltaire : tolérance (1763)","Malesherbes : liberté de la presse (1788)"]},{aff:["Ensuite : réclamer l'égalité"],exp:["dénoncent la société d'ordres","noblesse, clergé, tiers état : inégaux"],ill:["Rousseau, _Émile_ (1762)","« la nature n'a fait ni princes, ni riches, ni grands seigneurs »"]}],res:["Ainsi : une société plus libre et plus égale","égalité de tous face à la loi"]},modele:{ctx:"Au XVIIIe siècle, en France, le roi possède tous les pouvoirs et la société est divisée en trois ordres inégaux.",def:"La liberté est le droit d'agir et de penser sans être soumis à la volonté d'un autre ; l'égalité signifie que tous les hommes ont les mêmes droits face à la loi.",prob:"En quoi les philosophes des Lumières se battent-ils pour la liberté et l'égalité ?",args:[{aff:"Tout d'abord, les philosophes des Lumières défendent la liberté.",exp:"En effet, ils refusent le despotisme et veulent que chacun puisse penser, croire et s'exprimer librement.",ill:"Par exemple, Diderot affirme dans l'Encyclopédie que la liberté est « un présent du ciel », Voltaire défend la tolérance religieuse dans son _Traité_ de 1763, et Malesherbes défend la liberté de la presse en 1788."},{aff:"Ensuite, ils réclament l'égalité entre les hommes.",exp:"En effet, ils dénoncent la société d'ordres, qui divise les hommes libres en trois catégories inégales : la noblesse, le clergé et le tiers état.",ill:"Par exemple, dans _Émile_ (1762), Rousseau affirme que « la nature n'a fait ni princes, ni riches, ni grands seigneurs » et que chacun doit travailler."}],res:"Ainsi, les philosophes des Lumières veulent une société plus libre et plus égale, où tous les hommes seraient égaux face à la loi."},reperes:["Diderot, Encyclopédie : « La liberté est un présent du ciel » ; rejet du droit de commander","Voltaire, Traité sur la tolérance (1763)","Malesherbes, liberté de la presse (1788)","Société d'ordres : noblesse, clergé, tiers état","Rousseau, Émile (1762)"]},{id:"s10",sujet:"Expliquez pourquoi les idées des Lumières inquiètent les autorités mais séduisent une partie de la société.",origine:"Construit à partir des leçons 2 et 3",analyse:[["Consigne","« Expliquez pourquoi » : donner les causes."],["Qui ?","Les autorités (roi, Église) et la société cultivée."],["Quand ? Où ?","XVIIIe siècle, France."],["Combien d'idées ?","Deux, opposées par « mais » : inquiéter + séduire."],["Mots à définir","Autorités ; censure."],["Plan","Argument 1 : d'une part, elles inquiètent. Argument 2 : d'autre part, elles séduisent."]],plan:{ctx:["XVIIIe siècle","nombreux ouvrages des philosophes","critiques du roi, de l'Église, de la société d'ordres"],def:["autorités = roi, Église, juges","censure = interdiction d'une œuvre par un pouvoir"],prob:["« Pourquoi… à la fois combattues… et accueillies… ? »"],args:[{aff:["D'une part : les idées inquiètent les autorités"],exp:["remettent en cause le pouvoir du roi et l'autorité de l'Église","les autorités veulent les interdire"],ill:["1759 : Clément XIII met l'Encyclopédie à l'index (miracles relativisés)","censure royale"]},{aff:["D'autre part : elles séduisent la société cultivée"],exp:["nobles, artistes, savants, proches du roi lisent et protègent"],ill:["prince de Conti chez Mme Geoffrin","Mme de Pompadour protège Diderot","Malesherbes (censure) défend la liberté de la presse"]}],res:["Ainsi : surveillées et censurées","mais séduisent l'élite jusque dans l'entourage du roi"]},modele:{ctx:"Au XVIIIe siècle, les philosophes des Lumières publient de nombreux ouvrages qui critiquent le roi, l'Église et la société d'ordres.",def:"Les autorités sont ceux qui détiennent le pouvoir : le roi, l'Église et les juges. La censure est l'interdiction totale ou partielle d'une œuvre par un pouvoir.",prob:"Pourquoi les idées des Lumières sont-elles à la fois combattues par les autorités et accueillies avec enthousiasme par une partie de la société ?",args:[{aff:"D'une part, les idées des Lumières inquiètent les autorités.",exp:"En effet, elles remettent en cause le pouvoir du roi et l'autorité de l'Église, si bien que les autorités cherchent à les interdire.",ill:"Par exemple, en 1759, le pape Clément XIII met l'Encyclopédie à l'index parce qu'elle relativise les miracles attribués à Jésus-Christ, et les livres doivent passer par la censure royale."},{aff:"D'autre part, ces idées séduisent une partie de la société cultivée.",exp:"En effet, des nobles, des artistes, des savants et même des proches du roi lisent et discutent les œuvres des philosophes, et parfois les protègent.",ill:"Par exemple, le prince de Conti, cousin du roi, assiste à la lecture des œuvres de Voltaire chez Mme Geoffrin, Mme de Pompadour protège Diderot, et Malesherbes, pourtant chargé de la censure, défend la liberté de la presse."}],res:"Ainsi, parce qu'elles critiquent l'ordre établi, les idées des Lumières sont surveillées et censurées, mais elles séduisent une partie de l'élite, jusque dans l'entourage du roi."},reperes:["Critiques : absolutisme, droit divin, fanatisme, société d'ordres","Censure ; Encyclopédie mise à l'index par Clément XIII (1759)","Salon de Mme Geoffrin : prince de Conti, duc de Choiseul, Mme Clairon, Buffon","Mme de Pompadour protège Diderot ; Frédéric II accueille Voltaire","Malesherbes, chargé de la censure, défend la liberté de la presse (1788)"]}],te=e=>Mo.find(t=>t.id===e),wd=[{id:"an1",sujet:"s2",qs:[{q:"Que demande la consigne « Montrez que » ?",o:["Raconter une histoire","Prouver une affirmation avec des arguments et des exemples","Donner son avis personnel"],r:1,x:"« Montrez que » : l'affirmation est vraie, je dois la prouver."},{q:"Quelle est la période du sujet ?",o:["Le XVIe siècle","Le XVIIIe siècle (1715-1789)","La Révolution (1789-1799)"],r:1,x:"« Au XVIIIe siècle » : le Siècle des Lumières."},{q:"Quel personnage sera le plus utile ?",o:["James Cook","Voltaire","Rousseau"],r:0,x:"Le sujet porte sur les savants : Cook et ses compagnons (chapitre 1)."}]},{id:"an2",sujet:"s8",qs:[{q:"Combien d'idées le sujet contient-il ?",o:["Une seule","Deux : l'absolutisme et l'intolérance religieuse","Trois"],r:1,x:"Le mot « et » relie deux idées : deux arguments."},{q:"Quels mots dois-je définir ?",o:["Absolutisme et intolérance religieuse","Savant et raison","Salon et censure"],r:0,x:"Ce sont les mots-clés du sujet."},{q:"Quel exemple serait hors sujet ?",o:["Montesquieu et la séparation des pouvoirs","Voltaire et l'affaire Calas","Banks et Solander à Tahiti"],r:2,x:"Banks et Solander sont des savants : ils ne parlent ni d'absolutisme ni d'intolérance."}]},{id:"an3",sujet:"s4",qs:[{q:"Le mot « comment » invite à expliquer…",o:["les moyens de la diffusion","les dates de naissance des philosophes","l'avis du roi"],r:0,x:"Comment = par quels moyens : livres, cabinets de lecture, salons."},{q:"Le mot « jusqu'où » invite à montrer…",o:["la distance entre Paris et Berlin","quels milieux sont touchés par les idées","jusqu'à quelle date vit Voltaire"],r:1,x:"Jusqu'où = jusqu'à quelles personnes : nobles, ministres, cousin du roi, souverains."},{q:"Quel plan convient ?",o:["1. Les savants 2. Les philosophes","1. Les moyens de diffusion 2. Les milieux touchés","1. Voltaire 2. Rousseau"],r:1,x:"Le plan suit les deux mots interrogatifs du sujet."}]}],Ld=[{id:"in1",role:"ctx",sujet:"s2",q:"Quelle est la meilleure phrase pour contextualiser ?",o:[["Les Lumières, c'est très important dans l'histoire.","Pas de date, pas de lieu, et un langage trop familier."],["Au XVIIIe siècle, pendant le Siècle des Lumières (1715-1789), des savants européens transforment la manière d'étudier le monde.","Oui : quand (XVIIIe siècle, 1715-1789), où (Europe), quoi (les savants)."],["En 1789, la Révolution française éclate.","Hors sujet : 1789 est la fin de la période, et la phrase ne parle pas des savants."]],r:1},{id:"in2",role:"def",sujet:"s1",q:"Quelle est la meilleure définition de « l'ordre établi » ?",o:[["L'ordre établi, c'est quand tout est bien rangé.","Ce n'est pas le sens historique du mot."],["L'ordre établi désigne le clergé.","Incomplet : le clergé n'est qu'une partie de l'ordre établi."],["L'ordre établi désigne l'organisation politique, religieuse et sociale de l'époque : la monarchie absolue, la puissance de l'Église et la société d'ordres.","Oui : la définition est complète et précise."]],r:2},{id:"in3",role:"prob",sujet:"s4",q:"Quelle est la meilleure problématique ?",o:[["Les idées se diffusent grâce aux livres.","C'est une réponse, pas une question : on la garde pour un argument."],["On peut se demander par quels moyens les idées des Lumières se répandent et jusqu'à quels milieux elles parviennent.","Oui : elle reprend les deux parties du sujet (comment + jusqu'où)."],["Qui était Voltaire ?","Trop étroite : elle ne couvre qu'un personnage."]],r:1},{id:"in4",role:"ctx",sujet:"s8",q:"Quelle est la meilleure phrase pour contextualiser ?",o:[["Au XVIIIe siècle, en France, le roi Louis XV gouverne seul et l'Église catholique joue un rôle très important.","Oui : date, lieu, et la situation que les philosophes vont critiquer."],["Montesquieu est né en 1689.","Trop précis pour un contexte : c'est un détail biographique."],["Je vais parler des philosophes.","On n'écrit pas « je vais parler » : on entre directement dans le sujet."]],r:0}],bd=[{id:"cl1",titre:"Les savants des Lumières",texte:"[[Tout d'abord|Par exemple|Pourtant]], les savants des Lumières placent la raison au-dessus des préjugés. [[En effet|Enfin|Mais]], ils refusent de croire une idée sans l'avoir vérifiée. [[Par exemple|Cependant|Donc]], l'expédition de James Cook démontre en 1769 que la Terra australis incognita n'existe pas. [[De plus|Pourtant|C'est-à-dire]], ils observent, mesurent et classent le vivant. [[Ainsi|Car|Par exemple]], ils renouvellent la pensée scientifique."},{id:"cl2",titre:"La diffusion des idées",texte:"Les idées des Lumières séduisent toute la société cultivée, [[car|mais|donc]] elles sont discutées dans les salons. [[Par exemple|Enfin|En conclusion]], le prince de Conti, cousin du roi, fréquente le salon de Mme Geoffrin. Malesherbes est chargé de la censure. [[Pourtant|De plus|Par exemple]], il défend la liberté de la presse. [[Cependant|Ainsi|Tout d'abord]], l'Encyclopédie est mise à l'index en 1759 : la diffusion a des limites."}],li={id:"bl1",sujet:"s8",phrases:[["En effet, ils défendent la tolérance et dénoncent le fanatisme, qui conduit à condamner des innocents.","2-exp"],["Tout d'abord, les philosophes des Lumières s'opposent à l'absolutisme.","1-aff"],["Par exemple, après l'exécution du protestant Jean Calas en 1762, Voltaire publie le _Traité sur la tolérance_ (1763).","2-ill"],["En effet, ils pensent que le pouvoir ne vient pas de Dieu et qu'il doit être limité pour éviter le despotisme.","1-exp"],["Ensuite, les philosophes des Lumières combattent l'intolérance religieuse.","2-aff"],["Par exemple, Montesquieu propose la séparation des pouvoirs dans _De l'esprit des lois_ (1748).","1-ill"]]},Id=[{id:"co1",sujet:"s2",q:"Quelle est la meilleure conclusion ?",o:[["Pour conclure, j'ai bien aimé ce sujet sur les savants.","Avis personnel : la conclusion ne résume rien."],["Ainsi, Cook a découvert Tahiti en 1769.","Un seul exemple, qui oublie l'idée générale… et c'est faux : Wallis avait atteint Tahiti en 1767 !"],["Ainsi, en faisant de la raison, de l'observation et de la mesure les bases de leurs recherches, les savants des Lumières renouvellent la pensée scientifique.","Oui : elle reprend les deux arguments et répond au sujet."]],r:2},{id:"co2",sujet:"s4",q:"Quelle est la meilleure conclusion ?",o:[["Ainsi, grâce aux livres, aux cabinets de lecture et aux salons, les idées des Lumières se diffusent largement et touchent jusqu'à l'entourage du roi et les souverains européens.","Oui : elle répond au « comment » et au « jusqu'où »."],["Ainsi, les livres sont importants.","Trop vague, et oublie le « jusqu'où »."],["En conclusion, Mme Geoffrin est née en 1699 et morte en 1777.","Un détail qui ne résume pas les idées."]],r:0}],ht=[{id:"d1",n:1,titre:"Découvrir la grille",court:"La grille"},{id:"d2",n:2,titre:"Analyser le sujet",court:"Analyser"},{id:"d3",n:3,titre:"Réussir l'introduction",court:"Introduire"},{id:"d4",n:4,titre:"Construire un argument",court:"Argumenter"},{id:"d5",n:5,titre:"Conclure",court:"Conclure"},{id:"d6",n:6,titre:"Exemples résolus complets",court:"Exemples résolus"},{id:"d7",n:7,titre:"Remettre dans l'ordre",court:"Remettre en ordre"},{id:"d8",n:8,titre:"Rédiger à partir des idées",court:"Depuis les idées"},{id:"d9",n:9,titre:"Rédiger à partir d'un plan détaillé",court:"Depuis un plan"},{id:"d10",n:10,titre:"La trame vide",court:"Trame vide"}];var W=Ke(sn());var z=Ke(tn());function S(e){re
