<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symbole commun · Halloween</title>
<meta name="description" content="Jeu du symbole commun sur le thème d'Halloween pour travailler les sons ch et j.">
<meta name="theme-color" content="#eff0f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Symbole commun">
<style>
:root{
  --fenetre:#eff0f1; --vue:#fcfcfc; --texte:#232629; --texte-doux:#6e7378;
  --bord:#bdc3c7; --bord-doux:#d5d8db; --accent:#3daee9; --accent-fonce:#2980b9; --accent-pale:#d6effb;
  --positif:#27ae60; --negatif:#da4453; --ch:#1d99f3; --j:#f67400;
  --ombre:0 1px 3px rgba(35,38,41,.14),0 2px 10px rgba(35,38,41,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fenetre);color:var(--texte);font:15px/1.45 "Noto Sans","Segoe UI","Oxygen",Ubuntu,Cantarell,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#root{min-height:100%}
h1{font-size:1.35rem;font-weight:600;margin:0}
h2{font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--texte-doux);margin:0 0 .6rem}
a{color:var(--accent-fonce)}

/* Boutons Breeze */
.btn{display:inline-flex;align-items:center;gap:.45rem;min-height:36px;padding:.4rem .95rem;border:1px solid var(--bord);border-radius:3px;background:var(--vue);color:var(--texte);font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
@media (hover:hover){.btn:hover{border-color:var(--accent)}}
.btn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn:active{background:var(--accent-pale)}
.btn.primaire{background:var(--accent);border-color:var(--accent-fonce);color:#fff}
.btn.primaire:hover{background:#4bb7ec}
.btn.primaire:active{background:var(--accent-fonce)}
.btn.rond{min-height:36px;width:36px;padding:0;justify-content:center;border-radius:50%}
.btn svg{flex:none}

/* Pages */
.page{max-width:780px;margin:0 auto;padding:clamp(12px,4vw,32px) 14px 24px}
.panneau{background:var(--vue);border:1px solid var(--bord-doux);border-radius:4px;box-shadow:var(--ombre);padding:clamp(16px,4vw,28px)}
.panneau + .panneau{margin-top:14px}
.groupe{margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--bord-doux)}
.titre-app{display:flex;align-items:center;gap:16px}
.logo{flex:none;width:72px;height:72px}
.sous-titre{margin:.15rem 0 0;color:var(--texte-doux)}
.regle{margin:0;padding-left:1.3rem}
.regle li{margin:.3rem 0}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:1.6rem}
.astuce{margin:.9rem 0 0;font-size:.85rem;color:var(--texte-doux);text-align:right}
.credits{text-align:center;font-size:.75rem;color:var(--texte-doux);margin-top:18px}
.graph{font-weight:700}
.graph.son-ch{color:var(--ch)}
.graph.son-j{color:var(--j)}

/* Case à cocher Breeze */
.option{display:flex;align-items:flex-start;gap:.6rem;padding:.35rem 0;cursor:pointer}
.option input{position:absolute;opacity:0;pointer-events:none}
.coche{flex:none;width:18px;height:18px;margin-top:2px;border:1px solid var(--bord);border-radius:3px;background:var(--vue);position:relative;transition:border-color .12s,background .12s}
.option:hover .coche,.option input:focus-visible + .coche{border-color:var(--accent)}
.option input:checked + .coche{background:var(--accent);border-color:var(--accent-fonce)}
.option input:checked + .coche::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* Imagier */
.barre-titre{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.imagier-groupe h2{text-transform:none;letter-spacing:0;font-size:1rem;color:var(--texte)}
.imagier{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.vignette{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;background:#fff;border:1px solid var(--bord-doux);border-radius:3px;cursor:pointer;font:inherit;color:inherit}
.vignette:hover{border-color:var(--accent)}
.vignette img{width:84px;height:84px;object-fit:contain;mix-blend-mode:multiply}
.vignette .mot{font-size:.92rem}

/* Partie */
.partie{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.barre{display:flex;align-items:center;gap:12px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));background:var(--vue);border-bottom:1px solid var(--bord-doux)}
.consigne{flex:1;font-weight:600;min-width:0}
.score{display:flex;flex-direction:column;align-items:center;padding:2px 14px;border:1px solid var(--bord-doux);border-radius:3px;background:var(--fenetre);font-size:1.15rem;line-height:1.2}
.score strong{color:var(--accent-fonce)}
.score-legende{font-size:.62rem;color:var(--texte-doux);text-transform:uppercase;letter-spacing:.03em}
.zone{flex:1;min-height:0;min-width:0;overflow:hidden;padding:12px;display:flex;align-items:center;justify-content:center}
.cartes{display:flex;gap:16px;align-items:center;justify-content:center}
.cartes.colonne{flex-direction:column}
.carte{position:relative;flex:none;border-radius:50%;background:#fff;border:1px solid var(--bord);box-shadow:var(--ombre)}
.symbole{position:absolute;padding:0;margin:0;border:0;background:none;cursor:pointer;border-radius:50%;touch-action:manipulation}
.symbole img{position:relative;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.symbole .halo{position:absolute;inset:-14%;border-radius:50%;background:transparent;transition:background .12s,box-shadow .12s}
@media (hover:hover){.symbole:hover .halo{background:rgba(61,174,233,.12)}}
.symbole:focus-visible{outline:none}
.symbole:focus-visible .halo{box-shadow:0 0 0 2px var(--accent)}
.symbole.choisi .halo{background:var(--accent-pale);box-shadow:0 0 0 3px var(--accent)}
.symbole.faux .halo{background:#f8d7dc;box-shadow:0 0 0 3px var(--negatif)}
.symbole.juste .halo{background:#d4f0de;box-shadow:0 0 0 3px var(--positif)}

/* Dialogue */
.voile{position:fixed;inset:0;background:rgba(35,38,41,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fondu .15s ease-out;z-index:10}
.dialogue{width:min(420px,100%);background:var(--vue);border:1px solid var(--bord);border-radius:4px;box-shadow:0 6px 30px rgba(35,38,41,.28);padding:20px 22px 16px;animation:monte .18s ease-out}
.dialogue-titre{font-size:1.3rem;font-weight:600}
.dialogue-titre.positif{color:var(--positif)}
.dialogue-titre.negatif{color:#8a2a33}
.dialogue-texte{margin:.5rem 0 0;color:var(--texte-doux)}
.dialogue-corps{display:flex;align-items:center;gap:16px;margin-top:12px}
.dialogue-img{width:96px;height:96px;object-fit:contain;background:#fff;border:1px solid var(--bord-doux);border-radius:3px;padding:6px}
.dialogue-mot{display:flex;align-items:center;gap:10px;font-size:1.6rem;flex-wrap:wrap}
.dialogue-actions{display:flex;justify-content:flex-end;margin-top:16px}
.dialogue-actions .btn{min-width:110px;justify-content:center}
@keyframes fondu{from{opacity:0}}
@keyframes monte{from{opacity:0;transform:translateY(8px)}}

/* Bilan */
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:1rem}
.chiffres div{display:flex;flex-direction:column;align-items:center;padding:12px 8px;background:var(--fenetre);border:1px solid var(--bord-doux);border-radius:3px}
.chiffres strong{font-size:1.5rem;color:var(--accent-fonce)}
.chiffres span{font-size:.82rem;color:var(--texte-doux)}
.bilan-ligne{display:flex;gap:10px;align-items:baseline;margin:.45rem 0}
.pastille{flex:none;display:inline-block;min-width:76px;text-align:center;padding:1px 8px;border-radius:10px;font-size:.8rem;font-weight:600;background:var(--fenetre);border:1px solid var(--bord-doux)}
.pastille.son-ch{color:var(--ch);border-color:var(--ch)}
.pastille.son-j{color:var(--j);border-color:var(--j)}

@media (max-width:560px){
  .consigne{font-size:.85rem}
  .barre .btn span{display:none}
  .barre .btn{padding:.4rem .6rem}
  .actions{justify-content:stretch}
  .actions .btn{flex:1;justify-content:center}
  .astuce{text-align:left}
  .dialogue-mot{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="root"></div>
