(function(){
const { useState, useEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);

/* ---------- Texte de l'histoire ---------- */
const NB = " ";
const fr = s => s.replace(/ ([!?:;»])/g, NB + "$1").replace(/« /g, "«" + NB);

const STEPS = {
  si: { label: "Situation initiale", c: "var(--st-si)" },
  ep: { label: "Élément perturbateur", c: "var(--st-ep)" },
  pe: { label: "Péripéties", c: "var(--st-pe)" },

const RAW = [
 ["si","Le jeune pêcheur",`Au bord de la mer, il y a un petit village de pêcheurs. Fichko habite là, chez sa tante Mira. C'est un garçon grand, aux cheveux bleu-noir ondulés et aux yeux marron. Comme son père avant lui, Fichko est pêcheur. Chaque matin, il part sur l'eau avec sa canne à pêche.`],
 ["si","Le père disparu",`Le père de Fichko était le meilleur pêcheur du village. Un jour, il est parti pêcher le poisson le plus rare qui existe. Il n'est jamais revenu. Depuis, tout le monde pense qu'il est mort en mer. Mira est sa sœur. Elle a promis de prendre soin de Fichko.`],
 ["si","Le collier à la perle bleue",`Fichko se souvient bien de son père. Il se souvient surtout de son collier, un collier avec une perle bleue. Son père le portait toujours. Quand il remontait ses filets, la perle brillait au soleil comme une petite étoile. C'est la dernière image que Fichko garde de lui.`],
 ["si","Les histoires du soir",`Le soir, son père lui racontait l'histoire du poisson le plus rare. « Ses écailles d'argent brillent comme la lune, disait-il. Personne n'a jamais réussi à le pêcher. » Fichko écoutait sans bouger, les yeux grands ouverts.`],
 ["si","Le rêve de Fichko",`Aujourd'hui, Fichko a grandi. Il a un rêve : pêcher le poisson le plus rare. Ce sera sa quête. Il veut finir ce que son père a commencé. Il veut prouver qu'il est digne de lui.`],
 ["ep","L'annonce",`Un soir, pendant le repas, Fichko prend une grande inspiration. « Tante Mira, je vais partir chercher le poisson le plus rare. » Mira pose sa cuillère. Son visage devient tout pâle.`],
 ["ep","La dispute",`« Non, répond Mira. Ce poisson m'a déjà pris mon frère. J'ai promis à tes parents de te protéger. Je ne veux pas te perdre aussi. » Fichko serre les poings. « Tu ne peux pas me garder ici toute ma vie ! » Cette nuit-là, Fichko se sent prisonnier du village.`],
 ["pe","La phrase de Mira",`La veille du départ, Mira vient voir Fichko. Elle a les yeux rouges. « Je ne peux pas t'empêcher de partir, dit-elle. Alors souviens-toi de ceci : la mer rend toujours ce qu'on lui donne. » Fichko la serre fort dans ses bras.`],
 ["pe","La barque",`Le lendemain, Fichko prend toutes ses économies d'émeraudes. Il achète une petite barque en bois. Au lever du soleil, il quitte le village. Sur la plage, Mira le regarde partir jusqu'à ce qu'il disparaisse à l'horizon.`],
 ["pe","Les poissons rares",`Pendant des semaines, Fichko parcourt les mers. Il découvre des poissons qu'il n'a jamais vus : des poissons-globes tout ronds, des poissons tropicaux de mille couleurs. Il les pêche, il les admire, puis il les relâche. Il garde seulement les poissons dont il a besoin pour manger.`],
 ["pe","La tempête",`Une nuit, une tempête éclate. Les vagues sont hautes comme des maisons. La barque se remplit d'eau. Toute la nuit, Fichko écope avec son seau. Au matin, la mer se calme enfin. Fichko est épuisé, mais il est vivant. Il est devenu un vrai marin.`],
 ["pe","La bouteille",`Un matin, la ligne de Fichko devient très lourde. Il tire, il tire encore. Au bout de la ligne, il y a une bouteille en verre ! À l'intérieur, il trouve une carte. Sur la carte, on voit un temple dessiné et une croix rouge.`],
 ["pe","Le collier retrouvé",`Au fond de la bouteille, quelque chose brille. Fichko le fait glisser dans sa main. C'est un collier avec une perle bleue. Son cœur se met à battre très fort. Il le reconnaît tout de suite : c'est le collier de son père ! Son père est passé par ici.`],
 ["pe","Suivre la carte",`Fichko attache le collier autour de son cou. Il déplie la carte et regarde la croix. Puis il prend ses rames. Il a décidé de suivre la carte jusqu'au bout.`],
 ["pe","Le temple englouti",`Après trois jours, Fichko arrive à l'endroit de la croix. Il se penche au-dessus de l'eau. Tout au fond, il voit un temple englouti, construit en prismarine. Devant la porte nage un poisson immense : le Gardien.`],
 ["pe","Le poisson des histoires",`Fichko reconnaît les écailles d'argent qui brillent comme la lune. C'est le poisson des histoires de son père ! Mais il est beaucoup plus grand. Ses yeux sont rouges et méchants. On dirait qu'il a été transformé.`],
 ["pe","La ligne cassée",`Fichko lance sa ligne. Le Gardien mord à l'hameçon, puis il tire d'un coup sec. Crac ! La ligne casse. Avec une canne à pêche, impossible d'attraper ce poisson.`],
 ["pe","La plongée",`Fichko prend son couteau et plonge. Il retient sa respiration : il est en apnée. Il nage vers le temple, mais le temple est très profond. Ses poumons le brûlent. Il n'a presque plus d'air.`],
 ["pe","La perle s'allume",`Soudain, la perle bleue s'illumine. Une lumière douce entoure Fichko. Des branchies apparaissent sur son cou ! Il peut respirer sous l'eau. Le collier ne marche que pour un pêcheur au cœur juste, qui rend à la mer ce qu'elle lui donne.`],
 ["pe","L'hésitation",`Fichko est face au Gardien. Il hésite. Il a relâché tous les poissons rares. Tuer celui-ci, c'est contraire à tout ce qu'il est devenu. Mais le Gardien fonce sur lui et bloque la porte. Fichko sent que la réponse est derrière cette porte.`],
 ["pe","Le combat",`Le combat commence. Le Gardien est rapide et puissant. Il frappe Fichko avec sa queue. Fichko esquive, frappe, recule. Le combat dure longtemps. Fichko est fatigué, mais il ne lâche rien.`],
 ["de","La victoire",`Enfin, Fichko trouve une ouverture. Il donne un dernier coup de couteau. Le Gardien s'arrête. Il ne bouge plus. Fichko a gagné.`],
 ["de","La transformation",`Alors, le corps immense du Gardien se défait dans l'eau, comme du sable. À sa place apparaît un petit poisson lumineux aux écailles d'argent. C'est le vrai poisson le plus rare ! Un sortilège du temple l'avait changé en monstre. Maintenant, il est libre.`],
 ["de","Le choix",`Fichko prend le petit poisson dans ses mains. Sa quête est accomplie : il tient le poisson le plus rare qui existe. Il pourrait le rapporter au village et devenir célèbre. Fichko hésite. Puis il ouvre les mains et le laisse partir.`],
 ["de","La porte s'ouvre",`Le petit poisson nage vers le temple. La grande porte de pierre tremble, puis elle s'ouvre lentement. Le poisson lumineux guide Fichko à l'intérieur.`],
 ["de","La bulle",`Au fond du temple, Fichko découvre une grosse bulle d'air. Dans la bulle, un homme dort. La perle bleue brille plus fort que jamais. Fichko s'approche et regarde son visage.`],
 ["ch","C'est lui",`C'est son père ! Il n'a pas vieilli d'un seul jour depuis sa disparition.`],
 ["sf","La remontée",`Fichko pose la main sur la bulle. Elle se détache du sol et remonte avec eux jusqu'à la surface. Dans la barque, son père ouvre les yeux. « Fichko ? C'est toi ? Comme tu as grandi ! »`],
 ["sf","Le secret du temple",`Son père raconte. Il avait trouvé le temple. Il voulait pêcher le Gardien pour devenir le plus grand pêcheur du monde. Mais le temple punit ceux qui viennent pour prendre. Il l'a enfermé hors du temps, jusqu'à l'arrivée d'un pêcheur au cœur juste. Pendant le combat, son collier s'était détaché, et la mer l'a gardé.`],
 ["sf","La fierté du père",`Fichko raconte qu'il a relâché le poisson le plus rare. Son père le regarde longtemps. « Tu as réussi là où j'ai échoué, dit-il. Parce que tu respectes la mer. Je suis fier de toi. »`],
 ["sf","Le retour",`Quelques jours plus tard, la barque arrive au village. Sur la plage, Mira laisse tomber son panier. Elle court vers son frère en pleurant de joie. Fichko pense à sa phrase : la mer rend toujours ce qu'on lui donne. Il a rendu à la mer tous les poissons rares. La mer lui a rendu son père.`],
 ["sf","Pêcher ensemble",`Un matin, Fichko et son père repartent pêcher ensemble. Le père attrape un beau poisson rare. Il veut le garder. Fichko sourit. « Regarde, papa. On le relâche. » Cette fois, c'est le fils qui apprend au père.`]
];
const PAGES = RAW.map(([e,t,x]) => ({ e, t: fr(t), x: fr(x) }));

/* ---------- Lexique ---------- */
const GLOSS = {
  "émeraude": { w: "émeraude", d: "Pierre précieuse verte. Dans Mineclonia, les émeraudes servent de monnaie pour acheter des objets aux villageois." },
  "quête": { w: "quête", d: "Grande mission qu'un héros veut accomplir, même si c'est difficile." },
  "digne": { w: "digne", d: "Être digne de quelqu'un, c'est mériter son respect et être à sa hauteur." },
  "barque": { w: "barque", d: "Petit bateau sans moteur. On le fait avancer avec des rames." },
  "horizon": { w: "horizon", d: "La ligne, très loin, où le ciel semble toucher la mer." },
  "écoper": { w: "écoper", d: "Enlever avec un seau l'eau qui entre dans un bateau." },
  "épuisé": { w: "épuisé", d: "Très, très fatigué. On n'a plus de force." },
  "rames": { w: "rames", d: "Longs bâtons plats qu'on pousse dans l'eau pour faire avancer une barque." },
  "englouti": { w: "englouti", d: "Recouvert par l'eau. Disparu au fond de la mer." },
  "prismarine": { w: "prismarine", d: "Pierre vert-bleu. Dans Mineclonia, les temples sous la mer sont construits avec elle." },
  "immense": { w: "immense", d: "Très, très grand." },
  "hameçon": { w: "hameçon", d: "Petit crochet de métal au bout de la ligne. Il accroche le poisson." },
  "apnée": { w: "apnée", d: "Être en apnée, c'est retenir sa respiration sous l'eau." },
  "branchies": { w: "branchies", d: "Organes des poissons qui leur permettent de respirer sous l'eau." },
  "esquiver": { w: "esquiver", d: "Éviter un coup en bougeant très vite." },
  "sortilège": { w: "sortilège", d: "Formule magique qui transforme ou ensorcelle quelqu'un." }
};
const FORMS = { "émeraudes":"émeraude", "émeraude":"émeraude", "quête":"quête", "digne":"digne", "barque":"barque", "horizon":"horizon", "écope":"écoper", "épuisé":"épuisé", "rames":"rames", "englouti":"englouti", "prismarine":"prismarine", "immense":"immense", "hameçon":"hameçon", "apnée":"apnée", "branchies":"branchies", "esquive":"esquiver", "sortilège":"sortilège" };
function glossKey(word){
  const w = word.toLowerCase().replace(/^(?:qu|[ldjmtsnc])['’]/, "");
  return FORMS[w] || null;
}

/* ---------- Découpage en phrases et en mots ---------- */
function splitSentences(text){
  const m = text.match(/[^.!?…]+(?:[.!?…]+(?:\s*»)?)?/g) || [text];
  return m.map(s => s.trim()).filter(Boolean);
}
const TOK = /[\p{L}\p{N}'’-]+|[^\p{L}\p{N}'’-]+/gu;
function tokenize(str, segIdx){
  const out = []; let m, k = 0; TOK.lastIndex = 0;
  while ((m = TOK.exec(str))){
    const t = m[0]; const isW = /[\p{L}\p{N}]/u.test(t);
    out.push({ t, w: isW, s: m.index, e: m.index + t.length, id: segIdx + "-" + (k++), g: isW ? glossKey(t) : null });

  }
  function togglePlay(){
    if (!synth) return;
    if (playing){ halt(); setPlaying(false); setPaused(true); setWord(null); return; }
    const start = posRef.current != null ? posRef.current : (sRef.current.title ? 0 : 1);
    startFrom(start);
  }
  function stopAll(){ halt(); setPlaying(false); setPaused(false); setSeg(-1); setWord(null); posRef.current = null; }
  function speakOnce(text){
    if (!synth) return;
    const wasPlaying = playing;
    halt(); setPlaying(false); if (wasPlaying) setPaused(true);
    const session = sessionRef.current;
    setTimeout(() => {
      if (session !== sessionRef.current) return;
      const u = makeUtt(text.replace(/[«»]/g, " "));
      u.onend = () => { if (session === sessionRef.current) setWord(null); };
      synth.speak(u);
    }, 70);
  }
  function onWord(tok){
    speakOnce(tok.t);
    setWord(tok.id);
    setGloss(tok.g);
  }
  function go(p){ setPage(Math.max(0, Math.min(last, p))); }

  /* changement de page */
  useEffect(() => {
    const auto = autoRef.current; autoRef.current = false;
    halt(); setSeg(-1); setWord(null); setGloss(null); setPaused(false); posRef.current = null;
    if (auto) startFrom(sRef.current.title ? 0 : 1); else setPlaying(false);
    if (!firstRef.current && window.scrollY > 40) window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    firstRef.current = false;
  }, [page]);

  /* clavier */
  const act = useRef({}); act.current = { next: () => go(page + 1), prev: () => go(page - 1), toggle: togglePlay, open, close: () => setOpen(false) };
  useEffect(() => {
    const h = e => {
      if (e.key === "Escape" && act.current.open){ act.current.close(); return; }
      const tag = (e.target.tagName || "").toLowerCase();
      if (["input", "select", "textarea", "button"].includes(tag) || act.current.open) return;
      if (e.key === "ArrowRight"){ act.current.next(); }
      else if (e.key === "ArrowLeft"){ act.current.prev(); }
      else if (e.key === " "){ e.preventDefault(); act.current.toggle(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  /* focus du panneau */
  const wasOpen = useRef(false);
  useEffect(() => {
    if (open && closeRef.current) closeRef.current.focus();
    if (!open && wasOpen.current && gearRef.current) gearRef.current.focus();
    wasOpen.current = open;
  }, [open]);

  /* rendu d'une phrase */
  const hlWord = id => word === id && (settings.hl === "word" || !playing);
  const sentOn = i => seg === i && settings.hl !== "none";
  const renderSeg = (s) => s.tokens.map(tok => tok.w
    ? html`<span key=${tok.id} className=${"w" + (tok.g ? " gl" : "") + (hlWord(tok.id) ? " hl" : "")} onClick=${() => onWord(tok)}>${tok.t}</span>`
    : tok.t);

  const step = STEPS[P.e];
  const playLabel = playing ? "Pause" : (paused ? "Reprendre" : "Lire la page");
  const frVoices = voices.filter(isFr);
  const voiceList = frVoices.length ? frVoices : voices;
  const g = gloss ? GLOSS[gloss] : null;

  return html`
  <div className="app">
    <header className="top">
      <div className="brand">
        <${Fish}/>
        <div>
          <h1>Fichko et le Gardien des Profondeurs</h1>
          <p>Une histoire de Hédi</p>
        </div>
      </div>
      <button ref=${gearRef} className="btn" type="button" onClick=${() => setOpen(true)} aria-haspopup="dialog">
        ${I.sliders}<span className="sr-sm">Réglages</span>
      </button>
    </header>

    <section className="progress" aria-label="Progression dans l'histoire">
      <div className="phead">
        <span className="chip" style=${{ "--c": step.c }}><i></i>${step.label}</span>
        <span className="count">Page ${page + 1} / ${PAGES.length}</span>
      </div>
      <div className="blocks">
        ${PAGES.map((p, i) => html`<button key=${i} type="button" tabIndex="-1"
            className=${"blk" + (i < page ? " done" : "") + (i === page ? " cur" : "")}
            style=${{ "--c": STEPS[p.e].c }} title=${"Page " + (i + 1) + " : " + p.t}
            aria-label=${"Aller à la page " + (i + 1)} onClick=${() => go(i)}></button>`)}
      </div>
    </section>

    <main className="sheet" style=${{ "--fs": FS[settings.fs] + "rem", "--lh": LH[settings.lh] }}>
      ${settings.img && html`<${Pic} index=${page}/>`}
      <h2 className="ptitle"><span className=${"sent" + (sentOn(0) ? " on" : "")}>${renderSeg(segs[0])}</span></h2>
      <p className="ptext">
        ${segs.slice(1).map((s, j) => html`<${React.Fragment} key=${j}><span className=${"sent" + (sentOn(j + 1) ? " on" : "")}>${renderSeg(s)}</span>${j < segs.length - 2 ? " " : ""}<//>`)}
      </p>
      ${page === last && html`<p className="fin">FIN</p>`}
      ${g && html`<aside className="gloss" aria-live="polite">
        <span className="lbl">Définition</span>
        <p><span className="gw">${g.w}</span> : ${g.d}</p>
        <div className="acts">
          <button className="btn sm" type="button" onClick=${() => speakOnce(g.w + ". " + g.d)}>${I.speaker}Écouter la définition</button>
          <button className="btn sm" type="button" onClick=${() => setGloss(null)}>${I.close}Fermer</button>
        </div>
      </aside>`}
    </main>

    ${synth
      ? html`<p className="hint">Appuie sur un mot pour l'entendre. Les mots soulignés en pointillés ont une définition.</p>`
      : html`<p className="notice">Ce navigateur ne propose pas la lecture à voix haute. Essaie avec une version récente de Chrome, Edge, Safari ou Firefox.</p>`}

    <nav className="bar" aria-label="Lecture et navigation">
      <div className="bar-in">
        <button className="btn" type="button" onClick=${() => go(page - 1)} disabled=${page === 0} aria-label="Page précédente">
          ${I.prev}<span className="sr-sm">Précédent</span>
        </button>
        <button className="btn primary" type="button" onClick=${togglePlay} disabled=${!synth} aria-pressed=${playing}>
          ${playing ? I.pause : I.play}<span>${playLabel}</span>
        </button>
        <button className="btn icon" type="button" onClick=${stopAll} disabled=${!synth} aria-label="Arrêter la lecture" title="Arrêter">
          ${I.stop}
        </button>
        ${page < last
          ? html`<button className="btn" type="button" onClick=${() => go(page + 1)} aria-label="Page suivante"><span className="sr-sm">Suivant</span>${I.next}</button>`
          : html`<button className="btn" type="button" onClick=${() => go(0)} aria-label="Recommencer l'histoire">${I.again}<span className="sr-sm">Recommencer</span></button>`}
      </div>
    </nav>

    ${open && html`<${React.Fragment}>
      <div className="scrim" onClick=${() => setOpen(false)}></div>
      <div className="drawer" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
        <div className="dh">
          <h2 id="dlg-t">Réglages</h2>
          <button ref=${closeRef} className="btn icon" type="button" onClick=${() => setOpen(false)} aria-label="Fermer les réglages">${I.close}</button>
        </div>

        <section className="grp">
          <p className="gt">Voix</p>
          <div className="field">
            <label className="fl" htmlFor="voice">Voix de lecture</label>
            <select id="voice" value=${voice ? voice.voiceURI : ""} onChange=${e => upd("voiceURI", e.target.value)} disabled=${!synth || !voiceList.length}>
              ${!voiceList.length && html`<option value="">Voix par défaut de l'appareil</option>`}
              ${voiceList.map(v => html`<option key=${v.voiceURI} value=${v.voiceURI}>${v.name} (${v.lang})${v.localService ? "" : " · en ligne"}</option>`)}
            </select>
          </div>
          ${synth && voicesChecked && !frVoices.length && html`<p className="note">Aucune voix française n'a été trouvée sur cet appareil. La lecture utilisera la voix par défaut.</p>`}
          <div className="field">
            <label className="fl" htmlFor="rate">Vitesse <output>${settings.rate.toFixed(2).replace(".", ",")} ×</output></label>
            <input id="rate" type="range" min="0.5" max="1.5" step="0.05" value=${settings.rate} onChange=${e => upd("rate", parseFloat(e.target.value))}/>
          </div>
          <div className="field">
            <label className="fl" htmlFor="pitch">Hauteur de la voix <output>${settings.pitch.toFixed(1).replace(".", ",")}</output></label>
            <input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value=${settings.pitch} onChange=${e => upd("pitch", parseFloat(e.target.value))}/>
          </div>
          <div className="field">
            <label className="fl" htmlFor="vol">Volume <output>${Math.round(settings.volume * 100)} %</output></label>
            <input id="vol" type="range" min="0" max="1" step="0.05" value=${settings.volume} onChange=${e => upd("volume", parseFloat(e.target.value))}/>
          </div>
          <button className="btn sm" type="button" onClick=${() => speakOnce("Bonjour ! Je vais te lire l'histoire de Fichko.")} disabled=${!synth}>${I.speaker}Tester la voix</button>
        </section>

        <section className="grp">
          <p className="gt">Lecture</p>
          <div className="field">
            <span className="fl">Pause entre les phrases</span>
            <${Seg} label="Pause entre les phrases" value=${settings.pause} onChange=${v => upd("pause", v)}
              options=${[{ v: 0, l: "Aucune" }, { v: 300, l: "Courte" }, { v: 900, l: "Longue" }]}/>
          </div>
          <div className="field">
            <span className="fl">Surlignage pendant la lecture</span>
            <${Seg} label="Surlignage" value=${settings.hl} onChange=${v => upd("hl", v)}
              options=${[{ v: "word", l: "Mot" }, { v: "sentence", l: "Phrase" }, { v: "none", l: "Aucun" }]}/>
          </div>
          <label className="check"><input id="ttl" type="checkbox" checked=${settings.title} onChange=${e => upd("title", e.target.checked)}/>Lire aussi le titre de la page</label>
          <label className="check"><input id="auto" type="checkbox" checked=${settings.autoNext} onChange=${e => upd("autoNext", e.target.checked)}/>Passer seul à la page suivante à la fin de la lecture</label>
        </section>

        <section className="grp">
          <p className="gt">Affichage</p>
          <label className="check"><input id="img" type="checkbox" checked=${settings.img} onChange=${e => upd("img", e.target.checked)}/>Afficher les images</label>
          <div className="field">
            <span className="fl">Taille du texte</span>
            <${Seg} label="Taille du texte" value=${settings.fs} onChange=${v => upd("fs", v)}
              options=${[0,1,2,3].map(i => ({ v: i, l: "A", a: ["Petite", "Moyenne", "Grande", "Très grande"][i], style: { fontSize: (0.8 + i * 0.17) + "rem" } }))}/>
          </div>
          <div className="field">
            <span className="fl">Espace entre les lignes</span>
            <${Seg} label="Espace entre les lignes" value=${settings.lh} onChange=${v => upd("lh", v)}
              options=${[{ v: 0, l: "Normal" }, { v: 1, l: "Large" }, { v: 2, l: "Très large" }]}/>
          </div>
        </section>

        <section className="grp last">
          <p className="note">La lecture utilise les voix installées sur l'ordinateur ou le téléphone : elle est gratuite et ne demande aucun compte. Les voix proposées changent d'un appareil à l'autre. Le surlignage mot à mot dépend de la voix : s'il ne suit pas, choisis une autre voix ou garde le surlignage par phrase.</p>
          <p className="note">Clavier : flèches gauche et droite pour changer de page, barre d'espace pour lire ou mettre en pause.</p>
          <button className="btn sm" type="button" onClick=${() => setSettings({ ...DEF })}>Rétablir les réglages</button>
        </section>
      </div>
    <//>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>

</body></html>
