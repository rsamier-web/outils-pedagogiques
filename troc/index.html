<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le troc – chez l'indienne</title>
<meta name="theme-color" content="#eff0f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202326" media="(prefers-color-scheme: dark)">
<meta name="description" content="Jeu du troc en base 4 : échanger, compter, troquer et rendre.">
<link rel="manifest" href="manifest-troc.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>/* Palette inspirée de KDE Breeze */
:root {
  --win: #eff0f1;
  --view: #fcfcfc;
  --alt: #f6f7f7;
  --txt: #232629;
  --muted: #6e7175;
  --border: #c9cdd1;
  --border-soft: #dcdfe2;
  --hl: #3daee9;
  --hl-soft: rgba(61, 174, 233, .14);
  --pos: #27ae60;
  --neg: #da4453;
  --neu: #f67400;
  --k: 1;
  --r: 4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --win: #202326;
    --view: #141618;
    --alt: #1b1e20;
    --txt: #fcfcfc;
    --muted: #a1a9b1;
    --border: #3e4246;
    --border-soft: #33373b;
    --hl-soft: rgba(61, 174, 233, .2);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Noto Sans", "Segoe UI", Ubuntu, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.45; color: var(--txt); background: var(--win);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.ic { flex: none; }

/* ---------- structure ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 270px; flex: none; background: var(--view); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 14px 10px; gap: 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar > * { flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 4px; }
.brand img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: var(--r); padding: 2px; }
.brand-t { font-weight: 700; font-size: 17px; }
.brand-s { font-size: 13px; color: var(--muted); }

.seg { display: flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin: 0 6px; }
.seg button { flex: 1; border: 0; background: var(--alt); padding: 7px 8px; cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--hl); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--hl); outline-offset: -2px; }

.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-group { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 2px 8px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent; border-radius: var(--r);
  padding: 6px 8px; cursor: pointer; font-size: 15px;
}
.nav-item:hover { background: var(--hl-soft); }
.nav-item.on { background: var(--hl-soft); border-color: var(--hl); }
.nav-item:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.nav-t { flex: 1; }
.badge {
  width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; border: 1px solid var(--border); color: var(--muted); background: var(--alt);
}
.nav-item.on .badge { border-color: var(--hl); color: var(--hl); }
.score { font-size: 12px; color: var(--muted); border: 1px solid var(--border-soft); border-radius: 10px; padding: 0 6px; }
.score.full { color: var(--pos); border-color: var(--pos); }
.guide-link { margin-top: 6px; border-top: 1px solid var(--border-soft); border-radius: 0; padding-top: 10px; color: var(--muted); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.toolbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 7px 14px; background: var(--win); border-bottom: 1px solid var(--border);
}
.tb-title { font-weight: 600; padding: 0 6px; }
.tb-title .sep { color: var(--muted); margin: 0 4px; }
.spacer { flex: 1; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: transparent;
  border-radius: var(--r); padding: 5px 9px; cursor: pointer; font-size: 14px;
}
.tbtn:hover { border-color: var(--border); background: var(--view); }
.tbtn.on { background: var(--hl-soft); border-color: var(--hl); }
.tbtn:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.tbtn.icon-only { padding: 5px; }
.menu-btn { display: none; }
.dots { display: flex; gap: 6px; padding: 0 8px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); background: var(--view); }
.dots .cur { border-color: var(--hl); background: var(--hl); }
.dots .ok { background: var(--pos); border-color: var(--pos); }
.dots .ko { background: var(--neu); border-color: var(--neu); }

.content { padding: 18px 22px 40px; max-width: 1100px; width: 100%; margin: 0 auto; }
.instruction {
  display: flex; align-items: center; gap: 8px; font-size: 21px; font-weight: 600; margin: 0 0 14px;
}
.lead { font-size: 18px; margin: 0 0 14px; }

/* ---------- panneaux ---------- */
.ex { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--view); border: 1px solid var(--border); border-radius: var(--r); }
.panel-h {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 12px; border-bottom: 1px solid var(--border-soft);
  font-weight: 600; font-size: 15px;
}
.panel-h .hint { font-weight: 400; color: var(--muted); font-size: 14px; }
.h-picto { width: 26px; height: 26px; object-fit: contain; background: #fff; border-radius: 3px; }
.total { margin-left: auto; font-weight: 400; }
.total b { font-size: 20px; color: var(--hl); }

.ex-top { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: stretch; }
.ex-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.product {
  background: var(--view); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 190px;
}
.product.small { min-width: 150px; padding: 10px; }
.picto { background: #fff; border-radius: var(--r); display: grid; place-items: center; }
.picto img { width: 100%; height: 100%; object-fit: contain; }
.picto-word { font-size: 20px; color: #232629; }
.product-word { font-size: 18px; color: var(--muted); text-align: center; }
.price-row { display: flex; align-items: center; gap: 4px; }
.price {
  font-size: 30px; font-weight: 700; border: 2px solid var(--hl); border-radius: var(--r);
  padding: 0 14px; background: var(--view); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.product.small .price { font-size: 22px; padding: 0 10px; }
.basket { display: flex; gap: 10px; flex-wrap: wrap; align-content: flex-start; }

.counter-zone {
  min-height: 120px; margin: 12px; border: 2px dashed var(--border); border-radius: var(--r);
  padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; align-content: center;
}
.counter-zone.empty { justify-content: center; }
.placeholder { color: var(--muted); text-align: center; }
.counter { flex: 1; display: flex; flex-direction: column; }
.counter .counter-zone { flex: 1; }

.pieces-box { background: var(--view); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 12px 10px; }
.pieces-h { font-weight: 600; margin-bottom: 6px; }
.pieces-h b { color: var(--hl); font-size: 19px; margin-left: 4px; }
.pieces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.tray-rows { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.tray-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.count-zone, .disc-row { padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ---------- pièces et billets ---------- */
.money { display: inline-grid; place-items: center; position: relative; }
.btn-money { border: 0; background: none; padding: 2px; cursor: pointer; border-radius: 6px; transition: transform .08s ease; }
.btn-money:hover { transform: translateY(-2px); }
.btn-money:active { transform: translateY(0) scale(.96); }
.btn-money:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
.coin {
  border-radius: 50%; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid rgba(0, 0, 0, .38); color: #1d1f21; line-height: .95;
}
.coin b { font-weight: 700; }
.coin small { font-size: .5em; font-weight: 600; }
.note {
  border-radius: 4px; border: 1px solid rgba(0, 0, 0, .3); display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  color: #1d1f21; line-height: .95;
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .3);
}
.note b { font-weight: 700; }
.note small { font-size: .42em; font-weight: 600; }
.money.pressed .coin, .money.pressed .note { outline: 3px solid var(--hl); outline-offset: 2px; }
.money.pressed { opacity: .55; }
.disc-row .money.pressed { opacity: 1; }
.rm {
  position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--neg); color: #fff; opacity: 0; transition: opacity .1s;
}
.removable:hover .rm, .removable:focus-visible .rm { opacity: 1; }
@media (hover: none) { .rm { opacity: .85; } }

/* ---------- ligne numérique ---------- */
.line-panel .nl { padding: 0 6px 4px; overflow: hidden; }
.nl svg { display: block; font-family: inherit; }
.nl .axis { stroke: var(--txt); stroke-width: 2; }
.nl .tick { stroke: var(--txt); stroke-width: 1.2; }
.nl .tl { font-size: 13px; fill: var(--muted); }
.nl .band { fill: rgba(246, 116, 0, .22); }
.nl .arc path { fill: none; stroke: var(--hl); stroke-width: 2; }
.nl .arc text { font-size: 12.5px; fill: var(--hl); font-weight: 700; }
.nl .arc.over path { stroke: var(--neg); }
.nl .arc.over text { fill: var(--neg); }
.nl .pos { fill: var(--hl); stroke: var(--view); stroke-width: 2; }
.nl .pos.ok { fill: var(--pos); }
.nl .mk line { stroke-width: 1.5; stroke-dasharray: 3 3; }
.nl .mk rect { stroke-width: 1.5; }
.nl .mk text { font-size: 13px; font-weight: 700; }
.nl .mk.goal line, .nl .mk.goal rect { stroke: var(--neu); }
.nl .mk.goal rect { fill: var(--view); }
.nl .mk.goal text { fill: var(--neu); }
.nl .mk.ok line, .nl .mk.ok rect { stroke: var(--pos); }
.nl .mk.ok rect { fill: var(--view); }
.nl .mk.ok text { fill: var(--pos); }
.nl .mk.start line, .nl .mk.start rect { stroke: var(--muted); }
.nl .mk.start rect { fill: var(--view); }
.nl .mk.start text { fill: var(--muted); }

/* ---------- boutons ---------- */
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.actions.center { justify-content: center; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--view);
  border-radius: var(--r); padding: 8px 16px; cursor: pointer; font-size: 16px;
  box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
}
.btn:hover:not(:disabled) { border-color: var(--hl); }
.btn:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--hl); border-color: #2e9fd8; color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #2e9fd8; }
.choices { display: flex; gap: 12px; flex-wrap: wrap; padding: 14px; }
.btn.choice { font-size: 22px; font-weight: 600; padding: 10px 24px; min-width: 120px; justify-content: center; }
.btn.choice.right { border-color: var(--pos); background: rgba(39, 174, 96, .14); }
.btn.choice.wrong { border-color: var(--neg); background: rgba(218, 68, 83, .12); }

/* ---------- messages (style KMessageWidget) ---------- */
.msg { display: flex; gap: 10px; align-items: flex-start; border: 1px solid; border-radius: var(--r); padding: 10px 14px; font-size: 17px; }
.msg-ic { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; flex: none; }
.msg-info { border-color: var(--hl); background: var(--hl-soft); } .msg-info .msg-ic { background: var(--hl); }
.msg-ok { border-color: var(--pos); background: rgba(39, 174, 96, .12); } .msg-ok .msg-ic { background: var(--pos); }
.msg-warn { border-color: var(--neu); background: rgba(246, 116, 0, .12); } .msg-warn .msg-ic { background: var(--neu); }
.msg-err { border-color: var(--neg); background: rgba(218, 68, 83, .1); } .msg-err .msg-ic { background: var(--neg); }
.eq { font-size: 20px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }

/* ---------- bilan et guide ---------- */
.summary { align-items: center; }
.sum-card { background: var(--view); border: 1px solid var(--border); border-radius: var(--r); padding: 26px 34px; text-align: center; max-width: 520px; }
.sum-card h2 { margin: 0 0 10px; }
.stars { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; color: var(--border); }
.stars .on { color: #f6b500; }
.stars .on svg { fill: #f6b500; }
.muted { color: var(--muted); }
.guide { background: var(--view); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 26px 18px; gap: 0; max-width: 820px; }
.guide h2 { margin: 14px 0 6px; } .guide h3 { margin: 14px 0 4px; font-size: 17px; }
.guide ul { margin: 4px 0; padding-left: 22px; } .guide li { margin: 4px 0; }
.small { font-size: 13px; color: var(--muted); margin-top: 16px; }
.scrim { display: none; }

/* ---------- petits écrans ---------- */
@media (max-width: 1000px) { :root { --k: .9; } .tb-l { display: none; } }
@media (max-width: 860px) {
  :root { --k: .82; }
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; left: 0; top: 0; z-index: 20; transform: translateX(-100%); transition: transform .18s ease; box-shadow: 0 0 18px rgba(0, 0, 0, .25); }
  .drawer-open .sidebar { transform: none; }
  .drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(0, 0, 0, .3); }
  .content { padding: 14px 12px 30px; }
  .ex-top { grid-template-columns: 1fr; }
  .product { flex-direction: row; justify-content: center; flex-wrap: wrap; }
  .instruction { font-size: 18px; }
}
@media (max-width: 480px) { :root { --k: .72; } .btn.choice { font-size: 19px; min-width: 96px; padding: 8px 14px; } }

/* ---------- troc : objets d'échange ---------- */
.tok {
  display: inline-grid; place-items: center; background: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
}
.tok img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.money { flex-direction: column; gap: 2px; }
.tok-v { font-weight: 700; font-size: 15px; color: var(--muted); line-height: 1; }
.money.pressed .tok { outline: 3px solid var(--hl); outline-offset: 2px; }
.tray-row { padding: 12px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.amount { display: inline-flex; align-items: center; gap: .25em; white-space: nowrap; }
.shell { object-fit: contain; vertical-align: middle; background: #fff; border-radius: 3px; }
.price { display: inline-flex; align-items: center; }

/* tapis de troc en colonnes */
.mat {
  margin: 12px; border: 2px dashed var(--border); border-radius: 10px; padding: 10px;
  min-height: 140px; display: flex; gap: 10px; align-items: stretch; flex: 1;
  background: rgba(231, 76, 60, .04);
}
.mat.empty { align-items: center; justify-content: center; }
.col {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  border-right: 1px solid var(--border-soft); padding: 0 4px 2px;
}
.col:last-child { border-right: 0; }
.col-empty .col-h { opacity: .45; }
.col-h { display: flex; align-items: center; gap: 4px; }
.col-h img { width: 26px; height: 26px; object-fit: contain; background: #fff; border-radius: 4px; }
.col-n { font-size: 22px; font-weight: 700; min-width: 1ch; text-align: center; }
.col-body { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; align-content: flex-start; flex: 1; }
.swap-btn { max-width: 100%; flex-wrap: wrap; justify-content: center; padding: 4px 8px; gap: 3px; font-size: 15px; font-weight: 700; border-color: var(--hl); background: var(--hl-soft); }
.swap-btn img { width: 20px; height: 20px; object-fit: contain; background: #fff; border-radius: 3px; }

/* règle du troc */
.rule { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.rule-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.rule-v { width: 56px; text-align: center; font-size: 20px; font-weight: 700; border: 1px solid var(--border); border-radius: var(--r); padding: 4px 0; background: var(--alt); }
.rule-eq { font-size: 28px; font-weight: 300; }
.rule-one { font-size: 20px; }
.rule-four { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rule-txt { color: var(--muted); margin-left: 6px; }
.brand img { background: #fff; }
@media (max-width: 860px) {
  .mat { overflow-x: auto; }
  .col { min-width: 64px; }
  .swap-btn { padding: 3px 4px; font-size: 13px; }
  .swap-btn img { width: 16px; height: 16px; }
}
</style>
</head>
