<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natures et fonctions des mots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --win:#eff0f1; --view:#fcfcfc; --alt:#f5f6f7; --line:#d1d5d9; --line2:#babec2;
  --text:#232629; --muted:#6c757d; --accent:#3daee9; --accent-d:#1d84be; --sel:rgba(61,174,233,.18);
  --pos:#27ae60; --pos-bg:#e3f4ea; --neg:#da4453; --neg-bg:#fbe6e8; --warn:#f67400; --warn-bg:#fef0e1;
  --gap:.42em;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--win);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.4rem .9rem;background:#e3e5e7;border-bottom:1px solid var(--line2)}
.tb-l{display:flex;align-items:center;gap:.5rem}
.tb-r{display:flex;align-items:center;gap:.6rem}
.logo{display:inline-flex;width:26px;height:26px;border-radius:5px;background:var(--accent);color:#fff;align-items:center;justify-content:center}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:220px;flex-shrink:0;background:var(--view);border-right:1px solid var(--line);padding:.6rem .5rem;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav{display:flex;align-items:center;gap:.6rem;padding:.5rem .65rem;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;text-align:left}
.nav:hover{background:rgba(61,174,233,.08)}
.nav.on{background:var(--sel);border-color:rgba(61,174,233,.55)}
.nav svg{color:#4d5d6e;flex-shrink:0}
.nav.on svg{color:var(--accent-d)}
.side-foot{margin-top:auto;padding:.8rem .5rem 0;display:flex;flex-direction:column;gap:.3rem}
main{flex:1;overflow:auto;padding:1.4rem 1.6rem 3rem}
.page{max-width:1080px;margin:0 auto}
.page.narrow{max-width:760px}
h1{font-size:1.75rem;font-weight:600;margin:0 0 .3rem}
.h2{font-size:1.4rem;font-weight:600;margin:0 0 .2rem}
.h3{font-size:1.12rem;font-weight:600;margin:0 0 .6rem}
.h3.sp{margin-top:1.6rem}
.nomargin{margin:0}
h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:1.1rem 0 .45rem;font-weight:600}
p{margin:.35rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.large{font-size:1.08rem}
.lead{font-size:1.1rem}
.hero{padding:.4rem 0 1rem}
.card{background:var(--view);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.3rem;margin:0 0 1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.two .card{margin:0}
.q-card h3{margin:.2rem 0;font-size:1.2rem}
.q-ico{margin-bottom:.2rem}
.big-q{font-size:1.15rem;font-weight:600}
.stack{display:flex;flex-direction:column;gap:.9rem;margin:.3rem 0 .6rem}
.row{display:flex;align-items:center;gap:.6rem;margin-top:.9rem}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.row h4{margin:0}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.42rem .95rem;border:1px solid var(--line2);border-radius:4px;background:linear-gradient(#fcfcfc,#f1f2f3);cursor:pointer;transition:border-color .12s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,.nav:focus-visible,.tab:focus-visible,.li:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{border-color:var(--accent);background:linear-gradient(#f4fafd,#e3f2fb)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;color:var(--accent-d);cursor:pointer;padding:.2rem 0;display:inline-flex;align-items:center;gap:.3rem}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;background:var(--view)}
.seg button{border:none;background:none;padding:.35rem .8rem;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--sel);color:var(--accent-d);font-weight:600}
.seg.small button{padding:.15rem .55rem}
.chk{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.prog{height:6px;background:#dcdfe1;border-radius:3px;overflow:hidden;margin:.4rem 0}
.prog div{height:100%;background:var(--accent);transition:width .25s}

/* onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:.8rem 0 1rem;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:.5rem .9rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:.4rem;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
.badge{width:8px;height:8px;border-radius:50%;display:inline-block}
.badge.ok{background:var(--pos)}.badge.mid{background:var(--warn)}.badge.ko{background:var(--neg)}

/* listes latérales */
.split{display:grid;grid-template-columns:250px 1fr;gap:1rem;align-items:start;margin-top:1rem}
.sublist{background:var(--view);border:1px solid var(--line);border-radius:6px;padding:.4rem;display:flex;flex-direction:column;gap:1px;position:sticky;top:0}
.grp{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.6rem .55rem .25rem;font-weight:600}
.li{display:flex;align-items:center;gap:.55rem;padding:.38rem .55rem;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;text-align:left}
.li:hover{background:rgba(61,174,233,.08)}
.li.on{background:var(--sel);border-color:rgba(61,174,233,.55)}
.li.fam{justify-content:space-between}
.li-t{flex:1}
.sw{width:14px;height:14px;border-radius:3px;border:1.5px solid;flex-shrink:0}
.sw.br{border:none;border-bottom:2.5px solid #7f8c8d;border-left:2px solid #7f8c8d;border-right:2px solid #7f8c8d;border-radius:0 0 3px 3px;height:8px}
.mini{display:inline-flex;gap:3px}
.mini span{width:7px;height:7px;border-radius:50%;background:#d5d8dc}
.mini span.ok{background:var(--pos)}.mini span.mid{background:var(--warn)}.mini span.ko{background:var(--neg)}
.detail{margin:0;min-height:300px}
.d-title{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.chip{display:inline-block;padding:.1rem .55rem;border-radius:4px;font-size:.85rem;font-weight:600}
.chip.big{font-size:1.15rem;padding:.2rem .8rem}
.legend{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.legend-demo{padding:.4rem 0 .2rem}

/* encadrés */
.box{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;background:var(--alt);margin:1rem 0;padding:.6rem .9rem}
.box-h{display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:.9rem;margin-bottom:.2rem}
.box.test{border-left-color:var(--accent);background:#eef7fc}.box.test .box-h{color:var(--accent-d)}
.box.test2{border-left-color:var(--pos);background:#eef8f2}.box.test2 .box-h{color:#1e8449}
.box.warn{border-left-color:var(--warn);background:var(--warn-bg)}.box.warn .box-h{color:#b35400}
.box.memo{border-left-color:#8e44ad;background:#f5eef8}.box.memo .box-h{color:#7d3c98}
.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;white-space:nowrap;color:#4d5d6e}
.tbl.grid thead th{background:var(--alt);font-size:.85rem}
.tbl td.b{font-weight:600}
.tblwrap{overflow-x:auto}

/* phrases analysées */
.sent{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:var(--gap);row-gap:.7em;font-size:1.15rem;line-height:1.3}
.sent.big{font-size:1.4rem}
.w{display:inline-flex;flex-direction:column;align-items:center}
.glue{margin-left:calc(-1 * var(--gap))}
.wt{padding:.05em .12em;border-radius:3px;border:1px solid transparent;white-space:nowrap}
.wt.nat{padding:.05em .3em}
.wt.punct{padding-left:0;padding-right:0}
.nl{font-size:.55em;font-weight:600;letter-spacing:.02em;margin-top:.15em;white-space:nowrap}
.w.dim .wt.nat{background:transparent!important;color:var(--text)!important;border-color:transparent!important}
.w.dim .nl{opacity:.35}
.hl,mark.hl{background:rgba(61,174,233,.2);box-shadow:inset 0 -2px 0 var(--accent);color:inherit;border-radius:2px}
.g{display:inline-flex;flex-direction:column;align-items:stretch}
.gw{display:inline-flex;column-gap:var(--gap);align-items:flex-start;justify-content:center}
.gb{display:block;height:7px;border:2px solid #7f8c8d;border-top:none;border-radius:0 0 4px 4px;margin:.15em .05em 0}
.gl{font-size:.58em;text-align:center;color:#3b4a58;font-weight:600;white-space:nowrap;margin-top:.1em}
.stage{background:var(--alt);border:1px solid var(--line);border-radius:5px;padding:1.1rem 1.2rem 1.3rem;margin:.6rem 0}
.stage-top{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.stage-top .prog{flex:1;margin:0}

/* exemple résolu */
.steps{margin:.6rem 0;padding-left:1.4rem;display:flex;flex-direction:column;gap:.45rem}
.steps li.past{color:var(--muted)}
.steps li.cur{font-weight:500}
.steps li.cur::marker{color:var(--accent-d);font-weight:700}

/* exercices */
.runner-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.consigne{font-weight:600;font-size:1.05rem;margin:0}
.dots{display:inline-flex;gap:5px;flex-wrap:wrap;padding-top:.35rem}
.dots span{width:10px;height:10px;border-radius:50%;background:#d5d8dc}
.dots span.cur{box-shadow:0 0 0 2px var(--accent)}
.dots span.ok{background:var(--pos)}.dots span.ko{background:var(--neg)}
.dots.big{justify-content:center;margin:.6rem 0}.dots.big span{width:14px;height:14px}
.hint{margin:.5rem 0}
.hint-b{display:flex;gap:.45rem;align-items:flex-start;background:#f5eef8;border:1px solid #dcc6e6;border-radius:4px;padding:.45rem .7rem;color:#5b2c6f}
.hint-b svg{flex-shrink:0;margin-top:.15rem}
.item{margin-top:.6rem}
.q{color:var(--muted);margin:.2rem 0}
.prompt{font-size:1.3rem;padding:1rem 1.2rem;background:var(--alt);border:1px solid var(--line);border-radius:5px;margin:.4rem 0 .9rem}
.prompt.single{text-align:center;font-size:1.6rem;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opts.col{flex-direction:column;align-items:stretch}
.opt{padding:.55rem 1.1rem;border:1px solid var(--line2);border-radius:4px;background:var(--view);cursor:pointer;min-width:7rem;text-align:center}
.opts.col .opt{text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent);background:#f4fafd}
.opt.good,.opt.good:hover:not(:disabled){border-color:var(--pos);background:var(--pos-bg);font-weight:600}
.opt.bad,.opt.bad:hover:not(:disabled){border-color:var(--neg);background:var(--neg-bg);text-decoration:line-through}
.opt:disabled{cursor:default}
.opt:disabled:not(.good):not(.bad){opacity:.5}
.corr{margin-top:1rem;border:1px solid;border-radius:5px;padding:.7rem .95rem}
.corr.ok{border-color:#a9dcbf;background:#f2faf5}
.corr.ko{border-color:#f0b7bd;background:#fdf4f5}
.corr-h{display:flex;align-items:center;gap:.4rem;font-weight:600}
.corr.ok .corr-h{color:#1e8449}.corr.ko .corr-h{color:#b03040}
.corr-s{margin:.3rem 0}
.corr-s .sent{margin:.7rem 0 .3rem}
.corr-d{margin-top:.5rem;padding-top:.6rem;border-top:1px dashed var(--line2)}
.corr-d .sent{margin-bottom:.6rem}
.tagging{padding:1rem 1.2rem 1.2rem;background:var(--alt);border:1px solid var(--line);border-radius:5px;row-gap:1.1em}
.tw{align-items:center}
.wt.target{background:rgba(61,174,233,.14);border-color:rgba(61,174,233,.45)}
.tagcell{display:flex;flex-direction:column;align-items:center;margin-top:.25em}
.sel{font:inherit;font-size:.62em;padding:.15em .25em;border:1px solid var(--line2);border-radius:3px;background:var(--view);max-width:11.5em;cursor:pointer}
.sel:focus{outline:2px solid var(--accent);outline-offset:0}
.sel.good{border-color:var(--pos);background:var(--pos-bg)}
.sel.bad{border-color:var(--neg);background:var(--neg-bg)}
.fix{font-size:.55em;color:#1e8449;font-weight:700;margin-top:.15em;white-space:nowrap}
.g.tg .gb{margin-top:.25em}
.fill{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:1.3rem}
.inp{font:inherit;font-size:1.2rem;padding:.25rem .5rem;border:1px solid var(--line2);border-radius:4px;width:10em;background:#fff}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp.good{border-color:var(--pos);background:var(--pos-bg)}
.inp.bad{border-color:var(--neg);background:var(--neg-bg)}
.summary{text-align:center;padding:1.2rem 0}
.score{font-size:2.6rem;font-weight:700}
.score.ok{color:var(--pos)}.score.mid{color:var(--warn)}.score.ko{color:var(--neg)}
.review{padding-left:1.1rem;display:flex;flex-direction:column;gap:.7rem}

/* mémoriser */
.flash{background:var(--view);border:1px solid var(--line);border-radius:8px;padding:1.6rem 1.6rem 1.3rem;margin-top:1rem;min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash.back{border-color:rgba(61,174,233,.6)}
.flash-tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.flash-f{font-size:1.35rem;font-weight:600;margin:.6rem 0}
.flash-b{font-size:1.12rem;background:#eef7fc;border-radius:5px;padding:.8rem 1rem;margin:.4rem 0}

/* accueil */
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.path-i{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;padding:.9rem;border:1px solid var(--line);border-radius:6px;background:var(--view);cursor:pointer;text-align:left}
.path-i:hover{border-color:var(--accent)}
.path-i svg{color:var(--accent-d)}
.path-i span{font-size:.88rem;color:var(--muted)}
.teacher{margin-top:1.4rem}
.teacher summary{cursor:pointer;font-weight:600;color:#4d5d6e}
.teacher ul{margin:.7rem 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}

@media (max-width:980px){.path{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .body{flex-direction:column}
  .sidebar{width:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding:.35rem}
  .nav{flex-shrink:0;padding:.4rem .6rem}
  .hide-s{display:none!important}
  main{padding:1rem .9rem 3rem}
  .two,.split{grid-template-columns:1fr}
  .sublist{position:static;flex-direction:row;flex-wrap:wrap}
  .sublist .grp{width:100%}
  .sent.big{font-size:1.2rem}
}
</style>
</head>

},Qe=[{k:"D",variable:!0,role:"Il se place devant le nom et l\u2019annonce. Il indique son genre (masculin / f\xE9minin) et son nombre (singulier / pluriel).",test:"D\xE8s que je vois un d\xE9terminant, je cherche le nom qu\u2019il d\xE9termine. D\xE8s que je vois un nom, je cherche son d\xE9terminant.",families:[["Articles ind\xE9finis","un, une, des"],["Articles d\xE9finis","le, la, l\u2019, les"],["Articles contract\xE9s","au (\xE0 + le), aux (\xE0 + les), du (de + le), des (de + les)"],["Possessifs","mon, ton, son, ma, ta, sa, mes, tes, ses, notre, votre, leur, nos, vos, leurs"],["D\xE9monstratifs","ce, cet, cette, ces"]],ex:["Un|D chien|N court|V apr\xE8s|PREP une|D balle|N .","Mon|D nouvel|A ordinateur|N est|V lent|A ."],trap:"\xAB le, la, l\u2019, les \xBB plac\xE9s devant un verbe ne sont pas des d\xE9terminants : ce sont des pronoms. \xAB Jameel le regarde. \xBB",memo:"Pas de nom ? Pas de d\xE9terminant !"},{k:"N",variable:!0,role:"Il nomme une personne, un animal, une chose ou une id\xE9e. C\u2019est une \xE9tiquette que l\u2019on accroche aux choses.",test:"Je peux mettre \xAB un \xBB ou \xAB une \xBB devant : un cheval, une libert\xE9. Le nom propre commence par une majuscule : R\xE9mi, Casablanca.",ex:["Le|D cheval|N galope|V dans|PREP la|D prairie|N .","R\xE9mi|N habite|V \xE0|PREP Casablanca|N .","La|D libert\xE9|N est|V pr\xE9cieuse|A ."],trap:"Un nom peut d\xE9signer quelque chose qu\u2019on ne peut pas toucher : un r\xEAve, la libert\xE9, le courage.",memo:"\xAB un \xBB ou \xAB une \xBB devant ? C\u2019est un nom !"},{k:"A",variable:!0,role:"Il dit comment est le nom : il apporte une pr\xE9cision (couleur, forme, qualit\xE9\u2026).",test:"Je cherche le nom qu\u2019il pr\xE9cise. Je peux souvent ajouter \xAB tr\xE8s \xBB devant : une porte (tr\xE8s) rouge.",families:[["Accord","Il s\u2019accorde avec le nom : f\xE9minin \u2192 + e, pluriel \u2192 + s ou x. Des filles polies, des gar\xE7ons curieux."]],ex:["Une|D souris|N verte|A court|V .","Les|D vases|N transparents|A sont|V ab\xEEm\xE9s|A .","Un|D vieil|A homme|N sourit|V ."],trap:"Apr\xE8s un verbe d\u2019\xE9tat (\xEAtre, sembler\u2026), l\u2019adjectif reste un adjectif : \xAB R\xE9mi est souriant. \xBB Seule sa fonction change (attribut du sujet).",memo:"L\u2019adjectif est le copain du nom : il s\u2019habille comme lui (genre et nombre)."},{k:"P",variable:!0,role:"Il remplace un nom ou un groupe nominal pour \xE9viter de le r\xE9p\xE9ter.",test:"Je retrouve le nom qu\u2019il remplace : \xAB Mac\xE9o court et il tombe. \xBB \u2192 il = Mac\xE9o.",families:[["Personnels sujets","je, tu, il, elle, on, nous, vous, ils, elles"],["Personnels COD","me, te, le, la, l\u2019, les, nous, vous"],["Personnels COI","me, te, lui, leur, nous, vous"],["R\xE9fl\xE9chis","me, te, se, nous, vous (je me lave, il se lave)"],["Toniques","moi, toi, lui, elle, nous, vous, eux, elles"],["Adverbiaux","en, y"],["Possessifs","le mien, la tienne, les siens\u2026"]],ex:["Mac\xE9o|N court|V et|CCO il|P tombe|V .","R\xE9mi|N lui|P parle|V ."],trap:"\xAB le, la, les \xBB devant un verbe = pronom ; devant un nom = d\xE9terminant.",memo:"Le pronom est un rempla\xE7ant : il entre sur le terrain \xE0 la place du nom."},{k:"V",variable:!0,role:"Il exprime une action (courir, donner) ou un \xE9tat (\xEAtre, sembler). C\u2019est le noyau de la phrase.",test:"Il change quand je change le temps : aujourd\u2019hui je mange, hier je mangeais, demain je mangerai. Je peux l\u2019encadrer par \xAB ne\u2026 pas \xBB.",families:[["Verbes d\u2019action","courir, nager, donner, lancer, parler\u2026"],["Verbes d\u2019\xE9tat","\xEAtre, para\xEEtre, sembler, devenir, demeurer, rester, avoir l\u2019air"]],ex:["Je|P mange|V une|D pomme|N .","Les|D filles|N semblent|V joyeuses|A ."],trap:"Apr\xE8s une pr\xE9position, le verbe est \xE0 l\u2019infinitif : \xAB pour apprendre \xBB, \xAB sans faire de bruit \xBB.",memo:"\xCAtre, para\xEEtre, sembler, devenir, demeurer, rester : le bonhomme qui ne bouge pas."},{k:
