<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Du relatif à Pythagore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Mise en page : une fenêtre KDE — barre de titre, panneau latéral « Emplacements », vue principale à onglets */
:root{
  --window:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --alt:#f4f5f6; --btn:#f7f8f8; --field:#ffffff;
  --text:#232629; --muted:#5b646d; --border:#c2c7cb; --line:#dde0e3; --hover:rgba(61,174,233,.09);
  --accent:#3daee9; --accent-ink:#1a6c9c; --accent-soft:rgba(61,174,233,.15);
  --good:#1e8a4f; --good-soft:rgba(39,174,96,.11); --bad:#c0364a; --bad-soft:rgba(218,68,83,.09);
  --warn:#b85900; --warn-soft:rgba(246,116,0,.11);
  --plus:#1a6c9c; --minus:#b85900; --area:#2b8fc8; --area-soft:rgba(61,174,233,.17); --len:#8a3fb0; --len-soft:rgba(142,68,173,.13);
  --font:"Noto Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --window:#232629; --view:#1b1e20; --header:#2a2e32; --alt:#202326; --btn:#2c3136; --field:#141618;
  --text:#eff0f1; --muted:#a2aab2; --border:#434a51; --line:#33383d; --hover:rgba(61,174,233,.11);
  --accent:#3daee9; --accent-ink:#72c6f0; --accent-soft:rgba(61,174,233,.2);
  --good:#41c77f; --good-soft:rgba(39,174,96,.16); --bad:#f26b7d; --bad-soft:rgba(218,68,83,.16);
  --warn:#ff9d45; --warn-soft:rgba(246,116,0,.16);
  --plus:#72c6f0; --minus:#ff9d45; --area:#5bbcf0; --area-soft:rgba(61,174,233,.2); --len:#c690e6; --len-soft:rgba(155,89,182,.22);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --window:#232629; --view:#1b1e20; --header:#2a2e32; --alt:#202326; --btn:#2c3136; --field:#141618;
  --text:#eff0f1; --muted:#a2aab2; --border:#434a51; --line:#33383d; --hover:rgba(61,174,233,.11);
  --accent:#3daee9; --accent-ink:#72c6f0; --accent-soft:rgba(61,174,233,.2);
  --good:#41c77f; --good-soft:rgba(39,174,96,.16); --bad:#f26b7d; --bad-soft:rgba(218,68,83,.16);
  --warn:#ff9d45; --warn-soft:rgba(246,116,0,.16);
  --plus:#72c6f0; --minus:#ff9d45; --area:#5bbcf0; --area-soft:rgba(61,174,233,.2); --len:#c690e6; --len-soft:rgba(155,89,182,.22);
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:var(--font)}
.app{font-size:15px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
.app.big{font-size:18px;line-height:1.75;letter-spacing:.015em;word-spacing:.06em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
b{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
sup{font-size:.7em;line-height:0}
.rad{white-space:nowrap}
.rad-sign{padding-right:.04em}
.rad-in{border-top:1.5px solid currentColor;padding:0 .14em 0 .1em}
.p{color:var(--plus);font-weight:600}.m{color:var(--minus);font-weight:600}
.ca{color:var(--area);font-weight:600}.cl{color:var(--len);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Barre de titre */
.titlebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:.7em;padding:.4em 16px;background:var(--header);border-bottom:1px solid var(--border);min-height:46px}
.titlebar svg{flex:none}
.tb-name{font-weight:600}
.tb-sub{color:var(--muted);font-size:.87em}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:.55em;font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.switch{display:inline-flex;align-items:center;gap:.45em;font-size:.87em;cursor:pointer;background:none;border:0;padding:.3em .2em}
.switch .track{width:30px;height:16px;border-radius:8px;border:1px solid var(--border);background:var(--field);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .track{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(14px);background:var(--accent)}

/* Structure */
.layout{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side-cap{font-size:.74em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.5em .75em .35em}
.side-item{display:flex;align-items:center;gap:.65em;width:100%;padding:.45em .7em;border:1px solid transparent;border-radius:4px;background:none;text-align:left;cursor:pointer}
.side-item:hover{background:var(--hover)}
.side-item[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.side-item .ic{width:22px;height:22px;flex:none;color:var(--muted)}
.side-item[aria-current="page"] .ic{color:var(--accent-ink)}
.side-item .cnt{margin-left:auto;font-size:.8em;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:1em .5em .3em;display:grid;gap:.4em;font-size:.85em}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;text-align:left}
.main{background:var(--view);min-width:0;display:flex;flex-direction:column}
.wrap{max-width:880px;width:100%;margin:0 auto;padding-inline:28px}
.mod-head{padding-block:1.5em 1em}
.mod-head h2{font-size:1.5em;font-weight:600}
.mod-head p{color:var(--muted);margin-top:.25em;max-width:62ch}
.tabs-bar{border-bottom:1px solid var(--border);background:var(--view);position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:5}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;padding:.6em 1em;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:.45em}
.tab:hover{color:var(--text);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .tn{font-size:.75em;width:1.6em;height:1.6em;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-weight:600}
.page{padding-block:1.6em 4em;display:grid;gap:1.4em}
.lead{color:var(--muted);font-size:.93em}

/* Cadres et sections */
.frame{background:var(--view);border:1px solid var(--line);border-radius:5px;padding:1em 1.1em}
.sec{display:grid;gap:.7em}
.sec h3{font-size:1.12em;font-weight:600;display:flex;gap:.55em;align-items:baseline}
.sec h3 .sn{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.sec p{max-width:66ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:.8em}
.two .frame{display:grid;gap:.4em;align-content:start;background:var(--alt)}
.two h4{font-size:.98em;font-weight:600}
.ex{font-size:1.12em;font-variant-numeric:tabular-nums;padding:.35em .7em;background:var(--alt);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;justify-self:start}
.two .ex{background:var(--view)}
.keep{border:1px solid var(--accent);background:var(--accent-soft);border-radius:5px;padding:.9em 1.1em;display:grid;gap:.5em}
.keep h4{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.keep ul{margin:0;padding-left:1.2em;display:grid;gap:.3em}
.legend{display:flex;flex-wrap:wrap;gap:1em;font-size:.88em;color:var(--muted);align-items:center}
.sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.05em;margin-right:.35em}
.sw-p{background:var(--plus)}.sw-m{background:var(--minus)}.sw-a{background:var(--area)}.sw-l{background:var(--len)}
table.signs{border-collapse:collapse;font-size:1.05em;text-align:center}
table.signs th,table.signs td{border:1px solid var(--line);padding:.35em .9em}
table.signs th{background:var(--alt);font-weight:600}
.prio{margin:0;padding-left:1.4em;display:grid;gap:.15em}
.sq-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.4em,1fr));gap:.4em}
.sq-table div{border:1px solid var(--line);border-radius:3px;padding:.3em .5em;text-align:center;font-variant-numeric:tabular-nums;background:var(--alt)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;font-size:1.15em}
.chain .box{border:1px solid var(--border);border-radius:4px;padding:.25em .7em;background:var(--alt)}
.chain .arr{font-size:.75em;color:var(--muted);text-align:center;line-height:1.2}

/* Boutons, champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.35em .95em;border:1px solid var(--border);border-radius:3px;background:var(--btn);cursor:pointer;min-height:2.2em}
.btn:hover{border-color:var(--accent)}
.btn.primary{border-color:var(--accent);background:var(--accent-soft)}
.btn.small{min-height:1.9em;padding:.2em .7em;font-size:.88em}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.field{padding:.35em .6em;border:1px solid var(--border);border-radius:3px;background:var(--field);width:7.5em;min-height:2.2em;font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.field.sm{width:4.5em;text-align:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--btn);padding:.35em .9em;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:.8em 1.4em}
.ctrl{display:grid;gap:.15em}
.ctrl label{font-size:.88em;color:var(--muted);display:flex;justify-content:space-between;gap:1em}
.ctrl output{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* Messages type KMessageWidget */
.msg{display:flex;gap:.65em;align-items:flex-start;padding:.6em .85em;border:1px solid var(--accent);background:var(--accent-soft);border-radius:4px}
.msg .mi{flex:none;width:1.35em;height:1.35em;border-radius:50%;display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--view);background:var(--accent);margin-top:.12em}
.msg.good{border-color:var(--good);background:var(--good-soft)}.msg.good .mi{background:var(--good)}
.msg.bad{border-color:var(--bad);background:var(--bad-soft)}.msg.bad .mi{background:var(--bad)}
.msg.warn{border-color:var(--warn);background:var(--warn-soft)}.msg.warn .mi{background:var(--warn)}
.msg>div{min-width:0}

/* Manipulations */
.lab{display:grid;gap:1em}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.fig{display:block;width:100%;max-width:300px;height:auto}
.readout{font-size:1.15em;font-variant-numeric:tabular-nums;display:grid;gap:.3em}
.readout .big{font-size:1.3em;font-weight:600}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.2em;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.35em}
.chip{border:1px solid var(--border);border-radius:3px;background:var(--btn);padding:.2em .55em;cursor:pointer;font-variant-numeric:tabular-nums;font-size:.9em}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.factor{font-size:1.2em;min-width:3.4em}
svg text{font-family:var(--font)}
.ax{stroke:var(--text);stroke-width:1.5}
.tk{stroke:var(--muted);stroke-width:1}
.tl{fill:var(--muted);font-size:13px}
.tl0{fill:var(--text);font-weight:700}
.arc-p{fill:none;stroke:var(--plus);stroke-width:2.5}
.arc-m{fill:none;stroke:var(--minus);stroke-width:2.5}
.ah-p{fill:var(--plus)}.ah-m{fill:var(--minus)}
.lbl-p{fill:var(--plus);font-weight:700;font-size:15px}.lbl-m{fill:var(--minus);font-weight:700;font-size:15px}
.dot-a{fill:var(--view);stroke:var(--text);stroke-width:2}
.dot-r{fill:var(--accent);stroke:var(--accent-ink);stroke-width:1.5}
.tag-t{fill:var(--text);font-size:12px;font-weight:600}
.sq-fill{fill:var(--area-soft);stroke:var(--area);stroke-width:2}
.sq-grid{stroke:var(--area);stroke-width:.7;opacity:.55}
.sq-lab{fill:var(--text);font-weight:700;paint-order:stroke;stroke:var(--view);stroke-width:4;stroke-linejoin:round}
.side-t{fill:var(--len);font-weight:700}
.len-line{stroke:var(--len);stroke-width:3}
.lenmark{fill:var(--len)}
.areamark{fill:var(--area)}
.leg{stroke:var(--area);stroke-width:3}
.hyp{stroke:var(--len);stroke-width:3.5}
.tri-fill{fill:var(--alt);stroke:none}
.ra{fill:none;stroke:var(--text);stroke-width:1.5}
.vx{fill:var(--text);font-size:15px;font-weight:700}
.sl{fill:var(--area);font-size:13px;font-weight:600}
.sl-h{fill:var(--len)}
.leg-sq{fill:var(--area-soft);stroke:var(--area)}
.hyp-sq{fill:var(--len-soft);stroke:var(--len)}
.tri-main{fill:var(--view);stroke:var(--text)}
.g-line{stroke-width:1;opacity:.5}
.g-leg{stroke:var(--area)}.g-hyp{stroke:var(--len)}
.interval{stroke:var(--accent);stroke-width:5;stroke-linecap:round;opacity:.55}

/* Mémoriser */
.card{min-height:10em;display:grid;place-items:center;text-align:center;padding:1.4em;border:1px solid var(--border);border-radius:6px;background:var(--alt);font-size:1.12em}
.card.back{background:var(--accent-soft);border-color:var(--accent)}
.card .side{font-size:.7em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.6em}
.drill-q{font-size:1.6em;font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots span{width:10px;height:10px;border-radius:50%;border:1px solid var(--border);background:var(--field)}
.dots span.ok{background:var(--good);border-color:var(--good)}
.dots span.ko{background:var(--bad);border-color:var(--bad)}
.dots span.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* Quiz */
.q-prompt{font-size:1.15em;font-weight:500}
.opts{display:grid;gap:.5em}
.opt{display:flex;gap:.75em;align-items:center;width:100%;text-align:left;padding:.55em .8em;border:1px solid var(--border);border-radius:4px;background:var(--btn);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .letter{flex:none;width:1.7em;height:1.7em;border-radius:3px;border:1px solid var(--border);display:grid;place-items:center;font-size:.82em;font-weight:600;background:var(--view)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* Exercices */
.fam-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13em),1fr));gap:.45em}
.fam-btn{display:flex;align-items:center;gap:.55em;padding:.45em .7em;border:1px solid var(--border);border-radius:4px;background:var(--btn);cursor:pointer;text-align:left}
.fam-btn:hover{border-color:var(--accent)}
.fam-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fam-n{flex:none;width:1.65em;height:1.65em;border-radius:50%;border:1px solid var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8em;font-weight:600}
.fam-t{flex:1;font-size:.92em;line-height:1.3}
.fam-c{font-size:.78em;color:var(--muted);font-variant-numeric:tabular-nums}
.fam-c.full{color:var(--good);font-weight:600}
.fam-head{display:grid;gap:.25em}
.fam-head h3{font-size:1.2em;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:.35em;font-size:.75em;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:.1em .5em;background:var(--accent-soft)}
.worked{display:grid;gap:.8em;border-color:var(--accent)}
.worked-head{display:flex;flex-wrap:wrap;gap:.6em;align-items:center;font-size:.9em}
.prompt{font-size:1.08em;max-width:66ch}
.expr{font-size:1.3em;font-weight:500;font-variant-numeric:tabular-nums}
.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:.7em}
.steps li{counter-increment:s;display:grid;grid-template-columns:1.9em minmax(0,1fr);gap:.55em;align-items:start}
.steps li::before{content:counter(s);width:1.75em;height:1.75em;border-radius:50%;border:1px solid var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.82em;font-weight:600;background:var(--view)}
.steps .st{font-weight:600}
.steps .sd{font-variant-numeric:tabular-nums}
.res{font-weight:600;font-size:1.08em;padding:.4em .75em;border:1px solid var(--good);background:var(--good-soft);border-radius:4px;justify-self:start}
.exlist{display:grid;gap:1em}
.excard{display:grid;gap:.75em}
.excard.done{border-color:var(--good)}
.ex-top{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;font-size:.88em;color:var(--muted)}
.ex-top .t{font-weight:600;color:var(--text);font-size:1.05em}
.stars{display:inline-flex;gap:1px;vertical-align:-.15em}
.stars svg{width:1em;height:1em}
.star-on{fill:#f6b400}.star-off{fill:none;stroke:var(--muted);stroke-width:1.3}
.solved{color:var(--good);font-weight:600}
.method{border:1px dashed var(--border);border-radius:4px;padding:.55em .8em;font-size:.92em;background:var(--alt)}
.method ol{margin:.3em 0 0;padding-left:1.3em;display:grid;gap:.15em}
.answer{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.answer label{font-size:.9em;color:var(--muted)}
.ineq{display:flex;flex-wrap:wrap;align-items:center;gap:.45em;font-size:1.12em}
.choices{display:flex;flex-wrap:wrap;gap:.5em}
.choices .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.corr{display:grid;gap:.75em;border-top:1px solid var(--line);padding-top:.8em}
.corr h4{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.next-row{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:1em}

@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px 16px;gap:6px;background:var(--window)}
  .side-cap,.side-foot{display:none}
  .side-item{flex:none;width:auto}
  .side-item .cnt{display:none}
  .wrap{padding-inline:16px}
  .tb-sub{display:none}
  .bar{width:56px}
  .tabs-bar{position:static}
  .lab-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useMemo } = React;
const html = htm.bind(React.createElement);

/* ---------- Outils ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("drp_" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("drp_" + k, JSON.stringify(v)); }catch(e){} }
};
const fmt = x => { const r = Math.round(x * 10000) / 10000; const s = String(Math.abs(r)).replace(".", ","); return (r < 0 ? "−" : "") + s; };
const sg = v => v > 0 ? "+" + fmt(v) : v < 0 ? fmt(v) : "0";
const parseNum = s => {
  if (s == null) return NaN;
  const t = String(s).trim().replace(/\s/g, "").replace(/[−–]/g, "-").replace(",", ".");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return parseFloat(t);
};
const near = (a, b, tol) => Math.abs(a - b) <= (tol == null ? 1e-6 : tol);
const fm = h => String(h)
  .replace(/√\{([^}]*)\}/g, '<span class="rad"><span class="rad-sign">√</span><span class="rad-in">$1</span></span>')
  .replace(/\^(\d)/g, "<sup>$1</sup>");
const H = ({ h, as = "span", className }) => React.createElement(as, { className, dangerouslySetInnerHTML: { __html: fm(h) } });
const Rad = ({ children }) => html`<span className="rad"><span className="rad-sign">√</span><span className="rad-in">${children}</span></span>`;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Petits composants ---------- */
const ICON = { good: "✓", bad: "✕", warn: "!", info: "i" };
function Msg({ kind = "info", children }){
  return html`<div className=${"msg " + kind} role=${kind === "bad" || kind === "warn" ? "alert" : "status"}><span className="mi" aria-hidden="true">${ICON[kind]}</span><div>${children}</div></div>`;
}
function Stars({ n }){
  const p = "M8 1.2l2 4.3 4.7.6-3.4 3.3.8 4.7L8 11.8 3.9 14.1l.8-4.7L1.3 6.1 6 5.5z";
  return html`<span className="stars" aria-label=${"Difficulté " + n + " sur 3"}>${[1,2,3].map(i => html`<svg key=${i} viewBox="0 0 16 16" aria-hidden="true"><path d=${p} className=${i <= n ? "star-on" : "star-off"}/></svg>`)}</span>`;
}
function Sec({ n, title, children }){
  return html`<section className="sec">${title && html`<h3>${n != null && html`<span className="sn">${n}.</span>`}<span>${title}</span></h3>`}${children}</section>`;
}
function Keep({ items }){
  return html`<div className="keep"><h4>Je retiens</h4><ul>${items.map((t, i) => html`<li key=${i}><${H} h=${t}/></li>`)}</ul></div>`;
}

/* Triangle rectangle de référence : R = angle droit, P en haut, Q à droite. [PQ] = hypoténuse */
function TriFig({ f }){
  return html`<svg className="fig" viewBox="0 0 270 160" role="img" aria-label=${"Triangle " + f.P + f.R + f.Q + " rectangle en " + f.R}>
    <polygon points="70,130 70,28 230,130" className="tri-fill"/>
    <line x1="70" y1="130" x2="70" y2="28" className="leg"/>
    <line x1="70" y1="130" x2="230" y2="130" className="leg"/>
    <line x1="70" y1="28" x2="230" y2="130" className="hyp"/>
    <polyline points="70,116 84,116 84,130" className="ra"/>
    <text x="56" y="148" className="vx">${f.R}</text>
    <text x="58" y="24" className="vx">${f.P}</text>
    <text x="236" y="148" className="vx">${f.Q}</text>
    ${f.rp && html`<text x="62" y="84" textAnchor="end" className="sl">${f.rp}</text>`}
    ${f.rq && html`<text x="150" y="150" textAnchor="middle" className="sl">${f.rq}</text>`}
    ${f.pq && html`<text x="156" y="70" className="sl sl-h">${f.pq}</text>`}
  </svg>`;
}

/* ---------- Manipulations ---------- */
function NumberLab(){
  const [a, setA] = useState(-3);
  const [b, setB] = useState(5);
  const [op, setOp] = useState("+");
  const mv = op === "+" ? b : -b;
  const r = a + mv;
  const X = v => 40 + (v + 10) * 26;
  const y0 = 100;
  const h = Math.min(66, 16 + Math.abs(mv) * 9);
  const xa = X(a), xr = X(r);
  const cls = mv >= 0 ? "p" : "m";
  const ticks = [];
  for (let v = -10; v <= 10; v++) ticks.push(v);
  return html`<div className="lab">
    <div className="frame lab">
      <div className="svgbox"><svg viewBox="0 0 600 150" role="img" aria-label=${"Droite graduée : départ " + fmt(a) + ", arrivée " + fmt(r)}>
        <defs>
          <marker id="ah-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" className="ah-p"/></marker>
          <marker id="ah-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" className="ah-m"/></marker>
        </defs>
        <line x1="30" y1=${y0} x2="570" y2=${y0} className="ax"/>
        ${ticks.map(v => html`<g key=${v}><line x1=${X(v)} y1=${y0 - (v === 0 ? 8 : 5)} x2=${X(v)} y2=${y0 + (v === 0 ? 8 : 5)} className=${v === 0 ? "ax" : "tk"}/><text x=${X(v)} y=${y0 + 22} textAnchor="middle" className=${"tl" + (v === 0 ? " tl0" : "")}>${fmt(v)}</text></g>`)}
        ${mv !== 0 && html`<path d=${"M" + xa + "," + (y0 - 7) + " Q" + (xa + xr) / 2 + "," + (y0 - 7 - h * 2) + " " + xr + "," + (y0 - 7)} className=${"arc-" + cls} markerEnd=${"url(#ah-" + cls + ")"}/>`}
        ${mv !== 0 && html`<text x=${(xa + xr) / 2} y=${y0 - 13 - h} textAnchor="middle" className=${"lbl-" + cls}>${sg(mv)}</text>`}
        <circle cx=${xa} cy=${y0} r="6" className="dot-a"/>
        <circle cx=${xr} cy=${y0} r="6" className="dot-r"/>
        <text x=${xa} y=${y0 + 42} textAnchor="middle" className="tag-t">départ</text>
        ${r !== a && html`<text x=${xr} y=${y0 + 42} textAnchor="middle" className="tag-t">arrivée</text>`}
      </svg></div>
      <div className="row"><div className="seg" role="group" aria-label="Opération">
        <button aria-pressed=${op === "+"} onClick=${() => setOp("+")}>Ajouter</button>
        <button aria-pressed=${op === "−"} onClick=${() => setOp("−")}>Soustraire</button>
      </div></div>
      <div className="ctrls">
        <div className="ctrl"><label htmlFor="nl-a">Nombre de départ <output>${sg(a)}</output></label><input id="nl-a" type="range" min="-5" max="5" step="0.5" value=${a} onChange=${e => setA(+e.target.value)}/></div>
        <div className="ctrl"><label htmlFor="nl-b">Nombre ${op === "+" ? "ajouté" : "soustrait"} <output>${sg(b)}</output></label><input id="nl-b" type="range" min="-5" max="5" step="0.5" value=${b} onChange=${e => setB(+e.target.value)}/></div>
      </div>
      <div className="readout">
        <div className="big">(${sg(a)}) ${op} (${sg(b)})${op === "−" ? html` = (${sg(a)}) + (<span className=${b > 0 ? "m" : "p"}>${sg(-b)}</span>)` : ""} = ${fmt(r)}</div>
        <div className="muted" style=${{ fontSize: ".85em" }}>${op === "−" ? "Soustraire " + sg(b) + ", c'est ajouter son opposé " + sg(-b) + ". " : ""}${mv === 0 ? "Je ne bouge pas." : "Je pars de " + fmt(a) + " et je me déplace de " + fmt(Math.abs(mv)) + (mv > 0 ? " vers la droite." : " vers la gauche.")}</div>
      </div>
    </div>
    <p className="legend"><span><span className="sw sw-p"></span>flèche vers la droite : on ajoute un positif</span><span><span className="sw sw-m"></span>flèche vers la gauche : on ajoute un négatif</span></p>
  </div>`;
}

function SignLab(){
  const [fs, setFs] = useState([-2, 3, -1, 4]);
  const neg = fs.filter(v => v < 0).length;
  const prod = fs.reduce((p, v) => p * v, 1);
  const toggle = i => setFs(fs.map((v, k) => k === i ? -v : v));
  const add = () => fs.length < 6 && setFs([...fs, [2, 5, 3, 1, 2, 3][fs.length]]);
  const del = () => fs.length > 2 && setFs(fs.slice(0, -1));
  return html`<div className="frame lab">
    <p>Clique sur un facteur pour changer son signe.</p>
    <div className="row">${fs.map((v, i) => html`<${React.Fragment} key=${i}>${i > 0 && html`<span aria-hidden="true">×</span>`}<button className="btn factor" onClick=${() => toggle(i)} aria-label=${"Facteur " + (i + 1) + " : " + sg(v) + ". Changer le signe"}><span className=${v < 0 ? "m" : "p"}>(${sg(v)})</span></button><//>`)}</div>
    <div className="row"><button className="btn small" onClick=${add} disabled=${fs.length >= 6}>Ajouter un facteur</button><button className="btn small" onClick=${del} disabled=${fs.length <= 2}>Retirer un facteur</button></div>
    <div className="readout">
      <div>Facteurs négatifs : <b>${neg}</b> → nombre <b>${neg % 2 === 0 ? "pair" : "impair"}</b> → produit <b className=${prod < 0 ? "m" : "p"}>${prod < 0 ? "négatif" : "positif"}</b></div>
      <div className="big">Produit = ${sg(prod)}</div>
    </div>
  </div>`;
}

function SquareLab(){
  const [n, setN] = useState(4);
  const S = 280, c = S / n;
  const lines = [];
  for (let k = 1; k < n; k++){ lines.push([k * c, 0, k * c, S]); lines.push([0, k * c, S, k * c]); }
  return html`<div className="frame lab">
    <div className="lab-grid">
      <div className="svgbox"><svg viewBox="-34 -8 330 330" role="img" aria-label=${"Carré de côté " + n + ", aire " + n * n}>
        <rect x="0" y="0" width=${S} height=${S} className="sq-fill"/>
        ${lines.map((l, i) => html`<line key=${i} x1=${l[0]} y1=${l[1]} x2=${l[2]} y2=${l[3]} className="sq-grid"/>`)}
        <line x1="0" y1=${S + 12} x2=${S} y2=${S + 12} className="len-line"/>
        <text x=${S / 2} y=${S + 34} textAnchor="middle" className="side-t" style=${{ fontSize: "16px" }}>côté ${n}</text>
        <line x1="-12" y1="0" x2="-12" y2=${S} className="len-line"/>
        <text x="-20" y=${S / 2} textAnchor="middle" className="side-t" style=${{ fontSize: "16px" }} transform=${"rotate(-90 -20 " + S / 2 + ")"}>côté ${n}</text>
        <text x=${S / 2} y=${S / 2 + 10} textAnchor="middle" className="sq-lab" style=${{ fontSize: "28px" }}>${n * n}</text>
      </svg></div>
      <div className="lab">
        <div className="ctrl"><label htmlFor="sq-n">Longueur du côté <output>${n}</output></label><input id="sq-n" type="range" min="1" max="15" step="1" value=${n} onChange=${e => setN(+e.target.value)}/></div>
        <div className="readout">
          <div className="big"><span className="cl">${n}</span><sup>2</sup> = ${n} × ${n} = <span className="ca">${n * n}</span></div>
          <div className="muted" style=${{ fontSize: ".85em" }}>Le carré contient ${n} rangées de ${n} petits carrés : ${n * n} petits carrés en tout.</div>
        </div>
        <p className="legend"><span><span className="sw sw-l"></span>longueur du côté</span><span><span className="sw sw-a"></span>aire</span></p>
      </div>
    </div>
    <div><p className="muted" style=${{ fontSize: ".88em", marginBottom: ".4em" }}>Les carrés parfaits de 1 à 15 (clique pour les voir) :</p>
    <div className="chips">${Array.from({ length: 15 }, (_, i) => i + 1).map(k => html`<button key=${k} className="chip" aria-pressed=${k === n} onClick=${() => setN(k)}>${k}² = ${k * k}</button>`)}</div></div>
  </div>`;
}

function RootLab(){
  const [A, setA] = useState(31);
  const s = Math.sqrt(A);
  const n = Math.floor(s + 1e-9);
  const perfect = n * n === A;
  const X = t => 30 + t * (620 / 15);
  const side = (s / 15) * 200;
  return html`<div className="frame lab">
    <div className="ctrl"><label htmlFor="rt-a">Aire du carré (nombre sous la racine) <output>${A}</output></label><input id="rt-a" type="range" min="0" max="225" step="1" value=${A} onChange=${e => setA(+e.target.value)}/></div>
    <div className="lab-grid">
      <div className="svgbox"><svg viewBox="0 0 250 250" role="img" aria-label=${"Carré d'aire " + A}>
        <rect x="30" y=${220 - side} width=${side} height=${side} className="sq-fill"/>
        <line x1="30" y1="232" x2=${30 + side} y2="232" className="len-line"/>
        ${side > 0 && html`<text x=${30 + side / 2} y="248" textAnchor="middle" className="side-t" style=${{ fontSize: "14px" }}>côté ≈ ${fmt(Math.round(s * 100) / 100)}</text>`}
        ${side > 40 && html`<text x=${30 + side / 2} y=${226 - side / 2} textAnchor="middle" className="sq-lab" style=${{ fontSize: "18px" }}>aire ${A}</text>`}
      </svg></div>
      <div className="readout">
        ${perfect
          ? html`<div><b>${A}</b> est un carré parfait : ${n}² = ${A}.</div><div className="big"><${Rad}>${A}<//> = ${n}</div>`
          : html`<div><span className="ca">${n}² = ${n * n}</span> ${"<"} <b>${A}</b> ${"<"} <span className="ca">${n + 1}² = ${(n + 1) * (n + 1)}</span></div>
                 <div className="big"><span className="cl">${n}</span> ${"<"} <${Rad}>${A}<//> ${"<"} <span className="cl">${n + 1}</span></div>
                 <div className="muted" style=${{ fontSize: ".85em" }}>Calculatrice : <${Rad}>${A}<//> ≈ ${fmt(Math.round(s * 1000) / 1000)}… soit ${fmt(Math.round(s * 10) / 10)} au dixième.</div>`}
      </div>
    </div>
    <div className="svgbox"><svg viewBox="0 0 680 128" role="img" aria-label="Deux graduations alignées : les carrés au-dessus, les entiers au-dessous">
      <text x="30" y="14" className="tl" style=${{ fill: "var(--area)", fontWeight: 600 }}>carrés (sous la racine)</text>
      <text x="30" y="126" className="tl" style=${{ fill: "var(--len)", fontWeight: 600 }}>entiers (racines)</text>
      <line x1="30" y1="66" x2="650" y2="66" className="ax"/>
      ${!perfect && html`<line x1=${X(n)} y1="66" x2=${X(n + 1)} y2="66" className="interval"/>`}
      ${Array.from({ length: 16 }, (_, k) => html`<g key=${k}>
        <line x1=${X(k)} y1="59" x2=${X(k)} y2="73" className="tk"/>
        <text x=${X(k)} y="46" textAnchor="middle" style=${{ fontSize: "12px", fill: "var(--area)" }}>${k * k}</text>
        <text x=${X(k)} y="94" textAnchor="middle" style=${{ fontSize: "13px", fill: "var(--len)", fontWeight: 600 }}>${k}</text>
      </g>`)}
      <line x1=${X(s)} y1="24" x2=${X(s)} y2="104" stroke="var(--accent)" strokeWidth="2"/>
      <circle cx=${X(s)} cy="66" r="5" className="dot-r"/>
    </svg></div>
    <p className="muted" style=${{ fontSize: ".88em" }}>Au-dessus : le nombre sous la racine se place entre deux carrés. Au-dessous, juste en face : sa racine se place entre les deux entiers correspondants.</p>
  </div>`;
}

function PythLab({ interactive = true, a0 = 3, b0 = 4 }){
  const [b, setB] = useState(a0);
  const [c, setC] = useState(b0);
  const h2 = b * b + c * c, h = Math.sqrt(h2);
  /* Le dessin est mis à l'échelle en pixels (environ 400 px de large) pour que textes et traits gardent une taille lisible */
  const pad = 1.6;
  const minX = -c - pad, maxX = b + c + pad, minY = -b - pad, maxY = c + b + pad;
  const W = maxX - minX, Hh = maxY - minY;
  const k = 400 / Math.max(W, Hh);
  const P = (x, y) => [x * k, -y * k];
  const pts = arr => arr.map(p => P(p[0], p[1]).join(",")).join(" ");
  const A = [0, 0], B = [b, 0], C = [0, c];
  const sqAB = [A, B, [b, -b], [0, -b]];
  const sqAC = [A, C, [-c, c], [-c, 0]];
  const sqBC = [B, [b + c, b], [c, c + b], C];
  const fs = 15;
  const vb = [minX * k, -maxY * k, W * k, Hh * k].join(" ");
  const cen = q => { const x = q.reduce((t, p) => t + p[0], 0) / 4, y = q.reduce((t, p) => t + p[1], 0) / 4; return P(x, y); };
  const grid = (O, U, V, cls) => {
    const L = Math.hypot(U[0], U[1]);
    if (Math.abs(L - Math.round(L)) > 1e-9 || L < 2) return [];
    const out = [], n = Math.round(L);
    for (let j = 1; j < n; j++){
      const t = j / n;
      const p1 = [O[0] + U[0] * t, O[1] + U[1] * t], q1 = [p1[0] + V[0], p1[1] + V[1]];
      const p2 = [O[0] + V[0] * t, O[1] + V[1] * t], q2 = [p2[0] + U[0], p2[1] + U[1]];
      out.push([P(p1[0], p1[1]), P(q1[0], q1[1]), cls], [P(p2[0], p2[1]), P(q2[0], q2[1]), cls]);
    }
    return out;
  };
  const lines = [...grid(A, [b, 0], [0, -b], "g-leg"), ...grid(A, [0, c], [-c, 0], "g-leg"), ...grid(B, [c, b], [-b, c], "g-hyp")];
  const ra = Math.min(14, Math.min(b, c) * k * .3);
  const [Bx, By] = P(b, 0), [Cx, Cy] = P(0, c);
  const lab = (q, t, col) => { const p = cen(q); return html`<text x=${p[0]} y=${p[1] + fs * .35} textAnchor="middle" className="sq-lab" style=${{ fontSize: fs + "px", fill: col }}>${t}</text>`; };
  return html`<div className="frame lab">
    <div className="lab-grid">
      <div className="svgbox"><svg viewBox=${vb} role="img" aria-label=${"Triangle ABC rectangle en A avec AB = " + fmt(b) + " et AC = " + fmt(c)} style=${{ maxHeight: "400px" }}>
        <polygon points=${pts(sqAB)} className="leg-sq" strokeWidth="1.5"/>
        <polygon points=${pts(sqAC)} className="leg-sq" strokeWidth="1.5"/>
        <polygon points=${pts(sqBC)} className="hyp-sq" strokeWidth="1.5"/>
        ${lines.map((l, i) => html`<line key=${i} x1=${l[0][0]} y1=${l[0][1]} x2=${l[1][0]} y2=${l[1][1]} className=${"g-line " + l[2]}/>`)}
        <polygon points=${pts([A, B, C])} className="tri-main" strokeWidth="2"/>
        <line x1="0" y1="0" x2=${Bx} y2=${By} className="leg"/>
        <line x1="0" y1="0" x2=${Cx} y2=${Cy} className="leg"/>
        <line x1=${Bx} y1=${By} x2=${Cx} y2=${Cy} className="hyp"/>
        <polyline points=${ra + ",0 " + ra + "," + (-ra) + " 0," + (-ra)} className="ra"/>
        <text x="-8" y="18" textAnchor="end" className="vx" style=${{ fontSize: "16px" }}>A</text>
        <text x=${Bx + 7} y=${By + 18} className="vx" style=${{ fontSize: "16px" }}>B</text>
        <text x="-8" y=${Cy - 6} textAnchor="end" className="vx" style=${{ fontSize: "16px" }}>C</text>
        ${lab(sqAB, "AB² = " + fmt(b * b), "var(--area)")}
        ${lab(sqAC, "AC² = " + fmt(c * c), "var(--area)")}
        ${lab(sqBC, "BC² = " + fmt(h2), "var(--len)")}
      </svg></div>
      <div className="lab">
        ${interactive && html`<div className="ctrls" style=${{ gridTemplateColumns: "1fr" }}>
          <div className="ctrl"><label htmlFor="py-b">Longueur AB <output>${fmt(b)}</output></label><input id="py-b" type="range" min="1" max="8" step="0.5" value=${b} onChange=${e => setB(+e.target.value)}/></div>
          <div className="ctrl"><label htmlFor="py-c">Longueur AC <output>${fmt(c)}</output></label><input id="py-c" type="range" min="1" max="8" step="0.5" value=${c} onChange=${e => setC(+e.target.value)}/></div>
        </div>`}
        <div className="readout" style=${{ fontSize: "1.02em" }}>
          <div><span className="ca">AB² + AC²</span> = ${fmt(b * b)} + ${fmt(c * c)} = <b>${fmt(h2)}</b></div>
          <div><span className="cl">BC²</span> = <b>${fmt(h2)}</b></div>
          <div className="big">BC = <${Rad}>${fmt(h2)}<//> ${Number.isInteger(Math.round(h * 1e6) / 1e6) ? "= " + fmt(h) : "≈ " + fmt(Math.round(h * 10) / 10)}</div>
        </div>
        <p className="legend"><span><span className="sw sw-a"></span>côtés de l'angle droit</span><span><span className="sw sw-l"></span>hypoténuse</span></p>
        ${interactive && html`<p className="muted" style=${{ fontSize: ".85em" }}>Essaie 3 et 4, puis 6 et 8 : avec des nombres entiers, tu peux compter les petits carrés.</p>`}
      </div>
    </div>
  </div>`;
}

function TriTester(){
  const [v, setV] = useState(["6", "8", "10"]);
  const nums = v.map(parseNum);
  const ok = nums.every(x => !isNaN(x) && x > 0);
  let out = null;
  if (!ok) out = html`<${Msg} kind="warn">Écris trois longueurs positives (par exemple 5 ; 12 ; 13).<//>`;
  else {
    const sorted = nums.map((x, i) => [x, "abc"[i]]).sort((p, q) => q[0] - p[0]);
    const [g, x, y] = sorted.map(p => p[0]);
    if (g >= x + y) out = html`<${Msg} kind="warn">Ces trois longueurs ne forment pas un triangle : le plus grand côté est trop long (${fmt(g)} ≥ ${fmt(x)} + ${fmt(y)}).<//>`;
    else {
      const G = Math.round(g * g * 1e6) / 1e6, S = Math.round((x * x + y * y) * 1e6) / 1e6;
      const eq = near(G, S, 1e-9);
      out = html`<div className="readout">
        <div>Plus grand côté : <b className="cl">${fmt(g)}</b> → ${fmt(g)}² = <b>${fmt(G)}</b></div>
        <div>Les deux autres : ${fmt(x)}² + ${fmt(y)}² = ${fmt(x * x)} + ${fmt(y * y)} = <b>${fmt(S)}</b></div>
        <${Msg} kind=${eq ? "good" : "bad"}>${eq ? "Égalité : d'après la réciproque du théorème de Pythagore, le triangle est rectangle." : "Pas d'égalité (" + fmt(G) + " ≠ " + fmt(S) + ") : le triangle n'est pas rectangle."}<//>
      </div>`;
    }
  }
  return html`<div className="frame lab">
    <p>Écris les longueurs des trois côtés d'un triangle.</p>
    <div className="row">${[0, 1, 2].map(i => html`<input key=${i} id=${"tt-" + i} className="field sm" aria-label=${"Côté " + (i + 1)} value=${v[i]} onChange=${e => { const c = [...v]; c[i] = e.target.value; setV(c); }}/>`)}<span className="muted">(même unité)</span></div>
    ${out}
  </div>`;
}

function Drill({ d }){
  const N = 10;
  const [i, setI] = useState(0);
  const [q, setQ] = useState(() => d.gen());
  const [val, setVal] = useState("");
  const [res, setRes] = useState([]);
  const [fb, setFb] = useState(null);
  const done = i >= N;
  const submit = e => {
    e.preventDefault();
    if (fb){ setI(i + 1); setQ(d.gen()); setVal(""); setFb(null); return; }
    const v = parseNum(val);
    if (isNaN(v)){ setFb({ kind: "warn", t: "Écris un nombre." }); return; }
    const ok = near(v, q.a);
    setRes([...res, ok]);
    setFb({ kind: ok ? "good" : "bad", t: ok ? "Juste." : "La réponse était " + fmt(q.a) + ". " + q.e });

  }
  return html`<form className="frame lab" onSubmit=${submit}>
    <div className="dots" aria-label=${"Question " + (i + 1) + " sur " + N}>${Array.from({ length: N }, (_, k) => html`<span key=${k} className=${k < res.length ? (res[k] ? "ok" : "ko") : k === i ? "cur" : ""}></span>`)}</div>

  </div>`;
}

/* ---------- Exercices ---------- */
function evaluate(ex, vals, tries){
  const again = tries >= 1 ? " Tu peux demander un indice ou regarder la correction." : " Reprends ta démarche étape par étape.";
  if (ex.type === "choice"){
    if (vals[0] === ex.a) return { ok: true, kind: "good", msg: "C'est juste. Bravo !" };
    return { ok: false, kind: "bad", msg: "Pas encore." + again };
  }
  if (ex.type === "pair"){
    const v = parseNum(vals[0]), w = parseNum(vals[1]);
    if (isNaN(v) || isNaN(w)) return { ok: false, kind: "warn", msg: "Écris un nombre entier dans chaque case." };
    if (v === ex.a[0] && w === ex.a[1]) return { ok: true, kind: "good", msg: "C'est juste. Bravo !" };
    if (v === ex.a[0] * ex.a[0] && w === ex.a[1] * ex.a[1]) return { ok: false, kind: "bad", msg: "Tu as écrit les carrés qui encadrent " + ex.rad + ". Prends maintenant leurs racines : ce sont elles qui encadrent √{" + ex.rad + "}." };
    if (w !== v + 1) return { ok: false, kind: "bad", msg: "Les deux entiers doivent être consécutifs (l'un juste après l'autre)." + again };
    return { ok: false, kind: "bad", msg: "Pas encore. Cherche les carrés parfaits qui entourent " + ex.rad + "." };
  }
  const v = parseNum(vals[0]);
  if (isNaN(v)) return { ok: false, kind: "warn", msg: "Écris un nombre, par exemple −2,5 ou 7,1." };
  if (ex.type === "range"){
    const lo2 = ex.a[0], hi2 = ex.a[1];
    if (!Number.isInteger(v)) return { ok: false, kind: "bad", msg: "Choisis un nombre entier." };
    if (v > lo2 && v < hi2) return { ok: true, kind: "good", msg: "C'est juste : " + ex.lo + " &lt; √{" + v + "} &lt; " + ex.hi + ". D'autres réponses étaient possibles." };
    if (v === lo2 || v === hi2) return { ok: false, kind: "bad", msg: "Les inégalités sont strictes : √{" + v + "} vaut exactement " + (v === lo2 ? ex.lo : ex.hi) + "." };
    if (v >= ex.lo && v <= ex.hi) return { ok: false, kind: "bad", msg: "Tu as cherché entre " + ex.lo + " et " + ex.hi + ". Mets d'abord ces deux entiers au carré." };
    return { ok: false, kind: "bad", msg: "Pas encore." + again };
  }
  if (near(v, ex.a, ex.tol)) return { ok: true, kind: "good", msg: "C'est juste. Bravo !" };
  if (ex.alt) for (const [x, m] of ex.alt) if (near(v, x, .06)) return { ok: false, kind: "bad", msg: m };
  if (ex.a !== 0 && near(v, -ex.a)) return { ok: false, kind: "bad", msg: "La valeur est bonne, mais le signe ne l'est pas. Recompte les signes." };
  if (ex.round && Math.abs(v - ex.a) < .1) return { ok: false, kind: "bad", msg: "Tu y es presque : vérifie l'arrondi au dixième (regarde le chiffre des centièmes)." };
  return { ok: false, kind: "bad", msg: "Pas encore." + again };
}

  return html`<div className="page" style=${{ paddingTop: 0 }}>
    <p className="lead">Les familles sont rangées de la plus simple à la plus complexe. Dans chacune : un exemple résolu, puis des exercices de plus en plus difficiles. L'aide diminue avec la difficulté.</p>
    <div className="fam-nav">${m.fam.map((g, k) => { const d = g.ex.filter(e => solved.has(e.id)).length; return html`<button key=${k} className="fam-btn" aria-pressed=${k === fi} onClick=${() => setFi(k)}><span className="fam-n">${k + 1}</span><span className="fam-t">${g.title}</span><span className=${"fam-c" + (d === g.ex.length ? " full" : "")}>${d}/${g.ex.length}</span></button>`; })}</div>
    <div className="fam-head"><h3>Famille ${fi + 1} · ${f.title}</h3><p className="muted"><${H} h=${f.goal}/></p></div>
    <${Worked} key=${m.id + fi} w=${f.worked}/>
    <div className="exlist">${f.ex.map((e, k) => html`<${ExCard} key=${e.id} ex=${e} n=${k + 1} method=${f.method} signed=${m.id === "rel"} solved=${solved.has(e.id)} onSolved=${onSolved}/>`)}</div>
    ${fi + 1 < m.fam.length && html`<div className="next-row"><button className="btn primary" onClick=${() => { setFi(fi + 1); window.scrollTo({ top: 0 }); }}>Famille suivante : ${m.fam[fi + 1].title} →</button></div>`}
  </div>`;
}

/* ---------- Vues ---------- */
const TABS = [["comprendre", "Comprendre"], ["manipuler", "Manipuler"], ["memoriser", "Mémoriser"], ["quiz", "Quiz"], ["exercices", "S'exercer"]];
const TAB_LEAD = {
  comprendre: "Les idées essentielles, une à la fois. Prends le temps de lire chaque exemple.",
  manipuler: "Fais bouger les curseurs et observe ce qui change.",
  memoriser: "Retrouver de tête une notion la fixe dans la mémoire. Réponds avant de vérifier.",
  quiz: "Une question à la fois, avec une explication après chaque réponse."
};

function ModuleView({ m, tab, setTab, solved, onSolved }){
  const ti = TABS.findIndex(t => t[0] === tab);
  const C = m.Comp, Mp = m.Manip;
  const go = t => { setTab(t); window.scrollTo({ top: 0 }); };
  return html`<${React.Fragment}>
    <div className="wrap mod-head"><h2>${m.name}</h2><p>${m.goal}</p></div>
    <div className="tabs-bar"><div className="wrap"><div className="tabs" role="tablist">${TABS.map(([k, l], i) => html`<button key=${k} role="tab" className="tab" aria-selected=${k === tab} onClick=${() => go(k)}><span className="tn">${i + 1}</span>${l}</button>`)}</div></div></div>
    <div className="wrap">
      ${tab !== "exercices" && html`<div className="page">
        <p className="lead">${TAB_LEAD[tab]}</p>
        ${tab === "comprendre" && html`<${C}/>`}
        ${tab === "manipuler" && html`<${Mp}/>`}
        ${tab === "memoriser" && html`<${Sec} title="Cartes mémoire"><${Cards} key=${m.id} cards=${CARDS[m.id]}/><//><${Sec} title=${DRILLS[m.id].title}><${Drill} key=${m.id} d=${DRILLS[m.id]}/><//>`}
        ${tab === "quiz" && html`<${Quiz} key=${m.id} qs=${QUIZ[m.id]}/>`}
        <div className="next-row"><button className="btn primary" onClick=${() => go(TABS[ti + 1][0])}>Étape suivante : ${TABS[ti + 1][1]} →</button></div>
      </div>`}
      ${tab === "exercices" && html`<div style=${{ paddingTop: "1.6em" }}><${Exercises} key=${m.id} m=${m} solved=${solved} onSolved=${onSolved}/></div>`}
    </div>
  <//>`;
}

const MOD_NAMES = { rel: "Relatifs", car: "Carrés", rac: "Racines", pyt: "Pythagore" };
function Bilan(){
  const make = () => shuffle(Object.keys(QUIZ).flatMap(k => QUIZ[k].map(q => ({ ...q, mod: MOD_NAMES[k] })))).slice(0, 10);
  const [qs, setQs] = useState(make);
  const [n, setN] = useState(0);
  return html`<${React.Fragment}>
    <div className="wrap mod-head"><h2>Bilan mélangé</h2><p>Dix questions tirées au hasard dans les quatre chapitres. Mélanger les notions oblige à choisir la bonne méthode, comme dans un contrôle.</p></div>
    <div className="wrap"><div className="page"><${Quiz} key=${n} qs=${qs} onNew=${() => { setQs(make()); setN(n + 1); }}/></div></div>
  <//>`;
}

const ICONS = {
  rel: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M5 7h12M11 2.5v9M5 17.5h12"/></svg>`,
  car: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3.5" y="3.5" width="15" height="15" rx="1"/><path d="M8.5 3.5v15M13.5 3.5v15M3.5 8.5h15M3.5 13.5h15" strokeWidth=".9"/></svg>`,
  rac: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round"><path d="M2.5 12.5l2.5-1.2 3.5 7.2 4-15h7"/></svg>`,
  pyt: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"><path d="M4 18.5V3.5l14 15z"/><path d="M4 15h3.5v3.5" strokeWidth="1.1"/></svg>`,
  bilan: html`<svg className="ic" viewBox="0 0 22 22" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7h11M11 4l3 3-3 3M19 15H8M11 12l-3 3 3 3"/></svg>`
};

function App(){
  const [mod, setMod] = useState(() => store.get("mod", "rel"));
  const [tab, setTab] = useState(() => store.get("tab", "comprendre"));
  const [solved, setSolved] = useState(() => new Set(store.get("solved", [])));
  const [big, setBig] = useState(() => store.get("big", false));
  const [confirmReset, setConfirmReset] = useState(false);
  useEffect(() => store.set("mod", mod), [mod]);
  useEffect(() => store.set("tab", tab), [tab]);
  useEffect(() => store.set("big", big), [big]);
  useEffect(() => store.set("solved", [...solved]), [solved]);
  const onSolved = id => setSolved(s => s.has(id) ? s : new Set([...s, id]));
  const m = MODULES.find(x => x.id === mod);
  const count = mm => { let d = 0, t = 0; mm.fam.forEach(f => f.ex.forEach(e => { t++; if (solved.has(e.id)) d++; })); return [d, t]; };
  const pick = id => { setMod(id); window.scrollTo({ top: 0 }); };
  return html`<div className=${"app" + (big ? " big" : "")}>
    <header className="titlebar">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="4" fill="var(--accent)"/><path d="M5 13l2-1 3 6 4-12h5" fill="none" stroke="var(--view)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg>
      <span className="tb-name">Du relatif à Pythagore</span><span className="tb-sub">Mathématiques 4e</span>
      <span className="spacer"></span>
      <button className="switch" role="switch" aria-checked=${big} onClick=${() => setBig(!big)}><span className="track"></span>Texte agrandi</button>
      <span className="prog" title="Exercices réussis"><span className="bar"><span style=${{ width: (solved.size / ALL_EX * 100) + "%" }}></span></span>${solved.size}/${ALL_EX}</span>
    </header>
    <div className="layout">
      <nav className="sidebar" aria-label="Chapitres">
        <div className="side-cap">Chapitres</div>
        ${MODULES.map(x => { const [d, t] = count(x); return html`<button key=${x.id} className="side-item" aria-current=${mod === x.id ? "page" : undefined} onClick=${() => pick(x.id)}>${ICONS[x.id]}<span>${x.name}</span><span className="cnt">${d}/${t}</span></button>`; })}
        <div className="side-cap" style=${{ marginTop: ".8em" }}>Révision</div>
        <button className="side-item" aria-current=${mod === "bilan" ? "page" : undefined} onClick=${() => pick("bilan")}>${ICONS.bilan}<span>Bilan mélangé</span></button>
        <div className="side-foot">
          <span className="muted">Ta progression reste dans ce navigateur.</span>
          ${confirmReset
            ? html`<div className="row"><button className="btn small" onClick=${() => { setSolved(new Set()); setConfirmReset(false); }}>Oui, tout effacer</button><button className="btn small" onClick=${() => setConfirmReset(false)}>Annuler</button></div>`
            : html`<button className="linkbtn" onClick=${() => setConfirmReset(true)}>Effacer ma progression</button>`}
        </div>
      </nav>
      <main className="main">
        ${mod === "bilan" ? html`<${Bilan}/>` : html`<${ModuleView} key=${mod} m=${m} tab=${tab} setTab=${setTab} solved=${solved} onSolved=${onSolved}/>`}
      </main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>

</body></html>
