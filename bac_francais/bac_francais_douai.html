eur les gens graves\u2026 \xBB).",opts:["Humoristique (humour absurde)","Tragique","Path\xE9tique","Oratoire"],simple:"Humour absurde : une histoire qui ne m\xE8ne nulle part.",detail:"Le po\xE8me se moque des po\xE8mes \xAB s\xE9rieux \xBB \xE0 message : il s\u2019amuse et refuse le s\xE9rieux du monde adulte, comme Rimbaud dans <i>Roman</i>."}],[{id:"r6",type:"qcm",q:"Appeler \xAB dormeur \xBB un soldat mort rel\xE8ve de quel proc\xE9d\xE9 ou registre ?",opts:["L\u2019ironie (faire entendre autre chose que ce qu\u2019on dit)","La parodie","Le burlesque","Le registre didactique"],simple:"Ironie : le titre dit \xAB sommeil \xBB, le texte r\xE9v\xE8le la mort.",detail:"Le titre installe une fausse piste que la chute d\xE9molit. Cette ironie tragique rend la d\xE9nonciation de la guerre plus efficace."},{id:"r7",type:"qcm",q:"Registre dominant :",src:"Lui, nagu\xE8re si beau, qu\u2019il est comique et laid !",opts:["Path\xE9tique","Comique","\xC9pique","Didactique"],simple:"Path\xE9tique : on a piti\xE9 de l\u2019albatros humili\xE9.",detail:"Les marins trouvent l\u2019oiseau \xAB comique \xBB, mais le texte fait ressentir la <b>piti\xE9</b> : le contraste \xAB nagu\xE8re si beau \xBB / \xAB laid \xBB montre la d\xE9ch\xE9ance. Le mot \xAB comique \xBB est le point de vue des moqueurs, pas le registre du texte."},{id:"r8",type:"qcm",q:"Traiter un sujet s\xE9rieux dans un style vulgaire (ou l\u2019inverse), c\u2019est le registre\u2026",opts:["burlesque","satirique","parodique","pol\xE9mique"],simple:"Burlesque : d\xE9calage entre le style et le sujet.",detail:"La parodie imite un texte pr\xE9cis ; le burlesque joue sur le d\xE9calage entre la noblesse ou la bassesse du style et du sujet."},{id:"r9",type:"qcm",q:"Un texte o\xF9 le d\xE9bat devient combat et o\xF9 l\u2019argumentation se fait agressive rel\xE8ve du registre\u2026",opts:["pol\xE9mique","\xE9pidictique","lyrique","dramatique"],simple:"Pol\xE9mique (du grec <i>polemos</i>, la guerre).",detail:"L\u2019\xE9pidictique fait l\u2019\xE9loge ou le bl\xE2me ; le pol\xE9mique attaque un adversaire pour faire r\xE9agir le destinataire."},{id:"r10",type:"qcm",q:"\xAB Le Forgeron \xBB : un homme du peuple s\u2019adresse au roi Louis XVI en 1792, au nom de tout le peuple. Registre dominant ?",opts:["\xC9pique","Lyrique","Didactique","Burlesque"],simple:"\xC9pique : un h\xE9ros collectif, le peuple, grandi et exalt\xE9.",detail:"L\u2019\xE9pique exalte un grand sentiment collectif et des personnages hors du commun. Le discours du forgeron a aussi une dimension <b>oratoire</b> et pol\xE9mique contre le roi."}],[{id:"r11",type:"qcm",q:"Quelle formule d\xE9crit le mieux l\u2019\xE9volution des registres dans \xAB Le Dormeur du val \xBB ?",opts:["Un tableau lyrique de la nature qui bascule dans le tragique et la d\xE9nonciation de la guerre.","Un po\xE8me enti\xE8rement comique qui se moque du soldat.","Un po\xE8me didactique qui explique la guerre de 1870.","Un po\xE8me \xE9pique qui c\xE9l\xE8bre l\u2019h\xE9ro\xEFsme du soldat."],simple:"Lyrique (nature) \u2192 tragique et d\xE9nonciation (chute).",detail:"Les quatrains c\xE9l\xE8brent une nature vivante et lumineuse ; les tercets accumulent les indices ; le dernier vers r\xE9v\xE8le la mort. Le contraste sert une <b>d\xE9nonciation implicite</b> de la guerre."},{id:"r12",type:"write",q:"Justifie en 3 ou 4 lignes le registre path\xE9tique de ces tercets des \xAB Effar\xE9s \xBB, avec deux indices pr\xE9cis.",src:["Ils se ressentent si bien vivre,","Les pauvres J\xE9sus pleins de givre,","Qu\u2019ils sont l\xE0 tous,","","Collant leurs petits museaux roses","Au treillage, grognant des choses","Entre les trous,"],model:"Le registre <b>path\xE9tique</b> domine : Rimbaud veut susciter la piti\xE9 du lecteur. L\u2019adjectif \xAB <b>pauvres</b> \xBB et la m\xE9taphore \xAB <b>J\xE9sus pleins de givre</b> \xBB font des enfants des innocents qui souffrent du froid. Le diminutif \xAB <b>petits museaux roses</b> \xBB, qui les rapproche de petits animaux, souligne leur fragilit\xE9 et leur faim, puisqu\u2019ils se collent au \xAB treillage \xBB pour sentir le pain.",checklist:["Je nomme le registre et l\u2019\xE9motion vis\xE9e (piti\xE9).","Je donne au moins deux indices cit\xE9s.","J\u2019explique chaque indice."],simple:"Path\xE9tique : \xAB pauvres J\xE9sus pleins de givre \xBB (souffrance, innocence), \xAB petits museaux roses \xBB (fragilit\xE9, faim)."}]]},{id:"phrases",titre:"Types et formes de phrases",lecon:"phrases",desc:"Identifier type et forme, transformer une phrase, r\xE9pondre \xE0 une question de grammaire.",worked:{titre:"Question de grammaire : \xAB Les parfums ne font pas frissonner sa narine. \xBB",src:"Les parfums ne font pas frissonner sa narine ;",steps:[{h:"Chercher le type",html:"La phrase donne une information, elle se termine par un point-virgule (pas de \xAB ? \xBB ni d\u2019ordre) \u2192 <b>type d\xE9claratif</b>."},{h:"Chercher la ou les formes",html:"\xAB <b>ne</b> font <b>pas</b> \xBB : la n\xE9gation encadre le verbe conjugu\xE9 \u2192 <b>forme n\xE9gative</b> (n\xE9gation totale <i>ne\u2026 pas</i>). Elle n\u2019est ni passive ni exclamative."},{h:"V\xE9rifier par une transformation",html:"Forme affirmative : \xAB Les parfums font frissonner sa narine. \xBB Seule la n\xE9gation change."},{h:"Donner l\u2019int\xE9r\xEAt pour le sens",html:"La n\xE9gation dit l\u2019<b>absence de r\xE9action</b> du soldat aux odeurs : c\u2019est un indice de sa mort, alors que tout le po\xE8me est plein de sensations."}],retenir:"R\xE9pondre en 3 temps : <b>identifier</b> (type + forme) \u2192 <b>justifier</b> (marques) \u2192 <b>interpr\xE9ter</b> (effet)."},levels:[[{id:"p1",type:"qcm",q:"Quel est le type de cette phrase ?",src:"Nature, berce-le chaudement : il a froid.",opts:["Imp\xE9ratif (pour la premi\xE8re partie)","Interrogatif","D\xE9claratif uniquement","Exclamatif"],simple:"Imp\xE9ratif : \xAB berce-le \xBB donne un ordre (une pri\xE8re).",detail:"Le verbe <i>bercer</i> est \xE0 l\u2019imp\xE9ratif pr\xE9sent ; la seconde partie (\xAB il a froid \xBB) est d\xE9clarative et explique la demande. Attention : l\u2019exclamation est une <b>forme</b>, pas un type."},{id:"p2",type:"qcm",q:"Quel est le type de cette phrase ?",src:"Ne te verrai-je plus que dans l\u2019\xE9ternit\xE9 ?",opts:["Interrogatif","D\xE9claratif","Imp\xE9ratif","Passif"],simple:"Interrogatif : inversion du sujet (\xAB verrai-je \xBB) et point d\u2019interrogation.",detail:"La tournure \xAB ne\u2026 plus que \xBB exprime une <b>restriction</b> (\xAB seulement dans l\u2019\xE9ternit\xE9 \xBB). La question n\u2019attend pas de r\xE9ponse : elle exprime le regret (question rh\xE9torique \xE0 effet lyrique)."},{id:"p3",type:"qcm",q:"Quelle est la forme de cette phrase ?",src:"Le lourd pain blond est enfourn\xE9 par le Boulanger.",opts:["Forme passive","Forme n\xE9gative","Forme exclamative","Aucune forme particuli\xE8re"],simple:"Forme passive : \xAB est enfourn\xE9 par le Boulanger \xBB.",detail:"Le sujet (\xAB le lourd pain blond \xBB) subit l\u2019action ; l\u2019agent est introduit par \xAB par \xBB. \xC0 l\u2019actif : \xAB Le Boulanger enfourne le lourd pain blond \xBB."},{id:"p4",type:"qcm",q:"Type et forme de cette phrase ?",src:"Oh ! l\xE0 ! l\xE0 ! que d\u2019amours splendides j\u2019ai r\xEAv\xE9es !",opts:["Type d\xE9claratif, forme exclamative","Type exclamatif, forme d\xE9clarative","Type imp\xE9ratif, forme exclamative","Type interrogatif, forme n\xE9gative"],simple:"D\xE9claratif + forme exclamative.",detail:"Le \xAB type exclamatif \xBB n\u2019existe pas dans le cours : l\u2019exclamation est une <b>forme</b> qui s\u2019ajoute \xE0 un type. Ici, la phrase informe (j\u2019ai r\xEAv\xE9 de splendides amours) avec \xE9motion."}],[{id:"p5",type:"qcm",q:"Type et formes de cette phrase ?",src:"N\u2019ouvrez pas la fen\xEAtre !",opts:["Imp\xE9ratif, forme n\xE9gative et exclamative","D\xE9claratif, forme n\xE9gative","Interrogatif, forme exclamative","Imp\xE9ratif, forme passive"],simple:"Imp\xE9ratif + n\xE9gative + exclamative.",detail:"Une phrase a un seul type mais peut cumuler plusieurs formes : ici \xAB ne\u2026 pas \xBB (n\xE9gative) et \xAB ! \xBB (exclamative)."},{id:"p6",type:"qcm",q:"Quelle est la bonne transformation passive de : \xAB Les marins prennent des albatros. \xBB ?",opts:["Des albatros sont pris par les marins.","Les marins ont pris des albatros.","Des albatros prennent les marins.","Les marins sont pris par des albatros."],simple:"\xAB Des albatros sont pris par les marins. \xBB",detail:"Le COD devient sujet, le verbe passe \xE0 la voix passive (\xEAtre + participe pass\xE9 accord\xE9 : \xAB pris \xBB), le sujet devient compl\xE9ment d\u2019agent (\xAB par les marins \xBB). Le temps reste le pr\xE9sent."},{id:"p7",type:"qcm",q:"Type et forme de cette phrase ?",src:"Ce voyageur ail\xE9, comme il est gauche et veule !",opts:["D\xE9claratif, forme exclamative","Interrogatif, forme exclamative","Imp\xE9ratif, forme n\xE9gative","D\xE9claratif, forme passive"],simple:"D\xE9claratif + exclamative (\xAB comme\u2026 ! \xBB).",detail:"\xAB Comme \xBB n\u2019est pas ici un outil de comparaison : c\u2019est un adverbe exclamatif. La phrase traduit l\u2019\xE9tonnement moqueur des marins."}],[{id:"p8",type:"qcm",q:"Pourquoi la fin d\u2019\xAB \xC0 une passante \xBB multiplie-t-elle les phrases interrogatives et exclamatives ?",src:["Ne te verrai-je plus que dans l\u2019\xE9ternit\xE9 ?","Ailleurs, bien loin d\u2019ici ! trop tard ! jamais peut-\xEAtre !"],opts:["Pour traduire le bouleversement et le regret du po\xE8te : elles rel\xE8vent du lyrisme.","Pour poser de vraies questions \xE0 la passante, qui va r\xE9pondre.","Pour donner des ordres \xE0 la passante.","Pour rendre le texte plus objectif."],simple:"Elles expriment l\u2019\xE9motion du po\xE8te : registre lyrique.",detail:"La question est rh\xE9torique (r\xE9ponse impossible) ; les exclamations nominales courtes (\xAB trop tard ! jamais peut-\xEAtre ! \xBB) miment le souffle coup\xE9 du po\xE8te. Le rythme hach\xE9 traduit le regret d\u2019un amour possible et perdu."},{id:"p9",type:"write",q:"Question de grammaire (oral) : identifie le type et la forme de la phrase, justifie, puis explique l\u2019int\xE9r\xEAt pour le sens.",src:"Les parfums ne font pas frissonner sa narine ;",model:"C\u2019est une phrase de <b>type d\xE9claratif</b> : elle donne une information et ne contient ni question ni ordre. Elle est \xE0 la <b>forme n\xE9gative</b> : la n\xE9gation totale \xAB <b>ne\u2026 pas</b> \xBB encadre le verbe conjugu\xE9 \xAB font \xBB. \xC0 la forme affirmative, on aurait : \xAB Les parfums font frissonner sa narine \xBB. Cette n\xE9gation souligne l\u2019<b>insensibilit\xE9</b> du soldat aux odeurs de la nature : c\u2019est un indice de sa mort, r\xE9v\xE9l\xE9e au vers suivant.",checklist:["Je donne le type et je le justifie.","Je donne la forme et je cite les marques (ne\u2026 pas).","Je propose une transformation pour v\xE9rifier.","Je relie la grammaire au sens du texte."],simple:"D\xE9claratif ; forme n\xE9gative (ne\u2026 pas encadre \xAB font \xBB) ; indice de la mort du soldat."}]]},{id:"contexte",titre:"Contexte et histoire litt\xE9raire",lecon:"rimbaud",desc:"Situer Rimbaud, les po\xE8mes, les p\xE9riodes litt\xE9raires, Baudelaire et Rimbaud.",worked:{titre:"Situer \xAB Le Dormeur du val \xBB dans son contexte",src:"Arthur Rimbaud, octobre 1870",steps:[{h:"Date et \xE9v\xE9nements",html:"<b>Octobre 1870</b> : la France est en guerre contre la Prusse depuis <b>juillet 1870</b>. Le <b>2 septembre</b>, l\u2019empereur Napol\xE9on III capitule \xE0 <b>Sedan</b>, tout pr\xE8s de <b>Charleville</b>, la ville de Rimbaud."},{h:"Situation de l\u2019auteur",html:"Rimbaud a <b>16 ans</b>. Il fugue, est h\xE9berg\xE9 \xE0 <b>Douai</b> par son professeur <b>Georges Izambard</b>, et confie ses po\xE8mes \xE0 <b>Paul Demeny</b> : ce sont les <i>Cahiers de Douai</i>."},{h:"Lien avec le po\xE8me",html:"Le soldat mort fait \xE9cho \xE0 cette guerre. Rimbaud \xAB plaint les victimes de la guerre \xBB (fiche 1), sans nommer l\u2019arm\xE9e ni la bataille : la d\xE9nonciation est <b>implicite</b>."},{h:"Lien avec le parcours",html:"<b>\xC9mancipations cr\xE9atrices</b> : Rimbaud reprend la forme classique du sonnet (Ronsard) mais la d\xE9tourne, avec une pointe brutale, pour d\xE9noncer ce que la propagande du Second Empire c\xE9l\xE8bre."}],retenir:"Situer un texte = <b>date</b> + <b>\xE9v\xE9nements</b> + <b>situation de l\u2019auteur</b> + <b>lien avec le parcours</b>."},levels:[[{id:"c1",type:"qcm",q:"O\xF9 et quand Rimbaud est-il n\xE9 ?",opts:["En 1854, \xE0 Charleville (Ardennes)","En 1854, \xE0 Douai","En 1870, \xE0 Charleville","En 1844, \xE0 Paris"],simple:"1854, Charleville.",detail:"Charleville est une ville industrielle du nord-est de la France, proche de la Belgique, travers\xE9e par la Meuse. Rimbaud a donc 16 ans en 1870."},{id:"c2",type:"qcm",q:"Qui h\xE9berge Rimbaud \xE0 Douai en ao\xFBt-septembre 1870 ?",opts:["Georges Izambard, son professeur","Paul Demeny, \xE9diteur","Paul Verlaine","Charles Cros"],simple:"Georges Izambard, son professeur.",detail:"Rimbaud confie ensuite ses po\xE8mes \xE0 <b>Paul Demeny</b>, po\xE8te et \xE9diteur de Douai. Charles Cros l\u2019h\xE9bergera \xE0 Paris en 1871."},{id:"c3",type:"qcm",q:"Que se passe-t-il le 2 septembre 1870 ?",opts:["La d\xE9faite de Sedan : Napol\xE9on III capitule et est fait prisonnier.","La proclamation de la IIIe R\xE9publique.","Le d\xE9but de la guerre contre la Prusse.","La naissance du Second Empire."],simple:"D\xE9faite de Sedan, capitulation de l\u2019empereur.",detail:"La guerre a commenc\xE9 en juillet 1870 ; la IIIe R\xE9publique est proclam\xE9e deux jours apr\xE8s Sedan, le 4 septembre 1870."},{id:"c4",type:"qcm",q:"Quel surnom Verlaine donnait-il \xE0 Rimbaud ?",opts:["\xAB L\u2019homme aux semelles de vent \xBB","\xAB Le voyant \xBB","\xAB Le po\xE8te maudit \xBB","\xAB Le mage \xBB"],simple:"\xAB L\u2019homme aux semelles de vent \xBB.",detail:"Le surnom \xE9voque ses fugues et ses voyages incessants. \xAB Le mage \xBB est le r\xF4le que Hugo donne au po\xE8te romantique."},{id:"c5",type:"qcm",q:"Quels recueils Rimbaud \xE9crit-il apr\xE8s les Cahiers de Douai ?",opts:["Une saison en enfer (1873) et Illuminations (1875)","Les Fleurs du mal (1861)","Les Contemplations","Po\xE8mes saturniens"],simple:"<i>Une saison en enfer</i> (1873), <i>Illuminations</i> (1875).",detail:"Ensuite, il n\u2019\xE9crit plus de po\xE9sie. <i>Les Fleurs du mal</i> sont de Baudelaire."}],[{id:"c6",type:"sort",q:"Classe chaque caract\xE9ristique dans la bonne p\xE9riode litt\xE9raire.",cats:["Romantisme","R\xE9alisme","Parnasse","Symbolisme"],items:[["Exprimer des \xE9tats d\u2019\xE2me, des confidences",0],["Le po\xE8te est un \xAB mage \xBB qui guide le peuple",0],["Volont\xE9 d\u2019objectivit\xE9, contre le subjectivisme",1],["Rendre compte du r\xE9el au nom de la Science",1],["Le po\xE8te doit \xEAtre impassible",2],["Un id\xE9al purement esth\xE9tique",2],["Sonder les profondeurs de la conscience",3],["Sugg\xE9rer le myst\xE8re",3]],simple:"Romantisme : \xE9tats d\u2019\xE2me, mage. R\xE9alisme : objectivit\xE9, science. Parnasse : impassibilit\xE9, beaut\xE9. Symbolisme : conscience, myst\xE8re.",detail:"Dates : romantisme 1800-1850, r\xE9alisme 1850-1890, Parnasse 1866-1876, symbolisme 1870-1890. Rimbaud \xE9crit en 1870, au moment o\xF9 na\xEEt le symbolisme."},{id:"c7",type:"sort",q:"D\u2019apr\xE8s Georges Poulet, \xE0 qui correspond chaque id\xE9e ?",cats:["Baudelaire","Rimbaud"],items:[["Pr\xE9d\xE9termin\xE9 par le p\xE9ch\xE9 originel",0],["Hant\xE9 par le pass\xE9 et le remords",0],["La fatalit\xE9",0],["Des \xAB gr\xE2ces \xBB, secours venus d\u2019ailleurs",0],["S\u2019\xE9veille chaque fois \xE0 une existence nouvelle",1],["Libre de r\xE9inventer son monde et son moi",1],["La libert\xE9 cr\xE9atrice",1],["Prisonnier de ses propres inventions",1]],simple:"Baudelaire : d\xE9termination, pass\xE9, fatalit\xE9, gr\xE2ces. Rimbaud : r\xE9veil, libert\xE9, invention.",detail:"Les deux mondes s\u2019opposent, mais chacun a son exception : la \xAB gr\xE2ce \xBB introduit de l\u2019esp\xE9rance chez Baudelaire ; l\u2019exc\xE8s de libert\xE9 rend Rimbaud captif de ses propres images."},{id:"c8",type:"sort",q:"Classe ces po\xE8mes des Cahiers de Douai selon leur sujet.",cats:["Guerre et politique","Amour, sensations, fugue","Satire, mis\xE8re"],items:[["Le Dormeur du val",0],["Rages de C\xE9sars",0],["Le Mal",0],["Morts de Quatre-vingt-douze\u2026",0],["Roman",1],["Ma boh\xE8me",1],["Sensation",1],["R\xEAv\xE9 pour l\u2019hiver",1],["\xC0 la musique",2],["Les Effar\xE9s",2],["Bal des pendus",2]],simple:"Guerre : Dormeur, Rages de C\xE9sars, Le Mal, Morts de 92. Amour/fugue : Roman, Ma boh\xE8me, Sensation, R\xEAv\xE9 pour l\u2019hiver. Satire/mis\xE8re : \xC0 la musique, Les Effar\xE9s, Bal des pendus.",detail:"Ce classement pr\xE9pare la dissertation : le recueil n\u2019est pas \xAB que \xBB l\xE9ger (partie I) ; il aborde aussi des sujets graves (partie II)."},{id:"c9",type:"order",q:"Remets ces \xE9v\xE9nements dans l\u2019ordre chronologique.",items:["D\xE9but du Second Empire","Naissance de Rimbaud","D\xE9but de la guerre contre la Prusse","D\xE9faite de Sedan","Proclamation de la IIIe R\xE9publique","Lettres du \xAB voyant \xBB","Une saison en enfer","Mort de Rimbaud \xE0 Marseille"],simple:"Second Empire (1852) \u2192 naissance (1854) \u2192 guerre (juillet 1870) \u2192 Sedan (2 sept. 1870) \u2192 IIIe R\xE9publique (4 sept. 1870) \u2192 lettres du voyant (1871) \u2192 Une saison en enfer (1873) \u2192 mort (1891).",detail:"Rimbaud na\xEEt deux ans apr\xE8s le d\xE9but du Second Empire : toute sa jeunesse se passe sous Napol\xE9on III, qu\u2019il m\xE9prise."}],[{id:"c10",type:"qcm",q:"Selon Poulet, quel est le seul trait commun entre Baudelaire et Rimbaud ?",opts:["L\u2019absence r\xE9ciproque de communication entre leurs deux mondes","L\u2019amour de la nature","Le go\xFBt du sonnet","La croyance au p\xE9ch\xE9 originel"],simple:"L\u2019absence de communication entre leurs mondes.",detail:"Paradoxe : ce qu\u2019ils ont en commun, c\u2019est de ne rien avoir en commun. On peut les confronter, mais pas les rapprocher, d\u2019o\xF9 l\u2019\xAB \xE9clatement de la po\xE9sie \xBB."},{id:"c11",type:"qcm",q:"Pourquoi le professeur associe-t-il \xAB Le Hareng saur \xBB de Charles Cros aux Cahiers de Douai ?",opts:["Parce que Cros s\u2019\xE9mancipe lui aussi des codes po\xE9tiques et refuse le s\xE9rieux, comme Rimbaud.","Parce que Cros est l\u2019\xE9diteur des Cahiers de Douai.","Parce que c\u2019est un sonnet d\u2019alexandrins.","Parce que le po\xE8me parle de la guerre de 1870."],simple:"M\xEAme \xE9mancipation des formes et m\xEAme refus du s\xE9rieux.",detail:"Sujet \xAB antipo\xE9tique \xBB, r\xE9p\xE9titions, humour absurde : Cros participe au m\xEAme mouvement de r\xE9volte joyeuse. Il a d\u2019ailleurs h\xE9berg\xE9 Rimbaud \xE0 Paris en 1871."},{id:"c12",type:"write",q:"En 4 ou 5 lignes, pr\xE9sente le contexte de production des Cahiers de Douai (comme dans une introduction).",model:"Arthur Rimbaud, n\xE9 en 1854 \xE0 Charleville, compose les po\xE8mes des <i>Cahiers de Douai</i> en <b>1870</b>, \xE0 <b>seize ans</b>. Il a grandi sous le <b>Second Empire</b> de Napol\xE9on III, qu\u2019il m\xE9prise. En juillet 1870, la France entre en guerre contre la Prusse ; le 2 septembre, l\u2019empereur capitule \xE0 <b>Sedan</b>, pr\xE8s de Charleville, et la IIIe R\xE9publique est proclam\xE9e. Pendant ses fugues, Rimbaud est h\xE9berg\xE9 \xE0 Douai par son professeur <b>Georges Izambard</b> et confie ses po\xE8mes \xE0 <b>Paul Demeny</b>. Le recueil m\xEAle ainsi les \xE9mois d\u2019un adolescent et la r\xE9volte contre la guerre et la soci\xE9t\xE9.",checklist:["Date et \xE2ge de Rimbaud.","Second Empire et guerre de 1870 (Sedan).","Izambard, Demeny, Douai.","Lien avec les th\xE8mes du recueil."],simple:"1870, 16 ans, Second Empire, guerre et Sedan, Izambard et Demeny \xE0 Douai, \xE9mois et r\xE9volte."}]]},{id:"mots",titre:"Mots et notions",lecon:"mots",desc:"\xC9tymologie du parcours, champs lexicaux, explicite et implicite, 4 \xE9l\xE9ments, 5 sens.",worked:{titre:"Expliquer le titre du parcours gr\xE2ce \xE0 l\u2019\xE9tymologie",src:"Parcours associ\xE9 : \xAB \xC9mancipations cr\xE9atrices \xBB",steps:[{h:"D\xE9composer \xAB \xE9manciper \xBB",html:"Latin <i>emancipare</i> : <i>ex-</i> (hors de) + <i>mancipium</i> (propri\xE9t\xE9) \u2190 <i>manus</i> (<b>main</b>) + <i>capere</i> (<b>prendre</b>). S\u2019\xE9manciper = <b>sortir de la main qui vous tient</b>, \xE0 l\u2019origine se lib\xE9rer de l\u2019autorit\xE9 du p\xE8re."},{h:"D\xE9composer \xAB cr\xE9er \xBB",html:"Latin <i>creare</i>, de la m\xEAme racine que <i>crescere</i> (<b>cro\xEEtre</b>) : faire pousser, faire na\xEEtre."},{h:"Relier les deux mots",html:"Une \xE9mancipation <b>cr\xE9atrice</b> : se lib\xE9rer non pas en d\xE9truisant mais en <b>faisant na\xEEtre</b> quelque chose de neuf (une forme, une langue, une vision)."},{h:"Appliquer \xE0 Rimbaud",html:"Rimbaud fugue (il \xE9chappe \xE0 l\u2019autorit\xE9 de sa m\xE8re et de l\u2019\xE9cole) et invente : il cr\xE9e le verbe \xAB robinsonner \xBB, d\xE9tourne le sonnet, parodie les mythes."}],retenir:"L\u2019\xE9tymologie est une <b>source d\u2019id\xE9es</b> pour l\u2019introduction d\u2019une dissertation ou d\u2019un commentaire."},levels:[[{id:"m1",type:"qcm",q:"Que signifiait le latin juridique \xAB emancipare \xBB ?",opts:["Lib\xE9rer de l\u2019autorit\xE9 paternelle","Cr\xE9er une \u0153uvre","Vendre un esclave","Prendre la parole"],simple:"Lib\xE9rer de l\u2019autorit\xE9 paternelle.",detail:"Le mot vient de <i>ex-</i> + <i>mancipare</i> \xAB vendre \xBB, de <i>mancipium</i> \xAB droit de propri\xE9t\xE9 \xBB. L\u2019id\xE9e de \xAB vendre \xBB est dans l\u2019\xE9tymologie, mais le sens du verbe est \xAB lib\xE9rer \xBB."},{id:"m2",type:"qcm",q:"Quel mot latin, pr\xE9sent dans \xAB \xE9manciper \xBB, signifie \xAB main \xBB ?",opts:["manus","capere","creare","crescere"],simple:"<i>manus</i> = main.",detail:"<i>capere</i> = prendre ; <i>creare</i> = cr\xE9er ; <i>crescere</i> = cro\xEEtre."},{id:"m3",type:"qcm",q:"Le latin \xAB creare \xBB a la m\xEAme racine que \xAB crescere \xBB. Que signifie \xAB crescere \xBB ?",opts:["Cro\xEEtre (faire pousser, grandir)","Crier","Croire","Capturer"],simple:"Cro\xEEtre.",detail:"\xC0 l\u2019origine, <i>creare</i> est un mot de la langue <b>rustique</b> (agricole) : faire pousser, produire. Puis \xAB faire na\xEEtre \xBB."},{id:"m4",type:"qcm",q:"\xAB cr\xE9er, cr\xE9ation, cr\xE9ateur, cr\xE9ativit\xE9 \xBB forment\u2026",opts:["une famille de mots","un champ lexical","une gradation","une p\xE9riphrase"],simple:"Une famille de mots : m\xEAme radical (cr\xE9-).",detail:"Un champ lexical regroupe des mots de radicaux diff\xE9rents autour d\u2019un m\xEAme th\xE8me (ex. : nature \u2192 herbe, rivi\xE8re, val)."}],[{id:"m5",type:"sort",q:"Dans \xAB Le Dormeur du val \xBB, classe ces mots dans le bon champ lexical.",cats:["Champ lexical de la nature","Champ lexical de la mort (indices)"],items:[["verdure",0],["rivi\xE8re",0],["cresson",0],["gla\xEFeuls",0],["val",0],["p\xE2le",1],["enfant malade",1],["il a froid",1],["deux trous rouges",1]],simple:"Nature : verdure, rivi\xE8re, cresson, gla\xEFeuls, val. Mort : p\xE2le, malade, froid, trous rouges.",detail:"Les deux champs lexicaux s\u2019entrem\xEAlent : la nature vivante encadre les indices de la mort. Le po\xE8me oppose la vie de la nature \xE0 la mort de l\u2019homme."},{id:"m6",type:"sort",q:"Ces informations sur \xAB Le Dormeur du val \xBB sont-elles explicites ou implicites ?",cats:["Explicite (dit clairement)","Implicite (sugg\xE9r\xE9)"],items:[["Un jeune soldat est \xE9tendu dans l\u2019herbe.",0],["Il a deux trous rouges au c\xF4t\xE9 droit.",0],["Le soldat est mort.",1],["Le po\xE8te d\xE9nonce la guerre.",1],["La guerre de 1870 tue des jeunes gens.",1]],simple:"Explicite : ce qui est \xE9crit. Implicite : la mort, la d\xE9nonciation, l\u2019allusion \xE0 1870.",detail:"Le mot \xAB mort \xBB n\u2019appara\xEEt jamais : le lecteur le d\xE9duit. C\u2019est la force du po\xE8me : passer de l\u2019explicite \xE0 l\u2019implicite."},{id:"m7",type:"sort",q:"\xC0 quel sens (vue, ou\xEFe, odorat, go\xFBt, toucher) renvoie chaque vers de \xAB Roman \xBB ?",cats:["Vue","Ou\xEFe","Odorat","Go\xFBt","Toucher"],items:[["un tout petit chiffon / D\u2019azur sombre",0],["Le vent charg\xE9 de bruits",1],["Les tilleuls sentent bon",2],["La s\xE8ve est du champagne",3],["on se sent aux l\xE8vres un baiser",4]],simple:"Vue : azur. Ou\xEFe : bruits. Odorat : tilleuls. Go\xFBt : champagne. Toucher : baiser.",detail:"Les cinq sens sont sollicit\xE9s : l\u2019\xE9veil amoureux est d\u2019abord un <b>\xE9veil des sens</b>, une ivresse sensuelle."},{id:"m8",type:"sort",q:"Classe ces images du \xAB Dormeur du val \xBB selon les quatre \xE9l\xE9ments de Bachelard.",cats:["Eau","Air","Terre","Feu"],items:[["o\xF9 chante une rivi\xE8re",0],["o\xF9 la lumi\xE8re pleut",0],["sous la nue",1],["les parfums",1],["de la montagne fi\xE8re",2],["\xE9tendu dans l\u2019herbe",2],["le soleil\u2026 luit",3],["deux trous rouges",3]],simple:"Eau : rivi\xE8re, pluie de lumi\xE8re. Air : nue, parfums. Terre : montagne, herbe. Feu : soleil, rouge.",detail:"Les quatre \xE9l\xE9ments composent un monde complet et vivant autour d\u2019un corps sans vie. Le rouge, couleur du feu, est aussi celle du sang."}],[{id:"m9",type:"write",q:"En 3 ou 4 lignes, d\xE9finis l\u2019expression \xAB \xE9mancipations cr\xE9atrices \xBB en t\u2019appuyant sur l\u2019\xE9tymologie.",model:"Le verbe \xAB \xE9manciper \xBB vient du latin juridique <i>emancipare</i>, \xAB lib\xE9rer de l\u2019autorit\xE9 paternelle \xBB, form\xE9 \xE0 partir de <i>manus</i> (la main) et <i>capere</i> (prendre) : s\u2019\xE9manciper, c\u2019est sortir de la main qui vous poss\xE8de. \xAB Cr\xE9er \xBB vient du latin <i>creare</i>, de la m\xEAme racine que <i>crescere</i>, \xAB cro\xEEtre \xBB : c\u2019est faire pousser, faire na\xEEtre. Une \xE9mancipation cr\xE9atrice est donc une lib\xE9ration qui <b>fait na\xEEtre du nouveau</b> : une forme, une langue ou une vision du monde.",checklist:["\xC9tymologie d\u2019\xAB \xE9manciper \xBB (main, prendre, autorit\xE9).","\xC9tymologie de \xAB cr\xE9er \xBB (cro\xEEtre, faire na\xEEtre).","Une d\xE9finition qui relie les deux."],simple:"\xC9manciper = sortir de l\u2019autorit\xE9 (manus, capere) ; cr\xE9er = faire cro\xEEtre ; donc se lib\xE9rer en faisant na\xEEtre du nouveau."}]]},{id:"lineaire",titre:"Explication lin\xE9aire (oral)",lecon:"methodes",desc:"D\xE9couper en mouvements, formuler un projet de lecture, analyser vers \xE0 vers.",worked:{titre:"Expliquer \xAB Le Dormeur du val \xBB : introduction et premier mouvement",src:["C\u2019est un trou de verdure o\xF9 chante une rivi\xE8re","Accrochant follement aux herbes des haillons","D\u2019argent ; o\xF9 le soleil, de la montagne fi\xE8re,","Luit : c\u2019est un petit val qui mousse de rayons."],steps:[{h:"Situer le texte",html:"Sonnet \xE9crit en <b>octobre 1870</b> par Rimbaud, 16 ans, pendant la guerre franco-prussienne, recopi\xE9 dans les <i>Cahiers de Douai</i>."},{h:"Formuler le projet de lecture",html:"<b>Comment Rimbaud transforme-t-il un tableau de nature paisible en d\xE9nonciation de la guerre ?</b> (une vraie question, qui guide toute l\u2019explication)."},{h:"Annoncer les mouvements",html:"1. v. 1-4 : un val lumineux et vivant. 2. v. 5-8 : un jeune soldat qui semble dormir. 3. v. 9-11 : des indices inqui\xE9tants. 4. v. 12-14 : la r\xE9v\xE9lation de la mort."},{h:"Expliquer le vers 1",html:'<span class="tag t-cit">\xAB C\u2019est un trou de verdure \xBB</span> : <span class="tag t-pro">pr\xE9sentatif + m\xE9taphore</span> \u2192 <span class="tag t-eff">un lieu clos, protecteur, comme un nid. Le mot \xAB trou \xBB est aussi, implicitement, celui de la tombe.</span> <span class="tag t-cit">\xAB o\xF9 chante une rivi\xE8re \xBB</span> : <span class="tag t-pro">personnification</span> \u2192 <span class="tag t-eff">une nature joyeuse, musicale.</span>'},{h:"Expliquer les vers 2 \xE0 4",html:'<span class="tag t-cit">\xAB follement \xBB</span>, <span class="tag t-cit">\xAB D\u2019argent \xBB</span> (rejet), <span class="tag t-cit">\xAB Luit \xBB</span> (rejet), <span class="tag t-cit">\xAB mousse de rayons \xBB</span> (m\xE9taphore) : <span class="tag t-eff">la lumi\xE8re d\xE9borde, comme l\u2019eau et comme les vers eux-m\xEAmes. Le cadre est idyllique.</span>'},{h:"Relier au projet de lecture",html:"Ce premier mouvement installe un <b>d\xE9cor de vie</b> parfait, qui rendra plus violent le contraste final : c\u2019est le premier temps de la d\xE9nonciation."}],retenir:"Lin\xE9aire ne veut pas dire paraphrase : chaque citation re\xE7oit un <b>proc\xE9d\xE9</b> et une <b>interpr\xE9tation</b>, et tout ram\xE8ne au <b>projet de lecture</b>."},levels:[[{id:"l1",type:"order",q:"Remets dans l\u2019ordre les mouvements de \xAB L\u2019Albatros \xBB.",items:["Les marins capturent les albatros pour s\u2019amuser (strophe 1).","Sur le pont, les \xAB rois de l\u2019azur \xBB deviennent maladroits (strophe 2).","L\u2019\xE9quipage se moque de l\u2019oiseau infirme (strophe 3).","Le po\xE8te est compar\xE9 \xE0 l\u2019albatros, exil\xE9 parmi les hommes (strophe 4)."],simple:"Capture \u2192 maladresse \u2192 moqueries \u2192 comparaison avec le po\xE8te.",detail:"Les trois premi\xE8res strophes racontent ; la derni\xE8re donne la cl\xE9 : c\u2019est une <b>all\xE9gorie</b> du po\xE8te. Un bon projet de lecture : \xAB Comment Baudelaire fait-il d\u2019une sc\xE8ne de marins une image de la condition du po\xE8te ? \xBB"},{id:"l2",type:"qcm",q:"Quel est le meilleur projet de lecture pour \xAB Roman \xBB ?",opts:["Comment Rimbaud fait-il, avec humour, le r\xE9cit d\u2019un premier amour adolescent ?","Que raconte le po\xE8me \xAB Roman \xBB ?","Qu\u2019est-ce que la po\xE9sie ?","Rimbaud aimait-il une jeune fille en 1870 ?"],simple:"Une question qui porte sur le <b>comment</b> et sur ce qui fait l\u2019int\xE9r\xEAt du texte.",detail:"\xAB Que raconte \xBB appelle de la paraphrase ; \xAB Qu\u2019est-ce que la po\xE9sie \xBB est trop large ; la question biographique sort du texte. Le bon projet relie le sujet (premier amour) et la mani\xE8re (humour, l\xE9g\xE8ret\xE9)."},{id:"l3",type:"qcm",q:"Laquelle de ces phrases est une analyse (et non une paraphrase) ?",opts:["Le pr\xE9sent r\xE9p\xE9t\xE9 \xAB il dort \xBB installe une fausse paix que la chute va d\xE9mentir.","Le soldat dort dans l\u2019herbe au soleil.","Dans ce vers, Rimbaud dit qu\u2019il y a un soldat.","Le po\xE8me parle d\u2019un soldat et d\u2019une rivi\xE8re."],simple:"La premi\xE8re : elle nomme un proc\xE9d\xE9 et interpr\xE8te son effet.",detail:"Les trois autres r\xE9p\xE8tent le texte avec d\u2019autres mots. Une analyse r\xE9pond \xE0 la question \xAB <b>comment</b> et <b>pourquoi</b> ? \xBB, pas seulement \xAB quoi ? \xBB."},{id:"l4",type:"qcm",q:"Comment est not\xE9e la premi\xE8re partie de l\u2019oral ?",opts:["Lecture 2 pts + explication lin\xE9aire 8 pts + grammaire 2 pts","Explication 12 pts","Lecture 4 pts + explication 8 pts","Explication 8 pts + entretien 4 pts"],simple:"2 + 8 + 2 = 12 points.",detail:"La deuxi\xE8me partie (8 points) porte sur l\u2019\u0153uvre choisie en lecture cursive et l\u2019entretien. L\u2019ensemble dure 20 minutes, apr\xE8s 30 minutes de pr\xE9paration."}],[{id:"l5",type:"qcm",q:"Comment interpr\xE9ter \xAB Les pieds dans les gla\xEFeuls \xBB (v. 9) ?",opts:["Les gla\xEFeuls, fleurs souvent associ\xE9es aux fun\xE9railles (leur nom vient du latin \xAB petit glaive \xBB), sont un indice discret de la mort.","Le soldat est un jardinier qui plante des fleurs.","Le vers montre que le soldat a mal aux pieds.","Ce d\xE9tail n\u2019a pas d\u2019importance, il d\xE9crit seulement le d\xE9cor."],simple:"Un indice discret de la mort : fleur des fun\xE9railles, nom li\xE9 au glaive.",detail:"Dans un po\xE8me \xE0 chute, chaque d\xE9tail compte. Les tercets accumulent des indices (gla\xEFeuls, \xAB enfant malade \xBB, \xAB il a froid \xBB) : le lecteur attentif devine avant la fin."},{id:"l6",type:"sort",q:"Classe chaque \xE9l\xE9ment de cette analyse : proc\xE9d\xE9, citation ou interpr\xE9tation ?",cats:["Proc\xE9d\xE9","Citation","Interpr\xE9tation"],items:[["personnification",0],["rejet",0],["\xAB Nature, berce-le \xBB",1],["\xAB Dort ; \xBB",1],["la nature devient une m\xE8re protectrice",2],["le sommeil est mis en valeur, comme une fausse piste",2]],simple:"Proc\xE9d\xE9 = un nom technique ; citation = les mots du texte ; interpr\xE9tation = l\u2019effet, le sens.",detail:"Une analyse compl\xE8te r\xE9unit les trois : \xAB Le <b>rejet</b> de \xAB <b>Dort ;</b> \xBB <b>met en valeur le sommeil, fausse piste avant la chute</b>. \xBB"},{id:"l7",type:"qcm",q:"Question de grammaire : comment analyser la n\xE9gation dans \xAB Tous vos amis s\u2019en vont \xBB / \xAB Les parfums ne font pas frissonner sa narine \xBB ?",opts:["La seconde phrase contient une n\xE9gation totale (ne\u2026 pas) ; la premi\xE8re est affirmative.","Les deux phrases sont n\xE9gatives.","La premi\xE8re contient une n\xE9gation partielle (tous).","La seconde est \xE0 la forme passive."],simple:"Seule la seconde est n\xE9gative : n\xE9gation totale \xAB ne\u2026 pas \xBB.",detail:"\xAB Tous \xBB est un d\xE9terminant ind\xE9fini, pas une n\xE9gation. Une n\xE9gation partielle porte sur un \xE9l\xE9ment (ne\u2026 jamais, ne\u2026 rien, ne\u2026 personne, ne\u2026 plus)."}],[{id:"l8",type:"write",q:"Explique le dernier mouvement du \xAB Dormeur du val \xBB (v. 12-14) en 6 \xE0 8 lignes, en suivant le texte.",src:["Les parfums ne font pas frissonner sa narine ;","Il dort dans le soleil, la main sur sa poitrine","Tranquille. Il a deux trous rouges au c\xF4t\xE9 droit."],model:"Le dernier tercet r\xE9v\xE8le la v\xE9rit\xE9. Au vers 12, la <b>n\xE9gation</b> \xAB ne font pas frissonner \xBB montre que le soldat ne r\xE9agit plus aux sensations, alors que tout le po\xE8me en est rempli : c\u2019est un indice de mort. Au vers 13, la reprise de \xAB Il dort \xBB prolonge l\u2019illusion du sommeil, et le geste \xAB la main sur sa poitrine \xBB para\xEEt paisible, mais il d\xE9signe en r\xE9alit\xE9 la blessure. Le <b>rejet</b> de \xAB Tranquille \xBB, isol\xE9 par un point, est la derni\xE8re image de calme. Enfin, la phrase courte et factuelle \xAB Il a deux trous rouges au c\xF4t\xE9 droit \xBB constitue la <b>pointe</b> du sonnet : la mort est dite sans \xEAtre nomm\xE9e, par une simple notation de couleur. Ce contraste brutal entre la paix apparente et la violence de la guerre r\xE9pond au projet de lecture : la nature idyllique devient le cadre d\u2019une d\xE9nonciation implicite.",checklist:["Je suis l\u2019ordre des vers.","Chaque remarque a une citation, un proc\xE9d\xE9 et une interpr\xE9tation.","Je parle de la pointe (chute).","Je reviens au projet de lecture."],simple:"N\xE9gation (insensibilit\xE9) \u2192 \xAB il dort \xBB r\xE9p\xE9t\xE9 (illusion) \u2192 rejet \xAB Tranquille \xBB \u2192 pointe \xAB deux trous rouges \xBB \u2192 d\xE9nonciation implicite."},{id:"l9",type:"write",q:"R\xE9dige l\u2019introduction orale de l\u2019explication des \xAB Effar\xE9s \xBB (situer, projet de lecture, mouvements).",model:"Arthur Rimbaud compose \xAB Les Effar\xE9s \xBB en 1870, \xE0 seize ans ; le po\xE8me fait partie des <i>Cahiers de Douai</i>, o\xF9 le jeune po\xE8te, r\xE9volt\xE9, \xAB peint la d\xE9tresse de cinq petits pauvres \xBB. En douze tercets form\xE9s de deux octosyllabes et d\u2019un vers de quatre syllabes, il montre des enfants affam\xE9s qui regardent un boulanger cuire son pain. <b>Projet de lecture</b> : comment Rimbaud transforme-t-il une sc\xE8ne de rue en tableau path\xE9tique et en d\xE9nonciation de la mis\xE8re ? <b>Mouvements</b> : 1. les enfants dans le froid devant le soupirail (tercets 1 \xE0 5) ; 2. la chaleur du pain qui leur rend la vie (tercets 6 \xE0 9) ; 3. une pri\xE8re d\xE9risoire dans le froid (tercets 10 \xE0 12).",checklist:["Auteur, date, recueil, \xE2ge.","Forme du po\xE8me et sujet en une phrase.","Un projet de lecture sous forme de question.","Deux \xE0 quatre mouvements d\xE9limit\xE9s."],simple:"Situer (1870, Cahiers de Douai) \u2192 sujet \u2192 question \xAB comment\u2026 path\xE9tique et d\xE9nonciation ? \xBB \u2192 3 mouvements."}]]},{id:"commentaire",titre:"Commentaire (\xE9crit)",lecon:"methodes",desc:"Regrouper les observations en axes, construire l\u2019introduction et un paragraphe.",worked:{titre:"Construire le plan du commentaire du \xAB Dormeur du val \xBB",src:"Arthur Rimbaud, \xAB Le Dormeur du val \xBB, octobre 1870",steps:[{h:"Relever les observations au brouillon",html:"Nature personnifi\xE9e, lumi\xE8re, couleurs, 4 \xE9l\xE9ments, sonnet classique, \xAB il dort \xBB r\xE9p\xE9t\xE9, comparaison avec \xAB un enfant malade \xBB, \xAB il a froid \xBB, gla\xEFeuls, rejet \xAB Tranquille \xBB, pointe \xAB deux trous rouges \xBB, date d\u2019octobre 1870."},{h:"Regrouper en deux axes",html:"<b>Axe I</b> : un tableau de nature idyllique (lumi\xE8re, eau, couleurs, personnification, sommeil paisible). <b>Axe II</b> : une d\xE9nonciation implicite de la guerre (indices, chute, ironie du titre, contexte de 1870)."},{h:"Formuler la probl\xE9matique",html:"<b>En quoi ce tableau d\u2019une nature paisible sert-il une d\xE9nonciation de la guerre ?</b>"},{h:"D\xE9tailler chaque axe en sous-parties",html:"I. a) une nature vivante et lumineuse ; b) un soldat apparemment endormi. II. a) des indices inqui\xE9tants ; b) une chute qui d\xE9nonce la guerre."},{h:"V\xE9rifier la progression",html:"On va de l\u2019<b>explicite</b> (le d\xE9cor, le sommeil) \xE0 l\u2019<b>implicite</b> (la mort, la d\xE9nonciation) : le plan suit la d\xE9couverte du lecteur."}],retenir:"Commentaire : <b>observer</b> \u2192 <b>regrouper</b> en axes \u2192 <b>probl\xE9matiser</b> \u2192 <b>plan d\xE9taill\xE9</b>. Les axes sont des <b>id\xE9es</b>, pas des proc\xE9d\xE9s."},levels:[[{id:"k1",type:"sort",q:"Classe ces observations dans les deux axes du commentaire du \xAB Dormeur du val \xBB.",cats:["I. Un tableau de nature idyllique","II. Une d\xE9nonciation de la guerre"],items:[["\xAB o\xF9 chante une rivi\xE8re \xBB (personnification)",0],["\xAB qui mousse de rayons \xBB (m\xE9taphore de la lumi\xE8re)",0],["\xAB son lit vert \xBB (m\xE9taphore de l\u2019herbe)",0],["\xAB comme un enfant malade \xBB (comparaison inqui\xE9tante)",1],["\xAB il a froid \xBB malgr\xE9 le soleil",1],["\xAB deux trous rouges \xBB (pointe)",1],["Le titre ironique \xAB dormeur \xBB",1]],simple:"Axe I : la nature belle et vivante. Axe II : les indices et la chute.",detail:"Certaines citations peuvent servir les deux axes (\xAB son lit vert \xBB est aussi un lit de mort). L\u2019important est de justifier son choix."},{id:"k2",type:"qcm",q:"Quelle est la diff\xE9rence entre le commentaire et l\u2019explication lin\xE9aire ?",opts:["Le commentaire est organis\xE9 par axes (th\xE8mes) ; l\u2019explication lin\xE9aire suit l\u2019ordre du texte.","Le commentaire est oral ; l\u2019explication lin\xE9aire est \xE9crite.","Le commentaire ne contient pas de citations.","Il n\u2019y a aucune diff\xE9rence."],simple:"Commentaire = par axes (\xE9crit) ; lin\xE9aire = dans l\u2019ordre (oral).",detail:"Les deux utilisent le m\xEAme geste d\u2019analyse (proc\xE9d\xE9, citation, effet) et une question directrice (probl\xE9matique / projet de lecture)."},{id:"k3",type:"order",q:"Remets dans l\u2019ordre les \xE9tapes de l\u2019introduction d\u2019un commentaire.",items:["Amorce (contexte, auteur, mouvement)","Pr\xE9sentation du texte (titre, date, recueil, sujet)","Probl\xE9matique","Annonce du plan"],simple:"Amorce \u2192 pr\xE9sentation \u2192 probl\xE9matique \u2192 annonce du plan.",detail:"L\u2019introduction va du g\xE9n\xE9ral au particulier, puis pose la question et annonce comment on va y r\xE9pondre."}],[{id:"k4",type:"qcm",q:"Quels axes conviennent le mieux pour commenter \xAB Les Effar\xE9s \xBB ?",opts:["I. Une sc\xE8ne de mis\xE8re saisie avec r\xE9alisme / II. Un regard path\xE9tique et r\xE9volt\xE9","I. Les rimes / II. Les figures de style","I. Le d\xE9but / II. La fin","I. Rimbaud / II. Le boulanger"],simple:"Des axes qui sont des id\xE9es sur le texte.",detail:"Un plan \xAB rimes / figures \xBB s\xE9pare la forme du sens ; \xAB d\xE9but / fin \xBB est lin\xE9aire ; \xAB Rimbaud / boulanger \xBB n\u2019est pas une interpr\xE9tation. Les bons axes r\xE9pondent \xE0 une probl\xE9matique : comment Rimbaud fait-il d\u2019une sc\xE8ne de rue un tableau path\xE9tique ?"},{id:"k5",type:"order",q:"Remets dans l\u2019ordre ce paragraphe de commentaire sur \xAB Roman \xBB.",items:["Le po\xE8me fait d\u2019abord de l\u2019amour adolescent une ivresse des sens.","Rimbaud mobilise tous les sens, de l\u2019odorat (\xAB Les tilleuls sentent bon \xBB) au go\xFBt.","Ainsi, la m\xE9taphore \xAB La s\xE8ve est du champagne et vous monte \xE0 la t\xEAte \xBB assimile l\u2019\xE9lan du printemps \xE0 l\u2019alcool.","Le jeune homme est gris\xE9 : l\u2019amour na\xEEt moins d\u2019une personne que d\u2019une atmosph\xE8re.","Cette ivresse l\xE9g\xE8re pr\xE9pare toutefois la d\xE9sillusion de la fin du po\xE8me."],simple:"Id\xE9e \u2192 explication \u2192 citation + proc\xE9d\xE9 \u2192 interpr\xE9tation \u2192 bilan / transition.",detail:"C\u2019est la structure du paragraphe argumentatif vue en cours. La derni\xE8re phrase fait le lien avec la suite (transition)."},{id:"k6",type:"qcm",q:"Que manque-t-il dans ce passage ? \xAB Dans le vers 7, Rimbaud \xE9crit \u201CDort ;\u201D. C\u2019est un rejet. \xBB",opts:["L\u2019interpr\xE9tation : l\u2019effet produit par le rejet","La citation","Le nom du proc\xE9d\xE9","Rien, l\u2019analyse est compl\xE8te"],simple:"Il manque l\u2019interpr\xE9tation.",detail:"Citer et nommer ne suffit pas. Il faut ajouter : \xAB Ce verbe isol\xE9 insiste sur le sommeil et entra\xEEne le lecteur sur une fausse piste avant la r\xE9v\xE9lation de la mort. \xBB"}],[{id:"k7",type:"write",q:"R\xE9dige l\u2019introduction compl\xE8te d\u2019un commentaire de \xAB Ma boh\xE8me \xBB.",src:["Je m\u2019en allais, les poings dans mes poches crev\xE9es ;","Mon paletot aussi devenait id\xE9al ;","J\u2019allais sous le ciel, Muse ! et j\u2019\xE9tais ton f\xE9al ;","Oh ! l\xE0 ! l\xE0 ! que d\u2019amours splendides j\u2019ai r\xEAv\xE9es !"],model:"En 1870, \xE0 seize ans, Arthur Rimbaud fugue \xE0 plusieurs reprises loin de Charleville, en pleine guerre franco-prussienne ; ces errances nourrissent les <i>Cahiers de Douai</i>, confi\xE9s \xE0 Paul Demeny. Dans \xAB Ma boh\xE8me \xBB, sonnet d\u2019alexandrins d\u2019octobre 1870, le jeune po\xE8te \xE9voque le bonheur \xE9prouv\xE9 sur les routes, pauvre mais libre, sous les \xE9toiles. <b>Comment Rimbaud transforme-t-il le r\xE9cit d\u2019une fugue mis\xE9rable en art po\xE9tique de la libert\xE9 ?</b> Nous verrons d\u2019abord que le po\xE8me peint avec humour une errance heureuse, puis qu\u2019il fait de ce vagabondage une v\xE9ritable \xE9mancipation cr\xE9atrice.",checklist:["Amorce : contexte (1870, fugue).","Pr\xE9sentation : titre, forme, sujet.","Probl\xE9matique sous forme de question.","Annonce de deux axes."],simple:"Amorce (1870, fugues) \u2192 pr\xE9sentation (sonnet, bonheur de la fugue) \u2192 probl\xE9matique \u2192 2 axes."},{id:"k8",type:"write",q:"R\xE9dige le paragraphe II b du commentaire du \xAB Dormeur du val \xBB : \xAB une chute qui d\xE9nonce la guerre \xBB.",model:"La fin du sonnet transforme le tableau en <b>d\xE9nonciation</b>. Le dernier tercet prolonge d\u2019abord l\u2019illusion : \xAB Il dort dans le soleil, la main sur sa poitrine / Tranquille. \xBB Le <b>rejet</b> de \xAB Tranquille \xBB, isol\xE9 par un point, fige une derni\xE8re image de paix. Mais la phrase suivante, br\xE8ve et neutre, \xAB Il a deux trous rouges au c\xF4t\xE9 droit \xBB, constitue la <b>pointe</b> du sonnet : la mort, jamais nomm\xE9e, est r\xE9v\xE9l\xE9e par une simple couleur. Ce contraste brutal oblige le lecteur \xE0 relire tout le po\xE8me : le \xAB lit vert \xBB \xE9tait un lit de mort, le \xAB trou de verdure \xBB une tombe. Sans discours ni nom de bataille, Rimbaud d\xE9nonce une guerre qui tue des jeunes gens au c\u0153ur d\u2019une nature indiff\xE9rente.",checklist:["Une phrase-id\xE9e au d\xE9but.","Au moins deux citations analys\xE9es.","Les proc\xE9d\xE9s nomm\xE9s (rejet, pointe).","Une interpr\xE9tation et un bilan."],simple:"Id\xE9e (d\xE9nonciation) \u2192 rejet \xAB Tranquille \xBB \u2192 pointe \xAB deux trous rouges \xBB \u2192 relecture du po\xE8me \u2192 bilan."}]]},{id:"dissertation",titre:"Dissertation (\xE9crit)",lecon:"methodes",desc:"Du brouillon au plan : temp\xEAte de cerveau, tri, probl\xE9matique, paragraphe argumentatif.",worked:{titre:"Sujet guid\xE9 : \xAB On n\u2019est pas s\xE9rieux quand on a dix-sept ans \xBB. Ce vers vous semble-t-il repr\xE9sentatif de l\u2019ensemble des Cahiers de Douai ?",src:"Sujet du dossier Classicolyc\xE9e, travaill\xE9 en cours",steps:[{h:"1. Identifier les mots-cl\xE9s",html:"\xAB <b>s\xE9rieux</b> \xBB : r\xE9fl\xE9chi, grave, profond, fiable ; ni\xE9, il fait penser \xE0 l\u2019humour, la l\xE9g\xE8ret\xE9, l\u2019incons\xE9quence. \xAB <b>dix-sept ans</b> \xBB : l\u2019adolescence (Rimbaud a 16 ans). \xAB <b>repr\xE9sentatif de l\u2019ensemble</b> \xBB : le vers vaut-il pour tous les po\xE8mes ? \u2192 le sujet appelle un plan <b>dialectique</b>."},{h:"2. D\xE9gager une probl\xE9matique",html:"Reformuler la th\xE8se : l\u2019adolescence n\u2019est pas propice aux sujets graves. Probl\xE9matique : <b>le recueil des Cahiers de Douai n\u2019est-il qu\u2019une \u0153uvre de jeunesse, empreinte de l\xE9g\xE8ret\xE9 et de d\xE9rision ?</b>"},{h:"3. Temp\xEAte de cerveau puis tri",html:"Lister po\xE8mes, citations, id\xE9es ; les classer en trois cat\xE9gories : <b>l\xE9g\xE8ret\xE9</b> (Roman, Ma boh\xE8me, Premi\xE8re soir\xE9e, R\xEAv\xE9 pour l\u2019hiver) ; <b>gravit\xE9</b> (Le Dormeur du val, Le Mal, Rages de C\xE9sars, Les Effar\xE9s) ; <b>bouleversement des codes</b> (V\xE9nus anadyom\xE8ne, sonnet d\xE9tourn\xE9, \xAB robinsonne \xBB)."},{h:"4. \xC9laborer le plan d\xE9taill\xE9",html:"<b>I.</b> Certes, le recueil \xE9voque l\u2019adolescence et n\u2019est pas d\xE9pourvu de l\xE9g\xE8ret\xE9 et de d\xE9rision. <b>II.</b> Certains po\xE8mes abordent n\xE9anmoins des sujets graves et s\xE9rieux\u2026 <b>III.</b> \u2026 et bouleversent, malgr\xE9 la jeunesse de leur auteur, la po\xE9sie et ses codes."},{h:"5. Pr\xE9parer introduction et conclusion",html:"Amorce possible : la fugue de Rimbaud \xE0 16 ans. Ouverture : Verlaine, \xAB l\u2019homme aux semelles de vent \xBB, ou Charles Cros et son humour absurde."}],retenir:"Le plan va du plus <b>\xE9vident</b> (l\xE9g\xE8ret\xE9) au plus <b>complexe</b> (r\xE9volution po\xE9tique). Une citation au moins par partie."},levels:[[{id:"d1",type:"order",q:"Remets dans l\u2019ordre les 8 \xE9tapes de la dissertation en 4 heures.",items:["Temp\xEAte de cerveau au brouillon","Tri, regroupement, cat\xE9gorisation","Plan d\xE9taill\xE9 en 3 parties","Introduction et conclusion au brouillon","R\xE9diger l\u2019introduction sur la copie","R\xE9diger les 3 parties au propre","Recopier la conclusion en l\u2019am\xE9liorant","Se relire (15 minutes minimum)"],simple:"Brouillon (1 \xE0 4) \u2192 copie (5 \xE0 7) \u2192 relecture (8).",detail:"Temps conseill\xE9s : 10-15 min, 10-15 min, 20-30 min, 20 min, puis 2 h 30 pour les \xE9tapes 5, 6 et 7, et au moins 15 min de relecture."},{id:"d2",type:"sort",q:"Temp\xEAte de cerveau sur \xAB \xE9mancipations cr\xE9atrices \xBB : trie les mots en trois cat\xE9gories.",cats:["Se lib\xE9rer","Cr\xE9er","Artistes et \u0153uvres"],items:[["s\u2019\xE9chapper",0],["d\xE9livrance",0],["s\u2019enfuir",0],["r\xE9voltes",0],["imagination",1],["inventivit\xE9",1],["inspiration",1],["id\xE9e nouvelle",1],["Rimbaud",2],["Frida",2],["Picasso",2],["Moli\xE8re",2]],simple:"Lib\xE9ration / cr\xE9ation / exemples.",detail:"C\u2019est l\u2019\xE9tape 2 de la m\xE9thode : passer de mots en vrac \xE0 des <b>cat\xE9gories</b>, qui deviendront des parties ou des sous-parties du plan."},{id:"d3",type:"sort",q:"Exemple du cours : trie la temp\xEAte de cerveau \xAB communiquer avec les autres \xBB.",cats:["Le corps","Les moyens","Les intentions"],items:[["sa voix",0],["son regard",0],["ses cinq sens",0],["le th\xE9\xE2tre",1],["la po\xE9sie",1],["les r\xE9seaux",1],["l\u2019empathie",2],["la tol\xE9rance",2],["le dialogue",2]],simple:"Corps : voix, regard, sens. Moyens : th\xE9\xE2tre, po\xE9sie, r\xE9seaux. Intentions : empathie, tol\xE9rance, dialogue.",detail:"Ces trois cat\xE9gories ont permis de r\xE9diger le paragraphe sur C\xF4me (<i>Le Baron perch\xE9</i>, chapitre 8) : il teste son corps, d\xE9fie les gamins, affronte le regard de son p\xE8re."},{id:"d4",type:"qcm",q:"Combien de temps faut-il pr\xE9voir pour r\xE9diger l\u2019introduction, les 3 parties et la conclusion sur la copie ?",opts:["2 h 30","1 heure","45 minutes","3 h 30"],simple:"2 h 30.",detail:"Le brouillon prend environ 1 h 15 (\xE9tapes 1 \xE0 4), la relecture au moins 15 minutes."}],[{id:"d5",type:"qcm",q:"Quel type de plan choisir pour : \xAB Les Cahiers de Douai ne sont-ils qu\u2019une \u0153uvre de jeunesse ? \xBB",opts:["Plan dialectique : pour / contre / un peu les deux","Plan th\xE9matique : th\xE8me \xE9vident / plus complexe / tr\xE8s complexe","Plan chronologique","Pas de plan"],simple:"Dialectique : la question invite \xE0 discuter une affirmation.",detail:"La tournure \xAB ne\u2026 que \xBB propose une th\xE8se (\xAB seulement une \u0153uvre de jeunesse \xBB) qu\u2019on peut accepter en partie, puis nuancer et d\xE9passer."},{id:"d6",type:"qcm",q:"Quel type de plan choisir pour : \xAB Quelles formes prend l\u2019\xE9mancipation dans les Cahiers de Douai ? \xBB",opts:["Plan th\xE9matique : de la forme la plus \xE9vidente \xE0 la plus complexe","Plan dialectique : pour / contre","Plan en deux parties : oui / non","Plan biographique"],simple:"Th\xE9matique : la question demande d\u2019explorer, pas de discuter.",detail:"Exemple : I. une \xE9mancipation du corps et de la famille (fugue, sensations) ; II. une \xE9mancipation politique et sociale (satire, guerre) ; III. une \xE9mancipation po\xE9tique (codes, langage)."},{id:"d7",type:"sort",q:"Place chaque argument ou exemple dans la bonne partie du plan du sujet guid\xE9.",cats:["I. L\xE9g\xE8ret\xE9 et d\xE9rision","II. Des sujets graves","III. Bouleverser la po\xE9sie"],items:[["\xAB Roman \xBB : un coup de foudre adolescent",0],["\xAB R\xEAv\xE9 pour l\u2019hiver \xBB : badinage dans un train",0],["\xAB Le Dormeur du val \xBB : un soldat mort",1],["\xAB Rages de C\xE9sars \xBB : Napol\xE9on III prisonnier",1],["\xAB Les Effar\xE9s \xBB : la mis\xE8re des enfants",1],["\xAB V\xE9nus anadyom\xE8ne \xBB : parodie d\u2019un mythe",2],["Le n\xE9ologisme \xAB robinsonne \xBB",2],["Un sonnet classique d\xE9tourn\xE9 par une pointe brutale",2]],simple:"I : amour, badinage. II : guerre, politique, mis\xE8re. III : parodie, langue, formes.",detail:"Le m\xEAme po\xE8me peut servir deux parties (\xAB Le Dormeur du val \xBB aussi en III pour le d\xE9tournement du sonnet) : dans ce cas, on l\u2019analyse sous un angle diff\xE9rent."},{id:"d8",type:"qcm",q:"Laquelle de ces citations est correctement int\xE9gr\xE9e ?",opts:["C\xF4me veut explorer son domaine \xAB arbre apr\xE8s arbre, branche apr\xE8s branche \xBB (l. 3).","C\xF4me veut explorer. \xAB arbre apr\xE8s arbre, branche apr\xE8s branche \xBB.","\xAB arbre apr\xE8s arbre, branche apr\xE8s branche \xBB est une citation du texte.","C\xF4me veut explorer arbre apr\xE8s arbre branche apr\xE8s branche."],simple:"La premi\xE8re : guillemets, phrase grammaticale, r\xE9f\xE9rence de ligne.",detail:"La citation doit s\u2019ins\xE9rer dans une phrase correcte, entre guillemets, avec la ligne ou le vers, puis \xEAtre <b>comment\xE9e</b>."}],[{id:"d9",type:"qcm",q:"Quelle probl\xE9matique est la meilleure pour le sujet guid\xE9 ?",opts:["Le recueil des Cahiers de Douai n\u2019est-il qu\u2019une \u0153uvre de jeunesse, empreinte de l\xE9g\xE8ret\xE9 et de d\xE9rision ?","Qui \xE9tait Arthur Rimbaud ?","Quels sont les po\xE8mes des Cahiers de Douai ?","Pourquoi Rimbaud a-t-il dix-sept ans ?"],simple:"La premi\xE8re : elle reformule et questionne la th\xE8se du sujet.",detail:"Une bonne probl\xE9matique reprend les mots-cl\xE9s (jeunesse, l\xE9g\xE8ret\xE9, ensemble du recueil) et ouvre un d\xE9bat. Les autres sont des questions de connaissance."},{id:"d10",type:"write",q:"R\xE9dige le premier paragraphe de la partie II (\xAB Certains po\xE8mes abordent des sujets graves \xBB) en t\u2019appuyant sur \xAB Le Dormeur du val \xBB.",model:"Pourtant, l\u2019adolescent des <i>Cahiers de Douai</i> sait aussi \xEAtre grave, notamment lorsqu\u2019il \xE9voque la guerre de 1870. Dans \xAB Le Dormeur du val \xBB, sonnet d\u2019octobre 1870, Rimbaud d\xE9crit d\u2019abord une nature lumineuse et un jeune soldat qui semble dormir \xAB dans son lit vert o\xF9 la lumi\xE8re pleut \xBB (v. 8). Mais les indices s\u2019accumulent, de la comparaison avec \xAB un enfant malade \xBB (v. 10) au froid du soldat, jusqu\u2019\xE0 la pointe : \xAB Il a deux trous rouges au c\xF4t\xE9 droit \xBB (v. 14). Cette chute brutale d\xE9nonce implicitement une guerre qui tue la jeunesse, quelques semaines apr\xE8s la d\xE9faite de Sedan, toute proche de Charleville. Loin de la l\xE9g\xE8ret\xE9 de \xAB Roman \xBB, le po\xE8te de seize ans prend donc part aux drames de son temps.",checklist:["Une phrase-id\xE9e qui annonce l\u2019argument.","Un exemple pr\xE9cis avec au moins deux citations r\xE9f\xE9renc\xE9es.","Une analyse (proc\xE9d\xE9s, effet).","Un lien avec le sujet (jeunesse / gravit\xE9)."],simple:"Id\xE9e (gravit\xE9) \u2192 Le Dormeur du val, citations v. 8, 10, 14 \u2192 d\xE9nonciation de la guerre \u2192 retour au sujet."},{id:"d11",type:"write",q:"R\xE9dige l\u2019introduction de la dissertation sur le sujet guid\xE9 (\xAB On n\u2019est pas s\xE9rieux quand on a dix-sept ans \xBB).",model:"\xC0 seize ans, en 1870, Arthur Rimbaud fugue loin de Charleville et confie \xE0 Paul Demeny les po\xE8mes qui formeront les <i>Cahiers de Douai</i>. Dans \xAB Roman \xBB, il \xE9crit : \xAB On n\u2019est pas s\xE9rieux, quand on a dix-sept ans \xBB. Ce vers, au pr\xE9sent de v\xE9rit\xE9 g\xE9n\xE9rale, semble d\xE9finir l\u2019adolescence comme l\u2019\xE2ge de la l\xE9g\xE8ret\xE9. Peut-il pour autant r\xE9sumer l\u2019ensemble du recueil ? <b>Les Cahiers de Douai ne sont-ils qu\u2019une \u0153uvre de jeunesse, empreinte de l\xE9g\xE8ret\xE9 et de d\xE9rision ?</b> Nous verrons d\u2019abord que le recueil \xE9voque l\u2019adolescence avec humour et insouciance, puis qu\u2019il aborde pourtant des sujets graves, avant de montrer qu\u2019il bouleverse, malgr\xE9 la jeunesse de son auteur, la po\xE9sie et ses codes.",checklist:["Amorce (biographie ou contexte).","Citation du sujet et analyse des mots-cl\xE9s.","Probl\xE9matique.","Annonce des trois parties."],simple:"Amorce (fugue, 1870) \u2192 citation et sens du vers \u2192 probl\xE9matique \u2192 annonce I, II, III."}]]}];var mr=[{id:"dormeur",titre:"Le Dormeur du val",auteur:"Arthur Rimbaud",source:"Cahiers de Douai, octobre 1870",note:"Sonnet d\u2019alexandrins. Portrait d\u2019un soldat gisant mort en pleine nature (guerre franco-prussienne).",strophes:[["C\u2019est un trou de verdure o\xF9 chante une rivi\xE8re","Accrochant follement aux herbes des haillons","D\u2019argent ; o\xF9 le soleil, de la montagne fi\xE8re,","Luit : c\u2019est un petit val qui mousse de rayons."],["Un soldat jeune, bouche ouverte, t\xEAte nue,","Et la nuque baignant dans le frais cresson bleu,","Dort ; il est \xE9tendu dans l\u2019herbe, sous la nue,","P\xE2le dans son lit vert o\xF9 la lumi\xE8re pleut."],["Les pieds dans les gla\xEFeuls, il dort. Souriant comme","Sourirait un enfant malade, il fait un somme :","Nature, berce-le chaudement : il a froid."],["Les parfums ne font pas frissonner sa narine ;","Il dort dans le soleil, la main sur sa poitrine","Tranquille. Il a deux trous rouges au c\xF4t\xE9 droit."]]},{id:"roman",titre:"Roman",auteur:"Arthur Rimbaud",source:"Cahiers de Douai, 29 septembre 1870",note:"Po\xE8me en quatre parties de deux quatrains d\u2019alexandrins. Petit r\xE9cit d\u2019un coup de foudre adolescent.",parties:["I","II","III","IV"],strophes:[["On n\u2019est pas s\xE9rieux, quand on a dix-sept ans.","\u2013 Un beau soir, foin des bocks et de la limonade,","Des caf\xE9s tapageurs aux lustres \xE9clatants !","\u2013 On va sous les tilleuls verts de la promenade."],["Les tilleuls sentent bon dans les bons soirs de juin !","L\u2019air est parfois si doux, qu\u2019on ferme la paupi\xE8re ;","Le vent charg\xE9 de bruits \u2013 la ville n\u2019est pas loin \u2013","A des parfums de vigne et des parfums de bi\xE8re\u2026"],["\u2013 Voil\xE0 qu\u2019on aper\xE7oit un tout petit chiffon","D\u2019azur sombre, encadr\xE9 d\u2019une petite branche,","Piqu\xE9 d\u2019une mauvaise \xE9toile, qui se fond","Avec de doux frissons, petite et toute blanche\u2026"],["Nuit de juin ! Dix-sept ans ! \u2013 On se laisse griser.","La s\xE8ve est du champagne et vous monte \xE0 la t\xEAte\u2026","On divague ; on se sent aux l\xE8vres un baiser","Qui palpite l\xE0, comme une petite b\xEAte\u2026"],["Le c\u0153ur fou robinsonne \xE0 travers les romans,","\u2013 Lorsque, dans la clart\xE9 d\u2019un p\xE2le r\xE9verb\xE8re,","Passe une demoiselle aux petits airs charmants,","Sous l\u2019ombre du faux col effrayant de son p\xE8re\u2026"],["Et, comme elle vous trouve immens\xE9ment na\xEFf,","Tout en faisant trotter ses petites bottines,","Elle se tourne, alerte et d\u2019un mouvement vif\u2026","\u2013 Sur vos l\xE8vres alors meurent les cavatines\u2026"],["Vous \xEAtes amoureux. Lou\xE9 jusqu\u2019au mois d\u2019ao\xFBt.","Vous \xEAtes amoureux. \u2013 Vos sonnets La font rire.","Tous vos amis s\u2019en vont, vous \xEAtes mauvais go\xFBt.","\u2013 Puis l\u2019ador\xE9e, un soir, a daign\xE9 vous \xE9crire !\u2026"],["\u2013 Ce soir-l\xE0\u2026, \u2013 vous rentrez aux caf\xE9s \xE9clatants,","Vous demandez des bocks ou de la limonade\u2026","\u2013 On n\u2019est pas s\xE9rieux, quand on a dix-sept ans","Et qu\u2019on a des tilleuls verts sur la promenade."]]},{id:"effares",titre:"Les Effar\xE9s",auteur:"Arthur Rimbaud",source:"Cahiers de Douai, 1870",note:"Douze tercets (deux octosyllabes suivis d\u2019un vers de quatre syllabes). Peinture path\xE9tique d\u2019enfants affam\xE9s regardant un boulanger faire du pain.",strophes:[["Noirs dans la neige et dans la brume,","Au grand soupirail qui s\u2019allume,","Leurs culs en rond,"],["\xC0 genoux, cinq petits, \u2013 mis\xE8re ! \u2013","Regardent le Boulanger faire","Le lourd pain blond."],["Ils voient le fort bras blanc qui tourne","La p\xE2te grise et qui l\u2019enfourne","Dans un trou clair."],["Ils \xE9coutent le bon pain cuire.","Le Boulanger au gras sourire","Grogne un vieil air."],["Ils sont blottis, pas un ne bouge,","Au souffle du soupirail rouge","Chaud comme un sein."],["Quand pour quelque m\xE9dianoche,","Fa\xE7onn\xE9 comme une brioche","On sort le pain,"],["Quand, sous les poutres enfum\xE9es,","Chantent les cro\xFBtes parfum\xE9es","Et les grillons,"],["Que ce trou chaud souffle la vie,","Ils ont leur \xE2me si ravie","Sous leurs haillons,"],["Ils se ressentent si bien vivre,","Les pauvres J\xE9sus pleins de givre,","Qu\u2019ils sont l\xE0 tous,"],["Collant leurs petits museaux roses","Au treillage, grognant des choses","Entre les trous,"],["Tout b\xEAtes, faisant leurs pri\xE8res","Et repli\xE9s vers ces lumi\xE8res","Du ciel rouvert,"],["Si fort qu\u2019ils cr\xE8vent leur culotte","Et que leur chemise tremblote","Au vent d\u2019hiver."]]},{id:"boheme",titre:"Ma boh\xE8me",auteur:"Arthur Rimbaud",source:"Cahiers de Douai, octobre 1870",note:"Sonnet d\u2019alexandrins (ajout\xE9 au tableau par le professeur). \xC9vocation du bonheur du jeune po\xE8te lors de sa fugue.",strophes:[["Je m\u2019en allais, les poings dans mes poches crev\xE9es ;","Mon paletot aussi devenait id\xE9al ;","J\u2019allais sous le ciel, Muse ! et j\u2019\xE9tais ton f\xE9al ;","Oh ! l\xE0 ! l\xE0 ! que d\u2019amours splendides j\u2019ai r\xEAv\xE9es !"],["Mon unique culotte avait un large trou.","\u2013 Petit-Poucet r\xEAveur, j\u2019\xE9grenais dans ma course","Des rimes. Mon auberge \xE9tait \xE0 la Grande-Ourse.","\u2013 Mes \xE9toiles au ciel avaient un doux frou-frou"],["Et je les \xE9coutais, assis au bord des routes,","Ces bons soirs de septembre o\xF9 je sentais des gouttes","De ros\xE9e \xE0 mon front, comme un vin de vigueur ;"],["O\xF9, rimant au milieu des ombres fantastiques,","Comme des lyres, je tirais les \xE9lastiques","De mes souliers bless\xE9s, un pied pr\xE8s de mon c\u0153ur !"]]},{id:"buffet",titre:"Le Buffet",auteur:"Arthur Rimbaud",source:"Cahiers de Douai, octobre 1870",note:"Sonnet d\u2019alexandrins (ajout\xE9 au tableau par le professeur). Description po\xE9tique d\u2019une armoire recelant de nombreux tr\xE9sors anodins.",strophes:[["C\u2019est un large buffet sculpt\xE9 ; le ch\xEAne sombre,","Tr\xE8s vieux, a pris cet air si bon des vieilles gens ;","Le buffet est ouvert, et verse dans son ombre","Comme un flot de vin vieux, des parfums engageants ;"],["Tout plein, c\u2019est un fouillis de vieilles vieilleries,","De linges odorants et jaunes, de chiffons","De femmes ou d\u2019enfants, de dentelles fl\xE9tries,","De fichus de grand\u2019m\xE8re o\xF9 sont peints des griffons ;"],["\u2013 C\u2019est l\xE0 qu\u2019on trouverait les m\xE9daillons, les m\xE8ches","De cheveux blancs ou blonds, les portraits, les fleurs s\xE8ches","Dont le parfum se m\xEAle \xE0 des parfums de fruits."],["\u2013 \xD4 buffet du vieux temps, tu sais bien des histoires,","Et tu voudrais conter tes contes, et tu bruis","Quand s\u2019ouvrent lentement tes grandes portes noires."]]},{id:"passante",titre:"\xC0 une passante",auteur:"Charles Baudelaire",source:"Les Fleurs du mal, 1861",note:"Sonnet d\u2019alexandrins. Une \xAB gr\xE2ce \xBB : rencontre soudaine qui fait \xAB rena\xEEtre \xBB le po\xE8te (texte de Poulet).",strophes:[["La rue assourdissante autour de moi hurlait.","Longue, mince, en grand deuil, douleur majestueuse,","Une femme passa, d\u2019une main fastueuse","Soulevant, balan\xE7ant le feston et l\u2019ourlet ;"],["Agile et noble, avec sa jambe de statue.","Moi, je buvais, crisp\xE9 comme un extravagant,","Dans son \u0153il, ciel livide o\xF9 germe l\u2019ouragan,","La douceur qui fascine et le plaisir qui tue."],["Un \xE9clair\u2026 puis la nuit ! \u2013 Fugitive beaut\xE9","Dont le regard m\u2019a fait soudainement rena\xEEtre,","Ne te verrai-je plus que dans l\u2019\xE9ternit\xE9 ?"],["Ailleurs, bien loin d\u2019ici ! trop tard ! jamais peut-\xEAtre !","Car j\u2019ignore o\xF9 tu fuis, tu ne sais o\xF9 je vais,","\xD4 toi que j\u2019eusse aim\xE9e, \xF4 toi qui le savais !"]]},{id:"correspondances",titre:"Correspondances",auteur:"Charles Baudelaire",source:"Les Fleurs du mal, 1861",note:"Sonnet d\u2019alexandrins. Le monde est un ensemble de symboles ; les sens se r\xE9pondent (synesth\xE9sies).",strophes:[["La Nature est un temple o\xF9 de vivants piliers","Laissent parfois sortir de confuses paroles ;","L\u2019homme y passe \xE0 travers des for\xEAts de symboles","Qui l\u2019observent avec des regards familiers."],["Comme de longs \xE9chos qui de loin se confondent","Dans une t\xE9n\xE9breuse et profonde unit\xE9,","Vaste comme la nuit et comme la clart\xE9,","Les parfums, les couleurs et les sons se r\xE9pondent."],["Il est des parfums frais comme des chairs d\u2019enfants,","Doux comme les hautbois, verts comme les prairies,","\u2013 Et d\u2019autres, corrompus, riches et triomphants,"],["Ayant l\u2019expansion des choses infinies,","Comme l\u2019ambre, le musc, le benjoin et l\u2019encens,","Qui chantent les transports de l\u2019esprit et des sens."]]},{id:"ennemi",titre:"L\u2019Ennemi",auteur:"Charles Baudelaire",source:"Les Fleurs du mal, 1861",note:"Sonnet d\u2019alexandrins. Le Temps, ennemi du po\xE8te : un monde de la fatalit\xE9.",strophes:[["Ma jeunesse ne fut qu\u2019un t\xE9n\xE9breux orage,","Travers\xE9 \xE7\xE0 et l\xE0 par de brillants soleils ;","Le tonnerre et la pluie ont fait un tel ravage,","Qu\u2019il reste en mon jardin bien peu de fruits vermeils."],["Voil\xE0 que j\u2019ai touch\xE9 l\u2019automne des id\xE9es,","Et qu\u2019il faut employer la pelle et les r\xE2teaux","Pour rassembler \xE0 neuf les terres inond\xE9es,","O\xF9 l\u2019eau creuse des trous grands comme des tombeaux."],["Et qui sait si les fleurs nouvelles que je r\xEAve","Trouveront dans ce sol lav\xE9 comme une gr\xE8ve","Le mystique aliment qui ferait leur vigueur ?"],["\u2013 \xD4 douleur ! \xF4 douleur ! Le Temps mange la vie,","Et l\u2019obscur Ennemi qui nous ronge le c\u0153ur","Du sang que nous perdons cro\xEEt et se fortifie !"]]},{id:"albatros",titre:"L\u2019Albatros",auteur:"Charles Baudelaire",source:"Les Fleurs du mal, 1861",note:"Quatre quatrains d\u2019alexandrins. Le po\xE8te, comme l\u2019albatros, est exil\xE9 parmi les hommes.",strophes:[["Souvent, pour s\u2019amuser, les hommes d\u2019\xE9quipage","Prennent des albatros, vastes oiseaux des mers,","Qui suivent, indolents compagnons de voyage,","Le navire glissant sur les gouffres amers."],["\xC0 peine les ont-ils d\xE9pos\xE9s sur les planches,","Que ces rois de l\u2019azur, maladroits et honteux,","Laissent piteusement leurs grandes ailes blanches","Comme des avirons tra\xEEner \xE0 c\xF4t\xE9 d\u2019eux."],["Ce voyageur ail\xE9, comme il est gauche et veule !","Lui, nagu\xE8re si beau, qu\u2019il est comique et laid !","L\u2019un agace son bec avec un br\xFBle-gueule,","L\u2019autre mime, en boitant, l\u2019infirme qui volait !"],["Le Po\xEBte est semblable au prince des nu\xE9es","Qui hante la temp\xEAte et se rit de l\u2019archer ;","Exil\xE9 sur le sol au milieu des hu\xE9es,","Ses ailes de g\xE9ant l\u2019emp\xEAchent de marcher."]]},{id:"hareng",titre:"Le Hareng saur",auteur:"Charles Cros",source:"1872",note:"Po\xE8me \xAB antipo\xE9tique \xBB : humour absurde, r\xE9p\xE9titions, libert\xE9 totale. Cros a h\xE9berg\xE9 Rimbaud \xE0 Paris en 1871.",strophes:[["Il \xE9tait un grand mur blanc \u2014 nu, nu, nu,","Contre le mur une \xE9chelle \u2014 haute, haute, haute,","Et, par terre, un hareng saur \u2014 sec, sec, sec."],["Il vient, tenant dans ses mains \u2014 sales, sales, sales,","Un marteau lourd, un grand clou \u2014 pointu, pointu, pointu,","Un peloton de ficelle \u2014 gros, gros, gros."],["Alors il monte \xE0 l\u2019\xE9chelle \u2014 haute, haute, haute,","Et plante le clou pointu \u2014 toc, toc, toc,","Tout en haut du grand mur blanc \u2014 nu, nu, nu."],["Il laisse aller le marteau \u2014 qui tombe, qui tombe, qui tombe,","Attache au clou la ficelle \u2014 longue, longue, longue,","Et, au bout, le hareng saur \u2014 sec, sec, sec."],["Il redescend de l\u2019\xE9chelle \u2014 haute, haute, haute,","L\u2019emporte avec le marteau \u2014 lourd, lourd, lourd ;","Et puis, il s\u2019en va ailleurs \u2014 loin, loin, loin."],["Et, depuis, le hareng saur \u2014 sec, sec, sec,","Au bout de cette ficelle \u2014 longue, longue, longue,","Tr\xE8s lentement se balance \u2014 toujours, toujours, toujours."],["J\u2019ai compos\xE9 cette histoire \u2014 simple, simple, simple,","Pour mettre en fureur les gens \u2014 graves, graves, graves,","Et amuser les enfants \u2014 petits, petits, petits."]]}],Oi=[["Premi\xE8re soir\xE9e","Sans date","Huit quatrains d\u2019octosyllabes","Sc\xE8ne de badinage amoureux entre le po\xE8te et une jeune fille","amour"],["Sensation","Mars 1870","Deux quatrains d\u2019alexandrins","Peinture des sensations du po\xE8te lors d\u2019une promenade estivale","errance"],["Le Forgeron","Sans date","Long po\xE8me de dix strophes de longueurs diff\xE9rentes, en alexandrins","Discussion entre un forgeron et le roi Louis XVI, au palais des Tuileries, vers le 10 ao\xFBt 1792","politique"],["Soleil et Chair","Mai 1870","Long po\xE8me en alexandrins, en quatre parties","Hymne \xE0 l\u2019Antiquit\xE9, \xE9vocation nostalgique de l\u2019amour au temps de la mythologie gr\xE9co-romaine","mythe"],["Oph\xE9lie","Sans date","Neuf quatrains d\u2019alexandrins en trois parties in\xE9gales","\xC9vocation po\xE9tique du personnage shakespearien d\u2019Oph\xE9lie (Hamlet, 1601)","mythe"],["Bal des pendus","Sans date","Onze quatrains d\u2019octosyllabes (premi\xE8re et derni\xE8re strophes en alexandrins)","Repr\xE9sentation satirique et grotesque de condamn\xE9s \xE0 mort par pendaison","satire"],["Le Ch\xE2timent de Tartufe","Sans date","Sonnet d\u2019alexandrins","Portrait critique du personnage hypocrite et libidineux de Moli\xE8re","satire"],["V\xE9nus anadyom\xE8ne","Sans date","Sonnet d\u2019alexandrins","R\xE9\xE9criture parodique du mythe de la naissance de V\xE9nus","mythe"],["Les Reparties de Nina","Sans date","Vingt-sept quatrains, alternance d\u2019octosyllabes et de vers de quatre syllabes","Longue r\xEAverie d\u2019un jeune amoureux romantique, brutalement interrompue par sa compagne","amour"],["\xC0 la musique","\xAB Place de la gare, \xE0 Charleville \xBB","Neuf quatrains d\u2019alexandrins","Description satirique de la bourgeoisie de Charleville assistant \xE0 un concert municipal","satire"],["Les Effar\xE9s","Sans date","Douze tercets : deux octosyllabes suivis d\u2019un vers de quatre syllabes","Peinture path\xE9tique d\u2019enf
