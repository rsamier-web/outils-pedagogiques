<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bac de français · Rimbaud, Cahiers de Douai et méthodes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;1,400&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root {
  --scale: 1;
  --bg: #eff0f1; --view: #fcfcfc; --alt: #f4f5f6; --text: #232627; --muted: #6b7378;
  --border: #c6c9cc; --border-strong: #a9aeb2; --accent: #3daee9; --accent-ink: #1d78a8; --accent-soft: rgba(61,174,233,.14);
  --c-blue: #2980b9; --c-green: #1f9254; --c-red: #c23a4b; --c-orange: #c25e00; --c-violet: #8e44ad;
  --c-blue-soft: #e3f1fa; --c-green-soft: #e3f4ea; --c-red-soft: #fbe7ea; --c-orange-soft: #fdeedd; --c-violet-soft: #f3e8f8;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
  --lh: 1.55; --ls: normal; --ws: normal;
}
[data-theme="dark"] {
  --bg: #202326; --view: #292c30; --alt: #2f3337; --text: #eff0f1; --muted: #a1a9b1;
  --border: #464b51; --border-strong: #5e646b; --accent: #3daee9; --accent-ink: #7cc8f0; --accent-soft: rgba(61,174,233,.18);
  --c-blue: #5dade2; --c-green: #4cc285; --c-red: #ef6b7b; --c-orange: #f39c4a; --c-violet: #bb8fd3;
  --c-blue-soft: #1f3341; --c-green-soft: #1d3428; --c-red-soft: #3d2328; --c-orange-soft: #3c2b1b; --c-violet-soft: #33273b;
  --shadow: none;
}
[data-spacing="wide"] { --lh: 1.8; --ls: .03em; --ws: .12em; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: "Noto Sans", "Segoe UI", system-ui, sans-serif; font-size: calc(15.5px * var(--scale)); line-height: var(--lh); letter-spacing: var(--ls); word-spacing: var(--ws); }
button { font: inherit; color: inherit; letter-spacing: inherit; word-spacing: inherit; }
b { font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: .87em; } .center { text-align: center; justify-content: center; }

/* ── barre d'outils */
.app { display: flex; flex-direction: column; height: 100vh; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--border); min-height: 46px; }
.app-title { display: flex; align-items: center; gap: 8px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-logo { width: 26px; height: 26px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 14px; flex: none; }
.tb-actions { display: flex; gap: 6px; align-items: center; }
.btn-group { display: flex; } .btn-group .btn:first-child { border-radius: 3px 0 0 3px; } .btn-group .btn:last-child { border-radius: 0 3px 3px 0; margin-left: -1px; }

/* ── boutons Breeze */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; min-height: 32px; background: var(--view); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s, background .12s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .nav-i:focus-visible, .tab:focus-visible, .pill:focus-visible, .cat:focus-visible, .flash:focus-visible, .dot:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { border-color: var(--accent); background: var(--accent-soft); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn.small { padding: 2px 9px; min-height: 28px; font-size: .9em; }
.btn.icon { padding: 4px 8px; min-width: 32px; justify-content: center; }
.btn.good { border-color: var(--c-green); background: var(--c-green-soft); }
.btn.bad { border-color: var(--c-red); background: var(--c-red-soft); }
.link { background: none; border: 0; color: var(--accent-ink); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.only-mobile { display: none; }

/* ── mise en page */
.body { display: flex; flex: 1; min-height: 0; }
.sidebar { width: 260px; flex: none; overflow-y: auto; padding: 8px; background: var(--view); border-right: 1px solid var(--border); }
.nav-h { font-size: .8em; font-weight: 600; color: var(--muted); padding: 12px 10px 4px; text-transform: none; }
.nav-i { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 6px 10px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; line-height: 1.3; }
.nav-i:hover { background: var(--accent-soft); }
.nav-i.on { background: var(--accent-soft); border-color: var(--accent); }
.nav-i.sub { padding-left: 35px; font-size: .93em; }
.nav-i svg { flex: none; color: var(--muted); }
.nav-foot { padding: 16px 10px; }
.main { flex: 1; overflow-y: auto; }
.page { max-width: 900px; margin: 0 auto; padding: 20px 24px 60px; }
.page-h h1 { font-size: 1.55em; font-weight: 600; margin: 2px 0 6px; line-height: 1.25; }
.crumb { color: var(--muted); font-size: .85em; }
.lead { font-size: 1.03em; }
.card { background: var(--view); border: 1px solid var(--border); border-radius: 5px; padding: 18px 20px; margin: 14px 0; box-shadow: var(--shadow); }
.card h2 { font-size: 1.15em; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 9px; }
.card.highlight { border-color: var(--accent); }
.num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: .78em; font-weight: 600; flex: none; }
p { margin: 8px 0; }

/* ── segments de leçon */
.segbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 12px; }
.seg-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 5px; border: 1px solid var(--border); border-radius: 16px; background: var(--view); cursor: pointer; font-size: .9em; }
.pill:hover { border-color: var(--accent); }
.pill.on { background: var(--accent-soft); border-color: var(--accent); }
.pill-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--alt); border: 1px solid var(--border); font-size: .8em; }
.pill.on .pill-n { background: var(--accent); color: #fff; border-color: var(--accent); }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: .9em; color: var(--muted); cursor: pointer; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.next-box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin: 10px 0; }
.key { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 9px 12px; background: var(--alt); }
.key-t { font-weight: 600; margin-bottom: 3px; }
.key-d { font-size: .95em; }
.key-ex { font-size: .88em; color: var(--muted); margin-top: 5px; font-style: italic; }
.key-ex > span:first-child { font-style: normal; font-weight: 600; }
.retenir { border: 1px solid var(--c-green); background: var(--c-green-soft); border-radius: 4px; padding: 10px 14px; margin: 14px 0 4px; }
.retenir-h { font-weight: 600; color: var(--c-green); font-size: .85em; margin-bottom: 2px; }
.list { padding-left: 20px; } .list li { margin: 4px 0; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 10px 0; }
.steps li { counter-increment: s; position: relative; padding: 6px 0 6px 38px; border-bottom: 1px dashed var(--border); }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 7px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .8em; font-weight: 600; }
.steps li b { display: block; }
.table-wrap { overflow-x: auto; margin: 10px 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .93em; background: var(--view); }
.tbl th, .tbl td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
.tbl th { background: var(--alt); font-weight: 600; }
.diagram { margin: 10px 0; padding: 8px; background: var(--alt); border: 1px solid var(--border); border-radius: 4px; }
.diagram svg { width: 100%; height: auto; display: block; font-family: inherit; }
.scan sup { color: var(--accent-ink); font-size: .7em; margin-left: 1px; }
.tag { border-radius: 3px; padding: 0 4px; border-bottom: 2px solid; }
.t-pro { background: var(--c-blue-soft); border-color: var(--c-blue); }
.t-cit { background: var(--c-violet-soft); border-color: var(--c-violet); }
.t-eff { background: var(--c-green-soft); border-color: var(--c-green); }

/* ── puces de filtre */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { padding: 3px 11px; border: 1px solid var(--border); border-radius: 14px; background: var(--view); cursor: pointer; font-size: .88em; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); }
.chip-a { color: var(--muted); font-size: .9em; }

/* ── poèmes */
.poem-title { margin-bottom: 0 !important; }
.note { font-size: .93em; color: var(--muted); border-left: 3px solid var(--border); padding-left: 10px; }
.poem { font-family: "Noto Serif", Georgia, serif; font-size: 1.06em; margin-top: 14px; }
.strophe { margin-bottom: 14px; }
.partie { font-weight: 600; color: var(--muted); font-family: "Noto Sans", sans-serif; margin: 10px 0 4px 40px; }
.vers { display: flex; gap: 12px; }
.vn { width: 28px; text-align: right; color: var(--muted); font-size: .75em; padding-top: 4px; font-family: "Noto Sans", sans-serif; flex: none; }

/* ── exercices */
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--border); margin-top: 14px; }
.tab { padding: 8px 14px; border: 1px solid transparent; border-bottom: 0; background: none; cursor: pointer; border-radius: 4px 4px 0 0; margin-bottom: -1px; font-size: .93em; }
.tab:hover { background: var(--accent-soft); }
.tab.on { background: var(--view); border-color: var(--border); border-top: 2px solid var(--accent); }
.tab-c { color: var(--muted); font-size: .85em; margin-left: 4px; }
.badge { display: inline-block; font-size: .78em; font-weight: 600; color: var(--c-orange); border: 1px solid var(--c-orange); border-radius: 3px; padding: 0 6px; margin-bottom: 6px; }
.worked h2 { display: block; }
.wsteps { list-style: none; padding: 0; margin: 12px 0; }
.wstep { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin: 8px 0; background: var(--alt); animation: fade .25s ease; }
.wstep-h { font-weight: 600; display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.src { margin: 10px 0; padding: 9px 14px; border-left: 3px solid var(--c-violet); background: var(--c-violet-soft); font-family: "Noto Serif", Georgia, serif; border-radius: 0 4px 4px 0; }
.src .gap { height: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--view); cursor: pointer; font-size: .82em; }
.dot.cur { border: 2px solid var(--accent); font-weight: 600; }
.dot.ok { background: var(--c-green-soft); border-color: var(--c-green); }
.dot.ko { background: var(--c-red-soft); border-color: var(--c-red); }
.ex-q { font-weight: 600; font-size: 1.04em; margin-bottom: 6px; }
.opts { display: grid; gap: 7px; margin: 10px 0; }
.opt { text-align: left; padding: 9px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--view); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.good { border-color: var(--c-green); background: var(--c-green-soft); }
.opt.bad { border-color: var(--c-red); background: var(--c-red-soft); }
.opt:disabled { cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.fb { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 4px; margin: 8px 0; font-weight: 600; }
.fb.ok { color: var(--c-green); background: var(--c-green-soft); border: 1px solid var(--c-green); }
.fb.ko { color: var(--c-red); background: var(--c-red-soft); border: 1px solid var(--c-red); font-weight: 500; }
.corr { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
.corr-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.corr-box { margin-top: 8px; padding: 10px 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--alt); }
.corr-box.simple { border-left: 3px solid var(--c-green); }
.corr-box.detail { border-left: 3px solid var(--c-blue); }
.corr-lbl { font-weight: 600; font-size: .85em; color: var(--muted); margin-bottom: 4px; }
.num-row { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
.input { font: inherit; color: var(--text); background: var(--view); border: 1px solid var(--border); border-radius: 3px; padding: 6px 9px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.input.num { width: 90px; }
.input.area { width: 100%; resize: vertical; line-height: var(--lh); margin-top: 8px; }
.checklist { margin: 10px 0; display: grid; gap: 4px; }
.checklist label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.checklist input { margin-top: 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; font-size: .85em; }
.lg { padding: 1px 8px; border-radius: 3px; border: 1px solid; }
.sort { display: grid; gap: 6px; }
.sort-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 7px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--alt); }
.sort-row.good { border-color: var(--c-green); background: var(--c-green-soft); }
.sort-row.bad { border-color: var(--c-red); background: var(--c-red-soft); }
.sort-t { flex: 1 1 220px; }
.sort-b { display: flex; flex-wrap: wrap; gap: 4px; }
.cat { padding: 2px 9px; border: 1px solid var(--border); border-radius: 3px; background: var(--view); cursor: pointer; font-size: .82em; max-width: 220px; text-align: left; }
.cat:hover { border-color: var(--accent); }
.c0 { --cc: var(--c-blue); --cs: var(--c-blue-soft); } .c1 { --cc: var(--c-orange); --cs: var(--c-orange-soft); } .c2 { --cc: var(--c-green); --cs: var(--c-green-soft); } .c3 { --cc: var(--c-violet); --cs: var(--c-violet-soft); } .c4 { --cc: var(--c-red); --cs: var(--c-red-soft); }
.lg { border-color: var(--cc); background: var(--cs); }
.cat.on { border-color: var(--cc); background: var(--cs); font-weight: 600; box-shadow: inset 0 0 0 1px var(--cc); }
.order { list-style: none; padding: 0; display: grid; gap: 6px; margin: 10px 0; }
.order li { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--alt); }
.order li.good { border-color: var(--c-green); background: var(--c-green-soft); }
.order li.bad { border-color: var(--c-red); background: var(--c-red-soft); }
.ord-n { font-weight: 600; color: var(--muted); width: 20px; }
.ord-t { flex: 1; }
.ord-b { display: flex; gap: 4px; }

/* ── tuiles et statistiques */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.tile { text-align: left; cursor: pointer; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.tile:hover { border-color: var(--accent); }
.tile-h { font-weight: 600; font-size: 1.05em; }
.tile-d { font-size: .9em; color: var(--muted); flex: 1; }
.bar { height: 6px; background: var(--alt); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.bar.big { height: 10px; margin-bottom: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { background: var(--view); border: 1px solid var(--border); border-radius: 5px; padding: 12px; text-align: center; }
.stat-n { font-size: 1.5em; font-weight: 600; color: var(--accent-ink); }
.plan { list-style: none; padding: 0; margin: 0; }
.plan li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); }
.plan li:last-child { border-bottom: 0; }
.plan label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
.plan label input { margin-top: 5px; }
.plan li.done span { color: var(--muted); text-decoration: line-through; }
.how { padding-left: 20px; } .how li { margin: 4px 0; }
.mini { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; background: var(--alt); display: flex; flex-direction: column; gap: 4px; font-size: .93em; }

/* ── cartes mémoire */
.boxes { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85em; }
.bx { padding: 2px 9px; border-radius: 3px; border: 1px solid; }
.b1 { border-color: var(--c-red); background: var(--c-red-soft); } .b2 { border-color: var(--c-orange); background: var(--c-orange-soft); } .b3 { border-color: var(--c-green); background: var(--c-green-soft); }
.seg-toggle { display: flex; gap: 4px; }
.flash-wrap { margin-top: 14px; }
.flash { width: 100%; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center; padding: 24px; border: 1px solid var(--border); border-radius: 6px; background: var(--view); cursor: pointer; box-shadow: var(--shadow); }
.flash:hover { border-color: var(--accent); }
.flash.flipped { border-color: var(--accent); background: var(--alt); }
.flash-theme { font-size: .8em; color: var(--muted); }
.flash-r { font-size: 1.45em; font-weight: 600; }
.flash-small { font-size: .95em; color: var(--muted); font-weight: 600; }
.flash-v { font-size: 1.12em; max-width: 620px; }
.flash-ex { font-style: italic; color: var(--muted); }
.review { padding: 8px 0; border-bottom: 1px solid var(--border); }
.good-t { color: var(--c-green); font-weight: 600; }

/* ── mobile */
.scrim { display: none; }
@media (max-width: 820px) {
  .only-mobile { display: inline-flex; }
  .sidebar { position: fixed; top: 46px; bottom: 0; left: 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 8px rgba(0,0,0,.15); }
  .sidebar.open { transform: none; }
  .scrim { display: block; position: fixed; inset: 46px 0 0 0; background: rgba(0,0,0,.25); z-index: 10; }
  .page { padding: 14px 12px 50px; }
  .card { padding: 14px; }
  .app-title .muted { display: none; }
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; }
  .tab { padding: 7px 9px; font-size: .86em; white-space: nowrap; }
  .plan li { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

on</b> sur une \u0153uvre et son parcours","/20"],["<b>Oral</b>, partie 1 (12 min)","Lecture du texte (2 pts) + <b>explication lin\xE9aire</b> (8 pts) + question de grammaire (2 pts)","/12"],["<b>Oral</b>, partie 2 (8 min)","Pr\xE9sentation argument\xE9e de l\u2019<b>\u0153uvre choisie</b> (lecture cursive), puis entretien","/8"]]},{t:"p",html:"L\u2019oral commence par 30 minutes de pr\xE9paration. La partie 2 s\u2019appuie sur une lecture cursive : cette ann\xE9e, par exemple, <i>Le Baron perch\xE9</i> d\u2019Italo Calvino ou <i>Le Joueur d\u2019\xE9checs</i> de Stefan Zweig."},{t:"retenir",html:"<b>Analyse (explication) lin\xE9aire</b> = oral, on suit le texte dans l\u2019ordre. <b>Commentaire</b> = \xE9crit, on regroupe les remarques par axes. <b>Dissertation</b> = \xE9crit, on argumente sur une question."}]},{titre:"Le Baron perch\xE9 : relier les quatre parcours",blocs:[{t:"p",html:"Dans <i>Le Baron perch\xE9</i> (Italo Calvino), le jeune C\xF4me refuse un plat d\u2019escargots et se r\xE9fugie dans les arbres, o\xF9 il passera toute sa vie. Le roman permet de <b>faire du lien</b> entre les quatre parcours :"},{t:"keys",items:[["\xC9mancipations cr\xE9atrices","C\xF4me s\u2019\xE9mancipe des r\xE8gles de sa famille de fa\xE7on tr\xE8s cr\xE9ative : il vit dans les arbres."],["Mensonge et com\xE9die","Il ment spontan\xE9ment \xE0 la petite fille : \xAB Je suis un brigand, un terrible brigand \xBB. Il joue la com\xE9die comme l\u2019autre enfant."],["Le go\xFBt de la science","Il veut \xAB conna\xEEtre \xBB et explorer son royaume \xAB arbre apr\xE8s arbre, branche apr\xE8s branche \xBB."],["D\xE9voiler les rouages de la soci\xE9t\xE9","Son regard d\u2019en haut montre le fonctionnement de sa famille noble et de la soci\xE9t\xE9."]]},{t:"retenir",html:"<b>La reliance</b> (Edgar Morin, sociologue) : relier les id\xE9es entre elles pour penser une soci\xE9t\xE9 complexe. C\u2019est ce que demande la dissertation : relier l\u2019\u0153uvre, le parcours, les textes \xE9tudi\xE9s et sa culture personnelle."}]}]},{id:"rimbaud",titre:"Rimbaud et les Cahiers de Douai",court:"Rimbaud",pages:"p. 27-28 (Fiche 1)",segments:[{titre:"La vie de Rimbaud en rep\xE8res",blocs:[{t:"diagram",name:"frise-rimbaud"},{t:"keys",items:[["1854","Naissance \xE0 <b>Charleville</b> (Ardennes), ville industrielle (manufacture d\u2019armes, tannerie), proche de la Belgique, travers\xE9e par la Meuse."],["1852-1870","Rimbaud vit sa jeunesse sous le <b>Second Empire</b> de <b>Napol\xE9on III</b> (Louis-Napol\xE9on Bonaparte)."],["Juillet 1870","La France entre en <b>guerre contre la Prusse</b>."],["Ao\xFBt-sept. 1870","Fugue \xE0 16 ans : Paris, puis Charleroi. Il est h\xE9berg\xE9 \xE0 <b>Douai</b> par son professeur <b>Georges Izambard</b>. Il confie ses po\xE8mes \xE0 <b>Paul Demeny</b>, po\xE8te et \xE9diteur de Douai : ce sont les <i>Cahiers de Douai</i>."],["2 septembre 1870","D\xE9faite de <b>Sedan</b> (pr\xE8s de Charleville) : l\u2019empereur capitule et est fait prisonnier."],["4 septembre 1870","Proclamation de la <b>IIIe R\xE9publique</b> (jusqu\u2019en 1940)."],["1871","Lettres du \xAB <b>voyant</b> \xBB."],["1873 et 1875","<i>Une saison en enfer</i> puis <i>Illuminations</i>. Ensuite, il n\u2019\xE9crit plus de po\xE9sie et voyage, notamment en Afrique."],["1891","Mort \xE0 Marseille, apr\xE8s une amputation. Verlaine l\u2019appelait \xAB <b>l\u2019homme aux semelles de vent</b> \xBB."]]},{t:"retenir",html:"Les <i>Cahiers de Douai</i> sont l\u2019\u0153uvre d\u2019un po\xE8te de <b>16 ans</b>, \xE9crite en <b>1870</b>, pendant la <b>guerre franco-prussienne</b> et la chute du Second Empire."}]},{titre:"Ce que Rimbaud fait partager",blocs:[{t:"p",html:"Selon la fiche 1, l\u2019enfant prodige fait partager :"},{t:"list",items:["le <b>bonheur sensuel</b> et les <b>premiers \xE9mois sentimentaux</b> (<i>Sensation</i>, <i>Roman</i>, <i>Ma boh\xE8me</i>) ;","la <b>puissance de son imagination visionnaire</b> ;","son <b>horreur pour la vie mesquine</b> et son <b>ironie cruelle pour la bourgeoisie</b> (<i>\xC0 la musique</i>) ;","sa <b>haine du conformisme social</b> et son <b>m\xE9pris pour l\u2019empereur</b> (<i>Rages de C\xE9sars</i>) ;","sa piti\xE9 pour les <b>victimes de la guerre</b> (<i>Le Dormeur du val</i>, <i>Le Mal</i>) et la <b>d\xE9tresse de cinq petits pauvres</b> (<i>Les Effar\xE9s</i>) ;","sa r\xE9volte contre la <b>religion chr\xE9tienne</b> (<i>Le Mal</i>)."]},{t:"retenir",html:"Comme Baudelaire, Rimbaud veut d\xE9couvrir, <b>au-del\xE0 des apparences</b>, le sens profond du myst\xE8re universel, et r\xEAve d\u2019un <b>langage nouveau</b> pour le dire."}]},{titre:"Les 22 po\xE8mes du recueil",blocs:[{t:"p",html:"Tableau du dossier Classicolyc\xE9e, compl\xE9t\xE9 par les trois sonnets d\u2019octobre 1870 demand\xE9s par le professeur. Filtre par th\xE8me pour mieux m\xE9moriser (on retient mieux des \xE9l\xE9ments regroup\xE9s)."},{t:"poemes"},{t:"retenir",html:"Le sonnet d\u2019alexandrins domine, surtout en octobre 1870. Le recueil m\xEAle <b>l\xE9g\xE8ret\xE9</b> (amour, fugue) et <b>sujets graves</b> (guerre, mis\xE8re, politique)."}]}]},{id:"histoire",titre:"Histoire litt\xE9raire du XIXe si\xE8cle",court:"Histoire litt\xE9raire",pages:"p. 13-23, 28-29",segments:[{titre:"Les quatre p\xE9riodes litt\xE9raires",blocs:[{t:"diagram",name:"frise-periodes"},{t:"keys",items:[["Romantisme (1800-1850)","Lib\xE8re la po\xE9sie pour exprimer des <b>\xE9tats d\u2019\xE2me</b> : souffrances, angoisses, extases, confidences sentimentales. Le po\xE8te se croit investi d\u2019une <b>mission sociale</b> ; pour Hugo, il est un \xAB <b>mage</b> \xBB qui guide le peuple.","Lamartine, Hugo, Vigny, Musset, Nerval"],["R\xE9alisme (1850-1890)","R\xE9action <b>contre les tendances subjectivistes</b> du romantisme, au nom de l\u2019Art ou de la Science ; volont\xE9 d\u2019<b>objectivit\xE9</b> (courant positiviste).","Zola et l\u2019\xE9cole \xAB naturaliste \xBB y ajoutent des pr\xE9occupations scientifiques"],["Parnasse (1866-1876)","Le po\xE8te doit \xEAtre <b>impassible</b> ; il soigne une <b>\xE9vocation plastique du monde ext\xE9rieur</b> et vise un id\xE9al purement <b>esth\xE9tique</b> ; observation minutieuse de la r\xE9alit\xE9.","Gautier, Banville, Leconte de Lisle"],["Symbolisme (1870-1890)","Baudelaire, tout en gardant la rigueur du Parnasse, d\xE9crit son <b>drame int\xE9rieur</b>. Rimbaud, Verlaine puis les symbolistes sondent les <b>profondeurs de leur conscience</b> et en sugg\xE8rent le <b>myst\xE8re</b> par des proc\xE9d\xE9s hardis.","Baudelaire, Rimbaud, Verlaine"]]},{t:"retenir",html:"Un mot-cl\xE9 par p\xE9riode : romantisme = <b>\xE9tats d\u2019\xE2me</b> ; r\xE9alisme = <b>objectivit\xE9</b> ; Parnasse = <b>impassibilit\xE9 / beaut\xE9</b> ; symbolisme = <b>myst\xE8re / conscience</b>."}]},{titre:"Baudelaire et Rimbaud selon Georges Poulet",blocs:[{t:"p",html:"Dans <i>La Po\xE9sie \xE9clat\xE9e : Baudelaire-Rimbaud</i> (1980), Georges Poulet oppose deux mondes int\xE9rieurs \xAB incompatibles \xBB, sans communication."},{t:"table",head:["","Baudelaire","Rimbaud"],rows:[["Monde","de la <b>d\xE9termination</b>, de la <b>fatalit\xE9</b>","de la <b>libert\xE9</b> et de la <b>nouveaut\xE9</b>"],["Rapport au temps","pr\xE9d\xE9termin\xE9 par le p\xE9ch\xE9 originel, <b>hant\xE9 par le pass\xE9 et le remords</b>, pens\xE9e r\xE9trospective","s\u2019<b>\xE9veille</b> chaque fois \xE0 une existence nouvelle, dispens\xE9 de tout remords"],["Exception","des \xAB <b>gr\xE2ces</b> \xBB, secours venus d\u2019ailleurs (<i>\xC0 une passante</i> : \xAB m\u2019a fait soudainement rena\xEEtre \xBB), des sursauts de volont\xE9 \u2192 un peu d\u2019<b>esp\xE9rance</b>","il devient <b>prisonnier de ses propres inventions</b>, \xAB adolescent ivre de sa propre libert\xE9 \xBB"],["Images cl\xE9s","le Temps, l\u2019Ennemi, l\u2019orage (<i>L\u2019Ennemi</i>)","le <b>r\xE9veil</b>, l\u2019<b>aube</b>, le <b>cri</b>, le <b>chant du coq</b>"]]},{t:"p",html:"Le r\xE9veil rimbaldien est une \xAB prise de conscience imm\xE9diate, foudroyante parfois, mais rigoureusement <b>\xE9ph\xE9m\xE8re</b> \xBB. Premier exemple : <i>Les \xC9trennes des orphelins</i> (1869), o\xF9 des orphelins ont un \xAB r\xE9veil r\xEAv\xE9 \xBB. M\xEAme opposition ailleurs : Racine / Corneille, Balzac / Stendhal, <b>naturalistes</b> (causalit\xE9) / <b>symbolistes</b> (libert\xE9 cr\xE9atrice)."},{t:"retenir",html:"Baudelaire = <b>fatalit\xE9</b> ; Rimbaud = <b>libert\xE9 cr\xE9atrice</b>. Passer de l\u2019un \xE0 l\u2019autre, c\u2019est vivre un \xAB <b>\xE9clatement de la po\xE9sie</b> \xBB."}]},{titre:"Charles Cros, un \xE9cho de Rimbaud",blocs:[{t:"keys",items:[["Un po\xE8me antipo\xE9tique","Faire d\u2019un hareng saur (poisson s\xE9ch\xE9 et sal\xE9) le h\xE9ros d\u2019un po\xE8me est une provocation, loin des sujets nobles (amour, mort, nature)."],["Une libert\xE9 totale","Po\xE8me minimaliste fond\xE9 sur la r\xE9p\xE9tition et le refrain : naissance d\u2019une po\xE9sie fantaisiste."],["Amiti\xE9 et influence","Cros et Rimbaud se connaissaient : Cros h\xE9berge Rimbaud \xE0 Paris en septembre 1871. M\xEAme volont\xE9 de bousculer la bourgeoisie et la litt\xE9rature."],["Refus du s\xE9rieux","\xAB On n\u2019est pas s\xE9rieux quand on a dix-sept ans \xBB (<i>Roman</i>) \u2194 \xAB Pour mettre en fureur les gens graves \xBB : <b>humour absurde</b> et d\xE9rision."]]},{t:"retenir",html:"Exercer un <b>doute raisonnable</b> : l\u2019IA peut aider \xE0 r\xE9viser, mais on v\xE9rifie toujours avec le cours de son professeur (cours 9)."}]}]},{id:"mots",titre:"Les mots \xE0 conna\xEEtre",court:"Mots \xE0 conna\xEEtre",pages:"p. 3-8, 29-31 (Fiche 2)",segments:[{titre:"\xC9manciper, cr\xE9er : l\u2019origine des mots du parcours",blocs:[{t:"diagram",name:"etymo"},{t:"keys",items:[["\xC9manciper (v. 1320)","Du latin juridique <i>emancipare</i>, \xAB <b>lib\xE9rer de l\u2019autorit\xE9 paternelle</b> \xBB : <i>ex-</i> (hors de) + <i>mancipare</i> (vendre), de <i>mancipium</i> \xAB droit de propri\xE9t\xE9 \xBB, de <i>manus</i> \xAB <b>main</b> \xBB + <i>capere</i> \xAB <b>prendre</b> \xBB. Racine indo-europ\xE9enne *kap- \xAB saisir, poss\xE9der \xBB (capturer, chasser)."],["\xC9mancipation","Du latin <i>emancipatio</i>. Terme juridique, puis (1796) action de <b>se d\xE9gager d\u2019une autorit\xE9, d\u2019une domination</b> (1808 : \xE9mancipation des esclaves). Au XIXe si\xE8cle : les <b>femmes</b> qui cherchent une libert\xE9 \xE9gale \xE0 celle de l\u2019homme."],["Cr\xE9er (v. 1155)","D\u2019abord <i>crier</i> (v. 1119), du latin <i>creare</i>, terme de la langue <b>rustique</b> de la m\xEAme racine que <i>crescere</i> (<b>cro\xEEtre</b>) : faire pousser, faire grandir, produire. Puis \xAB <b>faire na\xEEtre</b> \xBB (au propre et au figur\xE9)."],["Cr\xE9ateur, cr\xE9atrice","Du latin <i>creator</i>, \xAB celui qui cr\xE9e \xBB, appliqu\xE9 \xE0 <b>Dieu</b> en latin chr\xE9tien. Sens artistique d\u2019\xAB auteur d\u2019une chose nouvelle \xBB en <b>1761</b> ; \xAB <b>g\xE9nie cr\xE9ateur</b> \xBB en 1762."]]},{t:"retenir",html:"S\u2019\xE9manciper, c\u2019est litt\xE9ralement <b>sortir de la main</b> qui vous poss\xE8de. Cr\xE9er, c\u2019est <b>faire pousser, faire na\xEEtre</b>. \xAB \xC9mancipations cr\xE9atrices \xBB = se lib\xE9rer en faisant na\xEEtre du nouveau."}]},{titre:"Le vocabulaire d\u2019analyse",blocs:[{t:"keys",items:[["Explicite / implicite","Explicite : dit clairement. Implicite : sugg\xE9r\xE9, \xE0 deviner (sous-entendu).","Le titre \xAB Le Dormeur \xBB dit le sommeil ; la mort reste implicite jusqu\u2019au dernier vers."],["Concret / abstrait","Concret : perceptible par les sens (objets, corps). Abstrait : id\xE9e, notion.","\xAB haillons \xBB, \xAB pain \xBB (concret) \u2192 \xAB mis\xE8re \xBB, \xAB libert\xE9 \xBB (abstrait)"],["Objectif / subjectif","Objectif : neutre, sans opinion. Subjectif : marqu\xE9 par la sensibilit\xE9, le jugement de celui qui parle.","\xAB Oh ! l\xE0 ! l\xE0 ! que d\u2019amours splendides j\u2019ai r\xEAv\xE9es ! \xBB est subjectif."],["Association d\u2019id\xE9es / rapprochement","Relier deux id\xE9es, deux textes, deux images qui se r\xE9pondent.","Rapprocher <i>Roman</i> et <i>Le Hareng saur</i> : le refus du s\xE9rieux."],["Champ lexical","Ensemble de mots qui renvoient \xE0 un <b>m\xEAme th\xE8me</b>.","Nature dans <i>Le Dormeur du val</i> : verdure, rivi\xE8re, herbes, val, cresson, gla\xEFeuls."],["Famille de mots","Mots form\xE9s sur un <b>m\xEAme radical</b>.","cr\xE9er, cr\xE9ation, cr\xE9ateur, cr\xE9atif, cr\xE9ativit\xE9"]]},{t:"retenir",html:"Analyser, c\u2019est passer <b>du concret \xE0 l\u2019abstrait</b> et <b>de l\u2019explicite \xE0 l\u2019implicite</b>."}]},{titre:"Bachelard et les cinq sens",blocs:[{t:"diagram",name:"elements"},{t:"p",html:"Le philosophe <b>Gaston Bachelard</b> classe les images po\xE9tiques selon les <b>quatre \xE9l\xE9ments</b> : po\xE9sie de l\u2019<b>eau</b>, de l\u2019<b>air</b>, de la <b>terre</b>, du <b>feu</b>. Pour analyser un texte, on observe aussi les <b>cinq sens</b> : vue, ou\xEFe, odorat, toucher, go\xFBt."},{t:"p",html:"Exemple : <i>Le Dormeur du val</i> m\xEAle l\u2019eau (rivi\xE8re, \xAB la lumi\xE8re pleut \xBB), l\u2019air (\xAB la nue \xBB), la terre (herbe, val) et le feu (soleil, \xAB deux trous rouges \xBB). Les sens y sont tous sollicit\xE9s\u2026 sauf chez le soldat : \xAB Les parfums ne font pas frissonner sa narine \xBB."},{t:"retenir",html:"Pour trouver des id\xE9es sur un po\xE8me : <b>4 \xE9l\xE9ments</b> + <b>5 sens</b>."}]}]},{id:"versif",titre:"La versification",court:"Versification",pages:"p. 9, 31",segments:[{titre:"Compter les syllabes (la m\xE9trique)",blocs:[{t:"keys",items:[["Le \xAB e \xBB muet","Il <b>compte</b> devant une <b>consonne</b>. Il <b>ne compte pas</b> devant une <b>voyelle</b> (\xE9lision) ni en <b>fin de vers</b>.","De la musiqu(e) avant tout(e) chos(e) (Verlaine)"],["Syn\xE9r\xE8se","Deux voyelles qui se suivent se prononcent en <b>une seule syllabe</b>.","Mais fid\xE8le, mais <b>fier</b>, et m\xEAme un peu farouche (Racine)"],["Di\xE9r\xE8se","Deux voyelles qui se suivent se prononcent en <b>deux syllabes</b> (souvent pour insister).","Les sanglots longs / Des <b>vi-o</b>lons (Verlaine)"]]},{t:"p",html:'Exemple r\xE9solu : <span class="scan">C\u2019est<sup>1</sup> un<sup>2</sup> trou<sup>3</sup> de<sup>4</sup> ver<sup>5</sup>du<sup>6</sup>(re) // o\xF9<sup>7</sup> chan<sup>8</sup>t(e) u<sup>9</sup>ne<sup>10</sup> ri<sup>11</sup>vi\xE8re<sup>12</sup></span> = 12 syllabes, un <b>alexandrin</b>. Le \xAB e \xBB de <i>verdure</i> et de <i>chante</i> s\u2019\xE9lide devant une voyelle ; celui de <i>une</i> compte devant le <i>r</i> ; celui de <i>rivi\xE8re</i> est en fin de vers.'},{t:"retenir",html:"e muet + consonne = <b>je compte</b>. e muet + voyelle ou fin de vers = <b>je ne compte pas</b>."}]},{titre:"Les vers et les strophes",blocs:[{t:"keys",items:[["Alexandrin","<b>12</b> syllabes, vers noble, utilis\xE9 dans la trag\xE9die.","\xD4 noirs \xE9v\xE9nements, vous fuyez dans la nuit ! (Hugo)"],["D\xE9casyllabe","<b>10</b> syllabes, souvent dans la po\xE9sie \xE9pique et lyrique.","Le mur fl\xE9chit sous le noir bataillon (Hugo)"],["Octosyllabe","<b>8</b> syllabes, rythme rapide.","J\u2019erre \xE0 travers mon beau Paris (Apollinaire) ; <i>Les Effar\xE9s</i>"],["Vers libre","Longueur <b>vari\xE9e</b>, sans rime obligatoire ; po\xE9sie moderne.","Femme nue, femme noire\u2026 (Senghor)"],["Strophes","<b>Distique</b> (2 vers), <b>tercet</b> (3), <b>quatrain</b> (4), quintil (5), sizain (6)."],["Sonnet","Forme fixe : <b>deux quatrains + deux tercets</b>, souvent en alexandrins ; se termine par une <b>pointe</b> (ou chute) qui surprend le lecteur. Forme de la Renaissance (Ronsard).","<i>Le Dormeur du val</i>, <i>Ma boh\xE8me</i>"]]},{t:"diagram",name:"sonnet"},{t:"retenir",html:"Alexandrin <b>12</b>, d\xE9casyllabe <b>10</b>, octosyllabe <b>8</b>. Sonnet = <b>4 + 4 + 3 + 3</b> vers et une pointe finale."}]},{titre:"Les rimes et les sonorit\xE9s",blocs:[{t:"keys",items:[["Rimes suivies","<b>AABB</b>","routes / gouttes (<i>Ma boh\xE8me</i>)"],["Rimes crois\xE9es","<b>ABAB</b>","rivi\xE8re / haillons / fi\xE8re / rayons (<i>Le Dormeur du val</i>)"],["Rimes embrass\xE9es","<b>ABBA</b>","crev\xE9es / id\xE9al / f\xE9al / r\xEAv\xE9es (<i>Ma boh\xE8me</i>)"],["Rime pauvre","<b>un</b> son identique","cohue / hue [y] ; rond / blond [\u0254\u0303]"],["Rime suffisante","<b>deux</b> sons identiques","reine / peine [\u025Bn]"],["Rime riche","<b>trois</b> sons identiques ou plus","Bonaparte / carte [a\u0281t]"],["Rime f\xE9minine / masculine","F\xE9minine : se termine par un <b>e muet</b> (rivi\xE8re). Masculine : sans e muet (haillons)."],["Allit\xE9ration","Retour d\u2019un m\xEAme son <b>consonne</b> \xE0 intervalles rapproch\xE9s.","Les <b>p</b>ar<b>f</b>ums ne <b>f</b>ont pas <b>f</b>rissonner sa narine (Rimbaud)"],["Assonance","R\xE9p\xE9tition d\u2019un m\xEAme son <b>voyelle</b>.","Je fais souvent ce r\xEAve \xE9trange et p\xE9n\xE9trant (Verlaine) [\u0251\u0303]"]]},{t:"retenir",html:"On compte les <b>sons</b> (ce qu\u2019on entend), pas les lettres. Allit\xE9ration = <b>consonnes</b> ; assonance = <b>voyelles</b>."}]},{titre:"Le rythme",blocs:[{t:"keys",items:[["Coupe (/)","S\xE9pare les <b>groupes rythmiques</b> d\u2019un vers.","Ce soir, / l\u2019odeur du sang // demain, / l\u2019odeur des morts (Hugo)"],["C\xE9sure (//) et h\xE9mistiches","Coupe principale, souvent au <b>milieu</b> de l\u2019alexandrin (apr\xE8s la 6e syllabe). Les deux moiti\xE9s sont les <b>h\xE9mistiches</b>.","Je serai / sous la terre // et fant\xF4 / me sans os (Ronsard)"],["Accent tonique","Sur la <b>derni\xE8re syllabe</b> de chaque groupe rythmique (ou l\u2019avant-derni\xE8re si la derni\xE8re est un e muet)."],["Enjambement","La phrase <b>se prolonge</b> sur le vers suivant, au-del\xE0 de la fin du vers.","Elle porta chez lui ses p\xE9nates, un jour / Qu\u2019il \xE9tait all\xE9 faire \xE0 l\u2019Aurore sa cour (La Fontaine)"],["Rejet","Un <b>\xE9l\xE9ment court</b> de la phrase est <b>rejet\xE9 au d\xE9but du vers suivant</b> : il est mis en valeur.","Accrochant follement aux herbes des haillons / <b>D\u2019argent</b> ; (Rimbaud)"],["Contre-rejet","La phrase <b>commence \xE0 la fin d\u2019un vers</b> et se poursuit dans le vers suivant.","On d\xE9jeune en lisant son journal ; <b>tout le jour</b> / On m\xEAle \xE0 sa pens\xE9e\u2026 (Hugo)"]]},{t:"retenir",html:"Toujours relier <b>la forme</b> et <b>le sens</b> : un rejet, une c\xE9sure, une rime n\u2019ont d\u2019int\xE9r\xEAt que par l\u2019<b>effet</b> qu\u2019ils produisent."}]}]},{id:"figures",titre:"Les figures de style",court:"Figures de style",pages:"p. 30",segments:[{titre:"Figures d\u2019analogie (rapprocher)",blocs:[{t:"keys",items:[["Comparaison","Associe deux r\xE9alit\xE9s gr\xE2ce \xE0 un <b>outil de comparaison</b> (comme, tel, semblable \xE0\u2026). <br>Compar\xE9 (ce dont on parle) \xB7 comparant (l\u2019image) \xB7 outil \xB7 motif (point commun).","La fum\xE9e (compar\xE9) comme (outil) un serpent (comparant) \u2192 forme sinueuse (motif)"],["M\xE9taphore","Associe deux r\xE9alit\xE9s <b>sans outil</b> de comparaison.","Un gros serpent de fum\xE9e noire (Maupassant)"],["M\xE9taphore fil\xE9e","M\xE9taphore qui se <b>poursuit</b> sur plusieurs lignes ou vers.","Paris est un v\xE9ritable oc\xE9an\u2026 la sonde\u2026 explorateurs\u2026 plongeurs (Balzac)"],["Personnification","Attribue des <b>caract\xE9ristiques humaines</b> \xE0 un \xE9l\xE9ment non humain.","Le Pot de fer proposa / Au Pot de terre un voyage (La Fontaine)"],["All\xE9gorie","Repr\xE9sente de fa\xE7on <b>concr\xE8te une id\xE9e abstraite</b> (souvent avec une majuscule).","Les Membres et l\u2019Estomac : l\u2019estomac = le roi"],["M\xE9taphore lexicalis\xE9e","Entr\xE9e dans la langue courante, plus vue comme une figure.","Les pieds d\u2019une chaise"]]},{t:"retenir",html:"Comparaison = <b>avec</b> outil ; m\xE9taphore = <b>sans</b> outil."}]},{titre:"Figures de substitution (remplacer)",blocs:[{t:"keys",items:[["P\xE9riphrase","Remplace un mot par une <b>expression qui le d\xE9crit</b>. \xC9vite une r\xE9p\xE9tition, informe ou fait sourire.","La capitale de la France (Paris) ; ces rois de l\u2019azur (les albatros)"],["M\xE9tonymie","Remplace un \xE9l\xE9ment par un autre ayant un <b>lien logique</b> : mati\xE8re / objet, auteur / \u0153uvre, lieu / personnes. Au sens litt\xE9ral, la phrase est absurde.","J\u2019ai lu un Zola ; L\u2019\xC9lys\xE9e s\u2019est exprim\xE9 ; un verre (un objet en verre)"],["Synecdoque","Remplace par un rapport d\u2019<b>inclusion</b> : la partie pour le tout. Au sens litt\xE9ral, la phrase est incompl\xE8te mais pas absurde.","\xAB Le pain \xBB pour la nourriture ; une voile pour un bateau"]]},{t:"retenir",html:"M\xE9tonymie = <b>lien logique</b> (absurde au sens litt\xE9ral). Synecdoque = <b>partie pour le tout</b>."}]},{titre:"Opposition, amplification, att\xE9nuation",blocs:[{t:"keys",items:[["Antith\xE8se","Rapproche deux <b>id\xE9es oppos\xE9es</b>.","Je me br\xFBle et me noie (Louise Lab\xE9) ; Un \xE9clair\u2026 puis la nuit !"],["Oxymore","Deux termes oppos\xE9s <b>dans un m\xEAme groupe de mots</b>.","Cette obscure clart\xE9 (Corneille)"],["Paradoxe","Contradiction dans une phrase ou avec l\u2019opinion g\xE9n\xE9rale.","Le superflu, chose tr\xE8s n\xE9cessaire (Voltaire)"],["Hyperbole","<b>Exag\xE9ration</b>.","Je te l\u2019ai dit mille fois ; je meurs d\u2019impatience"],["Gradation","\xC9num\xE9ration en ordre <b>croissant</b> ou d\xE9croissant.","Va, cours, vole (Corneille)"],["\xC9num\xE9ration / accumulation","Liste d\u2019\xE9l\xE9ments : effet d\u2019insistance.","Adieu veau, vache, cochon, couv\xE9e (La Fontaine)"],["Anaphore","R\xE9p\xE9tition <b>en d\xE9but</b> de vers, de phrase.","Je lutterai donc jusqu\u2019\xE0\u2026 je lutterai jusqu\u2019\xE0\u2026 (Dreyfus)"],["Euph\xE9misme","<b>Adoucit</b> une r\xE9alit\xE9 d\xE9sagr\xE9able ou choquante.","Elle a v\xE9cu (pour \xAB elle est morte \xBB)"],["Litote","Dit <b>moins pour sugg\xE9rer plus</b>, souvent avec une n\xE9gation.","Va, je ne te hais point (pour \xAB je t\u2019aime \xBB) (Corneille)"]]},{t:"retenir",html:"Antith\xE8se = id\xE9es oppos\xE9es dans la phrase ; oxymore = oppos\xE9s <b>coll\xE9s</b>. Euph\xE9misme = <b>adoucir</b> ; litote = dire moins pour <b>dire plus</b>."}]},{titre:"Sonorit\xE9s, construction, implicite",blocs:[{t:"keys",items:[["Assonance","R\xE9p\xE9tition d\u2019un son <b>voyelle</b>.","L\xE8ve, J\xE9rusalem, l\xE8ve ta t\xEAte alti\xE8re (Racine)"],["Allit\xE9ration","R\xE9p\xE9tition d\u2019un son <b>consonne</b>.","Sa robe de pourpre au soleil (Ronsard)"],["Paronomase","Rapprochement de mots aux <b>sonorit\xE9s proches</b>.","Qui se ressemble s\u2019assemble"],["Parall\xE9lisme","Deux constructions <b>identiques</b> (AB / AB) : impression d\u2019\xE9quivalence.","Les larmes sont pour le c\u0153ur ce que l\u2019eau est pour les poissons"],["Chiasme","Construction <b>en miroir</b> (AB / BA) : contraste ou sym\xE9trie.","Il faut manger pour vivre et non pas vivre pour manger (Moli\xE8re)"],["Question rh\xE9torique","Fausse question dont la r\xE9ponse est \xE9vidente (effet argumentatif) ou impossible (effet lyrique).","Pourquoi suis-je empereur ? (Racine)"],["Antiphrase","Dire le <b>contraire</b> de ce qu\u2019on pense, souvent ironique.","La belle chose de vouloir se piquer d\u2019un faux honneur ! (Moli\xE8re)"],["Pr\xE9t\xE9rition","Dire quelque chose en <b>pr\xE9tendant ne pas le dire</b>.","Nous n\u2019essaierons pas d\u2019en donner au lecteur une id\xE9e\u2026 (Hugo)"]]},{t:"retenir",html:"Une figure ne vaut que par son <b>effet</b> sur le lecteur : <b>nommer</b> la figure, <b>citer</b>, puis <b>interpr\xE9ter</b>."}]}]},{id:"registres",titre:"Les registres",court:"Registres",pages:"p. 25",segments:[{titre:"Le registre comique et ses nuances",blocs:[{t:"keys",items:[["Satire","Critique <b>virulente ou moqueuse</b> d\u2019un ridicule, d\u2019un d\xE9faut, d\u2019un vice ; utilise l\u2019exag\xE9ration et peut aller jusqu\u2019\xE0 la caricature.","<i>\xC0 la musique</i>, <i>Rages de C\xE9sars</i>"],["Ironie","Faire entendre <b>le contraire de ce qu\u2019on dit</b> (antiphrases, litotes, exag\xE9rations) pour faire rire, critiquer ou pol\xE9miquer.","Le titre \xAB Le Dormeur \xBB pour un soldat mort"],["Parodie","<b>Imitation moqueuse</b> d\u2019un texte s\xE9rieux, d\u2019un style ; il faut conna\xEEtre l\u2019original.","<i>V\xE9nus anadyom\xE8ne</i> (mythe de V\xE9nus)"],["Humour","Souligne avec d\xE9tachement, sans m\xE9chancet\xE9, l\u2019\xE9cart entre l\u2019id\xE9al et le r\xE9el. Humour noir : \xE0 propos d\u2019une situation grave ou macabre.","\xAB On n\u2019est pas s\xE9rieux, quand on a dix-sept ans \xBB"],["Burlesque","Contraste entre le <b>style</b> et le <b>sujet</b> : sujet s\xE9rieux en style vulgaire, ou l\u2019inverse.","Un hareng saur trait\xE9 comme un h\xE9ros"]]},{t:"retenir",html:"Satire = <b>critiquer</b> ; ironie = <b>dire le contraire</b> ; parodie = <b>imiter</b> ; burlesque = <b>d\xE9calage style / sujet</b>."}]},{titre:"Les registres s\xE9rieux",blocs:[{t:"keys",items:[["R\xE9aliste","Rendre compte du r\xE9el <b>sans l\u2019embellir</b> (romans du XIXe, presse)."],["Didactique","<b>Enseigner</b> (moral, scientifique\u2026)."],["Oratoire","Discours qui veut <b>frapper les esprits</b>."],["\xC9pidictique","<b>\xC9loge ou bl\xE2me</b> : susciter admiration ou d\xE9go\xFBt."],["Pol\xE9mique","Argumentation <b>vive, agressive</b> : le d\xE9bat devient combat (<i>polemos</i> = guerre)."],["Lyrique","Expression des <b>sentiments</b>, \xE9motions intimes (nostalgie, regret, joie) ; vient de la <b>lyre</b>.","<i>Ma boh\xE8me</i>, <i>Sensation</i>"],["Path\xE9tique","\xC9motions intenses et tristes devant une situation inhumaine : <b>piti\xE9, compassion</b>.","<i>Les Effar\xE9s</i>"],["Tragique","Prise de conscience de <b>forces qui d\xE9passent l\u2019homme</b> (fatalit\xE9).","<i>L\u2019Ennemi</i> : \xAB Le Temps mange la vie \xBB"],["Dramatique","Maintient le lecteur dans l\u2019<b>attente</b> (suspense), succession de p\xE9rip\xE9ties."],["\xC9pique","Exploits de h\xE9ros hors du commun, sentiment collectif, merveilleux (\xE9pop\xE9e).","<i>Le Forgeron</i>"]]},{t:"retenir",html:"Lyrique = <b>je ressens</b> ; path\xE9tique = <b>j\u2019ai piti\xE9</b> ; tragique = <b>on ne peut pas \xE9chapper</b>."}]}]},{id:"phrases",titre:"Types et formes de phrases",court:"Types de phrases",pages:"p. 29",segments:[{titre:"Trois types, trois formes",blocs:[{t:"diagram",name:"phrases"},{t:"keys",items:[["Type d\xE9claratif","Donne une information.","Cette chimiste travaille dans un laboratoire."],["Type interrogatif","Pose une question.","Avez-vous termin\xE9 ? Est-ce que vous avez termin\xE9 ? Qui a parl\xE9 ?"],["Type imp\xE9ratif","Donne un ordre, un conseil.","Ouvrez la fen\xEAtre. Qu\u2019il sorte."],["Forme n\xE9gative","Se combine avec chaque type.","Elles ne mangent pas de fraises. N\u2019avez-vous pas termin\xE9 ? N\u2019ouvrez pas la fen\xEAtre."],["Forme passive","Le sujet subit l\u2019action (compl\xE9ment d\u2019agent introduit par \xAB par \xBB).","La sc\xE8ne a \xE9t\xE9 racont\xE9e par deux t\xE9moins."],["Forme exclamative","Exprime une \xE9motion, avec chaque type.","C\u2019est bon ! Avez-vous enfin termin\xE9 ! Ouvrez la fen\xEAtre !"]]},{t:"retenir",html:"Toute phrase a <b>un type</b> (d\xE9claratif, interrogatif, imp\xE9ratif) et peut prendre <b>une ou plusieurs formes</b> (n\xE9gative, passive, exclamative)."}]}]},{id:"methodes",titre:"Les m\xE9thodes du bac",court:"M\xE9thodes",pages:"p. 3-11 + bac",segments:[{titre:"Analyser un passage : proc\xE9d\xE9, citation, effet",blocs:[{t:"diagram",name:"pce"},{t:"p",html:'Toute analyse (orale ou \xE9crite) repose sur le m\xEAme geste : <span class="tag t-pro">nommer le proc\xE9d\xE9</span> <span class="tag t-cit">citer le texte</span> <span class="tag t-eff">interpr\xE9ter l\u2019effet</span>. Sans interpr\xE9tation, on fait de la <b>paraphrase</b> (on r\xE9p\xE8te le texte avec d\u2019autres mots).'},{t:"retenir",html:"Paraphrase : \xAB Le soldat dort dans l\u2019herbe. \xBB Analyse : \xAB Le pr\xE9sent et le verbe <i>dort</i>, r\xE9p\xE9t\xE9 trois fois, installent une <b>fausse paix</b> que la chute va d\xE9mentir. \xBB"}]},{titre:"L\u2019explication (analyse) lin\xE9aire, \xE0 l\u2019oral",blocs:[{t:"steps",items:[["Introduction (\u2248 1 min)","Situer : auteur, \u0153uvre, date, place du texte. Annoncer le <b>projet de lecture</b> (la question qui guide l\u2019explication) et les <b>mouvements</b> du texte."],["Lecture expressive (2 pts)","Respecter les e muets, les liaisons, le rythme et la ponctuation."],["Explication mouvement par mouvement (8 pts)","Suivre l\u2019ordre du texte. Pour chaque vers important : citer \u2192 nommer le proc\xE9d\xE9 \u2192 interpr\xE9ter \u2192 relier au projet de lecture."],["Conclusion","R\xE9pondre au projet de lecture, puis ouvrir (autre po\xE8me, autre \u0153uvre du parcours)."],["Question de grammaire (2 pts)","Ex. : identifier le type et la forme d\u2019une phrase, analyser une n\xE9gation."]]},{t:"retenir",html:"Lin\xE9aire = <b>dans l\u2019ordre du texte</b>, mouvement par mouvement, mais toujours <b>guid\xE9 par le projet de lecture</b>."}]},{titre:"Le commentaire, \xE0 l\u2019\xE9crit",blocs:[{t:"steps",items:[["Lire et observer","Relever les proc\xE9d\xE9s au brouillon (figures, champs lexicaux, versification, \xE9nonciation, registres, 4 \xE9l\xE9ments, 5 sens)."],["Regrouper","Classer les remarques en <b>2 ou 3 axes</b> (grandes id\xE9es), comme le tri de la temp\xEAte de cerveau."],["Probl\xE9matiser","Formuler la question \xE0 laquelle le commentaire r\xE9pond."],["Introduction","Amorce \u2192 pr\xE9sentation du texte \u2192 probl\xE9matique \u2192 annonce des axes."],["D\xE9veloppement","Chaque paragraphe : id\xE9e \u2192 citation \u2192 proc\xE9d\xE9 \u2192 interpr\xE9tation \u2192 bilan."],["Conclusion","Bilan des axes, r\xE9ponse \xE0 la probl\xE9matique, ouverture."]]},{t:"retenir",html:"Commentaire = <b>th\xE9matique</b> (par axes), alors que l\u2019explication lin\xE9aire suit l\u2019ordre du texte."}]},{titre:"La dissertation en 4 heures",blocs:[{t:"table",head:["\xC9tape","Ce qu\u2019on fait","Temps"],rows:[["1","<b>Temp\xEAte de cerveau</b> au brouillon : mots-cl\xE9s du sujet, \u0153uvres, citations, culture personnelle","10-15 min"],["2","<b>Tri, regroupement, cat\xE9gorisation</b> : une vraie ressource pour argumenter","10-15 min"],["3","<b>Plan d\xE9taill\xE9 en 3 parties</b> en probl\xE9matisant (au moins 1 citation par partie, l\u2019id\xE9al : 3)","20-30 min"],["4","<b>Introduction et conclusion</b> au brouillon","20 min"],["5","R\xE9diger l\u2019<b>introduction</b> sur la copie",""],["6","R\xE9diger les <b>3 parties</b> directement au propre (sauter une ligne, alin\xE9a)","2 h 30 pour 5-6-7"],["7","Recopier la <b>conclusion</b> en l\u2019am\xE9liorant",""],["8","<b>Se relire</b> attentivement","15 min minimum"]]},{t:"keys",items:[["Plan a : dialectique","<b>Pour / Contre / Un peu les deux</b> (th\xE8se, antith\xE8se, nuance). Pour un sujet qui invite \xE0 discuter une affirmation."],["Plan b : th\xE9matique","Th\xE8me 1 <b>le plus \xE9vident</b> / th\xE8me 2 <b>plus complexe</b> / th\xE8me 3 <b>tr\xE8s complexe</b>. Le lecteur doit voir la progression."]]},{t:"retenir",html:"Brouillon d\u2019abord (\u2248 1 h 15), copie ensuite (2 h 30), relecture \xE0 la fin (15 min). Passer <b>des mots aux id\xE9es</b> : du concret \xE0 l\u2019abstrait, de l\u2019explicite \xE0 l\u2019implicite."}]},{titre:"Le paragraphe argumentatif et les citations",blocs:[{t:"steps",items:[["Id\xE9e (argument)","Une phrase qui annonce l\u2019id\xE9e du paragraphe."],["Explication","D\xE9velopper l\u2019id\xE9e, la relier au sujet."],["Exemple + citation","Un texte pr\xE9cis, une citation int\xE9gr\xE9e avec la ligne ou le vers : \xAB restait sa r\xE9volte contre nous \xBB (l. 9)."],["Analyse","Montrer en quoi l\u2019exemple prouve l\u2019id\xE9e."],["Bilan / transition","Conclure le paragraphe et pr\xE9parer le suivant."]]},{t:"p",html:"Mod\xE8le du cours : \xAB Nous retrouvons le parcours associ\xE9 \xAB mensonge et com\xE9die \xBB dans cet extrait. Par exemple, quand C\xF4me discute avec la petite fille, il ment spontan\xE9ment en reprenant l\u2019id\xE9e de son interlocutrice : \xAB Je suis un brigand, un terrible brigand \xBB. C\xF4me joue la com\xE9die comme l\u2019autre enfant. \xBB"},{t:"retenir",html:"Se constituer un <b>carnet de citations</b> : sans citations apprises, pas de dissertation solide."}]}]}];var Jc=["Niveau 1 \xB7 Rep\xE9rer","Niveau 2 \xB7 Analyser","Niveau 3 \xB7 Interpr\xE9ter et produire"],gn=[{id:"versif",titre:"Versification",lecon:"versif",desc:"Compter les syllabes, identifier rimes et rythme, relier forme et sens.",worked:{titre:"Analyser la versification du premier quatrain du \xAB Dormeur du val \xBB",src:["C\u2019est un trou de verdure o\xF9 chante une rivi\xE8re","Accrochant follement aux herbes des haillons","D\u2019argent ; o\xF9 le soleil, de la montagne fi\xE8re,","Luit : c\u2019est un petit val qui mousse de rayons."],steps:[{h:"Compter les syllabes du vers 1",html:'<span class="scan">C\u2019est<sup>1</sup> un<sup>2</sup> trou<sup>3</sup> de<sup>4</sup> ver<sup>5</sup>du<sup>6</sup>(re) // o\xF9<sup>7</sup> chan<sup>8</sup>t(e) u<sup>9</sup>ne<sup>10</sup> ri<sup>11</sup>vi\xE8re<sup>12</sup></span>. Les e de <i>verdure</i> et <i>chante</i> s\u2019\xE9lident devant une voyelle ; le e de <i>une</i> compte (devant <i>r</i>) ; celui de <i>rivi\xE8re</i> est en fin de vers. \u2192 <b>12 syllabes : alexandrin</b>, c\xE9sure apr\xE8s la 6e syllabe.'},{h:"Rep\xE9rer la disposition des rimes",html:"riv<b>i\xE8re</b> (A) / hai<b>llons</b> (B) / f<b>i\xE8re</b> (A) / ra<b>yons</b> (B) \u2192 <b>ABAB : rimes crois\xE9es</b>. A est f\xE9minine (e muet), B est masculine : elles alternent."},{h:"Mesurer la richesse des rimes",html:"rivi\xE8re / fi\xE8re : sons [j] [\u025B] [\u0281] \u2192 <b>3 sons : rime riche</b>. haillons / rayons : [j] [\u0254\u0303] \u2192 <b>2 sons : rime suffisante</b>."},{h:"Observer le rythme",html:"La phrase d\xE9borde du vers 2 sur le vers 3 : \xAB des haillons / <b>D\u2019argent</b> \xBB \u2192 <b>rejet</b>. M\xEAme chose du vers 3 au vers 4 : \xAB le soleil, de la montagne fi\xE8re, / <b>Luit</b> \xBB \u2192 <b>rejet</b>."},{h:"Relier la forme et le sens",html:"Les deux rejets mettent en valeur deux mots de <b>lumi\xE8re</b> (\xAB D\u2019argent \xBB, \xAB Luit \xBB) : la nature semble <b>vivante et d\xE9bordante</b>, comme l\u2019eau qui d\xE9borde du vers. Ce cadre parfait et classique (sonnet, alexandrins, rimes riches) rend la chute finale encore plus brutale."}],retenir:"M\xE9thode en 5 temps : <b>compter</b> \u2192 <b>rimes</b> (disposition) \u2192 <b>richesse</b> \u2192 <b>rythme</b> \u2192 <b>effet sur le sens</b>."},levels:[[{id:"v1",type:"num",q:"Combien de syllabes compte ce vers des \xAB Effar\xE9s \xBB ?",src:"Noirs dans la neige et dans la brume,",a:8,simple:"8 syllabes : c\u2019est un octosyllabe.",detail:"Noirs<sup>1</sup> dans<sup>2</sup> la<sup>3</sup> nei<sup>4</sup>g(e) et<sup>5</sup> dans<sup>6</sup> la<sup>7</sup> bru<sup>8</sup>(me). Le e de <i>neige</i> s\u2019\xE9lide devant la voyelle de <i>et</i> ; le e de <i>brume</i> est en fin de vers : il ne compte pas."},{id:"v2",type:"num",q:"Combien de syllabes compte le premier vers de \xAB Ma boh\xE8me \xBB ?",src:"Je m\u2019en allais, les poings dans mes poches crev\xE9es ;",a:12,simple:"12 syllabes : un alexandrin.",detail:"Je<sup>1</sup> m\u2019en<sup>2</sup> al<sup>3</sup>lais<sup>4</sup> les<sup>5</sup> poings<sup>6</sup> // dans<sup>7</sup> mes<sup>8</sup> po<sup>9</sup>ches<sup>10</sup> cre<sup>11</sup>v\xE9es<sup>12</sup>. Le e de <i>poches</i> compte, car il est suivi d\u2019une consonne (<i>c</i> de crev\xE9es). La c\xE9sure tombe apr\xE8s <i>poings</i>."},{id:"v3",type:"num",q:"Combien de syllabes compte ce vers des \xAB Effar\xE9s \xBB ?",src:"Le Boulanger au gras sourire",a:8,simple:"8 syllabes (octosyllabe).",detail:"Le<sup>1</sup> Bou<sup>2</sup>lan<sup>3</sup>ger<sup>4</sup> au<sup>5</sup> gras<sup>6</sup> sou<sup>7</sup>ri<sup>8</sup>(re). Le e final de <i>sourire</i> ne compte pas (fin de vers). Les deux premiers vers de chaque tercet des \xAB Effar\xE9s \xBB sont des octosyllabes, le troisi\xE8me a 4 syllabes."},{id:"v4",type:"qcm",q:"Quelle est la disposition des rimes dans ce quatrain de \xAB Correspondances \xBB ?",src:["La Nature est un temple o\xF9 de vivants piliers","Laissent parfois sortir de confuses paroles ;","L\u2019homme y passe \xE0 travers des for\xEAts de symboles","Qui l\u2019observent avec des regards familiers."],opts:["Rimes embrass\xE9es (ABBA)","Rimes crois\xE9es (ABAB)","Rimes suivies (AABB)","Pas de rimes"],simple:"Embrass\xE9es : piliers (A) / paroles (B) / symboles (B) / familiers (A).",detail:"Les rimes en [b\u0254l] (paroles, symboles) sont \xAB embrass\xE9es \xBB par les rimes en [lje] (piliers, familiers) : ABBA."},{id:"v5",type:"qcm",q:"Quelle est la disposition des rimes dans ce quatrain de \xAB L\u2019Albatros \xBB ?",src:["Souvent, pour s\u2019amuser, les hommes d\u2019\xE9quipage","Prennent des albatros, vastes oiseaux des mers,","Qui suivent, indolents compagnons de voyage,","Le navire glissant sur les gouffres amers."],opts:["Rimes crois\xE9es (ABAB)","Rimes embrass\xE9es (ABBA)","Rimes suivies (AABB)","Rimes pauvres"],simple:"Crois\xE9es : \xE9quipage (A) / mers (B) / voyage (A) / amers (B).",detail:"\xAB Rimes pauvres \xBB ne d\xE9signe pas une disposition mais une richesse. Ici, \xE9quipage / voyage et mers / amers alternent : ABAB."},{id:"v6",type:"qcm",q:"Dans le premier tercet de \xAB Ma boh\xE8me \xBB, comment riment \xAB routes \xBB et \xAB gouttes \xBB, plac\xE9s l\u2019un \xE0 la suite de l\u2019autre ?",src:["Et je les \xE9coutais, assis au bord des routes,","Ces bons soirs de septembre o\xF9 je sentais des gouttes","De ros\xE9e \xE0 mon front, comme un vin de vigueur ;"],opts:["Rimes suivies (AA)","Rimes crois\xE9es","Rimes embrass\xE9es","Ce ne sont pas des rimes"],simple:"Rimes suivies : deux vers cons\xE9cutifs riment ensemble (AA).",detail:"Dans les tercets d\u2019un sonnet, on trouve souvent CCD EED : deux rimes suivies puis une rime qui r\xE9pond \xE0 l\u2019autre tercet (vigueur / c\u0153ur)."},{id:"v7",type:"num",q:"Combien de vers compte un sonnet ?",a:14,simple:"14 vers : 4 + 4 + 3 + 3.",detail:"Deux quatrains (4 vers) puis deux tercets (3 vers). Le dernier vers porte souvent la pointe (ou chute)."}],[{id:"v8",type:"qcm",q:"Quelle est la richesse de la rime \xAB tourne / enfourne \xBB (Les Effar\xE9s) ?",opts:["Riche (3 sons communs ou plus)","Suffisante (2 sons communs)","Pauvre (1 son commun)","Ce n\u2019est pas une rime"],simple:"Riche : [u] [\u0281] [n] = 3 sons.",detail:"On compte les sons entendus, pas les lettres : t-<b>ourne</b> / enf-<b>ourne</b> \u2192 [u], [\u0281], [n]. Trois sons identiques = rime riche."},{id:"v9",type:"qcm",q:"Quelle est la richesse de la rime \xAB brume / allume \xBB ?",opts:["Suffisante (2 sons communs)","Riche (3 sons communs)","Pauvre (1 son commun)","Embrass\xE9e"],simple:"Suffisante : [y] [m] = 2 sons.",detail:"br-<b>ume</b> / all-<b>ume</b> : on entend [y] et [m]. Le e final est muet, il ne se prononce pas. \xAB Embrass\xE9e \xBB d\xE9signe une disposition, pas une richesse."},{id:"v10",type:"qcm",q:"Quelle est la richesse de la rime \xAB rond / blond \xBB ?",opts:["Pauvre (1 son commun)","Suffisante (2 sons communs)","Riche (3 sons communs)","F\xE9minine"],simple:"Pauvre : un seul son commun, [\u0254\u0303].",detail:"r-<b>ond</b> [\u0281\u0254\u0303] / bl-<b>ond</b> [bl\u0254\u0303] : seul le son voyelle [\u0254\u0303] est commun. Les lettres \xAB nd \xBB ne se prononcent pas. C\u2019est une rime masculine (pas de e muet)."},{id:"v11",type:"qcm",q:"Comment s\u2019appelle le ph\xE9nom\xE8ne entre ces deux vers ?",src:["Accrochant follement aux herbes des haillons","D\u2019argent ; o\xF9 le soleil\u2026"],opts:["Un rejet","Un contre-rejet","Une c\xE9sure","Une di\xE9r\xE8se"],simple:"Un rejet : \xAB D\u2019argent \xBB est rejet\xE9 au d\xE9but du vers suivant.",detail:"La phrase (\xAB des haillons d\u2019argent \xBB) d\xE9borde du vers 2, et un \xE9l\xE9ment <b>court</b> (\xAB D\u2019argent \xBB) est rejet\xE9 au vers 3, suivi d\u2019une pause (point-virgule). Ce mot est ainsi mis en valeur."},{id:"v12",type:"qcm",q:"Quel ph\xE9nom\xE8ne rythmique observe-t-on dans ces vers de Victor Hugo ?",src:["On d\xE9jeune en lisant son journal ; tout le jour","On m\xEAle \xE0 sa pens\xE9e espoir, travail, amour."],opts:["Un contre-rejet","Un rejet","Une rime suivie","Une syn\xE9r\xE8se"],simple:"Contre-rejet : la phrase commence \xE0 la fin du vers 1 (\xAB tout le jour \xBB).",detail:"Apr\xE8s le point-virgule, une nouvelle phrase commence en <b>fin</b> de vers (\xAB tout le jour \xBB) et se poursuit au vers suivant. C\u2019est l\u2019inverse du rejet."},{id:"v13",type:"qcm",q:"Apr\xE8s quel mot se trouve la c\xE9sure de cet alexandrin ?",src:"P\xE2le dans son lit vert o\xF9 la lumi\xE8re pleut.",opts:["vert","dans","o\xF9","lumi\xE8re"],simple:"Apr\xE8s \xAB vert \xBB (6e syllabe).",detail:"P\xE2<sup>1</sup>le<sup>2</sup> dans<sup>3</sup> son<sup>4</sup> lit<sup>5</sup> vert<sup>6</sup> // o\xF9<sup>7</sup> la<sup>8</sup> lu<sup>9</sup>mi\xE8<sup>10</sup>re<sup>11</sup> pleut<sup>12</sup>. Le e de <i>P\xE2le</i> compte (devant la consonne d). Les deux h\xE9mistiches opposent le soldat (p\xE2le, couch\xE9) et la lumi\xE8re qui \xAB pleut \xBB."},{id:"v14",type:"num",q:"D\xE9fi : combien de syllabes compte le dernier vers du \xAB Dormeur du val \xBB ?",src:"Tranquille. Il a deux trous rouges au c\xF4t\xE9 droit.",a:12,simple:"12 syllabes, comme tout le sonnet.",detail:"Tran<sup>1</sup>qui<sup>2</sup>ll(e) Il<sup>3</sup> a<sup>4</sup> deux<sup>5</sup> trous<sup>6</sup> // rou<sup>7</sup>ges<sup>8</sup> au<sup>9</sup> c\xF4<sup>10</sup>t\xE9<sup>11</sup> droit<sup>12</sup>. Le e de <i>Tranquille</i> s\u2019\xE9lide devant <i>Il</i>. En revanche, la finale <b>-es</b> de <i>rouges</i>, devant une voyelle, se prononce avec la liaison (rou-ge-z-au) : elle compte."}],[{id:"v15",type:"qcm",q:"Quel est l\u2019effet principal du rejet \xAB Tranquille. \xBB au dernier vers du \xAB Dormeur du val \xBB ?",src:["Il dort dans le soleil, la main sur sa poitrine","Tranquille. Il a deux trous rouges au c\xF4t\xE9 droit."],opts:["Il isole une derni\xE8re image de calme juste avant la r\xE9v\xE9lation brutale de la mort.","Il permet de faire rimer \xAB poitrine \xBB et \xAB narine \xBB.","Il montre que le soldat se repose vraiment apr\xE8s le combat.","Il ralentit le texte pour d\xE9crire le paysage."],simple:"Le rejet isole le calme apparent, aussit\xF4t d\xE9menti par la chute.",detail:"\xAB Tranquille \xBB, mis en valeur et suivi d\u2019un point, prolonge l\u2019illusion du sommeil. La phrase suivante, courte et factuelle, r\xE9v\xE8le la mort : c\u2019est la <b>pointe</b> du sonnet. Le contraste rend la d\xE9nonciation de la guerre plus forte."},{id:"v16",type:"qcm",q:"Dans \xAB Les Effar\xE9s \xBB, chaque tercet se termine par un vers tr\xE8s court de 4 syllabes (\xAB Leurs culs en rond \xBB, \xAB Le lourd pain blond \xBB). Quel effet cela produit-il ?",opts:["Le vers bref isole un d\xE9tail concret, comme un regard d\u2019enfant, et souligne la petitesse et le manque.","Il rend le po\xE8me plus solennel, comme une trag\xE9die.","Il permet d\u2019utiliser des rimes riches.","Il n\u2019a aucun effet : c\u2019est une contrainte du sonnet."],simple:"Le vers court met en relief un d\xE9tail et mime la petitesse des enfants.",detail:"Apr\xE8s deux octosyllabes, la chute sur 4 syllabes produit un effet de <b>tomb\xE9e</b> : un d\xE9tail concret (le pain d\xE9sir\xE9, les enfants accroupis) est isol\xE9. Ce rythme heurt\xE9 sert le registre <b>path\xE9tique</b>. Ce n\u2019est pas un sonnet : ce sont douze tercets."},{id:"v17",type:"write",q:"R\xE9dige deux ou trois phrases qui relient la forme et le sens \xE0 propos du rejet \xAB Dort ; \xBB (v. 7 du \xAB Dormeur du val \xBB).",src:["Et la nuque baignant dans le frais cresson bleu,","Dort ; il est \xE9tendu dans l\u2019herbe, sous la nue,"],model:"Le verbe \xAB Dort \xBB, plac\xE9 en <b>rejet</b> au d\xE9but du vers 7 et suivi d\u2019un point-virgule, est fortement mis en valeur. Apr\xE8s une longue description du corps sur deux vers, ce verbe court et isol\xE9 impose l\u2019id\xE9e du sommeil, qui sera r\xE9p\xE9t\xE9e (\xAB il dort \xBB, \xAB il fait un somme \xBB). Le lecteur est ainsi conduit sur une fausse piste : ce sommeil insistant pr\xE9pare, par contraste, la r\xE9v\xE9lation de la mort au dernier vers.",checklist:["Je nomme le proc\xE9d\xE9 (rejet).","Je cite le mot et le vers.","J\u2019explique ce que le proc\xE9d\xE9 met en valeur.","Je donne un effet sur le lecteur ou le sens du po\xE8me."],simple:"Proc\xE9d\xE9 (rejet) + citation (\xAB Dort ; \xBB, v. 7) + effet (mise en valeur du sommeil, fausse piste avant la chute)."}]]},{id:"figures",titre:"Figures de style",lecon:"figures",desc:"Identifier une figure, la distinguer de ses voisines, en interpr\xE9ter l\u2019effet.",worked:{titre:"Analyser une figure : \xAB Nature, berce-le chaudement : il a froid. \xBB",src:["Les pieds dans les gla\xEFeuls, il dort. Souriant comme","Sourirait un enfant malade, il fait un somme :","Nature, berce-le chaudement : il a froid."],steps:[{h:"Comprendre le sens litt\xE9ral",html:"Le po\xE8te s\u2019adresse \xE0 la Nature et lui demande de bercer le soldat, parce qu\u2019il a froid."},{h:"Rep\xE9rer et nommer la figure",html:'La Nature est apostroph\xE9e et re\xE7oit une action humaine (\xAB berce-le \xBB) : c\u2019est une <span class="tag t-pro">personnification</span>. Elle devient une <b>m\xE8re</b> qui berce son enfant.'},{h:"Rep\xE9rer une seconde figure",html:'\xAB <span class="tag t-cit">chaudement</span> \xBB et \xAB <span class="tag t-cit">froid</span> \xBB s\u2019opposent dans le m\xEAme vers : c\u2019est une <span class="tag t-pro">antith\xE8se</span>.'},{h:"Interpr\xE9ter l\u2019effet",html:"La pri\xE8re \xE0 une nature maternelle rend le soldat <b>fragile</b> comme un enfant. Le froid est un <b>indice implicite</b> : un dormeur au soleil ne devrait pas avoir froid. Le lecteur commence \xE0 soup\xE7onner la mort."},{h:"R\xE9diger la phrase d\u2019analyse",html:'<span class="tag t-pro">La personnification de la Nature</span>, apostroph\xE9e comme une m\xE8re (<span class="tag t-cit">\xAB Nature, berce-le chaudement \xBB</span>), <span class="tag t-eff">fait du soldat un enfant vuln\xE9rable ; l\u2019antith\xE8se avec \xAB il a froid \xBB glisse un premier indice inqui\xE9tant de sa mort</span>.'}],retenir:"M\xE9thode : <b>sens litt\xE9ral</b> \u2192 <b>nommer</b> \u2192 <b>citer</b> \u2192 <b>effet</b>. Une figure sans effet ne rapporte aucun point."},levels:[[{id:"f1",type:"qcm",q:"Quelle figure de style ?",src:["Souriant comme","Sourirait un enfant malade, il fait un somme"],opts:["Comparaison","M\xE9taphore","Antith\xE8se","Litote"],simple:"Comparaison : outil \xAB comme \xBB.",detail:"Compar\xE9 : le soldat (qui sourit) ; outil : \xAB comme \xBB ; comparant : \xAB un enfant malade \xBB ; motif : le sourire. Le mot \xAB malade \xBB est un indice inqui\xE9tant."},{id:"f2",type:"qcm",q:"Quelle figure de style ?",src:"La s\xE8ve est du champagne et vous monte \xE0 la t\xEAte\u2026",opts:["M\xE9taphore","Comparaison","P\xE9riphrase","Hyperbole"],simple:"M\xE9taphore : la s\xE8ve est identifi\xE9e au champagne, sans outil de comparaison.",detail:"Le verbe \xAB est \xBB assimile directement la s\xE8ve du printemps (et de la jeunesse) au champagne : l\u2019adolescent est <b>gris\xE9</b>, ivre de vie et d\u2019amour."},{id:"f3",type:"qcm",q:"Quelle figure de style ?",src:["Vous \xEAtes amoureux. Lou\xE9 jusqu\u2019au mois d\u2019ao\xFBt.","Vous \xEAtes amoureux. \u2013 Vos sonnets La font rire."],opts:["Anaphore","Chiasme","Gradation","Oxymore"],simple:"Anaphore : \xAB Vous \xEAtes amoureux \xBB est r\xE9p\xE9t\xE9 en d\xE9but de vers.",detail:"La r\xE9p\xE9tition en t\xEAte de vers insiste sur l\u2019\xE9tat amoureux, avec une pointe d\u2019<b>humour</b> : l\u2019amour est pr\xE9sent\xE9 comme un \xE9tat passager, \xAB lou\xE9 jusqu\u2019au mois d\u2019ao\xFBt \xBB."},{id:"f4",type:"qcm",q:"Quelle figure de sonorit\xE9 ?",src:"Noirs dans la neige et dans la brume,",opts:["Allit\xE9ration en [n]","Assonance en [a]","Paronomase","Rime riche"],simple:"Allit\xE9ration : retour du son consonne [n].",detail:"<b>N</b>oirs, da<b>n</b>s, <b>n</b>eige, da<b>n</b>s : le son [n] revient, ainsi que [d]. Allit\xE9ration = consonnes ; assonance = voyelles."},{id:"f5",type:"qcm",q:"Quelle figure d\xE9signe les albatros dans ce vers ?",src:"Que ces rois de l\u2019azur, maladroits et honteux,",opts:["P\xE9riphrase","M\xE9tonymie","Litote","Anaphore"],simple:"P\xE9riphrase : \xAB ces rois de l\u2019azur \xBB remplace \xAB les albatros \xBB.",detail:"L\u2019expression d\xE9crit les oiseaux par leur royaut\xE9 dans le ciel. Elle cr\xE9e un <b>contraste</b> avec \xAB maladroits et honteux \xBB : le roi est d\xE9chu."},{id:"f6",type:"qcm",q:"Quelle figure de style ?",src:"Un \xE9clair\u2026 puis la nuit ! \u2013 Fugitive beaut\xE9",opts:["Antith\xE8se","Oxymore","Euph\xE9misme","Chiasme"],simple:"Antith\xE8se : \xE9clair (lumi\xE8re) / nuit (obscurit\xE9).",detail:"Les deux termes oppos\xE9s sont dans la m\xEAme phrase mais pas coll\xE9s dans un m\xEAme groupe de mots : c\u2019est une antith\xE8se, pas un oxymore. Elle traduit la bri\xE8vet\xE9 foudroyante de la rencontre."},{id:"f7",type:"qcm",q:"Quelle figure de style ?",src:"Va, je ne te hais point. (Corneille, Le Cid)",opts:["Litote","Euph\xE9misme","Hyperbole","Antiphrase"],simple:"Litote : dire moins (\xAB je ne te hais point \xBB) pour faire entendre plus (\xAB je t\u2019aime \xBB).",detail:"La litote utilise souvent une n\xE9gation. L\u2019euph\xE9misme, lui, adoucit une r\xE9alit\xE9 p\xE9nible (\xAB elle a v\xE9cu \xBB pour \xAB elle est morte \xBB)."}],[{id:"f8",type:"qcm",q:"M\xE9tonymie ou synecdoque ?",src:"J\u2019ai lu un Zola.",opts:["M\xE9tonymie (l\u2019auteur pour l\u2019\u0153uvre)","Synecdoque (la partie pour le tout)","P\xE9riphrase","M\xE9taphore"],simple:"M\xE9tonymie : l\u2019auteur pour l\u2019\u0153uvre.",detail:"Au sens litt\xE9ral, la phrase est absurde (on ne lit pas une personne) : c\u2019est le signe d\u2019une m\xE9tonymie, fond\xE9e sur un lien logique."},{id:"f9",type:"qcm",q:"M\xE9tonymie ou synecdoque ?",src:"Cette famille n\u2019a plus de toit.",opts:["Synecdoque (la partie pour le tout)","M\xE9tonymie (l\u2019auteur pour l\u2019\u0153uvre)","Hyperbole","Euph\xE9misme"],simple:"Synecdoque : le toit (partie) pour la maison (tout).",detail:"Au sens litt\xE9ral, la phrase n\u2019est pas absurde mais incompl\xE8te : c\u2019est le signe de la synecdoque (rapport d\u2019inclusion)."},{id:"f10",type:"qcm",q:"Antith\xE8se ou oxymore ?",src:"Cette obscure clart\xE9 qui tombe des \xE9toiles (Corneille)",opts:["Oxymore","Antith\xE8se","Paradoxe","Parall\xE9lisme"],simple:"Oxymore : \xAB obscure \xBB et \xAB clart\xE9 \xBB sont dans le m\xEAme groupe de mots.",detail:"L\u2019oxymore colle deux termes oppos\xE9s (ici un adjectif et un nom). Le sens litt\xE9ral est incoh\xE9rent, mais l\u2019image est forte : la faible lumi\xE8re de la nuit."},{id:"f11",type:"qcm",q:"Quelle figure de construction ?",src:"La douceur qui fascine et le plaisir qui tue.",opts:["Parall\xE9lisme","Chiasme","Gradation","Anaphore"],simple:"Parall\xE9lisme : nom + \xAB qui \xBB + verbe, deux fois (AB / AB).",detail:"Les deux groupes ont la m\xEAme construction. Le parall\xE9lisme rapproche deux id\xE9es qui s\u2019opposent (fasciner / tuer) : la femme est \xE0 la fois attirante et dangereuse."},{id:"f12",type:"qcm",q:"Quelle figure de construction ?",src:"Il faut manger pour vivre et non pas vivre pour manger. (Moli\xE8re)",opts:["Chiasme","Parall\xE9lisme","Paronomase","Antiphrase"],simple:"Chiasme : manger / vivre // vivre / manger (AB / BA).",detail:"Les termes reviennent en ordre invers\xE9, comme dans un miroir. Le chiasme produit un effet de sym\xE9trie et oppose deux fa\xE7ons de vivre."},{id:"f13",type:"qcm",q:"Comparaison ou m\xE9taphore ?",src:"P\xE2le dans son lit vert o\xF9 la lumi\xE8re pleut.",opts:["M\xE9taphore","Comparaison","Personnification","Hyperbole"],simple:"M\xE9taphore : l\u2019herbe devient un \xAB lit vert \xBB, sans outil de comparaison.",detail:"\xAB Lit vert \xBB assimile l\u2019herbe \xE0 un lit : le soldat semble dormir. Le lit est aussi, implicitement, un lit de mort. \xAB La lumi\xE8re pleut \xBB est une seconde m\xE9taphore."},{id:"f14",type:"qcm",q:"Quelle figure d\xE9signe les cinq enfants affam\xE9s ?",src:"Les pauvres J\xE9sus pleins de givre,",opts:["M\xE9taphore","Comparaison","Litote","Gradation"],simple:"M\xE9taphore : les enfants sont appel\xE9s \xAB J\xE9sus \xBB, sans outil.",detail:"L\u2019image religieuse fait des enfants des innocents qui souffrent, comme l\u2019Enfant J\xE9sus n\xE9 dans le froid. Elle renforce le registre <b>path\xE9tique</b> et critique implicitement une soci\xE9t\xE9 chr\xE9tienne qui les laisse mourir de faim."},{id:"f15",type:"qcm",q:"\xAB Le c\u0153ur fou robinsonne \xE0 travers les romans \xBB : quelle figure, en plus de l\u2019invention d\u2019un verbe (n\xE9ologisme) ?",opts:["M\xE9taphore","Comparaison","Litote","Euph\xE9misme"],simple:"M\xE9taphore : le c\u0153ur part \xE0 l\u2019aventure comme Robinson Cruso\xE9.",detail:"Rimbaud invente le verbe \xAB robinsonner \xBB \xE0 partir de Robinson Cruso\xE9 : le c\u0153ur de l\u2019adolescent s\u2019\xE9vade dans l\u2019imaginaire des romans. Cr\xE9er un mot est d\xE9j\xE0 une <b>\xE9mancipation cr\xE9atrice</b> de la langue."}],[{id:"f16",type:"qcm",q:"Quel est l\u2019effet de la comparaison \xAB Chaud comme un sein \xBB dans \xAB Les Effar\xE9s \xBB ?",src:["Ils sont blottis, pas un ne bouge,","Au souffle du soupirail rouge","Chaud comme un sein."],opts:["Le four devient une m\xE8re nourrici\xE8re : il offre la chaleur et la tendresse qui manquent aux enfants.","Elle montre que le boulanger est g\xE9n\xE9reux avec les enfants.","Elle d\xE9crit pr\xE9cis\xE9ment la temp\xE9rature du four.","Elle se moque des enfants qui ont froid."],simple:"Le soupirail devient une m\xE8re : chaleur, nourriture, tendresse qui manquent.",detail:"Le sein \xE9voque la m\xE8re et l\u2019allaitement. Les enfants \xAB blottis \xBB cherchent aupr\xE8s du four ce que la soci\xE9t\xE9 ne leur donne pas. Le boulanger, lui, est peint avec ironie (\xAB au gras sourire \xBB). L\u2019image renforce le path\xE9tique."},{id:"f17",type:"qcm",q:"Comment analyser le dernier vers : \xAB Il a deux trous rouges au c\xF4t\xE9 droit. \xBB ?",opts:["Une p\xE9riphrase sobre qui d\xE9signe les blessures mortelles sans nommer la mort : la chute est d\u2019autant plus brutale.","Une hyperbole qui exag\xE8re la blessure du soldat.","Une antith\xE8se entre le rouge et le droit.","Une litote qui signifie que le soldat va gu\xE9rir."],simple:"Une p\xE9riphrase (presque un euph\xE9misme) : la mort est dite sans \xEAtre nomm\xE9e.",detail:"Les \xAB deux trous rouges \xBB d\xE9signent des impacts de balles. Le ton neutre, presque clinique, contraste avec la douceur du sonnet : le lecteur comprend d\u2019un coup. C\u2019est la <b>pointe</b>, et elle d\xE9nonce la guerre sans discours."},{id:"f18",type:"write",q:"R\xE9dige une phrase d\u2019analyse compl\xE8te (proc\xE9d\xE9 + citation + effet) sur ce vers de Baudelaire.",src:"Ma jeunesse ne fut qu\u2019un t\xE9n\xE9breux orage,",model:'<span class="tag t-pro">La m\xE9taphore</span> de <span class="tag t-cit">\xAB t\xE9n\xE9breux orage \xBB</span> <span class="tag t-eff">assimile la jeunesse du po\xE8te \xE0 une temp\xEAte sombre et violente : sa vie appara\xEEt comme domin\xE9e par le malheur, et la tournure restrictive \xAB ne fut qu\u2019 \xBB renforce ce bilan d\xE9sesp\xE9r\xE9</span>.',checklist:["Je nomme la figure (m\xE9taphore).","Je cite pr\xE9cis\xE9ment.","J\u2019explique ce qui est compar\xE9 \xE0 quoi.","J\u2019interpr\xE8te l\u2019effet (vision sombre, fatalit\xE9)."],simple:"M\xE9taphore (jeunesse = orage) \u2192 vision sombre et fatale de sa vie."}]]},{id:"registres",titre:"Registres",lecon:"registres",desc:"Reconna\xEEtre un registre et le justifier par des indices.",worked:{titre:"Identifier le registre des \xAB Effar\xE9s \xBB",src:["Noirs dans la neige et dans la brume,","Au grand soupirail qui s\u2019allume,","Leurs culs en rond,","","\xC0 genoux, cinq petits, \u2013 mis\xE8re ! \u2013","Regardent le Boulanger faire","Le lourd pain blond."],steps:[{h:"Quelle \xE9motion le texte cherche-t-il \xE0 produire ?",html:"De la <b>piti\xE9</b> pour des enfants qui ont froid et faim."},{h:"Relever des indices",html:"Le froid (\xAB neige \xBB, \xAB brume \xBB, \xAB givre \xBB, \xAB vent d\u2019hiver \xBB) ; la faim (ils \xAB regardent \xBB le pain sans le manger) ; la petitesse (\xAB cinq petits \xBB) ; l\u2019exclamation \xAB \u2013 mis\xE8re ! \u2013 \xBB."},{h:"Nommer le registre principal",html:"Ces indices rel\xE8vent du registre <b>path\xE9tique</b> : \xE9motions tristes et fortes devant une situation inhumaine."},{h:"Chercher un registre secondaire",html:"\xAB Le Boulanger au gras sourire / Grogne un vieil air \xBB : le portrait est moqueur. Il y a une touche <b>satirique</b> : le contraste entre l\u2019homme gras et les enfants affam\xE9s d\xE9nonce l\u2019injustice."},{h:"R\xE9diger",html:"Le registre <b>path\xE9tique</b> domine (froid, faim, \xAB mis\xE8re ! \xBB) ; il se double d\u2019une <b>satire</b> discr\xE8te du boulanger : le po\xE8me suscite la piti\xE9 et d\xE9nonce l\u2019indiff\xE9rence sociale."}],retenir:"Un registre se <b>prouve</b> : \xE9motion vis\xE9e + 2 ou 3 indices pr\xE9cis."},levels:[[{id:"r1",type:"qcm",q:"Registre dominant : un po\xE8me qui d\xE9crit en se moquant la bourgeoisie de Charleville r\xE9unie pour un concert (\xAB \xC0 la musique \xBB).",opts:["Satirique","Lyrique","\xC9pique","Didactique"],simple:"Satirique : critique moqueuse d\u2019un groupe social.",detail:"La satire critique un ridicule, un d\xE9faut, un vice, souvent par l\u2019exag\xE9ration et la caricature. Rimbaud y exprime son \xAB ironie cruelle pour la bourgeoisie \xBB (fiche 1)."},{id:"r2",type:"qcm",q:"Registre de \xAB V\xE9nus anadyom\xE8ne \xBB, r\xE9\xE9criture moqueuse du mythe de la naissance de V\xE9nus.",opts:["Parodique","Tragique","Lyrique","Oratoire"],simple:"Parodique : imitation moqueuse d\u2019une \u0153uvre ou d\u2019un mythe s\xE9rieux.",detail:"La parodie suppose de conna\xEEtre l\u2019original : ici la V\xE9nus sortant des eaux, symbole de beaut\xE9, que Rimbaud rend laide et vulgaire."},{id:"r3",type:"qcm",q:"Registre dominant :",src:"Oh ! l\xE0 ! l\xE0 ! que d\u2019amours splendides j\u2019ai r\xEAv\xE9es !",opts:["Lyrique","Pol\xE9mique","Didactique","R\xE9aliste"],simple:"Lyrique : le \xAB je \xBB exprime ses \xE9motions.",detail:"Premi\xE8re personne, exclamations, r\xEAve amoureux : le po\xE8te exprime sa joie et son enthousiasme. L\u2019interjection famili\xE8re \xAB Oh ! l\xE0 ! l\xE0 ! \xBB ajoute une touche d\u2019humour."},{id:"r4",type:"qcm",q:"Registre dominant :",src:"\u2013 \xD4 douleur ! \xF4 douleur ! Le Temps mange la vie,",opts:["Tragique","Comique","Didactique","\xC9pique"],simple:"Tragique : l\u2019homme est domin\xE9 par une force qui le d\xE9passe, le Temps.",detail:"Le Temps, personnifi\xE9, \xAB mange la vie \xBB : rien ne peut lui \xE9chapper. C\u2019est le monde de la <b>fatalit\xE9</b> que Poulet attribue \xE0 Baudelaire."},{id:"r5",type:"qcm",q:"Registre du \xAB Hareng saur \xBB de Charles Cros (\xAB Pour mettre en fur
