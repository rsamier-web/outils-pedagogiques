<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disserter sur Musset · On ne badine pas avec l’amour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout : fenêtre KDE Plasma (Breeze) — barre d'en-tête, barre latérale, une seule vue de contenu, une tâche à la fois.
   Couleurs : palette Breeze ; une couleur par pièce de dissertation (signalisation), identique partout. */
:root{
  --window:#eff0f1; --view:#fcfcfc; --alt:#f5f6f7; --text:#232629; --muted:#5d6873;
  --line:#d4d7da; --line-strong:#b8bbbe; --btn:#fcfcfc; --btn-hover:#ffffff;
  --accent:#3daee9; --accent-text:#1d6fa5; --accent-tint:rgba(61,174,233,.13); --accent-tint-strong:rgba(61,174,233,.26);
  --pos:#1e8049; --pos-tint:rgba(39,174,96,.12); --neg:#b8323f; --neg-tint:rgba(218,68,83,.11);
  --r-arg:#1d6fa5; --r-expl:#7a3b99; --r-ex:#a35200; --r-ana:#1e8049; --r-lien:#0d7766;
  --r-acc:#3d5266; --r-pres:#4549b0; --r-def:#7a3b99; --r-pb:#1d6fa5; --r-ann:#b0306a; --r-bil:#0d7766; --r-ouv:#a35200; --r-trans:#6b737b;
  --shadow:0 1px 2px rgba(35,38,41,.12); --scrim:rgba(35,38,41,.35);
  --f-ui:"Noto Sans","Segoe UI",Cantarell,Ubuntu,system-ui,sans-serif;
  --f-read:"Noto Serif",Georgia,"Times New Roman",serif;
  --base:16px; --lh:1.55; --ls:0em; --ws:0em;
}
:root[data-theme="dark"]{
  --window:#2a2e32; --view:#1b1e20; --alt:#232629; --text:#fcfcfc; --muted:#a3abb3;
  --line:#3a3f44; --line-strong:#50565c; --btn:#31363b; --btn-hover:#383d42;
  --accent-text:#5cc3f2; --accent-tint:rgba(61,174,233,.17); --accent-tint-strong:rgba(61,174,233,.32);
  --pos:#4ccf7e; --pos-tint:rgba(39,174,96,.2); --neg:#f06b78; --neg-tint:rgba(218,68,83,.2);
  --r-arg:#5cc3f2; --r-expl:#c792e0; --r-ex:#f8a14c; --r-ana:#4ccf7e; --r-lien:#3fd0b3;
  --r-acc:#aab9c8; --r-pres:#a3a6f7; --r-def:#c792e0; --r-pb:#5cc3f2; --r-ann:#f27aab; --r-bil:#3fd0b3; --r-ouv:#f8a14c; --r-trans:#9aa3ab;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.5); color-scheme:dark;
}
html{height:100%;box-sizing:border-box;font-size:var(--base)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--window);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.55rem;font-weight:600} h2{font-size:1.2rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:.35rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-height:0}
.header{display:flex;align-items:center;gap:.5rem;padding:.35rem 1rem;background:var(--window);border-bottom:1px solid var(--line);min-height:3rem;position:relative}
.header .app-name{font-size:.82rem;color:var(--muted);white-space:nowrap}
.header .page-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.header .sep{width:1px;height:1.2rem;background:var(--line)}
.spacer{flex:1}
.header .menu-btn{display:none}
.main{display:grid;grid-template-columns:16rem minmax(0,1fr);min-height:0}
.sidebar{background:var(--window);border-right:1px solid var(--line);overflow-y:auto;padding:.6rem .5rem;display:flex;flex-direction:column;gap:2px}
.side-label{font-size:.75rem;font-weight:600;color:var(--muted);padding:.75rem .65rem .3rem;letter-spacing:.03em}
.nav-item{display:flex;align-items:center;gap:.6rem;width:100%;padding:.42rem .6rem;border-radius:4px;border:1px solid transparent;background:none;color:var(--text);font:inherit;font-size:.93rem;text-align:left;cursor:pointer;letter-spacing:0;word-spacing:0}
.nav-item:hover{background:var(--accent-tint)}
.nav-item.active{background:var(--accent-tint-strong);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .num{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;width:1rem;text-align:right}
.nav-item .st{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .st.done{color:var(--pos)}
.content{background:var(--view);overflow-y:auto;min-width:0}
.page{max-width:48rem;margin:0 auto;padding:1.5rem 1.25rem 3rem;display:flex;flex-direction:column;gap:1.2rem}
.lead{color:var(--muted);max-width:64ch}
.scrim{display:none}
@media (max-width:800px){
  .header .menu-btn{display:inline-flex}
  .header .app-name,.header .sep,.header .hide-sm{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(18rem,86vw);z-index:30;transform:translateX(-102%);transition:transform .18s ease;box-shadow:0 0 18px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:25}
  .page{padding:1.1rem 1rem 2.5rem}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font:inherit;font-size:.93rem;letter-spacing:0;word-spacing:0;color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.38rem .85rem;min-height:2.2rem;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,background .12s;text-align:center}
.btn:hover{border-color:var(--accent);background:var(--btn-hover)}
.btn:disabled{opacity:.5;cursor:default;border-color:var(--line-strong)}
.btn-primary{border-color:var(--accent);background:var(--accent-tint)}
.btn-primary:hover{background:var(--accent-tint-strong)}
.btn-flat{background:transparent;border-color:transparent;box-shadow:none}
.btn-flat:hover{background:var(--accent-tint);border-color:transparent}
.btn-sm{font-size:.84rem;padding:.18rem .55rem;min-height:1.9rem}
.btn-icon{padding:.35rem;min-width:2.2rem}
.btn.on{background:var(--accent-tint-strong);border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;font:inherit;font-size:.93rem;letter-spacing:0;word-spacing:0;padding:.55rem .95rem;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:.4rem;align-items:center}
.tab:hover{color:var(--text);background:var(--accent-tint)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .n{display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;border:1px solid currentColor;font-size:.72rem}
.tab .ok{color:var(--pos)}

.frame{border:1px solid var(--line);border-radius:5px;background:var(--alt);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.7rem}
.card{border:1px solid var(--line);border-radius:5px;background:var(--view);padding:1.1rem 1.2rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.9rem}
.eyebrow{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .25s}

.msg{display:flex;gap:.6rem;align-items:flex-start;border:1px solid;border-radius:5px;padding:.7rem .9rem}
.msg svg{flex:none;margin-top:.18rem}
.msg .body{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.msg-pos{border-color:color-mix(in srgb,var(--pos) 60%,transparent);background:var(--pos-tint)} .msg-pos>svg{color:var(--pos)}
.msg-neg{border-color:color-mix(in srgb,var(--neg) 60%,transparent);background:var(--neg-tint)} .msg-neg>svg{color:var(--neg)}
.msg-info{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-tint)} .msg-info>svg{color:var(--accent-text)}

details.more{border:1px solid var(--line);border-radius:4px;background:var(--view)}
details.more>summary{cursor:pointer;padding:.45rem .75rem;font-size:.9rem;font-weight:600;color:var(--accent-text)}
details.more>.inner{padding:0 .8rem .8rem;display:flex;flex-direction:column;gap:.5rem}

.md{display:flex;flex-direction:column;gap:.6rem}
.read{font-family:var(--f-read);font-size:1.06rem;line-height:calc(var(--lh) + .12)}
.dl{display:grid;grid-template-columns:minmax(7rem,auto) minmax(0,1fr);gap:.5rem 1rem;margin:0}
.dl dt{font-weight:600}
.dl dd{margin:0}
@media (max-width:540px){.dl{grid-template-columns:minmax(0,1fr);gap:.15rem} .dl dd{margin-bottom:.45rem}}

/* Rôles (signalisation) */
.k-arg{--c:var(--r-arg)} .k-expl{--c:var(--r-expl)} .k-ex{--c:var(--r-ex)} .k-ana{--c:var(--r-ana)} .k-lien{--c:var(--r-lien)}
.k-acc{--c:var(--r-acc)} .k-pres{--c:var(--r-pres)} .k-def{--c:var(--r-def)} .k-pb{--c:var(--r-pb)} .k-ann{--c:var(--r-ann)}
.k-bil{--c:var(--r-bil)} .k-ouv{--c:var(--r-ouv)} .k-trans{--c:var(--r-trans)}
.chip{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.06rem .45rem;border-radius:3px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap;line-height:1.5;word-spacing:0}
.seg{border-left:3px solid var(--c);padding:.1rem 0 .1rem .7rem}
.seg-inline{color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:3px;padding:.03em .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.nocolor .chip{color:var(--text);background:transparent;border-color:var(--line-strong)}
.nocolor .seg{border-left-color:var(--line-strong)}
.nocolor .seg-inline{color:inherit;background:none}
.legend{display:flex;flex-wrap:wrap;gap:.4rem}

/* Accueil */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--view);gap:0}
.path li+li{border-top:1px solid var(--line)}
.path button{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;padding:.75rem 1rem;background:none;border:none;font:inherit;color:var(--text);text-align:left;cursor:pointer;letter-spacing:0;word-spacing:0}
.path button:hover{background:var(--accent-tint)}
.path .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-weight:600;color:var(--muted)}
.path .n.done{border-color:var(--pos);color:var(--pos);background:var(--pos-tint)}
.path .t{font-weight:600}
.path .d{font-size:.86rem;color:var(--muted)}
.status{font-size:.76rem;padding:.08rem .5rem;border-radius:10px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.status.done{border-color:var(--pos);color:var(--pos)}
.status.started{border-color:var(--accent);color:var(--accent-text)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:640px){.tips{grid-template-columns:minmax(0,1fr)}}
.tip{display:flex;flex-direction:column;gap:.3rem}
.tip svg{color:var(--accent-text)}
.tip p{font-size:.9rem;color:var(--muted)}

/* Pas à pas */
.dots{display:flex;gap:.35rem;flex-wrap:wrap}
.dot{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:.78rem;font-weight:600;background:var(--view);color:var(--muted);cursor:pointer;font-family:inherit;padding:0}
.dot.cur{border-color:var(--accent);background:var(--accent);color:#fff}
.dot.past{border-color:var(--pos);color:var(--pos)}
.dot:disabled{cursor:default;opacity:.6}
.task{font-family:var(--f-read);font-size:1.12rem}
.selfq{display:flex;gap:.55rem;align-items:flex-start;color:var(--muted);font-style:italic}
.answer{display:flex;flex-direction:column;gap:.35rem;align-items:flex-start}
.why{border-top:1px dashed var(--line-strong);padding-top:.7rem;display:flex;flex-direction:column;gap:.35rem}
.why p{color:var(--muted);font-size:.95rem}
.done-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:.5rem}
.done-list li{display:flex;flex-direction:column;gap:.15rem}
.done-list .h{font-size:.8rem;font-weight:600;color:var(--muted)}

/* Familles d'exercices */
.fams{display:grid;gap:.6rem}
.fam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line);border-radius:5px;padding:.75rem .9rem;cursor:pointer;letter-spacing:0;word-spacing:0}
.fam:hover{border-color:var(--accent);background:var(--accent-tint)}
.lvl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:3.6rem;height:3.2rem;border-radius:4px;background:var(--alt);border:1px solid var(--line);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lvl b{font-size:1.15rem;color:var(--text);letter-spacing:0}
.bars{display:flex;gap:2px}
.bars i{width:6px;height:10px;border-radius:1px;background:var(--line)}
.bars i.on{background:var(--accent)}

/* Exercices */
.prompt{font-size:1.05rem;font-weight:500}
.choices{display:flex;flex-direction:column;gap:.5rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.65rem .85rem;cursor:pointer;box-shadow:var(--shadow)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice .mark{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:.1rem}
.choice.ok{border-color:var(--pos);background:var(--pos-tint)} .choice.ok .mark{border-color:var(--pos);color:var(--pos)}
.choice.no{border-color:var(--neg);background:var(--neg-tint)} .choice.no .mark{border-color:var(--neg);color:var(--neg)}
.choice.dim{opacity:.55}
.mrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 1.4rem;gap:.6rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.mrow .ic{display:grid;place-items:center}
.mrow .ic.ok{color:var(--pos)} .mrow .ic.no{color:var(--neg)}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr) 1.4rem}.mrow select{grid-column:1}}
select,textarea,input[type=text],input[type=search]{font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line-strong);border-radius:4px;padding:.45rem .6rem;width:100%;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws)}
textarea{resize:vertical;min-height:7rem}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.zone{display:flex;flex-direction:column;gap:.45rem}
.zone-label{font-size:.8rem;font-weight:600;color:var(--muted)}
.slot{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.55rem .8rem;cursor:pointer;box-shadow:var(--shadow)}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{cursor:default}
.slot .pos{flex:none;width:1.5rem;height:1.5rem;border-radius:3px;background:var(--accent-tint-strong);color:var(--accent-text);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:.1rem}
.slot.ok{border-color:var(--pos);background:var(--pos-tint)} .slot.ok .pos{background:var(--pos);color:var(--view)}
.slot.no{border-color:var(--neg);background:var(--neg-tint)} .slot.no .pos{background:var(--neg);color:var(--view)}
.empty{border:1px dashed var(--line-strong);border-radius:4px;padding:.75rem;color:var(--muted);font-size:.9rem;text-align:center}
.checks{display:flex;flex-direction:column;gap:.4rem}
.checks label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
.checks input{width:1.1rem;height:1.1rem;margin-top:.22rem;accent-color:var(--accent);flex:none}
.model{font-family:var(--f-read);font-size:1.02rem;line-height:calc(var(--lh) + .1);border-left:3px solid var(--pos);padding-left:.8rem}
.stage{display:flex;flex-direction:column;gap:.6rem;border-top:1px solid var(--line);padding-top:.9rem}
.stage-h{display:flex;gap:.5rem;align-items:center;font-weight:600}
.stage-h .n{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent-tint-strong);color:var(--accent-text);font-size:.75rem}
.prompt-box{font-family:ui-monospace,"Noto Sans Mono",monospace;font-size:.82rem;min-height:12rem;background:var(--alt)}

/* Plans */
.outline{display:flex;flex-direction:column;gap:.55rem}
.ol-part{border:1px solid var(--line);border-radius:5px;background:var(--view);overflow:hidden}
.ol-head{display:flex;gap:.6rem;align-items:center;padding:.5rem .8rem;background:var(--alt);font-weight:600}
.ol-head .rn{flex:none;width:1.7rem;height:1.7rem;border-radius:3px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:.85rem}
.ol-sub{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.4rem;padding:.45rem .8rem;border-top:1px solid var(--line);font-size:.95rem}
.ol-sub b{color:var(--muted)}
.pbox{font-family:var(--f-read);font-size:1.05rem;padding:.7rem .9rem;border:1px solid var(--accent);border-radius:4px;background:var(--accent-tint)}

/* Mémo */
.cit-row{display:flex;flex-direction:column;gap:.3rem;padding:.8rem 0;border-top:1px solid var(--line)}
.cit-row:first-child{border-top:none}
.cit-row q{font-family:var(--f-read);font-size:1.03rem;quotes:"« " " »"}
.cit-meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;font-size:.75rem;padding:.05rem .5rem;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);background:var(--alt)}
.pill.on{border-color:var(--accent);color:var(--accent-text);background:var(--accent-tint);font-weight:600}
button.pill{cursor:pointer;font-family:inherit}

/* Atelier */
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.88rem;font-weight:600;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.field .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.field textarea{min-height:4rem}
.group{display:flex;flex-direction:column;gap:.75rem;border-left:3px solid var(--c,var(--line-strong));padding-left:.9rem}
.subbox{border:1px solid var(--line);border-radius:4px;background:var(--alt);padding:.6rem .75rem;display:flex;flex-direction:column;gap:.45rem}
.assembled{display:flex;flex-direction:column;gap:.9rem}
.assembled .apara{display:flex;flex-direction:column;gap:.2rem}
.para-label{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg-ctl{display:flex;max-width:30rem}
.seg-ctl .btn{border-radius:0;flex:1;box-shadow:none}
.seg-ctl .btn:first-child{border-radius:4px 0 0 4px}
.seg-ctl .btn:last-child{border-radius:0 4px 4px 0}
.seg-ctl .btn+.btn{margin-left:-1px}

/* Réglages */

<script>

  { id: 'D', off: true, s: 'Polynésie 2025', fam: 2, q: 'Dans quelle mesure le jeu de la parole nuit-il à l’expression sincère des sentiments dans *On ne badine pas avec l’amour* ?' },

  { id: 'T5', off: false, s: 'Entraînement', fam: 4, q: 'Le titre *On ne badine pas avec l’amour* est-il une morale ou un constat ?' },

const SUJET = id => SUJETS.find(x => x.id === id);

/* Plans modèles : pb = problématique, rep = réponse en une phrase, parts = [titre, [sous-parties]] */
const PLANS = {
  A: { pb: 'L’affrontement de Camille et Perdican n’est-il qu’une joute de comédie amoureuse, ou un combat dont l’enjeu dépasse ceux qui le mènent ?',
    rep: 'Ils s’affrontent avec sérieux tout en croyant jouer : ils prennent leur orgueil au sérieux, mais pas l’amour.',
    parts: [
      ['En apparence, un affrontement de comédie', ['Une joute verbale en miroir : « l’amour peut voler un baiser, mais non pas l’amitié » (I, 2) ; « Ton amour m’eût donné la vie, mais ton amitié m’en consolera » (II, 1).', 'Le plaisir de la dispute : « J’aime la discussion » ; « Le plaisir des disputes, c’est de faire la paix » (III, 6).', 'Un cadre comique qui désamorce : le concert faux du Baron (I, 3), la rivalité de table de Blazius et Bridaine (II, 2). Parcours : Marivaux.']],
      ['En réalité, un combat aux enjeux graves', ['Deux visions du monde : « Je veux aimer, mais je ne veux pas souffrir » face à « J’ai souffert souvent, je me suis trompé quelquefois, mais j’ai aimé » (II, 5).', 'Une guerre d’orgueil : « je te le prouverai » (III, 2) ; « quelque trait qui pût m’atteindre », « ta flèche empoisonnée » (III, 6).', 'Des coups qui portent : la bague jetée dans la fontaine (III, 3) ; « Oui, je l’épouserai » (III, 6).']],
      ['Leur faute : ne pas prendre au sérieux ce qu’ils mettent en jeu', ['Un jeu d’enfants avec la mort : « nous avons joué avec la vie et la mort » (III, 8).', 'La seule qui ne joue pas meurt : « Comment n’y croirais-je pas ? il me tromperait donc ? Pour quoi faire ? » (Rosette, III, 6).', 'La pièce bascule du Chœur bouffon (I, 1) à l’oratoire : « Elle est morte. Adieu, Perdican ! » Parcours : Laclos, *Les Liaisons dangereuses*.']]
    ] },
  B: { pb: 'Les personnages sont-ils seulement victimes de leurs propres jeux, ou d’autres pièges, plus profonds, se referment-ils sur eux ?',
    rep: 'Chaque piège se retourne contre celui qui l’a tendu, mais ce badinage n’est que la surface d’autres pièges : l’éducation, la société, la condition humaine.',
    parts: [
      ['Des pièges qui se retournent contre leurs auteurs', ['Camille, piégée par sa vanité : « Je m’étais vantée de t’avoir inspiré quelque amour » (III, 6).', 'Perdican, piégé par sa mise en scène : fiancé à Rosette, « c’est une idée que je vous dois, et je m’y tiens » (III, 7).', 'Trois écoutes cachées se répondent : Camille derrière un arbre (III, 3), Rosette derrière le rideau (III, 6), puis derrière l’autel (III, 8).']],
      ['Ils se laissent piéger : lucidité et complaisance', ['Ils voient le piège et y entrent : « je l’ai vue derrière un arbre écouter la conversation » (Perdican, à part, III, 6).', 'Le premier piège est intérieur : « Je voudrais bien savoir si je suis amoureux » (III, 1).', 'Les grotesques font de même en comique : « Pourquoi un vain orgueil m’a-t-il éloigné de ce dîner honorable » (III, 2).']],
      ['Un piège plus vaste que leur badinage', ['L’éducation : « les religieuses t’ont donné leur expérience ; mais, crois-moi, ce n’est pas la tienne » (II, 5).', 'La société : Rosette, « une fille de rien » pour Camille (III, 7).', 'La condition humaine : « car nous sommes des hommes » (III, 8). Parcours : Shakespeare, *Beaucoup de bruit pour rien*.']]
    ] },
  C: { pb: 'Parler est-il, dans la pièce, une faute qui expose et qui blesse, ou bien le vrai tort des personnages est-il de mal parler, ou de se taire ?',
    rep: 'La réplique éclaire la pièce à condition de la retourner : le tort de Camille est moins d’avoir parlé que d’avoir laissé l’orgueil parler à sa place.',
    parts: [
      ['La parole expose, blesse et finit par tuer', ['Parler, c’est se livrer : « En vérité, je vous ai aimé, Perdican » (II, 5).', 'Les paroles deviennent des armes : la lettre lue (III, 2), la déclaration « à haute voix, de manière que Camille l’entende » (III, 3).', 'Le bilan : « Quelles vaines paroles, quelles misérables folies ont passé comme un vent funeste entre nous deux ? » (III, 8).']],
      ['Mais le vrai tort est de taire ou de travestir', ['Les refus sont aussi des fautes : « Je n’en ai nulle envie » (I, 3).', 'Parler pour masquer : « il nous faut souvent jouer un rôle, souvent mentir » (III, 6).', 'La parole vraie arrive trop tard : « Insensés que nous sommes ! nous nous aimons » (III, 8).']],

  D: { pb: 'Le jeu de la parole empêche-t-il le cœur de se dire, ou le laisse-t-il affleurer malgré tout ?',
    rep: 'Le jeu fait obstacle à la sincérité mais la trahit aussi ; le vrai ennemi est l’orgueil, et la sincérité finale ne sauve rien.',
    parts: [
      ['Le jeu de la parole fait obstacle au cœur', ['La parole-masque : « Je suis comme cela ; c’est ma manière » (I, 3).', 'La parole-arme : la déclaration à Rosette destinée à Camille (III, 3).', 'La parole apprise : Rosette démasque la galanterie, « vous ne respectez guère mes lèvres » (II, 3).']],
      ['Pourtant, le jeu laisse affleurer la vérité', ['La boutade avoue : « Ton amour m’eût donné la vie » (II, 1).', 'Le cœur dit vrai quand la langue ment : « êtes-vous sûr que tout mente dans une femme, lorsque sa langue ment ? » (III, 6).', 'Le jeu sert d’enquête : Camille veut voir le cœur de Perdican « à nu » (II, 5).']],
      ['Le vrai ennemi est l’orgueil, et la sincérité peut tuer', ['« Orgueil ! le plus fatal des conseillers humains » (III, 8).', 'C’est l’aveu sincère de l’oratoire qui tue Rosette : sincérité ne veut pas dire innocence.', 'Parcours : Marivaux (le jeu mène à la vérité) ; Molière, Alceste (la sincérité absolue est impossible).']]

  E: { pb: 'Toute parole, même la plus légère, engage-t-elle vraiment celui qui la prononce ?',
    rep: 'Oui : l’intrigue est une chaîne de paroles, et même les paroles qui semblent gratuites finissent par produire des effets.',
    parts: [
      ['Chaque parole agit', ['Les paroles-actes : « tu seras ma femme » (III, 3) ; « Oui, je l’épouserai » (III, 6).', 'Une intrigue en chaîne : billet (II, 5), lettre (III, 2), déclaration écoutée (III, 3), rideau (III, 6).', 'La conséquence ultime : le grand cri derrière l’autel (III, 8).']],
      ['Des paroles qui semblent gratuites', ['Le bavardage des grotesques : « Cela est impossible » (le Baron).', 'Le badinage pour le plaisir : « J’aime la discussion » (III, 6).', 'Même ces paroles ont des suites : la fausse accusation de Blazius le fait chasser (III, 2).']],
      ['Une morale de la parole', ['Le titre est une parole de sagesse que l’action vérifie.', 'La responsabilité : « ne faites pas de moi un meurtrier ! » (III, 8).', 'Parcours : Marivaux, *Les Fausses Confidences* : des mots calculés, pour une issue heureuse.']]
    ] },
  F: { pb: 'La peur de perdre est-elle le seul ressort des personnages, ou cache-t-elle un désir plus profond, celui d’aimer absolument ?',
    rep: 'La peur de perdre est partout, mais elle masque un désir d’absolu ; et à force de ne pas vouloir perdre, ils perdent tout.',
    parts: [
      ['Une peur de perdre omniprésente', ['Camille a peur de souffrir : « Je veux aimer, mais je ne veux pas souffrir » (II, 5).', 'Perdican a peur de perdre la face : « je te le prouverai » (III, 2).', 'Les grotesques en version comique : « Tout est perdu ! perdu sans ressources ! » (le Baron, I, 5) ; « Adieu bouteilles cachetées » (Bridaine, II, 2).']],
      ['D’autres forces les animent', ['Le désir de savoir : « Je voudrais bien savoir si je suis amoureux » (III, 1).', 'Le désir de gagner et de dominer : la vengeance de Perdican (III, 3), le triomphe de Camille (III, 6).', 'L’amour et la nostalgie de l’enfance : « le monde mystérieux des rêves de mon enfance » (I, 4).']],
      ['À force de ne pas vouloir perdre, ils perdent tout', ['Le bilan : « je ne puis plus prier ! » (Camille, III, 8).', 'Le contre-modèle : Rosette ne calcule pas, « je vous aimerai comme je pourrai » (III, 3), et perd tout.', 'La leçon de la tirade : « On est souvent trompé en amour […] mais on aime » (II, 5). Parcours : Hermione, *Andromaque*.']]
    ] },
  G: { pb: 'La catastrophe est-elle inscrite dès l’ouverture, ou naît-elle des choix et des jeux des personnages ?',
    rep: 'L’ouverture multiplie les signes du destin, mais l’intrigue reste ouverte : si tout est « joué », c’est surtout au sens théâtral.',
    parts: [
      ['Beaucoup de signes annoncent la fin', ['Le titre-proverbe annonce la leçon.', 'Une exposition verrouillée : « J’ai disposé les choses de manière à tout prévoir » ; « Voilà un commencement de mauvais augure » (le Baron, I, 2).', 'L’ironie tragique : « Monseigneur, elle veut mourir fille » (le Chœur, I, 4).']],
      ['Rien n’est joué tant que les personnages jouent', ['Des portes restent ouvertes : « laisse-moi espérer que notre vie passée n’est pas morte à jamais dans ton cœur » (II, 1) ; la bague retrouvée (III, 6).', 'Le hasard : le cachet de la lettre saute pendant une querelle (III, 2) ; « Il faut donc qu’elle m’ait suivi sans que je m’en sois aperçu » (III, 8).', 'Des choix : lire la lettre, monter la scène de la fontaine, cacher Rosette.']],
      ['« Joué » au sens théâtral : tout se joue dans le jeu', ['Des rôles appris : Camille rejoue sœur Louise ; Perdican joue le séducteur.', 'Une composition en *accelerando* : la comédie glisse vers le tragique (drame romantique).', 'Pour le spectateur, la question n’est pas « si », mais « comment ».']]
    ] },
  T1: { pb: 'Rosette n’est-elle que la victime des jeux des deux cousins, ou est-elle aussi celle qui révèle la vérité de ces jeux ?',
    rep: 'Victime, oui, mais aussi révélatrice et figure sacrificielle qui donne son sens au proverbe.',
    parts: [
      ['Une victime instrumentalisée', ['Un « appât », un « jouet » (Camille, III, 6).', 'Une « fille de rien », « une fille sans nom » (III, 7).', 'Elle meurt de ce qu’elle entend (III, 8).']],
      ['Une révélatrice lucide', ['La seule qui ne joue pas : « Comment n’y croirais-je pas ? » (III, 6).', 'Elle démasque la galanterie : « vous ne respectez guère mes lèvres » (II, 3).', 'Sa sincérité simple : « je vous aimerai comme je pourrai » (III, 3).']],
      ['Une figure sacrificielle', ['Sa mort vérifie le proverbe du titre.', 'Le cri derrière l’autel juge les deux autres (III, 8).', 'Parcours : Mme de Tourvel chez Laclos ; Silvia dans *La Double Inconstance*.']]
    ] },
  T2: { pb: 'L’orgueil est-il le vrai moteur de la catastrophe, ou le symptôme d’un mal plus profond ?',
    rep: 'L’orgueil est le moteur visible, mais il s’appuie sur une éducation, une société et une parole qui ne savent plus dire le cœur.',
    parts: [

      ['D’autres causes', ['L’éducation du couvent : « ce n’est pas la tienne » (II, 5).', 'La société : « un mariage disproportionné » (le Baron, III, 7).', 'Le hasard : la lettre décachetée (III, 2).']],
      ['Un drame de la parole et de la condition humaine', ['« Quelles vaines paroles » (III, 8).', '« car nous sommes des hommes » (III, 8).', 'Parcours : La Rochefoucauld, l’amour-propre.']]
    ] },
  T3: { pb: '*On ne badine pas avec l’amour* commence-t-elle comme une comédie que le hasard ferait mal tourner, ou la tragédie est-elle inscrite dès l’ouverture ?',

      ['Une tragédie', ['L’ironie tragique : « elle veut mourir fille » (I, 4).', 'L’oratoire et la prière (III, 8).', 'La mort de Rosette.']],
      ['Un drame romantique', ['Le mélange des registres (préface de *Cromwell*).', 'Une pièce écrite pour être lue, libre de toute règle.', 'Le mal du siècle : des héros en quête d’absolu.']]

  T4: { pb: 'La pièce applique-t-elle l’esthétique du drame romantique, ou la réinvente-t-elle dans une forme plus intime ?',
    rep: 'Elle en a la liberté et le mélange des registres, mais elle les met au service d’un drame intime de la parole.',
    parts: [
      ['Oui, un drame romantique', ['Liberté formelle : lieux multiples, pas d’unités, pièce écrite pour être lue.', 'Mélange des registres : les grotesques et la tirade.', 'Des héros en quête d’absolu : « un amour éternel » (II, 5).']],
      ['Mais un héritage du XVIIIe siècle', ['Le proverbe dramatique, genre de salon (Carmontelle).', 'Le marivaudage.', 'Une forme brève, sans histoire ni politique, à la différence d’*Hernani* ou de *Lorenzaccio*.']],
      ['Un drame romantique intime', ['Le tragique passe par la parole.', 'L’ironie de Musset : un romantique lucide.', 'La présence de Sand dans la tirade.']]
    ] },
  T5: { pb: 'Le titre est-il une leçon adressée au lecteur, ou le constat d’une fatalité humaine ?',
    rep: 'C’est une morale vérifiée à la lettre, mais aussi un constat désenchanté, adressé au lecteur comme un avertissement.',

      ['Une morale', ['Le proverbe dramatique illustre une maxime.', 'Le proverbe est vérifié à la lettre : quelqu’un meurt.', 'Les personnages sont punis.']],
      ['Un constat', ['« car nous sommes des hommes » (III, 8).', 'Le mal du siècle.', 'Personne n’apprend vraiment : séparation finale.']],
      ['Un avertissement au lecteur', ['*Un spectacle dans un fauteuil* : une pièce à lire et à méditer.', 'Le lecteur devient juge.', 'Ouverture : *Les Caprices de Marianne*.']]
    ] },
  T6: { pb: 'Le Chœur n’est-il qu’un témoin comique, ou une conscience qui éclaire l’action ?',
    rep: 'Il commence comme un témoin comique, devient la voix de la mémoire, puis une conscience tragique.',
    parts: [
      ['Un témoin comique', ['Les portraits burlesques de Blazius et de Pluche (I, 1).', '« vous arrivez comme la fièvre » (I, 1).', 'La querelle de Blazius et Bridaine.']],
      ['La voix de la mémoire', ['« Puissions-nous retrouver l’enfant dans le cœur de l’homme ! » (I, 1).', 'Le dialogue avec Perdican au village (I, 4).', 'Le lien avec l’enfance perdue.']],
      ['Une conscience tragique', ['« elle veut mourir fille » (I, 4).', '« la pauvre fille ne sait pas quel danger elle court » (III, 4).', 'Héritage antique : voir sans pouvoir agir.']]
    ] },
  T7: { pb: 'Dans la pièce, la parole est-elle condamnée à masquer le cœur, ou peut-elle encore le dire ?',
    rep: 'La parole masque et blesse, mais elle dit vrai à deux moments, la tirade et l’aveu final, toujours trop tard ou par emprunt.',
    parts: [
      ['Une parole qui masque', ['« Je suis comme cela ; c’est ma manière » (I, 3).', 'La déclaration calculée (III, 3).', '« il nous faut souvent jouer un rôle, souvent mentir » (III, 6).']],
      ['Le cœur perce sous la parole', ['« Ton amour m’eût donné la vie » (II, 1).', '« tout mente dans une femme, lorsque sa langue ment ? » (III, 6).', 'Les gestes : la bague retrouvée.']],
      ['Deux moments de vérité, trop tard', ['La tirade de II, 5, empruntée à une lettre de George Sand.', '« nous nous aimons » (III, 8).', 'Le dernier mot revient au cri de Rosette.']]

  T8: { pb: 'La parole n’est-elle qu’un instrument de manipulation, ou échappe-t-elle à ceux qui la manient ?',
    rep: 'Elle manipule, mais elle exprime aussi le cœur, et surtout elle échappe à ceux qui croient la maîtriser.',
    parts: [
      ['Une parole qui manipule', ['La déclaration à double destinataire (III, 3).', 'Le piège du rideau (III, 6).', 'L’interrogatoire de la fontaine (II, 5).']],
      ['Une parole qui exprime', ['La tirade (II, 5).', 'La boutade qui avoue (II, 1).', 'L’aveu final (III, 8).']],
      ['Une parole qui échappe', ['Les conséquences dépassent les intentions : Rosette meurt.', '« Lequel de nous a voulu tromper l’autre ? » (III, 8).', 'Parcours : *Les Fausses Confidences*.']]
    ] }
};

/* Boîte à citations : q = citation, who, ref, ctx = contexte, ana = analyse, fam = familles, use = usage */

        s: 'I, 2 : le baiser refusé ; I, 3 : les refus ; II, 5 : la fontaine ; III, 2 : la lettre ; III, 3 : la bague ; III, 6 : le rideau ; III, 8 : l’aveu, puis le cri.', d: 'Remarque l’accélération : l’acte III enchaîne la lettre, la vengeance, le piège et la mort. C’est la « composition en *accelerando* » : le rythme s’accélère jusqu’à la catastrophe.' },
      { t: 'order', p: 'Remets dans l’ordre la chaîne des paroles qui mène au drame.', items: ['Camille fait remettre un billet : « Trouvez-vous à midi à la petite fontaine ».', 'Blazius et Pluche se disputent une lettre ; le cachet saute.', 'Perdican lit la lettre et décide de faire la cour à Rosette devant Camille.', 'Perdican parle « à haute voix, de manière que Camille l’entende ».', 'Camille cache Rosette derrière un rideau.', 'Perdican s’engage : « Oui, je l’épouserai ».'],
        s: 'Le billet (II, 5), la lettre décachetée et lue (III, 2), la déclaration (III, 3), le rideau puis l’engagement (III, 6).', d: 'Chaque parole provoque la suivante. Cette chaîne est un argument tout prêt pour les sujets sur la parole (sujet E : « il n’y a pas de parole gratuite »).' }
    ] },
    { t: 'Qui dit quoi ?', lvl: 3, d: 'Attribuer une réplique à son personnage.', items: [
      { t: 'mcq', p: '« Ton amour m’eût donné la vie, mais ton amitié m’en consolera. »', o: ['Camille', 'Perdican', 'Le Baron', 'Rosette'], a: 1, s: 'Perdican, à Camille (II, 1).', d: 'Camille vient de lui dire, pour le sonder : « Je suis bien aise que mon refus vous soit indifférent. » Perdican avoue son amour, puis se reprend par une pirouette pour sauver son amour-propre.' },
      { t: 'mcq', p: '« Vous respectez mon sourire, mais vous ne respectez guère mes lèvres. »', o: ['Camille', 'Dame Pluche', 'Rosette', 'Le Chœur'], a: 2, s: 'Rosette, à Perdican (II, 3).', d: 'Perdican vient de parler de son « sourire céleste » et de l’embrasser. Rosette, avec humour, relève l’écart entre les belles paroles et le geste.' },
      { t: 'mcq', p: '« êtes-vous sûr que tout mente dans une femme, lorsque sa langue ment ? »', o: ['Rosette', 'Camille', 'Dame Pluche', 'Perdican'], a: 1, s: 'Camille, à Perdican (III, 6).', d: 'C’est la réplique-clé du parcours : Camille distingue ce que dit la langue et ce que ressent le cœur.' },
      { t: 'mcq', p: '« Voilà un commencement de mauvais augure. »', o: ['Maître Bridaine', 'Le Chœur', 'Le Baron', 'Maître Blazius'], a: 2, s: 'Le Baron, à Bridaine (I, 2).', d: 'Il réagit au refus du baiser. Un personnage comique annonce sans le savoir une fin tragique : c’est de l’ironie tragique.' },
      { t: 'mcq', p: '« Monseigneur, elle veut mourir fille. »', o: ['Rosette', 'Le Chœur', 'Camille', 'Dame Pluche'], a: 1, s: 'Le Chœur, à Perdican, à propos de Rosette (I, 4).', d: '« Mourir fille », c’est mourir sans être mariée. Rosette répond aussitôt « Oh ! non » : elle espère. La formule prendra un sens littéral et sinistre.' }
    ] },
    { t: 'Situer une scène', lvl: 4, d: 'Retrouver l’acte et la scène à partir d’un indice.', items: [
      { t: 'mcq', p: 'Perdican lit une lettre qui ne lui est pas destinée. Dans quelle scène ?', o: ['I, 4', 'II, 5', 'III, 2', 'III, 6'], a: 2, s: 'Acte III, scène 2.', d: 'Le cachet a sauté pendant la querelle de Blazius et de Pluche. Perdican hésite (« Que ce soit un crime d’ouvrir une lettre, je le sais trop bien pour le faire »), puis lit. C’est le point de départ de la vengeance.' },
      { t: 'mcq', p: '« Elle est morte. Adieu, Perdican ! » Que s’est-il passé juste avant ?', o: ['Rosette s’est évanouie derrière un rideau', 'Camille et Perdican se sont avoué leur amour, et un cri a retenti derrière l’autel', 'Le Baron a refusé le mariage avec Rosette', 'Perdican a jeté la bague dans la fontaine'], a: 1, s: 'L’aveu dans l’oratoire, puis le cri derrière l’autel (III, 8).', d: 'L’évanouissement a lieu en III, 6 : ne confonds pas les deux scènes d’écoute de Rosette. En III, 8, c’est un cri, et Rosette meurt.' },
      { t: 'mcq', p: 'Quelle scène se termine par « J’ai souffert souvent, je me suis trompé quelquefois, mais j’ai aimé » ?', o: ['I, 3', 'II, 5', 'III, 3', 'III, 8'], a: 1, s: 'II, 5 : la fin de la scène de la fontaine, et de l’acte II.', d: 'C’est la fin de la tirade de Perdican. Musset a repris cette phrase mot pour mot d’une lettre de George Sand (12 mai 1834).' },
      { t: 'mcq', p: 'Camille est cachée derrière un arbre et entend Perdican déclarer son amour à Rosette. Quelle scène ?', o: ['II, 3', 'III, 3', 'III, 6', 'III, 8'], a: 1, s: 'III, 3.', d: 'Première scène d’écoute cachée. Il y en a trois : Camille derrière un arbre (III, 3), Rosette derrière le rideau (III, 6), Rosette derrière l’autel (III, 8).' }
    ] }
  ],
  quiz: [
    { t: 'mcq', p: 'Pourquoi la forme de la pièce est-elle si libre ?', o: ['Musset ignorait les règles du théâtre', 'La pièce a été écrite pour être lue', 'Elle a été écrite pour le cinéma', 'Elle imite la tragédie classique'], a: 1, s: 'Elle a été écrite pour être lue (*Un spectacle dans un fauteuil*).', d: 'Sans contrainte de mise en scène, Musset multiplie les lieux et mêle les tons. La première représentation n’a lieu qu’en 1861.' },
    { t: 'mcq', p: 'Qu’est-ce qu’un proverbe dramatique ?', o: ['Une pièce en vers', 'Une courte pièce qui illustre un proverbe', 'Une tragédie en cinq actes', 'Un recueil de maximes'], a: 1, s: 'Une courte pièce qui illustre le proverbe de son titre.', d: 'Genre de salon du XVIIIe siècle. Musset le détourne : le proverbe est vérifié tragiquement.' },
    { t: 'mcq', p: 'Qui est sœur Louise ?', o: ['La mère de Camille', 'Une religieuse du couvent, malheureuse en amour', 'La sœur de Rosette', 'La gouvernante de Camille'], a: 1, s: 'Une religieuse amie de Camille, trompée et désespérée.', d: 'Camille lui écrit une lettre (III, 2). Son histoire nourrit la peur d’aimer de Camille.' },
    { t: 'mcq', p: 'Où se passe la dernière scène ?', o: ['À la fontaine', 'Dans un oratoire', 'Au village', 'Dans la chambre de Camille'], a: 1, s: 'Dans un oratoire.', d: 'Un lieu de prière : la mort de Rosette prend la forme d’un sacrifice.' },
    { t: 'mcq', p: 'Que fait Rosette lorsqu’elle entend Perdican, derrière le rideau (III, 6) ?', o: ['Elle s’enfuit', 'Elle s’évanouit', 'Elle crie et meurt', 'Elle interrompt la scène'], a: 1, s: 'Elle s’évanouit.', d: 'Elle mourra en III, 8, après un cri derrière l’autel.' },
    { t: 'mcq', p: 'Qu’advient-il de la bague jetée dans la fontaine ?', o: ['Elle est perdue', 'Camille la retrouve et la rend à Perdican', 'Rosette la garde', 'Le Baron la récupère'], a: 1, s: 'Camille la retrouve : « C’est pour cela que je l’ai trouvée ; tenez, Perdican, la voilà » (III, 6).', d: 'Le geste dit ce que les mots taisent : Camille tient encore à Perdican.' },
    { t: 'mcq', p: 'Quand la pièce est-elle jouée pour la première fois ?', o: ['1834', '1847', '1861', '1900'], a: 2, s: 'En 1861, à la Comédie-Française.', d: 'Musset est mort en 1857 : il n’a jamais vu sa pièce jouée.' },
    { t: 'mcq', p: 'Quel lien unit Camille et Rosette ?', o: ['Elles sont cousines', 'Elles sont sœurs de lait', 'Rosette est sa servante', 'Aucun'], a: 1, s: 'Elles sont sœurs de lait.', d: 'La mère de Rosette a nourri Camille. Ce lien d’enfance rend la manœuvre de Camille en III, 6 encore plus cruelle.' }
  ] },

/* ---------------- MODULE 2 ---------------- */
{ id: 'citations', t: 'Exploiter une citation', icon: 'quote', goal: 'Transformer une citation en preuve : la situer, l’analyser, la relier au sujet.',
  learn: [
    { t: 'Une citation est une preuve', b: `Dans une dissertation, une citation sert à **prouver** un argument. Elle ne le remplace pas, et elle ne se suffit pas à elle-même.

Trois gestes, toujours dans cet ordre :
- **Situer** : qui parle, à qui, à quel moment.
- **Analyser** : un procédé précis, et ce qu’il montre.
- **Relier** : en quoi cela répond au sujet.`, key: 'Une citation sans commentaire est une citation perdue.' },
    { t: 'Les règles d’or', b: `- **Courte** : moins d’une ligne en général. Coupe avec […] si besoin.
- **Exacte** : mot pour mot, entre guillemets.
- **Référencée** : acte et scène, entre parenthèses : (II, 5).
- **Intégrée** : ta phrase reste correcte avec la citation.
- **Commentée** : au moins une phrase d’analyse après.

Une citation inexacte coûte plus cher qu’une citation absente. Si tu hésites, **reformule** sans guillemets.` },
    { t: 'Les procédés à reconnaître', b: 'Les procédés qui reviennent le plus souvent dans la pièce.', terms: [
      ['Antithèse', 'Deux idées opposées dans la même phrase : « ni assez jeune… ni assez vieille… » (I, 3).'],
      ['Anaphore', 'Un mot répété en début de segment : « je veux aimer… je veux aimer… » (II, 5).'],
      ['Question rhétorique', 'Une question qui n’attend pas de réponse : « Lequel de nous a voulu tromper l’autre ? » (III, 8).'],
      ['Apostrophe', 'On s’adresse à quelqu’un ou à quelque chose d’absent : « Orgueil ! » (III, 8).'],
      ['Personnification', 'Une idée devient un personnage : l’orgueil, « le plus fatal des conseillers humains ».'],
      ['Maxime', 'Une phrase générale, au présent de vérité générale : « Le plaisir des disputes, c’est de faire la paix » (III, 6).'],
      ['Champ lexical', 'Des mots du même thème : la guerre en III, 6 (« trait », « flèche empoisonnée »).'],
      ['Ironie tragique', 'Une parole prend après coup un sens funeste : « elle veut mourir fille » (I, 4).'],
      ['Double destinataire', 'On parle à quelqu’un pour toucher quelqu’un d’autre : Perdican parle à Rosette pour Camille (III, 3).'],
      ['Aparté', 'Une réplique dite « à part », que les autres personnages n’entendent pas.'],
      ['Didascalie', 'Une indication de l’auteur, en italique : « à haute voix, de manière que Camille l’entende ».']
    ] }
  ],
  worked: { t: 'Exploiter « Le plaisir des disputes, c’est de faire la paix »', task: 'Sujet A : Les personnages s’affrontent-ils sérieusement dans *On ne badine pas avec l’amour* ?', steps: [
    { t: 'Situer', q: 'Qui parle, et que se passe-t-il autour ?', a: 'Perdican, en III, 6. Camille est revenue, apprêtée, pour le reconquérir. Rosette est cachée derrière le rideau ; Perdican ne le sait pas.', w: 'Le contexte change le sens : sans Rosette cachée, ce serait une simple phrase de comédie.' },
    { t: 'Analyser', q: 'Quel procédé, et que montre-t-il ?', a: 'C’est une maxime : présent de vérité générale, tournure impersonnelle. Elle énonce la règle de la comédie amoureuse : on se dispute pour le plaisir de se réconcilier.', w: 'Nommer le procédé ne suffit pas : il faut toujours dire ce qu’il montre.' },
    { t: 'Relier', q: 'À quelle partie du plan de A cette citation sert-elle ?', a: 'À la partie I : elle prouve que l’affrontement ressemble à un jeu, qu’ils ne se disputent pas « sérieusement ».', w: 'La citation est rangée sous un argument précis, pas sous un thème vague.' },
    { t: 'Retourner', q: 'Peut-elle servir ailleurs ?', a: 'Oui, en partie III : le spectateur sait que Rosette écoute. La légèreté de la maxime devient mortelle.', w: 'Une bonne citation travaille deux fois. C’est très utile quand on manque de temps pour mémoriser.' },
    { t: 'Rédiger', q: 'Comment l’intégrer dans une phrase ?', a: 'Le duel des deux jeunes gens obéit aux règles de la comédie amoureuse : Perdican le résume par une maxime, « Le plaisir des disputes, c’est de faire la paix » (III, 6), dont le présent de vérité générale fait de la querelle un jeu, simple prélude à la réconciliation.', w: 'La citation est annoncée, référencée, puis commentée dans la même phrase.' }
  ] },
  fams: [
    { t: 'Reconnaître le procédé', lvl: 1, d: 'Nommer le procédé d’une citation.', items: [
      { t: 'mcq', p: '« Je ne suis pas assez jeune pour m’amuser de mes poupées, ni assez vieille pour aimer le passé. » (I, 3)', o: ['Une antithèse construite en parallèle', 'Une métaphore filée', 'Une question rhétorique', 'Une apostrophe'], a: 0, s: 'Une antithèse (jeune / vieille) dans une construction parallèle (ni… ni…).', d: 'La symétrie est presque trop parfaite : Camille parle par formules. C’est une parole-bouclier, utile pour les sujets sur la sincérité (D).' },
      { t: 'mcq', p: '« Orgueil ! le plus fatal des conseillers humains » (III, 8)', o: ['Une maxime', 'Une apostrophe et une personnification', 'Une litote', 'Un aparté'], a: 1, s: 'Une apostrophe (« Orgueil ! ») et une personnification (l’orgueil devient un « conseiller »).', d: 'L’orgueil devient un personnage qui s’interpose entre les amants. « Fatal » a son sens fort : qui apporte la mort.' },
      { t: 'mcq', p: '« PERDICAN, *à haute voix, de manière que Camille l’entende*. Je t’aime, Rosette ! » (III, 3)', o: ['Un aparté', 'Une didascalie qui crée un double destinataire', 'Une ironie tragique', 'Une prosopopée'], a: 1, s: 'La didascalie crée un double destinataire.', d: 'Ce n’est pas un aparté : un aparté n’est pas entendu des autres, alors qu’ici Perdican veut être entendu. La déclaration vise Camille à travers Rosette.' },
      { t: 'mcq', p: '« Monseigneur, elle veut mourir fille. » (I, 4)', o: ['Une ironie tragique', 'Une antithèse', 'Une anaphore', 'Une maxime'], a: 0, s: 'Une ironie tragique.', d: 'Formule courante (« mourir sans être mariée ») qui prend après coup un sens littéral : Rosette mourra sans mari.' },
      { t: 'mcq', p: '« Lequel de nous a voulu tromper l’autre ? » (III, 8)', o: ['Une question rhétorique', 'Une vraie question qui attend une réponse', 'Une apostrophe', 'Une hyperbole'], a: 0, s: 'Une question rhétorique.', d: 'Personne ne répond : la responsabilité reste indécidable. Utile pour le sujet de bac blanc sur la responsabilité.' }
    ] },
    { t: 'La bonne preuve', lvl: 2, d: 'Choisir la citation qui prouve vraiment l’argument.', items: [
      { t: 'mcq', p: 'Argument : « Camille refuse d’aimer par peur de souffrir. » Quelle citation le prouve ?', o: ['« Je n’aime pas les attouchements » (II, 1)', '« Je veux aimer, mais je ne veux pas souffrir » (II, 5)', '« Tu es une orgueilleuse » (II, 5)', '« Je suis venue ici pour recueillir le bien de ma mère » (II, 1)'], a: 1, s: '« Je veux aimer, mais je ne veux pas souffrir » : la peur de souffrir est dite en toutes lettres.', d: 'Les autres parlent du même thème (le refus de Camille) mais ne prouvent pas la **cause**. « Je n’aime pas les attouchements » montre la froideur ; « Tu es une orgueilleuse » est le jugement de Perdican, pas l’aveu de Camille. C’est l’erreur la plus fréquente : une citation sur le bon thème, mais pas sur le bon argument.' },
      { t: 'mcq', p: 'Argument : « Les personnages savent qu’ils jouent. » Quelle citation le prouve ?', o: ['« Je voudrais bien savoir si je suis amoureux » (III, 1)', '« Ton amour m’eût donné la vie » (II, 1)', '« je l’ai vue derrière un arbre écouter la conversation » (III, 6, à part)', '« Il a jeté ma bague dans l’eau ! » (III, 3)'], a: 2, s: 'L’aparté de Perdican : il sait que Camille l’a espionné et continue le jeu.', d: 'L’aparté montre la lucidité : il voit le piège et y entre. « Je voudrais bien savoir si je suis amoureux » montre au contraire l’incertitude.' },
      { t: 'mcq', p: 'Argument : « La parole devient une arme. » Quelle citation le prouve ?', o: ['« J’ai eu tort de parler » (II, 5)', '« à haute voix, de manière que Camille l’entende » (III, 3)', '« Puissions-nous retrouver l’enfant dans le cœur de l’homme ! » (I, 1)', '« Le plaisir des disputes, c’est de faire la paix » (III, 6)'], a: 1, s: 'La didascalie de III, 3 : la déclaration vise à blesser Camille.', d: '« J’ai eu tort de parler » montre la parole comme faiblesse, pas comme arme. La maxime de III, 6 parle de jeu, pas d’attaque.' },
      { t: 'mcq', p: 'Argument : « Rosette est la seule à ne pas jouer. » Quelle citation le prouve ?', o: ['« Monseigneur, elle veut mourir fille » (I, 4)', '« c’est une fille de rien » (III, 7)', '« Comment n’y croirais-je pas ? il me tromperait donc ? Pour quoi faire ? » (III, 6)', '« Je t’aime, Rosette ! » (III, 3)'], a: 2, s: 'Les trois questions de Rosette : elle croit à la parole donnée.', d: 'Les autres citations parlent de Rosette, mais ce sont d’autres qui parlent : le Chœur, Camille, Perdican. Pour prouver ce que pense un personnage, cite-le lui.' },
      { t: 'mcq', p: 'Argument : « Les grotesques reprennent en comique les fautes des héros. » Quelle citation le prouve ?', o: ['« Pourquoi un vain orgueil m’a-t-il éloigné de ce dîner honorable » (Bridaine, III, 2)', '« Voilà un commencement de mauvais augure » (le Baron, I, 2)', '« Orgueil ! le plus fatal des conseillers humains » (Perdican, III, 8)', '« leur éducation me coûte six mille écus » (le Baron, I, 2)'], a: 0, s: 'Bridaine avoue un « vain orgueil » : la faute des héros, mais pour une place à table.', d: 'Le parallèle est parfait avec l’apostrophe de Perdican en III, 8 : même vice, à deux hauteurs. C’est le mélange du grotesque et du sublime.' }
    ] },
    { t: 'Intégrer une citation', lvl: 3, d: 'Citer correctement, au bon format.', items: [
      { t: 'mcq', p: 'Quelle phrase intègre correctement la citation ?', o: ['Camille a peur. « Je veux aimer, mais je ne veux pas souffrir. »', 'Camille refuse l’amour par peur de souffrir : « je veux aimer, mais je ne veux pas souffrir » (II, 5) ; la conjonction « mais » oppose le désir et la peur.', 'Comme le dit Camille, il ne faut pas souffrir en amour.', 'Camille dit « je veux aimer, mais je ne veux pas souffrir », ce qui montre qu’elle veut aimer.'], a: 1, s: 'La deuxième : annoncée, référencée, analysée.', d: 'La première est « plaquée » : ni référence ni commentaire. La troisième déforme la citation. La quatrième commente par une répétition qui n’apprend rien (une paraphrase).' },
      { t: 'mcq', p: 'Qu’est-ce qui ne va pas ? « Perdican s’écrie : « Orgueil ! qu’as-tu fait de nous ? » (II, 5). »', o: ['Rien', 'La citation est déformée et mal située', 'Le verbe « s’écrie » est interdit', 'Il manque le nom de l’auteur'], a: 1, s: 'La citation est inexacte et la scène est fausse : c’est en III, 8, « qu’es-tu venu faire entre cette fille et moi ? ».', d: 'Une citation inventée ou mal située fait perdre la confiance du correcteur. Si tu n’es pas sûr des mots, reformule sans guillemets.' },
      { t: 'mcq', p: 'Pour prouver que « l’amour vaut malgré la souffrance », quelle coupe de la tirade (II, 5) choisir ?', o: ['« Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux ou lâches »', '« On est souvent trompé en amour, souvent blessé et souvent malheureux ; mais on aime »', '« Adieu, Camille »', 'Toute la tirade'], a: 1, s: 'La phrase qui contient l’argument : la souffrance (« trompé », « blessé ») puis le « mais » qui la dépasse.', d: 'Le début de la tirade prouverait le pessimisme, pas la valeur de l’amour. Toute la tirade serait trop longue : on cite le passage utile.' },
      { t: 'order', p: 'Remets dans l’ordre les étapes de l’exploitation d’une citation.', items: ['Annoncer l’argument.', 'Situer la citation : qui parle, à qui, quand.', 'Citer exactement, avec la référence.', 'Analyser un procédé et ce qu’il montre.', 'Relier au sujet.'], s: 'Argument, situation, citation, analyse, lien.', d: 'On ne commence jamais par la citation : elle vient prouver une idée déjà annoncée.' }
    ] },
    { t: 'Commenter une citation', lvl: 4, d: 'Rédiger l’exploitation complète.', items: [
      { t: 'write', task: 'Exploitation d’une citation', sujet: 'D', p: 'Exploite cette citation pour le sujet D, en 3 ou 4 phrases (situer, citer, analyser, relier) : « il nous faut souvent jouer un rôle, souvent mentir ; […] mais êtes-vous sûr que tout mente dans une femme, lorsque sa langue ment ? » (III, 6).', grid: 'cit',
        model: 'Lorsque Perdican lui reproche de changer sans cesse, Camille retourne l’accusation (III, 6) : « il nous faut souvent jouer un rôle, souvent mentir ; […] mais êtes-vous sûr que tout mente dans une femme, lorsque sa langue ment ? ». La question rhétorique sépare la langue et le cœur : le mensonge des mots n’empêche pas la vérité des sentiments. Le jeu de la parole nuit donc à l’expression sincère, mais sans l’abolir : sous le masque, le cœur continue de parler.' },
      { t: 'write', task: 'Exploitation d’une citation', sujet: 'E', p: 'Exploite cette didascalie pour le sujet E, en 3 ou 4 phrases : « à haute voix, de manière que Camille l’entende » (III, 3).', grid: 'cit',
        model: 'Lorsque Perdican déclare son amour à Rosette, une didascalie précise qu’il parle « à haute voix, de manière que Camille l’entende » (III, 3). Sa réplique a donc deux destinataires : Rosette, à qui il parle, et Camille, qu’il veut blesser. Cette parole n’a rien de gratuit : elle est calculée comme une arme, et ses conséquences seront mortelles, puisque Rosette prendra au sérieux une déclaration qui ne lui était pas vraiment destinée.' }
    ] }
  ],
  quiz: [
    { t: 'mcq', p: 'Dans quel ordre exploite-t-on une citation ?', o: ['Citer, puis situer, puis relier', 'Situer, citer, analyser, relier', 'Analyser, puis citer', 'Citer, puis passer à l’argument suivant'], a: 1, s: 'Situer, citer, analyser, relier.', d: 'Toujours après avoir annoncé l’argument.' },
    { t: 'mcq', p: 'Tu hésites sur les mots exacts d’une citation. Que fais-tu ?', o: ['Je l’écris quand même entre guillemets', 'Je la reformule sans guillemets', 'Je l’invente', 'Je ne parle pas de cette scène'], a: 1, s: 'Tu reformules, sans guillemets, en gardant la référence.', d: 'Une paraphrase exacte vaut mieux qu’une citation fausse.' },

    { t: 'Qu’est-ce qu’une problématique ?', b: `C’est la question qui guide toute la dissertation. Elle **reformule le sujet** en faisant apparaître une **tension** entre deux lectures possibles de la pièce.

    if (lines.every(l => /^\d+\. /.test(l))) return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\d+\. /, '')) + '</li>').join('') + '</ol>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';

}

    <div><span className="eyebrow">Correction simple</span><div><${T} s=${item.s} /></div></div>

    <details className="more"><summary>Correction détaillée</summary><div className="inner"><${Md} s=${item.d} /></div></details>
  </${Msg}>`;
}

/* ---------- QCM ---------- */
function MCQ({ item, id, onAnswer }) {
  const { setProg } = useApp();
  const order = useMemo(() => shuffle(item.o.map((_, i) => i)), [item]);
  const [pick, setPick] = useState(null);
  const answered = pick != null;
  const choose = i => { if (answered) return; setPick(i); const ok = i === item.a; if (id) setProg(id, ok ? 'ok' : 'ko'); if (onAnswer) onAnswer(ok); };
  return html`<div className="card">
    <p className="prompt"><${T} s=${item.p} /></p>
    <div className="choices">${order.map((oi, k) => {
      let cls = 'choice';
      if (answered) cls += oi === item.a ? ' ok' : oi === pick ? ' no' : ' dim';
      return html`<button key=${oi} className=${cls} disabled=${answered} onClick=${() => choose(oi)}><span className="mark">${answered && oi === item.a ? html`<${Icon} n="check" s=${13} />` : answered && oi === pick ? html`<${Icon} n="x" s=${13} />` : String.fromCharCode(65 + k)}</span><span><${T} s=${item.o[oi]} /></span></button>`;
    })}</div>
    ${answered ? html`<${Correction} ok=${pick === item.a} item=${item} />` : null}
    ${answered && !onAnswer ? html`<div className="actions"><button className="btn btn-sm" onClick=${() => setPick(null)}><${Icon} n="reset" s=${15} />Recommencer</button></div>` : null}
  </div>`;
}

/* ---------- Association ---------- */
function Match({ item, id }) {
  const { setProg } = useApp();
  const opts = useMemo(() => shuffle(Array.from(new Set(item.pairs.map(p => p[1])))), [item]);
  const [sel, setSel] = useState({});
  const [checked, setChecked] = useState(false);
  const all = item.pairs.every((_, i) => sel[i]);
  const okAll = item.pairs.every((p, i) => sel[i] === p[1]);
  const check = () => { setChecked(true); setProg(id, okAll ? 'ok' : 'ko'); };
  return html`<div className="card">
    <p className="prompt"><${T} s=${item.p} /></p>
    <div>${item.pairs.map((p, i) => {
      const st = checked ? (sel[i] === p[1] ? 'ok' : 'no') : '';
      return html`<div key=${i} className="mrow"><span><${T} s=${p[0]} /></span>
        <select aria-label=${'Réponse ' + (i + 1)} value=${sel[i] || ''} disabled=${checked} onChange=${e => setSel({ ...sel, [i]: e.target.value })}>
          <option value="">Choisir…</option>${opts.map(o => html`<option key=${o} value=${o}>${plain(o)}</option>`)}
        </select>
        <span className=${'ic ' + st}>${checked ? html`<${Icon} n=${st === 'ok' ? 'check' : 'x'} s=${16} />` : null}</span></div>`;
    })}</div>
    ${!checked ? html`<div className="actions"><button className="btn btn-primary" disabled=${!all} onClick=${check}>Vérifier</button>${!all ? html`<span className="count">Choisis une réponse pour chaque ligne.</span>` : null}</div>` : null}
    ${checked ? html`<${Correction} ok=${okAll} item=${item} extra=${okAll ? null : html`<div><span className="eyebrow">Les bonnes associations</span><ul>${item.pairs.map((p, i) => html`<li key=${i}><${T} s=${p[0]} /> → <strong><${T} s=${p[1]} /></strong></li>`)}</ul></div>`} />
      <div className="actions"><button className="btn btn-sm" onClick=${() => { setSel({}); setChecked(false); }}><${Icon} n="reset" s=${15} />Recommencer</button></div>` : null}
  </div>`;
}

/* ---------- Remise en ordre ---------- */
function Order({ item, id }) {
  const { setProg } = useApp();
  const [pool, setPool] = useState(() => { let s = shuffle(item.items.map((_, i) => i)); if (s.every((v, i) => v === i) && s.length > 1) s = s.reverse(); return s; });
  const [ans, setAns] = useState([]);
  const [checked, setChecked] = useState(false);
  const add = i => { if (checked) return; setAns([...ans, i]); setPool(pool.filter(x => x !== i)); };
  const rem = i => { if (checked) return; setPool([...pool, i]); setAns(ans.filter(x => x !== i)); };
  const okAll = ans.length === item.items.length && ans.every((v, k) => v === k);
  const check = () => { setChecked(true); setProg(id, okAll ? 'ok' : 'ko'); };
  const reset = () => { setPool(shuffle(item.items.map((_, i) => i))); setAns([]); setChecked(false); };
  return html`<div className="card">
    <p className="prompt"><${T} s=${item.p} /></p>
    <div className="zone"><span className="zone-label">Ton ordre (clique pour retirer)</span>
      ${ans.length ? ans.map((i, k) => {
        const st = checked ? (i === k ? ' ok' : ' no') : '';
        const role = checked && item.roles ? item.roles[i] : null;
        return html`<button key=${i} className=${'slot' + st} disabled=${checked} onClick=${() => rem(i)}><span className="pos">${k + 1}</span><span>${role ? html`<${Chip} k=${role} /> ` : null}<${T} s=${item.items[i]} /></span></button>`;
      }) : html`<div className="empty">Clique sur les éléments ci-dessous, dans l’ordre.</div>`}
    </div>
    ${pool.length ? html`<div className="zone"><span className="zone-label">Éléments à placer</span>
      ${pool.map(i => html`<button key=${i} className="slot" onClick=${() => add(i)}><span className="pos">+</span><span><${T} s=${item.items[i]} /></span></button>`)}</div>` : null}
    ${!checked ? html`<div className="actions"><button className="btn btn-primary" disabled=${pool.length > 0} onClick=${check}>Vérifier</button>${ans.length ? html`<button className="btn btn-sm btn-flat" onClick=${reset}><${Icon} n="reset" s=${15} />Tout reprendre</button>` : null}</div>` : null}
    ${checked ? html`<${Correction} ok=${okAll} item=${item} extra=${okAll ? null : html`<div><span className="eyebrow">Le bon ordre</span><ol>${item.items.map((t, i) => html`<li key=${i}>${item.roles ? html`<${Chip} k=${item.roles[i]} /> ` : null}<${T} s=${t} /></li>`)}</ol></div>`} />
      <div className="actions"><button className="btn btn-sm" onClick=${reset}><${Icon} n="reset" s=${15} />Recommencer</button></div>` : null}
  </div>`;
}

/* ---------- Plan modèle ---------- */
function Outline({ plan, titlesOnly, pbOnly }) {
  if (!plan) return null;
  return html`<div className="outline">
    <div className="pbox"><span className="eyebrow">Problématique</span><div><${T} s=${plan.pb} /></div></div>
    ${pbOnly ? null : html`<${Fragment}>
      <p className="count"><strong>Réponse en une phrase :</strong> <${T} s=${plan.rep} /></p>
      ${plan.parts.map((p, i) => html`<div key=${i} className="ol-part"><div className="ol-head"><span className="rn">${['I', 'II', 'III'][i]}</span><span><${T} s=${p[0]} /></span></div>
        ${titlesOnly ? null : p[1].map((s, j) => html`<div key=${j} className="ol-sub"><b>${'ABC'[j]}.</b><span><${T} s=${s} /></span></div>`)}</div>`)}
    <//>`}
  </div>`;
}

/* ---------- Prompt pour une IA ---------- */
function buildPrompt({ task, sujet, consigne, text, grid, full }) {
  const crit = grid.map((g, i) => (i + 1) + '. ' + g).join('\n');
  return `Tu es professeur de français et correcteur de l’épreuve écrite du baccalauréat de français (classe de première, France). Je suis élève de première.

J’étudie *On ne badine pas avec l’amour* d’Alfred de Musset (1834), dans le parcours « Les jeux du cœur et de la parole ».

Exercice : ${task}
Sujet : ${plain(sujet)}
Consigne : ${plain(consigne)}

Ma production :
"""
${text.trim()}
"""

Évalue ma production à l’aide de ces critères :
${crit}

Règles pour ton retour :
1. Ne réécris pas ma production et ne me donne pas de corrigé complet : je veux progresser en la reprenant moi-même.
2. Commence par deux points forts précis, en citant mes propres mots.
3. Donne ensuite au plus trois points à améliorer, du plus important au moins important. Pour chacun : ce qui ne va pas, pourquoi, et une piste concrète pour le corriger.
4. Vérifie l’exactitude de mes citations de la pièce et de leurs références (acte, scène, personnage). Si tu n’es pas certain qu’une citation soit exacte, dis-le clairement au lieu de la corriger de mémoire ou d’en inventer une.
5. Termine par une question qui m’aide à approfondir ma réflexion.
6. Écris en français, simplement, avec des phrases courtes.${full ? '\n7. Donne enfin une estimation de note sur 20, en précisant qu’elle est indicative.' : ''}`;
}
function AIPanel(props) {
  const [show, setShow] = useState(false);
  const [msg, setMsg] = useState('');
  const text = buildPrompt(props);
  return html`<div className="stage">
    <div className="stage-h"><span className="n">4</span>Demander un retour à une IA (facultatif)</div>
    <p className="count">Ton texte est placé dans une consigne prête à l’emploi. Colle-la dans l’IA de ton choix. L’IA ne réécrira pas ton travail : elle te donnera des pistes.</p>
    ${!show ? html`<div className="actions"><button className="btn" onClick=${() => setShow(true)}><${Icon} n="chat" s=${16} />Préparer la consigne</button></div>` : html`<${Fragment}>
      <textarea className="prompt-box" readOnly value=${text} aria-label="Consigne pour l’IA"></textarea>
      <div className="actions"><button className="btn btn-primary" onClick=${async () => setMsg((await copyText(text)) ? 'Consigne copiée. Colle-la dans ton IA.' : 'Copie impossible : sélectionne le texte et copie-le à la main.')}><${Icon} n="copy" s=${16} />Copier la consigne</button>${msg ? html`<span className="count" role="status">${msg}</span>` : null}</div>
      <${Msg} kind="info"><span>Les IA se trompent souvent sur les citations exactes. Vérifie toujours dans ton édition de la pièce. N’ajoute aucune information personnelle (nom, école) dans la consigne.</span></${Msg}>
    <//>`}
  </div>`;
}

/* ---------- Production écrite ---------- */
function Write({ item, id }) {
  const { store, setStore, setProg } = useApp();
  const d = (store.drafts && store.drafts[id]) || {};
  const upd = patch => setStore(s => ({ ...s, drafts: { ...(s.drafts || {}), [id]: { ...((s.drafts || {})[id] || {}), ...patch } } }));
  const text = d.text || '';
  const stage = d.stage || 0;
  const grid = GRIDS[item.grid];
  const checks = d.checks || {};
  const suj = SUJET(item.sujet);
  const model = item.plan ? null : item.model;
  return html`<div className="card">
    <div><span className="eyebrow">Sujet${suj && suj.off ? ' · ' + suj.s : ''}</span><p className="task"><${T} s=${suj ? suj.q : ''} /></p></div>
    <p className="prompt"><${T} s=${item.p} /></p>
    <div className="stage" style=${{ borderTop: 'none', paddingTop: 0 }}>
      <div className="stage-h"><span className="n">1</span>J’écris</div>
      <textarea aria-label="Ma production" value=${text} onChange=${e => upd({ text: e.target.value })} placeholder="Écris ici. Ton texte reste enregistré dans ce navigateur."></textarea>
      ${stage < 1 ? html`<div className="actions"><button className="btn btn-primary" disabled=${text.trim().length < 20} onClick=${() => upd({ stage: 1 })}>Je m’autoévalue<${Icon} n="right" s=${16} /></button>${text.trim().length < 20 ? html`<span className="count">Écris au moins une phrase.</span>` : null}</div>` : null}
    </div>
    ${stage >= 1 ? html`<div className="stage"><div className="stage-h"><span className="n">2</span>Je m’autoévalue</div>
      <p className="count">Relis ton texte, puis coche chaque point quand il est vrai.</p>
      <div className="checks">${grid.map((g, i) => html`<label key=${i}><input type="checkbox" checked=${!!checks[i]} onChange=${e => upd({ checks: { ...checks, [i]: e.target.checked } })} /><span>${fr(g)}</span></label>`)}</div>
      ${stage < 2 ? html`<div className="actions"><button className="btn btn-primary" onClick=${() => { upd({ stage: 2 }); setProg(id, 'done'); }}><${Icon} n="eye" s=${16} />Voir le corrigé modèle</button></div>` : null}
    </div>` : null}
    ${stage >= 2 ? html`<div className="stage"><div className="stage-h"><span className="n">3</span>Je compare avec le corrigé modèle</div>
      ${model ? html`<div className="model"><${T} s=${model} /></div>` : html`<${Outline} plan=${PLANS[item.plan]} />`}
      <p className="count">Un corrigé modèle n’est pas la seule réponse possible. Compare la structure : est-ce que tu as les mêmes pièces, dans le même ordre ?</p>
      <div className="actions"><button className="btn btn-sm" onClick=${() => upd({ stage: 0 })}><${Icon} n="pen" s=${15} />Reprendre mon texte</button></div>
    </div>` : null}
    ${stage >= 2 ? html`<${AIPanel} task=${item.task} sujet=${suj ? suj.q : ''} consigne=${item.p} text=${text} grid=${grid} />` : null}
  </div>`;
}

function Exercise({ item, id }) {
  if (item.t === 'mcq') return html`<${MCQ} key=${id} item=${item} id=${id} />`;
  if (item.t === 'match') return html`<${Match} key=${id} item=${item} id=${id} />`;
  if (item.t === 'order') return html`<${Order} key=${id} item=${item} id=${id} />`;
  if (item.t === 'write') return html`<${Write} key=${id} item=${item} id=${id} />`;
  return null;
}
const TYPE_LBL = { mcq: 'QCM', match: 'Associer', order: 'Remettre en ordre', write: 'Rédiger' };
const LVL_LBL = { 1: 'Reconnaître', 2: 'Organiser', 3: 'Choisir', 4: 'Produire' };

/* ---------- Comprendre (pré-apprentissage) ---------- */
function Learn({ m }) {
  const { setProg } = useApp();
  const [i, setI] = useState(0);
  const sc = m.learn[i];
  useEffect(() => { if (i === m.learn.length - 1) setProg('learn-' + m.id, 1); }, [i]);
  const spoken = sc.t + '. ' + sc.b + (sc.terms ? ' ' + sc.terms.map(t => t[0] + ' : ' + t[1]).join('. ') : '');
  return html`<div className="card">
    <div className="actions"><span className="count">Écran ${i + 1} sur ${m.learn.length}</span><span className="spacer"></span><${SpeakBtn} text=${spoken} /></div>

/* ---------- Exemple résolu ---------- */
function Worked({ m }) {

  const w = m.worked;
  const [i, setI] = useState(0);
  const [shown, setShown] = useState(false);
  const st = w.steps[i];
  const next = () => { if (i < w.steps.length - 1) { setI(i + 1); setShown(false); } };
  useEffect(() => { if (shown && i === w.steps.length - 1) setProg('worked-' + m.id, 1); }, [shown, i]);
  return html`<div className="card">
    <div><span className="eyebrow">Exemple résolu</span><h2><${T} s=${w.t} /></h2></div>
    <div className="frame"><span className="eyebrow">Consigne</span><p className="task"><${T} s=${w.task} /></p></div>
    <div className="dots" aria-label="Étapes">${w.steps.map((s, k) => html`<button key=${k} className=${'dot' + (k === i ? ' cur' : k < i ? ' past' : '')} disabled=${k > i} aria-label=${'Étape ' + (k + 1) + ' : ' + s.t} onClick=${() => { setI(k); setShown(true); }}>${k + 1}</button>`)}</div>
    <h3>Étape ${i + 1} · <${T} s=${st.t} /></h3>

      <div className=${'answer' + (st.role ? ' seg k-' + st.role : '')}>${st.role ? html`<${Chip} k=${st.role} />` : null}<div className="read"><${T} s=${st.a} /></div></div>
      <div className="why"><span className="eyebrow">Pourquoi cette étape ?</span><p><${T} s=${st.w} /></p></div>
      <div className="actions"><${SpeakBtn} text=${st.a} /><span className="spacer"></span>${i < w.steps.length - 1 ? html`<button className="btn btn-primary" onClick=${next}>Étape suivante<${Icon} n="right" s=${16} /></button>` : html`<span className="count">Exemple terminé. Entraîne-toi maintenant.</span>`}</div>
    <//>`}
    ${i > 0 ? html`<details className="more"><summary>Étapes déjà vues</summary><div className="inner"><ul className="done-list">${w.steps.slice(0, i).map((s, k) => html`<li key=${k}><span className="h">${k + 1}. ${plain(s.t)}</span><span><${T} s=${s.a} /></span></li>`)}</ul></div></details>` : null}

/* ---------- S'entraîner ---------- */
function Train({ m }) {

  if (fam == null) return html`<${Fragment}>
    <p className="lead">Les familles vont du plus simple (reconnaître) au plus complexe (produire). Fais-les dans l’ordre. Chaque exercice donne une correction simple et une correction détaillée.</p>
    <div className="fams">${m.fams.map((f, fi) => {

/* ---------- Quiz ---------- */
function QuizRun({ items, onEnd, title }) {
  const [k, setK] = useState(0);
  const [score, setScore] = useState(0);
  const [answered, setAnswered] = useState(false);
  const [end, setEnd] = useState(false);

    <p>${score === items.length ? 'Parfait. Tu maîtrises ce module.' : score >= items.length * 0.7 ? 'Bien. Relis les corrections détaillées des questions manquées.' : 'Reprends l’exemple résolu, puis les familles d’exercices, avant de refaire le quiz.'}</p>
    <div className="actions"><button className="btn" onClick=${() => { setK(0); setScore(0); setAnswered(false); setEnd(false); }}><${Icon} n="reset" s=${16} />Refaire le quiz</button></div></div>`;
  return html`<${Fragment}>
    <div className="actions"><span className="count">Question ${k + 1} sur ${items.length}</span><span className="spacer"></span><span className="count">Score : ${score}</span></div>
    <${Progress} value=${k + (answered ? 1 : 0)} max=${items.length} />
    <${MCQ} key=${k + '-' + items[k].p} item=${items[k]} onAnswer=${ok => { setAnswered(true); if (ok) setScore(s => s + 1); }} />
    ${answered ? html`<div className="actions"><span className="spacer"></span><button className="btn btn-primary" onClick=${() => { if (k < items.length - 1) { setK(k + 1); setAnswered(false); } else { setEnd(true); if (onEnd) onEnd(score); } }}>${k < items.length - 1 ? 'Question suivante' : 'Voir mon score'}<${Icon} n="right" s=${16} /></button></div>` : null}
  <//>`;
}
function Quiz({ m }) {
  const { setProg, store } = useApp();
  const best = store.prog['quiz-' + m.id];
  return html`<${Fragment}>
    <p className="lead">Un quiz court pour vérifier ce que tu retiens.${best != null ? ' Meilleur score : ' + best + ' / ' + m.quiz.length + '.' : ''}</p>
    <${QuizRun} items=${m.quiz} onEnd=${sc => setProg('quiz-' + m.id, Math.max(sc, best || 0))} />
  <//>`;
}

/* ---------- Atelier de dissertation (module 8) ---------- */
const FIELDS = (() => {
  const f = [['acc', 'intro', 'Accroche', 'acc', 'Une citation, un fait, une image, liés au sujet.'], ['pres', 'intro', 'Présentation', 'pres', 'Auteur, œuvre, date, enjeu.'], ['def', 'intro', 'Analyse du sujet', 'def', 'On cite le sujet, on définit ses mots-clés.'], ['pb', 'intro', 'Problématique', 'pb', 'La question qui fait apparaître la tension.'], ['ann', 'intro', 'Annonce du plan', 'ann', 'Les trois parties, dans l’ordre.']];
  for (let p = 0; p < 3; p++) {
    f.push(['p' + p + 'i', 'p' + p, 'Idée de la partie', 'arg', 'Une phrase qui répond au sujet.']);
    for (let s = 0; s < 3; s++) f.push(['p' + p + 's' + s, 'p' + p, 'Paragraphe ' + 'ABC'[s] + (s === 2 ? ' (facultatif)' : ''), 'ex', 'Argument, explication, citation (acte, scène), analyse, lien au sujet.']);
    if (p < 2) f.push(['t' + p, 't' + p, 'Transition', 'trans', 'Bilan de la partie, annonce de la suivante.']);
  }
  f.push(['bil', 'concl', 'Bilan', 'bil', 'Une réponse nette, qui rappelle les trois étapes.'], ['ouv', 'concl', 'Ouverture', 'ouv', 'Une œuvre précise du parcours ou de Musset.']);
  return f;
})();

  const choose = v => { setSid(v); setStore(s => ({ ...s, atelierSujet: v })); setAide(SUJET(v).off ? 1 : 3); setView('write'); };

  const field = x => html`<div key=${x[0]} className="field"><label htmlFor=${'f-' + x[0]}><${Chip} k=${x[3]}>${x[2]}</${Chip}><span className="hint">${fr(x[4])}</span></label><textarea id=${'f-' + x[0]} value=${f[x[0]] || ''} onChange=${e => setF(x[0], e.target.value)}></textarea></div>`;

    subs.forEach((s, j) => paras.push([['Partie I', 'Partie II', 'Partie III'][p] + ' · ' + 'ABC'[j], (j === 0 && idea ? idea + ' ' : '') + s, 'arg']));

    <div className="tabs" role="tablist">${[['write', 'Préparer'], ['read', 'Ma dissertation'], ['check', 'Je vérifie'], ['model', 'Corrigé et retour IA']].map(([v, l]) => html`<button key=${v} role="tab" aria-selected=${view === v} className=${'tab' + (view === v ? ' active' : '')} onClick=${() => setView(v)}>${l}</button>`)}</div>
    ${view === 'write' ? html`<${Fragment}>

      <section className="group k-pb"><h3>Introduction</h3>${FIELDS.filter(x => x[1] === 'intro').map(field)}</section>

/* ---------- Notes pour l'adulte ---------- */
function Notes() {
  return html`<div className="page"><div className="notes">

    <section><h2>Principes de conception</h2><ul>

      <li><strong>Exemple résolu avant l’exercice.</strong> Chaque module montre la démarche experte pas à pas, avec une question d’auto-explication avant chaque réponse. <span className="ref">Sweller, effet de l’exemple résolu ; Renkl, auto-explication.</span></li>
      <li><strong>Complexité croissante et estompage.</strong> Quatre niveaux par module : reconnaître, organiser, choisir, produire. Dans l’atelier final, l’aide passe du plan visible à aucune aide. <span className="ref">Renkl et Atkinson, estompage ; Kalyuga, renversement de l’expertise.</span></li>

      <li><strong>Récupération et pratique mélangée.</strong> Quiz de fin de module et révision mélangée tirée de tous les modules. <span className="ref">Roediger et Karpicke, effet de test ; Rohrer, pratique entrelacée.</span></li>
      <li><strong>Distracteurs ciblés.</strong> Les mauvaises réponses reprennent des erreurs réelles : citation sur le bon thème mais pas sur le bon argument, plan par personnage, troisième partie molle, analyse absente.</li>
    </ul></section>
    <section><h2>Le retour par une IA</h2><ul>

      <li>La phrase « J’ai souffert souvent, je me suis trompé quelquefois, mais j’ai aimé » est empruntée à une lettre de George Sand à Musset (12 mai 1834).</li>
    </ul></section>
    <section><h2>Conseils d’utilisation</h2><ul>
      <li>Faire le premier exemple résolu ensemble, en pensant à voix haute.</li>
