  });
  const initial = (() => { const h = (location.hash || '').slice(1); return PAGES[h] ? h : 'home'; })();
  const [page, setPage] = useState(initial);
  const [drawer, setDrawer] = useState(false);
  const [pop, setPop] = useState(false);
  useEffect(() => { saveStore(store); }, [store]);
  useEffect(() => { const h = () => { const k = (location.hash || '').slice(1); if (PAGES[k]) setPage(k); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  useEffect(() => {
    const r = document.documentElement; const s = store.settings;
    r.style.setProperty('--base', s.size === 'xl' ? '20px' : s.size === 'l' ? '18px' : '16px');
    r.style.setProperty('--lh', s.airy ? '1.85' : '1.55');
    r.style.setProperty('--ls', s.airy ? '.025em' : '0em');
    r.style.setProperty('--ws', s.airy ? '.12em' : '0em');
    const dark = s.theme === 'dark' || (s.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [store.settings]);
  const go = p => { setPage(p); setDrawer(false); try { history.replaceState(null, '', '#' + p); } catch (e) {} const c = document.querySelector('.content'); if (c) c.scrollTop = 0; };
  const setProg = (k, v) => setStore(s => ({ ...s, prog: { ...s.prog, [k]: v } }));
  const setSettings = patch => setStore(s => ({ ...s, settings: { ...s.settings, ...patch } }));
  const ctx = { store, setStore, setProg, setSettings, go };
  const P = PAGES[page];
  const navItem = (id, num) => {
    const p = PAGES[id]; const st = p.m ? modStatus(p.m, store.prog) : null;
    return html`<button key=${id} className=${'nav-item' + (page === id ? ' active' : '')} aria-current=${page === id ? 'page' : undefined} onClick=${() => go(id)}>
      ${num ? html`<span className="num">${num}</span>` : null}<${Icon} n=${p.icon} /><span className="lbl">${plain(p.t)}</span>
      ${st ? html`<span className=${'st' + (st.n >= st.max ? ' done' : '')}>${st.n >= st.max ? html`<${Icon} n="check" s=${14} />` : st.n > 0 ? Math.round(100 * st.n / st.max) + ' %' : ''}</span>` : null}
    </button>`;
  };
  let body;
  if (page === 'home') body = html`<${Home} />`;
  else if (P.m) body = html`<${ModulePage} key=${page} m=${P.m} />`;
  else if (page === 'revision') body = html`<${Revision} />`;
  else if (page === 'memo') body = html`<${Memo} />`;
  else body = html`<${Notes} />`;
  return html`<${Ctx.Provider} value=${ctx}>
    <div className=${'app' + (store.settings.colors === false ? ' nocolor' : '')}>
      <header className="header">
        <button className="btn btn-flat btn-icon menu-btn" aria-label="Ouvrir le menu" onClick=${() => setDrawer(true)}><${Icon} n="menu" /></button>
        <span className="app-name">Disserter sur Musset</span><span className="sep"></span>
        <span className="page-name">${plain(P.t)}</span>
        <span className="spacer"></span>
        <button className=${'btn btn-flat' + (pop ? ' on' : '')} aria-expanded=${pop} aria-label="Affichage" onClick=${() => setPop(!pop)}><${Icon} n="sliders" /><span className="hide-sm">Affichage</span></button>
        ${pop ? html`<${Settings} onClose=${() => setPop(false)} />` : null}
      </header>
      <div className="main">
        <div className=${'scrim' + (drawer ? ' open' : '')} onClick=${() => setDrawer(false)}></div>
        <nav className=${'sidebar' + (drawer ? ' open' : '')} aria-label="Navigation">
          ${navItem('home')}
          <div className="side-label">Parcours</div>
          ${MODULES.map((m, i) => navItem(m.id, i + 1))}
          <div className="side-label">Réviser</div>
          ${navItem('revision')}${navItem('memo')}
          <div className="side-label">Aide</div>
          ${navItem('notes')}
        </nav>
        <main className="content">${body}</main>
      </div>
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
</body>
</html>
