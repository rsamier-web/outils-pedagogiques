<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commentaire composé : On ne badine pas avec l’amour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Disposition : fenêtre KDE (barre de titre + barre latérale type Configuration du système + vue principale), tiroir « Boîte à outils » à droite */
:root {
  --win: #eff0f1;
  --view: #fcfcfc;
  --alt: #f4f5f6;
  --btn: #fcfcfc;
  --text: #232629;
  --muted: #6b7680;
  --line: #d3d7da;
  --accent: #3daee9;
  --accent-ink: #1b6fa3;
  --accent-soft: rgba(61, 174, 233, 0.16);
  --pos: #27ae60;
  --neg: #da4453;
  --warn: #f67400;
  --mark-b: rgba(61, 174, 233, 0.30);
  --mark-o: rgba(246, 116, 0, 0.26);
  --an-idee: rgba(61, 174, 233, 0.22);
  --an-cit: rgba(246, 116, 0, 0.20);
  --an-proc: rgba(155, 89, 182, 0.20);
  --an-interp: rgba(39, 174, 96, 0.20);
  --an-bilan: rgba(127, 140, 141, 0.22);
  --shadow: 0 1px 2px rgba(35, 38, 41, 0.08);
  --font-ui: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-text: "Noto Serif", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #2a2e32; --view: #1e2124; --alt: #26292d; --btn: #31363b; --text: #eff0f1; --muted: #a2abb3; --line: #41474d;
    --accent-ink: #6cc3f0; --accent-soft: rgba(61, 174, 233, 0.20);
    --mark-b: rgba(61, 174, 233, 0.35); --mark-o: rgba(246, 116, 0, 0.32);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #2a2e32; --view: #1e2124; --alt: #26292d; --btn: #31363b; --text: #eff0f1; --muted: #a2abb3; --line: #41474d;
  --accent-ink: #6cc3f0; --accent-soft: rgba(61, 174, 233, 0.20);
  --mark-b: rgba(61, 174, 233, 0.35); --mark-o: rgba(246, 116, 0, 0.32);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--win); color: var(--text); font: 14.5px/1.55 var(--font-ui); }
#root { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h3, h4, h5 { text-wrap: balance; margin: 0; }
p { margin: 0; }
i { font-style: italic; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spacer { flex: 1; }
svg { width: 16px; height: 16px; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- fenêtre ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--win); border-bottom: 1px solid var(--line); flex: none; }
.app-ico { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.app-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-title .muted { font-weight: 400; }
.body { flex: 1; display: flex; min-height: 0; }
.sidebar { width: 270px; flex: none; background: var(--win); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 6px 20px; display: flex; flex-direction: column; gap: 2px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.nav-h { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 10px; }
.nav-item { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: 4px; padding: 6px 10px; cursor: pointer; line-height: 1.35; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item.on { background: var(--accent-soft); border-color: var(--accent); }
.nav-item .ico { color: var(--muted); }
.st { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
.st-started { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.st-done { border-color: var(--pos); background: var(--pos); }
main { flex: 1; overflow-y: auto; background: var(--view); min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--btn); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; box-shadow: var(--shadow); line-height: 1.3; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { border-color: var(--accent); background: var(--accent-soft); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.icon-btn { background: none; border: 1px solid transparent; border-radius: 4px; padding: 5px; cursor: pointer; color: var(--text); }
.icon-btn:hover:not(:disabled) { border-color: var(--line); background: var(--btn); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.only-m { display: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--btn); box-shadow: var(--shadow); }
.seg button { border: 0; border-right: 1px solid var(--line); background: none; padding: 6px 11px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--accent-soft); }
.seg button.on { background: var(--accent); color: #fff; }
.seg.small button { padding: 4px 10px; font-size: 13px; }
.seg button.good:not(.on) { box-shadow: inset 0 -3px 0 var(--pos); }
.seg button.on.a-ok { background: var(--pos); }
.seg button.on.a-part { background: var(--warn); }
.seg button.on.a-no { background: var(--neg); }

/* ---------- en-tête de page ---------- */
.eyebrow { font-size: 12.5px; font-weight: 600; color: var(--accent-ink); letter-spacing: .02em; }
.page-head { display: flex; flex-direction: column; gap: 8px; }
.page-head h1, .home-h h1 { font-size: 24px; font-weight: 600; }
.consigne { max-width: 75ch; }
.pim { border: 1px solid var(--line); border-radius: 6px; background: var(--alt); }
.pim-toggle { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 8px 12px; cursor: pointer; font-weight: 600; text-align: left; }
.pim-toggle .mm { font-weight: 400; color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); }
.pim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 12px 12px; }
.pim-grid b { font-size: 12.5px; color: var(--accent-ink); }
.pim-grid p { font-size: 13.5px; }

/* ---------- texte + travail ---------- */
.split { display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
.split.single { grid-template-columns: minmax(0, 1fr); max-width: 900px; }
.work { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.textpanel { position: sticky; top: 0; max-height: calc(100vh - 80px); overflow-y: auto; background: var(--alt); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.tp-head h3 { font-size: 15px; font-weight: 600; }
.tp-ref { font-size: 12.5px; color: var(--muted); }
.paratexte { font-size: 13.5px; background: var(--view); border-left: 3px solid var(--muted); padding: 8px 10px; border-radius: 0 4px 4px 0; color: var(--muted); }
.texte { display: flex; flex-direction: column; gap: 9px; font-family: var(--font-text); font-size: 15px; line-height: 1.6; }
.rep { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.rep .num { font-family: var(--font-ui); font-size: 11px; color: var(--muted); padding-top: 4px; text-align: right; font-variant-numeric: tabular-nums; }
.spk { display: block; font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; letter-spacing: .05em; color: var(--muted); }
.dida { font-style: italic; color: var(--muted); }

/* ---------- cartes ---------- */
.card { background: var(--view); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); min-width: 0; }
.card.ok { border-left: 4px solid var(--pos); }
.card.ko { border-left: 4px solid var(--neg); }
.stack { display: flex; flex-direction: column; gap: 10px; }
fieldset.card { margin: 0; }
legend { padding: 0; float: left; width: 100%; margin-bottom: 4px; }
legend + * { clear: both; }
.q { font-weight: 600; }
.badge { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; margin-right: 8px; vertical-align: 1px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-ink); margin-right: 6px; }
.tag.mini { font-size: 10.5px; margin: 0 6px 0 0; }
.opts { display: flex; flex-direction: column; gap: 4px; }
.opt { display: flex; gap: 9px; align-items: flex-start; padding: 6px 8px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; }
.opt:hover { background: var(--alt); }
.opt input { margin-top: 4px; accent-color: var(--accent); flex: none; }
.opt.good { border-color: var(--pos); background: rgba(39, 174, 96, 0.08); }
.opt.right-b { border-left: 3px solid var(--pos); }
.opt.wrong-b { border-left: 3px solid var(--neg); }
.why-inline { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.kind { font-style: normal; font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 3px; margin-left: 4px; white-space: nowrap; }
.k-ok { background: rgba(39, 174, 96, 0.16); color: var(--pos); }
.k-para { background: rgba(246, 116, 0, 0.14); color: var(--warn); }
.k-passe { background: rgba(218, 68, 83, 0.12); color: var(--neg); }
.fb { font-size: 13.5px; border-radius: 4px; padding: 8px 11px; display: flex; flex-direction: column; gap: 6px; }
.fb-info { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.fb-ok { background: rgba(39, 174, 96, 0.10); border-left: 3px solid var(--pos); }
.fb-ko { background: rgba(218, 68, 83, 0.09); border-left: 3px solid var(--neg); }
.h-sub { font-size: 16px; font-weight: 600; margin-top: 6px; }
h4 { font-size: 14.5px; font-weight: 600; }
.lab { font-weight: 600; }
textarea, input:not([type]), select { width: 100%; background: var(--view); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 1px var(--accent); }
.model { font-size: 13.5px; background: rgba(39, 174, 96, 0.09); border-left: 3px solid var(--pos); padding: 6px 9px; border-radius: 0 4px 4px 0; }
.model::before { content: "Corrigé : "; font-weight: 600; color: var(--pos); }

/* ex2 */
.row-proc blockquote { margin: 0; font-family: var(--font-text); font-size: 15px; }
.ref { font-family: var(--font-ui); font-size: 12px; color: var(--muted); }
.row-ctrl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-ctrl select { max-width: 260px; }
.answer { font-size: 13px; font-weight: 600; color: var(--pos); }

/* ex3 / exemples résolus */
.worked { background: var(--alt); }
.worked-h { font-weight: 600; }
.cit { font-family: var(--font-text); font-size: 15px; }
.levels { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.lvl { border-radius: 4px; padding: 7px 10px; background: var(--view); border: 1px solid var(--line); }
.lvl-ok { border-color: var(--pos); }
.lvl-tag { font-size: 11.5px; font-weight: 600; }
.lvl-ok .lvl-tag { color: var(--pos); } .lvl-para .lvl-tag { color: var(--warn); } .lvl-passe .lvl-tag { color: var(--neg); }
.lvl .why, .why { font-size: 13px; color: var(--muted); }

/* ex4 surlignage */
.pens { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pen { border: 1px solid var(--line); background: var(--btn); border-radius: 4px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; box-shadow: var(--shadow); }
.pen::before { content: ""; width: 14px; height: 14px; border-radius: 3px; }
.pen-B::before { background: var(--mark-b); border: 1px solid var(--accent); }
.pen-O::before { background: var(--mark-o); border: 1px solid var(--warn); }
.pen-X::before { background: var(--view); border: 1px dashed var(--muted); }
.pen.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.hl-text { font-family: var(--font-text); font-size: 15.5px; line-height: 1.75; gap: 10px; }
.hl-text .paratexte { font-family: var(--font-ui); }
.seg-t { font-family: inherit; font-size: inherit; line-height: inherit; background: none; border: 0; padding: 1px 2px; border-radius: 3px; cursor: pointer; text-align: left; box-decoration-break: clone; -webkit-box-decoration-break: clone; display: inline; border-bottom: 1px dotted var(--line); }
.seg-t:hover { background: var(--alt); }
.seg-t.hl-B { background: var(--mark-b); }
.seg-t.hl-O { background: var(--mark-o); }
.seg-t.right { border-bottom: 2px solid var(--pos); }
.seg-t.wrong { border-bottom: 2px solid var(--neg); }

/* ex5 tableau */
.tablewrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; min-width: 560px; background: var(--view); border: 1px solid var(--line); border-radius: 6px; }
.ptable th { text-align: left; font-size: 12.5px; font-weight: 600; background: var(--alt); padding: 7px 9px; border-bottom: 1px solid var(--line); }
.ptable td { vertical-align: top; padding: 8px 9px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ptable td.n { width: 46px; color: var(--muted); }
.ptable td .cit { font-size: 14px; }
.ptable td .model { margin-top: 6px; }
.idee { flex-direction: row; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.autoeval { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.checks li { display: flex; gap: 7px; align-items: center; }
.c-ok { color: var(--pos); }
.c-no { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); margin: 0 3.5px; flex: none; }

/* ex7 plan */
.parts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.part { background: var(--alt); display: block; }
.part ul { margin-top: 6px !important; }
.card > .tag { align-self: flex-start; }
.part ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.carte { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.carte p { flex: 1 1 260px; }
.carte .why { flex-basis: 100%; }
.plan-detail h4 { margin: 4px 0 6px; }
.sp { padding: 4px 0 6px 14px; border-left: 2px solid var(--line); margin-bottom: 4px; }
.sp p { font-size: 13.5px; }

/* ex8 paragraphe */
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.annotated { font-family: var(--font-text); font-size: 15px; line-height: 1.8; text-indent: 1.5em; }
.an { border-radius: 3px; padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.legend .an { padding: 2px 8px; font-weight: 600; }
.an-idee { background: var(--an-idee); } .an-cit { background: var(--an-cit); } .an-proc { background: var(--an-proc); } .an-interp { background: var(--an-interp); } .an-bilan { background: var(--an-bilan); }
.fields { gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; padding-left: 10px; border-left: 4px solid; }
.field label { font-size: 13px; font-weight: 600; }
.f-idee { border-color: var(--an-idee); } .f-cit { border-color: var(--an-cit); } .f-proc { border-color: var(--an-proc); } .f-interp { border-color: var(--an-interp); } .f-bilan { border-color: var(--an-bilan); }
.assembled, .model-p { font-family: var(--font-text); font-size: 15px; line-height: 1.7; text-indent: 1.5em; }

/* ex9 */
.reorder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ro { flex-direction: row; align-items: center; gap: 10px; }
.ro .num { font-weight: 700; color: var(--muted); width: 18px; flex: none; font-variant-numeric: tabular-nums; }
.ro p { flex: 1; }
.ro-btns { display: flex; flex-direction: column; }

/* ex10 */
.chrono { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--alt); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.chrono .time { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hints-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hints ol { margin: 0; padding-left: 20px; font-size: 13.5px; }
.stepper { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.stepper button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 7px; margin-bottom: -1px; }
.stepper button.on { border-bottom-color: var(--accent); font-weight: 600; }
.sn { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--alt); border: 1px solid var(--line); }
.stepper button.on .sn { background: var(--accent); color: #fff; border-color: var(--accent); }
.amg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.amg-f label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 3px; }
.planform { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.pf { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; }
.pf label { font-weight: 600; font-size: 13px; }
.pf.sub { margin-left: 24px; }
.copyrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ticks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.ticks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.ticks input { margin-top: 4px; accent-color: var(--accent); }
.letter { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; }
.redige { font-family: var(--font-text); font-size: 15px; line-height: 1.7; }
.rb p { text-indent: 1.5em; margin-top: 4px; }
.rb + .rb { margin-top: 8px; }

/* contrôles et pagination */
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0 0; border-top: 1px solid var(--line); margin-top: 4px; }
.score { font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 3px; background: rgba(246, 116, 0, 0.14); color: var(--warn); }
.score.full { background: rgba(39, 174, 96, 0.15); color: var(--pos); }
.pager { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }

/* tiroir */
.drawer { width: 340px; flex: none; background: var(--win); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.drawer-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; cursor: pointer; font-size: 13px; margin-bottom: -1px; }
.tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
.drawer-b { overflow-y: auto; padding: 10px 14px 24px; font-size: 13.5px; }
.drawer-b h5 { font-size: 12.5px; color: var(--accent-ink); margin: 10px 0 4px; }
dl { margin: 0; }
dt { font-weight: 600; margin-top: 6px; }
dd { margin: 0 0 2px; color: var(--muted); }
.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* accueil */
.home-h { display: flex; flex-direction: column; gap: 8px; }
.lead { max-width: 70ch; font-size: 15.5px; }
.levels-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lvl-h { display: flex; gap: 12px; align-items: flex-start; }
.lvl-n { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.lvl-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.link-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 2px; cursor: pointer; text-align: left; }
.link-row:hover span:first-child { color: var(--accent-ink); }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.p-started { border-color: var(--warn); color: var(--warn); }
.p-done { border-color: var(--pos); color: var(--pos); }
.teacher { padding: 0; }
.teacher .pim-toggle { padding: 10px 14px; }
.teacher-b { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
.start { display: flex; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .with-tools .split { grid-template-columns: minmax(0, 1fr); }
  .with-tools .textpanel { position: static; max-height: 46vh; }
}
@media (max-width: 900px) {
  .only-m { display: block; }
  .sidebar { position: fixed; top: 45px; bottom: 0; left: 0; z-index: 20; transform: translateX(-100%); transition: transform .18s; box-shadow: 2px 0 8px rgba(0,0,0,.15); }
  .sidebar.open { transform: none; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .textpanel { position: static; max-height: 46vh; }
  .drawer { position: fixed; right: 0; top: 45px; bottom: 0; z-index: 30; width: min(360px, 92vw); box-shadow: -2px 0 8px rgba(0,0,0,.15); }
  .app-title .muted { display: none; }
}
@media (max-width: 640px) {
  .page { padding: 16px 16px 32px; }
  .levels-grid, .parts, .two, .amg, .pim-grid { grid-template-columns: minmax(0, 1fr); }
  .pf { grid-template-columns: 1fr; gap: 2px; }
  .pf.sub { margin-left: 12px; }
  .hide-s { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(()=>{var R={A:{ref:"Acte I, sc\xE8ne 3",titre:"Des retrouvailles glac\xE9es",contexte:"Perdican et Camille, cousins \xE9lev\xE9s ensemble, se retrouvent apr\xE8s dix ans de s\xE9paration. Le Baron, p\xE8re de Perdican, souhaite les marier. Il vient de les laisser seuls.",repliques:[{s:"PERDICAN",t:"Sais-tu que cela n\u2019a rien de beau, Camille, de m\u2019avoir refus\xE9 un baiser ?"},{s:"CAMILLE",t:"Je suis comme cela ; c\u2019est ma mani\xE8re."},{s:"PERDICAN",t:"Veux-tu mon bras pour faire un tour dans le village ?"},{s:"CAMILLE",t:"Non, je suis lasse."},{s:"PERDICAN",t:"Cela ne te ferait pas plaisir de revoir la prairie ? Te souviens-tu de nos parties sur le bateau ? Viens, nous descendrons jusqu\u2019aux moulins ; je tiendrai les rames, et toi le gouvernail."},{s:"CAMILLE",t:"Je n\u2019en ai nulle envie."},{s:"PERDICAN",t:"Tu me fends l\u2019\xE2me. Quoi ! Pas un souvenir, Camille ? pas un battement de c\u0153ur pour notre enfance, pour tout ce pauvre temps pass\xE9, si bon, si doux, si plein de niaiseries d\xE9licieuses ? Tu ne veux pas venir voir le sentier par o\xF9 nous allions \xE0 la ferme ?"},{s:"CAMILLE",t:"Non, pas ce soir."},{s:"PERDICAN",t:"Pas ce soir ! et quand donc ? Toute notre vie est l\xE0."},{s:"CAMILLE",t:"Je ne suis pas assez jeune pour m\u2019amuser de mes poup\xE9es, ni assez vieille pour aimer le pass\xE9."},{s:"PERDICAN",t:"Comment dis-tu cela ?"},{s:"CAMILLE",t:"Je dis que les souvenirs d\u2019enfance ne sont pas de mon go\xFBt."},{s:"PERDICAN",t:"Cela t\u2019ennuie ?"},{s:"CAMILLE",t:"Oui, cela m\u2019ennuie."},{s:"PERDICAN",t:"Pauvre enfant ! Je te plains sinc\xE8rement.",d:"Ils sortent chacun de leur c\xF4t\xE9."}]},B:{ref:"Acte II, sc\xE8ne 5",titre:"La tirade de Perdican",contexte:"Camille vient d\u2019annoncer qu\u2019elle retourne au couvent : les religieuses lui ont racont\xE9 leurs malheurs amoureux et l\u2019ont convaincue de renoncer \xE0 l\u2019amour humain. Perdican lui r\xE9pond.",repliques:[{s:"CAMILLE",t:"Ni pour moi, n\u2019est-ce pas ?"},{s:"PERDICAN",t:"Adieu, Camille, retourne \xE0 ton couvent, et lorsqu\u2019on te fera de ces r\xE9cits hideux qui t\u2019ont empoisonn\xE9e, r\xE9ponds ce que je vais te dire : Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux ou l\xE2ches, m\xE9prisables et sensuels ; toutes les femmes sont perfides, artificieuses, vaniteuses, curieuses et d\xE9prav\xE9es ; le monde n\u2019est qu\u2019un \xE9gout sans fond o\xF9 les phoques les plus informes rampent et se tordent sur des montagnes de fange ; mais il y a au monde une chose sainte et sublime, c\u2019est l\u2019union de deux de ces \xEAtres si imparfaits et si affreux. On est souvent tromp\xE9 en amour, souvent bless\xE9 et souvent malheureux ; mais on aime, et quand on est sur le bord de sa tombe, on se retourne pour regarder en arri\xE8re, et on se dit : J\u2019ai souffert souvent, je me suis tromp\xE9 quelquefois, mais j\u2019ai aim\xE9. C\u2019est moi qui ai v\xE9cu, et non pas un \xEAtre factice cr\xE9\xE9 par mon orgueil et mon ennui.",d:"Il sort."}]},C:{ref:"Acte III, sc\xE8ne 3",titre:"La sc\xE8ne de la fontaine",contexte:"Perdican a intercept\xE9 une lettre o\xF9 Camille se vante d\u2019avoir d\xE9sesp\xE9r\xE9 son pr\xE9tendant. Piqu\xE9 dans son orgueil, il lui donne rendez-vous pr\xE8s de la fontaine, puis y arrive avec Rosette, jeune paysanne et s\u0153ur de lait de Camille. Camille s\u2019est cach\xE9e derri\xE8re un arbre.",repliques:[{s:"CAMILLE, cach\xE9e, \xE0 part",t:"Que veut dire cela ? Il la fait asseoir pr\xE8s de lui ? Me demande-t-il un rendez-vous pour y venir causer avec une autre ? Je suis curieuse de savoir ce qu\u2019il lui dit."},{s:"PERDICAN, \xE0 haute voix, de mani\xE8re que Camille l\u2019entende",t:"Je t\u2019aime, Rosette ! toi seule au monde, tu n\u2019as rien oubli\xE9 de nos beaux jours pass\xE9s ; toi seule, tu te souviens de la vie qui n\u2019est plus ; prends ta part de ma vie nouvelle ; donne-moi ton c\u0153ur, ch\xE8re enfant ; voil\xE0 le gage de notre amour.",d:"Il lui pose sa cha\xEEne sur le cou."},{s:"ROSETTE",t:"Vous me donnez votre cha\xEEne d\u2019or ?"},{s:"PERDICAN",t:"Regarde \xE0 pr\xE9sent cette bague. L\xE8ve-toi et approchons-nous de cette fontaine. Nous vois-tu tous les deux, dans la source, appuy\xE9s l\u2019un sur l\u2019autre ? Vois-tu tes beaux yeux pr\xE8s des miens, ta main dans la mienne ? Regarde tout cela s\u2019effacer. (Il jette sa bague dans l\u2019eau.) Regarde comme notre image a disparu ; la voil\xE0 qui revient peu \xE0 peu ; l\u2019eau qui s\u2019\xE9tait troubl\xE9e reprend son \xE9quilibre ; elle tremble encore ; de grands cercles noirs courent \xE0 sa surface ; patience, nous reparaissons ; d\xE9j\xE0 je distingue de nouveau tes bras enlac\xE9s dans les miens ; encore une minute, et il n\u2019y aura plus une ride sur ton joli visage ; regarde ! c\u2019\xE9tait une bague que m\u2019avait donn\xE9e Camille."},{s:"CAMILLE, \xE0 part",t:"Il a jet\xE9 ma bague dans l\u2019eau !"},{s:"PERDICAN",t:"Sais-tu ce que c\u2019est que l\u2019amour, Rosette ? \xC9coute ! le vent se tait ; la pluie du matin roule en perles sur les feuilles s\xE9ch\xE9es que le soleil ranime. Par la lumi\xE8re du ciel, par le soleil que voil\xE0, je t\u2019aime ! Tu veux bien de moi, n\u2019est-ce pas ? On n\u2019a pas fl\xE9tri ta jeunesse ? on n\u2019a pas infiltr\xE9 dans ton sang vermeil les restes d\u2019un sang affadi ? Tu ne veux pas te faire religieuse ; te voil\xE0 jeune et belle dans les bras d\u2019un jeune homme. \xD4 Rosette, Rosette ! sais-tu ce que c\u2019est que l\u2019amour ?"},{s:"ROSETTE",t:"H\xE9las ! monsieur le docteur, je vous aimerai comme je pourrai."},{s:"PERDICAN",t:"Oui, comme tu pourras ; et tu m\u2019aimeras mieux, tout docteur que je suis et toute paysanne que tu es, que ces p\xE2les statues, fabriqu\xE9es par les nonnes, qui ont la t\xEAte \xE0 la place du c\u0153ur, et qui sortent des clo\xEEtres pour venir r\xE9pandre dans la vie l\u2019atmosph\xE8re humide de leurs cellules ; tu ne sais rien ; tu ne lirais pas dans un livre la pri\xE8re que ta m\xE8re t\u2019apprend, comme elle l\u2019a apprise de sa m\xE8re ; tu ne comprends m\xEAme pas le sens des paroles que tu r\xE9p\xE8tes, quand tu t\u2019agenouilles au pied de ton lit ; mais tu comprends bien que tu pries, et c\u2019est tout ce qu\u2019il faut \xE0 Dieu."},{s:"ROSETTE",t:"Comme vous me parlez, monseigneur !"},{s:"PERDICAN",t:"Tu ne sais pas lire ; mais tu sais ce que disent ces bois et ces prairies, ces ti\xE8des rivi\xE8res, ces beaux champs couverts de moissons, toute cette nature splendide de jeunesse. Tu reconnais tous ces milliers de fr\xE8res, et moi pour l\u2019un d\u2019entre eux ; l\xE8ve-toi, tu seras ma femme, et nous prendrons racine ensemble dans la s\xE8ve du monde tout-puissant.",d:"Il sort avec Rosette."}]},D:{ref:"Acte III, sc\xE8ne 8 (derni\xE8re sc\xE8ne)",titre:"Le d\xE9nouement",contexte:"Perdican a promis d\u2019\xE9pouser Rosette pour se venger de Camille. Dans un oratoire, Camille prie seule. Perdican la rejoint ; Rosette, qu\u2019il a laiss\xE9e dans l\u2019escalier, les a suivis sans qu\u2019ils le sachent.",didascalieInitiale:"Un oratoire. Entre CAMILLE ; elle se jette au pied de l\u2019autel.",repliques:[{s:"CAMILLE",t:"M\u2019avez-vous abandonn\xE9e, \xF4 mon Dieu ? Vous le savez, lorsque je suis venue, j\u2019avais jur\xE9 de vous \xEAtre fid\xE8le ; quand j\u2019ai refus\xE9 de devenir l\u2019\xE9pouse d\u2019un autre que vous, j\u2019ai cru parler sinc\xE8rement devant vous et ma conscience ; vous le savez, mon p\xE8re ; ne voulez-vous donc plus de moi ? Oh ! pourquoi faites-vous mentir la v\xE9rit\xE9 elle-m\xEAme ? Pourquoi suis-je si faible ? Ah ! malheureuse, je ne puis plus prier !",d:"Entre Perdican."},{s:"PERDICAN",t:"Orgueil ! le plus fatal des conseillers humains, qu\u2019es-tu venu faire entre cette fille et moi ? La voil\xE0 p\xE2le et effray\xE9e, qui presse sur les dalles insensibles son c\u0153ur et son visage. Elle aurait pu m\u2019aimer, et nous \xE9tions n\xE9s l\u2019un pour l\u2019autre ; qu\u2019es-tu venu faire sur nos l\xE8vres, orgueil, lorsque nos mains allaient se joindre ?"},{s:"CAMILLE",t:"Qui m\u2019a suivie ? Qui parle sous cette vo\xFBte ? Est-ce toi, Perdican ?"},{s:"PERDICAN",t:"Insens\xE9s que nous sommes ! nous nous aimons. Quel songe avons-nous fait, Camille ? Quelles vaines paroles, quelles mis\xE9rables folies ont pass\xE9 comme un vent funeste entre nous deux ? Lequel de nous a voulu tromper l\u2019autre ? H\xE9las ! cette vie est elle-m\xEAme un si p\xE9nible r\xEAve : pourquoi encore y m\xEAler les n\xF4tres ? \xD4 mon Dieu ! le bonheur est une perle si rare dans cet oc\xE9an d\u2019ici-bas ! Tu nous l\u2019avais donn\xE9, p\xEAcheur c\xE9leste, tu l\u2019avais tir\xE9 pour nous des profondeurs de l\u2019ab\xEEme, cet inestimable joyau ; et nous, comme des enfants g\xE2t\xE9s que nous sommes, nous en avons fait un jouet. Le vert sentier qui nous amenait l\u2019un vers l\u2019autre avait une pente si douce, il \xE9tait entour\xE9 de buissons si fleuris, il se perdait dans un si tranquille horizon ! il a bien fallu que la vanit\xE9, le bavardage et la col\xE8re vinssent jeter leurs rochers informes sur cette route c\xE9leste, qui nous aurait conduits \xE0 toi dans un baiser ! Il a bien fallu que nous nous fissions du mal, car nous sommes des hommes. \xD4 insens\xE9s ! nous nous aimons.",d:"Il la prend dans ses bras."},{s:"CAMILLE",t:"Oui, nous nous aimons, Perdican ; laisse-moi le sentir sur ton c\u0153ur. Ce Dieu qui nous regarde ne s\u2019en offensera pas ; il veut bien que je t\u2019aime ; il y a quinze ans qu\u2019il le sait."},{s:"PERDICAN",t:"Ch\xE8re cr\xE9ature, tu es \xE0 moi !",d:"Il l\u2019embrasse ; on entend un grand cri derri\xE8re l\u2019autel."},{s:"CAMILLE",t:"C\u2019est la voix de ma s\u0153ur de lait."},{s:"PERDICAN",t:"Comment est-elle ici ? je l\u2019avais laiss\xE9e dans l\u2019escalier, lorsque tu m\u2019as fait rappeler. Il faut donc qu\u2019elle m\u2019ait suivi sans que je m\u2019en sois aper\xE7u."},{s:"CAMILLE",t:"Entrons dans cette galerie ; c\u2019est l\xE0 qu\u2019on a cri\xE9."},{s:"PERDICAN",t:"Je ne sais ce que j\u2019\xE9prouve ; il me semble que mes mains sont couvertes de sang."},{s:"CAMILLE",t:"La pauvre enfant nous a sans doute \xE9pi\xE9s ; elle s\u2019est encore \xE9vanouie ; viens, portons-lui secours ; h\xE9las ! tout cela est cruel."},{s:"PERDICAN",t:"Non, en v\xE9rit\xE9, je n\u2019entrerai pas ; je sens un froid mortel qui me paralyse. Vas-y, Camille, et t\xE2che de la ramener. (Camille sort.) Je vous en supplie, mon Dieu ! ne faites pas de moi un meurtrier ! Vous voyez ce qui se passe ; nous sommes deux enfants insens\xE9s, et nous avons jou\xE9 avec la vie et la mort ; mais notre c\u0153ur est pur ; ne tuez pas Rosette, Dieu juste ! Je lui trouverai un mari, je r\xE9parerai ma faute ; elle est jeune, elle sera riche, elle sera heureuse ; ne faites pas cela, \xF4 Dieu ! vous pouvez b\xE9nir encore quatre de vos enfants. Eh bien ! Camille, qu\u2019y a-t-il ?",d:"Camille rentre."},{s:"CAMILLE",t:"Elle est morte. Adieu, Perdican !"}]}},z=[{g:"Analogie",items:[["Comparaison","Rapprochement de deux \xE9l\xE9ments avec un outil (comme, tel, pareil \xE0\u2026)."],["M\xE9taphore","Comparaison sans outil de comparaison."],["M\xE9taphore fil\xE9e","M\xE9taphore prolong\xE9e sur plusieurs mots ou phrases du m\xEAme r\xE9seau d\u2019images."],["Personnification","Pr\xE9sentation d\u2019une chose ou d\u2019une id\xE9e sous la forme d\u2019une personne."],["All\xE9gorie","Repr\xE9sentation concr\xE8te et imag\xE9e d\u2019une id\xE9e abstraite."]]},{g:"Insistance ou att\xE9nuation",items:[["Hyperbole","Exag\xE9ration."],["Accumulation","\xC9num\xE9ration de termes."],["Gradation","\xC9num\xE9ration selon une intensit\xE9 croissante ou d\xE9croissante."],["Anaphore","R\xE9p\xE9tition des m\xEAmes termes en d\xE9but de phrase ou de membre de phrase."],["Parall\xE9lisme","R\xE9p\xE9tition de la m\xEAme construction de phrase."],["Litote","En dire moins pour faire entendre plus."],["Euph\xE9misme","Att\xE9nuation d\u2019une id\xE9e, d\u2019un sentiment ou d\u2019une r\xE9alit\xE9."]]},{g:"Opposition",items:[["Antith\xE8se","Opposition forte entre deux termes ou deux id\xE9es."],["Oxymore","Union de deux termes de sens radicalement oppos\xE9."],["Antiphrase","Dire le contraire de ce qu\u2019on pense, avec une intention ironique."],["Chiasme","Deux expressions dont la seconde reprend la premi\xE8re dans l\u2019ordre inverse (AB / BA)."],["Paradoxe","Opinion contraire \xE0 l\u2019id\xE9e commune, pour surprendre ou faire r\xE9fl\xE9chir."]]},{g:"Substitution",items:[["M\xE9tonymie","Remplacer un mot par un autre qui lui est li\xE9 logiquement."],["P\xE9riphrase","Remplacer un mot par un groupe de mots qui le d\xE9signe."]]},{g:"Th\xE9\xE2tre et \xE9nonciation",items:[["Apostrophe","Interpellation directe d\u2019une personne ou d\u2019une entit\xE9 (\xAB \xD4 mon Dieu ! \xBB)."],["Question rh\xE9torique","Question qui n\u2019attend pas de r\xE9ponse et sert \xE0 affirmer."],["Stichomythie","\xC9change de r\xE9pliques tr\xE8s br\xE8ves, souvent dans un affrontement."],["Tirade","Longue r\xE9plique d\u2019un personnage."],["Apart\xE9","R\xE9plique que les autres personnages sont cens\xE9s ne pas entendre."],["Double \xE9nonciation","Au th\xE9\xE2tre, une r\xE9plique s\u2019adresse \xE0 la fois aux personnages et au public."],["Didascalie","Indication sc\xE9nique \xE9crite par l\u2019auteur (en italique ou entre parenth\xE8ses)."]]}],B=["Ne jamais donner son avis personnel avec \xAB je \xBB ou \xAB me \xBB. \xC9crire \xAB nous \xBB ou tournures impersonnelles.","Ne pas faire appara\xEEtre les titres des parties.","Laisser un espace pour l\u2019introduction (l\u2019\xE9crire en dernier de pr\xE9f\xE9rence).","Titre de partie = un \xE9l\xE9ment de r\xE9ponse \xE0 la probl\xE9matique.","Sous-partie = un argument qui justifie l\u2019id\xE9e de la partie.","Exemples = citation + proc\xE9d\xE9 nomm\xE9 + effet (interpr\xE9tation).","Alin\xE9a pour chaque sous-partie, sans sauter de ligne.","\xC0 la fin d\u2019une grande partie : rappeler ce qui est d\xE9montr\xE9 et annoncer la suivante (transition).","Sauter une ligne entre deux grandes parties.","Conclusion : bilan (3 \xE0 6 lignes) puis ouverture (2 \xE0 4 lignes).","Introduction en un seul paragraphe : situer le texte, probl\xE9matique, annonce du plan (grandes parties seulement).","Sauter une ligne apr\xE8s l\u2019introduction."],H=[["Commencer","Tout d\u2019abord, D\u2019abord, En premier lieu, Dans un premier temps"],["Ajouter","De plus, En outre, Par ailleurs, Ensuite, De m\xEAme"],["Opposer","Cependant, Pourtant, N\xE9anmoins, En revanche, Toutefois"],["Expliquer","En effet, Car, Puisque, C\u2019est pourquoi"],["Illustrer","Ainsi, Par exemple, Comme le montre\u2026"],["Conclure","Enfin, Finalement, Donc, En somme, Ainsi"]],S=[["N","N\xE9ant","V\xE9rifier les oublis de mots."],["S","Sons, sens et syntaxe","V\xE9rifier les sons, le sens et l\u2019ordre des mots."],["A","Accord du groupe nominal","D\xE9terminant, nom, adjectif : masculin ou f\xE9minin ? singulier ou pluriel ?"],["H","Homophones","a/\xE0, et/est, on/ont, son/sont, ces/ses/c\u2019est/s\u2019est, tous/tout, ce/se."],["I","Infinitif / participe / imparfait","Verbes en [\xE9] : prendre \u2192 -er ; pris \u2192 -\xE9(e)(s) ; prenait \u2192 imparfait."],["C","Conjugaison","Accord du verbe avec son sujet."],["P","Ponctuation","Points, virgules, guillemets autour des citations."],["M","Majuscules","En d\xE9but de phrase et aux noms propres."],["O","Orthographe des mots","V\xE9rifier la \xAB photographie \xBB du mot."]],j=[["D\xE9couvrir le texte","\u2248 45 min","Lire deux fois, rep\xE9rer le paratexte, noter ses premi\xE8res impressions, r\xE9pondre aux questions AMGETRO."],["Analyser et probl\xE9matiser","\u2248 1 h","Rep\xE9rer les proc\xE9d\xE9s (une couleur par piste), formuler la probl\xE9matique (\xAB Comment\u2026 ? \xBB, \xAB En quoi\u2026 ? \xBB), d\xE9gager 2 ou 3 axes."],["Faire le plan d\xE9taill\xE9","\u2248 1 h","Pour chaque sous-partie : une id\xE9e, 3 citations avec proc\xE9d\xE9 et interpr\xE9tation."],["R\xE9diger","\u2248 1 h 15","D\xE9veloppement, puis conclusion, puis introduction (\u2248 10 min chacune pour l\u2019intro et la conclusion)."],["Relire","\u2248 15 min","R\xE8gles d\u2019\xE9criture, coh\xE9rence, code CHAMPIONS (en partant de la fin)."]],M=[{id:"a",label:"Auteur",q:"Qui a \xE9crit cette pi\xE8ce ?",opts:["Pierre de Marivaux","Alfred de Musset","Victor Hugo"],ok:[1],expl:"Alfred de Musset (1810-1857), po\xE8te, romancier et dramaturge romantique. Sa liaison orageuse avec George Sand, rompue en 1834, nourrit la pi\xE8ce."},{id:"m",label:"Mouvement",q:"\xC0 quel mouvement litt\xE9raire la pi\xE8ce se rattache-t-elle ?",opts:["Le classicisme","Les Lumi\xE8res","Le romantisme"],ok:[2],expl:"Le romantisme. Musset m\xEAle les tons et n\xE9glige la r\xE8gle des trois unit\xE9s, comme le drame romantique th\xE9oris\xE9 par Hugo dans la pr\xE9face de Cromwell (1827)."},{id:"g",label:"Genre",q:"Quel est le genre de l\u2019\u0153uvre ?",opts:["Une trag\xE9die classique en alexandrins","Une com\xE9die en prose qui glisse vers le drame","Un roman \xE9pistolaire"],ok:[1],expl:"Le sous-titre annonce une \xAB com\xE9die en trois actes \xBB, \xE9crite en prose. Mais la fin est tragique (mort de Rosette) : la pi\xE8ce appartient au genre hybride du drame romantique."},{id:"e",label:"\xC9poque",q:"Quand la pi\xE8ce est-elle publi\xE9e ?",opts:["En 1667, sous Louis XIV","En 1834, au XIX\u1D49 si\xE8cle","En 1789, \xE0 la R\xE9volution"],ok:[1],expl:"Publi\xE9e en 1834, quatre ans apr\xE8s la bataille d\u2019Hernani (1830) qui oppose partisans du th\xE9\xE2tre classique et romantiques. Elle n\u2019est jou\xE9e qu\u2019en 1861."},{id:"t",label:"Th\xE8me",q:"Quel est le th\xE8me principal de cet extrait (I, 3) ?",opts:["La critique de la religion","Des retrouvailles amoureuses manqu\xE9es","La rivalit\xE9 entre Blazius et Bridaine"],ok:[1],expl:"Perdican tente de raviver l\u2019amour d\u2019enfance, Camille refuse tout. La religion est un th\xE8me de la pi\xE8ce, mais elle n\u2019appara\xEEt pas dans ce passage : il faut toujours partir de l\u2019extrait."},{id:"r",label:"Registre",q:"Quel registre domine dans les r\xE9pliques de Perdican ?",opts:["Le registre path\xE9tique, avec une pointe d\u2019ironie","Le registre fantastique","Le registre \xE9pique"],ok:[0],expl:"Perdican exprime sa peine (\xAB Tu me fends l\u2019\xE2me \xBB, exclamations, questions). Son emphase face aux r\xE9ponses s\xE8ches de Camille cr\xE9e aussi un l\xE9ger d\xE9calage comique."},{id:"o",label:"\u0152uvre",q:"Quelle est la place de cette sc\xE8ne dans la pi\xE8ce ?",opts:["Le d\xE9nouement","La premi\xE8re conversation en t\xEAte-\xE0-t\xEAte : le conflit se noue","La sc\xE8ne de crise o\xF9 Rosette meurt"],ok:[1],expl:"Acte I, sc\xE8ne 3 : c\u2019est le premier \xE9change seul \xE0 seul. Le refus de Camille lance toute l\u2019action (malentendu, orgueil, vengeance)."}],Q=["Accumulation","Anaphore","Antith\xE8se","Comparaison","Gradation","Hyperbole","Litote","M\xE9taphore","M\xE9taphore fil\xE9e","Oxymore","Parall\xE9lisme","Personnification","Question rh\xE9torique"],w=[{c:"Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux ou l\xE2ches, m\xE9prisables et sensuels",ref:"II, 5",ok:["Accumulation"],expl:"Une longue suite d\u2019adjectifs de m\xEAme fonction, sans ordre d\u2019intensit\xE9 : c\u2019est une accumulation. Elle cr\xE9e un effet d\u2019acharnement."},{c:"le monde n\u2019est qu\u2019un \xE9gout sans fond o\xF9 les phoques les plus informes rampent",ref:"II, 5",ok:["M\xE9taphore"],expl:"Le monde est assimil\xE9 \xE0 un \xE9gout sans outil de comparaison : c\u2019est une m\xE9taphore, d\xE9gradante ici. On accepte aussi \xAB hyperbole \xBB \xE0 l\u2019oral, mais l\u2019image est l\u2019essentiel."},{c:"vous arrivez comme la fi\xE8vre, avec le vent qui fait jaunir les bois",ref:"I, 1",ok:["Comparaison"],expl:"L\u2019outil \xAB comme \xBB rapproche Dame Pluche de la fi\xE8vre : c\u2019est une comparaison, comique et cruelle."},{c:"Orgueil ! le plus fatal des conseillers humains, qu\u2019es-tu venu faire entre cette fille et moi ?",ref:"III, 8",ok:["Personnification"],expl:"L\u2019orgueil est interpell\xE9 (apostrophe) comme une personne qui \xAB conseille \xBB et \xAB vient faire \xBB quelque chose : c\u2019est une personnification."},{c:"Je ne suis pas assez jeune pour m\u2019amuser de mes poup\xE9es, ni assez vieille pour aimer le pass\xE9.",ref:"I, 3",ok:["Parall\xE9lisme","Antith\xE8se"],expl:"Deux membres construits de la m\xEAme fa\xE7on (\xAB pas assez + adjectif + pour + infinitif \xBB) : c\u2019est un parall\xE9lisme. Il met en relief l\u2019opposition jeune / vieille (antith\xE8se, accept\xE9 aussi)."},{c:"Ton amour m\u2019e\xFBt donn\xE9 la vie, mais ton amiti\xE9 m\u2019en consolera.",ref:"II, 1",ok:["Antith\xE8se","Parall\xE9lisme"],expl:"\xAB Amour \xBB s\u2019oppose \xE0 \xAB amiti\xE9 \xBB, de part et d\u2019autre de \xAB mais \xBB : c\u2019est une antith\xE8se, renforc\xE9e par la construction parall\xE8le."},{c:"il a bien fallu que la vanit\xE9, le bavardage et la col\xE8re vinssent jeter leurs rochers informes [\u2026] Il a bien fallu que nous nous fissions du mal",ref:"III, 8",ok:["Anaphore"],expl:"\xAB Il a bien fallu que \xBB est r\xE9p\xE9t\xE9 en t\xEAte de deux phrases : c\u2019est une anaphore. Elle donne un ton de fatalit\xE9, de constat amer."},{c:"le bonheur est une perle si rare dans cet oc\xE9an d\u2019ici-bas ! Tu nous l\u2019avais donn\xE9, p\xEAcheur c\xE9leste, tu l\u2019avais tir\xE9 pour nous des profondeurs de l\u2019ab\xEEme, cet inestimable joyau",ref:"III, 8",ok:["M\xE9taphore fil\xE9e"],expl:"Perle, oc\xE9an, p\xEAcheur, profondeurs, joyau : l\u2019image marine se prolonge sur plusieurs groupes de mots. C\u2019est une m\xE9taphore fil\xE9e."},{c:"Tu me fends l\u2019\xE2me.",ref:"I, 3",ok:["Hyperbole"],expl:"Avoir \xAB l\u2019\xE2me fendue \xBB pour un refus de promenade est une exag\xE9ration : c\u2019est une hyperbole, d\u2019effet path\xE9tique (et un peu ironique)."},{c:"Lequel de nous a voulu tromper l\u2019autre ?",ref:"III, 8",ok:["Question rh\xE9torique"],expl:"Perdican n\u2019attend pas de r\xE9ponse : la question affirme qu\u2019aucun des deux n\u2019a voulu tromper l\u2019autre. C\u2019est une question rh\xE9torique."}],O={citation:"\xAB Non, je suis lasse. \xBB / \xAB Je n\u2019en ai nulle envie. \xBB / \xAB Non, pas ce soir. \xBB",procede:"R\xE9pliques br\xE8ves et n\xE9gatives de Camille",niveaux:[{k:"passe",t:"Les n\xE9gations rendent le dialogue plus vivant.",why:"Effet passe-partout : cette phrase pourrait s\u2019appliquer \xE0 n\u2019importe quel texte. Elle ne dit rien de celui-ci."},{k:"para",t:"Camille dit non \xE0 tout ce que Perdican lui propose.",why:"Paraphrase : on r\xE9p\xE8te le texte avec d\u2019autres mots, sans l\u2019interpr\xE9ter."},{k:"ok",t:"La bri\xE8vet\xE9 et la r\xE9p\xE9tition des n\xE9gations dressent un mur face aux longues r\xE9pliques nostalgiques de Perdican : la forme m\xEAme du dialogue met en sc\xE8ne la froideur de Camille et le malentendu entre les deux cousins.",why:"Interpr\xE9tation : on relie le proc\xE9d\xE9 au sens du passage (froideur, malentendu) et on montre comment la forme produit ce sens."}]},D=[{c:"\xAB Tous les hommes sont menteurs, inconstants, faux, bavards\u2026 ; toutes les femmes sont perfides, artificieuses\u2026 \xBB (II, 5)",p:"Accumulation + parall\xE9lisme hommes / femmes",opts:[{k:"passe",t:"L\u2019accumulation insiste et rend le passage plus fort."},{k:"ok",t:"Perdican noircit m\xE9thodiquement toute l\u2019humanit\xE9, sans \xE9pargner aucun sexe : ce portrait sans piti\xE9 sert de repoussoir pour mieux faire \xE9clater, juste apr\xE8s, la valeur \xAB sainte et sublime \xBB de l\u2019amour."},{k:"para",t:"Perdican dit que les hommes et les femmes ont beaucoup de d\xE9fauts."}]},{c:"\xAB Regarde tout cela s\u2019effacer. (Il jette sa bague dans l\u2019eau.) [\u2026] c\u2019\xE9tait une bague que m\u2019avait donn\xE9e Camille. \xBB (III, 3)",p:"Geste symbolique + r\xE9v\xE9lation retard\xE9e en fin de r\xE9plique",opts:[{k:"para",t:"Perdican jette la bague de Camille dans la fontaine devant Rosette."},{k:"passe",t:"La didascalie rend la sc\xE8ne plus visuelle."},{k:"ok",t:"Le geste efface symboliquement le pass\xE9 commun avec Camille, et la r\xE9v\xE9lation gard\xE9e pour la fin agit comme un coup port\xE9 : Perdican s\u2019adresse en r\xE9alit\xE9 \xE0 la jeune femme cach\xE9e, qui r\xE9agit aussit\xF4t en apart\xE9."}]},{c:"\xAB Orgueil ! le plus fatal des conseillers humains, qu\u2019es-tu venu faire entre cette fille et moi ? \xBB (III, 8)",p:"Apostrophe + personnification",opts:[{k:"ok",t:"En faisant de l\u2019orgueil un personnage qu\u2019il interpelle, Perdican nomme enfin le vrai responsable du malheur des amants : un d\xE9faut qu\u2019ils partagent et qu\u2019ils reconnaissent trop tard."},{k:"para",t:"Perdican parle \xE0 l\u2019orgueil et lui demande ce qu\u2019il fait l\xE0."},{k:"passe",t:"La personnification rend le texte plus imag\xE9."}]},{c:"\xAB Tu me fends l\u2019\xE2me. \xBB (I, 3)",p:"Hyperbole",opts:[{k:"passe",t:"L\u2019hyperbole exag\xE8re pour toucher le lecteur."},{k:"para",t:"Perdican est tr\xE8s triste que Camille refuse de se promener."},{k:"ok",t:"L\u2019exag\xE9ration path\xE9tique contraste avec la s\xE9cheresse de Camille : ce d\xE9calage de ton rend visible le malentendu, et laisse percer une l\xE9g\xE8re ironie sur l\u2019emphase du jeune docteur."}]}],T=[{r:0,t:"Sais-tu que cela n\u2019a rien de beau, Camille,",e:null},{r:0,t:"de m\u2019avoir refus\xE9 un baiser ?",e:"O"},{r:1,t:"Je suis comme cela ; c\u2019est ma mani\xE8re.",e:"O"},{r:2,t:"Veux-tu mon bras pour faire un tour dans le village ?",e:null},{r:3,t:"Non, je suis lasse.",e:"O"},{r:4,t:"Cela ne te ferait pas plaisir de revoir la prairie ?",e:"B"},{r:4,t:"Te souviens-tu de nos parties sur le bateau ?",e:"B"},{r:4,t:"Viens, nous descendrons jusqu\u2019aux moulins ; je tiendrai les rames, et toi le gouvernail.",e:"B"},{r:5,t:"Je n\u2019en ai nulle envie.",e:"O"},{r:6,t:"Tu me fends l\u2019\xE2me.",e:null},{r:6,t:"Quoi ! Pas un souvenir, Camille ? pas un battement de c\u0153ur pour notre enfance, pour tout ce pauvre temps pass\xE9, si bon, si doux, si plein de niaiseries d\xE9licieuses ?",e:"B"},{r:6,t:"Tu ne veux pas venir voir le sentier par o\xF9 nous allions \xE0 la ferme ?",e:"B"},{r:7,t:"Non, pas ce soir.",e:"O"},{r:8,t:"Pas ce soir ! et quand donc ? Toute notre vie est l\xE0.",e:"B"},{r:9,t:"Je ne suis pas assez jeune pour m\u2019amuser de mes poup\xE9es, ni assez vieille pour aimer le pass\xE9.",e:"O",alt:["B"]},{r:10,t:"Comment dis-tu cela ?",e:null},{r:11,t:"Je dis que les souvenirs d\u2019enfance ne sont pas de mon go\xFBt.",e:"O",alt:["B"]},{r:12,t:"Cela t\u2019ennuie ?",e:null},{r:13,t:"Oui, cela m\u2019ennuie.",e:"O"},{r:14,t:"Pauvre enfant ! Je te plains sinc\xE8rement.",e:null}],L={idee:"Perdican fait un \xE9loge paradoxal de l\u2019amour",rows:[{c:"\xAB Tous les hommes sont menteurs, inconstants, faux [\u2026] ; toutes les femmes sont perfides, artificieuses [\u2026] \xBB",p:"Accumulation + parall\xE9lisme hommes / femmes",e:"Portrait enti\xE8rement noir de l\u2019humanit\xE9, sans exception : Perdican semble d\u2019abord donner raison aux religieuses.",fill:["c","p","e"]},{c:"\xAB le monde n\u2019est qu\u2019un \xE9gout sans fond o\xF9 les phoques les plus informes rampent et se tordent sur des montagnes de fange \xBB",p:"M\xE9taphore fil\xE9e d\xE9gradante + hyperbole",e:"Vision repoussante, presque animale, du monde : elle prolonge le pessimisme et pr\xE9pare le renversement par contraste.",fill:["c","p"]},{c:"\xAB mais il y a au monde une chose sainte et sublime, c\u2019est l\u2019union de deux de ces \xEAtres si imparfaits et si affreux \xBB",p:"Antith\xE8se introduite par \xAB mais \xBB + lexique du sacr\xE9",e:"Renversement : l\u2019amour est sacralis\xE9. Perdican r\xE9pond au couvent sur son propre terrain, en employant le vocabulaire religieux pour d\xE9fendre l\u2019amour humain.",fill:["c"]},{c:"\xAB J\u2019ai souffert souvent, je me suis tromp\xE9 quelquefois, mais j\u2019ai aim\xE9. \xBB",p:"Rythme ternaire + discours direct \xE0 la 1\u02B3\u1D49 personne (maxime)",e:"La phrase sonne comme une \xE9pitaphe : l\u2019amour justifie une vie enti\xE8re, malgr\xE9 la souffrance. Ironie tragique : Perdican condamne \xAB l\u2019orgueil \xBB, qui causera pourtant sa perte.",fill:[]}],intention:"Musset fait de Perdican le porte-parole d\u2019une vision romantique de l\u2019amour : imparfait, douloureux, mais seule exp\xE9rience qui donne sens \xE0 la vie. Le discours r\xE9pond point par point \xE0 l\u2019enseignement du couvent."},A={opts:[{t:"Qu\u2019est-ce qui se passe dans cette sc\xE8ne ?",ok:!1,why:"Trop vague : elle appelle un r\xE9sum\xE9, pas une analyse. Une probl\xE9matique contient un enjeu, une tension."},{t:"Perdican aime-t-il vraiment Rosette ?",ok:!1,why:"Question ferm\xE9e (oui / non) qui porte sur un personnage et non sur le fonctionnement du texte."},{t:"En quoi cette sc\xE8ne de s\xE9duction est-elle en r\xE9alit\xE9 un pi\xE8ge adress\xE9 \xE0 Camille, qui transforme la parole amoureuse en arme ?",ok:!0,why:"Elle porte sur l\u2019extrait, commence par \xAB En quoi \xBB, et formule une tension (s\xE9duction apparente / vengeance r\xE9elle). Elle contient d\xE9j\xE0 les deux parties du plan."},{t:"Comment Musset critique-t-il la religion dans toute la pi\xE8ce ?",ok:!1,why:"Hors sujet : elle porte sur l\u2019\u0153uvre enti\xE8re et sur un th\xE8me secondaire de l\u2019extrait."},{t:"Quelles sont les figures de style de cette sc\xE8ne ?",ok:!1,why:"Elle m\xE8ne \xE0 un catalogue de proc\xE9d\xE9s. Les proc\xE9d\xE9s sont des preuves, pas l\u2019objet du commentaire."}],modele:"Nous verrons en quoi cette sc\xE8ne de s\xE9duction constitue en r\xE9alit\xE9 un pi\xE8ge tendu \xE0 Camille, qui transforme la parole amoureuse en arme."},y={problematique:"En quoi cette sc\xE8ne de s\xE9duction est-elle en r\xE9alit\xE9 un pi\xE8ge adress\xE9 \xE0 Camille ?",parties:[{id:"I",t:"Une d\xE9claration d\u2019amour lyrique adress\xE9e \xE0 Rosette"},{id:"II",t:"Un discours \xE0 double destinataire : une arme contre Camille"}],cartes:[{id:1,t:"Un lyrisme amoureux : exclamations, apostrophes, \xAB Je t\u2019aime, Rosette ! \xBB",ok:"I",why:"Marques du lyrisme : expression des sentiments \xE0 la 1\u02B3\u1D49 personne, exclamations."},{id:2,t:"Une nature prise \xE0 t\xE9moin : le vent qui se tait, la pluie \xAB en perles \xBB, le soleil",ok:"I",why:"La nature complice embellit la d\xE9claration : registre lyrique."},{id:3,t:"Rosette valoris\xE9e : elle \xAB ne sait pas lire \xBB mais comprend la nature",ok:"I",why:"Perdican fait l\u2019\xE9loge de la simplicit\xE9 de Rosette, unie \xE0 la nature."},{id:4,t:"La didascalie : Perdican parle \xAB \xE0 haute voix, de mani\xE8re que Camille l\u2019entende \xBB",ok:"II",why:"Preuve directe que la sc\xE8ne est jou\xE9e pour Camille : double destinataire."},{id:5,t:"La bague jet\xE9e dans la fontaine : le pass\xE9 avec Camille effac\xE9",ok:"II",why:"Geste symbolique et cruel visant Camille, qui r\xE9agit en apart\xE9."},{id:6,t:"Les attaques contre le couvent : \xAB ces p\xE2les statues [\u2026] qui ont la t\xEAte \xE0 la place du c\u0153ur \xBB",ok:"II",why:"Portrait \xE0 peine voil\xE9 de Camille, form\xE9e par les nonnes."},{id:7,t:"La mort de Rosette \xE0 la fin de la pi\xE8ce",ok:"X",why:"Hors extrait. Elle peut nourrir la conclusion (ironie tragique), pas le d\xE9veloppement."},{id:8,t:"Le comique de Ma\xEEtre Blazius et de Ma\xEEtre Bridaine",ok:"X",why:"Hors sujet : ces personnages n\u2019apparaissent pas dans la sc\xE8ne."}],detail:[{p:"I. Une d\xE9claration d\u2019amour lyrique adress\xE9e \xE0 Rosette",s:[["A. L\u2019expression exalt\xE9e du sentiment","\xAB Je t\u2019aime, Rosette ! \xBB ; \xAB \xD4 Rosette, Rosette ! \xBB : exclamations, apostrophe, r\xE9p\xE9tition du pr\xE9nom \u2192 lyrisme de la passion."],["B. Une nature complice","\xAB la pluie du matin roule en perles sur les feuilles s\xE9ch\xE9es que le soleil ranime \xBB ; \xAB Par la lumi\xE8re du ciel, par le soleil que voil\xE0 \xBB \u2192 le cosmos devient t\xE9moin du serment."],["C. L\u2019\xE9loge de la simplicit\xE9","\xAB Tu ne sais pas lire ; mais tu sais ce que disent ces bois \xBB ; \xAB nous prendrons racine ensemble dans la s\xE8ve du monde \xBB \u2192 m\xE9taphore v\xE9g\xE9tale : un amour naturel et vivant."]]},{p:"II. Un discours \xE0 double destinataire : une arme contre Camille",s:[["A. Une sc\xE8ne jou\xE9e pour une spectatrice cach\xE9e","Didascalie \xAB \xE0 haute voix, de mani\xE8re que Camille l\u2019entende \xBB ; anaphore \xAB toi seule \xBB \u2192 Camille, qui a reni\xE9 leurs souvenirs, est exclue."],["B. Le geste cruel de la bague","\xAB Regarde tout cela s\u2019effacer \xBB ; \xAB c\u2019\xE9tait une bague que m\u2019avait donn\xE9e Camille \xBB ; apart\xE9 \xAB Il a jet\xE9 ma bague dans l\u2019eau ! \xBB \u2192 le coup porte."],["C. Une satire du couvent qui vise Camille","\xAB ces p\xE2les statues, fabriqu\xE9es par les nonnes, qui ont la t\xEAte \xE0 la place du c\u0153ur \xBB ; \xAB Tu ne veux pas te faire religieuse \xBB \u2192 antith\xE8se Rosette / Camille, vie / mort."]]}]},P={exemple:[{k:"idee",t:"Tout d\u2019abord, la d\xE9claration de Perdican est un spectacle mont\xE9 \xE0 l\u2019intention d\u2019une spectatrice cach\xE9e."},{k:"cit",t:" La didascalie le pr\xE9cise sans ambigu\xEFt\xE9 : il parle \xAB \xE0 haute voix, de mani\xE8re que Camille l\u2019entende \xBB."},{k:"proc",t:" Ce dispositif de double \xE9nonciation fait de Rosette une destinataire apparente, tandis que la v\xE9ritable destinataire est Camille, dissimul\xE9e derri\xE8re un arbre."},{k:"interp",t:" D\xE8s lors, chaque mot devient une fl\xE8che lanc\xE9e vers la jeune femme : l\u2019anaphore \xAB toi seule au monde, tu n\u2019as rien oubli\xE9 [\u2026] ; toi seule, tu te souviens \xBB l\u2019exclut implicitement, elle qui a reni\xE9 leurs souvenirs \xE0 l\u2019acte I."},{k:"bilan",t:" La parole amoureuse se change ainsi en arme de jalousie."}],champs:[{k:"idee",l:"1. Id\xE9e directrice (avec connecteur)",ph:"De plus, Perdican accompagne ses paroles d\u2019un geste\u2026"},{k:"cit",l:"2. Citation(s) entre guillemets, int\xE9gr\xE9e(s) \xE0 la phrase",ph:"Il jette dans la fontaine la bague\u2026"},{k:"proc",l:"3. Proc\xE9d\xE9 nomm\xE9",ph:"La description de l\u2019eau qui se trouble constitue\u2026"},{k:"interp",l:"4. Interpr\xE9tation : quel effet ? quel sens ?",ph:"Le pass\xE9 commun est effac\xE9\u2026"},{k:"bilan",l:"5. Mini-bilan",ph:"L\u2019objet devient ainsi\u2026"}],modele:[{k:"idee",t:"De plus, Perdican accompagne ses paroles d\u2019un geste symbolique d\u2019une grande cruaut\xE9."},{k:"cit",t:" Apr\xE8s avoir invit\xE9 Rosette \xE0 contempler leur reflet, il jette dans la fontaine une bague dont il ne r\xE9v\xE8le l\u2019origine qu\u2019\xE0 la fin de sa r\xE9plique : \xAB c\u2019\xE9tait une bague que m\u2019avait donn\xE9e Camille \xBB."},{k:"proc",t:" La description de l\u2019eau qui se trouble puis \xAB reprend son \xE9quilibre \xBB fonctionne comme une m\xE9taphore du lien avec Camille, effac\xE9 pour laisser appara\xEEtre un nouveau couple : \xAB d\xE9j\xE0 je distingue de nouveau tes bras enlac\xE9s dans les miens \xBB."},{k:"interp",t:" La r\xE9v\xE9lation retard\xE9e produit un effet de chute calcul\xE9, et l\u2019apart\xE9 de Camille, \xAB Il a jet\xE9 ma bague dans l\u2019eau ! \xBB, montre que le coup a port\xE9."},{k:"bilan",t:" L\u2019objet devient le langage muet de l\u2019orgueil bless\xE9."}]},E={intro:[{k:"Amorce",t:"Au XIX\u1D49 si\xE8cle, le drame romantique revendique la libert\xE9 de m\xEAler le rire et les larmes, au m\xE9pris des r\xE8gles classiques."},{k:"Pr\xE9sentation de l\u2019\u0153uvre",t:"En 1834, Alfred de Musset publie On ne badine pas avec l\u2019amour, une \xAB com\xE9die \xBB en prose qui glisse peu \xE0 peu vers le drame."},{k:"Situation de l\u2019extrait",t:"Dans la sc\xE8ne 3 de l\u2019acte III, Perdican, bless\xE9 dans son orgueil par une lettre de Camille, fait la cour \xE0 Rosette pr\xE8s de la fontaine, sous les yeux de sa cousine cach\xE9e."},{k:"Probl\xE9matique",t:"Nous verrons en quoi cette sc\xE8ne de s\xE9duction constitue en r\xE9alit\xE9 un pi\xE8ge tendu \xE0 Camille."},{k:"Annonce du plan",t:"Nous \xE9tudierons d\u2019abord la d\xE9claration lyrique adress\xE9e \xE0 Rosette, puis nous montrerons qu\u2019il s\u2019agit d\u2019un discours \xE0 double destinataire, v\xE9ritable arme contre Camille."}],bilan:"Ainsi, sous l\u2019apparence d\u2019une d\xE9claration lyrique \xE0 une jeune paysanne, cette sc\xE8ne met en place un pi\xE8ge : Perdican fait de la parole amoureuse, de la nature et m\xEAme d\u2019un objet les instruments d\u2019une vengeance dirig\xE9e contre Camille.",ouvertures:[{t:"Ce jeu de la jalousie rappelle Les Fausses Confidences de Marivaux (1737), o\xF9 le langage de la s\xE9duction sert aussi de stratag\xE8me ; mais chez Marivaux le badinage se termine par un mariage, alors que chez Musset il m\xE8nera \xE0 la mort de Rosette.",ok:!0,why:"Excellente ouverture : lien pr\xE9cis avec une autre \u0153uvre, et une diff\xE9rence qui \xE9claire le texte \xE9tudi\xE9."},{t:"On peut se demander si l\u2019amour v\xE9ritable existe vraiment.",ok:!1,why:"Question g\xE9n\xE9rale sans lien pr\xE9cis avec le texte : elle n\u2019ouvre sur rien de concret."},{t:"Le tableau de Gainsborough, Conversation dans un parc (vers 1746-1748), montre lui aussi un jeu de regards o\xF9 la r\xE9serve affich\xE9e par la jeune femme cache peut-\xEAtre un sentiment.",ok:!0,why:"Recevable : ouverture vers un autre art, avec un point commun pr\xE9cis (contradiction entre apparence et sentiment)."},{t:"Dans la suite de la pi\xE8ce, Perdican et Camille s\u2019avouent leur amour, puis Rosette meurt.",ok:!1,why:"C\u2019est un r\xE9sum\xE9 de la suite, pas une ouverture. On peut toutefois l\u2019utiliser bri\xE8vement pour souligner l\u2019ironie tragique."}]},C={coupsDePouce:["Observe le cadre : un oratoire, une pri\xE8re. Comment le langage religieux se m\xEAle-t-il \xE0 l\u2019aveu amoureux ?","Rep\xE8re la place exacte du cri de Rosette par rapport au baiser. Que produit ce moment ?","Compare la longueur des r\xE9pliques au d\xE9but et \xE0 la fin de la sc\xE8ne.","Pense au titre de la pi\xE8ce : en quoi cette sc\xE8ne lui donne-t-elle son sens ?"],problematique:"Comment cette sc\xE8ne de r\xE9conciliation, qui devrait couronner une com\xE9die, se renverse-t-elle en d\xE9nouement tragique ?",plan:[{p:"I. Un aveu enfin lib\xE9r\xE9",s:[["A. L\u2019orgueil d\xE9sign\xE9 comme coupable","Apostrophe et personnification \xAB Orgueil ! le plus fatal des conseillers humains \xBB ; question rh\xE9torique \xAB Lequel de nous a voulu tromper l\u2019autre ? \xBB \u2192 lucidit\xE9 tardive des amants."],["B. Un lyrisme amoureux et religieux","M\xE9taphore fil\xE9e \xAB perle\u2026 oc\xE9an\u2026 p\xEAcheur c\xE9leste\u2026 inestimable joyau \xBB ; refrain \xAB Insens\xE9s que nous sommes ! nous nous aimons \xBB / \xAB \xD4 insens\xE9s ! nous nous aimons \xBB ; Camille : \xAB il y a quinze ans qu\u2019il le sait \xBB \u2192 amour humain et amour divin r\xE9concili\xE9s."]]},{p:"II. Un renversement tragique",s:[["A. Le cri de Rosette : un coup de th\xE9\xE2tre","Didascalie \xAB Il l\u2019embrasse ; on entend un grand cri derri\xE8re l\u2019autel \xBB \u2192 le malheur surgit \xE0 l\u2019instant m\xEAme du bonheur ; \xAB il me semble que mes mains sont couvertes de sang \xBB \u2192 pressentiment de culpabilit\xE9."],["B. Un d\xE9nouement qui accomplit le proverbe","Pri\xE8re \xAB ne faites pas de moi un meurtrier ! \xBB ; \xAB nous avons jou\xE9 avec la vie et la mort \xBB (lexique du jeu = badinage) ; r\xE9plique finale tr\xE8s br\xE8ve \xAB Elle est morte. Adieu, Perdican ! \xBB \u2192 rupture de rythme, s\xE9paration d\xE9finitive."]]}],corrige:[{h:"Introduction",t:"Au XIX\u1D49 si\xE8cle, le drame romantique revendique le droit de m\xEAler les tons et de faire basculer le rire dans les larmes. En 1834, Alfred de Musset publie On ne badine pas avec l\u2019amour, une \xAB com\xE9die \xBB en trois actes \xE9crite au lendemain de sa rupture avec George Sand. La pi\xE8ce met en sc\xE8ne deux cousins, Perdican et Camille, qui s\u2019aiment depuis l\u2019enfance mais que l\u2019orgueil emp\xEAche de se l\u2019avouer ; par d\xE9pit, Perdican a promis d\u2019\xE9pouser Rosette, la s\u0153ur de lait de Camille. Dans la derni\xE8re sc\xE8ne, les deux jeunes gens se retrouvent dans un oratoire et s\u2019avouent enfin leur amour, avant que le cri de Rosette ne vienne tout an\xE9antir. Nous nous demanderons comment cette sc\xE8ne de r\xE9conciliation, qui devrait couronner une com\xE9die, se renverse en d\xE9nouement tragique. Nous verrons d\u2019abord qu\u2019elle lib\xE8re enfin un aveu longtemps retenu, puis qu\u2019elle op\xE8re un renversement brutal qui donne tout son sens au titre de la pi\xE8ce."},{h:"I. A",t:"Tout d\u2019abord, Perdican identifie enfin le v\xE9ritable responsable de leur malheur. Son entr\xE9e prend la forme d\u2019une apostrophe solennelle : \xAB Orgueil ! le plus fatal des conseillers humains, qu\u2019es-tu venu faire entre cette fille et moi ? \xBB. La personnification transforme ce d\xE9faut en un personnage ext\xE9rieur qui se serait gliss\xE9 \xAB entre \xBB les amants, comme un intrus. La question est reprise \xE0 la fin de la r\xE9plique, \xAB qu\u2019es-tu venu faire sur nos l\xE8vres, orgueil \xBB, ce qui souligne l\u2019obsession de Perdican. De m\xEAme, la question rh\xE9torique \xAB Lequel de nous a voulu tromper l\u2019autre ? \xBB affirme qu\u2019aucun des deux n\u2019\xE9tait sinc\xE8rement hostile. Cette lucidit\xE9, cependant, arrive trop tard, ce que le spectateur pressent d\xE9j\xE0."},{h:"I. B",t:`De plus, l\u2019aveu prend la forme d\u2019un chant lyrique o\xF9 l\u2019amour humain rejoint le sacr\xE9. La r\xE9plique de Perdican est encadr\xE9e par un v\xE9ritable refrain, \xAB Insens\xE9s que nous sommes ! nous nous aimons \xBB puis \xAB \xD4 insens\xE9s ! nous nous aimons \xBB, qui donne au sentiment la force d\u2019une \xE9vidence enfin reconnue. Le jeune homme d\xE9veloppe ensuite une m\xE9taphore fil\xE9e : le bonheur est \xAB une perle si rare dans cet oc\xE9an d\u2019ici-bas \xBB, que Dieu, \xAB p\xEAcheur c\xE9leste \xBB, a tir\xE9e \xAB des profondeurs de l\u2019ab\xEEme \xBB. L\u2019image fait de l\u2019amour un don divin, que les amants ont g\xE2ch\xE9 \xAB comme des enfants g\xE2t\xE9s \xBB. Camille confirme cette r\xE9conciliation entre la foi et la passion : \xAB Ce Dieu qui nous regarde ne s\u2019en offensera pas ; [\u2026] il y a quinze ans qu\u2019il le sait \xBB. L\u2019oratoire, lieu de la pri\xE8re solitaire au d\xE9but de la sc\xE8ne, devient ainsi le lieu de l\u2019union.

Ainsi, la sc\xE8ne semble offrir le d\xE9nouement heureux qu\u2019attend une com\xE9die. Pourtant, ce bonheur est aussit\xF4t d\xE9truit.`},{h:"II. A",t:"En effet, le cri de Rosette surgit comme un coup de th\xE9\xE2tre. La didascalie \xAB Il l\u2019embrasse ; on entend un grand cri derri\xE8re l\u2019autel \xBB juxtapose les deux actions dans une m\xEAme phrase : le malheur frappe \xE0 l\u2019instant exact du bonheur. Cette co\xEFncidence produit une ironie tragique, car le baiser tant attendu devient la cause de la catastrophe. D\xE8s lors, le rythme du dialogue s\u2019acc\xE9l\xE8re en r\xE9pliques plus courtes, et Perdican exprime un pressentiment saisissant : \xAB il me semble que mes mains sont couvertes de sang \xBB. Cette image hyperbolique traduit une culpabilit\xE9 qui pr\xE9c\xE8de m\xEAme la nouvelle de la mort. Le h\xE9ros, qui parlait avec \xE9loquence, est d\xE9sormais paralys\xE9 par \xAB un froid mortel \xBB."},{h:"II. B",t:"Enfin, ce d\xE9nouement accomplit le proverbe qui donne son titre \xE0 la pi\xE8ce. Rest\xE9 seul, Perdican adresse \xE0 Dieu une pri\xE8re d\xE9sesp\xE9r\xE9e : \xAB ne faites pas de moi un meurtrier ! \xBB. Il reconna\xEEt alors la nature de leur faute : \xAB nous avons jou\xE9 avec la vie et la mort \xBB. Le lexique du jeu rappelle le \xAB badinage \xBB du titre : les amants ont trait\xE9 l\u2019amour comme un divertissement, et la sanction tombe sur une victime innocente. Le rythme ternaire \xAB elle est jeune, elle sera riche, elle sera heureuse \xBB montre l\u2019illusion d\u2019une r\xE9paration possible. La r\xE9plique finale de Camille, \xAB Elle est morte. Adieu, Perdican ! \xBB, brise cet espoir par sa bri\xE8vet\xE9 : deux phrases s\xE8ches annoncent la mort et la s\xE9paration d\xE9finitive. Le silence qui suit referme la pi\xE8ce sur l\u2019impossibilit\xE9 du bonheur."},{h:"Conclusion",t:"En d\xE9finitive, cette derni\xE8re sc\xE8ne commence comme le d\xE9nouement heureux d\u2019une com\xE9die, avec un aveu lyrique o\xF9 l\u2019amour se r\xE9concilie avec Dieu, puis bascule brutalement dans la trag\xE9die avec la mort de Rosette. Musset montre ainsi que l\u2019orgueil et le jeu des paroles ont des cons\xE9quences irr\xE9versibles : on ne badine pas avec l\u2019amour. Ce renversement distingue profond\xE9ment la pi\xE8ce du th\xE9\xE2tre de Marivaux, o\xF9, comme dans Le Jeu de l\u2019amour et du hasard, le badinage amoureux finit toujours par la lev\xE9e des masques et le triomphe des amants."}]};var{useState:x,useEffect:F,useMemo:Ee,useRef:ae}=React,$="cc-badine-v1";function te(){try{return JSON.parse(localStorage.getItem($))||{}}catch{return{}}}function ne(d){try{localStorage.setItem($,JSON.stringify(d))}catch{}}var U=[{n:1,t:"Rep\xE9rer",d:"Les briques de base : situer, nommer, interpr\xE9ter."},{n:2,t:"Analyser",d:"Travailler un extrait entier : rep\xE9rage, tableau, probl\xE9matique."},{n:3,t:"Construire et r\xE9diger",d:"Plan, paragraphe, introduction et conclusion."},{n:4,t:"T\xE2che finale",d:"Le commentaire complet, en autonomie."}],q=[{id:"ex1",niv:1,titre:"Situer l\u2019extrait : AMGETRO",texte:"A",mm:"Minimissions 1 \xE0 3",consigne:"Lis d\u2019abord le paratexte (le cadre gris), puis l\u2019extrait. R\xE9ponds ensuite aux sept questions AMGETRO.",pim:["Je recherche les informations qui situent le texte.","Je regarde le paratexte : auteur, date, contexte, place de la sc\xE8ne.","Je r\xE9ponds aux questions AMGETRO une par une."]},{id:"ex2",niv:1,titre:"Reconna\xEEtre les proc\xE9d\xE9s",texte:null,mm:"Minimission 4",consigne:"Pour chaque citation, choisis le nom du proc\xE9d\xE9. Si tu h\xE9sites, ouvre la bo\xEEte \xE0 outils.",pim:["Je veux nommer la technique d\u2019\xE9criture utilis\xE9e.","Je lis la citation et je cherche ce qui est r\xE9p\xE9t\xE9, compar\xE9, oppos\xE9 ou exag\xE9r\xE9.","Je choisis le proc\xE9d\xE9 dans la liste, puis je v\xE9rifie."]},{id:"ex3",niv:1,titre:"Du proc\xE9d\xE9 \xE0 l\u2019effet",texte:null,mm:"Minimissions 4 et 5",consigne:"\xC9tudie d\u2019abord l\u2019exemple r\xE9solu. Puis, pour chaque citation, choisis la vraie interpr\xE9tation parmi trois propositions.",pim:["Je veux expliquer ce que produit le proc\xE9d\xE9.","Je compare trois phrases : un effet passe-partout, une paraphrase, une interpr\xE9tation.","Je choisis celle qui relie le proc\xE9d\xE9 au sens du passage."]},{id:"ex4",niv:2,titre:"Surligner par axe de lecture",texte:"A",mm:"Minimissions 4 et 5",consigne:"Choisis un surligneur, puis clique sur les passages correspondants. Bleu : le souvenir et l\u2019enfance. Orange : le refus et la n\xE9gation. Certains passages ne vont dans aucun axe.",pim:["Je veux classer les passages selon deux pistes de lecture.","Je relis chaque phrase en me demandant : souvenir, refus, ou ni l\u2019un ni l\u2019autre ?","Je surligne avec une couleur par piste, comme sur le brouillon le jour de l\u2019examen."]},{id:"ex5",niv:2,titre:"Compl\xE9ter le tableau des proc\xE9d\xE9s",texte:"B",mm:"Minimissions 4 \xE0 6",consigne:"La premi\xE8re ligne est remplie. Compl\xE8te les cases vides : de moins en moins d\u2019aide \xE0 chaque ligne. Termine par l\u2019intention de l\u2019auteur.",pim:["Je veux relier citations, proc\xE9d\xE9s et effets.","Je regarde la ligne mod\xE8le, puis la citation de chaque ligne.","Je compl\xE8te les cases, puis je compare avec le corrig\xE9 et je m\u2019auto-\xE9value."]},{id:"ex6",niv:2,titre:"Formuler la probl\xE9matique",texte:"C",mm:"Minimissions 7 et 8",consigne:"Lis la sc\xE8ne de la fontaine. Choisis la meilleure probl\xE9matique, puis r\xE9\xE9cris-la sous forme de question indirecte.",pim:["Je cherche une question qui organise tout le commentaire.","Je repense aux int\xE9r\xEAts du texte et \xE0 ce qu\u2019il a de surprenant.","Je choisis, puis je reformule en \xAB Nous verrons en quoi\u2026 \xBB."]},{id:"ex7",niv:3,titre:"B\xE2tir le plan",texte:"C",mm:"Minimission 9",consigne:"Probl\xE9matique : \xAB En quoi cette sc\xE8ne de s\xE9duction est-elle en r\xE9alit\xE9 un pi\xE8ge adress\xE9 \xE0 Camille ? \xBB Range chaque id\xE9e dans la partie I, la partie II, ou \xE9carte-la.",pim:["Je veux organiser mes id\xE9es en deux grandes parties.","Je relis la probl\xE9matique et chaque id\xE9e.","Je classe : chaque sous-partie doit prouver l\u2019id\xE9e de sa partie."]},{id:"ex8",niv:3,titre:"R\xE9diger un paragraphe",texte:"C",mm:"Minimissions 10 et 11",consigne:"Observe le paragraphe mod\xE8le (II.A) et ses cinq couleurs. R\xE9dige ensuite le paragraphe II.B, sur la bague jet\xE9e dans la fontaine, en remplissant les cinq cases.",pim:["Je veux \xE9crire un paragraphe argument\xE9.","Je regarde la structure du mod\xE8le : id\xE9e, citation, proc\xE9d\xE9, interpr\xE9tation, bilan.","J\u2019\xE9cris chaque \xE9l\xE9ment dans sa case ; le paragraphe s\u2019assemble tout seul."]},{id:"ex9",niv:3,titre:"Introduction et conclusion",texte:"C",mm:"Minimissions 12 et 13",consigne:"Remets les phrases de l\u2019introduction dans l\u2019ordre. Puis choisis les ouvertures recevables pour la conclusion.",pim:["Je veux construire une introduction et une conclusion compl\xE8tes.","Je rep\xE8re le r\xF4le de chaque phrase.","Je les ordonne du plus g\xE9n\xE9ral au plus pr\xE9cis, puis je juge les ouvertures."]},{id:"ex10",niv:4,titre:"Le commentaire complet",texte:"D",mm:"Minimissions 1 \xE0 16",consigne:"Commente la derni\xE8re sc\xE8ne de la pi\xE8ce, en suivant les \xE9tapes. Les coups de pouce sont cach\xE9s : ne les ouvre qu\u2019en cas de blocage.",pim:["Je veux \xE9crire un commentaire compos\xE9 complet.","Je m\u2019appuie sur le texte, mon brouillon et les r\xE8gles d\u2019\xE9criture.","Je suis les \xE9tapes : brouillon, plan, r\xE9daction, relecture."]}],f={home:React.createElement("svg",{viewBox:"0 0 16 16","aria-hidden":"true"},React.createElement("path",{d:"M2 7.5 8 2.5l6 5M3.5 6.5V13.5h3.5v-4h2v4h3.5V6.5",fill:"none",stroke:"currentColor",strokeWidth:"1.2"})),tool:React.createElement("svg",{viewBox:"0 0 16 16","aria-hidden":"tr
