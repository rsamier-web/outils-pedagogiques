              <text class="edge-label" x=${mx} y=${my + 4} text-anchor="middle">${lab}</text>
            </g>`;
          })}
          <text x=${cx} y=${cy - 6} text-anchor="middle" style=${{ fill: "var(--mute)", fontSize: "12px", fontFamily: "var(--read)", fontStyle: "italic" }}>On ne badine pas</text>
          <text x=${cx} y=${cy + 12} text-anchor="middle" style=${{ fill: "var(--mute)", fontSize: "12px", fontFamily: "var(--read)", fontStyle: "italic" }}>avec l’amour</text>
          ${FAMILIES.map(f => {
            const [x, y] = pos[f.id]; const n = SUJETS.filter(s => s.fam === f.id).length;
            return html`<g key=${f.id} class=${"node" + (f.id === fam ? " sel" : "")} tabindex="0" role="button" aria-label=${f.nom}
              onClick=${() => setFam(f.id)} onKeyDown=${e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), setFam(f.id))}>
              <rect class="under" x=${x - 78} y=${y - 28} width="156" height="56" rx="4"/><rect x=${x - 78} y=${y - 28} width="156" height="56" rx="4"/>
              <text x=${x} y=${y - 3} text-anchor="middle" style=${{ fontSize: "14px", fontWeight: 600 }}>${f.court}</text>
              <text class="cnt" x=${x} y=${y + 15} text-anchor="middle">${n} sujet${n > 1 ? "s" : ""}</text>
            </g>`;
          })}
        </svg>
        <div class="legend"><span><${TBadge} type="D"/> dialectique : oui / mais / dépassement</span><span><${TBadge} type="T"/> thématique : aspects ou causes</span></div>
      </section>
      <section class="pane fam-panel" aria-live="polite">
        <div><div class="label">Famille sélectionnée</div><h2>${F.nom}</h2><p style=${{ color: "var(--mute)", fontSize: "14px", marginTop: "4px" }}>Notions : ${F.notions}</p></div>
        <div class="list">
          ${list.map(s => html`<button key=${s.id} class="row-link" onClick=${() => openSujet(s.id)}>
            <${TBadge} type=${s.type}/>
            <span><span>${TITRES[s.id]}</span><small>${s.src}</small></span>
          </button>`)}
        </div>
        <p style=${{ fontSize: "13px", color: "var(--mute)" }}>Les sujets d’une même famille se préparent ensemble : mêmes citations, plans voisins.</p>
      </section>
    </div>
    <section class="pane" style=${{ padding: "14px 16px" }}>
      <div class="label">Tous les sujets, par famille et par type de plan</div>
      <div class="matrix-wrap"><table class="matrix">
        <thead><tr><th>Famille</th><th><${TBadge} type="D"/> Dialectique</th><th><${TBadge} type="T"/> Thématique</th></tr></thead>
        <tbody>${FAMILIES.map(f => html`<tr key=${f.id}>
          <th scope="row" style=${{ fontWeight: 600 }}>${f.nom}</th>
          ${["D", "T"].map(t => html`<td key=${t}>${SUJETS.filter(s => s.fam === f.id && s.type === t).map(s => html`<button key=${s.id} class=${"chip" + (s.officiel ? " on" : "")} onClick=${() => openSujet(s.id)}>${TITRES[s.id]}</button>`)}</td>`)}
        </tr>`)}</tbody>
      </table></div>
      <p style=${{ fontSize: "12.5px", color: "var(--mute)", marginTop: "8px" }}>En bleu : sujets réellement tombés au bac 2025.</p>
    </section>
  </div>`;
}

/* ---------- fiche sujet ---------- */
function Sheet({ S, step, setStep, done, toggleDone }) {
  const [memo, setMemo] = useState(false);
  const [shown, setShown] = useState({});
  const [speaking, setSpeaking] = useState(false);
  useEffect(() => { setShown({}); }, [S.id, memo, step]);
  useEffect(() => () => { try { speechSynthesis.cancel(); } catch (e) {} }, [S.id, step]);
  useEffect(() => setSpeaking(false), [S.id, step]);
  const reveal = k => setShown(o => ({ ...o, [k]: true }));
  const isShown = k => !memo || shown[k];

  function speak() {
    try {
      if (speaking) { speechSynthesis.cancel(); setSpeaking(false); return; }
      const u = new SpeechSynthesisUtterance(INTRO_ROWS.map(([k]) => plain(S.intro[k])).join(" "));
      u.lang = "fr-FR"; u.rate = 0.95;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("fr")); if (v) u.voice = v;
      u.onend = () => setSpeaking(false); u.onerror = () => setSpeaking(false);
      speechSynthesis.cancel(); speechSynthesis.speak(u); setSpeaking(true);
    } catch (e) { setSpeaking(false); }
  }

  const memoSwitch = (hint) => html`<label class="switch" title=${hint}>
    <input type="checkbox" id=${"memo-" + step} checked=${memo} onChange=${e => setMemo(e.target.checked)}/>
    Mode mémorisation
  </label>`;

  const isDone = done.includes(S.id);
  return html`<article class="pane sheet">
    <div class="meta">
      <span class="pill"><${TBadge} type=${S.type}/>${TYPE_NOM[S.type]}</span>
      ${S.officiel && html`<span class="pill bac">Sujet du bac</span>`}
      <span class="pill">${famById[S.fam].nom}</span>
      <span style=${{ fontSize: "12.5px", color: "var(--mute)" }}>${S.src}</span>
    </div>
    <h2 class="enonce">${ital(S.enonce)}</h2>
    ${S.variantes && html`<details class="var"><summary>Variantes qui se traitent avec le même plan (${S.variantes.length})</summary><ul>${S.variantes.map((v, i) => html`<li key=${i}>${v}</li>`)}</ul></details>`}

    <div class="steps" role="tablist" aria-label="Étapes">
      ${STEPS.map((nom, i) => html`<button key=${i} class="step" role="tab" aria-selected=${step === i} onClick=${() => setStep(i)}><b>${i + 1}</b>${nom}</button>`)}
    </div>

    ${step === 0 && html`<section style=${{ display: "grid", gap: "18px" }}>
      <div><div class="label">Mots-clés à définir</div>
        <dl class="kw" style=${{ margin: 0 }}>${S.mots.map(([m, d], i) => html`<div key=${i}><dt>${m}</dt><dd>${ital(d)}</dd></div>`)}</dl></div>
      <div class="note" role="note"><${IconWarn}/><span><strong>Piège à éviter.</strong> ${ital(S.piege)}</span></div>
      <div><div class="label">Problématique</div><p class="pb">${S.pb}</p></div>
      <div><div class="label">Ton fil : trois mots, trois parties</div><${Fil} fil=${S.fil}/></div>
    </section>`}

    ${step === 1 && html`<section style=${{ display: "grid", gap: "14px" }}>
      <div class="tools">
        ${memoSwitch("Masque les arguments : essaie de les retrouver avant de cliquer")}
        ${memo ? html`<span style=${{ fontSize: "13px", color: "var(--mute)" }}>Retrouve chaque argument de mémoire, puis clique pour vérifier.</span>` : html`<span style=${{ fontSize: "13px", color: "var(--mute)" }}>Chaque sous-partie = un paragraphe : argument, explication, citation, analyse.</span>`}
      </div>
      <div class="plan">
        ${S.parties.map((P, pi) => html`<div key=${pi} class="part">
          <div class=${"part-head bg" + (pi + 1)}><span class=${"num n" + (pi + 1)}>${ROMAN[pi]}</span><h3>${P.t}</h3></div>
          <div class="subs">${P.s.map((s, si) => {
            const k = pi + "-" + si;
            return html`<div key=${si} class="sub"><span class="letter">${LETTRES[si]}.</span>
              ${isShown(k) ? html`<div>
                <p class="arg">${s.a}</p>
                <p class="expl">${ital(s.e)}</p>
                ${s.c.length > 0 && html`<div class="cits">${s.c.map((c, ci) => html`<p key=${ci} class="cit">« ${c.t} »<span class="ref">${c.r} · ${c.w}</span></p>`)}</div>`}
              </div>` : html`<button class="hidden-slot" onClick=${() => reveal(k)}>Argument ${LETTRES[si]} : à toi de le retrouver. Cliquer pour vérifier.</button>`}
            </div>`;
          })}</div>
        </div>`)}
      </div>
      ${S.ouverture && html`<p class="open"><strong style=${{ whiteSpace: "nowrap" }}>Pour enrichir</strong><span>${ital(S.ouverture)}</span></p>`}
    </section>`}

    ${step === 2 && html`<section style=${{ display: "grid", gap: "14px" }}>
      <div class="tools">
        ${memoSwitch("Ne montre que le début de chaque étape")}
        <button class="btn" onClick=${speak} aria-pressed=${speaking}><${IconSpeak}/>${speaking ? "Arrêter la lecture" : "Écouter l’introduction"}</button>
      </div>
      <div><div class="label">À retenir : l’image de l’accroche et ce fil</div><${Fil} fil=${S.fil}/></div>
      <div class="intro">
        ${INTRO_ROWS.map(([k, lab], i) => html`<div key=${k} class="irow">
          <div class="ilabel"><b>${i + 1}</b>${lab}</div>
          ${isShown(k)
            ? html`<p class="itext">${k === "ann" ? parseAnn(S.intro.ann).map((p, j) => typeof p === "string" ? ital(p) : html`<mark key=${j} class=${"c" + p.n}>${p.w}</mark>`) : ital(S.intro[k])}</p>`
            : html`<button class="hidden-slot" onClick=${() => reveal(k)}><span class="cue">${cueOf(S.intro[k])}</span> Cliquer pour vérifier.</button>`}
        </div>`)}
      </div>
      <p style=${{ fontSize: "13px", color: "var(--mute)" }}>Méthode : lis l’introduction une fois, active le mode mémorisation, récite-la à voix haute à partir des débuts de phrase, puis vérifie.</p>
    </section>`}

    <div class="footer-actions">
      <div style=${{ display: "flex", gap: "8px" }}>
        ${step > 0 && html`<button class="btn" onClick=${() => setStep(step - 1)}>← ${STEPS[step - 1]}</button>`}
        ${step < 2 && html`<button class="btn primary" onClick=${() => setStep(step + 1)}>${STEPS[step + 1]} →</button>`}
      </div>
      <label class="switch"><input type="checkbox" id="done-toggle" checked=${isDone} onChange=${() => toggleDone(S.id)}/>Je maîtrise ce sujet</label>
    </div>
  </article>`;
}

function SujetsView({ cur, setCur, step, setStep, done, toggleDone }) {
  const [ft, setFt] = useState(() => load("ft", "all"));
  useEffect(() => save("ft", ft), [ft]);
  const S = sujById[cur] || SUJETS[0];
  const vis = s => ft === "all" || s.type === ft;
  return html`<div class="split">
    <aside class="pane sidebar" aria-label="Liste des sujets">
      <div class="side-filter" role="group" aria-label="Filtrer par type">
        ${[["all", "Tous"], ["D", "Dialectique"], ["T", "Thématique"]].map(([k, n]) => html`<button key=${k} class="seg" aria-pressed=${ft === k} onClick=${() => setFt(k)}>${n}</button>`)}
      </div>
      ${FAMILIES.map(f => {
        const l = SUJETS.filter(s => s.fam === f.id && vis(s)); if (!l.length) return null;
        return html`<div key=${f.id}><div class="group-title">${f.nom}</div>
          ${l.map(s => html`<button key=${s.id} class="item" aria-current=${s.id === S.id} onClick=${() => setCur(s.id)}>
            <${TBadge} type=${s.type}/><span>${TITRES[s.id]}</span>${done.includes(s.id) && html`<span class="done" aria-label="maîtrisé">✓</span>`}
          </button>`)}
        </div>`;
      })}
    </aside>
    <div style=${{ display: "grid", gap: "12px", minWidth: 0 }}>
      <label class="mobile-pick pane">
        <span class="label" style=${{ margin: 0 }}>Choisir un sujet</span>
        <select id="mobile-select" value=${S.id} onChange=${e => setCur(e.target.value)} style=${{ width: "100%", padding: "6px", border: "1px solid var(--line)", borderRadius: "3px", background: "var(--view)" }}>
          ${FAMILIES.map(f => html`<optgroup key=${f.id} label=${f.nom}>${SUJETS.filter(s => s.fam === f.id).map(s => html`<option key=${s.id} value=${s.id}>${s.type} · ${TITRES[s.id]}${done.includes(s.id) ? " ✓" : ""}</option>`)}</optgroup>`)}
        </select>
      </label>
      <${Sheet} S=${S} step=${step} setStep=${setStep} done=${done} toggleDone=${toggleDone}/>
    </div>
  </div>`;
}

/* ---------- banque de citations ---------- */
function refKey(r) { const [a, s] = r.split(",").map(x => x.trim()); return ({ I: 1, II: 2, III: 3 }[a] || 0) * 100 + ({ I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6, VII: 7, VIII: 8 }[s] || +s || 0); }
function CitationsView({ openSujet }) {
  const [fam, setFam] = useState("all");
  const [q, setQ] = useState("");
  const bank = useMemo(() => {
    const m = new Map();
    for (const S of SUJETS) for (const P of S.parties) for (const s of P.s) for (const c of s.c) {
      const k = c.t.toLowerCase();
      if (!m.has(k)) m.set(k, { t: c.t, r: c.r, w: c.w, suj: new Set(), fam: new Set() });
      const e = m.get(k); e.suj.add(S.id); e.fam.add(S.fam);
    }
    return [...m.values()].sort((a, b) => refKey(a.r) - refKey(b.r) || a.t.localeCompare(b.t));
  }, []);
  const ql = q.trim().toLowerCase();
  const list = bank.filter(e => (fam === "all" || e.fam.has(fam)) && (!ql || (e.t + " " + e.w).toLowerCase().includes(ql)));
  return html`<section class="pane">
    <div class="cit-tools">
      <input class="search" id="cit-search" type="search" placeholder="Chercher un mot, un personnage…" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Chercher une citation"/>
      <span style=${{ fontSize: "13px", color: "var(--mute)", fontVariantNumeric: "tabular-nums" }}>${list.length} citation${list.length > 1 ? "s" : ""}, dans l’ordre de la pièce</span>
    </div>
    <div class="cit-tools" role="group" aria-label="Filtrer par famille">
      <button class=${"chip" + (fam === "all" ? " on" : "")} onClick=${() => setFam("all")}>Toutes</button>
      ${FAMILIES.map(f => html`<button key=${f.id} class=${"chip" + (fam === f.id ? " on" : "")} onClick=${() => setFam(f.id)}>${f.court}</button>`)}
    </div>
    <div class="cit-list">
      ${list.map((e, i) => html`<div key=${i} class="cit-row">
        <q>${e.t}</q>
        <div class="cit-meta"><strong style=${{ color: "var(--fg)" }}>${e.r}</strong><span>${e.w}</span><span aria-hidden="true">·</span><span>sert dans :</span>
          ${[...e.suj].map(id => html`<button key=${id} class="chip" onClick=${() => openSujet(id, 1)}>${TITRES[id]}</button>`)}
        </div>
      </div>`)}
      ${list.length === 0 && html`<p style=${{ padding: "16px", color: "var(--mute)" }}>Aucune citation ne correspond. Essaie un autre mot ou choisis « Toutes ».</p>`}
    </div>
  </section>`;
}

/* ---------- méthode ---------- */
function MethodView() {
  return html`<div style=${{ display: "grid", gap: "16px" }}>
    <div class="method">
      <section class="pane mcard">
        <h2>1. Reconnaître le type de sujet</h2>
        <table class="mtable">
          <thead><tr><th>Indices dans l’énoncé</th><th>Type de plan</th></tr></thead>
          <tbody>
            <tr><td>Question fermée (oui / non), « ne… que », « uniquement », « seulement », « dans quelle mesure », « éclaire-t-elle », « partagez-vous »</td><td><${TBadge} type="D"/> <strong>Dialectique</strong><br/>I. Oui<br/>II. Mais<br/>III. Dépassement</td></tr>
            <tr><td>« En quoi », « comment », « pourquoi », « comment expliquer », « quel écho »</td><td><${TBadge} type="T"/> <strong>Thématique</strong><br/>trois aspects ou trois causes, du plus visible au plus profond</td></tr>
          </tbody>
        </table>
      </section>
      <section class="pane mcard">
        <h2>2. L’introduction en cinq temps</h2>
        <ol>
          <li><strong>Accroche</strong> : une image ou une réplique forte de la pièce.</li>
          <li><strong>Présenter le sujet</strong> : œuvre, date, situation, puis l’énoncé.</li>
          <li><strong>Définir les mots-clés</strong> : ce que le sujet veut dire exactement.</li>
          <li><strong>Problématique</strong> : la question reformulée, qui contient une tension.</li>
          <li><strong>Annonce du plan</strong> : les trois idées, dans l’ordre.</li>
        </ol>
        <p class="note" style=${{ background: "var(--accent-tint)" }}><span>Pour mémoriser, retiens seulement deux choses : l’image de l’accroche et le fil de trois mots. Le reste se reconstruit à partir d’eux.</span></p>
      </section>
      <section class="pane mcard">
        <h2>3. Construire un paragraphe</h2>
        <ol>
          <li><strong>Argument</strong> : une phrase qui répond au sujet.</li>
          <li><strong>Explication</strong> : pourquoi c’est vrai.</li>
          <li><strong>Exemple</strong> : une scène, avec une citation courte (acte, scène).</li>
          <li><strong>Analyse</strong> : ce que montre la citation (un mot, une image, un procédé).</li>
          <li><strong>Mini-conclusion</strong> : retour au sujet, puis transition.</li>
        </ol>
      </section>
      <section class="pane mcard">
        <h2>4. Réviser avec l’application</h2>
        <ul>
          <li>Commence par la <strong>carte</strong> : les sujets proches se révisent ensemble.</li>
          <li>Pour chaque sujet, suis les étapes <strong>Analyser → Plan → Introduction</strong>, une à la fois.</li>
          <li>Active le <strong>mode mémorisation</strong> : essaie de retrouver avant de vérifier. C’est cet effort qui fixe le souvenir.</li>
          <li>Écoute l’introduction, puis récite-la à voix haute.</li>
          <li>Reviens plusieurs jours de suite sur les sujets non cochés.</li>
        </ul>
      </section>
    </div>
    <section class="pane sources">
      <div class="label" style=${{ margin: 0 }}>Sources des énoncés</div>
      <ul>${SOURCES.map((s, i) => html`<li key=${i}><a href=${s.url} target="_blank" rel="noopener">${s.nom}</a></li>`)}</ul>
      <p style=${{ color: "var(--mute)" }}>Toutes les citations de la pièce ont été vérifiées sur le texte intégral (acte et scène). Les deux sujets Beaunesne viennent du cours.</p>
    </section>
  </div>`;
}

/* ---------- application ---------- */
function App() {
  const init = (() => { const h = (location.hash || "").slice(1); return h; })();
  const [view, setViewRaw] = useState(() => sujById[init] ? "sujets" : (["carte", "sujets", "citations", "methode"].includes(init) ? init : load("view", "carte")));
  const [cur, setCurRaw] = useState(() => sujById[init] ? init : load("cur", "s1"));
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(() => { const d = load("done", []); return Array.isArray(d) ? d : []; });
  useEffect(() => save("view", view), [view]);
  useEffect(() => save("cur", cur), [cur]);
  useEffect(() => save("done", done), [done]);
  useEffect(() => setHash(view === "sujets" ? cur : view), [view, cur]);
  const setView = v => { setViewRaw(v); window.scrollTo(0, 0); };
  const setCur = id => { setCurRaw(id); setStep(0); window.scrollTo(0, 0); };
  const openSujet = (id, st = 0) => { setCurRaw(id); setStep(st); setViewRaw("sujets"); window.scrollTo(0, 0); };
  const toggleDone = id => setDone(d => d.includes(id) ? d.filter(x => x !== id) : [...d, id]);
  return html`<div class="app">
    <${Toolbar} view=${view} setView=${setView} done=${done}/>
    <main class="main">
      ${view === "carte" && html`<${MapView} openSujet=${openSujet}/>`}
      ${view === "sujets" && html`<${SujetsView} cur=${cur} setCur=${setCur} step=${step} setStep=${setStep} done=${done} toggleDone=${toggleDone}/>`}
      ${view === "citations" && html`<${CitationsView} openSujet=${openSujet}/>`}
      ${view === "methode" && html`<${MethodView}/>`}
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

</script>

</body></html>
