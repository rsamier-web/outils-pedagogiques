 la question de Maïa (1 ou 2 phrases).",amorce:"– Avec mes vingt euros, …",modele:"– Avec mes vingt euros, je n’ai rien gagné : juste des joueurs que tout le monde a déjà."},{t:"parler",txt:"Questionner : joue le rôle de Maïa et pose à quelqu’un une question qui fait réfléchir, sans donner la réponse."}]}},{id:"3.3",palier:3,titre:"Ibn Battuta, le voyageur de Tanger",genre:"Texte informatif",theme:"Histoire et voyage",paras:["En 1325, un jeune homme de vingt et un ans quitte Tanger, sa ville natale. Il s’appelle Ibn Battuta et veut accomplir le pèlerinage à La Mecque. Il ne sait pas encore qu’il ne reverra le Maroc que vingt-quatre ans plus tard.","Après La Mecque, sa curiosité l’entraîne toujours plus loin. Il traverse l’Égypte, la Syrie, la Perse, remonte jusqu’aux steppes de l’actuelle Russie, puis gagne l’Inde, où le sultan de Delhi le nomme juge. Il visite ensuite les Maldives, l’île de Sumatra et atteint, selon son récit, la Chine. Au total, il aurait parcouru environ 120 000 kilomètres, soit trois fois le tour de la Terre, à une époque où l’on voyageait à pied, à cheval, à dos de chameau ou en bateau à voile.","Comment un voyageur pouvait-il survivre si longtemps loin de chez lui ? Le monde musulman de l’époque formait un immense réseau de villes reliées par le commerce, la religion et la langue arabe. Grâce à sa formation de juriste, Ibn Battuta était accueilli presque partout comme un savant et recevait souvent cadeaux et protection des souverains.","De retour à Fès en 1349, il repart encore : vers l’Andalousie, puis à travers le Sahara jusqu’à l’empire du Mali. Le sultan du Maroc lui demande alors de raconter ses aventures à un secrétaire, Ibn Juzayy. Le livre qui en naît, la Rihla (« le voyage »), est aujourd’hui une source précieuse pour les historiens.","Certains passages restent pourtant discutés : quelques descriptions semblent empruntées à d’autres auteurs, et des chercheurs doutent qu’il soit réellement allé partout où il le prétend. Cela n’enlève rien à l’essentiel : sans lui, nous saurions beaucoup moins de choses sur le monde du XIVe siècle."],suite:[{q:"Pourquoi Ibn Battuta a-t-il quitté Tanger ?",r:"Pour accomplir le pèlerinage à La Mecque."},{q:"Qui a mis son récit par écrit ?",r:"Un secrétaire, Ibn Juzayy."}],A:{titre:"Les signaux de prudence",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Suis un voyageur parti il y a 700 ans, et demande-toi si l’on peut tout croire de son récit.",sais:["Le pèlerinage à La Mecque est un voyage religieux des musulmans vers cette ville d’Arabie.","Le XIVe siècle correspond aux années 1300."]},{t:"lire"},{t:"montre",s:"S6",p:[2],txt:"Au ¶2, je lis « il aurait parcouru », et non « il a parcouru ». Ce petit changement signale un doute : l’auteur n’est pas sûr. Je repère ces signaux dans tout le texte."},{t:"q",cat:"G",q:"Quelle est l’idée principale ?",o:["Un voyageur marocain a parcouru le monde","La vie à La Mecque au Moyen Âge","Comment devenir juge en Inde"],ok:0,fb:"Oui : ses voyages et le livre qui les raconte.",no:{1:["D"],2:["D"]}},{t:"q",cat:"F",q:"Pourquoi part-il (¶1) ?",o:["Pour faire du commerce","Pour le pèlerinage","Pour fuir le Maroc"],ok:1,fb:"Oui : le pèlerinage à La Mecque.",no:{0:["I"],2:["I"]},p:[1]},{t:"q",cat:"F",q:"Qui a mis son récit par écrit (¶4) ?",o:["Ibn Battuta lui-même","Le sultan du Maroc","Un secrétaire"],ok:2,fb:"Oui : Ibn Juzayy.",no:{0:["L","Il a raconté, il n’a pas écrit."],1:["R","Le sultan a demandé le livre."]},p:[4]},{t:"q",cat:"ANA",s:"S2",q:"« Le livre qui en naît » (¶4). « En » renvoie à…",o:["Le récit fait au secrétaire","Le Sahara","L’empire du Mali"],ok:0,fb:"Oui : le livre naît de ce récit.",no:{1:["R"],2:["R"]},p:[4]},{t:"q",cat:"NUM",q:"En quelle année est-il né, environ ?",o:["1325","1346","1304"],ok:2,fb:"Oui : 1325 − 21 = 1304.",no:{0:["L","C’est l’année de son départ."],1:["C","Erreur de calcul : il avait 21 ans en 1325."]},p:[1]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Pourquoi est-il parti ?",r:"Pour le pèlerinage à La Mecque."},{q:"Qui a mis son récit par écrit ?",r:"Un secrétaire, Ibn Juzayy."}]},{t:"lire",relire:!0},{t:"q",cat:"VOC",q:"« …cadeaux et protection des souverains » (¶3). Les souverains, ce sont…",o:["Les rois et sultans","Les marchands","Les savants"],ok:0,fb:"Oui : comme le sultan de Delhi.",no:{1:["I"],2:["R","C’est lui qu’on voit comme un savant."]},p:[3]},{t:"q",cat:"GRAM",s:"S6",q:"« Selon son récit, la Chine » (¶2). Cette formule indique…",o:["Une information pas tout à fait sûre","Un voyage dans le futur","Une simple décoration"],ok:0,aide:"Repense aux signaux de prudence.",fb:"Oui : c’est lui qui le dit, l’auteur ne le confirme pas.",no:{1:["C"],2:["D"]},p:[2]},{t:"q",cat:"SG",q:"Pourquoi l’auteur précise-t-il « à pied, à cheval, à dos de chameau… » (¶2) ?",o:["Pour souligner l’exploit","Pour décrire les animaux","Il détestait le bateau"],ok:0,fb:"Oui : 120 000 km sans moteur, c’est un exploit.",no:{1:["D"],2:["I"]},p:[2]},{t:"q",cat:"HYP",q:"Quelqu’un affirme : « La Rihla ne sert à rien, certains passages sont douteux. » Que répondrait l’auteur ?",o:["Il serait d’accord","Elle reste précieuse","Le texte ne permet pas de répondre"],ok:1,fb:"Oui : relis la dernière phrase du ¶5.",no:{0:["C"],2:["L","La dernière phrase du ¶5 répond."]},p:[5]},{t:"q",cat:"ST",q:"Après son retour à Fès, il visite…",o:["L’Inde","L’empire du Mali","La Chine"],ok:1,fb:"Oui : « il repart encore » vers l’Andalousie et le Mali.",no:{0:["L","Ce voyage a eu lieu avant son retour."],2:["L","Ce voyage a eu lieu avant son retour."]},p:[4]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Il a été juge en Inde.","Il a écrit la Rihla de sa main.","Il est passé par l’Égypte."],ok:1,fb:"Bien vu : il l’a racontée à un secrétaire.",no:{0:["C","C’est écrit au ¶2."],2:["C","C’est écrit au ¶2."]},p:[4]},{t:"ecrire",consigne:"Résume son voyage en trois phrases : le départ, le grand voyage, le retour et le livre.",amorce:`Départ : …
Grand voyage : …
Retour et livre : …`,modele:"Départ : en 1325, il quitte Tanger pour le pèlerinage à La Mecque. Grand voyage : il parcourt l’Égypte, la Perse, l’Inde et peut-être la Chine. Retour et livre : rentré à Fès en 1349, il raconte ses aventures à un secrétaire, qui écrit la Rihla."},{t:"parler",txt:"Questionner : quelle information du texte croirais-tu le moins ? Pourquoi ?"}]}},{id:"3.4",palier:3,titre:"Trop de touristes : faut-il fermer les portes ?",genre:"Texte argumentatif",theme:"Voyage",paras:["En 2024, à Barcelone, des habitants ont manifesté dans les rues… armés de pistolets à eau. Leur cible : les touristes attablés aux terrasses. Le geste était symbolique, mais le message était clair : « Vous êtes trop nombreux. »","On appelle ce phénomène le surtourisme. Dans certaines villes, les visiteurs sont si nombreux que la vie quotidienne devient difficile pour ceux qui y habitent. À Venise, le centre historique compte aujourd’hui moins de 50 000 habitants, alors que des millions de touristes y passent chaque année. Les loyers grimpent, les boulangeries deviennent des boutiques de souvenirs, et beaucoup de familles finissent par partir.","Faut-il pour autant fermer les portes ? Ce serait oublier que le tourisme fait vivre des millions de personnes : hôteliers, guides, artisans, restaurateurs. Au Maroc, comme dans beaucoup d’autres pays, c’est un secteur essentiel de l’économie. Et voyager reste l’une des meilleures façons de découvrir d’autres cultures.","La solution n’est donc ni d’interdire, ni de laisser faire, mais d’organiser. Certains lieux montrent la voie. Au Machu Picchu, au Pérou, le nombre de billets vendus chaque jour est limité. Venise fait désormais payer un droit d’entrée, certains jours de forte affluence, aux visiteurs qui ne restent qu’une journée.","Les voyageurs aussi ont un rôle à jouer. Partir hors saison, choisir une ville moins célèbre que la plus photographiée, rester plusieurs jours plutôt que quelques heures : ces choix simples changent beaucoup de choses.","Un lieu que l’on aime trop peut finir par mourir de son succès. Le protéger, ce n’est pas le fermer aux visiteurs ; c’est faire en sorte qu’il reste vivant pour ceux qui y vivent."],suite:[{q:"Quelle solution l’auteur propose-t-il contre le surtourisme ?",r:"Organiser le tourisme, sans l’interdire ni laisser faire."},{q:"Cite une mesure prise à Venise ou au Machu Picchu.",r:"Un droit d’entrée à Venise, un nombre de billets limité au Machu Picchu."}],A:{titre:"Problème, objection, solution",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"L’auteur propose une solution à un problème. Trouve le problème, puis la solution.",sais:["Le Machu Picchu est une ancienne cité inca dans les montagnes du Pérou.","Venise est une ville d’Italie construite sur l’eau."]},{t:"lire"},{t:"montre",s:"S4",p:[3,4],txt:"Le problème est exposé aux ¶1 et ¶2. Au ¶3, une objection : « Faut-il pour autant fermer les portes ? » Au ¶4, « La solution n’est donc… » : le mot « donc » annonce la conclusion de l’auteur."},{t:"q",cat:"G",q:"Quelle est la position de l’auteur ?",o:["Interdire le tourisme","Organiser le tourisme","Laisser faire le tourisme"],ok:1,fb:"Oui : « ni d’interdire, ni de laisser faire, mais d’organiser ».",no:{0:["C","Relis le ¶4."],2:["C","Relis le ¶4."]},p:[4]},{t:"q",cat:"F",q:"Le surtourisme (¶2), c’est…",o:["Trop de visiteurs pour les habitants","Le tourisme en montagne","Le tourisme hors saison"],ok:0,fb:"Oui : la vie des habitants devient difficile.",no:{1:["I"],2:["R","C’est une solution, au ¶5."]},p:[2]},{t:"q",cat:"F",q:"Quelles mesures sont citées (¶4) ?",o:["Interdire les avions","Fermer Barcelone","Limiter les billets, faire payer l’entrée"],ok:2,fb:"Oui : Machu Picchu et Venise.",no:{0:["I"],1:["I"]},p:[4]},{t:"q",cat:"ANA",s:"S2",q:"« Leur cible » (¶1). « Leur » renvoie à…",o:["Les touristes","Les habitants","Les pistolets à eau"],ok:1,fb:"Oui : la cible des habitants qui manifestent.",no:{0:["R","Les touristes sont la cible."],2:["R"]},p:[1]},{t:"q",cat:"VOC",q:"« Certains jours de forte affluence » (¶4). L’affluence, c’est…",o:["Beaucoup de monde","Beaucoup de pluie","Beaucoup de bruit"],ok:0,fb:"Oui : les jours où il y a foule.",no:{1:["I"],2:["I"]},p:[4]},{t:"q",cat:"SL",q:"Pourquoi des pistolets à eau (¶1) ?",o:["Pour passer un message sans blesser","Parce qu’il faisait chaud","Pour jouer avec les touristes"],ok:0,fb:"Oui : « le geste était symbolique ».",no:{1:["I"],2:["I"]},p:[1]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Qu’est-ce que le surtourisme ?",r:"Trop de visiteurs, au point de gêner la vie des habitants."},{q:"Quelle solution l’auteur propose-t-il ?",r:"Organiser le tourisme."}]},{t:"lire",relire:!0},{t:"q",cat:"SL",q:"« Les boulangeries deviennent des boutiques de souvenirs » (¶2) montre que…",o:["Les touristes aiment le pain","La ville s’adapte aux touristes","Les boulangers sont riches"],ok:1,fb:"Oui : la ville sert les touristes plutôt que les habitants.",no:{0:["L"],2:["I"]},p:[2]},{t:"q",cat:"SL",s:"S4",q:"Pourquoi l’auteur parle-t-il des guides et du Maroc (¶3) ?",o:["Pour reconnaître l’utilité du tourisme","Pour faire de la publicité","Pour critiquer le Maroc"],ok:0,aide:"Où en est-on dans le plan : problème, objection ou solution ?",fb:"Oui : c’est une concession avant la solution.",no:{1:["I"],2:["C"]},p:[3]},{t:"q",cat:"HYP",q:"Venise un samedi d’août pour une journée, ou une ville moins connue trois jours en octobre : que conseillerait l’auteur ?",o:["Venise","La ville moins connue","Le texte ne permet pas de répondre"],ok:1,fb:"Oui : hors saison, ville moins célèbre, plusieurs jours (¶5).",no:{0:["C"],2:["L","Les conseils du ¶5 permettent de répondre."]},p:[5]},{t:"q",cat:"SG",q:"« Un lieu peut mourir de son succès » (¶6). Cela veut dire :",o:["Être abîmé par trop de visiteurs","Devenir trop célèbre","Être fermé par la police"],ok:0,fb:"Oui : il se vide de ses habitants et perd sa vie.",no:{1:["L"],2:["I"]},p:[6]},{t:"q",cat:"PONC",q:`Texte a : « Les touristes, disent les habitants, sont trop nombreux. »
Texte b : « Les touristes disent : “Les habitants sont trop nombreux.” »
Dans quel texte ce sont les habitants qui se plaignent ?`,o:Ta,ok:0,fb:"Oui : les virgules encadrent « disent les habitants ».",no:{1:["C","Dans le texte b, ce sont les touristes qui parlent."],2:["C"]}},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Des habitants de Barcelone ont protesté.","L’auteur veut fermer Venise.","Au Machu Picchu, les billets sont limités."],ok:1,fb:"Bien vu : il veut organiser, pas fermer.",no:{0:["C","C’est écrit au ¶1."],2:["C","C’est écrit au ¶4."]},p:[4,6]},{t:"ecrire",consigne:"Propose un conseil pour voyager sans abîmer un lieu, et justifie-le avec un argument du texte.",amorce:"Je conseille de… parce que…",modele:"Je conseille de partir hors saison, parce que les habitants souffrent quand les touristes sont trop nombreux au même moment."},{t:"parler",txt:"Questionner : pose à quelqu’un une question dont la réponse oblige à relier deux paragraphes."},{t:"bilan",palier:3}]}},{id:"4.1",palier:4,titre:"Le jour perdu",genre:"Journal de bord",theme:"Histoire (Grandes découvertes)",sousTitre:"Journal de Juan, mousse à bord de la Victoria",note:"Récit fictif inspiré du journal d’Antonio Pigafetta ; les dates et les faits sont réels.",paras:["20 septembre 1519. Nous avons quitté l’Espagne ce matin. Cinq navires, plus de deux cents hommes, et un capitaine, Fernand de Magellan, qui affirme qu’on peut atteindre les îles aux épices en naviguant vers l’ouest. Je n’ai jamais vu autant de voiles à la fois.","28 novembre 1520. Nous sortons enfin du passage qui relie les deux océans. Il nous a fallu plus d’un mois pour le traverser, entre des falaises noires et des vents glacés. Nous ne sommes plus que trois navires : l’un s’est brisé sur des rochers, l’autre a fait demi-tour en secret vers l’Espagne. La mer qui s’ouvre devant nous est si calme que le capitaine l’a appelée « Pacifique ».","Mars 1521. Cette mer calme a failli nous tuer. Plus de trois mois sans trouver une terre où nous ravitailler. Le biscuit est réduit en poussière et grouille de vers. Hier, j’ai vu un matelot vendre un rat à un autre pour un demi-ducat. Beaucoup de mes compagnons ont les gencives si gonflées qu’ils ne peuvent plus mâcher.","27 avril 1521. Le capitaine est mort aujourd’hui sur la plage de Mactan, aux Philippines, pendant un combat contre les guerriers du chef Lapu-Lapu. Personne n’ose dire ce que nous allons faire maintenant.","9 juillet 1522. Escale aux îles du Cap-Vert. J’ai tenu ce journal chaque jour, sans en oublier un seul. Pourtant, à terre, on nous assure que nous sommes jeudi. D’après mon journal, nous sommes mercredi. Notre pilote a vérifié ses propres notes : même résultat. Où est passée cette journée ?","6 septembre 1522. Nous voici de retour en Espagne, sous le commandement de Juan Sebastián Elcano. Le port est rempli de curieux. Ils cherchent des yeux les autres navires. Ils comptent les hommes qui descendent de la Victoria, puis recommencent, comme s’ils s’étaient trompés. Nous sommes dix-huit."],suite:[{q:"Combien de navires sont revenus en Espagne ?",r:"Un seul, la Victoria, avec dix-huit hommes."},{q:"Pourquoi un jour a-t-il « disparu » du journal ?",r:"En faisant le tour de la Terre vers l’ouest, ils ont compté un jour de moins."}],A:{titre:"Partie 1 : 1519 à 1521",visibles:4,differe:!0,ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Tu vas lire le journal d’un jeune marin pendant un voyage qui a changé l’histoire. Un mystère t’attend à la fin.",sais:["Au XVIe siècle, les épices (poivre, clou de girofle, muscade) venaient d’îles lointaines d’Asie et valaient très cher.","Un mousse est un jeune apprenti marin."]},{t:"lire"},{t:"q",cat:"G",q:"Que raconte ce journal ?",o:["Un grand voyage en mer","La découverte de l’Amérique","Une guerre entre pays"],ok:0,fb:"Oui : le premier tour du monde.",no:{1:["I"],2:["D"]}},{t:"q",cat:"G",q:"De quel type d’écrit s’agit-il ?",o:["Un journal de bord","Un article de presse","Une lettre"],ok:0,fb:"Oui : des dates et un « je ».",no:{1:["C"],2:["C"]}},{t:"q",cat:"F",q:"Que veut atteindre Magellan (¶1) ?",o:["Le pôle Sud","L’Amérique","Les îles aux épices"],ok:2,fb:"Oui, en naviguant vers l’ouest.",no:{0:["I"],1:["I"]},p:[1]},{t:"q",cat:"F",q:"Pourquoi l’océan s’appelle-t-il « Pacifique » (¶2) ?",o:["Plein de poissons","Très calme","Très petit"],ok:1,fb:"Oui : « si calme ».",no:{0:["I"],2:["I"]},p:[2]},{t:"q",cat:"ANA",q:"« L’autre a fait demi-tour » (¶2). « L’autre », c’est…",o:["Un autre navire","Un autre capitaine","Un autre océan"],ok:0,fb:"Oui : un des cinq navires.",no:{1:["R"],2:["R"]},p:[2]},{t:"q",cat:"VOC",q:"« Sans trouver une terre où nous ravitailler » (¶3). Se ravitailler, c’est…",o:["Refaire des provisions","Réparer le navire","Se reposer"],ok:0,fb:"Oui : le biscuit est fichu, ils manquent de tout.",no:{1:["I"],2:["I"]},p:[3]},{t:"q",cat:"SL",q:"« Cette mer calme a failli nous tuer » (¶3). Pourquoi ?",o:["Trop vaste, plus de vivres","Des tempêtes","Des monstres marins"],ok:0,fb:"Oui : plus de trois mois sans ravitaillement.",no:{1:["C","Elle est calme."],2:["I"]},p:[3]},{t:"q",cat:"SL",q:"D’où viennent sans doute les gencives gonflées (¶3) ?",o:["Des coups reçus","Du froid du détroit","Du manque de fruits frais"],ok:2,fb:"Oui : c’est le scorbut, que le texte ne nomme pas.",no:{0:["I"],1:["I"]},p:[3]},{t:"q",cat:"SL",q:"Un rat vendu un demi-ducat (¶3) montre…",o:["Des animaux de compagnie","Des marins riches","Une faim terrible"],ok:2,fb:"Oui : même un rat devient précieux.",no:{0:["I"],1:["L"]},p:[3]},{t:"q",cat:"SG",q:"« Personne n’ose dire ce que nous allons faire » (¶4) montre…",o:["La peur et le doute","Une dispute","Le calme de l’équipage"],ok:0,fb:"Oui : sans capitaine, ils ne savent plus quoi faire.",no:{1:["I"],2:["C"]},p:[4]},{t:"verif"},{t:"corr"}]},B:{titre:"Partie 2 : le retour",differe:!0,ecrans:[{t:"rappel",items:[{q:"Pourquoi la mer calme a-t-elle failli les tuer ?",r:"Elle était si vaste qu’ils ont manqué de nourriture pendant plus de trois mois."},{q:"Combien de navires restaient après le passage ?",r:"Trois."}]},{t:"lire",relire:!0},{t:"q",cat:"NUM",q:"Combien de navires ont été perdus en tout ?",o:["1","4","5"],ok:1,fb:"Oui : cinq au départ, un seul au retour.",no:{0:["C"],2:["L","5, c’est le nombre de navires au départ."]},p:[1,6]},{t:"q",cat:"NUM",q:"Combien de temps a duré le voyage ?",o:["Trois ans","Un an","Cinq ans"],ok:0,fb:"Oui : de septembre 1519 à septembre 1522.",no:{1:["C"],2:["C"]},p:[1,6]},{t:"q",cat:"SG",q:"Pourquoi les curieux recomptent-ils les marins (¶6) ?",o:["Pour payer les marins","Ils n’y croient pas","Ils cherchent Magellan"],ok:1,fb:"Oui : « comme s’ils s’étaient trompés ».",no:{0:["I"],2:["D"]},p:[6]},{t:"q",cat:"ST",q:"Pourquoi Juan croit-il être mercredi alors qu’on est jeudi (¶5) ?",o:["Il a oublié un jour","Le tour par l’ouest a « perdu » un jour","Le Cap-Vert a un autre calendrier"],ok:1,fb:"Oui : en suivant le soleil vers l’ouest, chaque journée est un peu plus longue ; au bout du tour, on a compté un jour de moins.",no:{0:["C","« Sans en oublier un seul »."],2:["I","Le pilote trouve le même résultat."]},p:[5]},{t:"q",cat:"HYP",q:"Question défi. S’ils avaient fait le tour vers l’est, au retour, leur journal aurait été…",o:["En avance d’un jour","En retard d’un jour","Le texte ne permet pas de répondre"],ok:0,fb:"Oui : vers l’est, c’est l’inverse. C’est le ressort final du Tour du monde en 80 jours.",no:{1:["C","Vers l’ouest, on perd un jour ; vers l’est, c’est l’inverse."],2:["L","Le raisonnement de la question précédente permet de répondre."]}},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Le capitaine est mort aux Philippines.","Les cinq navires sont rentrés en Espagne.","Juan a tenu son journal chaque jour."],ok:1,fb:"Bien vu : un seul navire est rentré.",no:{0:["C","C’est écrit au ¶4."],2:["C","C’est écrit au ¶5."]},p:[6]},{t:"verif"},{t:"corr"},{t:"ecrire",consigne:"Écris l’entrée du 7 septembre 1522 dans le journal de Juan, en trois phrases. Appuie-toi sur a
