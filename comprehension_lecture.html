:root{
  --bg:#eff0f1; --view:#fcfcfc; --alt:#f7f8f8; --text:#232629; --muted:#5d666d;
  --hl:#3daee9; --hl-dark:#1b74a8; --hl-soft:#dceefa; --focus:#1d99f3;
  --pos:#27ae60; --pos-dark:#1e874a; --pos-soft:#e3f4ea; --neg:#da4453; --neu:#f67400; --neu-soft:#fff1e3;
  --warn-soft:#fff4e0; --border:#bcc2c7; --border-soft:#dde1e4;
  --sent:#d7ecfa; --word:#fdbc4b; --word-text:#232629; --sig:#fff6d6; --sig-b:#f3c34f;

}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#202326; --view:#292c30; --alt:#2f3337; --text:#fcfcfc; --muted:#a1a9b1;
    --hl:#3daee9; --hl-dark:#7cc7f0; --hl-soft:#1e3b4f; --focus:#3daee9;
    --pos:#2ecc71; --pos-dark:#7ee2a8; --pos-soft:#1d3a2a; --neu-soft:#3d2e17; --warn-soft:#3d2e17;

    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans","Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--view);padding:10px 14px;border:2px solid var(--focus);border-radius:var(--radius);z-index:50}
.skip:focus{top:8px}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
main{width:100%;max-width:900px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
main.session-main{max-width:1320px}
.muted{color:var(--muted)} .small{font-size:.9rem}
h2,h3{line-height:1.25}

/* Barre d'outils façon KDE */
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:var(--view);border-bottom:1px solid var(--border-soft)}
.toolbar h1{font-size:1.02rem;font-weight:600;margin:0 auto 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.logo{width:34px;height:34px;border-radius:6px;background:var(--hl);color:#fff;display:inline-grid;place-items:center;flex:none}
.prof-sel{min-height:40px;max-width:180px}
.who{width:100%;max-width:900px;margin:12px auto -4px;padding:0 16px}

/* Boutons Breeze */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 14px;
  background:var(--alt);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;
  font-weight:500;line-height:1.2;text-align:left;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--hl);background:var(--hl-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.flat{background:transparent;border-color:transparent}
.btn.flat:hover:not(:disabled){border-color:var(--border-soft);background:var(--alt)}
.btn.icon{padding:8px}
.btn.sm{min-height:40px;padding:6px 12px}
.btn.primary{background:var(--hl);border-color:var(--hl-dark);color:#fff}
.btn.primary:hover:not(:disabled){background:#2a9fdc;border-color:var(--hl-dark)}
@media (prefers-color-scheme: dark){.btn.primary{border-color:#2a9fdc;color:#fff}}
.btn.danger{background:var(--neg);border-color:#b52d3b;color:#fff}
.btn.big{min-height:52px;padding:10px 18px;font-size:1.05rem}
.btn.sel{background:var(--hl-soft);border-color:var(--hl);box-shadow:inset 0 0 0 1px var(--hl)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.row.tight{margin-top:8px;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:17px;border:1px solid var(--border-soft);background:var(--alt);font-size:.92rem}
.chip svg{width:16px;height:16px}
.chip.ok{border-color:var(--pos);background:var(--pos-soft)}
.input{min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--view);flex:1;min-width:0}

/* Cartes */
.card{background:var(--view);border:1px solid var(--border-soft);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow)}
.eyebrow{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.h-small{font-size:1rem;margin:0 0 8px} .h-mid{font-size:1.25rem;margin:2px 0 8px}
.notice{padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border-soft);background:var(--alt);font-size:.95rem}
.notice.warn{background:var(--warn-soft);border-color:#f3c78a}
.notice ul{margin:6px 0;padding-left:20px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--hl)}
.banner.good{border-left-color:var(--pos)}
.banner h2{margin:2px 0 4px;font-size:1.2rem} .banner p{margin:0}

/* Accueil : paliers et fiches */
.pal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lib{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.lib-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;border:1px solid transparent}
.lib-item:hover{background:var(--alt)}
.lib-item.locked{color:var(--muted)}
.lib-n{min-width:38px;height:30px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--alt);border:1px solid var(--border-soft);font-weight:600;font-size:.88rem;padding:0 6px}
.lib-t{flex:1;display:flex;flex-direction:column;min-width:0}
.lib-t small{color:var(--muted);font-size:.84rem}
.lib-act{display:flex;gap:6px;flex:none}
.lib-act .btn{min-width:56px}
.lock{display:grid;place-items:center;width:44px;height:44px;color:var(--muted)}

/* Séance */
.session-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;position:sticky;top:57px;z-index:5}
.tts{display:flex;gap:8px;align-items:center}
.progress{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:280px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border-soft)}
.dots i.past{background:var(--hl-soft);box-shadow:inset 0 0 0 1px var(--hl)}
.dots i.on{background:var(--hl);transform:scale(1.3)}
.session{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;max-width:820px;margin:0 auto;width:100%}
.session.with-text{max-width:none;grid-template-columns:minmax(0,1.1fr) minmax(330px,1fr)}
.text-pane{position:sticky;top:122px;max-height:calc(100vh - 140px);display:flex;flex-direction:column;padding:14px 16px}
.text-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--border-soft);padding-bottom:8px;margin-bottom:8px}
.text-head h2{margin:0;font-size:1.15rem}
.reading{overflow:auto;min-height:0;flex:1 1 auto;padding:2px 8px 8px 2px;-webkit-tap-highlight-color:transparent}
.reading p{margin:0}
.reading.wide,.preview.wide,.panel.wide .q-text,.panel.wide .opt-t,.panel.wide .fb,.panel.wide .think,.panel.wide .aid,.panel.wide .model{letter-spacing:.12em;word-spacing:.16em}
.para{position:relative;padding:6px 10px 6px 38px;margin:0 0 .55em;border-radius:6px;border-left:4px solid transparent;transition:background-color .2s}
.para.sig{background:var(--sig);border-left-color:var(--sig-b)}
.pn{position:absolute;left:6px;top:.45em;font-family:"Noto Sans",system-ui,sans-serif;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:0;line-height:1.6}
.note{margin:8px 0 0}
.th-act{margin:0;flex:none}
.fold-btn{display:none}
.reading.folded{display:none}
.panel .h-mid,.panel .eyebrow,.panel .strat-tag,.panel .btn,.panel .opt-l{font-family:"Noto Sans","Segoe UI",Roboto,sans-serif;letter-spacing:0;word-spacing:0}
.panel .h-mid{font-size:1.2rem}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover{text-decoration:underline;text-decoration-color:var(--hl);text-underline-offset:4px}
.snt.on{background:var(--sent);border-radius:4px;box-shadow:0 0 0 2px var(--sent)}
.w.wd{background:var(--word);color:var(--word-text);box-shadow:0 0 0 2px var(--word)}
.opt .w{cursor:inherit} .opt .w:hover{text-decoration:none}
.panel{padding:18px 20px}
.panel p{margin:0 0 10px}
.screen-head{margin-bottom:10px}
.screen-head h2:focus{outline:none}
.strat-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:14px;background:var(--hl-soft);color:var(--hl-dark);font-size:.86rem;font-weight:600}
.strat-tag svg{width:18px;height:18px}
.block{margin:0 0 14px}
.sais{margin:4px 0 0;padding-left:22px} .sais li{margin:4px 0}
.think{border-left:4px solid var(--hl);background:var(--hl-soft);padding:12px 14px;border-radius:0 6px 6px 0;margin:6px 0 10px}
.think p{margin:0}
.q-text{font-size:1.08em;font-weight:500;margin:4px 0 12px}
.q-text p{margin:0 0 4px}
.ponc p{padding:6px 10px;border:1px dashed var(--border);border-radius:6px;margin:0 0 6px;font-weight:400}
.ponc p:last-child{border:0;padding:6px 0;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;text-align:left;cursor:pointer;
  background:var(--view);border:1px solid var(--border);border-radius:8px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--hl);background:var(--hl-soft)}
.opt:disabled{cursor:default}
.opt-l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);font-weight:700;background:var(--alt);font-family:"Noto Sans",system-ui,sans-serif;letter-spacing:0}
.opt-t{flex:1}
.opt-i{flex:none;display:grid;place-items:center}
.opt.sel{border-color:var(--hl);background:var(--hl-soft);box-shadow:inset 0 0 0 1px var(--hl)}
.opt.good{border-color:var(--pos);background:var(--pos-soft);box-shadow:inset 0 0 0 1px var(--pos)}
.opt.good .opt-l{background:var(--pos);border-color:var(--pos);color:#fff}
.opt.bad{border-color:var(--neu);background:var(--neu-soft);opacity:.85}
.opt.bad .opt-t{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35)}
.opt.dim{opacity:.55}
.jnsp{align-self:flex-start;margin-top:2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.jnsp.sel{color:var(--text);background:var(--hl-soft)}
.feedback{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.feedback:empty{display:none}
.fb{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:6px;border:1px solid var(--border-soft)}
.fb svg{flex:none;margin-top:2px}
.fb.ok{background:var(--pos-soft);border-color:var(--pos)}
.fb.no{background:var(--neu-soft);border-color:#f3b06a}
.fb.neutral{background:var(--alt)}
.fb.reveal{display:block;background:var(--alt);border-left:4px solid var(--hl)}
.fb.reveal p{margin:0 0 6px}
.aid{padding:10px 12px;border-radius:6px;background:var(--sig);border:1px solid var(--sig-b)}
.aid p{margin:4px 0 0}
.mots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
textarea.answer{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--view);resize:vertical}
.model{padding:10px 12px;border-radius:6px;background:var(--alt);border-left:4px solid var(--pos);width:100%}
.model p{margin:4px 0 0}
.notice.talk{display:flex;gap:10px;align-items:flex-start}
.notice.talk p{margin:0}
.rappel{padding-left:22px;margin:8px 0 0;display:flex;flex-direction:column;gap:14px}
.rap-item p{margin:0 0 8px}
.rap-ans{display:flex;flex-direction:column;gap:6px}
.checks{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border-soft);border-radius:6px;cursor:pointer;background:var(--view)}
.check.on{border-color:var(--hl);background:var(--hl-soft)}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--hl);flex:none}
.check span{display:flex;flex-direction:column} .check small{color:var(--muted)}
.strat-list{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:8px 0 12px}
.verif,.corr{padding-left:0;list-style:none;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.verif li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border-soft);border-radius:6px}
.v-q{flex:1 1 100%} .v-a{flex:1;font-weight:600} .v-a.miss{color:var(--neg)}
.corr li{padding:10px 12px;border:1px solid var(--border-soft);border-radius:6px;border-left:4px solid var(--pos)}
.corr li.bad{border-left-color:var(--neu)}
.fin{text-align:center;padding:10px 0}
.big-num{font-size:1.2rem;margin:10px 0 0} .big-num b{font-size:2.6rem;color:var(--hl-dark)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-soft)}
.hint{text-align:right;margin:6px 0 0}

/* Suivi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.kpis div{display:flex;flex-direction:column;padding:10px 12px;border:1px solid var(--border-soft);border-radius:6px;background:var(--alt)}
.kpis b{font-size:1.5rem;color:var(--hl-dark)} .kpis span{font-size:.85rem;color:var(--muted)}
.bars{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.bars li{display:grid;grid-template-columns:minmax(150px,240px) 1fr 52px;gap:10px;align-items:center}
.b-bar{height:12px;border-radius:6px;background:var(--border-soft);overflow:hidden}
.b-bar i{display:block;height:100%;background:var(--hl)}
.b-v{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border-soft);vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:.84rem}
.prod{padding:8px 0;border-bottom:1px solid var(--border-soft)} .prod p{margin:4px 0 0;white-space:pre-wrap}
details.adult{border:1px solid var(--border-soft);border-radius:6px;padding:8px 12px;background:var(--alt);margin:6px 0}
details.adult summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}

/* Profils (enseignant) */
.profiles{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px}
.profiles li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border:1px solid var(--border-soft);border-radius:6px}
.profiles li.cur{border-color:var(--hl);background:var(--hl-soft)}
.profiles .input{flex:1 1 160px}

/* Fenêtres */
.overlay{position:fixed;inset:0;background:rgba(35,38,41,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.side{justify-content:flex-end;padding:0}
.modal{background:var(--view);border-radius:8px;border:1px solid var(--border);width:100%;max-width:480px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal.wide{max-width:720px}
.overlay.side .modal{max-width:440px;height:100%;max-height:none;border-radius:0;border-width:0 0 0 1px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 18px;border-bottom:1px solid var(--border-soft)}
.modal-head h2{font-size:1.08rem;margin:0}
.modal-body{padding:14px 18px 20px;overflow:auto}
.set-group{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border-soft);display:flex;flex-direction:column;gap:12px}
.set-group:last-child{border-bottom:0}
.set-group h3{margin:0;font-size:.95rem;color:var(--hl-dark)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field-label{font-weight:500;display:flex;justify-content:space-between}
.field output{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:44px;accent-color:var(--hl);cursor:pointer}
select{min-height:44px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--alt);max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-opt{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--alt)}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opt.on{background:var(--hl-soft);border-color:var(--hl);box-shadow:inset 0 0 0 1px var(--hl)}
.seg-opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.switch{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.switch .track{flex:none;width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background .15s}
.switch .track span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--hl)}
.switch input:checked + .track span{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--focus);outline-offset:2px}
.sw-text{display:flex;flex-direction:column}
.sw-text small{color:var(--muted);font-size:.84rem}
.preview{margin-top:4px;padding:12px 14px;border:1px dashed var(--border);border-radius:6px;background:var(--view)}
.help-list{padding-left:20px;margin:6px 0 12px} .help-list li{margin:4px 0}

@media (max-width:960px){
  .session.with-text{grid-template-columns:minmax(0,1fr)}
  .text-pane{position:relative;top:0;max-height:46vh}
  .fold-btn{display:inline-flex}
}
@media (max-width:560px){
  .lbl-txt{display:none}
  main{padding:10px 8px 32px}
  .panel{padding:14px 14px}
  .text-pane{padding:10px 10px;max-height:42vh}
  .para{padding-left:30px}
  .session-bar{top:57px}
  .dots{display:none}
  .bars li{grid-template-columns:1fr 52px}.bars .b-bar{grid-column:1/-1;grid-row:2}
  .pager .btn.big{flex:1}
  .lib-item{flex-wrap:wrap}.lib-act{margin-left:auto}
}
@media print{
  .toolbar,.no-print,.skip{display:none!important}
  body{background:#fff} .card{box-shadow:none;break-inside:avoid}
  details.adult{display:block} details.adult > *{display:block}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .dots i.on{transform:none}
}
</style>

e l’essentiel",msg:"C’est un détail du texte, pas l’idée principale."}},is=[{n:1,nom:"Découvrir",aide:"Deux coups de pouce automatiques après une erreur."},{n:2,nom:"S’entraîner",aide:"Un coup de pouce automatique, un second sur demande."},{n:3,nom:"Approfondir",aide:"Rappel de la stratégie sur demande. Fiches dans l’ordre de ton choix."},{n:4,nom:"Expert",aide:"Aucune aide pendant la séance. Tu vérifies tes réponses avant la correction."}],Ta=["Texte a","Texte b","Les deux"],We=[{id:"1.1",palier:1,titre:"Le penalty de Sacha",genre:"Récit",theme:"Football",paras:["Il restait deux minutes à jouer. Le score était de 1 à 1. Les tribunes du petit stade criaient si fort que Sacha n’entendait plus ses propres pensées.","Soudain, Adam fut bousculé dans la surface. L’arbitre siffla et montra le point blanc.","Tous les regards se tournèrent vers Sacha. Depuis le début de la saison, c’était elle qui tirait les penalties de l’équipe. Elle posa le ballon, recula de quatre pas et essuya ses mains sur son short. En face, le gardien sautillait sur sa ligne en agitant les bras.","À la mi-temps, l’entraîneur lui avait soufflé : « Regarde-le bien, il plonge toujours du même côté. »","Sacha prit son élan. Au dernier moment, elle changea d’idée et frappa au milieu, en force. Le gardien était déjà couché à sa droite.","Quelques secondes plus tard, elle disparut sous une montagne de maillots verts. Sur le banc, l’entraîneur secouait la tête en souriant : « Elle ne m’écoute jamais, celle-là… »"],suite:[{q:"Où Sacha a-t-elle tiré son penalty ?",r:"Au milieu, en force."},{q:"Quel était le score à la fin du match ?",r:"2 à 1 pour l’équipe de Sacha."}],A:{titre:"Je me fais le film",strat:"S1",ecrans:[{t:"avant",aujourdhui:"Tu vas apprendre à te faire le film du texte dans ta tête.",but:"Tu vas lire la fin d’un match très serré. Trouve ce qui se passe… et ce que le texte ne dit pas.",sais:["Quand un joueur subit une faute dans la surface, c’est-à-dire la zone devant le but, l’arbitre siffle un penalty.","Un joueur tire alors depuis le point blanc, seul face au gardien."]},{t:"montre",s:"S1",p:[1],seul:[1],txt:"Je lis : 1 à 1, deux minutes à jouer. Dans ma tête, je vois le tableau d’affichage. Je comprends que tout va se jouer maintenant. À chaque paragraphe, je mettrai mon film à jour."},{t:"lire"},{t:"film",amorce:"À la fin du match, Sacha doit…",modele:"À la fin du match, Sacha doit tirer un penalty qui peut faire gagner son équipe."},{t:"q",cat:"G",q:"De quoi parle surtout ce texte ?",o:["D’une dispute avec l’entraîneur","D’un match perdu par Sacha","D’un penalty tiré par Sacha"],ok:2,fb:"Oui, tout le texte tourne autour de ce tir.",no:{0:["C","L’entraîneur sourit à la fin (¶6) : ce n’est pas une dispute."],1:["C","Relis le ¶6 : l’équipe a-t-elle l’air triste ?"]},p:[6]},{t:"q",cat:"F",q:"« L’arbitre siffla » (¶2). Pourquoi ?",o:["Adam a été bousculé","Le gardien a bougé","Le match est fini"],ok:0,fb:"Oui, c’est écrit juste avant, au ¶2.",no:{1:["I","Relis la phrase juste avant « L’arbitre siffla »."],2:["I","Relis la phrase juste avant « L’arbitre siffla »."]},p:[2]},{t:"q",cat:"F",q:"Quel conseil l’entraîneur a-t-il donné (¶4) ?",o:["Tirer fort au milieu","Observer le gardien","Laisser Adam tirer"],ok:1,fb:"Oui : « Regarde-le bien ».",no:{0:["C","Ça, c’est ce que Sacha fait au ¶5. Le conseil est au ¶4."],2:["R","Adam ne tire pas : c’est lui qui a subi la faute."]},p:[4]},{t:"q",cat:"VOC",q:"« Adam fut bousculé » (¶2). Cela veut dire :",o:["On l’a poussé brusquement","Il a glissé tout seul","Il a marqué un but"],ok:0,cp1:"Lis la phrase suivante : l’arbitre siffle. Pourquoi ?",fb:"Oui : quelqu’un l’a poussé, c’est une faute.",no:{1:["C","Glisser tout seul, ce n’est pas une faute."],2:["I","Le score est toujours 1 à 1 à ce moment-là."]},p:[2]},{t:"q",cat:"GRAM",q:"Sacha est…",o:["une fille","un garçon","on ne sait pas"],ok:0,cp1:"Cherche au ¶3 le petit mot qui remplace Sacha.",fb:"Oui ! Le mot « fille » n’est pas écrit, mais le petit mot « elle » le dit.",no:{1:["C","Regarde le petit mot qui remplace Sacha au ¶3."],2:["L","Un petit mot le dit à la place de « fille ». Cherche-le au ¶3."]},p:[3]}]},B:{titre:"Qui est qui ?",strat:"S2",ecrans:[{t:"rappel",items:[{q:"Qui a été bousculé ?",r:"Adam."},{q:"Quel conseil l’entraîneur avait-il donné ?",r:"Bien regarder le gardien, qui plonge toujours du même côté."}]},{t:"lire",relire:!0},{t:"montre",s:"S2",p:[3,4],txt:"« Regarde-le bien » (¶4) : « le », c’est qui ? Je remonte au ¶3 : le gardien sautille. Je remplace : « Regarde bien le gardien, il plonge toujours du même côté. » Ça marche !"},{t:"q",cat:"ANA",s:"S2",q:"« Elle ne m’écoute jamais, celle-là » (¶6). « Celle-là », c’est…",o:["l’arbitre","Sacha","la mi-temps"],ok:1,cp2:"L’entraîneur avait donné un conseil à … (¶4). Remplace « celle-là » par ta réponse.",fb:"Bravo, tu es remonté(e) au ¶4 : c’est à Sacha qu’il avait parlé.",no:{0:["R","L’arbitre n’a reçu aucun conseil. Qui l’entraîneur conseillait-il ?"],2:["R","Une mi-temps n’écoute personne ! Remplace « celle-là » par ta réponse pour vérifier."]},p:[6]},{t:"q",cat:"NUM",s:"S1",q:"Quel est sans doute le score final ?",o:["2 à 1","1 à 1","1 à 2"],ok:0,cp2:"Avant le tir : 1 à 1 (¶1). Puis les maillots verts sautent sur Sacha (¶6). Donc…",fb:"Oui ! Tu as mis ton film à jour : 1 à 1, plus le but de Sacha.",no:{1:["L","C’était le score avant le tir. Que se passe-t-il ensuite au ¶6 ?"],2:["C","Ce sont les coéquipiers de Sacha qui font la fête."]},p:[1,6]},{t:"q",cat:"SL",q:"« Elle disparut sous une montagne de maillots verts » (¶6). Que se passe-t-il ?",o:["Des adversaires l’entourent","Elle tombe et se blesse","Ses coéquipiers la félicitent"],ok:2,fb:"Oui : quand on marque, l’équipe saute sur le buteur.",no:{0:["C","Les adversaires ne fêtent pas un but qu’ils encaissent."],1:["I","Le texte ne parle pas de blessure."]},p:[6]},{t:"q",cat:"SG",q:"L’entraîneur sourit (¶6). Pourquoi ?",o:["Elle a suivi son conseil","Elle a marqué malgré tout","Il se moque d’elle"],ok:1,cp1:"Relis le ¶5 : où a-t-elle tiré ?",fb:"Oui ! Elle a changé d’idée, et ça a marché quand même.",no:{0:["C","Au ¶5, elle « changea d’idée »."],2:["I","Elle vient de marquer : pourquoi se moquerait-il d’elle ?"]},p:[5,6]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Sacha avait le cœur qui battait fort.","Sacha tira à gauche, comme prévu.","Le public retenait son souffle."],ok:1,fb:"Bien vu : au ¶5, elle tire au milieu.",no:{0:["I","Le texte ne le dit pas, mais ça ne le contredit pas."],2:["I","Le texte ne le dit pas, mais ça ne le contredit pas."]},p:[5]},{t:"ecrire",consigne:"Avec les mots penalty, conseil et but, complète la phrase.",mots:["penalty","conseil","but"],amorce:"À la fin du match, Sacha…",modele:"À la fin du match, Sacha marque le penalty de la victoire sans suivre le conseil de son entraîneur."},{t:"parler",txt:"Raconte le texte à quelqu’un sans le regarder."}]}},{id:"1.2",palier:1,titre:"Survivre à sa première nuit dans Minecraft",genre:"Texte informatif",theme:"Jeu vidéo",paras:["Dans Minecraft, le monde est entièrement fait de cubes. Le joueur peut casser ces blocs, les ramasser et les reposer ailleurs pour construire tout ce qu’il imagine : une cabane, un château ou même une ville entière.","Mais attention : en mode Survie, le temps passe vite. Une journée complète dure 20 minutes dans la vraie vie. Le jour occupe environ la moitié de ce temps ; le reste est partagé entre le coucher du soleil, la nuit et le lever du soleil. Or, dès qu’il fait sombre, des monstres apparaissent : zombies, squelettes et araignées géantes. Les creepers, eux, s’approchent sans bruit puis explosent.","Pour passer leur première nuit sans danger, les joueurs expérimentés suivent toujours le même ordre. **D’abord**, ils coupent du bois pour fabriquer une table de craft. **Ensuite**, ils construisent un abri, même tout petit. **Enfin**, s’ils ont trouvé trois blocs de laine, ils fabriquent un lit : dormir permet de sauter la nuit.","Un dernier conseil : ne creusez jamais tout droit sous vos pieds. Vous ne savez pas ce qui se cache en dessous."],suite:[{q:"Dans Minecraft, que fait-on en premier pour passer la nuit ?",r:"On coupe du bois pour fabriquer une table de craft."},{q:"À quoi sert le lit ?",r:"Dormir permet de sauter la nuit."}],A:{titre:"Je repère le plan",strat:"S4",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Tu vas apprendre à survivre à ta première nuit.",sais:["Dans un jeu de survie, il faut récolter des ressources et se protéger des dangers.","Une table de craft sert à fabriquer des objets en combinant des matériaux."]},{t:"montre",s:"S4",p:[3],txt:"Au ¶3, je repère des mots-indices : D’abord… Ensuite… Enfin… Ce sont des étapes dans l’ordre. Je fais un schéma : 1, puis 2, puis 3."},{t:"lire"},{t:"q",cat:"G",q:"À quoi sert surtout ce texte ?",o:["Raconter une aventure","Convaincre d’acheter le jeu","Expliquer comment survivre"],ok:2,fb:"Oui : il donne des explications et des conseils.",no:{0:["C","Il n’y a ni personnage ni histoire."],1:["I"]}},{t:"q",cat:"F",q:"Combien dure une journée complète, dans la vraie vie (¶2) ?",o:["20 minutes","10 minutes","24 heures"],ok:0,fb:"Oui, c’est écrit au ¶2.",no:{1:["L","10 minutes, c’est seulement le jour."],2:["I"]},p:[2]},{t:"q",cat:"ANA",s:"S2",q:"« …les ramasser » (¶1). « Les », ce sont…",o:["les joueurs","les monstres","les blocs"],ok:2,fb:"Oui : « casser ces blocs, les ramasser ».",no:{0:["R"],1:["R","Les monstres ne sont cités qu’au ¶2."]},p:[1]},{t:"q",cat:"STRUCT",s:"S4",q:"Comment est organisé le ¶3 ?",o:["Des étapes dans l’ordre","Une comparaison","Une histoire"],ok:0,fb:"Oui : les mots-indices d’abord, ensuite, enfin.",no:{1:["C"],2:["C"]},p:[3]},{t:"q",cat:"ST",s:"S4",q:"Que fait-on en deuxième (¶3) ?",o:["Couper du bois","Fabriquer un lit","Construire un abri"],ok:2,fb:"Oui : « Ensuite », c’est la deuxième étape.",no:{0:["L","C’est la première étape."],1:["L","C’est la dernière étape."]},p:[3]}]},B:{titre:"Texte + tête",strat:"S3",ecrans:[{t:"rappel",items:[{q:"Combien dure une journée complète ?",r:"20 minutes dans la vraie vie."},{q:"Quelles sont les trois étapes ?",r:"Couper du bois, construire un abri, fabriquer un lit."}]},{t:"lire",relire:!0},{t:"montre",s:"S3",p:[4],txt:"Pourquoi ne jamais creuser tout droit sous ses pieds ? Le texte dit : « Vous ne savez pas ce qui se cache en dessous. » Je sais : sous terre, il y a des grottes et de la lave. Donc on risque de tomber dans un trou ou dans la lave."},{t:"q",cat:"F",q:"Que font les creepers (¶2) ?",o:["Ils attaquent le jour","Ils approchent et explosent","Ils lancent des flèches"],ok:1,fb:"Oui : ils s’approchent sans bruit puis explosent.",no:{0:["C","Les monstres apparaissent quand il fait sombre."],2:["I"]},p:[2]},{t:"q",cat:"VOC",q:"Les joueurs « expérimentés » (¶3), ce sont des joueurs…",o:["qui connaissent bien le jeu","qui débutent","qui trichent"],ok:0,cp1:"Ils savent déjà dans quel ordre faire les choses.",fb:"Oui : ils connaissent le jeu, c’est pour ça qu’ils donnent des conseils.",no:{1:["C","Ce sont eux qui donnent les conseils."],2:["I"]},p:[3]},{t:"q",cat:"NUM",q:"Combien de temps dure environ le jour ?",o:["5 minutes","10 minutes","20 minutes"],ok:1,cp1:"Cherche le mot « moitié » au ¶2.",cp2:"La moitié de 20 minutes, c’est…",fb:"Oui : la moitié de 20 minutes.",no:{0:["C"],2:["L","20 minutes, c’est la journée complète."]},p:[2]},{t:"q",cat:"HYP",s:"S6",q:"Léa a un abri, mais un seul bloc de laine. Peut-elle sauter la nuit ?",o:["Oui","Non","Le texte ne permet pas de répondre"],ok:1,fb:"Oui : il faut trois blocs de laine pour le lit.",no:{0:["C"],2:["L","La règle est écrite au ¶3 : il suffit de l’appliquer."]},p:[3]},{t:"q",cat:"SG",s:"S3",q:"À qui ce texte s’adresse-t-il surtout ?",o:["Aux créateurs du jeu","Aux joueurs débutants","Aux parents des joueurs"],ok:1,cp2:"Le texte dit « vous », « première nuit », « un conseil ». Je sais que… Donc…",fb:"Oui : des conseils pour une première nuit, c’est pour ceux qui débutent.",no:{0:["I","Les créateurs connaissent déjà leur jeu."],2:["I"]}},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Les zombies apparaissent quand il fait sombre.","La nuit dure plus longtemps que le jour.","Il faut du bois pour la table de craft."],ok:1,fb:"Bien vu : le jour dure environ la moitié du temps ; le reste est partagé en trois moments. La nuit est donc plus courte.",no:{0:["C","Le ¶2 le dit."],2:["C","Le ¶3 le dit."]},p:[2]},{t:"ecrire",consigne:"Écris les trois étapes dans l’ordre, puis résume le texte en une phrase avec les mots nuit, abri et lit.",mots:["nuit","abri","lit"],amorce:"1. … 2. … 3. …",modele:"1. Couper du bois et fabriquer une table de craft. 2. Construire un abri. 3. Fabriquer un lit. Pour passer la première nuit, il faut un abri et un lit pour dormir."},{t:"parler",txt:"Explique à quelqu’un comment passer sa première nuit, sans regarder le texte."}]}},{id:"1.3",palier:1,titre:"Bonjour, version monde",genre:"Texte informatif",theme:"Cultures du monde",paras:["Tendre la main, faire la bise, sourire… Pour nous, dire bonjour semble simple. Pourtant, chaque pays a ses habitudes, et un geste poli ici peut paraître étrange ailleurs.","Au Japon, on ne se touche pas : on s’incline. Plus la personne en face est âgée ou importante, plus on se penche bas. En Thaïlande, on joint les mains devant la poitrine, comme pour une prière, et on baisse légèrement la tête : c’est le « wai ». En Inde, un geste semblable s’accompagne d’un mot : « namasté ».","En Nouvelle-Zélande, les Maoris pratiquent le « hongi » : deux personnes approchent leur visage jusqu’à ce que leurs nez et leurs fronts se touchent. Elles partagent ainsi le même souffle.","Au Maroc, après une poignée de main, beaucoup de gens posent la main droite sur leur cœur. Ce geste veut dire : « Je te salue sincèrement. »","Alors, avant de partir en voyage, mieux vaut observer comment les habitants se saluent entre eux. C’est souvent la première chose que l’on remarque… et la première que l’on oublie d’apprendre."],suite:[{q:"Comment salue-t-on au Japon ?",r:"On s’incline, sans se toucher."},{q:"Que veut dire la main sur le cœur au Maroc ?",r:"« Je te salue sincèrement. »"}],A:{titre:"Je consolide",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Découvre comment on se salue ailleurs, pour ne pas faire de gaffe en voyage.",sais:["Un même geste n’a pas le même sens partout.","Les Maoris sont le premier peuple de Nouvelle-Zélande."]},{t:"lire"},{t:"q",cat:"G",q:"Quelle est l’idée principale ?",o:["Le bonjour japonais est le plus poli","Chaque pays a sa façon de saluer","Il faut toujours serrer la main"],ok:1,fb:"Oui, c’est l’idée du ¶1, puis les exemples suivent.",no:{0:["D","Le Japon n’est qu’un exemple parmi d’autres."],2:["C"]},p:[1]},{t:"q",cat:"F",q:"Comment s’appelle la salutation thaïlandaise (¶2) ?",o:["Le hongi","Le namasté","Le wai"],ok:2,fb:"Oui, c’est le wai.",no:{0:["R","Le hongi, c’est en Nouvelle-Zélande."],1:["R","Namasté, c’est en Inde."]},p:[2]},{t:"q",cat:"F",q:"Pendant le hongi, que se touchent les deux personnes (¶3) ?",o:["Le nez et le front","Les mains","Les épaules"],ok:0,fb:"Oui : le nez et le front.",no:{1:["R","Les mains jointes, c’est le wai."],2:["I"]},p:[3]},{t:"q",cat:"ANA",s:"S2",q:"« Elles partagent ainsi le même souffle » (¶3). « Elles », ce sont…",o:["les mains","les Néo-Zélandaises","les deux personnes qui se saluent"],ok:2,fb:"Oui : « deux personnes » est le sujet de la phrase d’avant.",no:{0:["R"],1:["R"]},p:[3]},{t:"q",cat:"STRUCT",s:"S4",q:"Comment le texte est-il organisé ?",o:["Comme une histoire","Pays après pays, un geste chacun","Comme des étapes à suivre"],ok:1,fb:"Oui : un pays, un geste, puis le pays suivant.",no:{0:["C"],2:["C"]}},{t:"q",cat:"VOC",q:"« On s’incline » (¶2) veut dire :",o:["On penche le haut du corps","On lève les bras","On serre la main"],ok:0,cp1:"Lis la phrase suivante : « on se penche ».",fb:"Oui : on penche le haut du corps vers l’avant.",no:{1:["I"],2:["C","Au Japon, on ne se touche pas."]},p:[2]},{t:"ecrire",consigne:"Pour chaque pays, écris le geste et ce qu’il veut dire. Puis résume le texte en une phrase.",amorce:`Japon : s’incliner, plus bas devant une personne âgée.
Maroc : la main sur le cœur, « je te salue sincèrement ».
Thaïlande : …
Inde : …
Nouvelle-Zélande : …`,modele:"Thaïlande : le wai, mains jointes et tête baissée. Inde : namasté, mains jointes. Nouvelle-Zélande : le hongi, nez et front qui se touchent. Chaque pays a sa propre façon de dire bonjour."}]},B:{titre:"Le texte permet-il de répondre ?",strat:"S6",ecrans:[{t:"rappel",items:[{q:"Comment s’appelle la salutation thaïlandaise ?",r:"Le wai."},{q:"Comment le texte est-il organisé ?",r:"Pays après pays, avec un geste pour chacun."}]},{t:"lire",relire:!0},{t:"montre",s:"S6",txt:"Au Brésil, comment se salue-t-on ? Je cherche « Brésil » dans le texte : il n’y est pas. Je ne réponds pas avec ce que je crois savoir. La bonne réponse est : « Le texte ne permet pas de répondre. »"},{t:"q",cat:"HYP",s:"S3",q:"Au Japon, Tom rencontre la grand-mère de son correspondant. Que doit-il faire ?",o:["S’incliner très bas","Lui faire la bise","S’incliner un tout petit peu"],ok:0,cp2:"Le texte dit : plus la personne est âgée, plus on se penche. Je sais : une grand-mère est âgée. Donc…",fb:"Oui ! Tu as relié le texte et ce que tu sais.",no:{1:["I","Au Japon, « on ne se touche pas »."],2:["C","Plus la personne est âgée, plus on se penche bas."]},p:[2]},{t:"q",cat:"SL",q:"Quel est le point commun entre le wai et le namasté ?",o:["On se touche le nez","On joint les mains","On se serre la main"],ok:1,fb:"Oui : « un geste semblable », les mains jointes.",no:{0:["R","Ça, c’est le hongi."],2:["I"]},p:[2]},{t:"q",cat:"HYP",s:"S6",q:"Les Maoris se serrent-ils aussi la main ?",o:["Oui","Non","Le texte ne permet pas de répondre"],ok:2,fb:"Oui : le texte ne parle que du hongi pour les Maoris.",no:{0:["I"],1:["I","Ne pas en parler ne veut pas dire que ça n’existe pas."]},p:[3]},{t:"q",cat:"SG",q:"« …et la première que l’on oublie d’apprendre » (¶5). Que veut dire l’auteur ?",o:["On oublie de s’informer avant","On oublie de dire bonjour","Saluer ne sert à rien"],ok:0,fb:"Oui : on remarque les saluts, mais on oublie de les apprendre avant de partir.",no:{1:["L"],2:["C"]},p:[5]},{t:"q",cat:"PONC",q:`Texte a : « Inès, dit Hugo, vient du Japon. »
Texte b : « Inès dit : “Hugo vient du Japon.” »
Quel texte veut dire qu’Inès vient du Japon ?`,o:Ta,ok:0,fb:"Oui : les virgules encadrent « dit Hugo » : c’est Hugo qui parle d’Inès.",no:{1:["C","Dans le texte b, c’est Hugo qui vient du Japon."],2:["C"]}},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Au Japon, deux amis se touchent le front.","Au Japon, un élève s’incline devant son professeur.","En Inde, on dit namasté en joignant les mains."],ok:0,fb:"Bien vu : au Japon, « on ne se touche pas ».",no:{1:["C","C’est bien ce que dit le ¶2."],2:["C","C’est bien ce que dit le ¶2."]},p:[2]},{t:"parler",txt:"Montre à quelqu’un deux façons de se saluer que tu as découvertes, et explique-les. Essaie : joins les mains et baisse un peu la tête."}]}},{id:"1.4",palier:1,titre:"La nuit verte",genre:"Récit",theme:"Voyage",paras:["Cela faisait trois soirs que Nora et son cousin Élio attendaient. Chaque nuit, ils enfilaient deux pulls, une doudoune et des moufles, puis sortaient sur la colline derrière le chalet de leur oncle, à Tromsø, en Norvège. Et chaque nuit, les nuages cachaient tout.","Ce soir-là, le ciel était parfaitement clair. Il faisait si froid que la neige craquait sous leurs bottes. Élio sortit son téléphone pour regarder l’heure : 23 h 40. Il le rangea aussitôt dans sa poche, car ses doigts commençaient à lui faire mal.","– On rentre ? murmura-t-il. Il n’y aura rien, comme hier.","Nora ne répondit pas. Elle fixait un point au-dessus de la montagne, là où une fine traînée pâle venait d’apparaître. On aurait dit un nuage… sauf que ce nuage bougeait.","En quelques minutes, la traînée devint un long ruban vert qui ondulait d’un bout à l’autre du ciel, comme un rideau agité par le vent.","Élio en oublia ses doigts gelés. Pendant de longues minutes, aucun des deux ne prononça un mot.","Le lendemain, ils dormirent jusqu’à midi."],suite:[{q:"Qu’attendaient Nora et Élio ?",r:"De voir une aurore boréale, une lumière qui danse dans le ciel."},{q:"Pourquoi ont-ils dormi jusqu’à midi ?",r:"Ils s’étaient couchés très tard."}],A:{titre:"Je vérifie que ça tient",strat:"S5",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Deux cousins attendent quelque chose dans le ciel. Le texte ne dit jamais quoi : à toi de le découvrir.",sais:["Tromsø est une ville tout au nord de la Norvège.","L’hiver, il y fait très froid et la nuit tombe très tôt."]},{t:"lire"},{t:"montre",s:"S5",p:[4],txt:"Je lis : « On aurait dit un nuage… sauf que ce nuage bougeait. » Bizarre ! Je m’arrête. Mon film ne tient plus : ce n’est sûrement pas un vrai nuage. Je garde la question en tête et je continue."},{t:"q",cat:"G",q:"De quoi parle ce texte ?",o:["Deux cousins guettent le ciel","Une randonnée en montagne","Une tempête de neige"],ok:0,fb:"Oui : ils attendent quelque chose dans le ciel.",no:{1:["I"],2:["C","Le ciel est parfaitement clair (¶2)."]}},{t:"q",cat:"F",q:"Les soirs d’avant, qu’est-ce qui cachait le ciel (¶1) ?",o:["Le brouillard","Les nuages","La neige"],ok:1,fb:"Oui : « les nuages cachaient tout ».",no:{0:["I"],2:["I"]},p:[1]},{t:"q",cat:"ANA",s:"S2",q:"« Il le rangea aussitôt » (¶2). « Le », c’est…",o:["le pull","le téléphone","le ciel"],ok:1,fb:"Oui : « Élio sortit son téléphone… Il le rangea ».",no:{0:["R"],2:["R","On ne range pas le ciel dans sa poche."]},p:[2]},{t:"q",cat:"GRAM",q:"« …murmura-t-il » (¶3). Qui parle ?",o:["Nora","L’oncle","Élio"],ok:2,fb:"Oui : « il » désigne un garçon, et Élio est le seul garçon dehors.",no:{0:["C","« Il » désigne un garçon."],1:["R","L’oncle n’est pas sur la colline."]},p:[3]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Nora tremblait sous ses moufles.","Ce soir-là, de gros nuages couvraient le ciel.","La neige craquait sous leurs bottes."],ok:1,fb:"Bien vu : le texte dit « ciel parfaitement clair » (¶2).",no:{0:["I","Le texte ne le dit pas, mais ça ne le contredit pas."],2:["C","C’est écrit au ¶2."]},p:[2]}]},B:{titre:"Bilan du palier 1",ecrans:[{t:"rappel",items:[{q:"Qu’est-ce qui cachait le ciel les soirs d’avant ?",r:"Les nuages."},{q:"Qui veut rentrer ?",r:"Élio."}]},{t:"lire",relire:!0},{t:"q",cat:"ST",q:"En quelle saison se passe l’histoire ?",o:["En été","On ne peut pas savoir","En hiver"],ok:2,fb:"Oui : neige, moufles, doudoune.",no:{0:["C"],1:["L","Le mot « hiver » n’est pas écrit, mais les indices suffisent."]},p:[1,2]},{t:"q",cat:"SL",q:"Pourquoi Élio veut-il rentrer (¶2 et ¶3) ?",o:["Il a froid et n’y croit plus","Il a peur du noir","Il a très faim"],ok:0,fb:"Oui : ses doigts lui font mal et il pense qu’il n’y aura rien.",no:{1:["I"],2:["I"]},p:[2,3]},{t:"q",cat:"VOC",q:"Le ruban vert « ondulait » (¶5). Cela veut dire :",o:["Il bougeait en vagues","Il restait immobile","Il changeait de couleur"],ok:0,cp1:"Lis la suite : « comme un rideau agité par le vent ».",fb:"Oui : comme un rideau qui bouge.",no:{1:["C"],2:["I"]},p:[5]},{t:"q",cat:"SG",s:"S3",q:"Que voient finalement les deux cousins ?",o:["Un feu d’artifice (fusées lancées)","Un éclair d’orage","Une aurore boréale (lumière du ciel polaire)"],ok:2,cp1:"Relis les ¶4 et ¶5.",fb:"Oui ! Ruban vert qui ondule, ciel clair, nuit, nord de la Norvège : c’est une aurore boréale.",no:{0:["I","Il n’y a ni bruit ni explosion."],1:["C","Le ciel est clair : pas d’orage."]},p:[4,5]},{t:"q",cat:"SL",q:"Les cousins restent silencieux (¶6). Pourquoi ?",o:["Ils sont émerveillés","Ils sont fâchés","Ils sont gelés"],ok:0,fb:"Oui : le spectacle leur coupe la parole.",no:{1:["I"],2:["C","Élio « en oublia ses doigts gelés »."]},p:[6]},{t:"q",cat:"SL",q:"Pourquoi dorment-ils jusqu’à midi (¶7) ?",o:["Ils sont malades","Ils se sont couchés tard","Leur oncle l’a exigé"],ok:1,fb:"Oui : ils étaient encore dehors après 23 h 40.",no:{0:["I"],2:["I"]},p:[2,7]},{t:"ecrire",consigne:"Le lendemain, Nora raconte sa nuit à ses parents. Écris ce qu’elle dit, en deux phrases.",amorce:"Le lendemain, Nora raconte : « …",modele:"« Hier soir, le ciel était enfin clair et on a vu une aurore boréale. C’était un grand ruban vert qui dansait dans le ciel, c’était magnifique ! »"},{t:"parler",txt:"Raconte la nuit à quelqu’un sans dire ce qu’ils ont vu. L’autre doit deviner."},{t:"bilan",palier:1}]}},{id:"2.1",palier:2,titre:"La troisième vague",genre:"Récit",theme:"Bodyboard",paras:["Il était à peine sept heures quand nous avons garé la voiture au-dessus de la plage. L’océan était gris, et les vagues arrivaient par séries de trois, plus hautes que je ne les avais jamais vues à Dar Bouazza. Mon père a sorti les deux planches du coffre sans rien dire. Il savait.","L’été dernier, une vague m’avait plaquée contre le sable si violemment que j’étais restée assise sur la plage tout le reste de la journée, les genoux serrés contre la poitrine. Depuis, je n’étais plus allée au-delà de la mousse.","« On n’est pas obligés d’y aller, tu sais », a-t-il dit en enfilant sa combinaison.","J’ai attaché le leash à mon bras. Pas à la cheville, comme les surfeurs : au bras, comme les bodyboarders.","Dans l’eau, j’ai compté. La première vague est passée sous moi. La deuxième aussi. Quand la troisième s’est dressée, plus lourde que les autres, j’ai donné trois coups de palmes et je me suis laissée emporter.","Pendant quelques secondes, il n’y a plus eu ni bruit ni peur, seulement la vitesse et l’écume qui me fouettait le visage.","Quand je suis revenue vers le bord, mon père avait les deux bras levés au-dessus de la tête. Il n’avait même pas pris le temps de mouiller ses cheveux."],suite:[{q:"Quelle vague a-t-elle prise ?",r:"La troisième vague de la série."},{q:"Pourquoi son père levait-il les bras ?",r:"Il était fier et heureux pour elle."}],A:{titre:"Le retour en arrière",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Quelqu’un retourne dans les vagues après une mauvaise expérience. Découvre ce qui a changé.",sais:["Le bodyboard se pratique allongé sur le ventre, sur une petite planche, avec des palmes aux pieds.","Dar Bouazza est une plage près de Casablanca."]},{t:"lire"},{t:"montre",s:"S1",p:[2,3],txt:"Au ¶2, je lis « L’été dernier ». Stop : on n’est plus ce matin, on est avant. Mon film fait un retour en arrière. Au ¶3, on revient sur la plage, ce matin."},{t:"q",cat:"G",q:"Quel est le sujet du texte ?",o:["Une compétition de bodyboard","Une peur surmontée dans les vagues","Un père qui apprend à nager"],ok:1,fb:"Oui : elle retourne dans les vagues malgré sa peur.",no:{0:["I","Il n’y a aucune compétition."],2:["C","Le père reste sur le sable."]}},{t:"q",cat:"F",q:"Que s’est-il passé l’été dernier (¶2) ?",o:["Une vague l’a plaquée au sol","Elle a perdu sa planche","Elle a gagné une course"],ok:0,fb:"Oui, c’est raconté au ¶2.",no:{1:["I"],2:["I"]},p:[2]},{t:"q",cat:"ST",s:"S1",q:"Quel événement a eu lieu en premier ?",o:["L’arrivée sur la plage","La vague de l’été dernier","Le leash attaché au bras"],ok:1,cp1:"Relis le début du ¶2.",fb:"Oui : l’été dernier, c’est avant ce matin.",no:{0:["L","C’est le premier événement dans le texte, pas dans le temps."],2:["L","Ça se passe ce matin."]},p:[2]},{t:"q",cat:"GRAM",q:"La personne qui raconte est…",o:["un garçon","on ne sait pas","une fille"],ok:2,cp1:"Relis le ¶2.",cp2:"Regarde la fin des mots « plaquée » et « assise ».",fb:"Oui : « plaquée », « assise », « laissée » le montrent.",no:{0:["C"],1:["L","Le mot « fille » n’est pas écrit, mais les accords le disent."]},p:[2]},{t:"q",cat:"VOC",q:"Le leash (¶4), c’est…",o:["Un cordon relié à la planche","Une sorte de combinaison","Une paire de palmes"],ok:0,cp1:"On l’attache au bras ou à la cheville.",fb:"Oui : il relie la planche au corps.",no:{1:["R","La combinaison, c’est au ¶3."],2:["R","Les palmes, c’est au ¶5."]},p:[4]},{t:"q",cat:"VOC",q:"« Je n’étais plus allée au-delà de la mousse » (¶2). Cela veut dire :",o:["Elle ne se baignait plus","Elle restait près du bord","Elle restait dans la voiture"],ok:1,cp2:"La mousse, c’est l’écume des vagues cassées, près du bord.",fb:"Oui : elle n’allait plus là où les vagues sont grosses.",no:{0:["C","Elle allait dans l’eau, mais pas loin."],2:["I"]},p:[2]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Que s’était-il passé l’été dernier ?",r:"Une vague l’avait plaquée violemment contre le sable."},{q:"Qui raconte : un garçon ou une fille ?",r:"Une fille (plaquée, assise)."}]},{t:"lire",relire:!0},{t:"q",cat:"ANA",s:"S2",q:"« Quand la troisième s’est dressée » (¶5). « La troisième », c’est…",o:["La troisième vague","La troisième planche","La troisième série"],ok:0,fb:"Oui : elle compte les vagues.",no:{1:["R","Il n’y a que deux planches."],2:["R","On compte les vagues d’une même série."]},p:[5]},{t:"q",cat:"SL",s:"S3",q:"« Il savait » (¶1). Que savait le père ?",o:["Qu’elle avait peur depuis l’été","Que les vagues allaient baisser","Qu’elle voulait rentrer"],ok:0,cp1:"Relis le ¶2.",fb:"Oui : il connaît sa peur, c’est pour ça qu’il ne dit rien.",no:{1:["I"],2:["I","Elle ne dit rien de tel."]},p:[1,2]},{t:"q",cat:"SL",s:"S3",q:"Il n’avait « même pas pris le temps de mouiller ses cheveux » (¶7). Cela veut dire :",o:["Il a surfé sans tomber","Il est resté au bord à la regarder","Il a oublié sa combinaison"],ok:1,cp1:"Relis le ¶7.",fb:"Oui : il n’est pas allé dans l’eau, il la regardait.",no:{0:["C","Il n’est pas allé dans l’eau."],2:["C","Il l’a enfilée au ¶3."]},p:[7]},{t:"q",cat:"SG",q:"Que ressent le père à la fin ?",o:["De la déception","De l’inquiétude","De la fierté"],ok:2,cp1:"Relis le ¶7.",fb:"Oui : les bras levés montrent sa joie et sa fierté.",no:{0:["C"],1:["C"]},p:[7]},{t:"q",cat:"PONC",q:`Texte a : « Papa, dit-elle, a peur. »
Texte b : « Papa dit : “Elle a peur.” »
Quel texte veut dire que c’est le père qui a peur ?`,o:Ta,ok:0,fb:"Oui : les virgules encadrent « dit-elle ».",no:{1:["C","Dans le texte b, c’est elle qui a peur."],2:["C"]}},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Mon père m’attendait sur le sable.","J’ai pris la première vague de la série.","L’eau était froide ce matin-là."],ok:1,fb:"Bien vu : relis le ¶5, elle laisse passer les deux premières.",no:{0:["C","C’est compatible avec le ¶7."],2:["I","Le texte ne le dit pas, mais ne le contredit pas."]},p:[5]},{t:"ecrire",consigne:"Invente une question qui commence par « Pourquoi… ? ». Sa réponse se devine, mais n’est pas écrite dans le texte.",amorce:"Pourquoi…",modele:"Pourquoi a-t-elle attendu la troisième vague ?"},{t:"parler",txt:"Prédire : reviendra-t-elle la semaine prochaine ? Quel indice du texte te le fait penser ?"}]}},{id:"2.2",palier:2,titre:"Roblox : jouer… ou créer ?",genre:"Texte informatif",theme:"Jeu vidéo",paras:["Contrairement à la plupart des jeux vidéo, Roblox n’a pas été entièrement inventé par une équipe de professionnels. La plateforme, lancée en 2006, fonctionne plutôt comme un immense parc d’attractions dont les manèges seraient construits par les visiteurs eux-mêmes. Grâce à un logiciel gratuit, Roblox Studio, n’importe quel utilisateur peut fabriquer son propre jeu, appelé « expérience », et le partager avec des millions de personnes.","Pour donner vie à leurs créations, les développeurs utilisent un langage de programmation, le Luau. Une porte qui s’ouvre, un piège qui se déclenche, un chronomètre qui démarre : derrière chaque action se cachent quelques lignes de code. Certains créateurs ont commencé adolescents et en ont fait leur métier.","Sur Roblox, l’argent circule aussi, sous la forme d’une monnaie virtuelle : le Robux. Les joueurs l’achètent avec de vrais euros pour offrir des vêtements à leur avatar ou obtenir des avantages dans les jeux. Une partie de cet argent revient ensuite aux créateurs.","Cette réussite a cependant un revers. Comme tout le monde peut publier, la plateforme ne peut pas tout vérifier, et des inconnus peuvent contacter les joueurs par le chat. C’est pourquoi Roblox propose un contrôle parental : les parents peuvent limiter les dépenses, désactiver la messagerie ou choisir les expériences accessibles selon l’âge.","Avant de cliquer sur « Acheter », mieux vaut donc se poser une question simple : est-ce que je paie avec de l’argent de jeu… ou avec l’argent de quelqu’un d’autre ?"],suite:[{q:"Quel logiciel sert à créer des jeux sur Roblox ?",r:"Roblox Studio."},{q:"À quoi sert le contrôle parental ?",r:"À limiter les dépenses, couper la messagerie et choisir les jeux selon l’âge."}],A:{titre:"La comparaison",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Découvre comment fonctionne Roblox, et ce qu’il faut savoir avant d’y dépenser de l’argent.",sais:["Une monnaie virtuelle n’existe que dans un jeu, mais on l’achète souvent avec de l’argent réel.","Programmer, c’est écrire des instructions qu’un ordinateur exécute."]},{t:"lire"},{t:"montre",s:"S3",p:[1],txt:"Au ¶1, je lis « comme un immense parc d’attractions ». C’est une comparaison : je cherche ce qui correspond à quoi. Le parc, c’est Roblox. Les visiteurs, ce sont les utilisateurs. Et les manèges ? À toi de trouver."},{t:"q",cat:"G",q:"Quelle est l’idée principale ?",o:["Roblox est dangereux, il faut l’interdire","Les joueurs y créent les jeux, avec des risques","C’est le plus ancien des jeux vidéo"],ok:1,fb:"Oui : des créations par les joueurs, des possibilités et des risques.",no:{0:["I","L’auteur ne demande pas d’interdire."],2:["I"]}},{t:"q",cat:"F",q:"Quel logiciel sert à créer des jeux (¶1) ?",o:["Roblox Studio","Luau","Robux"],ok:0,fb:"Oui, il est gratuit.",no:{1:["R","Luau, c’est le langage de programmation (¶2)."],2:["R","Le Robux, c’est la monnaie (¶3)."]},p:[1]},{t:"q",cat:"SL",s:"S3",q:"Dans la comparaison, « les manèges », ce sont…",o:["Les Robux","Les expériences créées","Les parents"],ok:1,cp2:"Parc = Roblox. Visiteurs = utilisateurs. Donc ce que les visiteurs construisent = …",fb:"Oui : les manèges sont les jeux construits par les utilisateurs.",no:{0:["R"],2:["I"]},p:[1]},{t:"q",cat:"STRUCT",s:"S4",q:"De quoi parle le ¶4 ?",o:["Des risques et des protections","De la création des jeux","De la monnaie virtuelle"],ok:0,fb:"Oui : le revers, puis le contrôle parental.",no:{1:["R","C’est le sujet du ¶2."],2:["R","C’est le sujet du ¶3."]},p:[4]},{t:"q",cat:"ANA",s:"S2",q:"« …et en ont fait leur métier » (¶2). « En » remplace…",o:["Les Robux","L’adolescence","La création de jeux"],ok:2,fb:"Oui : ils ont fait de la création de jeux leur métier.",no:{0:["R","Les Robux arrivent plus loin, au ¶3."],1:["R","On ne fait pas un métier de l’adolescence."]},p:[2]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Comment s’appelle la monnaie de Roblox ?",r:"Le Robux."},{q:"Que représentent les manèges dans la comparaison ?",r:"Les jeux (expériences) créés par les utilisateurs."}]},{t:"lire",relire:!0},{t:"q",cat:"VOC",q:"« Cette réussite a cependant un revers » (¶4). Un revers, c’est…",o:["Un aspect négatif","Une victoire","Un retour en arrière"],ok:0,cp1:"Lis la phrase qui suit.",fb:"Oui : la suite parle de problèmes.",no:{1:["C","La suite parle de problèmes."],2:["L"]},p:[4]},{t:"q",cat:"NUM",q:"400 Robux coûtent 5 €. Combien coûtent 1 200 Robux ?",o:["10 €","15 €","20 €"],ok:1,cp2:"1 200, c’est 3 fois 400.",fb:"Oui : 3 fois 5 €.",no:{0:["C"],2:["C"]}},{t:"q",cat:"HYP",q:"Les parents de Nina ont désactivé la messagerie. Un inconnu peut-il lui écrire ?",o:["Oui","Non","Le texte ne permet pas de répondre"],ok:1,fb:"Oui : sans messagerie, pas de message.",no:{0:["C"],2:["L","La règle est au ¶4 : applique-la."]},p:[4]},{t:"q",cat:"HYP",s:"S6",q:"Un créateur de 14 ans gagne-t-il forcément de l’argent ?",o:["Oui, toujours","Non, jamais","Le texte ne permet pas de répondre"],ok:2,fb:"Oui : « certains » en vivent, mais le texte ne dit rien des autres.",no:{0:["I","« Certains » seulement."],1:["C","Certains en vivent."]},p:[2]},{t:"q",cat:"SG",s:"S3",q:"« L’argent de quelqu’un d’autre » (¶5). De qui parle l’auteur ?",o:["Des créateurs","De l’entreprise Roblox","Des parents"],ok:2,cp1:"Relis le ¶4.",fb:"Oui : ce sont souvent les parents qui paient vraiment.",no:{0:["R","Les créateurs reçoivent l’argent."],1:["R"]},p:[4,5]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Roblox Studio est payant.","Les parents peuvent limiter les dépenses.","Certains jeux contiennent des pièges."],ok:0,fb:"Bien vu : le ¶1 dit qu’il est gratuit.",no:{1:["C","C’est écrit au ¶4."],2:["C","C’est écrit au ¶2."]},p:[1]},{t:"ecrire",consigne:"Invente une question « Et si… ? » dont la réponse oblige à relier deux paragraphes.",amorce:"Et si…",modele:"Et si je dépense 10 € en Robux, qui touche une partie de l’argent ? (Les créateurs, ¶3.)"},{t:"parler",txt:"Clarifier : explique à quelqu’un la différence entre Roblox, Roblox Studio, Luau et Robux."}]}},{id:"2.3",palier:2,titre:"Le secret d’Olympie",genre:"Récit historique",theme:"Grèce antique",note:"Inspiré de l’histoire de Kallipateira, rapportée par l’auteur grec Pausanias.",paras:["Pour entrer dans le stade d’Olympie, j’avais coupé mes cheveux très court et enfilé le manteau usé d’un entraîneur. Personne ne s’était retourné sur moi. Dans la foule venue de toute la Grèce, j’étais un entraîneur parmi d’autres.","Depuis des mois, je préparais mon fils pour le pugilat, ce combat à mains nues où les poings ne sont protégés que par des lanières de cuir. Son père était mort avant de le voir grandir : il fallait bien que quelqu’un l’entraîne. Mon propre père, Diagoras, avait été champion ici même, et mes frères aussi.","Le combat a duré longtemps. Quand l’arbitre a enfin levé le bras de mon fils, je n’ai pas pu me retenir. J’ai sauté par-dessus la barrière des entraîneurs pour courir vers lui. Mon manteau s’est accroché au bois et s’est ouvert.","Le silence est tombé sur les gradins. Tous avaient compris.","On m’a conduite devant les juges. La loi était claire : une femme mariée surprise aux Jeux devait être jetée du haut d’une falaise. J’ai attendu leur décision, la tête haute.","Finalement, ils m’ont laissée partir. On ne condamne pas la fille, la sœur et la mère de champions olympiques. Mais après cela, une nouvelle règle a été imposée à tous les entraîneurs, pour que personne ne puisse plus jamais les tromper."],suite:[{q:"Pourquoi la femme s’était-elle déguisée ?",r:"Les femmes mariées n’avaient pas le droit d’assister aux Jeux."},{q:"Pourquoi les juges l’ont-ils laissée partir ?",r:"Sa famille comptait des champions olympiques."}],A:{titre:"Garder une question en tête",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Une personne se cache dans la foule des Jeux olympiques, il y a plus de 2 000 ans. Découvre qui, et pourquoi.",sais:["Olympie est le lieu de Grèce où se tenaient les Jeux olympiques antiques.","Les athlètes venaient de toutes les cités grecques."]},{t:"lire"},{t:"montre",s:"S5",p:[1],txt:"Au ¶1, cette personne se déguise. Je me demande pourquoi. Le texte ne répond pas tout de suite : je garde la question ouverte dans mon film et je cherche la réponse plus loin."},{t:"q",cat:"G",q:"Que raconte ce texte ?",o:["Un secret découvert aux Jeux","Une victoire obtenue en trichant","La création des Jeux"],ok:0,fb:"Oui : un déguisement qui finit par être découvert.",no:{1:["C","Le fils gagne sans tricher."],2:["I"]}},{t:"q",cat:"F",q:"Le pugilat (¶2), c’est…",o:["Une course de vitesse","Une lutte au sol","Un combat à coups de poing"],ok:2,fb:"Oui : un combat à mains nues.",no:{0:["I"],1:["C","Relis la définition au ¶2."]},p:[2]},{t:"q",cat:"F",q:"Comment le secret est-il découvert (¶3) ?",o:["Quelqu’un parle aux juges","Le manteau s’ouvre","Le fils crie son nom"],ok:1,fb:"Oui : le manteau s’accroche au bois et s’ouvre.",no:{0:["I"],2:["I"]},p:[3]},{t:"q",cat:"GRAM",q:"La personne qui raconte est…",o:["un homme","une femme","on ne sait pas"],ok:1,cp1:"Relis le ¶5.",fb:"Oui : la loi parle d’une femme, et les accords le confirment.",no:{0:["L","« Un entraîneur », au ¶1, c’est le déguisement."],2:["L","Cherche les accords."]},p:[5]},{t:"q",cat:"GRAM",q:"Quel mot le prouve en premier ?",o:["« coupé » (¶1)","« conduite » (¶5)","« fils » (¶2)"],ok:1,fb:"Oui : « conduite », avec un e.",no:{0:["L","Avec « avoir », pas d’accord : « coupé » ne dit rien."],2:["L","Un père aussi peut avoir un fils."]},p:[5]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Comment le secret a-t-il été découvert ?",r:"Son manteau s’est accroché à la barrière et s’est ouvert."},{q:"Quel mot prouve que c’est une femme qui raconte ?",r:"« conduite » (¶5)."}]},{t:"lire",relire:!0},{t:"q",cat:"ANA",s:"S2",q:"« Tous avaient compris » (¶4). « Tous », ce sont…",o:["Les spectateurs","Les juges seulement","Ses frères"],ok:0,fb:"Oui : ils sont dans les gradins.",no:{1:["R","Les juges arrivent au ¶5."],2:["I"]},p:[4]},{t:"q",cat:"SL",s:"S5",q:"Pourquoi s’était-elle déguisée ?",o:["Les femmes mariées étaient interdites","Elle voulait combattre","Pour faire une blague"],ok:0,cp1:"Relis le ¶5.",fb:"Oui : la loi interdisait les Jeux aux femmes mariées.",no:{1:["I","C’est son fils qui combat."],2:["I"]},p:[5]},{t:"q",cat:"SL",q:"Pourquoi entraînait-elle son fils ?",o:["Elle était payée","Son fils l’avait choisie","Le père était mort"],ok:2,cp1:"Relis le ¶2.",fb:"Oui : « il fallait bien que quelqu’un l’entraîne ».",no:{0:["I"],1:["I"]},p:[2]},{t:"q",cat:"VOC",q:"« J’ai attendu leur décision, la tête haute » (¶5). Cela veut dire :",o:["Avec fierté","En regardant le ciel","En pleurant"],ok:0,fb:"Oui : sans honte.",no:{1:["L","C’est le sens au pied de la lettre."],2:["C"]},p:[5]},{t:"q",cat:"SG",q:"Pourquoi les juges la laissent-ils partir ?",o:["Sa famille est célèbre","Elle s’est excusée","La loi a changé"],ok:0,cp1:"Relis le ¶6.",fb:"Oui : fille, sœur et mère de champions.",no:{1:["I"],2:["C","« La loi était claire »."]},p:[6]},{t:"q",cat:"HYP",q:"La nouvelle règle obligeait sans doute les entraîneurs à…",o:["Payer leur entrée","Prouver qu’ils étaient des hommes","Laisser entrer les femmes"],ok:1,fb:"Oui : « pour que personne ne puisse plus les tromper ».",no:{0:["I"],2:["C","C’est le contraire du but de la règle."]},p:[6]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Mes frères avaient gagné aux Jeux.","Les juges m’ont condamnée à mort.","Mon fils a gagné son combat."],ok:1,fb:"Bien vu : relis le ¶6, ils l’ont laissée partir.",no:{0:["C","C’est écrit au ¶2."],2:["C","C’est écrit au ¶3."]},p:[6]},{t:"ecrire",consigne:"Invente une question dont la réponse est : « Parce que c’était une femme. »",amorce:"",modele:"Pourquoi a-t-elle dû se déguiser en entraîneur pour entrer dans le stade ?"},{t:"parler",txt:"Clarifier : qu’est-ce qui t’a trompé(e) au début ? Explique comment tu as compris."}]}},{id:"2.4",palier:2,titre:"En voyage, faut-il goûter à tout ?",genre:"Texte argumentatif",theme:"Cultures du monde",paras:["« Beurk, je ne mange pas ça ! » Combien de voyageurs ont prononcé cette phrase devant un plat inconnu ? Pourtant, je crois qu’en voyage, il faut au moins goûter.","D’abord, la cuisine est une porte d’entrée vers une culture. Un plat raconte l’histoire d’un pays : son climat, ce qui y pousse, les peuples qui s’y sont croisés. Au Mexique, dans la région d’Oaxaca, on croque des sauterelles grillées depuis des siècles. Au Japon, le natto, des graines de soja fermentées qui forment des fils gluants, se mange au petit déjeuner.","Ensuite, refuser sans goûter peut vexer. Quand quelqu’un vous invite et vous sert un plat préparé avec soin, repousser l’assiette d’un air dégoûté revient un peu à lui dire : « Ce que tu aimes ne m’intéresse pas. »","Enfin, nos goûts changent. Beaucoup d’adultes adorent aujourd’hui des aliments qu’ils détestaient enfants. Une bouchée ne coûte presque rien ; elle peut même faire découvrir un nouveau plat préféré.","Bien sûr, il y a des exceptions. Une allergie, un régime lié à la santé ou des convictions religieuses sont de bonnes raisons de refuser, et personne ne devrait insister. Dans ce cas, il suffit de l’expliquer poliment.","Goûter, ce n’est pas promettre d’aimer. C’est accepter, le temps d’une bouchée, de voir le monde avec les yeux – et la langue – de quelqu’un d’autre."],suite:[{q:"Quelle est la thèse de l’auteur sur la nourriture en voyage ?",r:"En voyage, il faut au moins goûter."},{q:"Quelles exceptions accepte-t-il ?",r:"Une allergie, un régime lié à la santé, des convictions religieuses."}],A:{titre:"Le plan d’un texte argumentatif",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"Lis l’avis de l’auteur et décide si ses arguments te convainquent.",sais:["Un texte argumentatif défend une idée, appelée thèse, avec des arguments et des exemples.","Les convictions, c’est ce que l’on croit très profondément."]},{t:"lire"},{t:"montre",s:"S4",p:[1,2,3,4],txt:"Je cherche la thèse : au ¶1, « je crois qu’en voyage, il faut au moins goûter ». Puis les mots-indices : D’abord (¶2), Ensuite (¶3), Enfin (¶4) : trois arguments. Mon schéma : thèse, trois arguments, exceptions, conclusion."},{t:"q",cat:"G",q:"Quelle idée l’auteur défend-il ?",o:["Il faut au moins goûter en voyage","Il faut tout manger, même allergique","La cuisine étrangère est meilleure"],ok:0,fb:"Oui, c’est sa thèse, au ¶1.",no:{1:["C","Relis le ¶5."],2:["I"]},p:[1]},{t:"q",cat:"STRUCT",s:"S4",q:"Que fait l’auteur au ¶5 ?",o:["Il donne un 4e argument","Il accepte des exceptions","Il change d’avis"],ok:1,fb:"Oui : « Bien sûr, il y a des exceptions ».",no:{0:["D","Une exception n’est pas une raison de goûter."],2:["C","Il garde son idée au ¶6."]},p:[5]},{t:"q",cat:"F",q:"Le natto (¶2), c’est…",o:["Des sauterelles grillées","Du poisson cru","Du soja fermenté"],ok:2,fb:"Oui : des graines de soja fermentées.",no:{0:["R","Les sauterelles, c’est le plat du Mexique."],1:["I"]},p:[2]},{t:"q",cat:"ANA",s:"S2",q:"« Il suffit de l’expliquer » (¶5). « L’ » remplace…",o:["La raison du refus","Le plat","La recette"],ok:0,fb:"Oui : on explique pourquoi on refuse.",no:{1:["R"],2:["R"]},p:[5]},{t:"q",cat:"VOC",q:"« Refuser sans goûter peut vexer » (¶3). Vexer, c’est…",o:["Rendre malade","Blesser quelqu’un","Faire rire"],ok:1,cp1:"Lis la phrase qui suit.",fb:"Oui : la personne se sent rejetée.",no:{0:["I"],2:["C"]},p:[3]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Quelle est la thèse de l’auteur ?",r:"En voyage, il faut au moins goûter."},{q:"Quelles exceptions accepte-t-il ?",r:"Allergie, santé, convictions religieuses."}]},{t:"lire",relire:!0},{t:"q",cat:"SL",q:"Pourquoi l’auteur parle-t-il des adultes qui aiment ce qu’ils détestaient enfants (¶4) ?",o:["Pour prouver que les goûts changent","Pour se moquer des enfants","Pour dire d’attendre d’être adulte"],ok:0,fb:"Oui : c’est un exemple pour son troisième argument.",no:{1:["I"],2:["C"]},p:[4]},{t:"q",cat:"HYP",q:"Lina est allergique aux crevettes. On lui sert une paella aux crevettes. Selon l’auteur…",o:["Elle goûte une bouchée","Elle refuse et explique","Le texte ne permet pas de répondre"],ok:1,fb:"Oui : une allergie est une bonne raison de refuser (¶5).",no:{0:["C","Relis le ¶5."],2:["L","La règle est au ¶5 : applique-la."]},p:[5]},{t:"q",cat:"HYP",s:"S6",q:"D’après le texte, mange-t-on des sauterelles au Japon ?",o:["Oui","Non","Le texte ne permet pas de répondre"],ok:2,fb:"Oui : les sauterelles sont citées pour le Mexique, rien n’est dit pour le Japon.",no:{0:["R","Les sauterelles, c’est pour le Mexique."],1:["I"]},p:[2]},{t:"q",cat:"SG",q:"« Avec les yeux – et la langue – de quelqu’un d’autre » (¶6). Que veut dire l’auteur ?",o:["Apprendre la langue du pays","Comprendre les goûts des autres","Imiter les habitants en tout"],ok:1,cp2:"Ici, « langue » a deux sens : l’organe du goût et la langue parlée.",fb:"Oui : goûter aide à comprendre la vie des autres.",no:{0:["L","Tu n’as vu qu’un des deux sens de « langue »."],2:["I","C’est exagéré."]},p:[6]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Le natto se mange le matin.","L’auteur conseille de refuser les plats inconnus.","Une bouchée peut faire découvrir un plat."],ok:1,fb:"Bien vu : il conseille au contraire de goûter.",no:{0:["C","C’est écrit au ¶2."],2:["C","C’est écrit au ¶4."]}},{t:"ecrire",consigne:"Donne ton avis en t’appuyant sur un argument du texte.",amorce:"Je suis d’accord / pas d’accord avec l’auteur, parce que…",modele:"Je suis d’accord avec l’auteur, parce qu’une seule bouchée ne coûte presque rien et peut faire découvrir un nouveau plat préféré."},{t:"parler",txt:"Prédire : quel argument contraire un autre auteur pourrait-il donner ?"},{t:"bilan",palier:2}]}},{id:"3.1",palier:3,titre:"Trop jeune pour GTA 6 ?",genre:"Texte argumentatif",theme:"Jeu vidéo",paras:["Entre copains, la phrase revient sans cesse : « De toute façon, tout le monde y joue. » Depuis l’annonce de GTA 6, beaucoup de jeunes encore loin de leurs 18 ans réclament le jeu à leurs parents. Pourtant, comme les épisodes précédents de la série, classés PEGI 18, il s’adresse à un public adulte. Faut-il vraiment céder ?","Certains affirment que ce n’est « qu’un jeu » et que chacun sait faire la différence entre la fiction et la réalité. C’est vrai : jouer à un jeu violent ne transforme pas automatiquement quelqu’un en délinquant, et les chercheurs restent prudents sur ce sujet. D’autres rappellent que la série propose une ville immense, des musiques et des paysages impressionnants.","Mais la question n’est pas seulement celle de la violence. Le système PEGI, utilisé dans une grande partie de l’Europe, ne classe pas les jeux selon leur difficulté, mais selon leur contenu : violence réaliste, langage grossier, scènes réservées aux adultes. Le pictogramme « 18 » ne signifie donc pas « trop dur pour un enfant », mais « pas fait pour un enfant ». Un film interdit aux moins de 16 ans ne devient pas adapté parce que tous les copains l’ont vu.","Quant à l’argument du « tout le monde y joue », il mérite d’être vérifié. Celui qui l’utilise a-t-il vraiment interrogé tous ses amis ? Bien souvent, quelques personnes qui en parlent beaucoup donnent l’impression d’être la majorité.","Rien n’empêche, en revanche, de retrouver ailleurs ce que l’on aime dans GTA : la liberté de mouvement, les grandes cartes à explorer, les courses de voitures. Des jeux comme Forza Horizon ou Minecraft offrent ces plaisirs sans être réservés aux adultes.","Attendre quelques années, ce n’est pas rater quelque chose. C’est simplement le découvrir au bon moment."],suite:[{q:"Selon l’auteur, sur quoi repose le classement PEGI ?",r:"Sur le contenu du jeu (violence, langage, scènes pour adultes), pas sur sa difficulté."},{q:"Que propose l’auteur à la place de GTA 6 ?",r:"Des jeux comme Forza Horizon ou Minecraft, qui offrent des plaisirs proches."}],A:{titre:"La thèse cachée",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"L’auteur ne dit jamais son avis en une seule phrase. À toi de le trouver.",sais:["PEGI est un système européen qui indique par un chiffre l’âge minimum conseillé pour un jeu."]},{t:"lire"},{t:"montre",s:"S3",p:[1,3,6],txt:"Aucune phrase ne commence par « Je pense que ». Je rassemble donc des indices : la question « Faut-il vraiment céder ? » (¶1), le « Mais » du ¶3, la dernière phrase (¶6). Je les relie pour trouver l’avis de l’auteur."},{t:"q",cat:"G",s:"S3",q:"Quel avis l’auteur défend-il ?",o:["GTA 6 est un mauvais jeu","Les jeux rendent violent","Il vaut mieux attendre l’âge prévu"],ok:2,aide:"Relie la question du ¶1, le « Mais » du ¶3 et la dernière phrase.",fb:"Oui : attendre, c’est découvrir le jeu au bon moment.",no:{0:["I","Il cite ses qualités au ¶2."],1:["C","Il dit le contraire au ¶2."]}},{t:"q",cat:"F",q:"Sur quoi repose le classement PEGI (¶3) ?",o:["La difficulté","Le contenu","Le prix"],ok:1,fb:"Oui : violence, langage, scènes pour adultes.",no:{0:["C","« pas selon leur difficulté »."],2:["I"]},p:[3]},{t:"q",cat:"F",q:"Quel argument adverse l’auteur accepte-t-il ?",o:["Un jeu violent ne rend pas délinquant","Tout le monde y joue","Le jeu est trop difficile"],ok:0,fb:"Oui : « C’est vrai », au ¶2.",no:{1:["C","Il le critique au ¶4."],2:["C"]},p:[2]},{t:"q",cat:"VOC",q:"« Faut-il vraiment céder ? » (¶1). Céder, c’est…",o:["Accepter malgré soi","Vendre quelque chose","Casser quelque chose"],ok:0,fb:"Oui : les parents finissent par dire oui.",no:{1:["L","C’est un autre sens du mot."],2:["I"]},p:[1]},{t:"q",cat:"ANA",s:"S2",q:"« Celui qui l’utilise » (¶4). « L’ » remplace…",o:["Le jeu GTA 6","Le pictogramme « 18 »","L’argument « tout le monde y joue »"],ok:2,fb:"Oui : on utilise un argument.",no:{0:["R"],1:["R"]},p:[4]}]},B:{titre:"La concession",ecrans:[{t:"rappel",items:[{q:"Sur quoi repose le classement PEGI ?",r:"Sur le contenu du jeu."},{q:"Quel argument adverse l’auteur accepte-t-il ?",r:"Un jeu violent ne transforme pas automatiquement en délinquant."}]},{t:"lire",relire:!0},{t:"q",cat:"SL",s:"S4",q:"Pourquoi l’auteur écrit-il « C’est vrai » (¶2) ?",o:["Il change d’avis","Il accorde un point pour mieux répondre","Il se moque des joueurs"],ok:1,aide:"Regarde le premier mot du ¶3.",fb:"Oui : c’est une concession, puis il répond avec « Mais ».",no:{0:["C","Regarde le « Mais » du ¶3."],2:["I"]},p:[2,3]},{t:"q",cat:"SL",q:"Pourquoi l’auteur parle-t-il d’un film interdit aux moins de 16 ans (¶3) ?",o:["Pour comparer avec un cas connu","Pour conseiller un film à voir","Pour annoncer un film sur GTA"],ok:0,fb:"Oui : si tout le monde l’a vu, un contenu n’en devient pas adapté pour autant.",no:{1:["I"],2:["I"]},p:[3]},{t:"q",cat:"HYP",s:"S6",q:"Un jeu très difficile, sans violence ni grossièretés, sera-t-il classé PEGI 18 ?",o:["Oui, car il est difficile","Le texte ne permet pas de répondre","Sans doute pas"],ok:2,fb:"Oui : PEGI juge le contenu, pas la difficulté.",no:{0:["C","Relis le ¶3."],1:["L","La règle du ¶3 permet de le déduire."]},p:[3]},{t:"q",cat:"NUM",q:"Dans le club de foot de Malik, 6 jeunes sur 28 jouent à GTA. Combien n’y jouent pas, et l’argument « tout le monde y joue » tient-il ?",o:["22, donc non","6, donc oui","22, donc oui"],ok:0,fb:"Oui : 28 − 6 = 22, la grande majorité n’y joue pas.",no:{1:["C","Le calcul est faux."],2:["C","La conclusion est fausse."]}},{t:"q",cat:"SG",q:"Pourquoi l’auteur cite-t-il Forza Horizon et Minecraft (¶5) ?",o:["Ce sont des jeux violents","Ils coûtent plus cher","Ils offrent des plaisirs proches"],ok:2,fb:"Oui : liberté, cartes à explorer, voitures… sans être réservés aux adultes.",no:{0:["I"],1:["I"]},p:[5]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["L’auteur pense que GTA rend violent.","L’auteur propose d’autres jeux.","L’auteur doute du « tout le monde y joue »."],ok:0,fb:"Bien vu : au ¶2, il reconnaît que ce n’est pas automatique.",no:{1:["C","C’est le ¶5."],2:["C","C’est le ¶4."]},p:[2]},{t:"ecrire",consigne:"Résume l’argumentation de l’auteur en complétant la phrase.",amorce:"L’auteur pense que… parce que… Pourtant, il reconnaît que…",modele:"L’auteur pense qu’il vaut mieux attendre l’âge prévu pour jouer à GTA 6, parce que le classement PEGI 18 porte sur le contenu. Pourtant, il reconnaît qu’un jeu violent ne rend pas automatiquement délinquant."},{t:"parler",txt:"Questionner : pose à quelqu’un une question sur un argument du texte, puis échangez les rôles."}]}},{id:"3.2",palier:3,titre:"Le pack de minuit",genre:"Récit",theme:"Jeu vidéo et football",paras:["Il était presque minuit. La lumière bleue de l’écran éclairait le visage d’Ilyès, penché sur sa manette. Encore un pack. Le dernier, promis.","Sur EA Sports FC – le jeu qu’on appelait encore FIFA il y a quelques années –, Ilyès construisait son équipe dans le mode Ultimate Team. Pour obtenir de nouveaux joueurs, il fallait ouvrir des « packs », des sortes de pochettes surprises numériques. Personne ne savait à l’avance ce qu’elles contenaient.","L’écran se mit à briller, des feux d’artifice éclatèrent… puis apparut un défenseur ordinaire, que tout le monde possédait déjà.",`– Encore raté ! grogna Ilyès.
Sa grande sœur Maïa, qui passait dans le couloir, s’arrêta dans l’encadrement de la porte.
– Tu en es à combien, ce soir ?
– Je sais pas… six ? Sept ? Avec les vingt euros d’anniversaire de mamie, j’en ai acheté huit.`,`Maïa s’assit sur le bord du lit.
– Tu sais pourquoi il y a des feux d’artifice même quand la carte est nulle ? Parce que si l’écran restait gris, tu arrêterais. Les machines à sous des casinos font pareil : des lumières, de la musique, et l’impression que la prochaine fois sera la bonne. D’ailleurs, en Belgique, ces packs payants ont été considérés comme des jeux de hasard, et leur vente a été interdite.`,`– Mais moi, c’est pas pareil, je joue au foot, pas au casino !
– Bien sûr. Alors dis-moi : qu’est-ce que tu as gagné, avec tes vingt euros ?`,"Ilyès regarda longtemps son écran. Puis il appuya sur le bouton et éteignit la console."],suite:[{q:"Combien coûtait un pack d’Ilyès ?",r:"2,50 € (20 € pour 8 packs)."},{q:"À quoi Maïa compare-t-elle les packs ?",r:"Aux machines à sous des casinos."}],A:{titre:"La question qui fait réfléchir",ecrans:[{t:"rappel",from:"prev"},{t:"avant",but:"La conversation entre un frère et sa sœur cache une idée. Trouve laquelle.",sais:["Une machine à sous est une machine de casino. On mise de l’argent, des symboles tournent, et le hasard décide si l’on gagne."]},{t:"lire"},{t:"montre",s:"S3",p:[6],txt:"Au ¶6, Maïa demande : « qu’est-ce que tu as gagné ? » Elle n’attend pas vraiment de réponse : elle veut faire réfléchir son frère. Je me demande donc ce qu’elle veut lui faire comprendre."},{t:"q",cat:"G",q:"Quel est le thème du texte ?",o:["L’histoire du jeu FIFA","Les packs et le hasard","Un match entre frère et sœur"],ok:1,fb:"Oui : des packs payants qui fonctionnent comme le hasard.",no:{0:["D","Ce n’est qu’un détail du ¶2."],2:["I"]}},{t:"q",cat:"F",q:"Que contenait le dernier pack (¶3) ?",o:["Une carte de légende","Un joueur banal","Rien du tout"],ok:1,fb:"Oui : un défenseur que tout le monde avait déjà.",no:{0:["C"],2:["L"]},p:[3]},{t:"q",cat:"ANA",s:"S2",q:"« …ce qu’elles contenaient » (¶2). « Elles », ce sont…",o:["Les pochettes (packs)","Les feux d’artifice","Les équipes"],ok:0,fb:"Oui : les pochettes surprises.",no:{1:["R","Les feux d’artifice arrivent après, au ¶3."],2:["R"]},p:[2]},{t:"q",cat:"NUM",q:"Combien coûtait un pack ?",o:["2 €","2,50 €","8 €"],ok:1,fb:"Oui : 20 € divisés par 8 packs.",no:{0:["C"],2:["L","8, c’est le nombre de packs."]},p:[4]},{t:"q",cat:"VOC",q:"« L’encadrement de la porte » (¶4), c’est…",o:["Le cadre autour de l’ouverture","Un tableau accroché","La serrure"],ok:0,fb:"Oui : elle s’arrête sur le seuil.",no:{1:["L"],2:["I"]},p:[4]}]},B:{titre:"Inférences",ecrans:[{t:"rappel",items:[{q:"Combien coûtait un pack ?",r:"2,50 €."},{q:"À quoi Maïa compare-t-elle les packs ?",r:"Aux machines à sous des casinos."}]},{t:"lire",relire:!0},{t:"q",cat:"SL",q:"« Encore un pack. Le dernier, promis » (¶1) montre que…",o:["Il a du mal à s’arrêter","Il a promis à Maïa","Le jeu n’a plus de packs"],ok:0,fb:"Oui : il se fait des promesses à lui-même.",no:{1:["I","Maïa n’arrive qu’après."],2:["I"]},p:[1]},{t:"q",cat:"ST",q:"Pourquoi le texte précise-t-il « presque minuit » ?",o:["Pour donner l’heure d’un match","Les packs sont moins chers la nuit","Il est absorbé par le jeu"],ok:2,fb:"Oui : il est si pris par le jeu qu’il en oublie l’heure.",no:{0:["I"],1:["I"]},p:[1]},{t:"q",cat:"GRAM",q:"« Je sais pas », « c’est pas pareil » : pourquoi n’y a-t-il pas de « ne » ?",o:["C’est une faute","L’auteur imite l’oral","Ilyès est en colère"],ok:1,fb:"Oui : à l’oral, on oublie souvent le « ne ». Le dialogue paraît vivant.",no:{0:["L"],2:["C"]},p:[4,6]},{t:"q",cat:"SG",s:"S3",q:"Pourquoi Maïa ne donne-t-elle pas la réponse à sa question (¶6) ?",o:["Pour qu’il comprenne seul","Elle ne la connaît pas","Elle veut ses cartes"],ok:0,aide:"Que se passe-t-il juste après, au ¶7 ?",fb:"Oui : elle veut qu’il comprenne par lui-même qu’il n’a rien gagné d’utile.",no:{1:["C"],2:["I"]},p:[6]},{t:"q",cat:"SG",s:"S1",q:"Le geste final (¶7) signifie que…",o:["La console est en panne","Il est fâché contre Maïa","Il décide d’arrêter"],ok:2,aide:"Mets ton film à jour : il « regarda longtemps » son écran.",fb:"Oui : il a réfléchi, puis il arrête.",no:{0:["I"],1:["C"]},p:[7]},{t:"intrus",q:"Une seule de ces phrases dit le contraire du texte. Laquelle ?",o:["Ilyès a dépensé l’argent de sa grand-mère.","La carte obtenue était très rare.","Maïa compare les packs au casino."],ok:1,fb:"Bien vu : c’était un défenseur que tout le monde avait déjà.",no:{0:["C","C’est écrit au ¶4."],2:["C","C’est écrit au ¶5."]},p:[3]},{t:"ecrire",consigne:"Écris la réponse honnête qu’Ilyès aurait pu donner à
