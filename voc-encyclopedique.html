<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire encyclopédique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette Breeze (KDE Plasma) : fenêtre, vue, en-tête, texte, accent */
  --bg:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --text:#232629; --muted:#5d6468;
  --border:#c4c9cd; --btn:#f7f8f8; --accent:#3daee9; --accent-ink:#1b7cb5; --accent-soft:rgba(61,174,233,.15);
  --pos:#27ae60; --pos-soft:rgba(39,174,96,.13); --neg:#da4453; --neg-soft:rgba(218,68,83,.11); --warn:#f67400; --warn-soft:rgba(246,116,0,.12);
  --seg-a:rgba(61,174,233,.22); --seg-b:rgba(246,116,0,.20);
  --font:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Noto Sans Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --r:4px;
  color-scheme:light;
  /* Mise en page : barre d'outils + panneau latéral + vue de contenu, comme une application KDE */
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7;
  --border:#4a5056; --btn:#31363b; --accent:#3daee9; --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2);
  --pos:#2ecc71; --pos-soft:rgba(46,204,113,.16); --neg:#ed5565; --neg-soft:rgba(237,85,101,.16); --warn:#f67400; --warn-soft:rgba(246,116,0,.18);
  --seg-a:rgba(61,174,233,.3); --seg-b:rgba(246,116,0,.28); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#292c30; --view:#1b1e20; --header:#31363b; --text:#fcfcfc; --muted:#a8b0b7;
  --border:#4a5056; --btn:#31363b; --accent:#3daee9; --accent-ink:#5cc0f2; --accent-soft:rgba(61,174,233,.2);
  --pos:#2ecc71; --pos-soft:rgba(46,204,113,.16); --neg:#ed5565; --neg-soft:rgba(237,85,101,.16); --warn:#f67400; --warn-soft:rgba(246,116,0,.18);
  --seg-a:rgba(61,174,233,.3); --seg-b:rgba(246,116,0,.28); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.6rem;font-weight:600}
h2{font-size:1.15rem;font-weight:600;margin:1.6rem 0 .6rem}
h3{font-size:1rem;font-weight:600;margin:1rem 0 .4rem}
p{margin:.4rem 0}
.muted,.muted-t{color:var(--muted);fill:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1}
.measure{max-width:68ch}
.center{text-align:center}
.mono{font-family:var(--mono)}
kbd{font:600 .72rem var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;padding:0 .3rem;margin-left:.35rem;background:var(--view);color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- coquille ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.toolbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--header);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand-bg{fill:var(--accent)} .brand-ln{stroke:#fff;stroke-width:1.6;stroke-linecap:round}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select{background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:4px 8px;min-height:32px}
select:hover{border-color:var(--accent)}
.cb{display:flex;align-items:center;gap:5px;font-size:.88rem;color:var(--muted)}
.cb input{accent-color:var(--accent)}
.body{display:grid;grid-template-columns:200px 1fr;min-height:0}
.side{background:var(--bg);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;text-align:left}
.navitem:hover{background:var(--accent-soft)}
.navitem.on{background:var(--accent-soft);border-color:var(--accent)}
.ico{flex:none}
.main{background:var(--view);overflow:auto;min-height:0}
.page{padding:22px 28px 48px;max-width:1080px}
.page.narrow{max-width:800px}
.page-head{margin-bottom:14px}
.lead{color:var(--muted);max-width:70ch;margin-top:.4rem}
.h-sub{font-size:.95rem;font-weight:600;margin:1.2rem 0 .5rem;color:var(--muted)}
.empty{padding:2rem 0;color:var(--muted)}
section{margin-bottom:6px}

/* ---------- éléments communs ---------- */
.panel{border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;background:var(--view);margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);border:1px solid var(--border);border-radius:3px;padding:6px 13px;min-height:34px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){background:rgba(61,174,233,.28)}
.btn.danger{border-color:var(--neg);background:var(--neg-soft)}
.btn.wide{width:100%;justify-content:center;padding:10px}
.btn.icon-only{padding:4px 6px;min-height:28px;vertical-align:middle}
.linkbtn{background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;border:1px solid var(--border);border-radius:20px;padding:1px 9px;white-space:nowrap;background:var(--view)}
.chip.niv{font-variant-numeric:tabular-nums;color:var(--muted)}
.count-chip{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:.78rem;border-radius:3px;padding:0 6px;margin-left:6px}
.tag.ok{background:var(--pos-soft);color:var(--text)} .tag.ko{background:var(--neg-soft);color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.big{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.big .small{font-size:1rem;color:var(--muted)}
.today{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.today.panel{margin-top:4px}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:0 3px 3px 0}

/* mots décomposés : signalement des éléments de formation */
.segword{white-space:nowrap}
.seg{border-radius:2px;padding:0 1px}
.seg.a{background:var(--seg-a);box-shadow:inset 0 -2px 0 var(--accent)}
.seg.b{background:var(--seg-b);box-shadow:inset 0 -2px 0 var(--warn)}
.seg.hi{outline:2px solid var(--text);outline-offset:1px}
.rootchips{display:flex;flex-wrap:wrap;gap:6px}
.rootchip{font-size:.88rem;border-radius:3px;padding:2px 8px}
.rootchip.a{background:var(--seg-a)} .rootchip.b{background:var(--seg-b)}

/* fiche mot */
.detail-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.word-big{font-size:1.5rem;font-weight:600;margin:.2rem 0}
.facts{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:8px 0 0}
.facts dt{color:var(--muted);font-size:.88rem;padding-top:2px}
.facts dd{margin:0}
.ex{font-style:italic}
.lure{font-weight:600}
.detail.compact .facts{grid-template-columns:120px 1fr}

/* ---------- accueil ---------- */
.facts3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.fact{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fact b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.fact span{color:var(--muted);font-size:.9rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.step{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--view);cursor:pointer}
.step:hover{border-color:var(--accent);background:var(--accent-soft)}
.step span{color:var(--muted);font-size:.9rem}
.adult ul{padding-left:1.2rem;margin:.3rem 0} .adult li{margin:.3rem 0;max-width:80ch}
.refs li{font-size:.88rem}

/* ---------- explorer ---------- */
.explorer{display:grid;grid-template-columns:270px 1fr;min-height:100%}
.reslist{border-right:1px solid var(--border);padding:12px 8px;background:var(--bg)}
.resgroup{margin-bottom:10px}
.resgroup-t{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:4px 8px}
.resitem{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:6px 8px 6px 24px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;font-size:.92rem}
.resitem:hover{background:var(--accent-soft)}
.resitem.on{background:var(--accent-soft);border-color:var(--accent)}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.crumbs{margin-bottom:6px}
.figure{margin:12px 0}
.figure figcaption{font-size:.85rem;margin-top:4px}
.schema{width:100%;height:auto;display:block;max-height:340px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--view);cursor:pointer}
.wcard:hover{border-color:var(--accent)}
.wcard.on{border-color:var(--accent);background:var(--accent-soft)}
.wcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard-d{color:var(--muted);font-size:.88rem}

/* SVG */
.svlbl{fill:var(--text);font-family:var(--font)}
.svlbl.muted{fill:var(--muted)}
.svlbl.strong{font-weight:600}
.svlbl.link{fill:var(--accent-ink);cursor:pointer;text-decoration:underline;text-decoration-thickness:1px}
.svlbl.link:hover{font-weight:600}
.svlbl.on{font-weight:700;fill:var(--text);text-decoration:none}
.svlbl:focus-visible{outline:none;font-weight:700}
.sv-fill{fill:var(--accent-soft)}
.sv-stroke{fill:none;stroke:var(--text);stroke-width:1.5}
.sv-stroke1{fill:none;stroke:var(--muted);stroke-width:1.2}
.sv-stroke2{fill:none;stroke:var(--text);stroke-width:1.6}
.sv-faint{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.55}
.sv-dash{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:5 4}
.sv-strong{stroke:var(--text);stroke-width:2.2}
.sv-line{stroke:var(--muted);stroke-width:.9}
.sv-dot{fill:var(--text)}
.sv-accent{fill:none;stroke:var(--accent);stroke-width:2.2}
.sv-accent2{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
.sv-accent3{fill:none;stroke:var(--accent);stroke-width:2.6}
.sv-accent3.dashed{stroke-dasharray:6 4;stroke-width:2}
.sv-accentdot{fill:var(--accent)}
.sv-arrowhead{fill:var(--accent)}
.sv-cyto{fill:var(--pos-soft)}
.sv-membrane{fill:none;stroke:var(--pos);stroke-width:3}
.sv-nucleus{fill:rgba(155,89,182,.28);stroke:#8e44ad;stroke-width:1.5}
.sv-chloro{fill:rgba(39,174,96,.55);stroke:var(--pos);stroke-width:1}
.sv-box{fill:var(--view);stroke:var(--border);stroke-width:1.2}
.sv-particle{fill:var(--accent);opacity:.8}
.sv-zoombox{fill:none;stroke:var(--text);stroke-width:1;stroke-dasharray:3 3}
.band.b1{fill:rgba(218,68,83,.14)} .band.b2{fill:rgba(218,68,83,.26)} .band.b3{fill:rgba(218,68,83,.40)} .band.b4{fill:rgba(218,68,83,.56)}
.warbar{fill:var(--text);opacity:.75} .warbar.light{opacity:.4}

/* ---------- flashcards ---------- */
.seg-ctl{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.seg-ctl button{border:none;background:var(--btn);padding:7px 14px;cursor:pointer;border-right:1px solid var(--border)}
.seg-ctl button:last-child{border-right:none}
.seg-ctl button.on{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:6px 0 14px;flex-basis:100%}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.flashcard{border:1px solid var(--border);border-radius:6px;padding:28px 26px;min-height:260px;background:var(--view);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.flashcard:hover{border-color:var(--accent)}
.flashcard.flipped{cursor:default}
.fc-front{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.fc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.fc-front .fc-meta{justify-content:center}
.fc-word{font-size:2rem;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.fc-def{font-size:1.25rem;max-width:46ch}
.fc-q{color:var(--muted)}
.fc-title{font-size:1.4rem}
.fc-sep{border-top:1px dashed var(--border);margin:6px 0}
.fc-back{animation:fade .2s ease-out}
.fc-back .fc-word{justify-content:flex-start}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fc-actions .wide{grid-column:1/-1}
.rate{flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;text-align:left}
.rate span{font-size:.8rem;color:var(--muted)}
.rate.r0{border-left:4px solid var(--neg)} .rate.r1{border-left:4px solid var(--warn)} .rate.r2{border-left:4px solid var(--pos)}
.boxbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.bx{height:100%}
.bx0{background:var(--border)} .bx1{background:var(--neg)} .bx2{background:var(--warn)} .bx3{background:#fdbc4b} .bx4{background:#8fd18f} .bx5{background:var(--pos)}
.boxlegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.82rem;color:var(--muted)}
.boxlegend b{color:var(--text);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.done{border-color:var(--pos);background:var(--pos-soft)}

/* ---------- exercices ---------- */
.levels{display:flex;flex-direction:column;gap:8px}
.level{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;background:var(--view);cursor:pointer}
.level:hover{border-color:var(--accent);background:var(--accent-soft)}
.lv-n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.lv-body{display:flex;flex-direction:column;gap:3px;flex:1}
.lv-top{display:flex;gap:8px;align-items:center}
.lv-d{font-size:.9rem;color:var(--muted);max-width:75ch}
.lv-stat{font-size:.8rem}
.lv-badge{font-variant-numeric:tabular-nums;font-weight:600;border:1px solid var(--border);border-radius:3px;padding:2px 8px}
.lv-badge.ok{border-color:var(--pos);background:var(--pos-soft)}
.ex-title{margin-bottom:6px}
.ex-prog{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px}
.q-t{font-size:1.08rem;margin:.6rem 0}
.qword{font-size:1.15rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);border-radius:3px;padding:9px 12px;background:var(--btn);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.optk{flex:none;width:22px;height:22px;border-radius:3px;border:1px solid var(--border);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--view)}
.opt.good{border-color:var(--pos);background:var(--pos-soft)}
.opt.bad{border-color:var(--neg);background:var(--neg-soft)}
.opt.dim{opacity:.55}
.opt.jnsp{color:var(--muted)}
.opt.jnsp.sel{opacity:1;border-color:var(--muted)}
.corr{margin-top:14px;border:1px solid var(--border);border-left-width:4px;border-radius:3px;padding:10px 14px}
.corr.ok{border-left-color:var(--pos);background:var(--pos-soft)}
.corr.ko{border-left-color:var(--neg);background:var(--neg-soft)}
.corr.mid{border-left-color:var(--warn);background:var(--warn-soft)}
.corr-mark{font-weight:700;margin-right:6px}
.corr-detail{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);background:var(--view);margin:8px -14px -10px;padding:12px 14px;border-radius:0 0 3px 0}
.mini{border-top:1px solid var(--border);padding:6px 0}
.mini summary{cursor:pointer}
.match{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{text-align:left;border:1px solid var(--border);border-radius:3px;padding:8px 11px;background:var(--btn);cursor:pointer;min-height:44px;transition:background .15s}
.mitem.word{font-weight:600}
.mitem:hover:not(:disabled){border-color:var(--accent)}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.mitem.good{border-color:var(--pos);background:var(--pos-soft);cursor:default}
.mitem.bad{border-color:var(--neg);background:var(--neg-soft)}
.def-box{font-size:1.15rem;border:1px solid var(--border);border-radius:3px;padding:12px 14px;background:var(--bg)}
.hint{color:var(--text);background:var(--accent-soft);border-radius:3px;padding:6px 10px;font-size:.95rem}
.recall{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.recall input{flex:1;min-width:200px;border:1px solid var(--border);border-radius:3px;padding:7px 10px;background:var(--view);font-size:1.05rem}
.recall input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.worked{padding-left:1.3rem} .worked li{margin:.45rem 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--border);border-radius:3px;margin:8px 0 14px}
.chipbtn{border:1px solid var(--border);border-radius:20px;padding:4px 12px;background:var(--btn);cursor:pointer}
.chipbtn:hover:not(:disabled){border-color:var(--accent)}
.chipbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.chipbtn.used{opacity:.45}
.cloze{font-size:1.08rem;line-height:2.3;max-width:70ch}
.blank{display:inline;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:3px 3px 0 0;padding:1px 8px;cursor:pointer;min-width:90px;font-weight:600}
.blank.sel{box-shadow:0 0 0 2px var(--accent)}
.blank.good{background:var(--pos-soft);border-bottom-color:var(--pos)}
.blank.bad{background:var(--neg-soft);border-bottom-color:var(--neg)}
.fix{font-weight:400;color:var(--pos)}
.nowrap{white-space:nowrap}
.cl-item{border-top:1px solid var(--border);padding:6px 0}
.cl-item p{margin:.15rem 0}
textarea{width:100%;border:1px solid var(--border);border-radius:3px;padding:8px 10px;background:var(--view);resize:vertical;margin-bottom:8px}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.lbl{display:block;font-weight:600;margin:10px 0 4px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--accent)}

/* ---------- progression ---------- */
.prow{padding:8px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.table-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;max-width:640px}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:6px 10px;text-align:left}
.tbl th{font-weight:600;color:var(--muted);font-size:.88rem}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right}
.warnbox{border-color:var(--neg);background:var(--neg-soft)}

/* ---------- petits écrans ---------- */
@media (max-width:900px){
  .explorer{grid-template-columns:1fr}
  .reslist{border-right:none;border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .resgroup{display:flex;gap:4px;margin:0;flex:none}
  .resgroup-t{display:none}
  .resitem{white-space:nowrap;padding:5px 10px;border-color:var(--border);width:auto}
  .steps{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .figure{overflow-x:auto}
  .schema{min-width:560px;max-height:none}
  .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:6px}
  .navitem{flex:none;padding:6px 10px}
  .page{padding:16px 16px 40px}
  .facts3{grid-template-columns:1fr}
  .facts,.detail.compact .facts{grid-template-columns:1fr}
  .facts dt{padding-top:6px}
  .match{grid-template-columns:1fr 1.4fr;gap:8px}
  .opts.two{grid-template-columns:1fr}
  .fc-actions{grid-template-columns:1fr}
  .brand span{font-size:.95rem}
}
@media (max-width:420px){ .steps{grid-template-columns:1fr} .match{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* [mot, réseau, niveau, définition, exemple, formation "seg|seg:clé,clé" , piège, explication du piège] */
const RAW = [
["cité","h-anti","6e","Communauté de citoyens qui se gouvernent eux-mêmes, formée d'une ville et de son territoire.","Athènes et Sparte sont deux cités grecques rivales.","","Ensemble d'immeubles construits en banlieue","c'est le sens moderne de « cité » (un quartier d'habitat)."],
["citoyen","h-anti","6e","Membre d'une cité qui a le droit de participer aux décisions politiques.","À Athènes, seuls les hommes libres nés de parents athéniens sont citoyens.","","Habitant d'une grande ville","c'est un citadin : habiter en ville ne donne pas de droits politiques."],
["démocratie","h-anti","6e","Régime politique dans lequel le pouvoir appartient aux citoyens.","Au Ve siècle av. J.-C., Athènes est une démocratie.","démo|cratie:demo,cratie","Science qui étudie les populations","c'est la démographie, qui a la même racine démo- (le peuple)."],
["polythéisme","h-anti","6e","Croyance en plusieurs dieux.","Les Grecs pratiquent le polythéisme : ils honorent Athéna, Poséidon ou Héra.","poly|thé|isme:poly,theo,-","Étude des figures à plusieurs côtés","confusion avec poly- de « polygone » : ici, -thé- veut dire « dieu »."],
["monothéisme","h-anti","6e","Croyance en un dieu unique.","Le judaïsme, le christianisme et l'islam sont des monothéismes.","mono|thé|isme:mono,theo,-","Discours prononcé par une seule personne","c'est un monologue : même préfixe mono-, mais -logue veut dire « parole »."],
["oracle","h-anti","6e","Réponse d'un dieu à une question, transmise par un prêtre ou une prêtresse.","À Delphes, les Grecs viennent consulter l'oracle.","","Personne qui parle très bien en public","c'est un orateur : les deux mots se ressemblent à l'oral."],
["tyran","h-anti","6e","Dans la Grèce antique, homme qui prend seul le pouvoir, souvent par la force.","Pisistrate fut tyran d'Athènes au VIe siècle av. J.-C.","","Pièce qui sert à tirer ou à tendre quelque chose","c'est un tirant, un mot qui se prononce presque pareil."],
["république","h-anti","6e","Régime politique où le pouvoir n'est pas héréditaire et où les dirigeants sont choisis pour un temps limité.","Rome est une république de 509 à 27 av. J.-C.","","Réponse vive à une critique","c'est une réplique : le début du mot est le même."],
["sénat","h-anti","6e","À Rome, assemblée d'anciens magistrats qui dirige la politique de la République.","Le sénat romain décide de la guerre et contrôle les finances.","","Établissement où l'on soigne des malades","c'est un sanatorium : seule la sonorité est proche."],
["empire","h-anti","6e","État très vaste, formé de nombreux peuples et territoires, dirigé par un empereur.","En 27 av. J.-C., Auguste devient le premier empereur de Rome.","","Fait de devenir plus grave","c'est le verbe « empirer », qui n'a rien à voir avec l'empereur."],
["légion","h-anti","6e","Unité de l'armée romaine composée d'environ 5 000 soldats.","Les légions défendent les frontières de l'Empire romain.","","Plante cultivée pour être mangée","c'est un légume : les deux mots commencent par « lég- »."],
["archonte","h-anti","6e","Haut magistrat qui gouverne la cité d'Athènes.","À l'époque classique, les archontes d'Athènes sont tirés au sort.","","Vase grec à deux anses","piège cité par Alain Lieury : un mot rare se confond avec un objet du même thème (le vase, c'est l'amphore)."],

["seigneur","h-ma","5e","Homme qui possède une seigneurie et exerce son pouvoir sur les paysans qui y vivent.","Le seigneur rend la justice et lève des taxes sur ses terres.","","Personne âgée","le mot vient du latin senior (« plus âgé »), mais au Moyen Âge il désigne le maître d'une terre."],
["vassal","h-ma","5e","Seigneur qui a juré fidélité à un seigneur plus puissant, en échange d'une terre.","Lors de l'hommage, le vassal s'agenouille devant son suzerain.","","Ensemble des plats et des assiettes","c'est la vaisselle : seule la sonorité est proche."],
["suzerain","h-ma","5e","Seigneur qui reçoit l'hommage d'un vassal et lui confie un fief.","Le roi est le suzerain des grands seigneurs du royaume.","","Qui exerce l'autorité suprême dans un État","c'est un souverain : les deux mots se ressemblent."],
["fief","h-ma","5e","Terre confiée par un suzerain à son vassal en échange de sa fidélité.","Le chevalier reçoit un fief pour vivre et s'équiper.","","Personne en qui l'on peut avoir confiance","c'est une personne fiable ou fidèle : même début, sens différent."],
["serf","h-ma","5e","Paysan non libre, attaché à la terre de son seigneur.","Le serf ne peut pas quitter la seigneurie sans autorisation.","","Grand animal de la forêt qui porte des bois","c'est le cerf, son homophone : même prononciation, autre orthographe."],
["corvée","h-ma","5e","Travail gratuit que les paysans doivent au seigneur.","Plusieurs jours par an, les paysans font la corvée sur les terres du seigneur.","","Petit navire de guerre","c'est une corvette : les deux mots se ressemblent."],
["dîme","h-ma","5e","Impôt versé à l'Église, environ un dixième des récoltes.","Le curé prélève la dîme sur le blé des paysans.","","Jour de repos de la semaine","c'est le dimanche : même début, sans lien de sens."],
["monastère","h-ma","5e","Lieu où vivent des moines ou des moniales, à l'écart du monde, pour prier et travailler.","L'abbaye de Cluny, fondée en 910, est un grand monastère.","mona|stère:mono,-","Personne qui gouverne seule un royaume","c'est un monarque : même racine mono- (« seul »), mais pas le même sens."],
["croisade","h-ma","5e","Expédition militaire de chrétiens d'Occident pour prendre Jérusalem et les lieux saints.","La première croisade part en 1096.","","Endroit où deux routes se coupent","c'est un croisement : même radical « crois- »."],
["hégire","h-ma","5e","Départ de Mahomet de La Mecque vers Médine en 622 ; c'est le début du calendrier musulman.","L'an 1 de l'hégire correspond à l'année 622 de notre calendrier.","","Domination d'un pays sur les autres","c'est l'hégémonie : les deux mots commencent de la même façon."],
["chrétienté","h-ma","5e","Ensemble des pays et des peuples chrétiens.","Au Moyen Âge, le pape veut guider toute la chrétienté.","","Cérémonie qui fait entrer dans l'Église","c'est le baptême : même thème religieux, mot différent."],

["monarchie absolue","h-rev","4e","Régime où le roi détient tous les pouvoirs, qu'il dit tenir de Dieu.","Louis XIV incarne la monarchie absolue.","mon|archie| absolue:mono,archie,-","Régime dirigé par un petit groupe de riches","c'est l'oligarchie : -archie veut bien dire « pouvoir », mais mon- veut dire « un seul »."],
["Lumières","h-rev","4e","Mouvement d'idées du XVIIIe siècle qui défend la raison, la liberté et la tolérance.","Voltaire et Montesquieu sont des philosophes des Lumières.","","Fête religieuse où l'on allume des bougies","c'est le sens courant de « lumière » ; en histoire, le mot désigne un mouvement d'idées."],
["tiers état","h-rev","4e","Dans la France d'Ancien Régime, tous ceux qui n'appartiennent ni au clergé ni à la noblesse.","Le tiers état représente plus de 95 % de la population en 1789.","","Le tiers des habitants d'un pays","lecture mathématique de « tiers » : ici, tiers veut dire « troisième ordre »."],
["privilège","h-rev","4e","Droit particulier réservé à certains groupes, comme la noblesse et le clergé.","Les nobles ont le privilège de ne pas payer la taille.","","Ce qui passe en premier","c'est une priorité : les deux mots commencent par « pri- »."],
["cahier de doléances","h-rev","4e","Registre où les Français écrivent leurs plaintes et leurs souhaits en 1789.","Dans les cahiers de doléances, les paysans réclament la fin des droits seigneuriaux.","","Registre de messages après un décès","ce sont des condoléances : les deux mots se terminent pareil."],
["souveraineté nationale","h-rev","4e","Principe selon lequel le pouvoir appartient à la nation, c'est-à-dire à l'ensemble des citoyens.","La Déclaration des droits de l'homme et du citoyen affirme la souveraineté nationale.","","Pouvoir du roi sur la nation","c'est l'inverse : en 1789, la souveraineté passe du roi à la nation."],
["constitution","h-rev","4e","Texte qui fixe l'organisation des pouvoirs d'un État et les droits des citoyens.","En 1791, la France se dote de sa première constitution écrite.","","Résistance physique d'une personne","c'est un autre sens du mot (« avoir une solide constitution »)."],
["régicide","h-rev","4e","Meurtre d'un roi ; aussi la personne qui le commet.","L'exécution de Louis XVI en 1793 est un régicide.","régi|cide:reg,cide","Produit qui tue les insectes","piège cité par Alain Lieury : c'est un insecticide, qui a le même suffixe -cide (« qui tue »)."],
["abolition","h-rev","4e","Suppression officielle d'une loi, d'un droit ou d'une pratique.","L'abolition définitive de l'esclavage dans les colonies françaises date de 1848.","","Punition sévère d'une faute","abolir, ce n'est pas punir : c'est supprimer."],
["suffrage universel","h-rev","4e","Droit de vote accordé à tous les citoyens adultes.","Le suffrage universel masculin est établi en 1848 ; les femmes votent pour la première fois en 1945.","suffrage |uni|versel:-,uni,-","Souffrance partagée par tout le monde","seule la sonorité de « suffrage » rappelle « souffrance »."],

["industrialisation","h-xix","4e","Développement des usines et de la production en grande quantité grâce aux machines.","L'industrialisation transforme l'Europe au XIXe siècle.","","Qualité d'une personne qui travaille avec ardeur","c'est être industrieux, un adjectif ancien de la même famille."],
["machine à vapeur","h-xix","4e","Machine qui transforme l'énergie de la vapeur d'eau chauffée en mouvement.","La machine à vapeur fait fonctionner les locomotives et les usines.","","Appareil qui produit de la vapeur pour repasser le linge","c'est un objet du quotidien ; en histoire, la machine à vapeur produit du mouvement."],
["prolétaire","h-xix","4e","Ouvrier qui ne possède que sa force de travail et vit de son salaire.","Au XIXe siècle, beaucoup de prolétaires travaillent plus de 12 heures par jour.","","Personne qui parle trop longuement","c'est être prolixe : même début « pro- »."],
["syndicat","h-xix","4e","Association de travailleurs qui défend leurs intérêts.","En 1884, une loi autorise les syndicats en France.","syn|dicat:syn,-","Ensemble des signes d'une maladie","c'est un syndrome : même préfixe syn- (« ensemble »)."],
["colonie","h-xix","4e","Territoire dominé et exploité par un État étranger.","L'Algérie devient une colonie française à partir de 1830.","","Groupe d'enfants partis en vacances ensemble","c'est un autre sens courant du mot (« partir en colonie »)."],
["colonisation","h-xix","4e","Conquête et domination d'un territoire et de sa population par un État étranger.","La colonisation de l'Afrique s'accélère à la fin du XIXe siècle.","","Construction de colonnes de pierre","c'est un faux rapprochement avec « colonne »."],
["capitalisme","h-xix","4e","Système économique fondé sur la propriété privée des entreprises et la recherche du profit.","Le capitalisme se développe avec les banques et les grandes entreprises.","","Choix de la ville principale d'un pays","c'est un faux rapprochement avec « capitale »."],

["guerre totale","h-xx","3e","Guerre qui mobilise toutes les forces d'un pays : soldats, civils, économie et propagande.","La Première Guerre mondiale devient une guerre totale.","","Guerre qui touche tous les pays du monde","« totale » ne veut pas dire « mondiale » : c'est toute la société qui est mobilisée."],
["tranchée","h-xx","3e","Long fossé creusé pour protéger les soldats des tirs ennemis.","De 1915 à 1918, les soldats vivent dans les tranchées.","","Morceau coupé dans un pain","c'est une tranche : même radical, autre sens."],
["armistice","h-xx","3e","Accord qui arrête les combats entre des armées.","L'armistice du 11 novembre 1918 met fin aux combats.","","Ensemble des armes d'un pays","c'est l'armement : même début « arm- »."],
["génocide","h-xx","3e","Extermination volontaire et organisée d'un peuple ou d'un groupe humain.","Les nazis commettent le génocide des Juifs et des Tsiganes.","géno|cide:geno,cide","Science de l'hérédité","c'est la génétique, qui partage la racine gén- (« naissance, race »)."],

["propagande","h-xx","3e","Ensemble des moyens utilisés par un pouvoir pour imposer ses idées à la population.","Les affiches de propagande glorifient le chef.","","Promenade à pied","c'est une promenade : seule la sonorité est proche."],
["déportation","h-xx","3e","Transfert forcé de personnes vers des camps, loin de chez elles.","Des dizaines de milliers de Juifs et de résistants de France sont victimes de la déportation.","","Départ d'un bateau qui quitte le port","faux rapprochement avec « port »."],

["guerre froide","h-xx","3e","Affrontement indirect entre les États-Unis et l'URSS, de 1947 à 1991, sans guerre directe entre eux.","Le mur de Berlin est un symbole de la guerre froide.","","Guerre qui se déroule dans les régions polaires","lecture littérale de « froide » : ici, froide veut dire « sans combat direct »."],
["décolonisation","h-xx","3e","Processus par lequel les colonies obtiennent leur indépendance.","La décolonisation de l'Afrique a lieu surtout dans les années 1950 et 1960.","dé|colonisation:de,-","Départ en vacances des enfants d'une colonie","faux rapprochement avec la « colonie de vacances »."],

["équateur","g-rep","CM","Ligne imaginaire qui partage la Terre en deux moitiés, à égale distance des deux pôles.","Les pays situés près de l'équateur ont un climat chaud toute l'année.","équa|teur:equi,-","Pays d'Amérique du Sud","c'est l'Équateur, un pays traversé par cette ligne et nommé d'après elle."],
["hémisphère","g-rep","CM","Chacune des deux moitiés de la Terre, séparées par l'équateur.","La France est située dans l'hémisphère Nord.","hémi|sphère:hemi,sphere","Boule de verre décorative","c'est une sphère : le mot ne dit pas « moitié »."],
["pôle","g-rep","CM","Chacun des deux points extrêmes de l'axe autour duquel tourne la Terre.","Il fait très froid près des pôles.","","Pièce de bois plantée dans le sol","c'est un poteau : seule la sonorité est proche."],
["planisphère","g-rep","CM","Carte qui représente toute la surface de la Terre à plat.","Sur le planisphère, les océans occupent la plus grande place.","plani|sphère:plani,sphere","Planète entourée d'anneaux","faux rapprochement avec « planète » : plani- veut dire « plat »."],
["échelle","g-rep","CM","Rapport entre une distance mesurée sur la carte et la distance réelle.","À l'échelle 1/100 000, 1 cm sur la carte représente 1 km.","","Objet à barreaux pour monter","c'est le sens courant ; en géographie, l'échelle est un rapport de distances."],
["légende","g-rep","CM","Encadré qui explique les couleurs et les symboles d'une carte.","Lis la légende avant d'interpréter la carte.","","Récit merveilleux transmis par la tradition","c'est un autre sens du mot, en français."],
["relief","g-rep","CM","Ensemble des formes de la surface terrestre : montagnes, plaines, plateaux, vallées.","Le relief des Alpes est très élevé.","","Ce qui reste à la fin d'un repas","sens ancien (« les reliefs du repas »)."],
["latitude","g-rep","6e","Position d'un lieu au nord ou au sud de l'équateur, mesurée en degrés.","Paris est situé à environ 49° de latitude nord.","","Liberté d'agir comme on le souhaite","autre sens du mot (« avoir toute latitude »)."],
["longitude","g-rep","6e","Position d'un lieu à l'est ou à l'ouest d'une ligne de référence qui relie les pôles, mesurée en degrés.","La latitude et la longitude forment les coordonnées géographiques d'un lieu.","","Longueur d'un objet","faux rapprochement avec « longueur »."],
["tropique","g-rep","6e","Chacune des deux lignes imaginaires, au nord et au sud de l'équateur, qui limitent la zone chaude.","Le tropique du Cancer est situé dans l'hémisphère Nord.","","Plante qui pousse dans les pays chauds","c'est une plante tropicale : le nom désigne une ligne, pas une plante."],
["littoral","g-rep","6e","Zone de contact entre la terre et la mer.","Le littoral méditerranéen attire de nombreux touristes.","","Qui suit exactement le sens des mots","c'est « littéral », un paronyme : une seule lettre change."],

["urbanisation","g-ville","6e","Augmentation de la part de la population qui vit en ville.","L'urbanisation est très rapide en Afrique.","urb|anisation:urb,-","Politesse dans les relations","c'est l'urbanité, un mot de la même famille au sens de « politesse »."],

["agglomération","g-ville","6e","Ensemble formé par une ville et ses banlieues, sans interruption des constructions.","L'agglomération parisienne compte plus de 10 millions d'habitants.","","Embouteillage de voitures","faux rapprochement avec l'idée de foule ; le mot désigne un espace urbain."],
["densité de population","g-ville","6e","Nombre moyen d'habitants par kilomètre carré.","La densité de population de la France est d'environ 120 habitants par km².","","Poids total d'une population","c'est une confusion avec la densité en physique."],
["bidonville","g-ville","5e","Quartier d'habitations précaires construites avec des matériaux de récupération.","À Mumbai, des millions de personnes vivent dans des bidonvilles.","","Ville spécialisée dans le pétrole","faux rapprochement avec « bidon »."],
["aménagement","g-ville","5e","Organisation d'un territoire par la construction d'équipements : routes, logements, parcs.","La création d'une ligne de tramway est un aménagement urbain.","","Changement de logement","c'est un déménagement : même radical « ménag- »."],
["mégapole","g-ville","4e","Très grande ville de plus de 10 millions d'habitants.","Lagos et Tokyo sont des mégapoles.","méga|pole:mega,pole","Chaîne de grandes villes reliées sur des centaines de kilomètres","c'est une mégalopole, un mot très proche."],
["périurbanisation","g-ville","4e","Extension de la ville sur les campagnes qui l'entourent, avec des lotissements et des zones d'activités.","La périurbanisation allonge les trajets en voiture.","péri|urb|anisation:peri,urb,-","Disparition d'une ville détruite","péri- ne veut pas dire « périr » mais « autour »."],
["étalement urbain","g-ville","4e","Extension de la ville sur des espaces de plus en plus vastes, souvent au détriment des terres agricoles.","L'étalement urbain grignote les champs autour de Toulouse.","","Présentation de marchandises sur un étal","faux rapprochement avec l'étal du marché."],

["développement durable","g-monde","5e","Développement qui répond aux besoins actuels sans compromettre ceux des générations futures.","Réduire ses déchets participe au développement durable.","","Croissance qui dure très longtemps sans s'arrêter","« durable » ne veut pas dire « sans fin » : il s'agit de préserver l'avenir."],
["mondialisation","g-monde","4e","Mise en relation des différentes parties du monde par les échanges de marchandises, de personnes, de capitaux et d'informations.","Un téléphone assemblé en Asie avec des métaux venus d'Afrique est un produit de la mondialisation.","","Organisation d'une compétition mondiale","faux rapprochement avec « mondial »."],

["conteneur","g-monde","4e","Grande caisse métallique de taille standard qui sert à transporter les marchandises.","Un grand porte-conteneurs peut transporter plus de 20 000 conteneurs.","","Personne qui raconte des histoires","c'est un conteur, qui se prononce presque pareil."],
["firme transnationale","g-monde","4e","Grande entreprise qui produit et vend dans de nombreux pays.","Une firme transnationale peut avoir des usines sur trois continents.","firme |trans|nationale:-,trans,-","Entreprise de transport international","trans- veut dire « à travers » : ici, à travers les nations."],
["façade maritime","g-monde","3e","Littoral où se succèdent de grands ports ouverts sur le monde.","La Northern Range est la principale façade maritime de l'Europe.","","Devant d'un immeuble au bord de la mer","lecture littérale de « façade »."],
["délocalisation","g-monde","3e","Transfert d'une activité vers un autre pays, souvent où la main-d'œuvre coûte moins cher.","La délocalisation d'une usine textile vers le Bangladesh supprime des emplois en France.","","Perte du sens de l'orientation","c'est la désorientation : même préfixe, autre radical."],

["germination","s-cell","CM","Développement d'une graine qui donne une jeune plante.","La germination du haricot nécessite de l'eau, de l'air et une température favorable.","","Contamination par des microbes","faux rapprochement avec « germe » au sens de microbe."],
["cellule","s-cell","6e","Plus petite unité du vivant ; tout être vivant est formé d'une ou de plusieurs cellules.","Au microscope, on observe les cellules de l'épiderme d'oignon.","","Petite pièce fermée d'une prison","c'est un autre sens du mot « cellule »."],

["pluricellulaire","s-cell","6e","Formé de nombreuses cellules.","L'être humain est pluricellulaire : il compte des dizaines de milliers de milliards de cellules.","pluri|cellulaire:pluri,-","Qui a plusieurs couleurs","c'est multicolore : plusieurs couleurs, pas plusieurs cellules."],

["photosynthèse","s-cell","5e","Fabrication de matière par les plantes vertes à partir de lumière, d'eau et de dioxyde de carbone ; elle rejette du dioxygène.","Grâce à la photosynthèse, les feuilles produisent du dioxygène.","photo|synthèse:photo,synth","Montage de plusieurs photographies","photo- veut dire « lumière », pas « photographie »."],

["absorption intestinale","s-corps","5e","Passage des nutriments de l'intestin grêle vers le sang.","L'absorption intestinale est facilitée par les nombreux replis de l'intestin grêle.","","Fait de boire beaucoup d'eau","c'est le sens courant de « absorber »."],
["enzyme","s-corps","5e","Molécule qui accélère une transformation chimique, comme la digestion d'un aliment.","L'amylase de la salive est une enzyme qui digère l'amidon.","","Maladie qui irrite la peau","c'est l'eczéma : seule la sonorité est proche."],
["alvéole pulmonaire","s-corps","5e","Petit sac des poumons où le dioxygène passe de l'air au sang.","Les échanges gazeux ont lieu dans les alvéoles pulmonaires.","","Petite case de cire d'une ruche","c'est un autre sens du mot « alvéole »."],
["artère","s-corps","5e","Vaisseau qui transporte le sang du cœur vers les organes.","L'aorte est la plus grosse artère du corps.","","Personne qui crée des œuvres","c'est un artiste : seul le début du mot est commun."],

["herbivore","s-eco","CM","Animal qui se nourrit de végétaux.","La vache est herbivore.","herbi|vore:herb,vore","Animal qui mange de tout","c'est un omnivore : omni- veut dire « tout »."],
["biodiversité","s-eco","6e","Diversité des êtres vivants et des milieux de vie.","La forêt amazonienne abrite une biodiversité exceptionnelle.","bio|diversité:bio,-","Variété de produits issus de l'agriculture biologique","bio- veut dire « vie », pas « agriculture biologique »."],

["antibiotique","s-gen","3e","Médicament qui détruit les bactéries ou bloque leur multiplication ; il est sans effet sur les virus.","Les antibiotiques ne soignent pas la grippe.","anti|bio|tique:anti,bio,-","Médicament qui protège des virus","faux : les antibiotiques n'agissent pas sur les virus."],
["phagocytose","s-gen","3e","Capture et destruction d'un microbe par certains globules blancs.","La phagocytose est une réaction rapide de l'organisme.","phago|cyt|ose:phago,cyto,-","Peur excessive des microbes","ce serait un mot en -phobie : phago- veut dire « manger »."],

["solution","p-mat","5e","Mélange homogène obtenu en dissolvant une substance dans un liquide.","L'eau sucrée est une solution.","","Réponse à un problème","c'est le sens courant de « solution »."],

["atome","p-mat","4e","Très petite particule qui constitue la matière ; les atomes s'assemblent pour former les molécules.","Le carbone, l'hydrogène et l'oxygène sont des atomes.","","Bombe très destructrice","faux rapprochement avec la « bombe atomique »."],
["masse volumique","p-mat","4e","Masse d'un volume donné d'une substance, par exemple en g/cm³.","La masse volumique de l'eau liquide est d'environ 1 g/cm³.","","Volume total occupé par un objet","c'est une confusion entre masse et volume."],

["quadrilatère","m-geo","CM","Polygone à quatre côtés.","Le carré, le losange et le trapèze sont des quadrilatères.","quadri|latère:quadri,lat","Figure à quatre angles droits","c'est le rectangle, un quadrilatère particulier."],
["périmètre","m-geo","CM","Longueur du contour d'une figure.","Le périmètre d'un carré de 3 cm de côté est 12 cm.","péri|mètre:peri,metre","Mesure de la surface d'une figure","c'est l'aire."],

{r:"g-ville",t:"Aujourd'hui, plus de la moitié de l'humanité vit en ville : c'est l'effet de l'{urbanisation}. Les villes de plus de 10 millions d'habitants sont des {mégapoles#mégapole}. Autour des villes, la {périurbanisation} transforme les campagnes en lotissements.",x:["bidonvilles","mégalopoles"]},

/* Explications des pièges hors lexique */
const LUREX = {

"armement":"l'armement désigne les armes ; l'accord qui arrête les combats est l'armistice.",
"doléances":"il faudrait « cahiers de doléances », et ce ne sont pas eux qu'on abolit en 1789.",
"auteur":"l'auteur écrit le livre ; celui qui raconte l'histoire, dans le texte, est le narrateur.",
"objets":"un objet est une chose ; les raisons qui appuient une thèse sont des arguments.",
"dissolution":"la dissolution est le fait de dissoudre un solide dans un liquide, pas un changement d'état.",
"fossiles":"les fossiles sont des restes conservés dans les roches.",
"empires":"un empire est un vaste État ; Athènes est une cité.",
"colonies":"une colonie est un territoire dominé ; les ouvriers s'organisent en syndicats."

<script>
/* ===== Application ===== */
const {useState, useEffect, useMemo, useRef, useCallback} = React;
const html = htm.bind(React.createElement);
const Frag = React.Fragment;

/* ---------- utilitaires ---------- */
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const pick = a => a[Math.floor(Math.random()*a.length)];
const DAY = 86400000;
const parseMorph = mo => { if(!mo) return null; const [s,k]=mo.split(":"); const ks=k.split(","); return s.split("|").map((t,j)=>({t, k: ks[j]==="-"?null:ks[j]})); };

const RES_BY = Object.fromEntries(RES.map(r=>[r.id,r]));
const W = RAW.map(a => { const [w,r,n,d,e,mo,l,lx]=a; return {id:slug(w), w, r, n, d, e, segs:parseMorph(mo), l, lx, m:RES_BY[r].m}; });
const WBY = Object.fromEntries(W.map(w=>[w.id,w]));
const TR = TRANSFER.map(a => ({w:a[0], segs:parseMorph(a[1]), d:a[2], lures:[[a[3],a[4]],[a[5],a[6]]]}));
const ROOT_WORDS = {};
W.forEach(w => (w.segs||[]).forEach(s => { if(s.k){ (ROOT_WORDS[s.k]=ROOT_WORDS[s.k]||[]).push(w.w); } }));
TR.forEach(w => (w.segs||[]).forEach(s => { if(s.k){ (ROOT_WORDS[s.k]=ROOT_WORDS[s.k]||[]).push(w.w); } }));
const nivIdx = n => NIVS.indexOf(n);
const inF = (w,f) => (f.m==="all"||w.m===f.m) && (f.n==="all" || (f.cum ? nivIdx(w.n)<=nivIdx(f.n) : w.n===f.n));

/* ---------- mémoire locale (Leitner) ---------- */
const KEY = "vocab-encyclo-v1";
const INTERVAL = [0,0,1,3,7,16]; // jours selon la boîte 1..5
function loadStore(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.cards) return s; }catch(e){} return {cards:{}, ex:{}}; }
function saveStore(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
function rateCard(s, id, r){
  const now = Date.now(); const c = s.cards[id] || {b:1};
  let b = c.b || 1, due;
  if(r===0){ b=1; due=now; }
  else if(r===1){ due = now + Math.max(1, INTERVAL[b])*DAY; }
  else { b = Math.min(5, b+1); due = now + INTERVAL[b]*DAY; }
  s.cards[id] = {b, due, seen:(c.seen||0)+1};
}
function markReview(s, ids){ const now=Date.now(); ids.forEach(id => { s.cards["w:"+id] = {b:1, due:now, seen:((s.cards["w:"+id]||{}).seen||0)}; }); }

/* ---------- synthèse vocale ---------- */
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang="fr-FR"; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
const canSpeak = (()=>{ try{ return "speechSynthesis" in window; }catch(e){ return false; } })();

/* ---------- icônes (style Breeze, monochromes) ---------- */
const ICON = {
  accueil:"M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z",
  explorer:"M10 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM4.5 12.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM15.5 12.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM9 7.2 5.6 12.8M11 7.2l3.4 5.6M6.5 14.5h7",
  cartes:"M3.5 6.5h10v9h-10zM6.5 4.5h10v9",
  exercices:"M4 4.5h12v11H4zM7 8l1.5 1.5L12 6M7 12.5h6",
  progres:"M4 16V11M8.5 16V7M13 16V9.5M17 16V4.5M3 16.5h15",
  sound:"M4 8h3l4-3v10l-4-3H4zM13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9",
  back:"M12 5 7 10l5 5"
};
const Ico = ({n, s=18}) => html`<svg className="ico" width=${s} height=${s} viewBox="0 0 20 20" aria-hidden="true"><path d=${ICON[n]} fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>`;

/* ---------- petits composants ---------- */
const MatChip = ({m}) => html`<span className="chip"><span className="dot" style=${{background:MAT[m].c}}></span>${MAT[m].n}</span>`;
const NivChip = ({n}) => html`<span className="chip niv">${n}</span>`;
const SpeakBtn = ({t}) => canSpeak ? html`<button className="btn icon-only" title="Écouter" aria-label=${"Écouter « "+t+" »"} onClick=${e=>{e.stopPropagation(); speak(t);}}><${Ico} n="sound" s=${16}/></button>` : null;

function Seg({segs, w, hi}){
  if(!segs) return html`<span>${w}</span>`;
  let c=0;
  return html`<span className="segword">${segs.map((s,i)=> s.k
    ? html`<span key=${i} className=${"seg "+((c++)%2?"b":"a")+(hi===i?" hi":"")} title=${ROOTS[s.k][0]+" : "+ROOTS[s.k][1]}>${s.t}</span>`
    : html`<span key=${i}>${s.t}</span>`)}</span>`;
}
function RootChips({segs}){
  if(!segs) return null;
  const ks = segs.filter(s=>s.k); let c=0;
  return html`<div className="rootchips">${ks.map((s,i)=>html`<span key=${i} className=${"rootchip "+((c++)%2?"b":"a")}><b>${ROOTS[s.k][0]}</b> ${ROOTS[s.k][1]} <span className="muted">(${ROOTS[s.k][2]})</span></span>`)}</div>`;
}

function WordDetail({w, note, compact}){
  if(!w) return null;
  const r = RES_BY[w.r];
  return html`<div className=${"detail"+(compact?" compact":"")}>
    ${!compact && html`<div className="detail-head">
      <h3 className="word-big"><${Seg} segs=${w.segs} w=${w.w}/></h3><${SpeakBtn} t=${w.w}/>
      <span className="grow"></span><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/>
    </div>`}
    ${note && html`<p className="note">${note}</p>`}
    <dl className="facts">
      <dt>Définition</dt><dd>${w.d}</dd>
      <dt>En contexte</dt><dd className="ex">${w.e}</dd>
      ${w.segs && html`<${Frag}><dt>Formation</dt><dd><${RootChips} segs=${w.segs}/></dd><//>`}
      ${!compact && html`<${Frag}><dt>Réseau</dt><dd>${r.t}</dd><//>`}
    </dl>
  </div>`;
}

/* ---------- schémas (apprentissage multimédia : étiquettes posées sur l'image) ---------- */
function Lbl({x,y,id,children,anchor="start",sel,onPick,size=13,cls=""}){
  const ok = id && WBY[id];
  const act = () => ok && onPick(id);
  return html`<text x=${x} y=${y} textAnchor=${anchor} fontSize=${size}
    className=${"svlbl "+cls+(ok?" link":"")+(ok&&sel===id?" on":"")}
    tabIndex=${ok?0:undefined} role=${ok?"button":undefined}
    onClick=${ok?act:undefined} onKeyDown=${ok?(e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}}):undefined}>${children}</text>`;
}

function SchemaGlobe({sel,onPick}){
  const cx=200, cy=150, R=110, t=43.7, hw=100.9;
  return html`<svg viewBox="-20 0 580 300" className="schema" role="img" aria-label="La Terre : pôles, équateur, tropiques, hémisphères, latitude et longitude">
    <circle cx=${cx} cy=${cy} r=${R} className="sv-fill"/>

    <ellipse cx=${cx} cy=${cy} rx="95" ry=${R} className="sv-faint"/>
    <line x1=${cx} y1=${cy-R} x2=${cx} y2=${cy+R} className="sv-faint"/>
    <line x1=${cx-hw} y1=${cy-t} x2=${cx+hw} y2=${cy-t} className="sv-dash"/>
    <line x1=${cx-hw} y1=${cy+t} x2=${cx+hw} y2=${cy+t} className="sv-dash"/>
    <line x1=${cx-R} y1=${cy} x2=${cx+R} y2=${cy} className="sv-strong"/>

    <circle cx=${cx} cy=${cy-R} r="4" className="sv-dot"/><circle cx=${cx} cy=${cy+R} r="4" className="sv-dot"/>
    <line x1=${cx} y1=${cy} x2=${cx+77.8} y2=${cy-77.8} className="sv-accent"/>

    <path d=${`M ${cx+4} ${cy+12} L ${cx+52} ${cy+12}`} className="sv-accent" markerEnd="url(#arr)"/>
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" className="sv-arrowhead"/></marker></defs>
    <${Lbl} x=${cx+44} y=${cy-12} id="latitude" sel=${sel} onPick=${onPick} size=${12}>latitude<//>
    <${Lbl} x=${cx+6} y=${cy+28} id="longitude" sel=${sel} onPick=${onPick} size=${12}>longitude<//>
    <line x1="80" y1="45" x2="80" y2="145" className="sv-line"/><line x1="80" y1="155" x2="80" y2="255" className="sv-line"/>
    <${Lbl} x=${72} y=${100} anchor="end" id="hemisphere" sel=${sel} onPick=${onPick}>hémisphère<//>
    <text x="72" y="116" textAnchor="end" className="svlbl muted" fontSize="12">Nord</text>
    <${Lbl} x=${72} y=${200} anchor="end" id="hemisphere" sel=${sel} onPick=${onPick}>hémisphère<//>
    <text x="72" y="216" textAnchor="end" className="svlbl muted" fontSize="12">Sud</text>
    ${[[cy-R,"pôle","Nord","pole"],[cy-t,"tropique","du Cancer","tropique"],[cy,"équateur","","equateur"],[cy+t,"tropique","du Capricorne","tropique"],[cy+R,"pôle","Sud","pole"]].map(([y,a,b,id],i)=>{
      const x0 = cx + Math.sqrt(Math.max(0,R*R-(y-cy)*(y-cy)));
      return html`<g key=${i}><line x1=${x0+3} y1=${y} x2="350" y2=${y} className="sv-line"/>
        <${Lbl} x=${356} y=${y+4} id=${id} sel=${sel} onPick=${onPick}>${a}<//>
        ${b && html`<text x=${356+a.length*7.6+6} y=${y+4} className="svlbl muted" fontSize="13">${b}</text>`}</g>`;})}
  </svg>`;
}

function SchemaCell({sel,onPick}){
  return html`<svg viewBox="0 0 560 270" className="schema" role="img" aria-label="Une cellule végétale : membrane, cytoplasme, noyau, chloroplastes">
    <rect x="50" y="35" width="290" height="200" rx="38" className="sv-cyto"/>
    <rect x="50" y="35" width="290" height="200" rx="38" className="sv-membrane"/>
    <circle cx="140" cy="125" r="36" className="sv-nucleus"/>
    ${[[250,80,-20],[285,160,15],[205,200,0],[110,200,25],[290,105,40]].map(([x,y,r],i)=>html`<ellipse key=${i} cx=${x} cy=${y} rx="19" ry="9" transform=${`rotate(${r} ${x} ${y})`} className="sv-chloro"/>`)}
    <line x1="330" y1="60" x2="372" y2="50" className="sv-line"/><${Lbl} x=${378} y=${54} id="membrane" sel=${sel} onPick=${onPick}>membrane<//>

    <line x1="176" y1="125" x2="372" y2="170" className="sv-line"/><${Lbl} x=${378} y=${174} id="noyau" sel=${sel} onPick=${onPick}>noyau<//>
    <line x1="303" y1="160" x2="372" y2="225" className="sv-line"/><text x="378" y="222" className="svlbl" fontSize="13">chloroplaste, qui contient</text>
    <${Lbl} x=${378} y=${240} id="chlorophylle" sel=${sel} onPick=${onPick}>la chlorophylle<//>
    <${Lbl} x=${195} y=${262} anchor="middle" id="cellule" sel=${sel} onPick=${onPick} size=${12}>cellule<//>

}

function SchemaEtats({sel,onPick}){
  const box=(x,y,label,kind)=>{
    const dots=[]; const seed=[[.2,.3],[.5,.25],[.8,.3],[.25,.7],[.55,.72],[.8,.68],[.4,.48],[.68,.5],[.12,.5]];

    <${Lbl} x=${150} y=${120} anchor="end" id="fusion" sel=${sel} onPick=${onPick}>fusion<//>
    <${Lbl} x=${190} y=${165} id="solidification" sel=${sel} onPick=${onPick}>solidification<//>
    <${Lbl} x=${410} y=${120} id="vaporisation" sel=${sel} onPick=${onPick}>vaporisation<//>
    <${Lbl} x=${372} y=${165} anchor="end" id="condensation" sel=${sel} onPick=${onPick}>condensation<//>

    <text x="330" y="268" textAnchor="end" className="svlbl muted" fontSize="12">chaque rond représente une</text>
    <${Lbl} x=${334} y=${268} id="molecule" sel=${sel} onPick=${onPick} size=${12}>molécule<//>
  </svg>`;
}

function SchemaGeom({sel,onPick}){

function Flashcards({pool, store, upd, f}){
  const [mode,setMode] = useState("ws");
  const rootKeys = useMemo(()=>{ const set=new Set(); (f.m==="all"&&f.n==="all"? Object.keys(ROOTS):[]).forEach(k=>set.add(k)); pool.forEach(w=>(w.segs||[]).forEach(s=>s.k&&set.add(s.k))); return [...set]; },[pool,f]);
  const deck = useMemo(()=> mode==="r" ? rootKeys.map(k=>"r:"+k) : pool.map(w=>(mode==="ws"?"w:":"s:")+w.id),[mode,pool,rootKeys]);
  const [sess,setSess] = useState(null);
  const now = Date.now();
  const due = deck.filter(id=>store.cards[id] && store.cards[id].due<=now);
  const fresh = deck.filter(id=>!store.cards[id]);
  const boxes = [0,1,2,3,4,5].map(b=>deck.filter(id=> b===0 ? !store.cards[id] : (store.cards[id]||{}).b===b).length);

  const start = () => {
    const d = [...due].sort((a,b)=>store.cards[a].due-store.cards[b].due).slice(0,20);
    const nf = Math.max(0, Math.min(8, 20-d.length));
    const q = shuffle([...d, ...shuffle(fresh).slice(0,nf)]);
    if(!q.length) return;
    setSess({q, i:0, flip:false, again:{}, res:[0,0,0]});
  };
  const flip = () => setSess(s=>s && !s.flip ? {...s, flip:true} : s);
  const rate = r => {
    if(!sess || !sess.flip) return;
    const id = sess.q[sess.i];
    upd(s=>rateCard(s,id,r));
    setSess(s=>{ const q=[...s.q]; const again={...s.again}; if(r===0 && !again[id]){ q.push(id); again[id]=1; }
      const res=[...s.res]; res[r]++; return {...s, q, again, res, i:s.i+1, flip:false}; });
  };
  useEffect(()=>{
    if(!sess || sess.i>=sess.q.length) return;
    const h = e => { if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
      if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!sess.flip) flip(); }
      else if(sess.flip && ["1","2","3"].includes(e.key)) rate(+e.key-1); };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  });

  const face = (id, back) => {
    const [p,k] = [id.slice(0,1), id.slice(2)];
    if(p==="r"){ const R=ROOTS[k];
      return back ? html`<div className="fc-back"><div className="fc-title">${R[0]} = <b>${R[1]}</b></div><p className="muted">Origine : ${R[2]}</p>
        <p>Exemples : ${(ROOT_WORDS[k]||[]).slice(0,6).join(", ")}</p></div>`
      : html`<div className="fc-front"><div className="fc-q">Que signifie cet élément ?</div><div className="fc-word mono">${R[0]}</div><p className="muted">Pense à un mot qui le contient : ${(ROOT_WORDS[k]||[])[0]||""}</p></div>`; }
    const w = WBY[k];
    if(p==="w") return back ? html`<div className="fc-back"><${WordDetail} w=${w} compact=${true}/></div>`
      : html`<div className="fc-front"><div className="fc-meta"><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/></div><div className="fc-word"><${Seg} segs=${w.segs} w=${w.w}/> <${SpeakBtn} t=${w.w}/></div><p className="muted">Dis sa définition dans ta tête ou à voix haute, puis retourne la carte.</p></div>`;
    return back ? html`<div className="fc-back"><div className="fc-word"><${Seg} segs=${w.segs} w=${w.w}/> <${SpeakBtn} t=${w.w}/></div><p className="ex">${w.e}</p><${RootChips} segs=${w.segs}/></div>`
      : html`<div className="fc-front"><div className="fc-meta"><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/></div><div className="fc-def">${w.d}</div><p className="muted">Quel est le mot ? Retrouve-le avant de retourner la carte.</p></div>`;
  };

  const all = P.blanks.every((b,j)=>fill[j]!==undefined);
  const nOk = P.blanks.filter((b,j)=>fill[j]===b.form).length;
  const check = () => { setChecked(true); setScore(s=>s+nOk); setMax(m=>m+P.blanks.length); setRev(r=>[...r, ...P.blanks.filter((b,j)=>fill[j]!==b.form && WBY[b.id]).map(b=>b.id)]); };
  const next = () => { if(pi+1>=paras.length) onDone({score, max, review:rev, unit:"mots bien placés"}); else { setPi(pi+1); setFill({}); setChecked(false); setSel(null);} };
  return html`<div><${ExProgress} i=${pi} n=${paras.length} label="Texte"/>
    <div className="panel q">
      <div className="fc-meta"><${MatChip} m=${RES_BY[c.r].m}/><span className="muted">${RES_BY[c.r].t}</span></div>
      <p className="q-t">Complète le texte. Choisis un mot dans la réserve, puis clique sur l'emplacement. Deux mots de la réserve sont des pièges.</p>
      <div className="bank" aria-label="Réserve de mots">${bank.map((form,j)=>html`<button key=${j} className=${"chipbtn"+(sel===form?" sel":"")+(used.includes(form)?" used":"")} disabled=${checked} onClick=${()=>clickChip(form)}>${form}</button>`)}</div>
      <p className="cloze">${P.seq.map((s,j)=> s.text!==undefined ? html`<span key=${j}>${s.text}</span>`
        : html`<span key=${j} className="nowrap"><button className=${"blank"+(sel===s.blank?" sel":"")+(checked?(fill[s.blank]===P.blanks[s.blank].form?" good":" bad"):"")} onClick=${()=>clickBlank(s.blank)} aria-label=${"Emplacement "+(s.blank+1)}>${fill[s.blank] || "……"}${checked && fill[s.blank]!==P.blanks[s.blank].form ? html`<span className="fix"> → ${P.blanks[s.blank].form}</span>`:""}</button>${s.after}</span>`)}</p>
      ${!checked && html`<div className="actions"><button className="btn primary" disabled=${!all} onClick=${check}>Vérifier</button></div>`}
      ${checked && html`<${Correction} ok=${nOk===P.blanks.length} partial=${nOk>0} simple=${nOk+" mot"+(nOk>1?"s":"")+" bien placé"+(nOk>1?"s":"")+" sur "+P.blanks.length+"."}>
        ${P.blanks.map((b,j)=>{ const w=WBY[b.id]; const got=fill[j]; const wrong=got!==b.form; const gw = W.find(x=>norm(x.w)===norm(got)||norm(x.w)+"s"===norm(got));
          return html`<div key=${j} className="cl-item"><p><b>${j+1}. ${b.form}</b> ${wrong?html`<span className="tag ko">tu as mis « ${got} »</span>`:html`<span className="tag ok">juste</span>`}</p>
            ${w && html`<p className="small">${w.d}</p>`}
            ${wrong && html`<p className="note small">« ${got} » : ${LUREX[got] || (gw ? gw.d : "ce mot ne convient pas ici.")}</p>`}</div>`; })}<//>`}
      ${checked && html`<div className="actions"><button className="btn primary" onClick=${next}>${pi+1>=paras.length?"Voir le bilan":"Texte suivant"}</button></div>`}
    </div></div>`;
}

function ProdEx({pool, store, onDone}){
  const items = useMemo(()=>{ const seen = pool.filter(w=>(store.cards["w:"+w.id]||{}).b>=2); return sample(seen.length>=3?seen:pool, Math.min(3,pool.length)); },[]);
  const [i,setI]=useState(0), [def,setDef]=useState(""), [sen,setSen]=useState(""), [aid,setAid]=useState(false), [shown,setShown]=useState(false), [chk,setChk]=useState([false,false,false,false]), [score,setScore]=useState(0), [rev,setRev]=useState([]);
  const w = items[i];
  const CRIT = ["Ma définition donne la catégorie générale (c'est un… / c'est une…).","Ma définition donne au moins un trait qui distingue ce mot des mots voisins.","Ma phrase montre le sens du mot : on pourrait le deviner grâce au contexte.","Le mot est bien orthographié et bien accordé dans ma phrase."];
  const verdict = ok => { if(ok) setScore(s=>s+1); else setRev(r=>[...r,w.id]); if(i+1>=items.length) onDone({score:score+(ok?1:0), max:items.length, review: ok?rev:[...rev,w.id], unit:"mots maîtrisés (auto-évaluation)"}); else { setI(i+1); setDef(""); setSen(""); setAid(false); setShown(false); setChk([false,false,false,false]); } };
  const sibs = W.filter(x=>x.r===w.r && x.id!==w.id).slice(0,4);
  return html`<div><${ExProgress} i=${i} n=${items.length} score=${score}/>
    <div className="panel q">
      <div className="fc-meta"><${MatChip} m=${w.m}/><${NivChip} n=${w.n}/></div>
      <p className="word-big center"><${Seg} segs=${w.segs} w=${w.w}/> <${SpeakBtn} t=${w.w}/></p>
      <label className="lbl" htmlFor="prod-def">1. Définis ce mot avec tes propres mots</label>
      <textarea id="prod-def" rows="2" value=${def} disabled=${shown} onInput=${e=>setDef(e.target.value)}></textarea>
      <label className="lbl" htmlFor="prod-sen">2. Écris une phrase où tu l'emploies en ${MAT[w.m].n.toLowerCase()}</label>
      <textarea id="prod-sen" rows="2" value=${sen} disabled=${shown} onInput=${e=>setSen(e.target.value)}></textarea>
      ${!shown && html`<div className="actions">
        <button className="btn" disabled=${aid} onClick=${()=>setAid(true)}>Aide pour commencer</button>
        <button className="btn primary" disabled=${!def.trim() && !sen.trim()} onClick=${()=>setShown(true)}>Voir la correction</button></div>`}
      ${aid && !shown && html`<div className="hint"><p>Définition : « ${w.w.charAt(0).toUpperCase()+w.w.slice(1)}, c'est un(e) … qui … »</p><p>Phrase : reprends une situation de ta leçon de ${MAT[w.m].n.toLowerCase()}. Tu peux réutiliser : ${sibs.map(s=>s.w).join(", ")}.</p></div>`}
      ${shown && html`<div className="corr mid"><div className="corr-simple"><span className="corr-mark">Compare avec le modèle</span></div>
        <div className="corr-detail">
          <dl className="facts"><dt>Définition modèle</dt><dd>${w.d}</dd><dt>Phrase modèle</dt><dd className="ex">${w.e}</dd>
          ${w.segs && html`<${Frag}><dt>Formation</dt><dd><${RootChips} segs=${w.segs}/></dd><//>`}</dl>
          <p className="lbl">Vérifie ta production :</p>
          <div className="checks">${CRIT.map((c,j)=>html`<label key=${j} className="check"><input type="checkbox" id=${"crit-"+j} checked=${chk[j]} onChange=${()=>setChk(x=>x.map((v,k)=>k===j?!v:v))}/> ${c}</label>`)}</div>
          <div className="actions"><button className="btn rate r0" onClick=${()=>verdict(false)}><b>À retravailler</b><span>la carte repasse en boîte 1</span></button>
            <button className="btn rate r2" onClick=${()=>verdict(true)} disabled=${chk.filter(Boolean).length<3}><b>Réussi</b><span>au moins 3 critères cochés</span></button></div>
        </div></div>`}
    </div></div>`;
}

function ExProgress({i,n,score,label}){
  return html`<div className="ex-prog"><span className="muted">${label||"Question"} ${i+1} / ${n}</span>${score!==undefined && html`<span className="muted">Score : <b>${String(score).replace(".",",")}</b></span>`}
    <div className="progress"><div style=${{width:(i/n*100)+"%"}}></div></div></div>`;
}

function Exercises({pool, store, upd, f}){
  const [lvl,setLvl]=useState(null), [run,setRun]=useState(0), [result,setResult]=useState(null);
  const finish = r => { setResult(r); const pct = r.max? Math.max(0,Math.round(r.score/r.max*100)) : 0;
    upd(s=>{ const e=s.ex[lvl.id]||{n:0,best:0}; s.ex[lvl.id]={n:e.n+1, best:Math.max(e.best,pct), last:pct}; }); };
  const startL = L => { setLvl(L); setResult(null); setRun(x=>x+1); };
  if(lvl && pool.length<4) return html`<div className="page"><p className="empty">Il faut au moins 4 mots dans les filtres pour s'exercer. Élargis la matière ou le niveau dans la barre du haut.</p><button className="btn" onClick=${()=>setLvl(null)}>Retour aux niveaux</button></div>`;
  if(lvl){
    const props = {pool, f, store, onDone:finish, key:run};
    const Comp = {1:QcmEx,2:MatchEx,3:RecallEx,4:RootsEx,5:ClozeEx,6:ProdEx}[lvl.id];
    return html`<div className="page narrow">
      <div className="ex-head"><button className="btn" onClick=${()=>{setLvl(null); setResult(null);}}><${Ico} n="back" s=${16}/> Niveaux</button><span className="grow"></span>
        <span className="chip">Niveau ${lvl.id} · ${lvl.aim}</span></div>
      <h1 className="ex-title">${lvl.t}</h1>
      ${result ? html`<${EndScreen} r=${result} lvl=${lvl} onAgain=${()=>startL(lvl)} onNext=${lvl.id<6?()=>startL(LEVELS[lvl.id]):null} upd=${upd}/>` : html`<${Comp} ...${props}/>`}
    </div>`;
  }
  return html`<div className="page">
    <header className="page-head"><h1>Exercices</h1><p className="lead">Six niveaux de complexité croissante. Commence par le niveau 1 sur un réseau que tu as exploré, et monte quand tu dépasses 80 %.</p></header>
    <div className="levels">${LEVELS.map(L=>{ const e=store.ex[L.id]; return html`<button key=${L.id} className="level" onClick=${()=>startL(L)}>
      <span className="lv-n">${L.id}</span>
      <span className="lv-body"><span className="lv-top"><b>${L.t}</b><span className="chip">${L.aim}</span></span><span className="lv-d">${L.d}</span>
        <span className="lv-stat muted">${e ? e.n+" séance"+(e.n>1?"s":"")+" · meilleur score "+e.best+" %" : "Pas encore commencé"}</span></span>
      ${e && html`<span className=${"lv-badge"+(e.best>=80?" ok":"")}>${e.best} %</span>`}</button>`; })}</div>
  </div>`;
}

function EndScreen({r, lvl, onAgain, onNext, upd}){
  const [added,setAdded]=useState(false);
  const pct = r.max? Math.max(0,Math.round(r.score/r.max*100)) : 0;
  const rev = [...new Set(r.review)].filter(id=>WBY[id]);
  return html`<div className="panel q">
    <h2>Bilan</h2>
    <div className="today"><div><div className="big">${String(r.score).replace(".",",")}<span className="small"> / ${r.max}</span></div><div className="muted">${r.unit}</div></div>
      <div><div className="big">${pct} %</div><div className="muted">${pct>=80?"Tu peux passer au niveau suivant.":pct>=50?"Encore une séance sur ce niveau.":"Revois les mots en flashcards, puis recommence."}</div></div></div>
    ${rev.length>0 && html`<div><h3 className="h-sub">Mots à revoir</h3><p>${rev.map(id=>WBY[id].w).join(", ")}</p>
      <button className="btn" disabled=${added} onClick=${()=>{ upd(s=>markReview(s,rev)); setAdded(true); }}>${added?"Ajoutés aux flashcards (boîte 1)":"Les ajouter aux flashcards à revoir"}</button></div>`}
    <div className="actions"><button className="btn" onClick=${onAgain}>Recommencer ce niveau</button>${onNext && html`<button className="btn primary" onClick=${onNext}>Niveau suivant</button>`}</div>
  </div>`;
}

/* ---------- Progression ---------- */
function Progress({pool, store, upd}){
  const [confirm,setConfirm]=useState(false);
  const rows = Object.keys(MAT).map(m=>{ const ws=pool.filter(w=>w.m===m); return [m, [0,1,2,3,4,5].map(b=>ws.filter(w=> b===0 ? !store.cards["w:"+w.id] : (store.cards["w:"+w.id]||{}).b===b).length), ws.length]; }).filter(r=>r[2]);
  return html`<div className="page">
    <header className="page-head"><h1>Progression</h1><p className="lead">Place des mots dans les boîtes des flashcards (mode « du mot au sens »), par matière. Un mot en boîte 4 ou 5 a été retrouvé plusieurs fois, à plusieurs jours d'intervalle.</p></header>
    <div className="panel">${rows.map(([m,c,n])=>html`<div key=${m} className="prow"><div className="prow-h"><${MatChip} m=${m}/><span className="muted">${c[4]+c[5]} / ${n} installés</span></div><${BoxBar} counts=${c}/></div>`)}</div>
    <h2>Exercices</h2>
    <div className="table-wrap"><table className="tbl"><thead><tr><th>Niveau</th><th>Séances</th><th>Dernier score</th><th>Meilleur score</th></tr></thead>
      <tbody>${LEVELS.map(L=>{const e=store.ex[L.id]; return html`<tr key=${L.id}><td>${L.id}. ${L.t}</td><td className="num">${e?e.n:0}</td><td className="num">${e?e.last+" %":"–"}</td><td className="num">${e?e.best+" %":"–"}</td></tr>`;})}</tbody></table></div>
    <p className="muted small">La progression est enregistrée dans ce navigateur, sur cet appareil.</p>
    ${!confirm ? html`<button className="btn" onClick=${()=>setConfirm(true)}>Effacer toute la progression</button>`
      : html`<div className="panel warnbox"><p>Effacer toutes les cartes et tous les scores ? Cette action ne peut pas être annulée.</p><div className="actions"><button className="btn danger" onClick=${()=>{ upd(s=>{s.cards={}; s.ex={};}); setConfirm(false); }}>Oui, tout effacer</button><button className="btn" onClick=${()=>setConfirm(false)}>Annuler</button></div></div>`}
  </div>`;
}

/* ---------- Coquille de l'application ---------- */
const NAV = [["accueil","Accueil"],["explorer","Explorer"],["cartes","Flashcards"],["exercices","Exercices"],["progres","Progression"]];
function useHash(){
  const get = () => { const h=(location.hash||"").slice(1); return NAV.some(n=>n[0]===h)?h:"accueil"; };
  const [h,setH] = useState(get);
  useEffect(()=>{ const fn=()=>setH(get()); window.addEventListener("hashchange",fn); return ()=>window.removeEventListener("hashchange",fn); },[]);
  const go = x => { try{ if(location.hash!=="#"+x) location.hash=x; }catch(e){} setH(x); try{ document.getElementById("main").scrollTop=0; }catch(e){} };
  return [h,go];
}

function App(){
  const [route,go] = useHash();
  const [store,setStore] = useState(loadStore);
  const upd = useCallback(fn => setStore(s => { const n=JSON.parse(JSON.stringify(s)); fn(n); saveStore(n); return n; }), []);
  const [f,setF] = useState({m:"all", n:"all", cum:true});
  const pool = useMemo(()=>W.filter(w=>inF(w,f)),[f]);
  const page = {
    accueil: html`<${Home} go=${go} pool=${pool} store=${store}/>`,
    explorer: html`<${Explorer} pool=${pool} key=${f.m+f.n+f.cum}/>`,
    cartes: html`<${Flashcards} pool=${pool} store=${store} upd=${upd} f=${f} key=${f.m+f.n+f.cum}/>`,
    exercices: html`<${Exercises} pool=${pool} store=${store} upd=${upd} f=${f} key=${f.m+f.n+f.cum}/>`,
    progres: html`<${Progress} pool=${pool} store=${store} upd=${upd}/>`
  }[route];
  return html`<div className="app">
    <header className="toolbar">
      <div className="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2.5" y="3.5" width="17" height="15" rx="2" className="brand-bg"/><path d="M6 8h6M6 11h10M6 14h7" className="brand-ln"/></svg><span>Vocabulaire encyclopédique</span></div>
      <div className="grow"></div>
      <div className="filters">
        <label htmlFor="f-mat" className="sr">Matière</label>
        <select id="f-mat" value=${f.m} onChange=${e=>setF({...f,m:e.target.value})}><option value="all">Toutes les matières</option>${Object.keys(MAT).map(m=>html`<option key=${m} value=${m}>${MAT[m].n}</option>`)}</select>
        <label htmlFor="f-niv" className="sr">Niveau</label>
        <select id="f-niv" value=${f.n} onChange=${e=>setF({...f,n:e.target.value})}><option value="all">Tous les niveaux</option>${NIVS.map(n=>html`<option key=${n} value=${n}>${f.cum?"Jusqu'au ":"Seulement "}${n}</option>`)}</select>
        <label className="cb" htmlFor="f-cum"><input type="checkbox" id="f-cum" checked=${f.cum} onChange=${e=>setF({...f,cum:e.target.checked})}/> niveaux précédents</label>
        <span className="chip count-chip">${pool.length} mots</span>
      </div>
    </header>
    <div className="body">
      <nav className="side" aria-label="Sections">${NAV.map(([k,t])=>html`<button key=${k} className=${"navitem"+(route===k?" on":"")} aria-current=${route===k?"page":undefined} onClick=${()=>go(k)}><${Ico} n=${k}/><span>${t}</span></button>`)}</nav>
      <main className="main" id="main">${page}</main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

</script>
</body>
</html>
