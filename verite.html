<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La vérité · Terminale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Mise en page : fenêtre KDE (barre d'outils, panneau latéral à la manière de Configuration du système, vue de contenu à cartes plates). */
:root{
  --window:#eff0f1; --view:#fcfcfc; --alt:#f4f5f6; --header:#e3e5e7;
  --text:#232629; --muted:#585e64; --border:#cdd0d4; --border-strong:#a7adb3;
  --accent:#3daee9; --accent-ink:#1a6a99; --accent-soft:#ddf0fa;
  --ok:#1d7a44; --ok-soft:#e0f3e7; --bad:#b7352a; --bad-soft:#fbe4e1; --warn:#a65200; --warn-soft:#fdeedd;
  --c-C:#2373ad; --c-C-soft:#d8eaf8; --c-K:#7d3c98; --c-K-soft:#efe1f5; --c-D:#b35600; --c-D-soft:#fde7d1;
  --c-E:#1d7a44; --c-E-soft:#dcf2e4; --c-R:#0b7d6e; --c-R-soft:#d3efea;
  --mark:#fff1b8;
  --sans:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"DejaVu Sans Mono",Menlo,monospace;
  --r:4px; --r2:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --window:#202326; --view:#292c30; --alt:#2e3236; --header:#31363b;
    --text:#fcfcfc; --muted:#a9b1b8; --border:#43484e; --border-strong:#5e656c;
    --accent:#3daee9; --accent-ink:#7cc7ef; --accent-soft:#1d3a4c;
    --ok:#5ccb8a; --ok-soft:#1d3a29; --bad:#f2806f; --bad-soft:#48282a; --warn:#f3a557; --warn-soft:#45331f;
    --c-C:#70bff0; --c-C-soft:#1e3a4e; --c-K:#c9a0e3; --c-K-soft:#3a2b47; --c-D:#f3a557; --c-D-soft:#463221;
    --c-E:#5ccb8a; --c-E-soft:#1d3a29; --c-R:#52d3bf; --c-R-soft:#173e38;
    --mark:#584b18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --window:#202326; --view:#292c30; --alt:#2e3236; --header:#31363b;
  --text:#fcfcfc; --muted:#a9b1b8; --border:#43484e; --border-strong:#5e656c;
  --accent:#3daee9; --accent-ink:#7cc7ef; --accent-soft:#1d3a4c;
  --ok:#5ccb8a; --ok-soft:#1d3a29; --bad:#f2806f; --bad-soft:#48282a; --warn:#f3a557; --warn-soft:#45331f;
  --c-C:#70bff0; --c-C-soft:#1e3a4e; --c-K:#c9a0e3; --c-K-soft:#3a2b47; --c-D:#f3a557; --c-D-soft:#463221;
  --c-E:#5ccb8a; --c-E-soft:#1d3a29; --c-R:#52d3bf; --c-R-soft:#173e38;
  --mark:#584b18; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--window);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
*{box-sizing:border-box}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;font-weight:600}
p{margin:0}
u{text-underline-offset:2px}

/* Barre d'outils */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--header);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app-ico{width:28px;height:28px;border-radius:var(--r);background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.app-name{font-weight:600;font-size:15px}
.app-sub{color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.crumb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Coque */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);gap:20px;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.side{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:2px}
.side .group-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--text);width:100%}
.nav:hover{background:var(--alt);border-color:var(--border)}
.nav[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.nav svg{flex:none;color:var(--muted)}
.nav[aria-current="page"] svg{color:var(--accent-ink)}
.nav .nb{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .side .group-label{display:none}
  .nav{width:auto;flex:none;padding:6px 10px}
  .nav .nb{display:none}
  .app-sub{display:none}
}

/* Éléments communs */
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head h1{font-size:24px}
.page-head p{color:var(--muted);max-width:68ch}
.card{background:var(--view);border:1px solid var(--border);border-radius:var(--r2)}
.card-pad{padding:18px 20px}
.sec-title{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--view);cursor:pointer;min-height:34px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink);padding-inline:6px}
.btn.ghost:hover:not(:disabled){border-color:var(--border)}
.btn.sm{min-height:28px;padding:3px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--alt);white-space:nowrap}
.chip.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.pill-tabs{display:flex;gap:4px;flex-wrap:wrap;padding:3px;background:var(--alt);border:1px solid var(--border);border-radius:var(--r2);width:fit-content;max-width:100%}
.pill-tabs button{border:1px solid transparent;background:none;padding:5px 12px;border-radius:var(--r);cursor:pointer;font-size:14px}
.pill-tabs button[aria-pressed="true"]{background:var(--view);border-color:var(--border-strong);font-weight:600}
.progress{height:6px;background:var(--alt);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.progress > span{display:block;height:100%;background:var(--accent)}

/* Exercices */
.ex{display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ex-head h3{font-size:17px}
.consigne{background:var(--alt);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;max-width:75ch}
.consigne b{font-weight:600}
.q{font-weight:500;max-width:72ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--view);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default;color:var(--text)}
.opt .key{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .key{border-color:var(--ok);color:var(--ok)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .key{border-color:var(--bad);color:var(--bad)}
.verdict{border-left:3px solid var(--border-strong);padding:8px 12px;background:var(--alt);border-radius:0 var(--r) var(--r) 0;max-width:75ch}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)}
.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.verdict.info{border-color:var(--accent);background:var(--accent-soft)}
.verdict strong{font-weight:600}
.details{border:1px dashed var(--border-strong);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:78ch}
.details h4{font-size:14px}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--view)}
.item.is-ok{border-color:var(--ok)}
.item.is-bad{border-color:var(--bad)}
.item .why{grid-column:1/-1;font-size:14px;color:var(--muted)}
.item .sol{grid-column:1/-1;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:4px 10px;border:1px solid var(--border-strong);background:var(--view);border-radius:var(--r);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{cursor:default}
select{padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--view);max-width:100%;min-height:34px}
textarea{width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--view);line-height:1.55;resize:vertical}
.chips-pick{display:flex;flex-wrap:wrap;gap:6px}
.chips-pick button{padding:5px 11px;border:1px solid var(--border-strong);border-radius:999px;background:var(--view);cursor:pointer;font-size:14px}
.chips-pick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chips-pick button.is-ok{border-color:var(--ok);background:var(--ok-soft);color:var(--text)}
.chips-pick button.is-bad{border-color:var(--bad);background:var(--bad-soft);color:var(--text)}
.chips-pick button.is-miss{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.order-list{display:flex;flex-direction:column;gap:6px;counter-reset:o}
.order-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--view)}
.order-row .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.order-row.is-ok{border-color:var(--ok)} .order-row.is-bad{border-color:var(--bad)}
.order-row .role{grid-column:2/-1;font-size:13px;color:var(--muted)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--view);cursor:pointer}
.iconbtn:hover:not(:disabled){border-color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}

/* Grille d'auto-évaluation */
.grid-eval{width:100%;border-collapse:collapse;font-size:14px}
.grid-eval th,.grid-eval td{border:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
.grid-eval th{background:var(--alt);font-weight:600}
.grid-eval td.c{text-align:center;width:44px}
.grid-eval input{width:18px;height:18px;accent-color:var(--accent)}
.tbl-wrap{overflow-x:auto}

/* Fiches */
.fiche-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.fiche-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.fiche-list button{text-align:left;padding:6px 10px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:14px}
.fiche-list button:hover{background:var(--view);border-color:var(--border)}
.fiche-list button[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.fiche-list .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;width:18px;flex:none}
@media (max-width:980px){.fiche-layout{grid-template-columns:minmax(0,1fr)}.fiche-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.fiche-list button{flex:none}}
.idee{font-size:18px;font-weight:500;max-width:60ch;color:var(--text)}
.fiche-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px}
@media (max-width:1100px){.fiche-body{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--alt);display:flex;flex-direction:column;gap:6px}
.box .lbl{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.box.retenir{background:var(--accent-soft);border-color:var(--accent)}
.box.retenir .lbl{color:var(--accent-ink)}
.diagram{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--view);padding:8px}
.diagram svg{display:block;width:100%;height:auto;min-width:460px}
.d-box{fill:var(--alt);stroke:var(--border-strong)}
.d-acc{fill:var(--accent-soft);stroke:var(--accent)}
.d-warm{fill:var(--warn-soft);stroke:var(--warn)}
.d-ok{fill:var(--ok-soft);stroke:var(--ok)}
.d-bad{fill:var(--bad-soft);stroke:var(--bad)}
.d-t{fill:var(--text);font-family:var(--sans);font-size:13px}
.d-m{fill:var(--muted);font-family:var(--sans);font-size:12px}
.d-b{fill:var(--text);font-family:var(--sans);font-size:13px;font-weight:600}
.d-line{stroke:var(--border-strong);fill:none}
.d-acc-line{stroke:var(--accent);fill:none}
.d-head{fill:var(--accent)}

/* Accueil */
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps4{grid-template-columns:minmax(0,1fr)}}
.step-card{display:flex;flex-direction:column;gap:8px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text)}
.step-card:hover{border-color:var(--accent)}
.step-card .num{font-size:12px;color:var(--accent-ink);font-weight:600;letter-spacing:.04em}
.step-card h3{font-size:16px}
.step-card p{font-size:14px;color:var(--muted)}
.tensions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tensions{grid-template-columns:minmax(0,1fr)}}
.tension{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;padding:12px;border:1px solid var(--border);border-radius:var(--r2);background:var(--view);cursor:pointer;text-align:left}
.tension:hover{border-color:var(--accent)}
.pole{font-size:14px;padding:6px 8px;border-radius:var(--r)}
.pole.a{background:var(--accent-soft);color:var(--text)}
.pole.b{background:var(--warn-soft);color:var(--text)}
.tension .vs{align-self:center;color:var(--muted);font-size:12px}
.tension .key{grid-column:1/-1;font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:6px}
.tension .key b{color:var(--ok);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Flashcards */
.fc-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:900px){.fc-wrap{grid-template-columns:minmax(0,1fr)}}
.fc{min-height:260px;display:flex;flex-direction:column;gap:12px;padding:22px 24px;cursor:pointer;position:relative}
.fc .face-lbl{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fc .front{font-size:21px;font-weight:600;line-height:1.35;max-width:40ch}
.fc .back{font-size:16px;line-height:1.6;max-width:62ch;border-top:1px solid var(--border);padding-top:12px}
.fc .hint{margin-top:auto;font-size:13px;color:var(--muted)}
.fc.quote .front{font-family:var(--serif);font-weight:400;font-style:italic}
.boxes{display:flex;flex-direction:column;gap:10px}
.boxline{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:13px}
.boxline .progress > span.b1{background:var(--bad)}
.boxline .progress > span.b2{background:var(--warn)}
.boxline .progress > span.b3{background:var(--ok)}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--view)}

/* Explication de texte */
.tq-layout{display:grid;grid-template-columns:minmax(0,var(--a,56fr)) 14px minmax(0,var(--b,44fr));gap:2px;align-items:stretch}
.tq-layout > section{align-self:start}
.tq-layout.closed{grid-template-columns:minmax(0,1fr);gap:12px}
.splitter{position:relative;cursor:col-resize;touch-action:none;border-radius:4px}
.splitter::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--border)}
.splitter::after{content:"";position:sticky;top:45vh;display:block;margin:0 auto;width:6px;height:44px;border-radius:3px;background:var(--border-strong)}
.splitter:hover::before,.splitter:focus-visible::before{background:var(--accent)}
.splitter:hover::after,.splitter:focus-visible::after{background:var(--accent)}
.shell.focus{grid-template-columns:minmax(0,1fr);max-width:none}
.shell.focus .side{display:none}
.text-head .tools{flex-wrap:nowrap}
.text-head .iconbtn{width:28px;height:28px}
.aa{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1}
.aa.sm{font-size:11px}
.ttext.wrap .tx{white-space:normal;padding-left:1.2em;text-indent:-1.2em}
.ttext.wrap .tline.para .tx{text-indent:.3em}
@media (max-width:1100px){
  .tq-layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .splitter,.wide-only{display:none}
  .shell.focus .side{display:flex}
}
.text-panel{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:1100px){.text-panel{position:static;max-height:none}}
.text-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--alt);border-radius:var(--r2) var(--r2) 0 0;position:sticky;top:0;z-index:1}
.ttext{font-family:var(--serif);font-size:14.5px;line-height:1.8;padding:12px 14px 16px 0;overflow-x:auto}
.ttext .tx{white-space:nowrap}
.tline{display:grid;grid-template-columns:36px minmax(0,1fr);}
.tline .ln{color:var(--muted);font-family:var(--sans);font-size:11px;text-align:right;padding-right:10px;padding-top:4px;font-variant-numeric:tabular-nums;user-select:none}
.tline.para{margin-top:10px}
.tline.para .tx{text-indent:1.5em}
.tline.dim .tx{opacity:.38}
.tline.hl .tx{background:var(--mark);border-radius:2px}
.source{font-family:var(--sans);font-size:13px;color:var(--muted);text-align:right;padding:0 14px 12px}
.tok{border-radius:3px;cursor:pointer;padding:0 1px}
.tok:hover{outline:1px dashed var(--border-strong)}
.tok.cC{background:var(--c-C-soft);box-shadow:inset 0 -2px 0 var(--c-C)}
.tok.cK{background:var(--c-K-soft);box-shadow:inset 0 -2px 0 var(--c-K)}
.tok.cD{background:var(--c-D-soft);box-shadow:inset 0 -2px 0 var(--c-D)}
.tok.cE{background:var(--c-E-soft);box-shadow:inset 0 -2px 0 var(--c-E)}
.tok.cR{background:var(--c-R-soft);box-shadow:inset 0 -2px 0 var(--c-R)}
.tok.miss{outline:2px dotted var(--ok)}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--view);cursor:pointer;font-size:13px}
.pal button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:600}
.etapes{display:flex;flex-direction:column;gap:10px}
.etape-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.etape-bar button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--view);cursor:pointer;text-align:left}
.etape-bar button small{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.etape-bar button span{font-size:14px;font-weight:500}
.etape-bar button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.substeps{display:flex;gap:4px;flex-wrap:wrap}
.substeps button{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--view);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.substeps button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.substeps .dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.substeps .dot.on{background:var(--ok)}
.navbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px}
.model{font-family:var(--serif);font-size:15px;line-height:1.75;background:var(--view);border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:78ch}
.model p{text-indent:1.5em}
.model .tag{font-family:var(--sans);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);text-indent:0;display:block;margin-bottom:-6px}
.collapse-btn{display:none}
@media (max-width:1100px){.collapse-btn{display:inline-flex}}
.worked{display:flex;flex-direction:column;gap:10px}
.wstep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--view)}
.wstep .wn{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:600;border:1px solid var(--accent)}
.wstep h4{font-size:15px;margin-bottom:4px}
.why-q{font-size:14px;color:var(--accent-ink);margin-top:6px}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(2px)}to{opacity:1;transform:none}}
}
</style>

const FICHES = [
{ id:"jugement", titre:"Vérité et réalité",
  idee:"La vérité n’est pas une chose : c’est une qualité de ce que l’on dit ou pense du réel.",

  retenir:"Vérité ≠ réalité. Le réel est ; le jugement est vrai ou faux.",
  reperes:["Vrai / probable / certain"], diagram:"jugement",

{ id:"correspondance", titre:"La vérité-correspondance",
  idee:"Est vrai le jugement qui s’accorde avec la chose dont il parle.",
  corps:[

    "Cette conformité se **vérifie** de façon empirique : par l’expérience courante (je regarde par la fenêtre) ou par l’expérimentation scientifique.",

  reperes:["Objectif / subjectif"], diagram:"jugement",
  check:{q:"Quelle est la principale difficulté de la vérité-correspondance ?", options:[
    {t:"Elle oublie que le réel change sans cesse.", fb:"Le réel peut changer, mais un jugement daté (« il pleut ce matin ») peut rester vrai. Ce n’est pas la difficulté principale."},
    {t:"Nous ne pouvons pas sortir de nos représentations pour les comparer au réel.", ok:true, fb:"C’est le problème des lunettes jaunes : on compare toujours une représentation à une autre représentation."},
    {t:"Elle ne vaut que pour les mathématiques.", fb:"C’est l’inverse : elle vaut surtout pour les faits, que l’on peut observer."}]}
},
{ id:"evidence", titre:"Le critère de l’évidence",
  idee:"Pour Descartes et Spinoza, l’idée vraie se reconnaît d’elle-même.",
  corps:[
    "Un **critère** est un signe qui permet de discerner le vrai du faux.",
    "**Descartes** (*Discours de la méthode*, 1637) : est vrai ce que je conçois **clairement et distinctement**. Sa première certitude est le *cogito* : je peux douter de tout, mais pour douter il faut penser, donc je suis.",
    "**Spinoza** (*Éthique*, 1677) : la vérité est **à elle-même son propre critère** (*verum index sui*). Comme la lumière, qui montre les objets et se montre elle-même, l’idée vraie montre qu’elle est vraie.",
    "**La limite** : le sentiment d’évidence peut tromper. Il « saute aux yeux » que le Soleil tourne autour de la Terre. La **certitude** est un état de mon esprit ; la **vérité** est un rapport au réel."
  ],
  exemple:"Quand tu as vraiment compris une démonstration de maths, tu n’as pas besoin qu’on te confirme qu’elle est juste : tu le vois. Mais le complotiste aussi « voit » l’évidence de sa théorie.",
  retenir:"L’évidence est un critère interne : solide en logique et en mathématiques, fragile pour les faits.",
  reperes:["Vrai / probable / certain","Médiat / immédiat"],
  check:{q:"Pourquoi l’évidence ne suffit-elle pas toujours comme critère ?", options:[
    {t:"Le sentiment d’être certain peut accompagner une erreur.", ok:true, fb:"Certitude ≠ vérité : on peut être absolument sûr et se tromper."},
    {t:"Parce que Descartes s’est contredit.", fb:"Ce n’est pas un argument : il faut montrer *pourquoi* le critère est fragile."},
    {t:"Parce qu’une évidence est toujours collective.", fb:"Au contraire, chez Descartes, l’évidence est vécue par un esprit seul, dans la réflexion."}]}
},
{ id:"formel", titre:"Vérité formelle, vérité matérielle",
  idee:"Un raisonnement peut être logiquement valide et pourtant faux.",
  corps:[
    "La **vérité formelle** concerne la cohérence interne du raisonnement, quel que soit son contenu. C’est le domaine de la logique et des mathématiques.",
    "La **vérité matérielle** concerne l’accord du contenu avec le réel. Elle se vérifie par l’expérience.",
    "Une connaissance complète exige les deux : un raisonnement **valide** et des prémisses **vraies**."

  exemple:"« Tous les poissons volent. Mon chat est un poisson. Donc mon chat vole. » La forme est parfaite, le contenu est faux.",

  reperes:["Formel / matériel","Principe / conséquence"], diagram:"validite",
  check:{q:"« Si je révise, je réussis. J’ai réussi. Donc j’ai révisé. » Ce raisonnement est…", options:[

},
{ id:"kant", titre:"Kant : connaître les phénomènes",
  idee:"Nous connaissons les choses telles qu’elles nous apparaissent, jamais telles qu’elles sont en soi.",
  corps:[
    "Le **phénomène** est la chose telle qu’elle nous apparaît, à travers les formes de notre esprit : l’espace, le temps et des concepts comme celui de cause. Notre connaissance part de l’**intuition**, c’est-à-dire de ce qui nous est donné dans l’espace et le temps.",

    "Pour Kant, un critère de vérité **à la fois universel et matériel** est impossible : universel, il ferait abstraction du contenu ; matériel, il porte justement sur ce contenu. Kant le remplace par **trois conditions** : la validité logique, l’accord avec les formes de l’expérience possible, la vérification par l’expérience."

  exemple:"Reprends les lunettes jaunes : si tout le monde porte les mêmes, « ce mur est plus jaune que celui-là » reste une vérité partagée et vérifiable.",
  retenir:"Pas de critère universel unique, mais plusieurs conditions de la vérité.",
  reperes:["Objectif / subjectif","Universel / général"], diagram:"kant",
  check:{q:"Pour Kant, la connaissance des phénomènes est…", options:[
    {t:"subjective : chacun a la sienne.", fb:"Non : tous les esprits partagent les mêmes formes, donc la connaissance vaut pour tous."},

    {t:"absolue : elle atteint la chose en soi.", fb:"C’est précisément ce que Kant refuse : la chose en soi est inconnaissable."}]}
},
{ id:"platon", titre:"Platon : la caverne et la ligne",
  idee:"La vérité se conquiert en passant de l’opinion à la science.",
  corps:[
    "Dans l’**allégorie de la caverne** (*La République*, livre VII), des prisonniers enchaînés depuis l’enfance prennent les ombres projetées sur le mur pour la réalité. Ils ne savent pas qu’ils sont prisonniers.",
    "Le **monde sensible** (ce que je perçois) produit l’**opinion** (*doxa*) : subjective, changeante. Le **monde intelligible** (ce que je pense par la raison) produit la **science**. Les **Idées** désignent l’**essence** des choses : ce qui est commun à toutes les choses du même type, unique et immuable.",

  exemple:"Celui qui ne s’informe que par des vidéos courtes et sensationnelles regarde des « ombres » choisies par d’autres. Pour Platon, les **sophistes**, maîtres de la rhétorique, jouaient ce rôle : ils manipulaient les foules.",
  retenir:"Opinion (sensible, variable) → science (intelligible, universelle).",
  reperes:["Essentiel / accidentel","Croire / savoir"], diagram:"ligne",
  check:{q:"Pourquoi les prisonniers ne se savent-ils pas prisonniers ?", options:[
    {t:"Ils n’ont jamais rien connu d’autre que les ombres.", ok:true, fb:"On ne peut pas reconnaître une illusion quand on n’a aucun point de comparaison."},
    {t:"Ils préfèrent les ombres en toute connaissance de cause.", fb:"Ce serait une illusion consentie. Or ils ignorent leur situation."},
    {t:"Le soleil les éblouit.", fb:"L’éblouissement vient plus tard, quand l’un d’eux sort de la caverne."}]}
},
{ id:"relativisme", titre:"Relativisme et scepticisme",

  corps:[

    "Le **scepticisme** (Pyrrhon) soutient qu’aucune connaissance n’est certaine : il faut **suspendre son jugement**.",
    "Le relativisme semble attirant : ouverture d’esprit, humilité intellectuelle. Mais il enferme chacun dans son opinion. Sous couvert de tolérance, il refuse la discussion : plus de débat, plus de science, plus de monde commun.",

  exemple:"« La pizza à l’ananas, c’est bon » relève du goût. « Napoléon est mort en 1821 » relève du fait : ce n’est pas une affaire d’opinion.",

  reperes:["Absolu / relatif","Objectif / subjectif"],
  check:{q:"Pourquoi le relativisme absolu se contredit-il ?", options:[
    {t:"Il affirme comme vrai pour tous que rien n’est vrai pour tous.", ok:true, fb:"C’est une autoréfutation : la thèse s’excepte elle-même de ce qu’elle affirme."},
    {t:"Parce que la science a prouvé qu’il était faux.", fb:"La critique est logique, pas expérimentale."},
    {t:"Parce que les goûts ne se discutent pas.", fb:"C’est au contraire le domaine où le relativisme est légitime."}]}
},
{ id:"doute", titre:"Le doute",
  idee:"Douter peut paralyser ou faire avancer : tout dépend de l’usage qu’on en fait.",

{ id:"opinion", titre:"Opinion, unanimité, autonomie",

  corps:[

    "**Sénèque** (*De la vie heureuse*) : la foule est le pire interprète de la vérité ; le sage ne s’y fie pas.",

  exemple:"Toute une classe affirme qu’un élève « l’a bien cherché ». Tout le monde est d’accord. Est-ce vrai, ou chacun suit-il le groupe pour ne pas devenir la cible suivante ?",

{ id:"illusion", titre:"Vérité et illusion",

  corps:[

  exemple:"Einstein n’a pas jeté Newton à la poubelle : pour construire un pont, la physique de Newton suffit toujours. La nouvelle théorie explique mieux et plus loin.",

  reperes:["Exemple / preuve","Vrai / probable / certain"],
  check:{q:"Selon Popper, une théorie est scientifique si…", options:[

{ id:"dire", titre:"Faut-il toujours dire la vérité ?",
  idee:"On passe ici de la vérité (connaître) à la véracité (dire ce que l’on croit vrai).",
  corps:[
    "**Kant** : il ne faut jamais mentir, même à un assassin qui demande où se cache ton ami. Si chacun s’autorisait à mentir « pour de bonnes raisons », plus personne ne pourrait croire personne : le mensonge ne peut pas devenir une règle universelle.",

function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function rich(s){
  if(s===undefined||s===null) return null;
  const parts = String(s).split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|__[^_]+__)/g);
  return parts.map((p,i)=>{
    if(p.startsWith("**")&&p.endsWith("**")&&p.length>4) return html`<strong key=${i}>${p.slice(2,-2)}</strong>`;
    if(p.startsWith("__")&&p.endsWith("__")&&p.length>4) return html`<u key=${i}>${p.slice(2,-2)}</u>`;
    if(p.startsWith("*")&&p.endsWith("*")&&p.length>2) return html`<em key=${i}>${p.slice(1,-1)}</em>`;
    return p;
  });
}

function useDone(id){

/* QCM simple : une question, retour immédiat */
function QCM({q,options,explain,onAnswer}){
  const [sel,setSel] = useState(null);
  const done = sel!==null;
  const letters = "ABCDE";
  return html`<div className="ex">
    <p className="q">${rich(q)}</p>
    <div className="opts">
      ${options.map((o,i)=>{
        let cls = "opt";
        if(done && o.ok) cls += " is-ok";
        else if(done && i===sel) cls += " is-bad";
        return html`<button key=${i} className=${cls} disabled=${done} onClick=${()=>{ setSel(i); onAnswer && onAnswer(!!o.ok); }}>
          <span className="key">${letters[i]}</span><span>${rich(o.t)}</span></button>`;
      })}
    </div>
    ${done && html`<div className=${"verdict fade "+(options[sel].ok?"ok":"bad")}>
      <strong>${options[sel].ok?"Correct. ":"Pas tout à fait. "}</strong>${rich(options[sel].fb||"")}
    </div>`}
    ${done && explain && html`<${Details}>${typeof explain==="string" ? html`<p>${rich(explain)}</p>` : explain}<//>`}
    ${done && html`<div><button className="btn sm" onClick=${()=>setSel(null)}><${Icon} name="refresh" size=${15}/>Réessayer</button></div>`}
  </div>`;
}

/* Série de QCM avec score */
function QCMSet({id,items}){
  const [res,setRes] = useState({});
  const markDone = useDone(id);
  const answered = Object.keys(res).length;
  const good = Object.values(res).filter(Boolean).length;
  useEffect(()=>{ if(answered===items.length) markDone(good,items.length); },[answered]);
  return html`<div className="stack" style=${{gap:"20px"}}>
    ${items.map((it,i)=>html`<div key=${i} className="card card-pad">
      <div className="small muted" style=${{marginBottom:"6px"}}>Question ${i+1} / ${items.length}</div>
      <${QCM} q=${it.q} options=${it.options} explain=${it.explain} onAnswer=${ok=>setRes(r=>({...r,[i]:ok}))}/>
    </div>`)}
    ${answered===items.length && html`<div className="verdict info fade"><span className="score">${good} / ${items.length}</span> bonnes réponses du premier coup.</div>`}
  </div>`;
}

/* Sélection multiple de pastilles */
function Chips({id,items,prompt}){
  const [sel,setSel] = useState({});
  const [checked,setChecked] = useState(false);
  const markDone = useDone(id);
  const nOk = items.filter(x=>x.ok).length;
  const found = items.filter((x,i)=>x.ok&&sel[i]).length;
  const extra = items.filter((x,i)=>!x.ok&&sel[i]).length;
  return html`<div className="ex">
    ${prompt && html`<p className="q">${rich(prompt)}</p>`}
    <div className="chips-pick">
      ${items.map((x,i)=>{
        let cls = "";
        if(checked){ if(x.ok&&sel[i]) cls="is-ok"; else if(!x.ok&&sel[i]) cls="is-bad"; else if(x.ok) cls="is-miss"; }
        return html`<button key=${i} className=${cls} aria-pressed=${!!sel[i]} disabled=${checked} onClick=${()=>setSel(s=>({...s,[i]:!s[i]}))}>${x.t}</button>`;
      })}
    </div>
    <div className="row">
      ${!checked && html`<button className="btn primary" onClick=${()=>{setChecked(true);markDone(Math.max(0,found-extra),nOk);}}><${Icon} name="check" size=${16}/>Vérifier</button>`}
      ${checked && html`<span className="score">${found} / ${nOk} trouvés${extra?` · ${extra} en trop`:""}</span>`}

}

/* Remise en ordre */
function Order({id,items}){
  const init = useMemo(()=>{ let s; do{ s = shuffle(items.map((_,i)=>i)); }while(items.length>1 && s.every((v,i)=>v===i)); return s; },[]);
  const [ord,setOrd] = useState(init);
  const [checked,setChecked] = useState(false);
  const markDone = useDone(id);
  const move = (i,d)=>{ const o = ord.slice(); const j=i+d; if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; setOrd(o); };
  const score = ord.filter((v,i)=>v===i).length;
  return html`<div className="ex">
    <div className="order-list">
      ${ord.map((v,i)=>html`<div key=${v} className=${"order-row"+(checked?(v===i?" is-ok":" is-bad"):"")}>
        <span className="n">${i+1}</span>
        <span style=${{minWidth:0}}>${rich(items[v].t)}</span>
        <span className="row" style=${{gap:"4px",flexWrap:"nowrap"}}>
          <button className="iconbtn" aria-label="Monter" disabled=${checked||i===0} onClick=${()=>move(i,-1)}><${Icon} name="up" size=${16}/></button>
          <button className="iconbtn" aria-label="Descendre" disabled=${checked||i===ord.length-1} onClick=${()=>move(i,1)}><${Icon} name="down" size=${16}/></button>
        </span>
        ${checked && html`<span className="role">${v===i?"✓ ":"✗ À placer en position "+(v+1)+" · "}${items[v].role}</span>`}
      </div>`)}
    </div>
    <div className="row">
      ${!checked && html`<button className="btn primary" onClick=${()=>{setChecked(true);markDone(score,items.length);}}><${Icon} name="check" size=${16}/>Vérifier l’ordre</button>`}
      ${checked && html`<span className="score">${score} / ${items.length} bien placés</span>`}
      ${checked && html`<button className="btn sm" onClick=${()=>{setOrd(init);setChecked(false);}}><${Icon} name="refresh" size=${15}/>Recommencer</button>`}
    </div>
    ${checked && html`<${Details} title="Voir l’ordre correct">
      <ol style=${{margin:0,paddingLeft:"20px",display:"flex",flexDirection:"column",gap:"6px"}}>
        ${items.map((it,i)=>html`<li key=${i}><strong>${it.role}.</strong> ${rich(it.t)}</li>`)}
      </ol><//>`}
  </div>`;
}

  const a = Math.atan2(y2-y1,x2-x1), L=8;
  const p1 = [x2-L*Math.cos(a-0.4), y2-L*Math.sin(a-0.4)], p2=[x2-L*Math.cos(a+0.4), y2-L*Math.sin(a+0.4)];
  return html`<g><line x1=${x1} y1=${y1} x2=${x2} y2=${y2} className=${cls||"d-acc-line"} strokeWidth="1.6"/>
    <polygon points=${`${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`} className="d-head"/></g>`;
}

const CATS = ["Toutes","Définitions","Repères","Auteurs","Citations","Méthode"];
function buildQueue(cat,boxes){
  const list = CARDS.filter(c=>cat==="Toutes"||c.cat===cat);
  const by = [1,2,3].map(n=>shuffle(list.filter(c=>(boxes[c.id]||1)===n)));
  return [...by[0],...by[1],...by[2]].map(c=>c.id);
}
function Flashcards(){
  const {store,setStore} = useStore();
  const boxes = store.cards||{};
  const [cat,setCat] = useState("Toutes");
  const [rev,setRev] = useState(false);
  const [queue,setQueue] = useState(()=>buildQueue("Toutes",boxes));
  const [flip,setFlip] = useState(false);
  const [tally,setTally] = useState({ok:0,ko:0});
  const card = CARDS.find(c=>c.id===queue[0]);
  const restart = (c)=>{ setQueue(buildQueue(c,store.cards||{})); setFlip(false); setTally({ok:0,ko:0}); };
  const answer = (known)=>{
    if(!card) return;
    const cur = boxes[card.id]||1;
    const nb = known ? Math.min(3,cur+1) : 1;
    setStore(s=>({...s,cards:{...(s.cards||{}),[card.id]:nb}}));
    let rest = queue.slice(1);
    if(!known) rest.splice(Math.min(3,rest.length),0,card.id);
    setQueue(rest); setFlip(false);
    setTally(t=>known?{...t,ok:t.ok+1}:{...t,ko:t.ko+1});
  };
  useEffect(()=>{
    const h = e=>{
      if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if(e.key===" "){ e.preventDefault(); setFlip(f=>!f); }
      else if(flip && (e.key==="1"||e.key==="ArrowLeft")) answer(false);
      else if(flip && (e.key==="2"||e.key==="ArrowRight")) answer(true);
    };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  });
  const list = CARDS.filter(c=>cat==="Toutes"||c.cat===cat);
  const count = n=>list.filter(c=>(boxes[c.id]||1)===n).length;
  const front = card ? (rev?card.b:card.f) : "";
  const back = card ? (rev?card.f:card.b) : "";
  return html`<div className="main fade">
    <div className="page-head">
      <h1>Mémoriser</h1>
      <p>Essaie de répondre de tête avant de retourner la carte. Si tu savais, la carte monte d’une boîte et reviendra moins souvent. Sinon, elle retourne en boîte 1 et reviendra dans quelques cartes.</p>
    </div>
    <div className="row" style=${{justifyContent:"space-between"}}>
      <div className="pill-tabs" role="group" aria-label="Catégorie">
        ${CATS.map(c=>html`<button key=${c} aria-pressed=${cat===c} onClick=${()=>{setCat(c);restart(c);}}>${c}</button>`)}
      </div>
      <button className="btn sm" aria-pressed=${rev} onClick=${()=>{setRev(!rev);setFlip(false);}}><${Icon} name="flip" size=${15}/>${rev?"Sens : réponse → question":"Sens : question → réponse"}</button>
    </div>
    <div className="fc-wrap">
      <div className="stack">
        ${card ? html`<div className=${"card fc fade"+(card.q&&!rev?" quote":"")} key=${card.id+(flip?"b":"f")} onClick=${()=>setFlip(!flip)} role="button" tabIndex="0" aria-label="Retourner la carte">
          <div className="row" style=${{justifyContent:"space-between"}}>
            <span className="face-lbl">${card.cat} · boîte ${boxes[card.id]||1}</span>
            <span className="small muted">${queue.length} carte${queue.length>1?"s":""} restante${queue.length>1?"s":""}</span>
          </div>
          <div className="front">${front}</div>
          ${flip ? html`<div className="back">${back}</div>` : html`<div className="hint">Clique sur la carte ou appuie sur <span className="kbd">Espace</span> pour la retourner.</div>`}
        </div>` : html`<div className="card card-pad stack">
          <h3>Série terminée</h3>
          <p className="muted">${tally.ok} carte${tally.ok>1?"s":""} sue${tally.ok>1?"s":""} · ${tally.ko} à revoir. Relance une série demain : c’est l’espacement qui fixe les souvenirs.</p>
          <div><button className="btn primary" onClick=${()=>restart(cat)}><${Icon} name="refresh" size=${16}/>Nouvelle série</button></div>
        </div>`}
        ${card && html`<div className="row">
          <button className="btn" disabled=${!flip} onClick=${()=>answer(false)}><${Icon} name="x" size=${16}/>À revoir <span className="kbd">1</span></button>
          <button className="btn primary" disabled=${!flip} onClick=${()=>answer(true)}><${Icon} name="check" size=${16}/>Je savais <span className="kbd">2</span></button>
        </div>`}
      </div>
      <aside className="card card-pad boxes">
        <div className="sec-title">Tes boîtes · ${cat}</div>
        ${[[1,"Boîte 1 · à revoir","b1"],[2,"Boîte 2 · en cours","b2"],[3,"Boîte 3 · acquis","b3"]].map(([n,l,c])=>html`<div key=${n} className="boxline">
          <span>${l}</span>
          <div className="progress"><span className=${c} style=${{width:(list.length?Math.round(count(n)/list.length*100):0)+"%"}}></span></div>
          <span className="score" style=${{textAlign:"right"}}>${count(n)}</span>
        </div>`)}
        <p className="small muted">Session : ${tally.ok} sues · ${tally.ko} à revoir.</p>
        <button className="btn sm" onClick=${()=>{ setStore(s=>{ const cs={...(s.cards||{})}; list.forEach(c=>delete cs[c.id]); return {...s,cards:cs}; }); setTimeout(()=>restart(cat),0); }}>Remettre ces cartes en boîte 1</button>
      </aside>
    </div>
  </div>`;
}

function parseLine(line, li){
  const out=[]; const re=/\{\{([^|}]+)\|([^}]+)\}\}/g; let last=0, m, n=0;
  const plain = s => s.split(/(\s+)/).forEach(w=>{ if(!w) return; if(/^\s+$/.test(w)) out.push({sp:w}); else out.push({id:"w"+li+"_"+(n++), text:w, plain:true}); });
  while((m=re.exec(line))){ if(m.index>last) plain(line.slice(last,m.index)); out.push({id:m[1],text:m[2]}); last=re.lastIndex; }
  if(last<line.length) plain(line.slice(last));
  return out;
}

function TextPanel({mode,hl,quad,setQuad,showSol,onHide,focus,onFocus}){

  const [wrap,setWrap] = useState(false);
  /* Ajustement automatique : chaque ligne numérotée doit tenir dans la largeur du panneau */
  useLayoutEffect(()=>{
    if(!auto) return;
    const el = box.current; if(!el) return;
    const fit = (force)=>{
      const w = el.clientWidth;
      if(!force && w===lastW.current) return;
      lastW.current = w;
      const prevFs = el.style.fontSize, hadWrap = el.classList.contains("wrap");
      el.style.fontSize = "16px"; el.classList.remove("wrap");
      const txs = el.querySelectorAll(".tx");
      let need = 0; const avail = txs.length ? txs[0].clientWidth : 0;
      txs.forEach(t=>{ need = Math.max(need, t.scrollWidth); });
      el.style.fontSize = prevFs; if(hadWrap) el.classList.add("wrap");
      if(!avail || !need) return;
      const f = Math.min(17, 16*avail/need*0.97);
      if(f < 12.5){ setWrap(true); setFs(14); } else { setWrap(false); setFs(Math.floor(f*4)/4); }
    };
    fit(true);
    if(typeof ResizeObserver==="undefined") return;
    const ro = new ResizeObserver(()=>fit(false)); ro.observe(el);
    return ()=>ro.disconnect();
  },[auto]);
  const bump = d=>{ setAuto(false); setWrap(false); setFs(f=>Math.max(11,Math.min(22,Math.round(f)+d))); };
  const clickTok = (tok)=>{
    if(mode!=="quad"||quad.checked) return;
    setQuad(q=>{ const a={...q.assign}; if(a[tok.id]===q.cat) delete a[tok.id]; else a[tok.id]=q.cat; return {...q,assign:a}; });
  };
  const clsFor = (tok)=>{
    if(mode==="conn") return (!tok.plain && tok.id[0]==="c") ? "tok cC" : "";
    if(mode!=="quad") return "";
    if(showSol){
      const t = QUAD[tok.id]; if(!t) return quad.assign[tok.id]?"tok":"tok";
      let c = "tok c"+t.cats[0];

  };

        <button className="btn sm" aria-pressed=${auto} onClick=${()=>{ lastW.current=0; setAuto(true); }} title="Adapter la taille pour que chaque ligne tienne en entier">Ajuster</button>
        ${onFocus && html`<button className="btn sm wide-only" aria-pressed=${!!focus} onClick=${onFocus} title="Masquer ou afficher le menu de gauche">${focus?"Afficher le menu":"Masquer le menu"}</button>`}
        ${onHide && html`<button className="btn ghost sm collapse-btn" onClick=${onHide}>Masquer</button>`}
      </span>
    </div>
    <div className=${"ttext"+(wrap?" wrap":"")} ref=${box} style=${{fontSize:fs+"px"}}>
      ${TQ_TOK.map((toks,li)=>{
        const n = li+1;
        const cls = "tline"+(TQ_PARA.includes(n)?" para":"")+(hl&&hl.length?(hlSet.has(n)?" hl":" dim"):"");
        return html`<div key=${li} className=${cls}><span className="ln">${n}</span><span className="tx">
          ${toks.map((t,j)=>{
            if(t.sp) return t.sp;
            const c = clsFor(t);
            if(mode==="quad") return html`<span key=${j} className=${c} role="button" tabIndex=${quad.checked?-1:0} onClick=${()=>clickTok(t)} onKeyDown=${e=>{if(e.key==="Enter"){e.preventDefault();clickTok(t);}}}>${t.text}</span>`;
            return c ? html`<span key=${j} className=${c}>${t.text}</span>` : t.text;
          })}
        </span></div>`;
      })}
    </div>
    <div className="source">Alexis de Tocqueville, <u>De la démocratie en Amérique</u>, II, 1840.</div>
  </div>`;
}

/* --- Étape 1c : quadrillage --- */
function Quadrillage({quad,setQuad,showSol,setShowSol}){
  const markDone = useDone("e1c");
  const core = Object.entries(QUAD).filter(([k,v])=>v.core);
  const stat = k => { const list = core.filter(([id,v])=>v.cats[0]===k); return {f:list.filter(([id,v])=>v.cats.includes(quad.assign[id])).length, n:list.length}; };
  const plainAssigned = Object.entries(quad.assign).filter(([id])=>!QUAD[id]);
  const wrongCat = Object.entries(quad.assign).filter(([id,c])=>QUAD[id] && !QUAD[id].cats.includes(c) && c!=="D");
  const usedE = Object.values(quad.assign).includes("E");
  const myD = Object.entries(quad.assign).filter(([id,c])=>c==="D").map(([id])=>{ for(const toks of TQ_TOK){ const t = toks.find(x=>x.id===id); if(t) return t.text; } return id; });
  const check = ()=>{ setQuad(q=>({...q,checked:true})); const s=["C","K","R"].map(stat); markDone(s.reduce((a,x)=>a+x.f,0), s.reduce((a,x)=>a+x.n,0)); };
  return html`<div className="ex">
    <p className="consigne"><b>Deuxième lecture.</b> Choisis une couleur, puis clique sur les mots du texte pour les marquer. Clique à nouveau pour effacer. Un groupe de mots (« c’est-à-dire », « croyances dogmatiques ») se marque en entier.</p>
    <div className="pal" role="group" aria-label="Code couleur">
      ${QCATS.map(c=>html`<button key=${c.k} aria-pressed=${quad.cat===c.k} disabled=${quad.checked} onClick=${()=>setQuad(q=>({...q,cat:c.k}))}>
        <i className="sw" style=${{background:`var(--c-${c.k}-soft)`,boxShadow:`inset 0 -3px 0 var(--c-${c.k})`}}></i>${c.label}</button>`)}
    </div>
    <div className="row">
      ${!quad.checked && html`<button className="btn primary" onClick=${check}><${Icon} name="check" size=${16}/>Comparer avec le corrigé</button>`}
      ${!quad.checked && html`<span className="small muted">${Object.keys(quad.assign).length} marquage(s)</span>`}
      ${quad.checked && html`<button className="btn sm" aria-pressed=${showSol} onClick=${()=>setShowSol(!showSol)}><${Icon} name="eye" size=${15}/>${showSol?"Revoir mon quadrillage":"Afficher le corrigé sur le texte"}</button>`}
      ${quad.checked && html`<button className="btn sm" onClick=${()=>{setQuad({assign:{},cat:"C",checked:false});setShowSol(false);}}><${Icon} name="refresh" size=${15}/>Recommencer</button>`}
    </div>
    ${quad.checked && html`<div className="stack fade">
      <div className="items">
        ${[["C","Connecteurs logiques"],["K","Concepts importants"],["R","Repères"]].map(([k,l])=>{ const s=stat(k); return html`<div key=${k} className=${"item "+(s.f/s.n>=0.6?"is-ok":"is-bad")}>
          <span><strong>${l}</strong> · essentiels trouvés</span><span className="score">${s.f} / ${s.n}</span></div>`; })}
      </div>
      <div className="verdict info"><strong>Exemples :</strong> ${usedE?"tu as marqué un exemple, mais ":""}le texte n’en contient <strong>aucun</strong>. C’est une information importante : ta méthode dit que, dans ce cas, tu dois en introduire toi-même pour rendre le propos concret (étape 3).</div>
      ${wrongCat.length>0 && html`<div className="verdict bad"><strong>À reclasser :</strong> ${wrongCat.map(([id,c])=>QUAD[id].lab+" → "+(QCATS.find(x=>x.k===QUAD[id].cats[0])||{}).label.toLowerCase()).join(" ; ")}.</div>`}
      ${plainAssigned.length>0 && html`<p className="small muted">${plainAssigned.length} autre(s) mot(s) marqué(s) hors du corrigé : ce n’est pas une faute, mais demande-toi s’ils servent vraiment l’analyse.</p>`}
      <p className="small muted">Sur le corrigé, les pointillés verts signalent les éléments essentiels que tu n’as pas marqués.</p>
      <${Details}>
        <h4>Connecteurs logiques</h4>
        ${Object.entries(QUAD).filter(([k,v])=>v.cats[0]==="C").map(([k,v])=>html`<p key=${k}><strong>${v.lab}${v.core?"":" (facultatif)"}.</strong> ${rich(v.why)}</p>`)}
        <h4>Concepts importants</h4>
        ${Object.entries(QUAD).filter(([k,v])=>v.cats[0]==="K").map(([k,v])=>html`<p key=${k}><strong>${v.lab}${v.core?"":" (facultatif)"}.</strong> ${rich(v.why)}</p>`)}
        <h4>Repères philosophiques</h4>
        ${Object.entries(QUAD).filter(([k,v])=>v.cats[0]==="R").map(([k,v])=>html`<p key=${k}><strong>${v.lab}.</strong> ${rich(v.why)}</p>`)}
        <h4>Termes difficiles</h4>
        <p>Cette catégorie dépend de chacun : elle n’est pas notée. ${myD.length?`Tu as marqué : ${myD.join(", ")}.`:"Tu n’en as marqué aucun."} Voici ceux qui posent souvent problème :</p>
        ${Object.entries(QUAD).filter(([k,v])=>v.cats[0]==="D").map(([k,v])=>html`<p key=${k}><strong>${v.lab}.</strong> ${rich(v.why)}</p>`)}
      <//>
    </div>`}
  </div>`;
}

const MODEL_INTRO = html`<span className="tag">Corrigé possible</span>
  <p>Qui a vérifié par lui-même que la Terre tourne autour du Soleil, que les microbes existent ou que le médicament prescrit par son médecin est efficace ? Presque personne, et pourtant nous tenons ces affirmations pour vraies. Dans cet extrait de <u>De la démocratie en Amérique</u> (1840), Alexis de Tocqueville s’interroge sur les opinions que nous acceptons de confiance : le texte porte sur la vérité et sur le rapport entre croire et savoir.</p>
  <p>Un dilemme apparaît alors. D’un côté, penser librement semble exiger que chacun examine tout par lui-même, sans rien admettre sur la parole d’autrui. De l’autre, aucun homme ne peut tout vérifier, et une société a besoin d’idées partagées. Faut-il choisir entre une liberté de pensée impossible et une dépendance qui semble asservir l’esprit ?</p>
  <p>Tocqueville répond que les opinions acceptées de confiance, sans examen, sont à la fois inévitables et nécessaires. Elles rendent possible la vie commune, et elles permettent à chaque individu, limité par le temps et par les capacités de son esprit, de concentrer son examen sur quelques questions. Cette dépendance est donc une soumission, mais une soumission bénéfique, qui sert la liberté au lieu de la détruire.</p>

  const goStep = i=>{ setCur(i); setTextOpen(true); if(top.current) top.current.scrollIntoView({block:"start"}); };
  const firstOf = n => TQ_STEPS.findIndex(s=>s.et===n);
  const stepsOf = TQ_STEPS.map((s,i)=>({...s,i})).filter(s=>s.et===step.et);
  return html`<div className="main fade" ref=${top}>
    <div className="page-head">
      <h1>Expliquer un texte : Tocqueville</h1>
      <p>Un entraînement pas à pas, organisé selon les cinq étapes au brouillon et la grille de ton professeur. Le texte reste affiché à côté de chaque exercice.</p>
    </div>
    <div className="etapes">
      <div className="etape-bar" role="group" aria-label="Étapes">
        ${ETAPES.map(e=>html`<button key=${e.n} aria-pressed=${e.n===step.et} onClick=${()=>goStep(firstOf(e.n))}><small>Étape ${e.n}</small><span>${e.t}</span></button>`)}
      </div>
      <div className="substeps">
        ${stepsOf.map(s=>html`<button key=${s.id} aria-current=${s.i===cur} onClick=${()=>goStep(s.i)}><span className=${"dot"+((store.done||{})[s.id]||(store.tq||{})[s.id]?" on":"")}></span>${s.t}</button>`)}
      </div>
    </div>
    <div className=${"tq-layout"+(textOpen?"":" closed")} ref=${layoutRef} style=${{"--a":split+"fr","--b":(100-split)+"fr"}}>
      ${textOpen ? html`<${TextPanel} mode=${step.mode||"plain"} hl=${step.hl} quad=${quad} setQuad=${setQuad} showSol=${showSol && step.mode==="quad"} onHide=${()=>setTextOpen(false)}
          focus=${focus} onFocus=${()=>setStore(s=>({...s,ui:{...(s.ui||{}),focus:!focus}}))}/>`
        : html`<div><button className="btn" onClick=${()=>setTextOpen(true)}><${Icon} name="text" size=${16}/>Afficher le texte</button></div>`}
      ${textOpen && html`<div className="splitter" role="separator" aria-orientation="vertical" aria-label="Largeur du texte" aria-valuenow=${split} aria-valuemin="30" aria-valuemax="78" tabIndex="0"
          title="Faire glisser pour élargir le texte ou l’exercice" onPointerDown=${onDrag} onKeyDown=${onKeySplit} onDoubleClick=${()=>{setSplit(56);saveSplit(56);}}></div>`}
      <section className="card card-pad stack fade" key=${step.id} style=${{gap:"16px"}}>
        <div>
          <div className="small muted">Étape ${et.n} · ${et.t} · ${cur+1} / ${TQ_STEPS.length}</div>
          <h2 style=${{fontSize:"20px",marginTop:"2px"}}>${step.t}</h2>
        </div>
        <${Step} id=${step.id} quad=${quad} setQuad=${setQuad} showSol=${showSol} setShowSol=${setShowSol}/>
        <div className="navbar">
          <button className="btn" disabled=${cur===0} onClick=${()=>goStep(cur-1)}><${Icon} name="left" size=${16}/>Précédent</button>
          <button className="btn primary" disabled=${cur===TQ_STEPS.length-1} onClick=${()=>goStep(cur+1)}>Suivant<${Icon} name="right" size=${16}/></button>
        </div>
      </section>
    </div>
  </div>`;
}

/* ============ APPLICATION ============ */
const PAGES = [
 {id:"accueil",t:"Accueil",ic:"home"},
 {id:"comprendre",t:"Comprendre",ic:"book"},
 {id:"cartes",t:"Mémoriser",ic:"cards"},
 {id:"exercices",t:"S’entraîner",ic:"pencil"},
 {id:"texte",t:"Expliquer un texte",ic:"text"}
];
function App(){
  const [store,setStoreRaw] = useState(loadStore);
  const setStore = f => setStoreRaw(s=>{ const n = typeof f==="function"?f(s):f; saveStore(n); return n; });
  const readHash = ()=>{ const h = (location.hash||"").replace("#",""); return PAGES.some(p=>p.id===h)?h:"accueil"; };
  const [page,setPage] = useState(readHash);
  const [fiche,setFiche] = useState(null);
  useEffect(()=>{ const h=()=>setPage(readHash()); window.addEventListener("hashchange",h); return ()=>window.removeEventListener("hashchange",h); },[]);
  const go = (p,f)=>{ if(f) setFiche(f); setPage(p); try{ history.replaceState(null,"","#"+p); }catch(e){ location.hash=p; } window.scrollTo(0,0); };
  const boxes = store.cards||{};
  const nb = {
    comprendre: FICHES.filter(f=>(store.seen||{})[f.id]).length+"/"+FICHES.length,
    cartes: CARDS.filter(c=>boxes[c.id]===3).length+"/"+CARDS.length,
    exercices: EX_IDS.filter(id=>(store.done||{})[id]).length+"/"+EX_IDS.length,
    texte: TQ_STEPS.filter(s=>(store.tq||{})[s.id]).length+"/"+TQ_STEPS.length
  };
  const cur = PAGES.find(p=>p.id===page);
  return html`<${Store.Provider} value=${{store,setStore}}>
    <header className="top"><div className="top-in">
      <span className="app-ico"><${Icon} name="book" size=${16}/></span>
      <span className="app-name">La vérité</span><span className="app-sub">Philosophie · Terminale</span>
      <span className="spacer"></span>
      <span className="crumb">${cur.t}</span>
    </div></header>
    <div className=${"shell"+(page==="texte"&&store.ui&&store.ui.focus?" focus":"")}>
      <nav className="side" aria-label="Sections">
        <span className="group-label">Parcours</span>
        ${PAGES.map(p=>html`<button key=${p.id} className="nav" aria-current=${page===p.id?"page":undefined} onClick=${()=>go(p.id)}>
          <${Icon} name=${p.ic}/><span>${p.t}</span>${nb[p.id] && html`<span className="nb">${nb[p.id]}</span>`}</button>`)}
      </nav>
      ${page==="accueil" && html`<${Home} go=${go}/>`}
      ${page==="comprendre" && html`<${Comprendre} initial=${fiche}/>`}
      ${page==="cartes" && html`<${Flashcards}/>`}
      ${page==="exercices" && html`<${Exercices}/>`}
      ${page==="texte" && html`<${Texte}/>`}
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body></html>
