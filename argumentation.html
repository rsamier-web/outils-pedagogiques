<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atelier d’argumentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fenêtre façon KDE Plasma (Breeze) — barre d'en-tête, barre latérale des pages, une seule vue de contenu ; une tâche à la fois à l'écran */
:root{
  --window:#eff0f1; --view:#fcfcfc; --alt:#f5f6f7; --text:#232629; --muted:#5d6873;
  --line:#d4d7da; --line-strong:#b8bbbe; --btn:#fcfcfc; --btn-hover:#ffffff;
  --accent:#3daee9; --accent-text:#1d6fa5; --accent-tint:rgba(61,174,233,.13); --accent-tint-strong:rgba(61,174,233,.26);
  --pos:#1e8049; --pos-tint:rgba(39,174,96,.12); --neg:#b8323f; --neg-tint:rgba(218,68,83,.11); --neu:#a35200;
  --c-these:#1d6fa5; --c-arg:#1e8049; --c-expl:#7a3b99; --c-ex:#a35200; --c-conn:#0d7766; --c-hs:#6b737b; --c-concl:#3d5266; --c-intro:#3d5266;
  --shadow:0 1px 2px rgba(35,38,41,.12);
  --scrim:rgba(35,38,41,.35);
  --f-ui:"Noto Sans","Segoe UI",Cantarell,Ubuntu,system-ui,sans-serif;
  --base:16px; --lh:1.55; --ls:0em; --ws:0em;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --window:#2a2e32; --view:#1b1e20; --alt:#232629; --text:#fcfcfc; --muted:#a3abb3;
    --line:#3a3f44; --line-strong:#50565c; --btn:#31363b; --btn-hover:#383d42;
    --accent-text:#5cc3f2; --accent-tint:rgba(61,174,233,.17); --accent-tint-strong:rgba(61,174,233,.32);
    --pos:#4ccf7e; --pos-tint:rgba(39,174,96,.2); --neg:#f06b78; --neg-tint:rgba(218,68,83,.2); --neu:#f8a14c;
    --c-these:#5cc3f2; --c-arg:#4ccf7e; --c-expl:#c792e0; --c-ex:#f8a14c; --c-conn:#3fd0b3; --c-hs:#9aa3ab; --c-concl:#aab9c8; --c-intro:#aab9c8;
    --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --window:#2a2e32; --view:#1b1e20; --alt:#232629; --text:#fcfcfc; --muted:#a3abb3;
  --line:#3a3f44; --line-strong:#50565c; --btn:#31363b; --btn-hover:#383d42;
  --accent-text:#5cc3f2; --accent-tint:rgba(61,174,233,.17); --accent-tint-strong:rgba(61,174,233,.32);
  --pos:#4ccf7e; --pos-tint:rgba(39,174,96,.2); --neg:#f06b78; --neg-tint:rgba(218,68,83,.2); --neu:#f8a14c;
  --c-these:#5cc3f2; --c-arg:#4ccf7e; --c-expl:#c792e0; --c-ex:#f8a14c; --c-conn:#3fd0b3; --c-hs:#9aa3ab; --c-concl:#aab9c8; --c-intro:#aab9c8;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;font-size:var(--base)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--window);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.6rem;font-weight:600}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Fenêtre */
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.header{display:flex;align-items:center;gap:.5rem;padding-block:.35rem;padding-inline:1rem;background:var(--window);border-bottom:1px solid var(--line);min-height:3rem;position:relative}
.header .app-name{font-size:.82rem;color:var(--muted);white-space:nowrap}
.header .page-name{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.header .sep{width:1px;height:1.2rem;background:var(--line)}
.header .spacer{flex:1}
.menu-btn{display:none}
.main{display:grid;grid-template-columns:15.5rem minmax(0,1fr);min-height:0}
.sidebar{background:var(--window);border-right:1px solid var(--line);overflow-y:auto;padding:.6rem .5rem;display:flex;flex-direction:column;gap:2px}
.side-label{font-size:.75rem;font-weight:600;color:var(--muted);padding:.75rem .65rem .3rem;letter-spacing:.03em}
.side-label:first-child{padding-top:.25rem}
.nav-item{display:flex;align-items:center;gap:.65rem;width:100%;padding:.45rem .6rem;border-radius:4px;border:1px solid transparent;background:none;color:var(--text);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;letter-spacing:0;word-spacing:0}
.nav-item:hover{background:var(--accent-tint)}
.nav-item.active{background:var(--accent-tint-strong);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .num{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;width:1rem;text-align:right}
.nav-item .st{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .st.done{color:var(--pos)}
.content{background:var(--view);overflow-y:auto;min-width:0}
.page{max-width:47rem;margin:0 auto;padding-block:1.5rem 3rem;padding-inline:1.25rem;display:flex;flex-direction:column;gap:1.25rem}
.lead{color:var(--muted);max-width:62ch}
.scrim{display:none}
@media (max-width:780px){
  .menu-btn{display:inline-flex}
  .header .app-name,.header .sep{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(18rem,86vw);z-index:30;transform:translateX(-102%);transition:transform .18s ease;box-shadow:0 0 18px rgba(0,0,0,.25);padding-top:calc(.75rem + env(safe-area-inset-top,0px));padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:25}
  .page{padding-block:1.1rem 2.5rem;padding-inline:1rem}
}

/* Contrôles Breeze */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font:inherit;font-size:.95rem;letter-spacing:0;word-spacing:0;color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.4rem .9rem;min-height:2.25rem;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent);background:var(--btn-hover)}
.btn:active{background:var(--accent-tint-strong)}
.btn:disabled{opacity:.5;cursor:default;border-color:var(--line-strong);background:var(--btn)}
.btn-primary{border-color:var(--accent);background:var(--accent-tint)}
.btn-primary:hover{background:var(--accent-tint-strong)}
.btn-flat{background:transparent;border-color:transparent;box-shadow:none}
.btn-flat:hover{background:var(--accent-tint);border-color:transparent}
.btn-sm{font-size:.85rem;padding:.2rem .55rem;min-height:1.9rem}
.btn-icon{padding:.35rem;min-width:2.25rem}
.btn.on{background:var(--accent-tint-strong);border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.actions .spacer{flex:1}

.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;font:inherit;font-size:.93rem;letter-spacing:0;word-spacing:0;padding:.55rem 1rem;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:.4rem;align-items:center}
.tab:hover{color:var(--text);background:var(--accent-tint)}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .ok{color:var(--pos)}

.frame{border:1px solid var(--line);border-radius:5px;background:var(--alt);padding:1rem 1.1rem}
.card{border:1px solid var(--line);border-radius:5px;background:var(--view);padding:1.1rem 1.2rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.9rem}
.eyebrow{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.msg{display:flex;gap:.6rem;align-items:flex-start;border:1px solid;border-radius:5px;padding:.7rem .9rem}
.msg svg{flex:none;margin-top:.15rem}
.msg-pos{border-color:color-mix(in srgb,var(--pos) 60%,transparent);background:var(--pos-tint)}
.msg-pos svg{color:var(--pos)}
.msg-neg{border-color:color-mix(in srgb,var(--neg) 60%,transparent);background:var(--neg-tint)}
.msg-neg svg{color:var(--neg)}
.msg-info{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-tint)}
.msg-info svg{color:var(--accent-text)}
.msg .body{display:flex;flex-direction:column;gap:.35rem;min-width:0}

.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Rôles (signalisation) */
.k-these{--c:var(--c-these)} .k-arg{--c:var(--c-arg)} .k-expl{--c:var(--c-expl)} .k-ex{--c:var(--c-ex)}
.k-conn{--c:var(--c-conn)} .k-hs{--c:var(--c-hs)} .k-concl{--c:var(--c-concl)} .k-intro{--c:var(--c-intro)}
.chip{display:inline-flex;align-items:center;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;word-spacing:0;padding:.08rem .45rem;border-radius:3px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap;line-height:1.5}
.seg{color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-radius:3px;padding:.04em .18em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg.k-conn{background:none;font-weight:700;padding:0}
.seg.k-blank{display:inline-block;min-width:5.5rem;border-bottom:2px dashed var(--accent);color:var(--accent-text);background:none;text-align:center;font-weight:600}
.nocolor .seg:not(.k-blank){color:inherit;background:none}
.nocolor .chip{color:var(--text);background:transparent;border-color:var(--line-strong)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem}

.para{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.para p{font-size:1.06rem;line-height:calc(var(--lh) + .2)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:.6rem;align-items:baseline}
.row .chip{justify-self:start}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr);gap:.2rem}}
.keys{display:flex;flex-wrap:wrap;gap:.4rem}
.key{border:1px solid var(--line-strong);border-radius:3px;padding:.1rem .55rem;background:var(--view);font-weight:600;font-size:.95rem}

.choices{display:flex;flex-direction:column;gap:.5rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.7rem .9rem;cursor:pointer;box-shadow:var(--shadow)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice .mark{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--muted);margin-top:.1rem}
.choice.ok{border-color:var(--pos);background:var(--pos-tint)}
.choice.ok .mark{border-color:var(--pos);color:var(--pos)}
.choice.no{border-color:var(--neg);background:var(--neg-tint)}
.choice.no .mark{border-color:var(--neg);color:var(--neg)}
.choice.dim{opacity:.55}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
@media (max-width:520px){.trio{grid-template-columns:minmax(0,1fr)}}
.trio .btn{min-height:3rem;font-weight:600;flex-direction:column;gap:.1rem}
.btn.res-ok,.btn.res-ok:disabled{border-color:var(--pos);background:var(--pos-tint);opacity:1}
.btn.res-no,.btn.res-no:disabled{border-color:var(--neg);background:var(--neg-tint);opacity:1}
.trio .btn small{font-weight:400;font-size:.78rem;color:var(--muted)}

/* Accueil */
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--view)}
.path li+li{border-top:1px solid var(--line)}
.path button{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.8rem;align-items:center;width:100%;padding:.8rem 1rem;background:none;border:none;font:inherit;color:var(--text);text-align:left;cursor:pointer;letter-spacing:0;word-spacing:0}
.path button:hover{background:var(--accent-tint)}
.path .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.path .n.done{border-color:var(--pos);color:var(--pos);background:var(--pos-tint)}
.path .t{font-weight:600}
.path .d{font-size:.88rem;color:var(--muted)}
.status{font-size:.78rem;padding:.1rem .5rem;border-radius:10px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.status.done{border-color:var(--pos);color:var(--pos)}
.status.started{border-color:var(--accent);color:var(--accent-text)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:640px){.tips{grid-template-columns:minmax(0,1fr)}}
.tip{display:flex;flex-direction:column;gap:.35rem}
.tip svg{color:var(--accent-text)}
.tip p{font-size:.92rem;color:var(--muted)}

/* Vocabulaire */
.word{display:flex;flex-direction:column;gap:.3rem;align-items:flex-start}
.word .w{font-size:2rem;font-weight:600;line-height:1.2}
.word .syl{font-size:1.15rem;letter-spacing:.06em;color:var(--accent-text);font-weight:500}
.word .nat{font-size:.85rem;color:var(--muted);font-style:italic}
.def{font-size:1.1rem}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem .9rem;margin:0}
.dl dt{font-size:.8rem;font-weight:600;color:var(--muted);padding-top:.15rem}
.dl dd{margin:0}
@media (max-width:520px){.dl{grid-template-columns:minmax(0,1fr)} .dl dd{margin-bottom:.4rem}}

/* Exemples résolus */
.subject{display:flex;flex-direction:column;gap:.35rem}
.subject .q{font-size:1.2rem;font-weight:600}
.stepper{display:flex;gap:.3rem;flex-wrap:wrap}
.stepper button{display:flex;align-items:center;gap:.4rem;font:inherit;font-size:.82rem;letter-spacing:0;word-spacing:0;background:none;border:1px solid transparent;border-radius:14px;padding:.15rem .6rem .15rem .2rem;color:var(--muted);cursor:pointer}
.stepper button:disabled{cursor:default}
.stepper .dot{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-weight:600;font-variant-numeric:tabular-nums}
.stepper .cur{color:var(--text);border-color:var(--accent);background:var(--accent-tint)}
.stepper .cur .dot{border-color:var(--accent);background:var(--accent);color:#fff}
.stepper .past .dot{border-color:var(--pos);color:var(--pos)}
.stepper .ttl{display:inline}
@media (max-width:640px){.stepper .ttl{display:none} .stepper .cur .ttl{display:inline}}
.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;color:var(--muted)}
.done-list li{display:flex;gap:.5rem;align-items:baseline}
.done-list svg{color:var(--pos);flex:none;position:relative;top:.2rem}
.badge{font-size:.72rem;font-weight:600;padding:.05rem .5rem;border-radius:3px;border:1px solid var(--accent);color:var(--accent-text);background:var(--accent-tint);white-space:nowrap}
.why{border-top:1px dashed var(--line-strong);padding-top:.75rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.why p{color:var(--muted)}

/* Relier */
.kernels{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.6rem;align-items:center}
.kernel{border:1px solid var(--line);background:var(--alt);border-radius:4px;padding:.7rem .85rem;font-size:1.05rem}
.plus{color:var(--muted);font-weight:600}
@media (max-width:560px){.kernels{grid-template-columns:minmax(0,1fr)} .plus{justify-self:center}}
details.box{border:1px solid var(--line);border-radius:5px;background:var(--alt)}
details.box summary{cursor:pointer;padding:.6rem .9rem;font-weight:600;font-size:.93rem}
details.box .inner{padding:0 .9rem .9rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1.2rem}
@media (max-width:560px){details.box .inner{grid-template-columns:minmax(0,1fr)}}
.cgroup h3{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:.15rem}
.cgroup p{font-size:.95rem}

/* Ordonner */
.zone{display:flex;flex-direction:column;gap:.45rem;min-height:3rem}
.zone-label{font-size:.8rem;font-weight:600;color:var(--muted)}
.slot{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--text);background:var(--btn);border:1px solid var(--line-strong);border-radius:4px;padding:.6rem .8rem;cursor:pointer;box-shadow:var(--shadow)}
.slot:hover{border-color:var(--accent)}
.slot .pos{flex:none;width:1.5rem;height:1.5rem;border-radius:3px;background:var(--accent-tint-strong);color:var(--accent-text);display:grid;place-items:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.1rem}
.slot.ok{border-color:var(--pos);background:var(--pos-tint)}
.slot.ok .pos{background:var(--pos);color:var(--view)}
.slot.no{border-color:var(--neg);background:var(--neg-tint)}
.slot.no .pos{background:var(--neg);color:var(--view)}
.slot .tx{min-width:0}
.empty{border:1px dashed var(--line-strong);border-radius:4px;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
.hl{font-weight:700;color:var(--c-conn);background:color-mix(in srgb,var(--c-conn) 14%,transparent);border-radius:3px;padding:0 .15em}

/* Plan */
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.88rem;font-weight:600;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.field .hint{font-weight:400;color:var(--muted);font-size:.82rem}
textarea,select,input[type=text]{font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line-strong);border-radius:4px;padding:.5rem .65rem;width:100%;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws)}
textarea{resize:vertical;min-height:4.2rem}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.group{display:flex;flex-direction:column;gap:.75rem;border-left:3px solid var(--c);padding-left:.9rem}
.assembled{display:flex;flex-direction:column;gap:.8rem;font-size:1.04rem}
.checks{display:flex;flex-direction:column;gap:.35rem}
.checks label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
.checks input{width:1.1rem;height:1.1rem;margin-top:.2rem;accent-color:var(--accent);flex:none}

/* Réglages */
.pop{position:absolute;right:.75rem;top:calc(100% + 4px);z-index:40;width:min(19rem,calc(100vw - 1.5rem));background:var(--view);border:1px solid var(--line-strong);border-radius:5px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:.9rem;display:flex;flex-direction:column;gap:.85rem}
.pop .lbl{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}
.seg-ctl{display:flex}
.seg-ctl .btn{border-radius:0;flex:1;box-shadow:none}
.seg-ctl .btn:first-child{border-radius:4px 0 0 4px}
.seg-ctl .btn:last-child{border-radius:0 4px 4px 0}

function statusOf(id, p) {
  p = p || {};
  if (id === 'vocab') { const v = p.vocab || {}; const n = (v.learn ? 1 : 0) + (v.quiz != null ? 1 : 0); return { n, max: 2 }; }
  if (id === 'ex') { const e = p.ex || {}; return { n: WE.filter(w => e[w.id]).length, max: 3 }; }
  if (id === 'sort') { const s = p.sort || {}; return { n: SORT.filter(x => s[x.id] != null).length, max: 3 }; }
  if (id === 'link') return { n: p.link != null ? 1 : 0, max: 1 };
  if (id === 'order') { const o = p.order || {}; return { n: ORDER.filter(x => o[x.id]).length, max: 3 }; }
  if (id === 'plan') return { n: p.plan ? 1 : 0, max: 1 };
  return { n: 0, max: 1 };
}
function StatusPill({ id }) {
  const { store } = useApp();
  const s = statusOf(id, store.prog);
  if (s.n >= s.max) return html`<span className="status done">Terminé</span>`;
  if (s.n > 0) return html`<span className="status started">${s.n} / ${s.max}</span>`;
  return html`<span className="status">À faire</span>`;
}

function VocabLearn() {
  const { setProg } = useApp();
  const [queue, setQueue] = useState(() => VOCAB.map((_, i) => i));
  const [shown, setShown] = useState(false);
  const [known, setKnown] = useState(0);
  const total = VOCAB.length;
  if (!queue.length) {
    return html`<div className="card"><${Msg} kind="pos" title="Tu as vu tous les mots.">Passe à « S’entraîner » pour vérifier ce que tu as retenu. Reviens ici dans quelques jours : revoir les mots plus tard aide à les garder.</${Msg}>
      <div className="actions"><button className="btn" onClick=${() => { setQueue(VOCAB.map((_, i) => i)); setKnown(0); setShown(false); }}><${Icon} n="reset" s=${16} />Recommencer</button></div></div>`;
  }
  const w = VOCAB[queue[0]];
  const rate = ok => {
    const rest = queue.slice(1);
    const nq = ok ? rest : rest.concat(queue[0]);
    if (ok) setKnown(known + 1);
    setQueue(nq); setShown(false);
    if (!nq.length) setProg('vocab', { learn: true });
  };
  return html`<div style=${{ display: 'flex', flexDirection: 'column', gap: '.75rem' }}>
    <div className="actions"><span className="count">${known} / ${total} mots sus</span></div>
    <${Progress} value=${known} max=${total} />

        <${Msg} kind="info">Dis à voix haute ce que ce mot veut dire. Ensuite, regarde la définition.</${Msg}>
        <div className="actions"><button className="btn btn-primary" onClick=${() => setShown(true)}>Voir la définition</button></div>
      <//>` : html`<${Fragment}>
        <p className="def">${fr(w.def)}</p>
        <dl className="dl">
          <dt>Dans un sujet</dt><dd>${fr(w.ctx)}</dd>
          <dt>Ce qu’on attend</dt><dd>${fr(w.att)}</dd>
        </dl>
        <div className="actions"><${SpeakBtn} text=${w.def + ' ' + w.ctx} label="Écouter la définition" /></div>
        <div className="actions"><span className="count">Est-ce que tu le savais ?</span><span className="spacer"></span>
          <button className="btn" onClick=${() => rate(false)}>Pas encore</button>
          <button className="btn btn-primary" onClick=${() => rate(true)}>Je savais</button>
        </div>
      <//>`}
    </div>
    <p className="count">Les mots marqués « Pas encore » reviennent à la fin de la liste.</p>
  </div>`;

function VocabQuiz() {
  const { store, setProg } = useApp();
  const N = 8;
  const make = () => shuffle(VOCAB.map((_, i) => i)).slice(0, N).map(i => {
    const others = shuffle(VOCAB.map((_, j) => j).filter(j => j !== i)).slice(0, 2);
    return { i, opts: shuffle([i, ...others]) };
  });
  const [qs, setQs] = useState(make);
  const [k, setK] = useState(0);
  const [pick, setPick] = useState(null);
  const [score, setScore] = useState(0);
  const best = store.prog.vocab && store.prog.vocab.quiz;
  if (k >= N) {
    return html`<div className="card">
      <span className="eyebrow">Résultat</span><span className="big-score">${score} / ${N}</span>
      ${score >= 7 ? html`<${Msg} kind="pos">Très bien. Tu connais le sens de ces mots.</${Msg}>` : html`<${Msg} kind="info">Revois les mots dans « Apprendre », puis réessaie.</${Msg}>`}
      ${best != null ? html`<p className="count">Meilleur score : ${Math.max(best, score)} / ${N}</p>` : null}
      <div className="actions"><button className="btn btn-primary" onClick=${() => { setQs(make()); setK(0); setPick(null); setScore(0); }}><${Icon} n="reset" s=${16} />Nouvelle série</button></div>
    </div>`;
  }
  const q = qs[k]; const w = VOCAB[q.i];
  const answer = j => { if (pick != null) return; setPick(j); if (j === q.i) setScore(score + 1); };
  const next = () => {
    const nk = k + 1; setK(nk); setPick(null);
    if (nk >= N) { const prev = (store.prog.vocab || {}).quiz; setProg('vocab', { quiz: prev != null ? Math.max(prev, score) : score }); }
  };
  return html`<div style=${{ display: 'flex', flexDirection: 'column', gap: '.75rem' }}>
    <div className="actions"><span className="count">Question ${k + 1} sur ${N}</span><span className="spacer"></span><span className="count">${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''}</span></div>
    <${Progress} value=${k} max=${N} />
    <div className="card">
      <span className="eyebrow">Que veut dire ce mot ?</span>
      <div className="word"><span className="w">${w.w}</span><span className="syl">${w.syl}</span></div>
      <div className="actions"><${SpeakBtn} text=${w.w} /></div>
      <div className="choices">${q.opts.map((j, n) => {
        let cls = 'choice';
        if (pick != null) { if (j === q.i) cls += ' ok'; else if (j === pick) cls += ' no'; else cls += ' dim'; }
        return html`<button key=${j} className=${cls} disabled=${pick != null} onClick=${() => answer(j)}><span className="mark">${'ABC'[n]}</span><span>${fr(VOCAB[j].def)}</span></button>`;
      })}</div>
      ${pick != null ? html`<${Fragment}>
        ${pick === q.i ? html`<${Msg} kind="pos" title="Exact.">${fr(w.ctx)} : ${fr(w.att)}</${Msg}>` : html`<${Msg} kind="neg" title="Pas tout à fait.">« ${w.w} » veut dire : ${fr(w.def)}</${Msg}>`}
        <div className="actions"><span className="spacer"></span><button className="btn btn-primary" onClick=${next}>${k + 1 < N ? 'Question suivante' : 'Voir le résultat'}<${Icon} n="right" s=${16} /></button></div>
      <//>` : null}
    </div>
  </div>`;
}

function Examples() {
  const { store, setProg } = useApp();
  const exDone = (store.prog && store.prog.ex) || {};
  const [wi, setWi] = useState(0);
  const [si, setSi] = useState(0);
  const [picked, setPicked] = useState({});
  const [whyOpen, setWhyOpen] = useState(false);
  const we = WE[wi]; const nSteps = we.steps.length;
  const choose = id => { setWi(WE.findIndex(w => w.id === id)); setSi(0); setPicked({}); setWhyOpen(false); };
  const finished = si >= nSteps;
  const st = finished ? null : we.steps[si];
  const key = wi + '-' + si;
  const pk = picked[key];
  const solved = st && (!st.choose || (pk != null && st.choose.options[pk].ok));
  const next = () => {
    if (si < nSteps - 1) { setSi(si + 1); setWhyOpen(false); }
    else { setSi(nSteps); setProg('ex', { [we.id]: true }); }
  };
  const last = we.steps[nSteps - 1].body.find(b => b.seg);
  return html`<div className="page">
    <div><h1>Exemples résolus</h1><p className="lead">Observe comment on construit un paragraphe argumentatif. L’exemple 1 est entièrement guidé. Ensuite, tu fais toi-même une partie des étapes.</p></div>
    <${Tabs} value=${we.id} onChange=${choose} items=${WE.map(w => ({ id: w.id, label: w.label + ' · ' + w.mode, done: exDone[w.id] }))} />
    <div className="frame subject"><span className="eyebrow">Sujet</span><span className="q">${fr(we.sujet)}</span><div className="actions"><${SpeakBtn} text=${we.sujet} /></div></div>
    <div className="stepper" aria-label="Étapes">${we.steps.map((s, i) => {
      const c = i === si ? 'cur' : i < si ? 'past' : '';
      return html`<button key=${i} className=${c} disabled=${i > si} onClick=${() => { if (i <= si) { setSi(i); setWhyOpen(false); } }} aria-current=${i === si ? 'step' : undefined}>
        <span className="dot">${i < si ? html`<${Icon} n="check" s=${13} />` : i + 1}</span><span className="ttl">${s.t}</span></button>`;
    })}</div>
    ${si > 0 && !finished ? html`<ul className="done-list" aria-label="Étapes déjà faites">${we.steps.slice(0, si).map((s, i) => html`<li key=${i}><${Icon} n="check" s=${14} /><span>${fr(s.sum)}</span></li>`)}</ul>` : null}
    ${finished ? html`<div className="card">
      <${Msg} kind="pos" title="Exemple terminé.">Voici le paragraphe final. Relis-le à voix haute en suivant les couleurs.</${Msg}>
      ${last ? html`<${Block} b=${last} />` : null}
      <${Legend} />
      <div className="actions">
        <button className="btn" onClick=${() => { setSi(0); setPicked({}); }}><${Icon} n="reset" s=${16} />Revoir cet exemple</button>
        <span className="spacer"></span>
        ${wi < WE.length - 1 ? html`<button className="btn btn-primary" onClick=${() => choose(WE[wi + 1].id)}>Exemple suivant<${Icon} n="right" s=${16} /></button>` : null}
      </div>
    </div>` : html`<div className="card">
      <div className="actions"><span className="eyebrow">Étape ${si + 1} sur ${nSteps}</span>${st.choose ? html`<span className="badge">À toi</span>` : null}</div>
      <h2>${st.t}</h2>
      ${st.choose ? html`<${Fragment}>
        <p><strong>${fr(st.choose.prompt)}</strong></p>
        ${st.choose.ctx ? html`<div className="frame para"><p><${Segs} segs=${st.choose.ctx} /></p></div>` : null}
        <div className="choices">${st.choose.options.map((o, n) => {
          let cls = 'choice';
          if (pk != null) { if (n === pk) cls += o.ok ? ' ok' : ' no'; else if (solved) cls += ' dim'; }
          return html`<button key=${n} className=${cls} disabled=${solved} onClick=${() => setPicked({ ...picked, [key]: n })}><span className="mark">${'ABC'[n]}</span><span>${fr(o.text)}</span></button>`;
        })}</div>
        ${pk != null ? html`<${Msg} kind=${st.choose.options[pk].ok ? 'pos' : 'neg'}>${fr(st.choose.options[pk].fb)}${!st.choose.options[pk].ok ? ' Essaie une autre réponse.' : ''}</${Msg}>` : null}
      <//>` : null}
      ${solved ? st.body.map((b, i) => html`<${Block} key=${i} b=${b} />`) : null}
      ${solved ? html`<div className="why">
        ${whyOpen ? html`<${Fragment}><strong>Pourquoi cette étape ?</strong><p>${fr(st.why)}</p><//>` : html`<${Fragment}><p>Avant de continuer : à ton avis, pourquoi fait-on cette étape ? Réponds dans ta tête, puis vérifie.</p><button className="btn btn-sm" onClick=${() => setWhyOpen(true)}>Vérifier ma réponse</button><//>`}
      </div>` : null}
      <div className="actions">
        <button className="btn" disabled=${si === 0} onClick=${() => { setSi(si - 1); setWhyOpen(false); }}><${Icon} n="left" s=${16} />Étape précédente</button>
        <span className="spacer"></span>
        <button className="btn btn-primary" disabled=${!solved} onClick=${next}>${si < nSteps - 1 ? 'Étape suivante' : 'Terminer'}<${Icon} n="right" s=${16} /></button>
      </div>
    </div>`}
  </div>`;
}

/* -- Trier -- */
function Sort() {
  const { store, setProg } = useApp();
  const done = (store.prog && store.prog.sort) || {};
  const [sid, setSid] = useState(SORT[0].id);
  const [run, setRun] = useState(0);
  const set = SORT.find(s => s.id === sid);
  const order = useMemo(() => shuffle(set.items.map((_, i) => i)), [sid, run]);
  const [pos, setPos] = useState(0);
  const [ans, setAns] = useState(null);
  const [score, setScore] = useState(0);
  const reset = id => { if (id) setSid(id); setRun(run + 1); setPos(0); setAns(null); setScore(0); };
  const n = set.items.length;
  const it = pos < n ? set.items[order[pos]] : null;
  const answer = a => { if (ans) return; setAns(a); if (a === it.a) setScore(score + 1); };
  const next = () => {
    const np = pos + 1; setPos(np); setAns(null);
    if (np >= n) setProg('sort', { [sid]: score });
  };
  return html`<div className="page">
    <div><h1>Argument ou exemple ?</h1><p className="lead">Lis chaque phrase. Décide si c’est un argument, un exemple, ou si elle n’a pas de lien avec le sujet.</p></div>
    <${Tabs} value=${sid} onChange=${id => reset(id)} items=${SORT.map((s, i) => ({ id: s.id, label: 'Sujet ' + (i + 1), done: done[s.id] != null }))} />
    <div className="frame subject">
      <span className="eyebrow">Sujet</span><span className="q">${fr(set.sujet)}</span>
      <div className="row" style=${{ marginTop: '.3rem' }}><${Chip} k="these" /><span>${fr(set.these)}</span></div>
    </div>
    <details className="box"><summary>Rappel : comment les reconnaître</summary><div className="inner">
      <div className="cgroup"><h3>Argument</h3><p>Une raison générale. Il répond à « Pourquoi ? ».</p></div>
      <div className="cgroup"><h3>Exemple</h3><p>Un fait précis : une personne, un lieu, un chiffre, une œuvre. On peut dire « Par exemple » devant.</p></div>
      <div className="cgroup"><h3>Hors sujet</h3><p>La phrase peut être vraie, mais elle n’aide pas à défendre la thèse.</p></div>
    </div></details>
    ${it ? html`<div style=${{ display: 'flex', flexDirection: 'column', gap: '.75rem' }}>
      <div className="actions"><span className="count">Phrase ${pos + 1} sur ${n}</span><span className="spacer"></span><span className="count">Score : ${score}</span></div>
      <${Progress} value=${pos} max=${n} />
      <div className="card">
        <p style=${{ fontSize: '1.15rem' }}>${fr(it.t)}</p>
        <div className="actions"><${SpeakBtn} text=${it.t} /></div>
        <div className="trio">
          ${[['arg', 'Argument', 'une raison'], ['ex', 'Exemple', 'un fait précis'], ['hs', 'Hors sujet', 'aucun lien']].map(([k, l, s]) => {
            let cls = 'btn';
            if (ans) { if (k === it.a) cls += ' res-ok'; else if (k === ans) cls += ' res-no'; }
            return html`<button key=${k} className=${cls} disabled=${!!ans && k !== it.a && k !== ans} onClick=${() => answer(k)}>${l}<small>${s}</small></button>`;
          })}
        </div>
        ${ans ? html`<${Fragment}>
          <${Msg} kind=${ans === it.a ? 'pos' : 'neg'} title=${ans === it.a ? 'Bonne réponse.' : 'Réponse attendue : ' + CATS[it.a] + '.'}>${fr(it.fb)}</${Msg}>
          <div className="actions"><span className="spacer"></span><button className="btn btn-primary" onClick=${next}>${pos + 1 < n ? 'Phrase suivante' : 'Voir le résultat'}<${Icon} n="right" s=${16} /></button></div>
        <//>` : null}
      </div>
    </div>` : html`<div className="card">
      <span className="eyebrow">Résultat</span><span className="big-score">${score} / ${n}</span>
      ${score >= n - 1 ? html`<${Msg} kind="pos">Très bien. Tu sais distinguer une raison, un fait précis et une phrase hors sujet.</${Msg}>` : html`<${Msg} kind="info">Relis le rappel, puis recommence. Pose-toi la question : « Est-ce une raison, ou un cas précis ? »</${Msg}>`}
      <div className="actions"><button className="btn" onClick=${() => reset()}><${Icon} n="reset" s=${16} />Recommencer</button><span className="spacer"></span>
        ${SORT.findIndex(s => s.id === sid) < SORT.length - 1 ? html`<button className="btn btn-primary" onClick=${() => reset(SORT[SORT.findIndex(s => s.id === sid) + 1].id)}>Sujet suivant<${Icon} n="right" s=${16} /></button>` : null}
      </div>
    </div>`}
  </div>`;
}

/* -- Relier -- */
function ConnBox({ open }) {
  return html`<details className="box" open=${open}><summary>Boîte à connecteurs</summary><div className="inner">${CONN_BOX.map(g => html`<div key=${g.h} className="cgroup"><h3>${g.h}</h3><p><span className="seg k-conn">${g.c}</span></p></div>`)}</div></details>`;
}
function LinkPage() {
  const { store, setProg } = useApp();
  const [k, setK] = useState(0);
  const [pick, setPick] = useState(null);
  const [score, setScore] = useState(0);
  const N = LINK.length;
  const it = k < N ? LINK[k] : null;
  const answer = o => { if (pick) return; setPick(o); if (o === it.ok) setScore(score + 1); };
  const next = () => { const nk = k + 1; setK(nk); setPick(null); if (nk >= N) setProg('link', score); };
  return html`<div className="page">
    <div><h1>Relier les idées</h1><p className="lead">Deux phrases courtes deviennent une phrase plus riche. Choisis le connecteur qui montre le bon lien entre les deux idées.</p></div>
    <${ConnBox} open=${false} />
    ${it ? html`<div style=${{ display: 'flex', flexDirection: 'column', gap: '.75rem' }}>
      <div className="actions"><span className="count">Paire ${k + 1} sur ${N}</span><span className="spacer"></span><span className="count">Score : ${score}</span></div>
      <${Progress} value=${k} max=${N} />
      <div className="card">
        <div className="kernels"><div className="kernel">${fr(it.a)}</div><span className="plus">+</span><div className="kernel">${fr(it.b)}</div></div>
        <p><strong>Quel lien y a-t-il entre ces deux idées ?</strong></p>
        <div className="trio">${it.opts.map(o => {
          let cls = 'btn';
          if (pick) { if (o === it.ok) cls += ' res-ok'; else if (o === pick) cls += ' res-no'; }
          return html`<button key=${o} className=${cls} disabled=${!!pick && o !== it.ok && o !== pick} onClick=${() => answer(o)}>${o}</button>`;
        })}</div>
        ${pick ? html`<${Fragment}>
          <${Msg} kind=${pick === it.ok ? 'pos' : 'neg'} title=${pick === it.ok ? 'Oui : lien de ' + it.role + '.' : 'Le bon lien ici : ' + it.role + '.'}>${fr(it.fb)}</${Msg}>
          <div className="frame para"><span className="eyebrow">Phrase reliée</span><p><${Segs} segs=${it.res} /></p><${SpeakBtn} text=${segsText(it.res)} /></div>
          <p className="count">Dis la phrase reliée à voix haute avant de continuer.</p>
          <div className="actions"><span className="spacer"></span><button className="btn btn-primary" onClick=${next}>${k + 1 < N ? 'Paire suivante' : 'Voir le résultat'}<${Icon} n="right" s=${16} /></button></div>
        <//>` : null}
      </div>
    </div>` : html`<div className="card">
      <span className="eyebrow">Résultat</span><span className="big-score">${score} / ${N}</span>
      ${score >= N - 1 ? html`<${Msg} kind="pos">Très bien. Tu choisis les connecteurs selon le lien entre les idées.</${Msg}>` : html`<${Msg} kind="info">Garde la boîte à connecteurs ouverte et recommence.</${Msg}>`}
      <div className="actions"><button className="btn btn-primary" onClick=${() => { setK(0); setPick(null); setScore(0); }}><${Icon} n="reset" s=${16} />Recommencer</button></div>
    </div>`}
  </div>`;
}

/* -- Ordonner -- */
function OrderPage() {
  const { store, setProg } = useApp();
  const done = (store.prog && store.prog.order) || {};
  const [oid, setOid] = useState(ORDER[0].id);
  return html`<div className="page">
    <div><h1>Remettre dans l’ordre</h1><p className="lead">Touche les morceaux dans le bon ordre pour reconstruire le texte. Touche un morceau placé pour le retirer.</p></div>
    <${Tabs} value=${oid} onChange=${setOid} items=${ORDER.map(o => ({ id: o.id, label: o.label, done: done[o.id] }))} />
    <${OrderEx} key=${oid} ex=${ORDER.find(o => o.id === oid)} onDone=${() => setProg('order', { [oid]: true })} next=${() => { const i = ORDER.findIndex(o => o.id === oid); if (i < ORDER.length - 1) setOid(ORDER[i + 1].id); }} isLast=${ORDER[ORDER.length - 1].id === oid} />
  </div>`;
}
function OrderEx({ ex, onDone, next, isLast }) {
  const init = () => { let p = shuffle(ex.items.map((_, i) => i)); if (p.every((v, i) => v === i)) p = p.reverse(); return p; };
  const [pool, setPool] = useState(init);
  const [placed, setPlaced] = useState([]);
  const [checked, setChecked] = useState(false);
  const [hint, setHint] = useState(false);
  const add = i => { setPool(pool.filter(x => x !== i)); setPlaced(placed.concat(i)); setChecked(false); };
  const remove = i => { setPlaced(placed.filter(x => x !== i)); setPool(pool.concat(i)); setChecked(false); };
  const okCount = placed.filter((v, i) => v === i).length;
  const allOk = checked && okCount === ex.items.length;
  const check = () => { setChecked(true); if (placed.every((v, i) => v === i)) onDone(); };
  const text = it => {
    if (!hint || !it.t.startsWith(it.c)) return fr(it.t);
    return html`<${Fragment}><span className="hl">${it.c}</span>${fr(it.t.slice(it.c.length))}<//>`;
  };
  return html`<${Fragment}>
    <div className="frame subject"><span className="eyebrow">Sujet</span><span className="q">${fr(ex.sujet)}</span>
      <p className="count">${ex.kind === 'phrases' ? 'Remets les 4 phrases du paragraphe dans l’ordre.' : 'Remets les 4 parties du texte dans l’ordre.'}</p></div>
    <div className="actions">
      <button className=${'btn btn-sm' + (hint ? ' on' : '')} aria-pressed=${hint} onClick=${() => setHint(!hint)}><${Icon} n="eye" s=${16} />${hint ? 'Masquer l’indice' : 'Montrer l’indice'}</button>
      <button className="btn btn-sm" onClick=${() => { setPool(init()); setPlaced([]); setChecked(false); }}><${Icon} n="reset" s=${16} />Recommencer</button>
    </div>
    ${hint ? html`<${Msg} kind="info">Regarde les premiers mots de chaque morceau. Ils disent si le morceau annonce, ajoute, explique, illustre ou conclut.</${Msg}>` : null}
    <div className="zone">
      <span className="zone-label">Ton texte</span>
      ${placed.length ? placed.map((i, p) => {
        const it = ex.items[i]; const st = checked ? (i === p ? ' ok' : ' no') : '';
        return html`<button key=${i} className=${'slot' + st} onClick=${() => remove(i)} aria-label=${'Retirer le morceau ' + (p + 1)}><span className="pos">${p + 1}</span><span className="tx">${text(it)}</span></button>`;
      }) : html`<div className="empty">Touche un morceau ci-dessous pour commencer.</div>`}
    </div>
    ${pool.length ? html`<div className="zone">
      <span className="zone-label">Morceaux à placer</span>
      ${pool.map(i => html`<button key=${i} className="slot" onClick=${() => add(i)}><span className="pos" style=${{ background: 'transparent', border: '1px solid var(--line-strong)' }}></span><span className="tx">${text(ex.items[i])}</span></button>`)}
    </div>` : null}
    ${!pool.length && !checked ? html`<div className="actions"><span className="spacer"></span><button className="btn btn-primary" onClick=${check}><${Icon} n="check" s=${16} />Vérifier</button></div>` : null}
    ${checked && allOk ? html`<div className="card">
      <${Msg} kind="pos" title="Bravo, tout est dans l’ordre.">Voici le rôle de chaque morceau.</${Msg}>
      <ul className="rows">${ex.items.map((it, i) => html`<li key=${i} className="row"><${Chip} k=${it.r} /><span>${fr(it.t)}</span></li>`)}</ul>
      <div className="actions"><${SpeakBtn} text=${ex.items.map(i => i.t).join(' ')} label="Écouter le texte" /><span className="spacer"></span>
        ${!isLast ? html`<button className="btn btn-primary" onClick=${next}>Exercice suivant<${Icon} n="right" s=${16} /></button>` : null}</div>
    </div>` : null}
    ${checked && !allOk ? html`<${Msg} kind="neg" title=${okCount + ' morceau' + (okCount > 1 ? 'x' : '') + ' sur ' + ex.items.length + ' bien placé' + (okCount > 1 ? 's' : '') + '.'}>Les morceaux en rouge ne sont pas à la bonne place. Touche-les pour les retirer, puis replace-les.${!hint ? ' Tu peux aussi afficher l’indice.' : ''}</${Msg}>` : null}
  <//>`;
}

/* -- Plan -- */
function Plan() {
  const { store, setStore, setProg } = useApp();
  const plan = store.plan || {};
  const f = plan.f || {};
  const sujet = plan.sujet || PLAN_SUBJECTS[0];
  const custom = plan.custom || '';
  const checks = plan.checks || {};
  const [view, setView] = useState('write');
  const [copied, setCopied] = useState('');
  const upd = patch => setStore(s => ({ ...s, plan: { ...(s.plan || {}), ...patch } }));
  const val = fd => (f[fd.k] != null ? f[fd.k] : fd.start);
  const setF = (k, v) => upd({ f: { ...f, [k]: v } });
  const realSujet = sujet === '__custom' ? custom : sujet;
  const filled = fd => { const v = val(fd).trim(); return v.length > fd.start.trim().length + 3; };
  const nFilled = PLAN_FIELDS.filter(filled).length;
  const paragraphs = PLAN_GROUPS.map(g => ({ g, parts: PLAN_FIELDS.filter(fd => fd.g === g.g && filled(fd)).map(fd => ({ role: fd.role, t: val(fd).trim() })) })).filter(p => p.parts.length);
  const plain = paragraphs.map(p => p.parts.map(x => x.t).join(' ')).join('\n\n');
  const copy = () => {
    const done = () => { setCopied('Texte copié.'); setTimeout(() => setCopied(''), 2500); };
    try { navigator.clipboard.writeText(plain).then(done, () => setCopied('Sélectionne le texte et copie-le à la main.')); } catch (e) { setCopied('Sélectionne le texte et copie-le à la main.'); }
  };
  return html`<div className="page">
    <div><h1>Mon plan</h1><p className="lead">Prépare ton texte morceau par morceau. Pour chaque case : dis ta phrase à voix haute, puis écris-la. Les débuts de phrase sont déjà là ; tu peux les changer.</p></div>
    <${Tabs} value=${view} onChange=${v => { setView(v); if (v === 'read' && nFilled >= 4) setProg('plan', true); }} items=${[{ id: 'write', label: 'Préparer' }, { id: 'read', label: 'Mon texte' }]} />
    ${view === 'write' ? html`<${Fragment}>
      <div className="field">
        <label htmlFor="plan-sujet">Sujet</label>
        <select id="plan-sujet" value=${sujet} onChange=${e => upd({ sujet: e.target.value })}>
          ${PLAN_SUBJECTS.map(s => html`<option key=${s} value=${s}>${s}</option>`)}
          <option value="__custom">Un autre sujet (je l’écris)</option>
        </select>
        ${sujet === '__custom' ? html`<input id="plan-custom" type="text" placeholder="Écris ton sujet ici" value=${custom} onChange=${e => upd({ custom: e.target.value })} />` : null}
      </div>
      <div className="actions"><span className="count">${nFilled} case${nFilled > 1 ? 's' : ''} remplie${nFilled > 1 ? 's' : ''} sur ${PLAN_FIELDS.length}</span></div>
      <${Progress} value=${nFilled} max=${PLAN_FIELDS.length} />
      ${PLAN_GROUPS.map(g => html`<section key=${g.g} className=${'group k-' + g.role}>
        <h2>${g.t}</h2>
        ${PLAN_FIELDS.filter(fd => fd.g === g.g).map(fd => html`<div key=${fd.k} className="field">
          <label htmlFor=${'plan-' + fd.k}><${Chip} k=${fd.role} />${fd.label}<span className="hint">${fr(fd.hint)}</span></label>
          <textarea id=${'plan-' + fd.k} rows="2" value=${val(fd)} onChange=${e => setF(fd.k, e.target.value)}></textarea>
        </div>`)}
      </section>`)}
      <${ConnBox} open=${false} />
      <div className="actions"><button className="btn" onClick=${() => upd({ f: {}, checks: {} })}><${Icon} n="reset" s=${16} />Tout effacer</button><span className="spacer"></span>
        <button className="btn btn-primary" onClick=${() => { setView('read'); if (nFilled >= 4) setProg('plan', true); }}>Assembler mon texte<${Icon} n="right" s=${16} /></button></div>
      <p className="count">Ton brouillon reste enregistré dans ce navigateur.</p>
    <//>` : html`<${Fragment}>
      ${realSujet ? html`<div className="frame subject"><span className="eyebrow">Sujet</span><span className="q">${fr(realSujet)}</span></div>` : null}
      ${paragraphs.length ? html`<div className="card">
        <div className="assembled">${paragraphs.map(p => html`<p key=${p.g.g}><${Segs} segs=${p.parts.map(x => [x.role, x.t])} /></p>`)}</div>
        <${Legend} keys=${['these', 'arg', 'expl', 'ex', 'concl']} />
        <div className="actions"><${SpeakBtn} text=${plain} label="Écouter mon texte" /><span className="spacer"></span>
          <button className="btn" onClick=${copy}><${Icon} n="copy" s=${16} />Copier le texte</button></div>
        ${copied ? html`<p className="count" role="status">${copied}</p>` : null}
      </div>` : html`<${Msg} kind="info">Ton texte est vide pour l’instant. Remplis quelques cases dans « Préparer ».</${Msg}>`}
      <section className="frame" style=${{ display: 'flex', flexDirection: 'column', gap: '.6rem' }}>
        <h2>Je vérifie mon texte</h2>
        <div className="checks">${CHECKS.map((c, i) => html`<label key=${i}><input id=${'check-' + i} type="checkbox" checked=${!!checks[i]} onChange=${e => upd({ checks: { ...checks, [i]: e.target.checked } })} /><span>${fr(c)}</span></label>`)}</div>
        ${CHECKS.every((_, i) => checks[i]) ? html`<${Msg} kind="pos">Tout est vérifié. Ton texte a la structure d’un texte argumentatif.</${Msg}>` : null}
      </section>
      <div className="actions"><button className="btn" onClick=${() => setView('write')}><${Icon} n="left" s=${16} />Modifier</button></div>
    <//>`}
  </div>`;
}

/* -- Notes pour l'adulte -- */
function Notes() {
  return html`<div className="page"><div className="notes">
    <div><h1>Notes pour l’adulte</h1><p className="lead">Pour l’orthophoniste, l’enseignant ou le parent qui accompagne l’élève.</p></div>
    <section><h2>Principes de conception</h2><ul>
      <li><strong>Pré-apprentissage du vocabulaire des consignes.</strong> Syllabation, écoute, définition simple, mot en contexte, puis rappel actif. <span className="ref">Approche phonologique-sémantique : Lowe, Henry, Müller et Joffe, 2018.</span></li>
      <li><strong>Exemples résolus, puis estompage.</strong> Exemple 1 complet, exemple 2 avec la dernière étape à faire, exemple 3 avec trois étapes à faire. <span className="ref">Renkl et Atkinson ; effet de renversement de l’expertise, Kalyuga.</span></li>
      <li><strong>Auto-explication.</strong> À chaque étape, l’élève se demande pourquoi elle existe avant de voir la réponse.</li>
      <li><strong>Segmentation et rythme contrôlé.</strong> Une tâche par écran ; l’élève avance quand il est prêt. <span className="ref">Mayer, principes de segmentation et de pré-entraînement.</span></li>
      <li><strong>Signalisation.</strong> Une couleur et une étiquette par rôle (thèse, argument, explication, exemple, connecteur), identiques dans toutes les activités. Désactivables dans les réglages.</li>
      <li><strong>Combinaison de phrases.</strong> Relier deux phrases noyaux par un connecteur choisi selon le lien logique. <span className="ref">Graham et Perin, 2007 ; Saddler et Graham, 2005.</span></li>
      <li><strong>Planification guidée et autorégulation.</strong> Organisateur graphique avec amorces de phrases, puis liste d’autovérification. <span className="ref">Inspiré du modèle SRSD, Harris et Graham.</span></li>
      <li><strong>Appui oral.</strong> Lecture à voix haute par synthèse vocale et consigne de dire la phrase avant de l’écrire.</li>
    </ul></section>
    <section><h2>Conseils d’utilisation</h2><ul>
      <li>Séances courtes (15 à 20 minutes), deux ou trois fois par semaine.</li>
      <li>Faire le premier exemple résolu ensemble, en pensant à voix haute.</li>
      <li>Revenir au vocabulaire à plusieurs jours d’intervalle plutôt qu’en une seule fois.</li>
      <li>Passer à l’activité suivante quand l’élève réussit environ 4 items sur 5, sans aide.</li>
      <li>Pour la production, autoriser le clavier ou la dictée vocale si l’écriture manuscrite coûte trop.</li>
      <li>Remplacer progressivement les amorces de phrases du plan par des phrases entièrement libres.</li>
    </ul></section>
    <p className="count">Les progrès et le brouillon sont enregistrés uniquement dans le navigateur utilisé.</p>
  </div></div>`;
}

/* -- Réglages -- */
function Settings({ onClose }) {
  const { store, setSettings } = useApp();
  const s = store.settings;
  return html`<${Fragment}>
    <div className="pop-scrim" onClick=${onClose}></div>
    <div className="pop" role="dialog" aria-label="Affichage">
      <div><div className="lbl">Taille du texte</div>
        <div className="seg-ctl">${[['m', 'Normal'], ['l', 'Grand'], ['xl', 'Très grand']].map(([k, l]) => html`<button key=${k} className=${'btn btn-sm' + (s.size === k ? ' on' : '')} aria-pressed=${s.size === k} onClick=${() => setSettings({ size: k })}>${l}</button>`)}</div></div>
      <label className="switch" htmlFor="set-airy"><span>Texte aéré</span><input id="set-airy" type="checkbox" checked=${!!s.airy} onChange=${e => setSettings({ airy: e.target.checked })} /></label>
      <label className="switch" htmlFor="set-colors"><span>Couleurs des rôles</span><input id="set-colors" type="checkbox" checked=${s.colors !== false} onChange=${e => setSettings({ colors: e.target.checked })} /></label>
      ${CAN_SPEAK ? html`<label className="switch" htmlFor="set-tts"><span>Boutons « Écouter »</span><input id="set-tts" type="checkbox" checked=${s.tts !== false} onChange=${e => setSettings({ tts: e.target.checked })} /></label>` : null}
    </div>
  <//>`;
}

/* ---------- Application ---------- */
const PAGES = {
  home: { t: 'Accueil', icon: 'home', C: Home },
  vocab: { t: 'Les mots des sujets', icon: 'words', C: Vocab },
  ex: { t: 'Exemples résolus', icon: 'bulb', C: Examples },
  sort: { t: 'Argument ou exemple ?', icon: 'sort', C: Sort },
  link: { t: 'Relier les idées', icon: 'link', C: LinkPage },
  order: { t: 'Remettre dans l’ordre', icon: 'order', C: OrderPage },
  plan: { t: 'Mon plan', icon: 'plan', C: Plan },
  notes: { t: 'Notes pour l’adulte', icon: 'info', C: Notes }
};

function App() {
  const [store, setStore] = useState(() => {
    const s = loadStore();
    return { settings: { size: 'm', airy: false, colors: true, tts: true, ...(s.settings || {}) }, prog: s.prog || {}, plan: s.plan || {} };
  });
  const initial = (() => { const h = (location.hash || '').slice(1); return PAGES[h] ? h : 'home'; })();
  const [page, setPage] = useState(initial);
  const [drawer, setDrawer] = useState(false);
  const [pop, setPop] = useState(false);

  useEffect(() => { saveStore(store); }, [store]);
  useEffect(() => {
    const r = document.documentElement.style; const s = store.settings;
    r.setProperty('--base', s.size === 'xl' ? '20px' : s.size === 'l' ? '18px' : '16px');
    r.setProperty('--lh', s.airy ? '1.85' : '1.55');
    r.setProperty('--ls', s.airy ? '.025em' : '0em');
    r.setProperty('--ws', s.airy ? '.12em' : '0em');
  }, [store.settings]);

  const go = p => { setPage(p); setDrawer(false); try { history.replaceState(null, '', '#' + p); } catch (e) {} const c = document.querySelector('.content'); if (c) c.scrollTop = 0; };
  const setProg = (k, v) => setStore(s => {
    const cur = s.prog[k];
    const nv = (v && typeof v === 'object' && !Array.isArray(v)) ? { ...(cur && typeof cur === 'object' ? cur : {}), ...v } : v;
    return { ...s, prog: { ...s.prog, [k]: nv } };
  });
  const setSettings = patch => setStore(s => ({ ...s, settings: { ...s.settings, ...patch } }));
  const ctx = { store, setStore, setProg, setSettings, go };
  const P = PAGES[page];

  const navItem = (id, num) => {
    const p = PAGES[id]; const st = num ? statusOf(id, store.prog) : null;
    return html`<button key=${id} className=${'nav-item' + (page === id ? ' active' : '')} aria-current=${page === id ? 'page' : undefined} onClick=${() => go(id)}>
      ${num ? html`<span className="num">${num}</span>` : null}<${Icon} n=${p.icon} /><span className="lbl">${p.t}</span>
      ${st ? html`<span className=${'st' + (st.n >= st.max ? ' done' : '')}>${st.n >= st.max ? html`<${Icon} n="check" s=${14} />` : st.max > 1 && st.n > 0 ? st.n + '/' + st.max : ''}</span>` : null}
    </button>`;
  };

  return html`<${Ctx.Provider} value=${ctx}>
    <div className=${'app' + (store.settings.colors === false ? ' nocolor' : '')}>
      <header className="header">
        <button className="btn btn-flat btn-icon menu-btn" aria-label="Ouvrir le menu" onClick=${() => setDrawer(true)}><${Icon} n="menu" /></button>
        <span className="app-name">Atelier d’argumentation</span><span className="sep"></span>
        <span className="page-name">${P.t}</span>
        <span className="spacer"></span>
        <button className=${'btn btn-flat' + (pop ? ' on' : '')} aria-expanded=${pop} onClick=${() => setPop(!pop)}><${Icon} n="sliders" /><span>Affichage</span></button>
        ${pop ? html`<${Settings} onClose=${() => setPop(false)} />` : null}
      </header>
      <div className="main">
        <div className=${'scrim' + (drawer ? ' open' : '')} onClick=${() => setDrawer(false)}></div>
        <nav className=${'sidebar' + (drawer ? ' open' : '')} aria-label="Activités">
          ${navItem('home')}
          <div className="side-label">Parcours</div>
          ${PATH.map((it, i) => navItem(it.id, i + 1))}
          <div className="side-label">Aide</div>
          ${navItem('notes')}
        </nav>
        <main className="content"><${P.C} key=${page} /></main>
      </div>
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
