<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critères de divisibilité</title>
<meta name="description" content="Comprendre, mémoriser, manipuler et utiliser les critères de divisibilité (4e) : leçon, exercices corrigés et quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Mono:wght@500;700;800&family=Noto+Sans:wght@400;600;700;800&display=swap">
<style>
:root {
  /* Inspiré de KDE Plasma, thème Breeze : fenêtre gris clair, vue blanche, accent bleu Breeze.
     Mise en page d'application KDE : barre d'outils en haut, panneau « Parcours » à gauche, vue de contenu à droite. */
  --window: #eff0f1;
  --view: #ffffff;
  --alt: #f6f7f8;
  --header: #e3e5e7;
  --button: #fcfcfc;
  --text: #232629;
  --muted: #5b6670;
  --line: #d1d5d9;
  --line-strong: #b0b7bd;
  --accent: #3daee9;
  --accent-ink: #1b6a9a;
  --accent-soft: #e0f2fc;
  --accent-hover: #eff8fd;
  --sum: #9b59b6;
  --sum-ink: #7b3c96;
  --sum-soft: #f3e8f7;
  --rest: #f67400;
  --rest-ink: #a84f00;
  --rest-soft: #fff0e0;
  --pos: #27ae60;
  --pos-ink: #1c7a44;
  --pos-soft: #e1f5e9;
  --neg: #da4453;
  --neg-ink: #b02a38;
  --neg-soft: #fce6e8;
  --font: "Noto Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-airy: "Atkinson Hyperlegible", "Noto Sans", Verdana, sans-serif;
  --mono: "Noto Sans Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --radius: 5px;
  --tb-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --window: #202326; --view: #141618; --alt: #1b1e21; --header: #2a2e32; --button: #292c30;
    --text: #fcfcfc; --muted: #a1a9b1; --line: #383d42; --line-strong: #4e555b;
    --accent: #3daee9; --accent-ink: #7ccbf2; --accent-soft: #163a4e; --accent-hover: #1a2c36;
    --sum: #b47ccc; --sum-ink: #d3a6e6; --sum-soft: #3a2547;
    --rest: #f67400; --rest-ink: #ffab66; --rest-soft: #47290c;
    --pos: #27ae60; --pos-ink: #6fd89c; --pos-soft: #133522;
    --neg: #da4453; --neg-ink: #f28b95; --neg-soft: #48191f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --window: #202326; --view: #141618; --alt: #1b1e21; --header: #2a2e32; --button: #292c30;
  --text: #fcfcfc; --muted: #a1a9b1; --line: #383d42; --line-strong: #4e555b;
  --accent: #3daee9; --accent-ink: #7ccbf2; --accent-soft: #163a4e; --accent-hover: #1a2c36;
  --sum: #b47ccc; --sum-ink: #d3a6e6; --sum-soft: #3a2547;
  --rest: #f67400; --rest-ink: #ffab66; --rest-soft: #47290c;
  --pos: #27ae60; --pos-ink: #6fd89c; --pos-soft: #133522;
  --neg: #da4453; --neg-ink: #f28b95; --neg-soft: #48191f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--window); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.55; }
html.airy body { font-family: var(--font-airy); letter-spacing: .02em; word-spacing: .14em; line-height: 1.85; }
#root { min-height: 100%; }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; max-width: 70ch; }
ul, ol { margin: 0; }
b, strong { font-weight: 700; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; word-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0; word-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.lead { font-size: 1.06rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.center, .center { justify-content: center; }
.gap16 { gap: 16px; }
.grow { flex: 1; min-width: 120px; }
.ml-auto { margin-left: auto; }
.pos-ink { color: var(--pos-ink); font-weight: 600; }
.neg-ink { color: var(--neg-ink); font-weight: 600; }
.rest-ink { color: var(--rest-ink); }
.ic { flex: none; display: block; }
.ic-knob { fill: var(--view); }

/* ---------- Barre d'outils ---------- */
.toolbar { position: sticky; top: 0; z-index: 10; height: var(--tb-h); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--header); border-bottom: 1px solid var(--line); }
.appicon { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 1.45rem; font-weight: 700; line-height: 1; flex: none; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
.apptitle { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.apptitle strong { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apptitle span { font-size: .8rem; color: var(--muted); }
.tb-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.tb-sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 6px; opacity: .6; }
.btn.tb { min-height: 32px; padding: 4px 10px; font-weight: 600; }
.btn.tb small { font-size: .8em; margin-left: 1px; }

/* ---------- Coque ---------- */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100% - var(--tb-h)); }
.sidebar { position: sticky; top: var(--tb-h); align-self: start; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
.side-label { font-size: .78rem; font-weight: 700; color: var(--muted); padding: 4px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; text-align: left; cursor: pointer; }
.nav-item:hover { background: var(--accent-hover); }
.nav-item[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); }
.nav-item .ic { color: var(--muted); }
.nav-item[aria-current="page"] .ic { color: var(--accent-ink); }
.nav-txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.nav-txt small { font-size: .78rem; color: var(--muted); }
.nav-num { margin-left: auto; font-size: .75rem; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 999px; background: var(--header); color: var(--muted); white-space: nowrap; }
.main { background: var(--view); border-left: 1px solid var(--line); padding: 28px clamp(16px, 4vw, 44px) 72px; min-width: 0; }
.page { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-h { display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.page-h p { color: var(--muted); }

/* ---------- Cadres ---------- */
.card { background: var(--view); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--alt); border-bottom: 1px solid var(--line); }
.card-h .ic { color: var(--accent-ink); }
.card-b { padding: 16px; }
.tag { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 3px; background: var(--header); color: var(--muted); }
.tag.accent { background: var(--accent-soft); color: var(--accent-ink); }

/* ---------- Boutons (style Breeze) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 14px; min-height: 36px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--button); color: var(--text); cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.05); text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-hover); }
.btn:active:not(:disabled), .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.primary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.btn.flat { border-color: transparent; background: transparent; box-shadow: none; }
.btn.flat:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-hover); }
.btn.flat[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: .88rem; }
.seg { display: inline-flex; gap: 2px; }

/* ---------- Pastilles et messages ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 700; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: var(--pos-soft); color: var(--pos-ink); }
.pill.no { background: var(--neg-soft); color: var(--neg-ink); }
.pills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.msg { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border: 1px solid; border-radius: var(--radius); }
.msg .ic { margin-top: 2px; }
.msg-c { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.msg-t { font-weight: 700; }
.msg-info { background: var(--accent-soft); border-color: var(--accent); }
.msg-info .ic, .msg-tip .ic { color: var(--accent-ink); }
.msg-tip { background: var(--alt); border-color: var(--line-strong); }
.msg-pos { background: var(--pos-soft); border-color: var(--pos); }
.msg-pos .ic { color: var(--pos-ink); }
.msg-neg { background: var(--neg-soft); border-color: var(--neg); }
.msg-neg .ic { color: var(--neg-ink); }
.msg-warn { background: var(--rest-soft); border-color: var(--rest); }
.msg-warn .ic { color: var(--rest-ink); }

/* ---------- Chiffres en tuiles ---------- */
.num { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: 0; word-spacing: 0; }
.dg { display: inline-grid; place-items: center; min-width: 1.2em; height: 1.55em; padding: 0 .1em; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--button); color: var(--text); font-weight: 600; }
.dg.gap { margin-left: .32em; }
.dg.on-end { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-ink); font-weight: 800; }
.dg.on-sum { background: var(--sum-soft); border-color: var(--sum); box-shadow: inset 0 0 0 1px var(--sum); color: var(--sum-ink); font-weight: 800; }
.dg.star { border-style: dashed; border-color: var(--rest); color: var(--rest-ink); background: var(--rest-soft); }
.num-sm { font-size: .95rem; }
.num-md { font-size: 1.25rem; }
.num-lg { font-size: 2.2rem; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 2px solid; }
.key-end { background: var(--accent-soft); border-color: var(--accent); }
.key-sum { background: var(--sum-soft); border-color: var(--sum); }
.key-rest { background: var(--rest-soft); border-color: var(--rest); }
.key-comb { background: var(--alt); border-color: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; max-width: none; }

/* ---------- Tableaux ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; min-width: 100%; font-size: .95rem; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 7px 10px; text-align: center; vertical-align: middle; }
.tbl thead th { background: var(--alt); font-weight: 700; white-space: nowrap; }
.tbl tbody th { font-weight: 600; }
.tbl .left { text-align: left; }
.combos td.mono { white-space: nowrap; }

/* ---------- Leçon ---------- */
.stepper { list-style: none; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.step-pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--button); cursor: pointer; }
.step-pill:hover { border-color: var(--accent); }
.step-pill[aria-current="step"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.sp-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--header); font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.step-pill[aria-current="step"] .sp-n { background: var(--accent); color: #fff; }
.step-pill.done .sp-n { background: var(--pos-soft); color: var(--pos-ink); }
.sp-t { font-size: .9rem; }
.lesson .card-h h2 { flex-basis: 100%; }
.rules { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rules li { display: flex; gap: 10px; align-items: baseline; }
.rule-d { flex: none; min-width: 64px; font-weight: 700; color: var(--accent-ink); }
.rule-d.sum { color: var(--sum-ink); }
.why { border-top: 1px solid var(--line); }
.why summary { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; font-weight: 600; list-style: none; }
.why summary::-webkit-details-marker { display: none; }
.why summary::after { content: "▸"; margin-left: auto; color: var(--muted); }
.why[open] summary::after { content: "▾"; }
.why summary .ic { color: var(--accent-ink); }
.why summary:hover { background: var(--accent-hover); }
.why-b { padding: 4px 16px 16px; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 6px; }
.derive { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.derive-m { font-size: 1.02rem; line-height: 1.9; }
.box { padding: 2px 6px; border-radius: 3px; border: 1px solid; }
.box-mult { background: var(--header); border-color: var(--line-strong); }
.box-sum { background: var(--sum-soft); border-color: var(--sum); color: var(--sum-ink); font-weight: 700; }

/* Paquets */
.packets-box { display: flex; flex-direction: column; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--alt); }
.packets-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.packets { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; min-height: 60px; }
.packet { display: grid; gap: 4px; padding: 6px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent-soft); }
.packet.rest { border: 1.5px dashed var(--rest); background: var(--rest-soft); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.packet.rest .dot { background: var(--rest); }
.eq { font-size: 1.3rem; font-weight: 700; }
.phrases { padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.spin-f { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.spin-f label { color: var(--muted); }
.spin { display: inline-flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: var(--button); width: max-content; }
.spin button { border: 0; background: transparent; width: 36px; cursor: pointer; display: grid; place-items: center; }
.spin button:hover:not(:disabled) { background: var(--accent-hover); }
.spin button:disabled { opacity: .4; cursor: default; }
.spin input { width: 4.2ch; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--view); text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; padding: 6px 2px; -moz-appearance: textfield; }
.spin input::-webkit-outer-spin-button, .spin input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* Multiples de 4 */
.m4 { display: flex; flex-direction: column; gap: 8px; }
.m4-row { display: grid; grid-template-columns: 190px 1fr; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
.m4-l { display: flex; flex-direction: column; line-height: 1.3; }
.m4-v { display: flex; flex-wrap: wrap; gap: 4px; }
.m4-c { padding: 2px 6px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }

/* Bande des multiples */
.strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.cell { position: relative; display: grid; place-items: center; height: 38px; border: 1px solid var(--line); border-radius: 4px; font-family: var(--mono); font-size: .9rem; color: var(--muted); background: var(--view); }
.cell.ma::before { content: ""; position: absolute; top: 3px; left: 50%; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: var(--accent); }
.cell.mb::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--sum); }
.cell.ma, .cell.mb { color: var(--text); }
.cell.both { background: var(--pos-soft); border-color: var(--pos); color: var(--pos-ink); font-weight: 800; }
.strip-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.mk { display: inline-block; vertical-align: middle; margin-right: 4px; }
.mk-a { width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
.mk-b { width: 7px; height: 7px; border-radius: 50%; background: var(--sum); }
.mk-both { width: 12px; height: 12px; border-radius: 3px; background: var(--pos-soft); border: 1px solid var(--pos); }

/* Pièges */
.traps { display: flex; flex-direction: column; gap: 10px; }
.trap { border: 1px solid var(--line); border-left: 4px solid var(--neg); border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.trap-w, .trap-r { display: flex; gap: 8px; align-items: flex-start; }
.trap-w { font-weight: 700; }
.trap-w .ic { color: var(--neg-ink); margin-top: 3px; }
.trap-r .ic { color: var(--pos-ink); margin-top: 3px; }
.trap-r { color: var(--pos-ink); font-weight: 600; }
.trap-e { padding-left: 24px; }
.trap-k { display: inline-block; font-size: .75rem; font-weight: 700; color: var(--muted); margin-right: 8px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 3px; }

/* ---------- Choix (QCM) ---------- */
.q { font-weight: 600; font-size: 1.04rem; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--button); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-hover); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt-l { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 3px; background: var(--header); font-size: .8rem; font-weight: 700; }
.opt-t { flex: 1; }
.opt.good { border-color: var(--pos); background: var(--pos-soft); }
.opt.good .ic { color: var(--pos-ink); }
.opt.bad { border-color: var(--neg); background: var(--neg-soft); }
.opt.bad .ic { color: var(--neg-ink); }
.opt.dim { opacity: .6; }
.opt:disabled { cursor: default; }

/* Puces à cocher */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 52px; min-height: 40px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--button); cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; }
.chip:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-hover); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip:disabled { opacity: .45; cursor: default; }
.chip.good { background: var(--pos-soft); border-color: var(--pos); box-shadow: inset 0 0 0 1px var(--pos); color: var(--pos-ink); opacity: 1; }
.chip.bad { background: var(--neg-soft); border-color: var(--neg); box-shadow: inset 0 0 0 1px var(--neg); color: var(--neg-ink); opacity: 1; text-decoration: line-through; }
.chip.miss { border: 2px dashed var(--pos); color: var(--pos-ink); opacity: 1; }
.legend-res { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lg { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; }
.lg-bad { background: var(--neg-soft); border: 2px solid var(--neg); }
.lg-miss { border: 2px dashed var(--pos); }

/* Vrai / faux */
.tf { display: flex; flex-direction: column; gap: 6px; }
.tf-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; }
.tf-t { flex: 1; min-width: 200px; }
.tf-row.good { border-color: var(--pos); background: var(--pos-soft); }
.tf-row.bad { border-color: var(--neg); background: var(--neg-soft); }
.tf-mark .ic { width: 18px; }
.tf-row.good .tf-mark { color: var(--pos-ink); }
.tf-row.bad .tf-mark { color: var(--neg-ink); }
.seg-b { min-width: 64px; min-height: 32px; padding: 3px 10px; }

/* Grille */
.gridex td { padding: 4px; }
.cellbtn { width: 40px; height: 34px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--button); cursor: pointer; display: inline-grid; place-items: center; }
.cellbtn:hover { border-color: var(--accent); }
.cellbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.cellbtn.good { background: var(--pos-soft); border-color: var(--pos); color: var(--pos-ink); }
.cellbtn.bad { background: var(--neg-soft); border: 2px solid var(--neg); color: var(--neg-ink); }
.cellbtn.miss { border: 2px dashed var(--pos); }

/* Champ */
.field { min-height: 38px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--view); font-size: 1.05rem; width: 12ch; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.field.good { border-color: var(--pos); background: var(--pos-soft); }
.field.bad { border-color: var(--neg); background: var(--neg-soft); }

/* ---------- Exercices ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--text); background: var(--accent-hover); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 700; }
.tab-l { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; background: var(--header); font-size: .8rem; font-weight: 700; color: var(--text); }
.tab[aria-selected="true"] .tab-l { background: var(--accent); color: #fff; }
.tab-c { font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.fam-head { display: flex; flex-direction: column; gap: 8px; }
.goal { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.goal .ic { color: var(--accent-ink); }
.progress { height: 6px; border-radius: 999px; background: var(--header); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.sec-t { margin-top: 6px; }
.lvl { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.lvl-dots { display: inline-flex; gap: 3px; }
.lvl-dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--accent); }
.lvl-dots i.on { background: var(--accent); }
.ex-num { font-weight: 700; }
.ex.ex-ok { border-color: var(--pos); }
.prompt { font-size: 1.03rem; }
.ex-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 12px; }
.corr { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; background: var(--alt); display: flex; flex-direction: column; gap: 8px; }
.corr-h { font-size: .8rem; font-weight: 700; color: var(--accent-ink); }
.corr-steps { padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.ana { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.ana:last-child { border-bottom: 0; }
.ana-t { flex: 1; min-width: 180px; }
.fam-lines { display: flex; flex-direction: column; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--view); }
.worked { border-color: var(--accent); }
.worked .card-h { background: var(--accent-soft); }
.statement { font-size: 1.04rem; padding: 10px 14px; border-radius: var(--radius); background: var(--alt); border: 1px solid var(--line); }
.wsteps { list-style: none; padding: 0; counter-reset: ws; display: flex; flex-direction: column; gap: 10px; }
.wsteps li { counter-increment: ws; position: relative; padding-left: 40px; }
.wsteps li::before { content: counter(ws); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.wstep-t { font-weight: 700; }
.wstep-c { margin-top: 2px; }
.reset-zone { border-top: 1px solid var(--line); padding-top: 12px; }

/* ---------- Mémoriser ---------- */
.fiche, .fam3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fam { border: 1px solid var(--line); border-top: 4px solid; border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--view); }
.fam-end { border-top-color: var(--accent); }
.fam-sum { border-top-color: var(--sum); }
.fam-comb { border-top-color: var(--line-strong); }
.fam-h { font-weight: 700; display: flex; align-items: center; }
.fam-dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; margin: 0; align-items: start; }
.fam-dl dt { font-weight: 700; white-space: nowrap; }
.fam-end dt { color: var(--accent-ink); }
.fam-sum dt { color: var(--sum-ink); }
.fam-dl dd { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.fam-ex { display: flex; align-items: center; gap: 6px; }
.fam-note { margin-top: auto; }
.flash { width: 100%; min-height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--alt); cursor: pointer; text-align: center; }

.flash.flipped { background: var(--accent-soft); border-color: var(--accent); }
.flash-k { font-size: .75rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.flash-c { font-size: 1.2rem; font-weight: 600; max-width: 46ch; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.flash-ex { display: flex; align-items: center; gap: 8px; font-size: .95rem; font-weight: 400; }
.flash-hint { font-size: .85rem; color: var(--muted); }

.route { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.route-n { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; border: 1px solid var(--accent); }
.route-c { flex: 1; min-width: 0; }
.teacher summary { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; font-weight: 600; background: var(--alt); list-style: none; }
.teacher summary::-webkit-details-marker { display: none; }
.teacher summary::after { content: "▸"; margin-left: auto; color: var(--muted); }

.teacher[open] summary { border-bottom: 1px solid var(--line); }
.teacher summary .ic { color: var(--accent-ink); }
.notes { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }

.lab-list { display: flex; flex-direction: column; gap: 10px; }
.lab-group { display: flex; flex-direction: column; gap: 3px; padding-left: 8px; border-left: 3px solid var(--line-strong); }
.lg-end { border-left-color: var(--accent); }
.lg-sum { border-left-color: var(--sum); }
.lab-gl { font-size: .78rem; font-weight: 700; color: var(--muted); padding: 2px 0 2px 2px; }
.lab-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; }

.lab-row[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.lab-explain { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); }

.conds li { display: flex; align-items: center; gap: 8px; }
.conds li.ok { color: var(--pos-ink); }
.conds li.ko { color: var(--neg-ink); font-weight: 600; }

.score { display: flex; align-items: baseline; gap: 6px; }
.score-n { font-size: 3rem; font-weight: 800; color: var(--accent-ink); font-variant-numeric: tabular-nums; line-height: 1; }
.score-d { font-size: 1.3rem; color: var(--muted); }
.review { padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--neg); border-radius: var(--radius); display: flex; flex-direction: column; gap: 3px; }
.tri-num { display: flex; justify-content: center; padding: 10px 0; }

@media (max-width: 860px) {

}

  .nav-item { width: auto; flex: none; padding: 6px 10px; }

  .dg.big { font-size: 1.7rem; }
  .tbtn { width: 36px; }
  .dial.gap { margin-left: 8px; }
}
@media (max-width: 420px) {
  .route li { flex-wrap: wrap; }
  .num-lg { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) {
