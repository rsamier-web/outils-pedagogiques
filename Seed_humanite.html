:root{

  --bg:#eef1e7; --surface:#ffffff; --surface-2:#e2e8d8; --ink:#1c2315; --muted:#56614b;

  --line:#363f2b; --line-strong:#56634a;
  --accent:#7cc24f; --accent-deep:#4c8a2a; --accent-ink:#0f150a; --accent-soft:#2a3b1d;
  --frame:#0b0d08; --read:#222c19; --hl:#8a7316; --hl-ink:#fffbe8;
  --note-bg:#241f15; --note-line:#4a4130; --note-margin:#7a3f3f; --ilias-ink:#ffa75e;

}}

  --bg:#13160e; --surface:#1c2116; --surface-2:#272e1f; --ink:#e8eddc; --muted:#a6b097;
  --line:#363f2b; --line-strong:#56634a;
  --accent:#7cc24f; --accent-deep:#4c8a2a; --accent-ink:#0f150a; --accent-soft:#2a3b1d;

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{min-height:100%;display:flex;flex-direction:column}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark{flex:none;width:22px;height:22px;image-rendering:pixelated}
.xp{max-width:1180px;margin:8px auto 0;display:flex;gap:2px}
.xp span{flex:1;height:7px;background:var(--surface-2);border:1px solid var(--line)}
.xp span.on{background:var(--accent);border-color:var(--accent-deep)}
.xp span.now{background:var(--hl);border-color:var(--accent-deep)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;font-weight:700;font-size:1rem;line-height:1;
  background:var(--surface);color:var(--ink);border:2px solid var(--line-strong);border-bottom-width:4px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:focus-visible,.w:focus-visible,.toc-item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-deep)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;border-bottom-width:4px}
@media (max-width:560px){.hide-sm{display:none}}

/* Page */
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 128px}
.sheet{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
@media (max-width:860px){.sheet{grid-template-columns:minmax(0,1fr);gap:18px}}
.illu{margin:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:860px){.illu{position:static;max-width:640px;width:100%;margin:0 auto}}
.illu canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:96/54;image-rendering:pixelated;image-rendering:crisp-edges;
  border:4px solid var(--frame);border-radius:4px;background:#000}
.text{min-width:0;max-width:62ch}
@media (max-width:860px){.text{margin:0 auto;width:100%}}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.ptitle{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,1.2rem + 1.5vw,2.25rem);line-height:1.15;text-wrap:balance;margin:.25em 0 .7em}
.cover-title{font-size:clamp(2.2rem,1.4rem + 3vw,3.4rem)}
.prose{font-size:var(--fs);line-height:1.65;letter-spacing:.01em}
.blk{margin:0 0 .85em;padding:2px 6px;margin-left:-6px;margin-right:-6px;border-radius:4px;transition:background .15s}
.blk.reading{background:var(--read)}
.blk.dash{padding-left:6px}
.w{cursor:pointer;border-radius:3px}
.w:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--line-strong)}
.w.b{font-weight:700}
.w.cur{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 2px var(--hl)}
.ptitle .w:hover{text-decoration:none}

/* Chat du serveur */
.chat{background:var(--chat-bg);color:var(--chat-ink);border-radius:4px;padding:12px 14px;margin:0 0 1em;display:grid;gap:4px;font-size:.95em;line-height:1.55}
.chat .line{padding:2px 6px;margin:0 -6px;border-radius:3px}
.chat .line.reading{background:var(--chat-read)}
.who{font-family:var(--f-display);font-weight:700;margin-right:.45em;white-space:nowrap}
.who .br{color:var(--chat-muted);font-weight:400}
.who.I{color:var(--n-ilias)} .who.S{color:var(--n-souhail)} .who.N{color:var(--n-other)}
.chat .w.cur{background:var(--chat-hl);color:var(--chat-hl-ink);box-shadow:0 0 0 2px var(--chat-hl)}
.chat .w:hover{text-decoration-color:var(--chat-muted)}

/* Le Codex d’Ilias : une page de son carnet */
.note-ilias{margin:1.4em 0 0;padding:12px 16px 14px 34px;background-color:var(--note-bg);
  background-image:linear-gradient(90deg,transparent 20px,var(--note-margin) 20px,var(--note-margin) 22px,transparent 22px);
  border:2px solid var(--note-line);border-radius:3px;box-shadow:4px 4px 0 var(--note-line);transform:rotate(-.4deg)}
.note-ilias.reading{box-shadow:4px 4px 0 var(--note-line),0 0 0 3px var(--hl)}
.note-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9em;color:var(--ilias-ink);margin-bottom:4px}
.note-page{margin-left:auto;font-weight:400;color:var(--muted);font-size:.9em}
.note-text{margin:0;font-style:italic;line-height:1.6}
/* Dans la vraie vie */
.real{margin:1.4em 0 0;padding:12px 16px 14px;border:2px solid var(--line);border-radius:4px;background:var(--surface);font-size:.92em}
.real-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);margin-bottom:6px}
.real .entry{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:4px 6px;margin:0 -6px;border-radius:3px}
.real .entry + .entry{border-top:1px dashed var(--line)}
.real .entry.reading{background:var(--read)}
.chip{font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:0 5px;white-space:nowrap;opacity:.9}
.chip.svt{color:var(--c-svt)} .chip.hist{color:var(--c-hist)} .chip.geo{color:var(--c-geo)} .chip.maths{color:var(--c-maths)}
.chip.pc{color:var(--c-pc)} .chip.techno{color:var(--c-techno)} .chip.cog{color:var(--c-cog)}
.entry .etext{flex:1 1 24ch;min-width:0}
@media (prefers-reduced-motion: reduce){.note-ilias{transform:none}}

/* Couverture */
.cover-actions{display:flex;flex-wrap:wrap;gap:10px;margin:1.4em 0 1.6em}
.tips{list-style:none;margin:0;padding:14px 16px;border:2px solid var(--line);border-radius:4px;display:grid;gap:8px;font-size:1rem;color:var(--muted)}
.tips li{display:flex;gap:10px;align-items:flex-start}
.tips svg{flex:none;margin-top:2px;color:var(--accent)}
.fin{font-family:var(--f-display);font-size:1.4rem}

/* Barre du bas */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bottom-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.mid{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.pageno{font-family:var(--f-display);font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.pageno{display:none}}

/* Panneaux */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(440px,100%);height:100%;overflow-y:auto;border-left:2px solid var(--line);
  padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel h2{font-family:var(--f-display);font-size:1.5rem;margin:0}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label,.field .lab{font-weight:700;display:flex;justify-content:space-between;gap:10px}
.field output{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
select,input[type=range]{width:100%;accent-color:var(--accent)}
select{min-height:44px;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line-strong);border-radius:4px;padding:0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:52px;padding:0 8px}
.seg .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.note{font-size:.92rem;color:var(--muted);line-height:1.5;margin:8px 0 0}
.warn{border:2px solid var(--c-pc);color:var(--ink);border-radius:4px;padding:10px 12px;font-size:.95rem;margin-bottom:16px}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc-item{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:10px 12px;background:var(--surface);
  border:2px solid var(--line);border-radius:4px;cursor:pointer}
.toc-item:hover{background:var(--surface-2)}
.toc-item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.toc-num{font-family:var(--f-display);color:var(--muted);font-size:.9rem;min-width:5.5em}
.toc-title{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

{ch:1,scene:"bedroom",alt:"Une chambre la nuit : un écran allumé sur un bureau et un bulletin posé à côté.",title:"Le bulletin",b:[

{ch:1,scene:"screen",alt:"Un écran affiche un monde de blocs et une fenêtre de discussion.",title:"Le serveur de Souhail",b:[

"Près de la forêt, il trouve une ruche. Les abeilles volent de fleur en fleur, et ses cultures poussent plus vite.",
["S","Les abeilles transportent le pollen d’une fleur à l’autre. Sans elles, beaucoup de plantes ne donnent pas de fruits."],
["I","D’accord, mais c’est juste un jeu."],
["S","Un jeu qui copie la nature. À toi de voir ce qu’il copie bien, et ce qu’il copie mal."],
"Ilias commence à trouver ça amusant. Mais il ne le dira pas."],
real:[["svt","C’est la pollinisation : une fleur pollinisée peut devenir un fruit qui contient des graines. Sans les insectes pollinisateurs, une grande partie de nos fruits et légumes disparaîtrait."]]},
{ch:3,scene:"homestead",alt:"Au coucher du soleil, une maison avec une cheminée, un champ et un enclos.",title:"Fermier malgré lui",b:[
["S","Tu as remarqué ? Tu ne te promènes plus. Tu as un champ, un enclos, une maison."],
["I","Je suis devenu fermier, quoi."],
["S","Tu es devenu sédentaire : tu vis toujours au même endroit. Les humains ont fait pareil, il y a environ 10000 ans."],
["S","Petite question : 3 blés font un pain. Tu manges un pain par jour. Combien de blé pour tenir 10 jours ?"],
"Ilias écrit « 30 » sans réfléchir. Puis il s’arrête : c’était un problème de maths.",
["I","Ça ne compte pas. C’était trop facile."],
["S","Si tu le dis."]],
real:[["hist","Au Néolithique, les humains deviennent agriculteurs et éleveurs. Ils construisent les premiers villages."],["maths","Si 1 pain = 3 blés, alors 10 pains = 30 blés. C’est la proportionnalité."]]},

/* ---------- Chapitre 4 ---------- */
{ch:4,scene:"biomes",alt:"Un désert avec des cactus juste à côté d’une forêt enneigée.",title:"Un désert à côté de la neige",b:[
"Le monde du jeu est fait de grands paysages : déserts, plaines, forêts, montagnes enneigées. Ilias part explorer. Il traverse un désert de sable brûlant. Juste derrière les dunes, il tombe sur une forêt couverte de neige.",
["S","Question piège : dans la vraie vie, un désert collé à la neige, c’est possible ?"],
["I","Euh… Non ?"],
["S","Le jeu mélange les paysages comme un patchwork. Il simplifie. Et c’est ce que tu sais qui te permet de voir où il triche."]],
real:[["geo","Les grands paysages suivent les zones climatiques : il fait chaud près de l’équateur, froid près des pôles. Les déserts chauds et les forêts enneigées sont donc très éloignés les uns des autres."]]},
{ch:4,scene:"coords",alt:"Une carte avec deux axes, une croix rouge, et une boussole.",title:"Perdu ? Calcule !",b:[
"Après des heures de marche, Ilias est perdu. Sa maison est quelque part… mais où ?",
["S","Appuie sur la touche F3 du clavier. Le jeu affiche ta position avec trois nombres : X, Y et Z."],
["I","X 1240, Y 64 et Z moins 385."],
["S","X et Z disent où tu es sur le sol. Y donne ton altitude, ta hauteur. Ce sont des coordonnées. Ta maison est au point X 0, Z 0."],
"Ilias réfléchit. Pour rentrer, il doit marcher **1240 blocs vers l’ouest** et **385 blocs vers le sud**. Dans le jeu, un bloc mesure environ un mètre. Il fabrique aussi une carte, qui montre le terrain en plus petit."],
real:[["geo","Une carte représente un territoire en plus petit. L’échelle indique de combien il a été réduit."]]},
{ch:4,scene:"axes",alt:"Trois axes de couleur, X, Y et Z, partent d’un même point. Un bloc d’herbe flotte dans l’espace, et une mouche vole au-dessus.",title:"L’idée de Descartes",b:[
["I","C’est quoi, exactement, un repère ?"],
["S","Ce sont des droites graduées, les axes, qui partent d’un même point, l’origine. Sur une feuille, deux axes suffisent : un pour aller à droite, un pour monter."],
["S","Dans un monde en trois dimensions comme Minecraft, il en faut trois : X, Y et Z. Avec ces trois nombres, on retrouve n’importe quel bloc du monde."],
"C’est le philosophe et mathématicien français **René Descartes** qui a fait connaître cette idée, en 1637. Il y a moins de 400 ans ! Selon une légende, il y aurait pensé en regardant une mouche marcher au plafond : comment dire exactement où elle se trouve ?",
["I","Donc mon jeu utilise l’idée d’un philosophe ?"],
["S","Comme tous les jeux vidéo en trois dimensions."]],
real:[["maths","En hommage à Descartes, on parle de repère cartésien. Au collège, on y place des points avec deux nombres : l’abscisse et l’ordonnée."]]},
{ch:4,scene:"portal",alt:"Un portail violet encadré de blocs noirs, dans un monde rouge avec des chutes de lave.",title:"Le raccourci du Nether",b:[
"Pour rentrer plus vite, Souhail lui parle du **Nether**, un monde souterrain plein de lave, qu’on rejoint par un portail. Là-bas, **1 bloc parcouru vaut 8 blocs** dans le monde normal.",
["S","Si tu passes dans le Nether d’ici, tu arrives à quelles coordonnées ?"],
["I","1240 divisé par 8… 155 !"],
"Il oublie le Z, se perd, recommence. Moins 385 divisé par 8 : environ moins 48. Cette fois, il ressort à vingt mètres de chez lui.",
["I","En fait, c’est de la proportionnalité."],
["S","Bienvenue en quatrième."],
"Ce soir-là, sans rien dire à Souhail, Ilias ouvre le Codex."],
note:["Page 1","Nether : je divise par 8 pour savoir où j’arrive. C’est de la proportionnalité. Bon… celle-là, elle compte."]},

/* ---------- Chapitre 5 ---------- */
{ch:5,scene:"mine",alt:"Une coupe du sous-sol : un escalier creusé dans la pierre, des minerais, et Ilias au fond avec une torche.",title:"Sous la surface",b:[
"Il faut du fer. Ilias creuse un escalier vers les profondeurs. La terre laisse place à la pierre, puis à une roche plus sombre et plus dure. Le charbon est près de la surface, le fer un peu plus bas, les diamants tout au fond.",
"Il passe une heure à creuser pour trouver trois diamants. C’est long. C’est ennuyeux. Mais sans eux, pas d’outils solides.",
["I","Tu vas encore me dire que c’est au programme ?"],
["S","Non. Je vais te dire que le jeu copie le vrai monde. Les géologues lisent les couches de roches comme un livre d’histoire."]],
real:[["svt","Le sous-sol est formé de couches de roches empilées au fil du temps. En général, les plus profondes sont les plus anciennes."]]},
{ch:5,scene:"lava",alt:"Une cascade d’eau tombe sur un lac de lave et forme des blocs noirs.",title:"Lave + eau = ?",b:[
"Au fond de la mine, Ilias tombe sur un lac de lave. Il verse un seau d’eau dessus. La lave se transforme en **obsidienne**, une pierre noire et brillante.",
["S","Tu sais que l’obsidienne existe pour de vrai ?"],
["S","Et le basalte qu’on trouve dans le Nether aussi. Ce sont deux roches volcaniques."],
["I","Attends… Les volcans, c’est le prochain chapitre en SVT."],
["S","Tu vois. Tu as déjà de l’avance."]],
real:[["svt","Quand une lave refroidit, elle devient de la roche volcanique, comme le basalte. Si elle refroidit très vite, elle peut former une roche noire qui ressemble à du verre : l’obsidienne."]]},
{ch:5,scene:"forge",alt:"Un four en pierre allumé, des lingots de fer et un toit en cuivre devenu vert.",title:"L’âge du fer",b:[
"Ilias fait fondre dans un four le minerai, la roche qui contient le métal. Il obtient des lingots de fer, puis une armure complète.",
["S","Bois, pierre, fer, diamant : dans le jeu, les outils s’améliorent dans le même ordre que dans l’histoire des humains."],
"Sur le toit de sa maison, les blocs de cuivre ont verdi avec le temps. Ilias reconnaît cette couleur : c’est celle de la statue de la Liberté. Il ouvre le Codex sans que personne ne le lui demande."],
note:["Page 6","Le cuivre devient vert avec le temps, comme la statue de la Liberté. Ça s’appelle l’oxydation. Personne ne me l’a demandé."],
real:[["hist","Les humains ont d’abord travaillé le cuivre, puis le bronze, puis le fer, il y a environ 3000 ans. C’est l’âge des métaux."]]},

/* ---------- Chapitre 6 ---------- */
{ch:6,scene:"village",alt:"Un village avec deux maisons et un étal de marché où brillent des émeraudes.",title:"Le marché du village",b:[

["S","Tu lui en as trop vendu. C’est la loi de l’offre et de la demande."],
["S","Des métiers différents, des échanges, une monnaie… Tu viens de voir naître une société."]],

{ch:6,scene:"tablet",alt:"Une tablette d’argile couverte de petits signes en forme de clous.",title:"Tu as inventé l’écriture",b:[

{ch:6,scene:"testpaper",alt:"Une copie de contrôle notée 7 sur 20 en rouge.",title:"7 sur 20",b:[

/* ---------- Chapitre 7 ---------- */
{ch:7,scene:"campfire",alt:"La nuit, Ilias et Souhail assis de chaque côté d’un feu de camp.",title:"Au coin du feu",b:[

["S","Qui t’a appris à parler ?"],

{ch:7,scene:"brain",alt:"À gauche, deux personnes discutent dehors. À droite, un tableau d’école avec des calculs.",title:"Deux sortes de connaissances",b:[

"Les **connaissances biologiquement primaires** : parler, reconnaître des visages, s’orienter, jouer. Depuis des centaines de milliers d’années, le cerveau humain les apprend seul, simplement en vivant avec les autres.",

{ch:7,scene:"tutorial",alt:"Un écran montre une vidéo d’explication sur un circuit électrique.",title:"Cinquante vidéos",b:[

["I","… Non. J’ai regardé une cinquantaine de vidéos d’explication."],

{ch:7,scene:"school",alt:"Un bâtiment en briques de terre au soleil, avec deux élèves qui tiennent des tablettes d’argile.",title:"Il y a 4000 ans",b:[

real:[["hist","On appelait ces écoles les « maisons des tablettes ». Les élèves y apprenaient les signes de l’écriture, puis recopiaient des listes de mots, des proverbes et des récits. En mathématiques, ils utilisaient des tables de calcul et étudiaient des problèmes déjà résolus, comme les exemples corrigés d’un manuel : partager des rations, mesurer un champ, calculer un volume de terre."]]},

{ch:8,scene:"redstone",alt:"Des leviers reliés par des fils rouges à des lampes, l’une allumée, l’autre éteinte.",title:"Le premier circuit",b:[

/* ---------- découpage en mots (pour la lecture et le clic) ---------- */
const SPEAK_MAP={"→":",","—":"","÷":"divisé par","=":"égale","+":"plus"};
function tok(raw,prefix){
  prefix=prefix||"";
  const clean=raw.replace(/« /g,"« ").replace(/ ([»?!:;])/g," $1");
  let speech=prefix; const tokens=[]; let bold=false;
  clean.split("**").forEach((part,pi)=>{
    if(pi>0) bold=!bold;
    part.split(/( +)/).forEach(w=>{
      if(!w) return;
      if(/^ +$/.test(w)){tokens.push({sp:true}); speech+=" "; return;}
      const s=speech.length; speech+=(w in SPEAK_MAP?SPEAK_MAP[w]:w);
      tokens.push({t:w,bold,s,e:speech.length});
    });
  });
  return {speech,tokens};
}
function cleanWord(w){
  if(w in SPEAK_MAP) return SPEAK_MAP[w]==="," ? "" : SPEAK_MAP[w];
  return w.replace(/^[«»"“”'(\[—–\- ]+/,"").replace(/[«»"“”'’)\].,;:!?… ]+$/,"");
}
const MODEL=PAGES.map(pg=>{
  const segs=[{kind:"title",...tok(pg.title)}];
  pg.b.forEach(b=>{
    if(Array.isArray(b)) segs.push({kind:"chat",who:b[0],...tok(b[1],PEOPLE[b[0]].say+" : ")});
    else segs.push({kind:b.startsWith("—")?"dash":"p",...tok(b)});
  });
  if(pg.note) segs.push({kind:"note",label:pg.note[0],...tok(pg.note[1],"Le Codex d’Ilias, "+pg.note[0].toLowerCase()+". ")});
  (pg.real||[]).forEach((c,ci)=>segs.push({kind:"real",subj:c[0],...tok(c[1],ci===0?"Dans la vraie vie. ":"")}));
  return {...pg,segs};
});
const CH_START=[];MODEL.forEach((p,i)=>{if(CH_START[p.ch]===undefined)CH_START[p.ch]=i;});

function rng(seed){let s=seed>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(str){let x=2166136261;for(const c of str){x^=c.charCodeAt(0);x=Math.imul(x,16777619);}return x>>>0;}
function hex2rgb(hx){const n=parseInt(hx.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return"rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")";}

function painter(ctx,seed){
  const R=rng(seed), pick=a=>a[(R()*a.length)|0];
  const g={R,pick};
  g.r=(x,y,w,hh,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(hh));};
  g.p=(x,y,c)=>g.r(x,y,1,1,c);
  g.tex=(x,y,w,hh,cols)=>{for(let j=0;j<hh;j++)for(let i=0;i<w;i++)g.p(x+i,y+j,pick(cols));};
  g.sky=(a,b,hh)=>{hh=hh||H;for(let y=0;y<hh;y+=2)g.r(0,y,W,2,mix(a,b,y/hh));};
  g.alpha=(a,fn)=>{ctx.save();ctx.globalAlpha=a;fn();ctx.restore();};
  g.glow=(x,y,rad,c,a)=>g.alpha(a||.1,()=>{for(let k=rad;k>0;k-=2)g.r(x-k,y-k,2*k+1,2*k+1,c);});
  g.stars=(x,y,w,hh,n)=>{for(let i=0;i<n;i++)g.p(x+R()*w,y+R()*hh,R()<.7?"#ffffff":"#c9d4ff");};
  g.sun=(x,y,s,c1,c2)=>{g.r(x,y,s,s,c1||"#ffe48a");g.r(x+1,y+1,s-2,s-2,c2||"#fff4c2");};
  g.moon=(x,y)=>{g.r(x,y,5,5,"#e9edf5");g.p(x+1,y+1,"#c8cfdc");g.p(x+3,y+3,"#c8cfdc");g.p(x+3,y+1,"#d6dce8");};
  g.cloud=(x,y,w)=>{g.r(x,y,w,2,"#ffffff");g.r(x+2,y-1,w-5,1,"#ffffff");g.r(x+1,y+2,w-2,1,"#e9f2fb");};
  g.circle=(cx,cy,rad,c)=>{for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++)if(x*x+y*y<=rad*rad+rad*.8)g.p(cx+x,cy+y,c);};
  g.terrain=(base,amp,f,top,mid,low)=>{const ph=R()*6,ph2=R()*6,hs=[];
    for(let x=0;x<W;x++){const xx=Math.floor(x/2)*2;const y=Math.round(base+amp*Math.sin(xx*f+ph)+amp*.5*Math.sin(xx*f*2.7+ph2));hs.push(y);
      for(let yy=y;yy<H;yy++){const d=yy-y;g.p(x,yy,pick(d<1?top:d<4?mid:low));}}
    return hs;};
  g.flat=(y,top,mid,low)=>{g.tex(0,y,W,1,top);g.tex(0,y+1,W,3,mid);g.tex(0,y+4,W,H-y-4,low);return Array(W).fill(y);};
  g.gy=(hs,x,w)=>{w=w||4;return Math.min.apply(null,hs.slice(Math.max(0,x),Math.min(W,x+w)));};
  g.tree=(x,gy,type,leaf)=>{type=type||"oak";
    if(type==="oak"){const L=leaf||C.leaf;g.tex(x,gy-6,2,6,C.log);g.tex(x-3,gy-11,8,5,L);g.tex(x-2,gy-12,6,1,L);}
    else if(type==="spruce"){const L=leaf||C.spruce;g.tex(x,gy-8,2,8,C.log);[[0,2],[1,4],[2,6],[3,4],[4,6],[5,8],[6,8]].forEach(([j,w])=>g.tex(x+1-w/2,gy-15+j,w,1,L));}
    else if(type==="cactus"){g.tex(x,gy-7,2,7,C.cactus);g.tex(x+2,gy-5,1,2,C.cactus);g.p(x+2,gy-6,C.cactus[0]);}
  };
  g.avatar=(x,gy,o)=>{const a=Object.assign({},ILIAS,o||{});const top=gy-(a.sit?10:12);
    if(a.long){g.r(x-1,top,1,7,a.hair);g.r(x+4,top,1,7,a.hair);}
    g.r(x,top,4,4,a.skin);g.r(x,top,4,1,a.hair);g.p(x,top+1,a.hair);g.p(x+3,top+1,a.hair);
    if(a.glasses){g.r(x,top+2,4,1,"#111111");g.p(x+1,top+2,"#a8d8ff");g.p(x+2,top+2,"#a8d8ff");}
    else{g.p(x+1,top+2,"#1d1a2a");g.p(x+2,top+2,"#1d1a2a");}
    g.r(x,top+4,4,4,a.shirt);
    g.r(x+4,top+4,1,3,a.shirt);g.p(x+4,top+7,a.skin);
    if(a.raise){g.r(x-1,top-1,1,5,a.shirt);g.p(x-1,top-2,a.skin);}else{g.r(x-1,top+4,1,3,a.shirt);g.p(x-1,top+7,a.skin);}
    if(a.sit==="r")g.r(x,top+8,6,2,a.pants);
    else if(a.sit==="l")g.r(x-2,top+8,6,2,a.pants);
    else{g.r(x,top+8,4,3,a.pants);g.r(x,top+11,4,1,"#2a1f17");}
  };
  g.torch=(x,gy,red)=>{g.glow(x,gy-5,red?5:7,red?"#ff5a5a":"#ffd27a",.09);g.r(x,gy-3,1,3,"#6b5133");g.p(x,gy-4,red?"#ff2a2a":"#ffcc33");if(!red)g.p(x,gy-5,"#ff9a1e");};
  g.house=(x,gy,w,hh)=>{w=w||14;hh=hh||9;g.tex(x,gy-hh,w,hh,C.plank);g.tex(x,gy-hh,1,hh,C.log);g.tex(x+w-1,gy-hh,1,hh,C.log);
    g.r(x+Math.floor(w/2)-1,gy-4,2,4,"#3b2a1a");g.r(x+2,gy-hh+2,2,2,"#bfe3ff");g.r(x+w-4,gy-hh+2,2,2,"#bfe3ff");
    for(let i=0;;i++){const ww=w+2-2*i;if(ww<=0)break;g.tex(x-1+i,gy-hh-1-i,ww,1,C.roof);}};
  g.fence=(x1,x2,gy)=>{for(let x=x1;x<=x2;x+=5)g.r(x,gy-5,1,5,"#8a6640");g.r(x1,gy-4,x2-x1+1,1,"#8a6640");g.r(x1,gy-2,x2-x1+1,1,"#8a6640");};
  g.cow=(x,gy,small)=>{const bw=small?5:7,bh=small?3:4,top=gy-2-bh;
    g.r(x,top,bw,bh,"#f1efe9");g.r(x+1,top,2,2,"#2c2622");g.r(x+bw-3,top+bh-2,2,2,"#2c2622");

  g.bee=(x,y)=>{g.p(x,y,"#f2c230");g.p(x+1,y,"#2a2420");g.p(x,y-1,"#e8f4ff");};
  g.wheat=(x1,x2,y,skip)=>{g.tex(x1,y,x2-x1,2,C.farm);
    for(let x=x1;x<x2;x++){if(skip&&skip(x))continue;const hgt=2+((R()*4)|0);for(let k=1;k<=hgt;k++)g.p(x,y-k,pick(C.wheat));g.p(x,y-hgt-1,"#f0d873");}};
  g.emerald=(x,y)=>{g.p(x+1,y,"#2ecc71");g.r(x,y+1,3,2,"#2ecc71");g.p(x+1,y+3,"#1e9e55");g.p(x+1,y+1,"#a8f5c8");};
  g.diamond=(x,y)=>{g.r(x+1,y,2,1,"#9ff3f5");g.r(x,y+1,4,1,"#4fd8de");g.r(x+1,y+2,2,1,"#2fb6c0");};
  g.ingot=(x,y)=>{g.r(x,y,5,2,"#c4c4ca");g.r(x+1,y,3,1,"#eeeef2");};
  g.monitor=(x,y,w,hh,screen)=>{g.r(x+w/2-2,y+hh,4,3,"#2a2a30");g.r(x+w/2-6,y+hh+3,12,1,"#2a2a30");g.r(x,y,w,hh,"#2a2a30");g.r(x+2,y+2,w-4,hh-4,screen);};
  g.txt=(s,x,y,c,sc)=>{sc=sc||1;let cx=x;for(const ch of s){if(ch===" "){cx+=2*sc;continue;}const f=FONT[ch];
    if(f)f.forEach((row,j)=>row.split("").forEach((b,i)=>{if(b==="1")g.r(cx+i*sc,y+j*sc,sc,sc,c);}));cx+=4*sc;}};
  g.bubble=(x,y,w,hh,ch)=>{g.r(x,y,w,hh,"#1d2416");g.r(x+1,y+1,w-2,hh-2,"#ffffff");g.r(x+2,y+hh,2,1,"#1d2416");g.p(x+2,y+hh+1,"#1d2416");
    if(ch)g.txt(ch,x+Math.floor((w-3)/2),y+Math.floor((hh-5)/2),"#1d2416");};
  g.bricks=(x,y,w,hh,cols,line)=>{g.tex(x,y,w,hh,cols);for(let j=y;j<y+hh;j+=4){g.r(x,j,w,1,line);for(let i=x+(((j-y)/4)%2?0:3);i<x+w;i+=6)g.r(i,j,1,4,line);}};
  g.lever=(x,yy,on)=>{g.r(x,yy-2,4,2,"#7b7b7b");if(on){g.p(x+2,yy-3,"#6b5133");g.p(x+3,yy-4,"#6b5133");g.p(x+3,yy-5,"#8a6640");}else{g.p(x+1,yy-3,"#6b5133");g.p(x,yy-4,"#6b5133");g.p(x,yy-5,"#8a6640");}};

  return g;
}

            h("button",{key:k,className:"btn","aria-pressed":set.size===k?"true":"false","aria-label":lab,onClick:()=>upd({size:k}),style:{fontSize:(0.85+i*0.2)+"rem"}},t)))),
        h("label",{className:"check"},h("input",{id:"hl",type:"checkbox",checked:set.highlight,onChange:e=>upd({highlight:e.target.checked})}),
          h("span",null,"Surligner le mot lu",h("small",null,"Certaines voix en ligne ne le permettent pas : c’est alors la phrase qui est surlignée."))),
        h("label",{className:"check"},h("input",{id:"cw",type:"checkbox",checked:set.clickWord,onChange:e=>upd({clickWord:e.target.checked})}),
          h("span",null,"Lire un mot quand on clique dessus")),
        h("label",{className:"check"},h("input",{id:"an",type:"checkbox",checked:set.autoNext,onChange:e=>upd({autoNext:e.target.checked})}),
          h("span",null,"Enchaîner les pages",h("small",null,"À la fin d’une page, la lecture passe toute seule à la suivante."))),
        h("p",{className:"note"},"La voix est gratuite : elle utilise la synthèse vocale de ton navigateur. Le choix des voix dépend de l’appareil. Sur ordinateur, Edge et Chrome en proposent souvent davantage."));
    }
    overlay=h("div",{className:"overlay",onClick:e=>{if(e.target===e.currentTarget)setPanel(null);}},
      h("div",{className:"panel",role:"dialog","aria-modal":"true","aria-labelledby":"ptitle",tabIndex:-1,ref:panelRef},body));
  }

  return h("div",{className:"app"},header,main,bottom,overlay);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
