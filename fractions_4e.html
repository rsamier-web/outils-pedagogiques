<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les fractions — 4e</title>
<meta name="description" content="Comprendre, mémoriser et utiliser les fractions en 4e : écritures, comparaison, opérations, priorités, problèmes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Fenêtre KDE Breeze : barre de titre, panneau latéral « Chapitres », vue principale à onglets */
:root{
  --window:#eff0f1; --view:#fcfcfc; --header:#e3e5e7; --alt:#f4f5f6; --btn:#f7f8f8; --field:#ffffff;
  --text:#232629; --muted:#5b646d; --border:#c2c7cb; --line:#dde0e3; --hover:rgba(61,174,233,.09);
  --accent:#3daee9; --accent-ink:#1a6c9c; --accent-soft:rgba(61,174,233,.15);
  --good:#1e8a4f; --good-soft:rgba(39,174,96,.11); --bad:#c0364a; --bad-soft:rgba(218,68,83,.09);
  --warn:#b85900; --warn-soft:rgba(246,116,0,.11);
  /* une couleur fixe par nombre premier (signalement) */
  --p2:#1d6fb8; --p3:#c25e00; --p5:#1e8a4f; --p7:#8a3fb0; --p11:#b8344a; --p13:#13808a; --pX:#5b646d;
  --setN:#1d6fb8; --setZ:#13808a; --setD:#8a3fb0; --setQ:#c25e00;
  --font:"Noto Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --window:#232629; --view:#1b1e20; --header:#2a2e32; --alt:#202326; --btn:#2c3136; --field:#141618;
  --text:#eff0f1; --muted:#a2aab2; --border:#434a51; --line:#33383d; --hover:rgba(61,174,233,.11);
  --accent:#3daee9; --accent-ink:#72c6f0; --accent-soft:rgba(61,174,233,.2);
  --good:#41c77f; --good-soft:rgba(39,174,96,.16); --bad:#f26b7d; --bad-soft:rgba(218,68,83,.16);
  --warn:#ff9d45; --warn-soft:rgba(246,116,0,.16);
  --p2:#6cb8f0; --p3:#ff9d45; --p5:#41c77f; --p7:#c690e6; --p11:#f26b7d; --p13:#4fd1d9; --pX:#a2aab2;
  --setN:#6cb8f0; --setZ:#4fd1d9; --setD:#c690e6; --setQ:#ff9d45;
  color-scheme:dark }}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{margin:0;background:var(--window);color:var(--text);font-family:var(--font);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{font-size:15px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
.app.big{font-size:18px;line-height:1.75;letter-spacing:.015em;word-spacing:.06em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
h2,h3,h4{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
b{font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
sup{font-size:.7em;line-height:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* Écriture mathématique */
.mx{font-variant-numeric:tabular-nums;white-space:normal}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.15}
.fr>span{padding:0 .2em;white-space:nowrap}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding-bottom:.08em}
.fr>span:last-child{padding-top:.08em}
.c-a{color:var(--accent-ink);font-weight:600}.c-g{color:var(--good);font-weight:600}.c-b{color:var(--bad);font-weight:600}.c-w{color:var(--warn);font-weight:600}
.c-m{color:var(--muted)}
.c-2{color:var(--p2);font-weight:600}.c-3{color:var(--p3);font-weight:600}.c-5{color:var(--p5);font-weight:600}.c-7{color:var(--p7);font-weight:600}.c-11{color:var(--p11);font-weight:600}.c-13{color:var(--p13);font-weight:600}
.c-s{text-decoration:line-through;text-decoration-thickness:2px;opacity:.5}
.strike{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.big-mx{font-size:1.2em}

/* Barre de titre */
.titlebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:.7em;padding:.4em 16px;background:var(--header);border-bottom:1px solid var(--border);min-height:46px}
.titlebar svg{flex:none}
.tb-name{font-weight:600}
.tb-sub{color:var(--muted);font-size:.87em}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:.55em;font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.switch{display:inline-flex;align-items:center;gap:.45em;font-size:.87em;cursor:pointer;background:none;border:0;padding:.3em .2em}
.switch .track{width:30px;height:16px;border-radius:8px;border:1px solid var(--border);background:var(--field);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .track{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(14px);background:var(--accent)}

/* Structure */
.layout{flex:1;display:grid;grid-template-columns:240px minmax(0,1fr)}
.sidebar{border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side-cap{font-size:.74em;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.5em .75em .35em}
.side-item{display:flex;align-items:center;gap:.65em;width:100%;padding:.45em .7em;border:1px solid transparent;border-radius:4px;background:none;text-align:left;cursor:pointer}
.side-item:hover{background:var(--hover)}
.side-item[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.side-item .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:4px;font-size:.78em;font-weight:700;color:var(--muted);border:1px solid var(--border);background:var(--field)}
.side-item[aria-current="page"] .ic{color:var(--accent-ink);border-color:var(--accent)}
.side-item .cnt{margin-left:auto;font-size:.8em;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:1em .5em .3em;display:grid;gap:.4em;font-size:.85em}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;text-align:left}
.main{background:var(--view);min-width:0;display:flex;flex-direction:column}
.wrap{max-width:900px;width:100%;margin:0 auto;padding-inline:28px}
.mod-head{padding-block:1.5em 1em}
.mod-head h2{font-size:1.5em;font-weight:600}
.mod-head p{color:var(--muted);margin-top:.25em;max-width:64ch}
.tabs-bar{border-bottom:1px solid var(--border);background:var(--view);position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:5}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;padding:.6em 1em;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:.45em}
.tab:hover{color:var(--text);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab .tn{font-size:.75em;width:1.6em;height:1.6em;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-weight:600}
.page{padding-block:1.6em 4em;display:grid;gap:1.4em}
.lead{color:var(--muted);font-size:.93em;max-width:66ch}

/* Cadres */
.frame{background:var(--view);border:1px solid var(--line);border-radius:5px;padding:1em 1.1em}
.sec{display:grid;gap:.75em}
.sec h3{font-size:1.12em;font-weight:600;display:flex;gap:.55em;align-items:baseline}
.sec h3 .sn{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.sec p{max-width:68ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.8em}
.two>.frame{display:grid;gap:.45em;align-content:start;background:var(--alt)}
.two h4{font-size:.98em;font-weight:600}
.ex{font-size:1.12em;font-variant-numeric:tabular-nums;padding:.4em .75em;background:var(--alt);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;justify-self:start;line-height:1.9}
.two .ex{background:var(--view)}
.keep{border:1px solid var(--accent);background:var(--accent-soft);border-radius:5px;padding:.9em 1.1em;display:grid;gap:.5em}
.keep h4{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.keep ul,.plain{margin:0;padding-left:1.2em;display:grid;gap:.35em}
.trap{border:1px solid var(--warn);background:var(--warn-soft);border-radius:5px;padding:.8em 1.1em;display:grid;gap:.4em}
.trap h4{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
.steps{margin:0;padding-left:1.5em;display:grid;gap:.5em}
.steps li{padding-left:.2em}
.steps li::marker{color:var(--accent-ink);font-weight:600}
table.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:.35em .8em;text-align:center}
table.tbl th{background:var(--alt);font-weight:600}
.scroll-x{overflow-x:auto}

/* Boutons, champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.35em .95em;border:1px solid var(--border);border-radius:3px;background:var(--btn);cursor:pointer;min-height:2.2em}
.btn:hover{border-color:var(--accent)}
.btn.primary{border-color:var(--accent);background:var(--accent-soft)}
.btn.small{min-height:1.9em;padding:.2em .7em;font-size:.88em}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{border-color:var(--good);background:var(--good-soft)}
.btn.ko{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.field{padding:.35em .6em;border:1px solid var(--border);border-radius:3px;background:var(--field);width:8em;min-height:2.2em;font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.field.sm{width:4.2em;text-align:center;padding:.15em .3em;min-height:1.9em}
.field.wide{width:16em}
.field.okf{border-color:var(--good);background:var(--good-soft)}
.field.kof{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--btn);padding:.35em .9em;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.ctrl{display:grid;gap:.15em}
.ctrl label{font-size:.88em;color:var(--muted);display:flex;justify-content:space-between;gap:1em}
.ctrl output{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:.45em;padding:.3em .75em;border:1px solid var(--border);border-radius:3px;background:var(--btn);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}

/* Messages */
.msg{border-radius:4px;padding:.55em .85em;border:1px solid;display:grid;gap:.25em}
.msg.ok{border-color:var(--good);background:var(--good-soft)}
.msg.ko{border-color:var(--bad);background:var(--bad-soft)}
.msg.info{border-color:var(--accent);background:var(--accent-soft)}
.msg.warn{border-color:var(--warn);background:var(--warn-soft)}

/* Familles d'exercices */
.fam{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.fam-head{display:flex;align-items:center;gap:.7em;padding:.7em 1em;background:var(--alt);border-bottom:1px solid var(--line)}
.fam-head h3{font-size:1.05em;font-weight:600}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:7px;height:12px;border-radius:2px;background:var(--line);display:block}
.lvl i.on{background:var(--accent)}
.fam-body{padding:1em;display:grid;gap:1em}
.worked{border:1px dashed var(--accent);border-radius:5px;padding:.9em 1em;display:grid;gap:.6em;background:var(--accent-soft)}
.worked .tag,.exo .tag{font-size:.74em;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink)}
.exo{border:1px solid var(--line);border-radius:5px;padding:.9em 1em;display:grid;gap:.7em}
.exo.done{border-color:var(--good)}
.exo .tag{color:var(--muted)}
.exo.done .tag{color:var(--good)}
.exo-q{line-height:2}
.corr{border-top:1px solid var(--line);padding-top:.7em;display:grid;gap:.5em}
.corr h4{font-size:.85em;color:var(--muted);font-weight:600}
.hint{font-size:.93em;color:var(--muted);border-left:3px solid var(--line);padding-left:.7em}
.choices{display:flex;flex-wrap:wrap;gap:.5em}
.order-pool,.order-out{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;min-height:2.8em}
.order-out{border:1px dashed var(--border);border-radius:4px;padding:.4em .6em;background:var(--alt)}
.token{border:1px solid var(--border);border-radius:4px;background:var(--btn);padding:.15em .6em;cursor:pointer;line-height:1.9}
.token:hover{border-color:var(--accent)}
.token.used{opacity:.35;cursor:default}
.sym{color:var(--muted);padding:0 .1em}

/* Pyramide */
.pyr{display:grid;gap:4px;justify-items:center;padding:.5em 0}
.pyr-row{display:flex;gap:4px}
.pyr-cell{width:7.2em;min-height:3.6em;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;background:var(--alt);padding:.2em}
.pyr-cell.base{background:var(--view)}
.pyr-cell input{width:5.8em}

/* Quiz */
.quiz-q{display:grid;gap:.7em}
.quiz-opts{display:grid;gap:.45em}
.quiz-opt{text-align:left;padding:.55em .9em;border:1px solid var(--border);border-radius:4px;background:var(--btn);cursor:pointer;line-height:1.9}
.quiz-opt:hover:not(:disabled){border-color:var(--accent)}
.quiz-opt.ok{border-color:var(--good);background:var(--good-soft)}
.quiz-opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.quiz-opt:disabled{cursor:default}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--good)}.dots i.ko{background:var(--bad)}.dots i.cur{outline:2px solid var(--accent);outline-offset:1px}

/* Labos */
.lab{display:grid;gap:.9em}
.lab-head{display:flex;flex-wrap:wrap;gap:.6em 1em;align-items:center}
.svgbox{width:100%;overflow-x:auto}
.svgbox svg{display:block;max-width:100%;height:auto}
.sieve{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:520px}
.sieve button{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;background:var(--view);cursor:pointer;font-variant-numeric:tabular-nums;font-size:.9em;padding:0}
.sieve button.out{color:var(--muted);background:var(--alt);text-decoration:line-through;opacity:.6}
.sieve button.prime{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.sieve button.one{color:var(--muted);background:var(--alt)}
.ladder{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:1.1em}
.ladder td{padding:.2em .8em;text-align:right}
.ladder td:first-child{border-right:2px solid var(--text)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:2em;padding:.05em .45em;border-radius:4px;border:1.5px solid currentColor;font-weight:600;cursor:pointer;background:var(--view);margin:.1em}
.chip.gone{opacity:.35;text-decoration:line-through;cursor:default}
.chip.static{cursor:default}
.dotgrid{display:inline-grid;gap:4px;padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--alt)}
.dotgrid i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:block}
.rects{display:flex;flex-wrap:wrap;gap:1em;align-items:flex-start}
.rects figure{margin:0;display:grid;gap:.3em;justify-items:center;font-size:.88em;color:var(--muted)}
.fbar{display:flex;height:34px;border:1.5px solid var(--text);border-radius:2px;overflow:hidden}
.fbar span{flex:1;border-right:1px solid var(--border)}
.fbar span:last-child{border-right:0}
.fbar span.on{background:var(--accent-soft)}
.fbar span.on.k{background:rgba(61,174,233,.32)}
.bars{display:grid;gap:.55em}
.bars .lbl{font-size:.95em}
.mult-list{display:flex;flex-wrap:wrap;gap:.3em;align-items:center}
.mult-list span{border:1px solid var(--line);border-radius:3px;padding:0 .45em;font-variant-numeric:tabular-nums}
.mult-list span.hit{border-color:var(--good);background:var(--good-soft);font-weight:700}

/* Cartes mémoire */
.card{border:1px solid var(--border);border-radius:6px;min-height:12em;padding:1.4em;display:grid;place-items:center;text-align:center;background:var(--view);cursor:pointer;font-size:1.08em;line-height:1.9}
.card.back{background:var(--accent-soft);border-color:var(--accent)}
.card-meta{font-size:.85em;color:var(--muted)}
.next-row{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:1em;gap:.5em}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .sidebar{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px 16px;gap:6px;background:var(--window)}
  .side-cap,.side-foot{display:none}
  .side-item{flex:none;width:auto}
  .side-item .cnt{display:none}
  .wrap{padding-inline:16px}
  .tb-sub{display:none}
  .bar{width:56px}
  .tabs-bar{position:static}
  .pyr-cell{width:5.6em}
  .pyr-cell input{width:4.6em}
}

/* ---------- Ajouts propres à l'outil « Fractions 4e » ---------- */
.fbar span.on{background:rgba(61,174,233,.38)}
.fbar.t-w span.on{background:rgba(246,116,0,.32)}
.fbar.t-g span.on{background:rgba(39,174,96,.32)}
.fbar span.minor{border-right:1px dashed var(--border)}
.fbar span.major{border-right:1.5px solid var(--text)}
.fbar span:last-child{border-right:0}
.fbars{display:flex;gap:6px;flex-wrap:wrap}
.fbars>.fbar{flex:1 1 160px;min-width:120px}
.barrow{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:.8em;align-items:center}
.barrow .lbl{text-align:right}
.anat{display:flex;align-items:center;gap:1.4em;flex-wrap:wrap}
.anat .bigf{font-size:2.3em}
.anat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3em .9em;align-items:baseline}
.anat dt{font-weight:600}
.anat dd{margin:0;color:var(--muted)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:.6em}
.gloss .frame{background:var(--alt);display:grid;gap:.3em;align-content:start}
.gloss h4{font-size:.98em;font-weight:600;color:var(--accent-ink)}
.cc{display:flex;flex-wrap:wrap;gap:.4em 1.3em;font-size:.92em;align-items:center}
.cc .muted{font-size:.95em}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(100%,240px);flex:none}
.grid100 i{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;background:var(--view);display:block}
.grid100 i.on{background:var(--accent);border-color:var(--accent)}
.labgrid{display:flex;flex-wrap:wrap;gap:1.2em;align-items:flex-start}
.labgrid>div{flex:1 1 220px;min-width:0;display:grid;gap:.6em;align-content:start}
.expr{font-size:1.25em;line-height:2.5;display:flex;flex-wrap:wrap;align-items:center;column-gap:.25em}
.opbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;min-width:1.9em;padding:0 .4em;cursor:pointer;font:inherit;font-weight:600;line-height:1.7}
.opbtn:hover{background:rgba(61,174,233,.3)}

</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
"use strict";
const { useState, useEffect, useMemo, Fragment } = React;
const html = htm.bind(React.createElement);

/* ---------- Stockage local (facultatif) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("frac4e:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("frac4e:" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Arithmétique des fractions ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
function R(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; }
const add = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
const sub = (a, b) => R(a.n * b.d - b.n * a.d, a.d * b.d);
const mul = (a, b) => R(a.n * b.n, a.d * b.d);
const div = (a, b) => R(a.n * b.d, a.d * b.n);
const cmp = (a, b) => Math.sign(a.n * b.d - b.n * a.d);
const eqR = (a, b) => a.n === b.n && a.d === b.d;
const isDecR = a => { let d = a.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; };
const val = r => r.n / r.d;
const neg = x => (x < 0 ? "−" + Math.abs(x) : String(x));                 // vrai signe moins
const dec = x => neg(+x.toFixed(10)).replace(".", ",");                      // décimal à la française
const fr = (n, d) => `[[${neg(n)}~${neg(d)}]]`;                              // quotient tel qu'il est écrit
const fn = (n, d) => d === 1 ? neg(n) : `[[${neg(n)}~${d}]]`;               // signe au numérateur
const fm = r => r.d === 1 ? neg(r.n) : (r.n < 0 ? "−" : "") + `[[${Math.abs(r.n)}~${r.d}]]`; // forme réduite, signe devant
const nice = r => isDecR(r) && r.d !== 1 && r.d <= 1000 ? dec(val(r)) : fm(r);           // décimal si possible

/* ---------- Lecture de ce que tape l'élève ---------- */
const clean = s => String(s).replace(/[−–—]/g, "-").replace(/\s+/g, "").replace(/,/g, ".").replace(/[÷:]/g, "/").replace(/%$/, "");
function parseDec(t) {
  t = t.replace(/^\((.*)\)$/, "$1");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const sgn = t.startsWith("-") ? -1 : 1; t = t.replace(/^[+-]/, "");
  const [i, f = ""] = t.split(".");
  return { n: sgn * parseInt((i || "0") + f, 10), d: Math.pow(10, f.length), int: f.length === 0 };
}
function parseInput(s) {
  let t = clean(s); if (!t) return null;
  let sg = 1;
  const mm = t.match(/^-\((.*)\)$/); if (mm) { sg = -1; t = mm[1]; }
  const parts = t.replace(/^\((.*)\)$/, "$1").split("/");
  if (parts.length > 2) return null;
  const a = parseDec(parts[0]); if (!a) return null;
  if (sg < 0) a.n = -a.n;
  if (parts.length === 1) return { r: R(a.n, a.d), frac: false, a };
  const b = parseDec(parts[1]); if (!b || b.n === 0) return null;
  return { r: div(R(a.n, a.d), R(b.n, b.d)), frac: true, a, b };
}
/* Vérifie une fraction. opt.irr : forme irréductible exigée */
function checkFrac(input, ans, opt = {}) {
  const p = parseInput(input);
  if (!p) return { st: "ko", msg: "Je ne comprends pas cette écriture. Exemples acceptés : -7/12   ou   5   ou   2,5" };
  if (!eqR(p.r, ans)) return { st: "ko", msg: "Ce n'est pas la bonne valeur. Utilise l'indice ou refais le calcul étape par étape." };
  if (opt.irr) {
    if (p.frac) {
      if (!p.a.int || !p.b.int) return { st: "part", msg: "La valeur est juste, mais écris une fraction avec des nombres entiers (sans virgule)." };
      if (p.b.n < 0) return { st: "part", msg: "La valeur est juste. Écris maintenant le dénominateur positif : le signe « − » va au numérateur." };
      if (gcd(p.a.n, p.b.n) !== 1) return { st: "part", msg: `La valeur est juste, mais la fraction n'est pas irréductible : ${Math.abs(p.a.n)} et ${p.b.n} se divisent encore par ${gcd(p.a.n, p.b.n)}.` };
    } else if (!p.a.int && ans.d !== 1) {
      return { st: "part", msg: "La valeur est juste, mais on attend une fraction irréductible plutôt qu'un nombre décimal." };
    }
  }
  return { st: "ok", msg: "Bravo, c'est juste !" };
}

/* ---------- Mini-langage d'écriture mathématique ----------
   [[a~b]] fraction    {{c:texte}} couleur (a bleu, b rouge, w orange, g vert, m gris, s barré)
   **texte** gras      ^n exposant      #0 #1 case à compléter */
const RE = /\[\[(.*?)~(.*?)\]\]|\{\{(\w+):(.*?)\}\}|\*\*(.*?)\*\*|\^(\d+)|#(\d)/g;
function parse(s, ctx, kp = "k") {
  const out = []; let last = 0, m, i = 0;
  const str = String(s);
  const re = new RegExp(RE.source, "g");
  while ((m = re.exec(str))) {
    if (m.index > last) out.push(str.slice(last, m.index));
    const k = kp + "-" + (i++);
    if (m[1] !== undefined) out.push(html`<span className="fr" key=${k}><span>${parse(m[1], ctx, k + "n")}</span><span>${parse(m[2], ctx, k + "d")}</span></span>`);
    else if (m[3] !== undefined) out.push(html`<span className=${"c-" + m[3]} key=${k}>${parse(m[4], ctx, k + "c")}</span>`);
    else if (m[5] !== undefined) out.push(html`<b key=${k}>${parse(m[5], ctx, k + "b")}</b>`);
    else if (m[6] !== undefined) out.push(html`<sup key=${k}>${m[6]}</sup>`);
    else if (m[7] !== undefined) out.push(ctx && ctx.blank ? html`<${Fragment} key=${k}>${ctx.blank(+m[7])}</${Fragment}>` : "…");
    last = re.lastIndex;
  }
  if (last < str.length) out.push(str.slice(last));
  return out;
}
const m = (s, cls = "") => html`<span className=${"mx " + cls}>${parse(s)}</span>`;

/* ---------- Lecture à voix haute (principe de modalité, facultatif) ---------- */
const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
const speakable = s => String(s)
  .replace(/\[\[(.*?)~(.*?)\]\]/g, " $1 sur $2 ")
  .replace(/\{\{\w+:(.*?)\}\}/g, "$1").replace(/\*\*/g, "").replace(/#\d/g, " … ")
  .replace(/−/g, " moins ").replace(/×/g, " fois ").replace(/÷/g, " divisé par ").replace(/=/g, " égale ")
  .replace(/</g, " est plus petit que ").replace(/>/g, " est plus grand que ").replace(/≠/g, " n'est pas égal à ")
  .replace(/→/g, ", ").replace(/%/g, " pour cent").replace(/\(/g, " ").replace(/\)/g, " ");
function speak(s) { try { const u = new SpeechSynthesisUtterance(speakable(s)); u.lang = "fr-FR"; u.rate = 0.92; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {} }

/* ---------- Termes écrits comme dans les manuels ----------
   "a/b" fraction (signes laissés en place), "-(a/b)" signe devant, "n" entier */
function T(spec) {
  const s = String(spec).replace(/\s+/g, "").replace(/[−–]/g, "-");
  let mm;
  if ((mm = s.match(/^-\((-?\d+)\/(-?\d+)\)$/))) {
    const n = +mm[1], d = +mm[2];
    return { v: R(-n, d), s: "−" + fr(n, d), lead: true, rn: -(d < 0 ? -n : n), rd: Math.abs(d) };
  }
  if ((mm = s.match(/^(-?\d+)\/(-?\d+)$/))) {
    const n = +mm[1], d = +mm[2];
    return { v: R(n, d), s: fr(n, d), lead: false, rn: d < 0 ? -n : n, rd: Math.abs(d) };
  }
  if ((mm = s.match(/^(-?\d+)$/))) { const n = +mm[1]; return { v: R(n), s: neg(n), lead: n < 0, rn: n, rd: 1 }; }
  throw new Error("Terme illisible : " + spec);
}
const Tv = v => ({ v, s: fm(v), lead: v.n < 0, rn: v.n, rd: v.d });
const wrap = t => t.lead ? "(" + t.s + ")" : t.s;
const inv = t => Tv(R(t.v.d, t.v.n));

/* Expressions : termes entre accolades, opérateurs + − × ÷, parenthèses.
   ex. "{-(2/3)} + {5/6} × {4/5} − {1/2}" */
function parseExpr(src) {
  const toks = src.match(/\{[^}]+\}|[()+\-−×÷*:]/g).map(t => t === "*" ? "×" : t === ":" ? "÷" : t === "-" ? "−" : t);
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  function prim() { const t = next(); if (t === "(") { const e = sum(); next(); return { ...e, par: true }; } return { t: "n", term: T(t.slice(1, -1)) }; }
  function prod() { let a = prim(); while (peek() === "×" || peek() === "÷") { const op = next(); a = { t: "o", op, a, b: prim() }; } return a; }
  function sum() { let a = prod(); while (peek() === "+" || peek() === "−") { const op = next(); a = { t: "o", op, a, b: prod() }; } return a; }
  return sum();
}
function render(n, first = true) {
  if (n.t === "n") return !first && n.term.lead ? "(" + n.term.s + ")" : n.term.s;
  const inner = `${render(n.a, n.par ? true : first)} ${n.op} ${render(n.b, false)}`;
  return n.par ? "(" + inner + ")" : inner;
}
const OPF = { "+": add, "−": sub, "×": mul, "÷": div };
const evalT = n => n.t === "n" ? n.term.v : OPF[n.op](evalT(n.a), evalT(n.b));
const anyNode = (n, f) => f(n) || (n.t === "o" && (anyNode(n.a, f) || anyNode(n.b, f)));
const hasPar = n => anyNode(n, x => x.t === "o" && x.par);
const hasAddSub = n => anyNode(n, x => x.t === "o" && (x.op === "+" || x.op === "−"));
const onlyOps = (n, ops) => !anyNode(n, x => x.t === "o" && !ops.includes(x.op));
function flat(n) { if (n.t === "n") return { ts: [n.term], os: [] }; const A = flat(n.a), B = flat(n.b); return { ts: [...A.ts, ...B.ts], os: [...A.os, n.op, ...B.os] }; }
function comps(n, p = []) { if (n.t === "n") return []; const here = n.a.t === "n" && n.b.t === "n" ? [{ p, n }] : []; return [...comps(n.a, [...p, "a"]), ...here, ...comps(n.b, [...p, "b"])]; }
function pickNext(t) { const cs = comps(t); return cs.find(c => c.n.par) || cs.find(c => c.n.op === "×" || c.n.op === "÷") || cs[0]; }
const getAt = (t, p) => p.reduce((x, k) => x[k], t);
const setAt = (t, p, leaf) => p.length === 0 ? leaf : { ...t, [p[0]]: setAt(t[p[0]], p.slice(1), leaf) };

/* ---------- Corrections détaillées générées automatiquement ---------- */
const prodTxt = (sg, A, B) => B.length ? `${sg}[[${A.join(" × ")}~${B.join(" × ")}]]` : `${sg}${A.join(" × ")}`;

/* Une seule opération : la ligne de calcul */
function opLine(a, op, b) {
  let res, line = `${a.s} ${op} ${wrap(b)} = `;
  if (op === "+" || op === "−") {
    res = op === "+" ? add(a.v, b.v) : sub(a.v, b.v);
    const D = lcm(a.rd, b.rd), n1 = a.rn * D / a.rd, n2 = b.rn * D / b.rd, N = op === "+" ? n1 + n2 : n1 - n2;
    if (D === 1) line += neg(N);
    else if (a.v.n === 0 || b.v.n === 0) line += fm(res);
    else {
      if (a.rd !== D || b.rd !== D) line += `${fn(n1, D)} ${op} ${fn(n2, D)} = `;
      line += fn(N, D);
      if (N === 0) line += " = 0"; else if (gcd(N, D) > 1 || N < 0) line += ` = ${fm(res)}`;
    }
  } else {
    let B = b;
    if (op === "÷") { B = inv(b); line += `${a.s} × ${wrap(B)} = `; }
    res = mul(a.v, B.v);
    if (res.n === 0) line += "0";
    else {
      const sg = res.n < 0 ? "−" : "";
      const A2 = [Math.abs(a.rn), Math.abs(B.rn)], D2 = [a.rd, B.rd].filter(x => x !== 1);
      line += prodTxt(sg, A2, D2);
      const raw = prodTxt(sg, [A2[0] * A2[1]], D2.length ? [D2.reduce((x, y) => x * y, 1)] : []);
      line += " = " + raw;
      if (fm(res) !== raw) line += " = " + fm(res);
    }
  }
  return { res, line };
}

/* Somme algébrique : tout au même dénominateur */
function sumSteps(ts, os) {
  const st = [];
  const w = ts.map((t, i) => ({ n: i && os[i - 1] === "−" ? -t.rn : t.rn, d: t.rd }));
  const changed = os.includes("−") || ts.some(t => t.s !== fn(t.rn, t.rd));
  const sumTxt = arr => arr.map((x, i) => (i ? " + " : "") + fn(x.n, x.d)).join("");
  if (changed) st.push(`On transforme les soustractions en additions de l'opposé et on place chaque signe {{b:−}} au numérateur (dénominateurs positifs) : ${sumTxt(w)}`);
  const dens = [...new Set(w.map(x => x.d))];
  const D = dens.reduce(lcm, 1);
  let w2 = w;
  if (dens.length === 1) st.push(D === 1 ? "Ce sont des nombres entiers." : `Les dénominateurs sont tous égaux à ${D} : on peut additionner directement les numérateurs.`);
  else {
    st.push(`Dénominateur commun : **${D}**, le plus petit multiple commun de ${dens.slice(0, -1).join(", ")} et ${dens[dens.length - 1]}.`);
    st.push(`On transforme chaque fraction (même nombre en haut et en bas) : ${w.map((x, i) => (i ? " + " : "") + (x.d === D ? fn(x.n, D) : x.d === 1 ? `[[${neg(x.n)} × {{a:${D}}}~{{a:${D}}}]]` : `[[${neg(x.n)} × {{a:${D / x.d}}}~${x.d} × {{a:${D / x.d}}}]]`)).join("")} = ${sumTxt(w.map(x => ({ n: x.n * D / x.d, d: D })))}`);
    w2 = w.map(x => ({ n: x.n * D / x.d, d: D }));
  }
  const N = w2.reduce((s, x) => s + x.n, 0);
  if (ts.length > 1) st.push(D === 1 ? `${w2.map((x, i) => (i ? " + " : "") + (i && x.n < 0 ? "(" + neg(x.n) + ")" : neg(x.n))).join("")} = ${neg(N)}`
    : `On additionne les numérateurs et on garde le dénominateur : [[${w2.map((x, i) => (i ? " + " : "") + (i && x.n < 0 ? "(" + neg(x.n) + ")" : neg(x.n))).join("")}~${D}]] = ${fn(N, D)}`);
  if (D > 1) {
    if (N === 0) st.push("Le numérateur est nul : le résultat est 0.");
    else if (gcd(N, D) > 1) st.push(`On simplifie par ${gcd(N, D)} : ${fn(N, D)} = ${fm(R(N, D))}`);
    else st.push(`${Math.abs(N)} et ${D} n'ont pas de diviseur commun : la fraction est irréductible. Résultat : ${fm(R(N, D))}`);
  }
  return st;
}

/* Produit : signe, un seul quotient, simplification avant de calculer */
function prodSteps(ts, pre = []) {
  const st = [...pre];
  if (ts.some(t => t.v.n === 0)) { st.push("Un des facteurs est égal à 0 : **le produit est nul**, inutile de calculer le reste !"); return st; }
  const k = ts.filter(t => t.v.n < 0).length, sg = k % 2 ? "−" : "";
  st.push(k === 0 ? "Signe : aucun facteur négatif, le produit est {{g:positif}}."
    : `Signe : ${k} facteur${k > 1 ? "s" : ""} négatif${k > 1 ? "s" : ""}, c'est un nombre ${k % 2 ? "impair" : "pair"} de signes {{b:−}} : le produit est ${k % 2 ? "{{b:négatif}}" : "{{g:positif}}"}.`);
  const A = ts.map(t => Math.abs(t.rn)), B = ts.map(t => t.rd).filter(x => x !== 1);
  st.push(`On multiplie les numérateurs entre eux et les dénominateurs entre eux : ${prodTxt(sg, A, B)}`);
  const pairs = []; let ch = true;
  while (ch) { ch = false; for (let i = 0; i < A.length; i++) for (let j = 0; j < B.length; j++) { const g = gcd(A[i], B[j]); if (g > 1) { pairs.push([A[i], B[j], g]); A[i] /= g; B[j] /= g; ch = true; } } }
  const A2 = A.filter(x => x !== 1), B2 = B.filter(x => x !== 1);
  const res = ts.reduce((p, t) => mul(p, t.v), R(1));
  if (pairs.length) st.push(`On simplifie **avant** de calculer : ${pairs.map(([a, b, g]) => `{{w:${a}}} et {{w:${b}}} se divisent par ${g}`).join(" ; ")}. Il reste ${prodTxt(sg, A2.length ? A2 : [1], B2)}`);
  else if (B.length) st.push("Pas de facteur commun entre le haut et le bas : on calcule directement.");
  st.push(`On calcule : ${fm(res)}`);
  return st;
}
function divSteps(a, b) {
  const ib = inv(b);
  return prodSteps([a, ib], [`Diviser par ${wrap(b)}, c'est multiplier par son **inverse** ${ib.s} : ${a.s} ÷ ${wrap(b)} = ${a.s} × ${wrap(ib)}`]);
}
/* Enchaînement d'opérations : une priorité à la fois */
function exprSteps(tree) {
  const st = ["Ordre des calculs : d'abord les **parenthèses**, puis **× et ÷**, enfin **+ et −** (à priorité égale, de gauche à droite)."];
  let t = tree, guard = 0;
  while (t.t === "o" && guard++ < 30) {
    const c = pickNext(t), nd = c.n;
    const { res, line } = opLine(nd.a.term, nd.op, nd.b.term);
    const why = nd.par ? "Parenthèse d'abord" : (nd.op === "×" || nd.op === "÷") ? (hasAddSub(t) ? (nd.op === "×" ? "Multiplication prioritaire" : "Division prioritaire") : "De gauche à droite") : "Additions et soustractions, de gauche à droite";
    t = setAt(t, c.p, { t: "n", term: Tv(res) });
    st.push(`{{a:${why}}} : ${line}` + (t.t === "o" ? ` — on recopie : ${render(t)}` : ""));
  }
  return st;
}
function autoSteps(tree) {
  if (tree.t === "n") return [];
  if (!hasPar(tree) && onlyOps(tree, ["+", "−"])) { const f = flat(tree); return sumSteps(f.ts, f.os); }
  if (!hasPar(tree) && onlyOps(tree, ["×"])) return prodSteps(flat(tree).ts);
  if (tree.op === "÷" && tree.a.t === "n" && tree.b.t === "n") return divSteps(tree.a.term, tree.b.term);
  return exprSteps(tree);
}
/* Fabrique un exercice de calcul à partir d'une expression */
function X(src, opt = {}) {
  const tree = parseExpr(src);
  const ans = evalT(tree);
  const head = opt.q || "Calcule et donne le résultat sous forme irréductible :";
  return { kind: "frac", irr: true, q: `${head} ${opt.name ? opt.name + " = " : ""}${render(tree)}`, ans, steps: opt.steps || autoSteps(tree), hint: opt.hint, src };
}

/* Simplification pas à pas, avec les critères de divisibilité */
function simpSteps(n, d) {
  const st = [];
  if (d < 0) { st.push(`On rend le dénominateur positif : ${fr(n, d)} = ${fr(-n, -d)}`); n = -n; d = -d; }
  const g0 = gcd(n, d);
  const crit = { 2: "sont pairs", 3: "ont une somme des chiffres divisible par 3", 5: "se terminent par 0 ou 5" };
  let k = 0;
  for (const p of [2, 3, 5, 7, 11, 13]) {
    while (n % p === 0 && d % p === 0 && d > 1) {
      st.push(`${Math.abs(n)} et ${d} ${crit[p] || "sont dans la table de " + p} : on divise en haut et en bas par {{a:${p}}} → [[${neg(n)} ÷ {{a:${p}}}~${d} ÷ {{a:${p}}}]] = ${fn(n / p, d / p)}`);
      n /= p; d /= p; k++;
    }
  }
  if (d === 1) st.push(`Le dénominateur vaut 1 : le résultat est l'entier ${neg(n)}.`);
  else st.push(`${Math.abs(n)} et ${d} n'ont plus de diviseur commun (autre que 1) : ${fm(R(n, d))} est **irréductible**.`);
  if (k > 1) st.push(`Plus rapide : diviser directement par ${g0}, le plus grand diviseur commun.`);
  return st;
}
/* Comparaison de deux nombres */
function cmpSteps(a, b) {
  const st = [];
  if ((a.n < 0) !== (b.n < 0) && a.n !== 0 && b.n !== 0) { st.push("Un nombre **négatif** est toujours plus petit qu'un nombre **positif**."); return st; }
  const D = lcm(a.d, b.d);
  if (a.d === b.d) st.push(`Même dénominateur positif (${D}) : on compare les numérateurs.`);
  else st.push(`On écrit les deux nombres avec le dénominateur commun **${D}** : ${fm(a)} = ${fn(a.n * D / a.d, D)} et ${fm(b)} = ${fn(b.n * D / b.d, D)}.`);
  const x = a.n * D / a.d, y = b.n * D / b.d, c = Math.sign(x - y);
  st.push(`${neg(x)} ${c < 0 ? "<" : c > 0 ? ">" : "="} ${neg(y)}, donc ${fm(a)} ${c < 0 ? "<" : c > 0 ? ">" : "="} ${fm(b)}.` + (a.n < 0 && b.n < 0 ? " (Pour les négatifs : le plus éloigné de 0 est le plus petit.)" : ""));
  return st;
}
const CMP_SYM = ["<", "=", ">"];
function CMP(sa, sb) {
  const a = T(sa), b = T(sb), c = cmp(a.v, b.v), ans = c < 0 ? 0 : c === 0 ? 1 : 2;
  const opts = CMP_SYM.map(s => `${a.s} ${s} ${b.s}`);
  return { kind: "choice", q: `Compare ${a.s} et ${b.s}.`, opts, ans, sol: opts[ans], steps: cmpSteps(a.v, b.v) };
}
function ORD(specs, dir = "asc") {
  const ts = specs.map(T), vals = ts.map(t => t.v);
  const D = vals.reduce((x, v) => lcm(x, v.d), 1);
  const idx = ts.map((_, i) => i).sort((i, j) => cmp(vals[i], vals[j]) * (dir === "desc" ? -1 : 1));
  const sy = dir === "desc" ? " > " : " < ";
  return { kind: "order", dir, q: `Range dans l'ordre ${dir === "desc" ? "décroissant" : "croissant"} : ${ts.map(t => t.s).join(" ; ")}`, items: ts.map(t => t.s), vals,
    sol: idx.map(i => ts[i].s).join(sy),
    steps: [`Dénominateur commun : **${D}**. ${ts.map((t, i) => `${t.s} = ${fn(vals[i].n * D / vals[i].d, D)}`).join(" ; ")}`,
      `On range les numérateurs : ${idx.map(i => neg(vals[i].n * D / vals[i].d)).join(sy)}`,
      `D'où : ${idx.map(i => ts[i].s).join(sy)}`] };
}
/* Fraction d'une quantité */
function QTY(text, fSpec, Q, unit, isPct) {
  const f = isPct ? R(fSpec, 100) : T(fSpec).v;
  const fT = isPct ? `[[${fSpec}~100]]` : fm(f);
  const ans = mul(f, R(Q));
  const st = [`« Les ${isPct ? fSpec + " %" : fm(f)} de ${Q} » se traduit par une **multiplication** : ${fT} × ${Q}.`];
  if (isPct) st.push(`${fSpec} % = [[${fSpec}~100]]` + (fm(f) !== `[[${fSpec}~100]]` ? ` = ${fm(f)}` : ""));
  if (f.d !== 1 && Q % f.d === 0) st.push(`Le plus simple : on divise d'abord par le dénominateur, puis on multiplie par le numérateur : ${Q} ÷ ${f.d} = ${Q / f.d}, puis ${Q / f.d} × ${f.n} = ${nice(ans)}.`);
  else st.push(`${fm(f)} × ${Q} = [[${f.n} × ${Q}~${f.d}]] = [[${f.n * Q}~${f.d}]] = ${nice(ans)}`);
  return { kind: "num", q: text, ans, unit, steps: st, sol: `${nice(ans)} ${unit || ""}` };
}

/* ---------- Petits composants ---------- */
function Level({ n }) { return html`<span className="lvl" title=${"Niveau " + n + " sur 3"} aria-label=${"Niveau " + n + " sur 3"}>${[1, 2, 3].map(i => html`<i key=${i} className=${i <= n ? "on" : ""}></i>`)}</span>`; }
function Msg({ st, children }) { if (!st) return null; const c = st === "ok" ? "ok" : st === "part" ? "warn" : st === "info" ? "info" : "ko"; return html`<div className=${"msg " + c} role="status"><div>${children}</div></div>`; }
function FBar({ parts, on, sub = 1, tone = "a", label }) {
  const cells = [];
  for (let i = 0; i < parts * sub; i++) {
    const last = i === parts * sub - 1;
    const cls = (i < on * sub ? "on " : "") + (last ? "" : sub > 1 && (i + 1) % sub !== 0 ? "minor" : sub > 1 ? "major" : "");
    cells.push(html`<span key=${i} className=${cls}></span>`);
  }
  return html`<div className=${"fbar t-" + tone} role="img" aria-label=${label || `${on} parts coloriées sur ${parts}`}>${cells}</div>`;
}
/* Plusieurs unités si la fraction dépasse 1 */
function FBars({ n, d, sub = 1, tone = "a" }) {
  const k = Math.max(1, Math.ceil(n / d));
  return html`<div className="fbars">${Array.from({ length: k }, (_, i) => html`<${FBar} key=${i} parts=${d} sub=${sub} tone=${tone} on=${Math.max(0, Math.min(d, n - i * d))}/>`)}</div>`;
}
/* Code couleur (principe de signalement) */

}

/* Un exercice, quel que soit son type */
function Exo({ e, num, solved, onSolved }) {
  const [v, setV] = useState("");
  const [vals, setVals] = useState({});
  const [sel, setSel] = useState([]);
  const [res, setRes] = useState(null);
  const [cells, setCells] = useState({});
  const [hint, setHint] = useState(false);
  const [corr, setCorr] = useState(0);
  const done = solved.has(e.id);
  const win = r => { setRes(r); if (r.st === "ok") onSolved(e.id); };
  const check = () => {
    if (e.kind === "frac") win(checkFrac(v, e.ans, { irr: e.irr !== false }));
    else if (e.kind === "num") { const p = parseInput(v); win(!p ? { st: "ko", msg: "Écris un nombre, par exemple 21 ou 0,8 ou 7/20." } : eqR(p.r, e.ans) ? { st: "ok", msg: "Bravo, c'est juste !" } : { st: "ko", msg: "Ce n'est pas ça. Repère bien la quantité de départ, puis utilise l'indice si besoin." }); }
    else if (e.kind === "blanks") {
      const st = e.ans.map((a, i) => { const p = parseInput(vals[i] || ""); return !!p && eqR(p.r, typeof a === "number" ? R(a) : a); });
      setCells(st);
      win(st.every(Boolean) ? { st: "ok", msg: "Bravo, toutes les cases sont justes !" } : { st: "ko", msg: "Les cases en rouge sont à revoir." });
    }
    else if (e.kind === "multi") {
      const a = [...e.ans].sort().join(","), b = [...sel].sort().join(",");
      win(a === b ? { st: "ok", msg: "Bravo, c'est juste !" } : { st: "ko", msg: sel.some(i => !e.ans.includes(i)) ? "Au moins une case cochée ne convient pas." : "Il en manque : regarde encore chaque écriture." });
    }
    else if (e.kind === "order") {
      const ok = sel.length === e.items.length && sel.every((x, i) => i === 0 || cmp(e.vals[sel[i - 1]], e.vals[x]) * (e.dir === "desc" ? -1 : 1) <= 0);
      win(ok ? { st: "ok", msg: "Bravo, l'ordre est juste !" } : { st: "ko", msg: "L'ordre n'est pas encore le bon. Mets tout au même dénominateur positif, puis compare les numérateurs." });
    }
  };
  const choose = i => { setSel([i]); win(i === e.ans ? { st: "ok", msg: "Bravo, c'est juste !" } : { st: "ko", msg: e.why && e.why[i] ? e.why[i] : "Ce n'est pas la bonne réponse. Regarde l'indice ou la correction." }); };
  const key = ev => { if (ev.key === "Enter") check(); };

  let body = null;
  if (e.kind === "frac" || e.kind === "num") {
    body = html`<div className="row">
      <input className="field" value=${v} onInput=${ev => { setV(ev.target.value); setRes(null); }} onKeyDown=${key}
        placeholder=${e.kind === "num" ? "nombre" : "ex. -7/12"} aria-label="Ta réponse" autoComplete="off" spellCheck="false"/>
      ${e.unit ? html`<span className="unit">${e.unit}</span>` : null}
      <button className="btn primary" onClick=${check}>Vérifier</button>
    </div>`;
  } else if (e.kind === "blanks") {
    body = html`<div className="row"><button className="btn primary" onClick=${check}>Vérifier</button></div>`;
  } else if (e.kind === "choice") {
    body = html`<div className="choices">${e.opts.map((o, i) => html`<button key=${i} className=${"btn" + (sel[0] === i ? (i === e.ans ? " ok" : " ko") : "")} onClick=${() => choose(i)}>${m(o)}</button>`)}</div>`;
  } else if (e.kind === "multi") {
    body = html`<div style=${{ display: "grid", gap: ".6em" }}>
      <div className="choices">${e.opts.map((o, i) => { const on = sel.includes(i); return html`<label key=${i} className=${"chk" + (on ? " on" : "")}><input type="checkbox" checked=${on} onChange=${() => { setRes(null); setSel(on ? sel.filter(x => x !== i) : [...sel, i]); }}/>${m(o)}</label>`; })}</div>
      <div className="row"><button className="btn primary" onClick=${check}>Vérifier</button></div></div>`;
  } else if (e.kind === "order") {
    const s = e.dir === "desc" ? ">" : "<";
    body = html`<div style=${{ display: "grid", gap: ".6em" }}>
      <div className="order-pool">${e.items.map((it, i) => html`<button key=${i} className=${"token" + (sel.includes(i) ? " used" : "")} disabled=${sel.includes(i)} onClick=${() => { setRes(null); setSel([...sel, i]); }}>${m(it)}</button>`)}</div>
      <div className="order-out" aria-label="Ton rangement">${sel.length ? sel.map((x, j) => html`<${Fragment} key=${j}>${j ? html`<span className="sym">${s}</span>` : null}<span className="token" style=${{ cursor: "default" }}>${m(e.items[x])}</span></${Fragment}>`) : html`<span className="muted">Clique les nombres dans l'ordre ${e.dir === "desc" ? "décroissant (du plus grand au plus petit)" : "croissant (du plus petit au plus grand)"}.</span>`}</div>
      <div className="row"><button className="btn primary" disabled=${sel.length !== e.items.length} onClick=${check}>Vérifier</button><button className="btn" onClick=${() => { setSel([]); setRes(null); }}>Recommencer</button></div></div>`;
  }
  const ctx = e.kind === "blanks" ? { blank: i => html`<input className=${"field sm" + (cells[i] === true ? " okf" : cells[i] === false ? " kof" : "")} value=${vals[i] || ""} onInput=${ev => { setVals({ ...vals, [i]: ev.target.value }); setRes(null); setCells({}); }} onKeyDown=${key} aria-label=${"Case " + (i + 1)} autoComplete="off"/>` } : null;
  const steps = e.steps || [];
  const sol = e.sol || (e.kind === "frac" ? fm(e.ans) : "");
  return html`<div className=${"exo" + (done ? " done" : "")}>
    <span className="tag">Exercice ${num}${done ? " — réussi ✓" : ""}</span>
    <div className="exo-q">${parse(e.q, ctx)}</div>
    ${body}
    ${res ? html`<${Msg} st=${res.st}>${res.msg}</${Msg}>` : null}
    <div className="row">
      ${e.hint ? html`<button className="btn small" aria-pressed=${hint} onClick=${() => setHint(!hint)}>Indice</button>` : null}
      <button className="btn small" aria-pressed=${corr === 1} onClick=${() => setCorr(corr === 1 ? 0 : 1)}>Correction simple</button>
      ${steps.length ? html`<button className="btn small" aria-pressed=${corr === 2} onClick=${() => setCorr(corr === 2 ? 0 : 2)}>Correction détaillée</button>` : null}
    </div>
    ${hint && e.hint ? html`<div className="hint">${parse(e.hint)}</div>` : null}
    ${corr === 1 ? html`<div className="corr"><h4>Réponse</h4><div className="exo-q">${parse(sol)}</div></div>` : null}
    ${corr === 2 ? html`<div className="corr"><h4>Correction détaillée</h4><ol className="steps">${steps.map((s, i) => html`<li key=${i}>${parse(s)}</li>`)}</ol><div className="exo-q"><b>Réponse :</b> ${parse(sol)}</div></div>` : null}
  </div>`;
}

/* Quiz : une question à la fois, explication après chaque réponse */
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function Quiz({ qs, title }) {
  const [order, setOrder] = useState(() => qs.map((_, i) => i));
  const [i, setI] = useState(0);
  const [pick, setPick] = useState(null);
  const [hist, setHist] = useState([]);
  const end = i >= order.length;
  const q = end ? null : qs[order[i]];
  const restart = () => { setOrder(shuffle(qs.map((_, k) => k))); setI(0); setPick(null); setHist([]); };
  const score = hist.filter(Boolean).length;
  return html`<div className="frame quiz-q">
    <div className="row"><b>${title || "Quiz"}</b><span className="spacer"></span>
      <div className="dots" aria-hidden="true">${order.map((_, k) => html`<i key=${k} className=${k < hist.length ? (hist[k] ? "ok" : "ko") : k === i ? "cur" : ""}></i>`)}</div></div>
    ${end ? html`<div style=${{ display: "grid", gap: ".7em" }}>
        <p className="big-mx"><b>Score : ${score} / ${order.length}</b></p>
        <p className="muted">${score === order.length ? "Parfait : tu maîtrises ces notions." : score >= order.length * 0.6 ? "Bien ! Relis les explications des questions ratées, puis recommence." : "Retourne dans « Comprendre », puis refais le quiz : les questions changent d'ordre."}</p>
        <div className="row"><button className="btn primary" onClick=${restart}>Recommencer le quiz</button></div></div>`
    : html`<div style=${{ display: "grid", gap: ".7em" }}>
        <span className="muted" style=${{ fontSize: ".85em" }}>Question ${i + 1} sur ${order.length}</span>
        <div className="exo-q big-mx">${parse(q.q)}</div>
        <div className="quiz-opts">${q.opts.map((o, k) => html`<button key=${k} className=${"quiz-opt" + (pick !== null ? (k === q.ans ? " ok" : k === pick ? " ko" : "") : "")} disabled=${pick !== null} onClick=${() => { setPick(k); setHist([...hist, k === q.ans]); }}>${m(o)}</button>`)}</div>
        ${pick !== null ? html`<${Msg} st=${pick === q.ans ? "ok" : "ko"}><b>${pick === q.ans ? "Juste !" : "Pas tout à fait."}</b> <span>${parse(q.why)}</span></${Msg}>
          <div className="row"><button className="btn primary" onClick=${() => { setI(i + 1); setPick(null); }}>${i + 1 < order.length ? "Question suivante" : "Voir mon score"}</button></div>` : null}
      </div>`}
  </div>`;
}

/* Terme saisi dans un labo → terme de calcul */
function fieldTerm(s) {

      <div><${Range} label="Dénominateur (nombre de parts)" value=${d} min=${2} max=${10} set=${x => { setD(x); if (n > 2 * x) setN(x); }}/>
        <${Range} label="Numérateur (parts coloriées)" value=${nn} min=${0} max=${2 * d} set=${setN}/>
        <${Range} label="On multiplie en haut et en bas par" value=${k} min=${1} max=${6} set=${setK}/></div>
      <div className="bars">
        <span className="lbl">${m(fn(nn, d), "big-mx")}</span><${FBars} n=${nn} d=${d}/>
        <span className="lbl">${m(`[[${nn} × {{a:${k}}}~${d} × {{a:${k}}}]] = [[${nn * k}~${d * k}]]`, "big-mx")}</span><${FBars} n=${nn} d=${d} sub=${k}/>
      </div>

  </div>`;

function PctLab() {
  const [s, setS] = useState("3/8");
  const p = parseInput(s);
  const r = p ? p.r : null;
  const pct = r ? val(r) * 100 : 0;
  const show = r && val(r) >= 0 && val(r) <= 1;
  const full = Math.floor(pct + 1e-9), part = pct - full;
  return html`<div className="frame lab">
    <h4>Le convertisseur fraction → décimal → pourcentage</h4>
    <p className="lead">Écris une fraction (par exemple 3/8, 7/20, 2/3, -5/4). La grille compte 100 carreaux : le pourcentage, c'est le nombre de carreaux colorés.</p>
    <div className="row"><span>Fraction :</span><${FracField} value=${s} set=${setS} label="Fraction à convertir"/></div>
    ${!r ? html`<${Msg} st="ko">Écris une fraction comme 3/8.</${Msg}>` : html`<div className="labgrid">
      ${show ? html`<div style=${{ flex: "0 0 auto" }}><div className="grid100" aria-label=${dec(pct) + " carreaux sur 100"}>${Array.from({ length: 100 }, (_, i) => html`<i key=${i} className=${i < full ? "on" : ""} style=${i === full && part > 0.001 ? { background: `linear-gradient(90deg,var(--accent) ${part * 100}%,var(--view) ${part * 100}%)` } : null}></i>`)}</div></div>` : null}

const PT_COL = ["#1d6fb8", "#c25e00", "#1e8a4f", "#8a3fb0", "#b8344a"];
/* Droite graduée : points nommés A, B, C… */
function NumLine({ vals }) {
  const ok = vals.filter(Boolean);
  if (!ok.length) return null;
  const vs = ok.map(val);
  const lo = Math.min(0, Math.floor(Math.min(...vs))), hi = Math.max(1, Math.ceil(Math.max(...vs)));
  const L = ok.reduce((x, v) => lcm(x, v.d), 1);
  const W = 660, pad = 28, y = 70;
  const X = v => pad + (v - lo) / (hi - lo) * (W - 2 * pad);
  const minor = L <= 24 && (hi - lo) * L <= 160 ? L : 0;
  const ticks = [];
  if (minor) for (let i = lo * minor; i <= hi * minor; i++) if (i % minor) ticks.push(html`<line key=${"m" + i} x1=${X(i / minor)} x2=${X(i / minor)} y1=${y - 4} y2=${y + 4} className="svg-line" strokeWidth="1"/>`);
  for (let k = lo; k <= hi; k++) ticks.push(html`<g key=${"M" + k}><line x1=${X(k)} x2=${X(k)} y1=${y - 9} y2=${y + 9} className="svg-ink" strokeWidth="1.6"/><text x=${X(k)} y=${y + 26} textAnchor="middle" className="svg-txt">${neg(k)}</text></g>`);
  return html`<div className="svgbox"><svg viewBox=${`0 0 ${W} 110`} width=${W} role="img" aria-label="Droite graduée">
    <line x1=${pad - 10} x2=${W - pad + 10} y1=${y} y2=${y} className="svg-ink" strokeWidth="1.6"/>
    ${ticks}
    ${vals.map((v, i) => v ? html`<g key=${"p" + i}><circle cx=${X(val(v))} cy=${y} r="6" fill=${PT_COL[i % 5]}/>
      <text x=${X(val(v))} y=${y - 16 - (i % 2) * 18} textAnchor="middle" style=${{ font: "700 14px var(--font)" }} fill=${PT_COL[i % 5]}>${"ABCDE"[i]}</text></g>` : null)}
  </svg>${minor ? html`<p className="cap">Chaque unité est partagée en ${minor} (dénominateur commun).</p>` : null}</div>`;
}

function CalcLab({ ops, init, title, lead }) {
  const [a, setA] = useState(init[0]), [op, setOp] = useState(init[1]), [b, setB] = useState(init[2]);
  const ta = fieldTerm(a), tb = fieldTerm(b);
  const bad = !ta || !tb || (op === "÷" && tb.v.n === 0);
  let steps = [], res = null, expr = "";
  if (!bad) {
    const tree = { t: "o", op, a: { t: "n", term: ta }, b: { t: "n", term: tb } };
    steps = autoSteps(tree); res = evalT(tree); expr = render(tree);
  }
  return html`<div className="frame lab">
    <h4>${title}</h4>
    <p className="lead">${lead}</p>
    <div className="row"><${FracField} value=${a} set=${setA} label="Premier nombre"/>
      <div className="seg">${ops.map(o => html`<button key=${o} aria-pressed=${op === o} onClick=${() => setOp(o)}>${o}</button>`)}</div>
      <${FracField} value=${b} set=${setB} label="Deuxième nombre"/></div>
    ${bad ? html`<${Msg} st="ko">Écris deux nombres comme -7/12, 3 ou 5/-6${op === "÷" ? " (et on ne divise jamais par 0)" : ""}.</${Msg}>` : html`<div style=${{ display: "grid", gap: ".6em" }}>
      <p className="big-mx">${m(expr)}</p>
      <ol className="steps">${steps.map((s, i) => html`<li key=${i}>${parse(s)}</li>`)}</ol>
      <${Msg} st="ok">Résultat : ${m(fm(res))}${res.d !== 1 ? html` <span className="muted">(≈ ${dec(+val(res).toFixed(3))})</span>` : null}</${Msg}>
    </div>`}
  </div>`;
}
function AddBars() {

  return html`<div className="frame lab">
    <h4>Additionner avec des barres</h4>

        <${Range} label="Numérateur de la 2e fraction" value=${c} min=${1} max=${d} set=${setC}/><${Range} label="Dénominateur de la 2e fraction" value=${d} min=${2} max=${12} set=${x => { setD(x); if (c > x) setC(x); }}/></div>
      <div className="bars">
        <span className="lbl">${m(cut ? `[[${a} × {{a:${L / b}}}~${b} × {{a:${L / b}}}]] = [[${A}~${L}]]` : `[[${a}~${b}]]`)}</span><${FBar} parts=${b} on=${a} sub=${cut ? L / b : 1}/>
        <span className="lbl">${m(cut ? `[[${c} × {{a:${L / d}}}~${d} × {{a:${L / d}}}]] = [[${C}~${L}]]` : `[[${c}~${d}]]`)}</span><${FBar} parts=${d} on=${c} sub=${cut ? L / d : 1} tone="w"/>

    </div>

}

function AreaSvg({ a, b, c, d, size = 240 }) {
  const cw = size / b, rh = size / d, cells = [];
  for (let i = 0; i < b; i++) for (let j = 0; j < d; j++) {
    const inA = i < a, inC = j < c;
    cells.push(html`<rect key=${i + "-" + j} x=${i * cw} y=${j * rh} width=${cw} height=${rh} className=${(inA && inC ? "am-x" : inA ? "am-b" : inC ? "am-o" : "am-0") + " svg-line"} strokeWidth="1"/>`);
  }
  return html`<svg viewBox=${`-2 -2 ${size + 4} ${size + 4}`} width=${size + 4} role="img" aria-label=${`Carré unité : ${a * c} petits rectangles foncés sur ${b * d}`}>
    ${cells}<rect x="0" y="0" width=${size} height=${size} fill="none" className="svg-ink" strokeWidth="2"/></svg>`;
}

  const segs = [];
  for (let i = 0; i < nFull && i < 40; i++) segs.push(html`<g key=${i}><rect x=${sc(i * Y)} y="62" width=${sc(Y) - pad} height="24" rx="2" fill=${i % 2 ? "rgba(246,116,0,.35)" : "rgba(246,116,0,.6)"} className="svg-ink" strokeWidth="1"/>

  return html`<svg viewBox=${`0 0 ${W} 130`} width=${W} role="img" aria-label="Barres de division">
    <rect x=${pad} y="20" width=${sc(X) - pad} height="26" rx="2" fill="rgba(61,174,233,.45)" className="svg-ink" strokeWidth="1"/>

}

function whyNot(nd) {
  const kids = [nd.a, nd.b].filter(k => k.t === "o");
  if (kids.some(k => k.par)) return "Il faut d'abord calculer ce qu'il y a entre parenthèses.";
  if ((nd.op === "+" || nd.op === "−") && kids.some(k => k.op === "×" || k.op === "÷")) return "La multiplication et la division passent avant l'addition et la soustraction.";
  return "À priorité égale, on calcule de gauche à droite.";
}

function BarSvg({ parts, total }) {
  // parts : [{ v (rationnel), label, fill }]
  const W = 640, pad = 4, H = 46;
  const T0 = val(total);
  let x = pad;
  const segs = parts.map((p, i) => {
    const w = Math.max(0, val(p.v) / T0 * (W - 2 * pad));
    const g = html`<g key=${i}><rect x=${x} y="8" width=${w} height=${H} fill=${p.fill} className="svg-ink" strokeWidth="1"/>
      ${w > 54 ? html`<text x=${x + w / 2} y=${8 + H / 2 + 5} textAnchor="middle" className="svg-txt">${p.label}</text>` : null}</g>`;
    x += w; return g;
  });
  return html`<svg viewBox=${`0 0 ${W} ${H + 40}`} width=${W} role="img" aria-label="Modèle en barre">
    ${segs}<rect x=${pad} y="8" width=${W - 2 * pad} height=${H} fill="none" className="svg-ink" strokeWidth="2"/>
    <path d=${`M${pad} ${H + 18} v6 H${W - pad} v-6`} fill="none" className="svg-ink" strokeWidth="1.2"/>
    <text x=${W / 2} y=${H + 38} textAnchor="middle" className="svg-mut">le tout</text>
  </svg>`;
}
const fmtQ = r => isDecR(r) ? dec(val(r)) : fm(r);
function BarLab() {
  const [q, setQ] = useState("2"), [u, setU] = useState("L");
  const [f1, setF1] = useState("2/5"), [f2, setF2] = useState("1/4");
  const [mode, setMode] = useState("total");
  const Q = parseInput(q), a = parseInput(f1), b = parseInput(f2);
  const ok = Q && a && b && val(Q.r) > 0 && val(a.r) >= 0 && val(b.r) >= 0;
  let p1, p2, rest, base2;
  if (ok) {
    p1 = mul(a.r, Q.r);
    base2 = mode === "total" ? Q.r : sub(Q.r, p1);
    p2 = mul(b.r, base2);
    rest = sub(sub(Q.r, p1), p2);
  }
  const over = ok && val(rest) < -1e-12;
  return html`<div className="frame lab">
    <h4>Le modèle en barre</h4>
    <p className="lead">Dessiner le problème aide à repérer <b>le tout</b>. Exemple de la fiche : un flacon de 2 L ; Tom boit les ${m("[[2~5]]")}, puis sa sœur le quart… du volume initial, ou du reste ?</p>
    <div className="row"><span>Le tout :</span><input className="field sm" style=${{ width: "5em" }} value=${q} onInput=${e => setQ(e.target.value)} aria-label="Quantité totale"/>
      <input className="field sm" style=${{ width: "5em" }} value=${u} onInput=${e => setU(e.target.value)} aria-label="Unité"/></div>
    <div className="row"><span>1re part :</span><${FracField} value=${f1} set=${setF1} label="Première fraction"/><span>du tout</span></div>
    <div className="row"><span>2e part :</span><${FracField} value=${f2} set=${setF2} label="Deuxième fraction"/>
      <div className="seg"><button aria-pressed=${mode === "total"} onClick=${() => setMode("total")}>du tout</button><button aria-pressed=${mode === "reste"} onClick=${() => setMode("reste")}>de ce qui reste</button></div></div>
    ${!ok ? html`<${Msg} st="ko">Écris une quantité positive (ex. 2 ou 2,5) et deux fractions positives.</${Msg}>`
      : over ? html`<${Msg} st="ko">Les deux parts dépassent le tout : c'est impossible avec ces nombres.</${Msg}>`
      : html`<${Fragment}>
        <div className="svgbox"><${BarSvg} total=${Q.r} parts=${[{ v: p1, label: "1re part", fill: "rgba(61,174,233,.45)" }, { v: p2, label: "2e part", fill: "rgba(246,116,0,.4)" }, { v: rest, label: "reste", fill: "rgba(39,174,96,.18)" }]}/></div>
        <ol className="steps">
          <li>${parse(`1re part : ${fm(a.r)} × ${fmtQ(Q.r)} = **${fmtQ(p1)} ${u}**`)}</li>
          ${mode === "reste" ? html`<li>${parse(`Ce qui reste après la 1re part : ${fmtQ(Q.r)} − ${fmtQ(p1)} = ${fmtQ(base2)} ${u}`)}</li>` : null}
          <li>${parse(`2e part : ${fm(b.r)} × ${fmtQ(base2)} = **${fmtQ(p2)} ${u}**` + (mode === "reste" ? " (on prend la fraction **du reste**, pas du tout)" : ""))}</li>
          <li>${parse(`Reste final : ${fmtQ(Q.r)} − ${fmtQ(p1)} − ${fmtQ(p2)} = **${fmtQ(rest)} ${u}**, soit ${fm(div(rest, Q.r))} du tout.`)}</li>
        </ol>
      </${Fragment}>`}
  </div>`;
}

  return html`<div className="wrap page">
    <div className="mod-head" style=${{ paddingBlock: "0" }}><h2>Quiz bilan</h2><p>14 questions mélangées, tirées de tous les chapitres. Mélanger les types de questions oblige à choisir la bonne méthode : c'est ce qui se passe en contrôle.</p></div>
    <${Quiz} key=${seed} qs=${qs} title="Quiz bilan"/>
    <div className="row"><button className="btn" onClick=${() => setSeed(seed + 1)}>Nouveau tirage</button></div>
  </div>`;
}
const MEMO = [
  ["=", "Écrire autrement", ["[[a~b]] = a ÷ b (b ≠ 0)", "[[a~b]] = [[a × k~b × k]] = [[a ÷ k~b ÷ k]]", "Irréductible : plus de diviseur commun", "[[−a~b]] = [[a~−b]] = −[[a~b]] ; [[−a~−b]] = [[a~b]]", "t % = [[t~100]]"]],
  ["<", "Comparer", ["Même dénominateur positif → on compare les numérateurs", "Sinon : dénominateur commun d'abord", "Négatif < positif ; −[[7~6]] < −[[5~6]]"]],
  ["+", "Additionner, soustraire", ["[[a~c]] + [[b~c]] = [[a + b~c]]", "Dénominateurs différents → plus petit multiple commun", "Jamais d'addition des dénominateurs", "Soustraire = ajouter l'opposé"]],
  ["×", "Multiplier", ["[[a~b]] × [[c~d]] = [[a × c~b × d]]", "Signe : nombre de facteurs négatifs pair → + ; impair → −", "Simplifier avant de calculer", "« les [[a~b]] de Q » = [[a~b]] × Q"]],
  ["÷", "Inverse et division", ["Inverse de [[a~b]] : [[b~a]] (produit = 1)", "L'inverse garde le signe ; 0 n'a pas d'inverse", "[[a~b]] ÷ [[c~d]] = [[a~b]] × [[d~c]]"]],
  ["( )", "Priorités", ["1. Parenthèses", "2. × et ÷ (de gauche à droite)", "3. + et − (de gauche à droite)", "Résultat irréductible, dénominateur positif"]],
  ["?", "Problèmes", ["Repérer le tout", "« de » → ×", "Reste = tout − parts (ou 1 − fractions)", "« du reste » ≠ « du tout »"]]
];
function Memo() {
  return html`<div className="wrap page">
    <div className="mod-head" style=${{ paddingBlock: "0" }}><h2>Fiche mémo</h2><p>Toutes les règles sur une page. À relire avant un contrôle, ou à imprimer.</p></div>
    <div className="row noprint"><button className="btn primary" onClick=${() => window.print()}>Imprimer la fiche</button></div>
    <${ColorCode}/>
    <div className="memo">${MEMO.map(([ic, t, items], i) => html`<div className="frame" key=${i}><h4><span className="ic">${ic}</span>${t}</h4><ul>${items.map((s, j) => html`<li key=${j}>${parse(s)}</li>`)}</ul></div>`)}</div>
  </div>`;
}

/* =====================================================================
   Vue d'un chapitre
   ===================================================================== */
const TABS = [["comprendre", "Comprendre"], ["manipuler", "Manipuler"], ["entrainer", "S'entraîner"], ["quiz", "Quiz"]];
function ModuleView({ md, tab, setTab, solved, onSolved, next }) {
  const Learn = md.Learn, Lab = md.Lab;
  const ti = TABS.findIndex(t => t[0] === tab);
  const go = t => { setTab(t); window.scrollTo({ top: 0 }); };
  return html`<${Fragment}>
    <div className="wrap mod-head"><h2>${md.name}</h2><p>${md.intro}</p></div>
    <div className="tabs-bar"><div className="wrap"><div className="tabs" role="tablist">
      ${TABS.map(([id, t], i) => html`<button key=${id} role="tab" className="tab" aria-selected=${tab === id} onClick=${() => go(id)}><span className="tn">${i + 1}</span>${t}</button>`)}
    </div></div></div>
    <div className="wrap page">
      ${tab === "comprendre" ? html`<${Learn}/>` : null}
      ${tab === "manipuler" ? html`<${Fragment}><p className="lead">Expérimente librement : change les nombres, observe ce qui se passe, puis essaie de prévoir le résultat avant de regarder.</p><${Lab}/></${Fragment}>` : null}
      ${tab === "entrainer" ? html`<${Fragment}>
        <p className="lead">Chaque famille commence par un <b>exemple résolu</b> : lis-le étape par étape, puis fais les exercices. Les familles vont de la plus facile (une barre) à la plus difficile (trois barres). Écris tes réponses sous forme de fraction : <b>-7/12</b>, <b>5</b>, <b>2,5</b>…</p>
        <div className="row">${md.fams.map((f, i) => html`<a key=${i} className="btn small" href=${"#fam-" + i} onClick=${ev => { ev.preventDefault(); document.getElementById("fam-" + i).scrollIntoView({ behavior: "smooth" }); }}>${i + 1}. ${f.title}</a>`)}</div>
        ${md.fams.map((f, i) => html`<${Family} key=${i} f=${f} idx=${i} solved=${solved} onSolved=${onSolved}/>`)}
      </${Fragment}>` : null}
      ${tab === "quiz" ? html`<${Quiz} key=${md.id} qs=${md.quiz} title=${"Quiz — " + md.name}/>` : null}
      <div className="next-row">
        ${ti > 0 ? html`<button className="btn" onClick=${() => go(TABS[ti - 1][0])}>← ${TABS[ti - 1][1]}</button>` : null}
        ${ti < TABS.length - 1 ? html`<button className="btn primary" onClick=${() => go(TABS[ti + 1][0])}>${TABS[ti + 1][1]} →</button>`
          : next ? html`<button className="btn primary" onClick=${next.go}>Chapitre suivant : ${next.name} →</button>` : null}
      </div>
    </div>
  </${Fragment}>`;
}

/* =====================================================================
   Application
   ===================================================================== */
const MODULES = [MOD1, MOD2, MOD3, MOD4, MOD5, MOD6, MOD7];
MODULES.forEach(md => md.fams.forEach((f, fi) => f.exos.forEach((e, ei) => { e.id = `${md.id}-${fi}-${ei}`; })));
const ALL_EX = MODULES.reduce((s, md) => s + md.fams.reduce((t, f) => t + f.exos.length, 0), 0);

function App() {
  const [mod, setMod] = useState(() => store.get("mod", "ecr"));
  const [tab, setTab] = useState(() => store.get("tab", "comprendre"));
  const [solved, setSolved] = useState(() => new Set(store.get("solved", [])));
  const [big, setBig] = useState(() => store.get("big", false));
  const [confirmReset, setConfirmReset] = useState(false);
  useEffect(() => store.set("mod", mod), [mod]);
  useEffect(() => store.set("tab", tab), [tab]);
  useEffect(() => store.set("big", big), [big]);
  useEffect(() => store.set("solved", [...solved]), [solved]);
  const onSolved = id => setSolved(s => s.has(id) ? s : new Set([...s, id]));
  const md = MODULES.find(x => x.id === mod);
  const count = x => { let d = 0, t = 0; x.fams.forEach(f => f.exos.forEach(e => { t++; if (solved.has(e.id)) d++; })); return [d, t]; };
  const pick = id => { setMod(id); if (MODULES.some(x => x.id === id)) setTab("comprendre"); window.scrollTo({ top: 0 }); };
  const mi = MODULES.findIndex(x => x.id === mod);
  const next = mi >= 0 && mi < MODULES.length - 1 ? { name: MODULES[mi + 1].name, go: () => pick(MODULES[mi + 1].id) } : null;
  const nSolved = [...solved].filter(id => MODULES.some(x => id.startsWith(x.id + "-"))).length;
  return html`<div className=${"app" + (big ? " big" : "")}>
    <header className="titlebar">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="4" fill="var(--accent)"/><text x="12" y="10.5" textAnchor="middle" fill="#fff" style=${{ font: "700 8px var(--font)" }}>3</text><line x1="7" y1="12.5" x2="17" y2="12.5" stroke="#fff" strokeWidth="1.6"/><text x="12" y="20" textAnchor="middle" fill="#fff" style=${{ font: "700 8px var(--font)" }}>4</text></svg>
      <span className="tb-name">Les fractions</span><span className="tb-sub">Mathématiques 4e</span>
      <span className="spacer"></span>
      <button className="switch" role="switch" aria-checked=${big} onClick=${() => setBig(!big)}><span className="track"></span>Texte agrandi</button>
      <span className="prog" title="Exercices réussis"><span className="bar"><span style=${{ width: (nSolved / ALL_EX * 100) + "%" }}></span></span>${nSolved}/${ALL_EX}</span>
    </header>
    <div className="layout">
      <nav className="sidebar" aria-label="Chapitres">
        <div className="side-cap">Chapitres</div>
        ${MODULES.map((x, i) => { const [d, t] = count(x); return html`<button key=${x.id} className="side-item" aria-current=${mod === x.id ? "page" : undefined} onClick=${() => pick(x.id)}><span className="ic">${x.ic}</span><span>${i + 1}. ${x.name}</span><span className="cnt">${d}/${t}</span></button>`; })}
        <div className="side-cap" style=${{ marginTop: ".8em" }}>Révision</div>
        <button className="side-item" aria-current=${mod === "memo" ? "page" : undefined} onClick=${() => pick("memo")}><span className="ic">≡</span><span>Fiche mémo</span></button>
        <button className="side-item" aria-current=${mod === "cartes" ? "page" : undefined} onClick=${() => pick("cartes")}><span className="ic">★</span><span>Cartes mémoire</span></button>
        <button className="side-item" aria-current=${mod === "bilan" ? "page" : undefined} onClick=${() => pick("bilan")}><span className="ic">✓</span><span>Quiz bilan</span></button>
        <div className="side-foot">
          <span className="muted">Ta progression reste dans ce navigateur.</span>
          ${confirmReset
            ? html`<div className="row"><button className="btn small" onClick=${() => { setSolved(new Set()); setConfirmReset(false); }}>Oui, tout effacer</button><button className="btn small" onClick=${() => setConfirmReset(false)}>Annuler</button></div>`
            : html`<button className="linkbtn" onClick=${() => setConfirmReset(true)}>Effacer ma progression</button>`}
        </div>
      </nav>
      <main className="main">
        ${mod === "cartes" ? html`<${Cards} mods=${MODULES}/>` : mod === "bilan" ? html`<${Bilan} mods=${MODULES}/>` : mod === "memo" ? html`<${Memo}/>`
          : html`<${ModuleView} key=${mod} md=${md || MODULES[0]} tab=${tab} setTab=${setTab} solved=${solved} onSolved=${onSolved} next=${next}/>`}
      </main>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
