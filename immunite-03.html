<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Soi, non-soi et immunité innée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout : application façon KDE Breeze — barre d'outils, barre latérale de navigation, vue centrale dans un cadre.
   Codes couleur constants : bleu = soi, orange = non-soi / microbes, sarcelle = réponse innée, violet = réponse adaptative. */
:root{
  --win:#eff0f1; --view:#fcfcfc; --alt:#f4f5f6; --fg:#232629; --fg2:#5f6a74; --line:#d5d9dc; --line2:#b8bfc5;
  --accent:#3daee9; --accent-strong:#1d87bf; --accent-bg:#e2f2fb;
  --pos:#27ae60; --pos-fg:#1c7d45; --pos-bg:#e3f4ea;
  --neg:#da4453; --neg-fg:#b22a39; --neg-bg:#fae5e7;
  --neu:#f67400; --neu-fg:#a94f00; --neu-bg:#fdeedd;
  --sang:#da4453; --sang-bg:#f9e0e3; --lymphe:#27ae60; --lymphe-bg:#dcf1e4; --inter-bg:#e9f4fa;
  --prim:#f67400; --sec:#8e5bb5; --body:#e3e6e9; --tissue:#f3ece2; --tissue-line:#cdbda6;
  --nuc:#6d4fa3; --cyto:#ece6f5; --gr:#dc5664; --gran:#e08a3a;
  --soi:#2980b9; --soi-bg:#e1eef8; --nonsoi:#e67e22; --nonsoi-bg:#fcecdc;
  --inne:#16a085; --inne-bg:#dcf2ed; --adapt:#8e44ad; --adapt-bg:#f0e4f6;
  --meca:#2980b9; --bioch:#d35400; --biol:#27ae60;
  --skin:#f1d9c6; --skin-line:#c9a68c; --derm:#f7ebe1; --nerve:#c9a227;
  --g-pale:#ece5df; --g-rose:#ef9aa6; --g-brun:#94603f; --g-dess:#4d3628;
  --bact:#5f8a2c; --mediat:#e1a600; --mucus:#d6ecc9; --plasma:#a9d6ee;
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,"DejaVu Sans Mono",monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --win:#202326; --view:#141618; --alt:#1b1d20; --fg:#fcfcfc; --fg2:#a7b0b8; --line:#363b41; --line2:#4c535a;
    --accent:#3daee9; --accent-strong:#6cc4f0; --accent-bg:#163647;
    --pos:#27ae60; --pos-fg:#62d394; --pos-bg:#14301e;
    --neg:#da4453; --neg-fg:#f2808c; --neg-bg:#3a1a1f;
    --neu:#f67400; --neu-fg:#ffa451; --neu-bg:#382410;
    --sang:#e65866; --sang-bg:#381b20; --lymphe:#3cc174; --lymphe-bg:#142d1d; --inter-bg:#132733;
    --prim:#ff8a24; --sec:#b48ad8; --body:#2b3035; --tissue:#2f2a24; --tissue-line:#6b5e4c;
    --nuc:#b49ae0; --cyto:#2c2740; --gr:#e86a76; --gran:#f0a050;
    --soi:#5dade2; --soi-bg:#15293a; --nonsoi:#f0a050; --nonsoi-bg:#3a2814;
    --inne:#48c9b0; --inne-bg:#123029; --adapt:#bb8fd6; --adapt-bg:#2c1d36;
    --meca:#5dade2; --bioch:#f39a45; --biol:#4cc77f;
    --skin:#4a3a30; --skin-line:#86695a; --derm:#2f2722; --nerve:#e0c050;
    --g-pale:#5b544f; --g-rose:#b65d6c; --g-brun:#a8724f; --g-dess:#1f1712;
    --bact:#9fc066; --mediat:#ffd04d; --mucus:#26402a; --plasma:#2f5a73;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --win:#202326; --view:#141618; --alt:#1b1d20; --fg:#fcfcfc; --fg2:#a7b0b8; --line:#363b41; --line2:#4c535a;
  --accent:#3daee9; --accent-strong:#6cc4f0; --accent-bg:#163647;
  --pos:#27ae60; --pos-fg:#62d394; --pos-bg:#14301e;
  --neg:#da4453; --neg-fg:#f2808c; --neg-bg:#3a1a1f;
  --neu:#f67400; --neu-fg:#ffa451; --neu-bg:#382410;
  --sang:#e65866; --sang-bg:#381b20; --lymphe:#3cc174; --lymphe-bg:#142d1d; --inter-bg:#132733;
  --prim:#ff8a24; --sec:#b48ad8; --body:#2b3035; --tissue:#2f2a24; --tissue-line:#6b5e4c;
  --nuc:#b49ae0; --cyto:#2c2740; --gr:#e86a76; --gran:#f0a050;
  --soi:#5dade2; --soi-bg:#15293a; --nonsoi:#f0a050; --nonsoi-bg:#3a2814;
  --inne:#48c9b0; --inne-bg:#123029; --adapt:#bb8fd6; --adapt-bg:#2c1d36;
  --meca:#5dade2; --bioch:#f39a45; --biol:#4cc77f;
  --skin:#4a3a30; --skin-line:#86695a; --derm:#2f2722; --nerve:#e0c050;
  --g-pale:#5b544f; --g-rose:#b65d6c; --g-brun:#a8724f; --g-dess:#1f1712;
  --bact:#9fc066; --mediat:#ffd04d; --mucus:#26402a; --plasma:#2f5a73;
  color-scheme:dark;
}
html{font-size:15px}
html.big{font-size:17px}
body{background:var(--win);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.6}
*{box-sizing:border-box}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:1.55rem;font-weight:600}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
strong{font-weight:600}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Barre d'outils */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--view);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:52px}
.top .ttl{display:flex;flex-direction:column;min-width:0;flex:1}
.top .ttl b{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:.8rem;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--fg2)}
.meter .bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media(max-width:620px){.meter .bar{width:50px}.top .ttl span{display:none}}

/* Structure */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow:auto;padding:14px 10px 30px;border-right:1px solid var(--line)}
.side .grp{font-size:.75rem;color:var(--fg2);padding:12px 10px 4px;letter-spacing:.02em}
.navi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:3px;padding:6px 10px;cursor:pointer;font-size:.93rem;line-height:1.35}
.navi:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.navi[aria-current="page"]{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
.navi .n{width:20px;height:20px;flex:none;border-radius:50%;border:1px solid var(--line2);font-size:.72rem;display:grid;place-items:center;color:var(--fg2)}
.navi .n.done{background:var(--pos);border-color:var(--pos);color:var(--view)}
.navi .lab{flex:1;min-width:0}
.navi .cnt{font-size:.75rem;color:var(--fg2)}
main{min-width:0;padding:24px 28px 80px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:52px;z-index:9;max-height:none;border-right:0;border-bottom:1px solid var(--line);background:var(--win);display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
  .side .grp{display:none}
  .navi{width:auto;white-space:nowrap;flex:none}
  main{padding:16px 16px 64px}
}

/* Cadres */
.frame{background:var(--view);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;display:flex;flex-direction:column;gap:14px}
@media(max-width:620px){.frame{padding:16px}}
.eyebrow{font-size:.8rem;color:var(--fg2)}
.goal{color:var(--fg2);font-size:.95rem}
.prose{max-width:66ch;display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--line);margin:4px 0}
.muted{color:var(--fg2)}
.small{font-size:.86rem}

/* Messages (KMessageWidget) */
.msg{border:1px solid var(--accent);background:var(--accent-bg);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.msg .ic{flex:none;width:18px;height:18px;margin-top:2px}
.msg .bd{min-width:0;display:flex;flex-direction:column;gap:4px}
.msg .bd b.h{font-weight:600}
.msg.pos{border-color:var(--pos);background:var(--pos-bg)}
.msg.neg{border-color:var(--neg);background:var(--neg-bg)}
.msg.neu{border-color:var(--neu);background:var(--neu-bg)}
.msg ul{margin:0;padding-left:1.2em}

/* Boutons */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-size:.92rem;min-height:32px;padding:4px 14px;border:1px solid var(--line2);border-radius:3px;background:var(--view);cursor:pointer;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{border-color:var(--accent);background:var(--accent-bg)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 30%,var(--view))}
.btn.flat{border-color:transparent;background:transparent}
.btn.flat:hover:not(:disabled){background:var(--alt);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}

/* Onglets */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;gap:2px}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--fg2);cursor:pointer;white-space:nowrap;font-size:.93rem}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab small{font-size:.75rem;color:var(--fg2);margin-left:6px}

/* Pastilles */
.pill{display:inline-block;font-size:.76rem;line-height:1.5;padding:0 8px;border-radius:10px;border:1px solid var(--line2);color:var(--fg2);white-space:nowrap}
.pill.acc{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-bg)}
.pill.st-ok{border-color:var(--pos);color:var(--pos-fg);background:var(--pos-bg)}
.pill.st-haut{border-color:var(--neg);color:var(--neg-fg);background:var(--neg-bg)}
.pill.st-bas{border-color:var(--neu);color:var(--neu-fg);background:var(--neu-bg)}
.pill.c-prim{border-color:var(--prim);color:var(--neu-fg)}
.pill.c-sec{border-color:var(--sec);color:var(--sec)}
.pill.c-vais{border-color:var(--lymphe);color:var(--pos-fg)}

/* Tableaux */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--alt)}
tr:last-child td{border-bottom:0}

/* Schémas */
.fig{border:1px solid var(--line);border-radius:var(--r);background:var(--view);overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
.fig.scroll svg{min-width:640px}
svg text{font-family:var(--font);fill:var(--fg)}
.cap{font-size:.84rem;color:var(--fg2)}

/* Stepper du schéma d'échanges */
.stepper{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--view);cursor:pointer;font-size:.8rem}
.dot[aria-current="step"]{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.steptext{min-height:4.8em;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--alt)}
.steptext b.h{display:block;margin-bottom:2px}
.ex-arrow{transition:opacity .25s}
.dim{opacity:.13}

/* Exercices */
.ex{border:1px solid var(--line);border-radius:var(--r);background:var(--view);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ex.compact{background:var(--alt)}
.ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--fg2)}
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:8px;height:8px;border-radius:50%;border:1px solid var(--accent)}
.lvl i.on{background:var(--accent)}
.ex-head .st{margin-left:auto}
.prompt{font-size:1rem;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--view);cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt .mk{width:16px;height:16px;flex:none;border:1px solid var(--line2);border-radius:50%;margin-top:2px;background:var(--view)}
.opt.cb .mk{border-radius:2px;display:grid;place-items:center}
.opt[aria-checked="true"] .mk{border:5px solid var(--accent)}
.opt.cb[aria-checked="true"] .mk{border:1px solid var(--accent);background:var(--accent)}
.opt.cb[aria-checked="true"] .mk::after{content:"";width:8px;height:4px;border-left:2px solid var(--view);border-bottom:2px solid var(--view);transform:rotate(-45deg) translate(1px,-1px)}
.opt.good{border-color:var(--pos);background:var(--pos-bg)}
.opt.bad{border-color:var(--neg);background:var(--neg-bg)}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1 1 240px;min-width:0;display:flex;gap:8px;align-items:flex-start}
.item.good{background:var(--pos-bg)}
.item.bad{background:var(--neg-bg)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line2);background:var(--view);padding:4px 10px;cursor:pointer;font-size:.86rem;min-height:30px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--alt)}
.seg button[aria-pressed="true"]{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent);font-weight:500}
.ord .pos{width:24px;height:24px;flex:none;border-radius:50%;background:var(--alt);border:1px solid var(--line2);display:grid;place-items:center;font-size:.78rem}
.ord .mv{display:flex;gap:4px}
.ord .mv button{width:32px;height:30px;border:1px solid var(--line2);border-radius:3px;background:var(--view);cursor:pointer}
.ord .mv button:disabled{opacity:.35;cursor:default}
.fill{line-height:2.3;max-width:70ch}
select{font:inherit;font-size:.92rem;color:var(--fg);background:var(--view);border:1px solid var(--line2);border-radius:3px;padding:3px 6px;max-width:100%}
select.good{border-color:var(--pos);background:var(--pos-bg)}
select.bad{border-color:var(--neg);background:var(--neg-bg)}
textarea{font:inherit;color:var(--fg);background:var(--view);border:1px solid var(--line2);border-radius:3px;padding:8px 10px;width:100%;min-height:110px;resize:vertical}
textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.feedback{font-size:.92rem}
.corr{border:1px solid var(--line);border-radius:3px;background:var(--alt);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.corr .h{font-size:.8rem;color:var(--fg2);font-weight:600}
.corr ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.crit{display:flex;flex-direction:column;gap:4px}
.crit label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.crit input{margin-top:5px;accent-color:var(--accent)}
.mark{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--view)}
.mark.ok{background:var(--pos)} .mark.ko{background:var(--neg)}
.lvlhead{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--fg2);margin-top:6px}
.lvlhead::after{content:"";flex:1;height:1px;background:var(--line)}

/* Exercice résolu */
.worked{border:1px solid var(--accent);border-radius:var(--r);background:var(--view);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.wsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:w}
.wsteps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;counter-increment:w}
.wsteps li::before{content:counter(w);width:24px;height:24px;border-radius:50%;background:var(--accent-bg);border:1px solid var(--accent);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.ws-why{font-size:.86rem;color:var(--fg2);margin-top:2px}
.answer{border:1px solid var(--pos);background:var(--pos-bg);border-radius:3px;padding:10px 14px}
.answer .h{font-size:.8rem;font-weight:600;color:var(--pos-fg);margin-bottom:2px}

/* Barres de valeurs (analyse) */
.rbs{display:flex;flex-direction:column;gap:2px}
.rb{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rb:last-child{border-bottom:0}
.rb-l{display:flex;flex-direction:column;min-width:0}
.rb-label{font-weight:500;font-size:.93rem}
.rb-vr{font-size:.78rem;color:var(--fg2)}
.rb-r{display:flex;flex-direction:column;gap:4px;min-width:0}
.rb-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.rb-track{position:relative;height:10px;border-radius:5px;background:var(--alt);border:1px solid var(--line)}
.rb-band{position:absolute;top:-1px;bottom:-1px;background:color-mix(in srgb,var(--pos) 30%,transparent);border-left:2px solid var(--pos);border-right:2px solid var(--pos)}
.rb-mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--view);background:var(--pos)}
.rb-mark.st-haut{background:var(--neg)} .rb-mark.st-bas{background:var(--neu)}
.rbgrp{font-size:.8rem;color:var(--fg2);padding-top:10px;font-weight:600}
@media(max-width:560px){.rb{grid-template-columns:1fr}}

/* Cartes de contenu */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--view)}
.box ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:2px}
.box .fact{font-size:.86rem;color:var(--fg2)}
.cellfig{display:flex;align-items:flex-end;justify-content:center;gap:14px;min-height:120px;padding:6px;background:var(--alt);border-radius:3px}
.scale{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:14px;justify-content:center}
.scale figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--fg2);text-align:center}
.sbar{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--fg2)}
.sbar i{display:block;height:4px;background:var(--fg)}

/* Corps */
.bodygrid{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:700px){.bodygrid{grid-template-columns:1fr}.bodygrid .fig{max-width:330px;margin:0 auto;width:100%}}
.mk-o{cursor:pointer}
.mk-o circle.hit{fill:var(--view);stroke-width:2}
.mk-o:hover circle.hit,.mk-o.sel circle.hit{fill:var(--accent-bg);stroke:var(--accent)}
.mk-o.good circle.hit{fill:var(--pos-bg);stroke:var(--pos)}

.tline{fill:none;stroke:var(--line2);stroke-width:1.5}

/* Fiche mémo */
.k{border-radius:2px;padding:0 2px;font-weight:600}

.memo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}

/* Quiz */
.qprog{display:flex;gap:4px;flex-wrap:wrap}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{border:1px solid var(--line2);border-radius:3px;padding:8px 10px;font-size:.88rem;background:var(--view);flex:1 1 130px;min-width:0}

.flow .st.good{border-color:var(--pos);background:var(--pos-bg)}

.potent{display:flex;flex-direction:column;gap:8px}
.pt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}

.homesteps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.footnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--fg2);font-size:.9rem}

.pill.c-soi{border-color:var(--soi);color:var(--soi);background:var(--soi-bg)}

.pill.c-inne{border-color:var(--inne);color:var(--inne);background:var(--inne-bg)}

.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Cils et mucus */
@keyframes beat{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(24deg)}}

.cil{transform-box:fill-box;transform-origin:50% 100%;animation:beat 1s ease-in-out infinite}

.venn text{font-size:13px}
.venn .t{font-weight:600}
.venn .m{font-size:12.5px}

/* Voies d'entrée */
.bodyentry{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:18px;align-items:start}

.ent{cursor:pointer}

.ent text{font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ent:focus-visible{outline:none}

.entlist{display:flex;flex-direction:column;gap:4px}
.entbtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:3px;padding:5px 8px;cursor:pointer;font-size:.92rem}
.entbtn:hover{background:var(--alt)}
.entbtn[aria-pressed="true"]{border-color:var(--nonsoi);background:var(--nonsoi-bg)}
.entbtn .no{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--nonsoi);display:grid;place-items:center;font-size:.76rem;font-weight:600}

/* Phagocytose */
.phstage{cursor:pointer}
.phstage rect.bg{fill:transparent;stroke:transparent}
.phstage.cur rect.bg{fill:var(--accent-bg);stroke:var(--accent)}
.phstage:hover rect.bg{stroke:var(--line2)}
.phstage:focus-visible{outline:none}
.phstage:focus-visible rect.bg{stroke:var(--accent);stroke-width:2}

<script>
(function(){
const {useState, useEffect, useContext, createContext} = React;
const html = htm.bind(React.createElement);
const KEY = 'immuno-s5-ch34-v1';

/* ---------- utilitaires ---------- */

  else if (type==='mono') g = html`<g><circle r="9.1" className="s-cyto"/><path d="M-5,-2.5 C-5,-6 4,-6.2 5.2,-2.2 C6.3,1.4 4,4.6 0.4,4.2 C-1.2,4 -0.6,1.2 -2.6,1.4 C-4.4,1.6 -5,0.6 -5,-2.5Z" className="s-nuc"/></g>`;

  return html`<svg viewBox=${(-half)+' '+(-half)+' '+(half*2)+' '+(half*2)} width=${s} height=${s} role="img" aria-label=${label || type} style=${{overflow:'visible'}}>${g}</svg>`;

/* =========================================================
   SCHÉMAS
   ========================================================= */

/* ---------- greffes ---------- */
const GSTATE = {
  pale:{l:'greffon pâle', c:'var(--g-pale)'},
  rnaiss:{l:"greffon d'aspect rosé (vascularisation naissante)", c:'color-mix(in srgb, var(--g-rose) 45%, var(--g-pale))'},
  rose:{l:'greffon rose bien vascularisé', c:'var(--g-rose)'},
  conf:{l:'greffon confondu avec les tissus environnants', c:'var(--skin)'},
  brun:{l:'greffon brunâtre', c:'var(--g-brun)'},
  infl:{l:'gonflement, rougeur, petits saignements', c:'var(--neg)'},
  dess:{l:'greffon desséché, se détachant', c:'var(--g-dess)'},
  na:{l:"pas d'observation dans le tableau du cours", c:null}
};
const GRAFTS = [
  {id:'auto', n:'Autogreffe', d:'Donneur et receveur sont le même individu', ok:true,
    seq:['pale','pale','pale','rnaiss','rose','rose','rose','rose','rose','conf','na','na']},
  {id:'iso', n:'Isogreffe', d:'Donneur et receveur sont de vrais jumeaux', ok:true,
    seq:['pale','pale','pale','rnaiss','rose','rose','rose','rose','rose','conf','na','na']},
  {id:'allo', n:'Allogreffe', d:'Donneur et receveur font partie de la même espèce', ok:false,
    seq:['pale','pale','rnaiss','rnaiss','rnaiss','brun','brun','infl','infl','infl','infl','dess']},
  {id:'xeno', n:'Xénogreffe', d:'Donneur et receveur appartiennent à des espèces différentes', ok:false,
    seq:['pale','pale','rnaiss','rnaiss','brun','infl','infl','infl','infl','dess','na','na']}
];
const VESSELS = ["M40,60 C70,62 92,70 110,74","M200,70 C178,72 152,80 136,90","M58,124 C84,118 100,110 118,102","M196,128 C172,120 152,114 138,106","M120,8 C123,28 118,44 124,60","M118,162 C117,142 124,130 120,112","M24,92 C56,90 84,92 102,95"];
function GraftView({state}){
  const r = rnd(7);
  const fur = Array.from({length:70}, ()=>[r()*240, r()*170, r()*8-4]);
  const nV = state==='rnaiss' ? 3 : state==='rose' ? 7 : state==='brun' ? 4 : 0;
  const g = {x:80, y:45, w:80, h:80};
  let graft = null;
  if (state==='pale' || state==='rnaiss' || state==='rose' || state==='brun'){
    graft = html`<rect x=${g.x} y=${g.y} width=${g.w} height=${g.h} rx="6" fill=${GSTATE[state].c} stroke="var(--skin-line)" strokeWidth="1.5" strokeDasharray="4 3"/>`;
  } else if (state==='conf'){
    graft = html`<rect x=${g.x} y=${g.y} width=${g.w} height=${g.h} rx="6" fill="none" stroke="var(--skin-line)" strokeOpacity=".35" strokeDasharray="2 5"/>`;
  } else if (state==='infl'){
    graft = html`<g transform="translate(120 85) scale(1.1) translate(-120 -85)">
      <rect x=${g.x-9} y=${g.y-9} width=${g.w+18} height=${g.h+18} rx="14" fill="var(--neg)" opacity=".22"/>
      <rect x=${g.x} y=${g.y} width=${g.w} height=${g.h} rx="8" fill="color-mix(in srgb, var(--g-brun) 55%, var(--neg))" stroke="var(--neg)" strokeWidth="2"/>
      ${[[96,60],[140,70],[110,104],[148,112],[90,118],[128,56]].map((p,i)=>html`<circle key=${i} cx=${p[0]} cy=${p[1]} r="3.2" fill="var(--neg)" stroke="var(--view)" strokeWidth=".8"/>`)}
    </g>`;
  } else if (state==='dess'){
    graft = html`<g>
      <rect x=${g.x+4} y=${g.y+6} width=${g.w} height=${g.h} rx="5" fill="var(--fg)" opacity=".18"/>
      <g transform="rotate(-9 120 85)">
        <path d=${`M${g.x},${g.y+8} L${g.x+g.w-4},${g.y} L${g.x+g.w},${g.y+g.h} L${g.x+6},${g.y+g.h-4} Z`} fill="var(--g-dess)" stroke="var(--g-brun)" strokeWidth="1.5"/>
        <path d="M92,60 L108,74 L102,92 M130,58 L124,80 L144,98 M110,110 L126,100" stroke="var(--g-brun)" strokeWidth="1.4" fill="none"/>
      </g>
    </g>`;
  }
  return html`<svg viewBox="0 0 240 170" role="img" aria-label=${'Greffon : '+GSTATE[state].l}>
    <rect x="0" y="0" width="240" height="170" rx="6" fill="var(--skin)"/>
    ${fur.map((f,i)=>html`<path key=${i} d=${`M${f[0]},${f[1]} l${f[2]},-7`} stroke="var(--skin-line)" strokeWidth="1" opacity=".55"/>`)}
    ${VESSELS.slice(0,nV).map((d,i)=>html`<path key=${'v'+i} d=${d} stroke="var(--sang)" strokeWidth=${state==='rnaiss'?1.4:2} fill="none" opacity=${state==='brun'?.35:.85}/>`)}
    ${graft}
    ${VESSELS.slice(0,nV).map((d,i)=>html`<path key=${'w'+i} d=${d} stroke="var(--sang)" strokeWidth=${state==='rnaiss'?1.2:1.8} fill="none" opacity=${state==='brun'?.3:.8} clipPath="url(#gclip)"/>`)}
    <defs><clipPath id="gclip"><rect x=${g.x} y=${g.y} width=${g.w} height=${g.h} rx="6"/></clipPath></defs>
    ${state==='na' ? html`<text x="120" y="90" textAnchor="middle" fontSize="12" style=${{fill:'var(--fg2)'}}>pas d'observation</text>` : null}
  </svg>`;
}
function GraftTimeline({type, day, onPick, only}){
  const rows = only ? GRAFTS.filter(g=>g.id===only) : GRAFTS;
  return html`<div className="gt-wrap"><div className="gt" role="grid" aria-label="Évolution des greffons jour par jour">
    <div className="hd" style=${{justifyContent:'flex-start',paddingLeft:'10px'}}>Jour</div>
    ${Array.from({length:12},(_,i)=>html`<div key=${'h'+i} className=${'hd num'+(!only && day===i+1?' sel':'')}>${i+1}</div>`)}
    ${rows.map(g=>html`<${React.Fragment} key=${g.id}>
      <button className=${'rl'+(!only && type===g.id?' sel':'')} onClick=${()=>onPick && onPick(g.id, day)} disabled=${!onPick}>${g.n}</button>
      ${g.seq.map((s,i)=>html`<button key=${i} className=${'c'+(s==='na'?' na':'')+(!only && type===g.id && day===i+1?' cur':'')}

    <//>`)}

const MCOL = ['var(--soi)','var(--nonsoi)','var(--inne)','var(--adapt)','var(--neg)'];
function MarkerGlyph({code, x, y, a, miss}){
  const sh = code[0], col = MCOL[+code[1]];
  let head;
  if (sh==='c') head = html`<circle cy="-17" r="5" fill=${col}/>`;
  else if (sh==='q') head = html`<rect x="-5" y="-22" width="10" height="10" fill=${col}/>`;
  else if (sh==='t') head = html`<path d="M0,-24 L6,-12 L-6,-12 Z" fill=${col}/>`;
  else if (sh==='d') head = html`<path d="M0,-24 L6,-17 L0,-10 L-6,-17 Z" fill=${col}/>`;
  else if (sh==='f') head = html`<path d="M-6,-24 V-12 H6 V-24" fill="none" stroke=${col} strokeWidth="3"/>`;
  else if (sh==='x') head = html`<path d="M0,-25 L2,-19 L8,-18 L3,-14 L5,-8 L0,-11 L-5,-8 L-3,-14 L-8,-18 L-2,-19 Z" fill=${col}/>`;
  else head = html`<path d="M-6,-20 L-3,-25 L3,-25 L6,-20 L3,-15 L-3,-15 Z" fill=${col}/>`;
  return html`<g transform=${`translate(${x} ${y}) rotate(${a})`}>
    ${miss ? html`<circle cy="-15" r="12" fill="var(--neg-bg)" stroke="var(--neg)" strokeDasharray="3 2"/>` : null}
    <line y1="0" y2="-11" stroke="var(--fg2)" strokeWidth="2"/>${head}
  </g>`;
}

/* ---------- exercice générique ---------- */
function initResp(ex){
  return {qcm:null, multi:[], classify:{}, order:ex.shuffle ? ex.shuffle.slice() : null, fill:{}, match:{}, open:''}[ex.type];
}
function blanks(ex){ return ex.parts.filter(p=>typeof p!=='string'); }
function complete(ex, r){
  switch(ex.type){
    case 'qcm': return r!==null;
    case 'multi': return r.length>0;
    case 'classify': return ex.items.every((_,i)=>r[i]!==undefined);
    case 'order': return true;
    case 'fill': return blanks(ex).every((_,i)=>r[i]!==undefined && r[i]!=='');
    case 'match': return ex.rows.every((_,i)=>r[i]!==undefined && r[i]!=='');
    default: return true;
  }
}
function evaluate(ex, r){
  switch(ex.type){
    case 'qcm': return {ok:r===ex.answer, score:r===ex.answer?1:0, total:1};
    case 'multi': {
      const per = ex.options.map((_,i)=> r.includes(i)===ex.answers.includes(i));
      const ok = per.every(Boolean); return {ok, per, score:per.filter(Boolean).length, total:per.length};
    }
    case 'classify': { const per = ex.items.map((it,i)=>r[i]===it.c); return {ok:per.every(Boolean), per, score:per.filter(Boolean).length, total:per.length}; }
    case 'order': { const per = r.map((v,i)=>v===i); return {ok:per.every(Boolean), per, score:per.filter(Boolean).length, total:per.length}; }
    case 'fill': { const per = blanks(ex).map((b,i)=>Number(r[i])===b.a); return {ok:per.every(Boolean), per, score:per.filter(Boolean).length, total:per.length}; }
    case 'match': { const per = ex.rows.map((row,i)=>Number(r[i])===row.a); return {ok:per.every(Boolean), per, score:per.filter(Boolean).length, total:per.length}; }
  }
  return {ok:false};
}
function Lvl({n}){
  const names = ['', 'Niveau 1 · Reconnaître', 'Niveau 2 · Appliquer', 'Niveau 3 · Transférer'];
  return html`<span className="lvl" title=${names[n]}><i className="on"></i><i className=${n>=2?'on':''}></i><i className=${n>=3?'on':''}></i><span style=${{marginLeft:'6px'}}>${names[n]}</span></span>`;
}
function Mark({ok}){ return html`<span className=${'mark '+(ok?'ok':'ko')} aria-label=${ok?'juste':'à revoir'}>${ok?'✓':'✗'}</span>`; }

function Exercise({ex, num, compact}){
  const {prog, mark} = useContext(Prog);
  const [r, setR] = useState(()=>initResp(ex));
  const [res, setRes] = useState(null);
  const [tried, setTried] = useState(false);
  const [showS, setShowS] = useState(false);
  const [showD, setShowD] = useState(false);
  const [hint, setHint] = useState(false);
  const [crit, setCrit] = useState({});
  const [revealed, setRevealed] = useState(false);
  const status = prog[ex.id];
  const upd = v => { setR(v); setRes(null); };

  const check = () => {
    const e = evaluate(ex, r); setRes(e); setTried(true);
    mark(ex.id, e.ok ? 'ok' : 'ko');
  };
  const per = res && res.per;

  let body = null;
  if (ex.type==='qcm' || ex.type==='multi'){
    const multi = ex.type==='multi';
    body = html`<div className="opts" role=${multi?'group':'radiogroup'}>
      ${ex.options.map((o,i)=>{
        const on = multi ? r.includes(i) : r===i;
        let cls = 'opt'+(multi?' cb':'');
        if (res && on) cls += (multi ? (ex.answers.includes(i)?' good':' bad') : (res.ok?' good':' bad'));
        if (res && multi && !on && ex.answers.includes(i) && res.ok) cls += ' good';
        return html`<button key=${i} className=${cls} role=${multi?'checkbox':'radio'} aria-checked=${on?'true':'false'}
          onClick=${()=> upd(multi ? (on ? r.filter(x=>x!==i) : [...r, i]) : i)}><span className="mk"></span><span>${rich(o)}</span></button>`;
      })}
    </div>`;
  } else if (ex.type==='classify'){
    body = html`<div className="items">${ex.items.map((it,i)=>html`<div key=${i} className=${'item'+(per?(per[i]?' good':' bad'):'')}>
      <div className="t">${per ? html`<${Mark} ok=${per[i]}/>` : null}<span>${rich(it.t)}</span></div>
      <div className="seg" role="group" aria-label=${'Choix pour : '+it.t}>${ex.cats.map((c,j)=>html`<button key=${j} aria-pressed=${r[i]===j?'true':'false'} onClick=${()=>upd({...r,[i]:j})}>${c}</button>`)}</div>
    </div>`)}</div>`;
  } else if (ex.type==='order'){
    const mv = (pos, d) => { const a = r.slice(); const t = a[pos]; a[pos] = a[pos+d]; a[pos+d] = t; upd(a); };
    body = html`<div className="items ord">${r.map((idx,pos)=>html`<div key=${idx} className=${'item'+(per?(per[pos]?' good':' bad'):'')}>
      <div className="t"><span className="pos">${pos+1}</span><span>${rich(ex.items[idx])}</span></div>
      <div className="mv"><button aria-label="Monter" disabled=${pos===0} onClick=${()=>mv(pos,-1)}>↑</button><button aria-label="Descendre" disabled=${pos===r.length-1} onClick=${()=>mv(pos,1)}>↓</button></div>
    </div>`)}</div>`;
  } else if (ex.type==='fill'){
    let b = -1;
    body = html`<p className="fill">${ex.parts.map((p,i)=>{
      if (typeof p==='string') return html`<span key=${i}>${rich(p)}</span>`;
      b++; const k = b;
      return html`<select key=${i} aria-label=${'Trou '+(k+1)} className=${per?(per[k]?'good':'bad'):''} value=${r[k]===undefined?'':r[k]} onChange=${e=>upd({...r,[k]:e.target.value})}>
        <option value="">— choisir —</option>${p.o.map((o,j)=>html`<option key=${j} value=${j}>${o}</option>`)}</select>`;
    })}</p>`;
  } else if (ex.type==='match'){
    body = html`<div className="items">${ex.rows.map((row,i)=>html`<div key=${i} className=${'item'+(per?(per[i]?' good':' bad'):'')}>
      <div className="t">${per ? html`<${Mark} ok=${per[i]}/>` : null}<span>${rich(row.t)}</span></div>
      <select aria-label=${'Réponse pour : '+row.t} value=${r[i]===undefined?'':r[i]} onChange=${e=>upd({...r,[i]:e.target.value})} style=${{flex:'0 1 260px'}}>
        <option value="">— choisir —</option>${ex.options.map((o,j)=>html`<option key=${j} value=${j}>${o}</option>`)}</select>
    </div>`)}</div>`;
  } else if (ex.type==='open'){
    const nCrit = ex.criteria.length, nOk = Object.values(crit).filter(Boolean).length;
    body = html`<div style=${{display:'flex',flexDirection:'column',gap:'10px'}}>
      <textarea id=${'ta-'+ex.id} aria-label="Ta réponse" placeholder="Écris ta réponse ici, en phrases complètes." value=${r} onChange=${e=>setR(e.target.value)}></textarea>
      ${!revealed ? html`<div className="row"><button className="btn primary" onClick=${()=>{setRevealed(true); setTried(true); if(status!=='ok') mark(ex.id,'seen');}}>Comparer avec la réponse attendue</button>${ex.hint ? html`<button className="btn flat" onClick=${()=>setHint(!hint)}>${hint?'Masquer l’indice':'Indice'}</button>` : null}</div>` : html`<div className="corr">
        <span className="h">Réponse attendue</span><p>${rich(ex.model)}</p>
        <div className="sep"></div>
        <span className="h">Coche ce que ta réponse contient</span>
        <div className="crit">${ex.criteria.map((c,i)=>html`<label key=${i}><input type="checkbox" id=${ex.id+'-c'+i} checked=${!!crit[i]} onChange=${e=>{ const n={...crit,[i]:e.target.checked}; setCrit(n); if(Object.values(n).filter(Boolean).length===nCrit) mark(ex.id,'ok'); }}/><span>${rich(c)}</span></label>`)}</div>
        <p className="small muted">${nOk}/${nCrit} critère${nCrit>1?'s':''} présent${nOk>1?'s':''}. ${nOk===nCrit ? 'Ta réponse est complète.' : 'Complète ta réponse avec ce qui manque, puis coche à nouveau.'}</p>
      </div>`}
    </div>`;
  }

  const stPill = status==='ok' ? html`<span className="pill st-ok st">réussi</span>` : status==='ko' ? html`<span className="pill st-bas st">à retravailler</span>` : status==='seen' ? html`<span className="pill acc st">fait</span>` : null;
  const ok = complete(ex, r);
  return html`<article className=${'ex'+(compact?' compact':'')} id=${'ex-'+ex.id}>
    <div className="ex-head">${num ? html`<b style=${{color:'var(--fg)'}}>Exercice ${num}</b>` : null}${ex.level && !compact ? html`<${Lvl} n=${ex.level}/>` : null}${stPill}</div>
    <div className="prompt">${rich(ex.prompt)}</div>
    <${Figure} fig=${ex.fig}/>
    ${body}
    ${hint && ex.type!=='open' ? html`<${Msg} kind="info" title="Indice"><p>${rich(ex.hint)}</p><//>` : null}
    ${hint && ex.type==='open' && !revealed ? html`<${Msg} kind="info" title="Indice"><p>${rich(ex.hint)}</p><//>` : null}
    ${ex.type!=='open' ? html`<div className="row">
      <button className="btn primary" disabled=${!ok} onClick=${check}>Vérifier</button>
      ${ex.hint ? html`<button className="btn flat" onClick=${()=>setHint(!hint)}>${hint?'Masquer l’indice':'Indice'}</button>` : null}
      ${!ok ? html`<span className="small muted">Réponds à tout avant de vérifier.</span>` : null}
    </div>` : null}
    ${res ? html`<p className="feedback" role="status">${res.ok ? html`<b style=${{color:'var(--pos-fg)'}}>Juste.</b>` : html`<span><b style=${{color:'var(--neg-fg)'}}>Pas encore.</b> ${res.total>1 ? res.score+' / '+res.total+' réponses justes. ' : ''}Modifie ta réponse et vérifie à nouveau, ou ouvre la correction.</span>`}</p>` : null}
    ${tried ? html`<div className="row">
      <button className="btn" aria-pressed=${showS?'true':'false'} onClick=${()=>setShowS(!showS)}>Correction simple</button>
      <button className="btn" aria-pressed=${showD?'true':'false'} onClick=${()=>setShowD(!showD)}>Correction détaillée</button>
    </div>` : null}
    ${tried && showS ? html`<div className="corr"><span className="h">Correction simple</span><p>${rich(ex.simple || ex.model)}</p></div>` : null}
    ${tried && showD ? html`<div className="corr"><span className="h">Correction détaillée</span>${Array.isArray(ex.detail) ? html`<ol>${ex.detail.map((d,i)=>html`<li key=${i}>${rich(d)}</li>`)}</ol>` : html`<p>${rich(ex.detail)}</p>`}</div>` : null}
  </article>`;
}

/* ---------- exercice résolu ---------- */
function Worked({w}){
  const [n, setN] = useState(1);
  const all = n>=w.steps.length;
  return html`<section className="worked" aria-label="Exercice résolu">
    <div className="row"><span className="pill acc">Exercice résolu</span><h3>${w.title}</h3></div>
    <p className="prompt"><span className="muted">Consigne : </span>${rich(w.consigne)}</p>
    <${Figure} fig=${w.fig}/>
    <ol className="wsteps">${w.steps.slice(0,n).map((s,i)=>html`<li key=${i}><div><div>${rich(s.t)}</div>${s.why ? html`<div className="ws-why">${rich(s.why)}</div>` : null}</div></li>`)}</ol>
    ${!all ? html`<div className="row"><button className="btn primary" onClick=${()=>setN(n+1)}>Étape suivante (${n+1}/${w.steps.length})</button><button className="btn flat" onClick=${()=>setN(w.steps.length)}>Tout afficher</button></div>`
      : html`<div className="answer"><div className="h">Réponse rédigée</div><p>${rich(w.answer)}</p></div>`}
  </section>`;
}

const BARR = {
  meca:{l:'Mécaniques', c:'c-meca', items:[
    {t:'La peau', d:"Le plus grand organe (15 % de la masse du corps). L'épiderme compte 10 à 30 couches de cellules **kératinisées** : une barrière physique. Les cellules sont remplacées constamment ; la **desquamation** évacue les microbes de la surface."},
    {t:'Les muqueuses', d:"Elles tapissent les cavités ouvertes vers l'extérieur (appareils digestif, respiratoire, uro-génital). Une seule couche de cellules, **plus fine et fragile** que la peau, constamment remplacée."},
    {t:'Le mucus', d:"Sécrété par des cellules spécialisées des muqueuses. Visqueux, il **emprisonne** microbes et substances étrangères, par exemple dans les bronches avant les alvéoles."},
    {t:'Poils et cils', d:"Les **poils** du nez, couverts de mucus, filtrent l'air. Les **cils** des voies respiratoires font remonter le mucus vers la gorge ; la toux et les éternuements accélèrent ce mouvement."},
    {t:'Le lavage', d:"**Larmes**, écoulement de l'**urine**, sécrétions vaginales, **salive**, **sueur** ; vomissements, diarrhée, toux et éternuements **expulsent** les pathogènes."}]},
  bioch:{l:'Biochimiques', c:'c-bioch', items:[
    {t:'Le lysozyme', d:"Un antibiotique naturel : une **enzyme** qui **détruit la paroi des bactéries**. Dans la salive, les larmes, les sécrétions nasales, le lait maternel, la sueur, le liquide interstitiel."},
    {t:"L'acidité", d:"La **sueur** et le **sébum** donnent à la peau un **pH de 3 à 5** qui freine les champignons et les bactéries. Urine et sécrétions vaginales sont légèrement acides."},
    {t:'Le suc gastrique', d:"Acide chlorhydrique, enzymes et mucus : son acidité **détruit** plusieurs bactéries et la plupart des toxines bactériennes."},
    {t:'Autres substances', d:"Des substances **antimicrobiennes** dans le sperme, les sécrétions vaginales et le mucus respiratoire."}]},
  biol:{l:'Biologiques', c:'c-biol', items:[
    {t:'La flore commensale', d:"Des microorganismes **non pathogènes** (certains staphylocoques, streptocoques…) vivent sur la peau et les muqueuses. Ils occupent la place : les pathogènes ne peuvent pas **entrer en compétition** pour coloniser ces milieux."},
    {t:'Les bactériocines', d:"Substances produites par certaines bactéries de la flore, qui **inhibent la croissance** des germes pathogènes. Hôte et flore en tirent tous deux bénéfice sans se nuire : c'est le sens de **commensal**."}]}
};

          <tr><td><b>Phagosome</b></td><td>Vésicule qui contient le microbe ingéré</td></tr>
          <tr><td><b>Lysosome</b></td><td>Petite vésicule riche en enzymes digestives</td></tr>

    </section>

}

/* ---- 8. Fièvre et médicaments ---- */
function LessonFievre({go}){
  const [t, setT] = useState(38.5);
  const zone = t<37.6 ? {k:'pos', h:'Température normale', d:"Autour de 37 °C : l'hypothalamus maintient la température stable."}
    : t<41 ? {k:'neu', h:'Fièvre', d:"Elle aide la défense : cœur plus rapide, phagocytose facilitée, microbes freinés, réparation accélérée. À surveiller si elle est élevée ou si elle dure."}
    : {k:'neg', h:'Fièvre dangereuse', d:"Vers 41 °C, certaines **enzymes** indispensables se **dénaturent** (elles perdent leur forme et ne fonctionnent plus) : la fièvre devient nocive, voire mortelle."};
  const h = Math.max(0, Math.min(1, (t-35)/(42.5-35)));
  return html`<${Lesson} id="fievre" go=${go} title="Fièvre et médicaments" goal="expliquer l'origine et le rôle de la fièvre, et distinguer antalgiques et anti-inflammatoires.">
    <section className="frame">
      <h2>Qu'est-ce que la fièvre ?</h2>
      <div className="flow">
        <div className="st">${rich("Cellules **endommagées**")}</div><span className="ar">→</span>
        <div className="st">${rich("libèrent des **pyrogènes endogènes**")}</div><span className="ar">→</span>
        <div className="st">${rich("alertent l'**hypothalamus** (thermorégulation)")}</div><span className="ar">→</span>
        <div className="st good">${rich("**température générale** du corps ↑ : la fièvre")}</div>
      </div>
      <div className="thermo">
        <svg viewBox="0 0 50 200" width="44" role="img" aria-label=${'Thermomètre : '+t.toFixed(1).replace('.',',')+' °C'}>
          <rect x="17" y="8" width="16" height="160" rx="8" fill="var(--alt)" stroke="var(--line2)"/>
          <rect x="21" y=${12+(1-h)*150} width="8" height=${h*150+10} rx="4" fill=${t>=41?'var(--neg)':t>=37.6?'var(--neu)':'var(--pos)'}/>
          <circle cx="25" cy="178" r="15" fill=${t>=41?'var(--neg)':t>=37.6?'var(--neu)':'var(--pos)'} stroke="var(--line2)"/>
        </svg>
        <div style=${{display:'flex',flexDirection:'column',gap:'8px',minWidth:0}}>
          <label htmlFor="temp"><b className="num" style=${{fontSize:'1.3rem'}}>${t.toFixed(1).replace('.',',')} °C</b></label>
          <input id="temp" type="range" min="36" max="42" step="0.1" value=${t} onChange=${e=>setT(+e.target.value)}/>
          <div className=${'msg '+zone.k} style=${{margin:0}}><div className="bd"><b className="h">${zone.h}</b><p>${rich(zone.d)}</p></div></div>
          <p className="cap">Repères indicatifs. En cas de forte fièvre, on consulte un médecin.</p>
        </div>
      </div>
      <div className="cols">
        <div className="box"><b>Pourquoi la fièvre est utile</b><ol style=${{margin:0,paddingLeft:'1.3em'}}>
          <li>${rich("Elle augmente la **fréquence cardiaque** et la circulation : plus de défenseurs arrivent.")}</li>
          <li>${rich("Elle **facilite la phagocytose** et augmente la production d'anticorps.")}</li>
          <li>${rich("Elle **freine la croissance** des microbes.")}</li>
          <li>${rich("Elle **accélère la réparation** des lésions.")}</li></ol></div>
        <div className="box"><b>Quand elle devient dangereuse</b><p className="small">${rich("Une fièvre **élevée (41 °C)** ou **prolongée** désactive certaines **enzymes** (dénaturation) indispensables au fonctionnement du corps.")}</p></div>
      </div>
    </section>
    <section className="frame">
      <h2>Quand l'inflammation devient invalidante</h2>
      <p className="prose">${rich("Si l'inflammation se prolonge anormalement (**inflammation chronique**), elle peut abîmer les tissus et les organes. Deux familles de médicaments aident à limiter les symptômes.")}</p>
      <div className="fig scroll"><${Venn}/></div>
      <div className="cols">
        <div className="box"><span className="pill c-soi" style=${{alignSelf:'flex-start'}}>antalgiques</span><p className="small">${rich("Atténuent ou suppriment la **douleur**. **Non opiacés** : douleurs légères à modérées. **Opiacés** (issus de l'opium, agissent sur les récepteurs d'opiacés) : **faibles** pour les douleurs modérées à sévères, **forts** pour les douleurs intenses ; on en devient facilement et rapidement **dépendant**.")}</p></div>
        <div className="box"><span className="pill c-non" style=${{alignSelf:'flex-start'}}>anti-inflammatoires</span><p className="small">${rich("Empêchent la **synthèse de certains médiateurs chimiques** de l'inflammation : ils limitent la **vasodilatation**, la **douleur** et la **chaleur**.")}</p></div>
      </div>
      <${Msg} kind="neg" title="Opiacés forts"><p>${rich("Le **fentanyl**, opiacé très puissant, est responsable de nombreuses **surdoses mortelles**. Ces médicaments ne se prennent que sur prescription et sous surveillance médicale.")}</p><//>
      <${Msg} kind="pos" title="À retenir"><ul>
        <li>${rich("Fièvre : pyrogènes endogènes → hypothalamus → température ↑. Utile, mais dangereuse vers 41 °C.")}</li>
        <li>${rich("**Aspirine** et **ibuprofène** : antalgiques **et** anti-inflammatoires. **Paracétamol** : antalgique seulement.")}</li>
      </ul><//>
    </section>
  <//>`;
}

    {id:'D4', level:3, type:'open', prompt:"Pendant une épidémie de grippe, on conseille de **tousser dans son coude**, de **se laver les mains** et d'**aérer**. Explique pourquoi ces gestes sont efficaces, en partant de la voie d'entrée du virus.",

{ id:'E', short:'Barrières', title:'Les barrières naturelles', lesson:'barrieres',
  goal:"Classer une barrière et expliquer ce qui se passe quand elle est affaiblie.",
  worked:{ title:'Les larmes', consigne:"Les larmes protègent l'œil de **deux façons**. Lesquelles ? Classe chacune.",
    steps:[
      {t:"**Première action** : les larmes **lavent** continuellement l'œil et empêchent les microbes de s'y fixer.", why:"Un liquide qui emporte les microbes agit par effet physique."},
      {t:"→ C'est une barrière **mécanique** (le lavage)."},
      {t:"**Deuxième action** : les larmes contiennent du **lysozyme**, une enzyme qui détruit la paroi des bactéries."},
      {t:"→ C'est une barrière **biochimique**.", why:"Une même sécrétion peut donc jouer deux rôles. C'est aussi le cas de la salive."}
    ],
    answer:"Les larmes lavent l'œil en continu et empêchent les microbes de se fixer : c'est une barrière mécanique. Elles contiennent aussi du lysozyme, une enzyme qui détruit la paroi des bactéries : c'est une barrière biochimique." },
  ex:[
    {id:'E1', level:1, type:'classify', prompt:"Classe chaque barrière.", cats:['Mécanique','Biochimique','Biologique'],
      items:[
        {t:"Couches de cellules kératinisées de l'épiderme",c:0},
        {t:"Mucus qui emprisonne les microbes",c:0},
        {t:"Cils des voies respiratoires",c:0},
        {t:"Écoulement de l'urine",c:0},
        {t:"Lysozyme",c:1},
        {t:"pH acide de la sueur et du sébum",c:1},
        {t:"Suc gastrique",c:1},
        {t:"Flore commensale de l'intestin",c:2},
        {t:"Bactériocines produites par la flore",c:2}],
      simple:"Méca : épiderme, mucus, cils, urine. Bioch : lysozyme, pH acide, suc gastrique. Biol : flore, bactériocines.",
      detail:["**Mécanique** : un obstacle physique ou un mouvement qui piège ou évacue.","**Biochimique** : une substance chimique qui détruit ou freine les microbes.","**Biologique** : d'autres êtres vivants (la flore) qui occupent la place ou fabriquent des bactériocines. Même si les bactériocines sont des substances, ton cours les range ici, car elles sont produites par la flore."]},
    {id:'E2', level:1, type:'fill', prompt:"Complète.",
      parts:["L'épiderme compte de ",{o:['10 à 30','2 à 3','100 à 300'],a:0}," couches de cellules ",{o:['kératinisées','ciliées','nerveuses'],a:0},". La sueur et le sébum donnent à la peau un pH de ",{o:['3 à 5','7 à 8','10 à 12'],a:0},". Le lysozyme est une ",{o:['enzyme','hormone','cellule'],a:0}," qui détruit ",{o:['la paroi des bactéries','les virus','les globules rouges'],a:0},"."],
      simple:"10 à 30 · kératinisées · 3 à 5 · enzyme · la paroi des bactéries.",
      detail:["Kératine : la même protéine que dans les ongles, les cheveux, la corne.","pH 3 à 5 = acide : beaucoup de microbes ne s'y développent pas.","Le lysozyme est un « antibiotique naturel »."]},
    {id:'E3', level:2, type:'qcm', prompt:"Les fumeurs font plus souvent des bronchites (infections des bronches). Quelle explication tirée du cours ?",
      options:["La nicotine inhibe les cellules ciliées : le mucus chargé de microbes n'est plus évacué","La fumée tue tous les microbes","Le tabac rend la peau plus épaisse","Les fumeurs produisent trop de lysozyme"], answer:0,
      simple:"La nicotine paralyse les cils.",
      detail:["Normalement, les **cils** font remonter le mucus et les microbes piégés vers la gorge.","La **nicotine** inhibe ces cellules ciliées.","Le mucus stagne dans les bronches : les microbes ont le temps de s'y multiplier."]},
    {id:'E4', level:2, type:'qcm', prompt:"Après un long traitement antibiotique, Sara développe une mycose (champignon *Candida*). Quelle barrière a été affaiblie ?",
      options:["La flore commensale, détruite en partie par les antibiotiques","La peau, devenue plus fine","Le suc gastrique, devenu neutre","Les cils des voies respiratoires"], answer:0,
      hint:"Les antibiotiques tuent les bactéries… toutes les bactéries.",
      simple:"La flore commensale (barrière biologique).",
      detail:["Les antibiotiques tuent aussi les **bactéries non pathogènes** de la flore.","La place est libre : le champignon n'a plus de **compétition** et prolifère.","C'est la barrière **biologique** qui a été affaiblie."]},
    {id:'E5', level:3, type:'open', prompt:"Les grands brûlés sont très exposés aux infections graves. **Explique pourquoi**, à l'aide des barrières naturelles.",
      hint:"Quelle est la barrière la plus étendue du corps ? Que contient-elle ?",
      model:"La peau est la principale barrière mécanique : son épiderme de cellules kératinisées empêche les microbes d'entrer. Une brûlure étendue détruit cette barrière sur une grande surface : les microbes entrent directement dans les tissus. En plus, la peau brûlée perd son acidité (sueur, sébum) et sa flore commensale protectrice.",
      criteria:["Je dis que la peau est une **barrière mécanique** (épiderme kératinisé)","J'explique que la brûlure **détruit** cette barrière et laisse entrer les microbes","Je cite au moins une autre protection perdue (**acidité**, **flore commensale**)"],
      detail:["Barrière mécanique détruite → porte d'entrée géante.","Barrières biochimique (acidité) et biologique (flore) perdues aussi."]}
  ]},
{ id:'F', short:'Inflammation', title:'La réaction inflammatoire', lesson:'inflammation',
  goal:"Expliquer les signes de l'inflammation à partir de son déroulement.",
  worked:{ title:'Expliquer les quatre signes', consigne:"Une écorchure au genou devient rouge, chaude, gonflée et douloureuse. **Explique chacun de ces signes.**",
    steps:[
      {t:"**Départ** : des microbes entrent ; les **cellules sentinelles** les détectent et libèrent des **médiateurs chimiques** (cytokines, histamine).", why:"Tous les signes découlent de cette alerte chimique."},
      {t:"Les médiateurs provoquent la **vasodilatation** : plus de sang arrive → **rougeur** et **chaleur**."},
      {t:"Les capillaires deviennent plus perméables : **plasma** et **leucocytes** sortent (**diapédèse**) → le liquide s'accumule : **gonflement** (œdème)."},
      {t:"L'œdème **comprime les nerfs** → **douleur**."}
    ],
    answer:"Les cellules sentinelles libèrent des médiateurs chimiques. Ceux-ci dilatent les vaisseaux : plus de sang arrive, d'où la rougeur et la chaleur. Les capillaires laissent sortir du plasma et des leucocytes (diapédèse) : c'est l'œdème, donc le gonflement. Cet œdème comprime les nerfs, ce qui provoque la douleur." },
  ex:[
    {id:'F1', level:1, type:'multi', prompt:"Coche les **quatre** manifestations locales de la réaction inflammatoire.",
      options:["Rougeur","Chaleur","Gonflement","Douleur","Pâleur","Démangeaison"], answers:[0,1,2,3],
      simple:"Rougeur, chaleur, gonflement, douleur.",
      detail:["Ces quatre signes apparaissent quel que soit le microbe : la réaction est **non spécifique**.","La pâleur n'en fait pas partie : au contraire, l'afflux de sang rougit la zone."]},
    {id:'F2', level:2, type:'order', prompt:"Remets dans l'ordre les étapes de la réaction inflammatoire.",
      items:["Le clou blesse la peau, des bactéries pénètrent","Les cellules sentinelles reconnaissent les bactéries comme non-soi","Elles libèrent des médiateurs chimiques (cytokines, histamine)","Vasodilatation des vaisseaux sanguins locaux","Diapédèse : sortie de plasma et de leucocytes","Phagocytose des microbes"], shuffle:[3,5,0,2,4,1],
      simple:"Effraction → détection → médiateurs → vasodilatation → diapédèse → phagocytose.",
      detail:["Effraction de la barrière.","Détection par les sentinelles (mastocytes, macrophages, cellules dendritiques).","Alerte chimique.","Vasodilatation (rougeur, chaleur).","Diapédèse (gonflement, douleur).","Phagocytose par les phagocytes venus en renfort."]},
    {id:'F3', level:2, type:'match', prompt:"Associe chaque observation à sa cause.",
      options:["Plus de sang arrive (vasodilatation)","Sortie de plasma et de leucocytes (œdème)","L'œdème comprime les nerfs","Mélange de globules blancs morts, cellules mortes et microbes"],
      rows:[{t:"Rougeur",a:0},{t:"Chaleur",a:0},{t:"Gonflement",a:1},{t:"Douleur",a:2},{t:"Pus",a:3}],
      simple:"Rougeur et chaleur → vasodilatation · gonflement → œdème · douleur → nerfs comprimés · pus → GB morts, cellules mortes, microbes.",
      detail:["Deux signes ont la même cause : rougeur et chaleur viennent de la vasodilatation.","Le gonflement entraîne la douleur : les causes s'enchaînent.","Le pus est la trace du combat : leucocytes morts ou affaiblis, cellules de l'épiderme mortes, microbes."]},
    {id:'F4', level:2, type:'qcm', prompt:"Une écharde, une piqûre d'épine infectée et une coupure souillée provoquent-elles la même réaction inflammatoire ?",
      options:["Oui : la réaction est stéréotypée, non spécifique","Non : chaque microbe déclenche des signes différents","Non : seule la coupure provoque une inflammation","Oui, mais seulement après dix jours"], answer:0,
      simple:"Oui, elle est stéréotypée et non spécifique.",
      detail:["Quel que soit le microbe, la réaction est **identique** : rougeur, chaleur, gonflement, douleur.","C'est une réponse **innée** : immédiate, sans apprentissage, constante dans le temps."]},
    {id:'F5', level:3, type:'open', prompt:"Reprends la mise en situation : ton petit frère a une plaie gonflée, rouge et purulente, et refuse l'anti-inflammatoire « puisqu'il n'est pas malade ». **Explique-lui ce qui se passe et à quoi sert le médicament.**",
      hint:"Est-ce une maladie ou une défense ? Sur quoi agit un anti-inflammatoire ?",
      model:"Ta plaie a laissé entrer des bactéries. Ton corps se défend : c'est la réaction inflammatoire. Les cellules sentinelles ont libéré des médiateurs chimiques qui dilatent les vaisseaux (rougeur, chaleur) et laissent sortir du plasma et des globules blancs (gonflement, douleur). Les globules blancs détruisent les bactéries par phagocytose ; le pus, ce sont des globules blancs morts, des cellules mortes et des microbes. Cette défense est utile, mais elle devient gênante. L'anti-inflammatoire empêche la fabrication de certains médiateurs chimiques : il diminue la vasodilatation, donc la douleur, la chaleur et le gonflement. Le nettoyage de la plaie, lui, élimine les microbes.",
      criteria:["J'explique que c'est une **réaction de défense** contre des microbes entrés par la plaie","Je relie au moins **deux signes** à leur cause","J'explique ce qu'est le **pus**","Je dis que l'anti-inflammatoire bloque la synthèse de **médiateurs chimiques** et limite les symptômes"],
      detail:["Pas une maladie au sens habituel, mais une défense innée.","Signes = conséquences des médiateurs.","Pus = trace de la phagocytose.","Anti-inflammatoire = moins de médiateurs, moins de symptômes."]}
  ]},
{ id:'G', short:'Phagocytose', title:'La phagocytose', lesson:'phagocytose',
  goal:"Décrire et légender les étapes de la phagocytose, puis raisonner sur un cas nouveau.",
  worked:{ title:"Le sort d'une bactérie", consigne:"Décris ce qui arrive à une bactérie captée par un macrophage.",
    steps:[
      {t:"**Adhésion** : la bactérie se colle à la membrane du macrophage, qui la reconnaît grâce à ses **récepteurs**."},
      {t:"**Ingestion** : le macrophage se déforme ; ses **pseudopodes** entourent la bactérie et l'enferment dans un **phagosome**.", why:"Retiens les deux noms de vésicule : phagosome, puis phagolysosome."},
      {t:"**Digestion** : un **lysosome** fusionne avec le phagosome → **phagolysosome**. Ses enzymes digèrent la bactérie."},
      {t:"**Rejet** : les déchets sont expulsés par **exocytose**."}
    ],
    answer:"La bactérie adhère d'abord à la membrane du macrophage, qui la reconnaît grâce à ses récepteurs. Le macrophage l'englobe avec ses pseudopodes dans un phagosome (ingestion). Un lysosome fusionne avec le phagosome pour former un phagolysosome, dont les enzymes digèrent la bactérie (digestion). Les déchets sont enfin rejetés par exocytose." },
  ex:[
    {id:'G1', level:1, type:'order', prompt:"Remets dans l'ordre les étapes de la phagocytose.",
      items:["Adhésion","Ingestion","Digestion","Rejet des déchets"], shuffle:[2,0,3,1],
      simple:"Adhésion → ingestion → digestion → rejet.",
      detail:["Le phagocyte doit d'abord **s'accrocher** au microbe.","Puis il l'**avale** (phagosome).","Puis il le **digère** (phagolysosome).","Enfin il **rejette** les restes (exocytose)."]},
    {id:'G2', level:1, type:'match', prompt:"Associe chaque mot à sa définition.",
      options:["Prolongements du cytoplasme qui entourent le microbe","Vésicule qui contient le microbe ingéré","Petite vésicule riche en enzymes digestives","Vésicule où le microbe est digéré","Rejet des déchets hors de la cellule"],
      rows:[{t:"Pseudopodes",a:0},{t:"Phagosome",a:1},{t:"Lysosome",a:2},{t:"Phagolysosome",a:3},{t:"Exocytose",a:4}],
      simple:"Pseudopodes → prolongements · phagosome → vésicule avec le microbe · lysosome → enzymes · phagolysosome → digestion · exocytose → rejet.",
      detail:["*Phago-* = manger ; *lyso-* = dissoudre ; *-some* = corps.","Phagosome + lysosome = **phagolysosome**."]},
    {id:'G3', level:2, type:'match', prompt:"Légende le schéma bilan : quelle étape montre chaque dessin ?", fig:{phago:true},
      options:["Phagocyte au repos","Adhésion","Ingestion","Digestion","Rejet des déchets"],
      rows:[{t:"Dessin 1",a:0},{t:"Dessin 2",a:1},{t:"Dessin 3",a:2},{t:"Dessin 4",a:3},{t:"Dessin 5",a:4}],
      hint:"Cherche où se trouve la bactérie verte : dehors, contre la membrane, enfermée, en morceaux, ou rejetée.",
      simple:"1 repos · 2 adhésion · 3 ingestion · 4 digestion · 5 rejet.",
      detail:["1 : la bactérie est encore **dehors**.","2 : elle **touche** la membrane.","3 : les **pseudopodes** l'entourent (phagosome).","4 : elle est **en morceaux** dans le phagolysosome, avec les enzymes orange des lysosomes.","5 : des débris **sortent** de la cellule."]},
    {id:'G4', level:2, type:'multi', prompt:"Quelles cellules réalisent la phagocytose, d'après ton cours ?",
      options:["Macrophages","Granulocytes","Cellules dendritiques","Globules rouges","Plaquettes"], answers:[0,1,2],
      simple:"Macrophages, granulocytes, cellules dendritiques.",
      detail:["Ce sont les **cellules phagocytaires** attirées en renfort par les médiateurs chimiques.","Globules rouges et plaquettes ne sont pas des leucocytes : ils ne phagocytent pas."]},
    {id:'G5', level:3, type:'qcm', prompt:"Certaines bactéries sont entourées d'une **capsule** glissante qui empêche le phagocyte de s'y accrocher. Quelle étape est bloquée, et quelle en est la conséquence ?",
      options:["L'adhésion : la bactérie n'est pas ingérée et peut continuer à se multiplier","La digestion : la bactérie est ingérée mais pas détruite","Le rejet : les déchets restent dans la cellule","Aucune : la capsule n'a pas d'effet"], answer:0,
      hint:"S'accrocher, c'est quelle étape ?",
      simple:"L'adhésion est bloquée.",
      detail:["Sans **adhésion**, les étapes suivantes ne peuvent pas avoir lieu : chaque étape dépend de la précédente.","La bactérie échappe à la phagocytose et l'infection peut progresser.","C'est un exemple de microbe qui résiste à la réponse innée : la réponse adaptative devra prendre le relais."]}
  ]},
{ id:'H', short:'Fièvre, médicaments', title:'Fièvre et médicaments', lesson:'fievre',
  goal:"Expliquer la fièvre et choisir le bon type de médicament selon le symptôme.",
  worked:{ title:"D'où vient la fièvre ?", consigne:"Pendant une grippe, Yanis a 39 °C. **Explique l'origine de cette fièvre et si elle est utile.**",
    steps:[
      {t:"Des cellules **endommagées** par l'infection libèrent des médiateurs particuliers : les **pyrogènes endogènes**."},
      {t:"Ils alertent l'**hypothalamus**, la zone du cerveau qui règle la température."},
      {t:"La **température générale** du corps monte : c'est la **fièvre**."},
      {t:"À 39 °C, elle est **utile** : elle accélère le cœur et la circulation, facilite la phagocytose, freine les microbes et accélère la réparation.", why:"On la surveille : vers 41 °C, ou si elle dure, elle devient dangereuse."}
    ],
    answer:"Les cellules endommagées par le virus libèrent des pyrogènes endogènes. Ces médiateurs alertent l'hypothalamus, qui fait monter la température du corps. À 39 °C, la fièvre est utile : elle augmente la circulation, facilite la phagocytose, freine la croissance des microbes et accélère la réparation. Elle deviendrait dangereuse vers 41 °C, car des enzymes se dénaturent." },
  ex:[
    {id:'H1', level:1, type:'multi', prompt:"En quoi la fièvre est-elle bénéfique ? Coche les bonnes réponses.",
      options:["Elle augmente la fréquence cardiaque et la circulation du sang","Elle facilite la phagocytose et la production d'anticorps","Elle freine la croissance des microbes","Elle accélère la réparation des lésions","Elle détruit directement toutes les bactéries","Elle rend la peau plus épaisse"], answers:[0,1,2,3],
      simple:"Les quatre premières.",
      detail:["Ce sont les **quatre** bienfaits cités dans ton cours.","La fièvre **freine** les microbes, elle ne les détruit pas tous."]},
    {id:'H2', level:1, type:'classify', prompt:"Range chaque médicament.", cats:['Antalgique seul','Antalgique + anti-inflammatoire','Antalgique opiacé'],
      items:[{t:"Paracétamol (Dafalgan)",c:0},{t:"Aspirine",c:1},{t:"Ibuprofène (Nurofen)",c:1},{t:"Codéine",c:2},{t:"Tramadol",c:2},{t:"Morphine",c:2},{t:"Fentanyl",c:2}],
      simple:"Paracétamol seul · aspirine et ibuprofène les deux · codéine, tramadol, morphine, fentanyl opiacés.",
      detail:["**Paracétamol** : antalgique non opiacé, pas anti-inflammatoire.","**Aspirine, ibuprofène** : antalgiques non opiacés **et** anti-inflammatoires.","**Opiacés faibles** : codéine, tramadol. **Opiacés forts** : morphine, fentanyl."]},
    {id:'H3', level:2, type:'qcm', prompt:"Pourquoi une fièvre de 41 °C est-elle dangereuse ?",
      options:["Certaines enzymes indispensables se dénaturent et ne fonctionnent plus","Les microbes se multiplient plus vite","L'hypothalamus est détruit par les microbes","Le sang devient trop acide"], answer:0,
      simple:"Les enzymes se dénaturent.",
      detail:["Les enzymes sont des protéines dont la **forme** permet le fonctionnement.","Trop de chaleur les **déforme** (dénaturation) : elles ne fonctionnent plus.","Le fonctionnement du corps est alors menacé."]},
    {id:'H4', level:2, type:'qcm', prompt:"Après une entorse, ta cheville est **gonflée et douloureuse**. Quel médicament agit sur la douleur **et** sur le gonflement ?",
      options:["L'ibuprofène","Le paracétamol","La morphine","Aucun médicament"], answer:0,
      simple:"L'ibuprofène (antalgique et anti-inflammatoire).",
      detail:["Le gonflement vient de l'inflammation : il faut un **anti-inflammatoire**.","L'**ibuprofène** est antalgique **et** anti-inflammatoire.","Le paracétamol calme la douleur, mais pas l'inflammation.","La morphine est réservée aux douleurs intenses : risque de dépendance.","Un médicament se prend toujours selon l'avis d'un médecin ou d'un pharmacien."]},

function Quiz({go}){
  const {mark, prog} = useContext(Prog);
  const [i, setI] = useState(0);
  const [sel, setSel] = useState(null);
  const [val, setVal] = useState(false);
  const [res, setRes] = useState([]);
  const end = i>=QUIZ.length;
  const restart = () => { setI(0); setSel(null); setVal(false); setRes([]); };
  if (end){
    const score = res.filter(Boolean).length;
    const wrong = QUIZ.map((q,k)=>({q,k})).filter(x=>!res[x.k]);
    return html`<div className="wrap"><div className="frame">
      <span className="eyebrow">Quiz final</span>
      <h1 className="num">${score} / ${QUIZ.length}</h1>
      <p className="goal">${score===QUIZ.length ? 'Tout est juste. Refais ce quiz dans quelques jours pour ancrer durablement.' : score>=9 ? 'Bon résultat. Revois les points ci-dessous, puis refais le quiz plus tard.' : 'Revois les parties indiquées, refais les exercices de la famille, puis retente le quiz.'}</p>
      ${wrong.length ? html`<div className="items">${wrong.map(({q,k})=>{ const L = LESSONS.find(l=>l.id===q.m); return html`<div key=${k} className="item"><div className="t" style=${{flexDirection:'column',gap:'2px'}}><b>${q.q}</b><span className="small">${q.o[q.a]}. ${q.e}</span></div><button className="btn flat" onClick=${()=>go(q.m)}>Revoir : ${L.label}</button></div>`; })}</div>` : null}
      <div className="row"><button className="btn primary" onClick=${restart}>Recommencer</button><button className="btn" onClick=${()=>go('memo')}>Fiche mémo</button></div>
    </div></div>`;
  }
  const q = QUIZ[i];
  const validate = () => { const ok = sel===q.a; const r = [...res]; r[i] = ok; setRes(r); setVal(true);
    if (i===QUIZ.length-1){ const sc = r.filter(Boolean).length; if (!prog['quiz-best'] || sc > prog['quiz-best']) mark('quiz-best', sc); } };
  return html`<div className="wrap"><div className="frame">
    <span className="eyebrow">Quiz final · questions mélangées de tout le chapitre</span>
    <div className="qprog" aria-hidden="true">${QUIZ.map((_,k)=>html`<i key=${k} className=${k<i ? (res[k]?'ok':'ko') : k===i ? 'cur' : ''}></i>`)}</div>
    <h2>Question ${i+1} sur ${QUIZ.length}</h2>
    <p className="prompt">${q.q}</p>
    <div className="opts" role="radiogroup">${q.o.map((o,k)=>{
      let cls = 'opt'; if (val && k===q.a) cls+=' good'; else if (val && k===sel) cls+=' bad';
      return html`<button key=${k} className=${cls} role="radio" aria-checked=${sel===k?'true':'false'} disabled=${val} onClick=${()=>setSel(k)}><span className="mk"></span><span>${o}</span></button>`;
    })}</div>
    ${val ? html`<${Msg} kind=${sel===q.a?'pos':'neg'} title=${sel===q.a?'Juste':'La bonne réponse : '+q.o[q.a]}><p>${q.e}</p><//>` : null}
    <div className="row">${!val ? html`<button className="btn primary" disabled=${sel===null} onClick=${validate}>Valider</button>` : html`<button className="btn primary" onClick=${()=>{ setI(i+1); setSel(null); setVal(false); }}>${i===QUIZ.length-1 ? 'Voir mon score' : 'Question suivante'}</button>`}</div>
    ${prog['quiz-best']!==undefined ? html`<p className="small muted num">Meilleur score : ${prog['quiz-best']} / ${QUIZ.length}</p>` : null}
  </div></div>`;
}

/* mélange déterministe des options (la bonne réponse n'est pas toujours la première) */
function hashStr(s){ let h = 7; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) % 233280; return h; }
function perm(n, seed){ const r = rnd(seed+1); const a = [...Array(n).keys()]; for (let i=n-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function shuffleEx(ex){
  if (ex.type==='qcm'){ const p = perm(ex.options.length, hashStr(ex.id)); ex.options = p.map(i=>ex.options[i]); ex.answer = p.indexOf(ex.answer); }
  else if (ex.type==='multi'){ const p = perm(ex.options.length, hashStr(ex.id)); ex.options = p.map(i=>ex.options[i]); ex.answers = ex.answers.map(a=>p.indexOf(a)); }
}
FAMILIES.forEach(f=>f.ex.forEach(shuffleEx));
Object.values(QUICK).flat().forEach(shuffleEx);
QUIZ.forEach((q,k)=>{ const p = perm(q.o.length, k*97+13); q.o = p.map(i=>q.o[i]); q.a = p.indexOf(q.a); });

      </div>

      ${!confirm ? html`<div><button className="btn flat" onClick=${()=>setConfirm(true)}>Effacer ma progression</button></div>` : html`<div className="row"><span className="small">Tout effacer ?</span><button className="btn" onClick=${()=>{ reset(); setConfirm(false); }}>Oui, effacer</button><button className="btn flat" onClick=${()=>setConfirm(false)}>Annuler</button></div>`}
      <details><summary>Principes pédagogiques utilisés</summary>
        <div className="prose small">
          <p>${rich("**Charge cognitive** : huit parties courtes ; les processus (inflammation, phagocytose) se dévoilent étape par étape ; une seule idée nouvelle par étape.")}</p>
          <p>${rich("**Apprentissage multimédia** : légendes placées dans les schémas, texte à côté de l'image, codes couleur constants (bleu = soi, orange = non-soi et microbes, sarcelle = inné, violet = adaptatif).")}</p>
          <p>${rich("**Exemple résolu puis estompage** : chaque famille commence par un raisonnement modélisé, puis des exercices de plus en plus autonomes (reconnaître, appliquer, transférer).")}</p>
          <p>${rich("**Récupération en mémoire** : questions de vérification, quiz mélangé, fiche mémo à trous.")}</p>
        </div>
      </details>
    </div>
  </div>`;
}

/* =========================================================
   APPLICATION
   ========================================================= */
const NAV = [
  {g:'Démarrer', items:[{id:'accueil', label:'Accueil'}]},
  {g:'Chapitre 3 · Soi et non-soi', items:LESSONS.filter(l=>l.ch===3).map(l=>({id:l.id, label:l.label, n:l.n}))},
  {g:'Chapitre 4 · Réponse innée', items:LESSONS.filter(l=>l.ch===4).map(l=>({id:l.id, label:l.label, n:l.n}))},
  {g:"S'entraîner", items:[{id:'exercices', label:'Exercices par famille'},{id:'quiz', label:'Quiz final'}]},
  {g:'Mémoriser', items:[{id:'memo', label:'Fiche mémo'}]}
];
const IDS = NAV.flatMap(g=>g.items.map(i=>i.id));
const VIEWS = {greffes:LessonGreffes, marqueurs:LessonMarqueurs, reponses:LessonReponses, entrees:LessonEntrees, barrieres:LessonBarrieres, inflammation:LessonInflammation, phagocytose:LessonPhagocytose, fievre:LessonFievre};

function App(){
  const [view, setView] = useState(()=>{ const h = (location.hash||'').slice(1); return IDS.includes(h) ? h : 'accueil'; });
  const [fam, setFam] = useState('A');
  const [prog, setProg] = useState(load);
  const [big, setBig] = useState(()=>{ try { return localStorage.getItem(KEY+'-big')==='1'; } catch(e){ return false; } });
  useEffect(()=>{ document.documentElement.classList.toggle('big', big); try { localStorage.setItem(KEY+'-big', big?'1':'0'); } catch(e){} }, [big]);
  const go = (v, f) => { if (f) setFam(f); setView(v); try { history.replaceState(null,'','#'+v); } catch(e){} window.scrollTo(0,0); };
  const mark = (id, st) => setProg(p => { if (p[id]==='ok' && st!=='ok') return p; if (p[id]===st) return p; const n = {...p, [id]:st}; save(n); return n; });
  const reset = () => { setProg({}); save({}); };

  const exAll = FAMILIES.flatMap(f=>f.ex);
  const total = exAll.length + Object.values(QUICK).flat().length;
  const done = exAll.filter(e=>prog[e.id]==='ok'||prog[e.id]==='seen').length + Object.values(QUICK).flat().filter(q=>prog[q.id]==='ok').length;
  const pct = Math.round(done/total*100);
  const lessonDone = id => (QUICK[id]||[]).every(q=>prog[q.id]==='ok');
  const exCount = exAll.filter(e=>prog[e.id]==='ok'||prog[e.id]==='seen').length;

  let page;
  if (VIEWS[view]) page = html`<${VIEWS[view]} go=${go}/>`;
  else if (view==='exercices') page = html`<${Exercises} fam=${fam} setFam=${setFam} go=${go}/>`;
  else if (view==='quiz') page = html`<${Quiz} go=${go}/>`;
  else if (view==='memo') page = html`<${Memo}/>`;
  else page = html`<${Home} go=${go} reset=${reset}/>`;

  return html`<${Prog.Provider} value=${{prog, mark}}>
    <header className="top">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="5" fill="var(--accent-bg)" stroke="var(--accent)"/><circle cx="12" cy="15" r="8" fill="var(--cyto)" stroke="var(--nuc)"/><circle cx="10" cy="16" r="3.5" fill="var(--nuc)"/><rect x="16" y="5" width="9" height="5" rx="2.5" fill="var(--bact)"/><path d="M18,5 l1.5,-2.5 l1.5,2.5" fill="var(--nonsoi)"/></svg>
      <div className="ttl"><b>Soi, non-soi et immunité innée</b><span>Biologie · 5e secondaire · UAA5 · chapitres 3 et 4</span></div>
      <div className="meter" title="Progression"><span className="bar"><i style=${{width:pct+'%'}}></i></span><span className="num">${pct} %</span></div>
      <button className="btn flat" aria-pressed=${big?'true':'false'} onClick=${()=>setBig(!big)} title="Agrandir le texte">${big ? 'A−' : 'A+'}</button>
    </header>
    <div className="shell">
      <nav className="side" aria-label="Sommaire">
        ${NAV.map(g=>html`<${React.Fragment} key=${g.g}><div className="grp">${g.g}</div>
          ${g.items.map(it=>html`<button key=${it.id} className="navi" aria-current=${view===it.id?'page':null} onClick=${()=>go(it.id)}>
            ${it.n ? html`<span className=${'n'+(lessonDone(it.id)?' done':'')}>${lessonDone(it.id)?'✓':it.n}</span>` : null}
            <span className="lab">${it.label}</span>
            ${it.id==='exercices' ? html`<span className="cnt num">${exCount}/${exAll.length}</span>` : null}
            ${it.id==='quiz' && prog['quiz-best']!==undefined ? html`<span className="cnt num">${prog['quiz-best']}/${QUIZ.length}</span>` : null}
          </button>`)}
        <//>`)}
      </nav>
      <main>${page}</main>
    </div>
  <//>`;
}

/* classes SVG des cellules */
const st = document.createElement('style');
st.textContent = `.s-cyto{fill:var(--cyto);stroke:var(--nuc);stroke-width:.2;stroke-opacity:.55}.s-nuc{fill:var(--nuc)}.s-link{fill:none;stroke:var(--nuc);stroke-width:.8}.s-gr{fill:var(--gr)}.s-grc{fill:var(--view);opacity:.45}.s-gran{fill:var(--gran)}.s-dgran{fill:var(--nuc);opacity:.9}.s-fine{fill:var(--nuc);opacity:.4}.s-plq{fill:var(--sec);opacity:.8}`;
document.head.appendChild(st);

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body></html>
